# Builds the app and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also rebuild when new voice recordings have been saved.
  workflow_run:
    workflows: ['Record lesson voice']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add the voice recordings, if there are any
        run: |
          if git ls-remote --exit-code --heads origin audio >/dev/null 2>&1; then
            git fetch --depth=1 origin audio
            git worktree add ../audio FETCH_HEAD
            rm -rf ../audio/.git
            cp -r ../audio dist/audio
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
