# Builds the Windows and Mac desktop apps on every push to main and puts the
# installers on the "Desktop app" release, replacing the previous ones.
name: Build desktop apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the desktop app
        shell: bash
        run: |
          rm -rf desktop/web
          cp -r dist desktop/web
          cd desktop
          npm install --no-audit --no-fund
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Replace the installers on the Desktop app release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "Desktop app" --notes "Download CS-Degree-Lab-Setup.exe for Windows or CS-Degree-Lab-Mac.dmg for Mac. These files are rebuilt automatically whenever the course is updated."
          gh release upload desktop installers/* --clobber
