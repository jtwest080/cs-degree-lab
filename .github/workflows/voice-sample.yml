# Records a short passage in several voices and attaches the MP3s to the
# "Voice samples" release, so a voice can be picked by ear.
name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install kokoro-onnx soundfile
      - name: Download the Kokoro voice model
        run: |
          curl -fsSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python scripts/voice_sample.py
      - name: Attach the samples to the Voice samples release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view voice-samples >/dev/null 2>&1 || gh release create voice-samples --title "Voice samples" --notes "Short recordings of lesson 1.1 in different voices. Tap one to listen."
          gh release upload voice-samples samples/*.mp3 --clobber
