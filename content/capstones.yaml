# Open-ended capstone projects with grading rubrics (Version 2).
# Each project is built on your own computer (or in the in-browser playgrounds)
# and graded by YOU against the rubric: every criterion has four descriptions,
# from "not yet" to "excellent". `after` is the unit to finish first.
intro: >-
  Real work is open-ended: nobody gives you the function names or the tests.
  These projects only give you a goal and a rubric. Build something, then
  grade it honestly against the rubric, write down what you would improve,
  and try again. A score of 75% or more counts as passing.
projects:
  - id: cap-adventure
    title: Text Adventure Engine
    after: 5
    hours: 8-15
    summary: A small game world that runs from a data file, with rooms, items, a parser for commands and a save game.
    brief: |
      Build a **text adventure** in Python. The world (rooms, exits, items and who is where) must be described in a **data file** (JSON or YAML-style dictionaries), so that someone could write a new game without changing your code.

      You decide the story. The engine must understand commands such as `go north`, `take lamp`, `use key`, `look` and `inventory`, tell the player when a command makes no sense, and be able to **save** and **load** a game.

      Start small: two rooms and one item. Make that work completely before you add more.
    deliverables:
      - The engine code (use classes from Unit 5 where they help).
      - A world data file with at least 8 rooms, 5 items and 1 puzzle.
      - A README that shows how to start the game and lists the commands.
    rubric:
      - criterion: Design
        weight: 2
        levels: ["Everything is in one long function.", "Some functions, but world details are mixed into the code.", "Clear separation: data file, world model, command parser.", "Also easy to extend: a new command or item type needs only a few lines."]
      - criterion: Correctness
        weight: 3
        levels: ["Crashes on ordinary commands.", "Works if the player types perfectly.", "Handles unknown commands, locked doors and missing items politely.", "Also survives odd input (empty lines, extra spaces, capital letters) and cannot be put into an impossible state."]
      - criterion: Save and load
        weight: 2
        levels: ["Not implemented.", "Saves some state but loading fails.", "A saved game restores location, items and puzzle state.", "Also versioned or validated so a damaged save file gives a clear error."]
      - criterion: Testing
        weight: 2
        levels: ["No tests.", "Tried by hand only.", "Automated tests for the parser and for moving and taking items.", "Also a scripted playthrough that finishes the game and is run as a test."]
      - criterion: Communication
        weight: 1
        levels: ["No explanation.", "A short README.", "README with commands, how to add rooms and a map of the world.", "Also comments that explain the reasons for decisions."]
    stretch: Add timed events, a combat system, or a graph search that checks every room can be reached.
  - id: cap-data-detective
    title: Data Detective
    after: 21
    hours: 8-12
    summary: Choose a real dataset, ask questions of it, and report what the numbers do and do not show.
    brief: |
      Pick a dataset you care about (sport results, weather, your own spending, a public CSV file) with at least 200 rows. Write Python (standard library only, as in the course) that **loads**, **cleans** and **summarises** it.

      Pose **three questions** before you look, answer each with a calculation (mean, median, spread, a correlation, a confidence interval or a comparison between groups) and say how sure you are. A short report must explain **what the data cannot tell you**.

      Remember Unit 21: a pattern in a sample is not a fact about the world until you have asked how likely it is to be an accident.
    deliverables:
      - Code that reproduces every number in the report.
      - A written report of one or two pages.
      - The cleaned data or the instructions for getting it.
    rubric:
      - criterion: Questions
        weight: 2
        levels: ["No clear questions.", "Vague questions such as 'what is interesting?'.", "Three specific questions that data can answer.", "Also states in advance what result would change your mind."]
      - criterion: Data cleaning
        weight: 2
        levels: ["Raw data used as is.", "Some missing values dropped without comment.", "Missing, wrong and duplicate values found, with each decision explained.", "Also checks how much the answers change with other choices."]
      - criterion: Statistics
        weight: 3
        levels: ["Numbers without meaning.", "Averages only.", "Suitable measures with spread and a note on sample size.", "Also an interval or test, with the assumptions checked."]
      - criterion: Honesty about limits
        weight: 2
        levels: ["Claims cause from correlation.", "Mentions limits briefly.", "Says what cannot be concluded and why (bias, small samples, confounders).", "Also suggests a study that could settle the question."]
      - criterion: Reproducibility
        weight: 1
        levels: ["Cannot be rerun.", "Runs only on your machine.", "One command reproduces everything.", "Also fixed random seeds and a recorded data source."]
    stretch: Compare two groups with a permutation test that you wrote yourself.
  - id: cap-database-app
    title: Database-Backed Tracker
    after: 12
    hours: 10-15
    summary: Design a relational database and a small program on top of it that tracks something real.
    brief: |
      Choose something to track: a book collection, a gym log, a club's members. Design a **normalised schema** with at least four tables and sensible keys, write the SQL that creates it, and add a program (Python with the built-in `sqlite3` module) with a text menu to add, search, change and delete records and to print three useful **reports** made with joins and `GROUP BY`.

      Explain your design in a short **design note** with an ER diagram (a drawing is fine) and a sentence for each table on why it exists.
    deliverables:
      - A `schema.sql` file with constraints (primary keys, foreign keys, NOT NULL, CHECK).
      - The program and some sample data.
      - A design note with the diagram.
    rubric:
      - criterion: Schema design
        weight: 3
        levels: ["One big table.", "Several tables but with repeated data.", "Normalised to third normal form with keys that make sense.", "Also justified indexes and a note on trade-offs you chose."]
      - criterion: Integrity
        weight: 2
        levels: ["Any data can be inserted.", "Primary keys only.", "Foreign keys, NOT NULL and CHECK constraints reject bad data.", "Also tested: attempts to break the rules are shown to fail."]
      - criterion: Queries
        weight: 2
        levels: ["Only simple SELECT.", "Joins that sometimes duplicate rows.", "Three correct reports using joins, grouping and ordering.", "Also parameterised so that user input cannot cause SQL injection."]
      - criterion: Program quality
        weight: 2
        levels: ["Crashes on bad input.", "Works on the happy path.", "Input is checked and errors are explained.", "Also uses transactions so that a failed multi-step change leaves no half-done work."]
      - criterion: Design note
        weight: 1
        levels: ["Missing.", "Lists table names.", "Explains why each table exists.", "Also explains alternatives you rejected."]
    stretch: Add a migration script that upgrades an old database file to a new schema.
  - id: cap-web-app
    title: Accessible Web App
    after: 27
    hours: 10-18
    summary: A single-page web app in HTML, CSS and JavaScript that people with different needs can actually use.
    brief: |
      Build a small web application (a habit tracker, flash cards, a budget calculator) in plain HTML, CSS and JavaScript that saves its data in the browser's `localStorage`.

      It has to work with **only a keyboard**, have readable colour **contrast** (at least 4.5 to 1 for text), use **real HTML elements** (buttons, labels, headings, lists) instead of clickable divs, and adapt from phone to desktop widths.

      Test it with at least **two people** and write down what they stumbled over.
    deliverables:
      - The app (HTML, CSS, JS files you can open in a browser).
      - A test report with the observations of two people and the changes you made.
      - An accessibility checklist showing what you checked.
    rubric:
      - criterion: Function
        weight: 2
        levels: ["Does not work.", "Core feature works but data is lost on reload.", "Core feature works and data is saved.", "Also handles errors such as full storage or damaged data."]
      - criterion: Keyboard and semantics
        weight: 3
        levels: ["Needs a mouse.", "Some controls reachable by Tab.", "Everything reachable, visible focus, correct labels and headings.", "Also announces changes to screen readers (for example with aria-live)."]
      - criterion: Visual design and contrast
        weight: 2
        levels: ["Hard to read.", "Readable on one screen size.", "Consistent type, spacing and contrast of at least 4.5:1.", "Also adapts to dark mode and respects reduced-motion settings."]
      - criterion: Responsive layout
        weight: 2
        levels: ["Breaks on a phone.", "Scrolls sideways on small screens.", "Layout adapts at sensible breakpoints.", "Also tested at zoom levels up to 200%."]
      - criterion: Evidence from users
        weight: 1
        levels: ["No testing.", "One informal comment.", "Two people tested and you list what happened.", "Also shows a change you made as a result."]
    stretch: Add undo and redo using the history pattern from Unit 27.
  - id: cap-interpreter
    title: Your Own Language
    after: 23
    hours: 15-25
    summary: Design a tiny programming language and write its interpreter or compiler.
    brief: |
      Invent a small language with variables, arithmetic, conditions, loops and functions. Write a **tokenizer**, a **parser** that builds a tree and an **evaluator** (or a compiler to the stack machine from Unit 23).

      Write a **language reference** of one page and at least five example programs, including one that computes something interesting (primes, Fibonacci, sorting). Give error messages that name the **line number** and say what is wrong.
    deliverables:
      - The implementation.
      - A one-page language reference and five example programs.
      - A test suite with at least 25 test cases (some expected to fail with a given message).
    rubric:
      - criterion: Language design
        weight: 2
        levels: ["Unclear rules.", "Works but has surprising behaviour.", "Consistent and documented, with a grammar.", "Also has features that fit together (such as closures or lists) and a rationale."]
      - criterion: Implementation
        weight: 3
        levels: ["Handles only single expressions.", "Variables and arithmetic.", "Conditions, loops and functions with recursion.", "Also optimisation (such as constant folding) or a second back end."]
      - criterion: Error handling
        weight: 2
        levels: ["Python tracebacks leak out.", "Generic 'syntax error'.", "Messages with line numbers and the expected thing.", "Also recovers to report several errors at once."]
      - criterion: Tests
        weight: 2
        levels: ["Few examples.", "Examples checked by hand.", "25+ automated tests including error cases.", "Also a grammar-based or randomised test."]
      - criterion: Documentation
        weight: 1
        levels: ["None.", "A list of keywords.", "Reference with examples.", "Also a tutorial that teaches the language in ten minutes."]
    stretch: Add a REPL with history, or a debugger that steps through a program.
  - id: cap-network-service
    title: Replicated Key-Value Service
    after: 24
    hours: 15-25
    summary: Build a tiny distributed store, break it on purpose, and explain what happened.
    brief: |
      Using the ideas of Units 11 and 24 build a **key-value service** of three or more nodes (simulated in one Python program is fine). Data must be **replicated**, and reads and writes should use **quorums**.

      Then act as the chaos monkey: kill a node, delay messages, and make two nodes disagree. Write down for each failure what your system does, what it *should* do, and which trade-off of the CAP theorem you made.
    deliverables:
      - The simulation code.
      - A failure log: at least five experiments with predictions and results.
      - A one-page explanation of your consistency choices.
    rubric:
      - criterion: Replication and quorums
        weight: 3
        levels: ["One copy of the data.", "Copies exist but may be wrong.", "Writes and reads use quorums that guarantee seeing the latest write.", "Also repairs stale copies on read."]
      - criterion: Failure handling
        weight: 3
        levels: ["Any failure crashes everything.", "Handles a crash of one node.", "Handles crashes, delays and recovery.", "Also detects and handles a network partition."]
      - criterion: Experiments
        weight: 2
        levels: ["None.", "Experiments without predictions.", "Five experiments each with prediction, result and explanation.", "Also an experiment that surprised you and what you learned."]
      - criterion: Explanation
        weight: 2
        levels: ["Missing.", "Names CAP without applying it.", "Explains which guarantee you keep during a partition and why.", "Also compares with a real system such as Dynamo."]
    stretch: Add vector clocks so that concurrent writes are detected instead of silently lost.
  - id: cap-benchmark
    title: Algorithm Benchmark Report
    after: 22
    hours: 8-12
    summary: Compare several algorithms for one problem, in theory and in measurements.
    brief: |
      Pick one problem with several known solutions (sorting, string search, shortest paths, set membership). Implement **at least three** algorithms for it and measure their running time on inputs of growing size and on **different kinds of input** (random, sorted, adversarial).

      Plot or tabulate the results, compare them with the Big-O prediction and explain every difference between prediction and measurement, such as caches, constant factors and Python's overheads.
    deliverables:
      - The implementations and the measuring script.
      - A table or chart of results for at least five input sizes.
      - A report of one or two pages with your conclusions.
    rubric:
      - criterion: Correctness of the algorithms
        weight: 2
        levels: ["Wrong answers.", "Correct on easy input.", "All verified against a trusted result on many inputs.", "Also uses randomised tests that include edge cases."]
      - criterion: Measurement method
        weight: 3
        levels: ["One timing of one input.", "Several sizes, one run each.", "Repeated runs, the median reported, warm-up and fixed seeds.", "Also controls for noise and shows the spread."]
      - criterion: Analysis
        weight: 3
        levels: ["Lists numbers only.", "States which was fastest.", "Fits measurements to the predicted growth rate and discusses the crossover points.", "Also finds the case where the 'better' algorithm loses and explains why."]
      - criterion: Presentation
        weight: 1
        levels: ["Raw output.", "A table.", "Labelled table or chart with units.", "Also a clear recommendation for a reader who has to choose."]
    stretch: Show that a fast algorithm in theory can lose in practice for small inputs, and find the exact crossover size.
  - id: cap-final
    title: "Final Project: A System of Your Choice"
    after: 25
    hours: 30-60
    summary: The big one. Propose, design, build, test and present a project that combines several parts of the course.
    brief: |
      Choose a problem you actually care about and build a solution that uses **at least three** areas of the course (for example data structures, a database, networking, security, machine learning, graphics).

      Start with a **one-page proposal** (the problem, who it is for, what is in scope, what is not, the risks). Then a **design document** (components, data model, main algorithms and why you chose them). Build in **small steps** with a working version at the end of each. Finish with a **demonstration** (a short recorded or written walkthrough) and a **retrospective** about what went right, what went wrong and what you would do differently.
    deliverables:
      - Proposal, design document and retrospective.
      - Working software with automated tests and a README.
      - A demonstration for someone who has not seen it.
    rubric:
      - criterion: Scope and planning
        weight: 2
        levels: ["No plan.", "A list of ideas.", "Clear scope, milestones and risks.", "Also adjusts the plan as the project teaches you something and records why."]
      - criterion: Design
        weight: 3
        levels: ["Design is the code.", "A rough sketch.", "Components, data model and algorithms explained with trade-offs.", "Also considers security, failure and growth."]
      - criterion: Implementation
        weight: 3
        levels: ["Does not run.", "Core idea works.", "Complete and readable, following good practice from Unit 14.", "Also elegant: simple where possible and fast where needed."]
      - criterion: Testing and quality
        weight: 3
        levels: ["No tests.", "Manual testing only.", "Automated tests for the important behaviour, bugs fixed and recorded.", "Also test coverage measured, with edge cases and failure cases."]
      - criterion: Communication
        weight: 2
        levels: ["Others cannot use it.", "README only.", "Clear README and a demonstration a newcomer can follow.", "Also a retrospective with honest lessons."]
      - criterion: Ambition and learning
        weight: 1
        levels: ["Repeats a tutorial.", "A small variation on one.", "Solves a new problem with ideas from the course.", "Also uses something you had to teach yourself."]
    stretch: Ask someone to use it for a week and write a short case study from what they report.
