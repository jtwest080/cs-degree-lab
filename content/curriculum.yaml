# The course map. Each unit's lessons live in content/unit-NN/ as
# lesson-XX-name.yaml files; a unit with no lesson files shows as "coming soon".
title: CS Degree Lab
intro: >-
  A four-year computer science degree, rebuilt as an interactive course.
  Every lesson explains the *why* like a good professor would, then has you
  writing and running real code within minutes. Pass each lesson's quiz to
  unlock the next one, and come back for short reviews so it all sticks.
  You need nothing installed: Python and C run right here in your browser.

units:
  - number: 1
    title: How Computers Work
    language: python
    summary: >-
      Before writing programs, understand the machine that runs them. You'll
      see how everything a computer does comes down to bits, how simple logic
      gates combine into a calculator, and how a CPU and memory execute
      instructions. You'll also take your first small steps with Python code.
    topics: [Binary and bits, Representing data, Logic gates, The CPU, Memory, From code to instructions]

  - number: 2
    title: Programming Fundamentals (Python)
    language: python
    summary: >-
      Learn to program properly from the ground up in Python: values, variables,
      types, input and output, decisions, loops, functions, and the most
      important skill of all, debugging.
    topics: [Programs and print, Variables, Types, Input/output, Conditionals, Loops, Functions, Debugging]

  - number: 3
    title: Core Data Structures
    language: python
    summary: Organise data with Python's built-in collections, and read and write files.
    topics: [Lists, Strings in depth, Dictionaries, Sets, Tuples, Files]

  - number: 4
    title: Problem Solving & Algorithms I
    language: python
    summary: Learn a repeatable method for solving problems, and your first classic algorithms.
    topics: [Decomposition, Pseudocode, Linear and binary search, Sorting, Recursion]

  - number: 5
    title: Object-Oriented Programming
    language: python
    summary: Model the world with classes and objects, and learn the principles behind good design.
    topics: [Classes and objects, Methods, Inheritance, Polymorphism, Design principles]

  - number: 6
    title: Discrete Math for CS
    language: python
    summary: The mathematics computer scientists use every day, with code to make it concrete.
    topics: [Logic, Sets, Proofs, Induction, Combinatorics, Graphs]

  - number: 7
    title: Data Structures II
    language: python
    summary: Build the classic data structures yourself and learn when to use each one.
    topics: [Stacks, Queues, Linked lists, Hash tables, Trees, Heaps, Graphs]

  - number: 8
    title: Algorithms II
    language: python
    summary: Analyse algorithms rigorously and master the major algorithm design techniques.
    topics: [Big-O analysis, Divide and conquer, Greedy algorithms, Dynamic programming, Graph algorithms]

  - number: 9
    title: Computer Systems (C)
    language: c
    summary: Go below Python to see how programs really use memory, with the C language.
    topics: [C basics, Pointers, Memory management, Compilation, Assembly basics]

  - number: 10
    title: Operating Systems
    language: python
    summary: How an OS juggles programs, memory and files, and the hard problems of concurrency.
    topics: [Processes, Threads, Concurrency, Scheduling, Virtual memory, File systems]

  - number: 11
    title: Networking
    language: python
    summary: How data crosses the planet in milliseconds.
    topics: [TCP/IP, HTTP, DNS, Sockets, How the internet works]

  - number: 12
    title: Databases
    language: sql
    summary: Store, query and protect data with relational databases and SQL.
    topics: [Relational model, SQL, Normalization, Indexing, Transactions]

  - number: 13
    title: Web Development
    language: html
    summary: Build for the web, from HTML and CSS to JavaScript, frameworks and APIs.
    topics: [HTML, CSS, JavaScript, Front-end frameworks, Back-end APIs]

  - number: 14
    title: Software Engineering
    language: python
    summary: The practices that let teams build large, reliable software.
    topics: [Git, Testing, Debugging tools, Design patterns, Working in teams]

  - number: 15
    title: Theory of Computation
    language: python
    summary: What can computers do at all, and what can they do efficiently?
    topics: [Automata, Regular languages, Turing machines, Computability, P vs NP]

  - number: 16
    title: Security
    language: python
    summary: Think like an attacker so you can build like a defender.
    topics: [Common vulnerabilities, Cryptography basics, Secure coding]

  - number: 17
    title: AI & Machine Learning
    language: python
    summary: From search algorithms to neural networks, built from first principles.
    topics: [Search, Probability, Regression, Neural networks]

  - number: 18
    title: Capstone Projects
    language: python
    summary: Portfolio-quality projects that combine everything you've learned.
    topics: [Several multi-week projects]

  - number: 19
    title: Linear Algebra
    language: python
    summary: Vectors, matrices, and the mathematics behind graphics, data science, and search engines.
    topics: [Vectors, Matrices, Systems of equations, Determinants, Rank, Transformations, Least squares, Eigenvalues, PCA]
