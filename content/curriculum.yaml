# The course map. Each unit's lessons live in content/unit-NN/ as
# lesson-XX-name.yaml files; a unit with no lesson files shows as "coming soon".
title: CS Degree Lab
intro: >-
  A four-year computer science degree, rebuilt as an interactive course.
  Every lesson explains the *why* like a good professor would, then has you
  writing and running real code within minutes. Pass each lesson's quiz to
  unlock the next one, and come back for short reviews so it all sticks.
  You need nothing installed: Python and C run right here in your browser.

units:
  - number: 1
    title: How Computers Work
    language: python
    summary: >-
      Before writing programs, understand the machine that runs them. You'll
      see how everything a computer does comes down to bits, how simple logic
      gates combine into a calculator, and how a CPU and memory execute
      instructions. You'll also take your first small steps with Python code.
    topics: [Binary and bits, Representing data, Logic gates, The CPU, Memory, From code to instructions]

  - number: 2
    title: Programming Fundamentals (Python)
    language: python
    summary: >-
      Learn to program properly from the ground up in Python: values, variables,
      types, input and output, decisions, loops, functions, and the most
      important skill of all, debugging.
    topics: [Programs and print, Variables, Types, Input/output, Conditionals, Loops, Functions, Debugging]

  - number: 3
    title: Core Data Structures
    language: python
    summary: Organise data with Python's built-in collections, and read and write files.
    topics: [Lists, Strings in depth, Dictionaries, Sets, Tuples, Files]

  - number: 4
    title: Problem Solving & Algorithms I
    language: python
    summary: Learn a repeatable method for solving problems, and your first classic algorithms.
    topics: [Decomposition, Pseudocode, Linear and binary search, Sorting, Recursion]

  - number: 5
    title: Object-Oriented Programming
    language: python
    summary: Model the world with classes and objects, and learn the principles behind good design.
    topics: [Classes and objects, Methods, Inheritance, Polymorphism, Design principles]

  - number: 6
    title: Discrete Math for CS
    language: python
    summary: The mathematics computer scientists use every day, with code to make it concrete.
    topics: [Logic, Sets, Proofs, Induction, Combinatorics, Graphs]

  - number: 7
    title: Data Structures II
    language: python
    summary: Build the classic data structures yourself and learn when to use each one.
    topics: [Stacks, Queues, Linked lists, Hash tables, Trees, Heaps, Graphs]

  - number: 8
    title: Algorithms II
    language: python
    summary: Analyse algorithms rigorously and master the major algorithm design techniques.
    topics: [Big-O analysis, Divide and conquer, Greedy algorithms, Dynamic programming, Graph algorithms]

  - number: 9
    title: Computer Systems (C)
    language: c
    summary: Go below Python to see how programs really use memory, with the C language.
    topics: [C basics, Pointers, Memory management, Compilation, Assembly basics]

  - number: 10
    title: Operating Systems
    language: python
    summary: How an OS juggles programs, memory and files, and the hard problems of concurrency.
    topics: [Processes, Threads, Concurrency, Scheduling, Virtual memory, File systems]

  - number: 11
    title: Networking
    language: python
    summary: How data crosses the planet in milliseconds.
    topics: [TCP/IP, HTTP, DNS, Sockets, How the internet works]

  - number: 12
    title: Databases
    language: sql
    summary: Store, query and protect data with relational databases and SQL.
    topics: [Relational model, SQL, Normalization, Indexing, Transactions]

  - number: 13
    title: Web Development
    language: html
    summary: Build for the web, from HTML and CSS to JavaScript, frameworks and APIs.
    topics: [HTML, CSS, JavaScript, Front-end frameworks, Back-end APIs]

  - number: 14
    title: Software Engineering
    language: python
    summary: The practices that let teams build large, reliable software.
    topics: [Git, Testing, Debugging tools, Design patterns, Working in teams]

  - number: 15
    title: Theory of Computation
    language: python
    summary: What can computers do at all, and what can they do efficiently?
    topics: [Automata, Regular languages, Turing machines, Computability, P vs NP]

  - number: 16
    title: Security
    language: python
    summary: Think like an attacker so you can build like a defender.
    topics: [Common vulnerabilities, Cryptography basics, Secure coding]

  - number: 17
    title: AI & Machine Learning
    language: python
    summary: From search algorithms to neural networks, built from first principles.
    topics: [Search, Probability, Regression, Neural networks]

  - number: 18
    title: Capstone Projects
    language: python
    summary: Portfolio-quality projects that combine everything you've learned.
    topics: [Several multi-week projects]

  - number: 19
    title: Linear Algebra
    language: python
    summary: Vectors, matrices, and the mathematics behind graphics, data science, and search engines.
    topics: [Vectors, Matrices, Systems of equations, Determinants, Rank, Transformations, Least squares, Eigenvalues, PCA]

  - number: 20
    title: Calculus
    language: python
    summary: Rates of change, areas, differential equations, series and gradients, taught from zero with code.
    topics: [Limits, Derivatives, Optimization, Integrals, Differential equations, Series, Gradients]

  - number: 21
    title: Probability & Statistics
    language: python
    summary: Chance, distributions, sampling, hypothesis tests and regression, built from scratch and taught from zero.
    topics: [Probability, Bayes' rule, Distributions, The normal curve, Descriptive statistics, Confidence intervals, Hypothesis tests, Regression]

  - number: 22
    title: Advanced Algorithms
    language: python
    summary: Network flow, graph structure, string and geometry algorithms, hard problems and how to cope with them, randomized algorithms and fast range data structures.
    topics: [Maximum flow, Strongly connected components, String algorithms, Computational geometry, NP-completeness, Randomized and streaming algorithms, Advanced data structures]

  - number: 23
    title: Compilers
    language: python
    summary: How programs are turned into running code, from characters to tokens to trees to optimized instructions to registers, plus how memory is managed.
    topics: [Lexing and automata, Parsing and grammars, Syntax trees, Semantic analysis, Optimization, Code generation, Garbage collection]

  - number: 24
    title: Distributed Systems
    language: python
    summary: How many computers cooperate and survive failure, covering clocks, partitioning, replication, consensus, transactions, gossip and reliability patterns.
    topics: [Time and ordering, Consistent hashing, Replication and CRDTs, Consensus, Distributed transactions, Gossip, Retries and load balancing]

  - number: 25
    title: Database Internals
    language: python
    summary: How databases really work inside, from pages and buffer pools to B+ trees and LSM trees, query execution and optimization, transactions and concurrency, and relational design.
    topics: [Pages and buffer pool, B+ trees, LSM trees and Bloom filters, Query execution, Query optimization, Transactions and concurrency, Normalization]

  - number: 26
    title: Computer Graphics
    language: python
    summary: How computers make pictures, from pixels, lines and triangles through 3D transforms, colour and image filters, ray tracing, shading and the depth buffer, to curves, noise, fractals, animation and physics. An elective.
    topics: [Pixels and rasterization, Vectors and matrices, Colour and images, Ray tracing, Shading and the depth buffer, Curves noise and fractals, Animation and physics]

  - number: 27
    title: Human-Computer Interaction
    language: python
    summary: How people and interfaces work together, from Fitts's and Hick's laws and accessibility through events, state and undo, layout, forms and search, to user studies, site structure and design decisions. An elective.
    topics: [How people use interfaces, Accessibility, Events state and undo, Layout, Forms input and search, Evaluating designs, Navigation and design decisions]

  - number: 28
    title: Git and GitHub
    language: python
    summary: How version control really works and how teams use it, built from scratch. Hashes and commits, branches, diffs, merging and conflicts, remotes, pull requests, everyday workflow, code review and continuous integration. A practice unit.
    topics: [Snapshots hashes and commits, Branches and history, Diff and patch, Merging and conflicts, Remotes push and pull requests, Everyday Git workflow, Reviews issues and automation]

  - number: 29
    title: Command Line
    language: python
    summary: How the shell works and how to use it fluently, built from scratch on a pretend file system. Paths and files, permissions, text tools, pipes and redirection, wildcards and variables, scripts, processes, find and cron. A practice unit.
    topics: [The shell and the file system, Files and permissions, Text tools, Pipes and redirection, Wildcards variables and scripts, Processes search and scheduling]

  - number: 30
    title: Testing and Debugging
    language: python
    summary: How professionals make sure code works and find out why it does not, built from scratch. Test runners and fixtures, choosing good tests, mocks and dependency injection, coverage and mutation testing, debugging method, logging, validation and reliability patterns. A practice unit.
    topics: [Why test and a test runner, Designing good tests, Test doubles and injection, Coverage and mutation testing, Debugging like a scientist, Logging validation and reliability]

  - number: 31
    title: Security Basics
    language: python
    summary: How attackers break software and how to defend it, built from scratch. Password hashing and cryptography, injection attacks, authentication and access control, cookies and web headers, then threat modelling, dependency and secret scanning and log analysis. A practice unit.
    topics: [Hashing and passwords, Encryption and signatures, Injection attacks, Authentication and access control, Web security, Threat modelling and defence]

  - number: 32
    title: AI-Assisted Coding
    language: python
    summary: How to work with an AI coding assistant without giving up your own judgment, built from scratch with a fake model. Writing prompts and fitting the context window, reviewing AI code with a robot, verifying it with tests and random inputs, debugging in a loop, agents with tools and guardrails, and the privacy, injection and license risks. A practice unit.
    topics: [Prompts and context, Reviewing AI-written code, Verifying AI code, Debugging with an AI partner, Agents tools and guardrails, Risks privacy and good habits]
