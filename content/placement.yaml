# Placement checks: pass one to mark its lessons as mastered and skip known material.
passMark: 0.8
tests:
- id: python-basics
  title: Python basics
  intro: Variables, types, input, decisions, loops, functions and errors. Pass to skip Unit 2 (Programming Fundamentals). You still do its project later if you want the practice.
  skips:
  - u2-first-programs
  - u2-variables
  - u2-types
  - u2-io
  - u2-conditionals
  - u2-while
  - u2-for
  - u2-functions
  - u2-debugging
  questions:
  - question: 'What does this print?


      ```python

      print(2 + 3 * 4)

      ```'
    options:
    - '20'
    - '14'
    - '24'
    - '9'
    answer: 1
    explanation: Multiplication happens before addition, so 3 * 4 = 12 and 2 + 12 = 14.
    lesson: u2-variables
  - question: 'What does this print?


      ```python

      print(7 // 2, 7 % 2)

      ```'
    options:
    - 3.5 1
    - 3 1
    - 4 1
    - 3 3
    answer: 1
    explanation: // is whole-number division (3) and % is the remainder (1).
    lesson: u2-types
  - question: 'What does this print?


      ```python

      x = "5"

      print(x * 2)

      ```'
    options:
    - '10'
    - '55'
    - '"5" "5"'
    - An error
    answer: 1
    explanation: 'x is a string, and a string times a number repeats it: "55".'
    lesson: u2-types
  - question: What type of value does `input()` always give back?
    options:
    - int
    - float
    - str
    - It depends on what you type
    answer: 2
    explanation: input() returns text (a str); convert it with int() or float() if you need a number.
    lesson: u2-io
  - question: "What does this print?\n\n```python\nx = 5\nif x > 10:\n    print(\"a\")\nelif x > 3:\n    print(\"b\")\nelse:\n    print(\"c\")\n```"
    options:
    - a
    - b
    - c
    - b and c
    answer: 1
    explanation: x > 10 is False, x > 3 is True, so the elif branch runs and the rest is skipped.
    lesson: u2-conditionals
  - question: "What does this print?\n\n```python\ntotal = 0\ni = 1\nwhile i <= 4:\n    total += i\n    i += 1\nprint(total)\n```"
    options:
    - '4'
    - '6'
    - '10'
    - '15'
    answer: 2
    explanation: It adds 1 + 2 + 3 + 4 = 10.
    lesson: u2-while
  - question: "What does this print?\n\n```python\ndef f(a, b=2):\n    return a * b\n\nprint(f(3))\n```"
    options:
    - '3'
    - '5'
    - '6'
    - An error
    answer: 2
    explanation: b uses its default value 2, so f(3) returns 3 * 2 = 6.
    lesson: u2-functions
  - question: Which error does `int("abc")` raise?
    options:
    - TypeError
    - ValueError
    - NameError
    - SyntaxError
    answer: 1
    explanation: 'The type (str) is fine, but the value cannot be converted: ValueError.'
    lesson: u2-debugging
- id: python-data
  title: Python data structures
  intro: Lists, slicing, strings, references, tuples, dictionaries, sets, comprehensions and files. Pass to skip Unit 3 (Core Data Structures).
  skips:
  - u3-lists
  - u3-list-algorithms
  - u3-strings
  - u3-references
  - u3-tuples
  - u3-dicts
  - u3-sets
  - u3-comprehensions
  - u3-files
  questions:
  - question: 'What does this print?


      ```python

      items = [1, 2, 3, 4, 5]

      print(items[1:4])

      ```'
    options:
    - '[1, 2, 3, 4]'
    - '[2, 3, 4]'
    - '[2, 3, 4, 5]'
    - '[2, 3]'
    answer: 1
    explanation: 'A slice includes the start index (1) and stops before the end index (4): [2, 3, 4].'
    lesson: u3-list-algorithms
  - question: 'What does this print?


      ```python

      a = [1, 2]

      b = a

      b.append(3)

      print(a)

      ```'
    options:
    - '[1, 2]'
    - '[1, 2, 3]'
    - '[3]'
    - An error
    answer: 1
    explanation: b = a makes both names point to the same list, so changing it through b changes it for a too.
    lesson: u3-references
  - question: What does `"hello"[::-1]` give?
    options:
    - '"hello"'
    - '"olleh"'
    - '"h"'
    - An error
    answer: 1
    explanation: A step of -1 walks the string backwards.
    lesson: u3-strings
  - question: 'What happens here?


      ```python

      t = (1, 2)

      t[0] = 5

      ```'
    options:
    - t becomes (5, 2)
    - A TypeError, because tuples cannot be changed
    - t becomes (5,)
    - Nothing
    answer: 1
    explanation: 'Tuples are immutable: item assignment raises a TypeError.'
    lesson: u3-tuples
  - question: 'What does `{"a": 1}.get("b", 0)` return?'
    options:
    - None
    - '0'
    - A KeyError
    - '1'
    answer: 1
    explanation: get returns the default (0) when the key is missing, without raising an error.
    lesson: u3-dicts
  - question: What does `len(set([1, 2, 2, 3]))` give?
    options:
    - '4'
    - '3'
    - '2'
    - An error
    answer: 1
    explanation: 'A set keeps only unique values: {1, 2, 3} has three items.'
    lesson: u3-sets
  - question: 'What does this give?


      ```python

      [x * x for x in range(4) if x % 2 == 0]

      ```'
    options:
    - '[0, 4]'
    - '[0, 1, 4, 9]'
    - '[1, 9]'
    - '[0, 2]'
    answer: 0
    explanation: 'Only the even numbers 0 and 2 are kept, and squared: [0, 4].'
    lesson: u3-comprehensions
  - question: 'What does this print?


      ```python

      print([3, 1, 2].sort())

      ```'
    options:
    - '[1, 2, 3]'
    - '[3, 1, 2]'
    - None
    - An error
    answer: 2
    explanation: list.sort() sorts in place and returns None. Use sorted() to get a new list.
    lesson: u3-lists
- id: html-css
  title: HTML and CSS
  intro: Page structure, forms, accessibility, selectors, the box model and layout. Pass to skip the first four lessons of Unit 13 (Web Development).
  skips:
  - u13-html
  - u13-html-forms
  - u13-css
  - u13-layout
  questions:
  - question: Which HTML tag creates a link to another page?
    options:
    - <link>
    - <a href="...">
    - <url>
    - <href>
    answer: 1
    explanation: The anchor element <a> with an href attribute makes a hyperlink.
    lesson: u13-html
  - question: Which element is the main (largest) heading of a page?
    options:
    - <head>
    - <h6>
    - <h1>
    - <title>
    answer: 2
    explanation: <h1> is the top-level heading; <title> sets the browser tab name and <head> holds metadata.
    lesson: u13-html
  - question: What is the alt attribute of an image for?
    options:
    - Its size
    - A text description for screen readers and when the image does not load
    - Its link
    - Its border
    answer: 1
    explanation: alt text makes images accessible and shows when the image fails to load.
    lesson: u13-html-forms
  - question: How do you connect a label to an input?
    options:
    - <label for="email"> and <input id="email">
    - Put them next to each other
    - Give both class="email"
    - Use <connect>
    answer: 0
    explanation: The label's for attribute must match the input's id, so that clicking the label focuses the input.
    lesson: u13-html-forms
  - question: 'Which selector is MORE specific: `#nav a` or `.link`?'
    options:
    - '`.link`'
    - '`#nav a`'
    - They are equal
    - Neither can win
    answer: 1
    explanation: 'An id counts more than a class: #nav a (one id and one element) beats .link (one class).'
    lesson: u13-css
  - question: 'An element has `width: 100px; padding: 10px; border: 2px solid;` and the default box-sizing. How wide is the box on the page?'
    options:
    - 100px
    - 120px
    - 124px
    - 112px
    answer: 2
    explanation: 'With content-box, padding and border are added: 100 + 2 x 10 + 2 x 2 = 124px.'
    lesson: u13-css
  - question: 'What does `display: flex; justify-content: center;` do?'
    options:
    - Centers the text
    - Centers the flex items along the main axis
    - Hides the items
    - Makes a grid
    answer: 1
    explanation: justify-content aligns flex items along the main axis (a row by default).
    lesson: u13-layout
  - question: What is a media query for?
    options:
    - Playing videos
    - Applying CSS only when conditions such as the screen width match
    - Loading images faster
    - Linking pages
    answer: 1
    explanation: Media queries make responsive designs, for example different layouts for phones and desktops.
    lesson: u13-layout
- id: javascript
  title: JavaScript
  intro: The language, asynchronous code and the DOM. Pass to skip lessons 5 to 7 of Unit 13.
  skips:
  - u13-js-language
  - u13-async
  - u13-dom
  questions:
  - question: Which statement is true about `const x = 5;`?
    options:
    - x can be reassigned later
    - x cannot be reassigned
    - x is a function
    - x is a string
    answer: 1
    explanation: const creates a binding that cannot be reassigned (an object it holds can still change inside).
    lesson: u13-js-language
  - question: What is `"5" + 3` in JavaScript?
    options:
    - '8'
    - '"53"'
    - An error
    - NaN
    answer: 1
    explanation: 'With a string on one side, + joins text: "53".'
    lesson: u13-js-language
  - question: What does `[1, 2, 3].map(x => x * 2)` return?
    options:
    - '6'
    - '[2, 4, 6]'
    - '[1, 2, 3]'
    - undefined
    answer: 1
    explanation: map builds a new array by applying the function to each item.
    lesson: u13-js-language
  - question: What is the difference between `==` and `===`?
    options:
    - None
    - === also compares the types, without conversion
    - == is faster
    - === assigns a value
    answer: 1
    explanation: === is strict equality; == converts types first, which gives surprising results.
    lesson: u13-js-language
  - question: What is a Promise?
    options:
    - A function that runs twice
    - An object that stands for a value that will be available later, or an error
    - A kind of loop
    - A comment
    answer: 1
    explanation: Promises represent the eventual result of asynchronous work such as a network request.
    lesson: u13-async
  - question: Where can the keyword `await` be used?
    options:
    - Anywhere
    - Inside async functions (and in modules at top level)
    - Only in loops
    - Only in classes
    answer: 1
    explanation: await pauses an async function until a promise settles.
    lesson: u13-async
  - question: What does `document.querySelector(".card")` return?
    options:
    - All elements with class card
    - The first element that matches, or null
    - The text of the page
    - A CSS rule
    answer: 1
    explanation: querySelector returns the first matching element (querySelectorAll returns all).
    lesson: u13-dom
  - question: What does `button.addEventListener("click", handler)` do?
    options:
    - Clicks the button
    - Runs handler each time the button is clicked
    - Deletes the button
    - Styles the button
    answer: 1
    explanation: It registers a function to be called whenever the event happens.
    lesson: u13-dom
