# Reading lists (Version 2). `after` is the unit to have finished first.
# kind: book | paper | article | course | tool. `free: true` means the whole
# thing can be read online at no cost. If there is no link, search for the title.
intro: >-
  A degree is also a lot of reading. These are real, well-regarded books,
  papers and websites, chosen to match the units. You do not need to read all
  of them: pick one a month, read it slowly, and tick it off. Papers are hard
  at first; that is normal, and reading the abstract, the introduction and
  the conclusion first is a good way in.
items:
  - {id: r-think-python, title: "Think Python (2nd edition)", author: "Allen B. Downey", kind: book, free: true, url: "https://greenteapress.com/wp/think-python-2e/", after: 3, why: "A friendly second explanation of the Python you learn in Units 2 to 4."}
  - {id: r-nand2tetris, title: "Nand to Tetris", author: "Nisan and Schocken", kind: course, free: true, url: "https://www.nand2tetris.org", after: 1, why: "Build a whole computer from logic gates up to a game. It makes Unit 1 and Unit 9 feel real."}
  - {id: r-sicp, title: "Structure and Interpretation of Computer Programs", author: "Abelson and Sussman", kind: book, free: true, url: "https://web.mit.edu/6.001/6.037/sicp.pdf", after: 7, why: "A classic about abstraction, recursion and interpreters. Hard, and worth it."}
  - {id: r-missing, title: "The Missing Semester of Your CS Education", author: "MIT", kind: course, free: true, url: "https://missing.csail.mit.edu", after: 10, why: "The shell, version control, editors and debugging: practical skills courses forget to teach."}
  - {id: r-dijkstra-goto, title: "Go To Statement Considered Harmful", author: "Edsger W. Dijkstra", kind: paper, free: true, url: "https://homepages.cwi.nl/~storm/teaching/reader/Dijkstra68.pdf", after: 4, why: "A short 1968 letter that changed how programs are structured."}
  - {id: r-turing, title: "Computing Machinery and Intelligence", author: "Alan Turing", kind: paper, free: false, after: 15, why: "The 1950 paper that asks whether machines can think and introduces the imitation game."}
  - {id: r-algorithms, title: "Algorithms", author: "Jeff Erickson", kind: book, free: true, url: "https://jeffe.cs.illinois.edu/teaching/algorithms/", after: 8, why: "A free university textbook with clear proofs; use it beside Units 8 and 22."}
  - {id: r-clrs, title: "Introduction to Algorithms", author: "Cormen, Leiserson, Rivest and Stein", kind: book, free: false, after: 22, why: "The standard reference. Dip into it for the chapter you need."}
  - {id: r-ostep, title: "Operating Systems: Three Easy Pieces", author: "Remzi and Andrea Arpaci-Dusseau", kind: book, free: true, url: "https://pages.cs.wisc.edu/~remzi/OSTEP/", after: 10, why: "Virtualization, concurrency and persistence explained with great clarity."}
  - {id: r-beej, title: "Beej's Guide to Network Programming", author: "Brian Hall", kind: book, free: true, url: "https://beej.us/guide/bgnet/", after: 11, why: "How real programs talk over sockets, with friendly C examples."}
  - {id: r-time-clocks, title: "Time, Clocks, and the Ordering of Events in a Distributed System", author: "Leslie Lamport", kind: paper, free: true, url: "https://lamport.azurewebsites.net/pubs/time-clocks.pdf", after: 24, why: "The paper that taught the world how to think about order without a shared clock."}
  - {id: r-raft, title: "In Search of an Understandable Consensus Algorithm (Raft)", author: "Ongaro and Ousterhout", kind: paper, free: true, url: "https://raft.github.io/raft.pdf", after: 24, why: "A consensus algorithm designed to be understood; the website has a lovely animation."}
  - {id: r-dynamo, title: "Dynamo: Amazon's Highly Available Key-value Store", author: "DeCandia and others", kind: paper, free: true, url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf", after: 24, why: "Hash rings, quorums and anti-entropy in a real production system (Unit 24)."}
  - {id: r-ddia, title: "Designing Data-Intensive Applications", author: "Martin Kleppmann", kind: book, free: false, url: "https://dataintensive.net", after: 25, why: "The best single book on databases, streams and distributed data in practice."}
  - {id: r-index, title: "Use The Index, Luke", author: "Markus Winand", kind: book, free: true, url: "https://use-the-index-luke.com", after: 12, why: "A practical guide to making SQL queries fast with indexes."}
  - {id: r-dbtutorial, title: "Let's Build a Simple Database", author: "Connor Stack", kind: article, free: true, url: "https://cstack.github.io/db_tutorial/", after: 25, why: "Write a small SQLite clone in C, with pages and a B-tree."}
  - {id: r-eloquent, title: "Eloquent JavaScript", author: "Marijn Haverbeke", kind: book, free: true, url: "https://eloquentjavascript.net", after: 13, why: "A thoughtful JavaScript book that goes well beyond the basics."}
  - {id: r-aosa, title: "The Architecture of Open Source Applications", author: "Various", kind: book, free: true, url: "https://aosabook.org", after: 14, why: "The designers of real programs explain how and why they built them."}
  - {id: r-trust, title: "Reflections on Trusting Trust", author: "Ken Thompson", kind: paper, free: true, url: "https://www.cs.cmu.edu/~rdriley/487/papers/Thompson_1984_ReflectionsonTrustingTrust.pdf", after: 23, why: "A short Turing Award lecture about a compiler that hides a back door. Read it after Units 16 and 23."}
  - {id: r-crafting, title: "Crafting Interpreters", author: "Robert Nystrom", kind: book, free: true, url: "https://craftinginterpreters.com", after: 23, why: "Build two complete interpreters; the perfect companion to Unit 23."}
  - {id: r-3b1b-la, title: "Essence of Linear Algebra", author: "3Blue1Brown", kind: course, free: true, url: "https://www.3blue1brown.com/topics/linear-algebra", after: 19, why: "Short animated lessons that show what matrices and vectors do."}
  - {id: r-3b1b-calc, title: "Essence of Calculus", author: "3Blue1Brown", kind: course, free: true, url: "https://www.3blue1brown.com/topics/calculus", after: 20, why: "Derivatives and integrals as pictures first, formulas second."}
  - {id: r-immersive, title: "Immersive Linear Algebra", author: "Ström, Åström and Akenine-Möller", kind: book, free: true, url: "https://immersivemath.com", after: 19, why: "An interactive book where you drag the figures."}
  - {id: r-thinkstats, title: "Think Stats (2nd edition)", author: "Allen B. Downey", kind: book, free: true, url: "https://greenteapress.com/wp/think-stats-2e/", after: 21, why: "Statistics through programming, which suits this course."}
  - {id: r-raytracing, title: "Ray Tracing in One Weekend", author: "Peter Shirley", kind: book, free: true, url: "https://raytracing.github.io", after: 26, why: "Go from nothing to a beautiful ray-traced image in a weekend."}
  - {id: r-pbr, title: "Physically Based Rendering: From Theory to Implementation", author: "Pharr, Jakob and Humphreys", kind: book, free: true, url: "https://www.pbr-book.org", after: 26, why: "The deep reference on how film-quality images are made."}
  - {id: r-heuristics, title: "10 Usability Heuristics for User Interface Design", author: "Jakob Nielsen", kind: article, free: true, url: "https://www.nngroup.com/articles/ten-usability-heuristics/", after: 27, why: "The ten rules of thumb you used in Unit 27's heuristic evaluation."}
  - {id: r-wcag, title: "WCAG 2 Quick Reference", author: "W3C", kind: tool, free: true, url: "https://www.w3.org/WAI/WCAG22/quickref/", after: 27, why: "The official checklist of accessibility rules; keep it open when you build a page."}
  - {id: r-design-everyday, title: "The Design of Everyday Things", author: "Don Norman", kind: book, free: false, after: 27, why: "Why doors confuse us and what good design does about it."}
  - {id: r-mythical, title: "The Mythical Man-Month", author: "Fred Brooks", kind: book, free: false, after: 14, why: "Essays on why software projects run late, still true fifty years on."}
  - {id: r-pragmatic, title: "The Pragmatic Programmer", author: "Hunt and Thomas", kind: book, free: false, after: 14, why: "Habits of effective programmers in short, readable tips."}
  - {id: r-sipser, title: "Introduction to the Theory of Computation", author: "Michael Sipser", kind: book, free: false, after: 15, why: "The standard text for automata, computability and complexity."}
  - {id: r-ml-course, title: "Machine Learning (Stanford CS229 notes)", author: "Andrew Ng and others", kind: course, free: false, after: 17, why: "Search for the course notes; the maths builds on Units 19 to 21."}
