# Terms introduced in Unit 1. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Bit
    definition: A *binary digit*, the smallest unit of information. It has one of two values, 0 or 1.
    lesson: u1-binary
  - term: Byte
    definition: A group of 8 bits. It has 256 possible patterns, so it can store a whole number from 0 to 255.
    lesson: u1-binary
  - term: Binary
    definition: The base-2 number system, which uses only the digits 0 and 1. Each place is worth twice the place to its right (1, 2, 4, 8, ...).
    lesson: u1-binary
  - term: Decimal
    definition: The base-10 number system people use every day, with digits 0 to 9 and place values 1, 10, 100, ...
    lesson: u1-binary
  - term: Base
    definition: The number of different digits a number system uses, which is also how much each place value grows by. Binary is base 2, decimal is base 10, hexadecimal is base 16.
    lesson: u1-binary
  - term: Place value
    definition: The amount a digit is worth because of its position. In binary, the place values from the right are 1, 2, 4, 8, 16, and so on.
    lesson: u1-binary
  - term: Transistor
    definition: A microscopic, electrically controlled switch. Modern chips contain billions of them, and their on/off states represent bits.
    lesson: u1-binary
  - term: Kilobyte, megabyte, gigabyte
    definition: Roughly a thousand, a million and a billion bytes. In powers of 2, 1 kibibyte (KiB) is exactly 1024 bytes.
    lesson: u1-binary
  - term: Bits per second (bps)
    definition: A measure of data transfer speed. Network speeds are usually given in megabits per second (Mbps); divide by 8 to get megabytes per second.
    lesson: u1-binary
  - term: Comment
    definition: Text in code that the computer ignores, written for human readers. In Python a comment starts with `#`.
    lesson: u1-binary
  - term: Encoding
    definition: An agreed rule for what a pattern of bits means. The same bits can be a number, a letter or a colour depending on the encoding.
    lesson: u1-data
  - term: Hexadecimal (hex)
    definition: The base-16 number system, with digits 0 to 9 and A to F. Each hex digit stands for exactly 4 bits, so a byte is two hex digits. Written with a `0x` prefix in code.
    lesson: u1-data
  - term: ASCII
    definition: An early 7-bit character encoding with 128 characters (English letters, digits, punctuation and control codes). `A` is 65, `a` is 97.
    lesson: u1-data
  - term: Unicode
    definition: A standard that gives every character in every writing system its own number, called a code point (for example U+1F600 for 😀).
    lesson: u1-data
  - term: UTF-8
    definition: The most common way to store Unicode text as bytes. It uses 1 to 4 bytes per character, and ASCII text is already valid UTF-8.
    lesson: u1-data
  - term: Two's complement
    definition: The standard way to store negative whole numbers in binary. The leftmost bit has a negative place value; to negate a number, flip all its bits and add 1.
    lesson: u1-data
  - term: Overflow
    definition: When the result of a calculation is too big (or too small) for the number of bits available, so it wraps around, like an odometer rolling over.
    lesson: u1-data
  - term: Floating point
    definition: The format computers use for numbers with fractions, a binary version of scientific notation. Some decimals, like 0.1, cannot be stored exactly.
    lesson: u1-data
  - term: Pixel
    definition: One dot in a digital image. A colour pixel is commonly stored as three bytes, for red, green and blue (RGB).
    lesson: u1-data
  - term: Sample (audio)
    definition: One measurement of a sound wave. CD audio takes 44,100 samples per second per channel.
    lesson: u1-data
  - term: Compression
    definition: Storing data in fewer bits by removing redundancy (lossless, like PNG and ZIP) or less noticeable detail (lossy, like JPEG and MP3).
    lesson: u1-data
  - term: Boolean logic
    definition: Algebra where every value is true or false (1 or 0), combined with operations like AND, OR and NOT. Named after George Boole.
    lesson: u1-logic
  - term: Logic gate
    definition: A small circuit, built from transistors, that takes one or more input bits and produces an output bit according to a fixed rule.
    lesson: u1-logic
  - term: Truth table
    definition: A table listing every possible combination of inputs to a circuit or expression, and the output for each. n inputs give 2ⁿ rows.
    lesson: u1-logic
  - term: AND, OR, NOT
    definition: "The basic logic operations. AND is 1 only if both inputs are 1; OR is 1 if at least one input is 1; NOT flips its input."
    lesson: u1-logic
  - term: XOR
    definition: Exclusive OR. Outputs 1 when its inputs are different, and 0 when they are the same.
    lesson: u1-logic
  - term: NAND
    definition: NOT AND. Outputs 0 only when both inputs are 1. It is a universal gate, meaning any circuit can be built from NAND gates alone.
    lesson: u1-logic
  - term: De Morgan's laws
    definition: NOT (A AND B) = (NOT A) OR (NOT B), and NOT (A OR B) = (NOT A) AND (NOT B).
    lesson: u1-logic
  - term: Half adder
    definition: A circuit that adds two bits, producing a sum bit (XOR) and a carry bit (AND).
    lesson: u1-logic
  - term: Full adder
    definition: A circuit that adds three bits (two inputs and a carry-in), producing a sum bit and a carry-out. Chains of full adders add multi-bit numbers.
    lesson: u1-logic
  - term: CPU (processor)
    definition: The part of a computer that executes program instructions, one simple step at a time.
    lesson: u1-cpu
  - term: ALU
    definition: Arithmetic Logic Unit. The part of the CPU that does arithmetic and logic operations.
    lesson: u1-cpu
  - term: Register
    definition: A tiny, extremely fast storage slot inside the CPU that holds one value the CPU is working on.
    lesson: u1-cpu
  - term: Program counter (PC)
    definition: A register holding the address of the next instruction to execute.
    lesson: u1-cpu
  - term: Control unit
    definition: The part of the CPU that decodes instructions and directs the ALU, registers and memory to carry them out.
    lesson: u1-cpu
  - term: Clock speed
    definition: How many ticks per second the CPU's clock makes, measured in hertz. 3 GHz is 3 billion ticks per second.
    lesson: u1-cpu
  - term: Instruction set architecture (ISA)
    definition: The set of instructions a family of CPUs understands, such as x86-64 or ARM.
    lesson: u1-cpu
  - term: Machine code
    definition: Instructions encoded as bit patterns that a CPU can execute directly.
    lesson: u1-cpu
  - term: Fetch-decode-execute cycle
    definition: The loop every CPU repeats. Fetch the next instruction from memory, decode what it means, then execute it.
    lesson: u1-cpu
  - term: Jump
    definition: An instruction that changes the program counter so a different instruction runs next. Conditional jumps make decisions; backward jumps make loops.
    lesson: u1-cpu
  - term: Core
    definition: A complete processing unit within a CPU chip. A multi-core chip can run several streams of instructions at the same time.
    lesson: u1-cpu
  - term: Memory address
    definition: The number identifying one byte-sized location in memory.
    lesson: u1-memory
  - term: RAM
    definition: Random access memory. The computer's main working memory. Any address can be reached equally fast, and contents are lost when the power is off.
    lesson: u1-memory
  - term: Volatile
    definition: Describes memory that loses its contents without power, like RAM. Storage such as SSDs is non-volatile.
    lesson: u1-memory
  - term: Endianness
    definition: The order in which the bytes of a multi-byte value are stored. Little-endian puts the least significant byte first; big-endian puts the most significant byte first.
    lesson: u1-memory
  - term: Stored-program computer
    definition: A design (often called the von Neumann architecture) where program instructions are stored in the same memory as data.
    lesson: u1-memory
  - term: Memory hierarchy
    definition: The layers of storage from small and fast to large and slow (registers, caches, RAM, SSD, hard disk) used to balance speed, size and cost.
    lesson: u1-memory
  - term: Cache
    definition: A small, fast memory that keeps copies of recently used data so the CPU doesn't have to wait for slower memory. A cache hit finds the data; a miss doesn't.
    lesson: u1-memory
  - term: Locality
    definition: The tendency of programs to reuse recently used data (temporal locality) and to use data near recently used data (spatial locality). It is why caches work.
    lesson: u1-memory
  - term: Average memory access time (AMAT)
    definition: hit time + miss rate × miss penalty. A way to estimate how fast memory appears to a program.
    lesson: u1-memory
  - term: Abstraction
    definition: Hiding the details of how something works behind a simpler interface, so you can use it without thinking about its internals. Computing is built from layers of abstraction.
    lesson: u1-translation
  - term: Assembly language
    definition: A human-readable form of machine code that uses short names (mnemonics) for instructions. An assembler translates it into machine code.
    lesson: u1-translation
  - term: Compiler
    definition: A program that translates a whole program from one language (like C) into another, usually machine code, before it runs.
    lesson: u1-translation
  - term: Interpreter
    definition: A program that runs code directly, carrying out each statement as it reads it rather than translating the whole program first.
    lesson: u1-translation
  - term: Token
    definition: One "word" of a program, such as a name, number, operator or bracket. Lexing splits source code into tokens.
    lesson: u1-translation
  - term: Syntax tree
    definition: A tree-shaped representation of how the parts of a program fit together, built by a parser.
    lesson: u1-translation
  - term: Bytecode
    definition: Instructions for a virtual machine rather than a real CPU. CPython compiles Python source into bytecode.
    lesson: u1-translation
  - term: Virtual machine (VM)
    definition: A program that acts like a CPU, executing instructions (such as bytecode) in software.
    lesson: u1-translation
  - term: Stack
    definition: A collection where you can only add (push) or remove (pop) the top item, like a pile of plates. Last in, first out.
    lesson: u1-translation
  - term: JIT compiler
    definition: A just-in-time compiler, which compiles parts of a program to machine code while the program is running.
    lesson: u1-translation
  - term: Syntax error
    definition: A mistake in the grammar of code, found before the program runs. In Python, nothing in the file runs.
    lesson: u1-translation
  - term: Runtime error
    definition: An error that happens while a program is running, when a line tries something impossible such as dividing by zero. Also called an exception.
    lesson: u1-translation
