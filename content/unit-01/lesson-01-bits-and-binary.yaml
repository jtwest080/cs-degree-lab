id: u1-binary
title: Bits and Binary, How Computers Count
minutes: 40
objective: |
  Understand why computers store everything as **bits**, and be able to count, read and write numbers in **binary** (base 2) as fluently as you do in decimal.
outcomes:
  - Explain why a computer uses two states (on/off) instead of ten
  - Convert numbers between binary and decimal by hand
  - Work out how many different values a given number of bits can store
  - Run your first lines of Python code

sections:
  - heading: What is a computer, really?
    body: |
      Strip away the screen, the keyboard and the apps, and a computer is a machine that does exactly one kind of thing: it **transforms information by following instructions**. A photo, a song, a web page, a video game, a spreadsheet: to a computer, all of these are just information, and all of that information is stored as numbers.

      That's the big idea of this whole unit, so let it sink in. When you edit a photo, the computer is doing arithmetic on numbers that describe the colour of each dot. When you type the letter `A`, the keyboard sends a number. When you play a song, a list of numbers describing air pressure is sent to your speaker thousands of times a second.

      So the first question a computer scientist asks is: **how does a machine store and work with numbers?**

  - heading: Why two states? Switches, not dials
    body: |
      Inside every chip are billions of microscopic switches called **transistors**. A transistor is an electrically controlled switch: it is either letting current through (**on**) or not (**off**). We usually call these two states **1** and **0**.

      Why only two? Why not build switches with ten levels, one for each decimal digit? Because the real world is noisy. Voltages wobble, components heat up, and wires pick up interference.

      > **Analogy:** Imagine reading a light switch versus a dimmer from across a dark room. You can always tell whether the switch is *on or off*. But is the dimmer at 60% or 70%? Hard to say, and easy to get wrong. Computers use the light-switch approach because "on vs off" stays readable even when things get messy.

      With only two states, a chip can tolerate lots of noise: anything above a threshold voltage counts as 1, anything below counts as 0. That reliability is what lets a phone do billions of operations a second without mistakes. The price is that we have to represent everything using just two symbols. That system is called **binary**.

  - heading: Bits and bytes
    body: |
      A single 0-or-1 value is called a **bit**, short for *binary digit*. One bit on its own can only say two things: yes/no, on/off, true/false.

      Group bits together and the possibilities multiply. Every extra bit **doubles** the number of patterns, because each existing pattern can be followed by either a 0 or a 1:

      | Bits | Patterns | Count |
      |---|---|---|
      | 1 | 0, 1 | 2 |
      | 2 | 00, 01, 10, 11 | 4 |
      | 3 | 000, 001, 010, 011, 100, 101, 110, 111 | 8 |
      | n | ... | 2ⁿ |

      > **Key idea:** **n bits can represent 2ⁿ different values.** If those values are the whole numbers starting at 0, the biggest one is **2ⁿ − 1** (because counting starts at 0, not 1).

      A group of **8 bits** is called a **byte**. One byte has 2⁸ = 256 patterns, so it can store any whole number from 0 to 255. Bytes are the standard unit for measuring memory and file sizes:

      - 1 **kilobyte** (KB) ≈ a thousand bytes, a short text file
      - 1 **megabyte** (MB) ≈ a million bytes, a photo or a minute of music
      - 1 **gigabyte** (GB) ≈ a billion bytes, about an hour of HD video
      - 1 **terabyte** (TB) ≈ a trillion bytes, a whole laptop drive

      > **Note:** Because computers work in powers of 2, memory is often measured in units of 1024 rather than 1000 (2¹⁰ = 1024). Strictly, 1024 bytes is a **kibibyte** (KiB), but many people still say "kilobyte" for both. In this course, when a question needs the exact number, it will say which one it means.

      Also watch the capital letters: a lowercase **b** means *bits* and an uppercase **B** means *bytes*. Internet speeds are sold in megabits per second (Mbps), so a "100 Mbps" connection downloads at most about 12.5 megabytes per second.

  - heading: Counting in binary
    body: |
      You already know a number system that uses place values: decimal. In the number **352**, each position is worth ten times the one to its right:

      | Place value | 100 (10²) | 10 (10¹) | 1 (10⁰) |
      |---|---|---|---|
      | Digit | 3 | 5 | 2 |

      So 352 means 3×100 + 5×10 + 2×1. We call decimal **base 10** because it has ten digits (0 to 9) and each place is worth 10 times more.

      Binary works exactly the same way, but in **base 2**: there are only two digits (0 and 1) and each place is worth **2 times** more than the one to its right. Reading from the right, the place values are 1, 2, 4, 8, 16, 32, 64, 128, and so on.

      **Binary to decimal: add up the place values that have a 1.** Take the binary number `1011`:

      | Place value | 8 | 4 | 2 | 1 |
      |---|---|---|---|---|
      | Bit | 1 | 0 | 1 | 1 |

      That's 8 + 0 + 2 + 1 = **11**.

      **Decimal to binary: repeatedly divide by 2 and keep the remainders.** To convert 13:

      | Step | Divide | Result | Remainder |
      |---|---|---|---|
      | 1 | 13 ÷ 2 | 6 | **1** |
      | 2 | 6 ÷ 2 | 3 | **0** |
      | 3 | 3 ÷ 2 | 1 | **1** |
      | 4 | 1 ÷ 2 | 0 | **1** |

      Read the remainders from the **bottom up**: `1101`. Check: 8 + 4 + 0 + 1 = 13. ✓

      > **Why:** Each remainder tells you whether the number is odd (1) or even (0) at that step, which is exactly whether the current lowest place value is "on". Dividing by 2 then shifts every bit one place to the right, so the next remainder reveals the next bit.

      There's a second method many people find faster for small numbers: find the biggest power of 2 that fits, write a 1 there, subtract, and repeat. For 13: 8 fits (13 − 8 = 5), 4 fits (5 − 4 = 1), 2 doesn't fit, 1 fits. So 8, 4 and 1 are on: `1101`.

  - heading: Your first look at Python
    body: |
      Throughout this course you'll check your understanding by running real code. Python is a programming language that reads almost like English, and it runs right here in your browser. You will learn it properly in Unit 2. For now you only need three tiny pieces:

      1. **`print(something)`** shows a value in the output panel.
      2. **`answer = 13`** stores a value under the name `answer`. Exercises will ask you to set a name like this, and the tests will look at it.
      3. **Numbers in binary** are written with a `0b` prefix: Python reads `0b1101` as the number thirteen. Without the prefix, `1101` means one thousand one hundred and one.

      Python can also convert for you: `bin(13)` gives the text `'0b1101'`, and `int("1101", 2)` reads the text `"1101"` as a base-2 number. You'll use these to *check* your hand calculations, but in the exercises, do the conversion by hand first. The goal is for binary to feel natural, not for Python to do it for you.

      A line that starts with `#` is a **comment**: a note for humans that Python ignores.

examples:
  - title: Binary numbers in Python
    intro: Python understands binary directly. Notice how the same value can be written in different ways.
    code: |
      print(0b1011)          # binary 1011 written as a number
      print(8 + 0 + 2 + 1)   # adding the place values by hand
      print(bin(11))         # convert 11 to binary text
      print(int("1011", 2))  # read the text "1011" as base 2
    output: |
      11
      11
      0b1011
      11
    lines:
      - line: 1
        note: "`0b` tells Python the digits that follow are binary. Python stores the value eleven and `print` shows it in decimal, because decimal is how humans like to read numbers."
      - line: 2
        note: "The same value computed by adding the place values that hold a 1 (8, 2 and 1). The comment after `#` is ignored by Python."
      - line: 3
        note: "`bin()` goes the other way: it turns a number into binary *text*. The `0b` at the front is Python reminding you the text is binary."
      - line: 4
        note: "`int(text, 2)` reads a piece of text as a base-2 number. The quotes matter: `\"1011\"` is text, not the number one thousand and eleven."
  - title: How many values fit in n bits?
    intro: The `**` operator means "to the power of". Each extra bit doubles the count.
    code: |
      print(2 ** 1)      # 1 bit
      print(2 ** 2)      # 2 bits
      print(2 ** 8)      # 8 bits = 1 byte
      print(2 ** 8 - 1)  # the largest number one byte can hold
      print(2 ** 32)     # 32 bits
    output: |
      2
      4
      256
      255
      4294967296
    lines:
      - line: 1-2
        note: "One bit gives 2 patterns, two bits give 4. `2 ** 2` is 2 × 2."
      - line: 3
        note: "A byte has 8 bits, so it has 2⁸ = 256 possible patterns."
      - line: 4
        note: "Counting starts at 0, so 256 patterns hold the numbers 0 to 255. Python does the `**` before the `-`, just like in maths."
      - line: 5
        note: "32 bits give about 4.3 billion patterns. This is why old 32-bit computers could only use 4 GB of memory: each byte of memory needs its own number (its address), and 32 bits ran out at about 4 billion."
  - title: Decimal to binary by repeated division
    intro: |
      Here's the divide-by-2 method from the lesson written as code. Two new operators: `//` divides and throws away any fraction ("floor division"), and `%` gives the **remainder** of a division.
    code: |
      print(13 // 2, 13 % 2)   # 6 remainder 1
      print(6 // 2, 6 % 2)     # 3 remainder 0
      print(3 // 2, 3 % 2)     # 1 remainder 1
      print(1 // 2, 1 % 2)     # 0 remainder 1
      # Remainders read bottom-up: 1101
      print(0b1101)
    output: |
      6 1
      3 0
      1 1
      0 1
      13
    lines:
      - line: 1
        note: "13 divided by 2 is 6 with 1 left over. `print` can show several values separated by commas; it puts a space between them."
      - line: 2-4
        note: "Keep dividing the result by 2 until it reaches 0, noting each remainder."
      - line: 5
        note: "A comment. Reading the remainders from the last line up gives 1, 1, 0, 1."
      - line: 6
        note: "Checking our work: binary 1101 really is 13."

playground:
  prompt: |
    Experiment! Try printing `0b11111111`, `bin(100)`, or `2 ** 64`. Can you predict the output before you press Run? Predicting first, then checking, is one of the fastest ways to learn.
  code: |
    # Change these and press Run
    print(0b101)
    print(bin(42))
    print(2 ** 10)

exercises:
  - id: bin-to-dec
    title: Read a binary number
    difficulty: 1
    prompt: |
      Convert the binary number **1101** to decimal **by hand**, using the place-value table (8, 4, 2, 1). Then set `answer` to the decimal number you got.
    starter: |
      # Work it out on paper first: which place values hold a 1?
      answer = 0
    tests:
      - name: answer is the decimal value of binary 1101
        code: |
          assert answer != 0, "answer is still 0. Replace the 0 with the decimal value you worked out."
          assert answer != 1101, "1101 is the binary digits themselves. Convert it: which place values (8, 4, 2, 1) are on?"
          assert answer == 13, f"You wrote {answer}. Add up the place values with a 1: 8 + 4 + 0 + 1."
    hints:
      - Write the place values 8, 4, 2, 1 above the digits 1, 1, 0, 1.
      - Add up only the place values that sit above a 1.
      - That's 8 + 4 + 1.
    solution: |
      answer = 13  # 8 + 4 + 0 + 1
    explanation: |
      Lining the bits up under their place values gives 8, 4, 2, 1 over 1, 1, 0, 1. The 8, 4 and 1 places are on, so the value is 8 + 4 + 1 = **13**. You could check it with `print(0b1101)`.

  - id: dec-to-bin
    title: Write a number in binary
    difficulty: 1
    prompt: |
      Convert the decimal number **37** to binary using either method from the lesson (repeated division by 2, or subtracting the largest power of 2).

      Set `answer` to the binary digits **as text in quotes**, with no `0b` prefix, for example `answer = "1010"`.
    starter: |
      answer = ""
    tests:
      - name: answer is text (in quotes)
        code: |
          assert isinstance(answer, str), "Put the digits in quotes, like answer = \"1010\", so Python treats them as text."
      - name: answer is 37 in binary
        code: |
          a = answer.strip()
          if a.startswith("0b"):
              a = a[2:]
          assert a != "", "answer is empty. Type the binary digits between the quotes."
          assert set(a) <= {"0", "1"}, "Binary only uses the digits 0 and 1."
          assert int(a, 2) == 37, f"\"{a}\" is {int(a, 2)} in decimal, not 37. Try the divide-by-2 method and read the remainders bottom-up."
    hints:
      - "The largest power of 2 that fits in 37 is 32. 37 − 32 = 5."
      - "Now fit 5: the 4 place fits (5 − 4 = 1), the 2 place doesn't, the 1 place does."
      - "So the places 32, 4 and 1 are on, and 16, 8 and 2 are off. Write the digits for 32, 16, 8, 4, 2, 1 in order."
    solution: |
      answer = "100101"  # 32 + 4 + 1
    explanation: |
      Using division: 37 → 18 r**1**, 18 → 9 r**0**, 9 → 4 r**1**, 4 → 2 r**0**, 2 → 1 r**0**, 1 → 0 r**1**. Reading the remainders bottom-up gives **100101**. Check: 32 + 4 + 1 = 37.

  - id: count-patterns
    title: How many values?
    difficulty: 2
    prompt: |
      An old video game console stored each colour using **12 bits**. How many different colours could it display?

      Set `colours` to that number. You may use Python's `**` operator to compute it.
    starter: |
      colours = 0
    tests:
      - name: colours is the number of patterns in 12 bits
        code: |
          assert colours != 12 * 2, "Each extra bit doubles the count; it doesn't just add 2. Use 2 ** bits."
          assert colours != 2 ** 12 - 1, "2**12 - 1 is the largest *number*, but the count of different patterns includes zero."
          assert colours == 4096, f"You have {colours}. n bits give 2 to the power n patterns."
    hints:
      - Every extra bit doubles the number of patterns.
      - "The formula is 2ⁿ, where n is the number of bits. In Python, that's `2 ** n`."
    solution: |
      colours = 2 ** 12
    explanation: |
      n bits can represent 2ⁿ patterns, and each pattern can stand for one colour, so 12 bits give 2¹² = **4096** colours. (Modern screens use 24 bits per pixel: 2²⁴ is about 16.7 million colours.)

  - id: byte-facts
    title: Byte-sized facts
    difficulty: 2
    prompt: |
      Set three names:

      - `largest_byte`: the **largest** whole number one byte can store (counting from 0)
      - `bits_in_kib`: how many **bits** are in one kibibyte (1024 bytes)
      - `mbps_to_MBps`: a connection is advertised at **80 megabits per second**. How many **megabytes** per second is that?
    starter: |
      largest_byte = 0
      bits_in_kib = 0
      mbps_to_MBps = 0
    tests:
      - name: largest_byte is correct
        code: |
          assert largest_byte != 256, "A byte has 256 patterns, but they start at 0. What is the largest?"
          assert largest_byte == 255, f"largest_byte is {largest_byte}. Think 2 ** 8 - 1."
      - name: bits_in_kib is correct
        code: |
          assert bits_in_kib != 1024, "1024 is the number of *bytes*. Each byte has 8 bits."
          assert bits_in_kib == 8192, f"bits_in_kib is {bits_in_kib}. Multiply bytes by bits per byte."
      - name: mbps_to_MBps is correct
        code: |
          assert mbps_to_MBps != 640, "You multiplied. Bytes are bigger than bits, so there are fewer of them: divide."
          assert mbps_to_MBps == 10, f"mbps_to_MBps is {mbps_to_MBps}. There are 8 bits in a byte."
    hints:
      - One byte has 8 bits, which gives 2⁸ = 256 patterns. The first pattern is 0.
      - A kibibyte is 1024 bytes, and each of those bytes holds 8 bits.
      - To turn bits into bytes, divide by 8.
    solution: |
      largest_byte = 2 ** 8 - 1   # 255
      bits_in_kib = 1024 * 8      # 8192
      mbps_to_MBps = 80 / 8       # 10.0
    explanation: |
      A byte's 256 patterns represent 0 to **255**. A kibibyte has 1024 bytes × 8 bits = **8192** bits. And since 8 bits make a byte, 80 megabits are 80 ÷ 8 = **10** megabytes. (Python prints `80 / 8` as `10.0`; the `.0` appears because `/` always produces a number that can have a fraction. You'll learn why in Unit 2.)

  - id: four-bit-formula
    title: A binary decoder
    difficulty: 3
    prompt: |
      Time to teach the computer the place-value rule. The code below is a **function**: a reusable recipe that takes four bits, `b3 b2 b1 b0` (with `b3` the leftmost), and gives back their decimal value. You'll learn functions properly in Unit 2; for now, all you need to do is replace the `0` after `return` with a formula that uses the four bits.

      For example, for the bits 1, 0, 1, 1 your formula should produce 11, and for 1, 1, 1, 1 it should produce 15.
    starter: |
      def to_decimal(b3, b2, b1, b0):
          return 0   # replace 0 with a formula using b3, b2, b1 and b0

      print(to_decimal(1, 0, 1, 1))   # should print 11
    tests:
      - name: 1011 gives 11
        code: |
          assert to_decimal(1, 0, 1, 1) == 11, f"to_decimal(1, 0, 1, 1) gave {to_decimal(1, 0, 1, 1)}"
      - name: 0000 gives 0 and 1111 gives 15
        code: |
          assert to_decimal(0, 0, 0, 0) == 0, f"to_decimal(0, 0, 0, 0) gave {to_decimal(0, 0, 0, 0)}"
          assert to_decimal(1, 1, 1, 1) == 15, f"to_decimal(1, 1, 1, 1) gave {to_decimal(1, 1, 1, 1)}"
      - name: works for every 4-bit pattern
        code: |
          for n in range(16):
              bits = [(n >> k) & 1 for k in (3, 2, 1, 0)]
              got = to_decimal(*bits)
              assert got == n, f"to_decimal{tuple(bits)} gave {got}, expected {n}. Check which place value each bit is multiplied by."
    hints:
      - Each bit is worth its place value when it is 1, and nothing when it is 0. So multiply each bit by its place value.
      - "`b0` is the rightmost bit (worth 1), `b1` is worth 2, `b2` is worth 4 and `b3` is worth 8."
      - "The formula looks like `b3 * 8 + b2 * ? + ...`. Fill in the rest."
    solution: |
      def to_decimal(b3, b2, b1, b0):
          return b3 * 8 + b2 * 4 + b1 * 2 + b0 * 1

      print(to_decimal(1, 0, 1, 1))   # 11
    explanation: |
      Multiplying a bit by its place value gives the place value when the bit is 1 and zero when it is 0. Adding the four products is exactly the "add the place values that are on" rule. You've just written, in four terms, the rule a computer uses to interpret binary, and the same formula extends to any number of bits.

commonMistakes:
  - title: Reading place values from the wrong end
    explanation: |
      Place values grow from **right to left**. The rightmost bit is always worth 1. In `1000`, the 1 is worth 8, not 1. If you write the place values above the bits starting from the right (1, 2, 4, 8...), you won't mix them up.
  - title: Thinking n bits can store numbers up to 2ⁿ
    explanation: |
      n bits give 2ⁿ *patterns*, but one of them is zero, so the largest value is **2ⁿ − 1**. A byte holds 0 to 255, not 0 to 256. This off-by-one error is one of the most common bugs in all of programming, so it's worth getting right now.
  - title: Forgetting the 0b prefix in Python
    explanation: |
      Python assumes numbers are decimal unless told otherwise. `1011` is one thousand and eleven; `0b1011` is eleven.
    wrong: |
      print(1011)    # prints 1011 (one thousand and eleven)
    right: |
      print(0b1011)  # prints 11
  - title: Mixing up bits (b) and bytes (B)
    explanation: |
      Network speeds use bits (Mbps), file sizes use bytes (MB). There are 8 bits in a byte, so to know how long a 100 MB download takes on a 100 Mbps line, divide by 8 first: about 12.5 MB per second, so roughly 8 seconds, not 1.

summary:
  - "Computers store **all** information as numbers, and store numbers using **bits**: 0s and 1s."
  - "Two states are used because transistors are switches, and on/off is reliable to read despite electrical noise."
  - "**n bits give 2ⁿ patterns**; as whole numbers starting at 0, that's 0 to 2ⁿ − 1. A **byte** is 8 bits (0 to 255)."
  - "Binary is **base 2**: place values are 1, 2, 4, 8, 16... from the right. Convert to decimal by adding the place values that hold a 1."
  - "Convert decimal to binary by **dividing by 2** repeatedly and reading the remainders bottom-up."
  - "In Python, `0b1101` is a binary number, `bin(n)` shows binary, `int(text, 2)` reads binary, and `print` displays values."
next: |
  You can now store any whole number in bits. But computers also store text, negative numbers, colours, images and sound. In **Lesson 1.2** you'll learn the clever encodings that turn all of those into bits, plus **hexadecimal**, the shorthand programmers use to write binary without going cross-eyed.

quiz:
  - type: mcq
    question: Why do computers store information in binary rather than decimal?
    options:
      - Binary numbers are shorter than decimal numbers
      - Two states (on/off) are easy to tell apart reliably, even with electrical noise
      - Decimal was invented after computers
      - Binary lets computers store more information per digit
    answer: 1
    explanation: Transistors are switches, and distinguishing on from off is robust. Binary numbers are actually *longer* than decimal ones, and each binary digit holds *less* information. Reliability is the reason.
  - type: mcq
    question: What is the binary number `10010` in decimal?
    options: ["10", "18", "20", "34"]
    answer: 1
    explanation: The place values are 16, 8, 4, 2, 1. The 16 and 2 places hold a 1, so the value is 16 + 2 = 18.
  - type: mcq
    question: How many different values can be represented with **10 bits**?
    options: ["20", "100", "1023", "1024"]
    answer: 3
    explanation: n bits give 2ⁿ patterns, and 2¹⁰ = 1024. (1023 is the largest value if you count from 0.)
  - type: mcq
    question: What is the decimal number **6** in binary?
    options: ["011", "101", "110", "111"]
    answer: 2
    explanation: 6 = 4 + 2, so the 4 and 2 places are on and the 1 place is off, giving 110.
  - type: mcq
    question: What does `print(1101)` display in Python?
    options: ["13", "1101", "0b1101", "An error"]
    answer: 1
    explanation: Without the `0b` prefix Python reads 1101 as the decimal number one thousand one hundred and one, and prints it unchanged.
  - type: mcq
    question: A download is 40 megabytes (MB) and your connection runs at 80 megabits per second (Mbps). About how long will it take?
    options: ["0.5 seconds", "2 seconds", "4 seconds", "320 seconds"]
    answer: 2
    explanation: 80 megabits per second is 80 ÷ 8 = 10 megabytes per second, so 40 MB takes about 4 seconds.
  - type: code
    question: |
      Convert the binary number **101010** to decimal by hand and set `answer` to the result.
    starter: |
      answer = 0
    tests:
      - name: answer is the decimal value of 101010
        code: |
          assert answer == 42, f"You wrote {answer}. Place values from the right are 1, 2, 4, 8, 16, 32."
    solution: |
      answer = 42  # 32 + 8 + 2
