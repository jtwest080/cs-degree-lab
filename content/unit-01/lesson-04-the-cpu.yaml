id: u1-cpu
title: Inside the CPU, the Fetch-Decode-Execute Cycle
minutes: 55
objective: |
  Understand what the **CPU** is made of (ALU, registers, control unit, program counter, clock) and how it runs a program one simple **instruction** at a time through the **fetch-decode-execute cycle**, including how **jumps** create decisions and loops.
outcomes:
  - Name the parts of a CPU and say what each one does
  - Trace a machine-level program step by step, tracking registers and the program counter
  - Explain how conditional jumps let a CPU make decisions and repeat work
  - Write small programs for a simulated CPU
  - Reason about clock speed and how many instructions a CPU can run

prelude: |
  # TOY: a tiny simulated CPU with four registers (A, B, C, D).
  def run_cpu(program, show=False):
      regs = {"A": 0, "B": 0, "C": 0, "D": 0}
      pc = 0
      steps = 0
      while True:
          if not 0 <= pc < len(program):
              raise RuntimeError(f"The program counter is {pc}, which is outside the program. Did you forget a HALT?")
          instr = program[pc]
          steps += 1
          if steps > 10_000:
              raise RuntimeError("The CPU ran more than 10,000 steps. Your program probably loops forever.")
          if not isinstance(instr, tuple) or not instr:
              raise ValueError(f"Instruction {pc} should look like (\"SET\", \"A\", 5), but it is {instr!r}")
          op = instr[0]
          here = pc
          pc += 1
          if op == "SET":
              regs[instr[1]] = instr[2]
          elif op == "ADD":
              regs[instr[1]] = regs[instr[1]] + regs[instr[2]]
          elif op == "SUB":
              regs[instr[1]] = regs[instr[1]] - regs[instr[2]]
          elif op == "JUMP":
              pc = instr[1]
          elif op == "JZ":
              if regs[instr[1]] == 0:
                  pc = instr[2]
          elif op == "PRINT":
              print(regs[instr[1]])
          elif op != "HALT":
              raise ValueError(f"Unknown instruction {op!r} at position {here}")
          if show:
              state = " ".join(f"{r}={v}" for r, v in regs.items())
              args = " ".join(str(x) for x in instr[1:])
              print(f"step {steps:>2} | PC={here:>2} | {op:<5} {args:<8} | {state}")
          if op == "HALT":
              break
      regs["steps"] = steps
      return regs

sections:
  - heading: The CPU is a fast, literal clerk
    body: |
      The **CPU** (central processing unit, or *processor*) is the part of the computer that actually carries out programs. People often call it the "brain", but that's misleading: a CPU doesn't understand anything. A better picture is an incredibly fast, perfectly obedient clerk with a tiny desk, following a numbered list of very simple instructions, one at a time, never skipping ahead and never questioning anything.

      > **Analogy:** Picture the clerk with a list of instructions like "Write 7 on your notepad", "Add the number in box B to your notepad", "If your notepad shows zero, go to step 12". Each instruction is trivial. The clerk's superpower is speed: a modern CPU follows **billions** of them per second.

      Every program you've ever used, from a calculator to a 3D game, is ultimately a long list of such tiny instructions. In this lesson you'll learn the parts of the clerk's desk and exactly how instructions are followed.

  - heading: The parts of a CPU
    body: |
      - **ALU (Arithmetic Logic Unit).** The calculator. It performs arithmetic (add, subtract) and logic operations (AND, OR, NOT, compare). It's built from the gates you met in Lesson 1.3: its adder is a chain of full adders.
      - **Registers.** A handful of tiny, ultra-fast storage slots *inside* the CPU, each holding one number (typically 64 bits). They are the clerk's notepad. Data must usually be in a register before the ALU can work on it.
      - **Program counter (PC).** A special register that holds the position (address) of the **next instruction** to run. It's the clerk's finger, keeping their place in the list.
      - **Control unit.** The manager. It reads each instruction, works out what it means, and sends signals that make the ALU, registers and memory do the right thing.
      - **Clock.** A crystal that ticks billions of times per second. Each tick moves the CPU forward one step. A 3 GHz (gigahertz) CPU ticks 3 billion times per second.

      The CPU works closely with **memory** (RAM), where programs and data are kept while running. You'll explore memory in Lesson 1.5. For now: instructions live in memory, and the PC says which one is next.

  - heading: Instructions and instruction sets
    body: |
      Each kind of CPU understands a fixed vocabulary of instructions called its **instruction set architecture (ISA)**. The two you'll hear about most are **x86-64** (most Windows PCs and servers) and **ARM** (phones, tablets, and Apple's M-series Macs). A program compiled for one won't run directly on the other, because they speak different languages.

      Real instruction sets have hundreds of instructions, but they fall into a few families:

      | Family | Examples | What they do |
      |---|---|---|
      | Data movement | load, store, move | copy numbers between memory and registers |
      | Arithmetic and logic | add, subtract, and, or, compare | compute with the ALU |
      | Control flow | jump, jump-if-zero, call | change which instruction runs next |

      Every instruction is itself stored as a pattern of bits, called **machine code**. For example, on an x86 CPU the bytes `05 07 00 00 00` mean "add 7 to register EAX". The CPU's control unit is a circuit that recognises these patterns.

  - heading: The fetch-decode-execute cycle
    body: |
      A CPU spends its entire life repeating three steps, billions of times per second:

      1. **Fetch.** Read the instruction at the address in the program counter from memory. Add one to the PC so it points to the next instruction.
      2. **Decode.** The control unit works out what the instruction means: which operation, and which registers or values it uses.
      3. **Execute.** Do it: the ALU adds, a register gets a new value, data moves to or from memory, or the PC is changed by a jump.

      Then repeat, forever, until the program ends or the power goes off.

      > **Key idea:** Because the PC normally just goes up by one, instructions run **in order**, top to bottom. The *only* way to break that order is an instruction that changes the PC: a **jump**. That single idea is behind every `if` statement and every loop in every language.

  - heading: Meet TOY, our simulated CPU
    body: |
      Real machine code is hard to read, so in this lesson you'll program **TOY**, a simplified CPU with four registers named **A**, **B**, **C** and **D**, all starting at 0. A TOY program is a list of instructions written in square brackets. Each instruction is in round brackets with its parts separated by commas, and instructions are numbered from **0**:

      | Instruction | Meaning |
      |---|---|
      | `("SET", "A", 5)` | Put the number 5 into register A |
      | `("ADD", "A", "B")` | A = A + B |
      | `("SUB", "A", "B")` | A = A − B |
      | `("JUMP", 4)` | Set the PC to 4 (next, run instruction 4) |
      | `("JZ", "A", 7)` | **J**ump if **Z**ero: if A is 0, set the PC to 7; otherwise carry on |
      | `("PRINT", "A")` | Print the number in A |
      | `("HALT",)` | Stop the program |

      `run_cpu(program)` runs a program and returns the final registers. `run_cpu(program, show=True)` also prints a **trace**: one line per step, showing the PC and every register after the instruction runs. Traces are how engineers see what a processor is really doing.

      Notice that TOY's ADD and SUB only work **between registers**. To add 1 to C, you first put 1 in another register, then add that register. Real CPUs have similar restrictions, which is part of why compiled programs contain so many instructions.

  - heading: Decisions and loops from jumps
    body: |
      With `JZ` (jump if zero), a CPU can choose between two paths, which is a **decision**. With `JUMP` back to an earlier instruction, it can **repeat** work, which is a **loop**. Combine them and you can compute anything a computer can compute.

      Here's a countdown loop that prints 3, 2, 1:

      ```text
      0: SET A 3      A = 3
      1: SET B 1      B = 1 (the amount to subtract each time)
      2: PRINT A
      3: SUB A B      A = A - 1
      4: JZ A 6       if A is 0, jump to 6 (leave the loop)
      5: JUMP 2       otherwise go back to 2 (loop again)
      6: HALT
      ```

      Instructions 2 to 5 are the **loop body**. Instruction 4 is the **exit condition**: without it, the loop would run forever. When you write `while` loops in Unit 2, Python turns them into exactly this pattern of compare-and-jump.

  - heading: How fast is fast?
    body: |
      If a 3 GHz CPU completed one instruction per tick, it would run 3,000,000,000 instructions per second. Light travels only about 10 cm in the time of one tick!

      Real CPUs are both slower and faster than this simple picture:

      - **Slower** because some instructions take many ticks, and waiting for memory can take *hundreds* of ticks (Lesson 1.5 explains why).
      - **Faster** because of **pipelining** (like a laundry line: while one instruction executes, the next is being decoded and the one after is being fetched), running several instructions at once, and having multiple **cores**: several complete CPUs on one chip, each running its own instructions.

      > **Deep dive:** For decades, CPUs got faster mainly by raising the clock speed. Around 2005, chips hit a wall: faster clocks made them too hot. Since then, speed gains have come mostly from more cores and smarter designs. That's why modern software must do many things in parallel to use the hardware fully, a topic you'll study in Unit 10 (Operating Systems).

examples:
  - title: A straight-line program with a trace
    intro: This program computes 7 + 3 and prints it. The trace shows each fetch-decode-execute step.
    code: |
      program = [
          ("SET", "A", 7),      # 0
          ("SET", "B", 3),      # 1
          ("ADD", "A", "B"),    # 2
          ("PRINT", "A"),       # 3
          ("HALT",),            # 4
      ]
      run_cpu(program, show=True)
    output: |
      step  1 | PC= 0 | SET   A 7      | A=7 B=0 C=0 D=0
      step  2 | PC= 1 | SET   B 3      | A=7 B=3 C=0 D=0
      step  3 | PC= 2 | ADD   A B      | A=10 B=3 C=0 D=0
      10
      step  4 | PC= 3 | PRINT A        | A=10 B=3 C=0 D=0
      step  5 | PC= 4 | HALT           | A=10 B=3 C=0 D=0
    lines:
      - line: 1
        note: "A program is a list, written between `[` and `]`. We give it the name `program`."
      - line: 2-3
        note: "Each instruction is in round brackets. The comments `# 0`, `# 1` number them, which you'll need for jumps."
      - line: 4
        note: "ADD puts A + B back into A: the ALU at work."
      - line: 5
        note: "PRINT is how our TOY CPU produces output (real CPUs send data to a screen through memory)."
      - line: 6
        note: "`(\"HALT\",)` stops the CPU. The trailing comma is required by Python for a one-item group."
      - line: 8
        note: "Run it with a trace. Each trace line shows which instruction ran (the PC before it ran) and all registers afterwards. Notice the `10` printed by PRINT appears just before its trace line."
  - title: A loop with a conditional jump
    intro: The countdown from the lesson. Watch the PC jump backwards from 5 to 2, and forwards from 4 to 6 when A reaches zero.
    code: |
      countdown = [
          ("SET", "A", 3),      # 0
          ("SET", "B", 1),      # 1
          ("PRINT", "A"),       # 2  <- loop starts here
          ("SUB", "A", "B"),    # 3
          ("JZ", "A", 6),       # 4  exit when A is 0
          ("JUMP", 2),          # 5  back to the top of the loop
          ("HALT",),            # 6
      ]
      final = run_cpu(countdown)
      print("steps taken:", final["steps"])
    output: |
      3
      2
      1
      steps taken: 14
    lines:
      - line: 2-3
        note: "Set up: A is the counter, B holds the constant 1 because SUB needs a register."
      - line: 4-7
        note: "The loop body. Each time round: print, subtract 1, test for zero, jump back."
      - line: 6
        note: "JZ is the decision. While A isn't zero the PC just moves on to 5; once A is 0 the PC becomes 6."
      - line: 7
        note: "JUMP 2 sends the PC backwards, creating the loop."
      - line: 10-11
        note: "`run_cpu` returns the final register values; `final[\"steps\"]` is how many instructions ran: 2 setup + 4 + 4 + 3 (last loop exits at JZ) + 1 HALT = 14."
  - title: Clock speed arithmetic
    intro: How many instructions could a CPU run in the blink of an eye (about 0.1 seconds)?
    code: |
      ticks_per_second = 3_000_000_000   # 3 GHz
      blink = 0.1                        # seconds
      print(ticks_per_second * blink)
      print(1 / ticks_per_second)        # seconds per tick
    output: |
      300000000.0
      3.333333333333333e-10
    lines:
      - line: 1
        note: "3 GHz means 3 billion ticks per second."
      - line: 3
        note: "300 million ticks in a single blink. Even at several ticks per instruction, that's tens of millions of instructions."
      - line: 4
        note: "One tick lasts a third of a nanosecond. Python shows tiny numbers in scientific notation: `e-10` means × 10⁻¹⁰."

playground:
  prompt: |
    The `run_cpu` simulator is loaded for you. Modify the countdown to start at 5, or make it count by twos (what happens if it starts at an odd number? Predict, then run with `show=True`).
  code: |
    countdown = [
        ("SET", "A", 5),      # 0
        ("SET", "B", 1),      # 1
        ("PRINT", "A"),       # 2
        ("SUB", "A", "B"),    # 3
        ("JZ", "A", 6),       # 4
        ("JUMP", 2),          # 5
        ("HALT",),            # 6
    ]
    run_cpu(countdown, show=True)

exercises:
  - id: trace-straight
    title: Trace a program by hand
    difficulty: 1
    prompt: |
      Without running it, trace this TOY program on paper, writing down A and B after each step. What number is in register **A** when it halts? Set `answer` to it.

      ```text
      0: SET A 7
      1: SET B 3
      2: ADD A B
      3: ADD A A
      4: SUB A B
      5: HALT
      ```

      Then check yourself in the playground above if you like.
    starter: |
      answer = 0
    tests:
      - name: answer is the final value of A
        code: |
          assert answer != 0, "Trace each step: after step 2, A = 10."
          assert answer != 20, "Don't stop early: instruction 4 still subtracts B."
          assert answer == 17, f"You wrote {answer}. After SET, SET, ADD: A=10. ADD A A doubles it. Then subtract B (3)."
    hints:
      - "After instructions 0 to 2, A = 7 + 3 = 10 and B = 3."
      - "`ADD A A` adds A to itself, so A becomes 20."
    solution: |
      answer = 17
    explanation: |
      A=7, then B=3, then A=10, then A=20 (A + A), then A=17 (A − B). Tracing like this, slowly and with a table, is exactly how you'll debug real programs in Unit 2.

  - id: clock-speed
    title: Counting cycles
    difficulty: 1
    prompt: |
      A **2.5 GHz** CPU core completes, on average, **one instruction every 2 ticks**.

      1. Set `ticks` to the number of ticks in **4 milliseconds** (0.004 seconds).
      2. Set `instructions` to how many instructions it completes in that time.
    starter: |
      ticks = 0
      instructions = 0
    tests:
      - name: ticks is correct
        code: |
          assert abs(ticks - 10_000_000) < 1, f"ticks is {ticks}. 2.5 GHz is 2,500,000,000 ticks per second; multiply by 0.004."
      - name: instructions is correct
        code: |
          assert abs(instructions - 5_000_000) < 1, f"instructions is {instructions}. Each instruction takes 2 ticks, so divide ticks by 2."
    hints:
      - "2.5 GHz = 2,500,000,000 ticks per second. Write it in Python as `2_500_000_000`."
      - "ticks = ticks per second × seconds. instructions = ticks ÷ 2."
    solution: |
      ticks = 2_500_000_000 * 0.004   # 10 million
      instructions = ticks / 2        # 5 million
    explanation: |
      2.5 billion ticks per second × 0.004 s = **10 million ticks**, and at 2 ticks per instruction that's **5 million instructions** in 4 ms, which is less time than a single frame of a video game. (Python may print these as `10000000.0` and `5000000.0`; the `.0` is fine.)

  - id: write-add
    title: Your first machine program
    difficulty: 2
    prompt: |
      Write a TOY program that computes **12 + 30** in register A, prints it, and halts. Use `SET`, `ADD`, `PRINT` and `HALT`. The program must actually *add*: don't just `SET` A to the answer.
    starter: |
      program = [
          ("SET", "A", 12),     # 0
          # your instructions here
          ("HALT",),
      ]
      run_cpu(program, show=True)
    tests:
      - name: program ends with A = 42
        code: |
          final = run_cpu(program)
          assert final["A"] == 42, f"When your program halts, A is {final['A']}."
      - name: program prints 42
        code: |
          out, _ = capture(run_cpu, program)
          assert out.strip().split("\n")[-1:] == ["42"], f"Your program printed {out!r}. Add a PRINT of register A before HALT."
      - name: program uses ADD rather than setting 42 directly
        code: |
          assert any(i[0] == "ADD" for i in program), "Use an ADD instruction to do the arithmetic."
          assert not any(i[0] == "SET" and i[2] == 42 for i in program), "Don't SET a register to 42; make the CPU compute it."
    hints:
      - "ADD only works between registers, so first put 30 into another register: `(\"SET\", \"B\", 30),`"
      - "Then `(\"ADD\", \"A\", \"B\"),` and `(\"PRINT\", \"A\"),` before the HALT. Don't forget the commas at the end of each line."
    solution: |
      program = [
          ("SET", "A", 12),     # 0
          ("SET", "B", 30),     # 1
          ("ADD", "A", "B"),    # 2
          ("PRINT", "A"),       # 3
          ("HALT",),            # 4
      ]
      run_cpu(program, show=True)
    explanation: |
      Because the ALU only works on registers, both numbers must be loaded into registers first. Load, operate, output: almost every real machine-code program is made of this pattern, repeated millions of times.

  - id: trace-loop
    title: Predict a loop
    difficulty: 2
    prompt: |
      Trace this program by hand:

      ```text
      0: SET A 10
      1: SET B 3
      2: SET C 0
      3: SET D 1
      4: SUB A B
      5: ADD C D
      6: JZ A 8
      7: JUMP 4
      8: HALT
      ```

      Hmm. Something's wrong. Set `loops_forever` to `True` if this program never halts, or `False` if it does. Then set `why` to the value A takes on the **fourth** time instruction 4 runs.
    starter: |
      loops_forever = None
      why = None
    tests:
      - name: loops_forever is correct
        code: |
          assert loops_forever in (True, False), "Set loops_forever to True or False (no quotes)."
          assert loops_forever is True, "Trace A: 10, 7, 4, 1, ... does it ever equal exactly 0?"
      - name: why is the value of A after the 4th subtraction
        code: |
          assert why == -2, f"why is {why!r}. A goes 10 → 7 → 4 → 1 → ? after four subtractions of 3."
    hints:
      - "Each time round the loop, A goes down by 3: 10, 7, 4, 1, ..."
      - "JZ only jumps when A is *exactly* zero. Does 10 − 3 − 3 − 3 − 3 hit zero, or skip past it?"
    solution: |
      loops_forever = True
      why = -2
    explanation: |
      A goes 10 → 7 → 4 → 1 → **−2** → −5 ... and skips right past zero, so `JZ` never fires and the loop runs forever. This is a classic bug: an exit condition that tests for *exactly equal* when the value can jump over it. You'll meet the same bug in Python `while` loops, where the fix is usually to test `<= 0` instead of `== 0`. (Our simulator stops runaway programs after 10,000 steps; a real CPU would happily loop until you killed the program.)

  - id: multiply-loop
    title: Multiply with a loop
    difficulty: 3
    prompt: |
      TOY has no multiply instruction! Write a program that computes **4 × 6** by adding 4 to A six times, using a loop. When it halts, A must be 24 and the program must have printed 24.

      Suggested plan: A = result (starts at 0), B = 4 (what to add), C = 6 (how many times are left), D = 1 (for counting down). Loop: if C is zero, exit; otherwise add B to A, subtract D from C, and jump back.
    starter: |
      program = [
          ("SET", "A", 0),      # 0  result
          ("SET", "B", 4),      # 1  number to add
          ("SET", "C", 6),      # 2  times left
          ("SET", "D", 1),      # 3  constant 1
          # 4: loop starts here
          ("HALT",),
      ]
      run_cpu(program, show=True)
    tests:
      - name: A is 24 at the end
        code: |
          final = run_cpu(program)
          assert final["A"] == 24, f"A ended as {final['A']}."
      - name: prints 24
        code: |
          out, _ = capture(run_cpu, program)
          assert "24" in out.split(), f"Your program printed {out!r}. Add a PRINT for A after the loop."
      - name: really uses a loop (no shortcut)
        code: |
          assert not any(i[0] == "SET" and len(i) > 2 and i[2] == 24 for i in program), "Don't SET 24 directly."
          assert any(i[0] == "JUMP" for i in program) and any(i[0] == "JZ" for i in program), "Use JZ to exit and JUMP to repeat."
          assert sum(1 for i in program if i[0] == "ADD") <= 2, "Write the ADD once inside a loop rather than repeating it six times."
    hints:
      - "Put the exit test first in the loop: `(\"JZ\", \"C\", ?)` at position 4. The `?` is the position of the instruction just after the loop."
      - "Loop body: `(\"ADD\", \"A\", \"B\")`, `(\"SUB\", \"C\", \"D\")`, then `(\"JUMP\", 4)`."
      - "After the loop (position 8): `(\"PRINT\", \"A\")` then `(\"HALT\",)`. So the JZ should jump to 8."
    solution: |
      program = [
          ("SET", "A", 0),      # 0  result
          ("SET", "B", 4),      # 1  number to add
          ("SET", "C", 6),      # 2  times left
          ("SET", "D", 1),      # 3  constant 1
          ("JZ", "C", 8),       # 4  no times left? leave the loop
          ("ADD", "A", "B"),    # 5  result += 4
          ("SUB", "C", "D"),    # 6  one fewer time left
          ("JUMP", 4),          # 7  go round again
          ("PRINT", "A"),       # 8
          ("HALT",),            # 9
      ]
      run_cpu(program, show=True)
    explanation: |
      Testing the exit condition at the *top* of the loop means that even if C started at 0, the program would correctly give 0. Early CPUs really did multiply this way, with loops of additions; modern CPUs have a dedicated multiplier circuit, but compilers still turn your loops into exactly this compare, work, jump-back pattern.

commonMistakes:
  - title: Forgetting that instructions are numbered from 0
    explanation: |
      The first instruction is number **0**, so a jump to 4 runs the *fifth* instruction. Writing the number in a comment beside every instruction prevents off-by-one jump targets. Counting from zero is standard throughout computing, and you'll see it again with Python lists in Unit 3.
  - title: Loops without a reachable exit
    explanation: |
      A loop needs an exit condition that will definitely become true. Testing for an exact value (`JZ`) when the counter can skip past it causes an infinite loop, as in exercise 4. The CPU won't warn you; it just keeps going.
  - title: Thinking the CPU understands the program
    explanation: |
      The CPU follows instructions mechanically. If the program says to add when you meant subtract, it will add, perfectly and instantly. Almost every bug you'll ever write is a case of the computer doing *exactly what you said* rather than what you meant.
  - title: Confusing registers with memory
    explanation: |
      Registers are a few tiny slots *inside* the CPU; memory (RAM) is a huge separate store. Data is loaded from memory into registers, worked on, and stored back. Lesson 1.5 covers memory.

summary:
  - "The **CPU** runs programs one simple instruction at a time: **ALU** (calculator), **registers** (tiny fast storage), **control unit** (manager), **program counter** (which instruction is next), **clock** (the heartbeat)."
  - "Each CPU family has an **instruction set** (e.g. x86-64, ARM). Instructions are stored as bit patterns called **machine code**."
  - "The CPU repeats **fetch → decode → execute** billions of times a second."
  - "Instructions run in order unless a **jump** changes the PC. Conditional jumps give **decisions**; backward jumps give **loops**."
  - "Clock speed (GHz) is ticks per second, but real performance also depends on pipelining, multiple cores, and waiting for memory."
next: |
  Your TOY CPU kept everything in four registers. Real programs need to store millions or billions of values. In **Lesson 1.5** you'll explore **memory**: how every byte gets an address, why memory is organised as a hierarchy from tiny-and-fast to huge-and-slow, and why that hierarchy matters for the speed of every program you'll write.

quiz:
  - type: mcq
    question: What does the program counter (PC) hold?
    options:
      - The number of programs currently running
      - The address of the next instruction to execute
      - The result of the last calculation
      - How many instructions have run so far
    answer: 1
    explanation: The PC keeps the CPU's place in the program. Fetching an instruction moves it on by one, and jumps change it directly.
  - type: mcq
    question: Which part of the CPU performs addition and logical operations like AND?
    options: [The clock, The control unit, The ALU, The program counter]
    answer: 2
    explanation: The Arithmetic Logic Unit does the computing, and it's built from logic gates like the adders you made in Lesson 1.3.
  - type: mcq
    question: What are the three steps of the instruction cycle, in order?
    options:
      - Decode, fetch, execute
      - Fetch, decode, execute
      - Execute, fetch, decode
      - Fetch, execute, store
    answer: 1
    explanation: The CPU fetches the instruction from memory, decodes what it means, and then executes it.
  - type: mcq
    question: How does a CPU repeat a group of instructions (a loop)?
    options:
      - It copies the instructions many times in memory
      - A jump instruction sets the PC back to an earlier instruction
      - The clock runs backwards
      - The ALU remembers the instructions
    answer: 1
    explanation: Normally the PC moves forward by one; a jump to an earlier address makes the CPU run those instructions again. A conditional jump decides when to stop.
  - type: mcq
    question: Why can't a program compiled for an ARM CPU run directly on an x86 CPU?
    options:
      - ARM programs are too large
      - The two CPUs have different instruction sets, so the machine code means different things
      - x86 CPUs are slower
      - ARM CPUs don't have registers
    answer: 1
    explanation: Machine code is specific to an instruction set architecture. The same bytes mean different instructions, or nothing at all, on another architecture.
  - type: mcq
    question: A 4 GHz CPU completes one instruction per tick. Roughly how many instructions does it complete in one millisecond?
    options: ["4,000", "4 million", "4 billion", "4 thousand billion"]
    answer: 1
    explanation: 4 GHz is 4,000,000,000 ticks per second; a millisecond is a thousandth of a second, so 4,000,000 ticks.
  - type: code
    question: |
      Write a TOY program that computes **20 − 8**, prints the result, and halts. When it halts, register A must hold 12. Use SUB.
    starter: |
      program = [
          ("HALT",),
      ]
    tests:
      - name: A is 12 and it was printed
        code: |
          out, final = capture(run_cpu, program)
          assert final["A"] == 12, f"A ended as {final['A']}."
          assert "12" in out.split(), "Print register A before halting."
          assert any(i[0] == "SUB" for i in program), "Use SUB."
    solution: |
      program = [
          ("SET", "A", 20),
          ("SET", "B", 8),
          ("SUB", "A", "B"),
          ("PRINT", "A"),
          ("HALT",),
      ]
