id: u1-memory
title: Memory, Addresses and the Memory Hierarchy
minutes: 45
objective: |
  Understand how memory stores bytes at numbered **addresses**, how programs and data share that memory, and why computers use a **hierarchy** of storage (registers, caches, RAM, disk) that trades speed for size.
outcomes:
  - Explain addresses and calculate how much memory an address size can reach
  - Work out where multi-byte values and sequences of values sit in memory
  - Describe the memory hierarchy and the reasons it exists
  - Explain caching and locality, and calculate average memory access time

sections:
  - heading: Memory is a very long row of numbered boxes
    body: |
      Your TOY CPU had four registers. A real program needs to keep track of far more: every character of a document, every pixel of an image, every variable in a game. That's what **memory** is for.

      Picture memory as an extremely long row of boxes. Each box holds **one byte** (8 bits), and each box has a number painted on it, called its **address**, starting at 0. A computer with 16 GB of RAM has about 16 billion of these boxes.

      ```text
      address:   0     1     2     3     4     5   ...
      value:   [ 72 ][ 105][ 33 ][ 0  ][ 255][ 7  ] ...
      ```

      The CPU talks to memory with just two operations:

      - **Read (load):** "What's in box 1,000,000?"
      - **Write (store):** "Put 42 in box 1,000,000."

      > **Analogy:** Think of a huge hotel where every room holds a single byte. To deliver or collect something, you need the room number. The CPU never says "the user's name"; it says "the bytes starting at address 5,382,104".

      This kind of memory is called **RAM**, for *random access memory*. "Random access" means any address can be read in the same amount of time, whether it's box 0 or box 15 billion, unlike a cassette tape where you'd have to fast-forward. RAM is also **volatile**: it forgets everything when the power goes off. That's why unsaved work is lost in a power cut.

  - heading: Addresses are numbers too, and that sets limits
    body: |
      An address is just a number, and the CPU stores it in a register with a fixed number of bits. That puts a hard limit on how much memory the CPU can reach. With n-bit addresses there are 2ⁿ different addresses, so 2ⁿ bytes can be addressed.

      | Address size | Addressable memory |
      |---|---|
      | 16 bits | 2¹⁶ = 65,536 bytes (64 KiB) |
      | 32 bits | 2³² ≈ 4.3 billion bytes (4 GiB) |
      | 64 bits | 2⁶⁴ ≈ 18 quintillion bytes |

      This is exactly why 32-bit computers couldn't use more than 4 GB of RAM, and why the industry switched to 64-bit processors in the 2000s. 64-bit addresses can reach more memory than all the computers on Earth combined.

  - heading: Values bigger than one byte
    body: |
      A byte only holds 0 to 255, so bigger values are spread across **several consecutive boxes**. A 32-bit (4-byte) number stored "at address 1000" actually occupies addresses 1000, 1001, 1002 and 1003. A 64-bit number takes 8 boxes.

      When a program stores many values of the same size one after another, finding any one of them is simple arithmetic:

      > **Key idea:** **address of item i = start address + i × size of each item** (counting items from 0). This formula is how arrays, lists and strings are found in memory, and it's why going to the 1,000,000th item is just as fast as going to the 1st: the CPU computes the address directly instead of searching.

      Which byte of a multi-byte number goes first? Most modern CPUs (x86 and usually ARM) are **little-endian**: the *least* significant byte (the "little end") goes at the lowest address. So the 16-bit number `0x1234` is stored as `34` then `12`. Network protocols traditionally use **big-endian** (most significant byte first). The name comes from *Gulliver's Travels*, where two nations go to war over which end of a boiled egg to crack.

  - heading: Programs live in memory too
    body: |
      Here's a profound idea from the 1940s, usually credited to **John von Neumann** and his colleagues: store the **program itself** in the same memory as the data. Instructions are just bytes (machine code), so they can sit in memory boxes like any other bytes. This is called the **stored-program** design, and nearly every computer since has worked this way.

      Before this, "reprogramming" a computer meant physically rewiring it, which could take days. With stored programs, loading a new program is just copying bytes into memory. It's why your computer can switch from a web browser to a game in a second.

      > **Warning:** It also creates risk. If instructions and data share memory, a bug that lets an attacker write data into the wrong place might let them write *instructions*, which the CPU will then run. This is the root of many famous security attacks, which you'll study in Unit 16.

  - heading: The memory hierarchy
    body: |
      Engineers face a frustrating trade-off: memory can be **fast**, **large**, or **cheap**, but not all three. Fast memory must be physically close to the CPU and built from expensive circuits; large memory must be dense and cheap per byte, which makes it slower. So computers use a **hierarchy**:

      | Level | Typical size | Typical time to access | If one CPU tick were 1 second... |
      |---|---|---|---|
      | Registers | about 1 KB | under 1 ns | 1 second |
      | L1 cache | 32 to 64 KB | about 1 ns | 3 seconds |
      | L2 cache | about 1 MB | about 4 ns | 12 seconds |
      | L3 cache | 8 to 64 MB | about 15 ns | 45 seconds |
      | RAM | 8 to 64 GB | about 100 ns | 5 minutes |
      | SSD | 0.5 to 4 TB | about 100,000 ns | 3.5 days |
      | Hard disk | 1 to 20 TB | about 10,000,000 ns | almost a year |

      (Numbers vary between machines; the *ratios* are what matter.)

      Look at that last column. If an add took one second, fetching from RAM would take five minutes, and reading from a hard disk would take a year. **Waiting for data, not computing, is often what makes programs slow.**

      **SSDs** and **hard disks** are **storage**, not memory: they're non-volatile (they keep data without power), but they're far slower. Files live in storage; to work on them, programs load them into RAM.

  - heading: Caches and locality
    body: |
      **Caches** are small, fast memories between the CPU and RAM that automatically keep copies of recently used data. When the CPU needs an address, it checks L1 first, then L2, then L3, and only then goes to RAM.

      - A **cache hit** means the data was found in the cache: fast.
      - A **cache miss** means it wasn't, so the CPU must wait for a slower level.

      > **Analogy:** Your desk (registers and L1) holds the few papers you're using right now. The bookshelf behind you (L2, L3) holds things you've used recently. The library across town (RAM) has everything but takes a trip. The warehouse in another city (disk) has everything ever, but takes days.

      Caches work astonishingly well (often over 95% hit rates) because real programs show **locality**:

      - **Temporal locality:** something used recently will probably be used again soon (like a loop counter).
      - **Spatial locality:** things *near* something used recently will probably be used soon (like the next item in a list). So when a cache fetches one byte, it grabs a whole **cache line** (typically 64 neighbouring bytes).

      We can estimate performance with the **average memory access time**:

      **AMAT = hit time + miss rate × miss penalty**

      With a 1 ns cache, a 5% miss rate and a 100 ns trip to RAM on a miss: 1 + 0.05 × 100 = **6 ns** on average. Without the cache, every access would take 100 ns: the cache makes memory look about 16 times faster.

      This is why, later in the course, you'll find that reading a list in order is much faster than jumping around it randomly, even though both read the same number of items.

examples:
  - title: A model of memory
    intro: Python's `bytearray` is a row of byte-sized boxes, so it makes a good model of RAM. The number in square brackets is the address.
    code: |
      memory = bytearray(8)    # 8 boxes, all 0
      memory[0] = 72           # write to address 0
      memory[1] = 105          # write to address 1
      memory[2] = 33
      print(memory[1])         # read address 1
      print(memory)
      print(len(memory))
    output: |
      105
      bytearray(b'Hi!\x00\x00\x00\x00\x00')
      8
    lines:
      - line: 1
        note: "Create 8 bytes of 'memory', every box set to 0."
      - line: 2-4
        note: "`memory[address] = value` is a **write**. Each box can hold 0 to 255."
      - line: 5
        note: "`memory[address]` is a **read**. Address 1 holds 105."
      - line: 6
        note: "Python shows the bytes as text where it can: 72, 105, 33 are the character codes for `H`, `i`, `!` (Lesson 1.2), and `\\x00` means a byte with value 0. The same bytes are numbers *or* text depending on how you look at them."
      - line: 7
        note: "`len()` gives how many boxes there are."
  - title: Multi-byte values and endianness
    intro: "`to_bytes` shows exactly which bytes a number is stored as, in either byte order."
    code: |
      n = 0x1234
      print(n)
      print(n.to_bytes(2, "little").hex())
      print(n.to_bytes(2, "big").hex())
      print(int.from_bytes(bytes([0x34, 0x12]), "little"))
    output: |
      4660
      3412
      1234
      4660
    lines:
      - line: 1-2
        note: "0x1234 is 4660 in decimal. It needs 2 bytes: `12` and `34`."
      - line: 3
        note: "Little-endian: the low byte `34` is stored first (at the lower address). `.hex()` shows bytes as hex digits."
      - line: 4
        note: "Big-endian: the high byte `12` comes first, which matches how we write numbers."
      - line: 5
        note: "Reading the bytes 34, 12 back as little-endian gives 4660 again. Getting the byte order wrong is a classic bug when computers exchange data."
  - title: Finding item i in memory
    intro: The address formula that makes arrays fast.
    code: |
      start = 2000       # where the first item lives
      size = 4           # each item is a 4-byte number
      print(start + 0 * size)   # item 0
      print(start + 1 * size)   # item 1
      print(start + 7 * size)   # item 7
      print(start + 999_999 * size)
    output: |
      2000
      2004
      2028
      4001996
    lines:
      - line: 1-2
        note: "Items are stored back to back, each taking 4 boxes."
      - line: 3-5
        note: "item i starts at start + i × size. Item 1 starts right after item 0's four bytes."
      - line: 6
        note: "Item 999,999 is found with one multiplication and one addition: no searching. This is called **constant-time** access, an idea you'll study formally in Unit 8."
  - title: Average memory access time
    intro: How much does a cache help?
    code: |
      hit_time = 1        # ns, L1 cache
      miss_rate = 0.05    # 5% of accesses miss
      miss_penalty = 100  # ns to go to RAM
      amat = hit_time + miss_rate * miss_penalty
      print(amat)
      print(miss_penalty / amat)
    output: |
      6.0
      16.666666666666668
    lines:
      - line: 1-3
        note: "Typical numbers: a fast cache, a small miss rate, and a slow trip to RAM on a miss."
      - line: 4
        note: "Every access pays the hit time; only misses also pay the penalty. Multiplication happens before addition."
      - line: 5-6
        note: "On average 6 ns per access, about 16.7 times faster than going to RAM every time. (The long decimal is normal for division; Unit 2 explains why.)"

playground:
  prompt: |
    Experiment with the memory model: what happens if you try `memory[0] = 256` or `memory[8] = 1`? Read the error messages; they tell you exactly what the "hardware" refused to do.
  code: |
    memory = bytearray(8)
    memory[0] = 255
    print(memory[0])
    memory[0] = 256   # what happens?

exercises:
  - id: address-space
    title: How far can addresses reach?
    difficulty: 1
    prompt: |
      An early home computer used **16-bit** addresses, and each address names one byte.

      1. Set `max_bytes` to the number of bytes it could address.
      2. Set `max_address` to the highest address it could use.
    starter: |
      max_bytes = 0
      max_address = 0
    tests:
      - name: max_bytes is correct
        code: |
          assert max_bytes == 65536, f"max_bytes is {max_bytes}. n-bit addresses give 2 ** n addresses."
      - name: max_address is correct
        code: |
          assert max_address != 65536, "Addresses start at 0, so the highest is one less than the count."
          assert max_address == 65535, f"max_address is {max_address}."
    hints:
      - "With 16 bits there are 2 ** 16 different addresses."
      - "Addresses start at 0, so the last address is 2 ** 16 − 1."
    solution: |
      max_bytes = 2 ** 16       # 65,536 (64 KiB)
      max_address = 2 ** 16 - 1 # 65,535
    explanation: |
      2¹⁶ = **65,536** bytes (64 KiB), with addresses 0 to **65,535**. It's the same counting rule as Lesson 1.1: n bits give 2ⁿ patterns, from 0 to 2ⁿ − 1.

  - id: array-address
    title: Address arithmetic
    difficulty: 1
    prompt: |
      A program stores a sequence of 8-byte (64-bit) numbers back to back, starting at address **5000**. Items are numbered from 0.

      1. Set `item_3` to the address where item 3 starts.
      2. Set `item_3_last` to the address of the **last byte** of item 3.
    starter: |
      item_3 = 0
      item_3_last = 0
    tests:
      - name: item_3 is correct
        code: |
          assert item_3 != 5003, "Each item is 8 bytes, not 1. Use start + i × size."
          assert item_3 != 5032, "Items are numbered from 0, so item 3 is the fourth item and starts after 3 items."
          assert item_3 == 5024, f"item_3 is {item_3}. 5000 + 3 × 8."
      - name: item_3_last is correct
        code: |
          assert item_3_last == 5031, f"item_3_last is {item_3_last}. An 8-byte item starting at 5024 covers 5024 to 5031."
    hints:
      - "Use the formula: start + i × size."
      - "An 8-byte item occupies 8 consecutive addresses. If it starts at s, its last byte is at s + 7."
    solution: |
      item_3 = 5000 + 3 * 8      # 5024
      item_3_last = item_3 + 7   # 5031
    explanation: |
      Item 3 begins after items 0, 1 and 2 (24 bytes), at **5024**, and its 8 bytes run to **5031**. You'll use exactly this arithmetic when you work with arrays and pointers in C in Unit 9.

  - id: little-endian
    title: Read a memory dump
    difficulty: 2
    prompt: |
      A debugger shows these bytes in memory, starting at the lowest address:

      ```text
      address:  0x40  0x41  0x42  0x43
      byte:     0x78  0x56  0x34  0x12
      ```

      They hold one **4-byte little-endian** number. Set `value` to that number. You may write it in hex (`0x...`) in Python.
    starter: |
      value = 0
    tests:
      - name: value is the little-endian interpretation
        code: |
          assert value != 0x78563412, "That's the big-endian reading. In little-endian, the byte at the LOWEST address is the LEAST significant."
          assert value == 0x12345678, f"value is {hex(value) if isinstance(value, int) else value}. Reverse the byte order."
    hints:
      - "In little-endian, the first byte (lowest address) is the *least* significant, the 'ones' end of the number."
      - "So read the bytes in reverse order: 12, 34, 56, 78."
    solution: |
      value = 0x12345678   # 305419896
    explanation: |
      Little-endian stores the least significant byte first, so reading from the highest address down gives `12 34 56 78`: **0x12345678**. Reading memory dumps like this is a real skill in debugging and security work.

  - id: amat
    title: Is the cache worth it?
    difficulty: 2
    prompt: |
      A CPU's cache has a hit time of **2 ns**. Going to RAM on a miss costs an extra **80 ns**. The hit rate is **90%**.

      1. Set `miss_rate` (as a fraction, e.g. 0.25 for 25%).
      2. Set `amat` to the average memory access time in ns.
      3. Set `speedup` to how many times faster this is than always paying 80 ns (that is, 80 ÷ amat).
    starter: |
      miss_rate = 0
      amat = 0
      speedup = 0
    tests:
      - name: miss_rate is correct
        code: |
          assert abs(miss_rate - 0.1) < 1e-9, f"miss_rate is {miss_rate}. If 90% hit, what fraction miss?"
      - name: amat is correct
        code: |
          assert abs(amat - 10) < 1e-9, f"amat is {amat}. AMAT = hit time + miss rate × miss penalty."
      - name: speedup is correct
        code: |
          assert abs(speedup - 8) < 1e-9, f"speedup is {speedup}. Divide 80 by amat."
    hints:
      - "A 90% hit rate means a 10% miss rate: 0.1."
      - "amat = 2 + 0.1 × 80"
    solution: |
      miss_rate = 0.1
      amat = 2 + miss_rate * 80   # 10 ns
      speedup = 80 / amat         # 8 times faster
    explanation: |
      Every access pays the 2 ns hit time, and the 10% that miss also pay 80 ns: 2 + 0.1 × 80 = **10 ns**. That's **8×** faster than going to RAM every time. Improving the hit rate to 98% would bring it down to 3.6 ns, which is why CPU designers obsess over caches.

  - id: two-level-cache
    title: A two-level cache
    difficulty: 3
    prompt: |
      Real CPUs have several cache levels. Write a function `amat(hit_time, miss_rate, miss_penalty)` that returns the average memory access time using the formula from the lesson.

      Then use it to set `two_level` for this machine:

      - L1 cache: 1 ns, misses 10% of the time. On a miss, go to L2.
      - L2 cache: 5 ns, misses 20% of the time. On a miss, go to RAM.
      - RAM: 100 ns.

      The trick: the **miss penalty of L1 is the whole average access time of L2**.
    starter: |
      def amat(hit_time, miss_rate, miss_penalty):
          return 0

      two_level = 0
      print(two_level)
    tests:
      - name: amat function works
        code: |
          assert abs(amat(1, 0.05, 100) - 6) < 1e-9, f"amat(1, 0.05, 100) gave {amat(1, 0.05, 100)}, expected 6."
          assert abs(amat(2, 0.5, 10) - 7) < 1e-9, f"amat(2, 0.5, 10) gave {amat(2, 0.5, 10)}, expected 7."
      - name: two_level is correct
        code: |
          assert abs(two_level - 3.5) < 1e-9, f"two_level is {two_level}. First find L2's average time (5 + 0.2 × 100), then use that as L1's miss penalty."
    hints:
      - "The function body is the formula: `return hit_time + miss_rate * miss_penalty`."
      - "L2's average time is `amat(5, 0.2, 100)`, which is 25 ns."
      - "Then `two_level = amat(1, 0.1, amat(5, 0.2, 100))`."
    solution: |
      def amat(hit_time, miss_rate, miss_penalty):
          return hit_time + miss_rate * miss_penalty

      two_level = amat(1, 0.1, amat(5, 0.2, 100))
      print(two_level)   # 3.5
    explanation: |
      L2's average time is 5 + 0.2 × 100 = 25 ns. Only 10% of accesses even get to L2, so the overall average is 1 + 0.1 × 25 = **3.5 ns**, nearly 30 times faster than RAM. Using one function's result as another's input (*composition*) is a key programming idea you'll use constantly.

commonMistakes:
  - title: Confusing memory (RAM) with storage (disk)
    explanation: |
      RAM is fast and temporary; storage (SSD, hard disk) is slow and permanent. "My laptop has 16 GB of memory and 512 GB of storage" describes two different things. Running programs use RAM; saved files live in storage.
  - title: Forgetting that multi-byte values take several addresses
    explanation: |
      A 4-byte number at address 1000 also uses 1001, 1002 and 1003. The next 4-byte item starts at 1004, not 1001. Forgetting this leads to overlapping data, one of the nastiest bugs in languages like C.
  - title: Counting items from 1 in the address formula
    explanation: |
      With the formula start + i × size, the first item is i = 0. Item "number 3" in everyday speech is i = 2. Most programming languages count from 0 precisely because of this formula.
  - title: Assuming all memory accesses cost the same
    explanation: |
      A cache hit can be 100 times faster than a trip to RAM. Two programs doing the same amount of work can differ hugely in speed depending on how they access memory. Keep locality in mind, and you'll write faster code later.

summary:
  - "Memory is a row of byte-sized boxes, each with a numbered **address**. The CPU **reads** and **writes** by address."
  - "**RAM** is random access (every address equally fast) and volatile (lost without power)."
  - "n-bit addresses reach 2ⁿ bytes, which is why 32-bit machines were limited to 4 GiB."
  - "Multi-byte values use consecutive addresses. **Item i is at start + i × size.** Byte order is little-endian on most CPUs."
  - "In the **stored-program** design, instructions live in memory alongside data."
  - "The **memory hierarchy** (registers, caches, RAM, SSD, disk) trades speed for size. **Caches** exploit **locality**; AMAT = hit time + miss rate × miss penalty."
next: |
  You now understand the hardware: bits, gates, the CPU and memory. One mystery remains. You write code in a language like Python, but the CPU only understands machine code. In **Lesson 1.6**, the last lesson of this unit, you'll discover how human-readable code becomes instructions, through **assemblers**, **compilers** and **interpreters**, and you'll peek at the instructions Python itself creates from your code.

quiz:
  - type: mcq
    question: What is a memory address?
    options:
      - The location of the computer on the internet
      - A number identifying one box (byte) in memory
      - The value stored in a register
      - The name of a variable
    answer: 1
    explanation: Memory is a long sequence of byte-sized boxes, and each one is identified by its number, its address.
  - type: mcq
    question: Why can a 32-bit CPU use at most about 4 GB of RAM?
    options:
      - 32-bit chips run too hot for more memory
      - With 32-bit addresses there are only 2³² ≈ 4.3 billion different addresses
      - RAM chips only came in 4 GB sizes
      - The operating system limits it
    answer: 1
    explanation: Each byte needs its own address. 32 bits give 2³² addresses, so about 4.3 billion bytes.
  - type: mcq
    question: Items of 2 bytes each are stored from address 100. Where does item 5 start (counting from item 0)?
    options: ["105", "110", "112", "120"]
    answer: 1
    explanation: start + i × size = 100 + 5 × 2 = 110.
  - type: mcq
    question: Why do computers have a memory hierarchy instead of just one big fast memory?
    options:
      - Fast memory is expensive and must be close to the CPU, so it can't also be huge and cheap
      - It's a historical accident that newer computers are removing
      - Slow memory uses less electricity, so it's always better
      - The CPU can only connect to small memories
    answer: 0
    explanation: Speed, size and cost pull against each other. A hierarchy gives the illusion of memory that is both large and fast.
  - type: mcq
    question: A program loops through a list from start to end. Which kind of locality does this mainly benefit from?
    options: [Temporal locality, Spatial locality, Neither, Network locality]
    answer: 1
    explanation: Each next item is right beside the previous one in memory, so the cache line fetched for one item already contains the next ones. That's spatial locality.
  - type: mcq
    question: What happens to the contents of RAM when the power is switched off?
    options:
      - They are saved to the cache
      - They are kept until next time
      - They are lost, because RAM is volatile
      - They are moved to registers
    answer: 2
    explanation: RAM needs power to hold its contents. Storage (SSD or disk) is non-volatile, which is why you save files.
  - type: code
    question: |
      Write `item_address(start, i, size)` that returns the address of item `i` in a sequence of equal-sized items beginning at `start` (items counted from 0).
    starter: |
      def item_address(start, i, size):
          return 0
    tests:
      - name: computes start + i * size
        code: |
          assert item_address(2000, 0, 4) == 2000, f"item_address(2000, 0, 4) gave {item_address(2000, 0, 4)}"
          assert item_address(2000, 7, 4) == 2028, f"item_address(2000, 7, 4) gave {item_address(2000, 7, 4)}"
          assert item_address(100, 5, 2) == 110, f"item_address(100, 5, 2) gave {item_address(100, 5, 2)}"
    solution: |
      def item_address(start, i, size):
          return start + i * size
