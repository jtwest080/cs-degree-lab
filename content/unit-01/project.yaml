title: Build a 4-Bit Adder from NAND Gates
brief: |
  In this project you'll build a working adding machine, starting from a single kind of logic gate. This is the same journey hardware engineers take: from one universal gate, to a complete set of gates, to adders, to a circuit that adds real numbers.

  You're given exactly two helpers (already loaded, you don't need to write them):

  - `NAND(a, b)`: the only gate you get. Everything else must be built from it.
  - `bit(n, k)`: returns bit number `k` of the whole number `n` (bit 0 is the rightmost). For example, 6 is binary `0110`, so `bit(6, 0)` is 0, `bit(6, 1)` is 1, `bit(6, 2)` is 1 and `bit(6, 3)` is 0. This plays the role of the wires coming into your circuit.

  When you're done, `add4(a, b)` will add any two numbers from 0 to 15, entirely through gates you built yourself, with no `+` between the numbers anywhere.

  **Rules:** don't use the operators `&`, `|` or `^` anywhere (that would be cheating: those *are* gates). You may use `+` and `*` only in the last line of `add4`, to combine the output bits back into a number.
steps:
  - title: Build the basic gates from NAND
    body: |
      Write `NOT`, `AND`, `OR` and `XOR` using only `NAND` and gates you've already built. Some useful facts from Lesson 1.3:

      - NAND(a, a) is NOT a.
      - AND is NOT NAND.
      - By De Morgan's law, a OR b = NAND(NOT a, NOT b).
      - XOR means "at least one, but not both": (a OR b) AND (NOT both).

      Test each one by printing its truth table before moving on.
  - title: Build a half adder
    body: |
      `half_sum(a, b)` and `half_carry(a, b)`, using your gates.
  - title: Build a full adder
    body: |
      `full_sum(a, b, cin)` and `full_carry(a, b, cin)`, using your gates (or your half adder functions). Check all 8 rows: carry × 2 + sum should equal a + b + cin.
  - title: Chain four full adders
    body: |
      In `add4(a, b)`, use `bit()` to get the four bits of each number. Feed bit 0 of each into a full adder with a carry-in of 0. Its carry-out becomes the carry-in for bit 1, and so on up to bit 3. The carry out of bit 3 is the fifth bit of the answer (because 15 + 15 = 30 needs 5 bits).

      Finally, combine the result bits into a number: s0 × 1 + s1 × 2 + s2 × 4 + s3 × 8 + carry × 16. (You wrote this formula in Lesson 1.1's binary decoder exercise.)
  - title: Trace it by hand
    body: |
      Pick 7 + 9 and trace it through your four full adders on paper, column by column, writing down every sum and carry. Watch the carry ripple all the way from bit 0 to bit 4. This is why it's called a **ripple-carry adder**.
checklist:
  - text: NOT, AND, OR and XOR give correct truth tables
    test: gates have correct truth tables
  - text: Gates are built only from NAND (no &, | or ^ in your code)
    test: no shortcut operators
  - text: The half adder adds two bits correctly
    test: half adder adds two bits
  - text: The full adder adds three bits correctly
    test: full adder adds three bits
  - text: add4(3, 5) gives 8
    test: add4 adds 3 + 5
  - text: add4 is correct for all 256 pairs of 4-bit numbers
    test: add4 is correct for all 256 pairs
  - text: I traced 7 + 9 by hand through all four full adders and saw the carry ripple
  - text: I added a comment to each function explaining what it does
  - text: I can explain why add4 needs a fifth output bit
prelude: |
  def NAND(a, b):
      """The only gate you start with."""
      return 1 - (a & b)

  def bit(n, k):
      """Bit number k of n (bit 0 is the rightmost)."""
      return (n >> k) & 1
starter: |
  # Unit 1 project: a 4-bit adder built from NAND gates.
  # NAND(a, b) and bit(n, k) are provided for you.

  # ---- Step 1: gates from NAND ----
  def NOT(a):
      return 0

  def AND(a, b):
      return 0

  def OR(a, b):
      return 0

  def XOR(a, b):
      return 0

  # ---- Step 2: half adder ----
  def half_sum(a, b):
      return 0

  def half_carry(a, b):
      return 0

  # ---- Step 3: full adder ----
  def full_sum(a, b, cin):
      return 0

  def full_carry(a, b, cin):
      return 0

  # ---- Step 4: 4-bit ripple-carry adder ----
  def add4(a, b):
      # Column 0 (carry in is 0)
      s0 = full_sum(bit(a, 0), bit(b, 0), 0)
      c1 = full_carry(bit(a, 0), bit(b, 0), 0)
      # Columns 1, 2 and 3: your turn

      return 0   # combine the bits: s0*1 + s1*2 + s2*4 + s3*8 + c4*16

  print("3 + 5 =", add4(3, 5))
  print("7 + 9 =", add4(7, 9))
  print("15 + 15 =", add4(15, 15))
tests:
  - name: gates have correct truth tables
    code: |
      for a in (0, 1):
          assert NOT(a) == 1 - a, f"NOT({a}) gave {NOT(a)}"
          for b in (0, 1):
              assert AND(a, b) == (a and b), f"AND({a}, {b}) gave {AND(a, b)}"
              assert OR(a, b) == (a or b), f"OR({a}, {b}) gave {OR(a, b)}"
              assert XOR(a, b) == (1 if a != b else 0), f"XOR({a}, {b}) gave {XOR(a, b)}"
  - name: no shortcut operators
    code: |
      for ch in "&|^":
          assert ch not in source, f"Your code uses the {ch} operator. Build everything from NAND instead."
      import re
      assert not re.search(r"\ba\s*\+\s*b\b", source), "add4 must not compute a + b directly; chain your full adders."
  - name: half adder adds two bits
    code: |
      for a in (0, 1):
          for b in (0, 1):
              s, c = half_sum(a, b), half_carry(a, b)
              assert c * 2 + s == a + b, f"half adder: {a} + {b} gave carry={c}, sum={s}"
  - name: full adder adds three bits
    code: |
      for a in (0, 1):
          for b in (0, 1):
              for cin in (0, 1):
                  s, c = full_sum(a, b, cin), full_carry(a, b, cin)
                  assert s in (0, 1) and c in (0, 1), f"full adder outputs must be bits, got sum={s}, carry={c}"
                  assert c * 2 + s == a + b + cin, f"full adder: {a} + {b} + {cin} gave carry={c}, sum={s}"
  - name: add4 adds 3 + 5
    code: |
      assert add4(3, 5) == 8, f"add4(3, 5) gave {add4(3, 5)}"
  - name: add4 is correct for all 256 pairs
    code: |
      for a in range(16):
          for b in range(16):
              got = add4(a, b)
              assert got == a + b, f"add4({a}, {b}) gave {got}, expected {a + b}. Check that each column's carry feeds the next column, and that the last carry is the 16s bit."
solution: |
  # Unit 1 project: a 4-bit adder built from NAND gates.

  # ---- Step 1: gates from NAND ----
  def NOT(a):
      # NAND of a signal with itself flips it.
      return NAND(a, a)

  def AND(a, b):
      # AND is the opposite of NAND.
      return NOT(NAND(a, b))

  def OR(a, b):
      # De Morgan: a OR b = NOT(NOT a AND NOT b) = NAND(NOT a, NOT b)
      return NAND(NOT(a), NOT(b))

  def XOR(a, b):
      # At least one (OR) and not both (NAND).
      return AND(OR(a, b), NAND(a, b))

  # ---- Step 2: half adder ----
  def half_sum(a, b):
      return XOR(a, b)

  def half_carry(a, b):
      return AND(a, b)

  # ---- Step 3: full adder (two half adders and an OR) ----
  def full_sum(a, b, cin):
      return half_sum(half_sum(a, b), cin)

  def full_carry(a, b, cin):
      return OR(half_carry(a, b), half_carry(half_sum(a, b), cin))

  # ---- Step 4: 4-bit ripple-carry adder ----
  def add4(a, b):
      s0 = full_sum(bit(a, 0), bit(b, 0), 0)
      c1 = full_carry(bit(a, 0), bit(b, 0), 0)
      s1 = full_sum(bit(a, 1), bit(b, 1), c1)
      c2 = full_carry(bit(a, 1), bit(b, 1), c1)
      s2 = full_sum(bit(a, 2), bit(b, 2), c2)
      c3 = full_carry(bit(a, 2), bit(b, 2), c2)
      s3 = full_sum(bit(a, 3), bit(b, 3), c3)
      c4 = full_carry(bit(a, 3), bit(b, 3), c3)
      # The final carry is the 16s place: 15 + 15 = 30 needs 5 bits.
      return s0 * 1 + s1 * 2 + s2 * 4 + s3 * 8 + c4 * 16

  print("3 + 5 =", add4(3, 5))
  print("7 + 9 =", add4(7, 9))
  print("15 + 15 =", add4(15, 15))
stretch:
  - "Count how many NAND gates one call to `full_sum` and `full_carry` uses. (Add a counter inside a wrapper around NAND.) Real chip designers minimise exactly this number."
  - "Extend it to an 8-bit adder `add8(a, b)` for numbers 0 to 255. How many full adders do you need?"
  - "Build a **subtractor**: in two's complement, a − b = a + (NOT b) + 1. Flip each bit of b with your NOT gate and use a carry-in of 1 for column 0. Test `sub4(9, 3)`."
  - "Make the code shorter: could `add4` be written for any number of bits? (You'll learn the tool for this, loops, in Unit 2.)"
