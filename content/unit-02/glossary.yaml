# Terms introduced in Unit 2. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Program
    definition: A sequence of statements that a computer carries out, in order, to perform a task.
    lesson: u2-first-programs
  - term: Statement
    definition: A single instruction in a program, such as a call to `print` or an assignment. Python runs statements one at a time, top to bottom.
    lesson: u2-first-programs
  - term: Sequential execution
    definition: The rule that statements run one after another in the order they're written, unless a decision or loop changes the flow.
    lesson: u2-first-programs
  - term: Function call
    definition: Running a function by writing its name followed by brackets containing any arguments, like `print("hi")`.
    lesson: u2-first-programs
  - term: Argument
    definition: A value passed to a function when calling it. In `print("hi", 5)`, the arguments are `"hi"` and `5`.
    lesson: u2-first-programs
  - term: String (str)
    definition: A sequence of characters, written between matching quotes. Python's type for text.
    lesson: u2-first-programs
  - term: Escape sequence
    definition: A backslash followed by a character, used to put special characters inside a string, such as `\n` (new line) and `\t` (tab).
    lesson: u2-first-programs
  - term: Expression
    definition: Code that Python evaluates to produce a value, such as `3 * 7`, `name`, or `len("hi") + 1`.
    lesson: u2-first-programs
  - term: Case-sensitive
    definition: Treating uppercase and lowercase letters as different. In Python, `print` and `Print` are different names.
    lesson: u2-first-programs
  - term: NameError
    definition: The error Python raises when code uses a name that hasn't been defined, often because of a typo.
    lesson: u2-first-programs
  - term: Variable
    definition: A name that refers to a value, so the value can be used and updated later.
    lesson: u2-variables
  - term: Assignment
    definition: Binding a name to a value with `=`. Python evaluates the right-hand side first, then makes the name on the left refer to the result.
    lesson: u2-variables
  - term: Augmented assignment
    definition: A shortcut that updates a variable using its current value, such as `count += 1` for `count = count + 1`.
    lesson: u2-variables
  - term: snake_case
    definition: The Python naming convention of lowercase words joined by underscores, like `total_price`.
    lesson: u2-variables
  - term: Keyword
    definition: A word reserved by Python for its own syntax, such as `if`, `for`, `def` and `True`. Keywords can't be used as variable names.
    lesson: u2-variables
  - term: Floor division (//)
    definition: Division that rounds down to a whole number. `17 // 5` is 3.
    lesson: u2-variables
  - term: Modulo (%)
    definition: The remainder after division. `17 % 5` is 2. Used for even/odd tests, wrapping around, and taking numbers apart.
    lesson: u2-variables
  - term: Operator precedence
    definition: The rules for which operators are evaluated first in an expression, e.g. `*` before `+`. Brackets override precedence.
    lesson: u2-variables
  - term: Type
    definition: The kind of a value, which determines what it represents and which operations work on it, e.g. `int`, `float`, `str`, `bool`.
    lesson: u2-types
  - term: Integer (int)
    definition: Python's type for whole numbers. Python ints can be arbitrarily large.
    lesson: u2-types
  - term: Float
    definition: Python's type for numbers with a fractional part, stored in binary floating point, so many decimals are approximations.
    lesson: u2-types
  - term: Boolean (bool)
    definition: The type with exactly two values, `True` and `False`, produced by comparisons and used in decisions.
    lesson: u2-types
  - term: Type conversion
    definition: Creating a value of one type from a value of another, e.g. `int("42")`, `str(7)`, `float("2.5")`.
    lesson: u2-types
  - term: Method
    definition: A function that belongs to a value and is called with a dot, like `name.upper()`.
    lesson: u2-types
  - term: Concatenation
    definition: Joining strings end to end with `+`, e.g. `"Hello, " + "world"`.
    lesson: u2-types
  - term: Immutable
    definition: Unable to be changed after it's created. Strings are immutable; methods like `.upper()` return new strings.
    lesson: u2-types
  - term: Dynamic typing
    definition: A language design where types belong to values, not variables, and are checked while the program runs. Python is dynamically typed.
    lesson: u2-types
  - term: TypeError
    definition: The error raised when an operation is applied to a value of an unsuitable type, such as `"5" + 1`.
    lesson: u2-types
  - term: ValueError
    definition: The error raised when a value has the right type but an unacceptable value, such as `int("hello")`.
    lesson: u2-types
  - term: input()
    definition: A built-in function that shows a prompt, waits for the user to type a line, and returns it as a string.
    lesson: u2-io
  - term: Prompt
    definition: The text shown to the user to tell them what to type.
    lesson: u2-io
  - term: f-string
    definition: "A string prefixed with `f` in which expressions inside `{braces}` are evaluated and inserted, e.g. `f\"Total: {total}\"`."
    lesson: u2-io
  - term: Format specification
    definition: Instructions after a colon in an f-string's braces that control how a value is displayed, e.g. `{price:.2f}`, `{n:>5}`, `{x:,}`.
    lesson: u2-io
  - term: Input, process, output
    definition: A basic structure for programs - read the data, compute with it, then present the results.
    lesson: u2-io
  - term: Condition
    definition: An expression that evaluates to True or False, used to decide what a program does next.
    lesson: u2-conditionals
  - term: Comparison operator
    definition: An operator that compares two values and produces a bool - `==`, `!=`, `<`, `>`, `<=`, `>=`.
    lesson: u2-conditionals
  - term: if statement
    definition: A statement that runs its indented block only when its condition is True. Can be extended with `elif` and `else`.
    lesson: u2-conditionals
  - term: Block
    definition: A group of statements that belong together, such as the body of an `if` or a loop. In Python, blocks are marked by indentation.
    lesson: u2-conditionals
  - term: Indentation
    definition: Spaces at the start of a line. Python uses indentation (4 spaces per level) to show which statements belong to which block.
    lesson: u2-conditionals
  - term: Logical operators
    definition: "`and`, `or` and `not`, which combine or invert boolean values."
    lesson: u2-conditionals
  - term: Short-circuit evaluation
    definition: Stopping the evaluation of `and`/`or` as soon as the result is known. In `a and b`, `b` isn't evaluated if `a` is False.
    lesson: u2-conditionals
  - term: Truthiness
    definition: How Python treats non-boolean values in conditions. `0`, `0.0` and `""` count as False; most other values count as True.
    lesson: u2-conditionals
  - term: Boundary testing
    definition: Testing values exactly at, just below and just above the edges of conditions, where off-by-one bugs usually hide.
    lesson: u2-conditionals
  - term: Loop
    definition: A statement that repeats a block of code.
    lesson: u2-while
  - term: while loop
    definition: A loop that repeats its body as long as its condition is True, checking the condition before each iteration.
    lesson: u2-while
  - term: Iteration
    definition: One run through the body of a loop.
    lesson: u2-while
  - term: Counter
    definition: A variable that counts how many times something happens, usually starting at 0 and increasing by 1.
    lesson: u2-while
  - term: Accumulator
    definition: A variable that builds up a result across loop iterations, such as a running total.
    lesson: u2-while
  - term: Sentinel value
    definition: A special input value that signals the end of the data, such as 0 or "done".
    lesson: u2-while
  - term: break
    definition: A statement that immediately exits the innermost loop.
    lesson: u2-while
  - term: Infinite loop
    definition: A loop whose condition never becomes False, so it never ends on its own.
    lesson: u2-while
  - term: for loop
    definition: A loop that runs its body once for each item in a sequence, such as the numbers from `range()` or the characters of a string.
    lesson: u2-for
  - term: range()
    definition: Produces a sequence of whole numbers. `range(start, stop, step)` starts at `start` and stops before `stop`.
    lesson: u2-for
  - term: Loop variable
    definition: The variable in a `for` loop that refers to each item of the sequence in turn.
    lesson: u2-for
  - term: Nested loop
    definition: A loop inside another loop. The inner loop runs completely for each iteration of the outer loop.
    lesson: u2-for
  - term: continue
    definition: A statement that skips the rest of the current loop iteration and moves on to the next one.
    lesson: u2-for
  - term: Flag
    definition: A boolean variable that records whether something has happened, such as whether a divisor was found.
    lesson: u2-for
  - term: Function definition
    definition: Code starting with `def` that creates a named, reusable function with parameters and a body.
    lesson: u2-functions
  - term: Parameter
    definition: A name in a function definition that receives a value when the function is called.
    lesson: u2-functions
  - term: Return value
    definition: The value a function hands back to its caller with `return`. A function call evaluates to its return value.
    lesson: u2-functions
  - term: None
    definition: Python's special value meaning "no value". Functions without a `return` return None.
    lesson: u2-functions
  - term: Call stack
    definition: The stack of active function calls. Each call pushes a frame holding its local variables; each return pops it.
    lesson: u2-functions
  - term: Local variable
    definition: A variable created inside a function. It exists only during that function call.
    lesson: u2-functions
  - term: Global variable
    definition: A variable created at the top level of a program, outside any function.
    lesson: u2-functions
  - term: Scope
    definition: The region of a program where a name can be used. Python has local (function) and global (module) scope.
    lesson: u2-functions
  - term: Default parameter
    definition: A parameter with a value used when the caller doesn't supply one, e.g. `def greet(name, greeting="Hello")`.
    lesson: u2-functions
  - term: Keyword argument
    definition: An argument passed by naming its parameter, e.g. `print("a", end="")`.
    lesson: u2-functions
  - term: Docstring
    definition: A string at the start of a function body describing what the function does. Shown by `help()` and editors.
    lesson: u2-functions
  - term: Decomposition
    definition: Breaking a problem into smaller parts, often separate functions, that can be solved and tested independently.
    lesson: u2-functions
  - term: DRY
    definition: "Don't Repeat Yourself: write each piece of logic once, usually as a function, and reuse it."
    lesson: u2-functions
  - term: Bug
    definition: A mistake in a program that makes it behave incorrectly.
    lesson: u2-debugging
  - term: Debugging
    definition: The systematic process of finding and fixing bugs.
    lesson: u2-debugging
  - term: Logic error
    definition: A bug that makes a program produce wrong results without any error message.
    lesson: u2-debugging
  - term: Exception
    definition: An error that happens while a program runs. If not handled, it stops the program and prints a traceback.
    lesson: u2-debugging
  - term: Traceback
    definition: The report Python prints for an unhandled exception, showing the chain of calls that led to the error. Read it from the bottom up.
    lesson: u2-debugging
  - term: assert
    definition: A statement that checks a condition and raises an AssertionError if it's False. Used to write tests.
    lesson: u2-debugging
  - term: Edge case
    definition: An unusual or extreme input, such as zero, a negative number or an empty string, that a program must still handle correctly.
    lesson: u2-debugging
  - term: try / except
    definition: A statement that runs a block of code and, if a specified exception happens, runs a handler instead of crashing.
    lesson: u2-debugging
  - term: Mutation testing
    definition: Checking the strength of tests by making small deliberate bugs (mutants) in the code and seeing whether the tests catch them.
    lesson: u2-debugging
  - term: Rubber duck debugging
    definition: Explaining your code line by line, out loud, to an object or person. Doing so often reveals the bug.
    lesson: u2-debugging
