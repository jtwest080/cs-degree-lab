id: u2-first-programs
title: Your First Programs, Statements, print and Errors
minutes: 40
objective: |
  Write complete Python programs that produce output, understand that a program is a **sequence of statements** run top to bottom, work with **strings** in `print`, and read Python's **error messages** without panic.
outcomes:
  - Explain what a program and a statement are, and the order statements run in
  - Use `print` with strings, numbers, several values, and the `sep` and `end` options
  - Write strings with quotes, escape characters and new lines
  - Use comments to explain code
  - Recognise a syntax error and a name error and fix them

sections:
  - heading: What is a program?
    body: |
      In Unit 1 you saw that a CPU follows a list of instructions, one after another. A **program** written in Python is the same idea at a much higher level: a list of **statements**, each one an instruction for Python to carry out.

      ```python
      print("Hello!")
      print("Welcome to programming.")
      ```

      This program has two statements. Python runs them **in order, from top to bottom**, one at a time, just as the TOY CPU's program counter moved through instructions. This simple rule, called **sequential execution**, is the foundation everything else builds on. Later you'll learn statements that change the order (decisions and loops), which are Python's versions of the jumps you met in Lesson 1.4.

      > **Key idea:** Computers do exactly what you write, in exactly the order you write it. When a program misbehaves, the question is never "why is the computer being difficult?" but "what did I actually tell it to do?"

      Python is a great first language because it reads almost like English, it's used everywhere from websites to scientific research to AI, and (as you learned in Lesson 1.6) it runs your code immediately without a separate compile step.

  - heading: print shows values
    body: |
      `print(...)` is a **function**: a named, ready-made piece of code that does a job. You **call** a function by writing its name followed by brackets, and you put the values you want it to work with, called **arguments**, inside the brackets. `print` displays its arguments in the output.

      ```python
      print("I am learning Python")
      print(42)
      print(3 * 7)
      ```

      Notice the difference: `"I am learning Python"` is in quotes, so it's **text**, shown exactly as written. `3 * 7` isn't in quotes, so Python **evaluates** it (works out the value, 21) and prints the result.

      You can give `print` several arguments separated by commas. It prints them on one line with a space between each:

      ```python
      print("The answer is", 6 * 7)     # The answer is 42
      ```

      Calling `print()` with nothing inside prints an empty line, which is handy for spacing out output.

  - heading: Strings
    body: |
      A piece of text in a program is called a **string** (a *string of characters*). You write a string between quotes. Single or double quotes both work, as long as they match:

      ```python
      print("double quotes")
      print('single quotes')
      print("It's easy")         # an apostrophe inside double quotes is fine
      print('She said "hi"')     # double quotes inside single quotes are fine
      ```

      Some characters can't be typed directly inside a string, so Python uses **escape sequences**, which start with a backslash `\`:

      | Escape | Means |
      |---|---|
      | `\n` | new line |
      | `\t` | tab |
      | `\"` and `\'` | a quote character |
      | `\\` | a single backslash |

      For long text over several lines, use **triple quotes**: `"""like this"""`. Everything between them, including line breaks, is part of the string.

      > **Note:** Remember Lesson 1.2: a string is stored as a sequence of character codes. `"Hi"` is the numbers 72 and 105. Quotes tell Python "treat this as text, not as code or a number". `"42"` is text containing two characters; `42` is a number.

  - heading: sep and end, controlling print
    body: |
      `print` has two optional settings, written as `name=value` after the other arguments:

      - `sep` is what goes **between** the values (normally a space).
      - `end` is what goes **at the end** (normally `"\n"`, a new line).

      ```python
      print("2025", "01", "31", sep="-")     # 2025-01-31
      print("Loading", end="")
      print("...done")                       # Loading...done
      ```

      Because the first call used `end=""`, no new line was printed after "Loading", so the next print continued on the same line.

  - heading: Comments
    body: |
      Anything after a `#` on a line is a **comment**: Python ignores it completely. Comments are for people, including you in three weeks, when you've forgotten why you wrote something.

      ```python
      # Calculate the total price including 20% tax
      print(50 * 1.2)   # 50 is the price before tax
      ```

      Good comments explain **why**, not **what**. `# print the number` above `print(5)` is useless; `# minimum age to vote in the UK` above a line using 18 is helpful.

  - heading: Errors are normal (and helpful)
    body: |
      Every programmer, at every level, sees errors all day long. An error message isn't a scolding; it's Python telling you exactly what confused it and where. Learning to read them calmly is a superpower.

      A **syntax error** means Python couldn't understand the code's grammar, so (as you learned in Lesson 1.6) it refuses to run *any* of it:

      ```text
        Line 1
          print("Hello)
                ^
      SyntaxError: unterminated string literal
      ```

      Read it from the bottom up: the last line names the problem (the string was never closed), and the lines above show where. Here, the closing quote is missing.

      A **NameError** happens while running, when Python meets a name it doesn't know:

      ```text
      Traceback (most recent call last):
        Line 2
          Print("Hello")
      NameError: name 'Print' is not defined
      ```

      Python is **case-sensitive**: `print` and `Print` are completely different names. The fix is to use the right spelling.

      > **Tip:** When you hit an error: (1) read the last line to learn *what* went wrong, (2) look at the line number to learn *where*, (3) look carefully at that line *and the one before it* (a missing bracket on one line often confuses Python on the next). You'll study debugging in depth in Lesson 2.9.

examples:
  - title: A complete program
    intro: Statements run top to bottom. Predict the output before reading it.
    code: |
      # My first program
      print("Hello, world!")
      print("2 + 3 =", 2 + 3)
      print()
      print("Python evaluates", "7 * 6", "as", 7 * 6)
    output: |
      Hello, world!
      2 + 3 = 5

      Python evaluates 7 * 6 as 42
    lines:
      - line: 1
        note: "A comment, ignored by Python."
      - line: 2
        note: "Printing a string. \"Hello, world!\" is traditionally the first program anyone writes in a new language."
      - line: 3
        note: "Two arguments: the string `\"2 + 3 =\"` is printed as-is, while the expression `2 + 3` is evaluated to 5. `print` puts a space between them."
      - line: 4
        note: "`print()` with no arguments prints an empty line."
      - line: 5
        note: "`\"7 * 6\"` in quotes is just text, but `7 * 6` without quotes is calculated. Quotes make all the difference."
  - title: Escape sequences and triple quotes
    intro: Special characters inside strings.
    code: |
      print("Line one\nLine two")
      print("Name:\tAda")
      print("She said \"hello\"")
      print("""A poem
        keeps its
      line breaks""")
    output: |
      Line one
      Line two
      Name:	Ada
      She said "hello"
      A poem
        keeps its
      line breaks
    lines:
      - line: 1
        note: "`\\n` starts a new line in the middle of the string, so one print produces two lines."
      - line: 2
        note: "`\\t` inserts a tab, useful for lining up columns."
      - line: 3
        note: "`\\\"` puts a double quote inside a double-quoted string without ending it."
      - line: 4-6
        note: "Triple quotes let a string span several lines; the line breaks and spaces are kept exactly."
  - title: sep and end
    intro: Fine control over how print lays out its output.
    code: |
      print("a", "b", "c")
      print("a", "b", "c", sep="")
      print("a", "b", "c", sep=" -> ")
      print("No newline here", end="")
      print("!")
      print("x", end=" ")
      print("y")
    output: |
      a b c
      abc
      a -> b -> c
      No newline here!
      x y
    lines:
      - line: 1
        note: "By default, values are separated by one space."
      - line: 2
        note: "`sep=\"\"` puts nothing between them."
      - line: 3
        note: "`sep` can be any string."
      - line: 4-5
        note: "`end=\"\"` stops print from moving to a new line, so the next print continues on the same line."
      - line: 6-7
        note: "`end=\" \"` ends with a space instead of a new line."

playground:
  prompt: |
    Write a few lines about yourself: your name, something you want to build, and a calculation (like how many days old you are, roughly: years × 365). Then deliberately break something (remove a quote, misspell `print`) and read the error message.
  code: |
    print("My name is ...")
    print("I want to build ...")
    print("Days in 20 years:", 20 * 365)

exercises:
  - id: hello-exact
    title: Print exactly
    difficulty: 1
    prompt: |
      Write a program that prints exactly these two lines:

      ```text
      Hello, Python!
      I am ready to learn.
      ```

      Programs are checked character by character, so watch your capital letters, commas and full stops.
    starter: |
      # Write two print statements
    tests:
      - name: first line is correct
        code: |
          lines = output.split("\n")
          assert lines[0] == "Hello, Python!", f"Your first line is {lines[0]!r}, expected 'Hello, Python!'"
      - name: second line is correct
        code: |
          lines = output.split("\n")
          assert len(lines) > 1 and lines[1] == "I am ready to learn.", f"Your second line is {lines[1] if len(lines) > 1 else None!r}, expected 'I am ready to learn.'"
      - name: nothing extra printed
        code: |
          assert output.strip("\n").count("\n") == 1, f"Expected exactly 2 lines of output, got:\n{output}"
    hints:
      - "Each line needs its own `print(...)` with the text in quotes."
      - "`print(\"Hello, Python!\")` is the first one."
    solution: |
      print("Hello, Python!")
      print("I am ready to learn.")
    explanation: |
      Each `print` call outputs one line. Computers compare text exactly: `hello, python!` or a missing full stop would be a different string. Being precise is a big part of programming.

  - id: fix-syntax
    title: Fix the errors
    difficulty: 1
    prompt: |
      This program has **three** mistakes. Run it, read each error message, fix the problem, and repeat until it prints:

      ```text
      Python was created by Guido van Rossum
      It was first released in 1991
      That was 34 years before 2025
      ```
    starter: |
      print("Python was created by Guido van Rossum)
      Print("It was first released in", 1991)
      print("That was", 2025 - 1991 "years before 2025")
    tests:
      - name: program runs and prints three lines
        code: |
          assert output.strip("\n").count("\n") == 2, f"Expected three lines of output, got:\n{output}"
      - name: output is exactly right
        code: |
          expected = "Python was created by Guido van Rossum\nIt was first released in 1991\nThat was 34 years before 2025\n"
          assert output == expected, f"Your output:\n{output}\nExpected:\n{expected}"
    hints:
      - "The first line's string is never closed. Where should the closing quote go?"
      - "Python is case-sensitive. Is `Print` the same as `print`?"
      - "On line 3, arguments must be separated by commas. What's missing after `2025 - 1991`?"
    solution: |
      print("Python was created by Guido van Rossum")
      print("It was first released in", 1991)
      print("That was", 2025 - 1991, "years before 2025")
    explanation: |
      Line 1 was missing a closing quote (a **SyntaxError**). Line 2 used `Print` with a capital P (a **NameError**, because Python only knows `print`). Line 3 was missing a comma between arguments (another SyntaxError). Notice that you had to fix the syntax errors before Python would even *reach* the NameError: syntax is checked for the whole program before anything runs.

  - id: sep-end
    title: Dates and progress bars
    difficulty: 2
    prompt: |
      Using the `sep` and `end` options, print exactly:

      ```text
      2025/10/24
      [####------]
      ```

      Rules: the first line must come from a **single** `print` call with **three separate arguments** `2025`, `10` and `24` (numbers, not one string). The second line must come from **two** `print` calls: one that prints `[####` and one that prints `------]`.
    starter: |
      print(2025, 10, 24)
      print("[####")
      print("------]")
    tests:
      - name: output is exactly right
        code: |
          assert output == "2025/10/24\n[####------]\n", f"Your output is:\n{output!r}"
      - name: date uses sep with three number arguments
        code: |
          assert "sep" in source, "Use the sep option for the date."
          assert "2025, 10, 24" in source.replace("2025,10,24", "2025, 10, 24"), "Keep the date as three separate number arguments: 2025, 10, 24."
      - name: progress bar uses end
        code: |
          assert "end" in source, "Use end=\"\" so the first part doesn't finish the line."
    hints:
      - "`sep` sets what goes between arguments: `sep=\"/\"`."
      - "Add `end=\"\"` to the `print(\"[####\")` call so the next print continues on the same line."
    solution: |
      print(2025, 10, 24, sep="/")
      print("[####", end="")
      print("------]")
    explanation: |
      `sep="/"` replaces the spaces between the three values with slashes. `end=""` replaces the usual new line at the end of a print with nothing, so the next print carries on where it left off. Progress bars in real programs work exactly like this, printing more characters on the same line as work completes.

  - id: escapes
    title: One print, many lines
    difficulty: 2
    prompt: |
      Using **a single** `print` call, print exactly this (the second line starts with a tab character, and the quotes are part of the output):

      ```text
      Menu:
      	"Coffee"	2.50
      Thank you!
      ```
    starter: |
      print("Menu:")
    tests:
      - name: only one print call
        code: |
          assert source.count("print(") == 1, "Use exactly one print call. Escape sequences can put several lines in one string."
      - name: output is exactly right
        code: |
          want = 'Menu:\n\t"Coffee"\t2.50\nThank you!\n'
          assert output == want, f"Your output is {output!r}\nExpected      {want!r}"
    hints:
      - "`\\n` gives a new line and `\\t` gives a tab, inside one string."
      - "To put a double quote inside a double-quoted string, write `\\\"`. Or use single quotes around the whole string."
      - "Start with `print(\"Menu:\\n\\t\\\"Coffee\\\"\\t2.50\\n...` and finish the last line."
    solution: |
      print("Menu:\n\t\"Coffee\"\t2.50\nThank you!")
    explanation: |
      `\n` starts each new line, `\t` adds the tabs, and `\"` puts quote characters inside the string without ending it. An equally good answer uses single quotes on the outside: `'Menu:\n\t"Coffee"\t2.50\nThank you!'`.

  - id: ascii-box
    title: Draw a box
    difficulty: 3
    prompt: |
      Print this box, exactly 20 characters wide, with your message centred:

      ```text
      +------------------+
      |   CS DEGREE LAB  |
      +------------------+
      ```

      Here's a trick to avoid counting dashes: in Python, `"-" * 18` makes a string of 18 dashes (multiplying a string repeats it). Use string repetition for the top and bottom lines.
    starter: |
      # Use "-" * 18 for the dashes
    tests:
      - name: three lines of exactly 20 characters
        code: |
          lines = output.rstrip("\n").split("\n")
          assert len(lines) == 3, f"Expected 3 lines, got {len(lines)}."
          for i, l in enumerate(lines):
              assert len(l) == 20, f"Line {i + 1} is {len(l)} characters wide, expected 20: {l!r}"
      - name: box is exactly right
        code: |
          want = "+------------------+\n|   CS DEGREE LAB  |\n+------------------+\n"
          assert output == want, f"Your output:\n{output}\nExpected:\n{want}"
      - name: uses string repetition
        code: |
          assert "*" in source, "Use string repetition like \"-\" * 18 instead of typing the dashes."
    hints:
      - "The top line is `\"+\"` then 18 dashes then `\"+\"`. You can join strings with `+`: `\"+\" + \"-\" * 18 + \"+\"`."
      - "The middle line is `|`, three spaces, `CS DEGREE LAB`, two spaces, `|`. Count: 1 + 3 + 13 + 2 + 1 = 20."
    solution: |
      print("+" + "-" * 18 + "+")
      print("|   CS DEGREE LAB  |")
      print("+" + "-" * 18 + "+")
    explanation: |
      `"-" * 18` builds 18 dashes and `+` joins strings together, so `"+" + "-" * 18 + "+"` is the 20-character border. Python does the `*` before the `+`, just like arithmetic. Generating text with code rather than typing it by hand makes it easy to change: try making the box 30 wide.

commonMistakes:
  - title: Forgetting the quotes around text
    explanation: |
      Without quotes, Python thinks words are names of variables or functions, and complains it doesn't know them.
    wrong: |
      print(Hello)
    right: |
      print("Hello")
  - title: Wrong capitalisation
    explanation: |
      `Print`, `PRINT` and `print` are three different names to Python, and only `print` exists. Python is case-sensitive everywhere.
  - title: Mismatched or unclosed quotes and brackets
    explanation: |
      Every opening `"` needs a matching `"`, and every `(` needs a `)`. If an error points at a line that looks fine, check the line *before* it for an unclosed bracket.
    wrong: |
      print("Hi there)
      print('Mixed quotes")
    right: |
      print("Hi there")
      print('Matching quotes')
  - title: Adding a number to a string with +
    explanation: |
      `"Age: " + 30` is an error, because `+` can't join text and a number. Use a comma in print instead (`print("Age:", 30)`), which handles the conversion for you. You'll learn other fixes in Lesson 2.3.

summary:
  - "A **program** is a sequence of **statements** that Python runs in order, top to bottom."
  - "`print(...)` displays its **arguments**. Several arguments are separated by spaces; `sep` and `end` change the separator and the line ending."
  - "**Strings** are text in matching quotes. Escape sequences like `\\n`, `\\t` and `\\\"` add special characters. Triple quotes span lines."
  - "Expressions without quotes are **evaluated**: `print(3 * 7)` prints 21, but `print(\"3 * 7\")` prints `3 * 7`."
  - "**Comments** start with `#` and explain *why*."
  - "**Syntax errors** stop the whole program before it runs; **NameErrors** come from unknown (often misspelled) names. Read error messages from the bottom up."
next: |
  So far your programs print fixed values. Real programs need to **remember** things: a score, a name, a running total. In **Lesson 2.2** you'll learn about **variables**, how Python actually stores them (it's not quite what you'd expect), and the full set of arithmetic operators.

quiz:
  - type: mcq
    question: In what order does Python run the statements in a simple program (with no decisions or loops)?
    options:
      - All at the same time
      - From top to bottom, one at a time
      - From bottom to top
      - In alphabetical order
    answer: 1
    explanation: Sequential execution means statements run one after another, top to bottom, like the program counter moving through instructions.
  - type: mcq
    question: What does `print("5 + 5")` display?
    options: ["10", "5 + 5", "\"5 + 5\"", "An error"]
    answer: 1
    explanation: The quotes make it a string, so it's printed exactly as written. Without quotes, `print(5 + 5)` would print 10.
  - type: mcq
    question: What does `print("a", "b", sep="")` display?
    options: ["a b", "ab", "a,b", "a\"\"b"]
    answer: 1
    explanation: sep is what goes between the arguments. An empty string means nothing goes between them.
  - type: mcq
    question: "Python shows `NameError: name 'pritn' is not defined`. What is the most likely cause?"
    options:
      - The string is missing a closing quote
      - "`print` is misspelled"
      - Python is not installed correctly
      - The number is too big
    answer: 1
    explanation: A NameError means Python met a name it doesn't recognise. Here, `pritn` is a typo for `print`.
  - type: mcq
    question: A program's first line is `print("start")` and its third line contains a syntax error. What happens when it runs?
    options:
      - It prints "start" then shows the error
      - It shows the syntax error and prints nothing
      - It skips line 3 and runs the rest
      - It prints "start" and ignores the error
    answer: 1
    explanation: Python checks the whole program's syntax before running anything, so no line runs if there's a syntax error anywhere.
  - type: mcq
    question: Which string contains a new line in the middle?
    options: ['"one/ntwo"', '"one\ntwo"', '"one" "two"', '"one\\two"']
    answer: 1
    explanation: The escape sequence for a new line is backslash-n, `\n`.
  - type: code
    question: |
      Print exactly these three lines, using any combination of print calls:

      ```text
      Name: Ada Lovelace
      Born: 1815
      Wrote the first published algorithm
      ```
    starter: |
    tests:
      - name: output is exactly right
        code: |
          want = "Name: Ada Lovelace\nBorn: 1815\nWrote the first published algorithm\n"
          assert output == want, f"Your output:\n{output!r}\nExpected:\n{want!r}"
    solution: |
      print("Name: Ada Lovelace")
      print("Born: 1815")
      print("Wrote the first published algorithm")
