id: u2-variables
title: Variables, Assignment and Arithmetic
minutes: 45
objective: |
  Store and update values with **variables**, understand what **assignment** really does in Python (names *refer to* values), and compute with all of Python's **arithmetic operators**, including `//`, `%` and `**`, following the correct **order of operations**.
outcomes:
  - Create, use and update variables, including patterns like `count = count + 1`
  - Explain the "name tag" model of Python variables
  - Choose good variable names and follow Python's naming rules
  - Use `+ - * / // % **` correctly, and predict results using operator precedence
  - Solve practical problems such as converting units and splitting a quantity

sections:
  - heading: Why programs need memory
    body: |
      Imagine a game that can't remember your score, or a shop that forgets what's in your basket. Programs need to **store values** and **refer back to them** later. In Lesson 1.5 you saw that the hardware does this with numbered memory addresses. Remembering "the score is at address 5,382,104" would be miserable, so programming languages let us give values **names**.

      A **variable** is a name that refers to a value:

      ```python
      score = 0
      player = "Ada"
      ```

      The `=` sign here is the **assignment operator**. It does **not** mean "equals" as in maths. Read `score = 0` as "**make the name `score` refer to the value 0**", or "score gets 0".

  - heading: Assignment, step by step
    body: |
      An assignment always works in two steps:

      1. **Evaluate the right-hand side** to get a value.
      2. **Bind the name** on the left-hand side to that value.

      This order explains a line that looks impossible in maths:

      ```python
      count = 5
      count = count + 1
      ```

      Step 1 evaluates `count + 1` using the *current* value of count: 5 + 1 = 6. Step 2 makes `count` refer to 6. So the line means "increase count by one". This pattern is so common that Python has a shortcut: `count += 1`. The same works for other operators: `-=`, `*=`, `/=` and so on.

      > **Analogy:** Think of a variable as a **name tag** tied to a value, not as a box that contains it. `x = 5` ties the tag `x` to the value 5. `x = 10` moves the tag to a new value, 10. And `y = x` ties a *second* tag to the same value that `x` is attached to. This "name tag" model is exactly how Python works, and it will matter a lot in Unit 3 when values can change.

      A name must be assigned **before** it's used. Using a name that has never been assigned gives a `NameError`, just like misspelling `print` did in Lesson 2.1.

  - heading: Naming variables well
    body: |
      Python's rules for names:

      - Letters, digits and underscores only (`total_cost`, `player2`)
      - Can't start with a digit (`2player` is invalid)
      - Case-sensitive (`Score` and `score` are different variables)
      - Can't be a **keyword**: one of Python's reserved words, like `if`, `for`, `while`, `def`, `True`, `class`

      The community convention (described in Python's official style guide, **PEP 8**) is **snake_case**: all lowercase, with words separated by underscores.

      Good names are the cheapest documentation there is. Compare:

      ```python
      a = 19.99 * 3          # what is this?
      basket_total = price_per_item * quantity
      ```

      > **Tip:** A good test: could someone who has never seen your program guess what the variable holds from its name alone? `t` fails; `temperature_celsius` passes. Short names like `i` or `n` are fine for counters and very short-lived values.

  - heading: Arithmetic operators
    body: |
      | Operator | Meaning | Example | Result |
      |---|---|---|---|
      | `+` | add | `7 + 2` | `9` |
      | `-` | subtract | `7 - 2` | `5` |
      | `*` | multiply | `7 * 2` | `14` |
      | `/` | divide | `7 / 2` | `3.5` |
      | `//` | floor division | `7 // 2` | `3` |
      | `%` | remainder (modulo) | `7 % 2` | `1` |
      | `**` | power | `7 ** 2` | `49` |

      You met `//`, `%` and `**` briefly in Unit 1. They deserve a closer look, because they solve a surprising number of problems:

      - `/` always gives a result with a decimal point, even if it divides exactly: `6 / 2` is `3.0`. (Lesson 2.3 explains why.)
      - `//` divides and **rounds down** to a whole number: `17 // 5` is `3`.
      - `%` gives the **remainder**: `17 % 5` is `2` (17 = 3 × 5 + 2).

      Together, `//` and `%` split a quantity into units. 135 minutes is `135 // 60` = 2 hours and `135 % 60` = 15 minutes. They also answer questions like "is this number even?" (`n % 2` is 0 for even numbers) and "what's the last digit?" (`n % 10`).

      > **Deep dive:** With negative numbers, `//` rounds *down* (towards minus infinity), not towards zero: `-7 // 2` is `-4`, and `-7 % 2` is `1`. Python guarantees that `(a // b) * b + (a % b) == a` always holds. Many other languages, including C, round towards zero instead, a classic source of bugs when translating code.

  - heading: Order of operations
    body: |
      Python follows the same precedence rules as maths, from highest to lowest:

      1. `( )` brackets
      2. `**` power
      3. `-x` negation
      4. `*`, `/`, `//`, `%` (left to right)
      5. `+`, `-` (left to right)

      So `2 + 3 * 4` is 14, not 20, and `10 - 4 - 3` is 3 (left to right: (10 − 4) − 3). One surprise: `**` binds *tighter* than negation, so `-3 ** 2` is −9, meaning −(3²).

      Remember the syntax trees from Lesson 1.6? Precedence is how Python decides the shape of the tree. When in doubt, **add brackets**: `(2 + 3) * 4` is clearer than relying on precedence, and it costs nothing.

  - heading: Swapping and multiple assignment
    body: |
      Python lets you assign several names in one line:

      ```python
      width, height = 1920, 1080
      ```

      This gives a neat way to **swap** two variables:

      ```python
      a, b = b, a
      ```

      Python evaluates the whole right-hand side first (the current values of `b` and `a`), *then* binds the names. In many other languages you'd need a temporary variable:

      ```python
      temp = a
      a = b
      b = temp
      ```

      Trace that by hand to see why the temporary variable is needed. If you wrote `a = b` then `b = a`, both would end up holding the original value of `b`.

examples:
  - title: Updating variables
    intro: Watch a variable's value change over time. Tracing values line by line is one of the most important skills in programming.
    code: |
      score = 0
      print("start:", score)
      score = score + 10
      print("after first:", score)
      score += 5
      score *= 2
      print("final:", score)
    output: |
      start: 0
      after first: 10
      final: 30
    lines:
      - line: 1
        note: "Create the variable: the name `score` refers to 0."
      - line: 3
        note: "Right side first: `score + 10` is 0 + 10 = 10. Then `score` is re-bound to 10."
      - line: 5
        note: "`+=` is shorthand for `score = score + 5`, giving 15."
      - line: 6
        note: "`*=` doubles it: 30."
  - title: Splitting a quantity with // and %
    intro: Converting a number of seconds into hours, minutes and seconds.
    code: |
      total_seconds = 7384
      hours = total_seconds // 3600
      remaining = total_seconds % 3600
      minutes = remaining // 60
      seconds = remaining % 60
      print(hours, "h", minutes, "m", seconds, "s")
    output: |
      2 h 3 m 4 s
    lines:
      - line: 1
        note: "The quantity to split."
      - line: 2
        note: "There are 3600 seconds in an hour. `//` tells us how many whole hours fit: 2."
      - line: 3
        note: "`%` gives what's left over after removing the whole hours: 7384 − 7200 = 184 seconds."
      - line: 4-5
        note: "Do the same with the leftover: 184 // 60 = 3 whole minutes, 184 % 60 = 4 seconds."
      - line: 6
        note: "Good names make the calculation read like an explanation."
  - title: Precedence surprises
    intro: Predict each result before reading the output.
    code: |
      print(2 + 3 * 4)
      print((2 + 3) * 4)
      print(10 - 4 - 3)
      print(2 ** 3 ** 2)
      print(-3 ** 2)
      print(17 // 5, 17 % 5)
    output: |
      14
      20
      3
      512
      -9
      3 2
    lines:
      - line: 1
        note: "Multiplication first: 2 + 12."
      - line: 2
        note: "Brackets force the addition first."
      - line: 3
        note: "Same-level operators go left to right: (10 − 4) − 3."
      - line: 4
        note: "The exception: `**` goes right to left. 3 ** 2 = 9 first, then 2 ** 9 = 512."
      - line: 5
        note: "`**` happens before negation: −(3 ** 2) = −9. Write `(-3) ** 2` to get 9."
      - line: 6
        note: "17 = 3 × 5 + 2: quotient 3, remainder 2."
  - title: Swapping two variables
    intro: Python's multiple assignment makes swapping a one-liner.
    code: |
      left = "apple"
      right = "banana"
      left, right = right, left
      print(left, right)
    output: |
      banana apple
    lines:
      - line: 1-2
        note: "Two variables holding strings. Variables can refer to any kind of value, not just numbers."
      - line: 3
        note: "The right side `right, left` is evaluated first, giving the pair \"banana\", \"apple\". Then both names are re-bound at once."
      - line: 4
        note: "The values have swapped."

playground:
  prompt: |
    Build a mini calculator: change `price` and `quantity`, add a `discount` variable, and print the final cost. Try the `%` operator on a few numbers to build your intuition: what's `100 % 7`? `n % 10` for various n?
  code: |
    price = 4.50
    quantity = 3
    total = price * quantity
    print("Total:", total)
    print(100 % 7, 1234 % 10, 1234 // 10)

exercises:
  - id: rectangle
    title: Area and perimeter
    difficulty: 1
    prompt: |
      A garden is **12.5** metres long and **8** metres wide.

      Create variables `length` and `width` with those values, then create `area` and `perimeter` **calculated from** `length` and `width` (don't type in the answers). Print both.
    starter: |
      length = 0
      width = 0
    tests:
      - name: length and width are set
        code: |
          assert length == 12.5 and width == 8, f"length is {length} and width is {width}."
      - name: area and perimeter are correct
        code: |
          assert area == 100, f"area is {area}. Area = length × width."
          assert perimeter == 41, f"perimeter is {perimeter}. Perimeter = 2 × (length + width)."
      - name: calculated from the variables
        code: |
          import re
          changed = re.sub(r"^length\s*=.*$", "length = 2", source, count=1, flags=re.M)
          changed = re.sub(r"^width\s*=.*$", "width = 3", changed, count=1, flags=re.M)
          ns = {}
          exec(changed, ns)
          assert ns["area"] == 6 and ns["perimeter"] == 10, "With length = 2 and width = 3, area should be 6 and perimeter 10. Calculate from the variables instead of typing the answers."
      - name: prints both values
        code: |
          assert "100" in output and "41" in output, f"Print area and perimeter. Your output was:\n{output}"
    hints:
      - "`area = length * width`"
      - "The perimeter goes all the way round: two lengths and two widths. Use brackets: `2 * (length + width)`."
    solution: |
      length = 12.5
      width = 8
      area = length * width
      perimeter = 2 * (length + width)
      print("Area:", area)
      print("Perimeter:", perimeter)
    explanation: |
      Calculating from the variables (instead of typing 100) means that if the garden changes size, you change one line and everything else updates. Note the brackets in the perimeter: without them, `2 * length + width` would only count the width once.

  - id: minutes-converter
    title: Convert minutes
    difficulty: 1
    prompt: |
      A film is `total_minutes = 157` minutes long. Using `//` and `%`, calculate `hours` and `minutes` so that it can be described as "2 hours and 37 minutes". Then print exactly:

      ```text
      2 hours and 37 minutes
      ```

      Your code must still work if `total_minutes` is changed, so calculate from the variable.
    starter: |
      total_minutes = 157
    tests:
      - name: hours and minutes are correct
        code: |
          assert hours == 2, f"hours is {hours}."
          assert minutes == 37, f"minutes is {minutes}."
      - name: prints the sentence
        code: |
          assert output.strip() == "2 hours and 37 minutes", f"Your output was {output.strip()!r}."
      - name: works for other lengths
        code: |
          new = source.replace("total_minutes = 157", "total_minutes = 61", 1)
          ns = {}
          exec(new, ns)
          assert ns["hours"] == 1 and ns["minutes"] == 1, "With total_minutes = 61 your code should give 1 hour and 1 minute. Calculate from total_minutes rather than typing 2 and 37."
    hints:
      - "How many whole hours fit in 157 minutes? `total_minutes // 60`."
      - "What's left over? `total_minutes % 60`."
      - "`print(hours, \"hours and\", minutes, \"minutes\")`"
    solution: |
      total_minutes = 157
      hours = total_minutes // 60
      minutes = total_minutes % 60
      print(hours, "hours and", minutes, "minutes")
    explanation: |
      `157 // 60` is 2 (two whole hours) and `157 % 60` is 37 (the minutes left over). The `//` and `%` pair appears whenever you split something into units: money into notes and coins, days into weeks, seconds into a clock display.

  - id: trace-values
    title: Trace the variables
    difficulty: 2
    prompt: |
      Trace this code **by hand** (make a table with a column for each variable) and work out the final values of `a`, `b` and `c`. Set `final_a`, `final_b` and `final_c` to your answers.

      ```python
      a = 4
      b = a * 2
      a = a + b
      c = a % b
      b = b ** 2 // a
      a, c = c, a
      ```

      Only check by running the code *after* you've committed to an answer.
    starter: |
      final_a = 0
      final_b = 0
      final_c = 0
    tests:
      - name: final_a is correct
        code: |
          assert final_a == 4, f"final_a is {final_a}. The last line swaps a and c. What was c just before?"
      - name: final_b is correct
        code: |
          assert final_b == 5, f"final_b is {final_b}. b ** 2 // a with b = 8 and a = 12: 64 // 12."
      - name: final_c is correct
        code: |
          assert final_c == 12, f"final_c is {final_c}."
    hints:
      - "After line 3: a = 12, b = 8. Changing a doesn't change b: b was already calculated."
      - "Line 4: c = 12 % 8 = 4. Line 5: b = 64 // 12 = 5 (`**` before `//`)."
      - "Line 6 swaps: a gets c's value and c gets a's value."
    solution: |
      final_a = 4
      final_b = 5
      final_c = 12
    explanation: |
      | after line | a | b | c |
      |---|---|---|---|
      | 1 | 4 | | |
      | 2 | 4 | 8 | |
      | 3 | 12 | 8 | |
      | 4 | 12 | 8 | 4 |
      | 5 | 12 | 5 | 4 |
      | 6 | 4 | 5 | 12 |

      The key insight is line 3: changing `a` doesn't change `b`, even though `b` was calculated from `a`. Assignment copies the *value* at that moment, not a formula. A trace table like this is how professionals debug tricky code.

  - id: compound-interest
    title: Compound interest
    difficulty: 2
    prompt: |
      You put **1000** pounds in a savings account that pays **5%** interest per year, added to the balance at the end of each year (so next year you earn interest on the interest).

      The formula for the balance after `years` years is: **principal × (1 + rate) ^ years**.

      Create `principal = 1000`, `rate = 0.05` and `years = 10`, and calculate `balance`. Then calculate `interest_earned` (balance minus principal). Print the balance rounded to 2 decimal places with `round(balance, 2)`.
    starter: |
      principal = 1000
      rate = 0.05
      years = 10
    tests:
      - name: balance is correct
        code: |
          assert abs(balance - 1628.894626777442) < 1e-6, f"balance is {balance}. Use principal * (1 + rate) ** years."
      - name: interest_earned is correct
        code: |
          assert abs(interest_earned - 628.894626777442) < 1e-6, f"interest_earned is {interest_earned}."
      - name: prints the rounded balance
        code: |
          assert "1628.89" in output, f"Print round(balance, 2). Your output was:\n{output}"
    hints:
      - "In Python, \"to the power of\" is `**`."
      - "Brackets matter: `principal * (1 + rate) ** years`. Without the brackets, `1 + rate ** years` would raise only the rate to the power."
      - "`interest_earned = balance - principal`, then `print(round(balance, 2))`."
    solution: |
      principal = 1000
      rate = 0.05
      years = 10
      balance = principal * (1 + rate) ** years
      interest_earned = balance - principal
      print(round(balance, 2))
      print(round(interest_earned, 2))
    explanation: |
      After 10 years the balance is about **£1628.89**: £628.89 of interest, much more than the £500 that "5% of 1000 for 10 years" would suggest, because each year's interest earns interest too. `round(x, 2)` rounds to 2 decimal places. Precedence matters here: `**` happens before `*`, and the brackets make sure `1 + rate` is computed before being raised to the power.

  - id: digit-sum
    title: Take a number apart
    difficulty: 3
    prompt: |
      Given a three-digit number `n = 472`, use only `//` and `%` (no strings!) to extract its digits into `hundreds`, `tens` and `ones`. Then set `digit_sum` to their sum and `reversed_n` to the number with its digits reversed (274).

      Your code must work for **any** three-digit number, so calculate everything from `n`.
    starter: |
      n = 472
    tests:
      - name: digits are correct for 472
        code: |
          assert (hundreds, tens, ones) == (4, 7, 2), f"You got hundreds={hundreds}, tens={tens}, ones={ones}."
      - name: digit_sum and reversed_n are correct for 472
        code: |
          assert digit_sum == 13, f"digit_sum is {digit_sum}."
          assert reversed_n == 274, f"reversed_n is {reversed_n}. Build it from the digits: ones × 100 + tens × 10 + hundreds."
      - name: works for other numbers
        code: |
          for test_n, want_sum, want_rev in [(905, 14, 509), (123, 6, 321), (100, 1, 1)]:
              ns = {}
              exec(source.replace("n = 472", f"n = {test_n}", 1), ns)
              assert ns["digit_sum"] == want_sum and ns["reversed_n"] == want_rev, f"With n = {test_n}, you got digit_sum={ns['digit_sum']}, reversed_n={ns['reversed_n']}. Calculate from n rather than typing digits."
      - name: uses arithmetic, not strings
        code: |
          assert "str(" not in source and "[" not in source, "Solve it with // and % only."
    hints:
      - "The last digit of any number is `n % 10`."
      - "The hundreds digit is `n // 100`. For the tens digit, first chop off the last digit with `n // 10` (giving 47), then take *that* number's last digit."
      - "`tens = (n // 10) % 10`. Reverse: `ones * 100 + tens * 10 + hundreds`."
    solution: |
      n = 472
      hundreds = n // 100
      tens = (n // 10) % 10
      ones = n % 10
      digit_sum = hundreds + tens + ones
      reversed_n = ones * 100 + tens * 10 + hundreds
      print(hundreds, tens, ones, digit_sum, reversed_n)
    explanation: |
      `% 10` gives the last digit and `// 10` removes it. That pair is how you take any number apart digit by digit, and it's exactly the "divide by the base, keep the remainder" method you used to convert to binary in Lesson 1.1 (with 10 instead of 2). In Lesson 2.6 you'll use a loop to do this for numbers of any length.

commonMistakes:
  - title: Reading = as "equals"
    explanation: |
      `=` means "assign": evaluate the right side, then bind the name on the left. The left side must be a name: `5 = x` is a syntax error. To *compare* two values you'll use `==`, in Lesson 2.5.
  - title: Expecting variables to update automatically
    explanation: |
      Assignment stores a value, not a formula. If you write `total = price * 2` and later change `price`, `total` does **not** change. Recalculate it after changing `price`.
    wrong: |
      price = 5
      total = price * 2
      price = 10
      print(total)   # still 10, not 20!
    right: |
      price = 10
      total = price * 2
      print(total)   # 20
  - title: Swapping in two steps without a temporary variable
    explanation: |
      After `a = b`, the original value of `a` is gone (nothing refers to it), so `b = a` just copies b's value back. Use `a, b = b, a`.
    wrong: |
      a = b
      b = a
    right: |
      a, b = b, a
  - title: Forgetting precedence
    explanation: |
      `average = a + b / 2` divides only `b` by 2. Use brackets: `(a + b) / 2`. When an expression mixes operators, add brackets to make your intention obvious.

summary:
  - "A **variable** is a name that refers to a value. `name = value` evaluates the right side first, then binds the name."
  - "`count = count + 1` (or `count += 1`) updates a variable using its current value."
  - "Variables are **name tags**, not boxes. Assignment stores a value, not a formula."
  - "Use descriptive **snake_case** names; names can't start with a digit or be keywords."
  - "Operators: `+ - * /` plus `//` (floor division), `%` (remainder) and `**` (power). `//` and `%` split quantities and take numbers apart."
  - "Precedence: brackets, `**`, then `* / // %`, then `+ -`. When in doubt, add brackets."
  - "`a, b = b, a` swaps two variables."
next: |
  You've used whole numbers, decimal numbers and text, and noticed that `6 / 2` gives `3.0` rather than `3`. These are different **types** of value. In **Lesson 2.3** you'll learn Python's core types, how to convert between them, and why `0.1 + 0.2` isn't exactly `0.3` (a direct consequence of the binary you learned in Unit 1).

quiz:
  - type: mcq
    question: "What is printed?\n\n```python\nx = 3\nx = x * 2\nx += 1\nprint(x)\n```"
    options: ["3", "6", "7", "8"]
    answer: 2
    explanation: x starts at 3, is doubled to 6, then increased by 1 to 7.
  - type: mcq
    question: "What is printed?\n\n```python\na = 5\nb = a\na = 10\nprint(b)\n```"
    options: ["5", "10", "15", "An error"]
    answer: 0
    explanation: "`b = a` makes b refer to the value a had at that moment, 5. Re-binding a to 10 afterwards doesn't affect b."
  - type: mcq
    question: What is `23 % 4`?
    options: ["5", "5.75", "3", "4"]
    answer: 2
    explanation: 23 = 5 × 4 + 3, so the remainder is 3. (23 // 4 would be 5.)
  - type: mcq
    question: What does `2 + 6 / 2 * 3` evaluate to?
    options: ["3.0", "11.0", "12.0", "1.0"]
    answer: 1
    explanation: Division and multiplication go first, left to right. 6 / 2 = 3.0, then 3.0 × 3 = 9.0, then 2 + 9.0 = 11.0.
  - type: mcq
    question: Which of these is a valid Python variable name?
    options: ["2nd_place", "total-cost", "for", "total_cost_2"]
    answer: 3
    explanation: Names can't start with a digit, can't contain hyphens (that's subtraction), and can't be keywords like `for`.
  - type: mcq
    question: How do you swap the values of `x` and `y` in Python?
    options: ["x = y; y = x", "x, y = y, x", "swap(x, y)", "x == y"]
    answer: 1
    explanation: Multiple assignment evaluates the right side completely before binding, so the values swap cleanly.
  - type: code
    question: |
      A pizza has `slices = 50` slices to share between `people = 6` people. Calculate `each` (how many whole slices each person gets) and `left_over` (slices remaining). Calculate from the variables.
    starter: |
      slices = 50
      people = 6
    tests:
      - name: each and left_over are correct
        code: |
          assert each == 8, f"each is {each}."
          assert left_over == 2, f"left_over is {left_over}."
      - name: calculated from the variables
        code: |
          ns = {}
          exec(source.replace("slices = 50", "slices = 23", 1).replace("people = 6", "people = 4", 1), ns)
          assert ns["each"] == 5 and ns["left_over"] == 3, "Calculate using slices and people, with // and %."
    solution: |
      slices = 50
      people = 6
      each = slices // people
      left_over = slices % people
