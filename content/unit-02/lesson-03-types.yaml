id: u2-types
title: Data Types, int, float, str and bool
minutes: 45
objective: |
  Know Python's four core **types** (`int`, `float`, `str`, `bool`), what operations each supports, how to **convert** between them, and why floating-point numbers like `0.1` are not stored exactly.
outcomes:
  - Identify the type of any value or expression, and check it with `type()`
  - Explain why `0.1 + 0.2 != 0.3` and compare floats safely
  - Use string operations and methods (`+`, `*`, `len`, `upper`, `lower`, `strip`, `replace`, `title`)
  - Convert between types with `int()`, `float()`, `str()` and `round()`, and know when conversion fails
  - Explain what "dynamically typed" means

sections:
  - heading: Every value has a type
    body: |
      In Lesson 1.2 you learned that bits mean nothing without an encoding: the same byte could be a number or a letter. Python keeps track of the encoding for you. Every value carries a **type**, which tells Python how to interpret its bits and which operations make sense.

      | Type | What it holds | Examples |
      |---|---|---|
      | `int` | whole numbers | `42`, `-7`, `0`, `1_000_000` |
      | `float` | numbers with a fractional part | `3.14`, `-0.5`, `2.0`, `1e6` |
      | `str` | text (strings) | `"hello"`, `'A'`, `""`, `"42"` |
      | `bool` | truth values | `True`, `False` |

      The built-in function `type()` tells you a value's type: `type(42)` is `int`, and `type("42")` is `str`.

      Types matter because **the same operator does different things for different types**. `5 + 5` is 10, but `"5" + "5"` is `"55"`: for strings, `+` means "join". And some combinations make no sense at all: `"5" + 5` raises a `TypeError`, because Python refuses to guess whether you meant 10 or `"55"`.

      > **Key idea:** When code behaves strangely, ask "what *type* is this value, really?" A huge share of beginner bugs come from a number that is secretly a string, or the other way around.

  - heading: Integers
    body: |
      An `int` is a whole number, positive, negative or zero. Unlike the fixed-size integers of Lesson 1.2, Python's ints **grow as big as they need to**: `2 ** 1000` works fine and gives a 302-digit number. Python quietly uses more memory as the number grows, so ints never overflow.

      Integer arithmetic with `+`, `-`, `*`, `//`, `%` and `**` (with a non-negative power) always gives an `int`. Division with `/` is the exception: it **always gives a float**, even for `6 / 2`, because the answer *might* have a fraction and Python wants the result type to be predictable.

  - heading: Floats, and why 0.1 + 0.2 isn't 0.3
    body: |
      A `float` (*floating-point number*) holds numbers with a fractional part. Any number written with a decimal point is a float, even `2.0`. Very big or small floats can be written in scientific notation: `6.02e23` means 6.02 × 10²³.

      Mixing an int and a float gives a float: `3 + 0.5` is `3.5`, and `2 * 1.0` is `2.0`.

      Now the famous surprise. Try `print(0.1 + 0.2)` and Python says `0.30000000000000004`. This isn't a Python bug; every language using standard floats does the same. Here's why:

      - Floats are stored in **binary**, in 64 bits (a standard called IEEE 754).
      - In decimal, 1/3 can't be written exactly: 0.3333... goes on forever, so any fixed number of digits is slightly off.
      - In binary, **0.1 is like 1/3**: it's 0.000110011001100... repeating forever. Squeezed into 64 bits, it's stored as a number extremely close to, but not exactly, 0.1.
      - Add two slightly-off numbers and the tiny errors can show up in the result.

      Two practical rules follow:

      1. **Never compare floats with `==`.** Instead check whether they're close enough: `abs(a - b) < 1e-9`. (`abs` gives the absolute value: the distance from zero, ignoring the sign.)
      2. **Don't store money as a float.** Store whole pennies (or cents) as an int: £19.99 is `1999` pennies. Banks and shops do exactly this, because a rounding error multiplied by millions of transactions is real money.

      > **Deep dive:** A 64-bit float stores a sign bit, an 11-bit exponent and a 52-bit fraction: binary scientific notation. That gives about 15 to 17 significant decimal digits of precision, and a range up to about 10³⁰⁸. In Unit 9 you'll look at the actual bits.

  - heading: Strings
    body: |
      A `str` is a sequence of characters. You've already used `+` to join strings (called **concatenation**) and `*` to repeat them. Some more tools:

      - `len(s)` gives the number of characters: `len("hello")` is 5. The empty string `""` has length 0.
      - **Methods** are functions that belong to a value, called with a dot: `s.upper()`. Useful string methods include:

      | Method | Does | Example | Result |
      |---|---|---|---|
      | `.upper()` | all uppercase | `"Hi".upper()` | `"HI"` |
      | `.lower()` | all lowercase | `"Hi".lower()` | `"hi"` |
      | `.title()` | capitalise each word | `"ada lovelace".title()` | `"Ada Lovelace"` |
      | `.strip()` | remove spaces from both ends | `"  hi  ".strip()` | `"hi"` |
      | `.replace(a, b)` | replace every `a` with `b` | `"a-b-c".replace("-", "+")` | `"a+b+c"` |

      Methods don't change the original string. They return a **new** string, so you need to store it: `name = name.strip()`. (Strings can never be changed in place; they are **immutable**. Unit 3 explores what that means.)

      You can also chain methods: `"  HELLO  ".strip().lower()` gives `"hello"`.

  - heading: Booleans
    body: |
      A `bool` has only two possible values, `True` and `False` (capitalised, no quotes). They're the 1 and 0 of Boolean logic from Lesson 1.3, and you'll use them constantly in Lesson 2.5 for decisions.

      Comparisons produce booleans: `3 > 2` is `True`, and `10 == 5` is `False` (`==` asks "are these equal?"). The word `in` checks whether one string appears inside another: `"cat" in "concatenate"` is `True`.

      Under the hood, `bool` is a special kind of `int`: `True` behaves like 1 and `False` like 0, so `True + True` is 2. That's occasionally handy for counting.

  - heading: Converting between types
    body: |
      The type names double as conversion functions:

      | Call | Result | Notes |
      |---|---|---|
      | `int("42")` | `42` | text to whole number |
      | `int(3.99)` | `3` | **truncates** (chops off) the fraction, doesn't round |
      | `float("2.5")` | `2.5` | text to float |
      | `float(7)` | `7.0` | |
      | `str(42)` | `"42"` | anything to text |
      | `round(3.14159, 2)` | `3.14` | round to 2 decimal places |
      | `round(2.7)` | `3` | round to the nearest whole number (an int) |

      Conversion fails if the value doesn't make sense: `int("hello")` raises a `ValueError`, and so does `int("3.5")` (a whole-number conversion won't accept a decimal point; use `int(float("3.5"))`).

      > **Warning:** `round()` uses "banker's rounding" for exact halves: it rounds to the nearest **even** number, so `round(2.5)` is 2 and `round(3.5)` is 4. This avoids a bias where always rounding halves up makes totals drift upwards. It surprises almost everyone the first time.

      Conversion matters most when reading input: in Lesson 2.4 you'll see that everything a user types arrives as a string, even if it looks like a number.

  - heading: Values have types, names don't
    body: |
      In Python, a variable is just a name tag (Lesson 2.2), and a tag can be moved to a value of any type:

      ```python
      x = 5        # x refers to an int
      x = "five"   # now x refers to a str
      ```

      This is called **dynamic typing**: types belong to values and are checked while the program runs. Languages like C and Java use **static typing**, where each variable is declared with a fixed type and the compiler checks types before the program runs. Static typing catches some bugs earlier; dynamic typing is quicker to write. You'll experience both in this degree.

examples:
  - title: Checking types
    intro: "`type()` reveals what kind of value you're dealing with."
    code: |
      print(type(42))
      print(type(42.0))
      print(type("42"))
      print(type(42 > 7))
      print(type(10 / 2), 10 / 2)
      print(type(10 // 2), 10 // 2)
    output: |
      <class 'int'>
      <class 'float'>
      <class 'str'>
      <class 'bool'>
      <class 'float'> 5.0
      <class 'int'> 5
    lines:
      - line: 1-3
        note: "Three different types that all *look* like 42. The decimal point makes a float; the quotes make a string. (Python says `class`; for now, treat \"class\" as meaning \"type\". Unit 5 explains classes.)"
      - line: 4
        note: "A comparison produces a bool."
      - line: 5
        note: "`/` always produces a float, even when the division is exact."
      - line: 6
        note: "`//` on two ints produces an int."
  - title: Floating-point surprises
    intro: Seeing the binary approximation for yourself.
    code: |
      total = 0.1 + 0.2
      print(total)
      print(total == 0.3)
      print(abs(total - 0.3) < 1e-9)
      print(f"{0.1:.20f}")
      price_pennies = 1999
      print(price_pennies * 3 / 100)
    output: |
      0.30000000000000004
      False
      True
      0.10000000000000000555
      59.97
    lines:
      - line: 1-2
        note: "The tiny errors in storing 0.1 and 0.2 show up in their sum."
      - line: 3
        note: "So an exact comparison fails."
      - line: 4
        note: "The safe way: are they within a tiny tolerance of each other? `1e-9` means 0.000000001."
      - line: 5
        note: "Printing 0.1 to 20 decimal places reveals the number actually stored. (This `f\"...\"` formatting is explained in Lesson 2.4.)"
      - line: 6-7
        note: "Money as whole pennies: the arithmetic stays exact, and we only convert to pounds for display."
  - title: String operations and methods
    intro: Cleaning up messy text, a very common real-world task.
    code: |
      raw = "   hELLo WoRLD   "
      clean = raw.strip()
      print(len(raw), len(clean))
      print(clean.lower())
      print(clean.title())
      print(clean.replace("o", "0").replace("O", "0"))
      print("=" * 11)
      print("WORLD" in clean.upper())
    output: |
      17 11
      hello world
      Hello World
      hELL0 W0RLD
      ===========
      True
    lines:
      - line: 1-2
        note: "`.strip()` returns a new string without the spaces at either end. `raw` itself is unchanged."
      - line: 3
        note: "Spaces count as characters: 17 before stripping, 11 after."
      - line: 4-5
        note: "Changing case. `.title()` capitalises the first letter of each word and lowercases the rest."
      - line: 6
        note: "Methods can be chained: the second `.replace` works on the result of the first."
      - line: 7
        note: "String repetition."
      - line: 8
        note: "`in` checks for a substring and gives a bool."
  - title: Converting types
    intro: Each conversion function, including one that fails.
    code: |
      print(int("42") + 1)
      print(str(42) + "1")
      print(int(9.99), round(9.99))
      print(float("2.5") * 2)
      print(round(2.5), round(3.5))
      print(int("3.5"))
    expectError: true
    output: |
      43
      421
      9 10
      5.0
      2 4
    lines:
      - line: 1-2
        note: "The same digits, two meanings: as numbers 42 + 1 = 43, as text \"42\" + \"1\" = \"421\"."
      - line: 3
        note: "`int()` chops off the fraction (9), `round()` rounds to nearest (10)."
      - line: 4
        note: "Text to float, then arithmetic."
      - line: 5
        note: "Banker's rounding: halves go to the nearest even number."
      - line: 6
        note: "This raises `ValueError: invalid literal for int() with base 10: '3.5'` (run it to see). `int()` only accepts whole-number text."

playground:
  prompt: |
    Investigate types for yourself. What's `type(True + 1)`? What does `"ab" * 3` give? What about `"ab" * 2.5`? Try `int(" 42 ")` with spaces, and `int("forty-two")`. Make a prediction each time.
  code: |
    print(type(True + 1), True + 1)
    print("ab" * 3)
    print(int(" 42 "))

exercises:
  - id: name-the-type
    title: Name that type
    difficulty: 1
    prompt: |
      Without running anything, work out the **type** of each expression's result, and set each variable to the type's name as a string: `"int"`, `"float"`, `"str"` or `"bool"`.

      - `t1` for `7 / 7`
      - `t2` for `"7" * 3`
      - `t3` for `7 // 2`
      - `t4` for `7 > 3.5`
      - `t5` for `7 + 0.0`
    starter: |
      t1 = ""
      t2 = ""
      t3 = ""
      t4 = ""
      t5 = ""
    tests:
      - name: t1 (7 / 7)
        code: |
          assert t1 == "float", f"t1 is {t1!r}. What does / always produce?"
      - name: t2 ("7" * 3)
        code: |
          assert t2 == "str", f"t2 is {t2!r}. Repeating a string gives...?"
      - name: t3 (7 // 2)
        code: |
          assert t3 == "int", f"t3 is {t3!r}."
      - name: t4 (7 > 3.5)
        code: |
          assert t4 == "bool", f"t4 is {t4!r}. What does a comparison produce?"
      - name: t5 (7 + 0.0)
        code: |
          assert t5 == "float", f"t5 is {t5!r}. Mixing an int and a float gives...?"
    hints:
      - "`/` always gives a float, even when the answer is a whole number."
      - "Comparisons give `True` or `False`. Mixing int and float gives float."
    solution: |
      t1 = "float"
      t2 = "str"
      t3 = "int"
      t4 = "bool"
      t5 = "float"
    explanation: |
      `7 / 7` is `1.0` (a float), `"7" * 3` is `"777"` (a str), `7 // 2` is `3` (an int), `7 > 3.5` is `True` (a bool), and `7 + 0.0` is `7.0` (a float, because mixing with a float gives a float). Check them with `print(type(...))` if you weren't sure.

  - id: fix-age
    title: Fix the type bug
    difficulty: 1
    prompt: |
      This program crashes with a `TypeError`. The age arrives as text (as it would from a form). Fix it so that it prints exactly:

      ```text
      Next year you will be 18
      ```

      Keep `age = "17"` as a string on the first line: fix the code *after* it.
    starter: |
      age = "17"
      next_year = age + 1
      print("Next year you will be " + next_year)
    tests:
      - name: age is still the string "17"
        code: |
          assert age == "17", "Leave the first line as age = \"17\" and convert later."
      - name: next_year is the number 18
        code: |
          assert next_year == 18 and type(next_year) is int, f"next_year is {next_year!r}. Convert age to an int before adding."
      - name: prints the sentence
        code: |
          assert output == "Next year you will be 18\n", f"Your output was {output!r}."
    hints:
      - "`age` is a string. Convert it to a number with `int(age)` before adding 1."
      - "The print line then has a different problem: you can't `+` a string and an int. Convert back with `str(next_year)`, or use a comma in print."
    solution: |
      age = "17"
      next_year = int(age) + 1
      print("Next year you will be " + str(next_year))
    explanation: |
      Two conversions were needed: `int(age)` to do arithmetic, and `str(next_year)` to join it to text with `+`. (Using `print("Next year you will be", next_year)` also works, since print converts each argument for you and adds the space.) This exact bug appears in nearly every beginner's first program that reads input.

  - id: float-compare
    title: Comparing floats safely
    difficulty: 2
    prompt: |
      1. Set `total` to `0.1 + 0.2 + 0.3`.
      2. Set `exact` to the result of comparing `total == 0.6` (it will be a bool).
      3. Set `close` to the result of the **safe** comparison: is the distance between `total` and `0.6` less than `1e-9`?
      4. A shop sells pens for £0.10. Set `pens_pennies` to the price of 3 pens **in whole pennies** (an int), calculated as an int multiplication.
    starter: |
      total = 0
      exact = None
      close = None
      pens_pennies = 0
    tests:
      - name: total is computed
        code: |
          assert total == 0.1 + 0.2 + 0.3, f"total is {total}. Set it to 0.1 + 0.2 + 0.3."
      - name: exact is the result of == (False)
        code: |
          assert exact is False, f"exact is {exact!r}. Set exact = total == 0.6 and see what Python says."
      - name: close uses a tolerance (True)
        code: |
          assert close is True, f"close is {close!r}. Use abs(total - 0.6) < 1e-9."
          assert "abs" in source, "Use abs() to measure the distance between the two numbers."
      - name: pens_pennies is an int
        code: |
          assert pens_pennies == 30 and type(pens_pennies) is int, f"pens_pennies is {pens_pennies!r}. Use 10 pennies × 3."
    hints:
      - "`exact = total == 0.6`. The right side is evaluated first: the comparison gives a bool, which is then stored."
      - "`close = abs(total - 0.6) < 1e-9`"
      - "£0.10 is 10 pennies, so `pens_pennies = 10 * 3`."
    solution: |
      total = 0.1 + 0.2 + 0.3
      exact = total == 0.6
      close = abs(total - 0.6) < 1e-9
      pens_pennies = 10 * 3
      print(total, exact, close, pens_pennies)
    explanation: |
      `total` is `0.6000000000000001`, so `==` says **False**, while the tolerance check says **True**. Working in whole pennies keeps money calculations exact: `0.1 * 3` gives `0.30000000000000004`, but `10 * 3` is exactly `30`.

  - id: clean-name
    title: Clean up user input
    difficulty: 2
    prompt: |
      People type names messily. Given `raw = "   aDA   lovelace  "`:

      1. Set `clean` to the name with outer spaces removed and each word capitalised properly: `"Ada   Lovelace"` (the spaces *between* the words can stay as they are).
      2. Set `shout` to `clean` in all capitals.
      3. Set `letters` to the number of characters in `clean`.
      4. Set `initials_ok` to whether `"Ada"` appears in `clean` (a bool, using `in`).

      Use string methods; don't type the answers in yourself.
    starter: |
      raw = "   aDA   lovelace  "
    tests:
      - name: clean is correct
        code: |
          assert clean == "Ada   Lovelace", f"clean is {clean!r}. Try raw.strip().title()."
      - name: shout and letters are correct
        code: |
          assert shout == "ADA   LOVELACE", f"shout is {shout!r}."
          assert letters == 14, f"letters is {letters}. Use len(clean)."
      - name: initials_ok is a bool
        code: |
          assert initials_ok is True, f"initials_ok is {initials_ok!r}. Use \"Ada\" in clean."
      - name: uses methods on raw
        code: |
          ns = {}
          exec(source.replace('"   aDA   lovelace  "', '"  grACE hopper "', 1), ns)
          assert ns["clean"] == "Grace Hopper", "Compute clean from raw with methods, so it works for any name."
    hints:
      - "`.strip()` removes outer spaces; `.title()` capitalises each word. Chain them."
      - "`shout = clean.upper()` and `letters = len(clean)`."
      - "`initials_ok = \"Ada\" in clean`"
    solution: |
      raw = "   aDA   lovelace  "
      clean = raw.strip().title()
      shout = clean.upper()
      letters = len(clean)
      initials_ok = "Ada" in clean
      print(clean, shout, letters, initials_ok)
    explanation: |
      Chaining `strip()` then `title()` handles both problems in one expression. Each method returns a new string; `raw` itself never changes. Notice `letters` is 14, because the three spaces between the words count. (Collapsing those into one space needs a tool from Unit 3.)

  - id: temperature-report
    title: Build a report string
    difficulty: 3
    prompt: |
      Given `celsius = 36.6`:

      1. Set `fahrenheit` using the formula F = C × 9 / 5 + 32, **rounded to 1 decimal place**.
      2. Set `report` to the string `"36.6C is 97.9F"`, built from the variables using `str()` and `+` (not typed in by hand).
      3. Set `whole_degrees` to the Fahrenheit temperature **truncated** to a whole number (an int, fraction chopped off).

      Print `report`. Your code must work for other temperatures too.
    starter: |
      celsius = 36.6
    tests:
      - name: fahrenheit is correct and rounded
        code: |
          assert fahrenheit == 97.9, f"fahrenheit is {fahrenheit}. Use round(celsius * 9 / 5 + 32, 1)."
      - name: report is correct
        code: |
          assert report == "36.6C is 97.9F", f"report is {report!r}."
          assert "str(" in source, "Build report with str() and +."
      - name: whole_degrees is truncated
        code: |
          assert whole_degrees == 97 and type(whole_degrees) is int, f"whole_degrees is {whole_degrees!r}. Use int() to truncate."
      - name: works for other temperatures
        code: |
          ns = {}
          exec(source.replace("celsius = 36.6", "celsius = 100", 1), ns)
          assert ns["report"] == "100C is 212.0F", f"With celsius = 100, report was {ns['report']!r}, expected '100C is 212.0F'."
    hints:
      - "`fahrenheit = round(celsius * 9 / 5 + 32, 1)`"
      - "`report = str(celsius) + \"C is \" + str(fahrenheit) + \"F\"`"
      - "`int(fahrenheit)` chops off the decimal part."
    solution: |
      celsius = 36.6
      fahrenheit = round(celsius * 9 / 5 + 32, 1)
      report = str(celsius) + "C is " + str(fahrenheit) + "F"
      whole_degrees = int(fahrenheit)
      print(report)
    explanation: |
      Every piece joined with `+` must be a string, so the numbers are converted with `str()`. Rounding to 1 decimal place hides floating-point noise (the unrounded value is `97.88000000000001`). With 100 °C, `celsius` is an int, so `str(celsius)` is `"100"` while `fahrenheit` (from `/`) is the float `212.0`. Building strings with `+` and `str()` is clunky; in Lesson 2.4 you'll learn **f-strings**, a much nicer way.

commonMistakes:
  - title: Adding a string and a number
    explanation: |
      `"Score: " + 10` raises `TypeError: can only concatenate str (not "int") to str`. Convert the number with `str()`, or pass both to print with a comma.
    wrong: |
      print("Score: " + 10)
    right: |
      print("Score: " + str(10))
      print("Score:", 10)
  - title: Comparing floats with ==
    explanation: |
      Because most decimals can't be stored exactly in binary, `0.1 * 3 == 0.3` is `False`. Compare with a tolerance: `abs(a - b) < 1e-9`.
  - title: Forgetting that methods return a new string
    explanation: |
      `name.strip()` on its own line does nothing useful: the stripped string is created and then thrown away. Store the result.
    wrong: |
      name = "  Ada  "
      name.strip()
      print(name)    # still has spaces
    right: |
      name = "  Ada  "
      name = name.strip()
      print(name)
  - title: Expecting int() to round
    explanation: |
      `int(2.9)` is 2, not 3. `int()` chops off the fractional part. Use `round()` to round to the nearest whole number (and remember that exact halves round to the nearest even number).

summary:
  - "Every value has a **type**: `int` (whole numbers), `float` (fractions), `str` (text), `bool` (`True`/`False`). Check with `type()`."
  - "Operators depend on type: `+` adds numbers but joins strings. Incompatible types raise a `TypeError`."
  - "Python ints never overflow. `/` always gives a float; mixing int and float gives a float."
  - "Floats are binary approximations: `0.1 + 0.2` is `0.30000000000000004`. Compare floats with a tolerance; store money as whole pennies."
  - "Strings support `+`, `*`, `len()`, `in` and methods like `.upper()`, `.strip()`, `.replace()`. Methods return new strings."
  - "Convert with `int()`, `float()`, `str()`, `round()`. Bad conversions raise `ValueError`. `int()` truncates."
  - "Python is **dynamically typed**: values have types, names don't."
next: |
  You've been writing programs that only talk. In **Lesson 2.4** your programs will start to **listen**: you'll read what the user types with `input()`, convert it to the right type, and present results beautifully with **f-strings** and format codes.

quiz:
  - type: mcq
    question: What is the type of `10 / 5`?
    options: [int, float, str, bool]
    answer: 1
    explanation: The `/` operator always produces a float. `10 / 5` is `2.0`.
  - type: mcq
    question: What does `"3" + "4"` evaluate to?
    options: ["7", '"34"', "12", "A TypeError"]
    answer: 1
    explanation: For strings, `+` joins them, giving the string "34".
  - type: mcq
    question: Why does `0.1 + 0.2 == 0.3` evaluate to `False` in Python?
    options:
      - Python has a bug in its addition
      - 0.1 and 0.2 cannot be stored exactly in binary floating point, so the sum is very slightly off
      - The == operator doesn't work on floats at all
      - Python rounds 0.3 down to 0.2
    answer: 1
    explanation: Just as 1/3 has no exact decimal form, 0.1 has no exact binary form. The tiny storage errors make the sum 0.30000000000000004.
  - type: mcq
    question: What is `int(7.9)`?
    options: ["7", "8", "7.9", "A ValueError"]
