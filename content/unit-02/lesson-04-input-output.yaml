id: u2-io
title: Input and Output, Programs That Talk Back
minutes: 40
objective: |
  Write **interactive programs** that read what the user types with `input()`, convert it to the right type, and present results clearly using **f-strings** and **format specifications**.
outcomes:
  - Read text from the user with `input()` and explain why it is always a string
  - Convert input to numbers with `int()` and `float()`
  - Build output with f-strings, including expressions inside the braces
  - Format numbers with decimal places, thousands separators, widths, alignment and zero padding
  - Structure a program as input, processing and output

sections:
  - heading: Programs that listen
    body: |
      Every useful program takes some **input**, does some **processing**, and produces some **output**. So far your programs have had their input written into the code. Now they'll ask the user.

      The built-in function `input()` pauses the program, waits for the user to type a line and press Enter, and then gives back (**returns**) what they typed:

      ```python
      name = input("What is your name? ")
      print("Nice to meet you,", name)
      ```

      The string inside the brackets is the **prompt**, shown to the user before they type. End it with a space so the user's typing doesn't crash into the question.

      > **Note:** In this app, programs can't stop and wait for you mid-run, so you type the input **in advance**: click **Input** under the editor and type one line for each `input()` call your program makes. When the program calls `input()`, it reads the next line. In the output, you'll see the prompt followed by the value it read. A program run in a terminal works the same way, except you type each line when asked. In exercises, the tests feed in their own input lines to check your program with many different values.

  - heading: input() always returns a string
    body: |
      This is the single most important fact about `input()`: **it always gives you a string**, even if the user types digits. Typing `42` gives the string `"42"`, not the number 42. (Remember from Lesson 1.2: what arrives from the keyboard is character codes.)

      So to do arithmetic, convert first:

      ```python
      age = int(input("How old are you? "))
      print("In ten years you'll be", age + 10)
      ```

      Read the first line from the inside out: `input(...)` runs first and returns a string, then `int(...)` converts that string to an int, then the result is stored in `age`. Use `float()` instead of `int()` when the value might have a decimal point, like a price or a height.

      If the user types something that isn't a number, `int()` raises a `ValueError` and the program crashes. For now we'll assume users type sensible input. In Lesson 2.9 you'll learn to handle bad input gracefully, and in Lesson 2.6 to keep asking until the input is valid.

  - heading: f-strings, the easy way to build text
    body: |
      In Lesson 2.3 you built strings with `+` and `str()`. It works, but it's clumsy. **f-strings** (formatted strings) are much nicer. Put an `f` before the opening quote, and anything inside `{curly braces}` is evaluated and inserted:

      ```python
      name = "Ada"
      age = 36
      print(f"{name} is {age} years old")        # Ada is 36 years old
      print(f"Next year: {age + 1}")             # Next year: 37
      print(f"{name.upper()} has {len(name)} letters")
      ```

      Any expression can go inside the braces, and Python converts the result to text automatically, so there's no need for `str()`. f-strings are the modern standard way to format output in Python.

  - heading: Format specifications
    body: |
      After the expression in an f-string, a colon `:` starts a **format specification** that controls how the value looks:

      | Spec | Meaning | Example | Result |
      |---|---|---|---|
      | `.2f` | 2 decimal places | `f"{3.14159:.2f}"` | `3.14` |
      | `,` | thousands separator | `f"{1234567:,}"` | `1,234,567` |
      | `,.2f` | both | `f"{1234.5:,.2f}"` | `1,234.50` |
      | `.1%` | as a percentage | `f"{0.256:.1%}"` | `25.6%` |
      | `>8` | right-align in 8 characters | `f"{42:>8}"` | `      42` |
      | `<8` | left-align in 8 characters | `f"{'hi':<8}"` | `hi      ` |
      | `^8` | centre in 8 characters | `f"{'hi':^8}"` | `   hi   ` |
      | `02d` | at least 2 digits, padded with zeros | `f"{7:02d}"` | `07` |

      `.2f` is the one you'll use most: money, measurements and averages almost always need a fixed number of decimal places. Note that formatting **rounds for display** but doesn't change the value stored in the variable.

      Widths and alignment are how you print neat tables: give every column a fixed width and the columns line up.

      > **Tip:** Format specs also fix floating-point noise in output. `f"{0.1 + 0.2:.2f}"` shows `0.30`, hiding the `...04`, because the value is rounded for display.

  - heading: Designing an interactive program
    body: |
      A good structure for small programs is **input → process → output**:

      ```python
      # Input
      length = float(input("Room length (m): "))
      width = float(input("Room width (m): "))
      # Process
      area = length * width
      cost = area * 25.50
      # Output
      print(f"Area: {area:.1f} m²")
      print(f"Carpet cost: £{cost:,.2f}")
      ```

      Some habits that make programs pleasant to use:

      - **Clear prompts** that say what's wanted, including units ("Room length (m): ").
      - **Labelled output**, so the user knows what each number means.
      - **Sensible formatting**: money to 2 decimal places, big numbers with separators.

      Keeping input, processing and output in separate sections also makes programs easier to test and change. You'll take this idea much further with functions in Lesson 2.8.

examples:
  - title: Reading and converting input
    intro: This example reads two lines of input. They're already in its Input box when you open it in the editor.
    code: |
      name = input("Name: ")
      age = int(input("Age: "))
      print(type(name), type(age))
      print(f"Hi {name}! In 10 years you will be {age + 10}.")
    stdin: |
      Grace
      27
    output: |
      Name: Grace
      Age: 27
      <class 'str'> <class 'int'>
      Hi Grace! In 10 years you will be 37.
    lines:
      - line: 1
        note: "`input` shows the prompt `Name: ` and returns the next line of input as a string."
      - line: 2
        note: "Inside out: `input` returns `\"27\"`, `int` converts it to 27, and the int is stored in `age`."
      - line: 3
        note: "Confirms the types: name is still a string; age was converted to an int."
      - line: 4
        note: "An f-string with two expressions in braces. `age + 10` is calculated and inserted."
  - title: Format specifications
    intro: The same numbers, formatted different ways.
    code: |
      price = 1234.5678
      ratio = 0.4567
      print(f"{price}")
      print(f"{price:.2f}")
      print(f"{price:,.2f}")
      print(f"{ratio:.1%}")
      print(f"{7:02d}:{5:02d}")
      print(f"[{'left':<8}] [{'right':>8}] [{'mid':^8}]")
    output: |
      1234.5678
      1234.57
      1,234.57
      45.7%
      07:05
      [left    ] [   right] [  mid   ]
    lines:
      - line: 3
        note: "With no format spec, the value is shown as-is."
      - line: 4
        note: "`.2f`: exactly 2 decimal places, rounded."
      - line: 5
        note: "`,` adds thousands separators, combined with `.2f`."
      - line: 6
        note: "`.1%` multiplies by 100 and adds a percent sign, with 1 decimal place."
      - line: 7
        note: "`02d` pads whole numbers with zeros to 2 digits: perfect for clock times."
      - line: 8
        note: "`<`, `>` and `^` align text within a fixed width of 8 characters. The square brackets show where the padding is."
  - title: A neat table
    intro: Fixed widths make columns line up, whatever the values.
    code: |
      print(f"{'Item':<10}{'Qty':>5}{'Price':>10}")
      print("-" * 25)
      print(f"{'Coffee':<10}{2:>5}{5.00:>10.2f}")
      print(f"{'Croissant':<10}{3:>5}{7.5:>10.2f}")
      print(f"{'Total':<10}{'':>5}{12.5:>10.2f}")
    output: |
      Item        Qty     Price
      -------------------------
      Coffee        2      5.00
      Croissant     3      7.50
      Total               12.50
    lines:
      - line: 1
        note: "Header row: column 1 is 10 characters, left-aligned; columns 2 and 3 are right-aligned (numbers usually are)."
      - line: 3
        note: "`>10.2f` combines width, alignment and decimal places: right-aligned in 10 characters with 2 decimals."
      - line: 5
        note: "An empty string fills the Qty column with spaces so the total lines up."

playground:
  prompt: |
    Write a mini program that asks for your name and a number, then prints a formatted message. Remember to put your input lines in the **Input** box, one per `input()` call. Experiment with format specs: what does `f"{3.14159:10.3f}"` give? `f"{42:b}"`? (That last one is a callback to Unit 1.)
  code: |
    name = input("Name: ")
    number = float(input("Favourite number: "))
    print(f"Hello {name}, your number squared is {number ** 2:,.2f}")
  stdin: |
    Alan
    12.5

exercises:
  - id: greet
    title: A friendly greeting
    difficulty: 1
    prompt: |
      Write a program that asks `What is your name? ` and then prints `Hello, NAME!` with the name inserted, using an f-string.

      For example, with the input `Ada`, the output should end with:

      ```text
      Hello, Ada!
      ```
    starter: |
      name = input("What is your name? ")
    testInput: |
      Ada
    tests:
      - name: greets Ada
        code: |
          assert "Hello, Ada!" in run("Ada"), f"With input Ada your program printed:\n{run('Ada')}"
      - name: greets other names
        code: |
          for n in ["Grace", "Linus Torvalds"]:
              out = run(n)
              assert f"Hello, {n}!" in out, f"With input {n!r} your program printed:\n{out}"
      - name: uses an f-string
        code: |
          assert 'f"' in source or "f'" in source, "Use an f-string, like f\"Hello, {name}!\""
    hints:
      - "The name is already stored in `name`. Now print it."
      - "`print(f\"Hello, {name}!\")`"
    solution: |
      name = input("What is your name? ")
      print(f"Hello, {name}!")
    explanation: |
      `input` returns whatever was typed, stored in `name`, and the f-string inserts it between `Hello, ` and `!`. The tests run your program several times with different names: a program should work for every input, not just one example.

  - id: add-two
    title: Add two numbers
    difficulty: 1
    prompt: |
      Ask the user for two whole numbers (prompts `First number: ` and `Second number: `) and print their sum like this:

      ```text
      The sum is 12
      ```

      Test it with the Input box: put `5` and `7` on separate lines.
    starter: |
      first = input("First number: ")
      second = input("Second number: ")
      print("The sum is", first + second)
    testInput: |
      5
      7
    tests:
      - name: 5 + 7 = 12
        code: |
          out = run("5", "7")
          assert "The sum is 12" in out, f"With inputs 5 and 7 your program printed:\n{out}\n(If you see 57, the inputs are still strings!)"
      - name: works with negative numbers
        code: |
          out = run("-10", "25")
          assert "The sum is 15" in out, f"With inputs -10 and 25 your program printed:\n{out}"
    hints:
      - "Run the starter code. Why does it print `57`? What type does `input` return?"
      - "Convert each input with `int(...)`, for example `first = int(input(\"First number: \"))`."
    solution: |
      first = int(input("First number: "))
      second = int(input("Second number: "))
      print("The sum is", first + second)
    explanation: |
      The starter prints `The sum is 57` because `input` returns strings, and `+` joins strings. Wrapping each `input` in `int()` converts the text to numbers, so `+` adds. This is the most common bug in beginner programs that read numbers, and now you'll recognise it instantly.

  - id: receipt-line
    title: Format a receipt line
    difficulty: 2
    prompt: |
      Read three lines of input: an **item name**, a **price** (may have decimals) and a **quantity** (whole number). Print a receipt line in exactly this format:

      ```text
      3 x Notebook @ £2.50 = £7.50
      ```

      Prices must always show 2 decimal places. Use any prompts you like.
    starter: |
      item = input("Item: ")
      price = input("Price: ")
      quantity = input("Quantity: ")
    testInput: |
      Notebook
      2.5
      3
    tests:
      - name: notebook example
        code: |
          out = run("Notebook", "2.5", "3")
          assert "3 x Notebook @ £2.50 = £7.50" in out, f"Your program printed:\n{out}"
      - name: other values, always 2 decimal places
        code: |
          out = run("Pen", "0.99", "10")
          assert "10 x Pen @ £0.99 = £9.90" in out, f"With Pen, 0.99, 10 your program printed:\n{out}"
          out = run("Laptop", "1200", "1")
          assert "1 x Laptop @ £1200.00 = £1200.00" in out, f"With Laptop, 1200, 1 your program printed:\n{out}"
    hints:
      - "Convert the price with `float()` and the quantity with `int()`."
      - "Calculate `total = price * quantity`."
      - "`print(f\"{quantity} x {item} @ £{price:.2f} = £{total:.2f}\")`"
    solution: |
      item = input("Item: ")
      price = float(input("Price: "))
      quantity = int(input("Quantity: "))
      total = price * quantity
      print(f"{quantity} x {item} @ £{price:.2f} = £{total:.2f}")
    explanation: |
      Each input needs the right type: the item stays a string, the price becomes a float, and the quantity becomes an int. The `:.2f` spec shows exactly two decimals, so 2.5 is shown as `2.50` and 9.899999... as `9.90`.

  - id: split-bill
    title: Split the bill
    difficulty: 2
    prompt: |
      Write a bill-splitting program. Read three inputs: the **bill total** (a float), the **tip percentage** (a whole number, like `15` for 15%) and the **number of people** (a whole number). Then print exactly two lines:

      ```text
      Tip: £13.50
      Each person pays £25.88
      ```

      (Those are the results for a bill of 90, a 15% tip, and 4 people.)
    starter: |
      # Input

      # Process

      # Output
    testInput: |
      90
      15
      4
    tests:
      - name: example from the prompt
        code: |
          out = run("90", "15", "4")
          assert "Tip: £13.50" in out, f"Your program printed:\n{out}"
          assert "Each person pays £25.88" in out, f"Your program printed:\n{out}"
      - name: another bill
        code: |
          out = run("47.80", "10", "3")
          assert "Tip: £4.78" in out and "Each person pays £17.53" in out, f"With 47.80, 10, 3 your program printed:\n{out}"
      - name: no tip, one person
        code: |
          out = run("20", "0", "1")
          assert "Tip: £0.00" in out and "Each person pays £20.00" in out, f"With 20, 0, 1 your program printed:\n{out}"
    hints:
      - "Read with `float(input(...))` for the bill and `int(input(...))` for the others."
      - "A 15% tip is `bill * 15 / 100`. The total to share is bill + tip."
      - "`each = (bill + tip) / people`, then print with `:.2f`."
    solution: |
      # Input
      bill = float(input("Bill total: "))
      tip_percent = int(input("Tip %: "))
      people = int(input("Number of people: "))

      # Process
      tip = bill * tip_percent / 100
      each = (bill + tip) / people

      # Output
      print(f"Tip: £{tip:.2f}")
      print(f"Each person pays £{each:.2f}")
    explanation: |
      90 × 15 / 100 = 13.50 tip, and (90 + 13.50) / 4 = 25.875, shown as **£25.88**. Note the brackets in `(bill + tip) / people`: without them, only the tip would be divided. Keeping input, processing and output separate makes the program easy to follow.

  - id: end-time
    title: When does it finish?
    difficulty: 3
    prompt: |
      Read a **start hour** (0 to 23), a **start minute** (0 to 59) and a **duration in minutes**. Print the finishing time on a 24-hour clock in the format `HH:MM` with leading zeros:

      ```text
      Finishes at 01:15
      ```

      (That's for a start of 23:30 with a duration of 105 minutes, which runs past midnight.) Use `//` and `%`; no `if` statements are needed.
    starter: |
      hour = int(input("Start hour: "))
      minute = int(input("Start minute: "))
      duration = int(input("Duration (minutes): "))
    testInput: |
      23
      30
      105
    tests:
      - name: past midnight
        code: |
          out = run("23", "30", "105")
          assert "Finishes at 01:15" in out, f"With 23, 30, 105 your program printed:\n{out}"
      - name: same day, leading zeros
        code: |
          out = run("9", "5", "0")
          assert "Finishes at 09:05" in out, f"With 9, 5, 0 your program printed:\n{out}"
          out = run("14", "50", "15")
          assert "Finishes at 15:05" in out, f"With 14, 50, 15 your program printed:\n{out}"
      - name: long durations wrap around days
        code: |
          out = run("8", "0", "1500")
          assert "Finishes at 09:00" in out, f"With 8, 0, 1500 (25 hours) your program printed:\n{out}"
    hints:
      - "Convert everything to minutes since midnight: `start = hour * 60 + minute`, then add the duration."
      - "A day has 1440 minutes. `end = (start + duration) % 1440` wraps past midnight."
      - "Then `end // 60` is the hour and `end % 60` is the minute. Format them with `:02d`."
    solution: |
      hour = int(input("Start hour: "))
      minute = int(input("Start minute: "))
      duration = int(input("Duration (minutes): "))

      start = hour * 60 + minute                # minutes since midnight
      end = (start + duration) % (24 * 60)      # wrap around midnight
      print(f"Finishes at {end // 60:02d}:{end % 60:02d}")
    explanation: |
      Converting to a single unit (minutes since midnight) turns a fiddly problem into simple arithmetic. `% 1440` wraps the time into a single day, exactly like the clock overflow in Lesson 1.2, then `//` and `%` split it back into hours and minutes. Converting to one unit, computing, then converting back is a technique you'll use constantly.

commonMistakes:
  - title: Forgetting to convert input
    explanation: |
      `input` returns a string, so `input() + 1` raises a `TypeError`, and adding two inputs joins them ("5" + "7" = "57"). Wrap the input in `int()` or `float()`.
    wrong: |
      age = input("Age: ")
      print(age + 1)
    right: |
      age = int(input("Age: "))
      print(age + 1)
  - title: Forgetting the f in an f-string
    explanation: |
      Without the `f`, the braces are printed literally: `"Hello {name}"` prints `Hello {name}`.
    wrong: |
      print("Hello {name}")
    right: |
      print(f"Hello {name}")
  - title: Converting a decimal with int()
    explanation: |
      If the user might type `2.5`, `int(input())` crashes with a ValueError. Use `float()` for anything that can have a fractional part.
  - title: Prompts without a trailing space
    explanation: |
      `input("Name:")` makes the user's typing touch the colon (`Name:Ada`). Add a space at the end: `input("Name: ")`.

summary:
  - "Programs follow **input → process → output**."
  - "`input(prompt)` shows the prompt and returns what the user typed **as a string**. Convert with `int()` or `float()` before doing arithmetic."
  - "**f-strings** (`f\"...{expr}...\"`) insert the value of any expression, with no need for `str()`."
  - "Format specs after a colon: `.2f` decimals, `,` separators, `%` percent, `<` `>` `^` alignment with a width, `02d` zero padding."
  - "Formatting changes how a value is displayed, not the value itself."
next: |
  So far, every program runs every line, every time. Real programs need to **make decisions**: grant access *if* the password is right, charge less *if* you're a student. In **Lesson 2.5** you'll learn `if`, `elif` and `else`, along with comparisons and the logic operators `and`, `or` and `not` (the AND, OR and NOT gates from Lesson 1.3, reborn in code).

quiz:
  - type: mcq
    question: The user types `42` in response to `x = input()`. What is the type of `x`?
    options: [int, float, str, bool]
    answer: 2
    explanation: input() always returns a string, even if it looks like a number. Convert with int(x).
  - type: mcq
    question: What does `print(f"{2 / 3:.2f}")` display?
    options: ["0.66", "0.67", "0.666", "2 / 3"]
    answer: 1
    explanation: "2/3 is 0.6666..., and .2f rounds to two decimal places for display: 0.67."
  - type: mcq
    question: What does `print(f"{5:03d}")` display?
    options: ["5", "500", "005", "5.000"]
    answer: 2
    explanation: 03d pads the whole number with zeros to a width of 3.
  - type: mcq
    question: "With inputs `3` and `4`, what does this print?\n\n```python\na = input()\nb = input()\nprint(a + b)\n```"
    options: ["7", "34", "12", "An error"]
    answer: 1
    explanation: Both values are strings, so + joins them into "34".
  - type: mcq
    question: "What does `print(\"Total: {total}\")` display, given `total = 10`?"
    options: ["Total: 10", "Total: {total}", "Total: total", "An error"]
    answer: 1
    explanation: Without the f prefix, it's an ordinary string and the braces are printed as-is.
  - type: mcq
    question: Which format spec displays `1234567.891` as `1,234,567.89`?
    options: [":.2f", ":,", ":,.2f", ":>2"]
    answer: 2
    explanation: The comma adds thousands separators and .2f gives two decimal places; combined, they're `,.2f`.
  - type: code
    question: |
      Read a distance in **kilometres** (it may have decimals) and print it in miles, to 2 decimal places, in exactly this form (for an input of 10):

      ```text
      10.0 km = 6.21 miles
      ```

      Use 1 km = 0.621371 miles. Show the kilometres exactly as converted by `float()`.
    starter: |
      km = input("Kilometres: ")
    testInput: |
      10
    tests:
      - name: converts correctly
        code: |
          out = run("10")
          assert "10.0 km = 6.21 miles" in out, f"With 10 your program printed:\n{out}"
          out = run("42.195")
          assert "42.195 km = 26.22 miles" in out, f"With 42.195 your program printed:\n{out}"
    solution: |
      km = float(input("Kilometres: "))
      miles = km * 0.621371
      print(f"{km} km = {miles:.2f} miles")
