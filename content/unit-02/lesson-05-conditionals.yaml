id: u2-conditionals
title: Making Decisions with if, elif and else
minutes: 50
objective: |
  Make programs choose between different actions using **comparisons**, **Boolean operators** (`and`, `or`, `not`) and **conditional statements** (`if`, `elif`, `else`), and test them thoroughly by checking every branch and boundary.
outcomes:
  - Write comparisons with `==`, `!=`, `<`, `>`, `<=`, `>=`, including chained comparisons
  - Use indentation correctly to group statements into blocks
  - Build `if` / `elif` / `else` chains where the order of conditions matters
  - Combine conditions with `and`, `or` and `not`, and simplify them with De Morgan's laws
  - Choose test inputs that exercise every branch and every boundary

sections:
  - heading: Programs that decide
    body: |
      Until now, every line of your programs has run, every time. But almost every interesting program needs to **choose**: show an error *if* the password is wrong, apply a discount *if* the customer is a student, end the game *if* lives reach zero.

      In Lesson 1.4 you saw how a CPU decides: a **conditional jump** skips over instructions when a condition holds. Python's `if` statement is that same mechanism with friendly syntax. Under the hood, Python compiles it to bytecode that tests a condition and jumps.

      Every decision starts with a question that has a yes-or-no answer: a **Boolean expression**, which evaluates to `True` or `False`.

  - heading: Comparison operators
    body: |
      | Operator | Meaning | Example | Result |
      |---|---|---|---|
      | `==` | equal to | `5 == 5` | `True` |
      | `!=` | not equal to | `5 != 3` | `True` |
      | `<` | less than | `3 < 5` | `True` |
      | `>` | greater than | `3 > 5` | `False` |
      | `<=` | less than or equal to | `5 <= 5` | `True` |
      | `>=` | greater than or equal to | `4 >= 5` | `False` |

      > **Warning:** `=` and `==` are completely different. `=` **assigns** (makes a name refer to a value). `==` **compares** (asks whether two values are equal). Writing `if x = 5:` is a syntax error; you meant `if x == 5:`.

      Strings can be compared too. `==` checks they're exactly the same (case matters: `"Yes" == "yes"` is `False`). `<` and `>` compare character by character using the character codes from Lesson 1.2, so `"apple" < "banana"` is `True`, but `"Zebra" < "apple"` is also `True`, because uppercase letters (65 to 90) come before lowercase (97 to 122).

      Python lets you **chain** comparisons the way mathematicians write them: `0 <= x < 10` means "x is at least 0 and less than 10".

  - heading: The if statement and indentation
    body: |
      ```python
      temperature = 31
      if temperature > 30:
          print("It's hot!")
          print("Drink water.")
      print("Have a nice day.")
      ```

      The structure:

      - The keyword `if`, then a condition, then a **colon** `:`.
      - An **indented block** of one or more statements, which run **only if** the condition is `True`.
      - The first line that's no longer indented marks the end of the block. It runs no matter what.

      **Indentation is part of Python's syntax.** Other languages use curly braces `{ }` to group statements; Python uses indentation, so code *must* look the way it's structured. The standard is **4 spaces** per level (the editor inserts them when you press Tab). Mixing indentation levels inconsistently gives an `IndentationError`.

  - heading: else and elif
    body: |
      `else` gives an alternative that runs when the condition is `False`. Exactly one of the two blocks runs:

      ```python
      if age >= 18:
          print("You can vote.")
      else:
          print("Not yet!")
      ```

      For more than two possibilities, use `elif` (short for "else if"):

      ```python
      if score >= 90:
          grade = "A"
      elif score >= 80:
          grade = "B"
      elif score >= 70:
          grade = "C"
      else:
          grade = "F"
      ```

      Python checks the conditions **from the top down** and runs the block for the **first** one that's `True`, then skips the rest of the chain. `else` catches everything that didn't match.

      > **Key idea:** In an `elif` chain, **order matters**. A score of 95 is also `>= 80` and `>= 70`, but it gets an A because that condition is checked first. If you put `score >= 70` at the top, everyone with 70 or more would get a C. Each `elif` can rely on all the conditions above it having been False.

  - heading: and, or, not
    body: |
      Remember the logic gates from Lesson 1.3? Here they are again, as Python keywords that work on `True` and `False`:

      | Expression | True when... |
      |---|---|
      | `a and b` | both `a` and `b` are True |
      | `a or b` | at least one of them is True |
      | `not a` | `a` is False |

      ```python
      if age >= 18 and has_ticket:
          print("Come in!")
      if day == "Saturday" or day == "Sunday":
          print("Weekend!")
      if not raining:
          print("Let's go outside.")
      ```

      Precedence: `not` binds tightest, then `and`, then `or`. So `a or b and c` means `a or (b and c)`. Use brackets whenever you mix them.

      **Short-circuit evaluation:** Python stops evaluating as soon as it knows the answer. In `a and b`, if `a` is False, the whole thing must be False, so `b` is never even looked at. In `a or b`, if `a` is True, `b` is skipped. This lets you write safe checks like `count != 0 and total / count > 5`: the division only happens when `count` isn't zero.

      **De Morgan's laws** (Lesson 1.3) help simplify conditions:

      - `not (a and b)` is the same as `(not a) or (not b)`
      - `not (a or b)` is the same as `(not a) and (not b)`

      So "not (weekend or holiday)" means "not weekend and not holiday".

  - heading: Nesting, and testing every branch
    body: |
      You can put an `if` inside another `if` (**nesting**). Each level adds 4 more spaces:

      ```python
      if logged_in:
          if is_admin:
              print("Admin panel")
          else:
              print("Dashboard")
      else:
          print("Please log in")
      ```

      Nesting is sometimes the clearest option, but deep nesting gets hard to read. Often a combined condition (`if logged_in and is_admin:`) or an `elif` chain is flatter and clearer.

      **Testing decisions.** A program with branches has several paths through it, and every one can hide a bug. Professional testers check:

      1. **Every branch**: at least one input that reaches each block.
      2. **Every boundary**: values right at the edges of conditions, and on each side. If the rule is "18 or over", test 17, 18 and 19. Boundaries are where most bugs live, typically from writing `>` when you meant `>=`.

      The automatic tests in these exercises do exactly this, and from now on you should do it in your own head too.

      > **Note:** Python also treats some non-Boolean values as true or false when used as a condition (called **truthiness**): `0`, `0.0` and the empty string `""` count as False, and other numbers and non-empty strings count as True. So `if name:` means "if name isn't empty". It's handy, but when you're starting out, explicit comparisons like `if name != "":` are clearer.

examples:
  - title: Comparisons produce booleans
    intro: Every condition is just an expression that evaluates to True or False.
    code: |
      x = 7
      print(x > 5, x == 7, x != 7)
      print(0 <= x < 10)
      print("apple" < "banana", "Zebra" < "apple")
      print("yes" == "Yes", "yes" == "Yes".lower())
    output: |
      True True False
      True
      True True
      False True
    lines:
      - line: 2
        note: "Three comparisons, three booleans."
      - line: 3
        note: "A chained comparison: is x in the range 0 up to (but not including) 10?"
      - line: 4
        note: "Strings compare by character codes. \"Z\" (90) is less than \"a\" (97), so \"Zebra\" comes first."
      - line: 5
        note: "Case matters in `==`. Converting to lowercase first is the standard way to compare user input."
  - title: An elif chain
    intro: Python picks the first true condition from the top. This example reads a temperature from the Input box.
    code: |
      temp = float(input("Temperature (°C): "))
      if temp >= 30:
          advice = "Hot: stay in the shade"
      elif temp >= 20:
          advice = "Warm: perfect weather"
      elif temp >= 10:
          advice = "Mild: bring a jumper"
      else:
          advice = "Cold: wear a coat"
      print(advice)
    stdin: |
      24
    output: |
      Temperature (°C): 24
      Warm: perfect weather
    lines:
      - line: 2
        note: "24 >= 30 is False, so this block is skipped."
      - line: 4
        note: "24 >= 20 is True: this block runs, and the rest of the chain is skipped entirely."
      - line: 4-7
        note: "Each elif can assume the conditions above it were False. Here, `temp >= 10` really means \"between 10 and 20\"."
      - line: 8
        note: "`else` has no condition: it catches everything left over (below 10)."
  - title: Combining conditions
    intro: and, or and not, plus short-circuiting.
    code: |
      age = 25
      has_id = True
      day = "Sunday"
      print(age >= 18 and has_id)
      print(day == "Saturday" or day == "Sunday")
      print(not has_id)
      count = 0
      print(count != 0 and 10 / count > 2)
    output: |
      True
      True
      False
      False
    lines:
      - line: 4
        note: "Both conditions are True, so `and` gives True."
      - line: 5
        note: "Each side of `or` must be a full comparison. (`day == \"Saturday\" or \"Sunday\"` is a classic bug; see Common Mistakes.)"
      - line: 6
        note: "`not` flips a boolean."
      - line: 7-8
        note: "`count != 0` is False, so `and` stops right there. The division by zero on the right is never evaluated: short-circuiting prevents a crash."

playground:
  prompt: |
    Write a "should I take an umbrella?" program: read whether it's raining (`y`/`n`) and the chance of rain as a percentage, then decide. Try to make one decision use `and` and another use `or`. Test every branch by changing the input lines.
  code: |
    raining = input("Is it raining? (y/n) ")
    chance = int(input("Chance of rain (%): "))
    if raining == "y" or chance > 60:
        print("Take an umbrella")
    else:
        print("Leave it at home")
  stdin: |
    n
    75

exercises:
  - id: even-odd
    title: Even or odd?
    difficulty: 1
    prompt: |
      Read a whole number and print `even` if it's even, or `odd` if it's odd. (Remember the remainder operator from Lesson 2.2.)
    starter: |
      n = int(input("Number: "))
    testInput: |
      7
    tests:
      - name: 7 is odd and 10 is even
        code: |
          assert run("7").strip().endswith("odd"), f"With 7 your program printed:\n{run('7')}"
          assert run("10").strip().endswith("even"), f"With 10 your program printed:\n{run('10')}"
      - name: 0 and negative numbers
        code: |
          assert run("0").strip().endswith("even"), f"0 is even. Your program printed:\n{run('0')}"
          assert run("-3").strip().endswith("odd"), f"-3 is odd. Your program printed:\n{run('-3')}"
      - name: prints exactly one answer
        code: |
          out = run("4")
          assert ("even" in out) != ("odd" in out), f"Print exactly one of even/odd. Your program printed:\n{out}"
    hints:
      - "A number is even when dividing by 2 leaves no remainder: `n % 2 == 0`."
      - "Use `if n % 2 == 0:` with an `else:`."
    solution: |
      n = int(input("Number: "))
      if n % 2 == 0:
          print("even")
      else:
          print("odd")
    explanation: |
      `n % 2` is 0 for even numbers and 1 for odd numbers (including negative odd numbers in Python, because `%` follows the sign of the divisor). With `if`/`else`, exactly one branch runs, so exactly one word is printed. The tests try 0 and a negative number: edge cases are where bugs hide.

  - id: letter-grade
    title: Letter grades
    difficulty: 1
    prompt: |
      Read a score from 0 to 100 and print its grade in the form `Grade: B`:

      | Score | Grade |
      |---|---|
      | 90 and above | A |
      | 80 to 89 | B |
      | 70 to 79 | C |
      | 60 to 69 | D |
      | below 60 | F |
    starter: |
      score = int(input("Score: "))
    testInput: |
      85
    tests:
      - name: one score in each band
        code: |
          for s, g in [(95, "A"), (85, "B"), (75, "C"), (65, "D"), (30, "F")]:
              out = run(str(s))
              assert f"Grade: {g}" in out, f"With {s}, expected Grade: {g}, but your program printed:\n{out}"
      - name: exact boundaries
        code: |
          for s, g in [(90, "A"), (89, "B"), (80, "B"), (79, "C"), (70, "C"), (60, "D"), (59, "F"), (100, "A"), (0, "F")]:
              out = run(str(s))
              assert f"Grade: {g}" in out, f"Boundary check: with {s}, expected Grade: {g}, but your program printed:\n{out}"
    hints:
      - "Use an `if` / `elif` / `else` chain, starting with the highest grade."
      - "`if score >= 90:` then `elif score >= 80:` and so on. Each elif can assume the ones above were False."
    solution: |
      score = int(input("Score: "))
      if score >= 90:
          grade = "A"
      elif score >= 80:
          grade = "B"
      elif score >= 70:
          grade = "C"
      elif score >= 60:
          grade = "D"
      else:
          grade = "F"
      print(f"Grade: {grade}")
    explanation: |
      Checking from the top means each `elif` only needs a lower bound: by the time Python checks `score >= 80`, it already knows the score is below 90. Storing the result in `grade` and printing once at the end avoids repeating the `print` in every branch.

  - id: leap-year
    title: Leap years
    difficulty: 2
    prompt: |
      The rule for leap years in the Gregorian calendar is:

      - A year divisible by 4 is a leap year,
      - **except** years divisible by 100, which are not,
      - **except** years divisible by 400, which are.

      So 2024 is a leap year, 1900 is not, and 2000 is. Read a year and print `leap year` or `not a leap year`.
    starter: |
      year = int(input("Year: "))
    testInput: |
      2024
    tests:
      - name: ordinary years
        code: |
          assert run("2024").strip().endswith("leap year") and "not" not in run("2024"), f"2024 is a leap year. You printed:\n{run('2024')}"
          assert "not a leap year" in run("2023"), f"2023 is not a leap year. You printed:\n{run('2023')}"
      - name: century years
        code: |
          assert "not a leap year" in run("1900"), f"1900 is divisible by 100 but not 400, so not a leap year. You printed:\n{run('1900')}"
          assert "not" not in run("2000") and "leap year" in run("2000"), f"2000 is divisible by 400, so it is a leap year. You printed:\n{run('2000')}"
      - name: more checks
        code: |
          for y in [1600, 1700, 1996, 2100, 2400, 1]:
              leap = (y % 4 == 0 and y % 100 != 0) or y % 400 == 0
              out = run(str(y))
              ok = ("not a leap year" not in out and "leap year" in out) if leap else ("not a leap year" in out)
              assert ok, f"For {y}, expected {'leap year' if leap else 'not a leap year'}. You printed:\n{out}"
    hints:
      - "Write the condition in words first: \"divisible by 4 and not divisible by 100, or divisible by 400\"."
      - "\"Divisible by 4\" is `year % 4 == 0`. \"Not divisible by 100\" is `year % 100 != 0`."
      - "`if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:`"
    solution: |
      year = int(input("Year: "))
      if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:
          print("leap year")
      else:
          print("not a leap year")
    explanation: |
      Translating the English rule directly gives `(divisible by 4 and not by 100) or divisible by 400`. The brackets make the grouping explicit. An equally correct approach uses an `elif` chain checking 400 first, then 100, then 4: order matters there, just as in the grading exercise. The tests check the tricky century years, which is exactly where buggy versions fail (and a real bug of this kind once crashed software around the year 2000).

  - id: cinema-ticket
    title: Cinema tickets
    difficulty: 2
    prompt: |
      Read a customer's **age** and whether they're a **student** (`y` or `n`), then print the ticket price in the form `Ticket: £8.00`:

      | Customer | Price |
      |---|---|
      | under 5 | free (£0.00) |
      | 5 to 15 | £6.00 |
      | 65 or over | £7.00 |
      | 16 to 64 and a student | £8.00 |
      | everyone else | £12.00 |

      The student answer might be typed as `Y` or `y`; treat both the same.
    starter: |
      age = int(input("Age: "))
      student = input("Student? (y/n) ")
    testInput: |
      20
      y
    tests:
      - name: each price band
        code: |
          for a, s, p in [(3, "n", "0.00"), (10, "n", "6.00"), (70, "n", "7.00"), (20, "y", "8.00"), (30, "n", "12.00")]:
              out = run(str(a), s)
              assert f"Ticket: £{p}" in out, f"Age {a}, student {s}: expected £{p}. You printed:\n{out}"
      - name: boundaries
        code: |
          for a, s, p in [(4, "n", "0.00"), (5, "n", "6.00"), (15, "n", "6.00"), (16, "n", "12.00"), (64, "y", "8.00"), (65, "y", "7.00")]:
              out = run(str(a), s)
              assert f"Ticket: £{p}" in out, f"Boundary: age {a}, student {s}: expected £{p}. You printed:\n{out}"
      - name: students under 16 or over 64 get the age price
        code: |
          assert "Ticket: £6.00" in run("12", "y"), "A 12-year-old student pays the child price."
          assert "Ticket: £7.00" in run("70", "y"), "A 70-year-old student pays the senior price."
      - name: accepts Y as well as y
        code: |
          assert "Ticket: £8.00" in run("19", "Y"), f"Treat Y like y. You printed:\n{run('19', 'Y')}"
    hints:
      - "Use one `if`/`elif` chain: under 5, then under 16, then 65 or over, then student, then everything else."
      - "Make the student answer lowercase first: `student = student.lower()`, then compare with `== \"y\"`."
      - "Print with `f\"Ticket: £{price:.2f}\"` so whole numbers show as 6.00."
    solution: |
      age = int(input("Age: "))
      student = input("Student? (y/n) ").lower()
      if age < 5:
          price = 0
      elif age <= 15:
          price = 6
      elif age >= 65:
          price = 7
      elif student == "y":
          price = 8
      else:
          price = 12
      print(f"Ticket: £{price:.2f}")
    explanation: |
      Ordering the chain carefully keeps every condition simple. Because children and seniors are handled first, the `student == "y"` check only ever sees ages 16 to 64, which is exactly the rule. Lowercasing the input once, at the start, handles `Y` and `y` together. The tests probe both sides of every boundary (4/5, 15/16, 64/65).

  - id: triangle-type
    title: Classify a triangle
    difficulty: 3
    prompt: |
      Read three side lengths (they may have decimals) and print one of:

      - `not a triangle` if any side is zero or negative, **or** if the sides can't form a triangle (each side must be **shorter** than the sum of the other two),
      - `equilateral` if all three sides are equal,
      - `isosceles` if exactly two sides are equal,
      - `scalene` if no sides are equal.
    starter: |
      a = float(input("Side a: "))
      b = float(input("Side b: "))
      c = float(input("Side c: "))
    testInput: |
      3
      4
      5
    tests:
      - name: the three triangle types
        code: |
          assert run("3", "4", "5").strip().endswith("scalene"), f"3, 4, 5 is scalene. You printed:\n{run('3', '4', '5')}"
          assert run("2", "2", "2").strip().endswith("equilateral"), f"2, 2, 2 is equilateral. You printed:\n{run('2', '2', '2')}"
          for sides in [("5", "5", "8"), ("5", "8", "5"), ("8", "5", "5")]:
              out = run(*sides)
              assert out.strip().endswith("isosceles"), f"{sides} is isosceles (in any order). You printed:\n{out}"
      - name: impossible triangles
        code: |
          for sides in [("1", "2", "10"), ("10", "1", "2"), ("1", "10", "2"), ("1", "2", "3")]:
              out = run(*sides)
              assert "not a triangle" in out, f"{sides} can't form a triangle (a side must be shorter than the other two combined). You printed:\n{out}"
      - name: zero and negative sides
        code: |
          for sides in [("0", "0", "0"), ("-3", "4", "5"), ("3", "4", "0")]:
              out = run(*sides)
              assert "not a triangle" in out, f"{sides} is not a triangle. You printed:\n{out}"
      - name: decimals work
        code: |
          assert run("1.5", "1.5", "2.5").strip().endswith("isosceles"), "1.5, 1.5, 2.5 is isosceles."
    hints:
      - "Check for invalid triangles first, then the types. The validity test: `a <= 0 or b <= 0 or c <= 0 or a + b <= c or a + c <= b or b + c <= a`."
      - "Equilateral: `a == b and b == c` (or `a == b == c`)."
      - "Isosceles: `a == b or b == c or a == c`. Since equilateral was already checked above, this means *exactly* two."
    solution: |
      a = float(input("Side a: "))
      b = float(input("Side b: "))
      c = float(input("Side c: "))

      if a <= 0 or b <= 0 or c <= 0 or a + b <= c or a + c <= b or b + c <= a:
          print("not a triangle")
      elif a == b == c:
          print("equilateral")
      elif a == b or b == c or a == c:
          print("isosceles")
      else:
          print("scalene")
    explanation: |
      Handling the invalid cases **first** means the later branches can assume they have a real triangle. Then the order of the `elif`s does the rest: by the time we test for isosceles, we know the triangle isn't equilateral, so "some pair is equal" means "exactly two are equal". Notice `1, 2, 3` is rejected: the sides would lie flat in a line. Using `<=` rather than `<` handles that boundary. This exercise is famous in software testing courses because of how many boundary cases it has.

commonMistakes:
  - title: Using = instead of ==
    explanation: |
      `=` assigns, `==` compares. Python reports `if x = 5:` as a syntax error (helpfully suggesting `==`).
    wrong: |
      if answer = "yes":
          print("Great")
    right: |
      if answer == "yes":
          print("Great")
  - title: Writing "x == a or b"
    explanation: |
      `day == "Sat" or "Sun"` doesn't mean "day is Sat or Sun". It means `(day == "Sat") or ("Sun")`, and the non-empty string `"Sun"` counts as True, so the condition is **always** True. Each side of `or` must be a complete comparison.
    wrong: |
      if day == "Sat" or "Sun":
          print("Weekend")
    right: |
      if day == "Sat" or day == "Sun":
          print("Weekend")
  - title: Ordering an elif chain wrongly
    explanation: |
      The first true condition wins. If a broad condition comes first, the narrower ones below it can never run.
    wrong: |
      if score >= 60:
          grade = "D"
      elif score >= 90:
          grade = "A"   # never reached!
    right: |
      if score >= 90:
          grade = "A"
      elif score >= 60:
          grade = "D"
  - title: Forgetting the colon or the indentation
    explanation: |
      Every `if`, `elif` and `else` line ends with `:`, and the block under it must be indented. A missing colon gives a SyntaxError; a missing indent gives an IndentationError.
  - title: Off-by-one boundaries
    explanation: |
      "18 or over" is `>= 18`, not `> 18`. Always ask: what should happen exactly *at* the boundary? Then test that value.

summary:
  - "Comparisons (`==`, `!=`, `<`, `>`, `<=`, `>=`) produce booleans. Strings compare by character codes. Comparisons can be chained: `0 <= x < 10`."
  - "`if condition:` runs its **indented block** only when the condition is True. Indentation (4 spaces) defines blocks in Python."
  - "`elif` and `else` extend the choice. Python runs the **first** True branch only, so **order matters**."
  - "`and`, `or`, `not` combine conditions, like the logic gates of Lesson 1.3. They short-circuit. De Morgan's laws help simplify `not (...)`."
  - "Test **every branch** and **every boundary** (just below, at, and just above)."
next: |
  Decisions let a program choose a path once. But computers truly shine at doing things **over and over**: processing every customer, checking every password attempt, simulating every frame of a game. In **Lesson 2.6** you'll learn the `while` loop, which repeats code as long as a condition stays true. You've already built one by hand: the TOY CPU countdown in Lesson 1.4.

quiz:
  - type: mcq
    question: "What is printed when `x = 15`?\n\n```python\nif x > 10:\n    print(\"big\")\nelif x > 5:\n    print(\"medium\")\nelse:\n    print(\"small\")\n```"
    options: ['big', 'medium', 'big and medium', 'small']
    answer: 0
    explanation: Python runs only the first branch whose condition is True. 15 > 10, so "big" is printed and the rest of the chain is skipped.
  - type: mcq
    question: What does `not (True and False)` evaluate to?
    options: ["True", "False", "An error", "None"]
    answer: 0
    explanation: True and False is False, and not False is True.
  - type: mcq
    question: Which condition correctly checks whether `x` is between 1 and 10 inclusive?
    options: ["1 < x < 10", "1 <= x <= 10", "x >= 1 or x <= 10", "x == 1 to 10"]
    answer: 1
