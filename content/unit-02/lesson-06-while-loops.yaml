id: u2-while
title: Repetition with while Loops
minutes: 50
objective: |
  Repeat code with **`while` loops**, master the core loop patterns (**counter**, **accumulator**, **sentinel**, **input validation**), stop loops early with `break`, and reason carefully about when a loop ends so you avoid **infinite loops**.
outcomes:
  - Write a `while` loop and trace it with a table, iteration by iteration
  - Use counters and accumulators to count and total values
  - Read input until a sentinel value, and keep asking until input is valid
  - Use `while True` with `break` for loops that exit in the middle
  - Recognise, avoid and fix infinite loops
  - Process the digits of a number of any length

sections:
  - heading: Why loops?
    body: |
      Suppose you want to print the numbers 1 to 5. You could write five `print` statements. Now print 1 to a million. Or keep asking for a password until it's right, without knowing in advance how many attempts it will take. Copying lines won't work: you need **repetition**.

      In Lesson 1.4 you built a loop on the TOY CPU with a conditional jump that went *forwards* (to exit) and an unconditional jump that went *backwards* (to repeat). Python's `while` loop packages exactly that pattern:

      ```python
      count = 1
      while count <= 5:
          print(count)
          count = count + 1
      print("Done")
      ```

      Read it as: "**while** `count <= 5` is True, run the indented block; then check again." Each run through the block is called an **iteration**.

  - heading: How a while loop runs
    body: |
      1. Evaluate the **condition**.
      2. If it's False, skip the block and continue after the loop. The loop is over.
      3. If it's True, run the whole **body** (the indented block), then **go back to step 1**.

      The condition is checked only at the *top* of each iteration, not continuously. If it becomes False halfway through the body, the rest of the body still runs.

      Tracing the loop above in a table:

      | Check | `count` | `count <= 5`? | Prints |
      |---|---|---|---|
      | 1 | 1 | True | 1 |
      | 2 | 2 | True | 2 |
      | 3 | 3 | True | 3 |
      | 4 | 4 | True | 4 |
      | 5 | 5 | True | 5 |
      | 6 | 6 | **False** | (loop ends, "Done") |

      Notice the condition is checked **6 times** for **5 iterations**: the final check is the one that fails. If the condition is False the very first time, the body runs **zero** times.

      > **Key idea:** Every `while` loop needs three things: (1) a variable the condition depends on, set up **before** the loop; (2) the **condition**; and (3) something **inside** the body that changes the variable so the condition eventually becomes False. Forget the third and the loop never ends.

  - heading: Counters and accumulators
    body: |
      Two patterns appear in almost every loop you'll ever write.

      A **counter** counts how many times something happens. Start it at 0 and add 1 each time:

      ```python
      count = 0
      # ...inside the loop, when the thing happens:
      count += 1
      ```

      An **accumulator** builds up a result, such as a running total. Start it at the "empty" value (0 for a sum, 1 for a product, `""` for a string) and combine each new value into it:

      ```python
      total = 0
      n = 1
      while n <= 100:
          total += n
          n += 1
      print(total)   # 5050
      ```

      > **Note:** Legend says the mathematician Carl Friedrich Gauss, as a schoolboy, found 1 + 2 + ... + 100 in seconds by pairing numbers: 1 + 100, 2 + 99, ... gives 50 pairs of 101, so 5050. In general, 1 + ... + n = n(n + 1)/2. A loop takes 100 steps; the formula takes one. Finding a smarter method than brute repetition is what algorithm design (Units 4 and 8) is all about.

  - heading: Sentinel loops and break
    body: |
      Often you don't know how many times to repeat. A **sentinel** is a special value that means "stop", like typing `0` or `done`:

      ```python
      total = 0
      value = int(input("Number (0 to stop): "))
      while value != 0:
          total += value
          value = int(input("Number (0 to stop): "))
      print("Total:", total)
      ```

      Notice the `input` appears twice: once before the loop (to have something to check) and once at the end of the body (to get the next value). This works, but repeating code is a smell. A cleaner shape uses `while True` with **`break`**:

      ```python
      total = 0
      while True:
          value = int(input("Number (0 to stop): "))
          if value == 0:
              break
          total += value
      print("Total:", total)
      ```

      `while True` would loop forever, but `break` **immediately exits** the loop it's in, jumping to the first line after it. This "loop and a half" shape is ideal when the exit test naturally belongs in the *middle* of the body: get a value, check it, then use it.

  - heading: Input validation loops
    body: |
      Real users mistype. A **validation loop** keeps asking until the input is acceptable:

      ```python
      age = int(input("Age (0-120): "))
      while age < 0 or age > 120:
          print("That doesn't look right. Try again.")
          age = int(input("Age (0-120): "))
      print("Thanks!")
      ```

      The loop body only runs while the input is *invalid*, so after the loop you can rely on `age` being in range. Reasoning like this, "after this loop, I know that...", is how professionals convince themselves code is correct. (In Lesson 2.9 you'll also handle input that isn't a number at all.)

  - heading: Infinite loops
    body: |
      An **infinite loop** never ends because its condition never becomes False. Common causes:

      - Forgetting to update the loop variable (`count += 1` is missing).
      - Updating it in the wrong direction (`count -= 1` when counting up).
      - A condition that skips past its target, like the TOY loop in Lesson 1.4 that went 10, 7, 4, 1, −2 and never hit exactly 0. Using `<=` or `>` instead of `==` or `!=` makes conditions much more robust.

      In this app, code that runs for more than 10 seconds is stopped automatically and you'll see a "Time limit exceeded" message. In a normal terminal, press **Ctrl+C** to stop a runaway program.

      > **Tip:** When a loop misbehaves, add a temporary `print` inside the body showing the loop variables. Watching values change iteration by iteration almost always reveals the bug immediately.

  - heading: Taking numbers apart with a loop
    body: |
      In Lesson 2.2 you split a three-digit number with `% 10` and `// 10`. A loop does it for numbers of **any** length:

      ```python
      n = 90210
      digit_sum = 0
      while n > 0:
          digit_sum += n % 10    # add the last digit
          n //= 10               # remove the last digit
      print(digit_sum)           # 12
      ```

      Each iteration peels off one digit, and the loop ends when nothing is left. It's exactly the repeated-division method you used to convert to binary in Lesson 1.1, with 10 instead of 2. Change both 10s to 2s and this loop adds up the 1-bits of a number in binary.

examples:
  - title: A counting loop, traced
    intro: The printed values show every iteration. Count how many times the body runs.
    code: |
      count = 1
      while count <= 5:
          print("Iteration", count)
          count += 1
      print("After the loop, count is", count)
    output: |
      Iteration 1
      Iteration 2
      Iteration 3
      Iteration 4
      Iteration 5
      After the loop, count is 6
    lines:
      - line: 1
        note: "Set up the loop variable **before** the loop."
      - line: 2
        note: "Checked before every iteration. When count is 6, it's False and the loop ends."
      - line: 3-4
        note: "The body. `count += 1` moves the loop towards ending. Without it, this would print \"Iteration 1\" forever."
      - line: 5
        note: "count is 6, not 5: the loop only stopped once the condition failed. Remember this; it's a common source of off-by-one errors."
  - title: Accumulating a total with a sentinel
    intro: Keep reading numbers until the user enters 0. The Input box holds the numbers this example reads.
    code: |
      total = 0
      count = 0
      while True:
          value = float(input("Number (0 to stop): "))
          if value == 0:
              break
          total += value
          count += 1
      print(f"{count} numbers, total {total}, average {total / count:.2f}")
    stdin: |
      4
      10
      7
      0
    output: |
      Number (0 to stop): 4
      Number (0 to stop): 10
      Number (0 to stop): 7
      Number (0 to stop): 0
      3 numbers, total 21.0, average 7.00
    lines:
      - line: 1-2
        note: "An accumulator (total, starting at 0) and a counter (count, starting at 0)."
      - line: 3
        note: "`while True` loops until a `break`."
      - line: 4-6
        note: "Read a value, and if it's the sentinel, leave the loop immediately. The 0 is never added to the total."
      - line: 7-8
        note: "Use the value: add it to the total and count it."
      - line: 9
        note: "After the loop, use the results. (If the very first number were 0, count would be 0 and dividing would crash. Exercise 2 asks you to handle that.)"
  - title: Digits of any number
    intro: Peeling digits off with % and //, one per iteration.
    code: |
      n = 90210
      digits = 0
      digit_sum = 0
      while n > 0:
          last = n % 10
          print("peeled off", last, "leaving", n // 10)
          digit_sum += last
          digits += 1
          n //= 10
      print(digits, "digits, summing to", digit_sum)
    output: |
      peeled off 0 leaving 9021
      peeled off 1 leaving 902
      peeled off 2 leaving 90
      peeled off 0 leaving 9
      peeled off 9 leaving 0
      5 digits, summing to 12
    lines:
      - line: 4
        note: "Keep going while there are digits left."
      - line: 5
        note: "`n % 10` is the last digit."
      - line: 6
        note: "A temporary debugging-style print, so you can watch each step."
      - line: 7-8
        note: "An accumulator and a counter."
      - line: 9
        note: "`n //= 10` removes the last digit. This is what eventually makes the condition False."

playground:
  prompt: |
    Modify the loop to count down from 10 to 1, or to print only even numbers, or to print the powers of 2 below 1000 (start at 1 and double each time). Then deliberately create an infinite loop by deleting the update line, and watch the time limit stop it.
  code: |
    n = 1
    while n < 1000:
        print(n)
        n = n * 2

exercises:
  - id: countdown
    title: Countdown to liftoff
    difficulty: 1
    prompt: |
      Read a whole number `n`, then print the numbers from `n` down to 1, one per line, followed by `Liftoff!`. For an input of 3:

      ```text
      3
      2
      1
      Liftoff!
      ```

      If `n` is 0 or negative, just print `Liftoff!`.
    starter: |
      n = int(input("Start from: "))
    testInput: |
      3
    tests:
      - name: counts down from 3
        code: |
          out = run("3")
          assert out.endswith("3\n2\n1\nLiftoff!\n"), f"With 3 your program printed:\n{out!r}"
      - name: counts down from 10
        code: |
          out = run("10")
          lines = out.strip().split("\n")
          assert lines[-1] == "Liftoff!" and lines[-11].endswith("10") and lines[-2] == "1", f"With 10 your program printed:\n{out}"
      - name: zero just lifts off
        code: |
          out = run("0")
          assert out.strip().endswith("Liftoff!") and "\n0" not in out and "1\n" not in out, f"With 0, only Liftoff! should be printed after the prompt. You printed:\n{out!r}"
      - name: uses a while loop
        code: |
          assert "while" in source, "Use a while loop."
    hints:
      - "Loop `while n >= 1:` (or `while n > 0:`)."
      - "Inside: print n, then decrease it with `n -= 1`."
      - "Print `Liftoff!` after the loop (not indented)."
    solution: |
      n = int(input("Start from: "))
      while n > 0:
          print(n)
          n -= 1
      print("Liftoff!")
    explanation: |
      The loop condition `n > 0` handles the 0 and negative cases for free: the condition is False immediately, so the body runs zero times. `n -= 1` makes progress towards ending the loop. `Liftoff!` is outside the loop, so it prints once, after the countdown.

  - id: sentinel-total
    title: Total until zero
    difficulty: 2
    prompt: |
      Read whole numbers one per line until the user enters `0`. Then print two lines:

      ```text
      Count: 3
      Total: 21
      ```

      The `0` itself shouldn't be counted. If the first number is 0, print `Count: 0` and `Total: 0`. Negative numbers count normally.
    starter: |
      total = 0
      count = 0
    testInput: |
      4
      10
      7
      0
    tests:
      - name: 4, 10, 7, then 0
        code: |
          out = run("4", "10", "7", "0")
          assert "Count: 3" in out and "Total: 21" in out, f"Your program printed:\n{out}"
      - name: immediate 0
        code: |
          out = run("0")
          assert "Count: 0" in out and "Total: 0" in out, f"With only 0, your program printed:\n{out}"
      - name: negatives and many values
        code: |
          out = run("5", "-8", "3", "100", "-1", "0")
          assert "Count: 5" in out and "Total: 99" in out, f"Your program printed:\n{out}"
      - name: stops at the 0 (ignores anything after it)
        code: |
          out = run("2", "0", "50")
          assert "Count: 1" in out and "Total: 2" in out, f"Stop reading at the first 0. Your program printed:\n{out}"
    hints:
      - "Use `while True:` and read a number at the start of the body."
      - "`if value == 0: break` exits the loop before the 0 is added."
      - "After the `if`, add the value to `total` and 1 to `count`."
    solution: |
      total = 0
      count = 0
      while True:
          value = int(input("Number (0 to stop): "))
          if value == 0:
              break
          total += value
          count += 1
      print(f"Count: {count}")
      print(f"Total: {total}")
    explanation: |
      The `break` comes *before* the accumulator updates, so the sentinel is never counted. Starting both variables at 0 means the "first number is 0" case just works. The last test checks that the program really stops at the first 0 and doesn't read any more input.

  - id: digit-sum-loop
    title: Sum the digits of any number
    difficulty: 2
    prompt: |
      Read a non-negative whole number of any length and print the sum of its digits, using a `while` loop with `%` and `//` (no strings). For `90210`:

      ```text
      Digit sum: 12
      ```

      Make sure an input of `0` gives `Digit sum: 0`.
    starter: |
      n = int(input("Number: "))
    testInput: |
      90210
    tests:
      - name: 90210
        code: |
          assert "Digit sum: 12" in run("90210"), f"You printed:\n{run('90210')}"
      - name: several lengths
        code: |
          for n, s in [("7", 7), ("99", 18), ("123456789", 45), ("1000000", 1), ("0", 0)]:
              out = run(n)
              assert f"Digit sum: {s}" in out, f"For {n}, expected Digit sum: {s}. You printed:\n{out}"
      - name: uses a loop and arithmetic, not strings
        code: |
          assert "while" in source, "Use a while loop."
          assert "str(" not in source and "for " not in source, "Use % and // inside a while loop, not strings."
    hints:
      - "Start an accumulator at 0. Loop `while n > 0:`."
      - "Inside: add `n % 10` to the total, then do `n //= 10`."
      - "With an input of 0, the loop runs zero times, so the total is still 0."
    solution: |
      n = int(input("Number: "))
      digit_sum = 0
      while n > 0:
          digit_sum += n % 10
          n //= 10
      print(f"Digit sum: {digit_sum}")
    explanation: |
      Each iteration adds the last digit and removes it, so the loop runs once per digit. This "peel off the last digit" loop is the general version of the three-digit exercise from Lesson 2.2: a loop replaces a fixed number of copied lines with a pattern that works for any size. (Digit sums are used in check digits for barcodes and card numbers.)

  - id: validate-range
    title: Keep asking until valid
    difficulty: 2
    prompt: |
      Ask the user for a number from **1 to 10**. While their answer is outside that range, print `Try again` and ask again. Once it's valid, print:

      ```text
      Thanks, you chose 7
      ```
    starter: |
      choice = int(input("Pick a number from 1 to 10: "))
    testInput: |
      15
      0
      7
    tests:
      - name: valid first time
        code: |
          out = run("4")
          assert "Try again" not in out and "Thanks, you chose 4" in out, f"With 4 your program printed:\n{out}"
      - name: two bad answers then a good one
        code: |
          out = run("15", "0", "7")
          assert out.count("Try again") == 2, f"Expected 'Try again' twice. Your program printed:\n{out}"
          assert "Thanks, you chose 7" in out, f"Your program printed:\n{out}"
      - name: boundaries 1 and 10 are valid, 11 and -5 are not
        code: |
          assert "Try again" not in run("1") and "Try again" not in run("10"), "1 and 10 are both valid."
          out = run("11", "-5", "10")
          assert out.count("Try again") == 2 and "Thanks, you chose 10" in out, f"Your program printed:\n{out}"
    hints:
      - "Loop while the choice is invalid: `while choice < 1 or choice > 10:`."
      - "Inside the loop: print `Try again` and read a new choice with the same `input` line."
      - "After the loop, the choice must be valid, so print the thanks message."
    solution: |
      choice = int(input("Pick a number from 1 to 10: "))
      while choice < 1 or choice > 10:
          print("Try again")
          choice = int(input("Pick a number from 1 to 10: "))
      print(f"Thanks, you chose {choice}")
    explanation: |
      The loop condition describes *invalid* input, so the body only runs when there's a problem, and when the loop finishes you know for certain that `choice` is between 1 and 10. Notice the De Morgan connection: "invalid" is `not (1 <= choice <= 10)`, which is the same as `choice < 1 or choice > 10`.

  - id: collatz
    title: The Collatz conjecture
    difficulty: 3
    prompt: |
      Start with any positive whole number n. If n is even, halve it; if n is odd, replace it with 3n + 1. Repeat until you reach 1. For example, 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1 takes **8 steps**, and the **peak** (largest value reached) is 16.

      Mathematicians believe every starting number eventually reaches 1, but nobody has ever proved it. It's one of the most famous unsolved problems in mathematics.

      Read n and print:

      ```text
      Steps: 8
      Peak: 16
      ```

      If n is 1, it takes 0 steps and the peak is 1.
    starter: |
      n = int(input("Start: "))
    testInput: |
      6
    tests:
      - name: starting at 6
        code: |
          out = run("6")
          assert "Steps: 8" in out and "Peak: 16" in out, f"With 6 your program printed:\n{out}"
      - name: starting at 1
        code: |
          out = run("1")
          assert "Steps: 0" in out and "Peak: 1" in out, f"With 1 your program printed:\n{out}"
      - name: the famous 27
        code: |
          out = run("27")
          assert "Steps: 111" in out and "Peak: 9232" in out, f"27 takes 111 steps and peaks at 9232. Your program printed:\n{out}"
      - name: more starting values
        code: |
          for n, s, p in [("2", 1, 2), ("7", 16, 52), ("97", 118, 9232)]:
              out = run(n)
              assert f"Steps: {s}" in out and f"Peak: {p}" in out, f"With {n}, expected {s} steps and peak {p}. You printed:\n{out}"
    hints:
      - "Keep a `steps` counter starting at 0, and a `peak` starting at n."
      - "Loop `while n != 1:`. Inside, use `if n % 2 == 0:` to choose between `n = n // 2` and `n = 3 * n + 1`."
      - "After updating n, add 1 to steps, and if n is bigger than peak, set peak to n."
    solution: |
      n = int(input("Start: "))
      steps = 0
      peak = n
      while n != 1:
          if n % 2 == 0:
              n = n // 2
          else:
              n = 3 * n + 1
          steps += 1
          if n > peak:
              peak = n
      print(f"Steps: {steps}")
      print(f"Peak: {peak}")
    explanation: |
      This combines everything so far: a loop, a decision inside it, a counter (`steps`) and a "running maximum" (`peak`), which is a cousin of the accumulator. Use `//` rather than `/` so n stays an int. Starting at 27 is famous: it climbs to 9232 before finally falling to 1 after 111 steps. Computers have checked every starting number up to about 2⁶⁸ without finding one that doesn't reach 1, but checking isn't proof. Here, `n != 1` is safe because n only ever takes whole-number values, and the conjecture says it will hit 1 exactly.

commonMistakes:
  - title: Forgetting to update the loop variable
    explanation: |
      If nothing in the body changes what the condition depends on, the condition stays True forever.
    wrong: |
      i = 1
      while i <= 5:
          print(i)
    right: |
      i = 1
      while i <= 5:
          print(i)
          i += 1
  - title: Off-by-one loop bounds
    explanation: |
      `while i < 5` with i starting at 1 runs for 1, 2, 3, 4: only four times. Decide whether the last value should be included, then choose `<` or `<=` deliberately. Trace the first and last iterations by hand.
  - title: Resetting an accumulator inside the loop
    explanation: |
      An accumulator must be set up **once, before** the loop. Putting `total = 0` inside the body wipes out the running total every iteration.
    wrong: |
      n = 1
      while n <= 3:
          total = 0
          total += n
          n += 1
      print(total)   # 3, not 6
    right: |
      total = 0
      n = 1
      while n <= 3:
          total += n
          n += 1
      print(total)   # 6
  - title: Wrong indentation of the update
    explanation: |
      If the update line isn't indented, it's not part of the loop: it runs only after the loop finishes, which may be never. Check which lines are in the body.
  - title: Testing for equality when values can skip past
    explanation: |
      `while x != 0` with x decreasing by 3 from 10 never stops (10, 7, 4, 1, −2...). Use `while x > 0` when a value might jump over the target.

summary:
  - "A **`while` loop** repeats its body as long as its condition is True. The condition is checked before each iteration; it may run zero times."
  - "Every loop needs setup before it, a condition, and an update inside it that leads to the condition becoming False."
  - "**Counters** start at 0 and add 1; **accumulators** start at an empty value and combine each new value."
  - "**Sentinel loops** read until a stop value. `while True` + **`break`** exits from the middle of a loop."
  - "**Validation loops** repeat while input is invalid, so afterwards it's guaranteed valid."
  - "Infinite loops come from missing or wrong updates, or conditions that skip past their target. In this app they time out after 10 seconds."
  - "`% 10` and `// 10` in a loop process the digits of a number of any length."
next: |
  `while` loops are general but a little fiddly when you just want to repeat something a known number of times, or go through every character of a string. In **Lesson 2.7** you'll learn the `for` loop and `range()`, which make counting loops shorter and safer, plus nested loops and `continue`.

quiz:
  - type: mcq
    question: "How many times does this loop print \"hi\"?\n\n```python\ni = 0\nwhile i < 4:\n    print(\"hi\")\n    i += 1\n```"
    options: ["3", "4", "5", "Forever"]
    answer: 1
    explanation: i takes the values 0, 1, 2, 3 in the body (4 iterations). When i becomes 4, the condition i < 4 is False.
  - type: mcq
    question: "What is printed?\n\n```python\nx = 10\nwhile x > 100:\n    x += 1\nprint(x)\n```"
    options: ["10", "100", "101", "Nothing; it loops forever"]
    answer: 0
    explanation: The condition is False the first time it's checked, so the body runs zero times and x stays 10.
  - type: mcq
    question: What does `break` do inside a loop?
    options:
      - Skips the rest of the current iteration and checks the condition again
      - Immediately exits the loop, continuing with the code after it
      - Stops the whole program
      - Pauses the loop until the user presses Enter
    answer: 1
    explanation: break leaves the innermost loop at once. (Skipping to the next iteration is `continue`, coming in Lesson 2.7.)
  - type: mcq
    question: "Why does this loop never end?\n\n```python\nn = 1\nwhile n != 10:\n    n += 2\n```"
    options:
      - n += 2 is invalid syntax
      - n takes only odd values (1, 3, 5, ...), so it skips past 10 and is never equal to it
      - The condition should use = instead of !=
      - while loops can't use !=
    answer: 1
    explanation: Starting at 1 and adding 2 gives only odd numbers, so n is never exactly 10. Using `while n < 10` would stop.
  - type: mcq
    question: You want the total of numbers read in a loop. Where should `total = 0` go?
    options:
      - Inside the loop body, before adding
      - Before the loop starts
      - After the loop ends
      - It doesn't matter
    answer: 1
    explanation: An accumulator is initialised once, before the loop. Inside the loop it would be reset every iteration.
  - type: mcq
    question: "After this loop, what is `n`?\n\n```python\nn = 5\nwhile n > 0:\n    n -= 2\n```"
    options: ["0", "1", "-1", "5"]
    answer: 2
    explanation: n goes 5, 3, 1, -1. When n is -1, n > 0 is False and the loop ends, leaving n at -1.
  - type: code
    question: |
      Money in a savings account grows by a fixed percentage each year. Read the **interest rate** as a whole-number percentage (e.g. `7`) and print how many whole years it takes for the money to at least **double**, in the form `Years: 11`. Use a `while` loop, starting from a balance of 1.0.
    starter: |
      rate = int(input("Interest rate (%): "))
    testInput: |
      7
    tests:
      - name: correct for several rates
        code: |
          for r, y in [("7", 11), ("10", 8), ("1", 70), ("100", 1), ("50", 2)]:
              out = run(r)
              assert f"Years: {y}" in out, f"With {r}% expected Years: {y}. You printed:\n{out}"
          assert "while" in source, "Use a while loop."
    solution: |
      rate = int(input("Interest rate (%): "))
      balance = 1.0
      years = 0
      while balance < 2:
          balance *= 1 + rate / 100
          years += 1
      print(f"Years: {years}")
