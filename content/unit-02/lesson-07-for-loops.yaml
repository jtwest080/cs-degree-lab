id: u2-for
title: for Loops, range and Nested Loops
minutes: 50
objective: |
  Use **`for` loops** with **`range()`** to repeat code a known number of times and to go through every character of a string, build **nested loops** for grids and patterns, and control loops with `break` and `continue`.
outcomes:
  - Write `for` loops over `range(stop)`, `range(start, stop)` and `range(start, stop, step)`
  - Predict exactly which values a `range` produces (stop is excluded)
  - Loop over the characters of a string
  - Choose between `for` and `while` for a given problem
  - Write nested loops and count how many times the inner body runs
  - Use `continue` to skip an iteration and `break` to stop a search early

sections:
  - heading: Definite iteration
    body: |
      In Lesson 2.6 every counting loop had the same three parts: set up a counter, test it, update it. Forgetting any part caused bugs. Counting loops are so common that Python has a dedicated statement for them:

      ```python
      for i in range(5):
          print(i)
      ```

      This prints 0, 1, 2, 3, 4. Read it as "**for each** value `i` **in** the sequence `range(5)`, run the body". Python handles the setup, the test and the update for you, so there's nothing to forget.

      A `while` loop repeats **while a condition holds**, for an unknown number of times (*indefinite iteration*). A `for` loop goes **through a sequence of values**, one at a time (*definite iteration*). The variable after `for` (here `i`) is the **loop variable**: on each iteration it refers to the next value in the sequence.

  - heading: range
    body: |
      `range()` produces a sequence of whole numbers. It comes in three forms:

      | Call | Values | Notes |
      |---|---|---|
      | `range(5)` | 0, 1, 2, 3, 4 | starts at 0 |
      | `range(2, 6)` | 2, 3, 4, 5 | start, stop |
      | `range(1, 10, 3)` | 1, 4, 7 | start, stop, step |
      | `range(10, 0, -2)` | 10, 8, 6, 4, 2 | a negative step counts down |
      | `range(5, 5)` | (nothing) | empty: the body runs zero times |

      > **Key idea:** The **stop value is never included**. `range(1, 10)` gives 1 to 9. This feels odd at first, but it has nice properties: `range(n)` gives exactly n values (0 to n − 1), and `range(a, b)` gives exactly b − a values. It matches counting from 0 (Lesson 1.5), and it means `range(0, 5)` and `range(5, 10)` fit together with no gap and no overlap.

      So to loop from 1 to n *inclusive*, write `range(1, n + 1)`.

      `range` doesn't build a giant list of numbers in memory; it produces each number when the loop asks for the next one. `range(1_000_000_000)` costs almost no memory.

  - heading: Looping over strings
    body: |
      A `for` loop can go through any **sequence**, not just numbers. A string is a sequence of characters, so this works:

      ```python
      for ch in "hello":
          print(ch)
      ```

      It prints `h`, `e`, `l`, `l`, `o` on separate lines. Combined with counters and accumulators from Lesson 2.6, this lets you analyse text: count vowels, check whether a password contains a digit, build a new string character by character:

      ```python
      word = "banana"
      count = 0
      for ch in word:
          if ch == "a":
              count += 1
      print(count)   # 3
      ```

      In Unit 3 you'll loop over lists, files and other collections in exactly the same way. The `for` loop is one of the most-used statements in all of Python.

  - heading: for or while?
    body: |
      | Use `for` when... | Use `while` when... |
      |---|---|
      | you know how many times to repeat | you repeat until something happens |
      | you're going through every item of a sequence | the number of repeats depends on input or calculation |
      | e.g. print 10 lines, check every character | e.g. read until "done", keep asking until valid, Collatz |

      Any `for` loop over a range can be rewritten as a `while` loop, but the `for` version is shorter and can't accidentally loop forever. Prefer `for` when it fits.

  - heading: Nested loops
    body: |
      A loop's body can contain another loop. The inner loop runs **completely** for **each** iteration of the outer loop:

      ```python
      for row in range(1, 4):
          for col in range(1, 4):
              print(row * col, end=" ")
          print()
      ```

      Output:

      ```text
      1 2 3
      2 4 6
      3 6 9
      ```

      The outer loop runs 3 times; for each of those, the inner loop runs 3 times, so the inner body runs **3 × 3 = 9** times. The `print()` after the inner loop (indented once, not twice) ends each row.

      > **Why:** Counting how many times the innermost line runs is the first step in analysing an algorithm's speed. Two nested loops of size n do n × n = n² steps. With n = 1000 that's a million; with n = 1,000,000 it's a trillion, which would take a typical computer hours. You'll study this formally as **Big-O notation** in Unit 8, and it all starts here.

  - heading: break and continue
    body: |
      You met `break` in Lesson 2.6: it exits the loop immediately. It's perfect for **searching**: stop as soon as you find what you're looking for.

      `continue` is its sibling: it **skips the rest of the current iteration** and moves straight on to the next one.

      ```python
      for n in range(1, 11):
          if n % 3 == 0:
              continue        # skip multiples of 3
          print(n, end=" ")
      # 1 2 4 5 7 8 10
      ```

      Both work in `while` loops too. In nested loops, `break` and `continue` only affect the **innermost** loop they're in.

      Use them sparingly: a loop with several `break`s and `continue`s can be hard to follow. Often an `if` around the body is clearer than `continue`.

examples:
  - title: The forms of range
    intro: "`end=\" \"` keeps each range's values on one line."
    code: |
      for i in range(5):
          print(i, end=" ")
      print()
      for i in range(2, 6):
          print(i, end=" ")
      print()
      for i in range(0, 20, 5):
          print(i, end=" ")
      print()
      for i in range(5, 0, -1):
          print(i, end=" ")
      print()
    output: |
      0 1 2 3 4
      2 3 4 5
      0 5 10 15
      5 4 3 2 1
    lines:
      - line: 1-3
        note: "`range(5)`: five values starting from 0. The stop value, 5, is excluded. The bare `print()` ends the line."
      - line: 4-5
        note: "`range(2, 6)`: from 2 up to (not including) 6."
      - line: 7-8
        note: "A step of 5. 20 is the stop value, so it's excluded."
      - line: 10-11
        note: "A negative step counts down. The stop (0) is still excluded, so it ends at 1."
  - title: Analysing a string
    intro: Counting vowels and building a new string, character by character.
    code: |
      text = "Programming is fun"
      vowels = 0
      no_vowels = ""
      for ch in text:
          if ch.lower() in "aeiou":
              vowels += 1
          else:
              no_vowels += ch
      print(vowels, "vowels")
      print(no_vowels)
    output: |
      5 vowels
      Prgrmmng s fn
    lines:
      - line: 4
        note: "`ch` refers to each character in turn: \"P\", \"r\", \"o\", ..."
      - line: 5
        note: "`ch.lower() in \"aeiou\"` checks whether the character is a vowel, whatever its case."
      - line: 6
        note: "A counter."
      - line: 8
        note: "A string accumulator: starting from `\"\"`, add each non-vowel character to the end."
  - title: Nested loops make a grid
    intro: A multiplication table. The inner loop runs completely for each row.
    code: |
      size = 4
      for row in range(1, size + 1):
          for col in range(1, size + 1):
              print(f"{row * col:4}", end="")
          print()
    output: |2
         1   2   3   4
         2   4   6   8
         3   6   9  12
         4   8  12  16
    lines:
      - line: 2
        note: "`range(1, size + 1)` gives 1 to 4 inclusive."
      - line: 3-4
        note: "For each row, loop over every column. `{row * col:4}` right-aligns each number in 4 characters (Lesson 2.4), so the columns line up."
      - line: 5
        note: "Indented under the outer loop only: after each complete row, move to a new line. The inner body ran 4 × 4 = 16 times in total."
  - title: Searching with break, skipping with continue
    intro: Find the first number divisible by both 7 and 11 above 500.
    code: |
      for n in range(501, 1000):
          if n % 7 != 0:
              continue
          if n % 11 == 0:
              print("Found it:", n)
              break
      print("Search over")
    output: |
      Found it: 539
      Search over
    lines:
      - line: 1
        note: "Search the numbers 501 to 999."
      - line: 2-3
        note: "`continue` skips anything that isn't a multiple of 7, straight to the next n."
      - line: 4-6
        note: "Among the multiples of 7, the first that's also a multiple of 11 is printed, and `break` ends the search: there's no need to check the remaining numbers."

