quiz:
  - type: mcq
    question: "What is printed?\n\n```python\ndef f(x):\n    return x * 2\n\nprint(f(f(3)))\n```"
    options: ["6", "12", "9", "An error"]
    answer: 1
    explanation: The inner call f(3) returns 6, then f(6) returns 12. Calls are evaluated inside out.
  - type: mcq
    question: "What is the value of `result`?\n\n```python\ndef shout(word):\n    print(word.upper())\n\nresult = shout(\"hi\")\n```"
    options: ['"HI"', '"hi"', "None", "An error"]
    answer: 2
    explanation: shout prints HI but has no return statement, so it returns None.
  - type: mcq
    question: "In `def area(width, height):` and the call `area(3, 4)`, what are `3` and `4`?"
    options: [Parameters, Arguments, Return values, Docstrings]
    answer: 1
    explanation: Parameters are the names in the definition; arguments are the values passed in the call.
  - type: mcq
    question: "What happens?\n\n```python\ndef setup():\n    count = 10\n\nsetup()\nprint(count)\n```"
    options:
      - It prints 10
      - It prints 0
      - It raises a NameError because count is local to setup
      - It prints None
    answer: 2
    explanation: count only exists inside the call to setup. After the function returns, the name doesn't exist at the top level.
  - type: mcq
    question: "What does `greet(\"Sam\")` return?\n\n```python\ndef greet(name, punctuation=\"!\"):\n    return \"Hi \" + name + punctuation\n```"
    options: ['"Hi Sam"', '"Hi Sam!"', "None", "An error, because punctuation is missing"]
    answer: 1
    explanation: punctuation has a default value of "!", which is used when no second argument is given.
  - type: mcq
    question: Which is the best reason to break a program into small functions?
    options:
      - It makes the program run faster
      - Each piece can be understood, tested and reused on its own
      - Python requires every program to use functions
      - It uses less memory
    answer: 1
    explanation: Decomposition manages complexity. Small functions with clear inputs and outputs are easier to understand, test and reuse.
  - type: code
    question: |
      Write `count_vowels(text)` that **returns** the number of vowels (a, e, i, o, u, upper or lower case) in `text`.
    starter: |
      def count_vowels(text):
          pass
    tests:
      - name: counts vowels
        code: |
          for t, n in [("hello", 2), ("AEIOU", 5), ("rhythm", 0), ("", 0), ("Programming Is Fun", 5)]:
              assert count_vowels(t) == n, f"count_vowels({t!r}) returned {count_vowels(t)!r}, expected {n}"
    solution: |
      def count_vowels(text):
          """Return the number of vowels in text."""
          count = 0
          for ch in text.lower():
              if ch in "aeiou":
                  count += 1
          return count
