quiz:
  - type: mcq
    question: A program runs without any error message but prints the wrong total. What kind of error is this?
    options: [Syntax error, Runtime error, Logic error, Hardware error]
    answer: 2
    explanation: Logic errors produce wrong results without any error message, which makes them the hardest kind to find.
  - type: mcq
    question: When reading a traceback, where should you look first?
    options:
      - The first line
      - The last line, which names the exception and message
      - The middle
      - It doesn't matter
    answer: 1
    explanation: The last line says what went wrong; the lines above it say where, and how the program got there.
  - type: mcq
    question: Which exception does `int("12abc")` raise?
    options: [TypeError, NameError, ValueError, SyntaxError]
    answer: 2
    explanation: The argument is the right type (a string) but its value can't be converted, so it's a ValueError.
  - type: mcq
    question: "Which exception does `\"Total: \" + 5` raise?"
    options: [TypeError, ValueError, NameError, ZeroDivisionError]
    answer: 0
    explanation: You can't use + between a str and an int; that's an operation on incompatible types.
  - type: mcq
    question: A function should return True for ages 18 and over. Which set of tests is most likely to catch a bug?
    options:
      - is_adult(30) and is_adult(50)
      - is_adult(17), is_adult(18) and is_adult(19)
      - is_adult(100)
      - is_adult(5) only
    answer: 1
    explanation: Testing both sides of the boundary, and the boundary itself, catches the most common mistake (> instead of >=).
  - type: mcq
    question: Why is a bare `except:` (with no exception type) usually a bad idea?
    options:
      - It's a syntax error
      - It also catches errors caused by bugs in your own code, hiding them
      - It makes the program slower
      - It only works with ValueError
    answer: 1
    explanation: Catching everything turns real bugs, like a misspelled name, into silent failures. Catch the specific exception you expect.
  - type: code
    question: |
      Write `safe_divide(a, b)` that returns `a / b`, but returns `None` if `b` is zero. Use `try`/`except ZeroDivisionError`.
    starter: |
      def safe_divide(a, b):
          pass
    tests:
      - name: divides and handles zero
        code: |
          assert safe_divide(10, 4) == 2.5, f"safe_divide(10, 4) returned {safe_divide(10, 4)!r}"
          assert safe_divide(-9, 3) == -3.0
          assert safe_divide(5, 0) is None, f"safe_divide(5, 0) returned {safe_divide(5, 0)!r}"
          assert "except ZeroDivisionError" in source, "Use try/except ZeroDivisionError."
    solution: |
      def safe_divide(a, b):
          try:
              return a / b
          except ZeroDivisionError:
              return None
