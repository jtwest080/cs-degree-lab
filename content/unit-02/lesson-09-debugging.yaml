id: u2-debugging
title: Debugging, Testing and Handling Errors
minutes: 55
objective: |
  Find and fix bugs **systematically** rather than by guesswork: read **tracebacks**, recognise the common **error types**, locate **logic errors** by tracing and printing, write **tests** with `assert`, and handle bad input gracefully with **`try`/`except`**.
outcomes:
  - Distinguish syntax errors, runtime errors and logic errors
  - Read a traceback from the bottom up and find the line that caused it
  - Name the common exception types and their usual causes
  - Apply a step-by-step debugging method, including print debugging and tracing
  - Write tests with `assert`, including edge cases, and judge whether tests are strong enough
  - Use `try`/`except` to recover from errors such as invalid input

sections:
  - heading: Bugs are normal
    body: |
      In 1947, engineers working on the Harvard Mark II computer found a moth trapped in a relay, taped it into their logbook, and wrote "First actual case of bug being found." (Grace Hopper, who you met in Lesson 1.6, loved telling this story.) The word "bug" was older than that, but the name stuck.

      Here's the truth every programmer learns: **you will write bugs constantly**, no matter how experienced you become. Professionals often spend more time debugging than writing new code. What separates beginners from experts isn't writing bug-free code; it's finding and fixing bugs **calmly and systematically**.

      > **Key idea:** Debugging is the scientific method applied to code. Observe what happens, form a hypothesis about why, design an experiment to test it, and repeat. Guessing and randomly changing things is the opposite of debugging, and it usually adds new bugs.

  - heading: Three kinds of error
    body: |
      | Kind | When it shows up | What you see | Example |
      |---|---|---|---|
      | **Syntax error** | before anything runs | `SyntaxError` and a pointer | missing `:` or bracket |
      | **Runtime error** (exception) | partway through running | a traceback, then the program stops | dividing by zero |
      | **Logic error** | never reported | wrong output, no error at all | using `>` instead of `>=` |

      Syntax errors are the easiest: Python tells you exactly where they are. Runtime errors come with a traceback that usually points straight at the problem. **Logic errors are the hardest**, because the program runs happily and produces the wrong answer. The only way to catch them is to **know what the right answer should be** and check, which is why testing matters so much.

  - heading: Reading a traceback
    body: |
      When an exception isn't handled, Python prints a **traceback**: a report of the call stack (Lesson 2.8) at the moment of the error.

      ```python
      def average(total, count):
          return total / count

      def report(scores_total, people):
          avg = average(scores_total, people)
          print(f"Average: {avg}")

      report(250, 0)
      ```

      ```text
      Traceback (most recent call last):
        Line 8
          report(250, 0)
        Line 5, in report
          avg = average(scores_total, people)
        Line 2, in average
          return total / count
      ZeroDivisionError: division by zero
      ```

      **Read it from the bottom up:**

      1. **The last line** says *what* happened: the exception type (`ZeroDivisionError`) and a message.
      2. **The line just above** says *where* it happened: line 2, inside `average`.
      3. **Further up** is *how you got there*: line 8 called `report`, which on line 5 called `average`.

      The line where the error *appears* isn't always where the *bug* is. Line 2 is correct code; the real problem is that `report` was called with 0 people. Following the traceback upwards helps you find where the bad value came from.

  - heading: A field guide to exceptions
    body: |
      | Exception | Usually means | Typical fix |
      |---|---|---|
      | `SyntaxError` | the code isn't valid Python | check brackets, quotes, colons on the line and the one before |
      | `IndentationError` | inconsistent or missing indentation | indent blocks by exactly 4 spaces |
      | `NameError` | a name that doesn't exist | check spelling and capitals; is it defined before use? is it local to another function? |
      | `TypeError` | an operation on the wrong type | e.g. `"5" + 1`: convert with `int()` or `str()`; or wrong number of arguments to a function |
      | `ValueError` | right type, unacceptable value | e.g. `int("hello")`: validate input |
      | `ZeroDivisionError` | dividing by zero | check the divisor before dividing |
      | `AttributeError` | a method the value doesn't have | e.g. `5.upper()`: check the value's type |

      You'll meet `IndexError` and `KeyError` in Unit 3, when you work with collections.

      > **Tip:** Copy the last line of an unfamiliar error message into a search engine. Millions of programmers have hit the same error before you, and the explanation is usually one search away. Reading error messages carefully is a skill that pays off for your whole career.

  - heading: A systematic debugging method
    body: |
      When a program misbehaves, work through these steps:

      1. **Reproduce it.** Find an input that reliably causes the problem. A bug you can't trigger, you can't fix (or confirm you've fixed).
      2. **Read** the error message and traceback, if there is one.
      3. **Hypothesise.** What could cause exactly this behaviour? Be specific: "the loop stops one iteration early" is a hypothesis; "it's broken" isn't.
      4. **Experiment.** Gather evidence to confirm or rule out your hypothesis:
         - **Print debugging:** add temporary prints showing variable values at key points. The f-string form `print(f"{total=}")` prints both the name and the value, like `total=42`.
         - **Trace by hand:** make a table of variables, line by line, as you did in Lesson 2.2. Compare what you *expect* with what the prints *show*. The bug is where they first differ.
         - **Divide and conquer:** check halfway through the program. Is the value right there? Then the bug is in the second half; otherwise the first. Keep halving. This is a binary search, and it finds the bug in a 1000-line program in about 10 checks.
      5. **Fix** the cause, not the symptom. If a total is 1 too small, adding `+ 1` at the end hides the bug; fixing the loop's range removes it.
      6. **Verify** the fix with the input that failed, and with other inputs too, to check you haven't broken something else.
      7. **Prevent:** add a test for that case so the bug can never quietly return.

      > **Analogy:** **Rubber duck debugging** is a real technique used by professionals: explain your code, line by line, out loud, to a rubber duck (or a patient friend). Very often, halfway through explaining what a line "obviously" does, you realise it doesn't.

  - heading: Testing with assert
    body: |
      An **`assert`** statement checks that something is true, and raises an `AssertionError` if it isn't:

      ```python
      def square(n):
          return n * n

      assert square(3) == 9
      assert square(-2) == 4, "squares of negatives should be positive"
      ```

      If every assert passes, nothing happens. If one fails, the program stops with your message. This is exactly how the automatic tests in this course work: every test you've passed was a set of `assert` statements run against your code.

      **Good tests** check:

      - **Typical cases:** ordinary inputs, with answers you've worked out independently.
      - **Edge cases:** zero, negative numbers, empty strings, one item, the biggest allowed value.
      - **Boundaries:** values on each side of every condition (Lesson 2.5).

      A good way to judge your tests: imagine someone made a small mistake in the function (`<` instead of `<=`, a missing `round`, a wrong constant). **Would at least one of your tests fail?** If not, your tests aren't strong enough. Deliberately introducing small bugs to check that tests catch them is called **mutation testing**, and you'll do it in exercise 5.

      Writing tests *before* fixing a bug, or even before writing the function, is a professional habit called **test-driven development**. You'll study testing in depth in Unit 14.

  - heading: Handling errors with try and except
    body: |
      Some errors aren't bugs in your code but problems with the outside world: a user types "twelve" where you asked for a number, a file is missing, the network is down. A program should cope with these gracefully rather than crash. Python's **`try` / `except`** statement does this:

      ```python
      text = input("Age: ")
      try:
          age = int(text)
          print(f"Next year you'll be {age + 1}")
      except ValueError:
          print(f"Sorry, {text!r} isn't a whole number.")
      ```

      Python runs the `try` block. If a `ValueError` happens anywhere inside it, Python immediately jumps to the `except ValueError:` block instead of crashing. If no error happens, the `except` block is skipped.

      Combined with a loop, this gives robust input reading:

      ```python
      while True:
          try:
              age = int(input("Age: "))
              break                  # only reached if int() succeeded
          except ValueError:
              print("Please type a whole number.")
      ```

      > **Warning:** Always name the exception you expect (`except ValueError:`). A bare `except:` catches *everything*, including errors caused by your own bugs (a misspelled variable becomes a silent failure instead of a helpful NameError). Catch only what you know how to handle, and keep the `try` block as small as possible.

      You can also **raise** errors yourself when a function receives something it can't handle: `raise ValueError("percent must be between 0 and 100")`. That's often better than returning a strange value like `None`, because it can't be accidentally ignored.

examples:
  - title: Reading a traceback
    intro: Run this in the editor and match each line of the traceback to the code. The error appears in `average`, but the bad value comes from the call on the last line.
    code: |
      def average(total, count):
          return total / count

      def report(scores_total, people):
          avg = average(scores_total, people)
          print(f"Average: {avg}")

      report(250, 5)
      report(250, 0)
    expectError: true
    output: |
      Average: 50.0
    lines:
      - line: 8
        note: "This call works: it prints `Average: 50.0`."
      - line: 9
        note: "This call passes 0 for `people`. Run it to see the traceback: it lists line 9, then line 5 in `report`, then line 2 in `average`, then `ZeroDivisionError: division by zero`."
      - line: 2
        note: "The error *appears* here, but this line is correct. The fix belongs where 0 people is either prevented or handled."
  - title: Print debugging a logic error
    intro: This function should add up the numbers 1 to n, but `total_to(4)` gives 6 instead of 10. The debug print reveals why.
    code: |
      def total_to(n):
          total = 0
          for i in range(1, n):
              print(f"  debug: {i=} {total=}")
              total += i
          return total

      print(total_to(4))
    output: |2
        debug: i=1 total=0
        debug: i=2 total=1
        debug: i=3 total=3
      6
    lines:
      - line: 3
        note: "The bug: `range(1, n)` stops *before* n, so 4 is never added."
      - line: 4
        note: "A temporary debug print. `{i=}` prints `i=` followed by the value. The output shows i only reaches 3: hypothesis confirmed."
      - line: 8
        note: "The fix is `range(1, n + 1)`. Then delete the debug print."
  - title: assert as a test
    intro: Tests that pass are silent; a failing test stops with your message.
    code: |
      def is_teenager(age):
          return 13 <= age <= 19

      assert is_teenager(15)
      assert is_teenager(13), "13 is a teenager (boundary)"
      assert is_teenager(19), "19 is a teenager (boundary)"
      assert not is_teenager(12), "12 is not"
      assert not is_teenager(20), "20 is not"
      print("All tests passed")
    output: |
      All tests passed
    lines:
      - line: 1-2
        note: "The function under test."
      - line: 4
        note: "A typical case."
      - line: 5-8
        note: "Both boundaries and both sides of each. If someone 'simplified' the function to `13 < age < 19`, the tests on lines 5 and 6 would fail immediately."
      - line: 9
        note: "Only reached if every assert passed. Try breaking the function and rerunning."
  - title: Recovering from bad input
    intro: A validation loop with try/except. The Input box contains two bad answers before a good one.
    code: |
      while True:
          text = input("How many tickets? ")
          try:
              tickets = int(text)
          except ValueError:
              print(f"  {text!r} is not a whole number, try again")
              continue
          if tickets < 1:
              print("  You need at least one ticket")
              continue
          break
      print(f"Booking {tickets} tickets")
    stdin: |
      two
      0
      2
    output: |
      How many tickets? two
        'two' is not a whole number, try again
      How many tickets? 0
        You need at least one ticket
      How many tickets? 2
      Booking 2 tickets
    lines:
      - line: 3-4
        note: "Only the risky line goes inside `try`."
      - line: 5-7
        note: "If `int()` raises ValueError, show a message and `continue` with the next attempt. `{text!r}` shows the text with quotes, making it clear exactly what was typed."
      - line: 8-10
        note: "The input is a number, but is it a sensible one? A second kind of validation."
      - line: 11
        note: "Only valid input reaches the break."

playground:
  prompt: |
    Make errors on purpose and read the messages: `"5" + 5`, `int("five")`, `10 / 0`, `undefined_name`, `"abc".nope()`. Then wrap one of them in `try`/`except` and print a friendly message instead.
  code: |
    try:
        result = int("five")
    except ValueError:
        print("That wasn't a number")
    print("The program keeps going")

exercises:
  - id: fix-off-by-one
    title: Fix the off-by-one bug
    difficulty: 1
    prompt: |
      `sum_to(n)` should return 1 + 2 + ... + n, but it's wrong. Use the debugging method: run it, compare with what you expect (`sum_to(4)` should be 10), add a debug print if needed, find the bug, and fix it. Don't just add a number to the result: fix the cause.
    starter: |
      def sum_to(n):
          total = 0
          for i in range(1, n):
              total += i
          return total

      print(sum_to(4))   # should be 10
    tests:
      - name: sum_to(4) is 10
        code: |
          assert sum_to(4) == 10, f"sum_to(4) returned {sum_to(4)}"
      - name: other values
        code: |
          for n, want in [(1, 1), (10, 55), (100, 5050), (0, 0)]:
              assert sum_to(n) == want, f"sum_to({n}) returned {sum_to(n)}, expected {want}"
      - name: fixes the cause, not the symptom
        code: |
          assert "+ n" not in source.replace("n + 1", ""), "Fix the range rather than adding n at the end."
    hints:
      - "Add `print(i)` inside the loop and run `sum_to(4)`. Which values of i do you see?"
      - "`range(1, n)` stops before n. How do you include n?"
    solution: |
      def sum_to(n):
          total = 0
          for i in range(1, n + 1):
              total += i
          return total

      print(sum_to(4))   # 10
    explanation: |
      `range(1, n)` produces 1 to n − 1, so the last number was never added. Changing it to `range(1, n + 1)` fixes the cause. A "fix" like `return total + n` would happen to work here but hides the real problem, which would bite again the next time someone reused that loop.

  - id: fix-type-error
    title: Fix the TypeError
    difficulty: 1
    prompt: |
      `make_label(name, age)` should return a label like `"Ada (36)"`, but it crashes. Read the traceback, work out which line fails and why, and fix it.
    starter: |
      def make_label(name, age):
          return name + " (" + age + ")"

      print(make_label("Ada", 36))
    tests:
      - name: makes the label
        code: |
          assert make_label("Ada", 36) == "Ada (36)", f"make_label('Ada', 36) returned {make_label('Ada', 36)!r}"
      - name: works for other values
        code: |
          assert make_label("Grace", 85) == "Grace (85)"
          assert make_label("Baby", 0) == "Baby (0)"
    hints:
      - "The last line of the traceback says `can only concatenate str (not \"int\") to str`. Which value is an int?"
      - "Convert `age` with `str(age)`, or build the whole label with an f-string."
    solution: |
      def make_label(name, age):
          return f"{name} ({age})"

      print(make_label("Ada", 36))
    explanation: |
      `age` is an int, and `+` can't join a string and an int. Either `str(age)` or an f-string fixes it; the f-string is cleaner. The traceback pointed straight at line 2 in `make_label`, and the message named the exact problem.

  - id: fix-logic-bugs
    title: Hunt down logic bugs
    difficulty: 2
    prompt: |
      These two functions run without any errors, but each gives wrong answers for some inputs. There are no error messages to help you, so you'll need to test them yourself.

      - `average(a, b, c)` should return the mean of three numbers.
      - `is_teenager(age)` should return True for ages **13 to 19 inclusive**.

      Write a few `print` calls with inputs where you know the right answer, find each bug, and fix it.
    starter: |
      def average(a, b, c):
          return a + b + c / 3

      def is_teenager(age):
          return 13 < age < 19

      print(average(3, 3, 3))   # should be 3.0
    tests:
      - name: average is correct
        code: |
          assert average(3, 3, 3) == 3, f"average(3, 3, 3) returned {average(3, 3, 3)}"
          assert average(1, 2, 3) == 2, f"average(1, 2, 3) returned {average(1, 2, 3)}"
          assert abs(average(10, 0, 5) - 5) < 1e-9, f"average(10, 0, 5) returned {average(10, 0, 5)}"
      - name: is_teenager middle cases
        code: |
          assert is_teenager(15) is True and is_teenager(30) is False and is_teenager(5) is False
      - name: is_teenager boundaries
        code: |
          assert is_teenager(13) is True, "13 is a teenager."
          assert is_teenager(19) is True, "19 is a teenager."
          assert is_teenager(12) is False and is_teenager(20) is False, "12 and 20 are not teenagers."
    hints:
      - "`average(3, 3, 3)` gives 7.0. Which operation happens first in `a + b + c / 3`?"
      - "For `is_teenager`, test the boundaries: what does it return for 13 and for 19?"
      - "Use brackets: `(a + b + c) / 3`. And use `<=`: `13 <= age <= 19`."
    solution: |
      def average(a, b, c):
          return (a + b + c) / 3

      def is_teenager(age):
          return 13 <= age <= 19

      print(average(3, 3, 3))   # 3.0
    explanation: |
      The first bug is **operator precedence**: `/` happens before `+`, so only `c` was divided. The second is a **boundary bug**: `<` excludes 13 and 19. Notice `is_teenager(15)` worked fine, so testing only typical values would never have found it. That's why tests must include boundaries.

  - id: robust-input
    title: Bulletproof input
    difficulty: 2
    prompt: |
      Write a program that asks for a whole number from **1 to 100**, and keeps asking until it gets one:

      - If the input isn't a whole number, print `Not a number`.
      - If it's a number outside 1 to 100, print `Out of range`.
      - When valid, print `You entered 42` (with their number) and stop.

      The program must never crash, whatever is typed.
    starter: |
      while True:
          number = int(input("Number (1-100): "))
          break
      print(f"You entered {number}")
    testInput: |
      abc
      500
      42
    tests:
      - name: valid immediately
        code: |
          out = run("42")
          assert "You entered 42" in out and "Not a number" not in out and "Out of range" not in out, f"Your program printed:\n{out}"
      - name: text, then out of range, then valid
        code: |
          out = run("abc", "500", "42")
          assert out.count("Not a number") == 1, f"Expected 'Not a number' once. Your program printed:\n{out}"
          assert out.count("Out of range") == 1, f"Expected 'Out of range' once. Your program printed:\n{out}"
          assert "You entered 42" in out
      - name: tricky inputs
        code: |
          out = run("", "3.5", "0", "-7", "101", "twelve", "1")
          assert out.count("Not a number") == 3, f"'', '3.5' and 'twelve' aren't whole numbers. Your program printed:\n{out}"
          assert out.count("Out of range") == 3, f"0, -7 and 101 are out of range. Your program printed:\n{out}"
          assert "You entered 1" in out
      - name: boundaries are valid
        code: |
          assert "You entered 100" in run("100") and "You entered 1" in run("1")
      - name: catches ValueError specifically
        code: |
          assert "except ValueError" in source, "Catch ValueError specifically, not every exception."
    hints:
      - "Wrap the `int(input(...))` line in `try:` and add `except ValueError:` that prints `Not a number` and uses `continue`."
      - "After the try/except, check the range: `if number < 1 or number > 100:` print `Out of range` and `continue`."
      - "Only valid input should reach the `break`."
    solution: |
      while True:
          try:
              number = int(input("Number (1-100): "))
          except ValueError:
              print("Not a number")
              continue
          if number < 1 or number > 100:
              print("Out of range")
              continue
          break
      print(f"You entered {number}")
    explanation: |
      Two different checks handle two different problems. `try`/`except ValueError` handles input that can't be converted at all (including the empty string and `3.5`), and the range check handles numbers that convert but aren't acceptable. The `try` block contains only the line that can fail, so other mistakes in your code would still show up as normal errors.

  - id: mutation-testing
    title: Write tests that catch bugs
    difficulty: 3
    prompt: |
      Now *you* write the tests. The function `final_price(price, percent)` below is **correct**: it returns the price after a percentage discount, rounded to 2 decimal places. For example, `final_price(80, 25)` is `60.0`.

      Below the marked line, write **`assert` statements** that test it thoroughly. Your asserts must all pass for the correct function. Then the checker will secretly replace the function with **four buggy versions** (called *mutants*), each with a small, realistic mistake. Your tests pass only if, for **every** mutant, at least one of your asserts fails.

      Think about what mistakes someone could make writing this function, and make sure some assert would catch each one. Don't change the function.
    starter: |
      def final_price(price, percent):
          """Return price after a percent discount, rounded to 2 decimal places."""
          return round(price * (1 - percent / 100), 2)

      # ---- write your asserts below this line ----
      assert final_price(100, 0) == 100
    tests:
      - name: your asserts pass on the correct function
        code: |
          assert "# ---- write your asserts below this line ----" in source, "Keep the marker line."
          tests_part = source.split("# ---- write your asserts below this line ----")[1]
          assert tests_part.count("assert") >= 3, "Write at least three assert statements."
      - name: catches mutant 1 (returns the discount amount instead of the price)
        code: |
          tests_part = source.split("# ---- write your asserts below this line ----")[1]
          ns = {}
          exec("def final_price(price, percent):\n    return round(price * percent / 100, 2)\n", ns)
          try:
              exec(tests_part, ns)
              caught = False
          except AssertionError:
              caught = True
          assert caught, "Mutant 1 survived: a version returning price * percent / 100 (the discount, not the final price) passed all your asserts."
      - name: catches mutant 2 (subtracts the percent as if it were money)
        code: |
          tests_part = source.split("# ---- write your asserts below this line ----")[1]
          ns = {}
          exec("def final_price(price, percent):\n    return round(price - percent, 2)\n", ns)
          try:
              exec(tests_part, ns)
              caught = False
          except AssertionError:
              caught = True
          assert caught, "Mutant 2 survived: a version returning price - percent passed all your asserts. Hint: for price 100, a percent discount and a pound discount look identical!"
      - name: catches mutant 3 (forgets to round)
        code: |
          tests_part = source.split("# ---- write your asserts below this line ----")[1]
          ns = {}
          exec("def final_price(price, percent):\n    return price * (1 - percent / 100)\n", ns)
          try:
              exec(tests_part, ns)
              caught = False
          except AssertionError:
              caught = True
          assert caught, "Mutant 3 survived: a version without round() passed. Test a case where the exact answer has more than 2 decimal places, like final_price(9.99, 10)."
      - name: catches mutant 4 (divides by 10 instead of 100)
        code: |
          tests_part = source.split("# ---- write your asserts below this line ----")[1]
          ns = {}
          exec("def final_price(price, percent):\n    return round(price * (1 - percent / 10), 2)\n", ns)
          try:
              exec(tests_part, ns)
              caught = False
          except AssertionError:
              caught = True
          assert caught, "Mutant 4 survived: a version using percent / 10 passed. Do any of your tests use a non-zero percent?"
    hints:
      - "The starter's only test uses a 0% discount, which almost any buggy version passes. Use real discounts with prices other than 100."
      - "Work out answers by hand: `final_price(80, 25)` should be `60.0`, `final_price(50, 10)` should be `45.0`."
      - "To catch a missing `round`, pick a case where the unrounded answer has many decimals: 9.99 with 10% off is 8.991, which should round to 8.99."
    solution: |
      def final_price(price, percent):
          """Return price after a percent discount, rounded to 2 decimal places."""
          return round(price * (1 - percent / 100), 2)

      # ---- write your asserts below this line ----
      assert final_price(100, 0) == 100       # no discount
      assert final_price(80, 25) == 60.0      # typical case
      assert final_price(50, 10) == 45.0      # price isn't 100
      assert final_price(9.99, 10) == 8.99    # needs rounding
      assert final_price(20, 100) == 0        # full discount (boundary)
      print("All my tests pass")
    explanation: |
      Each mutant represents a realistic mistake, and each needs a test that tells it apart from the correct function:

      - A **non-zero discount** catches mutants 1 and 4.
      - A **price other than 100** catches mutant 2: at £100, 10% off and £10 off are identical, so a test using only 100 can't tell them apart.
      - An answer that **needs rounding** catches mutant 3.

      This is **mutation testing**, a technique used by professional teams to measure how good their test suites are. The lesson is general: a test only has value if some plausible bug would make it fail.

commonMistakes:
  - title: Changing code randomly until it works
    explanation: |
      Random changes might make one example pass while breaking others, and you won't understand why it works. Form a hypothesis, test it, and only then change code.
  - title: Reading only the top of a traceback
    explanation: |
      The most useful information is at the **bottom**: the exception type, the message, and the line where it happened. Start there and work upwards.
  - title: Catching every exception
    explanation: |
      A bare `except:` hides real bugs, such as a misspelled variable name. Catch only the specific exception you expect, around only the line that can raise it.
    wrong: |
      try:
          age = int(input("Age: "))
          print(f"Next year: {agee + 1}")   # typo hidden!
      except:
          print("Invalid age")
    right: |
      try:
          age = int(input("Age: "))
      except ValueError:
          print("Invalid age")
      else:
          print(f"Next year: {age + 1}")
  - title: Testing only easy cases
    explanation: |
      Tests that use only typical values (and especially "special" values like 0, 1 or 100 that hide bugs) give false confidence. Include edge cases and boundaries, and ask "what mistake would this test catch?"
  - title: Fixing the symptom instead of the cause
    explanation: |
      If a loop adds one number too few, adding `+ n` at the end makes the output right but leaves the faulty loop in place. Find *why* the value is wrong and fix that.

summary:
  - "Three kinds of error: **syntax** (found before running), **runtime/exceptions** (stop the program with a traceback), and **logic** (wrong output, no message)."
  - "Read **tracebacks bottom-up**: the exception and message, then the line, then the chain of calls that led there."
  - "Common exceptions: `NameError`, `TypeError`, `ValueError`, `ZeroDivisionError`, `IndentationError`, `AttributeError`."
  - "Debug systematically: **reproduce, read, hypothesise, experiment** (print, trace, divide and conquer), **fix the cause, verify, prevent**."
  - "**`assert`** turns expectations into tests. Good tests cover typical cases, edge cases and boundaries, and would catch plausible mistakes."
  - "**`try`/`except SpecificError:`** recovers from expected problems like bad input. Keep the try block small; never catch everything blindly."
