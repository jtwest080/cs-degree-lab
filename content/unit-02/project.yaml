title: The Swiss Army Converter
brief: |
  Build a complete, menu-driven command-line program that converts between units. It's small, but it's a *real* program with the same structure as much larger ones: separate functions for each job, a main loop, input validation that never crashes, and clear output.

  When it runs, it shows a menu, asks the user to choose, reads a value, prints the conversion, and repeats until the user quits:

  ```text
  === Swiss Army Converter ===
  1. Kilometres to miles
  2. Miles to kilometres
  3. Celsius to Fahrenheit
  4. Fahrenheit to Celsius
  5. Kilograms to pounds
  q. Quit
  Choose an option: 1
  Value: 10
  10.0 km = 6.21 miles
  ...
  Choose an option: q
  Conversions made: 1
  Goodbye!
  ```

  **Exact requirements** (the tests check these):

  - **Conversion functions** that *return* (not print) their results:
    - `km_to_miles(km)`: 1 km = 0.621371 miles
    - `miles_to_km(miles)`: divide by 0.621371
    - `c_to_f(c)`: F = C × 9/5 + 32
    - `f_to_c(f)`: C = (F − 32) × 5/9
    - `kg_to_lb(kg)`: 1 kg = 2.20462 lb
  - `read_number(prompt)`: keeps asking until the user types a valid number (decimals allowed), printing `Please enter a number` after each invalid attempt, then returns it as a float.
  - `main()`: the menu loop.
    - Choices `1` to `5` read a value with `read_number("Value: ")` and print the result with the value as typed (converted to float) and the result to **2 decimal places**, in these formats: `10.0 km = 6.21 miles`, `6.21 miles = 9.99 km`, `100.0 C = 212.00 F`, `212.0 F = 100.00 C`, `5.0 kg = 11.02 lb`.
    - Any other choice prints `Invalid choice` and shows the menu again.
    - `q` (or `Q`) prints `Conversions made: N` (counting successful conversions only) and then `Goodbye!`, and ends the loop.
  - The last line of the program calls `main()`.

  You've learned every tool you need in Unit 2. Take it one function at a time, and test each piece as you go.
steps:
  - title: Write and test the conversion functions
    body: |
      Start with the five one-line conversion functions, each with a docstring. Test each one with a print, such as `print(c_to_f(100))`, before moving on. Use values you can check: 0 °C is 32 °F, and −40 is the same in both scales.
  - title: Write read_number
    body: |
      Use the "bulletproof input" pattern from Lesson 2.9: a `while True` loop, `try` around `float(input(prompt))`, `except ValueError` printing the message, and a `return` once the conversion works. (A `return` inside a loop ends the whole function, so no `break` is needed.)
  - title: Write show_menu
    body: |
      A function that prints the title and the six menu lines. Keeping it separate keeps `main` short.
  - title: Write main
    body: |
      A `while True` loop: show the menu, read the choice (strip spaces, compare as text), then an `if`/`elif` chain for the options. Keep a counter of conversions. For the `q` option, print the summary and `break`.
  - title: Try to break it
    body: |
      Be your own worst user. Type letters where numbers are expected, empty lines, `7` as a menu choice, `Q` instead of `q`, huge numbers, negative numbers. Fix anything that crashes or looks wrong. Remember to put all the input lines in the Input box, ending with `q`.
checklist:
  - text: All five conversion functions return correct values
    test: conversion functions are correct
  - text: Conversion functions return values rather than printing them
    test: conversion functions return values
  - text: read_number rejects bad input and returns a float
    test: read_number keeps asking until it gets a number
  - text: Each menu option prints the right result in the right format
    test: every menu option works
  - text: Invalid menu choices are handled without crashing
    test: invalid choices are handled
  - text: Quitting shows the number of conversions and says goodbye
    test: quitting shows the summary
  - text: Every function has a docstring
    test: every function has a docstring
  - text: I tested my program with inputs designed to break it
  - text: My variable and function names describe what they hold or do
  - text: I can explain why the conversion functions return values instead of printing them
testInput: |
  1
  10
  q
starter: |
  # Unit 2 project: the Swiss Army Converter

  def km_to_miles(km):
      """Convert kilometres to miles."""
      pass


  def read_number(prompt):
      """Ask until the user types a valid number; return it as a float."""
      pass


  def show_menu():
      """Print the menu of options."""
      print("=== Swiss Army Converter ===")
      print("1. Kilometres to miles")
      # ...


  def main():
      """Run the converter until the user quits."""
      conversions = 0
      while True:
          show_menu()
          choice = input("Choose an option: ").strip()
          if choice == "1":
              km = read_number("Value: ")
              print(f"{km} km = {km_to_miles(km):.2f} miles")
              conversions += 1
          elif choice.lower() == "q":
              break
          # ...


  main()
tests:
  - name: conversion functions are correct
    code: |
      checks = [
          ("km_to_miles(10)", lambda: km_to_miles(10), 6.21371),
          ("miles_to_km(6.21371)", lambda: miles_to_km(6.21371), 10),
          ("c_to_f(100)", lambda: c_to_f(100), 212),
          ("c_to_f(-40)", lambda: c_to_f(-40), -40),
          ("f_to_c(32)", lambda: f_to_c(32), 0),
          ("f_to_c(98.6)", lambda: f_to_c(98.6), 37),
          ("kg_to_lb(5)", lambda: kg_to_lb(5), 11.0231),
      ]
      for label, fn, want in checks:
          got = fn()
          assert got is not None, f"{label} returned None. Return the result instead of printing it."
          assert abs(got - want) < 1e-6, f"{label} returned {got}, expected about {want}"
  - name: conversion functions return values
    code: |
      for fn, arg in [(km_to_miles, 1), (miles_to_km, 1), (c_to_f, 0), (f_to_c, 0), (kg_to_lb, 1)]:
          printed, value = capture(fn, arg)
          assert printed == "", f"{fn.__name__} printed {printed!r}. Conversion functions should return results, not print them."
          assert isinstance(value, (int, float)), f"{fn.__name__}({arg}) returned {value!r}"
  - name: read_number keeps asking until it gets a number
    code: |
      out = run("1", "abc", "", "ten", "2.5", "q")
      assert out.count("Please enter a number") == 3, f"With 3 bad values before 2.5, 'Please enter a number' should appear 3 times. Your program printed:\n{out}"
      assert "2.5 km = 1.55 miles" in out, f"After the bad values, 2.5 should be converted. Your program printed:\n{out}"
  - name: every menu option works
    code: |
      out = run("1", "10", "2", "6.21", "3", "100", "4", "212", "5", "5", "q")
      for line in ["10.0 km = 6.21 miles", "6.21 miles = 9.99 km", "100.0 C = 212.00 F", "212.0 F = 100.00 C", "5.0 kg = 11.02 lb"]:
          assert line in out, f"Expected the line {line!r}. Your program printed:\n{out}"
  - name: invalid choices are handled
    code: |
      out = run("7", "hello", "", "q")
      assert out.count("Invalid choice") == 3, f"7, hello and an empty line are all invalid choices. Your program printed:\n{out}"
      assert out.count("=== Swiss Army Converter ===") >= 4, "Show the menu again after each invalid choice."
  - name: quitting shows the summary
    code: |
      out = run("1", "1", "9", "3", "0", "Q")
      assert "Conversions made: 2" in out, f"Two successful conversions (the invalid 9 doesn't count). Your program printed:\n{out}"
      assert out.rstrip().endswith("Goodbye!"), f"Goodbye! should be the last thing printed. Your program printed:\n{out}"
      assert "Conversions made: 0" in run("q"), "Quitting straight away should report 0 conversions."
  - name: every function has a docstring
    code: |
      for fn in [km_to_miles, miles_to_km, c_to_f, f_to_c, kg_to_lb, read_number, main]:
          assert fn.__doc__ and fn.__doc__.strip(), f"{fn.__name__} has no docstring."
solution: |
  # Unit 2 project: the Swiss Army Converter

  KM_PER_MILE_FACTOR = 0.621371   # miles in one kilometre
  LB_PER_KG = 2.20462


  def km_to_miles(km):
      """Convert kilometres to miles."""
      return km * KM_PER_MILE_FACTOR


  def miles_to_km(miles):
      """Convert miles to kilometres."""
      return miles / KM_PER_MILE_FACTOR


  def c_to_f(c):
      """Convert degrees Celsius to Fahrenheit."""
      return c * 9 / 5 + 32


  def f_to_c(f):
      """Convert degrees Fahrenheit to Celsius."""
      return (f - 32) * 5 / 9


  def kg_to_lb(kg):
      """Convert kilograms to pounds."""
      return kg * LB_PER_KG


  def read_number(prompt):
      """Ask until the user types a valid number; return it as a float."""
      while True:
          try:
              return float(input(prompt))
          except ValueError:
              print("Please enter a number")


  def show_menu():
      """Print the menu of options."""
      print("=== Swiss Army Converter ===")
      print("1. Kilometres to miles")
      print("2. Miles to kilometres")
      print("3. Celsius to Fahrenheit")
      print("4. Fahrenheit to Celsius")
      print("5. Kilograms to pounds")
      print("q. Quit")


  def main():
      """Run the converter until the user quits."""
      conversions = 0
      while True:
          show_menu()
          choice = input("Choose an option: ").strip().lower()
          if choice == "q":
              print(f"Conversions made: {conversions}")
              print("Goodbye!")
              break
          elif choice == "1":
              km = read_number("Value: ")
              print(f"{km} km = {km_to_miles(km):.2f} miles")
          elif choice == "2":
              miles = read_number("Value: ")
              print(f"{miles} miles = {miles_to_km(miles):.2f} km")
          elif choice == "3":
              c = read_number("Value: ")
              print(f"{c} C = {c_to_f(c):.2f} F")
          elif choice == "4":
              f = read_number("Value: ")
              print(f"{f} F = {f_to_c(f):.2f} C")
          elif choice == "5":
              kg = read_number("Value: ")
              print(f"{kg} kg = {kg_to_lb(kg):.2f} lb")
          else:
              print("Invalid choice")
              continue
          conversions += 1   # only reached after a successful conversion


  main()
stretch:
  - "Add more conversions: litres to gallons, metres to feet, or currency with a rate the user enters."
  - "Let the user convert several values in one go: after a conversion, ask `Another? (y/n)` before going back to the menu."
  - "Reject impossible temperatures: below absolute zero (−273.15 °C or −459.67 °F), print a warning instead of a result."
  - "Notice how similar the five menu branches are. Could one helper function, taking the conversion function as an argument, replace the repetition? (Functions can be passed around like any other value. You'll explore this properly in later units.)"
