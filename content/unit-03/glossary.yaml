# Terms introduced in Unit 3. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Collection
    definition: A value that holds many other values, such as a list, tuple, dictionary or set.
    lesson: u3-lists
  - term: List
    definition: "An ordered, mutable sequence of values, written in square brackets: `[72, 85, 64]`."
    lesson: u3-lists
  - term: Index
    definition: The position of an item in a sequence, counting from 0. Negative indexes count from the end, so -1 is the last item.
    lesson: u3-lists
  - term: IndexError
    definition: The error raised when you ask for a position that doesn't exist in a list, string or tuple.
    lesson: u3-lists
  - term: Off-by-one error
    definition: A bug where a loop or index is one step too far or too short, such as using `lst[len(lst)]` for the last item.
    lesson: u3-lists
  - term: Mutable
    definition: Able to be changed in place after it's created. Lists, dictionaries and sets are mutable.
    lesson: u3-lists
  - term: Method
    definition: A function that belongs to a value and is called with a dot, like `names.append("Eve")` or `text.split()`.
    lesson: u3-lists
  - term: append
    definition: The list method that adds one item to the end of a list, changing it in place.
    lesson: u3-lists
  - term: Slice
    definition: "A section of a sequence taken with `seq[start:stop:step]`. The stop position is excluded, and a slice is always a new object."
    lesson: u3-list-algorithms
  - term: enumerate
    definition: A built-in that gives (index, item) pairs while looping, as in `for i, x in enumerate(lst):`.
    lesson: u3-list-algorithms
  - term: Filter (pattern)
    definition: A loop that builds a new collection containing only the items that pass a test.
    lesson: u3-list-algorithms
  - term: Transform (pattern)
    definition: A loop that builds a new collection by applying the same change to every item. Also called map.
    lesson: u3-list-algorithms
  - term: Linear search
    definition: Searching a sequence by checking items one at a time from the start until a match is found or the items run out.
    lesson: u3-list-algorithms
  - term: In place
    definition: Changing the existing object rather than making a new one. `lst.sort()` sorts in place; `sorted(lst)` returns a new list.
    lesson: u3-list-algorithms
  - term: Two-pointer technique
    definition: An algorithm pattern that moves two indexes through the same sequence, such as from both ends towards the middle to reverse a list.
    lesson: u3-list-algorithms
  - term: Immutable
    definition: Unable to be changed after it's created. Strings, numbers and tuples are immutable; operations on them produce new objects.
    lesson: u3-strings
  - term: split
    definition: "The string method that breaks a string into a list of pieces, on whitespace by default or on a given separator: `\"a,b\".split(\",\")`."
    lesson: u3-strings
  - term: join
    definition: "The string method that glues a list of strings together, with the string it's called on placed between each pair: `\" \".join(words)`."
    lesson: u3-strings
  - term: Substring
    definition: A string that appears inside another string. `"th" in "Python"` checks for a substring.
    lesson: u3-strings
  - term: ord and chr
    definition: Built-ins converting between a character and its numeric code point. `ord("A")` is 65 and `chr(65)` is `"A"`.
    lesson: u3-strings
  - term: Caesar cipher
    definition: An ancient cipher that shifts every letter a fixed number of places along the alphabet. Easily broken by trying all 25 shifts.
    lesson: u3-strings
  - term: Parsing
    definition: Turning text with a known structure (such as `"Ada,36,London"`) into data a program can use, like separate fields or numbers.
    lesson: u3-strings
  - term: Object
    definition: Any value stored in memory, such as a number, string or list. Variables are names that refer to objects.
    lesson: u3-references
  - term: Reference
    definition: The link from a name (or a list slot) to an object in memory. Assignment copies references, never the objects themselves.
    lesson: u3-references
  - term: Aliasing
    definition: Two or more names referring to the same object, so changes made through one name are visible through the others.
    lesson: u3-references
  - term: Rebinding
    definition: Pointing a name at a different object, as in `x = [9]`. Other names for the old object are unaffected.
    lesson: u3-references
  - term: Identity (is)
    definition: Whether two names refer to the very same object, tested with `is`. Different from equality, which `==` tests.
    lesson: u3-references
  - term: Shallow copy
    definition: A new outer collection whose items are the same objects as the original's, made with `lst[:]`, `list(lst)` or `lst.copy()`.
    lesson: u3-references
  - term: Deep copy
    definition: A copy of a nested structure where every inner object is copied too, made with `copy.deepcopy`.
    lesson: u3-references
  - term: Nested list
    definition: A list whose items are lists, often used for grids and tables, where `grid[r][c]` is row r, column c.
    lesson: u3-references
  - term: Side effect
    definition: A change a function makes beyond returning a value, such as printing or changing a list it was given.
    lesson: u3-references
  - term: Tuple
    definition: "An ordered, immutable sequence, written with round brackets: `(3, 4)`. Used for fixed bundles of values."
    lesson: u3-tuples
  - term: Unpacking
    definition: Assigning the items of a sequence to several names at once, as in `x, y = point`.
    lesson: u3-tuples
  - term: zip
    definition: A built-in that pairs up items at the same position in two or more sequences, stopping at the shortest.
    lesson: u3-tuples
  - term: Record
    definition: A group of related fields describing one thing, such as a student's name and score, stored as a tuple or dictionary.
    lesson: u3-tuples
  - term: Key function
    definition: A function passed as `key=` to `sorted`, `min` or `max`, which turns each item into the value to compare by.
    lesson: u3-tuples
  - term: Lambda
    definition: "A short, nameless function written in one expression, such as `lambda r: r[1]`. Often used as a key function."
    lesson: u3-tuples
  - term: Stable sort
    definition: A sort that keeps items with equal keys in their original order. Python's sort is stable.
    lesson: u3-tuples
  - term: Dictionary (dict)
    definition: "A mutable collection of key: value pairs with unique keys, written `{\"Ada\": 36}`. Values are looked up by key."
    lesson: u3-dicts
  - term: Key
    definition: The value used to look up an entry in a dictionary. Keys must be unique and immutable.
    lesson: u3-dicts
  - term: KeyError
    definition: The error raised when you read a dictionary key that doesn't exist. Avoid it with `in` or `get`.
    lesson: u3-dicts
  - term: get
    definition: The dictionary method `d.get(key, default)`, which returns the default instead of raising KeyError for a missing key.
    lesson: u3-dicts
  - term: Counting pattern
    definition: "Using a dictionary to count occurrences: `counts[x] = counts.get(x, 0) + 1`."
    lesson: u3-dicts
  - term: Grouping pattern
    definition: Using a dictionary of lists to collect items by some property, such as words by their first letter.
    lesson: u3-dicts
  - term: Hashing
    definition: Computing a number (a hash) from a value to decide where it's stored, which lets dictionaries and sets find items without searching.
    lesson: u3-dicts
  - term: Hashable
    definition: Able to be used as a dictionary key or set item. Immutable values such as strings, numbers and tuples are hashable; lists are not.
    lesson: u3-dicts
  - term: Set
    definition: "An unordered, mutable collection of unique values, written `{1, 2, 3}`. The empty set is `set()`."
    lesson: u3-sets
  - term: Union
    definition: The set of items in either of two sets, written `a | b`.
    lesson: u3-sets
  - term: Intersection
    definition: The set of items in both of two sets, written `a & b`.
    lesson: u3-sets
  - term: Set difference
    definition: The set of items in one set but not another, written `a - b`.
    lesson: u3-sets
  - term: Symmetric difference
    definition: The set of items in exactly one of two sets, written `a ^ b`. The set version of XOR.
    lesson: u3-sets
  - term: Subset
    definition: A set whose items are all in another set. `a <= b` tests whether a is a subset of b.
    lesson: u3-sets
  - term: Seen set
    definition: A set of items already encountered, kept while looping so repeats can be spotted instantly.
    lesson: u3-sets
  - term: List comprehension
    definition: "A compact expression that builds a list, such as `[n * n for n in nums if n > 0]`."
    lesson: u3-comprehensions
  - term: Conditional expression
    definition: "An expression that picks one of two values: `a if test else b`."
    lesson: u3-comprehensions
  - term: Dictionary comprehension
    definition: "A compact expression that builds a dictionary, such as `{w: len(w) for w in words}`."
    lesson: u3-comprehensions
  - term: Generator expression
    definition: A comprehension in round brackets that produces values one at a time, often passed to `sum`, `any` or `all`.
    lesson: u3-comprehensions
  - term: any and all
    definition: Built-ins that return True if at least one item (any) or every item (all) of a collection is true.
    lesson: u3-comprehensions
  - term: Canonical form
    definition: A standard representation that equivalent values share, such as a word's sorted letters for finding anagrams.
    lesson: u3-comprehensions
  - term: File
    definition: A named sequence of bytes kept in storage, which persists after a program ends.
    lesson: u3-files
  - term: Path
    definition: "The location of a file, such as `\"poem.txt\"` (in the current folder) or `\"data/scores.csv\"`."
    lesson: u3-files
  - term: File mode
    definition: "The second argument to `open`: `\"r\"` to read, `\"w\"` to write (emptying the file first) or `\"a\"` to append."
    lesson: u3-files
  - term: with statement
    definition: A block that sets something up and guarantees it's cleaned up afterwards. `with open(...) as f:` closes the file automatically.
    lesson: u3-files
  - term: Newline
    definition: The character `\n` that ends a line of text. Lines read from a file keep it, so they're usually stripped.
    lesson: u3-files
  - term: CSV
    definition: Comma-separated values, a plain-text table format where each line is a record and commas separate the fields.
    lesson: u3-files
  - term: Header row
    definition: The first line of a CSV file, naming the columns rather than holding data.
    lesson: u3-files
  - term: FileNotFoundError
    definition: The error raised when you try to open a file for reading that doesn't exist.
    lesson: u3-files
