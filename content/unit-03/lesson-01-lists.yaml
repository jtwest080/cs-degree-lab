id: u3-lists
title: Lists
minutes: 50
objective: |
  Store many values in one **list**, reach any item by its **index**, change lists with `append`, `insert`, `pop` and `remove`, and process every item with a `for` loop.
outcomes:
  - Create lists with square brackets, including the empty list `[]`
  - Read and replace items by index, including negative indexes
  - Explain why indexes start at 0 and why an `IndexError` happens
  - Grow and shrink lists with `append`, `insert`, `pop` and `remove`
  - Use `len`, `in`, `sum`, `min`, `max` and `sorted` on lists
  - Build a list from user input with the accumulator pattern

sections:
  - heading: Why we need collections
    body: |
      Every program in Unit 2 worked with a handful of named values: `price`, `count`, `total`. Now imagine storing the marks of a class of 30 students. Thirty variables (`mark1`, `mark2`, ... `mark30`) would be miserable to type, and impossible to loop over. Worse, you might not know in advance how many students there are.

      What we want is **one name for a whole collection of values**. Python's most-used collection is the **list**:

      ```python
      marks = [72, 85, 64, 90]
      ```

      A list is an **ordered sequence** of values, written between square brackets and separated by commas. `marks` is one variable, but it holds four numbers, in a definite order.

      > **Analogy:** A list is like a row of numbered lockers. The row has one name (`marks`); each locker has a number (its position) and holds one thing. You can open any locker directly if you know its number, put something new in it, or add more lockers to the end of the row.

      Lists can hold any type, and can mix types (though most real lists hold one kind of thing):

      ```python
      names = ["Ada", "Alan", "Grace"]
      empty = []
      mixed = [3, "three", 3.0, True]
      ```

      `len(marks)` gives the number of items: 4.

  - heading: Indexing, and why it starts at 0
    body: |
      Each item has an **index**: its position, counting from **0**. Write the index in square brackets after the list:

      ```python
      marks = [72, 85, 64, 90]
      #  index:  0   1   2   3
      print(marks[0])   # 72
      print(marks[3])   # 90
      ```

      Why 0 and not 1? Remember from Lesson 1.5 how memory works: a list's items sit at consecutive addresses. If the list starts at address `A`, item `i` is at address `A + i × (size of an item)`. The first item is at `A + 0`. The index is really an **offset**: "how many steps from the start". Almost every modern language counts this way. It also matches `range`: `range(len(marks))` gives 0, 1, 2, 3, exactly the valid indexes.

      **Negative indexes** count from the end: `marks[-1]` is the last item (90), `marks[-2]` the one before (64). This saves you writing `marks[len(marks) - 1]`.

      | Index | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | Value | 72 | 85 | 64 | 90 |
      | Negative index | -4 | -3 | -2 | -1 |

      Ask for an index that doesn't exist and Python stops with an **`IndexError`** (promised back in Lesson 2.9):

      ```text
      IndexError: list index out of range
      ```

      With 4 items, the valid indexes are 0 to 3 (or -1 to -4). `marks[4]` is the classic **off-by-one error**: the list has 4 items, but there's no item number 4.

  - heading: Lists are mutable
    body: |
      In Lesson 2.3 you learned that strings are **immutable**: methods like `upper()` give you a *new* string and leave the original alone. Lists are different. They are **mutable**: you can change them in place.

      Replace an item by assigning to an index:

      ```python
      marks[2] = 70      # [72, 85, 70, 90]
      ```

      And change the list's length with methods:

      | Method | What it does | Example (starting from `[5, 7]`) |
      |---|---|---|
      | `lst.append(x)` | add `x` to the end | `[5, 7, x]` |
      | `lst.insert(i, x)` | put `x` at index `i`, shifting later items right | `insert(0, 1)` gives `[1, 5, 7]` |
      | `lst.pop()` | remove and **return** the last item | returns 7, leaves `[5]` |
      | `lst.pop(i)` | remove and return the item at index `i` | `pop(0)` returns 5, leaves `[7]` |
      | `lst.remove(x)` | remove the **first** item equal to `x` | `remove(7)` leaves `[5]` |

      > **Warning:** These methods change the list and return `None` (except `pop`, which returns the removed item). So `marks = marks.append(99)` is a bug: it appends 99, then replaces your list with `None`. Just write `marks.append(99)`.

      `remove(x)` raises a `ValueError` if `x` isn't in the list, and `pop()` on an empty list raises an `IndexError`. Check first with `in` if you're not sure.

  - heading: Asking questions about a list
    body: |
      Many built-in functions work on lists of numbers:

      ```python
      marks = [72, 85, 64, 90]
      len(marks)      # 4
      sum(marks)      # 311
      min(marks)      # 64
      max(marks)      # 90
      sorted(marks)   # [64, 72, 85, 90]  (a NEW list; marks is unchanged)
      ```

      And `in` (which you used on strings in Lesson 2.5) asks whether a value is in a list:

      ```python
      85 in marks        # True
      100 not in marks   # True
      ```

      `marks.index(85)` gives the position of the first 85 (here 1), and `marks.count(85)` counts how many times it appears.

      Printing a list shows it in Python's own notation, brackets and all: `print(marks)` shows `[72, 85, 64, 90]`. Strings inside a list are shown with quotes: `['Ada', 'Alan']`.

  - heading: Looping over a list
    body: |
      A `for` loop goes through a list exactly the way it went through a string in Lesson 2.7: one item at a time, in order.

      ```python
      for mark in marks:
          print(mark)
      ```

      All the loop patterns from Unit 2 carry over directly. Here's the **accumulator** applied to a list, computing an average:

      ```python
      total = 0
      for mark in marks:
          total += mark
      print(total / len(marks))
      ```

      (`sum(marks) / len(marks)` does the same in one line. Knowing how to write the loop yourself matters, because soon you'll need loops that no built-in function covers.)

      There's a new pattern too: **building a list**. Start with an empty list and `append` to it inside a loop:

      ```python
      passed = []
      for mark in marks:
          if mark >= 70:
              passed.append(mark)
      print(passed)   # [72, 85, 90]
      ```

      This is the list version of the string accumulator (`result += ch`) you've already used.

      > **Key idea:** A list lets one variable stand for a whole collection, and a `for` loop lets a few lines of code handle a collection of any size. Together they're how programs deal with "lots of data".

examples:
  - title: Creating and indexing a list
    intro: Positive indexes count from the start (at 0), negative indexes from the end.
    code: |
      planets = ["Mercury", "Venus", "Earth", "Mars"]
      print(planets)
      print(len(planets))
      print(planets[0])
      print(planets[2])
      print(planets[-1])
      print(planets[len(planets) - 1])
    output: |
      ['Mercury', 'Venus', 'Earth', 'Mars']
      4
      Mercury
      Earth
      Mars
      Mars
    lines:
      - line: 1
        note: "A list of four strings. The order is kept exactly as written."
      - line: 2
        note: "Printing a list shows Python's notation: square brackets, with quotes around strings."
      - line: 3
        note: "`len` counts the items."
      - line: 4-5
        note: "Index 0 is the first item; index 2 is the *third* item."
      - line: 6-7
        note: "Two ways to get the last item. `-1` is shorter and can't be off by one."
  - title: Changing a list
    intro: Lists are mutable. Watch the same list change as each line runs.
    code: |
      queue = ["Ann", "Ben"]
      queue.append("Cat")
      print(queue)
      queue.insert(0, "Zed")
      print(queue)
      queue[1] = "Anna"
      print(queue)
      served = queue.pop(0)
      print(served, "was served")
      queue.remove("Cat")
      print(queue, len(queue))
    output: |
      ['Ann', 'Ben', 'Cat']
      ['Zed', 'Ann', 'Ben', 'Cat']
      ['Zed', 'Anna', 'Ben', 'Cat']
      Zed was served
      ['Anna', 'Ben'] 2
    lines:
      - line: 2
        note: "`append` adds to the end. It changes `queue` itself; there's no `queue = ...`."
      - line: 4
        note: "`insert(0, ...)` puts an item at the front, and every other item moves up one position."
      - line: 6
        note: "Assigning to an index replaces that one item."
      - line: 8
        note: "`pop(0)` removes the first item **and gives it back**, so we can store it."
      - line: 10
        note: "`remove` deletes by *value*, not by position."
  - title: Statistics with built-ins and a loop
    intro: The built-ins answer common questions; a loop answers the rest.
    code: |
      temps = [18.5, 21.0, 19.5, 24.0, 22.5, 17.0, 20.0]
      print("Days:", len(temps))
      print("Max:", max(temps), "Min:", min(temps))
      print("Average:", round(sum(temps) / len(temps), 2))
      warm_days = 0
      for t in temps:
          if t > 20:
              warm_days += 1
      print("Warm days:", warm_days)
      print("Sorted:", sorted(temps))
      print("Original:", temps)
    output: |
      Days: 7
      Max: 24.0 Min: 17.0
      Average: 20.36
      Warm days: 3
      Sorted: [17.0, 18.5, 19.5, 20.0, 21.0, 22.5, 24.0]
      Original: [18.5, 21.0, 19.5, 24.0, 22.5, 17.0, 20.0]
    lines:
      - line: 2-4
        note: "`len`, `max`, `min` and `sum` do the counting and searching for you. Average = sum ÷ count."
      - line: 5-8
        note: "A counter loop (Lesson 2.6), now running over a list. No built-in counts \"warm days\", so we write the loop."
      - line: 10-11
        note: "`sorted` returns a **new** sorted list. The original list keeps its order."
  - title: Building a list from input
    intro: Read words until the user types `done`, collecting them in a list.
    code: |
      words = []
      while True:
          word = input("Word (done to stop): ")
          if word == "done":
              break
          words.append(word)
      print("You typed", len(words), "words:", words)
      print("First:", words[0], "Last:", words[-1])
    stdin: |
      apple
      kiwi
      fig
      done
    output: |
      Word (done to stop): apple
      Word (done to stop): kiwi
      Word (done to stop): fig
      Word (done to stop): done
      You typed 3 words: ['apple', 'kiwi', 'fig']
      First: apple Last: fig
    lines:
      - line: 1
        note: "Start with an **empty** list."
      - line: 2-6
        note: "The sentinel loop from Lesson 2.6. Instead of adding to a running total, each value is appended to the list, so nothing is lost."
      - line: 7-8
        note: "Afterwards the whole collection is still available: its length, its first and last items, or anything else we want."

playground:
  prompt: |
    Make a list of your favourite foods. Try `append`, `insert`, `pop` and `remove`, printing the list after each change. What happens with `foods[10]`? With `foods.remove("nothing")`?
  code: |
    foods = ["pizza", "curry", "noodles"]
    foods.append("tacos")
    print(foods)
    print(foods[0], foods[-1])

exercises:
  - id: shopping-list
    title: Shopping list
    difficulty: 1
    prompt: |
      Start with the list `items = ["milk", "eggs", "bread"]` (already in the starter). Then, in order:

      1. add `"butter"` to the end,
      2. insert `"coffee"` at the front,
      3. replace `"eggs"` with `"cheese"` (assign to its index; don't rebuild the list),
      4. print the list, and then print how many items it has.

      Expected output:

      ```text
      ['coffee', 'milk', 'cheese', 'bread', 'butter']
      5
      ```
    starter: |
      items = ["milk", "eggs", "bread"]
    tests:
      - name: final list is correct
        code: |
          assert items == ["coffee", "milk", "cheese", "bread", "butter"], f"items ended up as {items}"
      - name: prints the list and its length
        code: |
          assert output == "['coffee', 'milk', 'cheese', 'bread', 'butter']\n5\n", f"Your output was:\n{output}"
      - name: uses list methods
        code: |
          assert ".append(" in source and ".insert(" in source, "Use append and insert to change the list."
    hints:
      - "`items.append(\"butter\")` adds to the end. `items.insert(0, \"coffee\")` adds at the front."
      - "After inserting at the front, every item has moved up one place, so `\"eggs\"` is now at index 2."
      - "`items[2] = \"cheese\"`, then `print(items)` and `print(len(items))`."
    solution: |
      items = ["milk", "eggs", "bread"]
      items.append("butter")
      items.insert(0, "coffee")
      items[2] = "cheese"
      print(items)
      print(len(items))
    explanation: |
      The trap is step 3: after `insert(0, ...)`, every later item shifts right, so "eggs" moved from index 1 to index 2. Indexes are positions, and positions change when you insert or remove. (If you'd wanted to be safe, `items[items.index("eggs")] = "cheese"` finds the position first.)

  - id: first-last-middle
    title: First, last and middle
    difficulty: 1
    prompt: |
      Write a function `ends(lst)` that returns a **new list** containing the first item, the middle item and the last item of `lst`, in that order. The middle item is at index `len(lst) // 2`.

      ```python
      ends([10, 20, 30, 40, 50])   # [10, 30, 50]
      ends(["a", "b"])             # ['a', 'b', 'b']
      ends([7])                    # [7, 7, 7]
      ```

      You can assume the list has at least one item.
    starter: |
      def ends(lst):
          pass
    tests:
      - name: odd-length list
        code: |
          assert ends([10, 20, 30, 40, 50]) == [10, 30, 50], f"ends([10, 20, 30, 40, 50]) returned {ends([10, 20, 30, 40, 50])}"
      - name: short lists
        code: |
          assert ends(["a", "b"]) == ["a", "b", "b"], f"ends(['a', 'b']) returned {ends(['a', 'b'])}"
          assert ends([7]) == [7, 7, 7], f"ends([7]) returned {ends([7])}"
          assert ends([1, 2, 3, 4]) == [1, 3, 4], f"ends([1, 2, 3, 4]) returned {ends([1, 2, 3, 4])}"
      - name: does not change the original list
        code: |
          data = [5, 6, 7]
          ends(data)
          assert data == [5, 6, 7], "ends should build a new list, not change the one it was given."
    hints:
      - "The first item is `lst[0]` and the last is `lst[-1]`."
      - "The middle item is `lst[len(lst) // 2]`."
      - "A list literal can contain expressions: `return [lst[0], ..., ...]`."
    solution: |
      def ends(lst):
          """Return [first, middle, last] of a non-empty list."""
          return [lst[0], lst[len(lst) // 2], lst[-1]]
    explanation: |
      A list literal can contain any expressions, not just constants. `len(lst) // 2` is always a valid index for a non-empty list: for length 1 it's 0, for length 4 it's 2. Using `-1` for the last item works for every length, including 1, where the first, middle and last items are all the same item.

  - id: running-totals
    title: Running totals
    difficulty: 2
    prompt: |
      Write a function `running_totals(nums)` that returns a new list where each item is the total of all the numbers **up to and including** that position.

      ```python
      running_totals([3, 1, 4, 1, 5])   # [3, 4, 8, 9, 14]
      running_totals([])                # []
      ```

      This is how a bank statement shows your balance after each transaction.
    starter: |
      def running_totals(nums):
          result = []
          return result
    tests:
      - name: example from the question
        code: |
          got = running_totals([3, 1, 4, 1, 5])
          assert got == [3, 4, 8, 9, 14], f"running_totals([3, 1, 4, 1, 5]) returned {got}"
      - name: empty list, negatives and floats
        code: |
          assert running_totals([]) == [], f"An empty list should give [], got {running_totals([])}"
          assert running_totals([10, -3, -7]) == [10, 7, 0], f"Got {running_totals([10, -3, -7])}"
          got = running_totals([0.5, 0.25])
          assert got == [0.5, 0.75], f"Got {got}"
      - name: result has one item per input item
        code: |
          for n in range(6):
              assert len(running_totals(list(range(n)))) == n, "The result should be as long as the input."
    hints:
      - "Two accumulators: a number `total` that keeps the running sum, and the list `result` that collects each total."
      - "Inside `for n in nums:`, first `total += n`, then `result.append(total)`."
    solution: |
      def running_totals(nums):
          """Return the cumulative sums of nums."""
          result = []
          total = 0
          for n in nums:
              total += n
              result.append(total)
          return result
    explanation: |
      This combines a number accumulator with a list accumulator. Each iteration updates the running total, then records a snapshot of it. The empty list works automatically: the loop body never runs, and `[]` is returned. Notice the function returns a *new* list and never changes `nums`.

  - id: above-average
    title: Above average
    difficulty: 2
    prompt: |
      Read whole numbers from the user, one per line, until they type `done`. Then print:

      - how many numbers were entered,
      - their average to 1 decimal place,
      - and a list of the numbers that are **strictly above** the average.

      For the inputs `4`, `8`, `6`, `2`, `10`, `done`:

      ```text
      Count: 5
      Average: 6.0
      Above average: [8, 10]
      ```

      If no numbers are entered at all, print just `No numbers entered`.
    starter: |
      nums = []
    testInput: |
      4
      8
      6
      2
      10
      done
    tests:
      - name: example from the question
        code: |
          out = run("4", "8", "6", "2", "10", "done")
          for line in ["Count: 5", "Average: 6.0", "Above average: [8, 10]"]:
              assert line in out, f"Expected {line!r}. You printed:\n{out}"
      - name: another set of numbers
        code: |
          out = run("1", "2", "4", "done")
          assert "Count: 3" in out and "Average: 2.3" in out and "Above average: [4]" in out, f"You printed:\n{out}"
      - name: all the same
        code: |
          out = run("5", "5", "done")
          assert "Above average: []" in out, f"No number is strictly above the average. You printed:\n{out}"
      - name: no numbers
        code: |
          out = run("done")
          assert "No numbers entered" in out, f"You printed:\n{out}"
          assert "Average" not in out, "Don't try to compute an average of nothing (it would divide by zero)."
    hints:
      - "Use a `while True` loop: read a line, `break` if it's `\"done\"`, otherwise `nums.append(int(line))`."
      - "After the loop, check `if len(nums) == 0:` (or `if not nums:`) before dividing."
      - "Build the second list with another loop: start with `above = []` and append each `n` where `n > average`."
    solution: |
      nums = []
      while True:
          line = input("Number: ")
          if line == "done":
              break
          nums.append(int(line))

      if len(nums) == 0:
          print("No numbers entered")
      else:
          average = sum(nums) / len(nums)
          above = []
          for n in nums:
              if n > average:
                  above.append(n)
          print(f"Count: {len(nums)}")
          print(f"Average: {average:.1f}")
          print(f"Above average: {above}")
    explanation: |
      This problem is **impossible without a list**. You can't know which numbers are above the average until you've seen *all* of them, so you have to keep them. In Unit 2 a running total was enough because we only needed the sum. The empty case matters: `sum([]) / len([])` would divide by zero.

  - id: second-largest
    title: Second largest
    difficulty: 3
    prompt: |
      Write a function `second_largest(nums)` that returns the second largest **distinct** value in a list of numbers, or `None` if there isn't one.

      ```python
      second_largest([4, 9, 2, 7])    # 7
      second_largest([5, 5, 3])       # 3   (the two 5s are the same value)
      second_largest([8, 8])          # None
      second_largest([])              # None
      ```

      **Don't** use `sorted`, `sort`, `max` or `min`. Go through the list **once**, keeping track of the largest and second largest values seen so far. You must not change the list you're given.
    starter: |
      def second_largest(nums):
          largest = None
          second = None
          for n in nums:
              pass
          return second
    tests:
      - name: simple cases
        code: |
          assert second_largest([4, 9, 2, 7]) == 7, f"Got {second_largest([4, 9, 2, 7])}"
          assert second_largest([1, 2]) == 1, f"Got {second_largest([1, 2])}"
          assert second_largest([2, 1]) == 1, f"Got {second_largest([2, 1])}"
      - name: duplicates
        code: |
          assert second_largest([5, 5, 3]) == 3, f"[5, 5, 3]: got {second_largest([5, 5, 3])}"
          assert second_largest([3, 5, 5]) == 3, f"[3, 5, 5]: got {second_largest([3, 5, 5])}"
          assert second_largest([8, 8]) is None, f"[8, 8]: got {second_largest([8, 8])}"
      - name: empty, single and negative
        code: |
          assert second_largest([]) is None, f"[]: got {second_largest([])}"
          assert second_largest([42]) is None, f"[42]: got {second_largest([42])}"
          assert second_largest([-3, -1, -2]) == -2, f"[-3, -1, -2]: got {second_largest([-3, -1, -2])}"
      - name: many random lists
        code: |
          import random
          for _ in range(200):
              data = [random.randint(-20, 20) for _ in range(random.randint(0, 8))]
              copy = list(data)
              distinct = sorted(set(data))
              want = distinct[-2] if len(distinct) >= 2 else None
              got = second_largest(data)
              assert got == want, f"second_largest({copy}) returned {got}, expected {want}"
              assert data == copy, "Don't change the list you were given."
      - name: no sorting or max
        code: |
          for banned in ["sorted(", ".sort(", "max(", "min("]:
              assert banned not in source, f"Solve it without {banned[:-1]}."
    hints:
      - "Start with `largest = None` and `second = None`. For each `n`, there are three cases: `n` is a new largest, `n` is between the two, or `n` doesn't matter."
      - "If `largest is None or n > largest`: the old largest becomes the second largest (`second = largest`), and `n` becomes the largest."
      - "Otherwise, if `n < largest and (second is None or n > second)`: `n` is the new second. The `n < largest` part skips duplicates of the largest."
    solution: |
      def second_largest(nums):
          """Return the second largest distinct value, or None."""
          largest = None
          second = None
          for n in nums:
              if largest is None or n > largest:
                  second = largest
                  largest = n
              elif n < largest and (second is None or n > second):
                  second = n
          return second
    explanation: |
      This is a **single pass** algorithm: it looks at each item exactly once, remembering just two values. The key move is that when a new largest appears, the old largest isn't thrown away; it is "demoted" to second. Duplicates are handled by the strict comparisons: a value equal to `largest` matches neither branch. `None` is a useful "nothing yet" value, and `is None` is the correct way to test for it. Sorting would also work, but sorting does more work than needed; you'll see exactly how much more in Unit 4.

commonMistakes:
  - title: Off-by-one with the last index
    explanation: |
      A list of length n has indexes 0 to n − 1. `lst[len(lst)]` is always an `IndexError`. Use `lst[-1]` for the last item.
    wrong: |
      last = scores[len(scores)]
    right: |
      last = scores[-1]
  - title: Assigning the result of append
    explanation: |
      `append`, `insert`, `remove` and `sort` change the list and return `None`. Assigning their result throws your list away.
    wrong: |
      names = names.append("Eve")   # names is now None
    right: |
      names.append("Eve")
  - title: Confusing remove and pop
    explanation: |
      `remove(x)` deletes by **value** (the first item equal to x). `pop(i)` deletes by **position** and returns the item. `nums.remove(0)` removes the first zero, not the first item.
  - title: Expecting sorted() to change the list
    explanation: |
      `sorted(lst)` returns a new list and leaves `lst` alone. If you don't store or print the result, nothing happens. (Lesson 3.2 covers `lst.sort()`, which sorts in place.)
    wrong: |
      sorted(marks)
      print(marks)     # still unsorted
    right: |
      marks = sorted(marks)
      print(marks)

summary:
  - "A **list** is an ordered, changeable sequence of values: `[72, 85, 64]`. `[]` is the empty list."
  - "Items are reached by **index**, starting at 0. Negative indexes count from the end: `lst[-1]` is the last item. A missing index raises `IndexError`."
  - "Lists are **mutable**: `lst[i] = x`, `append`, `insert`, `pop` and `remove` change the list in place (and, except `pop`, return `None`)."
  - "`len`, `sum`, `min`, `max`, `sorted` and `in` answer common questions about a list."
  - "`for item in lst:` visits every item. Build new lists by starting with `[]` and appending inside a loop."
  - "Use a list whenever you need to keep values for later, rather than just a running total."
next: |
  So far you've reached one item at a time. In **Lesson 3.2** you'll take whole **slices** of a list in one step, loop with positions as well as values, sort in place, and learn the standard list algorithms (filter, transform, search, reverse) that appear in almost every program.

