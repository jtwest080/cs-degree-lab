    question: |
      Write a function `count_long(words, n)` that returns how many strings in the list `words` have **more than** `n` characters. For example, `count_long(["hi", "hello", "hey there"], 3)` returns `2`.
    starter: |
      def count_long(words, n):
          pass
    tests:
      - name: counts long words
        code: |
          assert count_long(["hi", "hello", "hey there"], 3) == 2, f"Got {count_long(['hi', 'hello', 'hey there'], 3)}"
          assert count_long([], 5) == 0, "An empty list has no long words."
          assert count_long(["abc", "abcd"], 3) == 1, "Exactly n characters is not more than n."
          assert count_long(["a", "bb", "ccc"], 0) == 3
    solution: |
      def count_long(words, n):
          count = 0
          for w in words:
              if len(w) > n:
                  count += 1
          return count
