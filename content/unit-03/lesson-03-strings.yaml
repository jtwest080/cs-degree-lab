id: u3-strings
title: Strings in Depth
minutes: 55
objective: |
  Treat strings as **sequences**: index and slice them, take text apart with **`split`** and put it back together with **`join`**, search and clean text with string methods, and understand what **immutability** means for how you write string code.
outcomes:
  - Index and slice strings, including negative indexes and steps
  - Explain why `s[0] = "X"` fails, and build changed strings instead
  - Split text into a list of words or fields, and join a list back into text
  - Use `strip`, `replace`, `find`, `count`, `startswith` and `endswith`
  - Convert between characters and codes with `ord` and `chr`
  - Parse simple structured text such as `"name,score"` lines

sections:
  - heading: Strings are sequences
    body: |
      In Lesson 2.7 you looped over a string one character at a time. That works because a string is a **sequence** of characters, just like a list is a sequence of items. Almost everything from the last two lessons applies:

      ```python
      word = "Python"
      #       012345
      word[0]       # 'P'
      word[-1]      # 'n'
      word[1:4]     # 'yth'
      word[::-1]    # 'nohtyP'
      len(word)     # 6
      "th" in word  # True
      ```

      Indexing a string gives a string of length 1 (Python has no separate "character" type). Slicing gives a new string. Out-of-range indexes raise `IndexError`; out-of-range slices are clipped, exactly as with lists.

      One difference: for strings, `in` checks for a **substring**, not just a single item. `"th" in "Python"` is True, whereas `[1, 2] in [1, 2, 3]` is False (the list doesn't contain the *item* `[1, 2]`).

  - heading: Immutability
    body: |
      Lesson 2.3 said strings are **immutable**: once created, a string can never change. Now you can see what that means in practice. Lists let you assign to an index; strings don't:

      ```python
      word = "cat"
      word[0] = "b"
      ```

      ```text
      TypeError: 'str' object does not support item assignment
      ```

      To "change" a string, you build a **new** one and point the variable at it:

      ```python
      word = "b" + word[1:]     # 'bat'
      ```

      Every string method works this way: `upper()`, `replace()` and `strip()` return new strings and leave the original alone. That's why you always write `name = name.strip()`, never just `name.strip()`.

      > **Why:** Immutability makes strings safe to share. If two variables refer to the same string, neither can change it under the other's feet. It also lets Python use strings as dictionary keys (Lesson 3.6), which only works if keys can never change. Lists, being mutable, can't be dictionary keys.

  - heading: split and join
    body: |
      Real data usually arrives as text: a line typed by a user, a row in a file, a message from a network. The single most useful string method is **`split`**, which breaks a string into a **list** of pieces:

      ```python
      "the quick brown fox".split()      # ['the', 'quick', 'brown', 'fox']
      "  lots   of   space ".split()     # ['lots', 'of', 'space']
      "Ada,36,London".split(",")         # ['Ada', '36', 'London']
      "a,,b".split(",")                  # ['a', '', 'b']
      ```

      With no argument, `split()` splits on **any run of whitespace** (spaces, tabs, newlines) and ignores whitespace at the ends, which makes it perfect for words. With an argument, it splits on **exactly** that separator, so two commas in a row give an empty string between them.

      **`join`** does the reverse: it glues a list of strings together, with a separator between each pair. The odd-looking part is that you call it **on the separator**:

      ```python
      words = ["the", "quick", "fox"]
      " ".join(words)      # 'the quick fox'
      ", ".join(words)     # 'the, quick, fox'
      "".join(words)       # 'thequickfox'
      ```

      `join` only accepts strings. To join numbers, convert them first.

      > **Tip:** Split, process the list, join: that three-step recipe solves a huge number of text problems. To reverse the order of words: `" ".join(sentence.split()[::-1])`.

  - heading: Searching and cleaning
    body: |
      You met `upper`, `lower`, `strip` and `replace` in Lesson 2.3. Here's a fuller toolkit:

      | Method | Returns | Example |
      |---|---|---|
      | `s.strip()` | copy without whitespace at both ends | `"  hi \n".strip()` is `'hi'` |
      | `s.strip(".!")` | copy without those characters at the ends | `"wow!!".strip("!")` is `'wow'` |
      | `s.find(sub)` | index of the first `sub`, or −1 | `"banana".find("an")` is 1 |
      | `s.count(sub)` | number of non-overlapping `sub` | `"banana".count("a")` is 3 |
      | `s.startswith(p)` | True or False | `"photo.jpg".endswith(".jpg")` is True |
      | `s.replace(a, b)` | copy with every `a` replaced by `b` | `"a-b-c".replace("-", "")` is `'abc'` |
      | `s.isalpha()`, `s.isdigit()`, `s.isspace()` | True if every character is that kind | `"abc".isalpha()` is True |
      | `s.title()`, `s.capitalize()` | changed case | `"ada lovelace".title()` is `'Ada Lovelace'` |

      Note that `find` returns −1 when it fails, the same convention as the search function in Lesson 3.2. (`s.index(sub)` does the same job but raises `ValueError` instead.)

  - heading: Characters are numbers
    body: |
      Remember from Lesson 1.2 that every character is stored as a number, its **code point**. `ord` gives a character's code and `chr` turns a code back into a character:

      ```python
      ord("A")     # 65
      ord("a")     # 97
      chr(66)      # 'B'
      ```

      The letters A to Z have consecutive codes (65 to 90), and so do a to z (97 to 122). That means you can do arithmetic on letters. The position of a lowercase letter in the alphabet is `ord(ch) - ord("a")` (0 for a, 25 for z), and the letter `k` places later, wrapping round from z to a, is:

      ```python
      chr((ord(ch) - ord("a") + k) % 26 + ord("a"))
      ```

      That's the **Caesar cipher**, used by Julius Caesar over 2,000 years ago, and the basis of one of this lesson's exercises. (It's trivially easy to break. Real cryptography is in Unit 16.)

  - heading: Building strings efficiently
    body: |
      Building a string with `+=` in a loop works, and is fine for short strings. But because strings are immutable, each `+=` creates a whole new string and copies everything so far into it. For very long strings, Python programmers usually collect the pieces in a **list** (which is cheap to append to) and `join` once at the end:

      ```python
      pieces = []
      for n in range(5):
          pieces.append(str(n * n))
      result = "-".join(pieces)     # '0-1-4-9-16'
      ```

      This pattern also solves the "no separator after the last item" problem you wrestled with in the number triangle of Lesson 2.7: `join` only puts separators *between* items.

examples:
  - title: Indexing and slicing text
    intro: The same rules as lists, applied to characters.
    code: |
      email = "grace.hopper@navy.mil"
      at = email.find("@")
      print(at)
      print(email[:at])
      print(email[at + 1:])
      print(email[0].upper() + email[1:at])
      print(email[-3:], email.endswith(".mil"))
    output: |
      12
      grace.hopper
      navy.mil
      Grace.hopper
      mil True
    lines:
      - line: 2
        note: "`find` returns the index of the first `@`: the string has 12 characters before it (indexes 0 to 11)."
      - line: 4-5
        note: "Slice up to the `@` (excluded) for the user name, and from just after it for the domain."
      - line: 6
        note: "Strings can't be changed, so build a new one: an uppercase first letter plus the rest of the name."
      - line: 7
        note: "A negative slice takes the last three characters."
  - title: split, process, join
    intro: The three-step recipe for text problems.
    code: |
      sentence = "  the   quick brown   fox  "
      words = sentence.split()
      print(words)
      print(len(words), "words")
      print(" ".join(words))
      print(" ".join(words[::-1]))
      caps = []
      for w in words:
          caps.append(w.capitalize())
      print("-".join(caps))
    output: |
      ['the', 'quick', 'brown', 'fox']
      4 words
      the quick brown fox
      fox brown quick the
      The-Quick-Brown-Fox
    lines:
      - line: 2-3
        note: "`split()` with no argument copes with any amount of whitespace, including at the ends."
      - line: 5
        note: "Joining with single spaces tidies up the original messy spacing."
      - line: 6
        note: "Reverse the *list* of words, then join: the words are reversed but each word is not."
      - line: 7-10
        note: "Transform each word (Lesson 3.2's pattern), then join with dashes."
  - title: Parsing structured text
    intro: Each line of data has fields separated by commas.
    code: |
      record = "Ada Lovelace, 36 , London"
      fields = record.split(",")
      print(fields)
      name = fields[0].strip()
      age = int(fields[1])
      city = fields[2].strip()
      first, last = name.split()
      print(f"{last.upper()}, {first} ({age}) lives in {city}")
    output: |
      ['Ada Lovelace', ' 36 ', ' London']
      LOVELACE, Ada (36) lives in London
    lines:
      - line: 2-3
        note: "Splitting on a comma keeps the spaces around each field."
      - line: 4-6
        note: "`strip` cleans each field. `int(\" 36 \")` happens to allow surrounding spaces, so no strip is needed there."
      - line: 7
        note: "`split()` gives a two-item list, unpacked into two variables. This would raise `ValueError` if the name had three words."
  - title: Codes and the Caesar cipher
    intro: Letters are numbers, so we can shift them.
    code: |
      print(ord("a"), ord("z"), chr(72) + chr(105))
      message = "hello zoo"
      shift = 3
      result = ""
      for ch in message:
          if ch.isalpha():
              pos = ord(ch) - ord("a")
              result += chr((pos + shift) % 26 + ord("a"))
          else:
              result += ch
      print(result)
    output: |
      97 122 Hi
      khoor crr
    lines:
      - line: 1
        note: "`ord` gives codes; `chr` turns codes back into characters."
      - line: 7
        note: "Convert the letter to its position, 0 to 25."
      - line: 8
        note: "Add the shift and wrap round with `% 26`, so z (25) + 3 = 28 becomes 2, which is c. Then turn the position back into a letter."
      - line: 9-10
        note: "Spaces and punctuation pass through unchanged."

playground:
  prompt: |
    Experiment with `split` and `join`: split a sentence, sort the words with `sorted`, and join them back. Try `"a,b,,c".split(",")` and `"a b  c".split(" ")`; why are they different from `split()`?
  code: |
    text = "the cat sat on the mat"
    words = text.split()
    print(sorted(words))
    print(" ".join(sorted(words)))

exercises:
  - id: initials
    title: Initials
    difficulty: 1
    prompt: |
      Write `initials(full_name)` that returns the uppercase initials of a name, each followed by a dot. Extra spaces anywhere should be ignored.

      ```python
      initials("Ada Lovelace")            # 'A.L.'
      initials("  grace   brewster hopper ")   # 'G.B.H.'
      ```
    starter: |
      def initials(full_name):
          pass
    tests:
      - name: two names
        code: |
          assert initials("Ada Lovelace") == "A.L.", f"Got {initials('Ada Lovelace')!r}"
      - name: extra spaces, lowercase, three names
        code: |
          got = initials("  grace   brewster hopper ")
          assert got == "G.B.H.", f"Got {got!r}"
      - name: one name
        code: |
          assert initials("plato") == "P.", f"Got {initials('plato')!r}"
    hints:
      - "`full_name.split()` gives a list of the names and ignores extra spaces."
      - "For each name, `name[0].upper() + \".\"` is one initial."
      - "Collect the initials in a string (or a list you `join` with `\"\"`)."
    solution: |
      def initials(full_name):
          """Return initials like 'A.L.' for 'Ada Lovelace'."""
          result = ""
          for name in full_name.split():
              result += name[0].upper() + "."
          return result
    explanation: |
      `split()` with no argument does all the hard work of handling messy spacing. If you'd used `split(" ")`, the extra spaces would produce empty strings, and `""[0]` raises `IndexError`.

  - id: reverse-words
    title: Reverse the words
    difficulty: 1
    prompt: |
      Write `reverse_words(sentence)` that returns the words of a sentence in reverse order, separated by single spaces. Each word itself stays the same.

      ```python
      reverse_words("one two three")     # 'three two one'
      reverse_words("  hello   world ")  # 'world hello'
      ```
    starter: |
      def reverse_words(sentence):
          pass
    tests:
      - name: three words
        code: |
          assert reverse_words("one two three") == "three two one", f"Got {reverse_words('one two three')!r}"
      - name: messy spacing and one word
        code: |
          assert reverse_words("  hello   world ") == "world hello", f"Got {reverse_words('  hello   world ')!r}"
          assert reverse_words("solo") == "solo"
          assert reverse_words("") == "", "An empty sentence has no words."
    hints:
      - "Split into a list of words, reverse the list, join it with `\" \"`."
      - "`\" \".join(words[::-1])`"
    solution: |
      def reverse_words(sentence):
          """Return the words of sentence in reverse order."""
          words = sentence.split()
          return " ".join(words[::-1])
    explanation: |
      Split, process, join. Reversing the *string* (`sentence[::-1]`) would reverse the letters too, giving `'eerht owt eno'`. Working at the level of a list of words is what makes this a one-liner.

  - id: palindrome
    title: Palindrome checker
    difficulty: 2
    prompt: |
      A **palindrome** reads the same forwards and backwards. Write `is_palindrome(text)` that returns True if `text` is a palindrome, **ignoring case and anything that isn't a letter**.

      ```python
      is_palindrome("racecar")                          # True
      is_palindrome("A man, a plan, a canal: Panama!")  # True
      is_palindrome("hello")                            # False
      ```
    starter: |
      def is_palindrome(text):
          pass
    tests:
      - name: simple words
        code: |
          assert is_palindrome("racecar") is True, "racecar is a palindrome"
          assert is_palindrome("hello") is False, "hello is not a palindrome"
          assert is_palindrome("a") is True, "A single letter is a palindrome"
      - name: ignores case and punctuation
        code: |
          assert is_palindrome("A man, a plan, a canal: Panama!") is True, "Ignore case, spaces and punctuation."
          assert is_palindrome("Was it a car or a cat I saw?") is True
          assert is_palindrome("No lemon, no melon") is True
          assert is_palindrome("Not a palindrome") is False
      - name: returns a boolean
        code: |
          assert isinstance(is_palindrome("abba"), bool), "Return True or False."
    hints:
      - "First build a cleaned string: loop over `text`, keep only characters where `ch.isalpha()`, and lowercase them."
      - "Then compare the cleaned string with its reverse: `cleaned == cleaned[::-1]`."
    solution: |
      def is_palindrome(text):
          """True if text reads the same backwards, ignoring case and non-letters."""
          cleaned = ""
          for ch in text:
              if ch.isalpha():
                  cleaned += ch.lower()
          return cleaned == cleaned[::-1]
    explanation: |
      The work splits into two simple steps: **normalise** the data (filter and transform), then **compare**. A comparison like `cleaned == cleaned[::-1]` already gives True or False, so there's no need for `if ...: return True else: return False`. You could also use the two-pointer technique from Lesson 3.2 to compare without building a reversed copy.

  - id: caesar
    title: Caesar cipher
    difficulty: 3
    prompt: |
      Write `caesar(text, shift)` that shifts every letter `shift` places along the alphabet, wrapping round from z to a. Keep each letter's case, and leave everything else (spaces, digits, punctuation) unchanged. `shift` may be negative (to decode) or larger than 26.

      ```python
      caesar("Hello, World!", 3)     # 'Khoor, Zruog!'
      caesar("Khoor, Zruog!", -3)    # 'Hello, World!'
      caesar("xyz", 29)              # 'abc'
      ```

      Build the result with a list and `join`.
    starter: |
      def caesar(text, shift):
          pieces = []
          for ch in text:
              pieces.append(ch)
          return "".join(pieces)
    tests:
      - name: lowercase with wrap-around
        code: |
          assert caesar("abc", 1) == "bcd", f"Got {caesar('abc', 1)!r}"
          assert caesar("xyz", 3) == "abc", f"Got {caesar('xyz', 3)!r}"
      - name: keeps case and punctuation
        code: |
          assert caesar("Hello, World!", 3) == "Khoor, Zruog!", f"Got {caesar('Hello, World!', 3)!r}"
          assert caesar("Room 101", 1) == "Sppn 101", f"Got {caesar('Room 101', 1)!r}"
      - name: negative and large shifts
        code: |
          assert caesar("Khoor, Zruog!", -3) == "Hello, World!", f"Got {caesar('Khoor, Zruog!', -3)!r}"
          assert caesar("xyz", 29) == "abc", f"Got {caesar('xyz', 29)!r}"
          assert caesar("Same", 26) == "Same", "A shift of 26 goes all the way round."
      - name: decoding undoes encoding
        code: |
          msg = "The Quick Brown Fox Jumps Over The Lazy Dog."
          for k in [1, 5, 13, 25, 100]:
              assert caesar(caesar(msg, k), -k) == msg, f"Shifting by {k} then {-k} should give back the original."
    hints:
      - "Three cases for each character: lowercase letter, uppercase letter, anything else. `ch.islower()` and `ch.isupper()` tell them apart."
      - "For a lowercase letter: `chr((ord(ch) - ord(\"a\") + shift) % 26 + ord(\"a\"))`. Uppercase is the same with `\"A\"`."
      - "Python's `%` always gives a result from 0 to 25 for `% 26`, even for negative numbers (`-1 % 26` is 25), so negative shifts work automatically."
    solution: |
      def caesar(text, shift):
          """Shift each letter of text by shift places, keeping case."""
          pieces = []
          for ch in text:
              if ch.islower():
                  base = ord("a")
                  pieces.append(chr((ord(ch) - base + shift) % 26 + base))
              elif ch.isupper():
                  base = ord("A")
                  pieces.append(chr((ord(ch) - base + shift) % 26 + base))
              else:
                  pieces.append(ch)
          return "".join(pieces)
    explanation: |
      The trick is to move letters into the range 0 to 25, do the arithmetic there, and move back. `% 26` handles wrapping in both directions: in Python, `%` with a positive divisor always returns a non-negative result, so `(0 - 3) % 26` is 23 (x). Choosing `base` once per branch avoids writing the formula twice with different letters. With only 25 possible shifts, anyone can break this cipher by trying them all, an idea called **brute force** that you'll meet again in Units 8 and 16.

  - id: run-length
    title: Run-length encoding
    difficulty: 3
    prompt: |
      **Run-length encoding** is a simple compression method: replace each run of repeated characters with the character followed by how many times it repeats. Write `compress(text)`:

      ```python
      compress("aaabccdddd")   # 'a3b1c2d4'
      compress("abc")          # 'a1b1c1'
      compress("")             # ''
      ```

      Then write `decompress(code)` that reverses it, assuming every count is a **single digit**:

      ```python
      decompress("a3b1c2d4")   # 'aaabccdddd'
      ```
    starter: |
      def compress(text):
          pass


      def decompress(code):
          pass
    tests:
      - name: compress
        code: |
          assert compress("aaabccdddd") == "a3b1c2d4", f"Got {compress('aaabccdddd')!r}"
          assert compress("abc") == "a1b1c1", f"Got {compress('abc')!r}"
          assert compress("zzzzzz") == "z6", f"Got {compress('zzzzzz')!r}"
      - name: compress edge cases
        code: |
          assert compress("") == "", f"Got {compress('')!r}"
          assert compress("x") == "x1", f"Got {compress('x')!r}"
          assert compress("aabaa") == "a2b1a2", f"Runs can repeat later. Got {compress('aabaa')!r}"
      - name: decompress
        code: |
          assert decompress("a3b1c2d4") == "aaabccdddd", f"Got {decompress('a3b1c2d4')!r}"
          assert decompress("") == "", f"Got {decompress('')!r}"
      - name: round trip
        code: |
          for s in ["hello", "aaaabbbccd", "  !!", "mississippi"]:
              assert decompress(compress(s)) == s, f"decompress(compress({s!r})) gave {decompress(compress(s))!r}"
    hints:
      - "For `compress`, walk through the string keeping the current character and a count. When the next character is different, the run has ended: record it and start a new run."
      - "Don't forget the last run: after the loop ends, it hasn't been recorded yet. (Check for the empty string first.)"
      - "For `decompress`, step through the code two characters at a time: `for i in range(0, len(code), 2):`, then `code[i] * int(code[i + 1])`."
    solution: |
      def compress(text):
          """Run-length encode text, e.g. 'aaab' -> 'a3b1'."""
          if text == "":
              return ""
          pieces = []
          current = text[0]
          count = 1
          for ch in text[1:]:
              if ch == current:
                  count += 1
              else:
                  pieces.append(current + str(count))
                  current = ch
                  count = 1
          pieces.append(current + str(count))
          return "".join(pieces)


      def decompress(code):
          """Reverse compress(), assuming single-digit counts."""
          pieces = []
          for i in range(0, len(code), 2):
              pieces.append(code[i] * int(code[i + 1]))
          return "".join(pieces)
    explanation: |
      `compress` tracks **state** (the current run) and acts when the state changes. The classic bug is forgetting the final run, which is still in `current` and `count` when the loop ends. `decompress` uses `range` with a step of 2 to visit pairs. Run-length encoding is used for real in fax machines and some image formats, where long runs of the same colour are common. On text with few repeats it makes things *longer*: "abc" becomes "a1b1c1". No compression method shrinks every input, a fact you can prove with the counting ideas of Unit 6.

commonMistakes:
  - title: Trying to change a string in place
    explanation: |
      Strings are immutable. Build a new string and reassign it.
    wrong: |
      word[0] = word[0].upper()
    right: |
      word = word[0].upper() + word[1:]
  - title: Calling a method without keeping the result
    explanation: |
      String methods return new strings. Without an assignment, the result is thrown away.
    wrong: |
      name.strip()
      print(name)       # still has the spaces
    right: |
      name = name.strip()
      print(name)
  - title: split(" ") instead of split()
    explanation: |
      `split(" ")` splits on every single space, so double spaces produce empty strings in the list. `split()` treats any run of whitespace as one separator.
    wrong: |
      "a  b".split(" ")    # ['a', '', 'b']
    right: |
      "a  b".split()       # ['a', 'b']
  - title: Calling join on the list
    explanation: |
      `join` is a method of the **separator** string, and it needs a list of strings.
    wrong: |
      words.join(" ")
      " ".join([1, 2, 3])
    right: |
      " ".join(words)
      " ".join(["1", "2", "3"])

summary:
  - "Strings are sequences: indexing, slicing, `len`, `for` and `in` work as they do for lists (`in` checks for substrings)."
  - "Strings are **immutable**: methods return new strings, and `s[i] = x` is a `TypeError`. Build a new string and reassign."
  - "`s.split()` breaks text into a list of words; `s.split(\",\")` splits on an exact separator. `sep.join(list)` glues strings together."
  - "Split, process, join is the standard recipe for text problems."
  - "`find`, `count`, `startswith`, `endswith`, `replace`, `strip` and the `is...` methods search and clean text."
  - "`ord` and `chr` convert between characters and their codes, so letters can be shifted with arithmetic."
next: |
  You've seen that some objects (lists) can change and others (strings) can't. That difference has surprising consequences when two variables refer to the same list. In **Lesson 3.4** you'll learn exactly how Python variables refer to objects, why changing "one" list can change "another", how to make real copies, and how to work with lists of lists (grids and tables).

quiz:
  - type: mcq
    question: "What is `\"computer\"[3:6]`?"
    options: ["\"put\"", "\"pute\"", "\"mpu\"", "\"ute\""]
    answer: 0
    explanation: Indexes 3, 4 and 5 are p, u and t. The stop index 6 is excluded.
  - type: mcq
    question: "What happens when you run `s = \"hat\"` then `s[0] = \"c\"`?"
    options: ["s becomes \"cat\"", "A TypeError, because strings are immutable", "s becomes \"chat\"", "Nothing happens"]
    answer: 1
    explanation: Strings can't be changed in place. Write s = "c" + s[1:] instead.
  - type: mcq
    question: "What is `\"2024-03-15\".split(\"-\")`?"
    options: ["['2024', '03', '15']", "[2024, 3, 15]", "['2024-03-15']", "('2024', '03', '15')"]
    answer: 0
    explanation: split always produces a list of strings. Converting them to numbers is a separate step.
  - type: mcq
    question: "What is `\"+\".join([\"a\", \"b\", \"c\"])`?"
    options: ["\"a+b+c+\"", "\"+a+b+c\"", "\"a+b+c\"", "\"abc+\""]
    answer: 2
    explanation: join places the separator only between items, never at the ends.
  - type: mcq
    question: "What does `\"banana\".find(\"z\")` return?"
    options: ["None", "0", "-1", "A ValueError"]
    answer: 2
    explanation: find returns -1 when the substring isn't present. (index would raise ValueError.)
  - type: mcq
    question: "Given `name = \"  Ada  \"`, which line leaves `name` equal to `\"Ada\"`?"
    options: ["name.strip()", "strip(name)", "name = name.strip()", "name[2:5] = \"Ada\""]
    answer: 2
    explanation: strip returns a new string, so the result must be assigned back to name.
  - type: code
    question: |
      Write `mask(card)` that hides all but the last 4 characters of a card number with `*`. `mask("1234567812345678")` returns `"************5678"`. If the string has 4 or fewer characters, return it unchanged.
    starter: |
      def mask(card):
          pass
    tests:
      - name: masks all but the last four
        code: |
          assert mask("1234567812345678") == "************5678", f"Got {mask('1234567812345678')!r}"
          assert mask("98765") == "*8765", f"Got {mask('98765')!r}"
          assert mask("1234") == "1234", f"Got {mask('1234')!r}"
          assert mask("12") == "12", f"Got {mask('12')!r}"
    solution: |
      def mask(card):
          if len(card) <= 4:
              return card
          return "*" * (len(card) - 4) + card[-4:]
