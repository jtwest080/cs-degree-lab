    question: |
      Write `clamp_negatives(nums)` that changes the list **in place**, replacing every negative number with `0`, and returns `None`. After `data = [3, -1, 4, -5]` and `clamp_negatives(data)`, `data` is `[3, 0, 4, 0]`.
    starter: |
      def clamp_negatives(nums):
          pass
    tests:
      - name: changes the list in place
        code: |
          data = [3, -1, 4, -5]
          result = clamp_negatives(data)
          assert data == [3, 0, 4, 0], f"data became {data}"
          assert result is None, "Return None from an in-place function."
          empty = []
          clamp_negatives(empty)
          assert empty == []
    solution: |
      def clamp_negatives(nums):
          for i in range(len(nums)):
              if nums[i] < 0:
                  nums[i] = 0
