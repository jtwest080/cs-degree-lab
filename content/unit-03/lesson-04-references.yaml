exercises:
  - id: add-bonus
    title: Don't touch my list
    difficulty: 1
    prompt: |
      The starter's `add_bonus(scores, bonus)` is meant to return a new list with `bonus` added to every score, but it has a nasty side effect: it changes the caller's list too. Run it to see.

      Rewrite it so it returns the new list **without changing** `scores`.
    starter: |
      def add_bonus(scores, bonus):
          for i in range(len(scores)):
              scores[i] = scores[i] + bonus
          return scores


      marks = [50, 60, 70]
      boosted = add_bonus(marks, 5)
      print(marks)
      print(boosted)
    tests:
      - name: returns the boosted scores
        code: |
          assert add_bonus([50, 60, 70], 5) == [55, 65, 75], f"Got {add_bonus([50, 60, 70], 5)}"
          assert add_bonus([], 5) == []
      - name: does not change the original list
        code: |
          data = [1, 2, 3]
          result = add_bonus(data, 10)
          assert data == [1, 2, 3], f"The caller's list was changed to {data}."
          assert result is not data, "Return a new list, not the same list object."
      - name: program output
        code: |
          assert output == "[50, 60, 70]\n[55, 65, 75]\n", f"Your output was:\n{output}"
    hints:
      - "`scores` is another name for the caller's list, so `scores[i] = ...` changes the caller's list."
      - "Build a new list instead: `result = []`, then `result.append(s + bonus)` for each score, and return `result`."
    solution: |
      def add_bonus(scores, bonus):
          """Return a new list with bonus added to every score."""
          result = []
          for s in scores:
              result.append(s + bonus)
          return result


      marks = [50, 60, 70]
      boosted = add_bonus(marks, 5)
      print(marks)
      print(boosted)
    explanation: |
      The original version returned `scores`, the caller's own list, after changing it, so `marks` and `boosted` were the same object. It was the worst of both styles: it mutated **and** returned. The fix builds a fresh list, so the caller's data is safe. Copying first (`scores = scores[:]`) and then changing the copy would also work.

  - id: make-grid
    title: Make a grid
    difficulty: 2
    prompt: |
      Write `make_grid(rows, cols, fill)` that returns a grid (a list of `rows` lists, each with `cols` items) where every cell is `fill`. **Every row must be a separate list**, so changing one cell changes only that cell.

      Then write `show(grid)` that prints the grid, one row per line, with the cells separated by spaces. For `show(make_grid(2, 3, "."))`:

      ```text
      . . .
      . . .
      ```
    starter: |
      def make_grid(rows, cols, fill):
          return [[fill] * cols] * rows


      def show(grid):
          pass
    tests:
      - name: right shape and contents
        code: |
          g = make_grid(2, 3, ".")
          assert g == [[".", ".", "."], [".", ".", "."]], f"Got {g}"
          assert make_grid(0, 5, 0) == [], "0 rows should give an empty list."
      - name: rows are independent
        code: |
          g = make_grid(3, 3, 0)
          g[1][1] = 5
          assert g == [[0, 0, 0], [0, 5, 0], [0, 0, 0]], f"Setting g[1][1] gave {g}. Are your rows the same list?"
      - name: show prints the grid
        code: |
          printed, _ = capture(show, [["a", "b"], ["c", "d"]])
          assert printed == "a b\nc d\n", f"show printed {printed!r}"
    hints:
      - "The starter repeats one row `rows` times, so every row is the same list. Use a loop that creates a new row each time."
      - "`grid = []`, then `for r in range(rows): grid.append([fill] * cols)`."
      - "For `show`, loop over the rows and print `\" \".join(...)` of each row. Convert cells with `str()` first if they might be numbers."
    solution: |
      def make_grid(rows, cols, fill):
          """Return a rows x cols grid of fill, with independent rows."""
          grid = []
          for r in range(rows):
              grid.append([fill] * cols)
          return grid


      def show(grid):
          """Print grid one row per line, cells separated by spaces."""
          for row in grid:
              cells = []
              for cell in row:
                  cells.append(str(cell))
              print(" ".join(cells))
    explanation: |
      `[fill] * cols` is safe for the *inside* of each row because `fill` is something like a string or number, which can't be changed (even though the same object is repeated, assigning `g[1][1] = 5` replaces an item rather than changing the object). The danger is repeating a **list**, which is what `* rows` did to the row. Creating each row inside the loop gives `rows` distinct row objects.

  - id: transpose
    title: Transpose a matrix
    difficulty: 2
    prompt: |
      The **transpose** of a matrix (grid of numbers) swaps its rows and columns: row 0 becomes column 0, and so on. Write `transpose(matrix)` that returns a new matrix.

      ```python
      transpose([[1, 2, 3],
                 [4, 5, 6]])
      # [[1, 4],
      #  [2, 5],
      #  [3, 6]]
      ```

      A 2 × 3 matrix becomes 3 × 2. You can assume the matrix has at least one row and all rows have the same length.
    starter: |
      def transpose(matrix):
          pass
    tests:
      - name: 2 by 3
        code: |
          got = transpose([[1, 2, 3], [4, 5, 6]])
          assert got == [[1, 4], [2, 5], [3, 6]], f"Got {got}"
      - name: square and single row
        code: |
          assert transpose([[1, 2], [3, 4]]) == [[1, 3], [2, 4]], f"Got {transpose([[1, 2], [3, 4]])}"
          assert transpose([[7, 8, 9]]) == [[7], [8], [9]], f"Got {transpose([[7, 8, 9]])}"
      - name: transposing twice gives the original, unchanged
        code: |
          m = [[1, 2, 3], [4, 5, 6]]
          assert transpose(transpose(m)) == m
          assert m == [[1, 2, 3], [4, 5, 6]], "Don't change the matrix you were given."
    hints:
      - "The result has one row for each **column** of the input: `for c in range(len(matrix[0])):`."
      - "New row number `c` contains item `c` from every input row: loop `for row in matrix:` and append `row[c]`."
    solution: |
      def transpose(matrix):
          """Return the transpose of matrix (rows become columns)."""
          result = []
          for c in range(len(matrix[0])):
              new_row = []
              for row in matrix:
                  new_row.append(row[c])
              result.append(new_row)
          return result
    explanation: |
      Item `[r][c]` of the input becomes item `[c][r]` of the output. The outer loop runs over columns and the inner loop over rows, the same "inside out" pattern used for column sums in the examples. Transposing is everywhere in data work: turning rows of records into columns of values, and in the matrix maths behind graphics and machine learning (Unit 17).

  - id: neighbours
    title: Count the neighbours
    difficulty: 3
    prompt: |
      In grid games like Minesweeper, each cell has up to **8 neighbours** (including diagonals). Cells on the edge have fewer.

      Write `count_neighbours(grid, r, c)` that returns how many of the neighbours of cell `(r, c)` contain `"#"`. The cell itself doesn't count.

      ```python
      grid = [
          ["#", ".", "."],
          [".", "#", "#"],
          [".", ".", "#"],
      ]
      count_neighbours(grid, 1, 1)   # 3  (top-left, right, bottom-right)
      count_neighbours(grid, 0, 0)   # 1  (only (1,1); the cell itself doesn't count)
      count_neighbours(grid, 2, 0)   # 1
      ```

      The grid may not be square.
    starter: |
      def count_neighbours(grid, r, c):
          count = 0
          return count
    tests:
      - name: middle cell
        code: |
          g = [["#", ".", "."], [".", "#", "#"], [".", ".", "#"]]
          assert count_neighbours(g, 1, 1) == 3, f"Got {count_neighbours(g, 1, 1)}"
      - name: corners and edges
        code: |
          g = [["#", ".", "."], [".", "#", "#"], [".", ".", "#"]]
          assert count_neighbours(g, 0, 0) == 1, f"(0, 0): got {count_neighbours(g, 0, 0)}"
          assert count_neighbours(g, 2, 0) == 1, f"(2, 0): got {count_neighbours(g, 2, 0)}"
          assert count_neighbours(g, 0, 2) == 2, f"(0, 2): got {count_neighbours(g, 0, 2)}"
          assert count_neighbours(g, 2, 2) == 2, f"(2, 2): got {count_neighbours(g, 2, 2)}"
      - name: full and non-square grids
        code: |
          full = [["#"] * 4 for _ in range(3)]
          assert count_neighbours(full, 1, 1) == 8, f"A middle cell of a full grid has 8 neighbours, got {count_neighbours(full, 1, 1)}"
          assert count_neighbours(full, 0, 3) == 3, f"A corner of a full grid has 3 neighbours, got {count_neighbours(full, 0, 3)}"
          assert count_neighbours([["#", ".", "#"]], 0, 1) == 2, "A one-row grid: only left and right exist."
      - name: no wrap-around
        code: |
          g = [[".", ".", "#"], [".", ".", "."], [".", ".", "#"]]
          assert count_neighbours(g, 0, 0) == 0, "Negative indexes would wrap round to the far side. Check bounds before indexing."
    hints:
      - "Loop over the row offsets `dr` in -1, 0, 1 and column offsets `dc` in -1, 0, 1. Skip the case where both are 0 (that's the cell itself)."
      - "The neighbour is at `nr = r + dr`, `nc = c + dc`. Only look at it if `0 <= nr < len(grid)` and `0 <= nc < len(grid[0])`."
      - "Watch out: without the bounds check, `grid[-1]` doesn't crash, it silently reads the *last* row. That's why the test called \"no wrap-around\" exists."
    solution: |
      def count_neighbours(grid, r, c):
          """Count '#' cells among the up-to-8 neighbours of (r, c)."""
          count = 0
          for dr in [-1, 0, 1]:
              for dc in [-1, 0, 1]:
                  if dr == 0 and dc == 0:
                      continue
                  nr = r + dr
                  nc = c + dc
                  if 0 <= nr < len(grid) and 0 <= nc < len(grid[0]):
                      if grid[nr][nc] == "#":
                          count += 1
          return count
    explanation: |
      Looping over **offsets** is much cleaner than writing out eight separate checks. The bounds check is essential, and Python makes it extra important: a negative index doesn't raise an error, it quietly wraps to the other end of the list, so an edge cell would "see" cells on the opposite side. `0 <= nr < len(grid)` uses Python's chained comparison, which means `0 <= nr and nr < len(grid)`. This function is the core of Conway's **Game of Life**, a famous simulation you could build as a stretch goal.

  - id: tic-tac-toe
    title: Tic-tac-toe winner
    difficulty: 3
    prompt: |
      A tic-tac-toe board is a 3 × 3 grid of `"X"`, `"O"` or `" "` (empty). Write `winner(board)` that returns `"X"` or `"O"` if that player has three in a row (any row, column or diagonal), or `None` if nobody has won.

      ```python
      winner([["X", "O", " "],
              ["X", "O", " "],
              ["X", " ", " "]])   # 'X'  (left column)
      ```

      Three empty cells in a row don't count as a win.
    starter: |
      def winner(board):
          return None
    tests:
      - name: rows and columns
        code: |
          assert winner([["O", "O", "O"], ["X", "X", " "], [" ", " ", "X"]]) == "O", "Top row of O"
          assert winner([["X", "O", " "], ["X", "O", " "], ["X", " ", " "]]) == "X", "Left column of X"
          assert winner([[" ", " ", "O"], ["X", "X", "O"], ["X", " ", "O"]]) == "O", "Right column of O"
          assert winner([[" ", " ", " "], [" ", " ", " "], ["X", "X", "X"]]) == "X", "Bottom row of X"
      - name: diagonals
        code: |
          assert winner([["X", "O", "O"], [" ", "X", " "], ["O", " ", "X"]]) == "X", "Main diagonal"
          assert winner([["X", "X", "O"], [" ", "O", " "], ["O", " ", "X"]]) == "O", "Other diagonal"
      - name: no winner
        code: |
          assert winner([[" "] * 3, [" "] * 3, [" "] * 3]) is None, "An empty board has no winner."
          assert winner([["X", "O", "X"], ["X", "O", "O"], ["O", "X", "X"]]) is None, "A full board with no line has no winner."
          assert winner([["X", "X", " "], ["O", "O", " "], [" ", " ", " "]]) is None
      - name: board is not changed
        code: |
          b = [["X", "O", " "], ["X", "O", " "], ["X", " ", " "]]
          winner(b)
          assert b == [["X", "O", " "], ["X", "O", " "], ["X", " ", " "]], "Don't change the board."
    hints:
      - "Build a list of all 8 lines, each a list of 3 cells: the 3 rows, the 3 columns, and the 2 diagonals."
      - "Rows are just `board[0]`, `board[1]`, `board[2]`. Column `c` is `[board[0][c], board[1][c], board[2][c]]`. The diagonals are `[board[0][0], board[1][1], board[2][2]]` and `[board[0][2], board[1][1], board[2][0]]`."
      - "Then check each line: if `line[0] != \" \"` and all three are equal, return `line[0]`. After checking every line, return None."
    solution: |
      def winner(board):
          """Return 'X' or 'O' if they have three in a row, else None."""
          lines = []
          for r in range(3):
              lines.append(board[r])
          for c in range(3):
              lines.append([board[0][c], board[1][c], board[2][c]])
          lines.append([board[0][0], board[1][1], board[2][2]])
          lines.append([board[0][2], board[1][1], board[2][0]])
          for line in lines:
              if line[0] != " " and line[0] == line[1] == line[2]:
                  return line[0]
          return None
    explanation: |
      Instead of writing eight complicated `if` statements, we turn the problem into **data**: a list of the eight lines, then one simple loop that checks each line the same way. Turning special cases into data is one of the most useful habits in programming. `line[0] == line[1] == line[2]` is a chained comparison. Note `lines.append(board[r])` stores references to the board's own rows, which is safe here because we only read them.

commonMistakes:
  - title: Thinking assignment copies a list
    explanation: |
      `b = a` makes `b` another name for the same list. Use `a[:]`, `list(a)` or `a.copy()` when you need a separate list.
    wrong: |
      backup = scores
      scores.clear()      # backup is empty too
    right: |
      backup = scores[:]
      scores.clear()      # backup still has the data
  - title: Building a grid with repeated rows
    explanation: |
      `[[0] * cols] * rows` repeats one row object. Create each row in a loop.
    wrong: |
      grid = [[0] * 3] * 3
    right: |
      grid = []
      for r in range(3):
          grid.append([0] * 3)
  - title: Shallow-copying a nested list
    explanation: |
      `grid[:]` copies only the outer list; the rows are still shared. Use `copy.deepcopy(grid)` for an independent copy of a grid.
  - title: A function that mutates and returns
    explanation: |
      If a function changes its argument, callers may not realise their data changed. Either change in place and return `None`, or leave the argument alone and return a new list.
  - title: Using `is` to compare values
    explanation: |
      `is` asks whether two names refer to the same object, not whether they're equal. Use `==` for values, and keep `is` for `None`.
    wrong: |
      if answer is [1, 2]:
    right: |
      if answer == [1, 2]:

summary:
  - "Variables are names that **refer** to objects. Assignment never copies; it ties another name to the same object."
  - "Two names for one object are **aliases**: mutating through one is visible through the other. Rebinding a name affects only that name."
  - "`==` compares values; `is` checks whether two names refer to the same object (use it for `None`)."
  - "Functions receive references to the caller's objects. Choose clearly between modifying in place (return `None`) and returning a new object."
  - "`lst[:]`, `list(lst)` and `lst.copy()` make **shallow** copies; `copy.deepcopy` copies nested structures all the way down."
  - "A grid is a list of rows: `grid[r][c]`. Create each row separately to avoid shared rows."
next: |
  Lists are mutable, which is often what you want, but sometimes you want a sequence that's guaranteed **never** to change, such as a pair of coordinates or a date. In **Lesson 3.5** you'll meet **tuples**, learn to pack and unpack values, return several results from one function, and walk through two lists side by side with `zip`.

quiz:
  - type: mcq
    question: "What is printed?\n\n```python\na = [1, 2]\nb = a\nb.append(3)\nprint(a)\n```"
    options: ["[1, 2]", "[1, 2, 3]", "[3]", "An error"]
    answer: 1
    explanation: b and a are names for the same list, so appending through b changes what a shows.
  - type: mcq
    question: "What is printed?\n\n```python\na = [1, 2]\nb = a\nb = [9]\nprint(a)\n```"
    options: ["[1, 2]", "[9]", "[1, 2, 9]", "[]"]
    answer: 0
    explanation: b = [9] rebinds b to a new list. The original list, still named a, is untouched.
  - type: mcq
    question: "After `x = [1, 2]` and `y = [1, 2]`, which is true?"
    options: ["x == y and x is y", "x == y but not x is y", "x is y but not x == y", "Neither"]
    answer: 1
    explanation: They have equal contents but are two separate list objects.
  - type: mcq
    question: "What is printed?\n\n```python\ndef f(lst):\n    lst.append(0)\n\nnums = [5]\nf(nums)\nf(nums)\nprint(nums)\n```"
    options: ["[5]", "[5, 0]", "[5, 0, 0]", "[0]"]
    answer: 2
    explanation: The parameter refers to the caller's list, and append mutates it. Two calls add two zeros.
