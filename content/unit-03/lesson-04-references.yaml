    question: "`g = [[0, 0]] * 2`, then `g[0][1] = 7`. What is `g`?"
    options: ["[[0, 7], [0, 0]]", "[[0, 7], [0, 7]]", "[[7, 7], [0, 0]]", "An error"]
    answer: 1
