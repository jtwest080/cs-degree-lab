  - type: mcq
    question: "`grid = [[1, 2], [3, 4]]` and `c = grid[:]`. Which line also changes `grid`?"
    options: ["c.append([5, 6])", "c[0] = [9, 9]", "c[1][0] = 9", "c = []"]
    answer: 2
    explanation: A shallow copy has a new outer list but shares the inner rows. c[1][0] = 9 mutates a shared row. The others only change c's outer list or rebind c.
