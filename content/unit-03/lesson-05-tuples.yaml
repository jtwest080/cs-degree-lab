id: u3-tuples
title: Tuples, Unpacking and zip
minutes: 45
objective: |
  Use **tuples** for fixed groups of values, **pack and unpack** them, return several results from one function, walk through lists side by side with **`zip`**, and sort records using a **key function**.
outcomes:
  - Create tuples, including the one-item tuple, and explain how they differ from lists
  - Unpack tuples into variables, including in `for` loops
  - Return several values from a function as a tuple
  - Combine parallel lists with `zip`
  - Represent records (such as name and score) as tuples in a list
  - Sort and find the max or min by a chosen part of each item using `key=`

sections:
  - heading: Tuples are fixed sequences
    body: |
      A **tuple** is an ordered sequence, like a list, but **immutable**, like a string. It's written with round brackets:

      ```python
      point = (3, 4)
      date = (2026, 10, 25)
      rgb = (255, 128, 0)
      ```

      Indexing, slicing, `len`, `in` and `for` all work just as they do for lists: `point[0]` is 3, `date[1:]` is `(10, 25)`. What you **can't** do is change a tuple: `point[0] = 5` raises a `TypeError`, and tuples have no `append` or `remove`.

      Why have a list that can't change? Because many groups of values are naturally **fixed**. A point has exactly two coordinates; a date has exactly a year, month and day. A tuple says "these values belong together as one unit", and immutability guarantees nobody will accidentally add a fourth item to a date or change a coordinate in place. Like strings, tuples can also be dictionary keys (Lesson 3.6), which lists can't.

      > **Analogy:** A list is a shopping list: you add and cross off items as you go. A tuple is a postal address: a fixed set of parts in a fixed order, where each position means something specific (house, street, town).

      A rule of thumb: use a **list** for a collection of *similar* things whose number may vary (all the scores), and a **tuple** for a *fixed* bundle of possibly *different* things (one person's name and age).

      Two oddities to know:

      - The brackets are often optional: `point = 3, 4` also makes a tuple. It's the **comma** that makes a tuple.
      - So a tuple with one item needs a trailing comma: `(5,)`. Plain `(5)` is just the number 5 in brackets.

  - heading: Packing and unpacking
    body: |
      Back in Lesson 2.2 you swapped two variables with `a, b = b, a`. Now you can see what was happening: the right side **packs** the values into a tuple `(b, a)`, and the left side **unpacks** that tuple into the names `a` and `b`.

      Unpacking works with any sequence, as long as the number of names matches:

      ```python
      x, y = (3, 4)
      year, month, day = (2026, 10, 25)
      first, last = "Ada Lovelace".split()
      ```

      If the counts don't match, you get `ValueError: too many values to unpack` (or "not enough").

      Unpacking is especially handy in `for` loops over a list of tuples:

      ```python
      people = [("Ada", 36), ("Alan", 41)]
      for name, age in people:
          print(name, "is", age)
      ```

      This is exactly what you were doing with `for i, item in enumerate(lst):` in Lesson 3.2: `enumerate` produces `(index, item)` tuples, and the loop unpacks each one.

      A starred name collects "the rest" into a list: `first, *rest = [1, 2, 3, 4]` gives `first = 1` and `rest = [2, 3, 4]`.

  - heading: Returning several values
    body: |
      A function can only return one object, but that object can be a tuple. So returning several values is easy:

      ```python
      def min_max(nums):
          return min(nums), max(nums)     # packs a tuple

      low, high = min_max([4, 9, 2])      # unpacks it
      ```

      Python's own `divmod(17, 5)` works the same way, returning the quotient and remainder as `(3, 2)`.

      This is much better than the alternatives, such as writing two functions that each loop over the data, or printing results instead of returning them.

  - heading: zip
    body: |
      Often data arrives as **parallel lists**, where items at the same position belong together:

      ```python
      names = ["Ada", "Alan", "Grace"]
      scores = [92, 85, 97]
      ```

      `zip` pairs them up, like the teeth of a zip coming together:

      ```python
      for name, score in zip(names, scores):
          print(name, score)
      ```

      `zip` produces tuples: `("Ada", 92)`, `("Alan", 85)`, `("Grace", 97)`. Wrap it in `list(...)` to see them all at once. It works with three or more sequences too, and **stops at the shortest** one, silently dropping any leftovers.

      Compare with the index-based version, `for i in range(len(names)): print(names[i], scores[i])`. `zip` says what you mean ("go through these together") and can't get an index wrong.

  - heading: Records and sorting by key
    body: |
      A list of tuples is a simple way to store a table of **records**: each tuple is one row, each position one field.

      ```python
      results = [("Ada", 92), ("Alan", 85), ("Grace", 97)]
      ```

      Sorting this sorts tuples, which Python compares **position by position**: first by item 0, and only if those are equal, by item 1 (like alphabetical order compares letter by letter). So `sorted(results)` sorts by name. What if we want to sort by score?

      `sorted`, `sort`, `min` and `max` all accept a **`key`** argument: a function that's applied to each item to get the value to compare by.

      ```python
      def get_score(record):
          return record[1]

      sorted(results, key=get_score)                 # by score, lowest first
      sorted(results, key=get_score, reverse=True)   # highest first
      max(results, key=get_score)                    # ('Grace', 97)
      ```

      Note `key=get_score`, **without** brackets. We're not calling the function; we're handing the function itself to `sorted`, which calls it on every item. Functions are values that can be passed around, just like numbers and lists (the idea the Unit 2 project's last stretch goal hinted at).

      For short key functions, Python has a shorthand called a **lambda**: `key=lambda r: r[1]` means the same as defining `get_score`. You'll see lambdas in other people's code; either form is fine.

      Built-in functions make good keys too: `sorted(words, key=len)` sorts words by length, and `sorted(words, key=str.lower)` sorts alphabetically ignoring case.

examples:
  - title: Tuples versus lists
    intro: Same reading operations, different rules for changing.
    code: |
      point = (3, 4)
      print(point[0], point[1], len(point))
      x, y = point
      print("distance:", (x ** 2 + y ** 2) ** 0.5)
      single = (5,)
      not_tuple = (5)
      print(type(single).__name__, type(not_tuple).__name__)
      try:
          point[0] = 10
      except TypeError as err:
          print("TypeError:", err)
    output: |
      3 4 2
      distance: 5.0
      tuple int
      TypeError: 'tuple' object does not support item assignment
    lines:
      - line: 1-2
        note: "Indexing and `len` work exactly as for lists."
      - line: 3
        note: "Unpacking: `x` gets 3 and `y` gets 4."
      - line: 5-7
        note: "The comma makes the tuple. `(5)` is just 5 in brackets. (`type(...).__name__` gives the type's name as a string.)"
      - line: 8-11
        note: "Tuples are immutable, so assigning to an index fails. `except TypeError as err` gives us the error object, so we can print its message (Lesson 2.9)."
  - title: Returning and unpacking several values
    intro: One function, several results.
    code: |
      def stats(nums):
          total = sum(nums)
          mean = total / len(nums)
          return total, mean, min(nums), max(nums)

      result = stats([4, 8, 15, 16, 23, 42])
      print(result)
      total, mean, low, high = result
      print(f"total={total} mean={mean} range={low}..{high}")
      q, r = divmod(17, 5)
      print(q, r)
    output: |
      (108, 18.0, 4, 42)
      total=108 mean=18.0 range=4..42
      3 2
    lines:
      - line: 4
        note: "Four values separated by commas are packed into one tuple and returned."
      - line: 7
        note: "Printed whole, the result is a tuple."
      - line: 8
        note: "Unpacked into four names. The number of names must match the number of values."
      - line: 10
        note: "Built-in `divmod` returns the quotient and remainder as a pair."
  - title: zip and records
    intro: Combine parallel lists, then sort the records by score.
    code: |
      names = ["Ada", "Alan", "Grace", "Tim"]
      scores = [92, 85, 97, 85]
      results = list(zip(names, scores))
      print(results)

      def get_score(record):
          return record[1]

      print(max(results, key=get_score))
      for place, (name, score) in enumerate(sorted(results, key=get_score, reverse=True), start=1):
          print(place, name, score)
    output: |
      [('Ada', 92), ('Alan', 85), ('Grace', 97), ('Tim', 85)]
      ('Grace', 97)
      1 Grace 97
      2 Ada 92
      3 Alan 85
      4 Tim 85
    lines:
      - line: 3
        note: "`zip` pairs items at the same position; `list` collects all the pairs."
      - line: 6-7
        note: "A key function picks the part of each record to compare."
      - line: 9
        note: "`max` with a key returns the whole record whose score is largest."
      - line: 10-11
        note: "`enumerate` gives `(place, record)`, and the record is itself a tuple, so we unpack it with a nested `(name, score)`. Alan and Tim tie on 85; Python's sort is **stable**, so tied items keep their original order."
  - title: Keys from built-in functions
    intro: Any function that takes one item can be a key.
    code: |
      words = ["banana", "Kiwi", "apple", "fig", "Cherry"]
      print(sorted(words))
      print(sorted(words, key=str.lower))
      print(sorted(words, key=len))
      print(max(words, key=len))
    output: |
      ['Cherry', 'Kiwi', 'apple', 'banana', 'fig']
      ['apple', 'banana', 'Cherry', 'fig', 'Kiwi']
      ['fig', 'Kiwi', 'apple', 'banana', 'Cherry']
      banana
    lines:
      - line: 2
        note: "Plain sorting uses character codes, so capital letters come first (Lesson 1.2)."
      - line: 3
        note: "`str.lower` is the lower method itself, used as a function: compare lowercase versions, but keep the original words."
      - line: 4
        note: "Sort by length. banana and Cherry are both 6 letters long, so they keep their original order (sorting is stable)."
      - line: 5
        note: "The longest word. When there's a tie, `max` returns the first one it saw."

playground:
  prompt: |
    Make two parallel lists (say, countries and capitals) and print them in pairs with `zip`. Then make a list of `(name, age)` tuples and sort it by age, then by name. What happens if the lists given to `zip` have different lengths?
  code: |
    countries = ["France", "Japan", "Kenya"]
    capitals = ["Paris", "Tokyo", "Nairobi"]
    for country, capital in zip(countries, capitals):
        print(f"The capital of {country} is {capital}")

exercises:
  - id: min-max
    title: Smallest and largest
    difficulty: 1
    prompt: |
      Write `min_max(nums)` that returns a tuple `(smallest, largest)` for a non-empty list of numbers. Then, below the function, unpack the result for `[7, 2, 9, 4]` into two variables `low` and `high` and print them like this:

      ```text
      low=2 high=9
      ```
    starter: |
      def min_max(nums):
          pass
    tests:
      - name: returns a tuple of two values
        code: |
          r = min_max([7, 2, 9, 4])
          assert isinstance(r, tuple), f"Return a tuple, got {r!r}"
          assert r == (2, 9), f"Got {r}"
          assert min_max([5]) == (5, 5)
          assert min_max([-1, -8]) == (-8, -1)
      - name: unpacks and prints
        code: |
          assert low == 2 and high == 9, "Unpack min_max([7, 2, 9, 4]) into low and high."
          assert "low=2 high=9" in output, f"You printed:\n{output}"
    hints:
      - "`return min(nums), max(nums)` returns a tuple."
      - "`low, high = min_max([7, 2, 9, 4])`, then an f-string."
    solution: |
      def min_max(nums):
          """Return (smallest, largest) of a non-empty list."""
          return min(nums), max(nums)


      low, high = min_max([7, 2, 9, 4])
      print(f"low={low} high={high}")
    explanation: |
      The comma in the `return` packs a tuple; the comma in the assignment unpacks it. Returning a tuple keeps related results together and avoids calling two separate functions.

  - id: add-minutes
    title: Clock arithmetic
    difficulty: 2
    prompt: |
      Times of day can be stored as `(hours, minutes)` tuples on a 24-hour clock.

      1. Write `parse_time(text)` that turns `"13:45"` into the tuple `(13, 45)` of ints.
      2. Write `add_minutes(time, mins)` that returns a **new** time tuple `mins` minutes later, wrapping past midnight. `mins` may be large or negative.
      3. Write `format_time(time)` that returns a string like `"09:05"` (always two digits each).

      ```python
      add_minutes((23, 30), 45)    # (0, 15)
      format_time((9, 5))          # '09:05'
      ```
    starter: |
      def parse_time(text):
          pass


      def add_minutes(time, mins):
          pass


      def format_time(time):
          pass
    tests:
      - name: parse_time
        code: |
          assert parse_time("13:45") == (13, 45), f"Got {parse_time('13:45')!r}"
          assert parse_time("00:07") == (0, 7), f"Got {parse_time('00:07')!r}"
      - name: add_minutes within a day
        code: |
          assert add_minutes((10, 0), 30) == (10, 30), f"Got {add_minutes((10, 0), 30)}"
          assert add_minutes((10, 50), 15) == (11, 5), f"Got {add_minutes((10, 50), 15)}"
      - name: add_minutes wraps past midnight, both ways
        code: |
          assert add_minutes((23, 30), 45) == (0, 15), f"Got {add_minutes((23, 30), 45)}"
          assert add_minutes((0, 10), -20) == (23, 50), f"Got {add_minutes((0, 10), -20)}"
          assert add_minutes((12, 0), 24 * 60 * 3) == (12, 0), "Three whole days later is the same time."
      - name: format_time
        code: |
          assert format_time((9, 5)) == "09:05", f"Got {format_time((9, 5))!r}"
          assert format_time((23, 59)) == "23:59"
          assert format_time(add_minutes(parse_time("23:59"), 2)) == "00:01"
    hints:
      - "`parse_time`: `h, m = text.split(\":\")`, then return `(int(h), int(m))`."
      - "`add_minutes`: convert to minutes since midnight (`h * 60 + m`), add, then wrap with `% (24 * 60)`. Convert back with `divmod(total, 60)`."
      - "`format_time`: unpack, then `f\"{h:02d}:{m:02d}\"` (Lesson 2.4)."
    solution: |
      def parse_time(text):
          """Turn 'HH:MM' into an (hours, minutes) tuple."""
          h, m = text.split(":")
          return (int(h), int(m))


      def add_minutes(time, mins):
          """Return the time mins minutes after time, on a 24-hour clock."""
          h, m = time
          total = (h * 60 + m + mins) % (24 * 60)
          return divmod(total, 60)


      def format_time(time):
          """Format an (hours, minutes) tuple as 'HH:MM'."""
          h, m = time
          return f"{h:02d}:{m:02d}"
    explanation: |
      Converting to a single number (minutes since midnight) turns a fiddly carrying problem into one addition and one `%`. That's a powerful general trick: pick the representation that makes the arithmetic easy, then convert back. Because tuples are immutable, `add_minutes` can't change the time it's given; returning a new tuple is the only option, which is exactly what you want for a value like a time.

  - id: closest-point
    title: Closest point
    difficulty: 2
    prompt: |
      Points are `(x, y)` tuples. Write:

      - `distance(p, q)`: the straight-line distance between two points, √((x₁ − x₂)² + (y₁ − y₂)²). Use `** 0.5` for the square root.
      - `closest(points, target)`: the point in the list closest to `target`. If several are equally close, return the first. Use `min` with a `key` function.

      ```python
      distance((0, 0), (3, 4))                      # 5.0
      closest([(5, 5), (1, 2), (-1, -1)], (0, 0))   # (-1, -1)
      ```
    starter: |
      def distance(p, q):
          pass


      def closest(points, target):
          pass
    tests:
      - name: distance
        code: |
          assert abs(distance((0, 0), (3, 4)) - 5) < 1e-9, f"Got {distance((0, 0), (3, 4))}"
          assert abs(distance((1, 1), (1, 1))) < 1e-9
          assert abs(distance((-2, 3), (1, -1)) - 5) < 1e-9
      - name: closest
        code: |
          assert closest([(5, 5), (1, 2), (-1, -1)], (0, 0)) == (-1, -1), f"Got {closest([(5, 5), (1, 2), (-1, -1)], (0, 0))}"
          assert closest([(10, 10), (9, 9)], (10, 11)) == (10, 10)
          assert closest([(1, 0), (0, 1)], (0, 0)) == (1, 0), "With a tie, return the first."
      - name: uses min with a key
        code: |
          assert "min(" in source and "key=" in source, "Use min(points, key=...)."
    hints:
      - "Unpack both points: `x1, y1 = p` and `x2, y2 = q`."
      - "The key function must take **one** point and return its distance to `target`. Define it inside `closest`, so it can use `target`."
      - "`def dist_to_target(p): return distance(p, target)`, then `return min(points, key=dist_to_target)`."
    solution: |
      def distance(p, q):
          """Straight-line distance between points p and q."""
          x1, y1 = p
          x2, y2 = q
          return ((x1 - x2) ** 2 + (y1 - y2) ** 2) ** 0.5


      def closest(points, target):
          """Return the point in points nearest to target."""
          def dist_to_target(p):
              return distance(p, target)
          return min(points, key=dist_to_target)
    explanation: |
      The key function needs `target`, but `min` will only ever give it one argument (the point). Defining the key function *inside* `closest` solves this: the inner function can see `closest`'s local variables. (A lambda does the same: `key=lambda p: distance(p, target)`.) `min` with a key returns the whole item, not the distance, which is exactly what we want. Finding the nearest point is the heart of map apps, and of the "nearest neighbour" algorithm in machine learning (Unit 17).

  - id: leaderboard
    title: Leaderboard
    difficulty: 3
    prompt: |
      Write `leaderboard(names, scores)` that takes two parallel lists and returns a list of strings like `"1. Grace (97)"`, ordered from highest score to lowest. **Equal scores share a place**, and are listed alphabetically by name; the next place after a tie skips ahead, as in sports:

      ```python
      leaderboard(["Tim", "Ada", "Grace", "Alan"], [85, 92, 97, 85])
      # ['1. Grace (97)', '2. Ada (92)', '3. Alan (85)', '3. Tim (85)']

      leaderboard(["A", "B", "C"], [5, 5, 1])
      # ['1. A (5)', '1. B (5)', '3. C (1)']
      ```
    starter: |
      def leaderboard(names, scores):
          records = list(zip(names, scores))
          lines = []
          return lines
    tests:
      - name: example with a tie at the bottom
        code: |
          got = leaderboard(["Tim", "Ada", "Grace", "Alan"], [85, 92, 97, 85])
          assert got == ["1. Grace (97)", "2. Ada (92)", "3. Alan (85)", "3. Tim (85)"], f"Got {got}"
      - name: tie at the top skips a place
        code: |
          got = leaderboard(["A", "B", "C"], [5, 5, 1])
          assert got == ["1. A (5)", "1. B (5)", "3. C (1)"], f"Got {got}"
      - name: ties are listed alphabetically
        code: |
          got = leaderboard(["Zed", "Amy", "Max"], [10, 10, 10])
          assert got == ["1. Amy (10)", "1. Max (10)", "1. Zed (10)"], f"Got {got}"
      - name: empty and single
        code: |
          assert leaderboard([], []) == []
          assert leaderboard(["Solo"], [3]) == ["1. Solo (3)"]
    hints:
      - "Sort the records so higher scores come first and ties are alphabetical. A key can return a **tuple**: `(-score, name)`. Negating the score makes larger scores sort first while names still sort A to Z."
      - "Walk through the sorted records with `enumerate(sorted_records, start=1)`. A record's place is its position, unless its score equals the previous record's score, in which case it keeps the previous place."
      - "Keep `place` and `prev_score` variables. If `score != prev_score`, set `place = position`."
    solution: |
      def leaderboard(names, scores):
          """Return ranked lines like '1. Grace (97)'; ties share a place."""
          records = list(zip(names, scores))

          def rank_key(record):
              name, score = record
              return (-score, name)

          lines = []
          place = 0
          prev_score = None
          for position, (name, score) in enumerate(sorted(records, key=rank_key), start=1):
              if score != prev_score:
                  place = position
              lines.append(f"{place}. {name} ({score})")
              prev_score = score
          return lines
    explanation: |
      Two ideas make this neat. First, a key function can return a **tuple**, and tuples compare position by position, so `(-score, name)` means "by score, highest first, then by name". Negating is a common trick for mixing descending and ascending order in one sort. Second, ranking with ties is a **state** problem like run-length encoding in Lesson 3.3: remember the previous score, and only move the place on when the score changes. Using `position` (rather than `place + 1`) gives the "skip ahead" behaviour after a tie.

commonMistakes:
  - title: Forgetting the comma in a one-item tuple
    explanation: |
      Brackets alone don't make a tuple; the comma does.
    wrong: |
      single = (5)      # just the int 5
    right: |
      single = (5,)
  - title: Unpacking the wrong number of values
    explanation: |
      The number of names on the left must match the number of items. `a, b = [1, 2, 3]` raises `ValueError: too many values to unpack`.
  - title: Calling the key function instead of passing it
    explanation: |
      `key=` needs the function itself. Adding brackets calls it once, immediately, and passes its result instead.
    wrong: |
      sorted(records, key=get_score())
    right: |
      sorted(records, key=get_score)
  - title: Expecting zip to complain about different lengths
    explanation: |
      `zip` stops at the shortest input and silently ignores the rest. If the lengths should match, check `len(a) == len(b)` yourself.

summary:
  - "A **tuple** is an immutable sequence, `(3, 4)`. Use tuples for fixed bundles of values and lists for collections that grow and shrink."
  - "The comma makes a tuple: `(5,)` has one item; `(5)` is just 5."
  - "**Unpacking** assigns a sequence's items to names: `x, y = point`, and works in `for` loops: `for name, age in people:`."
  - "Return several values by returning a tuple, and unpack it at the call site."
  - "`zip(a, b)` pairs up items at the same position and stops at the shortest input."
  - "`sorted`, `sort`, `min` and `max` take `key=function` to compare by a chosen part of each item; a key returning a tuple sorts by several things at once."
next: |
  A list of `(name, score)` tuples works, but finding one person's score means searching the whole list. In **Lesson 3.6** you'll meet the **dictionary**, Python's built-in lookup table, which jumps straight to a value from its key, and which is arguably the most useful data structure in everyday programming.

quiz:
  - type: mcq
    question: Which of these is a tuple containing one item?
    options: ["(7)", "[7]", "(7,)", "tuple 7"]
    answer: 2
    explanation: The trailing comma makes it a tuple. (7) is just the number 7.
  - type: mcq
    question: "What happens when you run `t = (1, 2, 3)` then `t.append(4)`?"
    options: ["t becomes (1, 2, 3, 4)", "An AttributeError: tuples have no append", "t becomes [1, 2, 3, 4]", "Nothing"]
    answer: 1
    explanation: Tuples are immutable and have no methods that change them.
  - type: mcq
    question: "What is printed?\n\n```python\ndef f():\n    return 1, 2\n\na, b = f()\nprint(b, a)\n```"
    options: ["1 2", "2 1", "(1, 2)", "An error"]
    answer: 1
    explanation: f returns the tuple (1, 2), which is unpacked so a is 1 and b is 2.
  - type: mcq
    question: "What is `list(zip([1, 2, 3], \"ab\"))`?"
    options: ["[(1, 'a'), (2, 'b')]", "[(1, 'a'), (2, 'b'), (3, None)]", "[1, 'a', 2, 'b']", "An error"]
    answer: 0
    explanation: zip stops at the shortest input, so the 3 is dropped.
  - type: mcq
    question: "Which sorts `pets = [(\"Rex\", 5), (\"Tom\", 2)]` by age?"
    options: ["sorted(pets)", "sorted(pets, key=1)", "sorted(pets, key=lambda p: p[1])", "pets.sort(age)"]
    answer: 2
    explanation: The key function returns the age (index 1) of each tuple. Plain sorted would sort by name.
  - type: mcq
    question: When is a tuple a better choice than a list?
    options:
      - For the scores of everyone in a class, which grows as students join
      - For a single (latitude, longitude) position
      - For a to-do list
      - For collecting user input in a loop
    answer: 1
    explanation: A position is a fixed bundle of two values that shouldn't change. The others are collections whose size varies.
  - type: code
    question: |
      Write `unzip(pairs)` that does the reverse of `zip`: given a list of 2-item tuples, return a tuple of two lists. `unzip([(1, "a"), (2, "b")])` returns `([1, 2], ["a", "b"])`.
    starter: |
      def unzip(pairs):
          pass
    tests:
      - name: splits pairs into two lists
        code: |
          assert unzip([(1, "a"), (2, "b")]) == ([1, 2], ["a", "b"]), f"Got {unzip([(1, 'a'), (2, 'b')])}"
          assert unzip([]) == ([], []), f"Got {unzip([])}"
          assert unzip([("x", 9)]) == (["x"], [9])
    solution: |
      def unzip(pairs):
          firsts = []
          seconds = []
          for a, b in pairs:
              firsts.append(a)
              seconds.append(b)
          return firsts, seconds
