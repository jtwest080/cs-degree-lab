id: u3-dicts
title: Dictionaries
minutes: 55
objective: |
  Store and look up data by **key** with **dictionaries**: create them, add, change and remove entries, avoid `KeyError` with `in` and `get`, loop over keys, values and items, and use the **counting** and **grouping** patterns that make dictionaries so useful.
outcomes:
  - Create dictionaries and read values with `d[key]`
  - Add, update and delete entries, and explain why a missing key raises `KeyError`
  - Check for keys with `in`, and use `get` with a default
  - Loop over a dictionary's keys, values and `items()`
  - Count things and group things with a dictionary
  - Explain, at a high level, why dictionary lookup is fast and why keys must be immutable

sections:
  - heading: Looking things up
    body: |
      Suppose you store everyone's phone numbers as a list of tuples: `[("Ada", "555-0101"), ("Alan", "555-0199"), ...]`. To find Alan's number you'd have to search the list from the start (Lesson 3.2's linear search). With a million entries, that's up to a million comparisons for every lookup.

      What you really want is to go **straight** from a name to its number. That's what a **dictionary** (type `dict`) does:

      ```python
      phone = {"Ada": "555-0101", "Alan": "555-0199", "Grace": "555-0142"}
      phone["Alan"]      # '555-0199'
      ```

      A dictionary is a collection of **key: value** pairs. Each **key** maps to one **value**. You look a value up by its key, in square brackets, just as you look up a list item by its index. The difference is that a list's "keys" are always 0, 1, 2, ..., while a dictionary's keys can be strings, numbers, tuples, or any other immutable value.

      > **Analogy:** A real dictionary maps words to definitions; you don't read it from page one, you jump to the word. A coat check is another: you hand over a ticket (key) and get back exactly your coat (value).

      Keys are **unique**: one key can't map to two values. Values can be anything, and can repeat.

  - heading: Adding, changing and removing
    body: |
      Dictionaries are mutable. Assigning to a key **adds** it if it's new, or **replaces** its value if it already exists:

      ```python
      ages = {}                # an empty dictionary
      ages["Ada"] = 36         # add
      ages["Alan"] = 41        # add
      ages["Ada"] = 37         # update: there's still only one "Ada"
      print(ages)              # {'Ada': 37, 'Alan': 41}
      len(ages)                # 2
      ```

      To remove an entry, use `del ages["Alan"]`, or `ages.pop("Alan")`, which also returns the removed value.

      Dictionaries remember the order in which keys were first added, so printing or looping shows entries in that order. (Updating a value doesn't move its key.)

  - heading: Missing keys
    body: |
      Reading a key that isn't there raises a **`KeyError`** (the other error promised in Lesson 2.9):

      ```python
      ages["Bob"]
      ```

      ```text
      KeyError: 'Bob'
      ```

      There are two ways to avoid it:

      1. **Check first** with `in`, which looks at the **keys**:

         ```python
         if "Bob" in ages:
             print(ages["Bob"])
         ```

      2. Use **`get`**, which returns a default instead of crashing:

         ```python
         ages.get("Bob")         # None
         ages.get("Bob", 0)      # 0
         ```

      Note that `in` checks keys, not values: `37 in ages` is False even though 37 is one of the values. To search the values, use `37 in ages.values()`.

  - heading: Looping over a dictionary
    body: |
      A `for` loop over a dictionary gives you its **keys**:

      ```python
      for name in ages:
          print(name, ages[name])
      ```

      Three methods give you other views of the dictionary:

      | Method | Gives | Typical loop |
      |---|---|---|
      | `d.keys()` | the keys | `for k in d.keys():` (same as `for k in d:`) |
      | `d.values()` | the values | `total = sum(d.values())` |
      | `d.items()` | `(key, value)` tuples | `for k, v in d.items():` |

      `items()` with tuple unpacking (Lesson 3.5) is the most common way to loop over both at once.

      > **Warning:** Don't add or remove keys while looping over a dictionary; Python raises `RuntimeError: dictionary changed size during iteration`. Loop over a copy, `for k in list(d):`, if you need to delete as you go. (Changing the *values* of existing keys is fine.)

  - heading: Counting and grouping
    body: |
      Two patterns account for a huge share of real dictionary use.

      **Counting**: how many times does each thing appear? Use the things as keys and their counts as values:

      ```python
      counts = {}
      for word in words:
          if word in counts:
              counts[word] += 1
          else:
              counts[word] = 1
      ```

      Or more compactly with `get`: `counts[word] = counts.get(word, 0) + 1`. Either way, each word is looked up directly, rather than searched for.

      **Grouping**: collect items into lists by some property. The keys are the property and the values are lists:

      ```python
      by_letter = {}
      for name in names:
          first = name[0]
          if first not in by_letter:
              by_letter[first] = []
          by_letter[first].append(name)
      ```

      Notice `by_letter[first].append(name)`: `by_letter[first]` is a list, and we mutate it in place (Lesson 3.4).

      Dictionaries can also hold **records**: one dictionary per thing, with field names as keys, such as `{"name": "Ada", "born": 1815, "field": "maths"}`. A list of such dictionaries is a table where each column has a name, which is much clearer than remembering that a score is "item 1 of the tuple". This is exactly the shape of the JSON data that websites exchange (Unit 13).

  - heading: Why dictionaries are fast
    body: |
      How can a dictionary find a key without searching? The trick is called **hashing**. When you store a key, Python computes a number from it, its **hash**, using a function that always gives the same number for the same value. The hash decides which slot in a hidden internal table the entry goes into. To look a key up later, Python hashes it again and goes straight to that slot. The time taken hardly depends on how many entries there are: looking up one name among a million is about as fast as among ten.

      This is why keys must be **immutable**: strings, numbers and tuples are fine; lists are not. If you could change a key after storing it, its hash would change, and Python would look in the wrong slot. Trying to use a list as a key raises `TypeError: unhashable type: 'list'`.

      You'll build a hash table yourself in Unit 7 and learn how collisions (two keys landing in the same slot) are handled. For now, the rule of thumb: **if you find yourself searching a list for a match, a dictionary is probably the right tool.**

examples:
  - title: Creating, reading and updating
    intro: A small inventory of stock levels.
    code: |
      stock = {"apples": 12, "pears": 5}
      print(stock["apples"])
      stock["kiwis"] = 20
      stock["pears"] = stock["pears"] - 2
      print(stock)
      print(len(stock), "products")
      del stock["apples"]
      print("apples" in stock, "kiwis" in stock)
      print(stock.get("plums", 0))
    output: |
      12
      {'apples': 12, 'pears': 3, 'kiwis': 20}
      3 products
      False True
      0
    lines:
      - line: 1
        note: "Curly braces, with `key: value` pairs separated by commas."
      - line: 3
        note: "Assigning to a new key adds an entry."
      - line: 4
        note: "Assigning to an existing key replaces its value. `pears` stays in its original position."
      - line: 7-8
        note: "`del` removes an entry; `in` checks whether a key exists."
      - line: 9
        note: "`get` returns the default (0) for a missing key, instead of raising KeyError."
  - title: Looping three ways
    intro: Keys, values and items.
    code: |
      scores = {"Ada": 92, "Alan": 85, "Grace": 97}
      for name in scores:
          print(name, end=" ")
      print()
      print("Total:", sum(scores.values()))
      for name, score in scores.items():
          print(f"{name:<6}{score:>4}")
      best = max(scores, key=scores.get)
      print("Best:", best)
    output: |
      Ada Alan Grace
      Total: 274
      Ada     92
      Alan    85
      Grace   97
      Best: Grace
    lines:
      - line: 2-3
        note: "Looping over a dictionary gives its keys, in insertion order."
      - line: 5
        note: "`values()` gives just the values, which `sum` can add up."
      - line: 6-7
        note: "`items()` gives `(key, value)` pairs, unpacked into two names. `:<6` and `:>4` align the columns (Lesson 2.4)."
      - line: 8
        note: "`max` over the keys, using `scores.get` as the key function (Lesson 3.5): the key whose value is largest."
  - title: Counting letters
    intro: The counting pattern, with get.
    code: |
      text = "mississippi"
      counts = {}
      for ch in text:
          counts[ch] = counts.get(ch, 0) + 1
      print(counts)
      for ch, n in sorted(counts.items()):
          print(ch, "*" * n)
    output: |
      {'m': 1, 'i': 4, 's': 4, 'p': 2}
      i ****
      m *
      p **
      s ****
    lines:
      - line: 4
        note: "If `ch` is new, `get` returns 0, so the count becomes 1. Otherwise it adds 1 to the existing count."
      - line: 5
        note: "Keys appear in the order they were first seen."
      - line: 6-7
        note: "`sorted(counts.items())` sorts the `(letter, count)` pairs, by letter, and we draw a little bar chart."
  - title: Grouping and records
    intro: Group people by city; each person is a dictionary.
    code: |
      people = [
          {"name": "Ada", "city": "London"},
          {"name": "Alan", "city": "Manchester"},
          {"name": "Tim", "city": "London"},
      ]
      by_city = {}
      for person in people:
          city = person["city"]
          if city not in by_city:
              by_city[city] = []
          by_city[city].append(person["name"])
      print(by_city)
      for city, names in by_city.items():
          print(f"{city}: {', '.join(names)}")
    output: |
      {'London': ['Ada', 'Tim'], 'Manchester': ['Alan']}
      London: Ada, Tim
      Manchester: Alan
    lines:
      - line: 1-5
        note: "A list of records. Each record is a dictionary with named fields, so `person[\"city\"]` reads clearly."
      - line: 9-10
        note: "The first time we see a city, give it an empty list."
      - line: 11
        note: "Then append to that city's list. `by_city[city]` *is* the list, so append changes it in place."

playground:
  prompt: |
    Build a dictionary translating a few English words into another language. Write a loop that translates a sentence word by word, using `get` to leave unknown words unchanged. What happens if you use a list as a key?
  code: |
    to_french = {"hello": "bonjour", "cat": "chat", "the": "le"}
    sentence = "hello the cat sat"
    out = []
    for word in sentence.split():
        out.append(to_french.get(word, word))
    print(" ".join(out))

exercises:
  - id: phone-book
    title: Phone book
    difficulty: 1
    prompt: |
      The starter has a dictionary `book`. Write:

      - `lookup(book, name)`: returns the number for `name`, or `"Unknown"` if the name isn't in the book (use `get`).
      - `add_contact(book, name, number)`: adds or updates the entry **in place** and returns `None`.
    starter: |
      book = {"Ada": "555-0101", "Alan": "555-0199"}


      def lookup(book, name):
          pass


      def add_contact(book, name, number):
          pass
    tests:
      - name: lookup finds existing names
        code: |
          assert lookup(book, "Ada") == "555-0101", f"Got {lookup(book, 'Ada')!r}"
      - name: lookup handles missing names
        code: |
          assert lookup(book, "Bob") == "Unknown", f"Got {lookup(book, 'Bob')!r}"
          assert ".get(" in source, "Use the dictionary's get method in lookup."
      - name: add_contact adds and updates in place
        code: |
          b = {"Ada": "1"}
          assert add_contact(b, "Grace", "2") is None
          add_contact(b, "Ada", "3")
          assert b == {"Ada": "3", "Grace": "2"}, f"The book became {b}"
    hints:
      - "`book.get(name, \"Unknown\")` returns the number, or \"Unknown\" for a missing name."
      - "`book[name] = number` adds a new entry or replaces an existing one. No return needed."
    solution: |
      book = {"Ada": "555-0101", "Alan": "555-0199"}


      def lookup(book, name):
          """Return name's number, or 'Unknown'."""
          return book.get(name, "Unknown")


      def add_contact(book, name, number):
          """Add or update name's number in place."""
          book[name] = number
    explanation: |
      `get` with a default turns "might crash" into "always gives an answer". Assigning to a key doesn't care whether the key exists: it adds or replaces. And because dictionaries are mutable and passed by reference (Lesson 3.4), `add_contact` changes the caller's book.

  - id: word-counts
    title: Word counts
    difficulty: 2
    prompt: |
      Write `word_counts(text)` that returns a dictionary mapping each word to how many times it appears. Words should be compared **ignoring case**, and the punctuation characters `.,!?;:` stuck to the ends of words should be removed.

      ```python
      word_counts("The cat saw the other cat. THE END!")
      # {'the': 3, 'cat': 2, 'saw': 1, 'other': 1, 'end': 1}
      ```

      Words that are nothing but punctuation (like `"--"` would be if we stripped dashes) shouldn't appear, but you only need to strip the six characters listed.
    starter: |
      def word_counts(text):
          counts = {}
          return counts
    tests:
      - name: example from the question
        code: |
          got = word_counts("The cat saw the other cat. THE END!")
          assert got == {"the": 3, "cat": 2, "saw": 1, "other": 1, "end": 1}, f"Got {got}"
      - name: punctuation and spacing
        code: |
          got = word_counts("Hello, hello!   Hello?\nhi;")
          assert got == {"hello": 3, "hi": 1}, f"Got {got}"
      - name: empty text and lone punctuation
        code: |
          assert word_counts("") == {}, f"Got {word_counts('')}"
          assert word_counts("wow ! wow") == {"wow": 2}, f"A lone '!' isn't a word. Got {word_counts('wow ! wow')}"
    hints:
      - "Split the text with `split()`, then clean each word: `word.strip(\".,!?;:\").lower()`."
      - "After cleaning, skip the word if it's empty (`if word == \"\": continue`)."
      - "Count with `counts[word] = counts.get(word, 0) + 1`."
    solution: |
      def word_counts(text):
          """Count words in text, ignoring case and end punctuation."""
          counts = {}
          for raw in text.split():
              word = raw.strip(".,!?;:").lower()
              if word == "":
                  continue
              counts[word] = counts.get(word, 0) + 1
          return counts
    explanation: |
      This is the counting pattern plus **normalisation**: before counting, every word is put into one standard form, so "The", "the" and "THE" count as the same key. Skipping empty strings handles punctuation that stood alone. Word counting is the first step in search engines, spam filters and much of natural language processing (Unit 17).

  - id: most-common
    title: Most common
    difficulty: 2
    prompt: |
      Write `most_common(counts, n)` that takes a dictionary of counts (like the one from the previous exercise) and returns a list of the `n` most common `(word, count)` tuples, highest count first. Words with equal counts are ordered **alphabetically**.

      ```python
      most_common({"the": 3, "cat": 2, "saw": 1, "end": 1}, 3)
      # [('the', 3), ('cat', 2), ('end', 1)]
      ```

      If `n` is bigger than the number of words, return them all.
    starter: |
      def most_common(counts, n):
          pass
    tests:
      - name: example from the question
        code: |
          got = most_common({"the": 3, "cat": 2, "saw": 1, "end": 1}, 3)
          assert got == [("the", 3), ("cat", 2), ("end", 1)], f"Got {got}"
      - name: ties are alphabetical
        code: |
          got = most_common({"b": 2, "c": 2, "a": 2, "z": 5}, 4)
          assert got == [("z", 5), ("a", 2), ("b", 2), ("c", 2)], f"Got {got}"
      - name: n larger than the dictionary, and n = 0
        code: |
          assert most_common({"x": 1}, 10) == [("x", 1)]
          assert most_common({"x": 1}, 0) == []
          assert most_common({}, 3) == []
    hints:
      - "`counts.items()` gives `(word, count)` tuples."
      - "Sort them with a key that returns `(-count, word)`, as in the leaderboard exercise of Lesson 3.5."
      - "A slice `[:n]` takes the first n, and never complains if n is too big."
    solution: |
      def most_common(counts, n):
          """Return the n most common (word, count) pairs, ties alphabetical."""
          def order(pair):
              word, count = pair
              return (-count, word)
          return sorted(counts.items(), key=order)[:n]
    explanation: |
      Dictionaries are for lookup; when you need an **order**, convert to a list of items and sort. The tuple key `(-count, word)` sorts by count descending, then word ascending, and the forgiving slice handles any `n`. (Python's standard library has `collections.Counter`, which does counting and `most_common` for you. It's worth knowing exists, but now you know how it works inside.)

  - id: group-by-length
    title: Group by length
    difficulty: 2
    prompt: |
      Write `group_by_length(words)` that returns a dictionary mapping each word length to a list of the words with that length, in the order they appeared. Repeated words should only appear once in their list.

      ```python
      group_by_length(["hi", "cat", "a", "dog", "to", "cat"])
      # {2: ['hi', 'to'], 3: ['cat', 'dog'], 1: ['a']}
      ```
    starter: |
      def group_by_length(words):
          groups = {}
          return groups
    tests:
      - name: example from the question
        code: |
          got = group_by_length(["hi", "cat", "a", "dog", "to", "cat"])
          assert got == {2: ["hi", "to"], 3: ["cat", "dog"], 1: ["a"]}, f"Got {got}"
      - name: keys appear in order of first appearance
        code: |
          got = group_by_length(["hi", "cat", "a", "dog", "to", "cat"])
          assert list(got) == [2, 3, 1], f"Keys came out in the order {list(got)}"
      - name: empty list
        code: |
          assert group_by_length([]) == {}
    hints:
      - "Use the grouping pattern: the key is `len(word)`."
      - "If the length isn't a key yet, set `groups[length] = []`."
      - "Only append if `word not in groups[length]`."
    solution: |
      def group_by_length(words):
          """Map each word length to the distinct words of that length, in order."""
          groups = {}
          for word in words:
              length = len(word)
              if length not in groups:
                  groups[length] = []
              if word not in groups[length]:
                  groups[length].append(word)
          return groups
    explanation: |
      Grouping is "counting, but keep the items instead of a number". The key is computed from each item (here its length, but it could be the first letter, a city, a year). Because dictionaries keep insertion order, the groups come out in the order each length was first seen.

  - id: invert
    title: Invert a dictionary
    difficulty: 3
    prompt: |
      Write `invert(d)` that swaps keys and values. Because several keys can share a value, each value in the result maps to a **sorted list** of the original keys.

      ```python
      invert({"Ada": "maths", "Alan": "maths", "Grace": "navy"})
      # {'maths': ['Ada', 'Alan'], 'navy': ['Grace']}
      ```

      Then write `favourite_counts(favourites)` that uses `invert` to return a dictionary mapping each value to **how many** keys had it:

      ```python
      favourite_counts({"Ada": "red", "Bo": "blue", "Cy": "red"})
      # {'red': 2, 'blue': 1}
      ```
    starter: |
      def invert(d):
          pass


      def favourite_counts(favourites):
          pass
    tests:
      - name: invert groups keys by value
        code: |
          got = invert({"Ada": "maths", "Alan": "maths", "Grace": "navy"})
          assert got == {"maths": ["Ada", "Alan"], "navy": ["Grace"]}, f"Got {got}"
      - name: lists are sorted
        code: |
          got = invert({"z": 1, "a": 1, "m": 1})
          assert got == {1: ["a", "m", "z"]}, f"Got {got}"
      - name: original unchanged and empty input
        code: |
          d = {"x": 1, "y": 2}
          invert(d)
          assert d == {"x": 1, "y": 2}, "Don't change the dictionary you were given."
          assert invert({}) == {}
      - name: favourite_counts
        code: |
          got = favourite_counts({"Ada": "red", "Bo": "blue", "Cy": "red"})
          assert got == {"red": 2, "blue": 1}, f"Got {got}"
          assert favourite_counts({}) == {}
    hints:
      - "Loop over `d.items()`. For each `(key, value)`, group the key under the value."
      - "After grouping, sort each list. You can loop over the result's values and call `.sort()` on each list (they're mutable)."
      - "`favourite_counts`: invert, then build a new dictionary mapping each value to `len` of its list."
    solution: |
      def invert(d):
          """Map each value of d to a sorted list of the keys that had it."""
          result = {}
          for key, value in d.items():
              if value not in result:
                  result[value] = []
              result[value].append(key)
          for keys in result.values():
              keys.sort()
          return result


      def favourite_counts(favourites):
          """Map each favourite to how many people chose it."""
          counts = {}
          for value, keys in invert(favourites).items():
              counts[value] = len(keys)
          return counts
    explanation: |
      Inverting is grouping where the "property" is the old value. Sorting the lists afterwards works because `result.values()` gives the actual list objects, and `.sort()` changes them in place (Lesson 3.4 again). Note that the old values become keys, so they must be immutable: inverting `{"a": [1, 2]}` would raise `TypeError: unhashable type: 'list'`. Building `favourite_counts` from `invert` is **reuse**: solve a general problem once, then build specific answers on top of it.

commonMistakes:
  - title: Reading a key that might not exist
    explanation: |
      `d[key]` raises `KeyError` for a missing key. Check with `in`, or use `d.get(key, default)`.
    wrong: |
      counts[word] += 1      # KeyError the first time
    right: |
      counts[word] = counts.get(word, 0) + 1
  - title: Expecting `in` to search the values
    explanation: |
      `x in d` checks the keys only. Use `x in d.values()` to search values.
  - title: Using a list as a key
    explanation: |
      Keys must be immutable (hashable). Use a tuple instead of a list, such as `grid[(row, col)]`.
    wrong: |
      seen = {}
      seen[[1, 2]] = True    # TypeError: unhashable type: 'list'
    right: |
      seen = {}
      seen[(1, 2)] = True
  - title: Changing a dictionary's keys while looping over it
    explanation: |
      Adding or deleting keys during a loop over the same dictionary raises `RuntimeError`. Loop over `list(d)` (a copy of the keys) instead.
    wrong: |
      for k in d:
          if d[k] == 0:
              del d[k]
    right: |
      for k in list(d):
          if d[k] == 0:
              del d[k]

summary:
  - "A **dictionary** maps unique **keys** to values: `{\"Ada\": 36}`. Look up with `d[key]`."
  - "Assigning `d[key] = value` adds or replaces; `del d[key]` and `d.pop(key)` remove."
  - "A missing key raises `KeyError`. Use `key in d` (checks keys) or `d.get(key, default)`."
  - "Loop with `for k in d`, `d.values()` or `for k, v in d.items()`. Dictionaries keep insertion order."
  - "**Counting**: `counts[x] = counts.get(x, 0) + 1`. **Grouping**: a dictionary of lists."
  - "Lookup is fast because of **hashing**, which is why keys must be immutable (strings, numbers, tuples)."
next: |
  A dictionary's keys are unique and fast to check. Sometimes that's all you need: no values, just "is this thing in my collection?". In **Lesson 3.7** you'll meet **sets**, which give you instant membership tests, automatic de-duplication, and the union and intersection operations from mathematics.

quiz:
  - type: mcq
    question: "What is printed?\n\n```python\nd = {\"a\": 1, \"b\": 2}\nd[\"a\"] = 5\nd[\"c\"] = 3\nprint(d)\n```"
    options: ["{'a': 1, 'b': 2, 'c': 3}", "{'a': 5, 'b': 2, 'c': 3}", "{'a': 1, 'a': 5, 'b': 2, 'c': 3}", "An error"]
    answer: 1
    explanation: Assigning to the existing key "a" replaces its value; assigning to "c" adds a new entry.
  - type: mcq
    question: "With `d = {\"x\": 10}`, what does `d.get(\"y\", 0)` return?"
    options: ["None", "0", "A KeyError", "10"]
    answer: 1
    explanation: get returns the default you supply when the key is missing.
  - type: mcq
    question: "With `ages = {\"Ada\": 36, \"Alan\": 41}`, what is `36 in ages`?"
    options: ["True", "False", "An error", "\"Ada\""]
    answer: 1
    explanation: in checks keys, not values. 36 in ages.values() would be True.
  - type: mcq
    question: "Which of these can be a dictionary key?"
    options: ["[1, 2]", "(1, 2)", "{\"a\": 1}", "All of them"]
    answer: 1
    explanation: Keys must be immutable (hashable). Tuples of immutable values qualify; lists and dictionaries don't.
  - type: mcq
    question: "What does `for k, v in d.items():` give on each pass?"
