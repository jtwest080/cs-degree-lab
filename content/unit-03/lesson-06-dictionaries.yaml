  - type: code
    question: |
      Write `merge_counts(a, b)` that returns a **new** dictionary combining two count dictionaries, adding counts for keys in both. `merge_counts({"x": 1, "y": 2}, {"y": 3, "z": 4})` returns `{"x": 1, "y": 5, "z": 4}`. Don't change `a` or `b`.
    starter: |
      def merge_counts(a, b):
          pass
    tests:
      - name: merges and adds
        code: |
          a = {"x": 1, "y": 2}
          b = {"y": 3, "z": 4}
          assert merge_counts(a, b) == {"x": 1, "y": 5, "z": 4}, f"Got {merge_counts(a, b)}"
          assert a == {"x": 1, "y": 2} and b == {"y": 3, "z": 4}, "Don't change a or b."
          assert merge_counts({}, {}) == {}
    solution: |
      def merge_counts(a, b):
          result = {}
          for d in [a, b]:
              for key, count in d.items():
                  result[key] = result.get(key, 0) + count
          return result
