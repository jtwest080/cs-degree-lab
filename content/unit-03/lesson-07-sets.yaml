id: u3-sets
title: Sets
minutes: 40
objective: |
  Use **sets** to remove duplicates, test membership instantly, and compare collections with **union**, **intersection** and **difference**, and recognise problems where a set makes a slow algorithm fast.
outcomes:
  - Create sets, including the empty set `set()`
  - Add and remove items with `add`, `remove` and `discard`
  - Explain why sets are unordered and contain no duplicates
  - Use `|`, `&`, `-` and `^` to combine sets, and `<=` to test for subsets
  - Use a "seen" set to detect repeats in one pass
  - Choose a set over a list when membership tests are frequent

sections:
  - heading: A bag of unique things
    body: |
      A **set** is an **unordered** collection of **unique** values. It's written with curly braces, like a dictionary without the values:

      ```python
      colours = {"red", "green", "blue"}
      ```

      Two properties define a set:

      - **No duplicates.** Adding something that's already there does nothing. `{1, 2, 2, 3, 3, 3}` is just `{1, 2, 3}`.
      - **No order.** A set has no first or last item and no indexes, so `colours[0]` is a `TypeError`. When you print a set, the order you see isn't meaningful and may differ between runs. When order matters for output, use `sorted(my_set)`, which returns a sorted list.

      Sets are the programming version of sets in mathematics (you'll study them formally in Unit 6), and they work like the **keys** of a dictionary. In fact a set is implemented the same way, with hashing (Lesson 3.6). That gives sets the same strengths and the same rule: items must be immutable, so you can have a set of strings or tuples, but not a set of lists.

      > **Analogy:** A set is like a guest list at a door. The bouncer doesn't care about the order names were written down, and writing a name twice doesn't let someone in twice. The only question that matters is "is this person on the list?", and the bouncer can answer it instantly.

  - heading: Creating and changing sets
    body: |
      ```python
      s = {3, 1, 2}          # a set literal
      empty = set()          # the empty set
      letters = set("hello") # {'h', 'e', 'l', 'o'} (one 'l')
      unique = set([4, 4, 5])
      ```

      > **Warning:** `{}` is an empty **dictionary**, not an empty set (dictionaries got the curly braces first). Always write `set()` for an empty set.

      Sets are mutable:

      | Operation | Effect |
      |---|---|
      | `s.add(x)` | add `x` (no effect if already present) |
      | `s.remove(x)` | remove `x`; `KeyError` if it's missing |
      | `s.discard(x)` | remove `x` if present; never an error |
      | `x in s` | membership test, very fast |
      | `len(s)` | number of items |

      You can loop over a set with `for item in s:`, though the order isn't guaranteed. Loop over `sorted(s)` when you need a predictable order.

  - heading: Membership is instant
    body: |
      `x in some_list` is a linear search: Python compares `x` with each item until it finds a match, so it gets slower as the list grows. `x in some_set` uses the hash, jumping straight to where `x` would be, so it takes about the same time whether the set holds ten items or ten million.

      Remember `dedupe` from Lesson 3.2? It checked `if item not in result:` against a growing list, doing up to n² comparisons in total. With a set of items already seen, each check is instant:

      ```python
      def dedupe(lst):
          seen = set()
          result = []
          for item in lst:
              if item not in seen:
                  seen.add(item)
                  result.append(item)
          return result
      ```

      Same output, same order, but for a million items it's the difference between a fraction of a second and many minutes. If you don't care about order, `list(set(lst))` removes duplicates in one step.

      > **Key idea:** A set is the right tool whenever the main question you ask of a collection is "is this in it?". Keeping a **seen** set while you loop is one of the most common tricks in efficient programming.

  - heading: Set operations
    body: |
      Sets support the classic operations from mathematics, each written with an operator:

      ```python
      a = {1, 2, 3, 4}
      b = {3, 4, 5}
      ```

      | Operation | Operator | Result | Meaning |
      |---|---|---|---|
      | union | `a \| b` | `{1, 2, 3, 4, 5}` | in either |
      | intersection | `a & b` | `{3, 4}` | in both |
      | difference | `a - b` | `{1, 2}` | in `a` but not `b` |
      | symmetric difference | `a ^ b` | `{1, 2, 5}` | in exactly one |
      | subset | `{1, 2} <= a` | `True` | every item of the left is in `a` |

      Each also has a method form (`a.union(b)`, `a.intersection(b)`, `a.difference(b)`, `a.issubset(b)`), which also accepts lists.

      Notice the operators match the logic from Lesson 1.3: `&` is like AND ("in a **and** in b"), `|` is like OR, and `^` is like XOR ("in one or the other, but not both"). That's no coincidence: an item's membership of a set is a true/false fact, and set operations are logic gates applied to every possible item.

      These turn many problems into one-liners. Which students took both courses? `maths & physics`. Which words appear in the first document but not the second? `set(doc1.split()) - set(doc2.split())`.

examples:
  - title: Duplicates disappear
    intro: Sets keep one copy of each value.
    code: |
      votes = ["red", "blue", "red", "green", "blue", "red"]
      options = set(votes)
      print(len(votes), "votes for", len(options), "options")
      print(sorted(options))
      print("red" in options, "pink" in options)
      options.add("pink")
      options.add("red")
      options.discard("purple")
      print(sorted(options))
      print(type({}).__name__, type(set()).__name__)
    output: |
      6 votes for 3 options
      ['blue', 'green', 'red']
      True False
      ['blue', 'green', 'pink', 'red']
      dict set
    lines:
      - line: 2
        note: "Building a set from a list keeps one copy of each distinct value."
      - line: 4
        note: "`sorted` gives a list in a predictable order. Printing the set itself could show any order."
      - line: 6-7
        note: "Adding a new item grows the set; adding an existing one does nothing."
      - line: 8
        note: "`discard` doesn't complain about a missing item (`remove` would raise KeyError)."
      - line: 10
        note: "`{}` is an empty dictionary. Use `set()` for an empty set."
  - title: Comparing two groups
    intro: Who's in which club?
    code: |
      chess = {"Ada", "Alan", "Grace", "Tim"}
      drama = {"Grace", "Linus", "Ada", "Margaret"}
      print("Both:", sorted(chess & drama))
      print("Either:", len(chess | drama), "people")
      print("Chess only:", sorted(chess - drama))
      print("Exactly one:", sorted(chess ^ drama))
      print({"Ada", "Tim"} <= chess)
    output: |
      Both: ['Ada', 'Grace']
      Either: 6 people
      Chess only: ['Alan', 'Tim']
      Exactly one: ['Alan', 'Linus', 'Margaret', 'Tim']
      True
    lines:
      - line: 3
        note: "Intersection: people in both clubs."
      - line: 4
        note: "Union: everyone in at least one club. Ada and Grace are counted once."
      - line: 5
        note: "Difference: in chess but not drama. Order matters: `drama - chess` would be Linus and Margaret."
      - line: 6
        note: "Symmetric difference: in one club but not both."
      - line: 7
        note: "Subset test: is every name on the left also in chess?"
  - title: The seen set
    intro: Find the first repeated character, in one pass.
    code: |
      def first_repeat(text):
          seen = set()
          for ch in text:
              if ch in seen:
                  return ch
              seen.add(ch)
          return None

      print(first_repeat("abcdeczb"))
      print(first_repeat("python"))
    output: |
      c
      None
    lines:
      - line: 2
        note: "An empty set to remember everything we've passed."
      - line: 4-5
        note: "If we've seen this character before, it's the first repeat. Checking `in seen` is instant."
      - line: 6
        note: "Otherwise remember it and move on."
      - line: 7
        note: "Reaching the end means nothing repeated."

playground:
  prompt: |
    Make sets of the letters in two words, like `set("listen")` and `set("silent")`. Try every set operator on them. Are the sets equal? Does that mean the words are anagrams? (Try "aab" and "abb".)
  code: |
    a = set("listen")
    b = set("silent")
    print(sorted(a), sorted(b))
    print(a == b)

exercises:
  - id: unique-words
    title: Vocabulary size
    difficulty: 1
    prompt: |
      Write `vocabulary(text)` that returns the number of **different** words in `text`, ignoring case. Words are separated by whitespace (no punctuation to worry about).

      ```python
      vocabulary("the cat and The dog and THE bird")   # 5
      ```
    starter: |
      def vocabulary(text):
          pass
    tests:
      - name: counts distinct words ignoring case
        code: |
          assert vocabulary("the cat and The dog and THE bird") == 5, f"Got {vocabulary('the cat and The dog and THE bird')}"
          assert vocabulary("a a a") == 1
          assert vocabulary("") == 0
      - name: uses a set
        code: |
          assert "set(" in source or "{" in source, "Use a set to collect the distinct words."
    hints:
      - "Lowercase the text, then split it into words."
      - "`set(words)` removes duplicates; `len` of it is the answer."
    solution: |
      def vocabulary(text):
          """Number of distinct words in text, ignoring case."""
          return len(set(text.lower().split()))
    explanation: |
      Lowercase, split, put in a set, count: four simple steps chained together. Vocabulary size is a real measure in linguistics; Shakespeare's works use about 30,000 distinct words.

  - id: common-friends
    title: Friend suggestions
    difficulty: 2
    prompt: |
      Friendships are stored in a dictionary mapping each person to a **set** of their friends. Write:

      - `mutual(friends, a, b)`: a sorted list of people who are friends with both `a` and `b`.
      - `suggest(friends, person)`: a sorted list of **friends of friends** of `person` who aren't already their friend, and aren't `person` themselves.

      ```python
      friends = {
          "ann": {"bob", "cat"},
          "bob": {"ann", "cat", "dan"},
          "cat": {"ann", "bob", "eve"},
          "dan": {"bob"},
          "eve": {"cat"},
      }
      mutual(friends, "ann", "bob")   # ['cat']
      suggest(friends, "ann")         # ['dan', 'eve']
      ```
    starter: |
      friends = {
          "ann": {"bob", "cat"},
          "bob": {"ann", "cat", "dan"},
          "cat": {"ann", "bob", "eve"},
          "dan": {"bob"},
          "eve": {"cat"},
      }


      def mutual(friends, a, b):
          pass


      def suggest(friends, person):
          pass
    tests:
      - name: mutual friends
        code: |
          assert mutual(friends, "ann", "bob") == ["cat"], f"Got {mutual(friends, 'ann', 'bob')}"
          assert mutual(friends, "bob", "cat") == ["ann"], f"Got {mutual(friends, 'bob', 'cat')}"
          assert mutual(friends, "dan", "eve") == [], f"Got {mutual(friends, 'dan', 'eve')}"
      - name: suggestions
        code: |
          assert suggest(friends, "ann") == ["dan", "eve"], f"Got {suggest(friends, 'ann')}"
          assert suggest(friends, "dan") == ["ann", "cat"], f"Got {suggest(friends, 'dan')}"
      - name: does not change the friendships
        code: |
          before = {k: set(v) for k, v in friends.items()}
          suggest(friends, "ann")
          mutual(friends, "ann", "bob")
          assert friends == before, "Don't change the friends dictionary or its sets."
    hints:
      - "`mutual` is an intersection: `friends[a] & friends[b]`, then `sorted`."
      - "For `suggest`, start with an empty set and union in the friends of each friend: `for f in friends[person]: result = result | friends[f]`."
      - "Then remove the person's existing friends and the person: `result - friends[person] - {person}`."
    solution: |
      friends = {
          "ann": {"bob", "cat"},
          "bob": {"ann", "cat", "dan"},
          "cat": {"ann", "bob", "eve"},
          "dan": {"bob"},
          "eve": {"cat"},
      }


      def mutual(friends, a, b):
          """Sorted list of people who are friends with both a and b."""
          return sorted(friends[a] & friends[b])


      def suggest(friends, person):
          """Sorted friends-of-friends who aren't already friends."""
          candidates = set()
          for f in friends[person]:
              candidates = candidates | friends[f]
          return sorted(candidates - friends[person] - {person})
    explanation: |
      Each question maps to a set operation: "both" is intersection, "collect everyone" is union, "but not" is difference. Note we wrote `candidates = candidates | friends[f]` rather than `candidates |= friends[f]`. Here either works, because `candidates` is our own set. But if you wrote `candidates = friends[person]` and then used `|=`, you'd be mutating a set inside the dictionary (Lesson 3.4's aliasing). This is a tiny version of how social networks suggest connections; Unit 7 treats it as a **graph** problem.

  - id: pangram
    title: Missing letters
    difficulty: 2
    prompt: |
      A **pangram** is a sentence that uses every letter of the alphabet. Write `missing_letters(text)` that returns a string of the lowercase letters (a to z) that **don't** appear in `text`, in alphabetical order, ignoring case. A true pangram gives `""`.

      ```python
      missing_letters("The quick brown fox jumps over the lazy dog")   # ''
      missing_letters("Hello world")   # 'abcfgijkmnpqstuvxyz'
      ```
    starter: |
      def missing_letters(text):
          alphabet = set("abcdefghijklmnopqrstuvwxyz")
    tests:
      - name: a pangram has nothing missing
        code: |
          assert missing_letters("The quick brown fox jumps over the lazy dog") == "", f"Got {missing_letters('The quick brown fox jumps over the lazy dog')!r}"
      - name: finds the missing letters
        code: |
          assert missing_letters("Hello world") == "abcfgijkmnpqstuvxyz", f"Got {missing_letters('Hello world')!r}"
          assert missing_letters("") == "abcdefghijklmnopqrstuvwxyz"
      - name: ignores digits and punctuation
        code: |
          assert missing_letters("ABC xyz 123 !!!") == "defghijklmnopqrstuvw", f"Got {missing_letters('ABC xyz 123 !!!')!r}"
    hints:
      - "`set(text.lower())` is the set of characters used (including spaces and punctuation, which is fine)."
      - "The missing letters are `alphabet - used`."
      - "Turn the set into a sorted string: `\"\".join(sorted(...))`."
    solution: |
      def missing_letters(text):
          """Letters a-z not used in text, in order."""
          alphabet = set("abcdefghijklmnopqrstuvwxyz")
          used = set(text.lower())
          return "".join(sorted(alphabet - used))
    explanation: |
      A set difference does all the work. Spaces, digits and punctuation end up in `used`, but subtracting from the alphabet simply ignores them, since they were never in the alphabet. `sorted` on a set returns a list, which `join` turns back into a string.

  - id: has-pair-sum
    title: Pair with a given sum
    difficulty: 3
    prompt: |
      Write `has_pair_sum(nums, target)` that returns True if **two different positions** in the list hold numbers adding up to `target`.

      ```python
      has_pair_sum([3, 9, 4, 7], 11)   # True  (4 + 7)
      has_pair_sum([3, 9, 4, 7], 6)    # False (3 + 3 would need two 3s)
      has_pair_sum([3, 9, 3], 6)       # True  (3 + 3)
      ```

      The obvious way checks every pair with nested loops: about n²/2 checks. Do it in **one pass** with a set: for each number, ask whether the number it would need has already been seen.
    starter: |
      def has_pair_sum(nums, target):
          seen = set()
          for n in nums:
              pass
          return False
    tests:
      - name: examples from the question
        code: |
          assert has_pair_sum([3, 9, 4, 7], 11) is True, "4 + 7 = 11"
          assert has_pair_sum([3, 9, 4, 7], 6) is False, "Only one 3, so 3 + 3 isn't possible."
          assert has_pair_sum([3, 9, 3], 6) is True, "Two 3s at different positions."
      - name: edge cases
        code: |
          assert has_pair_sum([], 5) is False
          assert has_pair_sum([5], 10) is False, "A single number can't pair with itself."
          assert has_pair_sum([-2, 8], 6) is True
          assert has_pair_sum([0, 0], 0) is True
      - name: fast on a big list
        code: |
          big = list(range(0, 400000, 2))
          assert has_pair_sum(big, 3) is False, "Even numbers never add up to an odd number."
          assert has_pair_sum(big, 799994) is True
      - name: single loop
        code: |
          assert source.count("for ") == 1, "Use one loop and a set, not nested loops."
    hints:
      - "For a number `n`, its partner would be `target - n`."
      - "If `target - n` is already in `seen`, you've found a pair: return True."
      - "Otherwise `seen.add(n)`. Adding *after* checking is what stops a single number pairing with itself."
    solution: |
      def has_pair_sum(nums, target):
          """True if two different positions in nums add up to target."""
          seen = set()
          for n in nums:
              if target - n in seen:
                  return True
              seen.add(n)
          return False
    explanation: |
      This is the famous **two-sum** problem, a favourite interview question. Nested loops check about n²/2 pairs: for the 200,000-item test, that's 20 billion checks, which would take hours. The set version does one fast membership test per number, so 200,000 steps. The trick of **trading memory for speed** (remember what you've seen so you never look again) is one of the central ideas of Unit 8. Checking before adding ensures a number can only pair with an *earlier* one, never itself.

commonMistakes:
  - title: Writing {} for an empty set
    explanation: |
      `{}` is an empty dictionary. Use `set()`.
    wrong: |
      seen = {}
      seen.add(1)     # AttributeError: 'dict' object has no attribute 'add'
    right: |
      seen = set()
      seen.add(1)
  - title: Expecting a set to keep order
    explanation: |
      Sets are unordered, so don't rely on the order they print or loop in. Use `sorted(s)` when order matters, or the seen-set pattern when you need to keep the original order.
  - title: Indexing a set
    explanation: |
      Sets have no positions, so `s[0]` is a `TypeError`. Convert to a list (or sorted list) first if you really need positions.
  - title: Using remove on something that might be missing
    explanation: |
      `s.remove(x)` raises `KeyError` if `x` isn't in the set. Use `s.discard(x)` when that's fine.

summary:
  - "A **set** is an unordered collection of unique, immutable values: `{1, 2, 3}`. The empty set is `set()` (not `{}`)."
  - "`add`, `remove` and `discard` change a set; `x in s` tests membership almost instantly, thanks to hashing."
  - "`set(lst)` removes duplicates; use a **seen** set to remove them while keeping order."
  - "Union `|`, intersection `&`, difference `-` and symmetric difference `^` combine sets; `<=` tests for a subset."
  - "Prefer a set over a list whenever you mostly ask \"is this in the collection?\"."
next: |
  You've now met all four of Python's core collections. In **Lesson 3.8** you'll learn **comprehensions**, a compact way to build lists, sets and dictionaries in a single line, and step back to compare all four structures so you can choose the right one for any problem.

quiz:
  - type: mcq
    question: "What is `len({3, 1, 3, 2, 1})`?"
    options: ["5", "3", "2", "An error"]
    answer: 1
    explanation: Duplicates are removed, leaving {1, 2, 3}.
  - type: mcq
    question: "What type is `x` after `x = {}`?"
    options: ["set", "dict", "list", "tuple"]
    answer: 1
    explanation: Empty curly braces make an empty dictionary. Use set() for an empty set.
  - type: mcq
    question: "With `a = {1, 2, 3}` and `b = {2, 3, 4}`, what is `a - b`?"
    options: ["{1}", "{4}", "{1, 4}", "{2, 3}"]
    answer: 0
    explanation: Difference keeps items in a that are not in b.
  - type: mcq
    question: "With the same sets, what is `a ^ b`?"
    options: ["{2, 3}", "{1, 2, 3, 4}", "{1, 4}", "{1}"]
    answer: 2
    explanation: Symmetric difference keeps items in exactly one of the sets, like XOR.
  - type: mcq
    question: Which of these can be put in a set?
    options: ["[1, 2]", "{1, 2}", "(1, 2)", "{\"a\": 1}"]
    answer: 2
    explanation: Set items must be immutable. Tuples are; lists, sets and dictionaries aren't.
  - type: mcq
    question: "You check `if word in collection:` a million times. Why is a set better than a list for `collection`?"
    options:
      - Sets are sorted, so binary search is used
      - Set membership uses hashing and doesn't slow down as the set grows
      - Lists can't hold strings
      - Sets use less memory than lists
    answer: 1
    explanation: A list check is a linear search; a set jumps straight to the right place using the hash.
  - type: code
    question: |
      Write `shared_letters(a, b)` that returns a string of the letters that appear in **both** words, in alphabetical order, each only once. `shared_letters("apple", "grape")` returns `"aep"`.
    starter: |
      def shared_letters(a, b):
          pass
    tests:
      - name: finds shared letters
        code: |
          assert shared_letters("apple", "grape") == "aep", f"Got {shared_letters('apple', 'grape')!r}"
          assert shared_letters("abc", "xyz") == "", f"Got {shared_letters('abc', 'xyz')!r}"
          assert shared_letters("aaa", "a") == "a"
    solution: |
      def shared_letters(a, b):
          return "".join(sorted(set(a) & set(b)))
