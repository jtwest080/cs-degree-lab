id: u3-comprehensions
title: Comprehensions and Choosing a Data Structure
minutes: 50
objective: |
  Write **list, set and dictionary comprehensions** to build collections in one clear line, use **`any`**, **`all`** and generator expressions to ask questions about collections, and choose the right data structure (list, tuple, dict or set) for a problem.
outcomes:
  - Rewrite transform and filter loops as list comprehensions
  - Use a conditional expression (`a if test else b`) inside a comprehension
  - Write set and dictionary comprehensions
  - Build grids and flatten nested lists with nested comprehensions
  - Use `any`, `all` and `sum` with generator expressions
  - Compare lists, tuples, dictionaries and sets, and pick the right one for a task

sections:
  - heading: The loop you keep writing
    body: |
      In Lesson 3.2 you learned the **transform** and **filter** patterns. You've written them many times since:

      ```python
      squares = []
      for n in nums:
          squares.append(n * n)
      ```

      Three lines, and the important part (`n * n`) is buried in the middle. Python has a dedicated, more readable form for exactly this pattern, the **list comprehension**:

      ```python
      squares = [n * n for n in nums]
      ```

      Read it as "a list of `n * n`, **for** each `n` **in** `nums`". The brackets say "build a list", the expression at the front says what each item is, and the `for` part says where the values come from. It does exactly what the three-line loop does.

      Add an `if` at the end to **filter**:

      ```python
      evens = [n for n in nums if n % 2 == 0]
      even_squares = [n * n for n in nums if n % 2 == 0]
      ```

      The second reads "`n * n` for each `n` in `nums`, if `n` is even". The `if` decides which items are included; the front expression decides what goes in.

      > **Tip:** To write a comprehension, write the ordinary loop first in your head, then move the appended expression to the front. `for w in words: if len(w) > 3: result.append(w.upper())` becomes `[w.upper() for w in words if len(w) > 3]`.

  - heading: Choosing a value with if/else
    body: |
      Sometimes you want to transform every item, but differently depending on a test. For that, Python has a **conditional expression**, which picks one of two values:

      ```python
      label = "even" if n % 2 == 0 else "odd"
      ```

      It reads like English: "even" if the test is true, else "odd". It's an *expression* (it produces a value), so it can go anywhere a value can, including the front of a comprehension:

      ```python
      clamped = [n if n > 0 else 0 for n in nums]     # replace negatives with 0
      ```

      Don't confuse the two positions. An `if` **at the end** filters (drops items). An `if ... else` **at the front** chooses a value (keeps every item).

  - heading: Set and dictionary comprehensions
    body: |
      The same idea works with curly braces. With a single expression you get a **set**:

      ```python
      lengths = {len(w) for w in words}       # the distinct word lengths
      ```

      With `key: value` you get a **dictionary**:

      ```python
      lengths_by_word = {w: len(w) for w in words}
      squares = {n: n * n for n in range(1, 6)}   # {1: 1, 2: 4, 3: 9, 4: 16, 5: 25}
      ```

      Dictionary comprehensions are handy for transforming or filtering a dictionary:

      ```python
      prices = {"tea": 2.5, "cake": 4.0, "water": 1.0}
      cheap = {item: p for item, p in prices.items() if p < 3}
      in_pence = {item: round(p * 100) for item, p in prices.items()}
      ```

  - heading: Nested comprehensions
    body: |
      A comprehension's expression can itself be a comprehension. This is the clean way to build a grid with independent rows (the problem from Lesson 3.4):

      ```python
      grid = [[0 for c in range(cols)] for r in range(rows)]
      ```

      The inner comprehension runs afresh for each row, so every row is a new list. (`[[0] * cols for r in range(rows)]` also works.)

      A comprehension can also have **two** `for` parts, which run like nested loops in the order written. This **flattens** a list of lists:

      ```python
      flat = [x for row in grid for x in row]
      # same as:  for row in grid:
      #               for x in row:
      #                   flat.append(x)
      ```

      Nested comprehensions get hard to read quickly. If you have to think hard to read one, write the loops instead.

  - heading: any, all and generator expressions
    body: |
      Many questions about a collection are "is it true for **some** item?" or "is it true for **every** item?". Python has built-ins for both:

      ```python
      any([False, True, False])    # True: at least one is True
      all([True, True, False])     # False: not every one is True
      ```

      Combine them with a comprehension-like expression in round brackets, called a **generator expression**:

      ```python
      has_digit = any(ch.isdigit() for ch in password)
      all_passed = all(score >= 50 for score in scores)
      total_length = sum(len(w) for w in words)
      ```

      A generator expression doesn't build a whole list; it produces values one at a time as the function asks for them. (`any` even stops as soon as it finds a True, like the short-circuiting `or` from Lesson 2.5.) When it's the only argument to a function, you don't need extra brackets.

      Note that `all` of an empty collection is True (no item fails the test) and `any` of an empty collection is False (no item passes it). These match the logic of Unit 6.

  - heading: When not to use a comprehension
    body: |
      Comprehensions are for **building a collection**. Don't use them just to run code for its side effects:

      ```python
      [print(x) for x in items]     # builds a useless list of Nones
      ```

      Use a plain `for` loop for that. And if a comprehension needs several conditions, nested loops and a conditional expression all at once, it has stopped being clearer than the loop. Readability is the whole point.

  - heading: Choosing a data structure
    body: |
      You've now met Python's four core collections. Choosing well is one of the most important design decisions in a program, because the right structure makes code both simpler and faster.

      | | List | Tuple | Dict | Set |
      |---|---|---|---|---|
      | Written | `[1, 2]` | `(1, 2)` | `{"a": 1}` | `{1, 2}` |
      | Ordered | yes | yes | insertion order | no |
      | Duplicates | allowed | allowed | keys unique | no |
      | Mutable | yes | no | yes | yes |
      | Access by | position | position | key | membership only |
      | `x in c` speed | slow (search) | slow (search) | fast (keys) | fast |
      | Typical use | a sequence of similar items | a fixed record | a lookup table, counts, groups | unique items, membership, comparisons |

      Some questions to ask:

      - **Do I look things up by a name or ID?** Use a dictionary.
      - **Do I mostly ask "is X in here?", or need uniqueness?** Use a set.
      - **Does the order or position matter, or are there duplicates to keep?** Use a list.
      - **Is it a fixed bundle that shouldn't change, or does it need to be a key?** Use a tuple.

      Real programs combine them: a dictionary mapping student names to lists of scores; a set of `(row, col)` tuples for the occupied squares of a board; a list of dictionaries for the rows of a table.

      > **Key idea:** "Which data structure?" is really the question "which operations will I do most often, and which structure makes those cheap?". That question is the starting point of Units 7 and 8, where you'll build these structures yourself and measure their costs precisely.

examples:
  - title: Loops and their comprehensions
    intro: Each comprehension does the same job as the loop above it.
    code: |
      nums = [3, -1, 4, -1, 5, -9, 2, 6]

      doubled = []
      for n in nums:
          doubled.append(n * 2)
      print(doubled)
      print([n * 2 for n in nums])

      print([n for n in nums if n > 0])
      print([n if n > 0 else 0 for n in nums])
      print([w.upper() for w in "the cat sat".split() if w != "the"])
    output: |
      [6, -2, 8, -2, 10, -18, 4, 12]
      [6, -2, 8, -2, 10, -18, 4, 12]
      [3, 4, 5, 2, 6]
      [3, 0, 4, 0, 5, 0, 2, 6]
      ['CAT', 'SAT']
    lines:
      - line: 3-7
        note: "The transform loop and its one-line comprehension give the same list."
      - line: 9
        note: "An `if` at the end **filters**: only positive numbers are kept."
      - line: 10
        note: "An `if ... else` at the front **chooses a value**: every item is kept, negatives become 0."
      - line: 11
        note: "Transform and filter together, over the words of a sentence."
  - title: Set and dictionary comprehensions
    intro: Curly braces build sets and dictionaries.
    code: |
      words = ["apple", "fig", "banana", "kiwi", "plum"]
      print(sorted({len(w) for w in words}))
      lengths = {w: len(w) for w in words}
      print(lengths)
      prices = {"tea": 2.5, "cake": 4.0, "water": 1.0}
      print({item: p for item, p in prices.items() if p < 3})
      print({item: round(p * 1.2, 2) for item, p in prices.items()})
    output: |
      [3, 4, 5, 6]
      {'apple': 5, 'fig': 3, 'banana': 6, 'kiwi': 4, 'plum': 4}
      {'tea': 2.5, 'water': 1.0}
      {'tea': 3.0, 'cake': 4.8, 'water': 1.2}
    lines:
      - line: 2
        note: "A set comprehension: the distinct lengths (kiwi and plum share 4). Sorted for predictable output."
      - line: 3
        note: "A dictionary comprehension: `key: value` for each word."
      - line: 6
        note: "Filtering a dictionary: loop over `items()`, keep pairs that pass the test."
      - line: 7
        note: "Transforming every value, here adding 20% tax."
  - title: Grids, flattening, any and all
    intro: Nested comprehensions and questions about collections.
    code: |
      table = [[r * c for c in range(1, 4)] for r in range(1, 4)]
      print(table)
      flat = [x for row in table for x in row]
      print(flat)
      print(sum(x for x in flat if x % 2 == 0))

      password = "Secret99"
      print(any(ch.isdigit() for ch in password))
      print(all(ch.isalnum() for ch in password))
      print(all(x > 0 for x in []), any(x > 0 for x in []))
    output: |
      [[1, 2, 3], [2, 4, 6], [3, 6, 9]]
      [1, 2, 3, 2, 4, 6, 3, 6, 9]
      20
      True
      True
      True False
    lines:
      - line: 1
        note: "The inner comprehension builds one row; the outer one builds a row for each `r`. Every row is a separate list."
      - line: 3
        note: "Two `for` parts run like nested loops, in the order written: for each row, for each x in that row."
      - line: 5
        note: "A generator expression inside `sum`: add up the even numbers (2 + 2 + 4 + 6 + 6 = 20)."
      - line: 8-9
        note: "`any`: is there at least one digit? `all`: is every character a letter or digit?"
      - line: 10
        note: "For an empty collection, `all` is True and `any` is False."

playground:
  prompt: |
    Take a loop you wrote in an earlier lesson and rewrite it as a comprehension. Then try: a list of the first letters of each word in a sentence; a dictionary mapping each number from 1 to 10 to "even" or "odd".
  code: |
    sentence = "comprehensions make code clearer"
    print([w[0] for w in sentence.split()])
    print({n: "even" if n % 2 == 0 else "odd" for n in range(1, 11)})

exercises:
  - id: rewrite-loops
    title: Rewrite as comprehensions
    difficulty: 1
    prompt: |
      The starter computes three lists with loops. Replace **each** loop with a single list comprehension, keeping the same variable names and results:

      - `lengths`: the length of each word
      - `long_words`: the words with more than 4 letters
      - `shouted`: each word in uppercase followed by `"!"`, but only for words starting with a vowel
    starter: |
      words = ["apple", "fig", "orange", "kiwi", "egg", "banana"]

      lengths = []
      for w in words:
          lengths.append(len(w))

      long_words = []
      for w in words:
          if len(w) > 4:
              long_words.append(w)

      shouted = []
      for w in words:
          if w[0] in "aeiou":
              shouted.append(w.upper() + "!")
    tests:
      - name: results are correct
        code: |
          assert lengths == [5, 3, 6, 4, 3, 6], f"lengths is {lengths}"
          assert long_words == ["apple", "orange", "banana"], f"long_words is {long_words}"
          assert shouted == ["APPLE!", "ORANGE!", "EGG!"], f"shouted is {shouted}"
      - name: no loops with append
        code: |
          assert ".append(" not in source, "Replace each loop with a comprehension; there should be no append left."
          assert source.count(" for ") >= 3, "Use a comprehension for each of the three lists."
    hints:
      - "`lengths = [len(w) for w in words]`."
      - "Filtering goes at the end: `[w for w in words if len(w) > 4]`."
      - "Transform and filter together: `[w.upper() + \"!\" for w in words if w[0] in \"aeiou\"]`."
    solution: |
      words = ["apple", "fig", "orange", "kiwi", "egg", "banana"]
      lengths = [len(w) for w in words]
      long_words = [w for w in words if len(w) > 4]
      shouted = [w.upper() + "!" for w in words if w[0] in "aeiou"]
    explanation: |
      Every one of these loops was "start empty, loop, maybe test, append something". That shape is exactly what a comprehension expresses: the appended expression moves to the front and the test moves to the end. Twelve lines become three, and each line says what the list *is* rather than how to build it.

  - id: price-tools
    title: Price list tools
    difficulty: 2
    prompt: |
      Prices are stored in a dictionary mapping item names to prices. Using **comprehensions**, write:

      - `with_tax(prices, rate)`: a new dictionary with every price multiplied by `1 + rate` and rounded to 2 decimal places.
      - `under(prices, limit)`: a **set** of the item names costing less than `limit`.
      - `price_bands(prices)`: a new dictionary mapping each item to `"cheap"` if its price is under 2, otherwise `"pricey"`.

      ```python
      prices = {"tea": 2.5, "bun": 1.2, "cake": 4.0}
      with_tax(prices, 0.2)    # {'tea': 3.0, 'bun': 1.44, 'cake': 4.8}
      under(prices, 3)         # {'tea', 'bun'}
      price_bands(prices)      # {'tea': 'pricey', 'bun': 'cheap', 'cake': 'pricey'}
      ```
    starter: |
      def with_tax(prices, rate):
          pass


      def under(prices, limit):
          pass


      def price_bands(prices):
          pass
    tests:
      - name: with_tax
        code: |
          got = with_tax({"tea": 2.5, "bun": 1.2, "cake": 4.0}, 0.2)
          assert got == {"tea": 3.0, "bun": 1.44, "cake": 4.8}, f"Got {got}"
          assert with_tax({}, 0.5) == {}
      - name: under returns a set
        code: |
          got = under({"tea": 2.5, "bun": 1.2, "cake": 4.0}, 3)
          assert got == {"tea", "bun"}, f"Got {got}"
          assert isinstance(got, set), "Return a set."
          assert under({"a": 5}, 5) == set(), "Exactly the limit isn't less than the limit."
      - name: price_bands
        code: |
          got = price_bands({"tea": 2.5, "bun": 1.2, "cake": 4.0})
          assert got == {"tea": "pricey", "bun": "cheap", "cake": "pricey"}, f"Got {got}"
      - name: uses comprehensions
        code: |
          assert source.count(" for ") >= 3 and ".append(" not in source and "] =" not in source, "Use a comprehension in each function."
    hints:
      - "Loop over `prices.items()` to get name and price together."
      - "`{name: round(p * (1 + rate), 2) for name, p in prices.items()}`."
      - "For `price_bands`, put a conditional expression in the value position: `\"cheap\" if p < 2 else \"pricey\"`."
    solution: |
      def with_tax(prices, rate):
          """Return a new dict with every price increased by rate."""
          return {name: round(p * (1 + rate), 2) for name, p in prices.items()}


      def under(prices, limit):
          """Return the set of items costing less than limit."""
          return {name for name, p in prices.items() if p < limit}


      def price_bands(prices):
          """Map each item to 'cheap' (under 2) or 'pricey'."""
          return {name: "cheap" if p < 2 else "pricey" for name, p in prices.items()}
    explanation: |
      The three comprehensions show the three shapes: transform the values, filter into a set, and choose a value with a conditional expression. Each function is one line, and each line can be read aloud as a description of the result. None of them change the original dictionary.

  - id: grid-tools
    title: Grids in one line
    difficulty: 2
    prompt: |
      Using nested comprehensions, write:

      - `times_table(n)`: an n × n grid where row `r`, column `c` (both counting from 1) holds `r * c`.
      - `flatten(grid)`: a single list of all the items, row by row.
      - `column(grid, c)`: a list of the items in column `c` (counting from 0).

      ```python
      times_table(3)               # [[1, 2, 3], [2, 4, 6], [3, 6, 9]]
      flatten([[1, 2], [3], []])   # [1, 2, 3]
      column([[1, 2], [3, 4]], 1)  # [2, 4]
      ```
    starter: |
      def times_table(n):
          pass


      def flatten(grid):
          pass


      def column(grid, c):
          pass
    tests:
      - name: times_table
        code: |
          assert times_table(3) == [[1, 2, 3], [2, 4, 6], [3, 6, 9]], f"Got {times_table(3)}"
          assert times_table(1) == [[1]]
          t = times_table(4)
          t[0][0] = 99
          assert t[1][0] == 2, "Rows must be independent lists."
      - name: flatten
        code: |
          assert flatten([[1, 2], [3], []]) == [1, 2, 3], f"Got {flatten([[1, 2], [3], []])}"
          assert flatten([]) == []
          assert flatten(times_table(2)) == [1, 2, 2, 4]
      - name: column
        code: |
          assert column([[1, 2], [3, 4]], 1) == [2, 4], f"Got {column([[1, 2], [3, 4]], 1)}"
          assert column(times_table(3), 2) == [3, 6, 9]
      - name: uses comprehensions
        code: |
          assert ".append(" not in source, "Use comprehensions rather than append."
    hints:
      - "`times_table`: the inner comprehension makes one row, `[r * c for c in range(1, n + 1)]`, and the outer one repeats it for each `r`."
      - "`flatten`: two `for` parts, outer first: `[x for row in grid for x in row]`."
      - "`column`: one item from each row: `[row[c] for row in grid]`."
    solution: |
      def times_table(n):
          """Return an n x n multiplication table as a grid."""
          return [[r * c for c in range(1, n + 1)] for r in range(1, n + 1)]


      def flatten(grid):
          """Return all items of grid in one list, row by row."""
          return [x for row in grid for x in row]


      def column(grid, c):
          """Return column c of grid as a list."""
          return [row[c] for row in grid]
    explanation: |
      In `times_table` the *expression* is itself a comprehension, so a fresh row is built for each `r`. In `flatten` there are two `for` *clauses*, which run like nested loops in reading order. Those two forms look similar but mean different things: one builds a list of lists, the other a flat list. `column` is the one-line version of the column loop from Lesson 3.4.

  - id: password-rules
    title: Password rules with any and all
    difficulty: 2
    prompt: |
      Write `check_password(pw)` that returns a **list of the rules the password breaks** (an empty list means it's valid). Check these rules, in this order, and use the exact messages:

      | Rule | Message |
      |---|---|
      | at least 8 characters | `"too short"` |
      | contains a digit | `"needs a digit"` |
      | contains an uppercase letter | `"needs an uppercase letter"` |
      | contains no spaces | `"no spaces allowed"` |

      Use `any` (or `all`) with generator expressions for the character checks.

      ```python
      check_password("Secret99")    # []
      check_password("hi there")    # ['needs a digit', 'needs an uppercase letter', 'no spaces allowed']
      ```
    starter: |
      def check_password(pw):
          problems = []
          return problems
    tests:
      - name: valid password
        code: |
          assert check_password("Secret99") == [], f"Got {check_password('Secret99')}"
      - name: each rule on its own
        code: |
          assert check_password("Abc1") == ["too short"], f"Got {check_password('Abc1')}"
          assert check_password("Abcdefgh") == ["needs a digit"], f"Got {check_password('Abcdefgh')}"
          assert check_password("abcdefg1") == ["needs an uppercase letter"], f"Got {check_password('abcdefg1')}"
          assert check_password("Abcd efg1") == ["no spaces allowed"], f"Got {check_password('Abcd efg1')}"
      - name: several rules, in order
        code: |
          got = check_password("hi there")
          assert got == ["needs a digit", "needs an uppercase letter", "no spaces allowed"], f"Got {got}"
          assert check_password("") == ["too short", "needs a digit", "needs an uppercase letter"], f"Got {check_password('')}"
      - name: uses any or all
        code: |
          assert "any(" in source or "all(" in source, "Use any() or all() for the character checks."
    hints:
      - "`any(ch.isdigit() for ch in pw)` is True if there's at least one digit."
      - "For no spaces: `\" \" in pw` works, or `all(ch != \" \" for ch in pw)`."
      - "Use separate `if` statements (not `elif`), so every broken rule is reported."
    solution: |
      def check_password(pw):
          """Return a list of the rules pw breaks (empty if valid)."""
          problems = []
          if len(pw) < 8:
              problems.append("too short")
          if not any(ch.isdigit() for ch in pw):
              problems.append("needs a digit")
          if not any(ch.isupper() for ch in pw):
              problems.append("needs an uppercase letter")
          if any(ch == " " for ch in pw):
              problems.append("no spaces allowed")
          return problems
    explanation: |
      Compare this with the password checker from Lesson 2.7, which needed counters and a loop. `any(...)` says exactly what each rule means. Returning a list of problems, rather than just True or False, is friendlier to users: they learn everything that's wrong at once. Separate `if`s (not `elif`) matter because the rules are independent.

  - id: anagram-groups
    title: Anagram groups
    difficulty: 3
    prompt: |
      Two words are **anagrams** if they use exactly the same letters the same number of times ("listen" and "silent"). Write `anagram_groups(words)` that groups the words into anagram families.

      Return a list of groups, where each group is a **sorted list** of words, only including groups with **at least two** words. Sort the groups by their first word.

      ```python
      anagram_groups(["listen", "google", "silent", "enlist", "cat", "act", "dog"])
      # [['act', 'cat'], ['enlist', 'listen', 'silent']]
      ```

      Hint for choosing a structure: what single value is the same for every word in a family, and could be used as a **dictionary key**?
    starter: |
      def anagram_groups(words):
          families = {}
          return []
    tests:
      - name: example from the question
        code: |
          got = anagram_groups(["listen", "google", "silent", "enlist", "cat", "act", "dog"])
          assert got == [["act", "cat"], ["enlist", "listen", "silent"]], f"Got {got}"
      - name: no anagrams at all
        code: |
          assert anagram_groups(["one", "two", "six"]) == [], f"Got {anagram_groups(['one', 'two', 'six'])}"
          assert anagram_groups([]) == []
      - name: same letters, different counts are not anagrams
        code: |
          got = anagram_groups(["aab", "abb", "bab", "aba"])
          assert got == [["aab", "aba"], ["abb", "bab"]], f"aab and abb use the same letters but different counts. Got {got}"
      - name: fast on many words
        code: |
          import random
          random.seed(1)
          many = ["".join(random.choice("abcdef") for _ in range(6)) for _ in range(20000)]
          groups = anagram_groups(many)
          assert all(len(g) >= 2 for g in groups)
    hints:
      - "Sorting a word's letters gives the same result for every anagram: `sorted(\"listen\")` and `sorted(\"silent\")` are both `['e', 'i', 'l', 'n', 's', 't']`."
      - "A list can't be a dictionary key, but a string or tuple can: use `\"\".join(sorted(word))` as the key, and group words under it."
      - "Finally: `groups = [sorted(g) for g in families.values() if len(g) >= 2]`, then sort `groups` (lists compare item by item, so sorting a list of groups orders them by first word)."
    solution: |
      def anagram_groups(words):
          """Group words into anagram families of two or more, sorted."""
          families = {}
          for word in words:
              key = "".join(sorted(word))
              if key not in families:
                  families[key] = []
              families[key].append(word)
          groups = [sorted(g) for g in families.values() if len(g) >= 2]
          return sorted(groups)
    explanation: |
      The breakthrough is choosing the right key. Comparing every word with every other word would take n² comparisons (200 million for 20,000 words). Instead, every word is turned into a **canonical form** (its letters sorted), which all anagrams share, and the grouping pattern from Lesson 3.6 does the rest in a single pass. The key has to be a string (or tuple), not a list, because dictionary keys must be immutable. Picking a representation that makes the question easy is a theme that runs all the way through computer science.

commonMistakes:
  - title: Putting the filter in the wrong place
    explanation: |
      A filtering `if` goes at the **end** and has no `else`. A value-choosing `if ... else` goes at the **front**. `[x for x in nums if x > 0 else 0]` is a SyntaxError.
    wrong: |
      [n for n in nums if n > 0 else 0]
    right: |
      [n if n > 0 else 0 for n in nums]   # keep all, replace negatives
      [n for n in nums if n > 0]          # keep only positives
  - title: Using a comprehension for side effects
    explanation: |
      A comprehension builds a collection. To just do something for each item, use a `for` loop.
    wrong: |
      [print(name) for name in names]
    right: |
      for name in names:
          print(name)
  - title: Writing an unreadable comprehension
    explanation: |
      If a comprehension needs nested loops, multiple conditions and a conditional expression, split it up or write the loop. Clever but unreadable code is a bug waiting to happen.
  - title: Choosing a list for frequent membership tests
    explanation: |
      Checking `x in big_list` inside a loop is slow. If membership is the main question, build a set once and check against that.

summary:
  - "`[expr for x in items]` builds a list (transform); add `if test` at the end to filter."
  - "`a if test else b` chooses between two values; at the front of a comprehension it keeps every item but transforms them differently."
  - "`{expr for x in items}` builds a set; `{k: v for x in items}` builds a dictionary."
  - "Nested comprehensions build grids; two `for` clauses flatten nested lists."
  - "`any`, `all` and `sum` with generator expressions answer questions about collections concisely."
  - "Choose a structure by the operations you need: lists for ordered sequences, tuples for fixed records, dicts for lookup by key, sets for uniqueness and fast membership."
