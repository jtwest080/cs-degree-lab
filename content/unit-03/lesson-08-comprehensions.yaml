quiz:
  - type: mcq
    question: "What is `[x * 10 for x in range(4) if x % 2 == 1]`?"
    options: ["[0, 20]", "[10, 30]", "[0, 10, 20, 30]", "[1, 3]"]
    answer: 1
    explanation: Only the odd values 1 and 3 pass the filter, and each is multiplied by 10.
  - type: mcq
    question: "What is `[\"big\" if n > 5 else \"small\" for n in [3, 8]]`?"
    options: ["['small', 'big']", "['big']", "['small']", "A SyntaxError"]
    answer: 0
    explanation: The conditional expression at the front chooses a value for every item.
  - type: mcq
    question: "What type does `{n % 3 for n in range(10)}` produce, and how many items does it have?"
    options: ["A list with 10 items", "A set with 3 items", "A dictionary with 3 items", "A set with 10 items"]
    answer: 1
    explanation: Curly braces with a single expression make a set, and n % 3 only takes the values 0, 1 and 2.
  - type: mcq
    question: "What is `[x for row in [[1, 2], [3, 4]] for x in row]`?"
    options: ["[[1, 2], [3, 4]]", "[1, 2, 3, 4]", "[1, 3, 2, 4]", "[3, 7]"]
    answer: 1
    explanation: The two for clauses run like nested loops in reading order, flattening row by row.
  - type: mcq
    question: "What does `all(len(w) > 2 for w in [\"cat\", \"ox\", \"emu\"])` return?"
    options: ["True", "False", "[True, False, True]", "2"]
    answer: 1
    explanation: Not every word is longer than 2 letters ("ox" isn't), so all returns False.
  - type: mcq
    question: You need to record which usernames are already taken and check new sign-ups against them quickly. Which structure fits best?
    options: ["A list", "A tuple", "A set", "A list of tuples"]
    answer: 2
    explanation: The main operation is a membership test on unique items, which is exactly what sets are fast at.
  - type: code
    question: |
      Write `initial_index(words)` that returns a dictionary mapping each **first letter** (lowercase) to a sorted list of the words starting with it. Use a comprehension for the final dictionary if you like. `initial_index(["Bob", "ann", "bea"])` returns `{"a": ["ann"], "b": ["Bob", "bea"]}`.
    starter: |
      def initial_index(words):
          pass
    tests:
      - name: groups words by first letter
        code: |
          got = initial_index(["Bob", "ann", "bea"])
          assert got == {"a": ["ann"], "b": ["Bob", "bea"]}, f"Got {got}"
          assert initial_index([]) == {}
          assert initial_index(["zed", "Zoe", "amy"]) == {"z": ["Zoe", "zed"], "a": ["amy"]}, "Sort each list; capitals sort before lowercase letters."
    solution: |
      def initial_index(words):
          letters = {w[0].lower() for w in words}
          return {letter: sorted(w for w in words if w[0].lower() == letter) for letter in letters}
