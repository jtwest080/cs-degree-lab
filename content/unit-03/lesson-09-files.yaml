id: u3-files
title: Reading and Writing Files
minutes: 55
objective: |
  Make data outlive your program: **open**, **read** and **write** text files safely with `with`, process files line by line, parse **CSV** data into lists and dictionaries, and handle missing files gracefully.
outcomes:
  - Explain why programs need files, and what a file path is
  - Open files for reading, writing and appending, using `with`
  - Read a whole file, or loop over it line by line, removing newlines
  - Write text to a file, including the newlines
  - Parse comma-separated (CSV) lines into records, skipping a header row
  - Catch `FileNotFoundError` and clean up messy input lines

prelude: |
  # Sample files for this lesson, recreated fresh every time you run.
  with open("poem.txt", "w") as _f:
      _f.write("Tyger Tyger, burning bright,\nIn the forests of the night;\nWhat immortal hand or eye,\nCould frame thy fearful symmetry?\n")
  with open("temps.txt", "w") as _f:
      _f.write("# daily max temperatures\n18.5\n21.0\n\n19.5\n# missing reading on day 4\n24.0\n  22.5  \n")
  with open("scores.csv", "w") as _f:
      _f.write("name,subject,score\nAda,maths,92\nAlan,maths,85\nAda,physics,88\nGrace,maths,97\nAlan,physics,79\nGrace,physics,91\n")
  with open("stock.csv", "w") as _f:
      _f.write("item,quantity\napples,12\npears,5\nkiwis,20\n")
  import os as _os
  for _name in ["notes.txt", "squares.txt", "report.txt", "log.txt", "new_stock.csv", "missing.txt"]:
      if _os.path.exists(_name):
          _os.remove(_name)
  del _f, _os, _name

sections:
  - heading: Why files?
    body: |
      Every variable you've ever created lives in the computer's **memory** (RAM), and Lesson 1.5 explained that RAM is **volatile**: when the program ends, or the power goes off, it's all gone. Your progress in a game, a document you're writing, a spreadsheet of results: none of that could survive if programs only used memory.

      **Files** live in **storage** (an SSD or hard disk), which keeps its contents without power. A file is a named sequence of bytes. In this lesson we'll work with **text files**, where the bytes are characters (encoded with UTF-8, Lesson 1.2), arranged in lines separated by newline characters `\n`.

      Files are also how programs share data: one program writes a file, another reads it. Most real data you'll ever process (logs, exports from spreadsheets, scientific measurements) arrives as files.

      > **Note:** In this course, your code runs inside your browser, which provides a small pretend file system. Each lesson creates some sample files for you before your code runs (here: `poem.txt`, `temps.txt`, `scores.csv` and `stock.csv`), and files you write are wiped when the page reloads. The Python is exactly the same as on a real computer, where files would stay on disk.

      A file's location is given by a **path**. A bare name like `"poem.txt"` means "in the current folder". On your own computer you might see paths like `"data/scores.csv"` or `"C:/Users/ada/notes.txt"`.

  - heading: Opening and reading
    body: |
      To use a file, you **open** it, which gives you a **file object** to read from or write to. The safest way is with a **`with` statement**:

      ```python
      with open("poem.txt") as f:
          text = f.read()
      print(text)
      ```

      `open("poem.txt")` opens the file for reading. `as f` names the file object `f`. Inside the indented block, `f.read()` reads the **entire** file into one string. When the block ends, Python automatically **closes** the file, even if an error happened inside the block. Closing matters: it releases the file for other programs, and makes sure everything you wrote has actually been saved.

      > **Analogy:** `with` is like borrowing a library book with an automatic return: whatever happens while you're reading, the book goes back on the shelf when you leave.

      Usually you want to process a file **line by line**. A file object can be looped over directly:

      ```python
      with open("poem.txt") as f:
          for line in f:
              print(line.strip())
      ```

      Each `line` is a string that **includes its newline character** at the end (`"Tyger Tyger, burning bright,\n"`). That's why we `strip()` it: otherwise `print` would add a second newline and you'd see blank lines between every line. Looping line by line also means Python only holds one line in memory at a time, so it works on files far bigger than your RAM.

      Other ways to read:

      | Code | Gives |
      |---|---|
      | `f.read()` | the whole file as one string |
      | `f.read().splitlines()` | a list of lines, without the newlines |
      | `f.readlines()` | a list of lines, each still ending in `\n` |
      | `for line in f:` | one line at a time, each ending in `\n` |

  - heading: Writing and appending
    body: |
      To write, open the file with a **mode** as the second argument:

      | Mode | Meaning |
      |---|---|
      | `"r"` | read (the default) |
      | `"w"` | write: creates the file, or **empties it first** if it exists |
      | `"a"` | append: adds to the end, creating the file if needed |

      > **Warning:** Opening an existing file with `"w"` erases its contents immediately, before you've written anything. Use `"a"` to add to a file.

      Then use `f.write(text)`:

      ```python
      with open("notes.txt", "w") as f:
          f.write("First line\n")
          f.write("Second line\n")
      ```

      Unlike `print`, **`write` doesn't add a newline**: you must include `\n` yourself. It also only accepts strings, so convert numbers with `str()` or an f-string. Alternatively, `print` can write to a file: `print("First line", file=f)` adds the newline for you.

  - heading: Structured data and CSV
    body: |
      A very common file format is **CSV** (comma-separated values), the format spreadsheets export. Each line is a record, with fields separated by commas, and the first line is usually a **header** naming the columns:

      ```text
      name,subject,score
      Ada,maths,92
      Alan,maths,85
      ```

      Reading it combines everything from this unit: loop over the lines (Lesson 3.1), `strip` and `split(",")` each one (Lesson 3.3), unpack the fields (Lesson 3.5), convert numbers, and store the records in lists or dictionaries (Lesson 3.6):

      ```python
      records = []
      with open("scores.csv") as f:
          header = f.readline()            # read and skip the first line
          for line in f:                   # the loop continues from line 2
              name, subject, score = line.strip().split(",")
              records.append({"name": name, "subject": subject, "score": int(score)})
      ```

      `f.readline()` reads just one line. After it, the `for` loop carries on from where reading left off: a file object remembers its position, like a bookmark.

      Real CSV files can contain commas *inside* fields (in quotes), which simple splitting gets wrong. Python's standard library has a `csv` module that handles all of that; for the clean files in this course, `split(",")` is enough, and knowing how to do it by hand makes the module easy to understand later.

      Writing CSV is the reverse: `",".join(fields)` plus `"\n"` for each record.

  - heading: When things go wrong
    body: |
      Files live outside your program, so things outside your control can go wrong. The most common is that the file doesn't exist:

      ```text
      FileNotFoundError: [Errno 44] No such file or directory: 'missing.txt'
      ```

      You handle it with `try`/`except`, exactly as you handled bad input in Lesson 2.9:

      ```python
      try:
          with open("settings.txt") as f:
              settings = f.read()
      except FileNotFoundError:
          settings = ""        # fall back to defaults
      ```

      Real-world files are also **messy**: blank lines, stray spaces, comment lines, a bad value in one row. Robust file-reading code cleans each line and skips or reports the bad ones instead of crashing on the first surprise. The usual shape is:

      ```python
      for line in f:
          line = line.strip()
          if line == "" or line.startswith("#"):
              continue                # skip blanks and comments
          ...                         # process the real data
      ```

      > **Key idea:** Programs are only as reliable as their handling of bad input. Assume every file might be missing, empty or messy, and decide what your program should do in each case.

examples:
  - title: Reading a whole file, and line by line
    intro: "`poem.txt` has been created for you. Compare the two ways of reading it."
    code: |
      with open("poem.txt") as f:
          text = f.read()
      print(len(text), "characters")
      print(repr(text[:30]))

      with open("poem.txt") as f:
          for number, line in enumerate(f, start=1):
              print(number, line.strip())
    output: |
      119 characters
      'Tyger Tyger, burning bright,\nI'
      1 Tyger Tyger, burning bright,
      2 In the forests of the night;
      3 What immortal hand or eye,
      4 Could frame thy fearful symmetry?
    lines:
      - line: 1-2
        note: "`read()` gives the whole file as one string. The file is closed automatically when the `with` block ends."
      - line: 4
        note: "`repr` shows the string as Python would write it, revealing the `\\n` newline characters hidden in the text."
      - line: 6-8
        note: "Looping over the file gives one line at a time; `enumerate` numbers them. `strip()` removes each line's trailing newline."
  - title: Writing, appending and reading back
    intro: "Mode `\"w\"` creates (or empties) a file; `\"a\"` adds to the end."
    code: |
      with open("notes.txt", "w") as f:
          f.write("Buy milk\n")
          f.write("Call Ada\n")

      with open("notes.txt", "a") as f:
          print("Learn Python", file=f)
          for n in range(1, 3):
              f.write(f"Item {n}\n")

      with open("notes.txt") as f:
          lines = f.read().splitlines()
      print(lines)
    output: |
      ['Buy milk', 'Call Ada', 'Learn Python', 'Item 1', 'Item 2']
    lines:
      - line: 1-3
        note: "`write` needs the newline written explicitly."
      - line: 5-8
        note: "Append mode keeps what's already there. `print(..., file=f)` writes to the file and adds the newline for you; f-strings make it easy to write numbers."
      - line: 10-11
        note: "`read().splitlines()` gives a clean list of lines without newline characters."
  - title: Parsing a CSV file
    intro: "Turn `scores.csv` into records, then summarise them with a dictionary."
    code: |
      records = []
      with open("scores.csv") as f:
          header = f.readline().strip().split(",")
          for line in f:
              name, subject, score = line.strip().split(",")
              records.append({"name": name, "subject": subject, "score": int(score)})
      print(header)
      print(len(records), "records; first:", records[0])

      totals = {}
      for r in records:
          totals[r["name"]] = totals.get(r["name"], 0) + r["score"]
      for name, total in sorted(totals.items()):
          print(f"{name}: {total}")
    output: |
      ['name', 'subject', 'score']
      6 records; first: {'name': 'Ada', 'subject': 'maths', 'score': 92}
      Ada: 180
      Alan: 164
      Grace: 188
    lines:
      - line: 3
        note: "Read the header line on its own. The `for` loop below then starts from the second line."
      - line: 5
        note: "Clean the line, split on commas, and unpack the three fields."
      - line: 6
        note: "Each record becomes a dictionary with named fields. The score is converted to an int; everything read from a file starts as text."
      - line: 10-12
        note: "The counting pattern from Lesson 3.6, adding scores instead of 1s."
  - title: Messy input and missing files
    intro: "`temps.txt` has comments, a blank line and stray spaces."
    code: |
      temps = []
      with open("temps.txt") as f:
          for line in f:
              line = line.strip()
              if line == "" or line.startswith("#"):
                  continue
              temps.append(float(line))
      print(temps)
      print("Average:", round(sum(temps) / len(temps), 2))

      try:
          with open("missing.txt") as f:
              print(f.read())
      except FileNotFoundError:
          print("missing.txt not found, carrying on")
    output: |
      [18.5, 21.0, 19.5, 24.0, 22.5]
      Average: 21.1
      missing.txt not found, carrying on
    lines:
      - line: 4
        note: "Clean the line first: this removes the newline and the stray spaces around `22.5`."
      - line: 5-6
        note: "Skip blank lines and comment lines."
      - line: 7
        note: "Only real data reaches this line."
      - line: 11-15
        note: "Opening a file that doesn't exist raises `FileNotFoundError`, which we catch and handle instead of crashing."

playground:
  prompt: |
    Write your own file: open `"diary.txt"` in `"w"` mode, write a few lines, then read it back and print each line with its length. Then try opening it again in `"w"` mode without writing anything, and read it once more. What happened?
  code: |
    with open("diary.txt", "w") as f:
        f.write("Today I learned about files.\n")
        f.write("Tomorrow: more files.\n")

    with open("diary.txt") as f:
        for line in f:
            print(len(line.strip()), line.strip())

exercises:
  - id: file-stats
    title: File statistics
    difficulty: 1
    prompt: |
      Write `file_stats(filename)` that returns a tuple `(lines, words, characters)` for a text file, where `characters` counts every character including newlines (the length of the whole file as a string).

      For `poem.txt` (already created for you) it should return `(4, 20, 119)`.
    starter: |
      def file_stats(filename):
          pass
    tests:
      - name: poem.txt
        code: |
          assert file_stats("poem.txt") == (4, 20, 119), f"Got {file_stats('poem.txt')}"
      - name: another file
        code: |
          with open("test_stats.txt", "w") as f:
              f.write("one two\nthree\n\nfour five six\n")
          assert file_stats("test_stats.txt") == (4, 6, 29), f"Got {file_stats('test_stats.txt')}"
      - name: empty file
        code: |
          with open("empty.txt", "w") as f:
              pass
          assert file_stats("empty.txt") == (0, 0, 0), f"Got {file_stats('empty.txt')}"
    hints:
      - "Read the whole file once: `text = f.read()` inside a `with open(filename) as f:` block."
      - "Characters: `len(text)`. Words: `len(text.split())`. Lines: `len(text.splitlines())`."
    solution: |
      def file_stats(filename):
          """Return (lines, words, characters) for a text file."""
          with open(filename) as f:
              text = f.read()
          return len(text.splitlines()), len(text.split()), len(text)
    explanation: |
      Reading the whole file into one string lets you reuse the string tools from Lesson 3.3. `splitlines()` handles the last line correctly whether or not it ends with a newline, and a blank line still counts as a line. This is what the Unix command `wc` (word count) does, a tool programmers have used since the 1970s.

  - id: read-numbers
    title: Read numbers safely
    difficulty: 2
    prompt: |
      Write `read_numbers(filename)` that returns a list of the numbers (as floats) in a file with one number per line, where:

      - blank lines and lines starting with `#` are skipped,
      - spaces around numbers are ignored,
      - if the file **doesn't exist**, it returns an empty list instead of crashing.

      For `temps.txt` (already created for you) it should return `[18.5, 21.0, 19.5, 24.0, 22.5]`.
    starter: |
      def read_numbers(filename):
          numbers = []
          return numbers
    tests:
      - name: temps.txt
        code: |
          assert read_numbers("temps.txt") == [18.5, 21.0, 19.5, 24.0, 22.5], f"Got {read_numbers('temps.txt')}"
      - name: another messy file
        code: |
          with open("test_nums.txt", "w") as f:
              f.write("\n\n  7\n#comment\n-2.5\n\n")
          assert read_numbers("test_nums.txt") == [7.0, -2.5], f"Got {read_numbers('test_nums.txt')}"
      - name: missing file gives an empty list
        code: |
          assert read_numbers("no_such_file.txt") == [], "Catch FileNotFoundError and return []."
    hints:
      - "Put the whole `with open(...)` block inside a `try:`, with `except FileNotFoundError: return []`."
      - "For each line: `line = line.strip()`, then `continue` if it's empty or `line.startswith(\"#\")`."
      - "Otherwise `numbers.append(float(line))`."
    solution: |
      def read_numbers(filename):
          """Return the numbers in filename, skipping blanks and # comments."""
          numbers = []
          try:
              with open(filename) as f:
                  for line in f:
                      line = line.strip()
                      if line == "" or line.startswith("#"):
                          continue
                      numbers.append(float(line))
          except FileNotFoundError:
              return []
          return numbers
    explanation: |
      Cleaning first (`strip`) and then filtering out the lines that aren't data is the standard shape of robust file reading. The `try` covers the `open`, because that's where `FileNotFoundError` happens. A program that reads a settings or data file usually behaves exactly like this: use the file if it's there, fall back sensibly if not.

  - id: write-table
    title: Write a table
    difficulty: 2
    prompt: |
      Write `save_squares(filename, n)` that writes a file with one line for each number from 1 to `n`, in this exact format (shown for n = 3):

      ```text
      1 squared is 1
      2 squared is 4
      3 squared is 9
      ```

      Each line, including the last, ends with a newline. Calling it again should **replace** the file's contents, not add to them. The function returns nothing.
    starter: |
      def save_squares(filename, n):
          pass
    tests:
      - name: writes the right lines
        code: |
          save_squares("squares.txt", 3)
          with open("squares.txt") as f:
              content = f.read()
          assert content == "1 squared is 1\n2 squared is 4\n3 squared is 9\n", f"The file contained:\n{content!r}"
      - name: replaces instead of appending
        code: |
          save_squares("squares.txt", 5)
          save_squares("squares.txt", 2)
          with open("squares.txt") as f:
              content = f.read()
          assert content == "1 squared is 1\n2 squared is 4\n", f"After writing twice, the file contained:\n{content!r}"
      - name: n = 0 makes an empty file
        code: |
          save_squares("squares.txt", 0)
          with open("squares.txt") as f:
              assert f.read() == ""
    hints:
      - "Open with mode `\"w\"`, which empties the file first."
      - "Loop `for i in range(1, n + 1):` and `f.write(f\"{i} squared is {i * i}\\n\")`. Don't forget the `\\n`."
    solution: |
      def save_squares(filename, n):
          """Write lines 'i squared is i*i' for i = 1..n to filename."""
          with open(filename, "w") as f:
              for i in range(1, n + 1):
                  f.write(f"{i} squared is {i * i}\n")
    explanation: |
      Mode `"w"` starts a fresh file each time, which is why calling the function twice doesn't double the content. Forgetting `\n` would run every entry together on one line, since `write` adds nothing of its own. With n = 0 the loop never runs, but opening with `"w"` still creates an empty file.

  - id: load-scores
    title: Load a CSV gradebook
    difficulty: 2
    prompt: |
      `scores.csv` (already created) looks like this:

      ```text
      name,subject,score
      Ada,maths,92
      Alan,maths,85
      ...
      ```

      Write:

      - `load_scores(filename)`: returns a dictionary mapping each name to a **list** of their scores (as ints), in file order. Skip the header line.
      - `averages(scores)`: takes that dictionary and returns a new dictionary mapping each name to their average score, rounded to 1 decimal place.

      ```python
      s = load_scores("scores.csv")
      s["Ada"]          # [92, 88]
      averages(s)       # {'Ada': 90.0, 'Alan': 82.0, 'Grace': 94.0}
      ```
    starter: |
      def load_scores(filename):
          scores = {}
          return scores


      def averages(scores):
          pass
    tests:
      - name: loads scores.csv
        code: |
          s = load_scores("scores.csv")
          assert s == {"Ada": [92, 88], "Alan": [85, 79], "Grace": [97, 91]}, f"Got {s}"
      - name: header is skipped and scores are ints
        code: |
          s = load_scores("scores.csv")
          assert "name" not in s, "Skip the header line."
          assert all(isinstance(x, int) for v in s.values() for x in v), "Convert scores to int."
      - name: averages
        code: |
          got = averages(load_scores("scores.csv"))
          assert got == {"Ada": 90.0, "Alan": 82.0, "Grace": 94.0}, f"Got {got}"
          assert averages({"X": [1, 2]}) == {"X": 1.5}
      - name: another file
        code: |
          with open("test_scores.csv", "w") as f:
              f.write("name,subject,score\nZoe,art,70\n")
          got = load_scores("test_scores.csv")
          assert got == {"Zoe": [70]}, f"For a file with one row (Zoe,art,70) you returned {got}"
    hints:
      - "Skip the header with `f.readline()` before the loop."
      - "Split each line: `name, subject, score = line.strip().split(\",\")`. Then group: if `name` isn't a key yet, give it `[]`, and append `int(score)`."
      - "`averages` fits in a dictionary comprehension: `{name: round(sum(v) / len(v), 1) for name, v in scores.items()}`."
    solution: |
      def load_scores(filename):
          """Map each name in a name,subject,score CSV to a list of scores."""
          scores = {}
          with open(filename) as f:
              f.readline()  # skip the header
              for line in f:
                  name, subject, score = line.strip().split(",")
                  if name not in scores:
                      scores[name] = []
                  scores[name].append(int(score))
          return scores


      def averages(scores):
          """Map each name to their average score, to 1 decimal place."""
          return {name: round(sum(v) / len(v), 1) for name, v in scores.items()}
    explanation: |
      This is the grouping pattern from Lesson 3.6 with a file as the data source. Separating **loading** (turning a file into Python data) from **processing** (calculating averages) is good design: `averages` doesn't care where the data came from, so it's easy to test on its own, and the loader can be reused for other calculations. The unit project builds on exactly this split.

  - id: update-stock
    title: Update the stock file
    difficulty: 3
    prompt: |
      A shop keeps its stock in `stock.csv` (already created):

      ```text
      item,quantity
      apples,12
      pears,5
      kiwis,20
      ```

      Write `apply_sales(stock_file, sales, out_file)` where `sales` is a list of `(item, amount)` tuples. It should:

      1. read the stock file into a dictionary,
      2. subtract each sale from that item's quantity, but **never below 0**, and ignore sales of items not in stock,
      3. write the updated stock to `out_file` in the same CSV format, with the header and the items in their original order,
      4. return a sorted list of the items whose quantity is now **0**.

      ```python
      apply_sales("stock.csv", [("pears", 3), ("apples", 20), ("plums", 1)], "new_stock.csv")
      # returns ['apples'], and new_stock.csv contains:
      # item,quantity
      # apples,0
      # pears,2
      # kiwis,20
      ```
    starter: |
      def apply_sales(stock_file, sales, out_file):
          stock = {}
          return []
    tests:
      - name: returns sold-out items
        code: |
          got = apply_sales("stock.csv", [("pears", 3), ("apples", 20), ("plums", 1)], "new_stock.csv")
          assert got == ["apples"], f"Got {got}"
      - name: writes the updated file
        code: |
          apply_sales("stock.csv", [("pears", 3), ("apples", 20), ("plums", 1)], "new_stock.csv")
          with open("new_stock.csv") as f:
              content = f.read()
          assert content == "item,quantity\napples,0\npears,2\nkiwis,20\n", f"new_stock.csv contained:\n{content!r}"
      - name: several sales of the same item
        code: |
          got = apply_sales("stock.csv", [("kiwis", 5), ("kiwis", 15), ("pears", 5)], "new_stock.csv")
          assert got == ["kiwis", "pears"], f"Got {got}"
          with open("new_stock.csv") as f:
              assert f.read() == "item,quantity\napples,12\npears,0\nkiwis,0\n"
      - name: original file is untouched
        code: |
          apply_sales("stock.csv", [("apples", 1)], "new_stock.csv")
          with open("stock.csv") as f:
              assert f.read() == "item,quantity\napples,12\npears,5\nkiwis,20\n", "Write to out_file, not stock_file."
    hints:
      - "Read: skip the header, then for each line `item, qty = line.strip().split(\",\")` and `stock[item] = int(qty)`. Dictionaries keep insertion order, so the original order is preserved."
      - "Apply: `for item, amount in sales:` and, only `if item in stock`, set `stock[item] = max(0, stock[item] - amount)`."
      - "Write: open `out_file` with `\"w\"`, write `\"item,quantity\\n\"`, then one `f\"{item},{qty}\\n\"` line per item. Finally return `sorted(item for item, qty in stock.items() if qty == 0)`."
    solution: |
      def apply_sales(stock_file, sales, out_file):
          """Apply (item, amount) sales to a stock CSV; write the result; return sold-out items."""
          stock = {}
          with open(stock_file) as f:
              f.readline()  # header
              for line in f:
                  item, qty = line.strip().split(",")
                  stock[item] = int(qty)

          for item, amount in sales:
              if item in stock:
                  stock[item] = max(0, stock[item] - amount)

          with open(out_file, "w") as f:
              f.write("item,quantity\n")
              for item, qty in stock.items():
                  f.write(f"{item},{qty}\n")

          return sorted(item for item, qty in stock.items() if qty == 0)
    explanation: |
      This is the shape of countless real programs: **read** a file into a data structure, **update** the data in memory, **write** it back out. The dictionary gives fast lookup by item name, and because dictionaries remember insertion order, writing them out keeps the file's original order. Writing to a *separate* output file, rather than overwriting the input, is a good safety habit: if something goes wrong halfway, the original data is still intact. Databases (Unit 12) are, at heart, very sophisticated versions of this read-update-write cycle.

commonMistakes:
  - title: Forgetting that lines end with a newline
    explanation: |
      Each line read from a file includes `\n`. Strip it before comparing, splitting or converting, or you'll get doubled blank lines and values like `"92\n"`.
    wrong: |
      for line in f:
          if line == "done":    # never true: the line is "done\n"
    right: |
      for line in f:
          if line.strip() == "done":
  - title: Forgetting newlines when writing
    explanation: |
      `write` writes exactly what you give it. Add `\n` yourself, or use `print(..., file=f)`.
    wrong: |
      f.write("line one")
      f.write("line two")   # file contains "line oneline two"
    right: |
      f.write("line one\n")
      f.write("line two\n")
  - title: Opening with "w" when you meant to add
    explanation: |
      Mode `"w"` empties the file as soon as it's opened. Use `"a"` to append to existing contents.
  - title: Treating numbers in files as numbers
    explanation: |
      Everything read from a text file is a string. Convert with `int()` or `float()` before doing arithmetic.
    wrong: |
      total += line.strip()      # TypeError: int + str
    right: |
      total += int(line.strip())
  - title: Not skipping the header row
    explanation: |
      A CSV header like `name,score` will crash `int(score)`. Read it with `f.readline()` before looping over the data.

summary:
  - "Files keep data after a program ends. Open them with `with open(path, mode) as f:`, which closes the file automatically."
  - "Mode `\"r\"` reads (the default), `\"w\"` creates or empties then writes, `\"a\"` appends."
  - "`f.read()` gives the whole file; `for line in f:` gives one line at a time, each ending in `\\n`, so `strip()` it."
  - "`f.write(text)` needs strings and explicit newlines; `print(..., file=f)` adds the newline for you."
  - "CSV: skip the header with `f.readline()`, then `strip().split(\",\")` each line and convert the fields."
  - "Catch `FileNotFoundError`, and skip blank or comment lines, so messy or missing files don't crash your program."
next: |
  That completes the toolkit of Unit 3: lists, strings, tuples, dictionaries, sets, comprehensions and files. Put it all together in the **unit project**, a gradebook analyser that reads a CSV file and writes a report. Then **Unit 4** turns from *storing* data to *solving problems* with it: a method for attacking new problems, searching and sorting algorithms, and recursion.

quiz:
  - type: mcq
    question: Why do programs need files at all?
    options:
      - Files are faster than variables
      - Memory is volatile, so data in variables is lost when the program ends
      - Python can't store more than 100 variables
      - Files use less space than memory
    answer: 1
    explanation: RAM is cleared when the program stops; files in storage persist and can be shared between programs.
  - type: mcq
    question: What is the main benefit of `with open(...) as f:`?
    options:
      - It makes reading faster
      - The file is closed automatically when the block ends, even after an error
      - It creates the file if it doesn't exist
      - It reads the whole file into memory
    answer: 1
    explanation: with guarantees the file is closed, which releases it and ensures written data is saved.
  - type: mcq
    question: "A file contains `5\\n7\\n`. What does this print?\n\n```python\nwith open(\"n.txt\") as f:\n    for line in f:\n        print(line)\n```"
    options: ["5 and 7 on consecutive lines", "5, a blank line, 7, a blank line", "57", "An error"]
    answer: 1
    explanation: Each line keeps its \\n, and print adds another. strip() the line to avoid the blank lines.
  - type: mcq
    question: "`notes.txt` contains 3 lines. You run `open(\"notes.txt\", \"w\")` and close it without writing. What does the file contain?"
    options: ["The original 3 lines", "Nothing: it's now empty", "An error is raised", "A single blank line"]
    answer: 1
    explanation: Mode "w" empties an existing file as soon as it's opened.
  - type: mcq
    question: "Reading a CSV line `\"Ada,92\\n\"`, which code gives the score as a number?"
    options:
      - "line.split(\",\")[1]"
      - "int(line.split(\",\")[1])"
      - "line[4:]"
      - "int(line)"
    answer: 1
    explanation: Split on the comma, take the second field, and convert it. int() tolerates the trailing newline.
  - type: mcq
    question: Which error should you catch to handle a file that doesn't exist?
    options: ["ValueError", "KeyError", "FileNotFoundError", "IndexError"]
    answer: 2
    explanation: Opening a missing file for reading raises FileNotFoundError.
  - type: code
    question: |
      Write `longest_line(filename)` that returns the longest line in a file, **without** its newline. If several lines tie, return the first. For `poem.txt` it returns `"Could frame thy fearful symmetry?"`.
    starter: |
      def longest_line(filename):
          pass
    tests:
      - name: finds the longest line
        code: |
          assert longest_line("poem.txt") == "Could frame thy fearful symmetry?", f"Got {longest_line('poem.txt')!r}"
          with open("t.txt", "w") as f:
              f.write("abc\nxyz\nab\n")
          assert longest_line("t.txt") == "abc", f"With a tie, return the first. Got {longest_line('t.txt')!r}"
    solution: |
      def longest_line(filename):
          with open(filename) as f:
              lines = f.read().splitlines()
          return max(lines, key=len)
