title: The Gradebook Analyser
brief: |
  Teachers, coaches and managers all keep tables of scores, and they all want the same answers: how is each person doing, how hard was each assignment, and who's on top? In this project you'll build a program that **reads a gradebook from a CSV file**, analyses it with lists, dictionaries and tuples, and **writes a report file**.

  A file called `grades.csv` has been created for you (it's recreated every time you run). Like most real data, it's a bit messy:

  ```text
  student,assignment,score
  Ada,Essay,88
  Ada,Quiz 1,95
  Ada,Quiz 2,90
  Alan,Essay,72
  Alan,Quiz 1,85

  Alan,Quiz 2,78
  Grace,Essay,97
  Grace, Quiz 1 ,92
  Grace,Quiz 2,93
  Tim,Essay,65
  Tim,Quiz 1,58
  Tim,Quiz 2,absent
  ```

  Notice the blank line, the stray spaces around `Quiz 1`, and Tim's `absent`, which isn't a score.

  **Exact requirements** (the tests check these, and also run your functions on other files):

  - `load_grades(filename)` returns a **dictionary of dictionaries**: each student maps to a dictionary of `assignment: score` (scores as ints). Skip the header, skip blank lines, strip spaces around every field, and skip any row whose score isn't a whole number. For the file above, `load_grades("grades.csv")["Tim"]` is `{"Essay": 65, "Quiz 1": 58}`.
  - `student_average(grades, student)` returns that student's average score, rounded to 1 decimal place.
  - `letter_grade(average)` returns `"A"` for 90 and above, `"B"` for 80 to under 90, `"C"` for 70 to under 80, `"D"` for 60 to under 70, and `"F"` below 60.
  - `assignment_stats(grades)` returns a dictionary mapping each assignment to a tuple `(lowest, highest, average)`, with the average rounded to 1 decimal place. Only count students who have a score for that assignment.
  - `top_students(grades, n)` returns a list of the top `n` `(student, average)` tuples, highest average first; equal averages are ordered by name.
  - `write_report(grades, filename)` writes a report in exactly this format (students and assignments in alphabetical order):

    ```text
    GRADEBOOK REPORT
    Students: 4
    Ada: 91.0 (A)
    Alan: 78.3 (C)
    Grace: 94.0 (A)
    Tim: 61.5 (D)
    Assignments:
    Essay: min 65, max 97, average 80.5
    Quiz 1: min 58, max 95, average 82.5
    Quiz 2: min 78, max 93, average 87.0
    Top student: Grace (94.0)
    ```

  - `main()` loads `grades.csv`, writes `report.txt`, and prints `Report written to report.txt`. The last line of the program calls `main()`.

  Every tool you need is in Unit 3. Build and test one function at a time.
prelude: |
  # Creates grades.csv fresh before every run.
  with open("grades.csv", "w") as _f:
      _f.write("student,assignment,score\nAda,Essay,88\nAda,Quiz 1,95\nAda,Quiz 2,90\nAlan,Essay,72\nAlan,Quiz 1,85\n\nAlan,Quiz 2,78\nGrace,Essay,97\nGrace, Quiz 1 ,92\nGrace,Quiz 2,93\nTim,Essay,65\nTim,Quiz 1,58\nTim,Quiz 2,absent\n")
  import os as _os
  if _os.path.exists("report.txt"):
      _os.remove("report.txt")
  del _f, _os
steps:
  - title: Load the file
    body: |
      Write `load_grades` first, and print its result to check it. Open the file with `with`, skip the header with `f.readline()`, then for each line: `strip()` it, skip it if empty, split on commas, strip each field, and check the score with `score.isdigit()` before converting it. Use the grouping pattern from Lesson 3.6, but with a dictionary (not a list) for each student: `grades[student][assignment] = int(score)`.
  - title: Per-student results
    body: |
      `student_average` needs the values of one student's inner dictionary: `grades[student].values()`. `letter_grade` is an `if`/`elif` chain like the ones in Lesson 2.5; test the boundaries (90, 89.9, 60, 59.9).
  - title: Per-assignment results
    body: |
      `assignment_stats` has to turn the data "inside out" (like the column loops of Lesson 3.4): go through every student's scores and group them by assignment first, into a dictionary of lists. Then compute `min`, `max` and the average of each list, and pack them into a tuple.
  - title: Rankings
    body: |
      For `top_students`, build a list of `(student, average)` tuples, sort it with a key that returns `(-average, student)` (as in the leaderboard exercise of Lesson 3.5), and slice off the first `n`.
  - title: Write the report
    body: |
      Build the report as a **list of lines**, then write `"\n".join(lines) + "\n"` to the file in one go. That makes it easy to check: print the same lines while you're developing. Use `sorted(grades)` for alphabetical student order and `sorted(stats)` for assignments. Finally, write `main()` and call it on the last line.
  - title: Test it against other data
    body: |
      The tests run your functions on other files too, so don't hard-code anything about `grades.csv`. Make your own small CSV with `open("mine.csv", "w")` at the top of your program, including a student with no valid scores at all, and check nothing crashes. (A student with no valid scores shouldn't appear in the results.)
checklist:
  - text: load_grades builds a dictionary of dictionaries with int scores
    test: load_grades reads the gradebook
  - text: Messy rows (blank lines, spaces, non-numeric scores) are handled
    test: load_grades handles messy rows
  - text: Student averages and letter grades are correct, including at boundaries
    test: averages and letter grades
  - text: Assignment statistics are correct
    test: assignment statistics
  - text: Top students are ranked correctly, with ties by name
    test: top students
  - text: The report file matches the required format exactly
    test: report file format
  - text: main writes report.txt and says so
    test: main writes the report
  - text: My functions work on other gradebook files, not just grades.csv
    test: works on a different file
  - text: Every function has a docstring
    test: every function has a docstring
  - text: I separated loading data from analysing it, so each function does one job
  - text: I can explain why a dictionary of dictionaries suits this data better than a list of lists
