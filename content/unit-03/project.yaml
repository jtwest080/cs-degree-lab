tests:
  - name: load_grades reads the gradebook
    code: |
      g = load_grades("grades.csv")
      assert isinstance(g, dict), f"load_grades should return a dictionary, got {g!r}"
      assert sorted(g) == ["Ada", "Alan", "Grace", "Tim"], f"Students found: {sorted(g)}"
      assert g["Ada"] == {"Essay": 88, "Quiz 1": 95, "Quiz 2": 90}, f"Ada's grades: {g['Ada']}"
  - name: load_grades handles messy rows
    code: |
      g = load_grades("grades.csv")
      assert g["Grace"] == {"Essay": 97, "Quiz 1": 92, "Quiz 2": 93}, f"Strip the spaces around ' Quiz 1 '. Grace's grades: {g['Grace']}"
      assert g["Tim"] == {"Essay": 65, "Quiz 1": 58}, f"Skip the 'absent' row. Tim's grades: {g['Tim']}"
      assert g["Alan"]["Quiz 2"] == 78, "The row after the blank line should still be read."
  - name: averages and letter grades
    code: |
      g = load_grades("grades.csv")
      for name, want in [("Ada", 91.0), ("Alan", 78.3), ("Grace", 94.0), ("Tim", 61.5)]:
          got = student_average(g, name)
          assert got == want, f"student_average for {name}: got {got}, expected {want}"
      for avg, want in [(95, "A"), (90, "A"), (89.9, "B"), (80, "B"), (79.9, "C"), (70, "C"), (69.9, "D"), (60, "D"), (59.9, "F"), (0, "F")]:
          assert letter_grade(avg) == want, f"letter_grade({avg}) returned {letter_grade(avg)!r}, expected {want!r}"
  - name: assignment statistics
    code: |
      stats = assignment_stats(load_grades("grades.csv"))
      want = {"Essay": (65, 97, 80.5), "Quiz 1": (58, 95, 82.5), "Quiz 2": (78, 93, 87.0)}
      assert stats == want, f"Got {stats}"
  - name: top students
    code: |
      g = load_grades("grades.csv")
      assert top_students(g, 2) == [("Grace", 94.0), ("Ada", 91.0)], f"Got {top_students(g, 2)}"
      assert top_students(g, 10) == [("Grace", 94.0), ("Ada", 91.0), ("Alan", 78.3), ("Tim", 61.5)], f"Got {top_students(g, 10)}"
      tie = {"Zoe": {"A": 80}, "Amy": {"A": 80}, "Bo": {"A": 90}}
      assert top_students(tie, 3) == [("Bo", 90.0), ("Amy", 80.0), ("Zoe", 80.0)], f"Ties go by name. Got {top_students(tie, 3)}"
  - name: report file format
    code: |
      write_report(load_grades("grades.csv"), "test_report.txt")
      with open("test_report.txt") as f:
          got = f.read()
      want = (
          "GRADEBOOK REPORT\n"
          "Students: 4\n"
          "Ada: 91.0 (A)\n"
          "Alan: 78.3 (C)\n"
          "Grace: 94.0 (A)\n"
          "Tim: 61.5 (D)\n"
          "Assignments:\n"
          "Essay: min 65, max 97, average 80.5\n"
          "Quiz 1: min 58, max 95, average 82.5\n"
          "Quiz 2: min 78, max 93, average 87.0\n"
          "Top student: Grace (94.0)\n"
      )
      if got != want:
          got_lines, want_lines = got.split("\n"), want.split("\n")
          for i, (a, b) in enumerate(zip(got_lines, want_lines), start=1):
              assert a == b, f"Line {i} of the report is {a!r} but should be {b!r}"
          assert False, f"The report has {len(got_lines) - 1} lines but should have {len(want_lines) - 1}. It was:\n{got}"
  - name: main writes the report
    code: |
      import os
      assert "Report written to report.txt" in output, f"main() should print 'Report written to report.txt'. Your program printed:\n{output}"
      assert os.path.exists("report.txt"), "main() should create report.txt"
      with open("report.txt") as f:
          assert f.read().startswith("GRADEBOOK REPORT\n"), "report.txt should start with the GRADEBOOK REPORT line."
  - name: works on a different file
    code: |
      with open("other.csv", "w") as f:
          f.write("student,assignment,score\nZed,Lab,50\nZed,Exam,71\n  \nAmy,Lab, 100 \nAmy,Exam,x\nNoah,Lab,n/a\n")
      g = load_grades("other.csv")
      assert g == {"Zed": {"Lab": 50, "Exam": 71}, "Amy": {"Lab": 100}}, f"For another file, load_grades gave {g}. (Noah has no valid scores, so he shouldn't appear.)"
      assert assignment_stats(g) == {"Lab": (50, 100, 75.0), "Exam": (71, 71, 71.0)}, f"Got {assignment_stats(g)}"
      write_report(g, "other_report.txt")
      with open("other_report.txt") as f:
          lines = f.read().splitlines()
      assert lines[1] == "Students: 2" and lines[2] == "Amy: 100.0 (A)" and lines[3] == "Zed: 60.5 (D)", f"Report for other.csv began:\n" + "\n".join(lines[:4])
      assert lines[-1] == "Top student: Amy (100.0)", f"Last line was {lines[-1]!r}"
  - name: every function has a docstring
    code: |
      for fn in [load_grades, student_average, letter_grade, assignment_stats, top_students, write_report, main]:
          assert fn.__doc__ and fn.__doc__.strip(), f"{fn.__name__} has no docstring."
solution: |
  # Unit 3 project: the Gradebook Analyser


  def load_grades(filename):
      """Return {student: {assignment: score}} from a CSV gradebook.

      Skips the header, blank lines and rows whose score isn't a whole number.
      """
      grades = {}
      with open(filename) as f:
          f.readline()  # skip the header
          for line in f:
              line = line.strip()
              if line == "":
                  continue
              fields = [field.strip() for field in line.split(",")]
              if len(fields) != 3:
                  continue
              student, assignment, score = fields
              if not score.isdigit():
                  continue
              if student not in grades:
                  grades[student] = {}
              grades[student][assignment] = int(score)
      return grades


  def student_average(grades, student):
      """Return the student's average score, rounded to 1 decimal place."""
      scores = list(grades[student].values())
      return round(sum(scores) / len(scores), 1)


  def letter_grade(average):
      """Return the letter grade (A to F) for an average."""
      if average >= 90:
          return "A"
      elif average >= 80:
          return "B"
      elif average >= 70:
          return "C"
      elif average >= 60:
          return "D"
      return "F"


  def assignment_stats(grades):
      """Return {assignment: (lowest, highest, average)}."""
      by_assignment = {}
      for scores in grades.values():
          for assignment, score in scores.items():
              if assignment not in by_assignment:
                  by_assignment[assignment] = []
              by_assignment[assignment].append(score)
      return {
          a: (min(s), max(s), round(sum(s) / len(s), 1))
          for a, s in by_assignment.items()
      }


  def top_students(grades, n):
      """Return the top n (student, average) tuples, best first."""
      ranked = [(student, student_average(grades, student)) for student in grades]

      def rank_key(pair):
          student, average = pair
          return (-average, student)

      return sorted(ranked, key=rank_key)[:n]


  def write_report(grades, filename):
      """Write the gradebook report to filename."""
      lines = ["GRADEBOOK REPORT", f"Students: {len(grades)}"]
      for student in sorted(grades):
          avg = student_average(grades, student)
          lines.append(f"{student}: {avg} ({letter_grade(avg)})")
      lines.append("Assignments:")
      stats = assignment_stats(grades)
      for assignment in sorted(stats):
          low, high, avg = stats[assignment]
          lines.append(f"{assignment}: min {low}, max {high}, average {avg}")
      best, best_avg = top_students(grades, 1)[0]
      lines.append(f"Top student: {best} ({best_avg})")
      with open(filename, "w") as f:
          f.write("\n".join(lines) + "\n")


  def main():
      """Analyse grades.csv and write report.txt."""
      grades = load_grades("grades.csv")
      write_report(grades, "report.txt")
      print("Report written to report.txt")


  main()
stretch:
  - "Add a per-student breakdown to the report: each student's scores for every assignment, with `-` where a score is missing."
  - "Weight the assignments: read a second file, `weights.csv`, mapping each assignment to a weight, and compute weighted averages."
  - "Report the students who improved: whose last assignment score is higher than their first."
  - "Write a second output file, `summary.csv`, with one row per student (`student,average,grade`), so the results can be opened in a spreadsheet."
