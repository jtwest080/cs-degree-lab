# Terms introduced in Unit 4. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Algorithm
    definition: A precise, step-by-step method for solving a problem that always finishes, like a recipe a computer can follow.
    lesson: u4-problem-solving
  - term: Pólya's four steps
    definition: "A general method for solving problems: understand the problem, make a plan, carry out the plan, and look back to check and improve."
    lesson: u4-problem-solving
  - term: Pseudocode
    definition: A plan for an algorithm written in plain, structured language rather than a real programming language.
    lesson: u4-problem-solving
  - term: Luhn algorithm
    definition: A checksum used on card numbers that catches most single-digit typing mistakes by doubling every second digit from the right.
    lesson: u4-problem-solving
  - term: Running time
    definition: How long an algorithm takes, usually measured by counting its basic steps as the input grows rather than in seconds.
    lesson: u4-counting-steps
  - term: Growth rate
    definition: How quickly an algorithm's step count increases as the input size n increases, ignoring constant factors.
    lesson: u4-counting-steps
  - term: Big O notation
    definition: "A way of describing an algorithm's growth rate by its dominant term, ignoring constants: a loop over n items is O(n), two nested loops are O(n²)."
    lesson: u4-counting-steps
  - term: Constant time, O(1)
    definition: Takes the same number of steps whatever the input size, like indexing a list or looking up a dictionary key.
    lesson: u4-counting-steps
  - term: Logarithmic time, O(log n)
    definition: Steps grow by one each time the input doubles, as when an algorithm halves the problem at every step.
    lesson: u4-counting-steps
  - term: Linear time, O(n)
    definition: Steps grow in proportion to the input size, such as one loop over every item.
    lesson: u4-counting-steps
  - term: Quadratic time, O(n²)
    definition: Steps grow with the square of the input size, typically from a loop inside a loop. Doubling n makes it four times slower.
    lesson: u4-counting-steps
  - term: Exponential time, O(2ⁿ)
    definition: Steps double each time the input grows by one, as when trying every subset. Only practical for small inputs.
    lesson: u4-counting-steps
  - term: Logarithm
    definition: "log₂ n is how many times you can halve n before reaching 1: log₂ 1,000,000 is about 20."
    lesson: u4-counting-steps
  - term: Hidden loop
    definition: A single line that secretly loops over a whole collection, such as `x in some_list`, `list.index`, `list.count` or a slice.
    lesson: u4-counting-steps
  - term: Worst case
    definition: The input that makes an algorithm take the most steps for its size. Big O usually describes the worst case.
    lesson: u4-counting-steps
  - term: Binary search
    definition: Searching sorted data by repeatedly checking the middle item and discarding the half that can't contain the target. O(log n).
    lesson: u4-binary-search
  - term: Loop invariant
    definition: A statement that is true before and after every pass of a loop, such as "if the target is present, it lies between low and high". Used to reason that a loop is correct.
    lesson: u4-binary-search
  - term: Lower bound
    definition: The first position in a sorted list whose value is at least a target; where the target is, or where it would be inserted.
    lesson: u4-binary-search
  - term: Sorting
    definition: Rearranging items into order, by their values or by a key.
    lesson: u4-simple-sorts
  - term: Selection sort
    definition: A sort that repeatedly finds the smallest remaining item and moves it to the front. Always O(n²).
    lesson: u4-simple-sorts
  - term: Insertion sort
    definition: A sort that takes each item in turn and slides it left into its place among the already sorted items. O(n²), but fast on nearly sorted data.
    lesson: u4-simple-sorts
  - term: In-place
    definition: An algorithm that rearranges the data inside the existing list rather than building a new one.
    lesson: u4-simple-sorts
  - term: Counting sort
    definition: A sort for small whole numbers that counts how many times each value appears and writes them out in order, without comparing items.
    lesson: u4-simple-sorts
  - term: Recursion
    definition: A function solving a problem by calling itself on a smaller version of the same problem.
    lesson: u4-recursion
  - term: Base case
    definition: The simplest input of a recursive function, answered directly without another recursive call. Every recursion needs one to stop.
    lesson: u4-recursion
  - term: Recursive case
    definition: The part of a recursive function that reduces the problem and calls the function again on the smaller version.
    lesson: u4-recursion
  - term: RecursionError
    definition: The error Python raises when recursion goes too deep (by default about 1,000 calls), usually because a base case is missing or never reached.
    lesson: u4-recursion
  - term: Memoisation
    definition: Remembering the results of function calls (for example in a dictionary) so the same input is never computed twice.
    lesson: u4-recursion
  - term: Leap of faith
    definition: The habit of assuming a recursive call on a smaller input already works, and only checking that you combine its answer correctly.
    lesson: u4-recursive-thinking
  - term: Recursive data
    definition: Data that contains smaller pieces of the same shape, such as lists inside lists or folders inside folders.
    lesson: u4-recursive-thinking
  - term: Backtracking
    definition: Building a solution one choice at a time, recursively exploring each option and undoing it to try the next.
    lesson: u4-recursive-thinking
  - term: Towers of Hanoi
    definition: A puzzle of moving a stack of discs between three pegs, a classic recursive problem needing 2ⁿ − 1 moves for n discs.
    lesson: u4-recursive-thinking
  - term: Divide and conquer
    definition: "A strategy that splits a problem into smaller parts, solves each (usually recursively), and combines the answers."
    lesson: u4-merge-sort
  - term: Merge
    definition: Combining two sorted lists into one sorted list by repeatedly taking the smaller front item. O(n).
    lesson: u4-merge-sort
  - term: Merge sort
    definition: A divide-and-conquer sort that splits the list in half, sorts each half recursively and merges them. O(n log n) and stable.
    lesson: u4-merge-sort
  - term: Quicksort
    definition: A divide-and-conquer sort that partitions items around a pivot and sorts each side recursively. Usually O(n log n), O(n²) in its worst case.
    lesson: u4-merge-sort
  - term: Pivot
    definition: The item quicksort compares everything against to split the list into smaller and larger parts.
    lesson: u4-merge-sort
  - term: O(n log n)
    definition: The growth rate of the fastest general comparison sorts, only slightly worse than linear.
    lesson: u4-merge-sort
  - term: Inversion
    definition: A pair of items in the wrong order relative to each other. Counting them measures how unsorted a list is.
    lesson: u4-merge-sort
  - term: Brute force
    definition: Solving a problem by trying every possibility. Simple and certainly correct, but often too slow for large inputs.
    lesson: u4-strategies
  - term: Pruning
    definition: Stopping early on paths in a search that can't possibly lead to a valid or better answer.
    lesson: u4-strategies
  - term: Greedy algorithm
    definition: An algorithm that makes the choice that looks best at each step and never reconsiders it. Fast, but only sometimes optimal.
    lesson: u4-strategies
  - term: Counterexample
    definition: A single specific input showing that a claim (such as "greedy always works") is false.
    lesson: u4-strategies
  - term: Exchange argument
    definition: A proof that a greedy choice is safe, showing that any optimal solution can swap in the greedy choice without getting worse.
    lesson: u4-strategies
  - term: Reference solution
    definition: A simple, obviously correct (often brute-force) solution used to test a faster one by comparing their answers.
    lesson: u4-strategies
  - term: Travelling salesperson problem
    definition: Finding the shortest round trip that visits every city once. No known algorithm is both fast and always optimal.
    lesson: u4-strategies
  - term: Dynamic programming
    definition: Solving a problem by solving each smaller subproblem once, storing the answers and building up. Covered in Unit 8.
    lesson: u4-strategies
