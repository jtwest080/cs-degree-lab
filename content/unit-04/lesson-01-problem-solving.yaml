id: u4-problem-solving
title: A Method for Solving Problems
minutes: 50
objective: |
  Use a repeatable four-step method (**understand, plan, carry out, look back**) to attack programming problems you've never seen before, using worked examples by hand, **decomposition** into functions, **pseudocode**, and tests written before the code.
outcomes:
  - Restate a problem precisely, naming its inputs, outputs and edge cases
  - Work small examples by hand to discover the steps of a solution
  - Break a problem into smaller functions (decomposition)
  - Write a plan in pseudocode before writing Python
  - Write tests before the code, and build a solution in small, tested steps
  - Look back at a working solution to simplify, generalise and check it

sections:
  - heading: Programming is problem solving
    body: |
      By now you know a lot of Python: loops, functions, lists, dictionaries, files. Yet many learners hit a wall at this point. They can read code, and they understand every line of a solution when they see it, but faced with a blank editor and a new problem, they don't know where to start.

      That's because knowing a language and **solving problems** are different skills. Knowing Python is like knowing the rules and pieces of chess; solving problems is knowing how to *play*. The good news is that problem solving can be learned like any other skill, and it starts with having a **method**, so you always know what to do next.

      The method in this lesson comes from the mathematician George Pólya, whose 1945 book *How to Solve It* described four phases:

      1. **Understand** the problem.
      2. **Plan** a solution.
      3. **Carry out** the plan.
      4. **Look back** at the result.

      Beginners usually skip straight to step 3, typing code before they really understand the problem. Experienced programmers spend most of their time in steps 1 and 2, and their code comes out shorter and with fewer bugs.

  - heading: Step 1. Understand the problem
    body: |
      You can't solve a problem you don't understand, and most problems are stated less precisely than they seem. Before writing anything, answer these questions:

      - **What are the inputs?** What types are they? What range of values?
      - **What is the output?** A return value, printed text, a file? In exactly what format?
      - **What are the edge cases?** An empty list, a single item, zero, negative numbers, duplicates, the largest possible input?
      - **Can I restate it in my own words?**

      Then do the single most useful thing in all of problem solving: **work some examples by hand**, on paper, slowly. Choose small inputs, including an edge case, and write down the answer you expect. If you can't solve it by hand, you can't tell a computer how to.

      > **Analogy:** A builder reads the plans and walks the site before ordering any bricks. Ten minutes understanding the job saves days of knocking down walls.

      For example: "Write a function that returns the length of the longest run of increasing numbers in a list." What's a "run"? Do equal neighbours count as increasing? What does an empty list return? Working an example, `[3, 4, 7, 2, 5, 6, 8, 1]`, you find the runs 3-4-7 (length 3), 2-5-6-8 (length 4) and 1 (length 1), so the answer is 4. Doing this by hand, you'll probably notice *how* you did it: you moved along the list, extending the current run while numbers went up and starting a new run when they didn't. That's the algorithm.

  - heading: Step 2. Make a plan
    body: |
      Now decide **how** to solve it, still without writing Python. Useful questions:

      - **Have I seen a similar problem?** Most problems are variations on patterns you know: filter, transform, search, count, group (Unit 3). The longest run is a "track state as you go" problem, like run-length encoding in Lesson 3.3.
      - **Can I break it into smaller problems?** This is **decomposition**: split a big problem into parts that are each easy to solve, often one function per part. "Is this a valid date?" splits into "is this year a leap year?" and "how many days are in this month?".
      - **Can I solve a simpler version first?** Ignore an awkward requirement, solve the rest, then add it back.

      Write the plan as **pseudocode**: structured English that reads like code but ignores Python's exact rules. There's no standard syntax; it just has to be clear to you:

      ```text
      longest_run(numbers):
          if numbers is empty: answer is 0
          best = 1, current = 1
          for each position i from the second item onwards:
              if numbers[i] > numbers[i-1]: current goes up by 1
              otherwise: current goes back to 1
              best = the larger of best and current
          answer is best
      ```

      Pseudocode lets you think about the *logic* without worrying about colons and brackets. If the pseudocode is wrong, it's much cheaper to fix than code.

  - heading: Step 3. Carry out the plan, in small steps
    body: |
      Now translate the plan into Python, but **not all at once**. Write a little, run it, check it, then write a little more. Each step should be small enough that if something breaks, you know exactly which lines caused it.

      A powerful habit is to **write the tests first**, using the examples you worked by hand in step 1 (and the `assert` statements from Lesson 2.9):

      ```python
      assert longest_run([3, 4, 7, 2, 5, 6, 8, 1]) == 4
      assert longest_run([]) == 0
      assert longest_run([5]) == 1
      assert longest_run([3, 3, 3]) == 1      # equal is not increasing
      assert longest_run([1, 2, 3]) == 3
      ```

      Now you have a definition of "done": when every assert passes. This is the idea behind **test-driven development**, a practice used widely in industry (Unit 14).

      With decomposition, build and test the small functions first, then the functions that use them. When a small function is tested, you can rely on it and stop thinking about its insides, the same way you rely on `len` without wondering how it works. That's **abstraction** (Lesson 1.6), applied to your own code.

  - heading: Step 4. Look back
    body: |
      A working program isn't the end. Look back and ask:

      - **Does it handle every edge case?** Run it on the tricky inputs from step 1.
      - **Can I check the result another way?** For example, compare with a slow but obviously correct brute-force version on many random inputs. The tests in this course often do exactly this.
      - **Can it be simpler?** Can a loop become a comprehension, or a chain of `if`s become data (like the tic-tac-toe lines in Lesson 3.4)?
      - **What did I learn?** Is there a pattern here you'll meet again?

      > **Key idea:** When you're stuck, go back a step. Stuck writing code? Your plan is incomplete: go back to pseudocode. Stuck on the plan? You don't understand the problem well enough: go back and work more examples by hand. "Stuck" almost always means you skipped something earlier.

  - heading: Strategies for getting unstuck
    body: |
      | Strategy | How it helps |
      |---|---|
      | Work a smaller example | Patterns are easier to see in 3 items than in 300 |
      | Draw it | Boxes and arrows for lists, grids and references (Lesson 3.4) |
      | Solve a simpler version | Drop a requirement, solve, then add it back |
      | Work backwards | Start from the output and ask what you'd need just before it |
      | Find a related problem | "This is like counting words, but for letters" |
      | Explain it out loud | Describing the problem to someone (or a rubber duck, Lesson 2.9) exposes gaps |
      | Take a break | Your brain keeps working on it; many solutions arrive in the shower |

      The rest of this unit applies this method to the most famous problems in computer science: **searching** and **sorting**. You'll also meet **recursion**, a way of solving problems by breaking them into smaller copies of themselves, which is decomposition taken to its logical extreme.

examples:
  - title: From pseudocode to code
    intro: The longest increasing run, translated line by line from the plan above, with the hand-worked examples as tests.
    code: |
      def longest_run(numbers):
          """Length of the longest strictly increasing run of neighbours."""
          if len(numbers) == 0:
              return 0
          best = 1
          current = 1
          for i in range(1, len(numbers)):
              if numbers[i] > numbers[i - 1]:
                  current += 1
              else:
                  current = 1
              best = max(best, current)
          return best

      assert longest_run([3, 4, 7, 2, 5, 6, 8, 1]) == 4
      assert longest_run([]) == 0
      assert longest_run([5]) == 1
      assert longest_run([3, 3, 3]) == 1
      assert longest_run([1, 2, 3]) == 3
      print("All tests passed")
    output: |
      All tests passed
    lines:
      - line: 3-4
        note: "The edge case found in step 1 is handled first, exactly as the pseudocode said."
      - line: 5-6
        note: "The state we track: the best run so far and the current run."
      - line: 7
        note: "Start from the second item, because each step compares an item with the one before it."
      - line: 8-11
        note: "Extend the run, or start a new one. This is the rule discovered by working the example by hand."
      - line: 15-20
        note: "The examples from step 1 become tests. If they all pass, nothing is printed except the final message."
  - title: Decomposition
    intro: "\"Is this a valid date?\" is three small problems, each a function."
    code: |
      def is_leap(year):
          """Leap years: divisible by 4, except centuries, except every 400 years."""
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)

      def days_in_month(month, year):
          """Number of days in month (1-12) of year."""
          if month == 2:
              return 29 if is_leap(year) else 28
          if month in [4, 6, 9, 11]:
              return 30
          return 31

      def is_valid_date(day, month, year):
          """True if day/month/year is a real calendar date."""
          return 1 <= month <= 12 and 1 <= day <= days_in_month(month, year)

      print(is_leap(2024), is_leap(1900), is_leap(2000))
      print(days_in_month(2, 2023), days_in_month(9, 2023))
      print(is_valid_date(29, 2, 2024), is_valid_date(29, 2, 2023), is_valid_date(31, 4, 2023))
    output: |
      True False True
      28 30
      True False False
    lines:
      - line: 1-3
        note: "The leap-year rule written as one boolean expression (Lesson 2.5). 1900 was not a leap year; 2000 was."
      - line: 5-11
        note: "`days_in_month` uses `is_leap` without caring how it works: it's already tested."
      - line: 13-15
        note: "The top-level question becomes a single readable line, built from the smaller functions. The `1 <= month` check comes first, so `days_in_month` is never called with a bad month (short-circuiting, Lesson 2.5)."
  - title: Working by hand to find a pattern
    intro: "How many squares (of every size) are on an n × n chessboard? Small cases first."
    code: |
      def count_squares(n):
          """Squares of all sizes on an n x n board."""
          total = 0
          for size in range(1, n + 1):
              per_side = n - size + 1
              total += per_side * per_side
          return total

      for n in range(1, 5):
          print(n, count_squares(n))
      print("chessboard:", count_squares(8))
    output: |
      1 1
      2 5
      3 14
      4 30
      chessboard: 204
    lines:
      - line: 4-6
        note: "Drawing a 3 × 3 grid by hand shows the pattern: squares of size 1 fit 3 per side (9 of them), size 2 fit 2 per side (4), size 3 fit 1 (1). A square of size `size` fits `n - size + 1` times along each side."
      - line: 9-10
        note: "Printing small cases checks the hand-worked answers (1, 5, 14) before trusting the big one."
      - line: 11
        note: "The real question: 204 squares on a chessboard. The answer people usually guess, 64, misses all the bigger squares."

