exercises:
  - id: leap-year
    title: Leap years and month lengths
    difficulty: 1
    prompt: |
      The rule for leap years in the Gregorian calendar is:

      - a year divisible by 4 is a leap year,
      - **except** years divisible by 100, which are not,
      - **except** years divisible by 400, which are.

      Write `is_leap(year)`. Then write `days_in_month(month, year)` that returns the number of days in a month (1 = January), **using `is_leap`** for February.

      ```python
      is_leap(2024), is_leap(1900), is_leap(2000)   # True, False, True
      days_in_month(2, 2024)                        # 29
      days_in_month(11, 2023)                       # 30
      ```
    starter: |
      def is_leap(year):
          pass


      def days_in_month(month, year):
          pass
    tests:
      - name: is_leap
        code: |
          for y, want in [(2024, True), (2023, False), (1900, False), (2000, True), (2100, False), (1600, True), (4, True)]:
              assert is_leap(y) == want, f"is_leap({y}) returned {is_leap(y)}, expected {want}"
      - name: days_in_month
        code: |
          want = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
          for m in range(1, 13):
              assert days_in_month(m, 2023) == want[m - 1], f"days_in_month({m}, 2023) returned {days_in_month(m, 2023)}"
          assert days_in_month(2, 2024) == 29 and days_in_month(2, 1900) == 28 and days_in_month(2, 2000) == 29, "Check February in leap years."
      - name: days_in_month uses is_leap
        code: |
          body = source[source.index("def days_in_month"):]
          assert "is_leap(" in body, "Call is_leap inside days_in_month rather than repeating the rule."
    hints:
      - "Turn the rule into a boolean expression: divisible by 4 **and** (not divisible by 100 **or** divisible by 400)."
      - "In `days_in_month`: February depends on `is_leap(year)`; April, June, September and November have 30; the rest have 31."
    solution: |
      def is_leap(year):
          """True if year is a leap year in the Gregorian calendar."""
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_month(month, year):
          """Number of days in month (1-12) of year."""
          if month == 2:
              return 29 if is_leap(year) else 28
          if month in (4, 6, 9, 11):
              return 30
          return 31
    explanation: |
      The "except ... except" wording translates into nested logic. Testing the tricky years (1900 and 2000) is essential: a version that only checks `year % 4 == 0` passes most years and fails exactly the edge cases. Making `days_in_month` call `is_leap` means the leap-year rule lives in one place, so if it were wrong you'd fix it once.

  - id: longest-increasing
    title: Longest increasing run, your way
    difficulty: 2
    prompt: |
      Write `longest_increase(numbers)` that returns the **start index and length** of the longest strictly increasing run of neighbours, as a tuple `(start, length)`. If there's a tie, return the **first** such run. An empty list returns `(0, 0)`.

      ```python
      longest_increase([3, 4, 7, 2, 5, 6, 8, 1])   # (3, 4): the run 2, 5, 6, 8 starts at index 3
      longest_increase([5, 4, 3])                  # (0, 1)
      ```

      Before coding: work through `[1, 2, 1, 2]` by hand. Which run should win, and why?
    starter: |
      def longest_increase(numbers):
          pass
    tests:
      - name: example from the question
        code: |
          assert longest_increase([3, 4, 7, 2, 5, 6, 8, 1]) == (3, 4), f"Got {longest_increase([3, 4, 7, 2, 5, 6, 8, 1])}"
      - name: ties return the first run
        code: |
          assert longest_increase([1, 2, 1, 2]) == (0, 2), f"Got {longest_increase([1, 2, 1, 2])}"
          assert longest_increase([5, 4, 3]) == (0, 1), f"Got {longest_increase([5, 4, 3])}"
      - name: edge cases
        code: |
          assert longest_increase([]) == (0, 0), f"Got {longest_increase([])}"
          assert longest_increase([9]) == (0, 1)
          assert longest_increase([1, 2, 3, 4]) == (0, 4)
          assert longest_increase([2, 2, 3, 4]) == (1, 3), "Equal neighbours aren't increasing."
      - name: matches a brute-force check
        code: |
          import random
          def brute(nums):
              best = (0, 0)
              for s in range(len(nums)):
                  e = s + 1
                  while e < len(nums) and nums[e] > nums[e - 1]:
                      e += 1
                  if e - s > best[1]:
                      best = (s, e - s)
              return best
          for _ in range(300):
              nums = [random.randint(0, 9) for _ in range(random.randint(0, 12))]
              assert longest_increase(nums) == brute(nums), f"For {nums}: got {longest_increase(nums)}, expected {brute(nums)}"
    hints:
      - "Track four things: the current run's start and length, and the best run's start and length."
      - "When `numbers[i] > numbers[i - 1]`, the current run grows. Otherwise a new run starts at `i` with length 1."
      - "Only replace the best when the current run is **strictly** longer, so ties keep the first run."
    solution: |
      def longest_increase(numbers):
          """(start, length) of the first longest strictly increasing run."""
          if not numbers:
              return (0, 0)
          best_start, best_len = 0, 1
          cur_start, cur_len = 0, 1
          for i in range(1, len(numbers)):
              if numbers[i] > numbers[i - 1]:
                  cur_len += 1
              else:
                  cur_start, cur_len = i, 1
              if cur_len > best_len:
                  best_start, best_len = cur_start, cur_len
          return (best_start, best_len)
    explanation: |
      This extends the worked example: besides the length, the run's start must be remembered. Using `>` rather than `>=` when updating the best is what makes ties keep the first run, a detail you'd only notice by working `[1, 2, 1, 2]` by hand. The last test compares your function with a slow but obviously correct brute-force version on hundreds of random lists, the "check it another way" idea from step 4.

  - id: day-of-year
    title: Day of the year
    difficulty: 2
    prompt: |
      Write `day_of_year(day, month, year)` that returns which day of the year a date is: 1 January is day 1, 31 December is day 365 (or 366 in a leap year).

      `is_leap` and `days_in_month` from the first exercise are already provided (in the starter). **Reuse** them rather than writing a table of month lengths.

      ```python
      day_of_year(1, 1, 2023)     # 1
      day_of_year(1, 3, 2023)     # 60
      day_of_year(1, 3, 2024)     # 61  (leap year)
      day_of_year(31, 12, 2024)   # 366
      ```
    starter: |
      def is_leap(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_month(month, year):
          if month == 2:
              return 29 if is_leap(year) else 28
          if month in (4, 6, 9, 11):
              return 30
          return 31


      def day_of_year(day, month, year):
          pass
    tests:
      - name: examples from the question
        code: |
          for args, want in [((1, 1, 2023), 1), ((1, 3, 2023), 60), ((1, 3, 2024), 61), ((31, 12, 2024), 366), ((31, 12, 2023), 365)]:
              assert day_of_year(*args) == want, f"day_of_year{args} returned {day_of_year(*args)}, expected {want}"
      - name: every day of a year in order
        code: |
          n = 0
          for m in range(1, 13):
              for d in range(1, days_in_month(m, 2000) + 1):
                  n += 1
                  assert day_of_year(d, m, 2000) == n, f"day_of_year({d}, {m}, 2000) should be {n}"
    hints:
      - "Work 1 March by hand: all of January and February come before it, then 1 more day."
      - "So: add up `days_in_month(m, year)` for every month `m` before `month`, then add `day`."
    solution: |
      def is_leap(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_month(month, year):
          if month == 2:
              return 29 if is_leap(year) else 28
          if month in (4, 6, 9, 11):
              return 30
          return 31


      def day_of_year(day, month, year):
          """Day number within the year: 1 Jan is 1."""
          total = 0
          for m in range(1, month):
              total += days_in_month(m, year)
          return total + day
    explanation: |
      Once the small functions exist, the big one is three lines, because the hard parts (leap years, month lengths) are already solved and tested. That's decomposition paying off. The second test checks all 366 days of a leap year in order, a thorough test that's only possible because the computer does the work.

  - id: next-date
    title: Tomorrow's date
    difficulty: 2
    prompt: |
      Write `next_date(day, month, year)` that returns the date of the **next** day as a tuple `(day, month, year)`. `days_in_month` is provided.

      ```python
      next_date(14, 7, 2023)    # (15, 7, 2023)
      next_date(30, 4, 2023)    # (1, 5, 2023)
      next_date(28, 2, 2024)    # (29, 2, 2024)
      next_date(31, 12, 2023)   # (1, 1, 2024)
      ```

      Before coding, list the cases on paper: what are the different "kinds" of tomorrow?
    starter: |
      def is_leap(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_month(month, year):
          if month == 2:
              return 29 if is_leap(year) else 28
          if month in (4, 6, 9, 11):
              return 30
          return 31


      def next_date(day, month, year):
          pass
    tests:
      - name: ordinary days and month ends
        code: |
          assert next_date(14, 7, 2023) == (15, 7, 2023), f"Got {next_date(14, 7, 2023)}"
          assert next_date(30, 4, 2023) == (1, 5, 2023), f"Got {next_date(30, 4, 2023)}"
          assert next_date(30, 5, 2023) == (31, 5, 2023), f"Got {next_date(30, 5, 2023)}"
      - name: February
        code: |
          assert next_date(28, 2, 2024) == (29, 2, 2024), f"Got {next_date(28, 2, 2024)}"
          assert next_date(28, 2, 2023) == (1, 3, 2023), f"Got {next_date(28, 2, 2023)}"
          assert next_date(29, 2, 2024) == (1, 3, 2024), f"Got {next_date(29, 2, 2024)}"
      - name: new year
        code: |
          assert next_date(31, 12, 2023) == (1, 1, 2024), f"Got {next_date(31, 12, 2023)}"
      - name: a whole year, day by day
        code: |
          d = (1, 1, 2024)
          for _ in range(366):
              d = next_date(*d)
          assert d == (1, 1, 2025), f"366 days after 1 Jan 2024 should be 1 Jan 2025, got {d}"
    hints:
      - "There are three kinds of tomorrow: same month (most days), first of next month, and first of next year."
      - "If `day < days_in_month(month, year)`, it's just `(day + 1, month, year)`."
      - "Otherwise it's the 1st: of the next month if `month < 12`, else of January next year."
    solution: |
      def is_leap(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_month(month, year):
          if month == 2:
              return 29 if is_leap(year) else 28
          if month in (4, 6, 9, 11):
              return 30
          return 31


      def next_date(day, month, year):
          """The date after day/month/year, as a (day, month, year) tuple."""
          if day < days_in_month(month, year):
              return (day + 1, month, year)
          if month < 12:
              return (1, month + 1, year)
          return (1, 1, year + 1)
    explanation: |
      Listing the cases *before* coding turned a fiddly problem into three simple branches, ordered from most to least common. The final test chains 366 calls together: if any single case were wrong, the year would end on the wrong date. (`next_date(*d)` unpacks the tuple into three arguments, the star from Lesson 3.5 used in a call.)

  - id: luhn
    title: Validate a card number
    difficulty: 3
    prompt: |
      Credit card numbers end with a **check digit** chosen so that the **Luhn algorithm** gives a total divisible by 10. This catches most typing mistakes. The algorithm, for a string of digits:

      1. Starting from the **rightmost** digit and moving left, double **every second digit** (the 2nd from the right, the 4th, and so on).
      2. If doubling gives a number over 9, subtract 9 (so 7 doubled = 14 becomes 5).
      3. Add up all the digits (the doubled ones and the untouched ones).
      4. The number is valid if the total is divisible by 10.

      Write `luhn_valid(number)`, where `number` is a string that may contain **spaces** (ignore them). Any other non-digit character, or no digits at all, makes it invalid.

      ```python
      luhn_valid("4539 1488 0343 6467")   # True
      luhn_valid("4539 1488 0343 6468")   # False (last digit mistyped)
      ```

      Work `"79927398713"` (a standard test value, which is valid) by hand first.
    starter: |
      def luhn_valid(number):
          pass
    tests:
      - name: valid numbers
        code: |
          for n in ["4539 1488 0343 6467", "79927398713", "0", "18", "4111 1111 1111 1111"]:
              assert luhn_valid(n) is True, f"{n!r} is valid"
      - name: invalid numbers
        code: |
          for n in ["4539 1488 0343 6468", "79927398710", "1", "4111 1111 1111 1112"]:
              assert luhn_valid(n) is False, f"{n!r} is invalid"
      - name: bad characters and empty input
        code: |
          for n in ["", "   ", "4539-1488", "12a4"]:
              assert luhn_valid(n) is False, f"{n!r} should be invalid"
      - name: catches every single-digit typo
        code: |
          good = "79927398713"
          for i in range(len(good)):
              for d in "0123456789":
                  if d != good[i]:
                      bad = good[:i] + d + good[i + 1:]
                      assert luhn_valid(bad) is False, f"{bad!r} has one wrong digit and should fail"
    hints:
      - "Decompose: first clean the input (remove spaces, check everything left is a digit and there's at least one), then compute the total."
      - "Reversing the digits (`digits[::-1]`) makes \"every second digit from the right\" easy: with `enumerate`, they're the ones at odd positions (1, 3, 5, ...)."
      - "For each digit: `d = int(ch)`; if its position is odd, `d = d * 2`, and if `d > 9`, `d -= 9`. Add `d` to the total. Return `total % 10 == 0`."
    solution: |
      def luhn_valid(number):
          """True if number (digits and spaces) passes the Luhn check."""
          digits = number.replace(" ", "")
          if digits == "" or not digits.isdigit():
              return False
          total = 0
          for position, ch in enumerate(digits[::-1]):
              d = int(ch)
              if position % 2 == 1:
                  d = d * 2
                  if d > 9:
                      d -= 9
              total += d
          return total % 10 == 0
    explanation: |
      The tricky phrase is "from the rightmost digit". Reversing the string turns it into "from the leftmost", where every second digit is simply an odd position. Changing the problem's representation to make it easier, as you did with minutes-since-midnight in Lesson 3.5, is one of the best problem-solving moves there is. The last test proves the algorithm's purpose: every possible single-digit mistake is caught. (Luhn also catches most swaps of neighbouring digits, the other common typing error.)

commonMistakes:
  - title: Starting to code before understanding the problem
    explanation: |
      If you can't work a small example by hand and say what the edge cases are, you're not ready to code. Typing early feels productive, but usually leads to rewriting.
  - title: Writing the whole program before running any of it
    explanation: |
      Write a few lines, run them, check them. A bug in ten new lines is easy to find; a bug somewhere in a hundred untested lines is not.
  - title: Testing only the easy cases
    explanation: |
      Code that works for `[3, 1, 2]` may fail for `[]`, `[5]`, or a list of duplicates. Edge cases are where bugs live, so test them deliberately.
  - title: Repeating logic instead of reusing a function
    explanation: |
      If two places need the same calculation, put it in one function and call it from both. Then there's only one place to get it right.
    wrong: |
      def day_of_year(d, m, y):
          if m > 2 and y % 4 == 0 and (y % 100 != 0 or y % 400 == 0):
              ...   # leap-year rule copied again
    right: |
      def day_of_year(d, m, y):
          ...  # uses days_in_month, which uses is_leap

summary:
  - "Solve problems in four steps: **understand**, **plan**, **carry out**, **look back** (Pólya)."
  - "Understand: name the inputs, outputs and edge cases, and **work small examples by hand**."
  - "Plan: look for familiar patterns, **decompose** into smaller functions, and write **pseudocode**."
  - "Carry out: turn your hand-worked examples into **tests first**, then build in small, tested steps."
  - "Look back: test edge cases, check against a brute-force version, and simplify."
  - "When stuck, go back a step: stuck on code means the plan is incomplete; stuck on the plan means you need more examples."
next: |
  "Look back" includes asking whether a solution is **fast enough**. In **Lesson 4.2** you'll learn to measure how much work an algorithm does by counting its steps, and see why some algorithms stay fast as data grows while others become hopelessly slow.

quiz:
  - type: mcq
    question: What is usually the best first step when facing a new programming problem?
    options:
      - Start typing code and fix it as you go
      - Work some small examples by hand and identify edge cases
      - Search for a library that solves it
      - Write the longest test you can think of
    answer: 1
    explanation: Understanding comes first. Working examples by hand often reveals the algorithm itself.
  - type: mcq
    question: What is decomposition?
    options:
      - Removing unused code
      - Breaking a problem into smaller sub-problems, often one function each
      - Converting code to bytecode
      - Splitting a string into words
    answer: 1
    explanation: Decomposition splits a big problem into smaller pieces that are each easy to solve and test.
  - type: mcq
    question: What is pseudocode?
    options:
      - Code that contains bugs
      - A structured, informal description of an algorithm that ignores exact syntax
      - Python with the comments removed
      - A special Python mode for beginners
    answer: 1
    explanation: Pseudocode lets you plan the logic in near-English, before worrying about a language's rules.
  - type: mcq
    question: Why write tests before writing the function?
    options:
      - Tests run faster that way
      - They define exactly what "done" means, using examples you understand
      - Python requires it
      - So you don't need edge cases
    answer: 1
    explanation: Tests written from hand-worked examples give a clear, checkable target.
  - type: mcq
    question: "You're stuck writing the code for a plan. According to the method, what should you do?"
    options:
      - Keep trying random changes until it works
      - Go back to your plan and make it more detailed
      - Delete everything and start a new problem
      - Add more print statements everywhere
    answer: 1
    explanation: Being stuck on code usually means the plan has a gap. Go back a step.
  - type: mcq
    question: Which is the most useful set of test inputs for a function that finds the largest number in a list?
    options:
      - "[1, 2, 3]"
      - "[5, 3, 9, 1]"
      - "[], [7], [-3, -8], [4, 4, 4], [2, 9, 1]"
      - "[1000000]"
    answer: 2
    explanation: It covers the edge cases (empty, single item, all negative, duplicates) as well as an ordinary case.
  - type: code
    question: |
      Write `middle_of_three(a, b, c)` that returns the middle value of three numbers (the one that isn't the largest or smallest), **without** using `sorted`, `sort`, `max` or `min`. `middle_of_three(5, 1, 3)` returns `3`. If values repeat, return the repeated value when appropriate: `middle_of_three(2, 2, 9)` returns `2`.
    starter: |
      def middle_of_three(a, b, c):
          pass
    tests:
      - name: all orders and repeats
        code: |
          import itertools
          for trio in [(1, 2, 3), (2, 2, 9), (5, 5, 5), (-1, 0, -5), (7, 3, 7)]:
              want = sorted(trio)[1]
              for p in itertools.permutations(trio):
                  assert middle_of_three(*p) == want, f"middle_of_three{p} returned {middle_of_three(*p)}, expected {want}"
          for banned in ["sorted(", ".sort(", "max(", "min("]:
              assert banned not in source, f"Don't use {banned[:-1]}."
    solution: |
      def middle_of_three(a, b, c):
          if a <= b <= c or c <= b <= a:
              return b
          if b <= a <= c or c <= a <= b:
              return a
          return c
