id: u4-counting-steps
title: "Counting Steps: How Work Grows"
minutes: 50
objective: |
  Measure how much work an algorithm does by **counting its steps**, describe how that work **grows** as the input gets bigger (constant, logarithmic, linear, quadratic), and spot hidden costs in innocent-looking Python.
outcomes:
  - Explain why we count steps instead of timing programs with a stopwatch
  - Add a counter to an algorithm to measure its work
  - Recognise constant, logarithmic, linear and quadratic growth from code
  - Use a doubling experiment to identify how an algorithm grows
  - Distinguish best, worst and average cases
  - Spot hidden loops in operations like `in`, `insert(0, ...)` and slicing

sections:
  - heading: Fast enough?
    body: |
      Two programs can give exactly the same answers while one takes a second and the other takes a week. In Lesson 3.7 you saw this happen: checking for a pair with a given sum took 20 billion steps with nested loops, and 200,000 with a set. Both were correct; only one was usable.

      How do we compare algorithms? The obvious answer is to time them, but a stopwatch measures the *computer* as much as the *algorithm*. The same code runs at different speeds on a phone and a desktop, and even on the same machine from one run to the next. What we want is a measure of the algorithm itself.

      The answer is to **count steps**: the basic operations the algorithm performs, such as comparisons, additions or loop iterations. A step takes roughly constant time on any machine, so the step count captures the algorithm's work independent of the hardware.

      And we care most about one question: **how does the number of steps grow as the input grows?** An algorithm that does 5n steps and one that does 3n steps behave similarly: double the input, double the work. One that does n² steps is in a different league: double the input, *quadruple* the work.

  - heading: Counting with a counter
    body: |
      The simplest way to count steps is to add a counter to the code. Here's linear search (Lesson 3.2), counting comparisons:

      ```python
      def search(lst, target):
          comparisons = 0
          for i in range(len(lst)):
              comparisons += 1
              if lst[i] == target:
                  return i, comparisons
          return -1, comparisons
      ```

      If the target is first, it takes 1 comparison: that's the **best case**. If it's missing, it takes `len(lst)` comparisons: the **worst case**. On average, if the target is equally likely to be anywhere, about half the list.

      We usually focus on the **worst case**, because it's a guarantee: "this will never take more than n comparisons". Average cases are useful too, but harder to define (average over *what* inputs?).

  - heading: Four ways work can grow
    body: |
      Most algorithms you'll write in this course fall into a handful of families. Let n be the size of the input:

      | Growth | Steps for n = 10 | n = 1,000 | n = 1,000,000 | Typical code |
      |---|---|---|---|---|
      | **Constant** | 1 | 1 | 1 | `lst[i]`, `d[key]`, `x in a_set` |
      | **Logarithmic** | about 3 | about 10 | about 20 | halve the problem each step |
      | **Linear** | 10 | 1,000 | 1,000,000 | one loop over the data |
      | **Quadratic** | 100 | 1,000,000 | 1,000,000,000,000 | a loop inside a loop |

      **Constant**: the work doesn't depend on n at all. Indexing a list jumps straight to the address (Lesson 1.5); a dictionary lookup jumps to the hashed slot (Lesson 3.6).

      **Linear**: one pass over the data, doing a constant amount of work per item. Summing a list, linear search, counting words.

      **Quadratic**: for each item, look at every item (or every *later* item). Comparing all pairs, the n² `dedupe` from Lesson 3.2. A loop over all pairs `i < j` does n(n − 1)/2 steps, which is still quadratic: for large n it's about n²/2, and halving doesn't change the family.

      **Logarithmic**: each step **halves** the remaining problem. Starting from n, how many halvings until you're down to 1? That's log₂ n: about 10 for a thousand, 20 for a million, 30 for a billion. You met this number in Lesson 1.1: n items need about log₂ n bits to number them, because each bit halves the possibilities.

      > **Key idea:** At a million items, a logarithmic algorithm takes about 20 steps, a linear one a million, and a quadratic one a **trillion**. If a step takes a nanosecond, that's 20 nanoseconds, a millisecond, and **17 minutes**. The family an algorithm belongs to matters far more than how carefully its loop is written.

      These families have standard names in **Big-O notation**: O(1), O(log n), O(n), O(n²). You'll study Big-O formally in Unit 8; for now, the idea of growth is what matters.

  - heading: The doubling experiment
    body: |
      A neat way to identify an algorithm's family, even without reading its code, is to **double the input and see what happens to the step count**:

      | If doubling n... | the algorithm is probably |
      |---|---|
      | doesn't change the steps | constant |
      | adds about 1 step | logarithmic |
      | doubles the steps | linear |
      | quadruples the steps (×4) | quadratic |
      | multiplies the steps by 8 | cubic (three nested loops) |

      Scientists use the same trick: run an experiment at two sizes and compare. It works with real timings too, as long as n is big enough that the timing noise is small.

  - heading: Hidden loops
    body: |
      Some single lines of Python secretly contain a loop, and putting them inside your own loop can turn a linear algorithm into a quadratic one:

      | Operation | Cost | Why |
      |---|---|---|
      | `x in lst` | linear | searches the list (Lesson 3.2) |
      | `lst.index(x)`, `lst.count(x)`, `lst.remove(x)` | linear | searches the list |
      | `lst.insert(0, x)`, `lst.pop(0)` | linear | every other item has to shift along one place |
      | `lst[a:b]`, `lst[:]` | linear in the slice length | copies the items |
      | `s1 + s2`, `result += piece` (strings) | linear | builds a whole new string (Lesson 3.3) |
      | `lst.append(x)`, `lst.pop()` | constant | the end of the list is cheap |
      | `x in a_set`, `d[key]` | constant | hashing |

      For example, this looks like one loop, but `in result` searches a growing list each time, so it does about n²/2 steps:

      ```python
      for x in data:
          if x not in result:      # hidden loop!
              result.append(x)
      ```

      Swapping the list for a set (Lesson 3.7) makes it linear.

      > **Tip:** You don't need to optimise everything. For a list of 100 items, even quadratic code finishes instantly. Think about growth when the data might be large, or when code runs inside another loop. "Make it work, then make it fast (if it needs to be)."

examples:
  - title: Best and worst cases
    intro: Linear search with a comparison counter.
    code: |
      def search(lst, target):
          comparisons = 0
          for i in range(len(lst)):
              comparisons += 1
              if lst[i] == target:
                  return i, comparisons
          return -1, comparisons

      data = list(range(100))
      print(search(data, 0))
      print(search(data, 50))
      print(search(data, 99))
      print(search(data, 500))
    output: |
      (0, 1)
      (50, 51)
      (99, 100)
      (-1, 100)
    lines:
      - line: 2-4
        note: "A counter, added one per comparison. It's a measuring instrument, not part of the algorithm's job."
      - line: 10
        note: "Best case: the target is first. One comparison."
      - line: 12-13
        note: "Worst cases: the target is last, or missing. Every item is compared: n = 100 comparisons."
  - title: Counting all pairs
    intro: How many comparisons does checking every pair take?
    code: |
      def count_pair_checks(n):
          steps = 0
          for i in range(n):
              for j in range(i + 1, n):
                  steps += 1
          return steps

      for n in [10, 20, 40, 80]:
          print(n, count_pair_checks(n), n * (n - 1) // 2)
    output: |
      10 45 45
      20 190 190
      40 780 780
      80 3160 3160
    lines:
      - line: 3-5
        note: "For each `i`, the inner loop visits every *later* `j`, so each pair is checked once."
      - line: 9
        note: "The count matches the formula n(n − 1)/2. Each time n doubles, the steps roughly quadruple (45, 190, 780, 3160): quadratic growth."
  - title: Halving is logarithmic
    intro: How many times can you halve a number before reaching 1?
    code: |
      def halvings(n):
          steps = 0
          while n > 1:
              n = n // 2
              steps += 1
          return steps

      for n in [8, 1000, 1_000_000, 1_000_000_000]:
          print(f"{n:>13,}: {halvings(n)} halvings, {n.bit_length()} bits")
    output: |2
                  8: 3 halvings, 4 bits
              1,000: 9 halvings, 10 bits
          1,000,000: 19 halvings, 20 bits
      1,000,000,000: 29 halvings, 30 bits
    lines:
      - line: 3-5
        note: "Each step halves `n` (integer division). The loop runs about log₂ n times."
      - line: 8-9
        note: "Multiplying n by 1,000 adds only about 10 halvings. `bit_length()` is the number of bits needed to write n in binary (Lesson 1.1), always one more than the number of halvings."
  - title: A doubling experiment
    intro: Three ways to check a list for duplicates, measured by counting.
    code: |
      def dup_pairs(nums):
          steps = 0
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  steps += 1
          return steps

      def dup_sorted(nums):
          steps = 0
          ordered = sorted(nums)
          for i in range(1, len(ordered)):
              steps += 1
          return steps

      def dup_set(nums):
          steps = 0
          seen = set()
          for x in nums:
              steps += 1
              seen.add(x)
          return steps

      for n in [1000, 2000, 4000]:
          nums = list(range(n))
          print(n, dup_pairs(nums), dup_sorted(nums), dup_set(nums))
    output: |
      1000 499500 999 1000
      2000 1999000 1999 2000
      4000 7998000 3999 4000
    lines:
      - line: 1-6
        note: "Compare every pair: about n²/2 steps. Doubling n multiplies the steps by 4."
      - line: 8-13
        note: "Sort, then compare neighbours (duplicates end up side by side). The loop is linear, but the counter doesn't see the work `sorted` does. You'll learn its cost in Lesson 4.7."
      - line: 15-21
        note: "One pass with a set: linear. Doubling n doubles the steps."
      - line: 23-25
        note: "The table is the doubling experiment: ×4 for the pairs version, ×2 for the others."

playground:
  prompt: |
    Add a step counter to some code from an earlier lesson (for example, `dedupe` with `item not in result`, Lesson 3.2). Count the comparisons `in` does by writing the search yourself, then run a doubling experiment with lists of 100, 200 and 400 distinct numbers.
  code: |
    def dedupe_steps(lst):
        steps = 0
        result = []
        for item in lst:
            found = False
            for r in result:      # what "item in result" does
                steps += 1
                if r == item:
                    found = True
                    break
            if not found:
                result.append(item)
        return steps

    for n in [100, 200, 400]:
        print(n, dedupe_steps(list(range(n))))

exercises:
  - id: count-halvings
    title: Count the halvings
    difficulty: 1
    prompt: |
      Write `halvings(n)` that returns how many times a whole number `n` (at least 1) can be integer-halved (`n // 2`) before it reaches 1. Then use it to set `steps_billion` to the number of halvings for 1,000,000,000.

      ```python
      halvings(1)    # 0
      halvings(8)    # 3
      halvings(9)    # 3
      ```

      Don't use `bit_length` or `math.log`: write the loop.
    starter: |
      def halvings(n):
          pass


      steps_billion = 0
    tests:
      - name: small values
        code: |
          for n, want in [(1, 0), (2, 1), (3, 1), (8, 3), (9, 3), (15, 3), (16, 4)]:
              assert halvings(n) == want, f"halvings({n}) returned {halvings(n)}, expected {want}"
      - name: large values
        code: |
          assert halvings(1_000_000) == 19, f"Got {halvings(1_000_000)}"
          assert steps_billion == 29, f"steps_billion is {steps_billion}"
      - name: written with a loop
        code: |
          assert "bit_length" not in source and "log" not in source, "Count the halvings with a loop."
    hints:
      - "A `while n > 1:` loop, halving `n` and adding 1 to a counter each time."
      - "`steps_billion = halvings(1_000_000_000)`."
    solution: |
      def halvings(n):
          """How many times n can be halved (integer division) before reaching 1."""
          steps = 0
          while n > 1:
              n = n // 2
              steps += 1
          return steps


      steps_billion = halvings(1_000_000_000)
    explanation: |
      Only 29 halvings take a billion down to 1. That astonishingly small number is why algorithms that halve their problem at every step (like binary search, next lesson) stay fast however large the data gets. Notice the loop changes the local `n`, not the caller's variable: numbers are immutable, so `n = n // 2` just rebinds the local name (Lesson 3.4).

  - id: predict-steps
    title: Predict the step counts
    difficulty: 2
    prompt: |
      Each function below counts its own steps. **Without running loops**, write a formula for each one's step count as a function of `n` (a whole number, at least 1):

      ```python
      def a(n):              def b(n):                 def c(n):                  def d(n):
          s = 0                  s = 0                     s = 0                      s = 0
          for i in range(n):     for i in range(n):        for i in range(n):         for i in range(n):
              s += 1                 for j in range(n):        for j in range(i):         s += 1
          return s                       s += 1                    s += 1             for j in range(n):
                                 return s                  return s                       s += 1
                                                                                      return s
      ```

      Write `steps_a(n)`, `steps_b(n)`, `steps_c(n)` and `steps_d(n)`, each returning the count using arithmetic only (no loops). Then set `quadratic` to a list of the letters (as strings) of the functions whose growth is quadratic.
    starter: |
      def steps_a(n):
          pass


      def steps_b(n):
          pass


      def steps_c(n):
          pass


      def steps_d(n):
          pass


      quadratic = []
    tests:
      - name: formulas match the real counts
        code: |
          def a(n):
              return sum(1 for i in range(n))
          def b(n):
              return sum(1 for i in range(n) for j in range(n))
          def c(n):
              return sum(1 for i in range(n) for j in range(i))
          def d(n):
              return n + n
          for n in [1, 2, 3, 10, 57]:
              for name, f, g in [("a", a, steps_a), ("b", b, steps_b), ("c", c, steps_c), ("d", d, steps_d)]:
                  assert g(n) == f(n), f"steps_{name}({n}) returned {g(n)}, but {name}({n}) counts {f(n)} steps"
      - name: no loops in the formulas
        code: |
          assert " for " not in source and "while" not in source, "Use arithmetic formulas, not loops."
      - name: which are quadratic
        code: |
          assert sorted(quadratic) == ["b", "c"], f"quadratic is {quadratic}. Which ones quadruple when n doubles?"
    hints:
      - "`a` runs its body n times. `b` runs the inner body n times for each of n outer iterations."
      - "`d` has two loops one *after* the other, not nested: their counts add, they don't multiply."
      - "`c`: when i = 0 the inner loop runs 0 times, then 1, 2, ... up to n − 1. The sum 0 + 1 + ... + (n − 1) is n(n − 1)/2 (use `//` to keep it whole)."
    solution: |
      def steps_a(n):
          return n


      def steps_b(n):
          return n * n


      def steps_c(n):
          return n * (n - 1) // 2


      def steps_d(n):
          return 2 * n


      quadratic = ["b", "c"]
    explanation: |
      Sequential loops **add** their costs (n + n = 2n, still linear); nested loops **multiply** them (n × n). The triangular loop `c` does about half the work of `b`, but it's still quadratic: doubling n roughly quadruples both. Reading code and predicting how its work grows, without running it, is the core skill of algorithm analysis, which Unit 8 formalises as Big-O.

  - id: no-hidden-loops
    title: Remove the hidden loop
    difficulty: 2
    slowStarter: true
    prompt: |
      The starter's `common_items(a, b)` returns the items of list `a` that also appear in list `b`, in `a`'s order. It's correct, but `x in b` hides a loop, so for two lists of 50,000 items it does over a billion comparisons.

      Rewrite it to be **linear**, keeping the same results (including `a`'s order and any repeats in `a`).
    starter: |
      def common_items(a, b):
          result = []
          for x in a:
              if x in b:
                  result.append(x)
          return result
    tests:
      - name: same results as before
        code: |
          assert common_items([3, 1, 4, 1, 5], [1, 5, 9]) == [1, 1, 5], f"Got {common_items([3, 1, 4, 1, 5], [1, 5, 9])}"
          assert common_items([], [1]) == []
          assert common_items(["a", "b"], []) == []
      - name: fast on big lists
        code: |
          import time
          a = list(range(0, 100000, 2))
          b = list(range(0, 100000, 3))
          t = time.time()
          got = common_items(a, b)
          assert len(got) == 16667 and got[:3] == [0, 6, 12], "Wrong result for the big lists."
          assert time.time() - t < 1, "Still too slow: is there a hidden loop left?"
    hints:
      - "The slow part is `x in b` on a list. Which structure makes `in` instant?"
      - "Build `b_set = set(b)` once, **before** the loop, then check `x in b_set`."
    solution: |
      def common_items(a, b):
          """Items of a that also appear in b, in a's order."""
          b_set = set(b)
          result = []
          for x in a:
              if x in b_set:
                  result.append(x)
          return result
    explanation: |
      Building the set costs one pass over `b`, and then each membership test is constant, so the whole function is linear: about 100,000 steps instead of over a billion. The structure of the code barely changed; only the data structure did. Building the set *inside* the loop would be a mistake: it would rebuild it every time, making things worse than before.

  - id: classify-growth
    title: Classify by doubling
    difficulty: 3
    prompt: |
      Write `classify(steps)`, where `steps` is a **function** that returns how many steps some algorithm takes for input size `n`. Use a doubling experiment at n = 1000 and n = 2000 to return one of `"constant"`, `"logarithmic"`, `"linear"` or `"quadratic"`.

      ```python
      def mystery(n):
          return 3 * n + 7

      classify(mystery)    # 'linear'
      ```

      Use these rules on `ratio = steps(2000) / steps(1000)` and `difference = steps(2000) - steps(1000)`:

      - difference of 0: constant
      - ratio below 1.5: logarithmic
      - ratio below 3: linear
      - otherwise: quadratic
    starter: |
      def classify(steps):
          pass
    tests:
      - name: textbook functions
        code: |
          import math
          assert classify(lambda n: 5) == "constant", "steps(n) = 5"
          assert classify(lambda n: int(math.log2(n))) == "logarithmic", "steps(n) = log2(n)"
          assert classify(lambda n: n) == "linear", "steps(n) = n"
          assert classify(lambda n: n * n) == "quadratic", "steps(n) = n squared"
      - name: messier formulas
        code: |
          assert classify(lambda n: 3 * n + 7) == "linear"
          assert classify(lambda n: n * (n - 1) // 2) == "quadratic"
          assert classify(lambda n: 2 * n.bit_length() + 10) == "logarithmic"
      - name: real counted algorithms
        code: |
          def pairs(n):
              s = 0
              for i in range(n):
                  for j in range(i + 1, n):
                      s += 1
              return s
          def halving(n):
              s = 1
              while n > 1:
                  n //= 2
                  s += 1
              return s
          assert classify(pairs) == "quadratic"
          assert classify(halving) == "logarithmic"
    hints:
      - "Call the function you were given: `small = steps(1000)` and `big = steps(2000)`."
      - "Check the difference first (a constant function would make the ratio exactly 1, which would otherwise look logarithmic)."
      - "Then compute `big / small` and apply the thresholds in order."
    solution: |
      def classify(steps):
          """Classify a step-count function's growth by doubling n."""
          small = steps(1000)
          big = steps(2000)
          if big - small == 0:
              return "constant"
          ratio = big / small
          if ratio < 1.5:
              return "logarithmic"
          if ratio < 3:
              return "linear"
          return "quadratic"
    explanation: |
      This function takes **another function** as its argument and calls it, the "functions are values" idea from `key=` in Lesson 3.5. The thresholds sit between the ideal ratios (about 1.1 for logarithmic, 2 for linear, 4 for quadratic), so small extra terms like `+ 7` don't fool it. The real-algorithm test shows the experiment works on code you can't easily turn into a formula, which is exactly when it's most useful.

  - id: fast-duplicates
    title: Fast duplicate check
    difficulty: 2
    slowStarter: true
    prompt: |
      Write `first_duplicate(nums)` that returns the first value whose second occurrence comes earliest in the list, or `None` if there are no duplicates. It must be **linear**: the tests use a list of 200,000 numbers.

      ```python
      first_duplicate([3, 1, 4, 1, 5, 3])   # 1   (the second 1 appears before the second 3)
      first_duplicate([1, 2, 3])            # None
      ```
    starter: |
      def first_duplicate(nums):
          for i in range(len(nums)):
              for j in range(i):
                  if nums[j] == nums[i]:
                      return nums[i]
          return None
    tests:
      - name: small examples
        code: |
          assert first_duplicate([3, 1, 4, 1, 5, 3]) == 1, f"Got {first_duplicate([3, 1, 4, 1, 5, 3])}"
          assert first_duplicate([1, 2, 3]) is None
          assert first_duplicate([]) is None
          assert first_duplicate([7, 7]) == 7
      - name: fast on a big list
        code: |
          big = list(range(200000)) + [199999]
          assert first_duplicate(big) == 199999, "The only duplicate is the last item."
    hints:
      - "The starter is correct but quadratic: for each item it searches everything before it."
      - "Keep a set of the values seen so far. For each value: if it's already in the set, return it; otherwise add it."
    solution: |
      def first_duplicate(nums):
          """The value whose repeat appears first, or None."""
          seen = set()
          for x in nums:
              if x in seen:
                  return x
              seen.add(x)
          return None
    explanation: |
      The starter's inner loop is the "hidden loop" made visible: it searches all earlier items for every item, about n²/2 steps (20 billion for the big test). The seen set from Lesson 3.7 replaces that search with a constant-time check. Scanning left to right and stopping at the first repeat gives exactly "the value whose second occurrence comes earliest".

commonMistakes:
  - title: Judging speed from one small test
    explanation: |
      Almost any algorithm is instant on 10 items. Growth only shows on large inputs, so test with big data (or count steps) before concluding code is fast.
  - title: Ignoring the cost of built-in operations
    explanation: |
      `in` on a list, `insert(0, x)`, `remove` and slicing all loop internally. Inside your own loop, they multiply the work.
    wrong: |
      for x in big_list:
          if x in other_big_list:   # linear search every time
              ...
    right: |
      other = set(other_big_list)
      for x in big_list:
          if x in other:            # constant time
              ...
  - title: Thinking two loops always mean quadratic
    explanation: |
      Two loops **one after another** add (n + n = 2n, linear). Only **nested** loops multiply.
  - title: Optimising before it matters
    explanation: |
      Clear, correct code comes first. Worry about growth when data can be large or the code is inside another loop, and measure before and after.

summary:
  - "Measure algorithms by **counting steps**, not with a stopwatch, and focus on how the count **grows** with input size n."
  - "The **worst case** gives a guarantee; best and average cases are useful too."
  - "Common growth families: **constant** (1), **logarithmic** (log₂ n, halving), **linear** (n, one loop), **quadratic** (n², nested loops)."
  - "Sequential loops add; nested loops multiply. n(n − 1)/2 is still quadratic."
  - "In a **doubling experiment**, constant stays the same, logarithmic adds about 1, linear doubles and quadratic quadruples."
  - "Watch for hidden loops: `in` on a list, `insert(0, ...)`, `remove`, slicing and string `+=`."
next: |
  Linear search checks items one by one: n steps in the worst case. If the data is **sorted**, you can do dramatically better by halving the search space with every comparison. In **Lesson 4.3** you'll learn **binary search**, which finds an item among a billion in about 30 steps.

quiz:
  - type: mcq
    question: Why do we count steps rather than timing an algorithm with a stopwatch?
    options:
      - Stopwatches are inaccurate
      - Step counts measure the algorithm itself, independent of the computer it runs on
      - Timing is impossible in Python
      - Steps are always faster
    answer: 1
    explanation: Timings depend on the hardware and other programs running; step counts depend only on the algorithm and input.
  - type: mcq
    question: "How many times does the inner line run?\n\n```python\nfor i in range(n):\n    for j in range(n):\n        total += 1\n```"
    options: ["n", "2n", "n²", "log₂ n"]
    answer: 2
    explanation: The inner loop runs n times for each of the n outer iterations.
  - type: mcq
    question: "How many times does the body run in total?\n\n```python\nfor i in range(n):\n    print(i)\nfor j in range(n):\n    print(j)\n```"
    options: ["n", "2n", "n²", "n + 1"]
    answer: 1
    explanation: The loops are one after the other, so their counts add. That's still linear growth.
  - type: mcq
