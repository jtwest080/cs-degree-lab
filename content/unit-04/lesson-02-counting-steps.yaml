  - type: code
    question: |
      Write `count_common(a, b)` that returns how many items of list `a` appear somewhere in list `b`, counting repeats in `a`. `count_common([1, 2, 2, 3], [2, 3, 4])` returns `3`. It must be fast for lists of 100,000 items.
    starter: |
      def count_common(a, b):
          pass
    tests:
      - name: counts correctly and quickly
        code: |
          assert count_common([1, 2, 2, 3], [2, 3, 4]) == 3, f"Got {count_common([1, 2, 2, 3], [2, 3, 4])}"
          assert count_common([], [1]) == 0
          a = list(range(100000))
          b = list(range(50000, 150000))
          assert count_common(a, b) == 50000, "Wrong count for the big lists (or too slow)."
    solution: |
      def count_common(a, b):
          b_set = set(b)
          return sum(1 for x in a if x in b_set)
