id: u4-simple-sorts
title: Simple Sorting Algorithms
minutes: 55
objective: |
  Sort a list yourself with **selection sort** and **insertion sort**, trace both by hand, count their comparisons, and explain the ideas of **in-place** sorting, **stability**, and best versus worst cases.
outcomes:
  - Trace selection sort and insertion sort by hand on a small list
  - Implement both algorithms in place
  - Count comparisons and explain why both are quadratic in the worst case
  - Explain why insertion sort is fast on nearly sorted data
  - Define a stable sort and say why stability matters for records
  - Sort small whole numbers without comparisons using counting sort

sections:
  - heading: Why learn to sort?
    body: |
      Python already has `sorted` and `list.sort`, and you should use them in real programs. So why write your own?

      Because sorting is the perfect laboratory for algorithms. It's easy to state ("put these in order"), there are dozens of ways to do it, and the ways differ enormously in speed. Learning them teaches you how to design, trace, analyse and compare algorithms, skills you'll use on problems no library solves for you. Sorting also matters in practice: binary search (Lesson 4.3) needs sorted data, and so do many other algorithms.

      In this lesson you'll meet two simple methods that people use naturally when sorting things by hand. In Lesson 4.7 you'll meet a cleverer one that's dramatically faster on big lists.

  - heading: Selection sort
    body: |
      Imagine sorting a hand of playing cards laid out on a table. One natural method: **find the smallest card and put it first**. Then find the smallest of the rest and put it second. And so on.

      That's **selection sort**. On a list, "put it first" means **swapping** it with whatever is in the first position:

      ```text
      [5, 2, 8, 1, 9]     smallest of all is 1: swap with position 0
      [1, 2, 8, 5, 9]     smallest of positions 1-4 is 2: already in place
      [1, 2, 8, 5, 9]     smallest of positions 2-4 is 5: swap with position 2
      [1, 2, 5, 8, 9]     smallest of positions 3-4 is 8: already in place
      [1, 2, 5, 8, 9]     done
      ```

      The list is split into a **sorted part** (on the left, growing by one each pass) and an **unsorted part** (on the right). That's the loop invariant: *after pass i, the first i + 1 items are the smallest items, in order.*

      ```python
      def selection_sort(lst):
          for i in range(len(lst) - 1):
              smallest = i
              for j in range(i + 1, len(lst)):
                  if lst[j] < lst[smallest]:
                      smallest = j
              lst[i], lst[smallest] = lst[smallest], lst[i]
      ```

      It sorts **in place** (Lesson 3.4): it rearranges the list it's given, using no second list, and returns `None` like `list.sort()`.

      **How much work?** The first pass compares n − 1 items, the next n − 2, and so on: (n − 1) + (n − 2) + ... + 1 = n(n − 1)/2 comparisons. That's the triangular loop from Lesson 4.2: **quadratic**. And it does that many comparisons **every time**, even if the list was already sorted, because it can't know the minimum without looking at every remaining item.

  - heading: Insertion sort
    body: |
      Now imagine picking cards up one at a time from the table and keeping your hand sorted. Each new card is **inserted** into its correct place among the cards you already hold, sliding the bigger cards along to make room.

      That's **insertion sort**:

      ```text
      [5 | 2, 8, 1, 9]     the sorted part starts as just [5]
      [2, 5 | 8, 1, 9]     insert 2: it's smaller than 5, so 5 slides right
      [2, 5, 8 | 1, 9]     insert 8: already bigger than 5, stays put
      [1, 2, 5, 8 | 9]     insert 1: 8, 5 and 2 all slide right
      [1, 2, 5, 8, 9 |]    insert 9: stays put. Done.
      ```

      ```python
      def insertion_sort(lst):
          for i in range(1, len(lst)):
              item = lst[i]
              j = i - 1
              while j >= 0 and lst[j] > item:
                  lst[j + 1] = lst[j]      # slide the bigger item right
                  j -= 1
              lst[j + 1] = item            # drop the item into the gap
      ```

      The invariant: *before pass i, the first i items are sorted* (but, unlike selection sort, they aren't necessarily the smallest items overall).

      **How much work?** It depends on the input:

      - **Worst case**, a list in reverse order: every new item slides all the way to the front. That's 1 + 2 + ... + (n − 1) = n(n − 1)/2 comparisons: quadratic.
      - **Best case**, an already sorted list: every new item is compared once with its left neighbour and stays put. That's n − 1 comparisons: **linear**!

      So insertion sort is excellent for lists that are **nearly sorted**, such as a sorted list with a few new items added at the end. That's why real-world sorting libraries use insertion sort for small or nearly sorted pieces of data.

  - heading: Stability
    body: |
      When you sort records by one field, what happens to records with equal keys? A **stable** sort keeps them in their original relative order.

      ```python
      people = [("Ada", 36), ("Bob", 25), ("Cy", 36), ("Di", 25)]
      ```

      Sorted by age with a stable sort: `Bob, Di, Ada, Cy`. Bob still comes before Di, and Ada before Cy, as in the original list. An unstable sort might give `Di, Bob, Cy, Ada`.

      Why care? Because stability lets you sort by **several keys in steps**. To sort people by age, and alphabetically within each age, first sort by name, then do a stable sort by age: the name order survives inside each age group.

      **Insertion sort is stable**: an item only slides past items that are strictly bigger (`lst[j] > item`), never past an equal one. **Selection sort is not**: its long-distance swaps can jump an item over an equal one. Python's `sorted` and `sort` are guaranteed stable (you relied on this in Lesson 3.5).

  - heading: The limits of comparing
    body: |
      Both algorithms are quadratic in the worst case: sorting a million items would take around 500 billion comparisons. That's far too slow, which is why Python's built-in sort uses a more advanced algorithm called **Timsort** (a blend of merge sort, Lesson 4.7, and insertion sort).

      There's also a completely different idea. If you're sorting **small whole numbers** (exam marks from 0 to 100, say), you don't need to compare items at all. Just **count** how many times each value appears, then write the values out in order. This is **counting sort**: it makes one pass to count and one pass over the possible values, so its work grows linearly. The catch is that it only works when the range of possible values is small; you'll try it in the last exercise.

      > **Key idea:** There's no single "best" sorting algorithm. The right choice depends on the size of the data, whether it's nearly sorted, whether stability matters, and what kind of values you're sorting. Asking "what do I know about my data?" is the heart of algorithm design.

examples:
  - title: Selection sort, pass by pass
    intro: Printing the list after each pass shows the sorted part growing on the left.
    code: |
      def selection_sort(lst):
          for i in range(len(lst) - 1):
              smallest = i
              for j in range(i + 1, len(lst)):
                  if lst[j] < lst[smallest]:
                      smallest = j
              lst[i], lst[smallest] = lst[smallest], lst[i]
              print(f"pass {i}: {lst}")

      cards = [5, 2, 8, 1, 9, 3]
      selection_sort(cards)
      print("sorted:", cards)
    output: |
      pass 0: [1, 2, 8, 5, 9, 3]
      pass 1: [1, 2, 8, 5, 9, 3]
      pass 2: [1, 2, 3, 5, 9, 8]
      pass 3: [1, 2, 3, 5, 9, 8]
      pass 4: [1, 2, 3, 5, 8, 9]
      sorted: [1, 2, 3, 5, 8, 9]
    lines:
      - line: 2
        note: "Each pass fixes one position, from the left. The last item needs no pass of its own: when everything else is in place, so is it."
      - line: 3-6
        note: "Find the *position* of the smallest item in the unsorted part, `lst[i:]`. This is a linear search for the minimum."
      - line: 7
        note: "Swap it into position `i` (the swap from Lesson 2.2). If it's already there, this swaps an item with itself, which is harmless."
      - line: 11-12
        note: "The function returns None; the list itself has been rearranged."
  - title: Insertion sort, pass by pass
    intro: Watch each new item slide into place in the sorted part.
    code: |
      def insertion_sort(lst):
          for i in range(1, len(lst)):
              item = lst[i]
              j = i - 1
              while j >= 0 and lst[j] > item:
                  lst[j + 1] = lst[j]
                  j -= 1
              lst[j + 1] = item
              print(f"insert {item}: {lst[:i + 1]} | {lst[i + 1:]}")

      cards = [5, 2, 8, 1, 9, 3]
      insertion_sort(cards)
    output: |
      insert 2: [2, 5] | [8, 1, 9, 3]
      insert 8: [2, 5, 8] | [1, 9, 3]
      insert 1: [1, 2, 5, 8] | [9, 3]
      insert 9: [1, 2, 5, 8, 9] | [3]
      insert 3: [1, 2, 3, 5, 8, 9] | []
    lines:
      - line: 3
        note: "Take the next item out of the list, leaving a \"gap\" at position i."
      - line: 5-7
        note: "Walk left through the sorted part, sliding each bigger item one place right. `j >= 0` stops at the front of the list. The order of the two conditions matters: with `j` at -1, `lst[j]` would quietly read the last item."
      - line: 8
        note: "Drop the item into the gap that's left."
      - line: 9
        note: "The `|` shows the boundary between the sorted and unsorted parts."
  - title: Counting comparisons
    intro: Best and worst cases, measured.
    code: |
      def selection_comparisons(lst):
          lst = lst[:]
          count = 0
          for i in range(len(lst) - 1):
              smallest = i
              for j in range(i + 1, len(lst)):
                  count += 1
                  if lst[j] < lst[smallest]:
                      smallest = j
              lst[i], lst[smallest] = lst[smallest], lst[i]
          return count

      def insertion_comparisons(lst):
          lst = lst[:]
          count = 0
          for i in range(1, len(lst)):
              item = lst[i]
              j = i - 1
              while j >= 0:
                  count += 1
                  if lst[j] <= item:
                      break
                  lst[j + 1] = lst[j]
                  j -= 1
              lst[j + 1] = item
          return count

      n = 1000
      for name, data in [("sorted", list(range(n))), ("reversed", list(range(n, 0, -1)))]:
          print(f"{name:>8}: selection {selection_comparisons(data):,}, insertion {insertion_comparisons(data):,}")
    output: |2
        sorted: selection 499,500, insertion 999
      reversed: selection 499,500, insertion 499,500
    lines:
      - line: 2
        note: "Work on a copy, so the caller's list isn't changed (Lesson 3.4)."
      - line: 19-24
        note: "The same insertion sort, rewritten so every comparison is counted: a comparison either stops the item (`break`) or slides a bigger item along."
      - line: 29
        note: "Selection sort always does n(n − 1)/2 = 499,500 comparisons. Insertion sort does just n − 1 = 999 on sorted data, and the same quadratic count on reversed data."
  - title: Stable and unstable
    intro: Sorting records by age with each algorithm.
    code: |
      def get_age(person):
          return person[1]

      def selection_by_key(lst, key):
          for i in range(len(lst) - 1):
              smallest = i
              for j in range(i + 1, len(lst)):
                  if key(lst[j]) < key(lst[smallest]):
                      smallest = j
              lst[i], lst[smallest] = lst[smallest], lst[i]

      def insertion_by_key(lst, key):
          for i in range(1, len(lst)):
              item = lst[i]
              j = i - 1
              while j >= 0 and key(lst[j]) > key(item):
                  lst[j + 1] = lst[j]
                  j -= 1
              lst[j + 1] = item

      people = [("Ada", 36), ("Cy", 36), ("Bob", 25)]
      a = people[:]
      selection_by_key(a, get_age)
      b = people[:]
      insertion_by_key(b, get_age)
      print("selection:", a)
      print("insertion:", b)
    output: |
      selection: [('Bob', 25), ('Cy', 36), ('Ada', 36)]
      insertion: [('Bob', 25), ('Ada', 36), ('Cy', 36)]
    lines:
      - line: 4-10
        note: "Selection sort, comparing by a key function (Lesson 3.5)."
      - line: 12-19
        note: "Insertion sort by key. The `>` means an item never slides past an equal one."
      - line: 21-27
        note: "Ada came before Cy (both 36). Selection sort's first swap moved Bob to the front by swapping him with Ada, throwing Ada behind Cy: **unstable**. Insertion sort kept Ada before Cy: **stable**."

playground:
  prompt: |
    Sort a list of words with both algorithms (strings compare alphabetically). Then try insertion sort on a list that's sorted except for one item at the end, and count how many times the inner loop runs.
  code: |
    def insertion_sort(lst):
        for i in range(1, len(lst)):
            item = lst[i]
            j = i - 1
            while j >= 0 and lst[j] > item:
                lst[j + 1] = lst[j]
                j -= 1
            lst[j + 1] = item

    words = ["pear", "apple", "fig", "kiwi", "banana"]
    insertion_sort(words)
    print(words)

exercises:
  - id: selection-sort
    title: Selection sort
    difficulty: 1
    prompt: |
      Write it in two steps (decomposition, Lesson 4.1):

      1. `index_of_min(lst, start)`: returns the index of the smallest item in `lst[start:]` (the first one, if there are ties).
      2. `selection_sort(lst)`: sorts `lst` **in place** using `index_of_min`, and returns `None`.

      Don't use `sorted`, `sort`, `min` or `max`.
    starter: |
      def index_of_min(lst, start):
          pass


      def selection_sort(lst):
          pass
    tests:
      - name: index_of_min
        code: |
          assert index_of_min([5, 2, 8, 1, 9], 0) == 3, f"Got {index_of_min([5, 2, 8, 1, 9], 0)}"
          assert index_of_min([5, 2, 8, 1, 9], 4) == 4
          assert index_of_min([4, 1, 7, 1], 0) == 1, "With a tie, return the first."
          assert index_of_min([4, 1, 7, 1], 2) == 3, "Only look from start onwards."
      - name: sorts in place
        code: |
          import random
          for _ in range(100):
              data = [random.randint(-50, 50) for _ in range(random.randint(0, 20))]
              want = sorted(data)
              result = selection_sort(data)
              assert data == want, f"After selection_sort the list was {data}"
              assert result is None, "Sort in place and return None."
      - name: no built-in sorting
        code: |
          code = source.replace("index_of_min(", "")
          for banned in ["sorted(", ".sort(", "min(", "max("]:
              assert banned not in code, f"Don't use {banned[:-1]}."
          body = source[source.index("def selection_sort"):]
          assert "index_of_min(" in body, "Use index_of_min inside selection_sort."
    hints:
      - "`index_of_min`: start with `smallest = start`, then loop `for j in range(start + 1, len(lst))`, updating `smallest` when `lst[j] < lst[smallest]`."
      - "`selection_sort`: `for i in range(len(lst) - 1):` find `m = index_of_min(lst, i)`, then swap positions `i` and `m`."
    solution: |
      def index_of_min(lst, start):
          """Index of the first smallest item in lst[start:]."""
          smallest = start
          for j in range(start + 1, len(lst)):
              if lst[j] < lst[smallest]:
                  smallest = j
          return smallest


      def selection_sort(lst):
          """Sort lst in place by repeatedly selecting the minimum."""
          for i in range(len(lst) - 1):
              m = index_of_min(lst, i)
              lst[i], lst[m] = lst[m], lst[i]
    explanation: |
      Splitting out `index_of_min` makes the sort read almost like the English description: "for each position, find the smallest remaining item and swap it into place". The test sorts 100 random lists and compares with Python's `sorted`, the brute-force check from Lesson 4.1. With an empty or one-item list, `range(len(lst) - 1)` is empty, so nothing happens, which is correct.

  - id: insertion-sort
    title: Insertion sort
    difficulty: 2
    prompt: |
      Write `insertion_sort(lst)` that sorts the list **in place** by insertion and returns `None`. Try writing it from the card-sorting idea rather than copying the lesson: take each item in turn and slide it left past the bigger items.

      The tests also check it's fast on an **already sorted** list of 100,000 items, which insertion sort should handle in linear time.
    starter: |
      def insertion_sort(lst):
          pass
    tests:
      - name: sorts random lists
        code: |
          import random
          for _ in range(100):
              data = [random.randint(-50, 50) for _ in range(random.randint(0, 20))]
              want = sorted(data)
              assert insertion_sort(data) is None, "Sort in place and return None."
              assert data == want, f"Got {data}"
      - name: strings and edge cases
        code: |
          w = ["pear", "apple", "fig"]
          insertion_sort(w)
          assert w == ["apple", "fig", "pear"]
          e = []
          insertion_sort(e)
          assert e == []
      - name: linear on sorted input
        code: |
          big = list(range(100_000))
          insertion_sort(big)
          assert big == list(range(100_000))
          nearly = list(range(100_000)) + [-1]
          insertion_sort(nearly)
          assert nearly[0] == -1 and nearly[-1] == 99_999
      - name: no built-in sorting
        code: |
          assert "sorted(" not in source and ".sort(" not in source
    hints:
      - "Loop `for i in range(1, len(lst)):`, and save `item = lst[i]`."
      - "Walk `j` left from `i - 1` while `j >= 0 and lst[j] > item`, copying `lst[j]` into `lst[j + 1]`."
      - "When the loop stops, `lst[j + 1] = item`. On sorted input the `while` condition is false straight away, so each item costs one comparison."
    solution: |
      def insertion_sort(lst):
          """Sort lst in place by inserting each item into the sorted part."""
          for i in range(1, len(lst)):
              item = lst[i]
              j = i - 1
              while j >= 0 and lst[j] > item:
                  lst[j + 1] = lst[j]
                  j -= 1
              lst[j + 1] = item
    explanation: |
      On already sorted input the inner `while` never runs, so sorting 100,000 items takes about 100,000 steps; selection sort would take 5 billion. The "nearly sorted" test adds one out-of-place item at the end, which slides all the way to the front once: still linear overall. Sliding (copying each bigger item one place right) is cheaper than swapping, because it writes each item once.

  - id: sort-records
    title: Stable sort by key
    difficulty: 2
    prompt: |
      Write `sorted_by(records, key)` that returns a **new** sorted list (leaving `records` unchanged) using insertion sort, comparing items by `key(item)`. It must be **stable**: items with equal keys keep their original order.

      Then use it to set `by_age_then_name`: the `people` list sorted by age, and alphabetically by name within each age. Do it with **two** calls to `sorted_by` (first by name, then by age), relying on stability.
    starter: |
      people = [("Cy", 36), ("Bob", 25), ("Ada", 36), ("Di", 25), ("Al", 30)]


      def sorted_by(records, key):
          pass


      def get_name(person):
          return person[0]


      def get_age(person):
          return person[1]


      by_age_then_name = []
    tests:
      - name: sorts by key and returns a new list
        code: |
          data = [3, 1, 2]
          got = sorted_by(data, lambda x: -x)
          assert got == [3, 2, 1], f"Sorting by -x should give descending order. Got {got}"
          assert data == [3, 1, 2], "Don't change the original list."
      - name: stable
        code: |
          recs = [("a", 2), ("b", 1), ("c", 2), ("d", 1), ("e", 2)]
          got = sorted_by(recs, lambda r: r[1])
          assert got == [("b", 1), ("d", 1), ("a", 2), ("c", 2), ("e", 2)], f"Equal keys must keep their order. Got {got}"
      - name: two-step sort
        code: |
          want = [("Bob", 25), ("Di", 25), ("Al", 30), ("Ada", 36), ("Cy", 36)]
          assert by_age_then_name == want, f"by_age_then_name is {by_age_then_name}"
      - name: written by hand
        code: |
          assert "sorted(" not in source and ".sort(" not in source, "Use your own insertion sort."
    hints:
      - "Copy first: `result = records[:]`, then insertion-sort `result`, comparing `key(result[j]) > key(item)`."
      - "Strictly greater (`>`) is what makes it stable: an item never moves past an equal one."
      - "`by_age_then_name = sorted_by(sorted_by(people, get_name), get_age)`: sort by the *less* important key first."
    solution: |
      people = [("Cy", 36), ("Bob", 25), ("Ada", 36), ("Di", 25), ("Al", 30)]


      def sorted_by(records, key):
          """Return a new list of records stably sorted by key(record)."""
          result = records[:]
          for i in range(1, len(result)):
              item = result[i]
              j = i - 1
              while j >= 0 and key(result[j]) > key(item):
                  result[j + 1] = result[j]
                  j -= 1
              result[j + 1] = item
          return result


      def get_name(person):
          return person[0]


      def get_age(person):
          return person[1]


      by_age_then_name = sorted_by(sorted_by(people, get_name), get_age)
    explanation: |
      Sorting by name first, then stably by age, leaves the names in order within each age group, because the second sort never reorders people whose ages are equal. This is how spreadsheet programs sort by several columns: you click the least important column first. Changing `>` to `>=` would break stability, and the two-step trick with it.

  - id: count-insertion
    title: Count the shifts
    difficulty: 2
    prompt: |
      An **inversion** in a list is a pair of positions `i < j` where `lst[i] > lst[j]`: two items in the wrong order. Insertion sort does exactly one slide for every inversion, so counting slides measures how unsorted a list is.

      Write `count_inversions(lst)` that returns the number of inversions by running insertion sort on a **copy** and counting the slides (each time an item moves one place right). Don't change `lst`.

      ```python
      count_inversions([1, 2, 3])      # 0
      count_inversions([3, 2, 1])      # 3
      count_inversions([2, 4, 1, 3])   # 3  (2>1, 4>1, 4>3)
      ```
    starter: |
      def count_inversions(lst):
          pass
    tests:
      - name: examples
        code: |
          for data, want in [([1, 2, 3], 0), ([3, 2, 1], 3), ([2, 4, 1, 3], 3), ([], 0), ([5], 0), ([1, 1, 1], 0)]:
              assert count_inversions(data) == want, f"count_inversions({data}) returned {count_inversions(data)}, expected {want}"
      - name: matches the definition
        code: |
          import random
          for _ in range(200):
              data = [random.randint(0, 9) for _ in range(random.randint(0, 12))]
              want = sum(1 for i in range(len(data)) for j in range(i + 1, len(data)) if data[i] > data[j])
              assert count_inversions(data) == want, f"For {data}: got {count_inversions(data)}, expected {want}"
      - name: original unchanged and reversed lists
        code: |
          data = [3, 1, 2]
          count_inversions(data)
          assert data == [3, 1, 2], "Work on a copy."
          assert count_inversions(list(range(100, 0, -1))) == 4950, "A reversed list of n items has n(n-1)/2 inversions."
    hints:
      - "Copy with `lst[:]`, then insertion-sort the copy."
      - "Add 1 to a counter every time the `while` loop body runs (`a[j + 1] = a[j]`)."
    solution: |
      def count_inversions(lst):
          """Number of pairs i < j with lst[i] > lst[j]."""
          a = lst[:]
          slides = 0
          for i in range(1, len(a)):
              item = a[i]
              j = i - 1
              while j >= 0 and a[j] > item:
                  a[j + 1] = a[j]
                  j -= 1
                  slides += 1
              a[j + 1] = item
          return slides
    explanation: |
      Each slide moves an item past exactly one bigger item that was before it, fixing exactly one inversion, so the number of slides equals the number of inversions. That gives a precise statement of insertion sort's speed: its work is about n plus the number of inversions. A sorted list has none (linear time); a reversed list has the maximum, n(n − 1)/2 (quadratic). Inversion counts are used for real to measure how similar two rankings are, such as two people's movie preferences.

  - id: counting-sort
    title: Counting sort
    difficulty: 3
    prompt: |
      Exam marks are whole numbers from 0 to 100. Write `counting_sort(marks)` that returns a **new** sorted list **without comparing marks to each other**:

      1. Make a list `counts` of 101 zeros, where `counts[m]` will hold how many times mark `m` appears.
      2. One pass over `marks` fills in the counts.
      3. One pass over the possible marks 0 to 100 builds the result: each mark `m` repeated `counts[m]` times.

      ```python
      counting_sort([70, 45, 70, 100, 0, 45])   # [0, 45, 45, 70, 70, 100]
      ```

      The tests sort a million marks, so a quadratic sort won't finish in time.
    starter: |
      def counting_sort(marks):
          pass
    tests:
      - name: small examples
        code: |
          assert counting_sort([70, 45, 70, 100, 0, 45]) == [0, 45, 45, 70, 70, 100], f"Got {counting_sort([70, 45, 70, 100, 0, 45])}"
          assert counting_sort([]) == []
          assert counting_sort([100, 100]) == [100, 100]
      - name: a million marks
        code: |
          import random
          random.seed(4)
          marks = [random.randint(0, 100) for _ in range(1_000_000)]
          got = counting_sort(marks)
          assert len(got) == 1_000_000 and got[0] == 0 and got[-1] == 100
          assert all(got[i] <= got[i + 1] for i in range(0, 1_000_000 - 1, 997))
          assert got.count(50) == marks.count(50)
      - name: original unchanged and no comparison sorting
        code: |
          data = [3, 1, 2]
          assert counting_sort(data) == [1, 2, 3] and data == [3, 1, 2]
          assert "sorted(" not in source and ".sort(" not in source
    hints:
      - "`counts = [0] * 101` (safe: the items are numbers, not lists, Lesson 3.4)."
      - "`for m in marks: counts[m] += 1`. The mark itself is used as an index."
      - "`for m in range(101): result.extend([m] * counts[m])`."
    solution: |
      def counting_sort(marks):
          """Sort whole-number marks in the range 0-100 by counting."""
          counts = [0] * 101
          for m in marks:
              counts[m] += 1
          result = []
          for m in range(101):
              result.extend([m] * counts[m])
          return result
    explanation: |
      Counting sort uses each mark as an **index**, so it never asks "is this mark smaller than that one?". Its work is one pass over the n marks plus one pass over the k = 101 possible values: linear, about a million steps for a million marks, where selection sort would need 500 billion comparisons. The price is that it needs to know the range of values in advance, and it needs memory for every possible value: counting sort on arbitrary 64-bit numbers would need a list of 18 quintillion counts. Knowing something about your data can beat any general-purpose algorithm.

commonMistakes:
  - title: Testing j and lst[j] in the wrong order
    explanation: |
      In insertion sort, check `j >= 0` **before** `lst[j] > item`. Otherwise, when `j` reaches −1, `lst[-1]` silently reads the last item instead of stopping.
    wrong: |
      while lst[j] > item and j >= 0:
    right: |
      while j >= 0 and lst[j] > item:
  - title: Swapping inside selection sort's inner loop
    explanation: |
      Selection sort should find the position of the minimum first, then swap **once** per pass. Swapping every time a smaller item is seen still sorts, but does far more work.
  - title: Expecting an in-place sort to return the list
    explanation: |
      In-place sorts return `None`, like `list.sort()`. Sort, then use the list.
    wrong: |
      result = insertion_sort(data)   # None
    right: |
      insertion_sort(data)
      result = data
  - title: Using >= and losing stability
    explanation: |
      In insertion sort, sliding past items that are **equal** (`>=`) reorders equal keys, making the sort unstable. Use `>`.

summary:
  - "**Selection sort**: repeatedly find the minimum of the unsorted part and swap it into place. Always n(n − 1)/2 comparisons; not stable."
  - "**Insertion sort**: take each item and slide it left into the sorted part. Quadratic in the worst case, **linear on sorted or nearly sorted data**; stable."
  - "Both sort **in place**, using no second list, and are described by loop invariants about the sorted part."
  - "A **stable** sort keeps equal keys in their original order, which allows sorting by several keys in steps."
  - "Insertion sort's work is about n plus the number of **inversions** (out-of-order pairs)."
  - "**Counting sort** sorts small whole numbers in linear time without comparisons, by using values as indexes."
next: |
  Both simple sorts are too slow for big lists. The faster method in Lesson 4.7 depends on a powerful idea: a function that solves a problem by calling **itself** on smaller versions of the same problem. In **Lesson 4.5** you'll learn this idea, called **recursion**, from the ground up.

quiz:
  - type: mcq
    question: "After the first pass of selection sort on `[4, 7, 1, 9, 3]`, what is the list?"
    options: ["[1, 7, 4, 9, 3]", "[1, 4, 7, 9, 3]", "[4, 1, 7, 9, 3]", "[1, 3, 4, 7, 9]"]
    answer: 0
    explanation: The minimum, 1, is swapped with the first item, 4.
  - type: mcq
    question: "After inserting the first three items (passes for 7 and 1) with insertion sort on `[4, 7, 1, 9, 3]`, what is the sorted part?"
    options: ["[1, 4, 7]", "[4, 7, 1]", "[1, 3, 4]", "[4, 7]"]
    answer: 0
    explanation: 7 stays after 4, then 1 slides left past both into the front.
  - type: mcq
    question: Which algorithm does only n − 1 comparisons on an already sorted list?
    options: ["Selection sort", "Insertion sort", "Both", "Neither"]
    answer: 1
    explanation: Each item is compared once with its left neighbour and stays put. Selection sort still scans for the minimum every pass.
  - type: mcq
    question: What does it mean for a sort to be stable?
    options:
      - It never crashes
      - Items with equal keys keep their original relative order
      - It uses no extra memory
      - It always takes the same time
    answer: 1
    explanation: Stability is about the order of equal items, and lets you sort by several keys in steps.
  - type: mcq
    question: About how many comparisons does selection sort do on 1,000 items?
    options: ["1,000", "10,000", "500,000", "1,000,000,000"]
    answer: 2
    explanation: n(n − 1)/2 = 1000 × 999 / 2 = 499,500.
  - type: mcq
    question: When is counting sort a good choice?
    options:
      - For any list of strings
      - When the values are whole numbers in a small known range
      - When the list is nearly sorted
      - When you need to sort floats
    answer: 1
    explanation: It uses values as indexes into a counts list, so the range must be small and made of whole numbers.
  - type: code
    question: |
      Write `is_sorted(lst)` that returns True if every item is less than or equal to the next one (an empty or one-item list is sorted). Don't use `sorted` or `sort`.
    starter: |
      def is_sorted(lst):
          pass
    tests:
      - name: checks order
        code: |
          for data, want in [([], True), ([1], True), ([1, 2, 2, 5], True), ([2, 1], False), ([1, 3, 2, 4], False), (["a", "b"], True)]:
              assert is_sorted(data) == want, f"is_sorted({data}) returned {is_sorted(data)}"
          assert "sorted(" not in source.replace("def is_sorted(", "").replace("is_sorted(", "") and ".sort(" not in source
    solution: |
      def is_sorted(lst):
          for i in range(len(lst) - 1):
              if lst[i] > lst[i + 1]:
                  return False
          return True
