    tests:
      - name: multiplies recursively
        code: |
          for data, want in [([], 1), ([5], 5), ([2, 3, 4], 24), ([1, -2, 3], -6), ([7, 0, 9], 0)]:
              assert product(data) == want, f"product({data}) returned {product(data)}"
          assert not uses_loop(), "Use recursion."
    solution: |
      def product(lst):
          if not lst:
              return 1
          return lst[0] * product(lst[1:])
