  - type: code
    question: |
      Write a recursive `depth(data)` that returns how deeply a list is nested: a list with no lists inside has depth 1, `[1, [2]]` has depth 2, and `[[[]]]` has depth 3. A non-list value has depth 0.
    starter: |
      def depth(data):
          pass
    tests:
      - name: measures nesting
        code: |
          for data, want in [(5, 0), ([], 1), ([1, 2], 1), ([1, [2]], 2), ([[[]]], 3), ([1, [2, [3]], [4]], 3), ([[], [[[[]]]]], 5)]:
              assert depth(data) == want, f"depth({data}) returned {depth(data)}, expected {want}"
    solution: |
      def depth(data):
          if not isinstance(data, list):
              return 0
          deepest = 0
          for item in data:
              deepest = max(deepest, depth(item))
          return 1 + deepest
