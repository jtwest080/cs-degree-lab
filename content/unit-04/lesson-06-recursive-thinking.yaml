id: u4-recursive-thinking
title: Thinking Recursively
minutes: 55
objective: |
  Use recursion where it's genuinely the best tool: processing **nested data**, **halving** problems (fast exponentiation, recursive binary search), and **generating every possibility** (subsets, arrangements, the Towers of Hanoi).
outcomes:
  - Process lists nested to any depth with a recursive function
  - Use `isinstance` to tell a list from a single value
  - Halve a problem recursively, as in fast exponentiation and binary search
  - Pass extra parameters (like `lo` and `hi`) to avoid copying lists
  - Generate all subsets and all arrangements of a collection
  - Solve the Towers of Hanoi and explain why it takes 2ⁿ − 1 moves

sections:
  - heading: Data inside data
    body: |
      Some data contains **smaller copies of itself**. A folder holds files and *other folders*, which hold files and other folders. A list can hold numbers and *other lists*:

      ```python
      data = [1, [2, 3], [[4], 5], [], 6]
      ```

      How would you add up every number in that? A loop handles one level; two nested loops handle two levels. But the nesting could go any number of levels deep, and you can't write a loop for each level you don't know about.

      Recursion handles it naturally, because the data's *shape* is recursive: **a nested list is a list whose items are either numbers or nested lists**. The function follows the same shape:

      ```python
      def nested_sum(data):
          total = 0
          for item in data:
              if isinstance(item, list):
                  total += nested_sum(item)    # a smaller nested list: recurse
              else:
                  total += item                # a plain number
          return total
      ```

      `isinstance(item, list)` asks "is this item a list?" (it's True for lists and False for numbers, strings and so on). Notice this function mixes a loop *and* recursion: the loop walks along one level, and recursion dives into deeper levels. The base case is hidden: a list containing no lists makes no recursive calls.

      > **Key idea:** When data is defined in terms of itself, the code that processes it should be too. This is why recursion is everywhere in Unit 7, where you'll meet trees: structures made of smaller trees.

  - heading: Halving
    body: |
      In Lesson 4.5, `power(base, exp)` made `exp` recursive calls. There's a much faster recursive idea, based on halving, like binary search:

      - b¹⁰ = (b⁵)². To get b¹⁰ you only need b⁵, then one multiplication.
      - b⁵ = b × (b²)². An odd power is b times an even power.

      ```python
      def fast_power(b, e):
          if e == 0:
              return 1
          half = fast_power(b, e // 2)
          if e % 2 == 0:
              return half * half
          return b * half * half
      ```

      Each call halves `e`, so it makes about log₂ e calls instead of e: 20 calls for an exponent of a million, instead of a million (which would also crash, far beyond the recursion limit). This is **fast exponentiation**, and it's how computers raise numbers to enormous powers in cryptography (Unit 16).

      Notice `half` is computed once and used twice. Writing `fast_power(b, e // 2) * fast_power(b, e // 2)` would make two calls at every level, and all the benefit would be lost.

  - heading: Helper parameters instead of slicing
    body: |
      Binary search is naturally recursive too: search the middle; if it's not there, search the correct *half*, which is a smaller version of the same problem. But slicing (`lst[:mid]`) copies half the list on every call, a hidden linear cost (Lesson 4.2) that would destroy binary search's speed. Instead, pass the boundaries as **extra parameters**:

      ```python
      def search(lst, target, lo, hi):
          if lo > hi:
              return -1                                  # empty range
          mid = (lo + hi) // 2
          if lst[mid] == target:
              return mid
          if lst[mid] < target:
              return search(lst, target, mid + 1, hi)    # right half
          return search(lst, target, lo, mid - 1)        # left half
      ```

      You call it as `search(lst, target, 0, len(lst) - 1)`. The list is shared by every call (no copies); only the two numbers change. A **default parameter** (Lesson 2.8) can hide the extra arguments from callers: `def search(lst, target, lo=0, hi=None):` and then `if hi is None: hi = len(lst) - 1`.

      Compare this with the loop version in Lesson 4.3: `lo` and `hi` play exactly the same roles. The loop's "update and go round again" has become "call again with new values".

  - heading: Generating every possibility
    body: |
      Many problems require trying **every possible combination**: every way to pack a bag, every order to visit some cities, every combination of toppings. Recursion is the natural way to generate them.

      Take **subsets**. What are all the subsets of `[a, b, c]`? Think recursively about the first item: every subset either **leaves out** `a` or **includes** `a`. And in both cases, the rest is just a subset of `[b, c]`, a smaller version of the same problem. So:

      1. Recursively find all subsets of the rest, `[b, c]`: `[], [c], [b], [b, c]`.
      2. The answer is those subsets, **plus** each of them with `a` added: `[a], [a, c], [a, b], [a, b, c]`.

      The base case: the empty list has exactly one subset, the empty list itself.

      Each item doubles the number of subsets, so n items have **2ⁿ** subsets, the same 2ⁿ patterns of n bits from Lesson 1.1 (each bit says "in" or "out" for one item).

      **Arrangements** (also called **permutations**) work similarly: to arrange `[a, b, c]`, choose which item goes **first** (3 choices), then arrange the remaining items behind it (a smaller version of the problem). n items have n × (n − 1) × ... × 1 = **n!** arrangements: the factorial from Lesson 4.5.

      Both counts grow terrifyingly fast. 2³⁰ is about a billion subsets; 20! is about 2.4 quintillion arrangements. Generating everything is called **brute force**. It's simple and always correct, and only practical for small inputs. Lesson 4.8 looks at when brute force is good enough and what to do when it isn't.

  - heading: The Towers of Hanoi
    body: |
      A classic puzzle: three pegs, and a stack of n discs of different sizes on the first peg, largest at the bottom. Move the whole stack to the third peg, moving one disc at a time, and **never putting a bigger disc on a smaller one**.

      With 3 discs, people usually solve it by trial and error. With 8, it's very hard without a method. But recursively, the solution is three lines:

      To move n discs from `source` to `target`, using `spare`:

      1. Move the top n − 1 discs from `source` to `spare` (recursively, using `target` as the spare).
      2. Move the biggest disc from `source` to `target`.
      3. Move the n − 1 discs from `spare` to `target` (recursively, using `source` as the spare).

      The base case: moving 0 discs needs no moves at all.

      This is the leap of faith (Lesson 4.5) at its most impressive: you don't need to know *how* the n − 1 discs get moved, only that a smaller version of the same problem can be solved. Counting moves: M(n) = 2 × M(n − 1) + 1, which gives **2ⁿ − 1** moves. A legend says monks are moving 64 golden discs; at one move a second, they'll finish in about 585 billion years.

examples:
  - title: Summing nested lists
    intro: A loop for each level, recursion for each deeper level.
    code: |
      def nested_sum(data):
          total = 0
          for item in data:
              if isinstance(item, list):
                  total += nested_sum(item)
              else:
                  total += item
          return total

      print(nested_sum([1, 2, 3]))
      print(nested_sum([1, [2, 3], [[4], 5], [], 6]))
      print(nested_sum([[[[[10]]]]]))
      print(isinstance([1], list), isinstance(1, list))
    output: |
      6
      21
      10
      True False
    lines:
      - line: 3
        note: "The loop walks along one level of the list."
      - line: 4-5
        note: "If an item is itself a list, a recursive call handles everything inside it, however deep."
      - line: 6-7
        note: "Otherwise it's a plain number."
      - line: 12
        note: "Five levels deep: five recursive calls, each with one item."
  - title: Fast exponentiation
    intro: Counting calls shows the halving.
    code: |
      calls = [0]

      def fast_power(b, e):
          calls[0] += 1
          if e == 0:
              return 1
          half = fast_power(b, e // 2)
          if e % 2 == 0:
              return half * half
          return b * half * half

      print(fast_power(2, 10))
      for e in [10, 1000, 1_000_000]:
          calls[0] = 0
          result = fast_power(3, e)
          print(f"e={e:,}: {calls[0]} calls, {result.bit_length():,} bits")
    output: |
      1024
      e=10: 5 calls, 16 bits
      e=1,000: 11 calls, 1,585 bits
      e=1,000,000: 21 calls, 1,584,963 bits
    lines:
      - line: 7
        note: "Solve the half-sized problem **once**, and store it."
      - line: 8-10
        note: "An even power is the half squared; an odd power needs one extra factor of b (because `e // 2` rounded down)."
      - line: 13-16
        note: "A million-fold bigger exponent needs only about 4 times as many calls: logarithmic growth. The answer, 3 to the millionth power, is a number about 1.6 million bits long (`bit_length`, Lesson 4.2), nearly half a million decimal digits."
  - title: All subsets
    intro: Each item is either left out or put in.
    code: |
      def subsets(items):
          if not items:
              return [[]]
          first = items[0]
          without_first = subsets(items[1:])
          with_first = [[first] + s for s in without_first]
          return without_first + with_first

      print(subsets(["a", "b", "c"]))
      print(len(subsets(list(range(10)))))
    output: |
      [[], ['c'], ['b'], ['b', 'c'], ['a'], ['a', 'c'], ['a', 'b'], ['a', 'b', 'c']]
      1024
    lines:
      - line: 2-3
        note: "Base case: the empty list has one subset, the empty list. Note `[[]]` (a list containing one empty list), not `[]` (no subsets at all)."
      - line: 5
        note: "Leap of faith: assume we have every subset of the rest."
      - line: 6
        note: "Each of those, with `first` added at the front (a comprehension, Lesson 3.8)."
      - line: 10
        note: "10 items have 2¹⁰ = 1024 subsets."
  - title: Towers of Hanoi
    intro: Three lines of recursion solve the puzzle for any number of discs.
    code: |
      def hanoi(n, source, target, spare):
          if n == 0:
              return
          hanoi(n - 1, source, spare, target)
          print(f"move disc {n} from {source} to {target}")
          hanoi(n - 1, spare, target, source)

      hanoi(3, "A", "C", "B")
    output: |
      move disc 1 from A to C
      move disc 2 from A to B
      move disc 1 from C to B
      move disc 3 from A to C
      move disc 1 from B to A
      move disc 2 from B to C
      move disc 1 from A to C
    lines:
      - line: 2-3
        note: "Base case: zero discs, nothing to do."
      - line: 4
        note: "Move the smaller discs out of the way, onto the spare peg. The roles of the pegs swap in the recursive call."
      - line: 5
        note: "Now the biggest disc (number n) is free to move."
      - line: 6
        note: "Move the smaller discs back on top of it. Seven moves for 3 discs: 2³ − 1."

playground:
  prompt: |
    Write a recursive function that prints every binary string of length n (for n = 3: 000, 001, ..., 111). Hint: every string is "0" followed by a string of length n − 1, or "1" followed by one. How many are there for n = 4? Does it remind you of Lesson 1.1?
  code: |
    def binary_strings(n):
        if n == 0:
            return [""]
        shorter = binary_strings(n - 1)
        return ["0" + s for s in shorter] + ["1" + s for s in shorter]

    print(binary_strings(3))

exercises:
  - id: nested-count
    title: Flatten a nested list
    difficulty: 2
    prompt: |
      Write a recursive function `flatten(data)` that takes a list nested to any depth and returns a **flat** list of all the non-list items, in order.

      ```python
      flatten([1, [2, 3], [[4], 5], [], 6])   # [1, 2, 3, 4, 5, 6]
      flatten([["a"], [["b", ["c"]]]])        # ['a', 'b', 'c']
      ```
    starter: |
      def flatten(data):
          pass
    tests:
      - name: examples
        code: |
          assert flatten([1, [2, 3], [[4], 5], [], 6]) == [1, 2, 3, 4, 5, 6], f"Got {flatten([1, [2, 3], [[4], 5], [], 6])}"
          assert flatten([["a"], [["b", ["c"]]]]) == ["a", "b", "c"]
      - name: edge cases
        code: |
          assert flatten([]) == []
          assert flatten([[], [[]], [[[]]]]) == [], "Only empty lists: nothing to collect."
          assert flatten([1, 2, 3]) == [1, 2, 3]
      - name: very deep nesting
        code: |
          deep = [7]
          for _ in range(200):
              deep = [deep]
          assert flatten(deep) == [7]
      - name: original unchanged
        code: |
          d = [1, [2, [3]]]
          flatten(d)
          assert d == [1, [2, [3]]]
    hints:
      - "Start with `result = []` and loop over the items of `data`."
      - "If `isinstance(item, list)`, the recursive call `flatten(item)` gives a flat list of everything inside it: add all of those with `result.extend(...)`."
      - "Otherwise append the item itself."
    solution: |
      def flatten(data):
          """Return all non-list items of a nested list, in order."""
          result = []
          for item in data:
              if isinstance(item, list):
                  result.extend(flatten(item))
              else:
                  result.append(item)
          return result
    explanation: |
      Trust the recursive call to flatten each inner list, and the only job left is joining the pieces. `extend` adds every item of the flattened inner list; `append` would add the inner list itself, undoing the flattening. In Lesson 3.8 a comprehension flattened exactly *one* level; recursion handles any depth.

  - id: fast-power
    title: Fast power
    difficulty: 2
    prompt: |
      Write `fast_power(b, e)` that computes `b` to the power of a whole number `e ≥ 0` by **halving** recursively, without `**` or `pow`. It must handle exponents of hundreds of thousands, which would exceed Python's recursion limit if `e` only went down by 1 each call.

      ```python
      fast_power(2, 10)      # 1024
      fast_power(3, 0)       # 1
      ```
    starter: |
      def fast_power(b, e):
          if e == 0:
              return 1
          return b * fast_power(b, e - 1)
    tests:
      - name: small powers
        code: |
          for b, e in [(2, 0), (2, 1), (2, 10), (3, 5), (5, 3), (-2, 7), (10, 6), (1, 1000)]:
              assert fast_power(b, e) == b ** e, f"fast_power({b}, {e}) returned {fast_power(b, e)}"
      - name: huge exponents
        code: |
          assert fast_power(2, 100_000) == 2 ** 100_000, "fast_power(2, 100000) is wrong"
          assert fast_power(3, 500_001) % 1000 == pow(3, 500_001, 1000)
      - name: no ** or pow
        code: |
          assert "**" not in source and "pow(" not in source.replace("fast_power(", ""), "Multiply instead."
    hints:
      - "Compute `half = fast_power(b, e // 2)` once."
      - "If `e` is even, the answer is `half * half`; if odd, `b * half * half`."
      - "Don't call `fast_power(b, e // 2)` twice: that throws away the speed-up."
    solution: |
      def fast_power(b, e):
          """b to the power e (whole number e >= 0), by halving."""
          if e == 0:
              return 1
          half = fast_power(b, e // 2)
          if e % 2 == 0:
              return half * half
          return b * half * half
    explanation: |
      The starter goes one step at a time: 100,000 calls deep, far beyond the recursion limit, so it crashes with RecursionError. Halving needs only 17 levels for 100,000. This is the same logarithmic trick as binary search, applied to arithmetic. (Python's built-in `**` uses a loop version of exactly this algorithm.)

  - id: recursive-search
    title: Recursive binary search
    difficulty: 2
    prompt: |
      Write `search(lst, target, lo=0, hi=None)`, a **recursive** binary search on a sorted list that returns the index of `target` or `-1`. Callers just write `search(lst, target)`; when `hi` is `None`, set it to `len(lst) - 1`.

      Don't slice the list (that would copy it on every call) and don't use a loop.
    starter: |
      def search(lst, target, lo=0, hi=None):
          if hi is None:
              hi = len(lst) - 1
    tests:
      - name: finds items
        code: |
          data = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]
          for i, x in enumerate(data):
              assert search(data, x) == i, f"search(data, {x}) returned {search(data, x)}"
      - name: missing items and edge cases
        code: |
          data = [2, 5, 8, 12, 16]
          for x in [1, 3, 17]:
              assert search(data, x) == -1, f"search(data, {x}) returned {search(data, x)}"
          assert search([], 4) == -1 and search([4], 4) == 0
      - name: fast on a big list, no loops or slicing
        code: |
          big = list(range(0, 2_000_000, 2))
          for x in range(0, 2_000_000, 4999):
              assert search(big, x) == (x // 2 if x % 2 == 0 else -1)
          assert not uses_loop(), "Use recursion instead of a loop."
          assert "lst[lo:" not in source and "lst[:" not in source and "lst[mid" not in source.replace("lst[mid]", ""), "Don't slice the list."
    hints:
      - "Base case: if `lo > hi`, the range is empty: return -1."
      - "Otherwise compute `mid`; if `lst[mid] == target`, return `mid`."
      - "Recurse on one half by changing `lo` or `hi`, and **return** the result: `return search(lst, target, mid + 1, hi)`."
    solution: |
      def search(lst, target, lo=0, hi=None):
          """Index of target in sorted lst, or -1 (recursive binary search)."""
          if hi is None:
              hi = len(lst) - 1
          if lo > hi:
              return -1
          mid = (lo + hi) // 2
          if lst[mid] == target:
              return mid
          if lst[mid] < target:
              return search(lst, target, mid + 1, hi)
          return search(lst, target, lo, mid - 1)
    explanation: |
      `lo` and `hi` carry the state that the loop version kept in variables. Default parameters keep the call simple for users while letting the function pass extra information to itself. Forgetting `return` before the recursive calls is the classic bug here: the answer would be computed deep in the recursion and then thrown away, giving `None`.

  - id: all-subsets
    title: Subsets that add up
    difficulty: 3
    prompt: |
      1. Write a recursive `subsets(items)` returning a list of all subsets of `items` (each a list). Any order is fine.
      2. Use it to write `subsets_with_sum(nums, target)`: all subsets of `nums` whose items add up to `target`, each subset **sorted**, and the list of subsets sorted too.

      ```python
      subsets_with_sum([3, 1, 4, 2], 5)   # [[1, 4], [2, 3]]
      subsets_with_sum([5, 5, 10], 10)    # [[5, 5], [10]]
      ```

      (This brute-force approach is fine for up to about 20 numbers: 2²⁰ is about a million subsets.)
    starter: |
      def subsets(items):
          pass


      def subsets_with_sum(nums, target):
          pass
    tests:
      - name: subsets
        code: |
          got = sorted(sorted(s) for s in subsets([1, 2, 3]))
          assert got == [[], [1], [1, 2], [1, 2, 3], [1, 3], [2], [2, 3], [3]], f"Got {got}"
          assert subsets([]) == [[]], "The empty list has exactly one subset: []."
          assert len(subsets(list(range(12)))) == 4096
      - name: subsets_with_sum
        code: |
          assert subsets_with_sum([3, 1, 4, 2], 5) == [[1, 4], [2, 3]], f"Got {subsets_with_sum([3, 1, 4, 2], 5)}"
          assert subsets_with_sum([5, 5, 10], 10) == [[5, 5], [10]], f"Got {subsets_with_sum([5, 5, 10], 10)}"
          assert subsets_with_sum([1, 2], 10) == []
          assert subsets_with_sum([1, 2], 0) == [[]], "The empty subset adds up to 0."
      - name: medium input
        code: |
          got = subsets_with_sum(list(range(1, 16)), 100)
          assert len(got) == 57 and all(sum(s) == 100 for s in got), f"57 subsets of 1..15 add up to 100; got {len(got)}"
    hints:
      - "`subsets`: base case `[[]]`. Otherwise get `rest = subsets(items[1:])` and return `rest` plus `[items[0]] + s` for every `s` in `rest`."
      - "`subsets_with_sum`: filter with a comprehension, `[sorted(s) for s in subsets(nums) if sum(s) == target]`, then sort that list."
      - "Lists compare item by item, so `sorted` on a list of lists works."
    solution: |
      def subsets(items):
          """All subsets of items, as lists."""
          if not items:
              return [[]]
          rest = subsets(items[1:])
          return rest + [[items[0]] + s for s in rest]


      def subsets_with_sum(nums, target):
          """Sorted list of sorted subsets of nums adding up to target."""
          return sorted(sorted(s) for s in subsets(nums) if sum(s) == target)
    explanation: |
      Generating everything, then filtering, is **brute force**: simple and certainly correct, because no possibility is missed. With 15 numbers that's 32,768 subsets, which is instant. With 40 numbers it would be a trillion, which isn't. Finding a subset with a given sum is a famous hard problem (called *subset sum*); nobody knows a method that's fast for every input, a deep question you'll meet in Unit 15. Notice both 5s give the subset `[5, 5]`: the items are treated as separate even when equal.

  - id: hanoi-moves
    title: Solve the Towers of Hanoi
    difficulty: 3
    prompt: |
      Write `hanoi(n, source, target, spare)` that **returns a list of moves** (rather than printing them) to move `n` discs from peg `source` to peg `target`. Each move is a tuple `(from_peg, to_peg)`.

      ```python
      hanoi(2, "A", "C", "B")   # [('A', 'B'), ('A', 'C'), ('B', 'C')]
      ```

      Then write `count_moves(n)` that returns the number of moves for `n` discs **using the formula** 2ⁿ − 1 (no recursion), and check it agrees with `len(hanoi(n, ...))`.
    starter: |
      def hanoi(n, source, target, spare):
          pass


      def count_moves(n):
          pass
    tests:
      - name: small puzzles
        code: |
          assert hanoi(0, "A", "C", "B") == []
          assert hanoi(1, "A", "C", "B") == [("A", "C")]
          assert hanoi(2, "A", "C", "B") == [("A", "B"), ("A", "C"), ("B", "C")], f"Got {hanoi(2, 'A', 'C', 'B')}"
      - name: moves are legal and solve the puzzle
        code: |
          for n in range(1, 11):
              pegs = {"A": list(range(n, 0, -1)), "B": [], "C": []}
              for frm, to in hanoi(n, "A", "C", "B"):
                  assert pegs[frm], f"With {n} discs: tried to move from empty peg {frm}"
                  disc = pegs[frm].pop()
                  assert not pegs[to] or pegs[to][-1] > disc, f"With {n} discs: put disc {disc} on a smaller disc"
                  pegs[to].append(disc)
              assert pegs["C"] == list(range(n, 0, -1)), f"With {n} discs the pegs ended as {pegs}"
      - name: count_moves
        code: |
          for n in range(0, 15):
              assert count_moves(n) == len(hanoi(n, "A", "C", "B")), f"count_moves({n}) = {count_moves(n)} but hanoi made {len(hanoi(n, 'A', 'C', 'B'))} moves"
          assert count_moves(64) == 18446744073709551615
    hints:
      - "Base case: 0 discs means no moves, `[]`."
      - "Recursive case: moves for n − 1 discs from `source` to `spare` (with `target` as spare), then the single move `(source, target)`, then moves for n − 1 discs from `spare` to `target`."
      - "Join the three parts with `+`: `first + [(source, target)] + last`."
    solution: |
      def hanoi(n, source, target, spare):
          """List of (from, to) moves taking n discs from source to target."""
          if n == 0:
              return []
          first = hanoi(n - 1, source, spare, target)
          last = hanoi(n - 1, spare, target, source)
          return first + [(source, target)] + last


      def count_moves(n):
          """Moves needed for n discs: 2**n - 1."""
          return 2 ** n - 1
    explanation: |
      The test plays your moves on real pegs, checking that every move is legal and the puzzle ends solved: a strong check that doesn't depend on matching one particular list. The move count doubles (plus one) with each disc, because solving n discs means solving n − 1 discs *twice*. That's exponential growth again, and here it's unavoidable: it can be proved that no solution uses fewer moves. For 64 discs, 18 quintillion moves.

commonMistakes:
  - title: Using append where you meant extend
    explanation: |
      When combining a recursive result (a list) into your answer, `append` adds the whole list as one item, re-nesting it. `extend` (or `+`) adds its items.
    wrong: |
      result.append(flatten(item))   # [[2, 3]] instead of [2, 3]
    right: |
      result.extend(flatten(item))
  - title: Slicing in a halving recursion
    explanation: |
      `search(lst[mid + 1:], target)` copies half the list on every call, making binary search linear. Pass `lo` and `hi` instead (and remember the indexes in a slice start again from 0).
  - title: Returning [] instead of [[]] for the empty set's subsets
    explanation: |
      The empty list has one subset (itself), so the base case is `[[]]`. Returning `[]` means "no subsets", and every larger answer becomes empty too.
  - title: Forgetting to return the recursive call's result
    explanation: |
      In functions like recursive binary search, the answer comes from the recursive call. Without `return`, it's discarded and the function returns `None`.
    wrong: |
      if lst[mid] < target:
          search(lst, target, mid + 1, hi)
    right: |
      if lst[mid] < target:
          return search(lst, target, mid + 1, hi)

summary:
  - "Recursion fits **recursively shaped data**: a nested list's items are values or smaller nested lists. Use `isinstance(item, list)` to tell them apart."
  - "**Halving** recursion (fast exponentiation, binary search) makes about log₂ n calls. Compute the half result once."
  - "Pass **extra parameters** (like `lo` and `hi`, with defaults) instead of slicing, to avoid copying."
  - "Generate all **subsets** (2ⁿ) by leaving out or including the first item; all **arrangements** (n!) by choosing the first item."
  - "Generating every possibility is **brute force**: always correct, only practical for small inputs."
  - "The **Towers of Hanoi** shows the leap of faith: solve n − 1 discs twice around one move, for 2ⁿ − 1 moves."
next: |
  You've seen recursion halve a problem and solve one half. What if you solve **both** halves and combine the results? That's **divide and conquer**, and in **Lesson 4.7** it gives **merge sort**, which sorts a million items in about 20 million steps instead of 500 billion.

