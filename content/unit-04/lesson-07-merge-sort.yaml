exercises:
  - id: merge-lists
    title: Merge two sorted lists
    difficulty: 1
    prompt: |
      Write `merge(left, right)` that merges two sorted lists into one new sorted list, using two indexes. Don't use `sorted`, `sort`, or `+` to join the inputs and then sort.

      It must be **stable**: on a tie, the item from `left` comes first. To make ties testable, the function takes a `key` function (Lesson 3.5), which defaults to comparing the items themselves; the tests merge `(number, label)` tuples by their number only.

      ```python
      merge([1, 4, 9], [2, 3, 10])   # [1, 2, 3, 4, 9, 10]
      ```
    starter: |
      def merge(left, right, key=lambda x: x):
          result = []
          i = j = 0
          return result
    tests:
      - name: merges sorted lists
        code: |
          assert merge([1, 4, 9], [2, 3, 10]) == [1, 2, 3, 4, 9, 10], f"Got {merge([1, 4, 9], [2, 3, 10])}"
          assert merge([], []) == [] and merge([1], []) == [1] and merge([], [2, 3]) == [2, 3]
          assert merge([5, 6, 7], [1, 2]) == [1, 2, 5, 6, 7]
      - name: stable on ties
        code: |
          left = [(1, "L1"), (2, "L2")]
          right = [(1, "R1"), (2, "R2")]
          got = merge(left, right, key=lambda p: p[0])
          assert got == [(1, "L1"), (1, "R1"), (2, "L2"), (2, "R2")], f"On ties, the left item comes first. Got {got}"
      - name: linear time
        code: |
          a = list(range(0, 400_000, 2))
          b = list(range(1, 400_000, 2))
          assert merge(a, b) == list(range(400_000))
          assert "sorted(" not in source and ".sort(" not in source
    hints:
      - "Loop `while i < len(left) and j < len(right):` and compare `key(left[i])` with `key(right[j])`."
      - "Use `<=` so that a tie takes the item from `left`."
      - "After the loop, add the leftovers: `result.extend(left[i:])` and `result.extend(right[j:])`."
    solution: |
      def merge(left, right, key=lambda x: x):
          """Merge two sorted lists into a new sorted list (stable)."""
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if key(left[i]) <= key(right[j]):
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          result.extend(left[i:])
          result.extend(right[j:])
          return result
    explanation: |
      Each pass of the loop places exactly one item, so merging 400,000 items takes under 400,000 comparisons. Concatenating and calling `sorted` would also give the right answer, but would throw away the fact that both inputs are already sorted. The `key` parameter with a lambda default (Lesson 3.5) lets the same function merge plain values or records.

  - id: merge-sort
    title: Merge sort
    difficulty: 2
    prompt: |
      Write `merge_sort(lst)` that returns a **new** sorted list using merge sort. `merge` is provided. Don't change the original list, and don't use `sorted` or `sort`.

      The tests sort 100,000 random numbers, which would take insertion sort billions of steps.
    starter: |
      def merge(left, right):
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          result.extend(left[i:])
          result.extend(right[j:])
          return result


      def merge_sort(lst):
          pass
    tests:
      - name: sorts small lists
        code: |
          import random
          for _ in range(200):
              data = [random.randint(-30, 30) for _ in range(random.randint(0, 20))]
              copy = data[:]
              assert merge_sort(data) == sorted(copy), f"merge_sort({copy}) returned {merge_sort(copy)}"
              assert data == copy, "Don't change the original list."
      - name: fast on 100,000 items
        code: |
          import random
          random.seed(7)
          big = [random.randint(0, 10 ** 9) for _ in range(100_000)]
          assert merge_sort(big) == sorted(big)
      - name: no built-in sorting
        code: |
          assert "sorted(" not in source and ".sort(" not in source
    hints:
      - "Base case: a list of length 0 or 1 is already sorted. Return a copy (`lst[:]`) so the caller can't accidentally share it."
      - "Split at `mid = len(lst) // 2`, and sort each half with a recursive call."
      - "`return merge(merge_sort(lst[:mid]), merge_sort(lst[mid:]))`."
    solution: |
      def merge(left, right):
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          result.extend(left[i:])
          result.extend(right[j:])
          return result


      def merge_sort(lst):
          """Return a new sorted list using merge sort."""
          if len(lst) <= 1:
              return lst[:]
          mid = len(lst) // 2
          return merge(merge_sort(lst[:mid]), merge_sort(lst[mid:]))
    explanation: |
      The recursion depth is only about log₂ n (17 for 100,000), far below the recursion limit, because each call halves the list. Sorting 100,000 items takes about 1.7 million comparisons, where insertion sort could need 5 billion. Returning `lst[:]` in the base case means the result never shares a list object with the input (Lesson 3.4).

  - id: quicksort
    title: Quicksort with a better pivot
    difficulty: 2
    prompt: |
      Write `quicksort(lst)` that returns a new sorted list using quicksort, choosing the **middle item** (`lst[len(lst) // 2]`) as the pivot. Partition into three lists: items **less than**, **equal to** and **greater than** the pivot.

      Using the middle item avoids the quadratic worst case on already sorted lists, and the "equal" list handles lists with many duplicates. The tests sort a sorted list of 50,000 items and a list of 50,000 copies of the same number.
    starter: |
      def quicksort(lst):
          if len(lst) <= 1:
              return lst
          pivot = lst[0]
          smaller = [x for x in lst[1:] if x < pivot]
          larger = [x for x in lst[1:] if x >= pivot]
          return quicksort(smaller) + [pivot] + quicksort(larger)
    slowStarter: true
    tests:
      - name: sorts random lists
        code: |
          import random
          for _ in range(200):
              data = [random.randint(-30, 30) for _ in range(random.randint(0, 25))]
              assert quicksort(data) == sorted(data), f"quicksort({data}) returned {quicksort(data)}"
      - name: sorted input
        code: |
          data = list(range(50_000))
          assert quicksort(data) == data, "Sorting an already sorted list failed (with the first item as pivot, this hits the recursion limit)."
      - name: all duplicates
        code: |
          data = [7] * 50_000
          assert quicksort(data) == data, "A list of identical items failed. Do you have a separate list for items equal to the pivot?"
      - name: no built-in sorting
        code: |
          assert "sorted(" not in source and ".sort(" not in source
    hints:
      - "`pivot = lst[len(lst) // 2]`."
      - "Three comprehensions over the **whole** list: `x < pivot`, `x == pivot`, `x > pivot`. (The pivot itself lands in the equal list.)"
      - "`return quicksort(less) + equal + quicksort(greater)`."
    solution: |
      def quicksort(lst):
          """Return a new sorted list (quicksort, middle pivot, three-way partition)."""
          if len(lst) <= 1:
              return lst[:]
          pivot = lst[len(lst) // 2]
          less = [x for x in lst if x < pivot]
          equal = [x for x in lst if x == pivot]
          greater = [x for x in lst if x > pivot]
          return quicksort(less) + equal + quicksort(greater)
    explanation: |
      With the first item as pivot, a sorted list splits into "nothing smaller" and "everything else" at every level: 50,000 levels deep, which exceeds the recursion limit long before the quadratic time would finish. The middle item of a sorted list splits it perfectly in half. The three-way partition fixes a second trap: with all-equal items, a two-way split puts everything on one side every time. Choosing pivots well is what separates a good quicksort from a dangerous one.

  - id: merge-many
    title: Merge many sorted lists
    difficulty: 3
    prompt: |
      Write `merge_all(lists)` that merges **any number** of sorted lists into one sorted list, using divide and conquer: split the list of lists in half, merge each half recursively, then merge the two results. `merge` is provided.

      ```python
      merge_all([[1, 5], [2, 6], [3, 4]])   # [1, 2, 3, 4, 5, 6]
      merge_all([])                         # []
      ```

      The tests merge 1,000 sorted lists of 100 items each. Merging them one at a time onto a growing result would be slow; divide and conquer keeps every item's journey short.
    starter: |
      def merge(left, right):
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          result.extend(left[i:])
          result.extend(right[j:])
          return result


      def merge_all(lists):
          pass
    tests:
      - name: small cases
        code: |
          assert merge_all([[1, 5], [2, 6], [3, 4]]) == [1, 2, 3, 4, 5, 6], f"Got {merge_all([[1, 5], [2, 6], [3, 4]])}"
          assert merge_all([]) == []
          assert merge_all([[3, 4]]) == [3, 4]
          assert merge_all([[], [1], []]) == [1]
      - name: many lists
        code: |
          import random
          random.seed(3)
          lists = [sorted(random.randint(0, 10 ** 6) for _ in range(100)) for _ in range(1000)]
          want = sorted(x for l in lists for x in l)
          assert merge_all(lists) == want
      - name: uses divide and conquer
        code: |
          body = source[source.index("def merge_all"):]
          assert body.count("merge_all(") >= 3, "merge_all should call itself on each half of the list of lists."
          assert "sorted(" not in source and ".sort(" not in source
    hints:
      - "Base cases: no lists gives `[]`; one list gives (a copy of) that list."
      - "Otherwise split `lists` (the list of lists) at its middle, and call `merge_all` on each half."
      - "`return merge(merge_all(lists[:mid]), merge_all(lists[mid:]))`. It's merge sort, where the \"items\" are whole sorted lists."
    solution: |
      def merge(left, right):
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          result.extend(left[i:])
          result.extend(right[j:])
          return result


      def merge_all(lists):
          """Merge any number of sorted lists, by divide and conquer."""
          if len(lists) == 0:
              return []
          if len(lists) == 1:
              return lists[0][:]
          mid = len(lists) // 2
          return merge(merge_all(lists[:mid]), merge_all(lists[mid:]))
    explanation: |
      Merging the lists one at a time onto a growing result would copy the early items again and again: the result grows to 100,000 items, and the last merges each handle nearly all of them, about 50 million steps. Pairing them up like a knockout tournament means each item takes part in only about log₂ 1000 = 10 merges, about a million steps in total. This "merge many sorted runs" problem is how databases and search engines combine huge sorted files that don't fit in memory.

  - id: fast-inversions
    title: Count inversions fast
    difficulty: 3
    prompt: |
      In Lesson 4.4 you counted **inversions** (pairs `i < j` with `lst[i] > lst[j]`) with insertion sort, which is quadratic. Merge sort can count them in n log n time.

      Write `sort_and_count(lst)` returning a tuple `(sorted_list, inversions)`. The idea: inversions = inversions within the left half + inversions within the right half + inversions **between** the halves. And while merging, whenever an item is taken from the **right** half, it is smaller than every item still waiting in the left half, so it forms an inversion with each of them: add `len(left) - i`.

      ```python
      sort_and_count([2, 4, 1, 3])   # ([1, 2, 3, 4], 3)
      ```

      The tests use a list of 100,000 items.
    starter: |
      def sort_and_count(lst):
          if len(lst) <= 1:
              return lst[:], 0
    tests:
      - name: small examples
        code: |
          for data, want in [([], 0), ([1], 0), ([1, 2, 3], 0), ([3, 2, 1], 3), ([2, 4, 1, 3], 3), ([1, 1, 1], 0)]:
              got = sort_and_count(data)
              assert got == (sorted(data), want), f"sort_and_count({data}) returned {got}"
      - name: matches brute force
        code: |
          import random
          for _ in range(200):
              data = [random.randint(0, 9) for _ in range(random.randint(0, 15))]
              want = sum(1 for i in range(len(data)) for j in range(i + 1, len(data)) if data[i] > data[j])
              assert sort_and_count(data) == (sorted(data), want), f"Wrong for {data}"
      - name: fast on 100,000 items
        code: |
          big = list(range(100_000, 0, -1))
          s, inv = sort_and_count(big)
          assert inv == 100_000 * 99_999 // 2 and s[0] == 1
    hints:
      - "Recursively get `(left, a)` and `(right, b)` for the two halves."
      - "Merge them as usual, keeping a counter `c`. When you take `right[j]` (because `right[j] < left[i]`), add `len(left) - i` to `c`."
      - "Use `<=` when comparing, so equal items are *not* counted as inversions. Return `(merged, a + b + c)`."
    solution: |
      def sort_and_count(lst):
          """(sorted copy of lst, number of inversions), in n log n time."""
          if len(lst) <= 1:
              return lst[:], 0
          mid = len(lst) // 2
          left, a = sort_and_count(lst[:mid])
          right, b = sort_and_count(lst[mid:])
          merged = []
          i = j = 0
          c = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  merged.append(left[i])
                  i += 1
              else:
                  merged.append(right[j])
                  c += len(left) - i
                  j += 1
          merged.extend(left[i:])
          merged.extend(right[j:])
          return merged, a + b + c
    explanation: |
      The reversed list has nearly 5 billion inversions; counting them one pair at a time would take that many steps, but this counts whole groups at once during the merge, about 1.7 million steps. It works because, at the moment `right[j]` is taken, the remaining items `left[i:]` are all bigger than it (the halves are sorted), and all of them came earlier in the original list. Piggybacking extra work on a divide-and-conquer algorithm like this is a standard technique in algorithm design (Unit 8).

commonMistakes:
  - title: Forgetting the leftovers after merging
    explanation: |
      The merge loop stops when **one** list runs out. The rest of the other list must still be added.
    wrong: |
      while i < len(left) and j < len(right):
          ...
      return result               # loses leftover items
    right: |
      while i < len(left) and j < len(right):
          ...
      return result + left[i:] + right[j:]
  - title: Merge sort without a base case for length 1
    explanation: |
      Splitting a one-item list gives an empty list and the same one-item list, forever. The base case must cover `len(lst) <= 1`.
  - title: Quicksort with a bad pivot on sorted data
    explanation: |
      Always using the first item as the pivot makes sorted input the worst case: quadratic time and very deep recursion. Use the middle item or a random one.
  - title: Using < instead of <= in the merge
    explanation: |
      Taking from the right half on ties reorders equal items, so the sort is no longer stable.

summary:
  - "**Divide and conquer**: divide the problem, conquer the parts recursively, combine the answers."
  - "**Merging** two sorted lists takes linear time using two pointers; `<=` keeps it stable."
  - "**Merge sort**: split in half, sort each half recursively, merge. About log₂ n levels × n work per level = **n log₂ n**, in every case."
  - "n log₂ n is vastly better than n²: about 20 million versus 500 billion steps for a million items. No comparison sort can beat n log₂ n."
  - "Merge sort is stable but uses extra memory; insertion and selection sort work in place."
  - "**Quicksort** partitions around a pivot; fast on average, quadratic with bad pivots. Python's `sorted` uses **Timsort**, a refined merge sort."
next: |
  You've now seen several problem-solving strategies: careful step-by-step loops, halving, recursion, and divide and conquer. In **Lesson 4.8**, the last of the unit, you'll meet two more general strategies, **brute force** and **greedy** algorithms, and learn how to decide which strategy to try on a new problem.

