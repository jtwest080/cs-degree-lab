id: u4-merge-sort
title: Merge Sort and Divide and Conquer
minutes: 55
objective: |
  Use the **divide and conquer** strategy (split a problem in half, solve each half recursively, combine the results) to build **merge sort**, explain why it takes about **n log₂ n** steps, and compare it with the simple sorts and with **quicksort**.
outcomes:
  - Describe the three steps of divide and conquer
  - Merge two sorted lists into one in linear time
  - Implement merge sort recursively
  - Explain the n log₂ n running time with the "levels times work per level" argument
  - Compare merge sort with insertion and selection sort, including stability and memory use
  - Describe how quicksort partitions around a pivot, and its worst case

sections:
  - heading: Divide and conquer
    body: |
      In Lesson 4.6, binary search and fast exponentiation each split a problem in half and then solved **one** half. A more powerful pattern solves **both** halves and puts the answers together. It's called **divide and conquer**, and it has three steps:

      1. **Divide** the problem into smaller subproblems (usually two halves).
      2. **Conquer** each subproblem by solving it recursively. Very small subproblems are solved directly (the base case).
      3. **Combine** the subproblems' answers into an answer for the whole.

      > **Analogy:** A teacher has 32 exam papers to sort alphabetically. They split the pile in two and give each half to a teaching assistant. Each assistant splits their pile in two and passes it on again, until someone gets a single paper (already "sorted"). Then the sorted piles come back up, and at each step two sorted piles are merged into one.

      For sorting, the hard part turns out to be the **combine** step: merging two sorted lists. So let's solve that first.

  - heading: Merging two sorted lists
    body: |
      Suppose you have two **sorted** piles of cards face up, and you want one sorted pile. You only ever need to look at the **top card of each pile**: the smaller of the two must be the smallest card remaining overall. Take it, put it on the output, and repeat. When one pile runs out, the rest of the other pile goes on the end.

      ```python
      def merge(left, right):
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          result.extend(left[i:])       # whatever is left over
          result.extend(right[j:])      # (one of these is empty)
          return result
      ```

      This is the two-pointer technique from Lesson 3.2: `i` moves along `left`, `j` along `right`. Each comparison places one item, so merging lists with a combined length of n takes at most n − 1 comparisons: **linear** time.

      Using `<=` (take from the left on a tie) keeps equal items in their original order, which makes the merge, and the whole sort, **stable** (Lesson 4.4).

  - heading: Merge sort
    body: |
      Now the full algorithm is almost embarrassingly simple:

      ```python
      def merge_sort(lst):
          if len(lst) <= 1:
              return lst                       # base case: already sorted
          mid = len(lst) // 2
          left = merge_sort(lst[:mid])         # conquer the left half
          right = merge_sort(lst[mid:])        # conquer the right half
          return merge(left, right)            # combine
      ```

      Read it with the leap of faith (Lesson 4.5): *if* `merge_sort` correctly sorts each half, then merging two sorted halves gives the whole list sorted. And a list of 0 or 1 items is sorted already. That's the whole argument.

      Traced on `[38, 27, 43, 3, 9, 82, 10]`, the list splits down to single items, then merges back up:

      ```text
      split:   [38, 27, 43, 3, 9, 82, 10]
               [38, 27, 43]        [3, 9, 82, 10]
               [38] [27, 43]       [3, 9] [82, 10]
                    [27] [43]      [3] [9] [82] [10]
      merge:        [27, 43]       [3, 9]  [10, 82]
               [27, 38, 43]        [3, 9, 10, 82]
               [3, 9, 10, 27, 38, 43, 82]
      ```

  - heading: Why it's fast
    body: |
      How much work does merge sort do? Picture the splitting as a tree of levels:

      - **How many levels?** Each level halves the pieces, so after about **log₂ n** levels every piece has size 1 (the halving count from Lesson 4.2).
      - **How much work per level?** On every level, all the pieces together contain all n items, and merging is linear. So each level costs about **n** steps.

      Total: about **n × log₂ n** steps. Compare that with the n²/2 of selection sort:

      | n | n²/2 (selection sort) | n log₂ n (merge sort) |
      |---|---|---|
      | 1,000 | 500,000 | about 10,000 |
      | 1,000,000 | 500,000,000,000 | about 20,000,000 |
      | 1,000,000,000 | 5 × 10¹⁷ | about 30,000,000,000 |

      At a million items, merge sort is about **25,000 times** faster. And unlike insertion sort, its time doesn't depend on the input order: it's n log₂ n in the best, worst and average cases. n log n growth is so common it's often called **linearithmic**: a little worse than linear, enormously better than quadratic.

      > **Deep dive:** Can any sort that works by comparing items do better than n log₂ n? No. There are n! possible orders of n items, and each comparison has two outcomes, so at best it halves the possibilities; telling n! orders apart needs at least log₂(n!) comparisons, which is about n log₂ n. Merge sort is, in this sense, optimal. (Counting sort escapes the limit by not comparing at all.)

      The cost is **memory**: merge sort builds new lists as it merges, needing extra space proportional to n, where insertion and selection sort work in place.

  - heading: Quicksort
    body: |
      The other famous divide-and-conquer sort is **quicksort**, invented by Tony Hoare in 1959. It puts the work in the **divide** step instead of the combine step:

      1. Pick an item called the **pivot** (say, the first one).
      2. **Partition** the rest into items smaller than the pivot and items greater than or equal to it.
      3. Recursively sort the two parts. The answer is: sorted smaller items, the pivot, sorted larger items. No merging needed.

      ```python
      def quicksort(lst):
          if len(lst) <= 1:
              return lst
          pivot = lst[0]
          smaller = [x for x in lst[1:] if x < pivot]
          larger = [x for x in lst[1:] if x >= pivot]
          return quicksort(smaller) + [pivot] + quicksort(larger)
      ```

      When the pivot splits the list roughly in half, quicksort has about log₂ n levels of linear work, n log₂ n again, and in practice it's very fast. But if the pivot is always the smallest or largest item (for example, using the first item on an **already sorted** list), one side is always empty: n levels of work, which is **quadratic**. Real implementations choose the pivot randomly, or as the middle of three samples, to make that worst case extremely unlikely.

      Python's own `sorted` uses **Timsort**, designed by Tim Peters in 2002: a carefully tuned merge sort that finds runs that are already sorted and uses insertion sort for small pieces. It's stable, n log n in the worst case, and close to linear on nearly sorted data, combining the strengths of everything in this unit.

examples:
  - title: Merging two sorted lists
    intro: Two pointers, one comparison per item placed.
    code: |
      def merge(left, right):
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          result.extend(left[i:])
          result.extend(right[j:])
          return result

      print(merge([1, 4, 9, 12], [2, 3, 10]))
      print(merge([], [5, 6]))
      print(merge([7], [7]))
    output: |
      [1, 2, 3, 4, 9, 10, 12]
      [5, 6]
      [7, 7]
    lines:
      - line: 3
        note: "`i = j = 0` sets both pointers to 0."
      - line: 4
        note: "Keep going while both lists still have items to compare."
      - line: 5-10
        note: "Take the smaller front item and advance that list's pointer. `<=` takes from the left on ties, keeping the merge stable."
      - line: 11-12
        note: "One list has run out; everything left in the other is bigger than all the output so far, so it goes on the end in order."
  - title: Merge sort, traced
    intro: Indentation shows the depth of recursion.
    code: |
      def merge(left, right):
          result = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          return result + left[i:] + right[j:]

      def merge_sort(lst, depth=0):
          if len(lst) <= 1:
              return lst
          mid = len(lst) // 2
          left = merge_sort(lst[:mid], depth + 1)
          right = merge_sort(lst[mid:], depth + 1)
          merged = merge(left, right)
          print("  " * depth + f"merge {left} + {right} -> {merged}")
          return merged

      merge_sort([38, 27, 43, 3, 9, 82, 10])
    output: |2
          merge [27] + [43] -> [27, 43]
        merge [38] + [27, 43] -> [27, 38, 43]
          merge [3] + [9] -> [3, 9]
          merge [82] + [10] -> [10, 82]
        merge [3, 9] + [10, 82] -> [3, 9, 10, 82]
      merge [27, 38, 43] + [3, 9, 10, 82] -> [3, 9, 10, 27, 38, 43, 82]
    lines:
      - line: 14-15
        note: "Base case: a list of 0 or 1 items is already sorted."
      - line: 16-18
        note: "Divide at the middle and conquer each half recursively. Slicing copies, but merge sort builds new lists anyway, so that's part of its memory cost."
      - line: 19-21
        note: "Combine. The prints appear bottom-up: the smallest merges finish first, the final merge last."
  - title: Counting comparisons
    intro: Merge sort versus insertion sort on the same reversed lists.
    code: |
      def merge_sort_count(lst):
          if len(lst) <= 1:
              return lst, 0
          mid = len(lst) // 2
          left, c1 = merge_sort_count(lst[:mid])
          right, c2 = merge_sort_count(lst[mid:])
          result, i, j, c = [], 0, 0, 0
          while i < len(left) and j < len(right):
              c += 1
              if left[i] <= right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          return result + left[i:] + right[j:], c1 + c2 + c

      for n in [1000, 2000, 4000]:
          data = list(range(n, 0, -1))
          _, merges = merge_sort_count(data)
          print(f"n={n}: merge sort {merges:,}, insertion sort {n * (n - 1) // 2:,}")
    output: |
      n=1000: merge sort 5,044, insertion sort 499,500
      n=2000: merge sort 11,088, insertion sort 1,999,000
      n=4000: merge sort 24,176, insertion sort 7,998,000
    lines:
      - line: 1-16
        note: "Merge sort returning a pair: the sorted list and how many comparisons it made, adding up the counts from both halves and the merge."
      - line: 18-21
        note: "Reversed lists are insertion sort's worst case, n(n − 1)/2 comparisons. Doubling n roughly quadruples insertion sort's work but only slightly more than doubles merge sort's: the extra log₂ n factor grows very slowly."
  - title: Quicksort
    intro: Partition around a pivot, then sort each side.
    code: |
      def quicksort(lst):
          if len(lst) <= 1:
              return lst
          pivot = lst[0]
          smaller = [x for x in lst[1:] if x < pivot]
          larger = [x for x in lst[1:] if x >= pivot]
          return quicksort(smaller) + [pivot] + quicksort(larger)

      print(quicksort([38, 27, 43, 3, 9, 82, 10]))
      print(quicksort(["pear", "fig", "apple", "kiwi"]))
    output: |
      [3, 9, 10, 27, 38, 43, 82]
      ['apple', 'fig', 'kiwi', 'pear']
    lines:
      - line: 4
        note: "The pivot: here simply the first item."
      - line: 5-6
        note: "Partition the rest into two lists with comprehensions (Lesson 3.8)."
      - line: 7
        note: "Every item in `smaller` belongs before the pivot and every item in `larger` after it, so the sorted parts can just be joined."

