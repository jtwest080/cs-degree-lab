  - type: code
    question: |
      Write `biggest(lst)` that returns the largest item of a non-empty list by **divide and conquer**: the biggest of a one-item list is that item; otherwise it's the larger of the biggest in each half. Don't use `max`, `sorted` or loops.
    starter: |
      def biggest(lst):
          pass
    tests:
      - name: divide and conquer maximum
        code: |
          import random
          for _ in range(100):
              data = [random.randint(-100, 100) for _ in range(random.randint(1, 30))]
              assert biggest(data) == max(data), f"biggest({data}) returned {biggest(data)}"
          assert biggest(list(range(5000))) == 4999, "Should handle 5,000 items (halving keeps the recursion shallow)."
          assert "max(" not in source and "sorted(" not in source and not uses_loop()
    solution: |
      def biggest(lst):
          if len(lst) == 1:
              return lst[0]
          mid = len(lst) // 2
          a = biggest(lst[:mid])
          b = biggest(lst[mid:])
          return a if a > b else b
