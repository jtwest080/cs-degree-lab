id: u4-strategies
title: Brute Force, Greedy Algorithms and Choosing a Strategy
minutes: 50
objective: |
  Solve problems by **brute force** (trying every possibility) and with **greedy** algorithms (always taking the best-looking choice), recognise when a greedy algorithm gives wrong answers, and choose a sensible strategy for a new problem from everything in this unit.
outcomes:
  - Write brute-force solutions with nested loops, recursion or `itertools`
  - Estimate whether brute force will finish in time
  - Use brute force as a reference to test faster solutions
  - Write greedy algorithms for change-making and scheduling
  - Find a counterexample showing that a greedy algorithm is not always optimal
  - Pick a strategy (pattern, search, sort, divide and conquer, brute force, greedy) for a new problem

sections:
  - heading: Brute force
    body: |
      The most straightforward strategy of all: **try every possibility** and keep the ones that work (or the best one). This is called **brute force** or **exhaustive search**. You've already used it: finding all subsets with a given sum (Lesson 4.6) generated every subset and filtered them.

      Brute force has real virtues:

      - It's **simple** to write and easy to convince yourself it's **correct**: if every possibility is checked, the answer can't be missed.
      - It's often **fast enough**. Checking a million possibilities takes a fraction of a second.
      - It makes a perfect **reference solution** for testing cleverer code, as many tests in this course do: compare the fast version with brute force on lots of small random inputs.

      Its weakness is that the number of possibilities often grows explosively. Before using brute force, **estimate the count**:

      | Possibilities | n = 10 | n = 20 | n = 30 |
      |---|---|---|---|
      | all pairs, n² | 100 | 400 | 900 |
      | all triples, n³ | 1,000 | 8,000 | 27,000 |
      | all subsets, 2ⁿ | 1,024 | about 1 million | about 1 billion |
      | all orders, n! | about 3.6 million | about 2.4 × 10¹⁸ | about 2.7 × 10³² |

      A rough rule: Python manages around 10 million simple steps a second. Up to a few million possibilities, brute force is fine. Up to a few billion, it's slow but possible. Beyond that, you need a better idea.

      > **Tip:** Brute force often improves dramatically with **pruning**: stopping early on paths that can't possibly work. If you're choosing items to fit in a bag and the bag is already over-full, there's no point trying to add more.

  - heading: Greedy algorithms
    body: |
      A **greedy algorithm** builds a solution step by step, at each step taking whatever choice **looks best right now**, and never reconsidering.

      The classic example is giving change. To pay 68p with UK coins (50p, 20p, 10p, 5p, 2p, 1p), a shop assistant takes the biggest coin that fits, again and again: 50p (18p left), 10p (8p left), 5p (3p left), 2p (1p left), 1p. Five coins, which is the fewest possible.

      ```python
      def make_change(amount, coins):
          used = []
          for coin in sorted(coins, reverse=True):
              while amount >= coin:
                  used.append(coin)
                  amount -= coin
          return used
      ```

      Greedy algorithms are usually **fast** (this is linear in the number of coins used) and simple. The catch: **they aren't always right.** Suppose a country had coins of 1, 3 and 4. To make 6, greedy takes 4, then 1, then 1: three coins. But 3 + 3 is just two. Taking the biggest coin first looked good, but it led somewhere worse.

      For UK and euro coins, greedy change-making happens to always give the fewest coins; for the 1-3-4 system it doesn't. A greedy algorithm is only correct when the problem has special structure, and proving it needs an argument, not just a few examples that work.

  - heading: When greedy is right
    body: |
      Some problems have a greedy solution that's provably optimal. A famous one is **scheduling**: you have a list of meetings, each with a start and end time, and one room. What's the largest number of meetings you can hold, if none can overlap?

      Several greedy rules sound reasonable:

      - pick the **shortest** meeting first? (Fails: a short meeting can overlap two others that would both fit.)
      - pick the meeting that **starts earliest**? (Fails: an early meeting might last all day.)
      - pick the meeting that **ends earliest**, then the next one that ends earliest among those that start after it, and so on? (**Correct!**)

      Why does "ends earliest" work? Whatever the best schedule is, its first meeting can be swapped for the meeting that ends earliest without causing any clash (it ends no later, so it can't collide with anything after it), and then the same argument applies to the rest. This kind of **exchange argument** is how greedy algorithms are proved correct; you'll see more in Unit 8.

      Greedy ideas appear all over computer science: finding shortest routes on a map (Dijkstra's algorithm), compressing files (Huffman coding), and connecting networks cheaply (Unit 8).

  - heading: When greedy fails
    body: |
      When greedy gives wrong answers and brute force is too slow, there's a powerful third option called **dynamic programming**: solve every smaller subproblem once, store the answers (as with memoised Fibonacci, Lesson 4.5), and build up. Dynamic programming finds the true minimum number of coins for *any* coin system efficiently. It's a major topic of Unit 8; for now, it's enough to recognise the symptoms that greedy isn't safe: an early choice that looks good can block a much better combination later.

      Greedy can still be useful even when it isn't optimal: a quick answer that's "pretty good" can be valuable when the perfect answer is too expensive. The **travelling salesperson problem** (visit every city once and return home, by the shortest route) is a famous example: brute force means trying all n! routes, and nobody knows a fast method that's always optimal. A greedy "always go to the nearest unvisited city" route is quick and usually reasonable, though rarely perfect.

  - heading: Choosing a strategy
    body: |
      Faced with a new problem, after understanding it (Lesson 4.1), run through this list:

      | Ask yourself | Strategy | Where you met it |
      |---|---|---|
      | Is it a standard pattern (filter, transform, count, group)? | A loop or comprehension with the right data structure | Unit 3 |
      | Am I looking things up repeatedly? | A dictionary or set | Lessons 3.6, 3.7 |
      | Is the data sorted, or could I sort it once and search many times? | Binary search | Lesson 4.3 |
      | Would sorting make the problem easier? | Sort first (duplicates become neighbours, extremes go to the ends) | Lessons 4.4, 4.7 |
      | Does the problem (or the data) contain smaller copies of itself? | Recursion | Lessons 4.5, 4.6 |
      | Can I split it in half and combine the answers? | Divide and conquer | Lesson 4.7 |
      | Is the number of possibilities small enough to try them all? | Brute force | this lesson |
      | Is there a choice that's always safe to make first? | Greedy (check it with brute force!) | this lesson |

      And always **count the steps** (Lesson 4.2) before you commit: if the estimate is in the trillions, choose again.

      > **Key idea:** A powerful habit is to write the brute-force solution first, even if it's too slow for the real input. It proves you understand the problem, gives you correct answers for small cases, and becomes the test that your faster solution must agree with.

examples:
  - title: Brute force with nested loops
    intro: "Find every way to write 30 as a + b + c with whole numbers 1 ≤ a ≤ b ≤ c."
    code: |
      n = 30
      solutions = []
      checks = 0
      for a in range(1, n + 1):
          for b in range(a, n + 1):
              for c in range(b, n + 1):
                  checks += 1
                  if a + b + c == n:
                      solutions.append((a, b, c))
      print(len(solutions), "solutions after", checks, "checks")
      print(solutions[:5])
    output: |
      75 solutions after 4960 checks
      [(1, 1, 28), (1, 2, 27), (1, 3, 26), (1, 4, 25), (1, 5, 24)]
    lines:
      - line: 4-6
        note: "Three nested loops try every triple. Starting `b` at `a` and `c` at `b` avoids counting the same triple in different orders."
      - line: 8-9
        note: "Keep the triples that work."
      - line: 10
        note: "Under 5,000 checks: trivially fast. (Since c must be n − a − b, two loops would do, a first improvement on pure brute force.)"
  - title: Greedy change-making
    intro: Biggest coin first, for two different coin systems.
    code: |
      def make_change(amount, coins):
          used = []
          for coin in sorted(coins, reverse=True):
              while amount >= coin:
                  used.append(coin)
                  amount -= coin
          return used

      uk = [1, 2, 5, 10, 20, 50, 100, 200]
      print(make_change(68, uk))
      print(make_change(389, uk))
      print(make_change(6, [1, 3, 4]))
    output: |
      [50, 10, 5, 2, 1]
      [200, 100, 50, 20, 10, 5, 2, 2]
      [4, 1, 1]
    lines:
      - line: 3
        note: "Consider the coins from biggest to smallest."
      - line: 4-6
        note: "Use each coin as many times as it fits."
      - line: 10-11
        note: "With UK coins, greedy always gives the fewest coins."
      - line: 12
        note: "With coins 1, 3 and 4, greedy uses three coins for 6, but 3 + 3 uses only two."
  - title: Brute force checks the greedy answer
    intro: Find the true minimum by trying every way, then compare.
    code: |
      def min_coins(amount, coins):
          if amount == 0:
              return 0
          best = None
          for coin in coins:
              if coin <= amount:
                  rest = min_coins(amount - coin, coins)
                  if rest is not None and (best is None or rest + 1 < best):
                      best = rest + 1
          return best

      def make_change(amount, coins):
          used = []
          for coin in sorted(coins, reverse=True):
              while amount >= coin:
                  used.append(coin)
                  amount -= coin
          return used

      coins = [1, 3, 4]
      for amount in range(1, 11):
          g = len(make_change(amount, coins))
          b = min_coins(amount, coins)
          flag = "  <-- greedy is wrong" if g != b else ""
          print(f"{amount:>2}: greedy {g}, best {b}{flag}")
    output: |2
       1: greedy 1, best 1
       2: greedy 2, best 2
       3: greedy 1, best 1
       4: greedy 1, best 1
       5: greedy 2, best 2
       6: greedy 3, best 2  <-- greedy is wrong
       7: greedy 2, best 2
       8: greedy 2, best 2
       9: greedy 3, best 3
      10: greedy 4, best 3  <-- greedy is wrong
    lines:
      - line: 1-10
        note: "Brute force by recursion: try every coin as the first coin, solve the rest recursively, and keep the best. `None` means \"impossible\". Its calls grow exponentially, so it's only for small amounts."
      - line: 20-24
        note: "Comparing the two on every small amount finds the counterexamples automatically: 6 = 3 + 3 and 10 = 3 + 3 + 4."
  - title: Greedy scheduling
    intro: Always choose the meeting that ends earliest.
    code: |
      meetings = [(9, 12), (10, 11), (11, 13), (12, 14), (13, 15), (9, 10), (14, 16)]

      def end_time(m):
          return m[1]

      chosen = []
      last_end = 0
      for start, end in sorted(meetings, key=end_time):
          if start >= last_end:
              chosen.append((start, end))
              last_end = end
      print(len(chosen), "meetings:", chosen)
    output: |
      4 meetings: [(9, 10), (10, 11), (11, 13), (13, 15)]
    lines:
      - line: 3-4
        note: "A key function picks out each meeting's end time (Lesson 3.5)."
      - line: 8
        note: "Sorting by end time is what makes the greedy choice easy: the next meeting in this order is always the one ending earliest."
      - line: 9-11
        note: "Take a meeting if it starts after (or exactly when) the last chosen one ends."
      - line: 12
        note: "Four meetings is the most possible here. Note that (9, 12), the earliest-*starting* meeting, would have blocked three others."

playground:
  prompt: |
    Invent a coin system and find out whether greedy change-making always works for it, by comparing with brute force for every amount up to 50. Try 1, 5, 10, 25 (US coins), then 1, 7, 10. Can you guess what makes a coin system "greedy-safe"?
  code: |
    def min_coins(amount, coins):
        best = [0] + [None] * amount
        for a in range(1, amount + 1):
            for c in coins:
                if c <= a and best[a - c] is not None:
                    if best[a] is None or best[a - c] + 1 < best[a]:
                        best[a] = best[a - c] + 1
        return best[amount]

    def greedy_count(amount, coins):
        count = 0
        for c in sorted(coins, reverse=True):
            count += amount // c
            amount %= c
        return count

    coins = [1, 7, 10]
    for amount in range(1, 51):
        if greedy_count(amount, coins) != min_coins(amount, coins):
            print("greedy fails for", amount)

exercises:
  - id: triples
    title: Pythagorean triples
    difficulty: 1
    prompt: |
      A **Pythagorean triple** is three whole numbers a < b < c with a² + b² = c² (like 3, 4, 5). Write `triples(limit)` that returns a list of all triples with `c <= limit`, as tuples, in the order your loops find them when `a` is the outer loop, then `b`, then `c`.

      ```python
      triples(15)   # [(3, 4, 5), (5, 12, 13), (6, 8, 10), (9, 12, 15)]
      ```

      Brute force is fine: the tests only go up to a limit of 60.
    starter: |
      def triples(limit):
          found = []
          return found
    tests:
      - name: limit 15
        code: |
          assert triples(15) == [(3, 4, 5), (5, 12, 13), (6, 8, 10), (9, 12, 15)], f"Got {triples(15)}"
      - name: small limits
        code: |
          assert triples(4) == [] and triples(5) == [(3, 4, 5)]
      - name: limit 60
        code: |
          got = triples(60)
          assert len(got) == 26 and all(a * a + b * b == c * c and a < b < c <= 60 for a, b, c in got), f"Expected 26 triples up to 60, got {len(got)}"
          assert got == sorted(got), "List the triples in the order a, then b, then c."
    hints:
      - "Three nested loops: `a` from 1, `b` from `a + 1`, `c` from `b + 1`, all up to `limit`."
      - "If `a * a + b * b == c * c`, append `(a, b, c)`."
    solution: |
      def triples(limit):
          """All Pythagorean triples (a, b, c) with a < b < c <= limit."""
          found = []
          for a in range(1, limit + 1):
              for b in range(a + 1, limit + 1):
                  for c in range(b + 1, limit + 1):
                      if a * a + b * b == c * c:
                          found.append((a, b, c))
          return found
    explanation: |
      Up to 60 that's about 34,000 checks, instant. The ordering of the ranges (`b` starts after `a`, `c` after `b`) both enforces a < b < c and avoids duplicates. An obvious improvement: for each `a` and `b`, `c` is determined (it's the square root of a² + b²), so the innermost loop could be replaced by a single check, turning n³ steps into n². Brute force first, then improve.

  - id: greedy-change
    title: Make change
    difficulty: 1
    prompt: |
      Write `make_change(amount, coins)` that returns the list of coins a greedy shop assistant would hand over: always the largest coin that still fits, from largest to smallest. `coins` may be given in any order, and always includes 1.

      ```python
      make_change(68, [1, 2, 5, 10, 20, 50])   # [50, 10, 5, 2, 1]
      make_change(0, [1, 5])                   # []
      ```
    starter: |
      def make_change(amount, coins):
          pass
    tests:
      - name: UK coins
        code: |
          uk = [1, 2, 5, 10, 20, 50, 100, 200]
          assert make_change(68, uk) == [50, 10, 5, 2, 1], f"Got {make_change(68, uk)}"
          assert make_change(400, uk) == [200, 200]
          assert make_change(0, uk) == []
      - name: unsorted coin list
        code: |
          assert make_change(9, [5, 1, 2]) == [5, 2, 2], f"Got {make_change(9, [5, 1, 2])}"
      - name: adds up and is greedy
        code: |
          for amount in range(0, 300, 7):
              got = make_change(amount, [1, 3, 4, 25])
              assert sum(got) == amount, f"The coins for {amount} add up to {sum(got)}"
              assert got == sorted(got, reverse=True), "Give the coins from largest to smallest."
          assert make_change(6, [1, 3, 4]) == [4, 1, 1], "Greedy takes the 4 first (even though 3 + 3 would be better)."
    hints:
      - "Go through the coins from biggest to smallest: `sorted(coins, reverse=True)`."
      - "For each coin, `while amount >= coin:` append it and subtract it."
    solution: |
      def make_change(amount, coins):
          """Greedy change: largest coin that fits, repeatedly."""
          used = []
          for coin in sorted(coins, reverse=True):
              while amount >= coin:
                  used.append(coin)
                  amount -= coin
          return used
    explanation: |
      Each coin is used as many times as it fits before moving on to smaller coins, and since 1 is always available, the amount always reaches 0. The last test is deliberate: your function should reproduce greedy's mistake for coins 1, 3, 4, because that's what "greedy" means. The next exercise finds those mistakes automatically.

  - id: greedy-counterexample
    title: Catch greedy out
    difficulty: 3
    prompt: |
      Write two functions:

      - `fewest_coins(amount, coins)`: the true minimum number of coins needed to make `amount`, by **brute force recursion**: try each coin as the first coin and recursively solve the rest. Every coin system includes 1, so an answer always exists.
      - `first_failure(coins, limit)`: the smallest amount from 1 to `limit` where greedy (`make_change`, provided) uses **more** coins than `fewest_coins`, or `None` if greedy is optimal for every amount up to `limit`.

      ```python
      fewest_coins(6, [1, 3, 4])        # 2
      first_failure([1, 3, 4], 20)      # 6
      first_failure([1, 2, 5, 10], 20)  # None
      ```

      The brute force is exponential, so the tests keep amounts small (up to 25).
    starter: |
      def make_change(amount, coins):
          used = []
          for coin in sorted(coins, reverse=True):
              while amount >= coin:
                  used.append(coin)
                  amount -= coin
          return used


      def fewest_coins(amount, coins):
          pass


      def first_failure(coins, limit):
          pass
    tests:
      - name: fewest_coins
        code: |
          for amount, coins, want in [(0, [1, 3, 4], 0), (6, [1, 3, 4], 2), (10, [1, 3, 4], 3), (7, [1, 5], 3), (15, [1, 7, 10], 3), (14, [1, 7, 10], 2)]:
              got = fewest_coins(amount, coins)
              assert got == want, f"fewest_coins({amount}, {coins}) returned {got}, expected {want}"
      - name: first_failure finds counterexamples
        code: |
          assert first_failure([1, 3, 4], 20) == 6, f"Got {first_failure([1, 3, 4], 20)}"
          assert first_failure([1, 7, 10], 25) == 14, f"Got {first_failure([1, 7, 10], 25)}"
      - name: first_failure returns None for greedy-safe systems
        code: |
          assert first_failure([1, 2, 5, 10], 25) is None
          assert first_failure([1, 5, 10, 25], 25) is None
          assert first_failure([1, 3, 4], 5) is None, "Up to 5, greedy never fails for 1, 3, 4."
    hints:
      - "`fewest_coins`: base case `amount == 0` needs 0 coins. Otherwise, for each coin that fits, compute `1 + fewest_coins(amount - coin, coins)` and keep the smallest."
      - "Start `best` at something bigger than any possible answer, like `amount` (using only 1s), then compare each option."
      - "`first_failure`: loop `for amount in range(1, limit + 1):` and return the first amount where `len(make_change(...)) > fewest_coins(...)`. After the loop, return None."
    solution: |
      def make_change(amount, coins):
          used = []
          for coin in sorted(coins, reverse=True):
              while amount >= coin:
                  used.append(coin)
                  amount -= coin
          return used


      def fewest_coins(amount, coins):
          """True minimum number of coins for amount (brute force recursion)."""
          if amount == 0:
              return 0
          best = amount  # using only 1s always works
          for coin in coins:
              if coin <= amount:
                  best = min(best, 1 + fewest_coins(amount - coin, coins))
          return best


      def first_failure(coins, limit):
          """Smallest amount up to limit where greedy isn't optimal, or None."""
          for amount in range(1, limit + 1):
              if len(make_change(amount, coins)) > fewest_coins(amount, coins):
                  return amount
          return None
    explanation: |
      This is "check the clever answer against brute force" turned into a tool: it finds that greedy fails at 6 for coins 1, 3, 4 and at 14 (10 + 1 + 1 + 1 + 1 versus 7 + 7) for coins 1, 7, 10. The brute force recomputes the same smaller amounts over and over, just like naive Fibonacci, which is why amounts must stay small. Remembering each amount's answer (dynamic programming, Unit 8, and the playground code above) makes it fast for any amount.

  - id: meetings
    title: Schedule the most meetings
    difficulty: 2
    prompt: |
      Write `max_meetings(meetings)` where `meetings` is a list of `(start, end)` tuples (whole hours, `start < end`). Return the **list of chosen meetings**, in the order chosen, using the greedy rule: repeatedly choose the meeting that **ends earliest** among those starting at or after the last chosen meeting's end. If two meetings end at the same time, prefer the one that appears first in the input.

      ```python
      max_meetings([(9, 12), (10, 11), (11, 13), (12, 14), (13, 15), (9, 10), (14, 16)])
      # [(9, 10), (10, 11), (11, 13), (13, 15)]
      ```
    starter: |
      def max_meetings(meetings):
          pass
    tests:
      - name: example from the lesson
        code: |
          got = max_meetings([(9, 12), (10, 11), (11, 13), (12, 14), (13, 15), (9, 10), (14, 16)])
          assert got == [(9, 10), (10, 11), (11, 13), (13, 15)], f"Got {got}"
      - name: edge cases
        code: |
          assert max_meetings([]) == []
          assert max_meetings([(1, 5)]) == [(1, 5)]
          assert max_meetings([(1, 3), (3, 5), (5, 7)]) == [(1, 3), (3, 5), (5, 7)], "A meeting can start exactly when the last one ends."
          assert max_meetings([(1, 10), (2, 3), (4, 5)]) == [(2, 3), (4, 5)]
      - name: always optimal (checked by brute force)
        code: |
          import random
          from itertools import combinations
          def best_count(ms):
              for k in range(len(ms), 0, -1):
                  for combo in combinations(ms, k):
                      s = sorted(combo)
                      if all(s[i][1] <= s[i + 1][0] for i in range(len(s) - 1)):
                          return k
              return 0
          for _ in range(150):
              ms = []
              for _ in range(random.randint(0, 8)):
                  a = random.randint(0, 10)
                  ms.append((a, a + random.randint(1, 4)))
              got = max_meetings(ms)
              assert len(got) == best_count(ms), f"For {ms} you chose {got}, but {best_count(ms)} meetings are possible"
              assert all(got[i][1] <= got[i + 1][0] for i in range(len(got) - 1)), f"Your meetings overlap: {got}"
    hints:
      - "Sort the meetings by end time with a key function. Python's sort is stable, so ties keep their input order."
      - "Keep `last_end`, starting lower than any time (for example `float(\"-inf\")` or simply the smallest start minus 1)."
      - "Go through the sorted meetings: if `start >= last_end`, choose it and update `last_end`."
    solution: |
      def max_meetings(meetings):
          """Greedy: repeatedly choose the compatible meeting that ends earliest."""
          def end_time(m):
              return m[1]

          chosen = []
          last_end = None
          for start, end in sorted(meetings, key=end_time):
              if last_end is None or start >= last_end:
                  chosen.append((start, end))
                  last_end = end
          return chosen
    explanation: |
      Sorting by end time costs n log n, and the greedy pass is linear, so this handles thousands of meetings instantly, where brute force over all subsets would take 2ⁿ checks. The last test runs that brute force on 150 small random cases to confirm the greedy answer is always as large as possible: evidence, not proof (the exchange argument in the lesson is the proof). `None` for "no meeting chosen yet" avoids guessing a starting value.

  - id: travelling
    title: The shortest round trip
    difficulty: 3
    prompt: |
      A delivery van starts at city 0, must visit every other city exactly once, and return to city 0. `dist[i][j]` is the distance from city `i` to city `j` (a grid, Lesson 3.4).

      1. Write `tour_length(dist, tour)` where `tour` is a list of cities starting with 0, e.g. `[0, 2, 1, 3]`: the total distance including the return to 0.
      2. Write `best_tour(dist)` by **brute force**: try every order of the cities 1 to n − 1 and return `(length, tour)` for the shortest. Use `itertools.permutations`: `permutations([1, 2, 3])` gives every order of those items as tuples. If several tours tie, return the first found.
      3. Write `nearest_neighbour(dist)` (greedy): from the current city, always go to the **nearest unvisited** city (the lowest-numbered one on a tie). Return `(length, tour)`.
    starter: |
      from itertools import permutations


      def tour_length(dist, tour):
          pass


      def best_tour(dist):
          pass


      def nearest_neighbour(dist):
          pass
    tests:
      - name: tour_length
        code: |
          d = [[0, 2, 9, 10], [1, 0, 6, 4], [15, 7, 0, 8], [6, 3, 12, 0]]
          assert tour_length(d, [0, 1, 2, 3]) == 2 + 6 + 8 + 6, f"Got {tour_length(d, [0, 1, 2, 3])}"
          assert tour_length(d, [0, 2, 3, 1]) == 9 + 8 + 3 + 1
      - name: best_tour
        code: |
          d = [[0, 2, 9, 10], [1, 0, 6, 4], [15, 7, 0, 8], [6, 3, 12, 0]]
          assert best_tour(d) == (21, [0, 2, 3, 1]), f"Got {best_tour(d)}"
          assert best_tour([[0, 5], [5, 0]]) == (10, [0, 1])
      - name: nearest_neighbour
        code: |
          d = [[0, 2, 9, 10], [1, 0, 6, 4], [15, 7, 0, 8], [6, 3, 12, 0]]
          assert nearest_neighbour(d) == (33, [0, 1, 3, 2]), f"Got {nearest_neighbour(d)}"
      - name: greedy is never better than brute force
        code: |
          import random
          random.seed(5)
          for _ in range(30):
              n = random.randint(2, 7)
              d = [[0 if i == j else random.randint(1, 50) for j in range(n)] for i in range(n)]
              b, bt = best_tour(d)
              g, gt = nearest_neighbour(d)
              assert sorted(bt) == list(range(n)) and sorted(gt) == list(range(n)) and bt[0] == 0 and gt[0] == 0
              assert b == tour_length(d, bt) and g == tour_length(d, gt)
              assert b <= g, "The brute-force tour must be at least as short as the greedy one."
    hints:
      - "`tour_length`: add `dist[tour[i]][tour[i + 1]]` for each neighbouring pair, plus `dist[tour[-1]][tour[0]]` to get home."
      - "`best_tour`: `for order in permutations(range(1, len(dist))):` the tour is `[0] + list(order)`. Keep the shortest, replacing only when strictly shorter."
      - "`nearest_neighbour`: keep `current = 0`, a list `tour = [0]` and a set of unvisited cities. Repeatedly pick `min(unvisited, key=...)` by distance from `current` (sorting `unvisited` first makes ties go to the lowest number)."
    solution: |
      from itertools import permutations


      def tour_length(dist, tour):
          """Total distance of a round trip visiting tour in order."""
          total = 0
          for i in range(len(tour) - 1):
              total += dist[tour[i]][tour[i + 1]]
          return total + dist[tour[-1]][tour[0]]


      def best_tour(dist):
          """(length, tour) of the shortest round trip from city 0, by brute force."""
          best = None
          for order in permutations(range(1, len(dist))):
              tour = [0] + list(order)
              length = tour_length(dist, tour)
              if best is None or length < best[0]:
                  best = (length, tour)
          return best


      def nearest_neighbour(dist):
          """(length, tour) built greedily: always visit the nearest unvisited city."""
          current = 0
          tour = [0]
          unvisited = set(range(1, len(dist)))
          while unvisited:
              def distance_from_current(city):
                  return dist[current][city]
              nxt = min(sorted(unvisited), key=distance_from_current)
              tour.append(nxt)
              unvisited.remove(nxt)
              current = nxt
          return tour_length(dist, tour), tour
    explanation: |
      Brute force tries (n − 1)! tours: 720 for 7 cities, but over 10¹⁷ for 20, which is why route planners can't use it. Nearest neighbour takes about n² steps and here gives 33 instead of the best 21: greedy's early "cheap" step to city 1 forced expensive steps later. This is the **travelling salesperson problem**, one of the most studied problems in computer science; no one knows a method that's both fast and always optimal (Unit 15 explains why that's such a big deal). `itertools.permutations` is the library version of the arrangement-generating recursion from Lesson 4.6.

commonMistakes:
  - title: Trusting a greedy algorithm without checking
    explanation: |
      A greedy rule that works on a few examples can still be wrong. Compare it with brute force on many small inputs, or find a proof, before relying on it.
  - title: Using brute force without estimating the size
    explanation: |
      2ⁿ and n! grow explosively. Estimate the number of possibilities first: 20 items have a million subsets (fine) but 2.4 quintillion orders (impossible).
  - title: Greedy by the wrong measure
    explanation: |
      In scheduling, choosing the shortest or earliest-starting meeting sounds sensible but fails. The right greedy measure (earliest end time) needs an argument for why it's safe.
  - title: Throwing away the brute-force solution
    explanation: |
      Keep your slow, simple solution after writing a fast one: it's the best test you have. Many bugs in clever code are caught by comparing with brute force on random small inputs.

summary:
  - "**Brute force** tries every possibility: simple, certainly correct, and fine up to a few million possibilities. Estimate the count first (n², 2ⁿ, n!)."
  - "Brute force is the ideal **reference solution** for testing faster code."
  - "A **greedy algorithm** makes the best-looking choice at each step and never looks back. It's fast and simple."
  - "Greedy is **not always optimal** (coins 1, 3, 4 for 6). Find counterexamples by comparing with brute force; prove correctness with an argument such as an exchange argument."
  - "Scheduling by **earliest end time** is a greedy algorithm that's provably optimal."
  - "To choose a strategy: look for familiar patterns, data structures, sorting and searching, recursion, divide and conquer, brute force, then greedy, and count the steps."
