quiz:
  - type: mcq
    question: What is the main advantage of a brute-force solution?
    options:
      - It's always the fastest
      - It's simple and certainly correct, since every possibility is checked
      - It uses the least memory
      - It works for any input size
    answer: 1
    explanation: Checking everything guarantees correctness; speed is its weakness.
  - type: mcq
    question: You need to check every order of 15 delivery stops. Is brute force practical?
    options:
      - Yes, there are only 15 orders
      - Yes, there are 225 orders
      - No, there are about 1.3 trillion orders
      - Yes, there are 32,768 orders
    answer: 2
    explanation: 15! is about 1.3 × 10¹², far too many to try one by one.
  - type: mcq
    question: What does a greedy algorithm do?
    options:
      - Tries every possibility
      - Makes the choice that looks best at each step, without reconsidering
      - Splits the problem in half
      - Uses as much memory as possible
    answer: 1
    explanation: Greedy algorithms commit to the locally best choice at every step.
  - type: mcq
    question: "With coins 1, 3 and 4, how many coins does greedy change-making use for 6, and what's the true minimum?"
    options: ["2 and 2", "3 and 2", "3 and 3", "2 and 1"]
    answer: 1
    explanation: Greedy gives 4 + 1 + 1 (three coins); 3 + 3 uses two.
  - type: mcq
    question: To fit the most non-overlapping meetings in one room, which greedy rule is optimal?
    options: ["Shortest meeting first", "Earliest start first", "Earliest end first", "Latest start first"]
    answer: 2
    explanation: Choosing the meeting that ends earliest leaves the most room for the rest, and an exchange argument proves it's optimal.
  - type: mcq
    question: You've written a fast, clever function. What's the best way to gain confidence it's correct?
    options:
      - Run it once on a big input
      - Compare it with a simple brute-force version on many small random inputs
      - Read it carefully once
      - Check it doesn't crash
    answer: 1
    explanation: Agreement with an obviously correct brute-force version across many inputs catches most bugs.
  - type: code
    question: |
      Write `fewest_notes(amount)` that pays `amount` (a whole number of pounds) greedily with notes of 50, 20, 10 and 5, returning the **number** of notes used, or `None` if the amount can't be paid exactly. `fewest_notes(85)` returns `4` (50 + 20 + 10 + 5), and `fewest_notes(7)` returns `None`.
    starter: |
      def fewest_notes(amount):
          pass
    tests:
      - name: greedy notes
        code: |
          for amount, want in [(0, 0), (5, 1), (85, 4), (100, 2), (7, None), (65, 3), (95, 4)]:
              assert fewest_notes(amount) == want, f"fewest_notes({amount}) returned {fewest_notes(amount)}, expected {want}"
    solution: |
      def fewest_notes(amount):
          count = 0
          for note in [50, 20, 10, 5]:
              count += amount // note
              amount = amount % note
          return count if amount == 0 else None
