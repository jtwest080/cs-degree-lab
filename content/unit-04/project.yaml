tests:
  - name: load_catalogue reads the file
    code: |
      books = load_catalogue("books.csv")
      assert isinstance(books, list) and len(books) == 15, f"Expected a list of 15 books, got {books!r}"
      assert books[0] == ("Dune", "Frank Herbert", 1965), f"The first book should be ('Dune', 'Frank Herbert', 1965), got {books[0]!r}"
      assert ("The War of the Worlds", "H. G. Wells", 1898) in books, "Strip the spaces around ' H. G. Wells '."
      assert all(isinstance(b, tuple) and isinstance(b[2], int) for b in books), "Each book should be a tuple with the year as an int."
  - name: merge_sort sorts by a key
    code: |
      import random
      assert "sorted(" not in source and ".sort(" not in source, "Write merge sort yourself: don't use sorted() or .sort() anywhere."
      assert merge_sort([], title_key) == []
      def ident(x):
          return x
      for _ in range(50):
          data = [random.randint(-50, 50) for _ in range(random.randint(0, 40))]
          got = merge_sort(data, ident)
          assert got == sorted(data), f"merge_sort({data}) gave {got}"
      books = load_catalogue("books.csv")
      titles = [b[0] for b in merge_sort(books, title_key)]
      assert titles[0] == "Brave New World" and titles[-1] == "The War of the Worlds", f"Sorted by title: {titles}"
  - name: merge_sort is stable
    code: |
      def first_letter(word):
          return word[0]
      words = ["banana", "apple", "blueberry", "avocado", "cherry", "apricot", "bean"]
      copy = list(words)
      got = merge_sort(words, first_letter)
      assert got == ["apple", "avocado", "apricot", "banana", "blueberry", "bean", "cherry"], f"Equal keys must keep their original order. Got {got}"
      assert words == copy, "merge_sort must not change the list it's given."
      def year_key(book):
          return book[2]
      by_year = merge_sort([("B", "x", 2000), ("A", "x", 1990), ("C", "x", 2000), ("D", "x", 1990)], year_key)
      assert [b[0] for b in by_year] == ["A", "D", "B", "C"], f"Got {by_year}"
  - name: merge_sort is n log n
    code: |
      import random, time
      def ident(x):
          return x
      data = [random.random() for _ in range(20000)]
      start = time.perf_counter()
      got = merge_sort(data, ident)
      took = time.perf_counter() - start
      assert all(got[i] <= got[i + 1] for i in range(len(got) - 1)), "The result isn't sorted."
      assert took < 6, f"Sorting 20,000 items took {took:.1f} seconds. Merge sort should take well under a second: check you aren't using list.pop(0) or inserting into the middle of a list."
  - name: find_title finds titles
    code: |
      books = merge_sort(load_catalogue("books.csv"), title_key)
      assert find_title(books, "Dune") == ("Dune", "Frank Herbert", 1965), f"Got {find_title(books, 'Dune')!r}"
      assert find_title(books, "the martian") == ("The Martian", "Andy Weir", 2011), "Searches should ignore capitals."
      assert find_title(books, "BRAVE NEW WORLD") == ("Brave New World", "Aldous Huxley", 1932)
      assert find_title(books, "The War of the Worlds")[1] == "H. G. Wells"
      for missing in ["Ulysses", "A", "Zzz", "Dun", "The"]:
          assert find_title(books, missing) is None, f"find_title(books, {missing!r}) should return None"
      assert find_title([], "Dune") is None
  - name: find_title is fast
    code: |
      class CountingList(list):
          looked = 0
          def __getitem__(self, i):
              CountingList.looked += 1 if isinstance(i, int) else len(range(*i.indices(len(self))))
              return list.__getitem__(self, i)
          def __iter__(self):
              CountingList.looked += len(self)
              return list.__iter__(self)
          def __contains__(self, x):
              CountingList.looked += len(self)
              return list.__contains__(self, x)
          def index(self, *args):
              CountingList.looked += len(self)
              return list.index(self, *args)
      big = CountingList([(f"Book {i:06d}", "Author", 2000) for i in range(200000)])
      for target in ["Book 000000", "Book 123456", "book 199999", "Book 077777x"]:
          CountingList.looked = 0
          got = find_title(big, target)
          if target.endswith("x"):
              assert got is None, f"{target!r} isn't in the catalogue"
          else:
              assert got is not None and got[0].lower() == target.lower(), f"find_title failed to find {target!r}"
          assert CountingList.looked <= 60, f"Searching 200,000 books for {target!r} looked at {CountingList.looked} books. Binary search needs about 18."
  - name: titles_starting_with
    code: |
      books = merge_sort(load_catalogue("books.csv"), title_key)
      got = [b[0] for b in titles_starting_with(books, "the")]
      assert got == ["The Dispossessed", "The Hobbit", "The Left Hand of Darkness", "The Martian", "The Time Machine", "The War of the Worlds"], f"Got {got}"
      assert [b[0] for b in titles_starting_with(books, "F")] == ["Fahrenheit 451", "Foundation", "Frankenstein"]
      assert [b[0] for b in titles_starting_with(books, "FR")] == ["Frankenstein"]
      assert titles_starting_with(books, "x") == [] and titles_starting_with(books, "zz") == []
      assert len(titles_starting_with(books, "")) == 15, "Every title starts with the empty string."
      class CountingList(list):
          looked = 0
          def __getitem__(self, i):
              CountingList.looked += 1 if isinstance(i, int) else len(range(*i.indices(len(self))))
              return list.__getitem__(self, i)
          def __iter__(self):
              CountingList.looked += len(self)
              return list.__iter__(self)
      big = CountingList([(f"Book {i:06d}", "Author", 2000) for i in range(200000)])
      CountingList.looked = 0
      got = titles_starting_with(big, "book 1234")
      assert [b[0] for b in got] == [f"Book 1234{i:02d}" for i in range(100)], "Wrong books for prefix 'book 1234'"
      assert CountingList.looked <= 400, f"Finding 100 matching titles among 200,000 looked at {CountingList.looked} books. Use binary search to find where they start."
