title: The Library Catalogue
brief: |
  Every library, bookshop and music app has the same core job: keep a big collection **in order** and **find things fast**. In this project you'll build the search engine behind a small library catalogue, using the algorithms from this unit instead of Python's built-in shortcuts: **your own merge sort**, **binary search** for exact titles, and binary search again to find **ranges** of titles and years.

  A file called `books.csv` has been created for you (it's recreated every time you run):

  ```text
  title,author,year
  Dune,Frank Herbert,1965
  The Hobbit,J. R. R. Tolkien,1937
  Neuromancer,William Gibson,1984
  Frankenstein,Mary Shelley,1818
  The Left Hand of Darkness,Ursula K. Le Guin,1969
  Foundation,Isaac Asimov,1951
  The Dispossessed,Ursula K. Le Guin,1974
  Brave New World,Aldous Huxley,1932

  Kindred,Octavia E. Butler,1979
  The Time Machine,H. G. Wells,1895
  Hyperion,Dan Simmons,1989
  The War of the Worlds, H. G. Wells ,1898
  Solaris,Stanislaw Lem,1961
  Fahrenheit 451,Ray Bradbury,1953
  The Martian,Andy Weir,2011
  ```

  **Exact requirements** (the tests check these, and also run your functions on much bigger catalogues, so they must really be fast):

  - `load_catalogue(filename)` returns a **list of `(title, author, year)` tuples** in file order, with `year` as an int. Skip the header and blank lines, and strip spaces around every field.
  - `merge_sort(items, key)` returns a **new** sorted list, ordered by `key(item)`, using merge sort. It must be **stable** (items with equal keys keep their original order), must not change `items`, and must **not** use `sorted()` or `.sort()`.
  - `title_key(book)` returns the book's title in lower case, so searches ignore capitals.
  - `find_title(books, title)` takes books **already sorted by `title_key`** and returns the book whose title matches `title` (ignoring case), or `None`. It must use **binary search**.
  - `titles_starting_with(books, prefix)` takes books sorted by `title_key` and returns the list of books whose title starts with `prefix` (ignoring case), in sorted order. Use binary search to find where they start.
  - `published_between(books, first, last)` takes books **sorted by year** and returns the list of books with `first <= year <= last`, in the same order. Use binary search for both ends.
  - `main()` loads `books.csv`, sorts it by title and prints exactly:

    ```text
    Catalogue: 15 books
    First title: Brave New World
    Last title: The War of the Worlds
    Find 'dune': Dune by Frank Herbert (1965)
    Find 'Ulysses': not found
    Titles starting with 'the': 6
    Published 1950-1970: 5
    ```

    The last line of the program calls `main()`.

  Everything you need is in Units 3 and 4. Build and test one function at a time.
prelude: |
  # Creates books.csv fresh before every run.
  with open("books.csv", "w") as _f:
      _f.write("title,author,year\nDune,Frank Herbert,1965\nThe Hobbit,J. R. R. Tolkien,1937\nNeuromancer,William Gibson,1984\nFrankenstein,Mary Shelley,1818\nThe Left Hand of Darkness,Ursula K. Le Guin,1969\nFoundation,Isaac Asimov,1951\nThe Dispossessed,Ursula K. Le Guin,1974\nBrave New World,Aldous Huxley,1932\n\nKindred,Octavia E. Butler,1979\nThe Time Machine,H. G. Wells,1895\nHyperion,Dan Simmons,1989\nThe War of the Worlds, H. G. Wells ,1898\nSolaris,Stanislaw Lem,1961\nFahrenheit 451,Ray Bradbury,1953\nThe Martian,Andy Weir,2011\n")
  del _f
steps:
  - title: Load the file
    body: |
      `load_catalogue` is the same pattern as the Unit 3 gradebook: open with `with`, skip the header with `f.readline()`, strip each line, skip blank ones, split on commas, strip each field, and convert the year with `int`. Append a tuple `(title, author, year)`. Print the result to check it.
  - title: Merge sort with a key
    body: |
      Start from your `merge_sort` and `merge` from Lesson 4.7 (the `merge-lists` exercise already took a `key`). Compare `key(left[i]) <= key(right[j])`: the `<=` (not `<`) is what makes it stable, because on a tie the item from the left half, which came first, wins. Test it on the catalogue sorted by `title_key`, and by year with a small `year_key` function.
  - title: Find an exact title
    body: |
      `find_title` is the binary search from Lesson 4.3, comparing `title_key(books[mid])` with `title.lower()`. Keep `low` and `high`, look at the middle, and throw away the half that can't contain the answer. Test it on the first title, the last title, a title in the middle, and a missing title.
  - title: Ranges with a lower bound
    body: |
      Both range functions need the **lower bound** from Lesson 4.3: the first position whose key is `>=` a target. Write a helper for it. For `published_between`, the books you want run from the lower bound of `first` up to (not including) the lower bound of `last + 1`, so the answer is a single slice. For `titles_starting_with`, start at the lower bound of the prefix and step forward while titles still start with it (they're all next to each other, because the list is sorted).
  - title: Put it together
    body: |
      Write `main()` to produce the exact output above. You'll need to sort the books twice: once by `title_key` for the title searches, and once by year for `published_between`.
  - title: Check the speed
    body: |
      The tests run your search functions on a catalogue of 200,000 books and count how many books each search looks at. Binary search should look at about 18 (log₂ 200,000), not 200,000. If a test says your search looked at too many books, look for a hidden loop: `in`, `.index()`, a `for` over the whole list, or a slice taken on every step.
checklist:
