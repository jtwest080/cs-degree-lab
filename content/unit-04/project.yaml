solution: |
  # Unit 4 project: the Library Catalogue


  def load_catalogue(filename):
      """Return a list of (title, author, year) tuples from a CSV file."""
      books = []
      with open(filename) as f:
          f.readline()  # skip the header
          for line in f:
              line = line.strip()
              if line == "":
                  continue
              title, author, year = [field.strip() for field in line.split(",")]
              books.append((title, author, int(year)))
      return books


  def merge(left, right, key):
      """Merge two lists already sorted by key into one sorted list (stable)."""
      result = []
      i = j = 0
      while i < len(left) and j < len(right):
          if key(left[i]) <= key(right[j]):  # <= keeps equal items in order
              result.append(left[i])
              i += 1
          else:
              result.append(right[j])
              j += 1
      result.extend(left[i:])
      result.extend(right[j:])
      return result


  def merge_sort(items, key):
      """Return a new list of items sorted by key, using stable merge sort."""
      if len(items) <= 1:
          return list(items)
      mid = len(items) // 2
      return merge(merge_sort(items[:mid], key), merge_sort(items[mid:], key), key)


  def title_key(book):
      """Return the book's title in lower case."""
      return book[0].lower()


  def year_key(book):
      """Return the book's year."""
      return book[2]


  def lower_bound(books, target, key):
      """First position whose key is >= target (len(books) if none)."""
      low, high = 0, len(books)
      while low < high:
          mid = (low + high) // 2
          if key(books[mid]) < target:
              low = mid + 1
          else:
              high = mid
      return low


  def find_title(books, title):
      """Binary search books (sorted by title_key) for a title; None if missing."""
      target = title.lower()
      i = lower_bound(books, target, title_key)
      if i < len(books):
          book = books[i]
          if title_key(book) == target:
              return book
      return None


  def titles_starting_with(books, prefix):
      """Return the books (sorted by title_key) whose title starts with prefix."""
      prefix = prefix.lower()
      i = lower_bound(books, prefix, title_key)
      found = []
      while i < len(books):
          book = books[i]
          if not title_key(book).startswith(prefix):
              break
          found.append(book)
          i += 1
      return found


  def published_between(books, first, last):
      """Return the books (sorted by year) with first <= year <= last."""
      start = lower_bound(books, first, year_key)
      end = lower_bound(books, last + 1, year_key)
      return list(books[start:end])


  def main():
      """Load books.csv and print the catalogue summary."""
      books = load_catalogue("books.csv")
      by_title = merge_sort(books, title_key)
      by_year = merge_sort(books, year_key)
      print(f"Catalogue: {len(books)} books")
      print(f"First title: {by_title[0][0]}")
      print(f"Last title: {by_title[-1][0]}")
      for query in ["dune", "Ulysses"]:
          book = find_title(by_title, query)
          if book is None:
              print(f"Find '{query}': not found")
          else:
              title, author, year = book
              print(f"Find '{query}': {title} by {author} ({year})")
      print(f"Titles starting with 'the': {len(titles_starting_with(by_title, 'the'))}")
      print(f"Published 1950-1970: {len(published_between(by_year, 1950, 1970))}")


  main()
stretch:
  - "Add `books_by_author(books, author)` that groups the catalogue with a dictionary, then compare its speed with a binary search on books sorted by author. When is each approach better?"
  - "Count comparisons: give `merge_sort` a counter and check that sorting n books takes about n log₂ n comparisons, as Lesson 4.7 predicted."
  - "Write a brute-force `slow_titles_starting_with` using a plain loop, and test your fast version against it on 1,000 random prefixes."
  - "Ignore a leading \"The \" when sorting, the way real libraries file *The Hobbit* under H. (Hint: it only needs a new key function.)"
