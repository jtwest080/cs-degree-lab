      assert got == ["Foundation", "Fahrenheit 451", "Solaris", "Dune", "The Left Hand of Darkness"], f"Got {got}"
      assert [b[2] for b in published_between(books, 1898, 1937)] == [1898, 1932, 1937], "Both ends are included."
      assert published_between(books, 1990, 2010) == [] and published_between(books, 2020, 2030) == [] and published_between(books, 1000, 1500) == []
      assert len(published_between(books, 0, 3000)) == 15
      class CountingList(list):
          looked = 0
          def __getitem__(self, i):
              CountingList.looked += 1
              return list.__getitem__(self, i)
          def __iter__(self):
              CountingList.looked += len(self)
              return list.__iter__(self)
      big = CountingList([("T", "A", 1000 + i // 100) for i in range(200000)])
      CountingList.looked = 0
      got = published_between(big, 1500, 1501)
      assert len(got) == 200 and got[0][2] == 1500 and got[-1][2] == 1501, f"Expected the 200 books from 1500 and 1501, got {len(got)}"
