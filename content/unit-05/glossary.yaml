# Terms introduced in Unit 5. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Object-oriented programming (OOP)
    definition: A style of programming that organises code around objects, which bundle data (attributes) with the behaviour (methods) that works on it.
    lesson: u5-classes
  - term: Class
    definition: A blueprint for a new type, describing the attributes its objects have and the methods they can run. Defined with the `class` keyword.
    lesson: u5-classes
  - term: Instance
    definition: One particular object made from a class. `Dog("Rex", 3)` creates an instance of `Dog`.
    lesson: u5-classes
  - term: Attribute
    definition: A named value stored on an object (or class), reached with a dot, as in `rex.name`.
    lesson: u5-classes
  - term: __init__
    definition: The special method Python runs automatically when a new object is created, used to set its starting attributes. Also called the constructor or initialiser.
    lesson: u5-classes
  - term: self
    definition: The conventional name for a method's first parameter, which refers to the object the method was called on.
    lesson: u5-classes
  - term: AttributeError
    definition: The error raised when you read an attribute or method that an object doesn't have.
    lesson: u5-classes
  - term: State
    definition: The current values of all of an object's attributes.
    lesson: u5-methods
  - term: Query and command methods
    definition: A query method returns information and leaves the object unchanged; a command method changes the object's state.
    lesson: u5-methods
  - term: Class invariant
    definition: A rule that is true for every object of a class at all times, such as "the balance is never negative". Methods must preserve it.
    lesson: u5-methods
  - term: Mutable default argument
    definition: A default parameter value such as `[]` that is created once and shared by every call. Use `None` and create the value inside instead.
    lesson: u5-methods
  - term: Finite state machine
    definition: A model of something that is always in one of a fixed set of states, with events (methods) that move it between states, like a turnstile or traffic light.
    lesson: u5-methods
  - term: Special method (dunder method)
    definition: A method with double underscores on both sides, such as `__str__` or `__add__`, that Python calls to implement built-in operations.
    lesson: u5-special-methods
  - term: __str__ and __repr__
    definition: Special methods returning an object's text form. `__str__` is the friendly form for `print`; `__repr__` is the precise, code-like form for debugging and lists.
    lesson: u5-special-methods
  - term: __eq__
    definition: The special method behind `==`. Defining it gives value equality instead of identity.
    lesson: u5-special-methods
  - term: __lt__
    definition: The special method behind `<`, which lets `sorted`, `min` and `max` work on objects.
    lesson: u5-special-methods
  - term: NotImplemented
    definition: A special value a comparison or operator method returns to say it doesn't know how to handle the other operand, so Python can try something else.
    lesson: u5-special-methods
  - term: Operator overloading
    definition: Giving an operator such as `+` a meaning for your own class by defining the matching special method.
    lesson: u5-special-methods
  - term: Delegation
    definition: An object passing a request on to another object it holds, such as a playlist's `__len__` returning the length of its list.
    lesson: u5-special-methods
  - term: Encapsulation
    definition: Hiding how a class works inside it and exposing only a public interface, so invariants are protected and the internals can change freely.
    lesson: u5-encapsulation
  - term: Interface (of a class)
    definition: The methods and attributes that other code is meant to use. Everything else is implementation detail.
    lesson: u5-encapsulation
  - term: Private attribute (convention)
    definition: An attribute whose name starts with an underscore, such as `_balance`, meaning "internal; don't use from outside".
    lesson: u5-encapsulation
  - term: Property
    definition: A method used with attribute syntax, created with `@property`. Used for computed and read-only values, and with a setter for validation.
    lesson: u5-encapsulation
  - term: Setter
    definition: The method that runs when a property is assigned to, defined with `@name.setter`; often used to validate new values.
    lesson: u5-encapsulation
  - term: Decorator
    definition: A line starting with `@` above a function or class that changes how it behaves, such as `@property`, `@classmethod` or `@dataclass`.
    lesson: u5-encapsulation
  - term: Class attribute
    definition: An attribute defined in the class body, shared by all its objects. Used for constants and shared counters.
    lesson: u5-encapsulation
  - term: Class method
    definition: A method marked `@classmethod` that receives the class (`cls`) instead of an object; often used as an alternative constructor.
    lesson: u5-encapsulation
  - term: Composition
    definition: Building an object from other objects held as attributes; a "has a" relationship, like a car that has an engine.
    lesson: u5-composition
  - term: Aggregation
    definition: A looser form of composition where the contained objects are shared and live independently, like students enrolled on several courses.
    lesson: u5-composition
  - term: Law of Demeter
    definition: "The guideline \"talk only to your friends\": a method should use its own object, its attributes and its parameters, not long chains like `a.b.c.d()`."
    lesson: u5-composition
  - term: Dependency injection
    definition: Passing an object's collaborators in (usually to its constructor) instead of having it create them, which makes it flexible and testable.
    lesson: u5-composition
  - term: Inheritance
    definition: Defining a new class based on an existing one, so it automatically gets the existing class's attributes and methods; an "is a" relationship.
    lesson: u5-inheritance
  - term: Base class and subclass
    definition: In `class SavingsAccount(Account):`, `Account` is the base class (parent, superclass) and `SavingsAccount` the subclass (child).
    lesson: u5-inheritance
  - term: Overriding
    definition: Redefining an inherited method in a subclass so the subclass's version is used instead.
    lesson: u5-inheritance
  - term: super()
    definition: Gives access to the base class's version of a method, so a subclass can extend it, as in `super().__init__(name)`.
    lesson: u5-inheritance
  - term: isinstance
    definition: "`isinstance(obj, C)` is True if `obj` was made from class `C` or any subclass of it."
    lesson: u5-inheritance
  - term: Liskov substitution principle
    definition: A subclass object should work anywhere a base class object is expected, without surprising the code that uses it.
    lesson: u5-inheritance
  - term: Polymorphism
    definition: One piece of code working with objects of many different types through a shared interface, such as calling `shape.area()` on any shape.
    lesson: u5-polymorphism
  - term: Abstract base class
    definition: A class that declares methods for subclasses to implement and isn't meant to be used directly. The `abc` module's `ABC` and `@abstractmethod` enforce this.
    lesson: u5-polymorphism
  - term: NotImplementedError
    definition: The exception conventionally raised by a base class method that subclasses are supposed to override.
    lesson: u5-polymorphism
  - term: Duck typing
    definition: Using an object according to the methods it has rather than its class. "If it walks like a duck and quacks like a duck, it's a duck."
    lesson: u5-polymorphism
  - term: Open/closed principle
    definition: Code should be open for extension (new classes can be added) but closed for modification (existing code doesn't need to change).
    lesson: u5-polymorphism
  - term: Expression tree
    definition: A tree of objects representing a calculation, where operator nodes combine the values of their child nodes. Interpreters and compilers use such trees.
    lesson: u5-polymorphism
  - term: Module
    definition: A Python file whose functions, classes and variables can be used by other code with `import`.
    lesson: u5-modules-dataclasses
  - term: Package
    definition: A folder of related modules that can be imported together.
    lesson: u5-modules-dataclasses
  - term: import
    definition: "The statement that loads a module: `import math`, `from math import sqrt`, or `import statistics as stats`."
    lesson: u5-modules-dataclasses
  - term: Standard library
    definition: The large collection of modules that comes with Python, such as `math`, `random`, `collections` and `datetime`.
    lesson: u5-modules-dataclasses
  - term: Namespace
    definition: A separate space of names, such as a module's, so that names in different modules don't clash.
    lesson: u5-modules-dataclasses
  - term: __name__ == "__main__"
    definition: An idiom that runs a block only when a file is run directly, not when it is imported as a module.
    lesson: u5-modules-dataclasses
  - term: Counter and defaultdict
    definition: Tools from the `collections` module. `Counter` counts items; `defaultdict` creates a default value (such as an empty list) for missing keys.
    lesson: u5-modules-dataclasses
  - term: Dataclass
    definition: A class decorated with `@dataclass`, which generates `__init__`, `__repr__` and `__eq__` from its listed fields.
    lesson: u5-modules-dataclasses
  - term: Type hint
    definition: "An annotation describing the expected type of a variable or field, such as `price: float`. Python doesn't enforce it."
    lesson: u5-modules-dataclasses
  - term: Custom exception
    definition: An exception class you define by inheriting from `Exception`, often in a hierarchy with extra attributes describing the problem.
    lesson: u5-modules-dataclasses
  - term: finally
    definition: A block after `try` that always runs, whether or not an exception happened; used for clean-up.
    lesson: u5-modules-dataclasses
  - term: Responsibility
    definition: The one job a class is for, ideally describable in a single sentence.
    lesson: u5-design
  - term: CRC card
    definition: An index card listing a class's name, its responsibilities and its collaborators; a quick tool for designing classes.
    lesson: u5-design
  - term: Cohesion
    definition: How closely related the contents of a class are. High cohesion (one focused job) is good.
    lesson: u5-design
  - term: Coupling
    definition: How much one class depends on the details of others. Low coupling is good.
    lesson: u5-design
  - term: SOLID
    definition: "Five object-oriented design principles: Single responsibility, Open/closed, Liskov substitution, Interface segregation and Dependency inversion."
    lesson: u5-design
  - term: Single responsibility principle
    definition: A class should have only one reason to change.
    lesson: u5-design
  - term: Interface segregation principle
    definition: Classes shouldn't be forced to provide methods they don't need; prefer several small interfaces to one large one.
    lesson: u5-design
  - term: Dependency inversion principle
    definition: Depend on abstractions (an interface) rather than on specific concrete classes.
    lesson: u5-design
  - term: Code smell
    definition: A surface sign that a design may have a deeper problem, such as duplicated code, a god class or a long parameter list.
    lesson: u5-design
  - term: Refactoring
    definition: Improving the structure of code without changing what it does, ideally with tests to confirm the behaviour is unchanged.
    lesson: u5-design
  - term: Test double
    definition: A simple stand-in object (such as a fake sensor) with the same interface as a real collaborator, used to test a class in isolation.
    lesson: u5-design
  - term: KISS and YAGNI
    definition: "\"Keep it simple\" and \"you aren't gonna need it\": prefer the simplest design that meets today's needs."
    lesson: u5-design
