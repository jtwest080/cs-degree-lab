id: u5-classes
title: Classes and Objects
minutes: 45
objective: |
  Define your own types with **classes**, create **objects** (instances) from them, give each object its own data with `__init__` and `self`, and explain why bundling data into objects beats passing loose tuples and dictionaries around.
outcomes:
  - Explain the difference between a class and an object (instance)
  - Define a class with the `class` keyword and create instances by calling it
  - Write an `__init__` method that stores attributes on `self`
  - Read and change an object's attributes with dot notation
  - Explain what `self` is and why every method receives it
  - Store objects in lists and dictionaries and process them with loops

sections:
  - heading: Why make your own types?
    body: |
      Python comes with types for numbers, text, lists and dictionaries. In Units 3 and 4 you built everything else out of those: a book was a tuple `("Dune", "Frank Herbert", 1965)`, a student's grades were a dictionary of dictionaries. That works, but it has problems you've probably already felt:

      - **Meaning is hidden.** What is `book[2]`? You have to remember that position 2 is the year. Type `book[3]` by mistake and you get an `IndexError` far from the real bug.
      - **Nothing keeps the data valid.** Nothing stops someone writing a dictionary with `"scroe"` instead of `"score"`, or a negative price.
      - **Data and behaviour live apart.** The functions that work on books (`title_key`, `find_title`) are scattered around the program, and nothing says which functions go with which data.

      **Object-oriented programming (OOP)** solves these problems by letting you define **your own types**. A `Book` type can have named fields (`book.year` instead of `book[2]`), rules that keep its data valid, and its own functions built in. Almost every large program you use (games, browsers, phone apps) is organised this way.

  - heading: Classes and objects
    body: |
      A **class** is a blueprint that describes a kind of thing: what data it holds and what it can do. An **object** (also called an **instance**) is one particular thing built from that blueprint.

      > **Analogy:** A class is like a cookie cutter, and objects are the cookies. One cutter (the `Dog` class) can make many cookies (Rex, Bella, Max), all the same shape but each decorated differently, with its own name and age.

      You've been using objects all along. `"hello"` is an object of class `str`, `[1, 2]` is an object of class `list`. `type()` tells you an object's class:

      ```python
      print(type("hello"))   # <class 'str'>
      print(type([1, 2]))    # <class 'list'>
      ```

      Each string has its own data (its characters) but shares behaviour with every other string: they all have `.upper()` and `.split()`. That's exactly the split between *instance data* and *class behaviour* you're about to build yourself.

      The simplest possible class:

      ```python
      class Dog:
          pass

      rex = Dog()
      bella = Dog()
      print(type(rex))       # <class '__main__.Dog'>
      print(rex == bella)    # False: two different objects
      ```

      `class Dog:` defines the blueprint (class names use **CapitalisedWords** by convention, unlike functions). **Calling** the class like a function, `Dog()`, builds a new object. `__main__` just means "defined in this program".

  - heading: Attributes and __init__
    body: |
      An object can hold named values called **attributes**, reached with a dot: `rex.name`. You *could* attach attributes one by one after creating the object, but then nothing guarantees every dog has a name. Instead, a class defines a special function called `__init__` (two underscores each side, said "dunder init") that Python runs automatically every time a new object is created:

      ```python
      class Dog:
          def __init__(self, name, age):
              self.name = name
              self.age = age

      rex = Dog("Rex", 3)
      print(rex.name, rex.age)   # Rex 3
      ```

      Here is what happens when Python runs `Dog("Rex", 3)`:

      1. It creates a brand-new, empty `Dog` object.
      2. It calls `__init__`, passing **the new object as the first argument**, followed by `"Rex"` and `3`.
      3. Inside `__init__`, `self` *is* that new object, so `self.name = name` stores `"Rex"` as an attribute on it.
      4. The finished object is returned and assigned to `rex`.

      `__init__` is called a **constructor** (strictly, an initialiser): it sets up a new object's starting state. Functions defined inside a class are called **methods**; `__init__` is the first one you've met.

      > **Key idea:** `self.name = name` looks repetitive but says two different things. The right-hand `name` is the **parameter**, a local variable that disappears when `__init__` ends (Lesson 2.8). The left-hand `self.name` is an **attribute** stored on the object, which lives as long as the object does.

  - heading: What is self?
    body: |
      `self` is simply the name, by strong convention, of the first parameter of every method: it refers to **the particular object the method is working on**. One `Dog` class serves many dogs, so methods need to know *which* dog. When you write `rex.describe()`, Python quietly turns it into `Dog.describe(rex)`, passing `rex` as `self`.

      ```python
      class Dog:
          def __init__(self, name, age):
              self.name = name
              self.age = age

          def describe(self):
              return f"{self.name} is {self.age} years old"

      rex = Dog("Rex", 3)
      bella = Dog("Bella", 5)
      print(rex.describe())     # Rex is 3 years old
      print(bella.describe())   # Bella is 5 years old
      ```

      Same method, different objects, different results, because `self` is a different dog each time. You never pass `self` yourself; Python fills it in from whatever is before the dot. That's why `describe` is *defined* with one parameter but *called* with none. (The next lesson is all about methods.)

  - heading: Objects are mutable, and they're references
    body: |
      Attributes can be changed after creation, just like list items:

      ```python
      rex.age = 4          # a birthday
      rex.trick = "sit"    # a new attribute (allowed, but usually a bad idea)
      ```

      Adding attributes outside `__init__` works, but makes your objects inconsistent (some dogs have `.trick`, some don't, and reading `bella.trick` raises an `AttributeError`). Good style: **create every attribute in `__init__`**, even if it starts as `None`, `0` or an empty list.

      Everything you learned about references in Lesson 3.4 applies to your objects. A variable holds a *reference* to an object, so assignment doesn't copy:

      ```python
      also_rex = rex
      also_rex.age = 10
      print(rex.age)    # 10: one dog, two name tags
      ```

      And a function that receives an object can change it, just as a function can append to a list it was given.

  - heading: Collections of objects
    body: |
      Objects become really useful in groups. A list of `Book` objects reads far more clearly than a list of tuples:

      ```python
      for book in books:
          if book.year < 1950:
              print(book.title, "by", book.author)
      ```

      compared with `if b[2] < 1950: print(b[0], "by", b[1])`. Every pattern from Unit 3 (filter, transform, count, group, sort with a `key`) works the same with objects; only the way you read a field changes.

      One surprise: `print(book)` shows something like `<__main__.Book object at 0x7f3a2c1d5e50>`, the object's class and its memory address (a different hex number every run). Python doesn't know how *you* want a book displayed. Lesson 5.3 shows how to teach it; until then, print the attributes you want.

      > **Tip:** When you design a class, ask: *what does every one of these things have?* (those become attributes set in `__init__`) and *what can each one do, or what do I want to ask it?* (those become methods).

examples:
  - title: A class with __init__
    intro: A bank account with an owner and a balance.
    code: |
      class Account:
          def __init__(self, owner, balance):
              self.owner = owner
              self.balance = balance

      a = Account("Ada", 100)
      b = Account("Alan", 25)
      print(a.owner, a.balance)
      print(b.owner, b.balance)
      a.balance = a.balance + 50
      print(a.balance, b.balance)
    output: |
      Ada 100
      Alan 25
      150 25
    lines:
      - line: 1
        note: "`class Account:` starts the blueprint. Everything indented below belongs to the class."
      - line: 2
        note: "`__init__` runs automatically when an `Account` is created. `self` is the new object; `owner` and `balance` are the values passed in."
      - line: 3-4
        note: "Store the values as attributes on the object, so they last after `__init__` finishes."
      - line: 6-7
        note: "Calling the class creates objects. Python supplies `self`; we supply the other two arguments."
      - line: 10-11
        note: "Changing `a.balance` doesn't affect `b`: each object has its own attributes."
  - title: Methods use self
    intro: The same method gives different answers for different objects.
    code: |
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          def area(self):
              return self.width * self.height

          def is_square(self):
              return self.width == self.height

      shapes = [Rectangle(3, 4), Rectangle(5, 5), Rectangle(10, 2)]
      for r in shapes:
          print(r.width, "x", r.height, "area", r.area(), "square?", r.is_square())
    output: |
      3 x 4 area 12 square? False
      5 x 5 area 25 square? True
      10 x 2 area 20 square? False
    lines:
      - line: 6-7
        note: "A method is a function defined inside the class. It reads the object's attributes through `self`."
      - line: 12
        note: "A list of three separate `Rectangle` objects."
      - line: 13-14
        note: "`r.area()` becomes `Rectangle.area(r)`, so `self` is whichever rectangle `r` currently refers to."
  - title: Tuples versus objects
    intro: The same data and the same question, two ways.
    code: |
      # As tuples: what do b[1] and b[2] mean?
      books = [("Dune", "Herbert", 1965), ("Kindred", "Butler", 1979)]
      print([b[0] for b in books if b[2] > 1970])

      # As objects: the code says what it means
      class Book:
          def __init__(self, title, author, year):
              self.title = title
              self.author = author
              self.year = year

      books = [Book("Dune", "Herbert", 1965), Book("Kindred", "Butler", 1979)]
      print([b.title for b in books if b.year > 1970])
    output: |
      ['Kindred']
      ['Kindred']
    lines:
      - line: 3
        note: "Works, but you must remember that position 0 is the title and 2 is the year."
      - line: 13
        note: "The same comprehension, but `b.title` and `b.year` are self-explanatory."

playground:
  prompt: |
    Make your own class for something you care about: a song, a football player, a pet, a recipe. Give it at least three attributes in `__init__` and one method that answers a question about it. Create a list of several objects and use a loop or comprehension to filter them.
  code: |
    class Song:
        def __init__(self, title, artist, seconds):
            self.title = title
            self.artist = artist
            self.seconds = seconds

        def length(self):
            return f"{self.seconds // 60}:{self.seconds % 60:02d}"

    playlist = [
        Song("Bohemian Rhapsody", "Queen", 354),
        Song("Hey Jude", "The Beatles", 431),
        Song("Respect", "Aretha Franklin", 147),
    ]
    for song in playlist:
        print(f"{song.title} ({song.artist}) {song.length()}")
    print("Total minutes:", sum(s.seconds for s in playlist) / 60)

exercises:
  - id: point-class
    title: A Point class
    difficulty: 1
    prompt: |
      Write a class `Point` whose `__init__` takes `x` and `y` and stores them as attributes `x` and `y`.

      ```python
      p = Point(3, 4)
      print(p.x, p.y)   # 3 4
      ```
    starter: |
      class Point:
          pass
    tests:
      - name: stores x and y
        code: |
          p = Point(3, 4)
          assert p.x == 3 and p.y == 4, "Point(3, 4) should have x == 3 and y == 4"
      - name: separate objects
        code: |
          a, b = Point(1, 2), Point(-5, 0)
          assert (a.x, a.y, b.x, b.y) == (1, 2, -5, 0), "Each point should keep its own x and y"
          a.x = 99
          assert b.x == -5, "Changing one point mustn't change another"
    hints:
      - "Inside the class, define `def __init__(self, x, y):`."
      - "In `__init__`, store each parameter on the object: `self.x = x`."
    solution: |
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y
    explanation: |
      `__init__` receives the new object as `self` and the two values you passed. Assigning to `self.x` and `self.y` stores them on that particular object, so every point keeps its own coordinates.

  - id: distance-method
    title: Distance from the origin
    difficulty: 1
    prompt: |
      Extend `Point` with two methods:

      - `distance_to_origin()` returns the straight-line distance from (0, 0), which is √(x² + y²). Use `** 0.5` for the square root.
      - `distance_to(other)` takes **another `Point`** and returns the distance between the two points: √((x₁ − x₂)² + (y₁ − y₂)²).

      ```python
      Point(3, 4).distance_to_origin()        # 5.0
      Point(1, 1).distance_to(Point(4, 5))    # 5.0
      ```
    starter: |
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y
    tests:
      - name: distance_to_origin
        code: |
          assert Point(3, 4).distance_to_origin() == 5.0, f"Got {Point(3, 4).distance_to_origin()}"
          assert Point(0, 0).distance_to_origin() == 0
          assert abs(Point(-1, -1).distance_to_origin() - 2 ** 0.5) < 1e-9
      - name: distance_to another point
        code: |
          a, b = Point(1, 1), Point(4, 5)
          assert a.distance_to(b) == 5.0, f"Got {a.distance_to(b)}"
          assert b.distance_to(a) == 5.0, "Distance should be the same in both directions"
          assert a.distance_to(a) == 0
    hints:
      - "A method is a `def` inside the class whose first parameter is `self`. Read the coordinates with `self.x` and `self.y`."
      - "In `distance_to(self, other)`, `other` is a whole `Point`, so its coordinates are `other.x` and `other.y`."
    solution: |
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def distance_to_origin(self):
              return (self.x ** 2 + self.y ** 2) ** 0.5

          def distance_to(self, other):
              dx = self.x - other.x
              dy = self.y - other.y
              return (dx ** 2 + dy ** 2) ** 0.5
    explanation: |
      `distance_to` shows that a method can take other objects as arguments, including objects of its own class. Inside it there are two points: `self` (the one before the dot) and `other` (the one in brackets).

  - id: student-objects
    title: Filter a list of objects
    difficulty: 2
    prompt: |
      A `Student` class is provided, with attributes `name`, `year` (1 to 4) and `scores` (a list of numbers). Add a method `average()` that returns the mean of `scores` (or `0` if there are none). Then write two functions **outside** the class:

      - `honour_roll(students)` returns the **names** of students whose average is at least 85, in the original order.
      - `by_year(students)` returns a dictionary mapping each year to a list of the names of students in that year (the grouping pattern from Lesson 3.6).
    starter: |
      class Student:
          def __init__(self, name, year, scores):
              self.name = name
              self.year = year
              self.scores = scores


      def honour_roll(students):
          pass


      def by_year(students):
          pass
    tests:
      - name: average
        code: |
          assert Student("A", 1, [80, 90, 100]).average() == 90
          assert Student("B", 2, []).average() == 0, "No scores should give an average of 0"
      - name: honour_roll
        code: |
          ss = [Student("Ada", 1, [90, 95]), Student("Bo", 2, [70, 80]), Student("Cy", 1, [85, 85]), Student("Di", 3, [])]
          assert honour_roll(ss) == ["Ada", "Cy"], f"Got {honour_roll(ss)}"
          assert honour_roll([]) == []
      - name: by_year
        code: |
          ss = [Student("Ada", 1, [90]), Student("Bo", 2, [70]), Student("Cy", 1, [85]), Student("Di", 4, [60])]
          assert by_year(ss) == {1: ["Ada", "Cy"], 2: ["Bo"], 4: ["Di"]}, f"Got {by_year(ss)}"
    hints:
      - "`average(self)`: if `self.scores` is empty return 0, otherwise `sum(self.scores) / len(self.scores)`."
      - "`honour_roll`: a comprehension like `[s.name for s in students if s.average() >= 85]`."
      - "`by_year`: start with `{}`; for each student, create an empty list for `s.year` if needed, then append `s.name`."
    solution: |
      class Student:
          def __init__(self, name, year, scores):
              self.name = name
              self.year = year
              self.scores = scores

          def average(self):
              if not self.scores:
                  return 0
              return sum(self.scores) / len(self.scores)


      def honour_roll(students):
          return [s.name for s in students if s.average() >= 85]


      def by_year(students):
          groups = {}
          for s in students:
              if s.year not in groups:
                  groups[s.year] = []
              groups[s.year].append(s.name)
          return groups
    explanation: |
      The patterns are exactly those of Unit 3; only the way you read data has changed, from `s[0]` or `s["name"]` to `s.name`. Notice the split of responsibilities: `average` belongs *in* the class because it's about one student, while `honour_roll` works on many students, so it lives outside.

  - id: counter-class
    title: A tally counter
    difficulty: 2
    prompt: |
      Write a class `Tally` modelling a handheld clicker counter:

      - `Tally(label)` creates a counter with the given `label` (stored as `label`) and a `count` attribute starting at 0.
      - `click()` adds 1 to the count.
      - `reset()` sets the count back to 0.
      - `report()` returns a string like `"Visitors: 3"`.

      ```python
      t = Tally("Visitors")
      t.click(); t.click(); t.click()
      t.report()   # "Visitors: 3"
      ```
    starter: |
      class Tally:
          def __init__(self, label):
              pass
    tests:
      - name: starts at zero
        code: |
          t = Tally("Cars")
          assert t.label == "Cars" and t.count == 0, "A new Tally should store its label and start at 0"
      - name: click and report
        code: |
          t = Tally("Visitors")
          for _ in range(3):
              t.click()
          assert t.count == 3, f"After 3 clicks count is {t.count}"
          assert t.report() == "Visitors: 3", f"Got {t.report()!r}"
      - name: reset and independence
        code: |
          a, b = Tally("A"), Tally("B")
          a.click(); a.click(); b.click()
          a.reset()
          assert a.count == 0 and b.count == 1, "reset should only affect its own counter"
    hints:
      - "In `__init__`, set both `self.label = label` and `self.count = 0`."
      - "`click(self)` changes the object's state: `self.count += 1`. It doesn't need to return anything."
    solution: |
      class Tally:
          def __init__(self, label):
              self.label = label
              self.count = 0

          def click(self):
              self.count += 1

          def reset(self):
              self.count = 0

          def report(self):
              return f"{self.label}: {self.count}"
    explanation: |
      `count` isn't passed in; it's part of the object's starting state, so `__init__` sets it to 0. This is the key idea of objects: they **remember** things between method calls. Each `click` changes the stored count, and `report` reads it later.

  - id: library-shelf
    title: Books on a shelf
    difficulty: 3
    prompt: |
      Write two classes:

      - `Book(title, author, pages)` storing those three attributes, plus an attribute `on_loan` that starts as `False`.
      - `Shelf()` with an attribute `books`, an empty list, and methods:
        - `add(book)` appends a `Book` to the shelf.
        - `total_pages()` returns the total pages of all books on the shelf.
        - `available()` returns the **titles** of books not on loan, in the order added.
        - `lend(title)` finds the book with that title; if it exists and isn't on loan, sets `on_loan` to `True` and returns `True`. Otherwise returns `False`.

      ```python
      shelf = Shelf()
      shelf.add(Book("Dune", "Herbert", 412))
      shelf.add(Book("Emma", "Austen", 474))
      shelf.lend("Dune")     # True
      shelf.lend("Dune")     # False (already out)
      shelf.available()      # ["Emma"]
      ```
    starter: |
      class Book:
          pass


      class Shelf:
          pass
    tests:
      - name: Book attributes
        code: |
          b = Book("Dune", "Herbert", 412)
          assert (b.title, b.author, b.pages, b.on_loan) == ("Dune", "Herbert", 412, False)
      - name: add and total_pages
        code: |
          s = Shelf()
          assert s.books == [] and s.total_pages() == 0
          s.add(Book("Dune", "Herbert", 412))
          s.add(Book("Emma", "Austen", 474))
          assert len(s.books) == 2 and s.total_pages() == 886, f"total_pages gave {s.total_pages()}"
      - name: lend and available
        code: |
          s = Shelf()
          for t in ["Dune", "Emma", "Ulysses"]:
              s.add(Book(t, "?", 100))
          assert s.available() == ["Dune", "Emma", "Ulysses"]
          assert s.lend("Emma") is True
          assert s.lend("Emma") is False, "A book already on loan can't be lent again"
          assert s.lend("Missing") is False, "Lending a title that isn't there returns False"
          assert s.available() == ["Dune", "Ulysses"], f"Got {s.available()}"
          assert s.books[1].on_loan is True, "Lending should change the Book object itself"
      - name: separate shelves
        code: |
          a, b = Shelf(), Shelf()
          a.add(Book("X", "Y", 1))
          assert b.books == [], "Each shelf needs its own list: create it in __init__"
    hints:
      - "`Shelf.__init__` should do `self.books = []`, so each shelf gets its own new list."
      - "`total_pages`: `sum(b.pages for b in self.books)`."
      - "`lend`: loop over `self.books`; when `book.title == title`, check `book.on_loan`, then either set it and return True, or return False. After the loop, return False."
    solution: |
      class Book:
          def __init__(self, title, author, pages):
              self.title = title
              self.author = author
              self.pages = pages
              self.on_loan = False


      class Shelf:
          def __init__(self):
              self.books = []

          def add(self, book):
              self.books.append(book)

          def total_pages(self):
              return sum(b.pages for b in self.books)

          def available(self):
              return [b.title for b in self.books if not b.on_loan]

          def lend(self, title):
              for book in self.books:
                  if book.title == title:
                      if book.on_loan:
                          return False
                      book.on_loan = True
                      return True
              return False
    explanation: |
      Here one object (a `Shelf`) holds a list of other objects (`Book`s), a design called **composition** that Lesson 5.5 explores. `lend` changes a `Book` through the reference stored in the list, so the change is visible everywhere that book is referenced (Lesson 3.4). Creating `self.books = []` inside `__init__` matters: each shelf gets a fresh list.

commonMistakes:
  - title: Forgetting self in a method definition
    explanation: |
      `def area():` inside a class causes `TypeError: area() takes 0 positional arguments but 1 was given` when called, because Python always passes the object as the first argument. Every method's first parameter is `self`.
  - title: Writing name instead of self.name
    explanation: |
      Inside a method, plain `name` is a local variable (or a NameError). The object's attribute is `self.name`. In `__init__`, `name = name` does nothing useful; `self.name = name` stores it.
  - title: Forgetting the brackets when creating or calling
    explanation: |
      `d = Dog` makes `d` another name for the *class*, not a new dog. `d = Dog("Rex", 3)` creates an object. Likewise `r.area` is the method itself; `r.area()` calls it.
  - title: Misspelling __init__
    explanation: |
      `_init_` (single underscores) or `__int__` is just an ordinary method that never runs automatically, so you get `TypeError: Dog() takes no arguments`. It's two underscores, `init`, two underscores.
  - title: Creating attributes outside __init__
    explanation: |
      Attributes added later only exist on some objects, leading to `AttributeError`. Set every attribute in `__init__`, even if its starting value is `0`, `None` or `[]`.

summary:
  - "A **class** is a blueprint for a new type; an **object** (instance) is one thing made from it. Create one by calling the class: `Dog(\"Rex\", 3)`."
  - "`__init__` runs automatically when an object is created and sets its starting **attributes** on `self`."
  - "`self` is the object a method is working on. `rex.describe()` means `Dog.describe(rex)`."
  - "**Methods** are functions defined in a class; they read and change the object's attributes through `self`."
  - "Variables hold **references** to objects, so assignment shares and functions can change objects (Lesson 3.4)."
  - "Objects make code self-explanatory (`book.year` rather than `book[2]`) and keep data and behaviour together."
next: |
  You've given objects data. In **Lesson 5.2** you'll give them behaviour: methods that change an object's state safely, check their inputs, raise errors when asked to do something impossible, and protect rules that must always hold, like "a bank balance can't go below zero".

quiz:
  - type: mcq
    question: What is the relationship between a class and an object?
    options:
      - They're two words for the same thing
      - A class is a blueprint; an object is one particular thing built from it
