id: u5-methods
title: Methods and State
minutes: 50
objective: |
  Write methods that **query** and **change** an object's state, keep the object valid at all times by checking inputs and **raising exceptions**, have methods call each other through `self`, and avoid the shared-default-list trap.
outcomes:
  - Tell query methods (return information) from command methods (change state)
  - Validate method arguments and raise `ValueError` for impossible requests
  - Describe and protect a class invariant, a rule that is always true for every object
  - Call one method from another with `self.method()`
  - Keep a history inside an object with a list attribute
  - Avoid mutable default arguments such as `items=[]`

sections:
  - heading: An object's state
    body: |
      An object's **state** is the current values of all its attributes. A bank account's state is its owner and balance; a traffic light's state is which colour is lit. Methods are how the outside world **looks at** and **changes** that state.

      Most methods fall into one of two groups:

      - **Queries** answer a question and leave the object unchanged: `account.can_afford(30)`, `rect.area()`. They `return` a value.
      - **Commands** change the object's state: `account.deposit(50)`, `light.next()`. They often return nothing (`None`).

      Keeping the two apart makes code easier to reason about: you can call a query as often as you like without worrying that it changes anything. Python's own types follow this idea: `sorted(lst)` returns a new list and leaves `lst` alone, while `lst.sort()` changes `lst` and returns `None` (Lesson 3.2).

  - heading: Keeping objects valid
    body: |
      Here's an account class with no protection at all:

      ```python
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def withdraw(self, amount):
              self.balance -= amount
      ```

      Nothing stops `withdraw(-500)` (which *adds* money) or withdrawing more than the balance. A rule that should be true of every account at every moment, like "the balance is never negative", is called a **class invariant**. A well-designed class makes its invariants impossible to break through its methods.

      The tool for this is the `raise` statement from Lesson 2.9. When a method is asked to do something impossible, it refuses loudly by raising an exception, *before* changing anything:

      ```python
      def withdraw(self, amount):
          if amount <= 0:
              raise ValueError("Withdrawal must be positive")
          if amount > self.balance:
              raise ValueError("Insufficient funds")
          self.balance -= amount
      ```

      Why raise rather than print a message or return `False`? A printed message is easily missed and the program carries on as if the withdrawal worked. An exception **stops** the normal flow, and the caller can catch it with `try`/`except` if it knows how to recover:

      ```python
      try:
          acct.withdraw(1000)
      except ValueError as err:
          print("Sorry:", err)
      ```

      > **Analogy:** A cash machine doesn't hand out money it doesn't have and then apologise. It checks first and refuses. Methods should do the same: **check, then change**.

      `__init__` should protect invariants too: an account created with a negative balance is broken from birth. Validate constructor arguments the same way.

  - heading: Methods calling methods
    body: |
      Inside a class, one method can use another through `self`. This avoids repeating logic:

      ```python
      class Account:
          ...
          def can_afford(self, amount):
              return 0 < amount <= self.balance

          def withdraw(self, amount):
              if not self.can_afford(amount):
                  raise ValueError("Cannot withdraw that amount")
              self.balance -= amount

          def transfer(self, other, amount):
              self.withdraw(amount)       # raises if impossible
              other.deposit(amount)
      ```

      `transfer` reuses `withdraw`, so all its checks apply for free, and because `withdraw` raises *before* `deposit` runs, a failed transfer leaves both accounts untouched. Note that `self.withdraw(amount)` needs the `self.`: a bare `withdraw(amount)` would look for an ordinary function called `withdraw` and fail with a NameError.

  - heading: Objects with memory
    body: |
      Because attributes persist between calls, objects can remember their past. A list attribute makes a simple **history** or log:

      ```python
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self.balance = 0
              self.history = []

          def deposit(self, amount):
              self.balance += amount
              self.history.append(("deposit", amount))
      ```

      Real banking software works this way: the history is the record of truth, and the balance can be checked against it. You'll use the same idea for undo buttons, game replays and audit logs.

  - heading: The mutable default trap
    body: |
      Default parameter values (Lesson 2.8) are convenient in `__init__`, but there's a famous trap. This looks harmless:

      ```python
      class Playlist:
          def __init__(self, songs=[]):     # DANGER
              self.songs = songs
      ```

      Python creates the default list **once**, when the `def` runs, not each time `__init__` is called. Every playlist made without an argument gets a reference to the **same** list (Lesson 3.4):

      ```python
      a = Playlist()
      b = Playlist()
      a.songs.append("Hey Jude")
      print(b.songs)    # ['Hey Jude']  -- b was changed too!
      ```

      The standard fix is to use `None` as the default and create a fresh list inside:

      ```python
      def __init__(self, songs=None):
          if songs is None:
              songs = []
          self.songs = songs
      ```

      Defaults that are immutable (numbers, strings, `None`, tuples) are always safe. Only mutable defaults (lists, dictionaries, sets) cause this problem.

  - heading: State machines
    body: |
      Some objects are best understood as being in one of a few **states**, with methods that move them between states. A turnstile is *locked* or *unlocked*: inserting a coin unlocks it; pushing through an unlocked turnstile locks it again; pushing a locked one does nothing.

      ```python
      class Turnstile:
          def __init__(self):
              self.state = "locked"

          def coin(self):
              self.state = "unlocked"

          def push(self):
              if self.state == "unlocked":
                  self.state = "locked"
                  return True    # someone went through
              return False
      ```

      This model, a **finite state machine**, describes traffic lights, vending machines, game characters, network connections and text parsers. Drawing the states as circles and the methods as arrows between them is a great way to design a class before coding it. You'll study state machines formally in Unit 15.

examples:
  - title: A protected bank account
    intro: Every method checks before it changes anything.
    code: |
      class Account:
          def __init__(self, owner, balance=0):
              if balance < 0:
                  raise ValueError("Opening balance can't be negative")
              self.owner = owner
              self.balance = balance

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("Deposit must be positive")
              self.balance += amount

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("Withdrawal must be positive")
              if amount > self.balance:
                  raise ValueError("Insufficient funds")
              self.balance -= amount

      acct = Account("Ada", 100)
      acct.deposit(50)
      acct.withdraw(30)
      print(acct.balance)
      try:
          acct.withdraw(500)
      except ValueError as err:
          print("Refused:", err)
      print(acct.balance)
    output: |
      120
      Refused: Insufficient funds
      120
    lines:
      - line: 3-4
        note: "Even the constructor protects the invariant: no account can start negative."
      - line: 9-10
        note: "Check, then change: the error is raised before the balance is touched."
      - line: 15-18
        note: "Two separate checks with clear messages, so the caller knows exactly what went wrong."
      - line: 24-27
        note: "The caller catches the refusal. The balance afterwards proves nothing changed."
  - title: Methods reusing methods
    intro: A transfer built from withdraw and deposit.
    code: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance
              self.history = []

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("Deposit must be positive")
              self.balance += amount
              self.history.append(f"+{amount}")

          def withdraw(self, amount):
              if not 0 < amount <= self.balance:
                  raise ValueError("Cannot withdraw that amount")
              self.balance -= amount
              self.history.append(f"-{amount}")

          def transfer(self, other, amount):
              self.withdraw(amount)
              other.deposit(amount)

      a, b = Account("Ada", 100), Account("Alan")
      a.transfer(b, 40)
      try:
          a.transfer(b, 1000)
      except ValueError as err:
          print("Transfer failed:", err)
      print(a.balance, a.history)
      print(b.balance, b.history)
    output: |
      Transfer failed: Cannot withdraw that amount
      60 ['-40']
      40 ['+40']
    lines:
      - line: 5
        note: "Each account gets its own fresh history list."
      - line: 14
        note: "A chained comparison (Lesson 2.5) checks both rules at once."
      - line: 19-21
        note: "`transfer` calls other methods through `self` and `other`. If `withdraw` raises, `deposit` never runs."
      - line: 24-27
        note: "The failed transfer left no trace in either history."
  - title: The shared default list
    intro: Watch two playlists accidentally share one list, then the fix.
    code: |
      class BadPlaylist:
          def __init__(self, songs=[]):
              self.songs = songs

      class Playlist:
          def __init__(self, songs=None):
              if songs is None:
                  songs = []
              self.songs = songs

      a, b = BadPlaylist(), BadPlaylist()
      a.songs.append("Hey Jude")
      print("Bad:", b.songs, a.songs is b.songs)

      c, d = Playlist(), Playlist()
      c.songs.append("Hey Jude")
      print("Good:", d.songs, c.songs is d.songs)
    output: |
      Bad: ['Hey Jude'] True
      Good: [] False
    lines:
      - line: 2
        note: "The default `[]` is created once, when the class is defined, and reused by every call."
      - line: 6-8
        note: "`None` as a placeholder, replaced by a brand-new list on each call."
      - line: 13
        note: "`is` (Lesson 3.4) confirms both bad playlists hold the very same list object."

playground:
  prompt: |
    Model a traffic light as a state machine. Add a method that returns how many seconds the current colour lasts, or make `next()` keep a count of complete cycles. What should happen if someone sets `light.colour = "purple"` directly?
  code: |
    class TrafficLight:
        ORDER = ["green", "amber", "red"]

        def __init__(self):
            self.colour = "red"
            self.changes = 0

        def next(self):
            i = self.ORDER.index(self.colour)
            self.colour = self.ORDER[(i + 1) % len(self.ORDER)]
            self.changes += 1

        def can_go(self):
            return self.colour == "green"

    light = TrafficLight()
    for _ in range(5):
        light.next()
        print(light.colour, "go" if light.can_go() else "stop")
    print("Changes:", light.changes)

exercises:
  - id: safe-account
    title: A safe bank account
    difficulty: 1
    prompt: |
      Complete the `Account` class so it can never be put into an invalid state:

      - `deposit(amount)` raises `ValueError` if `amount <= 0`; otherwise adds it.
      - `withdraw(amount)` raises `ValueError` if `amount <= 0` **or** `amount` is more than the balance; otherwise subtracts it.

      A refused operation must leave the balance unchanged.
    starter: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def deposit(self, amount):
              self.balance += amount

          def withdraw(self, amount):
              self.balance -= amount
    tests:
      - name: normal use
        code: |
          a = Account("Ada", 100)
          a.deposit(50)
          a.withdraw(30)
          assert a.balance == 120, f"Balance should be 120, got {a.balance}"
          a.withdraw(120)
          assert a.balance == 0, "Withdrawing the exact balance is allowed"
      - name: bad deposits are refused
        code: |
          a = Account("Ada", 100)
          for bad in [0, -5]:
              try:
                  a.deposit(bad)
                  assert False, f"deposit({bad}) should raise ValueError"
              except ValueError:
                  pass
          assert a.balance == 100, "A refused deposit must not change the balance"
      - name: bad withdrawals are refused
        code: |
          a = Account("Ada", 100)
          for bad in [0, -10, 101, 1000]:
              try:
                  a.withdraw(bad)
                  assert False, f"withdraw({bad}) should raise ValueError"
              except ValueError:
                  pass
          assert a.balance == 100, f"A refused withdrawal must not change the balance (it's {a.balance})"
    hints:
      - "At the start of `deposit`, `if amount <= 0: raise ValueError(\"Deposit must be positive\")`."
      - "Do all the checks *before* changing `self.balance`."
    solution: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("Deposit must be positive")
              self.balance += amount

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("Withdrawal must be positive")
              if amount > self.balance:
                  raise ValueError("Insufficient funds")
              self.balance -= amount
    explanation: |
      "Check, then change" keeps the invariant: since every way of altering the balance goes through a method that refuses bad requests, the balance can't go negative. Raising (rather than returning `False`) means the caller can't accidentally ignore a refusal.

  - id: thermostat
    title: A thermostat with limits
    difficulty: 2
    prompt: |
      Write a class `Thermostat`:

      - `Thermostat(low, high)` stores the allowed range as `low` and `high`, and sets `target` to the middle of the range (`(low + high) / 2`). If `low >= high`, raise `ValueError`.
      - `set(temp)` sets the target, but **clamps** it into the range: below `low` becomes `low`, above `high` becomes `high`.
      - `up()` and `down()` change the target by 0.5 (still clamped). They should reuse `set`.
      - `status()` returns `"heating"` if `target` is above `current`, `"cooling"` if below, and `"idle"` if equal, where `current` is an attribute (the room temperature) that starts at `low`.
    starter: |
      class Thermostat:
          def __init__(self, low, high):
              pass
    tests:
      - name: construction
        code: |
          t = Thermostat(16, 24)
          assert (t.low, t.high, t.target, t.current) == (16, 24, 20, 16), f"Got low={t.low}, high={t.high}, target={t.target}, current={t.current}"
          try:
              Thermostat(25, 20)
              assert False, "Thermostat(25, 20) should raise ValueError"
          except ValueError:
              pass
      - name: set clamps
        code: |
          t = Thermostat(16, 24)
          t.set(22)
          assert t.target == 22
          t.set(30)
          assert t.target == 24, f"set(30) should clamp to 24, got {t.target}"
          t.set(-5)
          assert t.target == 16, f"set(-5) should clamp to 16, got {t.target}"
      - name: up and down
        code: |
          t = Thermostat(16, 17)
          t.up(); t.up()
          assert t.target == 17, f"Two ups from 16.5 should stop at 17, got {t.target}"
          t.down(); t.down(); t.down()
          assert t.target == 16, f"Got {t.target}"
      - name: status
        code: |
          t = Thermostat(16, 24)
          assert t.status() == "heating"
          t.current = 25
          assert t.status() == "cooling"
          t.current = 20
          assert t.status() == "idle"
    hints:
      - "In `set`, `self.target = max(self.low, min(temp, self.high))` clamps in one line."
      - "`up(self)` can simply be `self.set(self.target + 0.5)`."
    solution: |
      class Thermostat:
          def __init__(self, low, high):
              if low >= high:
                  raise ValueError("low must be below high")
              self.low = low
              self.high = high
              self.target = (low + high) / 2
              self.current = low

          def set(self, temp):
              self.target = max(self.low, min(temp, self.high))

          def up(self):
              self.set(self.target + 0.5)

          def down(self):
              self.set(self.target - 0.5)

          def status(self):
              if self.target > self.current:
                  return "heating"
              if self.target < self.current:
                  return "cooling"
              return "idle"
    explanation: |
      The invariant here is "low ≤ target ≤ high". Clamping is a different way to protect it from raising: sometimes the sensible response to an out-of-range request is to do the nearest valid thing. Because `up` and `down` go through `set`, the clamping rule is written once and can't be forgotten.

  - id: safe-defaults
    title: Fix the shared list
    difficulty: 2
    prompt: |
      This `Team` class has the mutable default bug: teams created without a `members` argument all share one list. Fix it so each team gets its own list, while still accepting a list when one is given. Then add:

      - `join(name)` adds a member; raise `ValueError` if they're already on the team.
      - `leave(name)` removes a member; raise `ValueError` if they're not on the team.
      - `size()` returns the number of members.
    starter: |
      class Team:
          def __init__(self, name, members=[]):
              self.name = name
              self.members = members
    tests:
      - name: teams don't share lists
        code: |
          a, b = Team("Red"), Team("Blue")
          a.members.append("Ada")
          assert b.members == [], "Each team needs its own members list"
      - name: given lists still work
        code: |
          t = Team("Green", ["Ada", "Alan"])
          assert t.members == ["Ada", "Alan"] and t.size() == 2
      - name: join and leave
        code: |
          t = Team("Red")
          t.join("Ada"); t.join("Alan")
          assert t.members == ["Ada", "Alan"] and t.size() == 2
          try:
              t.join("Ada")
              assert False, "Joining twice should raise ValueError"
          except ValueError:
              pass
          t.leave("Ada")
          assert t.members == ["Alan"]
          try:
              t.leave("Zed")
              assert False, "Leaving when not a member should raise ValueError"
          except ValueError:
              pass
    hints:
      - "Change the default to `members=None`, and inside `__init__`: `if members is None: members = []`."
      - "`join`: `if name in self.members: raise ValueError(...)`, else append."
    solution: |
      class Team:
          def __init__(self, name, members=None):
              if members is None:
                  members = []
              self.name = name
              self.members = members

          def join(self, name):
              if name in self.members:
                  raise ValueError(f"{name} is already on the team")
              self.members.append(name)

          def leave(self, name):
              if name not in self.members:
                  raise ValueError(f"{name} is not on the team")
              self.members.remove(name)

          def size(self):
              return len(self.members)
    explanation: |
      `None` is immutable, so it's a safe default; a fresh list is created each time it's needed. One subtlety remains: when a caller passes a list, the team stores a reference to *their* list, so changes show up in both places. If that matters, store a copy with `list(members)`.

  - id: turnstile
    title: A turnstile state machine
    difficulty: 2
    prompt: |
      Write a `Turnstile` class with:

      - `state`, starting as `"locked"`, and two counters `coins` and `passes`, both starting at 0.
      - `coin()`: always adds 1 to `coins` and sets the state to `"unlocked"` (an extra coin while unlocked is simply kept).
      - `push()`: if unlocked, adds 1 to `passes`, locks again and returns `True`; if locked, returns `False` and changes nothing.
      - `log()` returns a list of every event so far, as strings: `"coin"`, `"pass"`, or `"blocked"` for a push while locked.
    starter: |
      class Turnstile:
          def __init__(self):
              pass
    tests:
      - name: starts locked
        code: |
          t = Turnstile()
          assert (t.state, t.coins, t.passes, t.log()) == ("locked", 0, 0, []), "Start locked with zero counts and an empty log"
      - name: coin then push
        code: |
          t = Turnstile()
          assert t.push() is False and t.state == "locked"
          t.coin()
          assert t.state == "unlocked"
          assert t.push() is True and t.state == "locked"
          assert t.push() is False
          assert (t.coins, t.passes) == (1, 1)
          assert t.log() == ["blocked", "coin", "pass", "blocked"], f"Got {t.log()}"
      - name: extra coins
        code: |
          t = Turnstile()
          t.coin(); t.coin()
          assert t.push() and not t.push(), "Two coins still let only one person through"
          assert (t.coins, t.passes) == (2, 1)
    hints:
      - "Keep a list attribute such as `self.events = []` and append to it in each method; `log()` returns it."
      - "In `push`, branch on `self.state == \"unlocked\"`."
    solution: |
      class Turnstile:
          def __init__(self):
              self.state = "locked"
              self.coins = 0
              self.passes = 0
              self.events = []

          def coin(self):
              self.coins += 1
              self.state = "unlocked"
              self.events.append("coin")

          def push(self):
              if self.state == "unlocked":
                  self.passes += 1
                  self.state = "locked"
                  self.events.append("pass")
                  return True
              self.events.append("blocked")
              return False

          def log(self):
              return list(self.events)
    explanation: |
      Drawn as a diagram, this is two states (locked, unlocked) with arrows labelled `coin` and `push`. `log` returns a **copy** of the event list, so a caller who changes the returned list can't rewrite the turnstile's history: a small but real piece of protection that the next lessons develop further.

  - id: vending-machine
    title: A vending machine
    difficulty: 3
    prompt: |
      Write a `VendingMachine` class. Prices are in pence (whole numbers) to avoid float problems.

      - `VendingMachine(prices)` takes a dictionary like `{"crisps": 80, "water": 100}`. It stores a **copy** of it as `prices`, sets `stock` to a dictionary with 5 of each item, and `credit` to 0.
      - `insert(coin)` adds a coin to the credit. Only 10, 20, 50, 100 and 200 are accepted; anything else raises `ValueError`.
      - `select(item)`:
        - raises `KeyError` if the item isn't sold here,
        - raises `ValueError` if it's out of stock, or if the credit is less than the price.
        - Otherwise it reduces the stock by 1, works out the change (credit minus price), resets credit to 0, and returns the change.
      - `refund()` returns the current credit and resets it to 0.
    starter: |
      class VendingMachine:
          def __init__(self, prices):
              pass
    tests:
      - name: setup
        code: |
          prices = {"crisps": 80, "water": 100}
          m = VendingMachine(prices)
          assert m.prices == prices and m.stock == {"crisps": 5, "water": 5} and m.credit == 0
          prices["crisps"] = 1
          assert m.prices["crisps"] == 80, "Store a copy of the prices, so outside changes don't affect the machine"
      - name: inserting coins
        code: |
          m = VendingMachine({"water": 100})
          m.insert(50); m.insert(20); m.insert(10)
          assert m.credit == 80
          for bad in [1, 5, 25, 500]:
              try:
                  m.insert(bad)
                  assert False, f"insert({bad}) should raise ValueError"
              except ValueError:
                  pass
          assert m.credit == 80
      - name: buying
        code: |
          m = VendingMachine({"crisps": 80, "water": 100})
          m.insert(100)
          assert m.select("crisps") == 20, "Change for crisps from 100 should be 20"
          assert m.credit == 0 and m.stock["crisps"] == 4
          m.insert(50)
          try:
              m.select("water")
              assert False, "Not enough credit should raise ValueError"
          except ValueError:
              pass
          assert m.credit == 50, "A failed purchase keeps the credit"
          try:
              m.select("chocolate")
              assert False, "Unknown items should raise KeyError"
          except KeyError:
              pass
          assert m.refund() == 50 and m.credit == 0
      - name: out of stock
        code: |
          m = VendingMachine({"water": 100})
          for _ in range(5):
              m.insert(100)
              assert m.select("water") == 0
          m.insert(200)
          try:
              m.select("water")
              assert False, "Selling a sold-out item should raise ValueError"
          except ValueError:
              pass
          assert m.credit == 200 and m.stock["water"] == 0
    hints:
      - "`self.prices = dict(prices)` copies; `self.stock = {item: 5 for item in prices}` builds the stock."
      - "In `select`, do all three checks (known item, in stock, enough credit) before changing anything."
      - "`refund`: save the credit in a local variable, set `self.credit = 0`, return the saved value."
    solution: |
      class VendingMachine:
          COINS = [10, 20, 50, 100, 200]

          def __init__(self, prices):
              self.prices = dict(prices)
              self.stock = {item: 5 for item in prices}
              self.credit = 0

          def insert(self, coin):
              if coin not in self.COINS:
                  raise ValueError(f"Coin not accepted: {coin}")
              self.credit += coin

          def select(self, item):
              if item not in self.prices:
                  raise KeyError(item)
              if self.stock[item] == 0:
                  raise ValueError(f"{item} is sold out")
              price = self.prices[item]
              if self.credit < price:
                  raise ValueError(f"{item} costs {price}, credit is {self.credit}")
              self.stock[item] -= 1
              change = self.credit - price
              self.credit = 0
              return change

          def refund(self):
              amount = self.credit
              self.credit = 0
              return amount
    explanation: |
      Each method guards the machine's invariants: credit is made only of valid coins, stock never goes negative, and a purchase either happens completely or not at all. Different exceptions describe different problems (`KeyError` for "no such item", `ValueError` for "can't do that right now"), so a caller can react differently. `COINS` is a **class attribute**, shared by every machine; Lesson 5.4 covers those.

commonMistakes:
  - title: Changing state before checking
    explanation: |
      If a method subtracts first and checks afterwards, a refused request can leave the object half-changed. Do every check first, then make the changes.
  - title: Printing an error instead of raising
    explanation: |
      `print("Insufficient funds")` lets the program carry on as if nothing went wrong. `raise ValueError("Insufficient funds")` stops it, and lets the caller decide what to do.
  - title: Using a mutable default argument
    explanation: |
      `def __init__(self, items=[])` shares one list between every object made without an argument. Use `items=None` and create a new list inside.
  - title: Calling a method without self
    explanation: |
      Inside a class, `withdraw(10)` looks for an ordinary function and raises NameError. Use `self.withdraw(10)` to call a method on the same object.
  - title: Returning internal lists directly
    explanation: |
      A method that returns `self.history` hands out the object's own list, which callers can then change. Return a copy (`list(self.history)`) when the data must stay protected.

summary:
  - "An object's **state** is its attributes. **Query** methods return information; **command** methods change state."
  - "A **class invariant** is a rule that's always true for every object. Methods protect it by checking first and **raising** an exception (usually `ValueError`) for impossible requests."
  - "Methods call each other with `self.method()`, which avoids repeating checks and logic."
  - "List attributes give objects a memory, such as a history or log."
  - "Never use a mutable default like `[]`; use `None` and create the list inside the method."
  - "Many objects are **state machines**: a few states, with methods moving between them."
next: |
  Your objects behave well, but they still feel second-class: `print(acct)` shows a memory address, `==` says two identical points are different, and `sorted()` refuses to sort them. In **Lesson 5.3** you'll write **special methods** that let your objects print, compare, sort and even use `+` and `len()` just like Python's built-in types.

quiz:
  - type: mcq
    question: Which of these methods is a query rather than a command?
    options: ["account.deposit(50)", "light.next()", "account.can_afford(30)", "playlist.add(song)"]
    answer: 2
    explanation: "`can_afford` answers a question without changing the account."
  - type: mcq
    question: What is a class invariant?
    options:
      - A variable that never changes
      - A rule that's true for every object of the class at all times, such as "balance is never negative"
      - A method that can't be overridden
      - The class's name
    answer: 1
    explanation: Invariants are guarantees the class makes about its objects; methods must preserve them.
  - type: mcq
    question: "Why should `withdraw` raise `ValueError` rather than print \"Insufficient funds\"?"
    options:
      - Printing is slower
      - An exception stops the normal flow, so the caller can't accidentally carry on as if it worked
      - "`print` doesn't work inside methods"
      - ValueError adds the money back automatically
    answer: 1
    explanation: A printed message can be missed; an exception forces the caller to deal with the failure.
  - type: mcq
    question: "With `def __init__(self, songs=[])`, two playlists `a = Playlist()` and `b = Playlist()` are created, and a song is appended to `a.songs`. What is `b.songs`?"
    options: ["[]", "A list containing the song", "None", "It raises an error"]
    answer: 1
    explanation: The default list is created once and shared by both objects.
  - type: mcq
    question: "Inside a method, how do you call another method `deposit` on the same object?"
    options: ["deposit(10)", "self.deposit(10)", "Account.deposit(10)", "this.deposit(10)"]
    answer: 1
    explanation: Methods are reached through the object, which inside a method is `self`.
  - type: mcq
    question: In a well-written method, when should input checks happen?
    options:
      - After changing the state, so you can undo it
      - Before changing any state
      - Only in `__init__`
      - Checks aren't needed if the caller is careful
    answer: 1
    explanation: Check, then change, so a refused request leaves the object exactly as it was.
  - type: code
    question: |
      Write a class `Counter` with an attribute `value` starting at 0 and a method `increase(step=1)` that adds `step` to `value`, raising `ValueError` if `step` is not positive.
    starter: |
      class Counter:
          pass
    tests:
      - name: Counter works
        code: |
          c = Counter()
          assert c.value == 0
          c.increase(); c.increase(5)
          assert c.value == 6, f"Got {c.value}"
          for bad in [0, -1]:
              try:
                  c.increase(bad)
                  assert False, f"increase({bad}) should raise ValueError"
              except ValueError:
                  pass
          assert c.value == 6
    solution: |
      class Counter:
          def __init__(self):
              self.value = 0

          def increase(self, step=1):
              if step <= 0:
                  raise ValueError("step must be positive")
              self.value += step
