id: u5-special-methods
title: Special Methods
minutes: 50
objective: |
  Make your own objects behave like Python's built-in types by writing **special methods** (dunder methods): `__str__` and `__repr__` for printing, `__eq__` and `__lt__` for comparing and sorting, `__add__` and friends for operators, and `__len__`, `__contains__` and `__getitem__` for container behaviour.
outcomes:
  - Explain how Python turns operators and built-in functions into special method calls
  - Write `__str__` for users and `__repr__` for programmers
  - Make objects compare equal by value with `__eq__`
  - Make objects sortable with `__lt__`, and use `sorted`, `min` and `max` on them
  - Overload arithmetic operators such as `+` and `*`
  - Give a container class `len()`, `in`, indexing and `for` loop support

sections:
  - heading: Python's secret protocol
    body: |
      Here's something surprising: nearly every operator and built-in function in Python is really a method call in disguise.

      | You write | Python actually calls |
      |---|---|
      | `print(x)`, `str(x)` | `x.__str__()` |
      | `a == b` | `a.__eq__(b)` |
      | `a < b` | `a.__lt__(b)` |
      | `a + b` | `a.__add__(b)` |
      | `len(x)` | `x.__len__()` |
      | `item in x` | `x.__contains__(item)` |
      | `x[i]` | `x.__getitem__(i)` |

      These methods with double underscores on both sides are called **special methods** or **dunder methods** ("double underscore"). You've already written one: `__init__`. Python's built-in types define them all, which is why `3 + 4` and `"ab" + "cd"` both work: `int` and `str` each have their own `__add__`.

      This means **your** classes can join in. Define `__add__` and your objects can be added with `+`; define `__lt__` and `sorted()` can sort them. Making your types work with the language's existing tools is one of the most satisfying parts of OOP.

      > **Analogy:** The special methods are like standard sockets in a wall. Any appliance with the right plug works in any socket. Python's `print`, `sorted` and `+` are the sockets; special methods are the plug on your class.

  - heading: Printing with __str__ and __repr__
    body: |
      By default, printing an object shows `<__main__.Point object at 0x7f...>`, which is useless. Two special methods fix that:

      - `__str__` returns the **friendly**, human-readable form, used by `print()`, `str()` and f-strings.
      - `__repr__` returns the **unambiguous**, programmer's form, ideally looking like the code that would recreate the object. It's used when you inspect a value, when an object appears **inside a list** that's printed, and as a fallback if there's no `__str__`.

      ```python
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __str__(self):
              return f"({self.x}, {self.y})"

          def __repr__(self):
              return f"Point({self.x}, {self.y})"

      p = Point(3, 4)
      print(p)           # (3, 4)
      print([p, p])      # [Point(3, 4), Point(3, 4)]
      ```

      Both must **return** a string, not print one. If you only write one, write `__repr__`: it's used everywhere `__str__` is missing, and it makes debugging much easier.

  - heading: Equality with __eq__
    body: |
      By default, `==` on your objects asks "are these the **same object**?", like `is`. So two points with the same coordinates are *not* equal:

      ```python
      Point(3, 4) == Point(3, 4)    # False, by default
      ```

      For most value-like classes (points, fractions, money, dates), you want **value equality**: equal if their data is equal. Define `__eq__`:

      ```python
      def __eq__(self, other):
          if not isinstance(other, Point):
              return NotImplemented
          return self.x == other.x and self.y == other.y
      ```

      `isinstance(other, Point)` checks that `other` is a `Point` at all. If it isn't, returning the special value `NotImplemented` tells Python "I don't know how to compare with that", and Python then falls back sensibly (so `Point(1, 2) == "hello"` is simply `False` rather than crashing with an AttributeError). `!=` works automatically once `__eq__` exists.

      > **Watch out:** Defining `__eq__` makes your objects **unhashable**, so they can no longer be set members or dictionary keys (Lesson 3.6 explained why keys must have a stable hash). If you need that, also define `__hash__`, for example `return hash((self.x, self.y))`, and treat the object as immutable. Lesson 5.8 shows an easier way.

  - heading: Ordering and sorting with __lt__
    body: |
      `sorted()`, `min()`, `max()` and `list.sort()` only need one thing: a way to ask "is `a` less than `b`?". That's `__lt__` ("less than"):

      ```python
      class Card:
          RANKS = "23456789TJQKA"

          def __init__(self, rank, suit):
              self.rank = rank
              self.suit = suit

          def __lt__(self, other):
              return self.RANKS.index(self.rank) < self.RANKS.index(other.rank)

      hand = [Card("K", "♠"), Card("3", "♥"), Card("A", "♦")]
      print([c.rank for c in sorted(hand)])    # ['3', 'K', 'A']
      ```

      This gives the class a **natural order**. You can still sort by something else with `key=` (Lesson 3.5), which always wins over the natural order. Python can also work out `>` from `__lt__` by swapping the sides, but not `<=` or `>=`; define `__le__`, `__gt__` and `__ge__` too if you need them (or see Lesson 5.8 for a shortcut).

      Recall from Lesson 4.4 that a sort only works if the comparison is **consistent**: if `a < b` and `b < c`, then `a < c`. Your `__lt__` must follow those rules, or sorting gives nonsense.

  - heading: Arithmetic operators
    body: |
      Defining `__add__`, `__sub__`, `__mul__` and so on lets objects use `+`, `-` and `*`. This is called **operator overloading**: the same symbol means different things for different types.

      ```python
      class Vector:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __add__(self, other):
              return Vector(self.x + other.x, self.y + other.y)

          def __mul__(self, k):
              return Vector(self.x * k, self.y * k)
      ```

      Now `Vector(1, 2) + Vector(3, 4)` is `Vector(4, 6)`, and `Vector(1, 2) * 3` is `Vector(3, 6)`. Notice that these methods **return a new object** and leave both operands unchanged, just as `3 + 4` doesn't change 3. That's what anyone using `+` expects.

      Only overload an operator when its meaning is obvious. `+` for adding vectors or money is natural; `+` meaning "fire the employee" would be baffling.

  - heading: Container behaviour
    body: |
      If your class holds a collection of things, a few more special methods make it feel like a built-in container:

      ```python
      class Playlist:
          def __init__(self):
              self.songs = []

          def __len__(self):
              return len(self.songs)

          def __contains__(self, song):
              return song in self.songs

          def __getitem__(self, index):
              return self.songs[index]
      ```

      Now `len(p)`, `"Hey Jude" in p`, `p[0]`, `p[-1]` and even `p[1:3]` all work, because each simply passes the request on to the list inside, a pattern called **delegation**. As a bonus, defining `__getitem__` with integer indexes is enough for `for song in p:` to work: Python asks for `p[0]`, `p[1]`, ... until it gets an `IndexError`.

      > **Key idea:** You don't need to memorise every special method. Remember the principle: **for any built-in operation, there's a dunder method behind it**, and you can look up its name when you need it.

examples:
  - title: __str__ versus __repr__
    intro: Friendly for users, precise for programmers.
    code: |
      class Fraction:
          def __init__(self, top, bottom):
              self.top = top
              self.bottom = bottom

          def __str__(self):
              return f"{self.top}/{self.bottom}"

          def __repr__(self):
              return f"Fraction({self.top}, {self.bottom})"

      half = Fraction(1, 2)
      print(half)
      print(f"Add {half} of a cup")
      print([half, Fraction(3, 4)])
      print(repr(half))
    output: |
      1/2
      Add 1/2 of a cup
      [Fraction(1, 2), Fraction(3, 4)]
      Fraction(1, 2)
    lines:
      - line: 6-7
        note: "`__str__` returns (not prints) the friendly text."
      - line: 9-10
        note: "`__repr__` looks like the code that creates the object."
      - line: 13-14
        note: "`print` and f-strings use `__str__`."
      - line: 15
        note: "A printed list shows each item's `__repr__`, so there's no confusion between `1/2` and the string `\"1/2\"`."
  - title: Equality and sorting
    intro: Value equality and a natural order for playing cards.
    code: |
      class Card:
          RANKS = "23456789TJQKA"

          def __init__(self, rank, suit):
              self.rank = rank
              self.suit = suit

          def __repr__(self):
              return self.rank + self.suit

          def __eq__(self, other):
              if not isinstance(other, Card):
                  return NotImplemented
              return self.rank == other.rank and self.suit == other.suit

          def __lt__(self, other):
              return self.RANKS.index(self.rank) < self.RANKS.index(other.rank)

      hand = [Card("K", "S"), Card("3", "H"), Card("A", "D"), Card("9", "C")]
      print(sorted(hand))
      print(max(hand), min(hand))
      print(Card("Q", "H") == Card("Q", "H"), Card("Q", "H") == "QH")
      print(Card("A", "D") in hand)
    output: |
      [3H, 9C, KS, AD]
      AD 3H
      True False
      True
    lines:
      - line: 11-14
        note: "Two cards are equal if rank and suit match. Comparing with a non-card returns `NotImplemented`, and Python decides `False`."
      - line: 16-17
        note: "Rank order is position in the `RANKS` string, so `\"T\"` (ten) sorts after `\"9\"`."
      - line: 20-21
        note: "`sorted`, `max` and `min` all use `__lt__`."
      - line: 23
        note: "`in` on a list uses `==`, so it needs `__eq__` to find an equal card that's a different object."
  - title: Operators and containers
    intro: Vectors you can add, and a playlist that acts like a list.
    code: |
      class Vector:
          def __init__(self, x, y):
              self.x, self.y = x, y

          def __add__(self, other):
              return Vector(self.x + other.x, self.y + other.y)

          def __mul__(self, k):
              return Vector(self.x * k, self.y * k)

          def __repr__(self):
              return f"Vector({self.x}, {self.y})"

      class Playlist:
          def __init__(self, songs):
              self.songs = list(songs)

          def __len__(self):
              return len(self.songs)

          def __getitem__(self, i):
              return self.songs[i]

      print(Vector(1, 2) + Vector(3, 4), Vector(1, 2) * 3)
      p = Playlist(["Respect", "Hey Jude", "Imagine"])
      print(len(p), p[0], p[-1], "Imagine" in p)
      for song in p:
          print("-", song)
    output: |
      Vector(4, 6) Vector(3, 6)
      3 Respect Imagine True
      - Respect
      - Hey Jude
      - Imagine
    lines:
      - line: 5-9
        note: "Each operator returns a brand-new `Vector`; the originals are unchanged."
      - line: 18-22
        note: "Delegation: `len` and indexing are handed on to the list inside."
      - line: 26
        note: "There's no `__contains__`, so `in` falls back to looping with `__getitem__`."
      - line: 27-28
        note: "`for` works too, again thanks to `__getitem__`."

playground:
  prompt: |
    Add `__sub__` and `__eq__` to `Money`, and an `__lt__` so a list of amounts can be sorted. What should happen if someone adds `Money` in pounds to `Money` in euros?
  code: |
    class Money:
        def __init__(self, pence, currency="GBP"):
            self.pence = pence
            self.currency = currency

        def __add__(self, other):
            return Money(self.pence + other.pence, self.currency)

        def __str__(self):
            return f"{self.pence // 100}.{self.pence % 100:02d} {self.currency}"

        def __repr__(self):
            return f"Money({self.pence}, {self.currency!r})"

    lunch = Money(850)
    coffee = Money(295)
    print(lunch + coffee)
    print([lunch, coffee])

exercises:
  - id: time-str
    title: A printable time
    difficulty: 1
    prompt: |
      Complete the `Clock` class (hours 0-23 and minutes 0-59) with:

      - `__str__` returning a 24-hour time with two digits each: `Clock(9, 5)` prints as `09:05`.
      - `__repr__` returning `Clock(9, 5)`.
    starter: |
      class Clock:
          def __init__(self, hours, minutes):
              self.hours = hours
              self.minutes = minutes
    tests:
      - name: __str__
        code: |
          assert str(Clock(9, 5)) == "09:05", f"Got {str(Clock(9, 5))!r}"
          assert str(Clock(23, 59)) == "23:59"
          assert f"{Clock(0, 0)}" == "00:00"
      - name: __repr__
        code: |
          assert repr(Clock(9, 5)) == "Clock(9, 5)", f"Got {repr(Clock(9, 5))!r}"
          assert str([Clock(12, 30)]) == "[Clock(12, 30)]", "Lists show their items' __repr__"
    hints:
      - "The format spec `:02d` pads a number to two digits (Lesson 2.4)."
      - "Both methods must `return` the string, not print it."
    solution: |
      class Clock:
          def __init__(self, hours, minutes):
              self.hours = hours
              self.minutes = minutes

          def __str__(self):
              return f"{self.hours:02d}:{self.minutes:02d}"

          def __repr__(self):
              return f"Clock({self.hours}, {self.minutes})"
    explanation: |
      `__str__` gives the form a person wants to read; `__repr__` gives the form a programmer needs when debugging, which is why lists use it. Returning instead of printing lets the string be used anywhere: in f-strings, files and other strings.

  - id: vector-ops
    title: Vector arithmetic
    difficulty: 2
    prompt: |
      Complete the `Vector` class with:

      - `__eq__`: equal when both `x` and `y` match; return `NotImplemented` for non-vectors.
      - `__add__` and `__sub__`: return a new vector.
      - `__mul__(k)`: multiply both parts by the number `k`, returning a new vector.
      - `__abs__`: the length √(x² + y²), so `abs(Vector(3, 4))` is `5.0`.

      None of these should change the original vectors.
    starter: |
      class Vector:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __repr__(self):
              return f"Vector({self.x}, {self.y})"
    tests:
      - name: equality
        code: |
          assert Vector(1, 2) == Vector(1, 2), "Vectors with the same parts should be equal"
          assert Vector(1, 2) != Vector(2, 1)
          assert (Vector(1, 2) == "Vector(1, 2)") is False, "Comparing with a non-vector should be False, not an error"
      - name: add and subtract
        code: |
          a, b = Vector(1, 2), Vector(3, 5)
          assert a + b == Vector(4, 7), f"Got {a + b}"
          assert b - a == Vector(2, 3), f"Got {b - a}"
          assert a == Vector(1, 2) and b == Vector(3, 5), "The originals mustn't change"
      - name: multiply and abs
        code: |
          assert Vector(1, -2) * 3 == Vector(3, -6)
          assert abs(Vector(3, 4)) == 5.0, f"Got {abs(Vector(3, 4))}"
    hints:
      - "`__eq__`: `if not isinstance(other, Vector): return NotImplemented`, then compare both parts."
      - "`__add__(self, other)` returns `Vector(self.x + other.x, self.y + other.y)`."
    solution: |
      class Vector:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __repr__(self):
              return f"Vector({self.x}, {self.y})"

          def __eq__(self, other):
              if not isinstance(other, Vector):
                  return NotImplemented
              return self.x == other.x and self.y == other.y

          def __add__(self, other):
              return Vector(self.x + other.x, self.y + other.y)

          def __sub__(self, other):
              return Vector(self.x - other.x, self.y - other.y)

          def __mul__(self, k):
              return Vector(self.x * k, self.y * k)

          def __abs__(self):
              return (self.x ** 2 + self.y ** 2) ** 0.5
    explanation: |
      With these methods, vector code reads like the maths it represents: `position + velocity * t`. The tests could only check results with `==` because you wrote `__eq__`: without it, `a + b == Vector(4, 7)` compares identities and is always `False`. (Note that `3 * v` still fails; that needs `__rmul__`, the "reflected" version, which Python tries when the left operand doesn't know what to do.)

  - id: sortable-cards
    title: Sort a hand of cards
    difficulty: 2
    prompt: |
      Complete `Card` so that cards sort by rank, using the order in `RANKS` (2 lowest, ace highest), and **by suit** when ranks are equal, using the order in `SUITS`. Write `__eq__` (rank and suit equal) and `__lt__`.

      Then write a function `high_card(hand)` that returns the highest card in a list, using `max`.

      ```python
      sorted([Card("K", "H"), Card("2", "S"), Card("K", "C")])
      # [2S, KC, KH]   (C before H in SUITS)
      ```
    starter: |
      class Card:
          RANKS = "23456789TJQKA"
          SUITS = "CDHS"

          def __init__(self, rank, suit):
              self.rank = rank
              self.suit = suit

          def __repr__(self):
              return self.rank + self.suit


      def high_card(hand):
          pass
    tests:
      - name: equality
        code: |
          assert Card("Q", "H") == Card("Q", "H")
          assert Card("Q", "H") != Card("Q", "S")
      - name: sort by rank then suit
        code: |
          hand = [Card("K", "H"), Card("2", "S"), Card("K", "C"), Card("T", "D"), Card("A", "C"), Card("9", "S")]
          got = sorted(hand)
          assert repr(got) == "[2S, 9S, TD, KC, KH, AC]", f"Got {got}"
          assert Card("9", "S") < Card("T", "C"), "Ten (T) beats nine"
          assert not (Card("K", "H") < Card("K", "H")), "A card isn't less than itself"
      - name: high_card
        code: |
          assert repr(high_card([Card("3", "S"), Card("J", "D"), Card("J", "S"), Card("5", "H")])) == "JS"
    hints:
      - "A tuple compares item by item (Lesson 3.5). Build `(rank position, suit position)` for each card and compare the tuples."
      - "`self.RANKS.index(self.rank)` gives the rank's position."
      - "`high_card` can be one line: `return max(hand)`, since `max` uses `__lt__`."
    solution: |
      class Card:
          RANKS = "23456789TJQKA"
          SUITS = "CDHS"

          def __init__(self, rank, suit):
              self.rank = rank
              self.suit = suit

          def __repr__(self):
              return self.rank + self.suit

          def order(self):
              return (self.RANKS.index(self.rank), self.SUITS.index(self.suit))

          def __eq__(self, other):
              if not isinstance(other, Card):
                  return NotImplemented
              return self.rank == other.rank and self.suit == other.suit

          def __lt__(self, other):
              return self.order() < other.order()


      def high_card(hand):
          return max(hand)
    explanation: |
      The helper method `order` turns a card into a tuple of positions, and tuple comparison does the "rank first, then suit" logic for free, the same trick as the tuple keys in Lesson 3.5. With `__lt__` in place, every sorting and min/max tool in Python works on cards without extra code.

  - id: fraction-math
    title: Exact fractions
    difficulty: 3
    prompt: |
      Floats can't represent 1/3 exactly (Lesson 2.3). Build a `Fraction` class that can:

      - `Fraction(top, bottom)` stores the fraction **in lowest terms** with a **positive bottom**: `Fraction(2, 4)` is stored as top 1, bottom 2, and `Fraction(1, -3)` as -1 over 3. Raise `ZeroDivisionError` if `bottom` is 0. Use the provided `gcd` function.
      - `__str__`: `"1/2"`, or just `"3"` when the bottom is 1. `__repr__`: `"Fraction(1, 2)"`.
      - `__eq__`, `__lt__`.
      - `__add__`, `__sub__` and `__mul__` with another `Fraction`, returning a new fraction (automatically in lowest terms).

      ```python
      print(Fraction(1, 3) + Fraction(1, 6))    # 1/2
      print(Fraction(3, 4) * Fraction(4, 3))    # 1
      ```
    starter: |
      def gcd(a, b):
          """Greatest common divisor (Euclid's algorithm)."""
          a, b = abs(a), abs(b)
          while b:
              a, b = b, a % b
          return a


      class Fraction:
          def __init__(self, top, bottom):
              self.top = top
              self.bottom = bottom
    tests:
      - name: lowest terms
        code: |
          f = Fraction(2, 4)
          assert (f.top, f.bottom) == (1, 2), f"Fraction(2, 4) should store 1/2, got {f.top}/{f.bottom}"
          g = Fraction(1, -3)
          assert (g.top, g.bottom) == (-1, 3), f"The bottom should be positive, got {g.top}/{g.bottom}"
          h = Fraction(0, 5)
          assert (h.top, h.bottom) == (0, 1), f"Zero should be stored as 0/1, got {h.top}/{h.bottom}"
          try:
              Fraction(1, 0)
              assert False, "A zero bottom should raise ZeroDivisionError"
          except ZeroDivisionError:
              pass
      - name: printing
        code: |
          assert str(Fraction(6, 8)) == "3/4" and repr(Fraction(6, 8)) == "Fraction(3, 4)"
          assert str(Fraction(6, 3)) == "2", "Whole numbers print without /1"
      - name: comparing
        code: |
          assert Fraction(1, 2) == Fraction(3, 6)
          assert Fraction(1, 3) < Fraction(1, 2) and not Fraction(1, 2) < Fraction(1, 3)
          assert Fraction(-1, 2) < Fraction(1, 4)
          assert sorted([Fraction(3, 4), Fraction(1, 8), Fraction(1, 2)]) == [Fraction(1, 8), Fraction(1, 2), Fraction(3, 4)]
      - name: arithmetic
        code: |
          assert Fraction(1, 3) + Fraction(1, 6) == Fraction(1, 2), f"Got {Fraction(1, 3) + Fraction(1, 6)}"
          assert str(Fraction(3, 4) * Fraction(4, 3)) == "1"
          assert Fraction(1, 2) - Fraction(3, 4) == Fraction(-1, 4)
          total = Fraction(0, 1)
          for n in range(1, 11):
              total = total + Fraction(1, n * (n + 1))
          assert total == Fraction(10, 11), f"1/2 + 1/6 + ... + 1/110 should be exactly 10/11, got {total}"
    hints:
      - "In `__init__`: raise for a zero bottom; if `bottom < 0`, flip both signs; then divide both by `g = gcd(top, bottom)`. Use `//` so they stay ints."
      - "a/b + c/d = (a·d + c·b)/(b·d), and the constructor will reduce it for you."
      - "a/b < c/d exactly when a·d < c·b (bottoms are positive, so the direction doesn't flip). Because fractions are always stored reduced, `__eq__` can compare tops and bottoms directly."
    solution: |
      def gcd(a, b):
          """Greatest common divisor (Euclid's algorithm)."""
          a, b = abs(a), abs(b)
          while b:
              a, b = b, a % b
          return a


      class Fraction:
          def __init__(self, top, bottom):
              if bottom == 0:
                  raise ZeroDivisionError("bottom can't be zero")
              if bottom < 0:
                  top, bottom = -top, -bottom
              g = gcd(top, bottom)
              self.top = top // g
              self.bottom = bottom // g

          def __str__(self):
              if self.bottom == 1:
                  return str(self.top)
              return f"{self.top}/{self.bottom}"

          def __repr__(self):
              return f"Fraction({self.top}, {self.bottom})"

          def __eq__(self, other):
              if not isinstance(other, Fraction):
                  return NotImplemented
              return self.top == other.top and self.bottom == other.bottom

          def __lt__(self, other):
              return self.top * other.bottom < other.top * self.bottom

          def __add__(self, other):
              return Fraction(self.top * other.bottom + other.top * self.bottom, self.bottom * other.bottom)

          def __sub__(self, other):
              return Fraction(self.top * other.bottom - other.top * self.bottom, self.bottom * other.bottom)

          def __mul__(self, other):
              return Fraction(self.top * other.top, self.bottom * other.bottom)
    explanation: |
      Normalising in `__init__` (lowest terms, positive bottom) is an **invariant** that makes everything else simpler: equality becomes a direct comparison, and every arithmetic method gets reduction for free because it builds its result with the constructor. The last test adds ten fractions and gets *exactly* 10/11, something floats can't do. Python's standard library has a `fractions.Fraction` class that works just like this one.

  - id: container-deck
    title: A deck that acts like a list
    difficulty: 2
    prompt: |
      Complete the `Deck` class, which holds a list of card strings like `"AS"` in `self.cards`:

      - `__len__` returns the number of cards.
      - `__getitem__(i)` returns `self.cards[i]` (so indexing, slicing and `for` loops work).
      - `__contains__(card)` returns whether the card is in the deck.
      - `deal(n)` removes the **top** `n` cards (the start of the list) and returns them as a list; raise `ValueError` if there aren't enough.
      - `__str__` returns `"Deck of N cards"`.
    starter: |
      class Deck:
          def __init__(self, cards):
              self.cards = list(cards)
    tests:
      - name: len, indexing and in
        code: |
          d = Deck(["AS", "KH", "3C", "9D"])
          assert len(d) == 4, "len(deck) should be 4"
          assert d[0] == "AS" and d[-1] == "9D" and d[1:3] == ["KH", "3C"]
          assert "3C" in d and "2S" not in d
          assert [c for c in d] == ["AS", "KH", "3C", "9D"], "for loops should work"
      - name: deal
        code: |
          d = Deck(["AS", "KH", "3C", "9D"])
          assert d.deal(3) == ["AS", "KH", "3C"]
          assert len(d) == 1 and d[0] == "9D"
          try:
              d.deal(2)
              assert False, "Dealing more cards than remain should raise ValueError"
          except ValueError:
              pass
          assert len(d) == 1, "A refused deal mustn't remove cards"
      - name: __str__
        code: |
          assert str(Deck(["AS", "KH"])) == "Deck of 2 cards"
    hints:
      - "Each special method can delegate to the list: `return len(self.cards)`, `return self.cards[i]`, `return card in self.cards`."
      - "`deal`: check `n > len(self.cards)` first. Then `hand = self.cards[:n]` and `self.cards = self.cards[n:]`."
    solution: |
      class Deck:
          def __init__(self, cards):
              self.cards = list(cards)

          def __len__(self):
              return len(self.cards)

          def __getitem__(self, i):
              return self.cards[i]

          def __contains__(self, card):
              return card in self.cards

          def deal(self, n):
              if n > len(self.cards):
                  raise ValueError(f"Only {len(self.cards)} cards left")
              hand = self.cards[:n]
              self.cards = self.cards[n:]
              return hand

          def __str__(self):
              return f"Deck of {len(self.cards)} cards"
    explanation: |
      Delegation makes `Deck` feel like a list for reading, but unlike a raw list it controls how cards *leave*: only through `deal`, which checks there are enough. That combination, familiar on the outside and controlled on the inside, is what good classes aim for.

commonMistakes:
  - title: Printing inside __str__ or __repr__
    explanation: |
      These methods must `return` a string. If `__str__` prints and returns nothing, `print(obj)` fails with `TypeError: __str__ returned non-string (type NoneType)`.
  - title: Expecting == to compare values without __eq__
    explanation: |
      Without `__eq__`, `==` compares identity, so two objects with identical data are "not equal", and `in` on a list won't find an equal copy.
  - title: Forgetting the isinstance check in __eq__
    explanation: |
      Comparing with a different type, such as `point == None`, then crashes with AttributeError. Check `isinstance` and return `NotImplemented` for other types.
  - title: Operators that change the original
    explanation: |
      `__add__` should return a new object, not modify `self`. `a + b` changing `a` would surprise everyone using your class.
  - title: Defining __eq__ and then using objects in a set
    explanation: |
      A class with `__eq__` but no `__hash__` is unhashable, so `{obj}` or `d[obj]` raises `TypeError: unhashable type`. Add `__hash__` (based on the same fields as `__eq__`) if objects must be keys.

summary:
  - "Operators and built-ins call **special (dunder) methods**: `print` → `__str__`, `==` → `__eq__`, `<` → `__lt__`, `+` → `__add__`, `len` → `__len__`, `in` → `__contains__`, `x[i]` → `__getitem__`."
  - "`__str__` is the friendly form; `__repr__` is the precise, code-like form used in lists and for debugging."
  - "`__eq__` gives **value equality**; return `NotImplemented` for unrelated types. Defining it removes hashability unless you add `__hash__`."
  - "`__lt__` gives a natural order, so `sorted`, `min` and `max` work."
  - "**Operator overloading** should return new objects and only be used when the meaning is obvious."
  - "**Delegating** `__len__` and `__getitem__` to an inner list makes a class act like a container, including in `for` loops."
next: |
  Your classes now fit smoothly into Python. But anyone can still reach in and write `acct.balance = -1000000`, bypassing all your careful checks. **Lesson 5.4** is about **encapsulation**: hiding an object's internals, controlling access with **properties**, and sharing data across all objects with **class attributes**.

quiz:
  - type: mcq
    question: "What does Python actually call when you write `a + b`?"
    options: ["add(a, b)", "a.__add__(b)", "b.__add__(a)", "a.plus(b)"]
    answer: 1
    explanation: Operators are translated into special method calls on the left operand.
  - type: mcq
    question: "A list of your objects prints as `[<__main__.Point object at 0x...>]` even though you defined `__str__`. Why?"
    options:
      - "`__str__` has a typo"
      - Lists display their items using `__repr__`, not `__str__`
      - Lists can't contain objects
      - You need to call `str()` on the list
    answer: 1
    explanation: Define `__repr__` to control how objects appear inside containers.
  - type: mcq
    question: "Without an `__eq__` method, what does `Point(1, 2) == Point(1, 2)` give?"
    options: ["True", "False", "An error", "None"]
    answer: 1
    explanation: By default `==` checks identity, and these are two different objects.
  - type: mcq
    question: "Which special method lets `sorted()` work on a list of your objects?"
    options: ["__sort__", "__lt__", "__order__", "__cmp__"]
    answer: 1
    explanation: Sorting only needs "less than" comparisons.
  - type: mcq
    question: "What should `__eq__` return when `other` is a completely different type?"
    options: ["False always", "NotImplemented", "None", "It should raise TypeError"]
    answer: 1
    explanation: "`NotImplemented` lets Python try the other object's `__eq__` and otherwise fall back to `False`."
  - type: mcq
    question: "A class defines only `__len__` and `__getitem__` (with integer indexes). Which of these works on its objects?"
    options:
      - Only `len(x)`
      - "`len(x)`, `x[0]` and `for item in x:`"
      - Only indexing
      - Nothing until `__iter__` is defined
    answer: 1
    explanation: "`for` falls back to calling `__getitem__` with 0, 1, 2, ... until IndexError."
  - type: code
    question: |
      Write a class `Money` storing a whole number of `pence`. Give it `__add__` (returning a new `Money`), `__eq__` (equal pence; `NotImplemented` for other types), and `__str__` showing pounds with two decimal places and a £ sign, like `£12.05`.
    starter: |
      class Money:
          def __init__(self, pence):
              self.pence = pence
    tests:
      - name: Money works
        code: |
          a, b = Money(850), Money(295)
          assert a + b == Money(1145), "850p + 295p should equal Money(1145)"
          assert a.pence == 850, "Adding mustn't change the original"
          assert str(Money(1205)) == "£12.05", f"Got {str(Money(1205))!r}"
          assert str(Money(7)) == "£0.07"
          assert (Money(5) == 5) is False
    solution: |
      class Money:
          def __init__(self, pence):
              self.pence = pence

          def __add__(self, other):
              return Money(self.pence + other.pence)

          def __eq__(self, other):
              if not isinstance(other, Money):
                  return NotImplemented
              return self.pence == other.pence

          def __str__(self):
              return f"£{self.pence // 100}.{self.pence % 100:02d}"
