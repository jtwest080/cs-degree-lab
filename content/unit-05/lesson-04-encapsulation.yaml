  - type: code
    question: |
      Write a class `Square` with a `side` property backed by `_side`, whose setter raises `ValueError` for values that aren't positive (including in `__init__`), and a read-only `area` property.
    starter: |
      class Square:
          def __init__(self, side):
              self.side = side
    tests:
      - name: Square works
        code: |
          s = Square(3)
          assert s.side == 3 and s.area == 9
          s.side = 5
          assert s.area == 25
          for bad in [0, -2]:
              try:
                  s.side = bad
                  assert False, f"side = {bad} should raise ValueError"
              except ValueError:
                  pass
          try:
              s.area = 1
              assert False, "area should be read-only"
          except AttributeError:
              pass
          try:
              Square(-1)
              assert False, "Square(-1) should raise ValueError"
          except ValueError:
              pass
    solution: |
      class Square:
          def __init__(self, side):
              self.side = side

          @property
          def side(self):
              return self._side

          @side.setter
          def side(self, value):
              if value <= 0:
                  raise ValueError("side must be positive")
              self._side = value

          @property
          def area(self):
              return self._side ** 2
