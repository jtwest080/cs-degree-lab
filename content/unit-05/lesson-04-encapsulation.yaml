id: u5-encapsulation
title: Encapsulation, Properties and Class Attributes
minutes: 50
objective: |
  Separate a class's **public interface** from its **private implementation**, use **properties** to validate and compute attributes while keeping simple dot syntax, share data across all objects with **class attributes**, and write alternative constructors with `@classmethod`.
outcomes:
  - Explain encapsulation and why hiding implementation details makes code easier to change
  - Use the leading-underscore convention for internal attributes
  - Write read-only and computed attributes with `@property`
  - Validate assignments with a property setter
  - Tell class attributes from instance attributes, and use each correctly
  - Write an alternative constructor with `@classmethod`

sections:
  - heading: Interface and implementation
    body: |
      Think about how you use a car. You know its **interface**: steering wheel, pedals, gear stick. You don't need to know how the fuel injection works, and the manufacturer can switch from petrol to electric without you relearning how to drive. The interface stays the same; the **implementation** behind it changes.

      **Encapsulation** applies the same idea to classes: an object exposes a small set of methods and attributes for the outside world to use (its **public interface**) and keeps the details of how it works (its **implementation**) to itself. This gives two big benefits:

      - **Protection.** If outside code can only change the balance through `deposit` and `withdraw`, the invariant "balance is never negative" (Lesson 5.2) can't be broken.
      - **Freedom to change.** If outside code never touches the internals, you can redesign them (store transactions instead of a balance, use a dictionary instead of a list) without breaking anything that uses the class.

      In big programs the second benefit is huge: thousands of lines may use a class, and encapsulation lets you improve it without rewriting them.

  - heading: The underscore convention
    body: |
      Many languages (Java, C++) let you mark attributes `private` and the compiler forbids outside access. Python takes a gentler approach based on a convention: a name starting with **one underscore** means "internal, please don't touch":

      ```python
      class Account:
          def __init__(self, owner):
              self.owner = owner      # public: fine to read and change
              self._balance = 0       # internal: use the methods instead
      ```

      Python doesn't stop you from writing `acct._balance = -500`, but every Python programmer knows the underscore means "you're on your own if you do this". The motto in the Python community is *"we're all consenting adults here"*.

      You may also see **two** leading underscores, `self.__balance`. Python then renames the attribute behind the scenes (to `_Account__balance`), mostly to avoid accidental clashes in subclasses (Lesson 5.6). It's still reachable, and most code just uses one underscore.

  - heading: Properties
    body: |
      Suppose you want `acct.balance` to be readable, as before, but not settable from outside. Or you want `circle.area` to be worked out from the radius each time it's read. Python's tool for this is the **property**: a method that's used with attribute syntax.

      ```python
      class Circle:
          def __init__(self, radius):
              self.radius = radius

          @property
          def area(self):
              return 3.14159 * self.radius ** 2

      c = Circle(2)
      print(c.area)     # 12.56636  (no brackets!)
      c.radius = 3
      print(c.area)     # 28.27431  (always up to date)
      ```

      `@property` on the line above a `def` is a **decorator**: a label that changes how the function behaves. Here it turns the method `area` into something you read like an attribute. Because it's computed on every read, it can never be out of date, unlike an `area` attribute set once in `__init__` that would go stale when the radius changed.

      A property with no setter is **read-only**: `c.area = 100` raises `AttributeError`. That's exactly what you want for derived values.

  - heading: Validating with a setter
    body: |
      A property can also control **assignment**. The pattern is a private attribute holding the real value, a property to read it, and a **setter** to check new values:

      ```python
      class Circle:
          def __init__(self, radius):
              self.radius = radius          # goes through the setter below

          @property
          def radius(self):
              return self._radius

          @radius.setter
          def radius(self, value):
              if value <= 0:
                  raise ValueError("radius must be positive")
              self._radius = value
      ```

      Now `c.radius = -1` runs the setter and raises an error, while code that uses the class still just writes `c.radius`. Even the assignment in `__init__` goes through the setter, so an invalid circle can't be created either.

      > **Key idea:** In Python, start with plain public attributes. If you later need validation or computation, turn the attribute into a property: **code using the class doesn't change at all**. That's why Python programmers rarely write `get_radius()` and `set_radius()` methods the way Java programmers do.

  - heading: Class attributes
    body: |
      Attributes set on `self` belong to **one object** (instance attributes). Attributes assigned directly in the class body belong to **the class itself**, and are shared by every object:

      ```python
      class Ticket:
          price = 12            # class attribute: same for all tickets
          sold = 0              # class attribute: a shared counter

          def __init__(self, seat):
              self.seat = seat  # instance attribute: each ticket's own
              Ticket.sold += 1
      ```

      You met this in Lesson 5.3 with `Card.RANKS`. Class attributes suit **constants** (ranks, accepted coins, tax rates) and **shared counts**. Reading `self.price` looks first on the object and then on its class, so every ticket sees 12.

      Be careful when **assigning**: `self.sold += 1` would create a *new instance attribute* on that one ticket, hiding the class attribute, while the shared counter stayed unchanged. To update shared data, assign through the class name: `Ticket.sold += 1`. And as with defaults (Lesson 5.2), a **mutable** class attribute such as `members = []` is shared by every object, which is rarely what you want for per-object data.

  - heading: Alternative constructors with @classmethod
    body: |
      Sometimes you want more than one way to create an object, for example from a string such as `"2026-10-25"`. A **class method** receives the **class** (by convention called `cls`) instead of an instance, and can call it to build a new object:

      ```python
      class Date:
          def __init__(self, year, month, day):
              self.year, self.month, self.day = year, month, day

          @classmethod
          def from_string(cls, text):
              year, month, day = text.split("-")
              return cls(int(year), int(month), int(day))

      d = Date.from_string("2026-10-25")
      ```

      You call it on the class, not an object: `Date.from_string(...)`. Python's own types do this: `dict.fromkeys(...)` and `int.from_bytes(...)` are class methods. (There's also `@staticmethod`, for a plain function that lives in the class for organisation but needs neither `self` nor `cls`.)

examples:
  - title: Computed, read-only properties
    intro: Values worked out from other attributes are always current.
    code: |
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          @property
          def area(self):
              return self.width * self.height

          @property
          def perimeter(self):
              return 2 * (self.width + self.height)

      r = Rectangle(3, 4)
      print(r.area, r.perimeter)
      r.width = 10
      print(r.area, r.perimeter)
      try:
          r.area = 99
      except AttributeError:
          print("area is read-only")
    output: |
      12 14
      40 28
      area is read-only
    lines:
      - line: 6-8
        note: "`@property` makes `area` readable as `r.area`, without brackets."
      - line: 16-17
        note: "Change the width and both properties update automatically: nothing is stored that could go stale."
      - line: 18-21
        note: "A property with no setter can't be assigned to."
  - title: A validating setter
    intro: Every assignment, including the first, is checked.
    code: |
      class Temperature:
          def __init__(self, celsius):
              self.celsius = celsius

          @property
          def celsius(self):
              return self._celsius

          @celsius.setter
          def celsius(self, value):
              if value < -273.15:
                  raise ValueError("Below absolute zero")
              self._celsius = value

          @property
          def fahrenheit(self):
              return self._celsius * 9 / 5 + 32

      t = Temperature(20)
      t.celsius = 100
      print(t.celsius, t.fahrenheit)
      for bad in [-300, -500]:
          try:
              t.celsius = bad
          except ValueError as err:
              print(bad, "refused:", err)
      print(t.celsius)
    output: |
      100 212.0
      -300 refused: Below absolute zero
      -500 refused: Below absolute zero
      100
    lines:
      - line: 3
        note: "This assignment calls the setter, so the constructor is validated too."
      - line: 5-7
        note: "The getter returns the internal `_celsius`."
      - line: 9-13
        note: "The setter's decorator is `@celsius.setter`, and it uses the same name. Check, then store."
      - line: 15-17
        note: "A second, computed property built on the first."
  - title: Class attributes and a class method
    intro: Shared counters, constants and a second way to build objects.
    code: |
      class Ticket:
          PRICE = 12
          sold = 0

          def __init__(self, seat):
              Ticket.sold += 1
              self.number = Ticket.sold
              self.seat = seat

          @classmethod
          def from_code(cls, code):
              return cls(code.split(":")[1])

          def __repr__(self):
              return f"Ticket #{self.number} seat {self.seat}"

      tickets = [Ticket("A1"), Ticket("A2"), Ticket.from_code("ROW:B7")]
      print(tickets)
      print("Sold:", Ticket.sold, "Takings:", Ticket.sold * Ticket.PRICE)
      print(tickets[0].PRICE)
    output: |
      [Ticket #1 seat A1, Ticket #2 seat A2, Ticket #3 seat B7]
      Sold: 3 Takings: 36
      12
    lines:
      - line: 2-3
        note: "Class attributes: one value shared by every ticket. Capitals mark `PRICE` as a constant."
      - line: 6-7
        note: "Update the shared counter through the class name, then give this ticket its own number."
      - line: 10-12
        note: "A class method receives the class as `cls` and calls it to build an object from a different input."
      - line: 20
        note: "Reading `PRICE` through an object finds the class attribute."

playground:
  prompt: |
    Give `BankAccount` a read-only `balance` property backed by `_balance`, so `acct.balance = 1000000` fails. Then add a class attribute `interest_rate` and a method `add_interest()` that uses it. Change the rate once on the class and watch every account use the new one.
  code: |
    class BankAccount:
        def __init__(self, owner):
            self.owner = owner
            self.balance = 0

        def deposit(self, amount):
            if amount <= 0:
                raise ValueError("Deposit must be positive")
            self.balance += amount

    acct = BankAccount("Ada")
    acct.deposit(100)
    acct.balance = 1000000      # nothing stops this... yet
    print(acct.balance)

exercises:
  - id: circle-properties
    title: A well-behaved circle
    difficulty: 1
    prompt: |
      Rewrite `Circle` so that:

      - `radius` is a property backed by `_radius`, whose setter raises `ValueError` if the value isn't positive (including in `__init__`).
      - `area` (π r²) and `circumference` (2 π r) are **read-only** properties. Use the provided `PI`.
    starter: |
      PI = 3.14159


      class Circle:
          def __init__(self, radius):
              self.radius = radius
    tests:
      - name: computed properties
        code: |
          c = Circle(2)
          assert abs(c.area - 12.56636) < 1e-9, f"area should be 12.56636, got {c.area}"
          assert abs(c.circumference - 12.56636) < 1e-9
          c.radius = 1
          assert abs(c.area - 3.14159) < 1e-9, "area should update when radius changes"
      - name: read-only
        code: |
          c = Circle(2)
          try:
              c.area = 5
              assert False, "Setting area should raise AttributeError"
          except AttributeError:
              pass
      - name: validation
        code: |
          c = Circle(2)
          for bad in [0, -1]:
              try:
                  c.radius = bad
                  assert False, f"radius = {bad} should raise ValueError"
              except ValueError:
                  pass
          assert c.radius == 2
          try:
              Circle(-3)
              assert False, "Circle(-3) should raise ValueError"
          except ValueError:
              pass
    hints:
      - "Write `@property` above `def radius(self): return self._radius`, then `@radius.setter` above `def radius(self, value):`."
      - "Keep `self.radius = radius` in `__init__`: it goes through the setter."
      - "`area` and `circumference` each need only `@property`, with no setter."
    solution: |
      PI = 3.14159


      class Circle:
          def __init__(self, radius):
              self.radius = radius

          @property
          def radius(self):
              return self._radius

          @radius.setter
          def radius(self, value):
              if value <= 0:
                  raise ValueError("radius must be positive")
              self._radius = value

          @property
          def area(self):
              return PI * self._radius ** 2

          @property
          def circumference(self):
              return 2 * PI * self._radius
    explanation: |
      Code that uses `Circle` writes `c.radius` and `c.area` exactly as if they were plain attributes, but now invalid radii are impossible and the derived values can never go stale.

  - id: ticket-counter
    title: Numbered orders
    difficulty: 2
    prompt: |
      Write a class `Order` for a café:

      - A class attribute `next_number` starting at 1. Each new order takes the current value as its `number`, then increases the class attribute by 1.
      - Each order stores `items`, a **new** list per order (initially empty).
      - A class attribute `TAX_RATE = 0.2`.
      - `add(name, price)` appends a `(name, price)` tuple.
      - Read-only properties `subtotal` (sum of prices), `tax` (`subtotal * TAX_RATE`, rounded to 2 places) and `total` (`subtotal + tax`, rounded to 2 places).
    starter: |
      class Order:
          pass
    tests:
      - name: numbering
        code: |
          Order.next_number = 1
          a, b, c = Order(), Order(), Order()
          assert (a.number, b.number, c.number) == (1, 2, 3), f"Got {(a.number, b.number, c.number)}"
          assert Order.next_number == 4, "The class attribute should move on to 4"
      - name: separate items
        code: |
          a, b = Order(), Order()
          a.add("Latte", 3.2)
          assert b.items == [], "Each order needs its own items list"
          assert a.items == [("Latte", 3.2)]
      - name: totals
        code: |
          o = Order()
          o.add("Latte", 3.2); o.add("Croissant", 2.3)
          assert abs(o.subtotal - 5.5) < 1e-9
          assert o.tax == 1.1 and o.total == 6.6, f"tax {o.tax}, total {o.total}"
          try:
              o.total = 0
              assert False, "total should be read-only"
          except AttributeError:
              pass
      - name: changing the tax rate
        code: |
          o = Order()
          o.add("Cake", 10)
          old = Order.TAX_RATE
          Order.TAX_RATE = 0.1
          try:
              assert o.total == 11.0, "Properties should use the class attribute's current value"
          finally:
              Order.TAX_RATE = old
    hints:
      - "In `__init__`: `self.number = Order.next_number`, then `Order.next_number += 1`, then `self.items = []`."
      - "Read the rate as `self.TAX_RATE` (or `Order.TAX_RATE`); each property can use the others, e.g. `round(self.subtotal * self.TAX_RATE, 2)`."
    solution: |
      class Order:
          next_number = 1
          TAX_RATE = 0.2

          def __init__(self):
              self.number = Order.next_number
              Order.next_number += 1
              self.items = []

          def add(self, name, price):
              self.items.append((name, price))

          @property
          def subtotal(self):
              return sum(price for name, price in self.items)

          @property
          def tax(self):
              return round(self.subtotal * self.TAX_RATE, 2)

          @property
          def total(self):
              return round(self.subtotal + self.tax, 2)
    explanation: |
      `next_number` and `TAX_RATE` live on the class because they're about orders in general; `number` and `items` live on each object because every order has its own. Updating the counter as `Order.next_number += 1` is essential: `self.next_number += 1` would quietly create a per-order attribute and every order would get number 1.

  - id: date-classmethod
    title: Dates from text
    difficulty: 2
    prompt: |
      Write a class `Date`:

      - `Date(year, month, day)` stores the three parts, raising `ValueError` if the month isn't 1 to 12 or the day isn't valid for that month (use the provided `days_in_month`).
      - A class method `from_string(text)` that builds a date from `"YYYY-MM-DD"`.
      - `__str__` returning `"YYYY-MM-DD"` with zero padding: `Date(2026, 3, 7)` → `"2026-03-07"`.
      - A read-only property `day_of_year` (1 for 1 January, 365 or 366 for 31 December).
    starter: |
      def is_leap(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_month(year, month):
          if month == 2:
              return 29 if is_leap(year) else 28
          return 30 if month in (4, 6, 9, 11) else 31


      class Date:
          pass
    tests:
      - name: constructor and validation
        code: |
          d = Date(2026, 10, 25)
          assert (d.year, d.month, d.day) == (2026, 10, 25)
          for bad in [(2026, 13, 1), (2026, 0, 5), (2026, 2, 29), (2026, 4, 31), (2026, 1, 0)]:
              try:
                  Date(*bad)
                  assert False, f"Date{bad} should raise ValueError"
              except ValueError:
                  pass
          Date(2024, 2, 29)
      - name: from_string and __str__
        code: |
          d = Date.from_string("2026-03-07")
          assert isinstance(d, Date) and (d.year, d.month, d.day) == (2026, 3, 7)
          assert str(d) == "2026-03-07", f"Got {str(d)!r}"
          assert str(Date(999, 12, 1)) == "0999-12-01"
      - name: day_of_year
        code: |
          assert Date(2026, 1, 1).day_of_year == 1
          assert Date(2026, 3, 1).day_of_year == 60
          assert Date(2024, 3, 1).day_of_year == 61
          assert Date(2024, 12, 31).day_of_year == 366
    hints:
      - "`from_string` is decorated with `@classmethod`, takes `(cls, text)`, splits on `\"-\"`, and returns `cls(int(y), int(m), int(d))`."
      - "Pad with `:04d` and `:02d` in an f-string."
      - "`day_of_year`: add up `days_in_month(self.year, m)` for every month before `self.month`, then add `self.day` (you wrote this in Lesson 4.1)."
    solution: |
      def is_leap(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_month(year, month):
          if month == 2:
              return 29 if is_leap(year) else 28
          return 30 if month in (4, 6, 9, 11) else 31


      class Date:
          def __init__(self, year, month, day):
              if not 1 <= month <= 12:
                  raise ValueError(f"Bad month: {month}")
              if not 1 <= day <= days_in_month(year, month):
                  raise ValueError(f"Bad day: {day}")
              self.year = year
              self.month = month
              self.day = day

          @classmethod
          def from_string(cls, text):
              year, month, day = text.split("-")
              return cls(int(year), int(month), int(day))

          def __str__(self):
              return f"{self.year:04d}-{self.month:02d}-{self.day:02d}"

          @property
          def day_of_year(self):
              return sum(days_in_month(self.year, m) for m in range(1, self.month)) + self.day
    explanation: |
      `from_string` ends by calling `cls(...)`, so it goes through `__init__` and gets all its validation for free. A second constructor should never bypass the first one's checks. (Python's `datetime` module provides a full-featured `date` class built on the same ideas, with `date.fromisoformat("2026-10-25")` as its class method.)

  - id: ledger-account
    title: Change the inside, keep the outside
    difficulty: 3
    prompt: |
      Here is a working `Account` that stores a balance. Rewrite its **implementation** so that it stores **only** a private list of transactions, `_transactions` (positive numbers for deposits, negative for withdrawals), with **no balance attribute**. The **interface** must stay exactly the same:

      - `deposit(amount)` and `withdraw(amount)` with the same checks (raise `ValueError` for non-positive amounts or insufficient funds).
      - `balance`, now a read-only **property** computed from the transactions.
      - New: `statement()` returns a list of strings, one per transaction, like `"deposit 100"` and `"withdraw 30"`.
    starter: |
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self.balance = 0

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("Deposit must be positive")
              self.balance += amount

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("Withdrawal must be positive")
              if amount > self.balance:
                  raise ValueError("Insufficient funds")
              self.balance -= amount
    tests:
      - name: same behaviour as before
        code: |
          a = Account("Ada")
          a.deposit(100); a.withdraw(30); a.deposit(5)
          assert a.balance == 75, f"Balance should be 75, got {a.balance}"
          for bad in [(a.withdraw, 76), (a.withdraw, 0), (a.deposit, -1)]:
              try:
                  bad[0](bad[1])
                  assert False, f"{bad[0].__name__}({bad[1]}) should raise ValueError"
              except ValueError:
                  pass
          assert a.balance == 75
      - name: stored as transactions only
        code: |
          a = Account("Ada")
          a.deposit(100); a.withdraw(30)
          assert a._transactions == [100, -30], f"_transactions should be [100, -30], got {getattr(a, '_transactions', None)}"
          assert "balance" not in vars(a) and "_balance" not in vars(a), "Don't store a balance: compute it from the transactions"
      - name: balance is read-only
        code: |
          a = Account("Ada")
          try:
              a.balance = 1000000
              assert False, "Assigning to balance should raise AttributeError"
          except AttributeError:
              pass
      - name: statement
        code: |
          a = Account("Ada")
          a.deposit(100); a.withdraw(30)
          assert a.statement() == ["deposit 100", "withdraw 30"], f"Got {a.statement()}"
          assert Account("Bo").statement() == []
    hints:
      - "`__init__` sets `self._transactions = []` instead of a balance."
      - "`@property def balance(self): return sum(self._transactions)`. With no setter, assignment raises AttributeError."
      - "`withdraw` appends `-amount`. In `statement`, a positive number is a deposit and a negative one a withdrawal of `-t`."
    solution: |
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self._transactions = []

          @property
          def balance(self):
              return sum(self._transactions)

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("Deposit must be positive")
              self._transactions.append(amount)

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("Withdrawal must be positive")
              if amount > self.balance:
                  raise ValueError("Insufficient funds")
              self._transactions.append(-amount)

          def statement(self):
              lines = []
              for t in self._transactions:
                  if t > 0:
                      lines.append(f"deposit {t}")
                  else:
                      lines.append(f"withdraw {-t}")
              return lines
    explanation: |
      This is encapsulation's payoff: the inside changed completely, yet code written for the old class (`a.deposit(100)`, `a.balance`) still works unchanged, and the new version can't be put out of step because the balance is derived from the history. The cost is that `balance` now takes O(n) time (Lesson 4.2); a real system might cache it, and because of encapsulation that, too, could be added later without anyone noticing.

commonMistakes:
  - title: Using the property's name for the stored value
    explanation: |
      Inside a setter, `self.radius = value` calls the setter again, forever, until RecursionError. Store the value under a different, private name: `self._radius = value`.
  - title: Calling a property with brackets
    explanation: |
      A property is read like an attribute: `c.area`, not `c.area()`. With brackets, Python tries to call the number it returned: `TypeError: 'float' object is not callable`.
  - title: Updating a class attribute through self
    explanation: |
      `self.count += 1` creates a separate attribute on that one object and leaves the shared class attribute unchanged. Use `ClassName.count += 1`.
  - title: Mutable class attributes for per-object data
    explanation: |
      `items = []` in the class body is one list shared by every object. Per-object lists belong in `__init__` as `self.items = []`.
  - title: Writing getters and setters for everything
    explanation: |
      Python style is to start with plain attributes and switch to a property only when you need validation or computation. Callers won't notice the change.

summary:
  - "**Encapsulation** separates the public **interface** from the private **implementation**, protecting invariants and leaving you free to change the inside."
  - "A leading underscore (`_balance`) marks an attribute as internal by convention."
  - "`@property` turns a method into a read-only, computed attribute; `@name.setter` validates assignments while callers keep plain dot syntax."
  - "**Class attributes** live on the class and are shared (constants, counters). Update them with `ClassName.attr`, never `self.attr`."
  - "`@classmethod` methods receive the class as `cls` and make good alternative constructors, such as `from_string`."
next: |
  So far each class has stood alone, or held a simple list. Real programs are built from objects that **contain and cooperate with other objects**: a car has an engine and four wheels, a library has members and books. **Lesson 5.5** is about **composition**, building bigger objects from smaller ones.

quiz:
  - type: mcq
    question: What is the main benefit of encapsulation?
    options:
