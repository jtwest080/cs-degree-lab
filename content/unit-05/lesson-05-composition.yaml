id: u5-composition
title: "Composition: Objects Made of Objects"
minutes: 50
objective: |
  Build larger objects out of smaller ones (**composition**), let an object hand work to the objects it contains (**delegation**), keep links between objects consistent, and design classes that only talk to their close collaborators.
outcomes:
  - Recognise "has-a" relationships and model them with composition
  - Store other objects as attributes, alone or in lists and dictionaries
  - Delegate work to contained objects instead of reaching through them
  - Keep two-way links between objects consistent
  - Pass collaborating objects into a constructor
  - Draw a simple diagram of how objects in a program connect

sections:
  - heading: Has-a relationships
    body: |
      Real things are made of other things. A car **has an** engine and four wheels. A playlist **has** songs. A university **has** departments, which **have** courses, which **have** students. When one object holds others as its attributes, that's called **composition**, and it's the main way large object-oriented programs are built.

      You've already done it: in Lesson 5.1, a `Shelf` held a list of `Book` objects. The idea is simple, but it changes how you design programs. Instead of one enormous class that does everything, you build **small classes that each do one job well**, then assemble them like Lego bricks.

      > **Analogy:** A computer is assembled from a CPU, memory, a disk and a screen (Unit 1). Each part has a clear job and a clear connection to the others, and a broken disk can be replaced without redesigning the CPU. Composed objects work the same way.

      A good test for composition is the phrase **"has a"**: a car *has an* engine, an order *has* line items. (Next lesson's inheritance is for **"is a"** relationships: a car *is a* vehicle.)

  - heading: Objects as attributes
    body: |
      An attribute can hold any object, including one of your own classes:

      ```python
      class Engine:
          def __init__(self, horsepower):
              self.horsepower = horsepower
              self.running = False

          def start(self):
              self.running = True

      class Car:
          def __init__(self, model, horsepower):
              self.model = model
              self.engine = Engine(horsepower)    # a Car has an Engine
              self.wheels = 4
      ```

      Each `Car` creates its own `Engine`, so `car.engine` is an `Engine` object with its own attributes and methods. Attributes can also hold lists or dictionaries **of** objects: a `Playlist` with a list of `Song`s, a `Warehouse` with a dictionary mapping product codes to `Product`s. Everything from Unit 3 applies; the items just happen to be your own objects.

  - heading: Delegation
    body: |
      Code using a `Car` *could* start it by reaching inside: `my_car.engine.start()`. That works, but now that code depends on the fact that cars contain an `engine` attribute with a `start` method. If you later give cars two motors, or an electric drive, every such line breaks.

      Better: give `Car` its own `start` method that **delegates** to the engine:

      ```python
      class Car:
          ...
          def start(self):
              self.engine.start()

          def is_running(self):
              return self.engine.running
      ```

      Now outside code calls `my_car.start()` and knows nothing about engines. You saw delegation in Lesson 5.3, where `Playlist.__len__` handed the job to its list.

      A useful guideline, known as the **Law of Demeter** or "talk only to your friends": a method should call methods on itself, its own attributes, and its parameters, but not on objects reached through long chains like `order.customer.address.city.upper()`. Each extra dot is a dependency on how some other class is built inside. When you find yourself writing long chains, add a method to the class in the middle.

  - heading: Passing objects in
    body: |
      A class doesn't always have to create its parts itself. Often it's better to **pass them in**:

      ```python
      class Car:
          def __init__(self, model, engine):
              self.model = model
              self.engine = engine

      electric = Car("Volt", ElectricMotor(150))
      petrol = Car("Golf", Engine(110))
      ```

      Now the same `Car` class works with any kind of engine that has the right methods, and in tests you can pass in a simple fake engine. This is called **dependency injection**, a grand name for a simple idea: give an object its collaborators instead of making it build them.

      It also raises a question about **lifetime**. If a car creates its engine, the engine belongs to it and lives and dies with it (strict **composition**). If objects are passed in and might be shared, such as students who belong to several courses, the relationship is looser, sometimes called **aggregation**. Python doesn't distinguish the two, but thinking about who owns what helps avoid surprises with shared references (Lesson 3.4).

  - heading: Two-way links
    body: |
      Sometimes both sides need to know about each other: a library member knows which books they've borrowed, and each book knows who has it. These **two-way links** are convenient but dangerous, because they can get out of step: the book says Ada has it, but Ada's list doesn't include it.

      The cure is encapsulation (Lesson 5.4): make **one method** responsible for updating both sides together, and never change either side anywhere else.

      ```python
      class Library:
          def lend(self, book, member):
              if book.borrower is not None:
                  raise ValueError("Already on loan")
              book.borrower = member
              member.loans.append(book)
      ```

      If every loan goes through `lend` (and every return through a matching `take_back`), the two sides always agree. This is the same idea as the transfer method in Lesson 5.2: an operation that changes several objects should happen in one place, completely or not at all.

  - heading: Drawing object diagrams
    body: |
      With several classes, a quick sketch saves a lot of confusion. Draw each class as a box listing its main attributes and methods, and draw a line for each "has a" relationship, labelled with how many: one car has **1** engine and **4** wheels; one library has **many** books.

      ```text
      +-------------+  1        many  +-------------+
      |   Library   |---------------->|    Book     |
      |-------------|                 |-------------|
      | lend()      |                 | title       |
      | take_back() |                 | borrower ---+--> 0 or 1 Member
      +-------------+                 +-------------+
             | 1
             | many
             v
      +-------------+
      |   Member    |
      |-------------|
      | name        |
      | loans ------+--> many Books
      +-------------+
      ```

      Professional developers use a standard notation called **UML** (Unified Modelling Language) for diagrams like this, which you'll meet in Unit 14. For now, boxes and arrows on paper are all you need. Draw the diagram *before* writing code: it's much cheaper to move a box than to rewrite a class.

examples:
  - title: A car with an engine
    intro: Composition plus delegation.
    code: |
      class Engine:
          def __init__(self, horsepower):
              self.horsepower = horsepower
              self.running = False

          def start(self):
              self.running = True

          def stop(self):
              self.running = False

      class Car:
          def __init__(self, model, horsepower):
              self.model = model
              self.engine = Engine(horsepower)

          def start(self):
              self.engine.start()
              print(self.model, "started")

          def is_running(self):
              return self.engine.running

      a = Car("Mini", 136)
      b = Car("Volvo", 250)
      a.start()
      print(a.is_running(), b.is_running())
      print(a.engine.horsepower, a.engine is b.engine)
    output: |
      Mini started
      True False
      136 False
    lines:
      - line: 15
        note: "Composition: each car builds its own `Engine` and stores it as an attribute."
      - line: 17-19
        note: "Delegation: `Car.start` passes the job to the engine, so callers never touch the engine directly."
      - line: 27
        note: "Starting one car doesn't affect the other, because each has a separate engine."
      - line: 28
        note: "`is` confirms the two engines are different objects."
  - title: A playlist of songs
    intro: A container class whose items are objects.
    code: |
      class Song:
          def __init__(self, title, artist, seconds):
              self.title = title
              self.artist = artist
              self.seconds = seconds

      class Playlist:
          def __init__(self, name):
              self.name = name
              self.songs = []

          def add(self, song):
              self.songs.append(song)

          def total_seconds(self):
              return sum(s.seconds for s in self.songs)

          def by_artist(self, artist):
              return [s.title for s in self.songs if s.artist == artist]

      p = Playlist("Road trip")
      p.add(Song("Respect", "Aretha Franklin", 147))
      p.add(Song("Hey Jude", "The Beatles", 431))
      p.add(Song("Let It Be", "The Beatles", 243))
      print(p.name, p.total_seconds() // 60, "minutes")
      print(p.by_artist("The Beatles"))
    output: |
      Road trip 13 minutes
      ['Hey Jude', 'Let It Be']
    lines:
      - line: 10
        note: "A playlist has a list of `Song` objects (starting empty, created fresh per playlist)."
      - line: 15-16
        note: "The playlist answers questions about its songs by looping over them."
      - line: 18-19
        note: "Callers ask the playlist; they don't need to loop over its internals themselves."
  - title: Keeping two-way links consistent
    intro: One method updates both sides of a loan.
    code: |
      class Book:
          def __init__(self, title):
              self.title = title
              self.borrower = None

      class Member:
          def __init__(self, name):
              self.name = name
              self.loans = []

      class Library:
          def lend(self, book, member):
              if book.borrower is not None:
                  raise ValueError(f"{book.title} is on loan to {book.borrower.name}")
              book.borrower = member
              member.loans.append(book)

          def take_back(self, book):
              member = book.borrower
              member.loans.remove(book)
              book.borrower = None

      lib = Library()
      dune, emma = Book("Dune"), Book("Emma")
      ada, alan = Member("Ada"), Member("Alan")
      lib.lend(dune, ada)
      lib.lend(emma, ada)
      try:
          lib.lend(dune, alan)
      except ValueError as err:
          print(err)
      lib.take_back(dune)
      print([b.title for b in ada.loans], dune.borrower)
    output: |
      Dune is on loan to Ada
      ['Emma'] None
    lines:
      - line: 4
        note: "`borrower` will hold a `Member` object, or `None` when the book is on the shelf."
      - line: 12-16
        note: "Both sides of the link are updated in one place, after the check."
      - line: 14
        note: "`book.borrower.name`: the book holds a reference to the member object itself."
      - line: 18-21
        note: "Returning also updates both sides, so they can never disagree."

playground:
  prompt: |
    Extend the library: give `Member` a limit of 2 loans (raise `ValueError` in `lend` if they're at the limit), and add a method `Library.on_loan()` that returns every `(title, member name)` pair. What should happen if someone calls `take_back` on a book that isn't on loan?
  code: |
    class Book:
        def __init__(self, title):
            self.title = title
            self.borrower = None

    class Member:
        def __init__(self, name):
            self.name = name
            self.loans = []

    class Library:
        def __init__(self):
            self.books = []

        def add(self, book):
            self.books.append(book)

        def lend(self, book, member):
            if book.borrower is not None:
                raise ValueError("already on loan")
            book.borrower = member
            member.loans.append(book)

    lib = Library()
    for t in ["Dune", "Emma", "Solaris"]:
        lib.add(Book(t))
    ada = Member("Ada")
    lib.lend(lib.books[0], ada)
    print([b.title for b in ada.loans])

exercises:
  - id: car-engine
    title: Delegate to the engine
    difficulty: 1
    prompt: |
      An `Engine` class is provided. Write a `Car` class:

      - `Car(model, horsepower)` stores `model` and creates its own `Engine` as the attribute `engine`.
      - `start()` and `stop()` delegate to the engine.
      - `is_running()` returns whether the engine is running.
      - `describe()` returns e.g. `"Mini (136 hp)"`, using the engine's horsepower.
    starter: |
      class Engine:
          def __init__(self, horsepower):
              self.horsepower = horsepower
              self.running = False

          def start(self):
              self.running = True

          def stop(self):
              self.running = False


      class Car:
          pass
    tests:
      - name: has an engine
        code: |
          c = Car("Mini", 136)
          assert c.model == "Mini" and isinstance(c.engine, Engine), "A Car should store its model and its own Engine"
          assert c.engine.horsepower == 136
          assert Car("A", 1).engine is not Car("B", 2).engine, "Each car needs its own engine"
      - name: delegation
        code: |
          c = Car("Mini", 136)
          assert c.is_running() is False
          c.start()
          assert c.is_running() is True and c.engine.running is True
          c.stop()
          assert c.is_running() is False
      - name: describe
        code: |
          assert Car("Mini", 136).describe() == "Mini (136 hp)", f"Got {Car('Mini', 136).describe()!r}"
    hints:
      - "In `__init__`: `self.engine = Engine(horsepower)`."
      - "`start(self)` is one line: `self.engine.start()`."
    solution: |
      class Engine:
          def __init__(self, horsepower):
              self.horsepower = horsepower
              self.running = False

          def start(self):
              self.running = True

          def stop(self):
              self.running = False


      class Car:
          def __init__(self, model, horsepower):
              self.model = model
              self.engine = Engine(horsepower)

          def start(self):
              self.engine.start()

          def stop(self):
              self.engine.stop()

          def is_running(self):
              return self.engine.running

          def describe(self):
              return f"{self.model} ({self.engine.horsepower} hp)"
    explanation: |
      Code that uses `Car` now only needs to know about cars. If engines change, only the four small `Car` methods need updating, not every piece of code that starts a car.

  - id: song-playlist
    title: Songs and playlists
    difficulty: 2
    prompt: |
      Write two classes:

      - `Song(title, artist, seconds)` storing those attributes, with `__str__` returning e.g. `"Hey Jude - The Beatles (7:11)"` (minutes, then seconds padded to two digits).
      - `Playlist(name)` with an empty `songs` list and methods:
        - `add(song)`: appends; raise `ValueError` if a song with the same title **and** artist is already in the playlist.
        - `total_time()`: total length as `"M:SS"` (minutes may exceed 59, e.g. `"72:05"`).
        - `longest()`: the longest `Song` object, or `None` if empty.
        - `__len__`: the number of songs.
    starter: |
      class Song:
          pass


      class Playlist:
          pass
    tests:
      - name: Song
        code: |
          s = Song("Hey Jude", "The Beatles", 431)
          assert (s.title, s.artist, s.seconds) == ("Hey Jude", "The Beatles", 431)
          assert str(s) == "Hey Jude - The Beatles (7:11)", f"Got {str(s)!r}"
          assert str(Song("X", "Y", 65)) == "X - Y (1:05)"
      - name: add and len
        code: |
          p = Playlist("Mix")
          assert p.name == "Mix" and len(p) == 0
          p.add(Song("Respect", "Aretha Franklin", 147))
          p.add(Song("Respect", "Otis Redding", 125))
          assert len(p) == 2, "Same title by a different artist is a different song"
          try:
              p.add(Song("Respect", "Aretha Franklin", 147))
              assert False, "Adding the same song twice should raise ValueError"
          except ValueError:
              pass
          assert len(p) == 2
      - name: total_time and longest
        code: |
          p = Playlist("Mix")
          assert p.longest() is None and p.total_time() == "0:00"
          p.add(Song("A", "X", 147)); p.add(Song("B", "X", 431)); p.add(Song("C", "X", 243))
          assert p.total_time() == "13:41", f"Got {p.total_time()}"
          assert p.longest().title == "B"
          long = Playlist("Long")
          for i in range(10):
              long.add(Song(str(i), "Z", 432))
          assert long.total_time() == "72:00", f"Got {long.total_time()}"
    hints:
      - "`Song.__str__`: `f\"{self.title} - {self.artist} ({self.seconds // 60}:{self.seconds % 60:02d})\"`."
      - "In `add`, loop over `self.songs` and compare `s.title == song.title and s.artist == song.artist`."
      - "`longest`: `max(self.songs, key=...)` with a key function returning the seconds, after checking for an empty list."
    solution: |
      class Song:
          def __init__(self, title, artist, seconds):
              self.title = title
              self.artist = artist
              self.seconds = seconds

          def __str__(self):
              return f"{self.title} - {self.artist} ({self.seconds // 60}:{self.seconds % 60:02d})"


      class Playlist:
          def __init__(self, name):
              self.name = name
              self.songs = []

          def add(self, song):
              for s in self.songs:
                  if s.title == song.title and s.artist == song.artist:
                      raise ValueError(f"{song.title} is already in {self.name}")
              self.songs.append(song)

          def total_time(self):
              total = sum(s.seconds for s in self.songs)
              return f"{total // 60}:{total % 60:02d}"

          def longest(self):
              if not self.songs:
                  return None

              def length(song):
                  return song.seconds

              return max(self.songs, key=length)

          def __len__(self):
              return len(self.songs)
    explanation: |
      Each class has one clear job: a `Song` knows about itself (including how to display itself), and a `Playlist` knows about its collection of songs. Adding duplicate detection only touched `Playlist.add`, because that's the one place songs enter.

  - id: warehouse
    title: A warehouse of products
    difficulty: 2
    prompt: |
      Write two classes:

      - `Product(code, name, price, quantity)` storing those four attributes, with a method `value()` returning `price * quantity`.
      - `Warehouse()` holding a dictionary `products` mapping each code to its `Product`, with methods:
        - `add(product)`: raise `ValueError` if the code is already used.
        - `restock(code, amount)` and `ship(code, amount)` change the product's quantity. Both raise `KeyError` for an unknown code; `ship` raises `ValueError` if there isn't enough stock.
        - `total_value()`: the value of all stock.
        - `low_stock(threshold)`: the **names** of products with quantity below `threshold`, sorted alphabetically.
    starter: |
      class Product:
          pass


      class Warehouse:
          pass
    tests:
      - name: Product
        code: |
          p = Product("A1", "Widget", 2.5, 10)
          assert (p.code, p.name, p.price, p.quantity) == ("A1", "Widget", 2.5, 10)
          assert p.value() == 25
      - name: add and total_value
        code: |
          w = Warehouse()
          w.add(Product("A1", "Widget", 2.5, 10))
          w.add(Product("B2", "Gadget", 10, 3))
          assert set(w.products) == {"A1", "B2"} and w.products["B2"].name == "Gadget"
          assert w.total_value() == 55
          try:
              w.add(Product("A1", "Other", 1, 1))
              assert False, "A duplicate code should raise ValueError"
          except ValueError:
              pass
      - name: restock and ship
        code: |
          w = Warehouse()
          w.add(Product("A1", "Widget", 2.5, 10))
          w.restock("A1", 5)
          w.ship("A1", 12)
          assert w.products["A1"].quantity == 3
          try:
              w.ship("A1", 4)
              assert False, "Shipping more than is in stock should raise ValueError"
          except ValueError:
              pass
          assert w.products["A1"].quantity == 3
          for method in (w.restock, w.ship):
              try:
                  method("ZZ", 1)
                  assert False, "An unknown code should raise KeyError"
              except KeyError:
                  pass
      - name: low_stock
        code: |
          w = Warehouse()
          for p in [Product("1", "Nails", 1, 2), Product("2", "Bolts", 1, 50), Product("3", "Hinges", 1, 0)]:
              w.add(p)
          assert w.low_stock(5) == ["Hinges", "Nails"], f"Got {w.low_stock(5)}"
    hints:
      - "`Warehouse.__init__` sets `self.products = {}`; `add` stores `self.products[product.code] = product`."
      - "Looking up `self.products[code]` raises KeyError for an unknown code automatically."
      - "`low_stock`: `sorted(p.name for p in self.products.values() if p.quantity < threshold)`."
    solution: |
      class Product:
          def __init__(self, code, name, price, quantity):
              self.code = code
              self.name = name
              self.price = price
              self.quantity = quantity

          def value(self):
              return self.price * self.quantity


      class Warehouse:
          def __init__(self):
              self.products = {}

          def add(self, product):
              if product.code in self.products:
                  raise ValueError(f"Code {product.code} already used")
              self.products[product.code] = product

          def restock(self, code, amount):
              self.products[code].quantity += amount

          def ship(self, code, amount):
              product = self.products[code]
              if amount > product.quantity:
                  raise ValueError(f"Only {product.quantity} {product.name} in stock")
              product.quantity -= amount

          def total_value(self):
              return sum(p.value() for p in self.products.values())

          def low_stock(self, threshold):
              return sorted(p.name for p in self.products.values() if p.quantity < threshold)
    explanation: |
      A dictionary of objects gives O(1) lookup by code (Lesson 3.6), and the warehouse asks each product for its own value rather than multiplying price by quantity itself: each class does the calculation it has the data for.

  - id: course-roster
    title: Students shared between courses
    difficulty: 2
    prompt: |
      Write two classes:

      - `Student(name)` with a `name` and a dictionary `grades` mapping course titles to scores.
      - `Course(title)` with a `title` and a list `students`, and methods:
        - `enrol(student)`: add the student (ignore them if already enrolled).
        - `record(student, score)`: store the score in **the student's** `grades` dictionary under this course's title. Raise `ValueError` if the student isn't enrolled.
        - `average()`: the average score of enrolled students who have a score for this course (or `None` if nobody does).

      A student can be enrolled in several courses, so the same `Student` object may be in several lists, collecting grades from each.
    starter: |
      class Student:
          pass


      class Course:
          pass
    tests:
      - name: enrol
        code: |
          c = Course("Maths")
          ada = Student("Ada")
          c.enrol(ada); c.enrol(ada)
          assert c.students == [ada], "Enrolling twice should only add the student once"
      - name: record and average
        code: |
          maths = Course("Maths")
          ada, bo, cy = Student("Ada"), Student("Bo"), Student("Cy")
          for s in (ada, bo, cy):
              maths.enrol(s)
          assert maths.average() is None
          maths.record(ada, 90); maths.record(bo, 70)
          assert ada.grades == {"Maths": 90}
          assert maths.average() == 80, f"Got {maths.average()}"
          try:
              maths.record(Student("Zed"), 50)
              assert False, "Recording a score for someone not enrolled should raise ValueError"
          except ValueError:
              pass
      - name: shared students
        code: |
          maths, art = Course("Maths"), Course("Art")
          ada = Student("Ada")
          maths.enrol(ada); art.enrol(ada)
          maths.record(ada, 95); art.record(ada, 60)
          assert ada.grades == {"Maths": 95, "Art": 60}, f"Ada's grades: {ada.grades}"
          assert maths.students[0] is art.students[0], "Both courses should hold the same Student object"
    hints:
      - "`enrol`: `if student not in self.students: self.students.append(student)`."
      - "`record`: after the check, `student.grades[self.title] = score`."
      - "`average`: collect `s.grades[self.title]` for each enrolled student whose `grades` contains this title."
    solution: |
      class Student:
          def __init__(self, name):
              self.name = name
              self.grades = {}


      class Course:
          def __init__(self, title):
              self.title = title
              self.students = []

          def enrol(self, student):
              if student not in self.students:
                  self.students.append(student)

          def record(self, student, score):
              if student not in self.students:
                  raise ValueError(f"{student.name} isn't enrolled in {self.title}")
              student.grades[self.title] = score

          def average(self):
              scores = [s.grades[self.title] for s in self.students if self.title in s.grades]
              if not scores:
                  return None
              return sum(scores) / len(scores)
    explanation: |
      This is **aggregation**: courses don't own students, they share references to them. Because both courses hold the *same* `Student` object (Lesson 3.4), grades recorded by either course end up in one place. That's exactly what we want here, and it's why it's worth thinking about who owns what.

  - id: library-system
    title: A library system
    difficulty: 3
    prompt: |
      Build a small library with three classes:

      - `Book(isbn, title)` with an attribute `borrower`, initially `None`.
      - `Member(name)` with a list `loans`, and a class attribute `LIMIT = 3`.
      - `Library()` with dictionaries `books` (ISBN → `Book`) and `members` (name → `Member`), and methods:
        - `add_book(book)` and `join(member)`.
        - `lend(isbn, name)`: raise `KeyError` for an unknown ISBN or member; raise `ValueError` if the book is on loan or the member already has `LIMIT` loans. Otherwise update **both** sides of the link.
        - `take_back(isbn)`: raise `ValueError` if the book isn't on loan; otherwise update both sides.
        - `available()`: titles of books not on loan, sorted.
        - `report()`: a dictionary mapping each member's name to a sorted list of the titles they have.
    starter: |
      class Book:
          pass


      class Member:
          pass


      class Library:
          pass
    tests:
      - name: setup
        code: |
          lib = Library()
          lib.add_book(Book("111", "Dune"))
          lib.join(Member("Ada"))
          assert lib.books["111"].title == "Dune" and lib.books["111"].borrower is None
          assert lib.members["Ada"].loans == [] and Member.LIMIT == 3
      - name: lending updates both sides
        code: |
          lib = Library()
          for isbn, title in [("1", "Dune"), ("2", "Emma"), ("3", "Solaris")]:
              lib.add_book(Book(isbn, title))
          lib.join(Member("Ada")); lib.join(Member("Bo"))
          lib.lend("1", "Ada"); lib.lend("2", "Ada")
          ada = lib.members["Ada"]
          assert lib.books["1"].borrower is ada, "The book should refer to the Member object"
          assert [b.title for b in ada.loans] == ["Dune", "Emma"]
          assert lib.available() == ["Solaris"]
          assert lib.report() == {"Ada": ["Dune", "Emma"], "Bo": []}, f"Got {lib.report()}"
      - name: errors
        code: |
          lib = Library()
          for i in range(5):
              lib.add_book(Book(str(i), f"Book {i}"))
          lib.join(Member("Ada")); lib.join(Member("Bo"))
          lib.lend("0", "Ada")
          cases = [(lambda: lib.lend("0", "Bo"), ValueError, "lending a book that's out"),
                   (lambda: lib.lend("99", "Bo"), KeyError, "an unknown ISBN"),
                   (lambda: lib.lend("1", "Zed"), KeyError, "an unknown member"),
                   (lambda: lib.take_back("1"), ValueError, "returning a book that isn't out")]
          for action, error, what in cases:
              try:
                  action()
                  assert False, f"Expected {error.__name__} for {what}"
              except error:
                  pass
          lib.lend("1", "Ada"); lib.lend("2", "Ada")
          try:
              lib.lend("3", "Ada")
              assert False, "A fourth loan should raise ValueError (the limit is 3)"
          except ValueError:
              pass
          assert len(lib.members["Ada"].loans) == 3 and lib.books["3"].borrower is None
      - name: returning
        code: |
          lib = Library()
          lib.add_book(Book("1", "Dune")); lib.join(Member("Ada"))
          lib.lend("1", "Ada")
          lib.take_back("1")
          assert lib.books["1"].borrower is None and lib.members["Ada"].loans == []
          lib.lend("1", "Ada")
          assert lib.report() == {"Ada": ["Dune"]}
    hints:
      - "`lend`: look up `book = self.books[isbn]` and `member = self.members[name]` first (KeyError comes for free), then do the two `ValueError` checks, then set `book.borrower = member` and `member.loans.append(book)`."
      - "`take_back`: `member = book.borrower`; check it isn't `None`; then `member.loans.remove(book)` and `book.borrower = None`."
      - "`report`: `{name: sorted(b.title for b in m.loans) for name, m in self.members.items()}`."
    solution: |
      class Book:
          def __init__(self, isbn, title):
              self.isbn = isbn
              self.title = title
              self.borrower = None


      class Member:
          LIMIT = 3

          def __init__(self, name):
              self.name = name
              self.loans = []


      class Library:
          def __init__(self):
              self.books = {}
              self.members = {}

          def add_book(self, book):
              self.books[book.isbn] = book

          def join(self, member):
              self.members[member.name] = member

          def lend(self, isbn, name):
              book = self.books[isbn]
              member = self.members[name]
              if book.borrower is not None:
                  raise ValueError(f"{book.title} is already on loan")
              if len(member.loans) >= Member.LIMIT:
                  raise ValueError(f"{member.name} has reached the loan limit")
              book.borrower = member
              member.loans.append(book)

          def take_back(self, isbn):
              book = self.books[isbn]
              member = book.borrower
              if member is None:
                  raise ValueError(f"{book.title} isn't on loan")
              member.loans.remove(book)
              book.borrower = None

          def available(self):
              return sorted(b.title for b in self.books.values() if b.borrower is None)

          def report(self):
              return {name: sorted(b.title for b in m.loans) for name, m in self.members.items()}
    explanation: |
      `Library` is the only class that changes loans, so the two sides of every link always agree. The data classes (`Book`, `Member`) stay simple, and all the rules live in one place. This kind of design, a coordinating class that manages several simpler ones, is extremely common: think of a game that manages players and items, or a shop that manages products and orders.

commonMistakes:
  - title: Reaching through objects
    explanation: |
      Chains like `car.engine.pistons[0].fire()` tie your code to the inside of other classes. Add a method to the outer class that delegates instead.
  - title: Updating only one side of a two-way link
    explanation: |
      Setting `book.borrower` without adding to `member.loans` leaves the objects disagreeing. Change both sides in one method, and only there.
  - title: Sharing a part you meant to copy
    explanation: |
      Passing the same list or object to two constructors means both objects share it (Lesson 3.4). If each needs its own, create or copy it inside `__init__`.
  - title: One giant class
    explanation: |
      A single class with dozens of attributes and methods is hard to understand and test. If a group of attributes always goes together, it probably wants to be its own class.

summary:
  - "**Composition** builds objects from other objects: a \"has a\" relationship (a car has an engine)."
  - "Attributes can hold single objects, or lists and dictionaries of objects."
  - "**Delegation**: an object passes work to its parts, so callers don't depend on its insides (the Law of Demeter: talk only to your friends)."
  - "Passing collaborators into a constructor (**dependency injection**) makes classes flexible and easy to test."
  - "Keep **two-way links** consistent by changing both sides in a single method."
  - "Sketch classes and their connections before coding."
next: |
  Composition handles "has a". But what about "is a"? A savings account *is a* bank account with extra rules; a square *is a* shape. **Lesson 5.6** introduces **inheritance**: building a new class on top of an existing one, reusing its code and adding or changing only what's different.

quiz:
  - type: mcq
    question: Which relationship is best modelled with composition?
    options: ["A dog is an animal", "A car has an engine", "A square is a shape", "A student is a person"]
    answer: 1
    explanation: Composition is for "has a" relationships; the others are "is a".
  - type: mcq
    question: What is delegation?
    options:
      - Copying another class's code
      - An object passing a task on to one of its parts
      - Deleting an object
      - Calling a method on the class instead of an object
    answer: 1
    explanation: "For example, `Car.start()` calls `self.engine.start()`."
  - type: mcq
    question: "Why is `order.customer.address.city.upper()` considered poor style?"
    options:
      - It's too slow
      - It depends on the internal structure of several other classes, so it breaks if any of them changes
      - Python limits you to two dots
      - It's fine; there's nothing wrong with it
    answer: 1
    explanation: The Law of Demeter suggests adding methods so each object only talks to its immediate collaborators.
  - type: mcq
    question: A book stores its borrower and a member stores their loans. How do you keep them consistent?
    options:
      - Check them both every few seconds
      - Update both sides together in one method, and nowhere else
      - Store the link in a global variable
      - Only ever update the book
    answer: 1
    explanation: One responsible method makes it impossible for the sides to disagree.
  - type: mcq
    question: "Two `Course` objects both `enrol` the same `Student` object, and each records a grade. How many `grades` dictionaries now hold those grades?"
    options: ["Two, one per course", "One, the student's", "None", "Three"]
    answer: 1
    explanation: Both courses refer to the very same student object, which has a single grades dictionary.
  - type: mcq
    question: What does passing an engine into `Car(model, engine)` (rather than creating it inside) make easier?
    options:
      - Nothing
      - Using different kinds of engine, and fake engines in tests
      - Making the car faster
      - Avoiding `__init__`
    answer: 1
    explanation: This is dependency injection; the car works with any engine that has the right methods.
  - type: code
    question: |
      A `Player(name, goals)` class is provided. Write a class `Team(name)` with a list `players`, a method `add(player)`, a method `total_goals()`, and a method `top_scorer()` returning the **name** of the player with the most goals (or `None` if there are no players).
    starter: |
      class Player:
          def __init__(self, name, goals):
              self.name = name
              self.goals = goals


      class Team:
          pass
    tests:
      - name: Team works
        code: |
          t = Team("Reds")
          assert t.name == "Reds" and t.players == [] and t.top_scorer() is None and t.total_goals() == 0
          t.add(Player("Ada", 3)); t.add(Player("Bo", 7)); t.add(Player("Cy", 2))
          assert t.total_goals() == 12 and t.top_scorer() == "Bo"
          assert Team("Blues").players == [], "Each team needs its own list"
    solution: |
      class Player:
          def __init__(self, name, goals):
              self.name = name
              self.goals = goals


      class Team:
          def __init__(self, name):
              self.name = name
              self.players = []

          def add(self, player):
              self.players.append(player)

          def total_goals(self):
              return sum(p.goals for p in self.players)

          def top_scorer(self):
              if not self.players:
                  return None
              best = self.players[0]
              for p in self.players:
                  if p.goals > best.goals:
                      best = p
              return best.name
