id: u5-inheritance
title: Inheritance
minutes: 50
objective: |
  Create **subclasses** that inherit attributes and methods from a **base class**, add new behaviour, **override** methods, extend them with `super()`, check types with `isinstance`, and judge when inheritance is the right tool and when composition is better.
outcomes:
  - Define a subclass and explain what it inherits
  - Add new attributes and methods in a subclass
  - Override a method, and extend an inherited method with `super()`
  - Call the base class's `__init__` with `super().__init__(...)`
  - Explain how Python looks up an attribute through the class hierarchy
  - Use the "is a" test and the substitution principle to decide whether inheritance fits

sections:
  - heading: Is-a relationships
    body: |
      Many kinds of thing are special versions of a more general thing. A savings account **is a** bank account (with interest). A manager **is an** employee (with a team). A square **is a** shape. The special version does everything the general one does, plus a bit more, or a bit differently.

      **Inheritance** lets you express this directly: you write a new class **based on** an existing one, and it automatically gets all the existing class's attributes and methods. You then write only what's *different*.

      - The existing, general class is the **base class** (also called the parent class or superclass).
      - The new, specialised class is the **subclass** (child class or derived class).

      > **Analogy:** Biology classifies living things in a hierarchy: a robin is a bird, a bird is an animal. Everything true of all animals (they eat, they move) is true of birds, and everything true of birds (feathers, eggs) is true of robins. Each level adds detail without repeating what's above it.

  - heading: Making a subclass
    body: |
      Put the base class's name in brackets after the new class's name:

      ```python
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def deposit(self, amount):
              self.balance += amount

      class SavingsAccount(Account):
          def add_interest(self, rate):
              self.balance += self.balance * rate
      ```

      `SavingsAccount` has no `__init__` and no `deposit` of its own, yet both work, because it **inherits** them from `Account`:

      ```python
      s = SavingsAccount("Ada", 100)    # uses Account.__init__
      s.deposit(50)                    # uses Account.deposit
      s.add_interest(0.1)              # SavingsAccount's own method
      print(s.balance)                 # 165.0
      ```

      Plain `Account` objects don't get `add_interest`: inheritance flows **down** from base to subclass, never up.

  - heading: How attribute lookup works
    body: |
      When you write `s.deposit(50)`, Python searches for `deposit` in order:

      1. on the object `s` itself (its instance attributes);
      2. in its class, `SavingsAccount`;
      3. in the base class, `Account`;
      4. and so on up the chain, finishing at `object`, the built-in class at the top of every hierarchy.

      The **first** match wins. If nothing matches, you get an `AttributeError`. This simple rule explains everything about inheritance: inherited methods are found further up the chain, and a subclass can **override** a method by defining one with the same name, because its version is found first.

      Every class you write without brackets secretly inherits from `object`, which is where default behaviours like the unhelpful `<__main__.Dog object at 0x...>` come from.

  - heading: Overriding and super()
    body: |
      To change inherited behaviour, define a method with the same name in the subclass. That **overrides** the base version:

      ```python
      class Animal:
          def __init__(self, name):
              self.name = name

          def speak(self):
              return "..."

          def introduce(self):
              return f"{self.name} says {self.speak()}"

      class Dog(Animal):
          def speak(self):
              return "Woof"
      ```

      `Dog("Rex").introduce()` returns `"Rex says Woof"`. Notice what happened: `introduce` is inherited from `Animal`, but when it calls `self.speak()`, `self` is a `Dog`, so the lookup finds `Dog.speak`. Base class code automatically uses the subclass's overrides. This is one of the most powerful ideas in OOP.

      Often you don't want to *replace* the base method, but **extend** it: do what the base does, plus something extra. `super()` gives you access to the base class's version:

      ```python
      class Manager(Employee):
          def __init__(self, name, salary, team):
              super().__init__(name, salary)    # let Employee set name and salary
              self.team = team                  # then add what's new
      ```

      This is the standard pattern for a subclass that needs extra attributes: its `__init__` calls `super().__init__(...)` first, so the base class sets up everything it's responsible for, and then adds its own. Forgetting that call is a classic bug: the object never gets the base class's attributes, and you get an `AttributeError` later.

  - heading: Checking types
    body: |
      `isinstance(obj, SomeClass)` is `True` if `obj` was made from `SomeClass` **or any subclass of it**:

      ```python
      s = SavingsAccount("Ada")
      isinstance(s, SavingsAccount)   # True
      isinstance(s, Account)          # True: a savings account IS an account
      isinstance(Account("Bo"), SavingsAccount)   # False
      ```

      There's also `issubclass(SavingsAccount, Account)` for classes. Use these sparingly: code full of `if isinstance(x, Dog): ... elif isinstance(x, Cat): ...` usually means a method should be overridden instead. The next lesson shows how.

  - heading: When to use inheritance
    body: |
      Inheritance is powerful but easy to overuse. Three tests help:

      1. **"Is a"**: is a `SavingsAccount` really a kind of `Account`? Yes. Is a `Car` a kind of `Engine`? No: a car *has* an engine, so use composition (Lesson 5.5).
      2. **Substitution**: can a subclass object be used **anywhere** a base class object is expected, without surprises? This is the **Liskov substitution principle**. A `SavingsAccount` passed to code that deposits and withdraws behaves like any account: fine. But a subclass that overrides `withdraw` to *always raise* breaks code that expects accounts to allow withdrawals.
      3. **Shallow hierarchies**: one or two levels are usually plenty. Deep chains (A → B → C → D → E) become hard to follow, because a method might be defined at any level.

      A famous trap: mathematically, a square *is a* rectangle. But if `Rectangle` lets you set width and height independently, a `Square` subclass must either break that promise (set one and the other changes too, surprising code written for rectangles) or stop being square. "Is a" in everyday language doesn't always mean "is substitutable" in code.

      > **Key idea:** A widely quoted guideline is **"favour composition over inheritance"**. Use inheritance for genuine, substitutable "is a" relationships, especially when the base class is designed to be extended; use composition for everything else.

      (Python also allows **multiple inheritance**, `class C(A, B):`, inheriting from several bases. It has uses, but it adds complexity; you won't need it in this course.)

examples:
  - title: Inheriting and adding
    intro: A subclass reuses everything and adds one method.
    code: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def deposit(self, amount):
              self.balance += amount

          def __str__(self):
              return f"{self.owner}: {self.balance:.2f}"

      class SavingsAccount(Account):
          def add_interest(self, rate):
              self.balance += self.balance * rate

      s = SavingsAccount("Ada", 100)
      s.deposit(50)
      s.add_interest(0.1)
      print(s)
      print(isinstance(s, Account), isinstance(Account("Bo"), SavingsAccount))
      print(hasattr(Account("Bo"), "add_interest"))
    output: |
      Ada: 165.00
      True False
      False
    lines:
      - line: 12
        note: "`(Account)` makes `SavingsAccount` a subclass of `Account`."
      - line: 16
        note: "No `__init__` in the subclass, so Python finds `Account.__init__` up the chain."
      - line: 19
        note: "Even `__str__` is inherited."
      - line: 20-21
        note: "A savings account is an account, but not the other way round; plain accounts don't get the new method."
  - title: Overriding, and base code calling overrides
    intro: One inherited method, three different results.
    code: |
      class Animal:
          def __init__(self, name):
              self.name = name

          def speak(self):
              return "..."

          def introduce(self):
              return f"{self.name} says {self.speak()}"

      class Dog(Animal):
          def speak(self):
              return "Woof"

      class Cat(Animal):
          def speak(self):
              return "Meow"

      for pet in [Dog("Rex"), Cat("Tom"), Animal("Generic")]:
          print(pet.introduce())
    output: |
      Rex says Woof
      Tom says Meow
      Generic says ...
    lines:
      - line: 8-9
        note: "`introduce` is written once, in the base class, and calls `self.speak()`."
      - line: 12-13
        note: "`Dog` overrides `speak`: its version is found first in the lookup."
      - line: 19-20
        note: "For the dog, `self` is a `Dog`, so the inherited `introduce` calls `Dog.speak`."
  - title: Extending with super()
    intro: A manager is an employee with a team and a bonus.
    code: |
      class Employee:
          def __init__(self, name, salary):
              self.name = name
              self.salary = salary

          def monthly_pay(self):
              return round(self.salary / 12, 2)

          def __str__(self):
              return f"{self.name} earns {self.monthly_pay()} a month"

      class Manager(Employee):
          def __init__(self, name, salary, bonus):
              super().__init__(name, salary)
              self.bonus = bonus
              self.team = []

          def monthly_pay(self):
              return super().monthly_pay() + self.bonus

          def __str__(self):
              return super().__str__() + f" and manages {len(self.team)}"

      dev = Employee("Ada", 60000)
      boss = Manager("Grace", 90000, 500)
      boss.team.append(dev)
      print(dev)
      print(boss)
    output: |
      Ada earns 5000.0 a month
      Grace earns 8000.0 a month and manages 1
    lines:
      - line: 14
        note: "`super().__init__` lets `Employee` set up `name` and `salary`."
      - line: 15-16
        note: "Then the subclass adds its own attributes."
      - line: 18-19
        note: "Extend rather than replace: the base calculation, plus the bonus."
      - line: 21-22
        note: "`super().__str__()` calls the base version, which itself calls `self.monthly_pay()`, finding the manager's version (7500 + 500)."

playground:
  prompt: |
    Add a `Cow` and a `Duck` to the animals. Then give `Animal` a method `speak_twice()` that uses `self.speak()`, and check that it works for every subclass without changing them. What happens if a subclass forgets to call `super().__init__`?
  code: |
    class Animal:
        def __init__(self, name, legs):
            self.name = name
            self.legs = legs

        def speak(self):
            return "..."

        def introduce(self):
            return f"{self.name} ({self.legs} legs) says {self.speak()}"

    class Dog(Animal):
        def __init__(self, name):
            super().__init__(name, 4)

        def speak(self):
            return "Woof"

    class Parrot(Animal):
        def __init__(self, name, phrase):
            super().__init__(name, 2)
            self.phrase = phrase

        def speak(self):
            return self.phrase

    for a in [Dog("Rex"), Parrot("Polly", "Pieces of eight!")]:
        print(a.introduce())

exercises:
  - id: savings-subclass
    title: A savings account
    difficulty: 1
    prompt: |
      Write `SavingsAccount` as a subclass of the provided `Account`. Don't copy any of `Account`'s code. Add:

      - `add_interest(rate)`: increase the balance by `balance * rate`, rounded to 2 decimal places.
      - `projected(years, rate)`: return (without changing anything) what the balance would be after adding interest once a year for `years` years, rounded to 2 places.
    starter: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("Deposit must be positive")
              self.balance += amount


      class SavingsAccount:
          pass
    tests:
      - name: is a subclass
        code: |
          assert issubclass(SavingsAccount, Account), "SavingsAccount should inherit from Account: class SavingsAccount(Account):"
          s = SavingsAccount("Ada", 100)
          s.deposit(50)
          assert s.owner == "Ada" and s.balance == 150, "SavingsAccount should inherit __init__ and deposit"
      - name: add_interest
        code: |
          s = SavingsAccount("Ada", 200)
          s.add_interest(0.05)
          assert s.balance == 210, f"Got {s.balance}"
          s.add_interest(0.1)
          assert s.balance == 231
      - name: projected
        code: |
          s = SavingsAccount("Ada", 1000)
          assert s.projected(2, 0.1) == 1210, f"Got {s.projected(2, 0.1)}"
          assert s.projected(0, 0.1) == 1000
          assert s.balance == 1000, "projected mustn't change the balance"
      - name: no copied code
        code: |
          assert "__init__" not in SavingsAccount.__dict__ and "deposit" not in SavingsAccount.__dict__, "Don't redefine __init__ or deposit: inherit them"
    hints:
      - "Start with `class SavingsAccount(Account):`."
      - "`projected` should use a local variable, e.g. `amount = self.balance`, and loop `years` times multiplying by `1 + rate`."
    solution: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("Deposit must be positive")
              self.balance += amount


      class SavingsAccount(Account):
          def add_interest(self, rate):
              self.balance = round(self.balance + self.balance * rate, 2)

          def projected(self, years, rate):
              amount = self.balance
              for _ in range(years):
                  amount = amount * (1 + rate)
              return round(amount, 2)
    explanation: |
      The subclass is tiny because it only contains what's new. Any improvement to `Account` (say, better validation in `deposit`) automatically applies to savings accounts too.

  - id: animal-sounds
    title: Override to specialise
    difficulty: 1
    prompt: |
      Using the provided `Animal` base class, write three subclasses that **override** `speak` and nothing else: `Dog` (`"Woof"`), `Cat` (`"Meow"`) and `Cow` (`"Moo"`). Then write a function `chorus(animals)` that returns a list of each animal's `introduce()` string.
    starter: |
      class Animal:
          def __init__(self, name):
              self.name = name

          def speak(self):
              return "..."

          def introduce(self):
              return f"{self.name} says {self.speak()}"


      def chorus(animals):
          pass
    tests:
      - name: subclasses
        code: |
          for cls, sound in [(Dog, "Woof"), (Cat, "Meow"), (Cow, "Moo")]:
              assert issubclass(cls, Animal), f"{cls.__name__} should be a subclass of Animal"
              assert cls("X").speak() == sound
              assert "introduce" not in cls.__dict__ and "__init__" not in cls.__dict__, f"{cls.__name__} should only override speak"
      - name: chorus
        code: |
          got = chorus([Dog("Rex"), Cat("Tom"), Cow("Daisy"), Animal("Blob")])
          assert got == ["Rex says Woof", "Tom says Meow", "Daisy says Moo", "Blob says ..."], f"Got {got}"
    hints:
      - "`class Dog(Animal):` with a single method `def speak(self): return \"Woof\"`."
      - "`chorus` is a list comprehension calling `a.introduce()` on each animal."
    solution: |
      class Animal:
          def __init__(self, name):
              self.name = name

          def speak(self):
              return "..."

          def introduce(self):
              return f"{self.name} says {self.speak()}"


      class Dog(Animal):
          def speak(self):
              return "Woof"


      class Cat(Animal):
          def speak(self):
              return "Meow"


      class Cow(Animal):
          def speak(self):
              return "Moo"


      def chorus(animals):
          return [a.introduce() for a in animals]
    explanation: |
      `introduce` was written once in `Animal` and never changed, yet it produces the right sound for every subclass, because `self.speak()` is looked up on the actual object. `chorus` doesn't know or care what kinds of animal it has; that idea is called **polymorphism**, the topic of the next lesson.

  - id: manager-super
    title: Extend with super()
    difficulty: 2
    prompt: |
      Write `Manager` as a subclass of the provided `Employee`:

      - `Manager(name, salary, bonus)` calls `super().__init__` for `name` and `salary`, stores `bonus`, and starts with an empty list `team`.
      - `add_report(employee)` adds an employee to `team`.
      - Override `monthly_pay()` to return the base monthly pay plus the bonus, using `super()`.
      - Override `__str__` to return the base string followed by `" (team of N)"`, using `super()`.
    starter: |
      class Employee:
          def __init__(self, name, salary):
              self.name = name
              self.salary = salary

          def monthly_pay(self):
              return round(self.salary / 12, 2)

          def __str__(self):
              return f"{self.name}: {self.monthly_pay()}"


      class Manager(Employee):
          pass
    tests:
      - name: construction
        code: |
          m = Manager("Grace", 90000, 500)
          assert (m.name, m.salary, m.bonus, m.team) == ("Grace", 90000, 500, []), "Manager should set name, salary, bonus and an empty team"
          assert Manager("A", 1, 1).team is not Manager("B", 1, 1).team
      - name: pay and str
        code: |
          m = Manager("Grace", 90000, 500)
          m.add_report(Employee("Ada", 60000))
          assert m.monthly_pay() == 8000, f"Got {m.monthly_pay()}"
          assert str(m) == "Grace: 8000.0 (team of 1)", f"Got {str(m)!r}"
          assert str(Employee("Ada", 60000)) == "Ada: 5000.0"
      - name: uses super
        code: |
          assert "super()" in source, "Use super() to reuse Employee's code"
          assert source.count("/ 12") <= 1, "Don't repeat the monthly calculation: call super().monthly_pay()"
    hints:
      - "`def __init__(self, name, salary, bonus):` then `super().__init__(name, salary)` before setting `self.bonus` and `self.team`."
      - "`return super().monthly_pay() + self.bonus`."
      - "`return super().__str__() + f\" (team of {len(self.team)})\"`."
    solution: |
      class Employee:
          def __init__(self, name, salary):
              self.name = name
              self.salary = salary

          def monthly_pay(self):
              return round(self.salary / 12, 2)

          def __str__(self):
              return f"{self.name}: {self.monthly_pay()}"


      class Manager(Employee):
          def __init__(self, name, salary, bonus):
              super().__init__(name, salary)
              self.bonus = bonus
              self.team = []

          def add_report(self, employee):
              self.team.append(employee)

          def monthly_pay(self):
              return super().monthly_pay() + self.bonus

          def __str__(self):
              return super().__str__() + f" (team of {len(self.team)})"
    explanation: |
      Notice the chain in `__str__`: `super().__str__()` runs `Employee.__str__`, which calls `self.monthly_pay()`, and since `self` is a `Manager`, that finds the manager's version, including the bonus. Each class contributes its part, and nothing is written twice.

  - id: limited-account
    title: A daily withdrawal limit
    difficulty: 2
    prompt: |
      `Account.withdraw` already checks for positive amounts and enough funds. Write `LimitedAccount(Account)`:

      - `LimitedAccount(owner, balance, daily_limit)` uses `super().__init__` and stores `daily_limit`, plus `withdrawn_today` starting at 0.
      - Override `withdraw(amount)`: raise `ValueError` if this withdrawal would take `withdrawn_today` over the limit; otherwise call `super().withdraw(amount)` (which does the other checks) and **then** add the amount to `withdrawn_today`.
      - `new_day()` resets `withdrawn_today` to 0.
    starter: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("Withdrawal must be positive")
              if amount > self.balance:
                  raise ValueError("Insufficient funds")
              self.balance -= amount


      class LimitedAccount(Account):
          pass
    tests:
      - name: within the limit
        code: |
          a = LimitedAccount("Ada", 1000, 300)
          assert (a.owner, a.balance, a.daily_limit, a.withdrawn_today) == ("Ada", 1000, 300, 0)
          a.withdraw(100); a.withdraw(200)
          assert a.balance == 700 and a.withdrawn_today == 300
      - name: over the limit
        code: |
          a = LimitedAccount("Ada", 1000, 300)
          a.withdraw(250)
          try:
              a.withdraw(60)
              assert False, "Going over the daily limit should raise ValueError"
          except ValueError:
              pass
          assert a.balance == 750 and a.withdrawn_today == 250, "A refused withdrawal changes nothing"
          a.new_day()
          a.withdraw(60)
          assert a.balance == 690 and a.withdrawn_today == 60
      - name: base checks still apply
        code: |
          a = LimitedAccount("Ada", 50, 300)
          for bad in [100, -5]:
              try:
                  a.withdraw(bad)
                  assert False, f"withdraw({bad}) should still be refused by Account's checks"
              except ValueError:
                  pass
          assert a.withdrawn_today == 0, "A withdrawal refused by Account mustn't count towards the limit"
    hints:
      - "In `withdraw`, check `self.withdrawn_today + amount > self.daily_limit` first."
      - "Call `super().withdraw(amount)` before updating `withdrawn_today`: if it raises, the update never happens."
    solution: |
      class Account:
          def __init__(self, owner, balance=0):
              self.owner = owner
              self.balance = balance

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("Withdrawal must be positive")
              if amount > self.balance:
                  raise ValueError("Insufficient funds")
              self.balance -= amount


      class LimitedAccount(Account):
          def __init__(self, owner, balance, daily_limit):
              super().__init__(owner, balance)
              self.daily_limit = daily_limit
              self.withdrawn_today = 0

          def withdraw(self, amount):
              if self.withdrawn_today + amount > self.daily_limit:
                  raise ValueError("Daily limit exceeded")
              super().withdraw(amount)
              self.withdrawn_today += amount

          def new_day(self):
              self.withdrawn_today = 0
    explanation: |
      The subclass adds a rule and reuses all the existing ones via `super()`. The order matters: if `super().withdraw` raises, the line after it never runs, so a refused withdrawal never counts towards the limit. A `LimitedAccount` is still substitutable for an `Account`: it can refuse some withdrawals, but accounts could always refuse withdrawals, so no caller is surprised.

  - id: payroll
    title: A payroll hierarchy
    difficulty: 3
    prompt: |
      Build an employee hierarchy:

      - `Employee(name, salary)`: `monthly_pay()` returns `salary / 12` rounded to 2 places; `role()` returns `"Employee"`; `__str__` returns `"<role>: <name> <monthly pay>"`, e.g. `"Employee: Ada 5000.0"`.
      - `Manager(Employee)`: adds `bonus` (third constructor argument); monthly pay is the base pay plus the bonus; `role()` returns `"Manager"`.
      - `Contractor(Employee)`: constructed as `Contractor(name, hourly_rate, hours)`; it must still call `super().__init__` (pass a salary of 0); monthly pay is `hourly_rate * hours` rounded to 2 places; `role()` returns `"Contractor"`.

      Don't override `__str__` in the subclasses. Then write two functions:

      - `total_payroll(staff)`: the sum of everyone's monthly pay, rounded to 2 places.
      - `count_by_role(staff)`: a dictionary mapping each role to how many staff have it.
    starter: |
      class Employee:
          pass


      class Manager(Employee):
          pass


      class Contractor(Employee):
          pass


      def total_payroll(staff):
          pass


      def count_by_role(staff):
          pass
    tests:
      - name: Employee
        code: |
          e = Employee("Ada", 60000)
          assert e.monthly_pay() == 5000 and e.role() == "Employee"
          assert str(e) == "Employee: Ada 5000.0", f"Got {str(e)!r}"
      - name: Manager
        code: |
          m = Manager("Grace", 90000, 500)
          assert isinstance(m, Employee) and m.bonus == 500
          assert m.monthly_pay() == 8000 and str(m) == "Manager: Grace 8000.0", f"Got {str(m)!r}"
      - name: Contractor
        code: |
          c = Contractor("Linus", 40, 100)
          assert isinstance(c, Employee) and c.name == "Linus" and c.salary == 0
          assert c.monthly_pay() == 4000 and str(c) == "Contractor: Linus 4000", f"Got {str(c)!r}"
      - name: payroll functions
        code: |
          staff = [Employee("Ada", 60000), Manager("Grace", 90000, 500), Contractor("Linus", 40, 100), Employee("Alan", 30000)]
          assert total_payroll(staff) == 19500, f"Got {total_payroll(staff)}"
          assert count_by_role(staff) == {"Employee": 2, "Manager": 1, "Contractor": 1}, f"Got {count_by_role(staff)}"
          assert total_payroll([]) == 0 and count_by_role([]) == {}
      - name: shared __str__
        code: |
          assert "__str__" not in Manager.__dict__ and "__str__" not in Contractor.__dict__, "Subclasses should inherit __str__, overriding role() and monthly_pay() instead"
    hints:
      - "`Employee.__str__` should call `self.role()` and `self.monthly_pay()`, so subclasses only need to override those two methods."
      - "`Contractor.__init__(self, name, hourly_rate, hours)`: `super().__init__(name, 0)`, then store the rate and hours."
      - "`count_by_role` is the counting pattern from Lesson 3.6, keyed on `person.role()`."
    solution: |
      class Employee:
          def __init__(self, name, salary):
              self.name = name
              self.salary = salary

          def monthly_pay(self):
              return round(self.salary / 12, 2)

          def role(self):
              return "Employee"

          def __str__(self):
              return f"{self.role()}: {self.name} {self.monthly_pay()}"


      class Manager(Employee):
          def __init__(self, name, salary, bonus):
              super().__init__(name, salary)
              self.bonus = bonus

          def monthly_pay(self):
              return super().monthly_pay() + self.bonus

          def role(self):
              return "Manager"


      class Contractor(Employee):
          def __init__(self, name, hourly_rate, hours):
              super().__init__(name, 0)
              self.hourly_rate = hourly_rate
              self.hours = hours

          def monthly_pay(self):
              return round(self.hourly_rate * self.hours, 2)

          def role(self):
              return "Contractor"


      def total_payroll(staff):
          return round(sum(person.monthly_pay() for person in staff), 2)


      def count_by_role(staff):
          counts = {}
          for person in staff:
              counts[person.role()] = counts.get(person.role(), 0) + 1
          return counts
    explanation: |
      The base class's `__str__` is a **template**: it fixes the overall format and calls methods (`role`, `monthly_pay`) that subclasses fill in. The payroll functions treat everyone the same way, simply calling `monthly_pay()`, and each object supplies the right calculation. No `isinstance` checks were needed anywhere. (Is a contractor really "an employee"? Legally, no! In a real system you might instead have a general `Worker` base class; naming hierarchies well takes thought.)

commonMistakes:
  - title: Forgetting super().__init__
    explanation: |
      If a subclass defines `__init__` but doesn't call `super().__init__(...)`, the base class's attributes are never created, and inherited methods fail with AttributeError.
  - title: Copying base class code into the subclass
    explanation: |
      Re-implementing a calculation the base already does defeats the purpose and lets the two drift apart. Call `super().method()` and add only the difference.
  - title: Inheriting for a has-a relationship
    explanation: |
      `class Car(Engine)` claims a car *is* an engine, and gives cars every engine method. A car *has* an engine: use composition.
  - title: Overrides that break the base class's promises
    explanation: |
      A subclass should be usable wherever the base class is expected (the substitution principle). Overriding a method to do something unrelated, or to always fail, breaks code written for the base class.
  - title: Type-checking instead of overriding
    explanation: |
      Long `if isinstance(x, A): ... elif isinstance(x, B): ...` chains are usually better replaced by a method that each subclass overrides.

summary:
  - "**Inheritance** models \"is a\": `class SavingsAccount(Account):` gets all of `Account`'s attributes and methods."
  - "Python looks up attributes on the object, then its class, then each base class in turn, up to `object`. The first match wins."
  - "A subclass **overrides** a method by redefining it. Base class code that calls `self.method()` uses the subclass's version."
  - "`super()` reaches the base version, to **extend** rather than replace: `super().__init__(...)` sets up inherited attributes."
  - "`isinstance(obj, Base)` is true for subclass objects too."
  - "Use inheritance only for genuine, substitutable \"is a\" relationships, and keep hierarchies shallow. Favour composition otherwise."
next: |
  You saw in this lesson that one piece of code, like `introduce` or `total_payroll`, can work on many different classes as long as each provides the right methods. That idea, **polymorphism**, is the heart of object-oriented design. **Lesson 5.7** explores it: abstract base classes, interfaces, and Python's relaxed "duck typing".

quiz:
  - type: mcq
    question: "Given `class SavingsAccount(Account):`, which statement is true?"
    options:
      - Account inherits SavingsAccount's methods
      - SavingsAccount inherits Account's methods and attributes
      - They share nothing
      - SavingsAccount must redefine every Account method
    answer: 1
    explanation: Inheritance flows from the base class down to the subclass.
  - type: mcq
    question: "When you call `obj.method()`, where does Python look first?"
    options: ["The base class", "The object itself, then its class, then base classes in order", "The `object` class", "A random class in the hierarchy"]
    answer: 1
    explanation: The first match up the chain wins, which is why overrides take effect.
  - type: mcq
    question: "`Animal.introduce` calls `self.speak()`. `Dog` overrides `speak`. What does `Dog(\"Rex\").introduce()` use?"
    options: ["Animal.speak", "Dog.speak", "Both", "Neither: it raises an error"]
    answer: 1
    explanation: "`self` is a Dog, so the lookup for `speak` finds `Dog.speak` first."
  - type: mcq
    question: "A subclass defines `__init__` but forgets `super().__init__(...)`. What usually happens?"
    options:
      - Python calls the base `__init__` automatically anyway
      - Attributes the base class would have set are missing, causing AttributeError later
      - The class can't be created
      - Nothing; it's fine
    answer: 1
    explanation: Python only runs the `__init__` it finds first; the base version must be called explicitly.
  - type: mcq
    question: "With `class Manager(Employee):`, what is `isinstance(Manager(...), Employee)`?"
    options: ["True", "False", "An error", "Depends on the attributes"]
    answer: 0
    explanation: Objects of a subclass are instances of the base class too.
  - type: mcq
    question: Which is the best use of inheritance?
    options:
      - "`class Car(Engine)`"
      - "`class Library(Book)`"
      - "`class SavingsAccount(Account)`"
      - "`class Playlist(Song)`"
    answer: 2
    explanation: A savings account genuinely is an account; the others are "has a" relationships.
  - type: code
    question: |
      A `Rectangle(width, height)` class with an `area()` method is provided. Write `Square(Rectangle)` whose constructor takes a single `side` and uses `super().__init__` to set both width and height. Don't redefine `area`.
    starter: |
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          def area(self):
              return self.width * self.height


      class Square(Rectangle):
          pass
    tests:
      - name: Square works
        code: |
          s = Square(4)
          assert (s.width, s.height) == (4, 4) and s.area() == 16
          assert isinstance(s, Rectangle)
          assert "area" not in Square.__dict__, "Inherit area rather than redefining it"
          assert "super()" in source, "Use super().__init__"
    solution: |
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          def area(self):
              return self.width * self.height


      class Square(Rectangle):
          def __init__(self, side):
              super().__init__(side, side)
