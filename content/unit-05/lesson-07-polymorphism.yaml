    question: What is duck typing?
    options:
      - Checking an object's class before using it
      - Using an object based on the methods it has, not its class
      - A type of inheritance
      - A way to convert between types
    answer: 1
    explanation: "\"If it quacks like a duck...\": any object with the right methods will do."
  - type: mcq
    question: "`print(\"hi\", file=x)` works if `x` has which method?"
    options: ["__str__", "write", "print", "__file__"]
    answer: 1
