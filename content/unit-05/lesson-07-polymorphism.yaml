  - type: mcq
    question: "In an expression tree, how does `Add.evaluate()` compute its value?"
    options:
      - It parses a string
      - It calls `evaluate()` on its left and right children and adds the results
      - It loops over all numbers in the program
      - It uses `isinstance` to check each child's type
    answer: 1
    explanation: Each node relies on its children's `evaluate`, recursing down to the numbers.
  - type: code
    question: |
      Write classes `Circle(r)` and `Square(side)`, each with an `area()` method (use 3.14159 for π), and a function `largest(shapes)` that returns the shape object with the biggest area, without any type checks.
    starter: |
      class Circle:
          pass


      class Square:
          pass


      def largest(shapes):
          pass
    tests:
      - name: largest works
        code: |
          c, s1, s2 = Circle(1), Square(2), Square(1)
          assert abs(c.area() - 3.14159) < 1e-9 and s1.area() == 4
          assert largest([c, s1, s2]) is s1
          big = Circle(3)
          assert largest([s1, big, c]) is big
    solution: |
      class Circle:
          def __init__(self, r):
              self.r = r

          def area(self):
              return 3.14159 * self.r ** 2


      class Square:
          def __init__(self, side):
              self.side = side

          def area(self):
              return self.side ** 2


      def largest(shapes):
          best = shapes[0]
          for s in shapes:
              if s.area() > best.area():
                  best = s
          return best
