id: u5-polymorphism
title: Polymorphism and Interfaces
minutes: 50
objective: |
  Write code that works on many different classes through a shared **interface** (**polymorphism**), define that interface with an **abstract base class**, use Python's **duck typing**, and replace long `if`/`elif` type checks with objects that each know how to do their own job.
outcomes:
  - Explain polymorphism and why it makes code easier to extend
  - Write an abstract base class whose methods subclasses must provide
  - Use `abc.ABC` and `@abstractmethod` to stop incomplete classes being created
  - Explain duck typing and use it with your own classes and Python's protocols
  - Refactor type-checking conditionals into polymorphic method calls
  - Build a recursive structure of polymorphic objects (an expression tree)

sections:
  - heading: One interface, many forms
    body: |
      **Polymorphism** (Greek for "many forms") means one piece of code can work with objects of many different types, as long as they all support the operations it uses. You've seen it already:

      - `len()` works on strings, lists, dictionaries and your own `Playlist` (Lesson 5.3).
      - `total_payroll` (Lesson 5.6) added up the pay of employees, managers and contractors without knowing which was which.
      - `for` loops work on anything iterable.

      The set of methods that code relies on is called an **interface**. `total_payroll` relies on one method, `monthly_pay()`. Any object with that method can be passed in, **including classes written years later** by someone who never saw `total_payroll`'s code.

      > **Analogy:** A wall socket defines an interface: two or three pins of a certain shape. Kettles, laptops and lamps all work in it, and inventors keep making new appliances that work too, without anyone rewiring the house. The socket doesn't know or care what's plugged in.

      This is the big payoff of object-oriented programming: **you can add new kinds of things without changing the code that uses them.**

  - heading: Replacing conditionals with polymorphism
    body: |
      Here's code without polymorphism: shapes stored as dictionaries, with a function that checks the kind:

      ```python
      def area(shape):
          if shape["kind"] == "circle":
              return 3.14159 * shape["r"] ** 2
          elif shape["kind"] == "rectangle":
              return shape["w"] * shape["h"]
          elif shape["kind"] == "triangle":
              ...
      ```

      Every function that handles shapes (`area`, `perimeter`, `draw`, `save`...) has its own `if`/`elif` chain. Adding a hexagon means finding and editing **every one of them**, and missing one is a bug.

      With polymorphism, each class carries its own version:

      ```python
      class Circle:
          def __init__(self, r):
              self.r = r
          def area(self):
              return 3.14159 * self.r ** 2

      class Rectangle:
          def __init__(self, w, h):
              self.w, self.h = w, h
          def area(self):
              return self.w * self.h

      total = sum(s.area() for s in shapes)    # no ifs at all
      ```

      Adding a hexagon now means writing **one new class**, and nothing else changes. Everything about hexagons lives in one place. This is sometimes summed up as the **open/closed principle**: code should be *open for extension* (new classes can be added) but *closed for modification* (existing code needn't change).

  - heading: Abstract base classes
    body: |
      To make the shared interface explicit, define a base class that **declares** the methods without implementing them. Such a class is called **abstract**: it exists to be inherited, never to be used directly.

      The simplest approach raises `NotImplementedError`:

      ```python
      class Shape:
          def area(self):
              raise NotImplementedError("subclasses must implement area")

          def describe(self):
              return f"{type(self).__name__} with area {self.area():.2f}"
      ```

      `describe` is **concrete**: it works for any shape, because it only relies on `area()`. Subclasses fill in `area` and get `describe` for free. (`type(self).__name__` is the name of the object's actual class, such as `"Circle"`.)

      Python's standard library has a stricter tool in the `abc` module ("abstract base classes"):

      ```python
      from abc import ABC, abstractmethod

      class Shape(ABC):
          @abstractmethod
          def area(self):
              ...
      ```

      Now Python refuses to create a `Shape`, **or any subclass that hasn't implemented every abstract method**: `Shape()` raises `TypeError: Can't instantiate abstract class Shape...`. The mistake is caught the moment someone tries to create an incomplete object, rather than later when `area` is finally called. (`from abc import ...` loads names from a **module**; Lesson 5.8 explains modules properly. The `...` is Python's "nothing here" placeholder, like `pass`.)

  - heading: Duck typing
    body: |
      Languages like Java require a class to formally declare which interfaces it implements. Python is more relaxed. It uses **duck typing**, from the saying *"If it walks like a duck and quacks like a duck, then it's a duck."*

      Python never checks what class an object is when you call a method. It just tries the method. If the object has it, it works:

      ```python
      class Duck:
          def speak(self):
              return "Quack"

      class Robot:
          def speak(self):
              return "Beep"

      for thing in [Duck(), Robot()]:
          print(thing.speak())
      ```

      `Duck` and `Robot` share no base class, yet the loop works for both. Inheritance from a common base is **optional** in Python; what matters is having the right methods.

      Python's built-in **protocols** work this way too. Anything with `__len__` works with `len()`; anything with `__iter__` or `__getitem__` works in a `for` loop; anything with a `write` method can be passed where a file is expected:

      ```python
      class Shout:
          def write(self, text):
              print(text.upper(), end="")

      print("hello", file=Shout())    # HELLO
      ```

      `print` doesn't check that its `file` is really a file; it just calls `.write()`. That's duck typing.

      So when should you write an abstract base class? Use one when it adds value: it documents the interface in one place, can provide shared concrete methods (like `describe`), and with `abc` it catches incomplete subclasses early. For small, informal interfaces, duck typing alone is perfectly Pythonic.

  - heading: Polymorphism and recursion together
    body: |
      Polymorphism really shines with **recursive structures** (Lesson 4.6). Consider an arithmetic expression like `(2 + 3) * 4`. It can be represented as a **tree** of objects: a multiplication node whose left child is an addition node (with children 2 and 3) and whose right child is the number 4.

      ```text
            *
           / \
          +   4
         / \
        2   3
      ```

      Give every node class an `evaluate()` method. A number returns itself. An addition node evaluates its two children and adds the results; a multiplication node multiplies them. Each node only needs to know about *itself*; the recursion and the polymorphism together do the rest. This is exactly how compilers and interpreters (Lesson 1.6) represent and run programs: as **syntax trees** of node objects, each with an `evaluate` or `compile` method. You'll build one in the last exercise.

examples:
  - title: An abstract shape with concrete helpers
    intro: Subclasses implement one method and inherit the rest.
    code: |
      class Shape:
          def area(self):
              raise NotImplementedError("subclasses must implement area")

          def describe(self):
              return f"{type(self).__name__} with area {self.area():.2f}"

      class Circle(Shape):
          def __init__(self, r):
              self.r = r

          def area(self):
              return 3.14159 * self.r ** 2

      class Rectangle(Shape):
          def __init__(self, w, h):
              self.w, self.h = w, h

          def area(self):
              return self.w * self.h

      shapes = [Circle(1), Rectangle(3, 4), Circle(2)]
      for s in shapes:
          print(s.describe())
      print("Total:", round(sum(s.area() for s in shapes), 2))
      try:
          Shape().area()
      except NotImplementedError as err:
          print("Error:", err)
    output: |
      Circle with area 3.14
      Rectangle with area 12.00
      Circle with area 12.57
      Total: 27.71
      Error: subclasses must implement area
    lines:
      - line: 2-3
        note: "The abstract method declares the interface; calling it on a plain `Shape` is an error."
      - line: 5-6
        note: "A concrete method built on the abstract one. `type(self).__name__` gives the real class's name."
      - line: 22-24
        note: "The loop and the sum don't care which kind of shape each one is."
  - title: abc enforces the interface
    intro: Incomplete classes can't even be created.
    code: |
      from abc import ABC, abstractmethod

      class Payment(ABC):
          @abstractmethod
          def pay(self, amount):
              ...

      class Card(Payment):
          def pay(self, amount):
              return f"Charged {amount} to card"

      class Broken(Payment):
          def refund(self, amount):
              return "refunded"

      print(Card().pay(20))
      for cls in [Payment, Broken]:
          try:
              cls()
          except TypeError:
              print("Can't create", cls.__name__)
    output: |
      Charged 20 to card
      Can't create Payment
      Can't create Broken
    lines:
      - line: 1
        note: "Import `ABC` and `abstractmethod` from the standard library's `abc` module."
      - line: 3-6
        note: "Inheriting from `ABC` and marking `pay` abstract means every concrete payment type must define `pay`."
      - line: 12-14
        note: "`Broken` forgot `pay`, so Python refuses to create it, before any bug can happen."
  - title: Duck typing
    intro: No shared base class needed, just the right method.
    code: |
      class Duck:
          def speak(self):
              return "Quack"

      class Robot:
          def speak(self):
              return "Beep boop"

      class Person:
          def __init__(self, name):
              self.name = name

          def speak(self):
              return f"Hi, I'm {self.name}"

      for thing in [Duck(), Robot(), Person("Ada")]:
          print(thing.speak())

      class Collector:
          def __init__(self):
              self.parts = []

          def write(self, text):
              self.parts.append(text)

      c = Collector()
      print("Saved", "to", "a", "list", file=c)
      print(c.parts)
    output: |
      Quack
      Beep boop
      Hi, I'm Ada
      ['Saved', ' ', 'to', ' ', 'a', ' ', 'list', '\n']
    lines:
      - line: 16-17
        note: "Three unrelated classes, one loop: all that matters is that each has `speak()`."
      - line: 19-24
        note: "A class with a `write` method can stand in for a file."
      - line: 27
        note: "`print` calls `c.write` for each piece, including the separators and the final newline."

playground:
  prompt: |
    Add a `Triangle(a, b, c)` shape using Heron's formula (s = (a + b + c) / 2, area = √(s(s−a)(s−b)(s−c))). Notice that you don't need to change the loop at all. Then try making `Shape` inherit from `ABC` with an abstract `area`, and create a subclass that forgets to define it.
  code: |
    class Shape:
        def area(self):
            raise NotImplementedError

        def describe(self):
            return f"{type(self).__name__}: {self.area():.2f}"

    class Square(Shape):
        def __init__(self, side):
            self.side = side

        def area(self):
            return self.side ** 2

    shapes = [Square(2), Square(5)]
    for s in sorted(shapes, key=lambda s: s.area(), reverse=True):
        print(s.describe())

exercises:
  - id: shape-family
    title: A family of shapes
    difficulty: 1
    prompt: |
      Using the provided abstract `Shape`, write three subclasses, each implementing `area()` and `perimeter()`:

      - `Circle(r)` (use the provided `PI`),
      - `Rectangle(w, h)`,
      - `Triangle(a, b, c)` (the three side lengths), using **Heron's formula**: s = (a + b + c) / 2, area = √(s(s − a)(s − b)(s − c)).

      Then write `total_area(shapes)` returning the sum of the areas rounded to 2 places. Don't use any `if` or `isinstance` in `total_area`.
    starter: |
      PI = 3.14159


      class Shape:
          def area(self):
              raise NotImplementedError

          def perimeter(self):
              raise NotImplementedError

          def describe(self):
              return f"{type(self).__name__}: area {self.area():.2f}, perimeter {self.perimeter():.2f}"


      def total_area(shapes):
          pass
    tests:
      - name: each shape
        code: |
          c, r, t = Circle(1), Rectangle(3, 4), Triangle(3, 4, 5)
          assert all(isinstance(x, Shape) for x in (c, r, t)), "Each class should inherit from Shape"
          assert abs(c.area() - 3.14159) < 1e-9 and abs(c.perimeter() - 6.28318) < 1e-9
          assert r.area() == 12 and r.perimeter() == 14
          assert abs(t.area() - 6) < 1e-9 and t.perimeter() == 12
      - name: describe is inherited
        code: |
          assert Rectangle(3, 4).describe() == "Rectangle: area 12.00, perimeter 14.00"
          assert Triangle(3, 4, 5).describe() == "Triangle: area 6.00, perimeter 12.00"
      - name: total_area
        code: |
          assert total_area([Circle(1), Rectangle(3, 4), Triangle(3, 4, 5)]) == 21.14, f"Got {total_area([Circle(1), Rectangle(3, 4), Triangle(3, 4, 5)])}"
          assert total_area([]) == 0
          import ast
          node = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == "total_area"][0]
          body = ast.get_source_segment(source, node)
          assert "if " not in body and "isinstance" not in body, "total_area shouldn't need to check types"
    hints:
      - "`class Circle(Shape):` with `__init__` storing `r`, and `area` returning `PI * self.r ** 2`."
      - "In `Triangle.area`, compute `s` first, then `(s * (s - a) * (s - b) * (s - c)) ** 0.5`."
      - "`total_area`: `round(sum(s.area() for s in shapes), 2)`."
    solution: |
      PI = 3.14159


      class Shape:
          def area(self):
              raise NotImplementedError

          def perimeter(self):
              raise NotImplementedError

          def describe(self):
              return f"{type(self).__name__}: area {self.area():.2f}, perimeter {self.perimeter():.2f}"


      class Circle(Shape):
          def __init__(self, r):
              self.r = r

          def area(self):
              return PI * self.r ** 2

          def perimeter(self):
              return 2 * PI * self.r


      class Rectangle(Shape):
          def __init__(self, w, h):
              self.w = w
              self.h = h

          def area(self):
              return self.w * self.h

          def perimeter(self):
              return 2 * (self.w + self.h)


      class Triangle(Shape):
          def __init__(self, a, b, c):
              self.a, self.b, self.c = a, b, c

          def area(self):
              s = (self.a + self.b + self.c) / 2
              return (s * (s - self.a) * (s - self.b) * (s - self.c)) ** 0.5

          def perimeter(self):
              return self.a + self.b + self.c


      def total_area(shapes):
          return round(sum(s.area() for s in shapes), 2)
    explanation: |
      Each class knows its own formulas, `describe` is written once in the base, and `total_area` works on any shape, including ones not yet invented. Adding a `Hexagon` later touches nothing but the new class.

  - id: shipping-refactor
    title: Replace the if-chain
    difficulty: 2
    prompt: |
      The function `shipping_cost(method, weight)` uses an `if`/`elif` chain on strings. Replace it with **classes**: `Standard`, `Express` and `Collection`, each with a method `cost(weight)` following the same rules, and a method `name()` returning `"Standard"`, `"Express"` or `"Collection"`.

      Then write `cheapest(methods, weight)` that returns the **name** of the cheapest method for that weight (the first one listed if there's a tie), with no type checks.
    starter: |
      def shipping_cost(method, weight):
          if method == "standard":
              return 3.0 + 0.5 * weight
          elif method == "express":
              return max(8.0, 2.0 * weight)
          elif method == "collection":
              return 0.0 if weight <= 20 else 5.0
          raise ValueError(method)


      def cheapest(methods, weight):
          pass
    tests:
      - name: costs match the old rules
        code: |
          for w in [0, 1, 4, 10, 20, 21, 50]:
              assert Standard().cost(w) == 3.0 + 0.5 * w, f"Standard().cost({w})"
              assert Express().cost(w) == max(8.0, 2.0 * w), f"Express().cost({w})"
              assert Collection().cost(w) == (0.0 if w <= 20 else 5.0), f"Collection().cost({w})"
      - name: names
        code: |
          assert [m.name() for m in (Standard(), Express(), Collection())] == ["Standard", "Express", "Collection"]
      - name: cheapest
        code: |
          assert cheapest([Standard(), Express()], 2) == "Standard", "3 + 1 = 4 beats 8"
          assert cheapest([Standard(), Express(), Collection()], 30) == "Collection"
          assert cheapest([Express(), Standard()], 10) == "Standard"
          assert cheapest([Express(), Standard()], 10 / 3 * 2) == "Standard"
      - name: no if-chain
        code: |
          import ast
          node = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == "cheapest"][0]
          body = ast.get_source_segment(source, node)
          assert "isinstance" not in body and "==" not in body, "cheapest should call cost() rather than checking types"
    hints:
      - "Each class needs no `__init__`; just `def cost(self, weight):` and `def name(self):`."
      - "`cheapest`: keep the best method so far and replace it only when another is strictly cheaper (`<`), or use `min` with a key function."
    solution: |
      class Standard:
          def cost(self, weight):
              return 3.0 + 0.5 * weight

          def name(self):
              return "Standard"


      class Express:
          def cost(self, weight):
              return max(8.0, 2.0 * weight)

          def name(self):
              return "Express"


      class Collection:
          def cost(self, weight):
              return 0.0 if weight <= 20 else 5.0

          def name(self):
              return "Collection"


      def cheapest(methods, weight):
          best = methods[0]
          for m in methods[1:]:
              if m.cost(weight) < best.cost(weight):
                  best = m
          return best.name()
    explanation: |
      The rules for each method now live in their own class, and `cheapest` works for any list of objects with `cost` and `name`, including a new `Drone` method someone adds next year. These classes share no base class: that's duck typing. (Python's `min` keeps the first of equal items, so `min(methods, key=...)` would also work.)

  - id: duck-writers
    title: Anything with write()
    difficulty: 2
    prompt: |
      The function `report(out, items)` writes a short report by calling `out.write(...)`, so it works with real files. Write two classes that can **also** be passed as `out`, without changing `report`:

      - `ListWriter`: collects every string written in a list attribute `parts`; `text()` returns them joined into one string.
      - `CountingWriter`: doesn't store the text, but counts `lines` (the number of `"\n"` characters written) and `chars` (total characters written).
    starter: |
      def report(out, items):
          out.write("REPORT\n")
          for name, qty in items:
              out.write(f"{name}: {qty}\n")
          out.write(f"Total: {sum(q for n, q in items)}\n")
    tests:
      - name: ListWriter
        code: |
          w = ListWriter()
          report(w, [("apples", 3), ("pears", 5)])
          assert w.text() == "REPORT\napples: 3\npears: 5\nTotal: 8\n", f"Got {w.text()!r}"
          assert len(w.parts) == 4
      - name: CountingWriter
        code: |
          c = CountingWriter()
          report(c, [("apples", 3), ("pears", 5)])
          assert (c.lines, c.chars) == (4, 35), f"Got lines={c.lines}, chars={c.chars}"
      - name: works with print too
        code: |
          w = ListWriter()
          print("a", "b", file=w)
          assert w.text() == "a b\n", f"Got {w.text()!r}"
          assert ListWriter().parts == []
    hints:
      - "Each class only needs `__init__` and `write(self, text)`."
      - "`CountingWriter.write` adds `len(text)` to `chars` and `text.count(\"\\n\")` to `lines`."
    solution: |
      def report(out, items):
          out.write("REPORT\n")
          for name, qty in items:
              out.write(f"{name}: {qty}\n")
          out.write(f"Total: {sum(q for n, q in items)}\n")


      class ListWriter:
          def __init__(self):
              self.parts = []

          def write(self, text):
              self.parts.append(text)

          def text(self):
              return "".join(self.parts)


      class CountingWriter:
          def __init__(self):
              self.lines = 0
              self.chars = 0

          def write(self, text):
              self.chars += len(text)
              self.lines += text.count("\n")
    explanation: |
      `report` (and Python's own `print`) only ever call `.write()`, so any object with that method fits. `ListWriter` is genuinely useful for testing: you can check exactly what a function would have written to a file without creating one. Python's standard library offers the same idea as `io.StringIO`.

  - id: abc-payments
    title: Abstract payments
    difficulty: 2
    prompt: |
      Use the `abc` module to define an abstract class `Payment` with an abstract method `pay(amount)` and a **concrete** method `receipt(amount)` that calls `pay` and returns `"Receipt: " + <what pay returned>`.

      Then write three concrete subclasses:

      - `CardPayment(last4)`: `pay` returns `"<amount> charged to card ending <last4>"`.
      - `CashPayment(tendered)`: `pay` raises `ValueError` if `tendered < amount`, otherwise returns `"<amount> paid in cash, change <tendered - amount>"`.
      - `VoucherPayment(balance)`: `pay` takes the amount off the voucher's `balance` (raise `ValueError` if there isn't enough) and returns `"<amount> paid by voucher, <new balance> left"`.
    starter: |
      from abc import ABC, abstractmethod


      class Payment(ABC):
          pass
    tests:
      - name: Payment is abstract
        code: |
          try:
              Payment()
              assert False, "Payment() should raise TypeError: it's abstract"
          except TypeError:
              pass
          class Incomplete(Payment):
              pass
          try:
              Incomplete()
              assert False, "A subclass without pay() shouldn't be creatable. Mark pay with @abstractmethod."
          except TypeError:
              pass
      - name: card and cash
        code: |
          assert CardPayment("4242").pay(30) == "30 charged to card ending 4242"
          assert CashPayment(50).receipt(30) == "Receipt: 30 paid in cash, change 20", f"Got {CashPayment(50).receipt(30)!r}"
          try:
              CashPayment(10).pay(30)
              assert False, "Not enough cash should raise ValueError"
          except ValueError:
              pass
      - name: voucher
        code: |
          v = VoucherPayment(50)
          assert v.pay(20) == "20 paid by voucher, 30 left"
          assert v.receipt(30) == "Receipt: 30 paid by voucher, 0 left"
          try:
              v.pay(1)
              assert False, "An empty voucher should raise ValueError"
          except ValueError:
              pass
          assert all(isinstance(p, Payment) for p in (CardPayment("1"), CashPayment(1), v))
    hints:
      - "In `Payment(ABC)`, decorate `def pay(self, amount): ...` with `@abstractmethod`."
      - "`receipt(self, amount)` is an ordinary method: `return \"Receipt: \" + self.pay(amount)`."
    solution: |
      from abc import ABC, abstractmethod


      class Payment(ABC):
          @abstractmethod
          def pay(self, amount):
              ...

          def receipt(self, amount):
              return "Receipt: " + self.pay(amount)


      class CardPayment(Payment):
          def __init__(self, last4):
              self.last4 = last4

          def pay(self, amount):
              return f"{amount} charged to card ending {self.last4}"


      class CashPayment(Payment):
          def __init__(self, tendered):
              self.tendered = tendered

          def pay(self, amount):
              if self.tendered < amount:
                  raise ValueError("Not enough cash")
              return f"{amount} paid in cash, change {self.tendered - amount}"


      class VoucherPayment(Payment):
          def __init__(self, balance):
              self.balance = balance

          def pay(self, amount):
              if amount > self.balance:
                  raise ValueError("Not enough on the voucher")
              self.balance -= amount
              return f"{amount} paid by voucher, {self.balance} left"
    explanation: |
      The abstract class does two jobs: it **enforces** that every payment type has `pay` (an incomplete class can't be created), and it **shares** `receipt`, written once. A checkout can accept any `Payment` and call `receipt` without knowing which kind it is.

  - id: expression-tree
    title: An expression tree
    difficulty: 3
    prompt: |
      Represent arithmetic expressions as trees of objects. Write four classes, each with `evaluate()` and `__str__`:

      - `Num(value)`: evaluates to `value`; prints as the number, e.g. `"4"`.
      - `Add(left, right)`, `Mul(left, right)` and `Sub(left, right)`, where `left` and `right` are themselves expressions (any of the four classes). `evaluate()` evaluates both sides and combines the results. `__str__` returns the fully bracketed form, e.g. `"(2 + 3)"`.

      Every class also needs a method `size()` returning the number of nodes in its tree (a `Num` is 1; an operator is 1 plus the sizes of both sides).

      ```python
      e = Mul(Add(Num(2), Num(3)), Num(4))
      e.evaluate()   # 20
      str(e)         # "((2 + 3) * 4)"
      e.size()       # 5
      ```
    starter: |
      class Num:
          def __init__(self, value):
              self.value = value


      class Add:
          def __init__(self, left, right):
              self.left = left
              self.right = right
    tests:
      - name: numbers
        code: |
          assert Num(7).evaluate() == 7 and str(Num(7)) == "7" and Num(7).size() == 1
      - name: one operator
        code: |
          assert Add(Num(2), Num(3)).evaluate() == 5 and str(Add(Num(2), Num(3))) == "(2 + 3)"
          assert Mul(Num(2), Num(3)).evaluate() == 6 and str(Mul(Num(2), Num(3))) == "(2 * 3)"
          assert Sub(Num(2), Num(3)).evaluate() == -1 and str(Sub(Num(2), Num(3))) == "(2 - 3)"
      - name: nested
        code: |
          e = Mul(Add(Num(2), Num(3)), Num(4))
          assert e.evaluate() == 20, f"Got {e.evaluate()}"
          assert str(e) == "((2 + 3) * 4)", f"Got {str(e)!r}"
          assert e.size() == 5
          f = Sub(Num(10), Mul(Num(2), Add(Num(1), Num(3))))
          assert f.evaluate() == 2 and str(f) == "(10 - (2 * (1 + 3)))" and f.size() == 7
      - name: deep tree
        code: |
          e = Num(0)
          for i in range(1, 101):
              e = Add(e, Num(i))
          assert e.evaluate() == 5050 and e.size() == 201
    hints:
      - "`Num.evaluate` returns `self.value`; `Add.evaluate` returns `self.left.evaluate() + self.right.evaluate()`. The recursion stops at the `Num` objects."
      - "`__str__` for `Add`: `f\"({self.left} + {self.right})\"`. The f-string calls `str()` on each side, which recurses."
      - "To avoid writing three nearly identical classes, you could make a base class `BinOp` with `__init__`, `size` and `__str__` using a class attribute `SYMBOL`, and give each subclass its `SYMBOL` and a `combine(a, b)` method."
    solution: |
      class Num:
          def __init__(self, value):
              self.value = value

          def evaluate(self):
              return self.value

          def size(self):
              return 1

          def __str__(self):
              return str(self.value)


      class BinOp:
          SYMBOL = "?"

          def __init__(self, left, right):
              self.left = left
              self.right = right

          def combine(self, a, b):
              raise NotImplementedError

          def evaluate(self):
              return self.combine(self.left.evaluate(), self.right.evaluate())

          def size(self):
              return 1 + self.left.size() + self.right.size()

          def __str__(self):
              return f"({self.left} {self.SYMBOL} {self.right})"


      class Add(BinOp):
          SYMBOL = "+"

          def combine(self, a, b):
              return a + b


      class Sub(BinOp):
          SYMBOL = "-"

          def combine(self, a, b):
              return a - b


      class Mul(BinOp):
          SYMBOL = "*"

          def combine(self, a, b):
              return a * b
    explanation: |
      Every node answers `evaluate`, `size` and `__str__` for itself, asking its children for their answers: recursion (Unit 4) driven by polymorphism. The `BinOp` base class holds everything the operators share, and each subclass adds only a symbol and a one-line `combine`, so a `Div` or `Pow` class is three lines. This is the core of every interpreter and compiler: programs are parsed into trees like this one, then evaluated or translated node by node (Lesson 1.6, and Unit 15).

commonMistakes:
  - title: Type-checking instead of calling a method
    explanation: |
      `if isinstance(s, Circle): ... elif isinstance(s, Square): ...` must be edited for every new class. Give each class the method and just call it.
  - title: Forgetting to implement an abstract method
    explanation: |
      With a plain `NotImplementedError` base, the mistake only shows when the method is called. Using `abc.ABC` and `@abstractmethod` catches it as soon as the object is created.
  - title: Inconsistent interfaces
    explanation: |
      Polymorphism only works if every class's method takes the same arguments and returns the same kind of value. One `area(self, units)` among many `area(self)` breaks the shared code.
  - title: Creating an abstract class directly
    explanation: |
      Abstract classes exist to be inherited. Create one of the concrete subclasses instead.
  - title: Thinking duck typing means no rules
    explanation: |
      Duck typing removes the need for a common base class, not the need for a consistent interface. Document which methods your code expects its objects to have.

summary:
  - "**Polymorphism**: one piece of code works on many types through a shared **interface** (a set of methods)."
  - "Replacing `if`/`elif` type checks with methods means new types can be added without changing existing code (the **open/closed principle**)."
  - "An **abstract base class** declares the interface and can share concrete methods. `abc.ABC` with `@abstractmethod` prevents incomplete subclasses from being created."
  - "**Duck typing**: Python only cares whether an object has the method, not what class it is. Built-in protocols (`len`, `for`, files) work the same way."
  - "Polymorphism plus recursion gives tree structures such as expression trees, the basis of interpreters and compilers."
next: |
  You now know the core of OOP. **Lesson 5.8** fills in practical tools you'll use constantly: organising code into **modules** and importing from Python's huge **standard library**, writing classes in a few lines with **dataclasses**, and defining your own **exception classes** (which, it turns out, use inheritance).

quiz:
  - type: mcq
    question: What does polymorphism mean in programming?
    options:
      - A class having many attributes
      - One piece of code working with objects of many types through a shared interface
      - A program written in many languages
      - Copying a class many times
    answer: 1
    explanation: "\"Many forms\": the same call, like `s.area()`, does the right thing for each type."
  - type: mcq
    question: Why is replacing an `if`/`elif` chain on types with polymorphism helpful?
    options:
      - It makes the code run faster
      - New types can be added by writing a new class, without editing existing code
      - It removes the need for classes
      - Python doesn't allow `elif`
    answer: 1
    explanation: This is the open/closed principle in action.
