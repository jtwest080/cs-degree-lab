    question: "A class inherits from `ABC` and has a method marked `@abstractmethod`. What happens if you try to create an object of a subclass that doesn't define that method?"
    options: ["It works normally", "TypeError when creating the object", "Error only when the method is called", "The method is filled in automatically"]
    answer: 1
    explanation: The abc module checks for missing abstract methods at creation time.
