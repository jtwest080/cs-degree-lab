id: u5-modules-dataclasses
title: Modules, Dataclasses and Custom Exceptions
minutes: 55
objective: |
  Organise code into **modules** and use Python's **standard library** with `import`, write data-holding classes in a few lines with **dataclasses**, and design your own **exception classes** as a hierarchy so callers can catch exactly the errors they care about.
outcomes:
  - Import modules with `import`, `from ... import` and `as`, and explain what a module is
  - Use standard library tools such as `math`, `random`, `collections.Counter` and `defaultdict`
  - Explain the `if __name__ == "__main__":` idiom
  - Write dataclasses, including defaults, `field(default_factory=list)`, `order=True` and `frozen=True`
  - Define custom exception classes that inherit from `Exception`, with extra attributes
  - Catch a family of related errors through their base class

sections:
  - heading: Modules
    body: |
      Real programs grow to thousands of lines, far too many for one file. Python lets you split code into **modules**: a module is simply a `.py` file whose functions, classes and variables other files can use. A folder of related modules is called a **package**.

      You've already used modules a few times (`import random`, `from abc import ABC`). There are three common forms of `import`:

      ```python
      import math                      # use as math.sqrt(2)
      from math import sqrt, pi        # use as sqrt(2), pi
      import statistics as stats       # use as stats.mean([1, 2, 3])
      ```

      - `import math` loads the module and gives you **one name**, `math`; everything inside is reached with a dot. This is usually the clearest, because a reader can see where each name comes from.
      - `from math import sqrt` copies specific names into your program, for convenience.
      - `as` gives a module a shorter or clearer name.

      (Avoid `from math import *`, which dumps every name from the module into your program: you can't tell where names came from, and it may silently replace your own variables.)

      Modules give each file its own **namespace**: `math.log` and a `log` function in your own code can't clash. They also let you **reuse** code across programs, and they're how teams split work: one person owns `payments.py`, another `inventory.py`.

      > **Analogy:** A module is like a toolbox with a label. `import math` puts the "math" toolbox on your bench; `math.sqrt` means "the sqrt tool from that box". `from math import sqrt` takes just that tool out and puts it on the bench by itself.

  - heading: The standard library
    body: |
      Python comes with a huge **standard library**: hundreds of modules, installed with Python, ready to import. This is what people mean by Python's "batteries included" philosophy. A few you'll use constantly:

      | Module | Gives you |
      |---|---|
      | `math` | `sqrt`, `floor`, `ceil`, `gcd`, `pi`, `inf`, trigonometry, logarithms |
      | `random` | `randint`, `choice`, `shuffle`, `sample`, `seed` |
      | `collections` | `Counter` (counting), `defaultdict` (grouping), `deque` (Unit 7) |
      | `itertools` | `permutations`, `combinations` (Lesson 4.8), `product`, `chain` |
      | `datetime` | dates, times and durations |
      | `statistics` | `mean`, `median`, `stdev` |
      | `json`, `csv` | reading and writing common data formats |

      Two from `collections` replace patterns you've written by hand since Unit 3:

      ```python
      from collections import Counter, defaultdict

      Counter("mississippi").most_common(2)     # [('i', 4), ('s', 4)]

      groups = defaultdict(list)                # missing keys start as []
      for word in ["apple", "avocado", "banana"]:
          groups[word[0]].append(word)          # no "if key not in" needed
      ```

      Before writing a utility yourself, it's worth a quick search: *"Python standard library <task>"*. Beyond the standard library are hundreds of thousands of third-party packages installed with a tool called `pip` (you'll meet them in Unit 14). Writing it yourself is still valuable while learning, which is why this course often asks you to.

  - heading: Your own modules and __name__
    body: |
      Any `.py` file is a module. If you save functions in `geometry.py`, another file in the same folder can `import geometry` and call `geometry.area(...)`. (This browser editor runs a single file, so you'll practise this properly when you set up a local project in Unit 14.)

      When Python imports a module, it **runs the whole file**, top to bottom, defining its functions and classes. That causes a problem if the file also contains test code or a `main()` call: importing it would run them too. The fix is a famous idiom:

      ```python
      def area(w, h):
          return w * h

      if __name__ == "__main__":
          print(area(3, 4))      # only when this file is run directly
      ```

      Every module has a variable `__name__`. When you run a file directly, Python sets it to `"__main__"`; when the file is imported, it's set to the module's name (`"geometry"`). So the block runs when you run the file as a program, but not when someone imports it. You'll see this at the bottom of most Python programs.

  - heading: Dataclasses
    body: |
      Many classes exist mainly to **hold data**: a point, a product, a book. Writing them means a lot of repetitive typing: `__init__` with `self.x = x` for every field, `__repr__`, `__eq__`. The standard library's `dataclasses` module writes all of that for you:

      ```python
      from dataclasses import dataclass

      @dataclass
      class Product:
          name: str
          price: float
          quantity: int = 0

      p = Product("Widget", 2.5)
      print(p)                               # Product(name='Widget', price=2.5, quantity=0)
      print(p == Product("Widget", 2.5))     # True
      ```

      The fields are listed with **type hints**: `name: str` means "`name` is expected to be a string". Python doesn't enforce hints, but they document intent, and the dataclass uses them to know which fields exist. Fields with defaults must come after fields without.

      You still write methods and properties as normal; the decorator only generates the boring parts. Useful options:

      - `@dataclass(order=True)` also generates `__lt__` and friends, comparing fields in order like a tuple, so objects sort naturally.
      - `@dataclass(frozen=True)` makes objects **immutable** (assigning to a field raises an error) and **hashable**, so they can be set members and dictionary keys. Remember from Lesson 5.3 that defining `__eq__` normally removes hashability; frozen dataclasses solve that.
      - For a mutable default, use `field(default_factory=list)` rather than `= []`, which would be the shared-list trap from Lesson 5.2 (dataclasses actually refuse `= []` with an error).

      > **Tip:** Use a dataclass when a class is mostly data with a little behaviour. Use a regular class when `__init__` needs real logic or validation, or when the internal data should be hidden. (A dataclass can run checks in a method called `__post_init__`, which it calls after setting the fields.)

  - heading: Custom exceptions
    body: |
      So far you've raised Python's built-in exceptions, mostly `ValueError` and `KeyError`. In a larger program it's better to define your **own**, because they describe errors in your program's own terms and let callers catch exactly the ones they can handle.

      Exceptions are classes, and they form an inheritance hierarchy. `ValueError` and `KeyError` both inherit from `Exception`, and `except Exception:` catches both. To make your own, inherit from `Exception`:

      ```python
      class BankError(Exception):
          """Base class for everything that can go wrong with an account."""

      class InsufficientFunds(BankError):
          def __init__(self, needed, available):
              super().__init__(f"Need {needed}, only {available} available")
              self.needed = needed
              self.available = available

      class AccountFrozen(BankError):
          pass
      ```

      A body containing only a docstring (or `pass`) is fine: the new class inherits everything it needs. Custom attributes like `needed` let a handler respond intelligently ("you're 20 short"), and calling `super().__init__(message)` sets the text shown when the error is printed.

      The hierarchy pays off when catching:

      ```python
      try:
          acct.withdraw(500)
      except InsufficientFunds as err:
          print("Short by", err.needed - err.available)
      except BankError as err:
          print("Account problem:", err)     # catches AccountFrozen and any future BankError
      ```

      `except` clauses are checked **in order**, and each catches its class **and all subclasses**, so put specific ones first. A whole library can be wrapped with one `except BankError` by code that just wants to know "did banking fail?", while other code catches individual errors. Python's own exceptions are organised this way: `except LookupError` catches both `KeyError` and `IndexError`.

      Two more pieces of `try` complete the picture: an `else:` block runs only if no exception happened, and a `finally:` block runs **no matter what**, which is ideal for cleaning up (closing files and connections).

examples:
  - title: The standard library at work
    intro: Counting, grouping and maths without writing the helpers yourself.
    code: |
      import math
      from collections import Counter, defaultdict

      text = "the cat and the hat and the bat"
      counts = Counter(text.split())
      print(counts.most_common(2))
      print(counts["the"], counts["dog"])

      by_letter = defaultdict(list)
      for word in sorted(set(text.split())):
          by_letter[word[-1]].append(word)
      print(dict(by_letter))

      print(math.sqrt(2), math.floor(2.7), math.ceil(2.1), math.gcd(12, 18))
    output: |
      [('the', 3), ('and', 2)]
      3 0
      {'d': ['and'], 't': ['bat', 'cat', 'hat'], 'e': ['the']}
      1.4142135623730951 2 3 6
    lines:
      - line: 1-2
        note: "Two import styles: the whole `math` module, and two names from `collections`."
      - line: 5
        note: "`Counter` counts the items of any iterable, replacing the counting pattern from Lesson 3.6."
      - line: 7
        note: "Missing keys count as 0 rather than raising KeyError."
      - line: 9-11
        note: "`defaultdict(list)` creates an empty list the first time a key is used."
      - line: 14
        note: "Names from `math` are reached through the module name."
  - title: Dataclasses
    intro: Three classes with almost no boilerplate.
    code: |
      from dataclasses import dataclass, field

      @dataclass
      class Product:
          name: str
          price: float
          quantity: int = 0

          def value(self):
              return self.price * self.quantity

      @dataclass(order=True)
      class Version:
          major: int
          minor: int

      @dataclass(frozen=True)
      class Square:
          row: int
          col: int

      @dataclass
      class Basket:
          items: list = field(default_factory=list)

      p = Product("Widget", 2.5, 4)
      print(p, p.value())
      print(sorted([Version(1, 10), Version(1, 2), Version(0, 9)]))
      visited = {Square(0, 0), Square(0, 1), Square(0, 0)}
      print(len(visited))
      a, b = Basket(), Basket()
      a.items.append("milk")
      print(a, b)
    output: |
      Product(name='Widget', price=2.5, quantity=4) 10.0
      [Version(major=0, minor=9), Version(major=1, minor=2), Version(major=1, minor=10)]
      2
      Basket(items=['milk']) Basket(items=[])
    lines:
      - line: 3-7
        note: "`@dataclass` reads the fields and writes `__init__`, `__repr__` and `__eq__`."
      - line: 9-10
        note: "Ordinary methods work as usual."
      - line: 12-15
        note: "`order=True` compares fields in order, like tuples: 1.2 comes before 1.10, unlike string comparison."
      - line: 17-20
        note: "`frozen=True` makes objects immutable and hashable, so duplicates collapse in a set."
      - line: 22-24
        note: "`default_factory=list` gives each basket its own new list."
  - title: A custom exception hierarchy
    intro: Specific errors with useful details, caught specifically or as a family.
    code: |
      class BankError(Exception):
          """Something went wrong with an account."""

      class InsufficientFunds(BankError):
          def __init__(self, needed, available):
              super().__init__(f"need {needed}, have {available}")
              self.needed = needed
              self.available = available

      class AccountFrozen(BankError):
          pass

      class Account:
          def __init__(self, balance, frozen=False):
              self.balance = balance
              self.frozen = frozen

          def withdraw(self, amount):
              if self.frozen:
                  raise AccountFrozen("account is frozen")
              if amount > self.balance:
                  raise InsufficientFunds(amount, self.balance)
              self.balance -= amount

      for acct, amount in [(Account(100), 30), (Account(100), 150), (Account(100, True), 10)]:
          try:
              acct.withdraw(amount)
          except InsufficientFunds as err:
              print("Short by", err.needed - err.available, "-", err)
          except BankError as err:
              print("Bank error:", err)
          else:
              print("OK, balance now", acct.balance)
    output: |
      OK, balance now 70
      Short by 50 - need 150, have 100
      Bank error: account is frozen
    lines:
      - line: 1-2
        note: "The base class for the family. A docstring is enough of a body."
      - line: 4-8
        note: "A specific error with extra attributes. `super().__init__` sets the message."
      - line: 28-29
        note: "The most specific handler comes first and uses the extra attributes."
      - line: 30-31
        note: "`BankError` catches any other member of the family, here `AccountFrozen`."
      - line: 32-33
        note: "`else` runs only when no exception was raised."

playground:
  prompt: |
    Explore the standard library. Try `random.choice`, `random.sample`, `itertools.combinations`, and `statistics.median` on lists of your own. Then make `Card` a frozen dataclass and put some cards in a set.
  code: |
    import random
    import statistics
    from itertools import combinations

    random.seed(1)
    rolls = [random.randint(1, 6) for _ in range(20)]
    print(rolls)
    print("mean", statistics.mean(rolls), "median", statistics.median(rolls))
    print(list(combinations(["A", "B", "C", "D"], 2)))
    print(random.choice(["rock", "paper", "scissors"]))

exercises:
  - id: word-stats
    title: Word statistics with the standard library
    difficulty: 1
    prompt: |
      Write `word_stats(text, n)` that returns a tuple `(top, longest, average)`:

      - `top`: the `n` most common words as a list of `(word, count)` pairs, using `collections.Counter` and its `most_common` method.
      - `longest`: the longest word (the first one if several tie).
      - `average`: the mean word length, rounded **up** to a whole number with `math.ceil`.

      Words are found by `text.lower().split()`; you can assume there's at least one word.
    starter: |
      def word_stats(text, n):
          pass
    tests:
      - name: example
        code: |
          top, longest, avg = word_stats("the cat and the hat and the bat sat", 2)
          assert top == [("the", 3), ("and", 2)], f"top was {top}"
          assert longest == "the", f"longest was {longest!r} (the first 3-letter word)"
          assert avg == 3, f"average was {avg}"
      - name: case and rounding
        code: |
          top, longest, avg = word_stats("Elephant elephant ant", 1)
          assert top == [("elephant", 2)] and longest == "elephant"
          assert avg == 7, "(8 + 8 + 3) / 3 = 6.33, rounded up to 7"
      - name: uses the library
        code: |
          assert "Counter" in source and "ceil" in source, "Use collections.Counter and math.ceil"
    hints:
      - "Put `import math` and `from collections import Counter` at the top of your code."
      - "`Counter(words).most_common(n)` gives the top pairs directly."
      - "`max(words, key=len)` returns the first longest word."
    solution: |
      import math
      from collections import Counter


      def word_stats(text, n):
          words = text.lower().split()
          top = Counter(words).most_common(n)
          longest = max(words, key=len)
          average = math.ceil(sum(len(w) for w in words) / len(words))
          return top, longest, average
    explanation: |
      Each line uses a ready-made tool: `Counter` for counting, `max` with a key for the longest, `math.ceil` for rounding up. Knowing what's in the standard library makes code shorter and less buggy, because these tools are thoroughly tested.

  - id: product-dataclass
    title: A product dataclass
    difficulty: 1
    prompt: |
      Write a dataclass `Item` with fields `name` (str), `price` (float) and `quantity` (int, default 1), plus:

      - a read-only property `total` returning `price * quantity` rounded to 2 places;
      - a method `restock(amount)` adding to the quantity.

      Then write `most_valuable(items)` returning the **name** of the item with the largest total.
    starter: |
      from dataclasses import dataclass


      def most_valuable(items):
          pass
    tests:
      - name: generated methods
        code: |
          i = Item("Pen", 1.5)
          assert (i.name, i.price, i.quantity) == ("Pen", 1.5, 1), "quantity should default to 1"
          assert repr(i) == "Item(name='Pen', price=1.5, quantity=1)", f"Got {repr(i)}. Use @dataclass."
          assert Item("Pen", 1.5, 2) == Item("Pen", 1.5, 2)
      - name: property and method
        code: |
          i = Item("Pen", 1.5, 3)
          assert i.total == 4.5
          i.restock(2)
          assert i.quantity == 5 and i.total == 7.5
      - name: most_valuable
        code: |
          items = [Item("Pen", 1.5, 10), Item("Book", 12.0), Item("Bag", 4.0, 3)]
          assert most_valuable(items) == "Pen", f"Got {most_valuable(items)}"
    hints:
      - "Write `@dataclass` above `class Item:`, then the fields: `name: str`, `price: float`, `quantity: int = 1`."
      - "Properties and methods go in the class body below the fields, as usual."
    solution: |
      from dataclasses import dataclass


      @dataclass
      class Item:
          name: str
          price: float
          quantity: int = 1

          @property
          def total(self):
              return round(self.price * self.quantity, 2)

          def restock(self, amount):
              self.quantity += amount


      def most_valuable(items):
          best = items[0]
          for item in items:
              if item.total > best.total:
                  best = item
          return best.name
    explanation: |
      Three lines of fields replace an `__init__`, a `__repr__` and an `__eq__` that you'd otherwise write by hand. Everything else about classes (properties, methods) works exactly as before.

  - id: version-sort
    title: Sorting version numbers
    difficulty: 2
    prompt: |
      Software versions like `"1.10.2"` don't sort correctly as strings (`"1.10"` comes before `"1.9"`). Write a dataclass `Version` with `order=True` and `frozen=True`, and integer fields `major`, `minor` and `patch`, plus:

      - a class method `parse(text)` that builds a `Version` from `"major.minor.patch"`;
      - `__str__` returning the dotted form.

      Then write `newest(texts)` that takes a list of version strings and returns the newest one **as a string**, and `unique_sorted(texts)` that returns the distinct versions, oldest first, as strings.
    starter: |
      from dataclasses import dataclass


      def newest(texts):
          pass


      def unique_sorted(texts):
          pass
    tests:
      - name: parse and str
        code: |
          v = Version.parse("1.10.2")
          assert (v.major, v.minor, v.patch) == (1, 10, 2) and str(v) == "1.10.2"
      - name: ordering
        code: |
          assert Version.parse("1.9.0") < Version.parse("1.10.0"), "1.9.0 is older than 1.10.0"
          assert Version.parse("2.0.0") > Version.parse("1.99.99")
          try:
              v = Version.parse("1.0.0")
              v.major = 5
              assert False, "Version should be frozen"
          except AttributeError:
              pass
      - name: newest and unique_sorted
        code: |
          vs = ["1.9.0", "1.10.0", "1.2.10", "1.10.0", "0.99.1"]
          assert newest(vs) == "1.10.0", f"Got {newest(vs)}"
          assert unique_sorted(vs) == ["0.99.1", "1.2.10", "1.9.0", "1.10.0"], f"Got {unique_sorted(vs)}"
    hints:
      - "`@dataclass(order=True, frozen=True)` above the class."
      - "In `parse`, `major, minor, patch = text.split(\".\")`, then `return cls(int(major), int(minor), int(patch))`."
      - "Frozen dataclasses are hashable, so `set(Version.parse(t) for t in texts)` removes duplicates; then sort it."
    solution: |
      from dataclasses import dataclass


      @dataclass(order=True, frozen=True)
      class Version:
          major: int
          minor: int
          patch: int

          @classmethod
          def parse(cls, text):
              major, minor, patch = text.split(".")
              return cls(int(major), int(minor), int(patch))

          def __str__(self):
              return f"{self.major}.{self.minor}.{self.patch}"


      def newest(texts):
          return str(max(Version.parse(t) for t in texts))


      def unique_sorted(texts):
          return [str(v) for v in sorted(set(Version.parse(t) for t in texts))]
    explanation: |
      `order=True` compares versions field by field, as numbers, giving the correct order; `frozen=True` makes them hashable so a set can remove duplicates. Turning text into a proper type first, then working with that type, is a pattern you'll use everywhere: parse at the edges, work with objects inside.

  - id: bank-exceptions
    title: A custom exception family
    difficulty: 2
    prompt: |
      Define an exception hierarchy:

      - `BankError(Exception)`, the base.
      - `InsufficientFunds(BankError)`, created as `InsufficientFunds(needed, available)`, storing both as attributes, with the message `"need <needed>, have <available>"`.
      - `AccountFrozen(BankError)`.

      Update `Account.withdraw` to raise `AccountFrozen` if the account is frozen and `InsufficientFunds` if the balance is too low. Then write `try_withdraw(account, amount)` that returns:

      - `"ok"` if the withdrawal worked,
      - `"short by N"` for insufficient funds (N = needed − available),
      - `"error: <message>"` for any other `BankError`.
    starter: |
      class Account:
          def __init__(self, balance, frozen=False):
              self.balance = balance
              self.frozen = frozen

          def withdraw(self, amount):
              self.balance -= amount


      def try_withdraw(account, amount):
          pass
    tests:
      - name: hierarchy
        code: |
          assert issubclass(BankError, Exception) and issubclass(InsufficientFunds, BankError) and issubclass(AccountFrozen, BankError)
          e = InsufficientFunds(150, 100)
          assert (e.needed, e.available, str(e)) == (150, 100, "need 150, have 100"), f"Got {e.needed}, {e.available}, {str(e)!r}"
      - name: withdraw raises
        code: |
          try:
              Account(100).withdraw(150)
              assert False, "Should raise InsufficientFunds"
          except InsufficientFunds as e:
              assert e.needed == 150 and e.available == 100
          try:
              Account(100, frozen=True).withdraw(10)
              assert False, "Should raise AccountFrozen"
          except AccountFrozen:
              pass
      - name: try_withdraw
        code: |
          a = Account(100)
          assert try_withdraw(a, 30) == "ok" and a.balance == 70
          assert try_withdraw(a, 100) == "short by 30", f"Got {try_withdraw(Account(70), 100)!r}"
          assert try_withdraw(Account(5, frozen=True), 1) == "error: account is frozen"
    hints:
      - "`class BankError(Exception): pass` is a complete exception class."
      - "In `InsufficientFunds.__init__`, call `super().__init__(f\"need {needed}, have {available}\")` and store the two attributes."
      - "In `try_withdraw`, put `except InsufficientFunds` before `except BankError`. Raise `AccountFrozen(\"account is frozen\")`."
    solution: |
      class BankError(Exception):
          """Base class for account problems."""


      class InsufficientFunds(BankError):
          def __init__(self, needed, available):
              super().__init__(f"need {needed}, have {available}")
              self.needed = needed
              self.available = available


      class AccountFrozen(BankError):
          pass


      class Account:
          def __init__(self, balance, frozen=False):
              self.balance = balance
              self.frozen = frozen

          def withdraw(self, amount):
              if self.frozen:
                  raise AccountFrozen("account is frozen")
              if amount > self.balance:
                  raise InsufficientFunds(amount, self.balance)
              self.balance -= amount


      def try_withdraw(account, amount):
          try:
              account.withdraw(amount)
          except InsufficientFunds as err:
              return f"short by {err.needed - err.available}"
          except BankError as err:
              return f"error: {err}"
          return "ok"
    explanation: |
      The handler order matters: `InsufficientFunds` is also a `BankError`, so if `except BankError` came first it would catch everything and the specific message would never appear. Custom exceptions carry structured information (`needed`, `available`) instead of making callers pick apart a message string.

  - id: config-parser
    title: A settings parser
    difficulty: 3
    prompt: |
      Programs often read settings from text like:

      ```text
      # comment lines start with #
      name = My Shop
      port = 8080
      debug = yes
      ```

      Write:

      - `ConfigError(Exception)`, created as `ConfigError(line_number, problem)`, storing `line_number` and with the message `"line <n>: <problem>"`.
      - A dataclass `Settings` with fields `name` (str, default `"app"`), `port` (int, default 8000) and `debug` (bool, default `False`).
      - `parse_settings(text)` returning a `Settings`. Lines are numbered from 1. Skip blank lines and lines starting with `#`. Each other line must be `key = value` (strip spaces around both). Raise `ConfigError` with the line number for:
        - a line with no `=` (problem: `"expected key = value"`),
        - an unknown key (problem: `"unknown key <key>"`),
        - a `port` that isn't a whole number between 1 and 65535 (problem: `"bad port"`),
        - a `debug` that isn't `yes` or `no` (problem: `"debug must be yes or no"`).
    starter: |
      from dataclasses import dataclass


      def parse_settings(text):
          pass
    tests:
      - name: ConfigError
        code: |
          e = ConfigError(3, "bad port")
          assert isinstance(e, Exception) and e.line_number == 3 and str(e) == "line 3: bad port"
      - name: defaults
        code: |
          s = parse_settings("")
          assert s == Settings() and (s.name, s.port, s.debug) == ("app", 8000, False)
      - name: parsing
        code: |
          s = parse_settings("# my settings\nname = My Shop\n\nport= 8080\ndebug =yes\n")
          assert s == Settings("My Shop", 8080, True), f"Got {s}"
          assert parse_settings("debug = no\nname=x = y").name == "x = y", "Only split at the first ="
      - name: errors carry line numbers
        code: |
          cases = [("name = a\noops", 2, "expected key = value"),
                   ("colour = red", 1, "unknown key colour"),
                   ("# c\n\nport = eighty", 3, "bad port"),
                   ("port = 70000", 1, "bad port"),
                   ("port = 0", 1, "bad port"),
                   ("debug = maybe", 1, "debug must be yes or no")]
          for text, line, problem in cases:
              try:
                  parse_settings(text)
                  assert False, f"Expected ConfigError for {text!r}"
              except ConfigError as e:
                  assert e.line_number == line and str(e) == f"line {line}: {problem}", f"For {text!r} got {str(e)!r}"
    hints:
      - "Loop with `for number, line in enumerate(text.splitlines(), start=1):`."
      - "`key, value = line.split(\"=\", 1)` splits only at the first `=`. Check `\"=\" in line` first."
      - "Start from `settings = Settings()` and assign fields as you go. For the port, `value.isdigit()` checks it's a whole number before `int(value)`."
    solution: |
      from dataclasses import dataclass


      class ConfigError(Exception):
          def __init__(self, line_number, problem):
              super().__init__(f"line {line_number}: {problem}")
              self.line_number = line_number


      @dataclass
      class Settings:
          name: str = "app"
          port: int = 8000
          debug: bool = False


      def parse_settings(text):
          settings = Settings()
          for number, line in enumerate(text.splitlines(), start=1):
              line = line.strip()
              if line == "" or line.startswith("#"):
                  continue
              if "=" not in line:
                  raise ConfigError(number, "expected key = value")
              key, value = line.split("=", 1)
              key, value = key.strip(), value.strip()
              if key == "name":
                  settings.name = value
              elif key == "port":
                  if not value.isdigit() or not 1 <= int(value) <= 65535:
                      raise ConfigError(number, "bad port")
                  settings.port = int(value)
              elif key == "debug":
                  if value not in ("yes", "no"):
                      raise ConfigError(number, "debug must be yes or no")
                  settings.debug = value == "yes"
              else:
                  raise ConfigError(number, f"unknown key {key}")
          return settings
    explanation: |
      This combines everything in the lesson: a dataclass holds the result with sensible defaults, and a custom exception reports problems precisely, with the line number as an attribute so a program could highlight the bad line. Parsing messy text into a clean, typed object at the edge of a program, and reporting errors clearly, is a large part of real-world programming.

commonMistakes:
  - title: Naming your file after a module
    explanation: |
      A file called `random.py` or `math.py` in your folder is imported *instead of* the standard library module, causing baffling errors. Don't reuse standard module names.
  - title: Using from module import *
    explanation: |
      It's impossible to tell where names came from, and imported names can silently replace your own. Import the module, or name what you import.
  - title: A mutable default in a dataclass
    explanation: |
      `items: list = []` is refused with `ValueError: mutable default ... is not allowed`. Use `items: list = field(default_factory=list)`.
  - title: Catching the base exception first
    explanation: |
      `except BankError` before `except InsufficientFunds` means the specific handler never runs, since every `InsufficientFunds` is a `BankError`. Put specific handlers first.
  - title: Inheriting exceptions from BaseException
    explanation: |
      Custom exceptions should inherit from `Exception` (or one of its subclasses). `BaseException` also covers things like Ctrl+C, which ordinary handlers shouldn't swallow.

summary:
  - "A **module** is a `.py` file; `import m`, `from m import name` and `import m as alias` bring its names in. Each module has its own namespace."
  - "The **standard library** includes `math`, `random`, `collections` (`Counter`, `defaultdict`), `itertools`, `datetime`, `statistics` and much more."
  - "`if __name__ == \"__main__\":` runs code only when a file is run directly, not when it's imported."
  - "`@dataclass` generates `__init__`, `__repr__` and `__eq__` from type-hinted fields. `order=True` adds comparisons, `frozen=True` makes objects immutable and hashable, and `field(default_factory=list)` gives safe mutable defaults."
  - "**Custom exceptions** inherit from `Exception`, can carry extra attributes, and form hierarchies: `except Base` catches every subclass, so list specific handlers first."
next: |
  You now have every tool of object-oriented programming. The last lesson of the unit, **Lesson 5.9**, is about using them *well*: how to decide which classes a program needs, how to divide responsibilities, the SOLID principles that experienced developers follow, and how to recognise a design that will be painful to change.

quiz:
  - type: mcq
    question: "After `from math import sqrt`, how do you call the square root function?"
    options: ["math.sqrt(9)", "sqrt(9)", "math(sqrt(9))", "import.sqrt(9)"]
    answer: 1
    explanation: "`from ... import` copies the name itself into your program."
  - type: mcq
    question: "What does `if __name__ == \"__main__\":` achieve?"
    options:
      - It makes the program run faster
      - The code inside runs when the file is run directly, but not when it's imported as a module
      - It defines the main class
      - It's required in every Python file
    answer: 1
    explanation: "`__name__` is `\"__main__\"` only for the file being run."
  - type: mcq
    question: Which method is NOT generated by a plain `@dataclass`?
    options: ["__init__", "__repr__", "__eq__", "__lt__"]
    answer: 3
    explanation: Ordering methods are only generated with `order=True`.
  - type: mcq
    question: Why might you use `@dataclass(frozen=True)`?
    options:
      - To make the class faster to define
      - To make objects immutable and hashable, so they can be set members or dictionary keys
      - To hide the fields
      - To allow mutable defaults
    answer: 1
    explanation: Frozen dataclasses also get a `__hash__` based on their fields.
  - type: mcq
    question: "`InsufficientFunds` inherits from `BankError`. Which handler catches an `InsufficientFunds`?"
    options: ["Only `except InsufficientFunds`", "Only `except BankError`", "Both `except InsufficientFunds` and `except BankError`", "Neither"]
    answer: 2
    explanation: An except clause catches its class and all subclasses.
  - type: mcq
    question: "What does `Counter(\"banana\")[\"a\"]` give?"
    options: ["1", "3", "\"a\"", "KeyError"]
    answer: 1
    explanation: Counter counts each item of the iterable; "banana" has three a's.
  - type: code
    question: |
      Define an exception `NegativeError` (inheriting from `ValueError`) and write `safe_sqrt(x)` that raises `NegativeError` with the message `"cannot take the root of <x>"` for negative `x`, and otherwise returns `math.sqrt(x)`.
    starter: |
      import math


      def safe_sqrt(x):
          pass
    tests:
      - name: safe_sqrt works
        code: |
          assert issubclass(NegativeError, ValueError)
          assert safe_sqrt(9) == 3.0
          try:
              safe_sqrt(-4)
              assert False, "Should raise NegativeError"
          except NegativeError as e:
              assert str(e) == "cannot take the root of -4", f"Got {str(e)!r}"
          try:
              safe_sqrt(-1)
          except ValueError:
              pass
    solution: |
      import math


      class NegativeError(ValueError):
          pass


      def safe_sqrt(x):
          if x < 0:
              raise NegativeError(f"cannot take the root of {x}")
          return math.sqrt(x)
