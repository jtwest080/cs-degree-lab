id: u5-design
title: Designing with Objects
minutes: 55
objective: |
  Turn a problem description into a set of classes with clear **responsibilities**, judge designs by **cohesion** and **coupling**, apply the five **SOLID** principles, recognise common **code smells**, and make classes easy to test by passing in their collaborators.
outcomes:
  - Find candidate classes and methods from the nouns and verbs of a problem description
  - Give each class one clear responsibility, and describe it in a sentence
  - Explain cohesion and coupling, and why we want high cohesion and low coupling
  - State the five SOLID principles in plain language, with an example of each
  - Recognise common code smells such as god classes, duplication and feature envy
  - Test a class in isolation by injecting a fake collaborator

sections:
  - heading: Design is about change
    body: |
      Any working program solves today's problem. A **well-designed** program can also absorb tomorrow's changes without a rewrite. Requirements always change: the shop adds a new payment method, the game gets a new kind of enemy, the report needs a CSV version. Good design means each change touches as **few places** as possible.

      Everything in this unit has been heading here. Encapsulation (5.4) hides details so they can change. Composition (5.5) builds systems from replaceable parts. Polymorphism (5.7) lets new kinds of thing be added without editing old code. This lesson collects those ideas into habits for designing a program from scratch.

      > **Analogy:** A house with plumbing behind removable panels, standard sockets and modular kitchen units can be renovated room by room. A house with pipes cast into the concrete has to be demolished to fix a leak. Both are "working houses" on the day they're finished.

  - heading: Finding the classes
    body: |
      A simple, surprisingly effective starting technique: write a short description of the problem, then underline the **nouns** (candidate classes and attributes) and the **verbs** (candidate methods).

      > A library has *books* and *members*. A member can *borrow* up to three books and *return* them. A book has a *title* and an *ISBN*. The library can *report* which books are overdue.

      Nouns: library, book, member, title, ISBN. Verbs: borrow, return, report. Some nouns are big enough to be classes (`Library`, `Book`, `Member`); others are just attributes (`title`, `isbn`). Each verb becomes a method on the class that has the data it needs: borrowing changes both books and members, so it belongs on `Library`, which coordinates them (exactly as you built in Lesson 5.5).

      Next, write a **one-sentence responsibility** for each class. Designers sometimes use index cards called **CRC cards** (Class, Responsibilities, Collaborators): the class name on top, what it *knows* and *does* on the left, and which other classes it works with on the right. If you can't describe a class in one sentence without using "and" several times, it's probably doing too much.

  - heading: Cohesion and coupling
    body: |
      Two measures judge almost any design:

      - **Cohesion**: how closely related the things inside one class are. A `Fraction` class whose every method is about fractions is highly cohesive. A class `Utilities` with methods for dates, emails and fractions has low cohesion.
      - **Coupling**: how much one class depends on the details of others. If changing how `Book` stores its title forces changes in five other classes, coupling is high.

      **Aim for high cohesion and low coupling.** Each class should do one thing well and depend on others only through their public interfaces. The Law of Demeter (Lesson 5.5) and encapsulation (5.4) are tools for reducing coupling; giving each class one responsibility raises cohesion.

  - heading: The SOLID principles
    body: |
      In the early 2000s, the software engineer Robert C. Martin popularised five principles for object-oriented design, remembered by the acronym **SOLID**. You've already met most of them in action:

      | Letter | Principle | In plain words |
      |---|---|---|
      | **S** | Single responsibility | A class should have one reason to change. Calculating sales figures and formatting them as HTML are two jobs, so two classes. |
      | **O** | Open/closed | Open for extension, closed for modification: add new behaviour by adding classes, not by editing working code (Lesson 5.7's shapes). |
      | **L** | Liskov substitution | A subclass must work anywhere its base class does, without surprises (Lesson 5.6). |
      | **I** | Interface segregation | Don't force classes to provide methods they don't need. Several small interfaces beat one huge one: a `Printer` shouldn't have to implement `scan` and `fax`. |
      | **D** | Dependency inversion | Depend on abstractions (an interface such as "anything with `send(message)`"), not on specific concrete classes. Pass collaborators in (Lesson 5.5's dependency injection). |

      These are guidelines, not laws. Applied blindly to a 50-line script they add needless classes. But as a program grows, violations show up as pain: one change breaking distant code, classes that are impossible to test, or `if`/`elif` chains that grow with every feature.

  - heading: Code smells
    body: |
      A **code smell** is a surface sign that a design might have a deeper problem. It doesn't prove anything is wrong, but it's worth a look:

      - **God class**: one huge class that knows and does everything. Split it by responsibility.
      - **Duplicated code**: the same logic in several places will eventually be fixed in only one of them. Move it into one function, method or base class.
      - **Long parameter lists**: `make_order(name, street, city, postcode, phone, email, ...)` suggests the parameters belong together in an object (`Customer`, `Address`).
      - **Feature envy**: a method that mostly uses another object's data (`order.customer.discount_rate * order.customer.loyalty_years ...`) probably belongs in that other class.
      - **Type switches**: `if kind == "a": ... elif kind == "b": ...` repeated in several places is a sign polymorphism is missing (Lesson 5.7).
      - **Primitive obsession**: using strings and tuples where a small class would add meaning and validation (prices as floats instead of a `Money` class).

      Improving the structure of code without changing what it does is called **refactoring**. It's safe only when you have tests to confirm the behaviour hasn't changed, which brings us to testing.

  - heading: Designing for testability
    body: |
      A class that creates its own collaborators is hard to test. Imagine a `WeatherAlert` that reads a real thermometer inside its methods: how do you test what it does at 40°C in winter? The answer is **dependency injection** (Lesson 5.5): pass the thermometer in.

      ```python
      class WeatherAlert:
          def __init__(self, sensor, limit):
              self.sensor = sensor
              self.limit = limit

          def check(self):
              return "ALERT" if self.sensor.read() > self.limit else "ok"

      class FakeSensor:
          def __init__(self, value):
              self.value = value

          def read(self):
              return self.value

      assert WeatherAlert(FakeSensor(41), 35).check() == "ALERT"
      ```

      `FakeSensor` is a **test double**: a simple stand-in with the same interface (duck typing, Lesson 5.7). Thanks to dependency inversion, `WeatherAlert` doesn't care whether its sensor is real hardware, a web service or a fake. The same trick makes randomness testable: instead of calling `random.randint` inside a game, pass in a "dice" object or function, and in tests pass one that returns fixed numbers. You'll use exactly this in the last exercise and the unit project.

      Finally, two pieces of advice that balance all the principles above. **KISS**, "keep it simple": the simplest design that meets today's needs is usually best. And **YAGNI**, "you aren't gonna need it": don't build flexibility for changes you only imagine. Refactor when a real change arrives, with tests protecting you.

examples:
  - title: Splitting responsibilities
    intro: Calculating and formatting are separate jobs, so they get separate classes.
    code: |
      class SalesStats:
          def __init__(self, sales):
              self.sales = sales            # list of (item, amount)

          def total(self):
              return sum(a for _, a in self.sales)

          def best_seller(self):
              totals = {}
              for item, amount in self.sales:
                  totals[item] = totals.get(item, 0) + amount
              return max(totals, key=totals.get)

      class TextReport:
          def render(self, stats):
              return f"Total: {stats.total()}\nBest: {stats.best_seller()}"

      class CsvReport:
          def render(self, stats):
              return f"total,best\n{stats.total()},{stats.best_seller()}"

      stats = SalesStats([("tea", 3), ("cake", 5), ("tea", 4)])
      for report in [TextReport(), CsvReport()]:
          print(report.render(stats))
          print("--")
    output: |
      Total: 12
      Best: tea
      --
      total,best
      12,tea
      --
    lines:
      - line: 1-12
        note: "`SalesStats` only calculates. It would change if the business rules changed."
      - line: 11
        note: "`max(totals, key=totals.get)` finds the key with the largest value: a key function can be any function, including a dictionary's `get` method."
      - line: 14-20
        note: "Each report class only formats, through `stats`'s public methods. A new HTML report is a new class; nothing else changes (open/closed)."
  - title: Injecting a dependency to test it
    intro: A fake sensor makes the alert testable without hardware.
    code: |
      class WeatherAlert:
          def __init__(self, sensor, limit):
              self.sensor = sensor
              self.limit = limit

          def check(self):
              reading = self.sensor.read()
              if reading > self.limit:
                  return f"ALERT: {reading} above {self.limit}"
              return "ok"

      class FakeSensor:
          def __init__(self, readings):
              self.readings = list(readings)

          def read(self):
              return self.readings.pop(0)

      alert = WeatherAlert(FakeSensor([20, 36, 35]), 35)
      for _ in range(3):
          print(alert.check())
    output: |
      ok
      ALERT: 36 above 35
      ok
    lines:
      - line: 2-4
        note: "The sensor is passed in, not created inside: dependency injection."
      - line: 12-17
        note: "A fake with the same interface (`read()`), returning readings we choose."
      - line: 19-21
        note: "Every case, including the boundary (35 is not above 35), is tested in a split second."
  - title: Injecting randomness
    intro: A dice game that can be tested with fixed rolls.
    code: |
      import random

      class Game:
          def __init__(self, players, roll):
              self.scores = {p: 0 for p in players}
              self.roll = roll

          def play_round(self):
              for player in self.scores:
                  self.scores[player] += self.roll()

          def leader(self):
              return max(self.scores, key=self.scores.get)

      def real_die():
          return random.randint(1, 6)

      def fixed_rolls(values):
          values = list(values)
          def roll():
              return values.pop(0)
          return roll

      test_game = Game(["Ada", "Bo"], fixed_rolls([2, 6, 5, 1]))
      test_game.play_round(); test_game.play_round()
      print(test_game.scores, test_game.leader())

      real_game = Game(["Ada", "Bo"], real_die)
      real_game.play_round()
      print(all(1 <= s <= 6 for s in real_game.scores.values()))
    output: |
      {'Ada': 7, 'Bo': 7} Ada
      True
    lines:
      - line: 4-6
        note: "The game receives a function to call for each roll; it doesn't know or care where the numbers come from."
      - line: 18-22
        note: "A function that builds and returns another function (it remembers `values`). Each call to `roll()` hands out the next fixed value."
      - line: 24-26
        note: "With fixed rolls, the result is predictable, so it can be checked by a test. A tie goes to the first player, because `max` keeps the first."
      - line: 28-30
        note: "The same class runs a real game with real randomness."

playground:
  prompt: |
    Design a small system on paper first: a cinema with screens, films, showings and bookings. Underline the nouns and verbs, write a one-sentence responsibility for each class, then code two of the classes here. Which class should `book_seat` belong to, and why?
  code: |
    class Film:
        def __init__(self, title, minutes):
            self.title = title
            self.minutes = minutes

    class Showing:
        def __init__(self, film, time, seats):
            self.film = film
            self.time = time
            self.free = seats

    showing = Showing(Film("Dune", 155), "19:30", 120)
    print(showing.film.title, showing.time, showing.free, "seats free")

exercises:
  - id: split-report
    title: One class, one job
    difficulty: 2
    prompt: |
      `GradeReport` mixes three jobs: storing scores, calculating statistics and formatting output. Split it into:

      - `Gradebook`: `add(name, score)` stores a score (raise `ValueError` if the score isn't 0-100), and `scores()` returns a **copy** of the `{name: score}` dictionary.
      - `Stats(gradebook)`: `mean()` (rounded to 1 place, or `None` if empty), `top()` (the name with the highest score; the first added wins ties) and `passed(mark=40)` (sorted list of names with score ≥ mark).
      - `TextFormatter` with `format(stats)` and `CsvFormatter` with `format(stats)`, producing exactly the strings the old class's `text()` and `csv()` produced.

      The old class is in the starter so you can compare. You may delete it when you're done.
    starter: |
      class GradeReport:
          def __init__(self):
              self.data = {}

          def add(self, name, score):
              if not 0 <= score <= 100:
                  raise ValueError("score must be 0-100")
              self.data[name] = score

          def text(self):
              mean = round(sum(self.data.values()) / len(self.data), 1)
              top = max(self.data, key=self.data.get)
              passed = sorted(n for n, s in self.data.items() if s >= 40)
              return f"Mean: {mean}\nTop: {top}\nPassed: {', '.join(passed)}"

          def csv(self):
              mean = round(sum(self.data.values()) / len(self.data), 1)
              top = max(self.data, key=self.data.get)
              return f"mean,top\n{mean},{top}"
    tests:
      - name: Gradebook
        code: |
          g = Gradebook()
          g.add("Ada", 91); g.add("Bo", 35)
          assert g.scores() == {"Ada": 91, "Bo": 35}
          g.scores()["Ada"] = 0
          assert g.scores()["Ada"] == 91, "scores() should return a copy"
          try:
              g.add("Cy", 101)
              assert False, "A score over 100 should raise ValueError"
          except ValueError:
              pass
      - name: Stats
        code: |
          g = Gradebook()
          assert Stats(g).mean() is None
          for n, s in [("Bo", 35), ("Ada", 91), ("Cy", 91), ("Di", 40)]:
              g.add(n, s)
          st = Stats(g)
          assert st.mean() == 64.2 and st.top() == "Ada" and st.passed() == ["Ada", "Cy", "Di"]
          assert st.passed(90) == ["Ada", "Cy"]
      - name: formatters match the old output
        code: |
          g = Gradebook()
          rows = [("Bo", 35), ("Ada", 91), ("Cy", 77)]
          for n, s in rows:
              g.add(n, s)
          st = Stats(g)
          assert TextFormatter().format(st) == "Mean: 67.7\nTop: Ada\nPassed: Ada, Cy", f"Got {TextFormatter().format(st)!r}"
          assert CsvFormatter().format(st) == "mean,top\n67.7,Ada", f"Got {CsvFormatter().format(st)!r}"
      - name: formatters only use Stats
        code: |
          class FakeStats:
              def mean(self): return 1.5
              def top(self): return "Zed"
              def passed(self, mark=40): return ["Zed"]
          assert TextFormatter().format(FakeStats()) == "Mean: 1.5\nTop: Zed\nPassed: Zed"
          assert CsvFormatter().format(FakeStats()) == "mean,top\n1.5,Zed"
    hints:
      - "`Gradebook` keeps the dictionary and the validation from `add`; `scores()` returns `dict(self._data)`."
      - "`Stats.__init__` stores the gradebook; each method starts with `data = self.gradebook.scores()`."
      - "The formatters should call only `stats.mean()`, `stats.top()` and `stats.passed()`, so they work with any object that has those methods."
    solution: |
      class Gradebook:
          def __init__(self):
              self._data = {}

          def add(self, name, score):
              if not 0 <= score <= 100:
                  raise ValueError("score must be 0-100")
              self._data[name] = score

          def scores(self):
              return dict(self._data)


      class Stats:
          def __init__(self, gradebook):
              self.gradebook = gradebook

          def mean(self):
              data = self.gradebook.scores()
              if not data:
                  return None
              return round(sum(data.values()) / len(data), 1)

          def top(self):
              data = self.gradebook.scores()
              return max(data, key=data.get)

          def passed(self, mark=40):
              return sorted(n for n, s in self.gradebook.scores().items() if s >= mark)


      class TextFormatter:
          def format(self, stats):
              return f"Mean: {stats.mean()}\nTop: {stats.top()}\nPassed: {', '.join(stats.passed())}"


      class CsvFormatter:
          def format(self, stats):
              return f"mean,top\n{stats.mean()},{stats.top()}"
    explanation: |
      Each class now has one reason to change: storage rules (`Gradebook`), calculations (`Stats`), or output format (the formatters). The duplicated mean and top calculations have gone. And because the formatters depend only on an interface (`mean`, `top`, `passed`), the last test can check them with a fake `Stats`, independently of the others.

  - id: fake-sensor
    title: Test with a fake
    difficulty: 2
    prompt: |
      Write a class `Thermostat(sensor, heater, target)` that controls a heater:

      - `sensor` is any object with `read()` returning a temperature; `heater` is any object with `on()` and `off()` methods.
      - `tick()` reads the temperature once. If it's **below** `target - 0.5`, turn the heater on; if it's **above** `target + 0.5`, turn it off; otherwise do nothing. Return the reading.

      Also write two test doubles:

      - `FakeSensor(readings)`: `read()` returns the readings one at a time, in order.
      - `FakeHeater()`: records calls in a list attribute `calls` (`"on"` or `"off"`), and has an attribute `is_on`.
    starter: |
      class Thermostat:
          pass


      class FakeSensor:
          pass


      class FakeHeater:
          pass
    tests:
      - name: fakes
        code: |
          s = FakeSensor([18, 19])
          assert s.read() == 18 and s.read() == 19
          h = FakeHeater()
          assert h.calls == [] and h.is_on is False
          h.on(); h.off()
          assert h.calls == ["on", "off"] and h.is_on is False
      - name: thermostat with your fakes
        code: |
          h = FakeHeater()
          t = Thermostat(FakeSensor([18, 20.7, 21.6, 20]), h, 21)
          readings = [t.tick() for _ in range(4)]
          assert readings == [18, 20.7, 21.6, 20]
          assert h.calls == ["on", "off", "on"], f"Heater calls: {h.calls}"
      - name: thermostat with someone else's fakes
        code: |
          class Steady:
              def read(self):
                  return 15
          class Log:
              def __init__(self): self.log = []
              def on(self): self.log.append(1)
              def off(self): self.log.append(0)
          lg = Log()
          t = Thermostat(Steady(), lg, 15)
          t.tick()
          assert lg.log == [], "Exactly at the target: do nothing"
          t.target = 20
          t.tick(); t.tick()
          assert lg.log == [1, 1]
    hints:
      - "`Thermostat.__init__` just stores the three arguments; it never creates a sensor or heater itself."
      - "`FakeSensor` can store `list(readings)` and `pop(0)` in `read`."
      - "`FakeHeater.on` appends `\"on\"` and sets `is_on = True`."
    solution: |
      class Thermostat:
          def __init__(self, sensor, heater, target):
              self.sensor = sensor
              self.heater = heater
              self.target = target

          def tick(self):
              reading = self.sensor.read()
              if reading < self.target - 0.5:
                  self.heater.on()
              elif reading > self.target + 0.5:
                  self.heater.off()
              return reading


      class FakeSensor:
          def __init__(self, readings):
              self.readings = list(readings)

          def read(self):
              return self.readings.pop(0)


      class FakeHeater:
          def __init__(self):
              self.calls = []
              self.is_on = False

          def on(self):
              self.calls.append("on")
              self.is_on = True

          def off(self):
              self.calls.append("off")
              self.is_on = False
    explanation: |
      `Thermostat` depends only on *abstractions* (anything with `read`, anything with `on` and `off`): that's dependency inversion. The last test proves it by plugging in entirely different classes. In a real home the same thermostat code would drive real hardware, but every rule can be tested instantly, at any temperature, without it.

  - id: text-pipeline
    title: An extensible text pipeline
    difficulty: 2
    prompt: |
      Write a `Pipeline(steps)` class whose `run(text)` passes the text through each step's `apply(text)` method in order and returns the result. Then write four step classes, each with `apply(text)`:

      - `Strip()`: remove spaces at both ends.
      - `Lower()`: lower case.
      - `Replace(old, new)`: replace every `old` with `new`.
      - `Truncate(n)`: keep at most `n` characters, adding `"..."` if anything was cut (the result is then `n` characters plus the dots).

      `Pipeline` must not mention any step class by name: new steps should work without changing it.
    starter: |
      class Pipeline:
          pass
    tests:
      - name: single steps
        code: |
          assert Strip().apply("  hi  ") == "hi"
          assert Lower().apply("HeLLo") == "hello"
          assert Replace("cat", "dog").apply("cat and cat") == "dog and dog"
          assert Truncate(5).apply("Hello world") == "Hello..." and Truncate(20).apply("short") == "short"
      - name: pipelines
        code: |
          p = Pipeline([Strip(), Lower(), Replace(" ", "-"), Truncate(12)])
          assert p.run("  My First Blog Post Title ") == "my-first-blo...", f"Got {p.run('  My First Blog Post Title ')!r}"
          assert Pipeline([]).run("same") == "same"
      - name: open for extension
        code: |
          class Reverse:
              def apply(self, text):
                  return text[::-1]
          assert Pipeline([Lower(), Reverse()]).run("ABC") == "cba"
          import ast
          node = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.ClassDef) and n.name == "Pipeline"][0]
          body = ast.get_source_segment(source, node)
          for name in ["Strip", "Lower", "Replace", "Truncate", "isinstance"]:
              assert name not in body, f"Pipeline shouldn't mention {name}"
    hints:
      - "`Pipeline.run`: start with `text`, then `for step in self.steps: text = step.apply(text)`."
      - "`Replace` stores `old` and `new` in `__init__`; its `apply` returns `text.replace(self.old, self.new)`."
    solution: |
      class Pipeline:
          def __init__(self, steps):
              self.steps = list(steps)

          def run(self, text):
              for step in self.steps:
                  text = step.apply(text)
              return text


      class Strip:
          def apply(self, text):
              return text.strip()


      class Lower:
          def apply(self, text):
              return text.lower()


      class Replace:
          def __init__(self, old, new):
              self.old = old
              self.new = new

          def apply(self, text):
              return text.replace(self.old, self.new)


      class Truncate:
          def __init__(self, n):
              self.n = n

          def apply(self, text):
              if len(text) <= self.n:
                  return text
              return text[:self.n] + "..."
    explanation: |
      This is the open/closed principle at small scale: `Pipeline` is finished and never needs editing, yet the test adds a brand-new `Reverse` step. Composition (a pipeline *has* steps) plus polymorphism (every step has `apply`) makes the system extensible. Real tools, from photo filters to data-cleaning libraries, are built like this.

  - id: board-game
    title: A testable board game
    difficulty: 3
    prompt: |
      Build a simple snakes-and-ladders game, designed so it can be tested without real dice.

      - `Board(size, jumps)`: squares are numbered 0 (start) to `size` (finish). `jumps` is a dictionary like `{3: 22, 27: 1}` (ladders go up, snakes go down). `destination(square, roll)` returns where a counter on `square` ends up after a roll: move forward `roll` squares; if that would go **past** `size`, stay where you are; then, if the square has a jump, follow it (one jump only).
      - `Player(name)` with `square` starting at 0.
      - `Game(board, names, roll)`: creates a `Player` for each name; `roll` is a function returning the next die value. `take_turn()` moves the current player (in order, wrapping around), returns `(name, new square)`, and records the winner if they've reached `size`. `winner` is `None` until someone finishes. `play(max_turns=1000)` keeps taking turns until there's a winner (or the limit is reached) and returns the winner's name or `None`.
    starter: |
      class Board:
          pass


      class Player:
          pass


      class Game:
          pass
    tests:
      - name: Board.destination
        code: |
          b = Board(30, {3: 22, 27: 1})
          assert b.destination(0, 2) == 2
          assert b.destination(0, 3) == 22, "Landing on 3 climbs the ladder to 22"
          assert b.destination(24, 3) == 1, "Landing on 27 slides down to 1"
          assert b.destination(28, 2) == 30
          assert b.destination(28, 5) == 28, "Overshooting the finish means staying put"
      - name: turns rotate between players
        code: |
          rolls = iter([3, 1, 2, 6])
          g = Game(Board(30, {3: 22}), ["Ada", "Bo"], lambda: next(rolls))
          assert [p.name for p in g.players] == ["Ada", "Bo"] and g.winner is None
          assert g.take_turn() == ("Ada", 22)
          assert g.take_turn() == ("Bo", 1)
          assert g.take_turn() == ("Ada", 24)
          assert g.take_turn() == ("Bo", 7)
      - name: winning
        code: |
          rolls = iter([5, 1, 5, 1, 5])
          g = Game(Board(15, {}), ["Ada", "Bo"], lambda: next(rolls))
          assert g.play() == "Ada" and g.winner == "Ada"
          assert g.players[0].square == 15 and g.players[1].square == 2
      - name: play with a turn limit
        code: |
          g = Game(Board(10, {}), ["Ada"], lambda: 6)
          assert g.play(max_turns=5) is None, "With rolls of 6, Ada reaches 6 and then always overshoots 10"
          import random
          random.seed(3)
          g = Game(Board(100, {4: 56, 98: 8, 30: 70, 87: 24}), ["Ada", "Bo", "Cy"], lambda: random.randint(1, 6))
          w = g.play()
          assert w in ("Ada", "Bo", "Cy") and [p for p in g.players if p.name == w][0].square == 100
    hints:
      - "`destination`: `new = square + roll`; if `new > self.size`, return `square`; otherwise return `self.jumps.get(new, new)`."
      - "`Game` keeps `self.players`, `self.current = 0` (an index), and `self.winner = None`. After each turn, `self.current = (self.current + 1) % len(self.players)`."
      - "`play`: loop `max_turns` times, calling `take_turn()` and returning the winner as soon as there is one; after the loop return `self.winner`."
    solution: |
      class Board:
          def __init__(self, size, jumps):
              self.size = size
              self.jumps = dict(jumps)

          def destination(self, square, roll):
              new = square + roll
              if new > self.size:
                  return square
              return self.jumps.get(new, new)


      class Player:
          def __init__(self, name):
              self.name = name
              self.square = 0


      class Game:
          def __init__(self, board, names, roll):
              self.board = board
              self.players = [Player(n) for n in names]
              self.roll = roll
              self.current = 0
              self.winner = None

          def take_turn(self):
              player = self.players[self.current]
              player.square = self.board.destination(player.square, self.roll())
              if player.square == self.board.size:
                  self.winner = player.name
              self.current = (self.current + 1) % len(self.players)
              return player.name, player.square

          def play(self, max_turns=1000):
              for _ in range(max_turns):
                  self.take_turn()
                  if self.winner is not None:
                      return self.winner
              return self.winner
    explanation: |
      Each class has one responsibility: the `Board` knows the rules of movement, a `Player` knows where it is, and the `Game` runs turns. Because the die is **injected** as a function, the tests can script exact games (and even use `lambda: next(rolls)`, a one-line function handing out values from a list), while the last test plays a real random game with the same code. The rules about overshooting live only in `Board.destination`, so changing them later means changing one method.

commonMistakes:
  - title: Designing by typing
    explanation: |
      Starting to code before deciding which classes exist and what each is responsible for leads to tangled designs. Spend a few minutes with nouns, verbs and one-sentence responsibilities first.
  - title: Over-engineering
    explanation: |
      Ten classes and three layers of abstraction for a 40-line problem make code harder, not easier. Apply principles in proportion to the size of the program (KISS, YAGNI).
  - title: Creating collaborators inside the class
    explanation: |
      A class that builds its own sensor, database or random generator can't be tested in isolation. Pass collaborators in.
  - title: Ignoring smells because the code works
    explanation: |
      Duplication and god classes don't cause bugs today; they cause them during the next change. Refactor while the code is fresh in your mind, with tests to protect you.

summary:
  - "Good design keeps each change local. Encapsulation, composition and polymorphism are the tools."
  - "Find classes from **nouns** and methods from **verbs**; give each class a **one-sentence responsibility** (CRC cards help)."
  - "Aim for **high cohesion** (each class does one thing) and **low coupling** (classes depend on each other only through public interfaces)."
  - "**SOLID**: Single responsibility, Open/closed, Liskov substitution, Interface segregation, Dependency inversion."
  - "**Code smells** (god classes, duplication, long parameter lists, feature envy, type switches) suggest **refactoring**."
  - "Inject collaborators so classes can be tested with **fakes**; and keep it simple."
