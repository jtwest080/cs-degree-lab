quiz:
  - type: mcq
    question: When reading a problem description to find classes, what usually suggests methods?
    options: ["The nouns", "The verbs", "The adjectives", "The punctuation"]
    answer: 1
    explanation: Nouns suggest classes and attributes; verbs suggest what objects do.
  - type: mcq
    question: Which combination describes a good design?
    options: ["High cohesion, high coupling", "Low cohesion, low coupling", "High cohesion, low coupling", "Low cohesion, high coupling"]
    answer: 2
    explanation: Each class should be focused (cohesive) and depend little on the internals of others (loosely coupled).
  - type: mcq
    question: "A `Report` class both calculates sales figures and formats them as HTML. Which SOLID principle does it break?"
    options: ["Single responsibility", "Liskov substitution", "Interface segregation", "None"]
    answer: 0
    explanation: It has two reasons to change, the business rules and the output format.
  - type: mcq
    question: "Adding a new shape requires editing an `if`/`elif` chain in five functions. Which principle is being violated?"
    options: ["Open/closed", "Dependency inversion", "Single responsibility", "Liskov substitution"]
    answer: 0
    explanation: New behaviour should be added with new classes, not by modifying existing code.
  - type: mcq
    question: Why does passing a sensor object into a class make it easier to test?
    options:
      - It makes the class run faster
      - Tests can pass in a fake sensor that returns chosen values
      - It removes the need for tests
      - Python requires it
    answer: 1
    explanation: Dependency injection lets tests substitute simple test doubles for real collaborators.
  - type: mcq
    question: "What is the code smell called \"feature envy\"?"
    options:
      - A class with too many features
      - A method that mostly uses another object's data, suggesting it belongs in that other class
      - Wanting to add features you don't need
      - Copying features from another program
    answer: 1
    explanation: Moving the method to the class whose data it uses usually improves cohesion.
  - type: code
    question: |
      Write a class `Greeter(clock)` where `clock` is any object with a method `hour()` returning 0-23. `greet(name)` returns `"Good morning, <name>"` before 12, `"Good afternoon, <name>"` from 12 to 17, and `"Good evening, <name>"` from 18. Also write `FixedClock(h)` whose `hour()` always returns `h`, for testing.
    starter: |
      class Greeter:
          pass


      class FixedClock:
          pass
    tests:
      - name: Greeter works with a fake clock
        code: |
          for h, word in [(0, "morning"), (11, "morning"), (12, "afternoon"), (17, "afternoon"), (18, "evening"), (23, "evening")]:
              got = Greeter(FixedClock(h)).greet("Ada")
              assert got == f"Good {word}, Ada", f"At hour {h} got {got!r}"
    solution: |
      class Greeter:
          def __init__(self, clock):
              self.clock = clock

          def greet(self, name):
              h = self.clock.hour()
              if h < 12:
                  part = "morning"
              elif h < 18:
                  part = "afternoon"
              else:
                  part = "evening"
              return f"Good {part}, {name}"


      class FixedClock:
          def __init__(self, h):
              self.h = h

          def hour(self):
              return self.h
