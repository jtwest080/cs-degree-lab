title: The Corner Shop
brief: |
  Every till in every shop runs software with the same pieces: a catalogue of **products**, an **inventory** that tracks stock, a customer's **basket**, **special offers**, and a **checkout** that takes payment and prints a receipt. In this project you'll design and build that system with the object-oriented tools from this unit: dataclasses, encapsulation, composition, an abstract base class with polymorphic discount rules, and a family of custom exceptions.

  All money is stored as **whole numbers of pence** (so £2.50 is `250`), which avoids float rounding problems (Lesson 2.3). A helper `format_money(pence)` that turns `250` into `"£2.50"` is provided.

  **Exact requirements** (the tests check these, including with classes of their own that plug into yours):

  - **Products.** `Product` is a **frozen dataclass** with fields `sku` (str), `name` (str) and `price` (int, pence).
  - **Exceptions.** `ShopError(Exception)` is the base. `UnknownProduct(ShopError)` is raised with the unknown SKU as its message. `OutOfStock(ShopError)` is created as `OutOfStock(sku, requested, available)`, stores those three attributes, and has the message `"<sku>: requested <requested>, only <available> available"`.
  - **Inventory.**
    - `Inventory()`
    - `add_product(product, quantity)` adds a product, or **adds to** the stock of one already there.
    - `get(sku)` returns the `Product`; it raises `UnknownProduct` for a SKU it doesn't have, and so do the other methods.
    - `stock(sku)` returns the quantity.
    - `remove(sku, quantity)` takes stock away, or raises `OutOfStock` and changes nothing.
  - **Basket.**
    - `Basket(inventory)` belongs to an inventory.
    - `add(sku, quantity=1)` raises `UnknownProduct`, or `OutOfStock` if the **total** of that SKU in the basket would exceed the stock. It doesn't remove stock yet.
    - `remove(sku, quantity=1)` takes items out, dropping the line when it reaches 0. Removing more than is in the basket raises `ValueError`.
    - `lines()` returns a list of `(product, quantity)` tuples in the order products were first added.
    - `subtotal()` gives the total price in pence, and `len(basket)` gives the total number of items.
  - **Discount rules.** `DiscountRule` is an **abstract base class** (using `abc`) with abstract methods `discount(basket)` (pence to take off, which may be 0) and `description()`. Two concrete rules:
    - `PercentOff(percent, minimum)`: `percent`% off the subtotal, rounded **down** to whole pence, if the subtotal is at least `minimum` pence. Its description is `"<percent>% off orders over <format_money(minimum)>"`.
    - `MultiBuy(sku, buy, pay)`: "buy 3, pay for 2". For every complete group of `buy` items of that SKU, the customer pays for only `pay` of them. Its description is `"<buy> for <pay> on <product name>"`, looked up when `discount` is called. It must work out the name without breaking if the SKU isn't in the basket; store the name the first time it's seen, and use the SKU until then.
  - **Checkout.**
    - `Checkout(rules)` takes a list of rules.
    - `receipt(basket)` returns the receipt text (format below) **without** changing anything.
    - `pay(basket)` checks that every line is still in stock (raising `OutOfStock` and changing nothing if not), removes the stock from the inventory, returns the receipt, and empties the basket.
    - Discount lines appear only for rules giving more than 0, in the order of the rules. The total never goes below £0.00.

    ```text
    RECEIPT
    2 x Tea @ £2.50 = £5.00
    3 x Biscuits @ £1.20 = £3.60
    Subtotal: £8.60
    3 for 2 on Biscuits: -£1.20
    Total: £7.40
    ```

  - **`main()`** stocks an inventory with Tea (`T1`, 250p, 10 in stock) and Biscuits (`B1`, 120p, 6 in stock), fills a basket with 2 Tea and 3 Biscuits, pays at a checkout with the rules `[MultiBuy("B1", 3, 2), PercentOff(10, 2000)]`, prints the receipt, then prints `Tea left: 8` and `Biscuits left: 3`. The last line of the program calls `main()`.
steps:
  - title: Sketch the design
    body: |
      Before coding, draw the classes as boxes (Lesson 5.5) and write a one-sentence responsibility for each (Lesson 5.9). Which class owns the stock numbers? (The inventory, and only the inventory.) Who knows what's in the basket? Who knows about offers? Notice how the checkout only *uses* the others.
  - title: Products and exceptions
    body: |
      `Product` is three lines with `@dataclass(frozen=True)` (Lesson 5.8). Write the exception family next, because everything else raises them. `OutOfStock.__init__` calls `super().__init__(message)` and stores its three attributes.
  - title: The inventory
    body: |
      Store two private dictionaries keyed by SKU: one for products and one for quantities (or one dictionary of `[product, quantity]` pairs). A small private helper that raises `UnknownProduct` for a missing SKU saves repeating that check in every method. Remember "check, then change" (Lesson 5.2) in `remove`.
  - title: The basket
    body: |
      The basket keeps a dictionary from SKU to quantity (dictionaries remember insertion order, so `lines()` comes out in the order products were first added) and asks its inventory for products and stock levels. That's composition and delegation: the basket never touches the inventory's private data.
  - title: Discount rules
    body: |
      Write `DiscountRule(ABC)` with two `@abstractmethod`s (Lesson 5.7). Each rule only needs the basket's public methods: `subtotal()` for `PercentOff`, and `lines()` for `MultiBuy`. For "3 for 2" with 7 items, there are `7 // 3 = 2` complete groups, each saving `3 - 2 = 1` item's price.
  - title: Checkout and receipt
    body: |
      Build the receipt as a list of lines, joined with `"\n"`. Write `receipt` first, since `pay` reuses it. In `pay`, check **every** line's stock before removing **any**, so a failed payment leaves the inventory untouched, the same idea as the bank transfer in Lesson 5.2. Then write `main()`.
checklist:
  - text: Product is a frozen, hashable dataclass
    test: Product is a frozen dataclass
  - text: Custom exceptions form a hierarchy with useful attributes
    test: exception hierarchy
  - text: Inventory adds, looks up, counts and removes stock safely
    test: inventory
  - text: Basket checks stock, tracks lines in order, and totals correctly
    test: basket
  - text: DiscountRule is abstract, and PercentOff and MultiBuy are correct
    test: discount rules
  - text: Checkout works with any DiscountRule, including new ones
    test: checkout accepts new rules
  - text: Receipts match the exact format
    test: receipt format
  - text: Paying removes stock, empties the basket, and fails safely
    test: paying
  - text: main prints the receipt and stock levels
    test: main prints the receipt
  - text: I drew the classes and wrote a one-sentence responsibility for each before coding
  - text: No class reaches into another class's private (underscore) attributes
starter: |
  # Unit 5 project: the Corner Shop
  from abc import ABC, abstractmethod
  from dataclasses import dataclass


  def format_money(pence):
      """Format a number of pence as pounds, e.g. 250 -> '£2.50'."""
      return f"£{pence // 100}.{pence % 100:02d}"


  # Products


  # Exceptions: ShopError, UnknownProduct, OutOfStock


  class Inventory:
      """Knows every product and how many of each are in stock."""


  class Basket:
      """A customer's chosen items, checked against an inventory."""


  class DiscountRule(ABC):
      """An offer that can take money off a basket."""


  class PercentOff(DiscountRule):
      pass


  class MultiBuy(DiscountRule):
      pass


  class Checkout:
      """Applies discount rules, prints receipts and takes payment."""


  def main():
      """Run one sale and print the receipt."""


  main()
tests:
  - name: Product is a frozen dataclass
    code: |
      p = Product("T1", "Tea", 250)
      assert (p.sku, p.name, p.price) == ("T1", "Tea", 250)
      assert p == Product("T1", "Tea", 250) and len({p, Product("T1", "Tea", 250)}) == 1, "Products should be equal by value and hashable"
      try:
          p.price = 1
          assert False, "Product should be frozen"
      except AttributeError:
          pass
  - name: exception hierarchy
    code: |
      assert issubclass(UnknownProduct, ShopError) and issubclass(OutOfStock, ShopError) and issubclass(ShopError, Exception)
      e = OutOfStock("B1", 5, 2)
      assert (e.sku, e.requested, e.available) == ("B1", 5, 2)
      assert str(e) == "B1: requested 5, only 2 available", f"Got {str(e)!r}"
  - name: inventory
    code: |
      inv = Inventory()
      tea = Product("T1", "Tea", 250)
      inv.add_product(tea, 10)
      inv.add_product(tea, 5)
      assert inv.get("T1") == tea and inv.stock("T1") == 15, "Adding a product again should add to its stock"
      inv.remove("T1", 4)
      assert inv.stock("T1") == 11
      try:
          inv.remove("T1", 12)
          assert False, "Removing too much should raise OutOfStock"
      except OutOfStock as e:
          assert (e.requested, e.available) == (12, 11)
      assert inv.stock("T1") == 11, "A failed remove changes nothing"
      for action in (lambda: inv.get("ZZ"), lambda: inv.stock("ZZ"), lambda: inv.remove("ZZ", 1)):
          try:
              action()
              assert False, "Unknown SKUs should raise UnknownProduct"
          except UnknownProduct:
              pass
  - name: basket
    code: |
      inv = Inventory()
      inv.add_product(Product("T1", "Tea", 250), 3)
      inv.add_product(Product("B1", "Biscuits", 120), 10)
      b = Basket(inv)
      b.add("B1", 2); b.add("T1"); b.add("B1")
      assert [(p.sku, q) for p, q in b.lines()] == [("B1", 3), ("T1", 1)], f"Got {b.lines()}"
      assert b.subtotal() == 610 and len(b) == 4
      try:
          b.add("T1", 3)
          assert False, "1 + 3 Tea exceeds the stock of 3: should raise OutOfStock"
      except OutOfStock as e:
          assert (e.sku, e.requested, e.available) == ("T1", 4, 3), f"Got {e.sku}, {e.requested}, {e.available}"
      assert inv.stock("T1") == 3, "Adding to a basket doesn't remove stock"
      try:
          b.add("ZZ")
          assert False, "Should raise UnknownProduct"
      except UnknownProduct:
          pass
      b.remove("T1")
      assert [(p.sku, q) for p, q in b.lines()] == [("B1", 3)], "A line at 0 should disappear"
      try:
          b.remove("B1", 4)
          assert False, "Removing more than is in the basket should raise ValueError"
      except ValueError:
          pass
      assert len(b) == 3
  - name: discount rules
    code: |
      try:
          DiscountRule()
          assert False, "DiscountRule should be abstract"
      except TypeError:
          pass
      inv = Inventory()
      inv.add_product(Product("T1", "Tea", 250), 50)
      inv.add_product(Product("B1", "Biscuits", 120), 50)
      b = Basket(inv)
      b.add("B1", 7); b.add("T1", 4)
      assert b.subtotal() == 1840
      m = MultiBuy("B1", 3, 2)
      assert m.discount(b) == 240, f"7 biscuits on 3-for-2 should save 2 x 120 = 240, got {m.discount(b)}"
      assert m.description() == "3 for 2 on Biscuits", f"Got {m.description()!r}"
      assert MultiBuy("T1", 5, 4).discount(b) == 0
      assert MultiBuy("ZZ", 2, 1).discount(b) == 0, "A MultiBuy for something not in the basket gives 0"
      pc = PercentOff(10, 1500)
      assert pc.discount(b) == 184 and pc.description() == "10% off orders over £15.00", f"Got {pc.discount(b)}, {pc.description()!r}"
      assert PercentOff(15, 1000).discount(b) == 276
      assert PercentOff(33, 0).discount(b) == 607, "Round down: 33% of 1840 is 607.2"
      assert PercentOff(10, 2000).discount(b) == 0, "Below the minimum spend: no discount"
  - name: checkout accepts new rules
    code: |
      class FlatOff(DiscountRule):
          def discount(self, basket):
              return 5000
          def description(self):
              return "Staff discount"
      inv = Inventory()
      inv.add_product(Product("T1", "Tea", 250), 5)
      b = Basket(inv)
      b.add("T1", 2)
      text = Checkout([FlatOff()]).receipt(b)
      assert text.splitlines()[-2:] == ["Staff discount: -£50.00", "Total: £0.00"], f"The total can't go below £0.00. Receipt:\n{text}"
  - name: receipt format
    code: |
      inv = Inventory()
      inv.add_product(Product("T1", "Tea", 250), 10)
      inv.add_product(Product("B1", "Biscuits", 120), 6)
      b = Basket(inv)
      b.add("T1", 2); b.add("B1", 3)
      text = Checkout([MultiBuy("B1", 3, 2), PercentOff(10, 2000)]).receipt(b)
      want = "RECEIPT\n2 x Tea @ £2.50 = £5.00\n3 x Biscuits @ £1.20 = £3.60\nSubtotal: £8.60\n3 for 2 on Biscuits: -£1.20\nTotal: £7.40"
      assert text.strip() == want, f"Receipt was:\n{text}\n\nExpected:\n{want}"
      assert inv.stock("T1") == 10 and len(b) == 5, "receipt() mustn't change anything"
      b.add("T1", 6)
      text = Checkout([MultiBuy("B1", 3, 2), PercentOff(10, 2000)]).receipt(b)
      assert text.strip().splitlines()[-3:] == ["3 for 2 on Biscuits: -£1.20", "10% off orders over £20.00: -£2.36", "Total: £20.04"], f"Receipt was:\n{text}"
  - name: paying
    code: |
      inv = Inventory()
      inv.add_product(Product("T1", "Tea", 250), 10)
      inv.add_product(Product("B1", "Biscuits", 120), 6)
      b = Basket(inv)
      b.add("T1", 2); b.add("B1", 3)
      text = Checkout([]).pay(b)
      assert text.strip().endswith("Total: £8.60"), f"Receipt was:\n{text}"
      assert inv.stock("T1") == 8 and inv.stock("B1") == 3 and len(b) == 0 and b.lines() == []
      b1, b2 = Basket(inv), Basket(inv)
      b1.add("T1", 1); b1.add("B1", 3)
      b2.add("T1", 5); b2.add("B1", 2)
      Checkout([]).pay(b1)
      try:
          Checkout([]).pay(b2)
          assert False, "Only 0 biscuits are left now: paying should raise OutOfStock"
      except OutOfStock:
          pass
      assert inv.stock("T1") == 7 and inv.stock("B1") == 0, "A failed payment must not remove any stock, even for lines that were available"
      assert len(b2) == 7, "A failed payment leaves the basket as it was"
  - name: main prints the receipt
    code: |
      want = ["RECEIPT", "2 x Tea @ £2.50 = £5.00", "3 x Biscuits @ £1.20 = £3.60", "Subtotal: £8.60", "3 for 2 on Biscuits: -£1.20", "Total: £7.40", "Tea left: 8", "Biscuits left: 3"]
      got = [line for line in output.strip().splitlines() if line.strip()]
      assert got == want, "Your program printed:\n" + output + "\nExpected:\n" + "\n".join(want)
solution: |
  # Unit 5 project: the Corner Shop
  from abc import ABC, abstractmethod
  from dataclasses import dataclass


  def format_money(pence):
      """Format a number of pence as pounds, e.g. 250 -> '£2.50'."""
      return f"£{pence // 100}.{pence % 100:02d}"


  # Products

  @dataclass(frozen=True)
  class Product:
      sku: str
      name: str
      price: int  # pence


  # Exceptions

  class ShopError(Exception):
      """Base class for everything that can go wrong in the shop."""


  class UnknownProduct(ShopError):
      """Raised with the SKU that isn't in the inventory."""


  class OutOfStock(ShopError):
      def __init__(self, sku, requested, available):
          super().__init__(f"{sku}: requested {requested}, only {available} available")
          self.sku = sku
          self.requested = requested
          self.available = available


  class Inventory:
      """Knows every product and how many of each are in stock."""

      def __init__(self):
          self._products = {}
          self._stock = {}

      def _check(self, sku):
          if sku not in self._products:
              raise UnknownProduct(sku)

      def add_product(self, product, quantity):
          if product.sku not in self._products:
              self._products[product.sku] = product
              self._stock[product.sku] = 0
          self._stock[product.sku] += quantity

      def get(self, sku):
          self._check(sku)
          return self._products[sku]

      def stock(self, sku):
          self._check(sku)
          return self._stock[sku]

      def remove(self, sku, quantity):
          self._check(sku)
          if quantity > self._stock[sku]:
              raise OutOfStock(sku, quantity, self._stock[sku])
          self._stock[sku] -= quantity


  class Basket:
      """A customer's chosen items, checked against an inventory."""

      def __init__(self, inventory):
          self.inventory = inventory
          self._items = {}  # sku -> quantity, in the order first added

      def add(self, sku, quantity=1):
          available = self.inventory.stock(sku)  # raises UnknownProduct
          wanted = self._items.get(sku, 0) + quantity
          if wanted > available:
              raise OutOfStock(sku, wanted, available)
          self._items[sku] = wanted

      def remove(self, sku, quantity=1):
          have = self._items.get(sku, 0)
          if quantity > have:
              raise ValueError(f"Only {have} of {sku} in the basket")
          if quantity == have:
              del self._items[sku]
          else:
              self._items[sku] = have - quantity

      def lines(self):
          return [(self.inventory.get(sku), qty) for sku, qty in self._items.items()]

      def subtotal(self):
          return sum(product.price * qty for product, qty in self.lines())

      def clear(self):
          self._items = {}

      def __len__(self):
          return sum(self._items.values())


  class DiscountRule(ABC):
      """An offer that can take money off a basket."""

      @abstractmethod
      def discount(self, basket):
          """Pence to take off this basket (0 if the offer doesn't apply)."""

      @abstractmethod
      def description(self):
          """Text shown on the receipt."""


  class PercentOff(DiscountRule):
      def __init__(self, percent, minimum):
          self.percent = percent
          self.minimum = minimum

      def discount(self, basket):
          subtotal = basket.subtotal()
          if subtotal < self.minimum:
              return 0
          return subtotal * self.percent // 100

      def description(self):
          return f"{self.percent}% off orders over {format_money(self.minimum)}"


  class MultiBuy(DiscountRule):
      def __init__(self, sku, buy, pay):
          self.sku = sku
          self.buy = buy
          self.pay = pay
          self.name = sku  # replaced by the product name once seen

      def discount(self, basket):
          for product, qty in basket.lines():
              if product.sku == self.sku:
                  self.name = product.name
                  return (qty // self.buy) * (self.buy - self.pay) * product.price
          return 0

      def description(self):
          return f"{self.buy} for {self.pay} on {self.name}"


  class Checkout:
      """Applies discount rules, prints receipts and takes payment."""

      def __init__(self, rules):
          self.rules = list(rules)

      def receipt(self, basket):
          lines = ["RECEIPT"]
          for product, qty in basket.lines():
              lines.append(f"{qty} x {product.name} @ {format_money(product.price)} = {format_money(product.price * qty)}")
          subtotal = basket.subtotal()
          lines.append(f"Subtotal: {format_money(subtotal)}")
          total = subtotal
          for rule in self.rules:
              amount = rule.discount(basket)
              if amount > 0:
                  lines.append(f"{rule.description()}: -{format_money(amount)}")
                  total -= amount
          lines.append(f"Total: {format_money(max(total, 0))}")
          return "\n".join(lines)

      def pay(self, basket):
          inventory = basket.inventory
          for product, qty in basket.lines():
              available = inventory.stock(product.sku)
              if qty > available:
                  raise OutOfStock(product.sku, qty, available)
          text = self.receipt(basket)
          for product, qty in basket.lines():
              inventory.remove(product.sku, qty)
          basket.clear()
          return text


  def main():
      """Run one sale and print the receipt."""
      inventory = Inventory()
      inventory.add_product(Product("T1", "Tea", 250), 10)
      inventory.add_product(Product("B1", "Biscuits", 120), 6)
      basket = Basket(inventory)
      basket.add("T1", 2)
      basket.add("B1", 3)
      till = Checkout([MultiBuy("B1", 3, 2), PercentOff(10, 2000)])
      print(till.pay(basket))
      print(f"Tea left: {inventory.stock('T1')}")
      print(f"Biscuits left: {inventory.stock('B1')}")


  main()
stretch:
  - "Add a `Customer` class with a loyalty card, and a `LoyaltyDiscount` rule that only applies when the basket belongs to a cardholder. Did you need to change `Checkout`?"
  - "Rules can currently stack without limit. Add a `BestOf(rules)` rule that applies only the single biggest discount among several rules. (It's a rule made of rules: composition plus polymorphism.)"
  - "Give the inventory a low-stock alert: pass in an object with a `notify(product, quantity)` method, call it whenever stock drops below a threshold, and test it with a fake notifier."
  - "Write `Inventory.from_csv(filename)`, a class method that loads products and stock from a CSV file (Lesson 3.9)."
