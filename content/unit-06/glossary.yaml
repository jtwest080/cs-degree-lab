# Terms introduced in Unit 6. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Proposition
    definition: A statement that is either true or false, such as "7 is prime". Questions and commands are not propositions.
    lesson: u6-logic
  - term: Logical connective
    definition: An operator that builds compound propositions from simpler ones, such as not (¬), and (∧), or (∨), implies (→) and if and only if (↔).
    lesson: u6-logic
  - term: Implication (if-then)
    definition: "p → q, read \"if p then q\". It is false only when p is true and q is false; when p is false it is true automatically."
    lesson: u6-logic
  - term: Converse, inverse and contrapositive
    definition: "For p → q, the converse is q → p, the inverse is ¬p → ¬q, and the contrapositive is ¬q → ¬p. Only the contrapositive is logically equivalent to the original."
    lesson: u6-logic
  - term: Biconditional (if and only if)
    definition: "p ↔ q, true exactly when p and q have the same truth value. \"If and only if\" is often written \"iff\"."
    lesson: u6-logic
  - term: Tautology
    definition: A compound proposition that is true for every combination of truth values, such as p ∨ ¬p.
    lesson: u6-logic
  - term: Contradiction (logic)
    definition: A compound proposition that is false for every combination of truth values, such as p ∧ ¬p.
    lesson: u6-logic
  - term: Logically equivalent
    definition: Two propositions with identical truth tables, so either can replace the other. Written ≡.
    lesson: u6-logic
  - term: Satisfiable
    definition: A proposition that is true for at least one combination of truth values. Deciding satisfiability (SAT) is a famously hard problem.
    lesson: u6-logic
  - term: Disjunctive normal form (DNF)
    definition: A formula written as an OR of ANDs, with one AND-clause for each true row of its truth table.
    lesson: u6-logic
  - term: Modus ponens
    definition: The rule of inference that from p and p → q you may conclude q.
    lesson: u6-logic
  - term: Predicate
    definition: A statement with variables that becomes true or false once values are filled in, such as "x is even". In code, a function returning a bool.
    lesson: u6-predicates
  - term: Domain (of discourse)
    definition: The set of values a variable in a predicate may take, such as all integers or all students.
    lesson: u6-predicates
  - term: Universal quantifier (∀)
    definition: "\"For all\": ∀x P(x) is true when P(x) holds for every x in the domain. Like Python's `all`."
    lesson: u6-predicates
  - term: Existential quantifier (∃)
    definition: "\"There exists\": ∃x P(x) is true when P(x) holds for at least one x in the domain. Like Python's `any`."
    lesson: u6-predicates
  - term: Vacuous truth
    definition: A "for all" statement over an empty domain is true, because there is nothing to break it. `all([])` is True.
    lesson: u6-predicates
  - term: Element
    definition: A member of a set, written x ∈ A.
    lesson: u6-sets-relations
  - term: Set-builder notation
    definition: Describing a set by a rule, such as {x² | x ∈ ℕ, x < 5}. Python's set comprehensions follow the same pattern.
    lesson: u6-sets-relations
  - term: Power set
    definition: The set of all subsets of a set. A set with n elements has 2ⁿ subsets.
    lesson: u6-sets-relations
  - term: Cartesian product
    definition: A × B, the set of all ordered pairs (a, b) with a from A and b from B. `itertools.product` generates it.
    lesson: u6-sets-relations
  - term: Relation
    definition: A set of ordered pairs saying which elements are related to which, such as "is a prerequisite of".
    lesson: u6-sets-relations
  - term: Reflexive, symmetric, transitive
    definition: "Properties of a relation R: reflexive if every a relates to itself; symmetric if a R b implies b R a; transitive if a R b and b R c imply a R c."
    lesson: u6-sets-relations
  - term: Equivalence relation
    definition: A relation that is reflexive, symmetric and transitive. It splits a set into equivalence classes of mutually related elements.
    lesson: u6-sets-relations
  - term: Partition
    definition: A division of a set into non-empty, non-overlapping pieces that together cover the whole set.
    lesson: u6-sets-relations
  - term: Partial order
    definition: A relation that is reflexive, antisymmetric and transitive, such as ≤ or "is a subset of". Some pairs may be incomparable.
    lesson: u6-sets-relations
  - term: Transitive closure
    definition: The smallest transitive relation containing a given relation, such as all direct and indirect prerequisites of a course.
    lesson: u6-sets-relations
  - term: Function (mathematics)
    definition: A relation from A to B that pairs every element of A (the domain) with exactly one element of B (the codomain).
    lesson: u6-sets-relations
  - term: Injective, surjective, bijective
    definition: "A function is injective (one-to-one) if different inputs give different outputs, surjective (onto) if every possible output is reached, and bijective if both, so it has an inverse."
    lesson: u6-sets-relations
  - term: Proof
    definition: A chain of logical steps showing that a statement must be true, starting from definitions and facts already established.
    lesson: u6-proofs
  - term: Direct proof
    definition: Proving p → q by assuming p and reasoning step by step until you reach q.
    lesson: u6-proofs
  - term: Proof by contrapositive
    definition: Proving p → q by proving the equivalent statement ¬q → ¬p instead.
    lesson: u6-proofs
  - term: Proof by contradiction
    definition: Proving a statement by assuming it is false and showing that this leads to something impossible.
    lesson: u6-proofs
  - term: Proof by cases (exhaustion)
    definition: Proving a statement by splitting into cases that cover every possibility and proving each one.
    lesson: u6-proofs
  - term: Proof by construction
    definition: Proving that something exists by actually producing an example of it.
    lesson: u6-proofs
  - term: Prime number
    definition: An integer greater than 1 whose only positive divisors are 1 and itself.
    lesson: u6-proofs
  - term: Mathematical induction
    definition: Proving P(n) for every n by proving a base case P(1) and an inductive step showing that P(k) implies P(k + 1).
    lesson: u6-induction
  - term: Inductive hypothesis
    definition: In the inductive step, the assumption that the statement holds for k (or, in strong induction, for every value up to k).
    lesson: u6-induction
  - term: Strong induction
    definition: Induction where the step may assume the statement for all smaller values, not just the one before.
    lesson: u6-induction
  - term: Structural induction
    definition: Induction over recursively defined structures such as trees, proving a property for the base structures and showing it survives each way of building larger ones.
    lesson: u6-induction
  - term: Recurrence relation
    definition: An equation defining each term of a sequence from earlier terms, such as T(n) = 2T(n − 1) + 1. Recurrences describe the running time of recursive algorithms.
    lesson: u6-induction
  - term: Closed form
    definition: A formula that computes the nth term of a sequence directly, without computing all the earlier terms.
    lesson: u6-induction
  - term: Fundamental Theorem of Arithmetic
    definition: Every integer greater than 1 can be written as a product of primes in exactly one way, apart from the order of the factors.
    lesson: u6-induction
  - term: Sum rule and product rule
    definition: "Counting rules: disjoint alternatives add (m + n ways), and independent steps multiply (m × n ways)."
    lesson: u6-counting
  - term: Factorial (n!)
    definition: The product n × (n − 1) × ... × 1, the number of ways to arrange n different items in order. 0! = 1.
    lesson: u6-counting
  - term: Permutation
    definition: An ordered arrangement of items. There are P(n, k) = n! / (n − k)! ways to arrange k items chosen from n.
    lesson: u6-counting
  - term: Combination
    definition: A selection of items where order doesn't matter. There are C(n, k) ways to choose k items from n.
    lesson: u6-counting
  - term: Binomial coefficient
    definition: C(n, k) = n! / (k! (n − k)!), "n choose k". Python's `math.comb(n, k)` computes it.
    lesson: u6-counting
  - term: "Pascal's triangle"
    definition: The triangle of binomial coefficients in which each entry is the sum of the two above it. Row n gives the coefficients of (x + y)ⁿ.
    lesson: u6-counting
  - term: Pigeonhole principle
    definition: If more than n items are placed into n boxes, some box contains at least two. More generally, some box holds at least ⌈N/n⌉ of N items.
    lesson: u6-counting
  - term: Inclusion-exclusion
    definition: "Counting a union of overlapping sets by adding the sizes of the sets, subtracting the pairwise overlaps, adding back triple overlaps, and so on: |A ∪ B| = |A| + |B| − |A ∩ B|."
    lesson: u6-counting
  - term: Sample space
    definition: The set of all possible outcomes of a random experiment, such as the 36 results of rolling two dice.
    lesson: u6-probability
  - term: Event
    definition: A subset of the sample space, such as "the dice total 7". Its probability is the fraction of equally likely outcomes it contains.
    lesson: u6-probability
  - term: Conditional probability
    definition: P(A | B), the probability of A given that B happened, equal to P(A and B) / P(B).
    lesson: u6-probability
  - term: Independent events
    definition: Events where knowing one happened doesn't change the probability of the other, so P(A and B) = P(A) × P(B).
    lesson: u6-probability
  - term: "Bayes' rule"
    definition: P(A | B) = P(B | A) × P(A) / P(B), used to update a probability when new evidence arrives.
    lesson: u6-probability
  - term: Base rate
    definition: The underlying frequency of something before any evidence, such as how common a disease is. Ignoring it causes badly wrong conclusions.
    lesson: u6-probability
  - term: Random variable
    definition: A number whose value depends on the outcome of a random experiment, such as the total of two dice.
    lesson: u6-probability
  - term: Expected value
    definition: The long-run average of a random variable, Σ value × probability. Expected values always add.
    lesson: u6-probability
  - term: Variance and standard deviation
    definition: Variance is the expected squared distance of a random variable from its mean, measuring spread. The standard deviation is its square root.
    lesson: u6-probability
  - term: Monte Carlo simulation
    definition: Estimating a probability or quantity by running a random experiment many times and averaging the results.
    lesson: u6-probability
  - term: Random seed
    definition: A starting value for a pseudo-random number generator. The same seed always produces the same sequence, making runs repeatable.
    lesson: u6-probability
  - term: Law of large numbers
    definition: As the number of trials grows, the average result gets closer to the expected value.
    lesson: u6-probability
  - term: Divisibility
    definition: d divides a (written d | a) when a = d × k for some integer k, that is, when a % d == 0.
    lesson: u6-number-theory
  - term: Sieve of Eratosthenes
    definition: An algorithm that finds all primes up to n by crossing out the multiples of each prime in turn, in about n log log n steps.
    lesson: u6-number-theory
  - term: Greatest common divisor (gcd)
    definition: The largest integer dividing two numbers. gcd(48, 18) = 6.
    lesson: u6-number-theory
  - term: Least common multiple (lcm)
    definition: The smallest positive number that is a multiple of two numbers, equal to a × b / gcd(a, b).
    lesson: u6-number-theory
  - term: "Euclid's algorithm"
    definition: Computes gcd(a, b) by repeatedly replacing (a, b) with (b, a mod b) until the second number is 0. It takes O(log n) steps.
    lesson: u6-number-theory
  - term: Modular arithmetic
    definition: Arithmetic with remainders, "clock arithmetic", where numbers wrap around after reaching the modulus m.
    lesson: u6-number-theory
  - term: Congruence
    definition: a ≡ b (mod m) means a and b have the same remainder when divided by m, that is, m divides a − b.
    lesson: u6-number-theory
  - term: Check digit
    definition: An extra digit chosen so that a weighted sum of all the digits is divisible by a fixed number, so that most typing errors are detected.
    lesson: u6-number-theory
  - term: Square-and-multiply
    definition: Fast exponentiation that uses the binary digits of the exponent, computing base^exp mod m in O(log exp) multiplications.
    lesson: u6-number-theory
  - term: Modular inverse
    definition: A number x with a × x ≡ 1 (mod m). It exists exactly when gcd(a, m) = 1, and plays the role of division.
    lesson: u6-number-theory
  - term: Extended Euclidean algorithm
    definition: A version of Euclid's algorithm that also finds integers x and y with a × x + b × y = gcd(a, b), used to compute modular inverses.
    lesson: u6-number-theory
  - term: RSA
    definition: A public-key encryption scheme based on modular exponentiation. It is secure because multiplying two large primes is easy but factorising their product is believed to be infeasible.
    lesson: u6-number-theory
  - term: Graph
    definition: A set of vertices (nodes) together with a set of edges, each joining a pair of vertices.
    lesson: u6-graphs
  - term: Directed graph (digraph)
    definition: A graph whose edges have a direction, going from one vertex to another, like web links.
    lesson: u6-graphs
  - term: Degree
    definition: The number of edges at a vertex. In a directed graph, in-degree counts arriving edges and out-degree counts leaving edges.
    lesson: u6-graphs
  - term: Handshake lemma
    definition: In any undirected graph, the degrees add up to twice the number of edges, so the number of odd-degree vertices is even.
    lesson: u6-graphs
  - term: Adjacency list
    definition: A graph representation mapping each vertex to a collection of its neighbours. Uses O(V + E) space.
    lesson: u6-graphs
  - term: Adjacency matrix
    definition: A V × V grid with a 1 in row i, column j when vertices i and j are joined. Uses O(V²) space.
    lesson: u6-graphs
  - term: Density (graph)
    definition: The fraction of possible edges actually present, E / C(V, 2) for an undirected graph. Sparse graphs have low density.
    lesson: u6-graphs
  - term: Walk, path and cycle
    definition: A walk is a sequence of vertices joined by edges; a path is a walk with no repeated vertices; a cycle is a walk of length at least 3 that returns to its start without other repeats.
    lesson: u6-graphs
  - term: Connected component
    definition: A largest group of vertices in which every vertex can reach every other. A graph is connected if it has only one.
    lesson: u6-graphs
  - term: Tree (graph)
    definition: A connected graph with no cycles. A tree with n vertices has exactly n − 1 edges.
    lesson: u6-graphs
  - term: Euler path and circuit
    definition: A walk using every edge exactly once; a circuit also ends where it started. A connected graph has a circuit iff all degrees are even, and a path iff 0 or 2 degrees are odd.
    lesson: u6-graphs
