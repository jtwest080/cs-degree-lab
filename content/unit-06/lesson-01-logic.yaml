id: u6-logic
title: Propositional Logic
minutes: 50
objective: |
  Write statements in the language of **propositional logic**, evaluate them with **truth tables**, understand **implication** precisely (including its surprising cases), recognise **tautologies** and **logical equivalences**, and use Python to check them all by brute force.
outcomes:
  - Identify propositions and combine them with ¬, ∧, ∨, → and ↔
  - Build the truth table of any compound proposition, by hand and in Python
  - Explain why "if p then q" is true whenever p is false
  - Form the converse, inverse and contrapositive of an implication, and know which are equivalent
  - Recognise tautologies, contradictions and logically equivalent formulas
  - Express any truth table as a formula using only and, or and not

sections:
  - heading: Why mathematics, and why logic first?
    body: |
      This unit steps back from writing programs to the **mathematics** that computer science is built on. It's called *discrete* mathematics because it deals with separate, countable things (true/false, whole numbers, items in sets, nodes in networks) rather than the smooth, continuous quantities of calculus. That's exactly the world computers live in.

      Why bother, when you can already write working code? Because maths lets you be **certain**. Testing shows a program works on the inputs you tried; a proof shows it works on *all* inputs. Discrete maths is also the language of the rest of the degree: algorithms (Unit 8), databases (Unit 12), security (Unit 16) and the theory of computation (Unit 15) all use it constantly.

      We start with **logic**, the mathematics of reasoning. You met its building blocks twice already: as logic gates made of transistors (Lesson 1.3) and as Python's `and`, `or` and `not` (Lesson 2.5). Now we make it precise.

  - heading: Propositions and connectives
    body: |
      A **proposition** is a statement that is either **true** or **false**, but not both:

      - "7 is a prime number." (true)
      - "London is the capital of France." (false)
      - "x > 5" is *not* a proposition on its own, because its truth depends on `x`. (Lesson 6.2 deals with statements like that.)
      - "Close the door!" is not a proposition: it's neither true nor false.

      We name propositions with letters such as p, q and r, and combine them with **logical connectives**:

      | Symbol | Name | Read as | Python |
      |---|---|---|---|
      | ¬p | negation | not p | `not p` |
      | p ∧ q | conjunction | p and q | `p and q` |
      | p ∨ q | disjunction | p or q (or both) | `p or q` |
      | p ⊕ q | exclusive or | p or q but not both | `p != q` |
      | p → q | implication | if p then q | `(not p) or q` |
      | p ↔ q | biconditional | p if and only if q | `p == q` |

      Note that the logical "or" is **inclusive**: "p ∨ q" is true when both are true. Everyday English often means the exclusive version ("tea or coffee?"), which is why logic needs precise symbols.

  - heading: Truth tables
    body: |
      The meaning of a compound proposition is completely described by its **truth table**: a row for every combination of truth values of its variables, showing the result. With n variables there are 2ⁿ rows (Lesson 1.1: n bits make 2ⁿ patterns).

      | p | q | ¬p | p ∧ q | p ∨ q | p → q | p ↔ q |
      |---|---|---|---|---|---|---|
      | T | T | F | T | T | T | T |
      | T | F | F | F | T | F | F |
      | F | T | T | F | T | T | F |
      | F | F | T | F | F | T | T |

      To evaluate a bigger formula like (p ∨ q) ∧ ¬r, add a column for each sub-formula and work outward, exactly as Python evaluates an expression from the inside out (Lesson 2.5). Python makes this effortless: `itertools.product([True, False], repeat=n)` (Lesson 5.8) generates every row.

  - heading: Implication, carefully
    body: |
      The connective that trips everyone up is **implication**, p → q, "if p then q". Here p is the **hypothesis** and q the **conclusion**. Look at its column above: p → q is false in **only one** row, where p is true and q is false.

      Think of it as a **promise**. A parent says: "If you tidy your room, you'll get pocket money."

      - Tidied, got money: promise kept (true).
      - Tidied, no money: promise **broken** (false).
      - Didn't tidy, got money anyway: the promise wasn't broken; it said nothing about this case (true).
      - Didn't tidy, no money: promise kept (true).

      So **when p is false, p → q is automatically true**, called *vacuously* true. "If pigs can fly, then I'm the Queen" is a true implication! This also explains the Python translation: p → q is equivalent to `(not p) or q`.

      Implication is not the same as cause and effect, and p → q does **not** mean q → p. From one implication you can build three relatives:

      | Name | Form | Example |
      |---|---|---|
      | original | p → q | If it rains, the ground is wet. |
      | **converse** | q → p | If the ground is wet, it rained. (Not necessarily: a sprinkler!) |
      | **inverse** | ¬p → ¬q | If it doesn't rain, the ground isn't wet. (Not necessarily.) |
      | **contrapositive** | ¬q → ¬p | If the ground isn't wet, it didn't rain. (Always equivalent to the original.) |

      > **Key idea:** An implication and its **contrapositive** always have the same truth value. The converse and inverse don't follow from the original. Confusing an implication with its converse is one of the most common errors in reasoning, in maths and in everyday arguments. Lesson 6.4 uses the contrapositive as a proof technique.

  - heading: Tautologies and equivalences
    body: |
      A **tautology** is a formula that is true in **every** row of its truth table, whatever its variables are. p ∨ ¬p ("either it's raining or it isn't") is a tautology. A **contradiction** is false in every row, like p ∧ ¬p. A formula that's true in at least one row is **satisfiable**.

      Two formulas are **logically equivalent**, written ≡, if they have identical truth tables: they mean the same thing, even if they look different. The most useful equivalences:

      | Law | Equivalence |
      |---|---|
      | Double negation | ¬¬p ≡ p |
      | De Morgan | ¬(p ∧ q) ≡ ¬p ∨ ¬q, and ¬(p ∨ q) ≡ ¬p ∧ ¬q |
      | Implication | p → q ≡ ¬p ∨ q |
      | Contrapositive | p → q ≡ ¬q → ¬p |
      | Distributive | p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r) |
      | Biconditional | p ↔ q ≡ (p → q) ∧ (q → p) |

      You met De Morgan's laws in Lessons 1.3 and 2.5. These laws let you **simplify** conditions in code: `not (age < 18 or banned)` is the same as `age >= 18 and not banned`, which is usually easier to read. Because a formula with n variables has only 2ⁿ rows, a computer can check any claimed equivalence by trying every row: a perfectly respectable proof for small n.

  - heading: Every truth table has a formula
    body: |
      Here's a remarkable fact. Take **any** truth table you like, with any number of inputs, and you can always write a formula for it using only ∧, ∨ and ¬. The recipe:

      1. For each row where the output is true, write a clause that is true **only** in that row: the "and" of each variable (if it's T in that row) or its negation (if it's F).
      2. Join those clauses with "or".

      For exclusive or, the true rows are (p=T, q=F) and (p=F, q=T), giving (p ∧ ¬q) ∨ (¬p ∧ q). This form, an "or" of "and"s, is called **disjunctive normal form (DNF)**.

      This is why a CPU can be built from a few kinds of gate (Lesson 1.3): and, or and not are enough to build *any* logical function, and since NAND can build all three, NAND alone is enough. A set of connectives with this property is called **functionally complete**. You'll write the recipe as code in the last exercise.

examples:
  - title: Generating a truth table
    intro: Every combination of truth values, with itertools.product.
    code: |
      from itertools import product

      def implies(p, q):
          return (not p) or q

      print("p     q     p->q  q->p")
      for p, q in product([True, False], repeat=2):
          print(f"{p!s:5} {q!s:5} {implies(p, q)!s:5} {implies(q, p)!s:5}")
    output: |
      p     q     p->q  q->p
      True  True  True  True
      True  False False True
      False True  True  False
      False False True  True
    lines:
      - line: 1
        note: "`product([True, False], repeat=2)` gives every pair of truth values: 2² = 4 rows."
      - line: 3-4
        note: "Implication written with `not` and `or`: false only when p is true and q is false."
      - line: 8
        note: "`!s` converts each bool to text so the `:5` width works. The last two columns differ: an implication and its converse aren't the same."
  - title: Checking equivalences by brute force
    intro: Two formulas are equivalent if they agree on every row.
    code: |
      from itertools import product

      def equivalent(f, g, n):
          return all(f(*row) == g(*row) for row in product([True, False], repeat=n))

      def implies(p, q):
          return (not p) or q

      de_morgan_left = lambda p, q: not (p and q)
      de_morgan_right = lambda p, q: (not p) or (not q)
      print("De Morgan:", equivalent(de_morgan_left, de_morgan_right, 2))

      original = lambda p, q: implies(p, q)
      print("contrapositive:", equivalent(original, lambda p, q: implies(not q, not p), 2))
      print("converse:", equivalent(original, lambda p, q: implies(q, p), 2))
      print("distributive:", equivalent(lambda p, q, r: p and (q or r),
                                        lambda p, q, r: (p and q) or (p and r), 3))
    output: |
      De Morgan: True
      contrapositive: True
      converse: False
      distributive: True
    lines:
      - line: 3-4
        note: "`f(*row)` unpacks a row like `(True, False)` into separate arguments. `all` stops at the first disagreement."
      - line: 9-10
        note: "Short `lambda` functions (Lesson 3.5) are handy for one-line formulas."
      - line: 13-15
        note: "The contrapositive is equivalent to the original; the converse is not."
      - line: 16-17
        note: "Three variables mean 8 rows, still instant. Even 20 variables (about a million rows) is quick."
  - title: Solving a logic puzzle
    intro: "On an island, knights always tell the truth and knaves always lie. A says: \"We are both knaves.\" What are A and B?"
    code: |
      from itertools import product

      for a_knight, b_knight in product([True, False], repeat=2):
          a_statement = (not a_knight) and (not b_knight)
          # A's statement is true exactly when A is a knight
          if a_statement == a_knight:
              print("A is a", "knight" if a_knight else "knave")
              print("B is a", "knight" if b_knight else "knave")
    output: |
      A is a knave
      B is a knight
    lines:
      - line: 3
        note: "Try all four possibilities for who is a knight."
      - line: 4
        note: "What A claims, as a formula."
      - line: 6
        note: "The key rule as a biconditional: A's statement is true ↔ A is a knight."
      - line: 7-8
        note: "Exactly one assignment is consistent. Checking every assignment like this is **brute-force SAT solving** (Lesson 4.8)."

playground:
  prompt: |
    Use `equivalent` to test some claims before you believe them. Is p → (q → r) the same as (p → q) → r? Is p → (q → r) the same as (p ∧ q) → r? Is ¬(p ↔ q) the same as p ⊕ q?
  code: |
    from itertools import product

    def implies(p, q):
        return (not p) or q

    def equivalent(f, g, n):
        return all(f(*row) == g(*row) for row in product([True, False], repeat=n))

    f = lambda p, q, r: implies(p, implies(q, r))
    g = lambda p, q, r: implies(implies(p, q), r)
    print(equivalent(f, g, 3))

exercises:
  - id: connectives
    title: The connectives as functions
    difficulty: 1
    prompt: |
      Write three functions returning `True` or `False`, using only `and`, `or` and `not` (no `==`, `!=` or `if`):

      - `implies(p, q)` for p → q,
      - `iff(p, q)` for p ↔ q,
      - `xor(p, q)` for p ⊕ q.
    starter: |
      def implies(p, q):
          pass


      def iff(p, q):
          pass


      def xor(p, q):
          pass
    tests:
      - name: implies
        code: |
          assert [implies(p, q) for p, q in [(True, True), (True, False), (False, True), (False, False)]] == [True, False, True, True]
      - name: iff and xor
        code: |
          rows = [(True, True), (True, False), (False, True), (False, False)]
          assert [iff(p, q) for p, q in rows] == [True, False, False, True], "iff should be true when p and q match"
          assert [xor(p, q) for p, q in rows] == [False, True, True, False], "xor should be true when exactly one is true"
      - name: only and, or, not
        code: |
          import ast
          tree = ast.parse(source)
          bad = [n for n in ast.walk(tree) if isinstance(n, (ast.Compare, ast.If, ast.IfExp))]
          assert not bad, "Use only and, or and not (no comparisons or if)"
    hints:
      - "p → q is false only when p is true and q is false, so it's `(not p) or q`."
      - "p ↔ q means both implications hold: `implies(p, q) and implies(q, p)`."
      - "xor is true when exactly one holds: `(p and not q) or (not p and q)`."
    solution: |
      def implies(p, q):
          return (not p) or q


      def iff(p, q):
          return implies(p, q) and implies(q, p)


      def xor(p, q):
          return (p and not q) or ((not p) and q)
    explanation: |
      Every connective can be built from and, or and not, which is exactly what the functional completeness section claims. `iff` is literally "p → q and q → p", which is how "if and only if" is defined.

  - id: truth-table
    title: Build a truth table
    difficulty: 1
    prompt: |
      Write `truth_table(f, n)` that takes a function `f` of `n` boolean arguments and returns a list of `(row, result)` pairs, one for each of the 2ⁿ rows, where `row` is a tuple of the inputs. List the rows in the order `itertools.product([True, False], repeat=n)` produces them.

      ```python
      truth_table(lambda p, q: p and q, 2)
      # [((True, True), True), ((True, False), False),
      #  ((False, True), False), ((False, False), False)]
      ```
    starter: |
      from itertools import product


      def truth_table(f, n):
          pass
    tests:
      - name: and
        code: |
          got = truth_table(lambda p, q: p and q, 2)
          assert got == [((True, True), True), ((True, False), False), ((False, True), False), ((False, False), False)], f"Got {got}"
      - name: one and three variables
        code: |
          assert truth_table(lambda p: not p, 1) == [((True,), False), ((False,), True)]
          t = truth_table(lambda p, q, r: (p or q) and not r, 3)
          assert len(t) == 8 and t[0] == ((True, True, True), False) and t[1] == ((True, True, False), True)
          assert sum(1 for row, out in t if out) == 3
    hints:
      - "Loop `for row in product([True, False], repeat=n):`; each `row` is already a tuple."
      - "Call the function with the row unpacked: `f(*row)`."
    solution: |
      from itertools import product


      def truth_table(f, n):
          return [(row, f(*row)) for row in product([True, False], repeat=n)]
    explanation: |
      `product(..., repeat=n)` generates the 2ⁿ rows (counting in binary, with True first), and `f(*row)` spreads each tuple into separate arguments. The function works for formulas with any number of variables.

  - id: tautology-checker
    title: Tautologies and equivalences
    difficulty: 2
    prompt: |
      Write three functions, each taking formulas as functions of `n` booleans:

      - `is_tautology(f, n)`: true in every row.
      - `is_satisfiable(f, n)`: true in at least one row.
      - `equivalent(f, g, n)`: the two formulas agree on every row.

      Then use them to fill in the dictionary `claims`, mapping each claim's name to `True` or `False` **by calling your functions** (not by typing the answers).
    starter: |
      from itertools import product


      def implies(p, q):
          return (not p) or q


      def is_tautology(f, n):
          pass


      def is_satisfiable(f, n):
          pass


      def equivalent(f, g, n):
          pass


      claims = {
          # is ((p -> q) and p) -> q a tautology?  (this rule is called modus ponens)
          "modus ponens": None,
          # is p and not p satisfiable?
          "p and not p satisfiable": None,
          # is p -> q equivalent to q -> p?
          "converse equivalent": None,
          # is not (p or q) equivalent to (not p) and (not q)?
          "de morgan": None,
      }
    tests:
      - name: is_tautology and is_satisfiable
        code: |
          assert is_tautology(lambda p: p or not p, 1) is True
          assert is_tautology(lambda p, q: p or q, 2) is False
          assert is_satisfiable(lambda p, q: p and not q, 2) is True
          assert is_satisfiable(lambda p: p and not p, 1) is False
      - name: equivalent
        code: |
          assert equivalent(lambda p, q: implies(p, q), lambda p, q: implies(not q, not p), 2) is True
          assert equivalent(lambda p, q: p and q, lambda p, q: p or q, 2) is False
          assert equivalent(lambda p, q, r: p or (q and r), lambda p, q, r: (p or q) and (p or r), 3) is True
      - name: claims
        code: |
          assert claims == {"modus ponens": True, "p and not p satisfiable": False, "converse equivalent": False, "de morgan": True}, f"Got {claims}"
          assert source.count("is_tautology(") >= 2 and source.count("equivalent(") >= 3, "Fill in claims by calling your functions"
    hints:
      - "`is_tautology`: `all(f(*row) for row in product([True, False], repeat=n))`."
      - "`is_satisfiable` is the same with `any`."
      - "In `claims`, write e.g. `\"modus ponens\": is_tautology(lambda p, q: implies(implies(p, q) and p, q), 2)`."
    solution: |
      from itertools import product


      def implies(p, q):
          return (not p) or q


      def is_tautology(f, n):
          return all(f(*row) for row in product([True, False], repeat=n))


      def is_satisfiable(f, n):
          return any(f(*row) for row in product([True, False], repeat=n))


      def equivalent(f, g, n):
          return is_tautology(lambda *row: f(*row) == g(*row), n)


      claims = {
          "modus ponens": is_tautology(lambda p, q: implies(implies(p, q) and p, q), 2),
          "p and not p satisfiable": is_satisfiable(lambda p: p and not p, 1),
          "converse equivalent": equivalent(lambda p, q: implies(p, q), lambda p, q: implies(q, p), 2),
          "de morgan": equivalent(lambda p, q: not (p or q), lambda p, q: (not p) and (not q), 2),
      }
    explanation: |
      `equivalent` can reuse `is_tautology`: two formulas are equivalent exactly when "f ↔ g" is a tautology. (`lambda *row:` accepts any number of arguments as a tuple.) **Modus ponens**, "if p → q and p, then q", is the basic rule of every logical argument, and you've just verified it's a tautology. Checking satisfiability by trying all 2ⁿ rows is fine for small n; for large n it's the famous SAT problem, which Unit 15 shows is believed to have no fast general solution.

  - id: knights-knaves
    title: Knights and knaves
    difficulty: 2
    prompt: |
      On the island, knights always tell the truth and knaves always lie. Write `solve(statements, n)` that finds every consistent assignment for `n` islanders by brute force.

      - Each islander is `True` (knight) or `False` (knave). An assignment is a tuple like `(True, False)`.
      - `statements` is a list of `(speaker, claim)` pairs, where `speaker` is an index and `claim` is a function taking the whole assignment tuple and returning whether the claim is true.
      - An assignment is consistent if, for every statement, the claim is true **exactly when** the speaker is a knight.

      Return the list of consistent assignments, in `product([True, False], repeat=n)` order.

      ```python
      # A (0) says "We are both knaves."
      solve([(0, lambda w: not w[0] and not w[1])], 2)   # [(False, True)]
      ```
    starter: |
      from itertools import product


      def solve(statements, n):
          pass
    tests:
      - name: both knaves
        code: |
          assert solve([(0, lambda w: not w[0] and not w[1])], 2) == [(False, True)]
      - name: more puzzles
        code: |
          # A says "B is a knave"; B says "A and I are the same kind"
          got = solve([(0, lambda w: not w[1]), (1, lambda w: w[0] == w[1])], 2)
          assert got == [(True, False)], f"Got {got}"
          # A says "I am a knight": both possibilities are consistent
          assert solve([(0, lambda w: w[0])], 1) == [(True,), (False,)]
          # A says "I am a knave": no consistent world (the liar paradox)
          assert solve([(0, lambda w: not w[0])], 1) == []
          # Three islanders: A says "exactly one of us is a knight"; B says "A is lying"
          got = solve([(0, lambda w: sum(w) == 1), (1, lambda w: not w[0])], 3)
          assert got == [(True, False, False), (False, True, True)], f"Got {got}"
      - name: no statements
        code: |
          assert len(solve([], 2)) == 4
    hints:
      - "Loop over every `world` in `product([True, False], repeat=n)`."
      - "A world is consistent if `all(claim(world) == world[speaker] for speaker, claim in statements)`."
    solution: |
      from itertools import product


      def solve(statements, n):
          return [world for world in product([True, False], repeat=n)
                  if all(claim(world) == world[speaker] for speaker, claim in statements)]
    explanation: |
      Each statement becomes the biconditional "claim ↔ speaker is a knight", and a solution is an assignment satisfying all of them at once. This is satisfiability checking in miniature. The "I am a knave" puzzle has **no** solution: it's a contradiction, the logic behind the ancient liar paradox ("this sentence is false").

  - id: dnf-builder
    title: A formula for any truth table
    difficulty: 3
    prompt: |
      Write `to_dnf(f, names)` that builds a formula in **disjunctive normal form** for the function `f`, whose variables are named in the list `names`, following the recipe in the lesson. Return it as a Python expression **string**:

      - For each row where `f` is true (rows in `product([True, False], repeat=n)` order), make a clause joining each variable as `p` (if True in that row) or `not p` (if False) with `" and "`, wrapped in brackets.
      - Join the clauses with `" or "`.
      - If `f` is never true, return `"False"`.

      ```python
      to_dnf(lambda p, q: p != q, ["p", "q"])
      # "(p and not q) or (not p and q)"
      ```

      The tests also check that your string really computes `f`, by evaluating it.
    starter: |
      from itertools import product


      def to_dnf(f, names):
          pass
    tests:
      - name: xor
        code: |
          assert to_dnf(lambda p, q: p != q, ["p", "q"]) == "(p and not q) or (not p and q)", f"Got {to_dnf(lambda p, q: p != q, ['p', 'q'])!r}"
      - name: simple cases
        code: |
          assert to_dnf(lambda a: a, ["a"]) == "(a)"
          assert to_dnf(lambda a, b: a and b, ["a", "b"]) == "(a and b)"
          assert to_dnf(lambda a: a and not a, ["a"]) == "False"
      - name: the formula computes f
        code: |
          from itertools import product
          funcs = [lambda p, q, r: (p or q) and not r,
                   lambda p, q, r: (p + q + r) >= 2,
                   lambda p, q, r: p == (q != r),
                   lambda p, q, r: True]
          for f in funcs:
              formula = to_dnf(f, ["p", "q", "r"])
              for p, q, r in product([True, False], repeat=3):
                  assert eval(formula, {"p": p, "q": q, "r": r}) == f(p, q, r), f"{formula!r} is wrong at p={p}, q={q}, r={r}"
    hints:
      - "For each `row` where `f(*row)` is true, build the parts: `name if value else \"not \" + name` for each `name, value` in `zip(names, row)`."
      - "A clause is `\"(\" + \" and \".join(parts) + \")\"`; the answer is `\" or \".join(clauses)`."
    solution: |
      from itertools import product


      def to_dnf(f, names):
          clauses = []
          for row in product([True, False], repeat=len(names)):
              if f(*row):
                  parts = [name if value else "not " + name for name, value in zip(names, row)]
                  clauses.append("(" + " and ".join(parts) + ")")
          if not clauses:
              return "False"
          return " or ".join(clauses)
    explanation: |
      Each clause is true in exactly one row, so the "or" of the clauses is true in exactly the rows where `f` is true. That proves that and, or and not can express **every** boolean function: they're functionally complete. The formulas aren't the shortest possible (the majority function's has four clauses, but `(p and q) or (p and r) or (q and r)` also works); finding minimal circuits is a real problem in chip design.

commonMistakes:
  - title: Thinking p → q is false when p is false
    explanation: |
      An implication only promises something when its hypothesis is true. If p is false, p → q is (vacuously) true, whatever q is.
  - title: Confusing an implication with its converse
    explanation: |
      "If it's a dog, it has four legs" doesn't mean "if it has four legs, it's a dog". Only the contrapositive, ¬q → ¬p, is equivalent to p → q.
  - title: Reading "or" as exclusive
    explanation: |
      In logic (and in Python), p ∨ q is true when both are true. Exclusive or is a separate connective, ⊕.
  - title: Negating "and" without flipping to "or"
    explanation: |
      ¬(p ∧ q) is ¬p ∨ ¬q, not ¬p ∧ ¬q (De Morgan). The same applies when simplifying `not (a and b)` in code.
  - title: Calling something that depends on a variable a proposition
    explanation: |
      "x > 5" has no truth value until x is known. It's a predicate, the topic of the next lesson.

summary:
  - "A **proposition** is true or false. Connectives: ¬ (not), ∧ (and), ∨ (inclusive or), ⊕ (xor), → (implies), ↔ (if and only if)."
  - "A **truth table** lists all 2ⁿ rows; `itertools.product([True, False], repeat=n)` generates them."
  - "p → q is false only when p is true and q is false; it's equivalent to ¬p ∨ q."
  - "An implication is equivalent to its **contrapositive** (¬q → ¬p), but not to its converse or inverse."
  - "**Tautologies** are always true, **contradictions** always false; **equivalent** formulas have identical truth tables (De Morgan, distributive, implication laws)."
  - "Any truth table can be written in **disjunctive normal form**, so and, or and not are **functionally complete**."
next: |
  Propositions are fixed statements. But most interesting statements are about *things*: "every list has a length", "some number is prime", "x > 5". In **Lesson 6.2** you'll add **predicates** and the **quantifiers** "for all" (∀) and "there exists" (∃), the logic behind Python's `all()` and `any()`.

quiz:
  - type: mcq
    question: Which of these is a proposition?
    options: ["x + 1 = 5", "Is it raining?", "12 is divisible by 5", "Please sit down"]
    answer: 2
    explanation: It has a definite truth value (false). The others depend on a variable, or are questions or commands.
  - type: mcq
    question: When is p → q false?
    options: ["When p is false", "When q is true", "Only when p is true and q is false", "When p and q are both false"]
    answer: 2
    explanation: That's the only row in which the promise is broken.
  - type: mcq
    question: "Which is equivalent to \"If it's a weekday, the shop is open\"?"
    options:
      - "If the shop is open, it's a weekday"
      - "If it's not a weekday, the shop is not open"
      - "If the shop is not open, it's not a weekday"
      - "It's a weekday and the shop is open"
    answer: 2
    explanation: That's the contrapositive, ¬q → ¬p, the only form always equivalent to the original.
  - type: mcq
    question: "How many rows does the truth table of a formula with 4 variables have?"
    options: ["4", "8", "16", "32"]
    answer: 2
    explanation: 2⁴ = 16 combinations of true and false.
  - type: mcq
    question: "By De Morgan's law, `not (a or b)` is equivalent to:"
    options: ["not a or not b", "not a and not b", "a and b", "not a or b"]
    answer: 1
    explanation: Negating an "or" gives an "and" of the negations.
  - type: mcq
    question: What is a tautology?
    options:
      - A formula that is false in every row
      - A formula that is true in every row
      - A formula with exactly one true row
      - Any formula using →
    answer: 1
    explanation: "For example, p ∨ ¬p is true whatever p is."
  - type: code
    question: |
      Write `count_true_rows(f, n)` returning how many of the 2ⁿ rows make the formula `f` (a function of `n` booleans) true.
    starter: |
      from itertools import product


      def count_true_rows(f, n):
          pass
    tests:
      - name: count_true_rows works
        code: |
          assert count_true_rows(lambda p, q: p or q, 2) == 3
          assert count_true_rows(lambda p, q, r: p and q and r, 3) == 1
          assert count_true_rows(lambda p: p and not p, 1) == 0
          assert count_true_rows(lambda a, b, c, d: True, 4) == 16
    solution: |
      from itertools import product


      def count_true_rows(f, n):
          return sum(1 for row in product([True, False], repeat=n) if f(*row))
