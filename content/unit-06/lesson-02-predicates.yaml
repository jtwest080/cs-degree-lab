id: u6-predicates
title: Predicates and Quantifiers
minutes: 50
objective: |
  Make statements about **all** or **some** members of a collection using **predicates** and the quantifiers **∀ (for all)** and **∃ (there exists)**, negate quantified statements correctly, understand how the **order** of nested quantifiers changes the meaning, and check quantified claims in Python with `all()` and `any()`.
outcomes:
  - Explain what a predicate is and how it differs from a proposition
  - Read and write statements using ∀ and ∃ over a domain
  - Evaluate quantified statements over a finite domain with `all` and `any`
  - Negate quantified statements, and use a counterexample to disprove a "for all" claim
  - Explain why ∀x ∃y and ∃y ∀x mean different things
  - Translate English requirements into precise quantified statements and code

sections:
  - heading: Predicates
    body: |
      "x > 5" isn't a proposition, because its truth depends on x. Statements like this are called **predicates**: they become propositions once you fill in their variables. We write them like functions: let P(x) mean "x > 5". Then P(7) is true and P(2) is false.

      You already write predicates all the time: they're just Python functions that return a boolean.

      ```python
      def is_even(n):
          return n % 2 == 0

      def is_older(a, b):          # a predicate of two variables
          return a.age > b.age
      ```

      A predicate always has a **domain**: the set of values its variables can take, such as "all whole numbers", "all students in the class" or "every item in this list". The same predicate can be true for every item in one domain and false for some item in another, so the domain must always be clear.

  - heading: For all and there exists
    body: |
      **Quantifiers** turn a predicate into a proposition by saying *how many* values it holds for:

      - **Universal quantifier**: ∀x P(x), "**for all** x, P(x)". True if P holds for every x in the domain.
      - **Existential quantifier**: ∃x P(x), "**there exists** an x such that P(x)". True if P holds for at least one x.

      Over a finite domain, these are exactly Python's `all` and `any` (Lesson 3.8):

      ```python
      scores = [72, 85, 64, 91]
      all(s >= 50 for s in scores)    # ∀s: s ≥ 50   (everyone passed?)
      any(s >= 90 for s in scores)    # ∃s: s ≥ 90   (anyone get an A?)
      ```

      One way to picture it: ∀ is a giant **and** (P(x₁) ∧ P(x₂) ∧ P(x₃) ∧ ...), and ∃ is a giant **or** (P(x₁) ∨ P(x₂) ∨ ...). That's why `all` stops at the first false item and `any` at the first true one: short-circuiting (Lesson 2.5).

      What about an **empty** domain? `all([])` is `True` and `any([])` is `False`. "Every unicorn in this room is purple" is vacuously true, because there are no unicorns to break the rule, just like an implication with a false hypothesis (Lesson 6.1).

  - heading: Negating quantifiers
    body: |
      What's the opposite of "every student passed"? Not "every student failed", but "**some** student failed". In symbols, De Morgan's laws extend to quantifiers:

      | Statement | Negation |
      |---|---|
      | ∀x P(x) "all are P" | ∃x ¬P(x) "some aren't P" |
      | ∃x P(x) "some are P" | ∀x ¬P(x) "none are P" |

      To negate, **flip the quantifier and negate what's inside**. In Python: `not all(p(x) for x in xs)` is the same as `any(not p(x) for x in xs)`.

      This gives a powerful tool. To **disprove** a "for all" claim, you need only **one counterexample**. To **prove** it, you must show it for every element, which for an infinite domain needs a proof (Lessons 6.4 and 6.5) rather than testing. A famous example: n² + n + 41 is prime for n = 0, 1, 2, ..., 39, forty values in a row, which might convince you it's always prime. But at n = 40 it's 1681 = 41 × 41. Lots of confirming examples never prove a universal statement; one counterexample always disproves it.

  - heading: Nested quantifiers
    body: |
      Predicates with several variables can have several quantifiers, and **their order matters**. Let L(x, y) mean "x loves y", with the domain being people:

      - ∀x ∃y L(x, y): "everybody loves somebody" (each person may love someone different).
      - ∃y ∀x L(x, y): "there is somebody whom everybody loves" (one single person loved by all).

      The second is much stronger: it implies the first, but not the other way round. In code, the order of quantifiers becomes the **nesting of loops** (or of `all` and `any`):

      ```python
      # ∀x ∃y  L(x, y)
      all(any(loves(x, y) for y in people) for x in people)
      # ∃y ∀x  L(x, y)
      any(all(loves(x, y) for x in people) for y in people)
      ```

      Programmers meet this distinction all the time. "Every request is handled by some server" is very different from "some server handles every request". Specifications, database queries (Unit 12) and security rules (Unit 16) are all built from nested quantifiers, and getting the order wrong is a classic source of bugs.

      Negation works through nested quantifiers one at a time: ¬∀x ∃y L(x, y) becomes ∃x ¬∃y L(x, y), which becomes ∃x ∀y ¬L(x, y): "there's someone who loves nobody".

  - heading: From English to logic
    body: |
      Turning a vague English requirement into a precise quantified statement is a core skill, for maths and for writing correct programs. Some patterns:

      | English | Logic |
      |---|---|
      | All A are B | ∀x (A(x) → B(x)) |
      | Some A are B | ∃x (A(x) ∧ B(x)) |
      | No A are B | ∀x (A(x) → ¬B(x)) |
      | Exactly one x is P | ∃x (P(x) ∧ ∀y (P(y) → y = x)) |

      Notice that "all A are B" uses **→** but "some A are B" uses **∧**. "All students in year 1 passed" is ∀x (Year1(x) → Passed(x)); writing ∀x (Year1(x) ∧ Passed(x)) would claim that *everyone* is in year 1. In Python, "all A are B" restricts the domain with a filter: `all(passed(s) for s in students if s.year == 1)`.

      > **Tip:** When translating, first decide the domain, then the predicates, then the quantifiers, from the outside in. Then test your formula on a small example where you know the answer.

examples:
  - title: Quantifiers with all and any
    intro: Universal and existential claims over a list, and their negations.
    code: |
      scores = {"Ada": 91, "Bo": 47, "Cy": 78, "Di": 64}

      everyone_passed = all(s >= 50 for s in scores.values())
      someone_failed = any(s < 50 for s in scores.values())
      print(everyone_passed, someone_failed)

      print(not everyone_passed == someone_failed)
      print(all(s > 100 for s in []), any(s > 100 for s in []))

      failed = [name for name, s in scores.items() if s < 50]
      print("Counterexample:", failed[0])
    output: |
      False True
      True
      True False
      Counterexample: Bo
    lines:
      - line: 3-4
        note: "∀s (s ≥ 50) and ∃s (s < 50): each is the negation of the other."
      - line: 7
        note: "`not` binds more loosely than `==`, so this asks whether `everyone_passed` differs from `someone_failed`. They always differ, by the negation rule."
      - line: 8
        note: "Over an empty domain, ∀ is vacuously true and ∃ is false."
      - line: 10-11
        note: "One counterexample is enough to disprove the universal claim."
  - title: A tempting pattern that fails
    intro: Forty confirming examples, then a counterexample.
    code: |
      def is_prime(n):
          if n < 2:
              return False
          d = 2
          while d * d <= n:
              if n % d == 0:
                  return False
              d += 1
          return True

      def f(n):
          return n * n + n + 41

      print(all(is_prime(f(n)) for n in range(40)))
      first_bad = next(n for n in range(1000) if not is_prime(f(n)))
      print(first_bad, f(first_bad), "=", 41, "x", f(first_bad) // 41)
    output: |
      True
      40 1681 = 41 x 41
    lines:
      - line: 5
        note: "Trial division up to √n is enough: a factor larger than √n pairs with one smaller than it."
      - line: 14
        note: "The claim holds for n = 0 to 39: evidence, but not proof."
      - line: 15
        note: "`next(...)` takes the first value from a generator expression: the first counterexample."
  - title: The order of quantifiers
    intro: Everybody loves somebody, versus somebody is loved by everybody.
    code: |
      loves = {("Ada", "Bo"), ("Bo", "Cy"), ("Cy", "Ada"), ("Ada", "Ada")}
      people = ["Ada", "Bo", "Cy"]

      def L(x, y):
          return (x, y) in loves

      forall_exists = all(any(L(x, y) for y in people) for x in people)
      exists_forall = any(all(L(x, y) for x in people) for y in people)
      print("everybody loves somebody:", forall_exists)
      print("somebody is loved by all:", exists_forall)

      loves |= {("Bo", "Ada")}
      print("after Bo loves Ada too:", any(all(L(x, y) for x in people) for y in people))
    output: |
      everybody loves somebody: True
      somebody is loved by all: False
      after Bo loves Ada too: True
    lines:
      - line: 1
        note: "A relation stored as a set of pairs (Lesson 6.3 studies these)."
      - line: 7
        note: "∀x ∃y: the outer `all` picks each x; the inner `any` looks for some y."
      - line: 8
        note: "∃y ∀x: the outer `any` picks one candidate y, which must work for every x."
      - line: 12-13
        note: "Now everyone loves Ada, so the stronger statement becomes true."

playground:
  prompt: |
    Try to find counterexamples to these claims (or convince yourself there aren't any small ones): "every even number greater than 2 is the sum of two primes" (Goldbach's conjecture, unproven since 1742!), "2ⁿ − 1 is prime whenever n is prime", and "n² − n + 41 is always prime".
  code: |
    def is_prime(n):
        if n < 2:
            return False
        return all(n % d != 0 for d in range(2, int(n ** 0.5) + 1))

    def goldbach_ok(n):
        return any(is_prime(p) and is_prime(n - p) for p in range(2, n // 2 + 1))

    print(all(goldbach_ok(n) for n in range(4, 2000, 2)))

    for n in range(2, 30):
        if is_prime(n) and not is_prime(2 ** n - 1):
            print("Counterexample:", n, 2 ** n - 1)
            break

exercises:
  - id: quantifier-functions
    title: For all and there exists
    difficulty: 1
    prompt: |
      Write three functions, each taking a `domain` (any iterable) and a predicate `p` (a function returning a bool):

      - `for_all(domain, p)`: ∀x P(x).
      - `exists(domain, p)`: ∃x P(x).
      - `none(domain, p)`: no element satisfies P. Write it using one of the other two and the negation rule.
    starter: |
      def for_all(domain, p):
          pass


      def exists(domain, p):
          pass


      def none(domain, p):
          pass
    tests:
      - name: for_all and exists
        code: |
          even = lambda n: n % 2 == 0
          assert for_all([2, 4, 8], even) is True and for_all([2, 3, 8], even) is False
          assert exists([1, 3, 4], even) is True and exists([1, 3, 5], even) is False
      - name: empty domains
        code: |
          assert for_all([], lambda x: False) is True, "∀ over an empty domain is vacuously true"
          assert exists([], lambda x: True) is False
          assert none([], lambda x: True) is True
      - name: none
        code: |
          assert none([1, 3, 5], lambda n: n % 2 == 0) is True
          assert none([1, 2, 5], lambda n: n % 2 == 0) is False
    hints:
      - "`for_all` is `all(p(x) for x in domain)`; `exists` uses `any`."
      - "\"None are P\" is the negation of \"some are P\": `not exists(domain, p)`."
    solution: |
      def for_all(domain, p):
          return all(p(x) for x in domain)


      def exists(domain, p):
          return any(p(x) for x in domain)


      def none(domain, p):
          return not exists(domain, p)
    explanation: |
      ¬∃x P(x) ≡ ∀x ¬P(x), so `none` could equally be `for_all(domain, lambda x: not p(x))`. The empty-domain results follow from ∀ being a big "and" (whose identity is True) and ∃ a big "or" (whose identity is False).

  - id: find-counterexample
    title: Hunting for counterexamples
    difficulty: 1
    prompt: |
      Write `counterexample(domain, p)` that returns the **first** element of `domain` for which `p` is false, or `None` if `p` holds for every element.

      Then set the variable `euler_fails_at` to the smallest whole number n ≥ 0 for which n² + n + 41 is **not** prime, found by calling `counterexample` with the provided `is_prime` over `range(1000)`.
    starter: |
      def is_prime(n):
          if n < 2:
              return False
          return all(n % d != 0 for d in range(2, int(n ** 0.5) + 1))


      def counterexample(domain, p):
          pass


      euler_fails_at = None
    tests:
      - name: counterexample
        code: |
          assert counterexample([2, 4, 5, 7], lambda n: n % 2 == 0) == 5
          assert counterexample([2, 4, 6], lambda n: n % 2 == 0) is None
          assert counterexample([], lambda n: False) is None
          assert counterexample(range(10 ** 9), lambda n: n < 3) == 3, "Stop at the first counterexample instead of checking everything"
      - name: Euler's polynomial
        code: |
          assert euler_fails_at == 40, f"Got {euler_fails_at}"
          assert "counterexample(" in source.split("def counterexample")[1].split("\n", 1)[1], "Find euler_fails_at by calling counterexample"
    hints:
      - "Loop over the domain and `return x` as soon as `not p(x)`; after the loop, `return None`."
      - "`euler_fails_at = counterexample(range(1000), lambda n: is_prime(n * n + n + 41))`."
    solution: |
      def is_prime(n):
          if n < 2:
              return False
          return all(n % d != 0 for d in range(2, int(n ** 0.5) + 1))


      def counterexample(domain, p):
          for x in domain:
              if not p(x):
                  return x
          return None


      euler_fails_at = counterexample(range(1000), lambda n: is_prime(n * n + n + 41))
    explanation: |
      Returning as soon as a counterexample is found makes this fast even over a range of a billion. Leonhard Euler noticed this polynomial's primes in 1772. Forty successes in a row are not a proof, while the single value 40 is a complete disproof.

  - id: nested-quantifiers
    title: The order of quantifiers
    difficulty: 2
    prompt: |
      Each function receives two lists `xs` and `ys` and a predicate `r(x, y)`:

      - `every_x_some_y(xs, ys, r)`: ∀x ∃y R(x, y).
      - `some_y_every_x(xs, ys, r)`: ∃y ∀x R(x, y).
      - `witnesses(xs, ys, r)`: for the first statement, return a dictionary mapping each x to the **first** y (in `ys` order) with R(x, y), or `None` if some x has no such y.
    starter: |
      def every_x_some_y(xs, ys, r):
          pass


      def some_y_every_x(xs, ys, r):
          pass


      def witnesses(xs, ys, r):
          pass
    tests:
      - name: order matters
        code: |
          xs = [1, 2, 3]
          ys = [2, 3, 4]
          less = lambda x, y: x < y
          assert every_x_some_y(xs, ys, less) is True
          assert some_y_every_x(xs, ys, less) is True, "y = 4 is bigger than every x"
          divides = lambda x, y: y % x == 0
          assert every_x_some_y(xs, ys, divides) is True
          assert some_y_every_x(xs, ys, divides) is False, "No single y in [2, 3, 4] is divisible by 1, 2 and 3"
          assert some_y_every_x(xs, ys + [6], divides) is True
      - name: witnesses
        code: |
          assert witnesses([1, 2, 3], [2, 3, 4], lambda x, y: y % x == 0) == {1: 2, 2: 2, 3: 3}
          assert witnesses([5], [2, 3], lambda x, y: x < y) is None
          assert witnesses([], [1], lambda x, y: True) == {}
    hints:
      - "`every_x_some_y`: `all(any(r(x, y) for y in ys) for x in xs)`. Swap the roles of `all` and `any` (and which variable is outside) for the other."
      - "In `witnesses`, for each x find the first matching y with a loop or `next((y for y in ys if r(x, y)), None)`."
    solution: |
      def every_x_some_y(xs, ys, r):
          return all(any(r(x, y) for y in ys) for x in xs)


      def some_y_every_x(xs, ys, r):
          return any(all(r(x, y) for x in xs) for y in ys)


      def witnesses(xs, ys, r):
          found = {}
          for x in xs:
              match = next((y for y in ys if r(x, y)), None)
              if match is None:
                  return None
              found[x] = match
          return found
    explanation: |
      With "divides", every x has its own y (1 and 2 divide 2, and 3 divides 3), but no single y works for all of them until 6 is added. The witness dictionary makes ∀x ∃y concrete: the "there exists" is a choice of y that may **depend on** x. In ∃y ∀x, one y must be chosen *before* looking at x.

  - id: exactly-one
    title: Exactly one
    difficulty: 2
    prompt: |
      Write `exactly_one(domain, p)`, which is true if **exactly one** element satisfies `p`. It must work for any iterable `domain`, **including generators that can only be looped over once**, and should stop early as soon as it finds a second match.

      Then write `unique_max(numbers)` returning `True` if the largest value in a non-empty list occurs exactly once, using `exactly_one`.
    starter: |
      def exactly_one(domain, p):
          pass


      def unique_max(numbers):
          pass
    tests:
      - name: exactly_one
        code: |
          even = lambda n: n % 2 == 0
          assert exactly_one([1, 2, 3], even) is True
          assert exactly_one([1, 3, 5], even) is False
          assert exactly_one([2, 4], even) is False
          assert exactly_one((n for n in [1, 4, 7]), even) is True, "Should work with a generator"
      - name: stops early
        code: |
          seen = []
          def p(x):
              seen.append(x)
              return x > 0
          assert exactly_one(range(1, 10 ** 9), p) is False
          assert len(seen) == 2, "Stop as soon as a second match is found"
      - name: unique_max
        code: |
          assert unique_max([3, 9, 2]) is True and unique_max([9, 3, 9]) is False and unique_max([5]) is True
    hints:
      - "Keep a counter; loop once over the domain; when `p(x)` is true add 1, and if the count reaches 2, return False immediately."
      - "`unique_max`: `m = max(numbers)`, then `exactly_one(numbers, lambda x: x == m)`."
    solution: |
      def exactly_one(domain, p):
          count = 0
          for x in domain:
              if p(x):
                  count += 1
                  if count == 2:
                      return False
          return count == 1


      def unique_max(numbers):
          m = max(numbers)
          return exactly_one(numbers, lambda x: x == m)
    explanation: |
      Logic has a special quantifier for this, ∃! ("there exists exactly one"), which unpacks to ∃x (P(x) ∧ ∀y (P(y) → y = x)). Taken literally, that's a nested loop, n² work, but a single pass with a counter does the same job in linear time, and stops early.

  - id: enrolment-rules
    title: Requirements as logic
    difficulty: 3
    prompt: |
      `enrolled` is a dictionary mapping each student to a **set** of course names, and `courses` is a list of all course names. Translate each requirement into a function returning a bool:

      1. `everyone_enrolled(enrolled)`: every student takes at least one course.
      2. `common_course(enrolled, courses)`: there is a course that every student takes.
      3. `no_empty_course(enrolled, courses)`: every course has at least one student.
      4. `all_different(enrolled)`: no two different students take exactly the same set of courses.
      5. `first_years_take_intro(enrolled, years)`: every student whose year (from the dictionary `years`) is 1 takes `"Intro"`. (All A are B: careful with the connective!)
    starter: |
      def everyone_enrolled(enrolled):
          pass


      def common_course(enrolled, courses):
          pass


      def no_empty_course(enrolled, courses):
          pass


      def all_different(enrolled):
          pass


      def first_years_take_intro(enrolled, years):
          pass
    tests:
      - name: everyone_enrolled and common_course
        code: |
          e = {"Ada": {"Intro", "Maths"}, "Bo": {"Intro"}, "Cy": {"Maths", "Intro", "Art"}}
          assert everyone_enrolled(e) is True and everyone_enrolled({**e, "Di": set()}) is False
          assert common_course(e, ["Intro", "Maths", "Art"]) is True
          assert common_course({"A": {"x"}, "B": {"y"}}, ["x", "y"]) is False
      - name: no_empty_course and all_different
        code: |
          e = {"Ada": {"Intro", "Maths"}, "Bo": {"Intro"}, "Cy": {"Maths", "Intro"}}
          assert no_empty_course(e, ["Intro", "Maths"]) is True and no_empty_course(e, ["Intro", "Art"]) is False
          assert all_different(e) is False, "Ada and Cy take the same courses"
          assert all_different({"A": {"x"}, "B": {"x", "y"}}) is True and all_different({}) is True
      - name: first_years_take_intro
        code: |
          e = {"Ada": {"Intro"}, "Bo": {"Maths"}, "Cy": {"Intro", "Art"}}
          assert first_years_take_intro(e, {"Ada": 1, "Bo": 2, "Cy": 1}) is True, "Bo isn't a first-year, so Bo doesn't matter"
          assert first_years_take_intro(e, {"Ada": 1, "Bo": 1, "Cy": 3}) is False
          assert first_years_take_intro(e, {"Ada": 2, "Bo": 2, "Cy": 2}) is True, "No first-years: vacuously true"
    hints:
      - "1: `all(len(cs) > 0 for cs in enrolled.values())`. 2: ∃c ∀s, so `any(all(... for s) for c in courses)`."
      - "4: compare every pair of different students, or notice that if all the sets are different, there are as many distinct sets as students (`frozenset` makes a set hashable)."
      - "5: ∀s (year(s) = 1 → takes Intro). Either filter (`... for s in enrolled if years[s] == 1`) or use `not first_year or takes_intro`."
    solution: |
      def everyone_enrolled(enrolled):
          return all(len(courses) > 0 for courses in enrolled.values())


      def common_course(enrolled, courses):
          return any(all(c in taken for taken in enrolled.values()) for c in courses)


      def no_empty_course(enrolled, courses):
          return all(any(c in taken for taken in enrolled.values()) for c in courses)


      def all_different(enrolled):
          names = list(enrolled)
          return all(enrolled[a] != enrolled[b]
                     for i, a in enumerate(names) for b in names[i + 1:])


      def first_years_take_intro(enrolled, years):
          return all("Intro" in enrolled[s] for s in enrolled if years[s] == 1)
    explanation: |
      Requirements 2 and 3 use the same two quantifiers in opposite orders (∃c ∀s versus ∀c ∃s), which give completely different meanings. Requirement 4 is "for all pairs a ≠ b, their sets differ", a nested ∀∀. Requirement 5 is "all A are B", an implication inside a ∀: filtering the domain to first-years is the code version of the →. Writing requirements this precisely is how specifications avoid ambiguity.

commonMistakes:
  - title: Negating "all" as "none"
    explanation: |
      The opposite of "all students passed" is "some student failed", not "all students failed". Flip ∀ to ∃ and negate the inside.
  - title: Treating examples as proof
    explanation: |
      Any number of examples where a "for all" claim holds proves nothing about the cases you didn't check. One counterexample, though, disproves it.
  - title: Swapping nested quantifiers
    explanation: |
      ∀x ∃y and ∃y ∀x are different statements. In code, swapping which loop is outside changes the meaning.
  - title: Using "and" for "all A are B"
    explanation: |
      ∀x (A(x) ∧ B(x)) says everything is both A and B. "All A are B" is ∀x (A(x) → B(x)), or in code, a filter on A.
  - title: Forgetting the domain
    explanation: |
      "Every number has a square root" is false over the integers (2 has none) and true over the positive reals. Always state the domain.

summary:
  - "A **predicate** P(x) becomes a proposition when its variable is given a value from a **domain**."
  - "∀x P(x) (\"for all\") is Python's `all`; ∃x P(x) (\"there exists\") is `any`. Over an empty domain, ∀ is true and ∃ false."
  - "Negation flips the quantifier: ¬∀x P(x) ≡ ∃x ¬P(x), and ¬∃x P(x) ≡ ∀x ¬P(x)."
  - "One **counterexample** disproves a universal claim; examples never prove one."
  - "The **order of nested quantifiers** matters: ∀x ∃y is weaker than ∃y ∀x, and in code it's the order of nested loops."
  - "\"All A are B\" is ∀x (A(x) → B(x)); \"some A are B\" is ∃x (A(x) ∧ B(x))."
