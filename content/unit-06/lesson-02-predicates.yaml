  - type: mcq
    question: "A claim holds for the first million positive integers. What can you conclude?"
    options:
      - It's true for all positive integers
      - It's probably true, but that hasn't been proved
      - It's false
      - Nothing could ever prove it
    answer: 1
    explanation: Examples are evidence, not proof (remember n² + n + 41).
  - type: mcq
    question: "Over the domain of people, which statement is stronger?"
    options:
      - "∀x ∃y Knows(x, y): everyone knows someone"
      - "∃y ∀x Knows(x, y): someone is known by everyone"
      - They mean the same
      - Neither implies the other
    answer: 1
    explanation: "One person known by all implies everyone knows someone, but not the reverse."
