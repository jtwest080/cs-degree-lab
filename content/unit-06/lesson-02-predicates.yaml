quiz:
  - type: mcq
    question: "Let P(x) be \"x is even\". What is P(x) on its own?"
    options: ["A proposition", "A predicate", "A quantifier", "A tautology"]
    answer: 1
    explanation: It has no truth value until x is given.
  - type: mcq
    question: "Which Python expression computes ∃x ∈ xs: x > 10?"
    options: ["all(x > 10 for x in xs)", "any(x > 10 for x in xs)", "not any(x > 10 for x in xs)", "x > 10 in xs"]
    answer: 1
