  - type: code
    question: |
      Write `is_sorted(xs)` that returns whether the list is in non-decreasing order, as a single quantified statement: for every position i (except the last), `xs[i] <= xs[i + 1]`. Use `all`.
    starter: |
      def is_sorted(xs):
          pass
    tests:
      - name: is_sorted works
        code: |
          assert is_sorted([1, 2, 2, 5]) is True and is_sorted([3, 1]) is False
          assert is_sorted([]) is True and is_sorted([7]) is True
          assert "all(" in source, "Use all()"
    solution: |
      def is_sorted(xs):
          return all(xs[i] <= xs[i + 1] for i in range(len(xs) - 1))
