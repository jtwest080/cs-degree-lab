id: u6-sets-relations
title: Sets, Relations and Functions
minutes: 55
objective: |
  Use the mathematical language of **sets** (set-builder notation, power sets, Cartesian products), describe connections between things as **relations** and test their key properties, group things with **equivalence relations**, and classify **functions** as injective, surjective or bijective, all with Python sets, tuples and dictionaries.
outcomes:
  - Read and write sets in roster and set-builder notation, and relate them to Python sets and comprehensions
  - Compute power sets and Cartesian products, and predict their sizes
  - Represent a relation as a set of pairs and test whether it is reflexive, symmetric or transitive
  - Split a set into equivalence classes
  - Decide whether a mapping is a function, and whether it is injective, surjective or bijective
  - Compute the transitive closure of a relation, such as all prerequisites of a course

sections:
  - heading: Sets in mathematics
    body: |
      A **set** is an unordered collection of distinct objects, called its **elements**. You met Python's `set` type in Lesson 3.7; mathematics uses exactly the same idea, with its own notation:

      | Maths | Meaning | Python |
      |---|---|---|
      | {1, 2, 3} | roster notation: list the elements | `{1, 2, 3}` |
      | x ∈ A | x is an element of A | `x in A` |
      | x ∉ A | x is not an element of A | `x not in A` |
      | ∅ or {} | the empty set | `set()` |
      | \|A\| | cardinality: the number of elements | `len(A)` |
      | A ⊆ B | A is a subset of B | `A <= B` |
      | A ∪ B, A ∩ B, A − B | union, intersection, difference | `A \| B`, `A & B`, `A - B` |

      For large or infinite sets, **set-builder notation** describes the elements by a rule: {x ∈ ℤ | x > 0 and x is even} means "the set of integers x such that x is positive and even". (ℤ is the set of all integers, ℕ the natural numbers 0, 1, 2, ..., ℝ the real numbers.) Python's set comprehensions (Lesson 3.8) are set-builder notation in code: `{x for x in range(1, 20) if x % 2 == 0}`.

      Sets are the foundation on which almost all of mathematics is built: numbers, functions, relations and graphs can all be defined as sets. They're also the foundation of databases (Unit 12), where tables are sets of rows and queries are set operations.

  - heading: Power sets and Cartesian products
    body: |
      Two ways of building new sets come up constantly:

      The **power set** 𝒫(A) is the set of **all subsets** of A. For A = {a, b}, 𝒫(A) = {∅, {a}, {b}, {a, b}}. Each element of A is either in a subset or not, two choices per element, so a set with n elements has **2ⁿ subsets** (the same count as truth table rows and bit patterns: they're all the same idea). You generated subsets recursively in Lesson 4.6.

      The **Cartesian product** A × B is the set of all **ordered pairs** (a, b) with a ∈ A and b ∈ B. For A = {1, 2} and B = {x, y}: A × B = {(1, x), (1, y), (2, x), (2, y)}. Its size is |A| × |B|. Pairs are *ordered*, so (1, x) ≠ (x, 1); in Python they're tuples. `itertools.product(A, B)` generates them. A chessboard's squares are {a, ..., h} × {1, ..., 8}, which is 64 pairs; a database table's possible rows are a Cartesian product of its columns' possible values.

      In Python, a set of sets needs **frozensets**: ordinary sets are mutable and therefore unhashable (Lesson 3.6), so they can't be elements of another set. `frozenset({1, 2})` is an immutable, hashable set.

  - heading: Relations
    body: |
      A **relation** R from A to B is any subset of A × B: a set of pairs saying which elements are related. We write a R b, or (a, b) ∈ R. Relations are everywhere:

      - "is a prerequisite of" between courses,
      - "follows" between social media users,
      - "is less than" between numbers,
      - "is enrolled in" between students and courses.

      In Python, the simplest representation is a **set of tuples**: `follows = {("ada", "bo"), ("bo", "cy")}`. A relation on a single set A (a subset of A × A) can have important properties:

      | Property | Definition | Example |
      |---|---|---|
      | **reflexive** | every a is related to itself: ∀a (a R a) | "≤": 5 ≤ 5 |
      | **symmetric** | a R b → b R a | "is a sibling of" |
      | **antisymmetric** | a R b and b R a → a = b | "≤" |
      | **transitive** | a R b and b R c → a R c | "is an ancestor of", "<" |

      "Follows" on social media is not symmetric (you can follow someone who doesn't follow you back), while "is friends with" on many sites is. "Is a prerequisite of" is not transitive as a list of direct requirements, but "must be taken before" is. Each property is a quantified statement (Lesson 6.2), so each becomes an `all(...)` check in code.

  - heading: Equivalence relations
    body: |
      A relation that is **reflexive, symmetric and transitive** is called an **equivalence relation**. It captures the idea of "the same in some respect": "has the same birthday as", "has the same remainder when divided by 3", "are anagrams of each other" (Lesson 3.8).

      An equivalence relation **splits** its set into **equivalence classes**: groups of elements that are all related to each other, and unrelated to anything outside the group. Every element is in exactly one class. Such a split is called a **partition**. For "same remainder mod 3" on {0, ..., 8}, the classes are {0, 3, 6}, {1, 4, 7} and {2, 5, 8}.

      You've already computed equivalence classes without the name: grouping words by their sorted letters (anagrams), or students by year, is exactly this. The **grouping pattern** of Lesson 3.6 with a **canonical form** as the key finds the classes in one pass.

  - heading: Functions
    body: |
      A **function** f: A → B is a relation in which **every element of A is related to exactly one element of B**. A is the **domain**, B the **codomain**, and f(a) is the **image** of a. A Python dictionary whose keys are exactly A is a function; so is a Python function that always returns a value, as long as it gives the same output for the same input.

      Three properties classify functions:

      - **Injective** (one-to-one): different inputs give different outputs. No two keys of the dictionary share a value. Example: student → student ID number.
      - **Surjective** (onto): every element of B is the image of something. Every possible value is used. Example: student → year group, if every year has at least one student.
      - **Bijective**: both injective and surjective, a perfect pairing between A and B. A bijection has an **inverse** function f⁻¹: B → A, which in Python is the dictionary with keys and values swapped.

      Why should a programmer care? An injective function is exactly what you need for a **key**: database IDs (Unit 12) and good hash functions (Unit 7) aim to be injective. Encryption (Unit 16) must be a bijection, or messages couldn't be decrypted. And counting arguments (Lesson 6.6) rely on bijections: if there's a bijection between two finite sets, they have the same size.

      Functions can be **composed**: (g ∘ f)(x) = g(f(x)), "apply f, then g". With dictionaries, that's `g[f[x]]`.

  - heading: Transitive closure
    body: |
      Suppose a course catalogue lists each course's **direct** prerequisites: Algorithms needs Data Structures, which needs Programming. To take Algorithms you actually need *both*, because "needs" chains. The **transitive closure** of a relation adds every pair implied by chains: if a R b and b R c, add (a, c), and keep going until nothing new appears.

      A simple algorithm: repeatedly look for pairs (a, b) and (b, c) whose combination (a, c) is missing, and add it. When a full pass adds nothing, the relation is transitive. This "repeat until nothing changes" idea, called a **fixed-point** iteration, is very common in computer science. (Faster algorithms exist, such as Warshall's, which you'll see in Unit 8.) If the closure ever contains (a, a), then a course is its own prerequisite through some chain: a **cycle**, which makes the catalogue impossible to complete. Lesson 6.9 treats such relations as **graphs**.

examples:
  - title: Power sets and products
    intro: Building them in Python and checking their sizes.
    code: |
      from itertools import combinations, product

      def power_set(s):
          items = list(s)
          return {frozenset(c) for k in range(len(items) + 1) for c in combinations(items, k)}

      A = {"a", "b", "c"}
      P = power_set(A)
      print(len(P), sorted(sorted(x) for x in P))

      ranks, files = range(1, 3), "ab"
      squares = set(product(files, ranks))
      print(len(squares), sorted(squares))
      print({x for x in range(20) if x % 3 == 0 and x % 2 == 0})
    output: |
      8 [[], ['a'], ['a', 'b'], ['a', 'b', 'c'], ['a', 'c'], ['b'], ['b', 'c'], ['c']]
      4 [('a', 1), ('a', 2), ('b', 1), ('b', 2)]
      {0, 18, 12, 6}
    lines:
      - line: 3-5
        note: "All subsets: combinations of each size from 0 to n. They're frozensets so they can live inside a set."
      - line: 9
        note: "2³ = 8 subsets. Sorting is only to make the printout readable."
      - line: 11-13
        note: "A × B has |A| × |B| = 2 × 2 ordered pairs."
      - line: 14
        note: "Set-builder notation as a comprehension: {x ∈ {0..19} | 3 divides x and 2 divides x}. (Sets print in no particular order.)"
  - title: Testing relation properties
    intro: Each property is a quantified statement over pairs.
    code: |
      def is_reflexive(R, A):
          return all((a, a) in R for a in A)

      def is_symmetric(R):
          return all((b, a) in R for (a, b) in R)

      def is_transitive(R):
          return all((a, d) in R for (a, b) in R for (c, d) in R if b == c)

      A = {1, 2, 3}
      less_equal = {(a, b) for a in A for b in A if a <= b}
      same_parity = {(a, b) for a in A for b in A if a % 2 == b % 2}
      follows = {(1, 2), (2, 3), (3, 1)}

      for name, R in [("<=", less_equal), ("same parity", same_parity), ("follows", follows)]:
          print(f"{name:12} reflexive={is_reflexive(R, A)} symmetric={is_symmetric(R)} transitive={is_transitive(R)}")
    output: |
      <=           reflexive=True symmetric=False transitive=True
      same parity  reflexive=True symmetric=True transitive=True
      follows      reflexive=False symmetric=False transitive=False
    lines:
      - line: 1-2
        note: "∀a ∈ A: (a, a) ∈ R. Reflexivity needs the set A, because it's about every element, not just those in pairs."
      - line: 4-5
        note: "∀(a, b) ∈ R: (b, a) ∈ R."
      - line: 7-8
        note: "∀(a, b), (b, d) ∈ R: (a, d) ∈ R, by checking every pair of pairs that chain together."
      - line: 16-17
        note: "\"Same parity\" has all three properties, so it's an equivalence relation."
  - title: Classifying functions
    intro: Dictionaries as functions, with injective, surjective and inverse.
    code: |
      def is_injective(f):
          return len(set(f.values())) == len(f)

      def is_surjective(f, codomain):
          return set(f.values()) == set(codomain)

      student_id = {"Ada": 101, "Bo": 102, "Cy": 103}
      year = {"Ada": 1, "Bo": 2, "Cy": 1}

      print(is_injective(student_id), is_injective(year))
      print(is_surjective(year, {1, 2}), is_surjective(year, {1, 2, 3}))

      inverse = {v: k for k, v in student_id.items()}
      print(inverse[102])
      letter = {1: "A", 2: "B"}
      print({name: letter[year[name]] for name in year})
    output: |
      True False
      True False
      Bo
      {'Ada': 'A', 'Bo': 'B', 'Cy': 'A'}
    lines:
      - line: 1-2
        note: "Injective: no value repeats, so the set of values is as big as the dictionary."
      - line: 4-5
        note: "Surjective: every element of the codomain is hit."
      - line: 13-14
        note: "An injective dictionary can be inverted by swapping keys and values (a bijection onto its values)."
      - line: 16
        note: "Composition: `letter ∘ year`, applying `year` first, then `letter`."

playground:
  prompt: |
    Make up a relation on a small set (such as "divides" on {1, ..., 12}) and test its properties. Is "divides" reflexive? Symmetric? Antisymmetric? Transitive? Then find a relation that is symmetric and transitive but **not** reflexive. (Hint: think about the empty relation, or an element that appears in no pair.)
  code: |
    A = set(range(1, 13))
    divides = {(a, b) for a in A for b in A if b % a == 0}

    def is_reflexive(R, A):
        return all((a, a) in R for a in A)

    def is_antisymmetric(R):
        return all(a == b for (a, b) in R if (b, a) in R)

    print(len(divides), is_reflexive(divides, A), is_antisymmetric(divides))

exercises:
  - id: set-builders
    title: Power sets and products
    difficulty: 1
    prompt: |
      Write three functions:

      - `power_set(s)`: the set of all subsets of `s`, as a **set of frozensets**.
      - `cartesian(a, b)`: the set of all ordered pairs `(x, y)` with `x` in `a` and `y` in `b`.
      - `subsets_of_size(s, k)`: the set of all subsets of `s` with exactly `k` elements, as frozensets.
    starter: |
      from itertools import combinations, product


      def power_set(s):
          pass


      def cartesian(a, b):
          pass


      def subsets_of_size(s, k):
          pass
    tests:
      - name: power_set
        code: |
          assert power_set(set()) == {frozenset()}
          assert power_set({1, 2}) == {frozenset(), frozenset({1}), frozenset({2}), frozenset({1, 2})}
          assert len(power_set(set(range(10)))) == 1024
      - name: cartesian
        code: |
          assert cartesian({1, 2}, {"x", "y"}) == {(1, "x"), (1, "y"), (2, "x"), (2, "y")}
          assert cartesian({1}, set()) == set()
          assert len(cartesian(set(range(8)), set(range(8)))) == 64
      - name: subsets_of_size
        code: |
          assert subsets_of_size({1, 2, 3}, 2) == {frozenset({1, 2}), frozenset({1, 3}), frozenset({2, 3})}
          assert len(subsets_of_size(set(range(10)), 3)) == 120
          assert subsets_of_size({1, 2}, 5) == set()
    hints:
      - "`combinations(s, k)` gives every k-element selection as a tuple; wrap each in `frozenset`."
      - "`power_set` is the union of `subsets_of_size(s, k)` for k from 0 to `len(s)`."
      - "`cartesian`: `set(product(a, b))`."
    solution: |
      from itertools import combinations, product


      def subsets_of_size(s, k):
          return {frozenset(c) for c in combinations(s, k)}


      def power_set(s):
          result = set()
          for k in range(len(s) + 1):
              result |= subsets_of_size(s, k)
          return result


      def cartesian(a, b):
          return set(product(a, b))
    explanation: |
      Sizes worth remembering: |𝒫(A)| = 2ⁿ, |A × B| = |A| · |B|, and the number of k-element subsets of an n-element set is "n choose k" (120 for n = 10, k = 3), which Lesson 6.6 explains.

  - id: relation-properties
    title: Properties of relations
    difficulty: 2
    prompt: |
      A relation is a set `R` of pairs on a set `A`. Write:

      - `is_reflexive(R, A)`, `is_symmetric(R)`, `is_antisymmetric(R)`, `is_transitive(R)`,
      - `is_equivalence(R, A)`: reflexive, symmetric and transitive,
      - `is_partial_order(R, A)`: reflexive, antisymmetric and transitive.
    starter: |
      def is_reflexive(R, A):
          pass


      def is_symmetric(R):
          pass


      def is_antisymmetric(R):
          pass


      def is_transitive(R):
          pass


      def is_equivalence(R, A):
          pass


      def is_partial_order(R, A):
          pass
    tests:
      - name: basic properties
        code: |
          A = {1, 2, 3}
          le = {(a, b) for a in A for b in A if a <= b}
          assert is_reflexive(le, A) and not is_symmetric(le) and is_antisymmetric(le) and is_transitive(le)
          lt = {(a, b) for a in A for b in A if a < b}
          assert not is_reflexive(lt, A) and is_transitive(lt)
          cyc = {(1, 2), (2, 3), (3, 1)}
          assert not is_transitive(cyc) and not is_symmetric(cyc)
          assert is_symmetric({(1, 2), (2, 1)}) and not is_antisymmetric({(1, 2), (2, 1)})
      - name: equivalences and orders
        code: |
          A = set(range(10))
          mod3 = {(a, b) for a in A for b in A if a % 3 == b % 3}
          assert is_equivalence(mod3, A) and not is_partial_order(mod3, A)
          divides = {(a, b) for a in range(1, 13) for b in range(1, 13) if b % a == 0}
          assert is_partial_order(divides, set(range(1, 13))) and not is_equivalence(divides, set(range(1, 13)))
      - name: edge cases
        code: |
          assert is_symmetric(set()) and is_transitive(set()) and is_antisymmetric(set())
          assert not is_reflexive(set(), {1}) and is_reflexive(set(), set())
          assert not is_equivalence({(1, 1), (2, 2), (1, 2), (2, 1)}, {1, 2, 3}), "3 isn't related to itself"
    hints:
      - "Antisymmetric: whenever both (a, b) and (b, a) are in R, a must equal b: `all(a == b for (a, b) in R if (b, a) in R)`."
      - "Transitive: for every (a, b) and (c, d) in R with b == c, (a, d) must be in R."
      - "The last two functions just combine the first four with `and`."
    solution: |
      def is_reflexive(R, A):
          return all((a, a) in R for a in A)


      def is_symmetric(R):
          return all((b, a) in R for (a, b) in R)


      def is_antisymmetric(R):
          return all(a == b for (a, b) in R if (b, a) in R)


      def is_transitive(R):
          return all((a, d) in R for (a, b) in R for (c, d) in R if b == c)


      def is_equivalence(R, A):
          return is_reflexive(R, A) and is_symmetric(R) and is_transitive(R)


      def is_partial_order(R, A):
          return is_reflexive(R, A) and is_antisymmetric(R) and is_transitive(R)
    explanation: |
      Each definition translates directly from its quantified form. A **partial order** like "divides" ranks some pairs but not others (neither 4 nor 6 divides the other), unlike ≤ on numbers, a total order where every pair is comparable. Task scheduling, version histories and class hierarchies (Lesson 5.6) are all partial orders. The transitivity check is O(|R|²): fine for small relations.

  - id: equivalence-classes
    title: Equivalence classes
    difficulty: 2
    prompt: |
      Write `classes(items, key)` that partitions `items` into equivalence classes, where two items are equivalent when `key` gives them the same value. Return a **list of sets**, ordered by the first appearance (in `items`) of any member of each class.

      Then use it to write `anagram_groups(words)`: the classes of words that are anagrams of each other (ignoring case), keeping only classes with **more than one** word.
    starter: |
      def classes(items, key):
          pass


      def anagram_groups(words):
          pass
    tests:
      - name: classes
        code: |
          assert classes(range(9), lambda n: n % 3) == [{0, 3, 6}, {1, 4, 7}, {2, 5, 8}]
          assert classes(["apple", "bob", "avocado", "cat", "banana"], lambda w: w[0]) == [{"apple", "avocado"}, {"bob", "banana"}, {"cat"}]
          assert classes([], len) == []
      - name: a partition
        code: |
          items = list(range(50))
          cs = classes(items, lambda n: n % 7)
          assert sum(len(c) for c in cs) == 50 and set().union(*cs) == set(items), "Every item must be in exactly one class"
      - name: anagram_groups
        code: |
          got = anagram_groups(["listen", "Silent", "enlist", "google", "cat", "act", "dog"])
          assert got == [{"listen", "Silent", "enlist"}, {"cat", "act"}], f"Got {got}"
    hints:
      - "Use a dictionary from key value to set (the grouping pattern). Dictionaries remember insertion order, so `list(groups.values())` comes out in first-appearance order."
      - "The canonical form for anagrams is `\"\".join(sorted(word.lower()))` (Lesson 3.8)."
    solution: |
      def classes(items, key):
          groups = {}
          for item in items:
              groups.setdefault(key(item), set()).add(item)
          return list(groups.values())


      def anagram_groups(words):
          return [c for c in classes(words, lambda w: "".join(sorted(w.lower()))) if len(c) > 1]
    explanation: |
      "Same key value" is always an equivalence relation (reflexive, symmetric and transitive, because equality is), so grouping by a key always gives a partition, in a single O(n) pass. That's much faster than comparing every pair. `setdefault(k, set())` returns the existing set for `k`, or inserts and returns a new empty one.

  - id: function-types
    title: Injective, surjective, bijective
    difficulty: 2
    prompt: |
      A mapping is given as a set of pairs `pairs` from set `A` to set `B`. Write:

      - `is_function(pairs, A, B)`: every element of A appears as a first item **exactly once**, and every second item is in B.
      - `is_injective(pairs)`, `is_surjective(pairs, B)` and `is_bijective(pairs, A, B)` (a bijection must also be a function).
      - `inverse(pairs)`: the set of pairs with each pair reversed.
    starter: |
      def is_function(pairs, A, B):
          pass


      def is_injective(pairs):
          pass


      def is_surjective(pairs, B):
          pass


      def is_bijective(pairs, A, B):
          pass


      def inverse(pairs):
          pass
    tests:
      - name: is_function
        code: |
          A, B = {1, 2, 3}, {"x", "y"}
          assert is_function({(1, "x"), (2, "x"), (3, "y")}, A, B)
          assert not is_function({(1, "x"), (2, "x")}, A, B), "3 has no image"
          assert not is_function({(1, "x"), (1, "y"), (2, "x"), (3, "x")}, A, B), "1 has two images"
          assert not is_function({(1, "x"), (2, "x"), (3, "z")}, A, B), "z isn't in B"
      - name: injective, surjective, bijective
        code: |
          A, B = {1, 2, 3}, {"x", "y", "z"}
          f = {(1, "x"), (2, "y"), (3, "z")}
          g = {(1, "x"), (2, "x"), (3, "y")}
          assert is_injective(f) and is_surjective(f, B) and is_bijective(f, A, B)
          assert not is_injective(g) and not is_surjective(g, B) and not is_bijective(g, A, B)
          assert is_surjective(g, {"x", "y"})
          assert not is_bijective({(1, "x"), (2, "y")}, A, {"x", "y"}), "Not a function on A, so not a bijection"
      - name: inverse
        code: |
          f = {(1, "x"), (2, "y")}
          assert inverse(f) == {("x", 1), ("y", 2)} and inverse(inverse(f)) == f
    hints:
      - "`is_function`: the list `[a for a, b in pairs]` must have exactly the elements of A with no repeats, so check `sorted` equality or compare lengths with the set."
      - "Injective: no second item repeats: `len({b for a, b in pairs}) == len(pairs)`."
      - "Surjective: `{b for a, b in pairs} == set(B)`."
    solution: |
      def is_function(pairs, A, B):
          firsts = [a for a, b in pairs]
          return (len(firsts) == len(set(firsts)) and set(firsts) == set(A)
                  and all(b in B for a, b in pairs))


      def is_injective(pairs):
          return len({b for a, b in pairs}) == len(pairs)


      def is_surjective(pairs, B):
          return {b for a, b in pairs} == set(B)


      def is_bijective(pairs, A, B):
          return is_function(pairs, A, B) and is_injective(pairs) and is_surjective(pairs, B)


      def inverse(pairs):
          return {(b, a) for a, b in pairs}
    explanation: |
      The inverse of any relation exists as a relation, but it is a *function* only when the original was a bijection: if two inputs shared an output, the inverse would give that output two images. A useful consequence for finite sets: an injective function from A to B needs |A| ≤ |B|, and a bijection means |A| = |B|. That idea becomes the **pigeonhole principle** in Lesson 6.6.

  - id: prerequisites
    title: All the prerequisites
    difficulty: 3
    prompt: |
      `direct` is a set of pairs `(course, prerequisite)`, meaning the course directly requires the prerequisite. Write:

      - `closure(R)`: the **transitive closure** of relation `R`: keep adding `(a, c)` whenever `(a, b)` and `(b, c)` are present, until nothing changes.
      - `all_prerequisites(direct, course)`: the set of every course that must be taken before `course`, directly or indirectly.
      - `has_cycle(direct)`: `True` if some course (through a chain of requirements) requires itself.
      - `can_take(direct, course, done)`: `True` if every direct prerequisite of `course` is in the set `done`.
    starter: |
      def closure(R):
          pass


      def all_prerequisites(direct, course):
          pass


      def has_cycle(direct):
          pass


      def can_take(direct, course, done):
          pass
    tests:
      - name: closure
        code: |
          R = {(1, 2), (2, 3), (3, 4)}
          assert closure(R) == {(1, 2), (2, 3), (3, 4), (1, 3), (2, 4), (1, 4)}, f"Got {closure(R)}"
          assert closure(set()) == set()
          assert R == {(1, 2), (2, 3), (3, 4)}, "closure mustn't change its input"
      - name: all_prerequisites
        code: |
          direct = {("Algorithms", "Data Structures"), ("Data Structures", "Programming"),
                    ("Algorithms", "Discrete Maths"), ("Discrete Maths", "Logic"), ("AI", "Algorithms")}
          assert all_prerequisites(direct, "Algorithms") == {"Data Structures", "Programming", "Discrete Maths", "Logic"}
          assert all_prerequisites(direct, "AI") == {"Algorithms", "Data Structures", "Programming", "Discrete Maths", "Logic"}
          assert all_prerequisites(direct, "Programming") == set()
      - name: cycles and can_take
        code: |
          direct = {("B", "A"), ("C", "B")}
          assert not has_cycle(direct)
          assert has_cycle(direct | {("A", "C")}), "A needs C needs B needs A"
          assert has_cycle({("X", "X")})
          assert can_take(direct, "C", {"A", "B"}) and not can_take(direct, "C", {"A"}) and can_take(direct, "A", set())
    hints:
      - "`closure`: start with `result = set(R)`; loop: build the set of new pairs `{(a, d) for (a, b) in result for (c, d) in result if b == c} - result`; stop when it's empty, otherwise add them."
      - "`all_prerequisites`: every `p` with `(course, p)` in the closure."
      - "`has_cycle`: is there any pair `(a, a)` in the closure?"
    solution: |
      def closure(R):
          result = set(R)
          while True:
              new = {(a, d) for (a, b) in result for (c, d) in result if b == c} - result
              if not new:
                  return result
              result |= new


      def all_prerequisites(direct, course):
          return {p for (c, p) in closure(direct) if c == course}


      def has_cycle(direct):
          return any(a == b for (a, b) in closure(direct))


      def can_take(direct, course, done):
          return all(p in done for (c, p) in direct if c == course)
    explanation: |
      Each pass of the loop adds the pairs reachable by chaining two known pairs; when a pass finds nothing new, the relation has reached a **fixed point** and is transitive. A course reachable from itself means a cycle, and a timetable with a cycle can never be completed. In Lesson 6.9 you'll see this as a question about paths in a graph, and in Units 7 and 8 you'll meet much faster ways to answer it.

commonMistakes:
  - title: Putting ordinary sets inside sets
    explanation: |
      `{{1, 2}}` raises `TypeError: unhashable type: 'set'`. Elements of a set must be hashable, so use `frozenset({1, 2})`.
  - title: Forgetting that pairs are ordered
    explanation: |
      In a Cartesian product or relation, (1, 2) and (2, 1) are different pairs. "Follows" from Ada to Bo says nothing about Bo to Ada.
  - title: Checking reflexivity only on elements that appear in pairs
    explanation: |
      Reflexive means *every* element of A is related to itself, including elements that appear in no pair at all. You need A itself to check it.
  - title: Calling any mapping a function
    explanation: |
      A function must give every element of its domain exactly one image. A dictionary missing some keys, or a relation with two outputs for one input, isn't a function on that domain.
  - title: Confusing injective and surjective
    explanation: |
      Injective is about inputs (no two share an output); surjective is about outputs (every possible output is used). A function can be either, both or neither.

summary:
  - "Sets: ∈, ⊆, ∪, ∩, −, |A|; set-builder notation {x | P(x)} is a set comprehension. Sets of sets need frozensets."
  - "The **power set** of an n-element set has 2ⁿ subsets; the **Cartesian product** A × B has |A|·|B| ordered pairs."
  - "A **relation** is a set of pairs. Key properties: reflexive, symmetric, antisymmetric, transitive."
  - "An **equivalence relation** (reflexive, symmetric, transitive) partitions a set into **equivalence classes**; grouping by a key finds them."
  - "A **function** gives each input exactly one output. **Injective**: no repeated outputs; **surjective**: every output used; **bijective**: both, so it has an inverse."
  - "The **transitive closure** adds all chained pairs; repeat until nothing changes. A pair (a, a) in it reveals a cycle."
next: |
  So far you've checked claims by computing: trying every row, every element, every pair. That works for finite cases, but how can you be sure something holds for *every* integer, or for lists of *any* length? **Lesson 6.4** introduces **proof**: direct proof, proof by contrapositive, proof by contradiction, and how to write an argument that convinces anyone, forever.

quiz:
  - type: mcq
    question: How many subsets does a set with 5 elements have?
    options: ["5", "10", "25", "32"]
    answer: 3
    explanation: Each element is either in or out, giving 2⁵ = 32 subsets, including ∅ and the set itself.
  - type: mcq
    question: "If |A| = 3 and |B| = 4, what is |A × B|?"
    options: ["7", "12", "64", "81"]
    answer: 1
    explanation: There are 3 × 4 ordered pairs.
  - type: mcq
    question: "\"Follows\" on a social network (you can follow someone who doesn't follow you) is not:"
    options: ["a relation", "symmetric", "a set of pairs", "on the set of users"]
    answer: 1
    explanation: Ada following Bo doesn't imply Bo follows Ada.
  - type: mcq
    question: Which properties make a relation an equivalence relation?
    options:
      - Reflexive, antisymmetric, transitive
      - Reflexive, symmetric, transitive
      - Symmetric and transitive only
      - Injective and surjective
    answer: 1
    explanation: Reflexive, antisymmetric and transitive is a partial order instead.
  - type: mcq
    question: "The mapping student → year group is usually:"
    options: ["Injective but not surjective", "Surjective but not injective", "Bijective", "Not a function"]
    answer: 1
    explanation: Many students share a year (not injective), but every year has students (surjective).
  - type: mcq
    question: Why can't `{{1, 2}, {3}}` be created in Python?
    options:
      - Sets can't contain numbers
      - Sets are mutable and so unhashable; use frozensets instead
      - Sets must be sorted
      - Python has no nested collections
    answer: 1
    explanation: Elements of a set must be hashable, and only immutable sets (frozensets) are.
  - type: code
    question: |
      Write `compose(g, f)` that takes two dictionaries representing functions and returns the dictionary for g ∘ f (apply `f` first, then `g`). Assume every value of `f` is a key of `g`.
    starter: |
      def compose(g, f):
          pass
    tests:
      - name: compose works
        code: |
          f = {"Ada": 1, "Bo": 2, "Cy": 1}
          g = {1: "first year", 2: "second year"}
          assert compose(g, f) == {"Ada": "first year", "Bo": "second year", "Cy": "first year"}
          assert compose({}, {}) == {}
    solution: |
      def compose(g, f):
          return {x: g[f[x]] for x in f}
