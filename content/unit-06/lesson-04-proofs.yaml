    question: |
      Write `find_counterexample(limit)` that searches n from 1 to `limit` and returns the first n for which 2ⁿ − 1 is **not** prime even though n **is** prime (disproving "if n is prime then 2ⁿ − 1 is prime"), or `None`. Use the provided `is_prime`.
    starter: |
      def is_prime(n):
          if n < 2:
              return False
          return all(n % d != 0 for d in range(2, int(n ** 0.5) + 1))


      def find_counterexample(limit):
          pass
    tests:
      - name: find_counterexample works
        code: |
          assert find_counterexample(10) is None
          assert find_counterexample(20) == 11, "2^11 - 1 = 2047 = 23 x 89"
    solution: |
      def is_prime(n):
          if n < 2:
              return False
          return all(n % d != 0 for d in range(2, int(n ** 0.5) + 1))


      def find_counterexample(limit):
          for n in range(1, limit + 1):
              if is_prime(n) and not is_prime(2 ** n - 1):
                  return n
          return None
