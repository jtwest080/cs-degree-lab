id: u6-proofs
title: Proof Techniques
minutes: 55
objective: |
  Read and write mathematical **proofs** using four core techniques (**direct proof**, **contrapositive**, **contradiction** and **cases**), prove existence by **construction**, disprove claims with **counterexamples**, and connect proofs to programs through **loop invariants**, using code to explore and check ideas before proving them.
outcomes:
  - Explain what a proof is and why testing alone can't replace it
  - Write a direct proof from precise definitions (even, odd, divides)
  - Prove an implication through its contrapositive
  - Prove a statement by contradiction, including that √2 is irrational and that there are infinitely many primes
  - Prove a statement about all integers by checking a finite number of cases
  - Use a loop invariant to argue that an algorithm is correct

sections:
  - heading: What is a proof?
    body: |
      A **proof** is an argument that shows a statement must be true, with every step following logically from definitions, from facts already proved, or from earlier steps. Once proved, a theorem stays true forever: Euclid's proof that there are infinitely many primes is over 2,300 years old and as valid today as when he wrote it.

      Computer scientists need proofs because programs handle inputs nobody tested. A sorting function tested on a thousand lists might still fail on the thousand-and-first; a proof that it's correct covers every list. Proofs also explain *why* something is true, which often leads to better algorithms.

      Proofs start from **precise definitions**. For whole numbers:

      - n is **even** if n = 2k for some integer k; n is **odd** if n = 2k + 1 for some integer k.
      - a **divides** b, written a | b, if b = a·k for some integer k. (So 3 | 12, but 5 ∤ 12.)
      - n > 1 is **prime** if its only positive divisors are 1 and n.
      - a real number is **rational** if it equals p/q for integers p and q with q ≠ 0.

      Code is an excellent **exploration** tool: test a claim on thousands of cases first, and if it survives, look for a proof. But the code's output is evidence, not proof (Lesson 6.2's n² + n + 41).

  - heading: Direct proof
    body: |
      To prove "if P then Q" **directly**: assume P is true, then use definitions and algebra to reach Q.

      > **Claim.** The sum of two odd numbers is even.
      >
      > **Proof.** Let a and b be odd. By definition, a = 2j + 1 and b = 2k + 1 for some integers j and k. Then
      > a + b = 2j + 1 + 2k + 1 = 2j + 2k + 2 = 2(j + k + 1).
      > Since j + k + 1 is an integer, a + b is two times an integer, so a + b is even. ∎

      Notice the pattern: **unwrap the definitions** of the hypothesis (odd means 2k + 1), manipulate, then **rewrap** into the definition of the conclusion (even means 2 × something). Use *different* letters (j and k) for different numbers: writing a = 2k + 1 and b = 2k + 1 would wrongly assume a = b. The symbol ∎ (or "QED") marks the end of a proof.

      Another example: if a | b and b | c, then a | c. *Proof:* b = a·j and c = b·k for integers j, k, so c = (a·j)·k = a·(jk), and jk is an integer, so a | c. ∎ (That's the transitivity of "divides" from Lesson 6.3, now proved for all integers rather than checked for 1 to 12.)

  - heading: Proof by contrapositive
    body: |
      Sometimes "if P then Q" is hard to prove directly, but its contrapositive "if not Q then not P" is easy. Since they're logically equivalent (Lesson 6.1), proving one proves the other.

      > **Claim.** For any integer n, if n² is even, then n is even.
      >
      > **Proof.** We prove the contrapositive: if n is odd, then n² is odd. Let n = 2k + 1. Then n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1, which is odd. ∎

      Trying the direct route, you'd start from "n² = 2m" and get stuck trying to take a square root. The contrapositive turns it into a simple calculation. Look for the contrapositive whenever the conclusion is easier to *assume false* than the hypothesis is to use.

  - heading: Proof by contradiction
    body: |
      To prove a statement S by **contradiction**: assume S is **false**, and show that this leads to something impossible, like 1 = 0 or "x is both even and odd". Since a valid argument can't reach a false conclusion from true assumptions, the assumption must have been wrong, so S is true.

      > **Claim.** √2 is irrational.
      >
      > **Proof.** Suppose, for contradiction, that √2 is rational: √2 = p/q, where p and q are integers with no common factor (any fraction can be reduced to lowest terms, Lesson 5.3). Squaring, 2 = p²/q², so p² = 2q². So p² is even, and by the claim above, p is even: p = 2m. Then 4m² = 2q², so q² = 2m², so q² is even, and q is even. But then p and q are both even, sharing the factor 2, which contradicts their having no common factor. So √2 is irrational. ∎

      > **Claim (Euclid).** There are infinitely many primes.
      >
      > **Proof.** Suppose there are only finitely many primes, p₁, p₂, ..., pₙ. Let N = p₁·p₂·...·pₙ + 1. N > 1, so it has some prime factor p. But dividing N by any pᵢ leaves remainder 1, so p is none of p₁, ..., pₙ. That contradicts our list containing every prime. ∎

      Note that N itself needn't be prime: 2·3·5·7·11·13 + 1 = 30031 = 59 × 509. The proof only needs N to have a prime factor missing from the list. Contradiction is powerful but use it with care: if a direct proof exists, it's usually clearer.

  - heading: Proof by cases, and exhaustion
    body: |
      If every possibility falls into one of a few **cases**, prove the claim separately in each case.

      > **Claim.** For every integer n, n² leaves remainder 0 or 1 when divided by 4.
      >
      > **Proof.** Every integer is even or odd. *Case 1:* n = 2k, so n² = 4k², remainder 0. *Case 2:* n = 2k + 1, so n² = 4k² + 4k + 1 = 4(k² + k) + 1, remainder 1. ∎

      A neat consequence: a sum of two squares leaves remainder 0, 1 or 2 when divided by 4, **never 3**. So 4,000,003 is not a sum of two squares, proved without searching.

      Here's where computers help honestly. The remainder of n² when divided by m depends only on the remainder of n (Lesson 6.8 explains why). So to learn every possible value of n² mod m for **all integers**, it's enough to check n = 0, 1, ..., m − 1. That's a finite **proof by exhaustion**, and a computer can do it. The famous Four Colour Theorem (any map can be coloured with four colours so neighbours differ) was proved in 1976 by reducing it to about 1,900 cases checked by computer.

  - heading: Existence, counterexamples and constructions
    body: |
      To prove "**there exists** an x with P(x)", the most satisfying method is **construction**: show a specific x and check it. For example, "for every n, there are n consecutive composite (non-prime) numbers": take (n+1)! + 2, (n+1)! + 3, ..., (n+1)! + (n+1). Each (n+1)! + k is divisible by k (because k divides (n+1)!), so none is prime. A constructive proof is also an **algorithm** for finding the thing. You'll code this one.

      To prove "**for all** x, P(x)" is **false**, give a single counterexample (Lesson 6.2), and check it carefully.

      Common logical errors to avoid in proofs:

      - **Proof by example**: "it works for 3 and 5, so it's true for all odd numbers."
      - **Affirming the conclusion**: proving Q → P when you needed P → Q (the converse, Lesson 6.1).
      - **Circular reasoning**: using the claim itself somewhere in the argument.
      - **Hidden assumptions**: dividing by something that might be zero, or assuming two different numbers are the same.

  - heading: Proofs about programs
    body: |
      Proofs aren't only about numbers. You can prove that a **loop** is correct using a **loop invariant** (first met in Lesson 4.3): a statement that's true before the loop starts and stays true after every iteration. Take finding the maximum:

      ```python
      def maximum(xs):
          best = xs[0]
          for i in range(1, len(xs)):
              # invariant: best is the largest of xs[0..i-1]
              if xs[i] > best:
                  best = xs[i]
          return best
      ```

      **Initialisation:** before the loop, best = xs[0], the largest of xs[0..0]. **Maintenance:** if best is the largest of xs[0..i−1], then after comparing with xs[i] and keeping the larger, it's the largest of xs[0..i]. **Termination:** when the loop ends, i has covered every index, so best is the largest of the whole list. ∎

      This three-part pattern is the backbone of algorithm correctness proofs in Unit 8. Python's `assert` (Lesson 2.9) can check an invariant while the program runs, a useful bridge between testing and proving. The next lesson, on **induction**, shows that this pattern is a proof technique in its own right.

examples:
  - title: Exploring before proving
    intro: Check claims on many cases first; if they survive, look for a proof.
    code: |
      odds = range(1, 200, 2)
      print(all((a + b) % 2 == 0 for a in odds for b in odds))
      print(all((a * b) % 2 == 1 for a in odds for b in odds))

      print("n squared mod 4:", sorted({n * n % 4 for n in range(4)}))
      print("n squared mod 8:", sorted({n * n % 8 for n in range(8)}))
      sums = sorted({(a * a + b * b) % 4 for a in range(4) for b in range(4)})
      print("sums of two squares mod 4:", sums)
    output: |
      True
      True
      n squared mod 4: [0, 1]
      n squared mod 8: [0, 1, 4]
      sums of two squares mod 4: [0, 1, 2]
    lines:
      - line: 1-3
        note: "Evidence for two claims (odd + odd is even, odd × odd is odd): 10,000 pairs each. Still not a proof."
      - line: 5-6
        note: "These ARE proofs by exhaustion: n² mod m only depends on n mod m, so checking 0 to m − 1 covers every integer."
      - line: 7-8
        note: "No sum of two squares leaves remainder 3 mod 4, for any integers at all."
  - title: Euclid's construction in action
    intro: Multiply the known primes, add 1, and find a new prime factor.
    code: |
      def smallest_factor(n):
          d = 2
          while d * d <= n:
              if n % d == 0:
                  return d
              d += 1
          return n

      primes = [2]
      for _ in range(6):
          N = 1
          for p in primes:
              N *= p
          N += 1
          new = smallest_factor(N)
          print(f"product + 1 = {N}, new prime {new}")
          primes.append(new)
      print(primes)
    output: |
      product + 1 = 3, new prime 3
      product + 1 = 7, new prime 7
      product + 1 = 43, new prime 43
      product + 1 = 1807, new prime 13
      product + 1 = 23479, new prime 53
      product + 1 = 1244335, new prime 5
      [2, 3, 7, 43, 13, 53, 5]
    lines:
      - line: 1-7
        note: "The smallest factor of n (above 1) is always prime: any smaller factor of it would divide n too."
      - line: 11-14
        note: "N is the product of the primes found so far, plus 1."
      - line: 15
        note: "N leaves remainder 1 when divided by every prime in the list, so its smallest factor must be a new prime."
      - line: 16
        note: "1807 = 13 × 139 isn't prime itself, but it still yields a new prime, exactly as the proof says."
  - title: Checking a loop invariant
    intro: An assert inside the loop checks the invariant on every iteration.
    code: |
      def maximum(xs):
          best = xs[0]
          for i in range(1, len(xs)):
              assert best == max(xs[:i]), "invariant broken"
              if xs[i] > best:
                  best = xs[i]
          assert best == max(xs)
          return best

      import random
      random.seed(4)
      for _ in range(1000):
          data = [random.randint(-100, 100) for _ in range(random.randint(1, 30))]
          maximum(data)
      print("invariant held on 1000 random lists")
    output: |
      invariant held on 1000 random lists
    lines:
      - line: 4
        note: "The invariant: before position i is examined, best is the largest of xs[0..i−1]. (Using `max` here is only for checking; it's slow.)"
      - line: 7
        note: "At termination, the invariant becomes exactly the result we want."
      - line: 10-15
        note: "Running asserts on random inputs builds confidence; the three-part argument in the lesson is what proves it for every list."

playground:
  prompt: |
    Use exhaustion to discover facts about remainders, then try to prove them by cases. What values can n³ take mod 9? What about n² mod 3? Can a perfect square end in the digit 7 (think mod 10)?
  code: |
    for m in [3, 5, 9, 10]:
        print(f"n^2 mod {m}:", sorted({n * n % m for n in range(m)}))
        print(f"n^3 mod {m}:", sorted({n ** 3 % m for n in range(m)}))

exercises:
  - id: square-residues
    title: A proof by exhaustion
    difficulty: 1
    prompt: |
      Because n² mod m depends only on n mod m, the set of possible remainders of squares can be found by checking just 0, 1, ..., m − 1.

      - Write `square_residues(m)` returning the set of all values n² mod m.
      - Write `two_square_residues(m)` returning the set of all values (a² + b²) mod m.
      - Write `never_sum_of_two_squares(n)` returning `True` if `n % 4 == 3`, justified by `two_square_residues(4)`. (Use the function, don't just hard-code 3.)
    starter: |
      def square_residues(m):
          pass


      def two_square_residues(m):
          pass


      def never_sum_of_two_squares(n):
          pass
    tests:
      - name: square_residues
        code: |
          assert square_residues(4) == {0, 1} and square_residues(8) == {0, 1, 4} and square_residues(10) == {0, 1, 4, 5, 6, 9}
      - name: two_square_residues
        code: |
          assert two_square_residues(4) == {0, 1, 2}
          assert two_square_residues(3) == {0, 1, 2}
      - name: never_sum_of_two_squares
        code: |
          assert never_sum_of_two_squares(4000003) is True and never_sum_of_two_squares(7) is True
          assert never_sum_of_two_squares(5) is False and never_sum_of_two_squares(25) is False
          assert "two_square_residues(4)" in source, "Use two_square_residues(4) in your answer"
    hints:
      - "`square_residues`: `{n * n % m for n in range(m)}`."
      - "`two_square_residues`: loop over both `a` and `b` in `range(m)`."
      - "`never_sum_of_two_squares(n)`: `n % 4 not in two_square_residues(4)`."
    solution: |
      def square_residues(m):
          return {n * n % m for n in range(m)}


      def two_square_residues(m):
          return {(a * a + b * b) % m for a in range(m) for b in range(m)}


      def never_sum_of_two_squares(n):
          return n % 4 not in two_square_residues(4)
    explanation: |
      Checking 16 pairs proves a fact about all infinitely many integers, because the question only depends on remainders mod 4. That's a legitimate proof by exhaustion. (Note the claim is one-directional: n % 4 == 1 doesn't guarantee n is a sum of two squares; 21 isn't.) Also, `square_residues(10)` shows why no perfect square ends in 2, 3, 7 or 8.

  - id: euclid-primes
    title: Euclid's construction
    difficulty: 2
    prompt: |
      Turn Euclid's proof into code:

      - `smallest_factor(n)`: the smallest divisor of `n` greater than 1 (for n ≥ 2).
      - `new_prime(primes)`: given a non-empty list of primes, compute N = (product of the primes) + 1 and return the smallest prime factor of N. By Euclid's argument, it's never in the list.
      - `generate_primes(k)`: starting from `[2]`, repeatedly append `new_prime` of the list so far until it has `k` primes; return the list.
    starter: |
      def smallest_factor(n):
          pass


      def new_prime(primes):
          pass


      def generate_primes(k):
          pass
    tests:
      - name: smallest_factor
        code: |
          assert [smallest_factor(n) for n in [2, 9, 15, 17, 91, 1807]] == [2, 3, 3, 17, 7, 13]
      - name: new_prime
        code: |
          assert new_prime([2]) == 3 and new_prime([2, 3, 5, 7, 11, 13]) == 59, "30031 = 59 x 509"
          for ps in [[2], [3, 5], [2, 7, 11], [5, 13]]:
              assert new_prime(ps) not in ps
      - name: generate_primes
        code: |
          assert generate_primes(1) == [2]
          assert generate_primes(6) == [2, 3, 7, 43, 13, 53], f"Got {generate_primes(6)}"
    hints:
      - "`smallest_factor`: try `d = 2, 3, 4, ...` while `d * d <= n`; if none divides `n`, then `n` itself is prime."
      - "`new_prime`: multiply the primes together in a loop (start from 1), add 1, then call `smallest_factor`."
    solution: |
      def smallest_factor(n):
          d = 2
          while d * d <= n:
              if n % d == 0:
                  return d
              d += 1
          return n


      def new_prime(primes):
          product = 1
          for p in primes:
              product *= p
          return smallest_factor(product + 1)


      def generate_primes(k):
          primes = [2]
          while len(primes) < k:
              primes.append(new_prime(primes))
          return primes
    explanation: |
      The proof by contradiction contains a construction: give it any finite list of primes and it produces a prime not on the list. The primes it finds aren't in order (this sequence is known as the Euclid–Mullin sequence), and they grow fast, but there's no end to them, which is exactly what the theorem says.

  - id: rational-search
    title: No fraction squares to 2
    difficulty: 2
    prompt: |
      Explore the claim that √2 is irrational:

      - `fraction_squared_is_two(limit)`: search every pair `p`, `q` with `1 <= q <= limit` and `1 <= p <= 2 * limit`, and return the first `(p, q)` with p² = 2q², or `None`. (It will always be `None`: that's the theorem.)
      - `best_approximation(limit)`: return the fraction `(p, q)` with `1 <= q <= limit` whose square is **closest** to 2, measured by |p² − 2q²| / q². For each q, the best p is the integer nearest to q·√2; try both `int(q * 2 ** 0.5)` and one more. If two fractions tie, keep the one with the smaller q.
    starter: |
      def fraction_squared_is_two(limit):
          pass


      def best_approximation(limit):
          pass
    tests:
      - name: no exact fraction
        code: |
          assert fraction_squared_is_two(300) is None
      - name: best approximations
        code: |
          assert best_approximation(1) == (1, 1)
          assert best_approximation(5) == (7, 5), f"Got {best_approximation(5)}"
          assert best_approximation(50) == (41, 29), f"Got {best_approximation(50)}"
          assert best_approximation(1000) == (1393, 985), f"Got {best_approximation(1000)}"
    hints:
      - "The search is two nested loops with an early `return (p, q)`; after the loops, `return None`."
      - "For the approximation, track the best error so far and replace only when strictly smaller (so ties keep the smaller q)."
    solution: |
      def fraction_squared_is_two(limit):
          for q in range(1, limit + 1):
              for p in range(1, 2 * limit + 1):
                  if p * p == 2 * q * q:
                      return (p, q)
          return None


      def best_approximation(limit):
          best, best_error = None, None
          for q in range(1, limit + 1):
              base = int(q * 2 ** 0.5)
              for p in (base, base + 1):
                  if p < 1:
                      continue
                  error = abs(p * p - 2 * q * q) / (q * q)
                  if best_error is None or error < best_error:
                      best, best_error = (p, q), error
          return best
    explanation: |
      The search finds nothing, and the approximations get astonishingly close (1393/985 squared is 2.0000010...), with p² − 2q² as small as ±1 but never 0. No amount of searching could prove there's no exact fraction, because the search space is infinite; the proof by contradiction does it in a few lines. Exploration shows *what* is true; proof shows *that* it's true.

  - id: composite-run
    title: A constructive proof
    difficulty: 2
    prompt: |
      Prove by construction that there are runs of `n` consecutive composite numbers, for any `n ≥ 1`:

      - `composite_run(n)` returns the list [(n+1)! + 2, (n+1)! + 3, ..., (n+1)! + (n+1)], which has `n` numbers.
      - `witness_divisors(n)` returns, for each number in that run, the divisor the proof uses (2, 3, ..., n+1), as a list of `(number, divisor)` pairs.

      The tests check that every number really is divisible by its witness, which is the proof's key step.
    starter: |
      def factorial(n):
          result = 1
          for k in range(2, n + 1):
              result *= k
          return result


      def composite_run(n):
          pass


      def witness_divisors(n):
          pass
    tests:
      - name: composite_run
        code: |
          assert composite_run(1) == [4]
          assert composite_run(3) == [26, 27, 28], f"Got {composite_run(3)}"
          run = composite_run(10)
          assert len(run) == 10 and all(run[i] + 1 == run[i + 1] for i in range(9))
      - name: witnesses prove compositeness
        code: |
          for n in [1, 5, 20]:
              pairs = witness_divisors(n)
              assert [x for x, d in pairs] == composite_run(n)
              assert all(1 < d < x and x % d == 0 for x, d in pairs), f"A witness doesn't divide its number for n={n}"
    hints:
      - "`f = factorial(n + 1)`, then `[f + k for k in range(2, n + 2)]`."
      - "`witness_divisors`: pair each number with its k: `[(f + k, k) for k in range(2, n + 2)]`."
    solution: |
      def factorial(n):
          result = 1
          for k in range(2, n + 1):
              result *= k
          return result


      def composite_run(n):
          f = factorial(n + 1)
          return [f + k for k in range(2, n + 2)]


      def witness_divisors(n):
          f = factorial(n + 1)
          return [(f + k, k) for k in range(2, n + 2)]
    explanation: |
      For each k from 2 to n + 1, k divides (n+1)! (it's one of the factors), and k divides k, so k divides their sum. Since 1 < k < (n+1)! + k, each number has a proper divisor and is composite. The construction proves that gaps between primes can be as long as you like, and as code it actually produces them (though not the *smallest* such runs: 24 to 28 is a shorter example of five composites).

  - id: invariant-proof
    title: Invariants in practice
    difficulty: 3
    prompt: |
      Write `sum_and_count_positive(xs)` that returns a tuple `(total, count)`: the sum of the positive numbers in `xs` and how many there are, in **one loop** over the indexes. Inside the loop, before processing position `i`, **assert the loop invariant**: `total` equals the sum of the positive numbers in `xs[:i]` and `count` equals how many there are. After the loop, assert the invariant for the whole list.

      Then write `binary_search(xs, target)` (on a sorted list, returning an index of `target` or `-1`) that asserts its invariant at the top of each loop iteration: **if target is in xs, then it lies within xs[low:high + 1]**. Write a helper `in_range(xs, target, low, high)` that checks this invariant and use it in the assertion.
    starter: |
      def sum_and_count_positive(xs):
          pass


      def in_range(xs, target, low, high):
          pass


      def binary_search(xs, target):
          pass
    tests:
      - name: sum_and_count_positive
        code: |
          assert sum_and_count_positive([3, -1, 4, 0, -5, 2]) == (9, 3)
          assert sum_and_count_positive([]) == (0, 0)
          assert sum_and_count_positive([-1, -2]) == (0, 0)
      - name: in_range
        code: |
          assert in_range([1, 3, 5, 7], 5, 1, 3) is True
          assert in_range([1, 3, 5, 7], 5, 0, 1) is False
          assert in_range([1, 3, 5, 7], 4, 0, 1) is True, "If the target isn't in xs at all, the invariant holds vacuously"
      - name: binary_search
        code: |
          xs = list(range(0, 100, 3))
          for t in [0, 3, 51, 99, 4, -1, 100]:
              got = binary_search(xs, t)
              assert (got == -1) if t not in xs else (xs[got] == t), f"binary_search(xs, {t}) gave {got}"
      - name: invariants are asserted
        code: |
          import ast
          asserts = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Assert)]
          assert len(asserts) >= 3, "Assert the invariants: in the first loop, after it, and in binary_search's loop"
          assert "in_range(" in source.split("def binary_search")[1], "Use in_range in binary_search's assertion"
    hints:
      - "Invariant check: `assert total == sum(x for x in xs[:i] if x > 0) and count == len([x for x in xs[:i] if x > 0])`."
      - "`in_range` is an implication: `(target not in xs) or (target in xs[low:high + 1])`."
      - "In `binary_search`, `low, high = 0, len(xs) - 1` and `while low <= high:` with `assert in_range(xs, target, low, high)` as the first line in the loop."
    solution: |
      def sum_and_count_positive(xs):
          total, count = 0, 0
          for i in range(len(xs)):
              assert total == sum(x for x in xs[:i] if x > 0) and count == len([x for x in xs[:i] if x > 0])
              if xs[i] > 0:
                  total += xs[i]
                  count += 1
          assert total == sum(x for x in xs if x > 0) and count == len([x for x in xs if x > 0])
          return total, count


      def in_range(xs, target, low, high):
          return (target not in xs) or (target in xs[low:high + 1])


      def binary_search(xs, target):
          low, high = 0, len(xs) - 1
          while low <= high:
              assert in_range(xs, target, low, high)
              mid = (low + high) // 2
              if xs[mid] == target:
                  return mid
              if xs[mid] < target:
                  low = mid + 1
              else:
                  high = mid - 1
          return -1
    explanation: |
      The binary search invariant is an implication (Lesson 6.1), true vacuously when the target is absent. When the loop ends without finding it, low > high, so the range xs[low:high + 1] is empty; the invariant then says "if the target were in xs it would be in an empty range", which forces it to be absent. That's the termination step of the correctness proof. The asserts are slow (they recompute sums and searches), so they're for checking during development, not for production code.

commonMistakes:
  - title: Proving by examples
    explanation: |
      Showing a claim for several values isn't a proof of "for all". A general proof works with an arbitrary value, such as "let n = 2k + 1".
  - title: Reusing a letter for different numbers
    explanation: |
      Writing both odd numbers as 2k + 1 silently assumes they're equal. Use different variables: 2j + 1 and 2k + 1.
  - title: Proving the converse by mistake
    explanation: |
      To prove P → Q, start from P. Starting from Q and reaching P proves Q → P, a different statement.
  - title: Assuming what you want to prove
    explanation: |
      Circular arguments use the conclusion as a step. In a proof by contradiction, you assume the *negation* of the claim, not the claim.
  - title: Forgetting a case
    explanation: |
      A proof by cases must cover every possibility (every integer is even or odd; every remainder mod 4 is 0, 1, 2 or 3). Missing one leaves a gap.

summary:
  - "A **proof** shows a statement must be true, using definitions, known facts and logic. Testing provides evidence; proof provides certainty."
  - "**Direct proof**: assume P, unwrap definitions, reach Q."
  - "**Contrapositive**: prove ¬Q → ¬P instead of P → Q."
  - "**Contradiction**: assume the statement is false and derive something impossible (√2 is irrational; there are infinitely many primes)."
  - "**Cases / exhaustion**: split into cases that cover everything; a finite check can prove facts about all integers when only remainders matter."
  - "**Construction** proves existence by exhibiting an example; one **counterexample** disproves a universal claim."
  - "**Loop invariants** (initialisation, maintenance, termination) prove algorithms correct."
next: |
  The loop invariant argument had a familiar shape: true at the start, and if true at one step then true at the next, so true at every step. That shape is a proof technique in its own right, **mathematical induction**, and it's the natural way to prove things about recursion. It's the subject of **Lesson 6.5**.

quiz:
  - type: mcq
    question: "Which is a correct start to a direct proof that the product of two odd numbers is odd?"
    options:
      - "Let a = 3 and b = 5"
      - "Let a = 2k + 1 and b = 2k + 1"
      - "Let a = 2j + 1 and b = 2k + 1 for integers j and k"
      - "Assume the product is even"
    answer: 2
    explanation: General values with different variables; the last option starts a proof by contradiction instead.
  - type: mcq
    question: "To prove \"if n² is odd then n is odd\" by contrapositive, what do you prove?"
    options: ["If n is odd then n² is odd", "If n is even then n² is even", "If n² is even then n is even", "n² is odd"]
    answer: 1
    explanation: The contrapositive of P → Q is ¬Q → ¬P.
  - type: mcq
    question: In a proof by contradiction of statement S, what do you assume?
    options: ["S", "Not S", "The converse of S", "Nothing"]
    answer: 1
    explanation: You assume S is false and derive an impossibility.
  - type: mcq
    question: "In Euclid's proof, N = 2·3·5·7·11·13 + 1 = 30031 = 59 × 509. Does this break the proof?"
    options:
      - Yes, because N should be prime
      - No, because the proof only needs N to have a prime factor not in the list
      - Yes, because 59 is in the list
      - No, because 30031 is prime
    answer: 1
    explanation: Neither 59 nor 509 is among 2 to 13, which is all the proof requires.
  - type: mcq
    question: "Why does checking n = 0, 1, 2, 3 prove a fact about n² mod 4 for every integer?"
    options:
      - Because small numbers are typical
      - Because n² mod 4 depends only on n mod 4, and every integer has remainder 0, 1, 2 or 3
      - It doesn't prove anything
      - Because 4 is even
    answer: 1
    explanation: The four checks cover every possible case, which makes it a proof by exhaustion.
  - type: mcq
    question: What are the three parts of a loop invariant argument?
    options:
      - Input, process, output
      - Initialisation, maintenance, termination
      - Base case, recursive case, return
      - Hypothesis, conclusion, contrapositive
    answer: 1
    explanation: "True before the loop, preserved by each iteration, and useful when the loop ends."
