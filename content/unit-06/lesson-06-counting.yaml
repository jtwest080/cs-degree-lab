id: u6-counting
title: Counting
minutes: 55
objective: |
  Count possibilities without listing them, using the **sum and product rules**, **permutations**, **combinations** and **binomial coefficients**, the **pigeonhole principle** and **inclusion-exclusion**, and check every count against brute-force enumeration with `itertools`.
outcomes:
  - Apply the sum rule and product rule, and count using complements
  - Count arrangements (permutations) and selections (combinations), with and without a size limit
  - Compute binomial coefficients and relate them to Pascal's triangle and the binomial theorem
  - Use the pigeonhole principle to prove that a collision must exist
  - Count unions of overlapping sets with inclusion-exclusion
  - Verify a counting formula by brute-force enumeration on small cases

sections:
  - heading: Why count?
    body: |
      How many passwords would an attacker have to try? How many steps can an algorithm take? How many test cases cover every combination of options? How likely is a collision in a hash table? All these questions are **counting** questions, and the answers are usually far too large to find by listing every possibility. **Combinatorics**, the mathematics of counting, gives formulas instead.

      You've already counted in this course: 2ⁿ bit patterns (Lesson 1.1), n² steps for nested loops (Lesson 2.7), 2ⁿ subsets and n! orderings for brute force (Lesson 4.8). This lesson organises those ideas into a toolkit. Throughout, a computer gives you a safety net: for small cases, `itertools` can generate every possibility, so you can check a formula before trusting it.

  - heading: The sum and product rules
    body: |
      Two rules underpin everything:

      - **Sum rule**: if a task can be done in one of m ways **or** one of n ways, with no overlap, there are **m + n** ways. A café with 4 cold drinks and 6 hot drinks offers 4 + 6 = 10 drinks.
      - **Product rule**: if a task is done in two **independent** steps, with m ways for the first and n for the second, there are **m × n** ways. A starter (4 choices) **and** a main (6 choices) give 4 × 6 = 24 meals.

      The product rule extends to many steps. A UK car number plate pattern of 2 letters, 2 digits, then 3 letters gives 26 × 26 × 10 × 10 × 26 × 26 × 26 = 1,188,137,600 plates. A password of 8 characters from 62 letters and digits gives 62⁸ ≈ 2.2 × 10¹⁴: at a billion guesses per second, that's under three days to try them all, which is why security advice favours longer passwords (Unit 16).

      Often the easiest way to count something is to count its **complement** and subtract. How many 8-character passwords contain **at least one** digit? Counting directly means handling "exactly one digit, exactly two, ...". Instead: all passwords minus those with **no** digits = 62⁸ − 52⁸.

  - heading: Permutations
    body: |
      A **permutation** is an **ordered arrangement**. How many ways can n different items be arranged in a row? The first position has n choices, the second n − 1 (one item is used), and so on down to 1. By the product rule:

      n! = n × (n − 1) × ... × 2 × 1   ("n factorial", with 0! = 1)

      Arranging 5 books on a shelf: 5! = 120 ways. 52 playing cards: 52! ≈ 8 × 10⁶⁷, more than the number of atoms in the Earth, so every well-shuffled deck is almost certainly an order that has never existed before.

      If you only fill **k** of the positions (a podium of 3 from 10 runners), there are n × (n − 1) × ... × (n − k + 1) ways, the first k factors of n!. This is written P(n, k), and equals n! / (n − k)!. Podiums from 10 runners: 10 × 9 × 8 = 720.

      `itertools.permutations(items, k)` generates them all (Lesson 4.8), and Python's `math.perm(n, k)` computes the count.

  - heading: Combinations
    body: |
      A **combination** is a **selection where order doesn't matter**. Choosing 3 people from 10 for a committee: the 720 ordered podiums count each committee 3! = 6 times (once for each order of the same three people). So there are 720 / 6 = 120 committees.

      In general, the number of ways to choose k items from n is the **binomial coefficient**:

      C(n, k) = n! / (k! (n − k)!)   (read "n choose k", also written as n over k in brackets)

      Some values to know: C(n, 0) = C(n, n) = 1 (one way to choose nothing, or everything); C(n, 1) = n; C(n, 2) = n(n − 1)/2, the number of **pairs**, which is why comparing every pair of n items takes about n²/2 steps (Lesson 4.2). And C(n, k) = C(n, n − k): choosing k to include is the same as choosing n − k to leave out.

      Combinations count subsets of a given size, so adding them up over all sizes counts all subsets: C(n, 0) + C(n, 1) + ... + C(n, n) = 2ⁿ (Lesson 6.3). The UK National Lottery chooses 6 numbers from 59: C(59, 6) = 45,057,474 possible tickets.

      > **Key idea:** Ask two questions. **Does order matter?** (permutation or combination) **Can items repeat?** (with or without repetition). With repetition and order mattering, it's just nᵏ, as with passwords.

  - heading: Pascal's triangle and the binomial theorem
    body: |
      Arrange the binomial coefficients in rows, with row n holding C(n, 0), ..., C(n, n):

      ```text
      row 0:           1
      row 1:         1   1
      row 2:       1   2   1
      row 3:     1   3   3   1
      row 4:   1   4   6   4   1
      ```

      Each number is the **sum of the two above it**: C(n, k) = C(n − 1, k − 1) + C(n − 1, k). Why? Pick any particular item. A k-selection from n items either **includes** it (then choose the other k − 1 from the remaining n − 1) or **excludes** it (choose all k from the remaining n − 1). That's a combinatorial proof, and it's also a recursive algorithm, like the subsets recursion of Lesson 4.6.

      The coefficients get their name from the **binomial theorem**: (x + y)ⁿ = Σ C(n, k) xᵏ yⁿ⁻ᵏ. For example (x + y)³ = x³ + 3x²y + 3xy² + y³, with coefficients 1, 3, 3, 1 from row 3. Setting x = y = 1 gives 2ⁿ = sum of row n, the subset count again.

  - heading: The pigeonhole principle
    body: |
      If you put **more than n** pigeons into **n** holes, some hole gets at least two pigeons. Obvious, yet surprisingly powerful, because it proves something **must exist** without saying where:

      - Among 13 people, two share a birth month.
      - A hash function mapping millions of strings to a few thousand buckets **must** have collisions (Unit 7). No clever hash function can avoid it.
      - A lossless compression program can't shrink **every** file: there are 2ⁿ files of n bits but only 2ⁿ − 1 files shorter than n bits, so two files would have to compress to the same output.
      - Among any m + 1 integers, two have the same remainder when divided by m, so their difference is divisible by m.

      The **generalised** version: if N items go into n boxes, some box holds at least ⌈N/n⌉ items (N/n rounded up). With 100 students and 7 days, some day has at least 15 birthdays.

      The pigeonhole principle is closely linked to functions (Lesson 6.3): it says a function from a larger finite set to a smaller one can't be injective.

  - heading: Inclusion-exclusion
    body: |
      The sum rule needs the options **not to overlap**. When they do, adding counts the overlap twice. For two sets:

      |A ∪ B| = |A| + |B| − |A ∩ B|

      How many numbers from 1 to 100 are divisible by 2 or by 3? There are 50 multiples of 2 and 33 of 3, but the 16 multiples of 6 were counted twice: 50 + 33 − 16 = 67.

      For three sets, add the singles, subtract the pairs, add back the triple:

      |A ∪ B ∪ C| = |A| + |B| + |C| − |A ∩ B| − |A ∩ C| − |B ∩ C| + |A ∩ B ∩ C|

      In general, **inclusion-exclusion** adds the sizes of the intersections of every odd number of sets and subtracts those of every even number. It's a perfect job for code: loop over every non-empty subset of the sets (Lesson 6.3), and add or subtract according to the subset's size.

examples:
  - title: Formulas versus brute force
    intro: Every formula checked against itertools on a small case.
    code: |
      from itertools import permutations, combinations, product
      from math import factorial, comb, perm

      items = "ABCDE"
      print("arrangements:", len(list(permutations(items))), factorial(5))
      print("podiums of 3:", len(list(permutations(items, 3))), perm(5, 3))
      print("committees of 3:", len(list(combinations(items, 3))), comb(5, 3))
      print("3-letter strings:", len(list(product(items, repeat=3))), 5 ** 3)
      print("all subsets:", sum(comb(5, k) for k in range(6)), 2 ** 5)
      print("lottery:", comb(59, 6))
    output: |
      arrangements: 120 120
      podiums of 3: 60 60
      committees of 3: 10 10
      3-letter strings: 125 125
      all subsets: 32 32
      lottery: 45057474
    lines:
      - line: 5
        note: "Arrangements of all 5: 5! = 120."
      - line: 6-7
        note: "Order matters for podiums, P(5, 3) = 60; it doesn't for committees, C(5, 3) = 60 / 3! = 10."
      - line: 8
        note: "Repetition allowed and order matters: 5³."
      - line: 9
        note: "Summing a row of Pascal's triangle gives 2ⁿ."
      - line: 10
        note: "Formulas handle cases far too big to enumerate."
  - title: Pascal's triangle by addition
    intro: Each entry is the sum of the two above it.
    code: |
      def pascal(rows):
          row = [1]
          triangle = [row]
          for _ in range(rows - 1):
              row = [1] + [row[i] + row[i + 1] for i in range(len(row) - 1)] + [1]
              triangle.append(row)
          return triangle

      for r in pascal(7):
          print(" ".join(f"{x:2}" for x in r).center(30))
      print(sum(pascal(11)[10]), 2 ** 10)
    output: |2
                     1
                   1  1
                  1  2  1
                1  3  3  1
               1  4  6  4  1
             1  5 10 10  5  1
            1  6 15 20 15  6  1
      1024 1024
    lines:
      - line: 5
        note: "Each new row: 1, then the sums of neighbouring pairs from the row above, then 1. This is C(n, k) = C(n − 1, k − 1) + C(n − 1, k)."
      - line: 9-10
        note: "`center(30)` pads the text to centre it, giving the triangle shape."
      - line: 11
        note: "Row 10 sums to 2¹⁰."
  - title: Inclusion-exclusion
    intro: Counting numbers divisible by 2, 3 or 5, two ways.
    code: |
      from itertools import combinations
      from math import lcm

      N = 1000
      divisors = [2, 3, 5]
      brute = sum(1 for n in range(1, N + 1) if any(n % d == 0 for d in divisors))

      total = 0
      for size in range(1, len(divisors) + 1):
          for group in combinations(divisors, size):
              count = N // lcm(*group)
              total += count if size % 2 == 1 else -count
      print(brute, total)
    output: |
      734 734
    lines:
      - line: 6
        note: "Brute force: test all 1,000 numbers."
      - line: 9-10
        note: "Every non-empty group of the divisors: singles, pairs and the triple."
      - line: 11
        note: "Numbers up to N divisible by every number in the group are the multiples of their least common multiple (`math.lcm`)."
      - line: 12
        note: "Add for odd-sized groups, subtract for even-sized: inclusion-exclusion. This takes 7 steps, whatever N is."

playground:
  prompt: |
    The **birthday problem**: in a room of n people, how likely is it that two share a birthday? Count the ways everyone could have *different* birthdays (a permutation!), divide by 365ⁿ, and subtract from 1. At what n does the chance pass 50%? The answer surprises most people. (You'll meet probability properly in the next lesson.)
  code: |
    from math import perm

    for n in [5, 10, 20, 23, 30, 50, 70]:
        all_different = perm(365, n) / 365 ** n
        print(n, round(1 - all_different, 3))

exercises:
  - id: counting-functions
    title: Factorials, permutations, combinations
    difficulty: 1
    prompt: |
      Write these **without** using the `math` module:

      - `factorial(n)`: n!, with 0! = 1.
      - `perm(n, k)`: the number of ordered arrangements of k items chosen from n: n × (n − 1) × ... (k factors). Return 0 if k > n.
      - `comb(n, k)`: n choose k. Return 0 if k > n. Make it efficient by using `perm(n, k) // factorial(k)`.
    starter: |
      def factorial(n):
          pass


      def perm(n, k):
          pass


      def comb(n, k):
          pass
    tests:
      - name: factorial
        code: |
          assert [factorial(n) for n in range(7)] == [1, 1, 2, 6, 24, 120, 720]
      - name: perm and comb
        code: |
          assert perm(10, 3) == 720 and perm(5, 0) == 1 and perm(3, 5) == 0
          assert comb(10, 3) == 120 and comb(5, 0) == 1 and comb(5, 5) == 1 and comb(3, 5) == 0
          assert comb(59, 6) == 45057474
      - name: matches brute force
        code: |
          from itertools import permutations, combinations
          for n in range(7):
              for k in range(n + 1):
                  assert perm(n, k) == len(list(permutations(range(n), k)))
                  assert comb(n, k) == len(list(combinations(range(n), k)))
      - name: no math module
        code: |
          assert "import math" not in source and "from math" not in source, "Write these without the math module"
    hints:
      - "`perm`: start with 1 and multiply by n, n − 1, ..., n − k + 1: `for i in range(k): result *= n - i`."
      - "`comb(n, k)`: if k > n return 0, else `perm(n, k) // factorial(k)`."
    solution: |
      def factorial(n):
          result = 1
          for i in range(2, n + 1):
              result *= i
          return result


      def perm(n, k):
          if k > n:
              return 0
          result = 1
          for i in range(k):
              result *= n - i
          return result


      def comb(n, k):
          if k > n:
              return 0
          return perm(n, k) // factorial(k)
    explanation: |
      `comb` divides out the k! orderings of each selection, exactly the committee-from-podium argument. Computing `perm(n, k)` rather than `n!` keeps the numbers smaller: C(1000, 2) needs only two multiplications rather than computing 1000!.

  - id: password-count
    title: How many passwords?
    difficulty: 1
    prompt: |
      Passwords use an alphabet of `letters` letters and `digits` digits. Write:

      - `count_length(n, letters, digits)`: the number of passwords of exactly length `n`.
      - `count_range(lo, hi, letters, digits)`: the number with length from `lo` to `hi` inclusive (sum rule).
      - `count_with_digit(n, letters, digits)`: the number of length-`n` passwords containing **at least one** digit (count the complement).
      - `years_to_crack(n, letters, digits, guesses_per_second)`: the time in years to try every length-`n` password, using 365 × 24 × 3600 seconds per year, rounded to 2 decimal places.
    starter: |
      def count_length(n, letters, digits):
          pass


      def count_range(lo, hi, letters, digits):
          pass


      def count_with_digit(n, letters, digits):
          pass


      def years_to_crack(n, letters, digits, guesses_per_second):
          pass
    tests:
      - name: counts
        code: |
          assert count_length(8, 52, 10) == 62 ** 8
          assert count_range(1, 3, 2, 1) == 3 + 9 + 27
          assert count_with_digit(8, 52, 10) == 62 ** 8 - 52 ** 8
      - name: complement matches brute force
        code: |
          from itertools import product
          alphabet = "abX1"
          for n in range(1, 6):
              brute = sum(1 for p in product(alphabet, repeat=n) if any(c.isdigit() for c in p))
              assert count_with_digit(n, 3, 1) == brute, f"length {n}"
      - name: years_to_crack
        code: |
          assert years_to_crack(8, 52, 10, 10 ** 9) == 0.01
          assert years_to_crack(12, 52, 10, 10 ** 9) == 102304.25, f"Got {years_to_crack(12, 52, 10, 10 ** 9)}"
    hints:
      - "Each of the n positions has `letters + digits` choices: product rule."
      - "Passwords with no digit use only letters: `letters ** n`. Subtract from the total."
    solution: |
      def count_length(n, letters, digits):
          return (letters + digits) ** n


      def count_range(lo, hi, letters, digits):
          return sum(count_length(n, letters, digits) for n in range(lo, hi + 1))


      def count_with_digit(n, letters, digits):
          return count_length(n, letters, digits) - letters ** n


      def years_to_crack(n, letters, digits, guesses_per_second):
          seconds = count_length(n, letters, digits) / guesses_per_second
          return round(seconds / (365 * 24 * 3600), 2)
    explanation: |
      Going from 8 to 12 characters multiplies the search by 62⁴ ≈ 15 million: from a few days to a hundred thousand years at a billion guesses a second. Length beats complexity, because it's in the exponent. The complement trick turns "at least one" (awkward) into "none" (easy), a pattern worth remembering.

  - id: pascal-identities
    title: Pascal's triangle
    difficulty: 2
    prompt: |
      Write:

      - `pascal_row(n)`: row n of Pascal's triangle (a list of n + 1 numbers), built **by addition** from the previous row, starting from `[1]`. Don't use factorials.
      - `binomial_expand(n)`: the expansion of (x + y)ⁿ as a string of terms `"c*x^a*y^b"` joined by `" + "`, from xⁿ down to yⁿ. Leave out coefficients of 1, write `x` for x¹, and leave out x⁰ and y⁰ entirely, so `binomial_expand(2)` is `"x^2 + 2*x*y + y^2"`.
    starter: |
      def pascal_row(n):
          pass


      def binomial_expand(n):
          pass
    tests:
      - name: pascal_row
        code: |
          assert pascal_row(0) == [1] and pascal_row(1) == [1, 1] and pascal_row(4) == [1, 4, 6, 4, 1]
          from math import comb
          assert pascal_row(30) == [comb(30, k) for k in range(31)]
          assert all(sum(pascal_row(n)) == 2 ** n for n in range(20))
      - name: binomial_expand
        code: |
          assert binomial_expand(1) == "x + y"
          assert binomial_expand(2) == "x^2 + 2*x*y + y^2", f"Got {binomial_expand(2)!r}"
          assert binomial_expand(3) == "x^3 + 3*x^2*y + 3*x*y^2 + y^3", f"Got {binomial_expand(3)!r}"
          assert binomial_expand(0) == "1"
      - name: no factorials
        code: |
          assert "factorial" not in source and "comb(" not in source, "Build the rows by addition"
    hints:
      - "Start with `row = [1]`, and n times: `row = [1] + [row[i] + row[i + 1] for i in range(len(row) - 1)] + [1]`."
      - "For term k (k from 0 to n), the x power is n − k and the y power is k. Build a list of factors (the coefficient if not 1, the x part, the y part) and join it with `*`."
      - "A power of 1 is written as just the letter; a power of 0 is left out. If all parts are left out (n = 0), the term is `\"1\"`."
    solution: |
      def pascal_row(n):
          row = [1]
          for _ in range(n):
              row = [1] + [row[i] + row[i + 1] for i in range(len(row) - 1)] + [1]
          return row


      def power(var, p):
          if p == 0:
              return None
          if p == 1:
              return var
          return f"{var}^{p}"


      def binomial_expand(n):
          terms = []
          for k, c in enumerate(pascal_row(n)):
              parts = [str(c) if c != 1 else None, power("x", n - k), power("y", k)]
              parts = [p for p in parts if p is not None]
              terms.append("*".join(parts) if parts else "1")
          return " + ".join(terms)
    explanation: |
      Building rows by addition avoids huge factorials and mirrors the combinatorial argument: each entry counts selections that include or exclude one particular item. The coefficient of xⁿ⁻ᵏyᵏ is C(n, k) because expanding (x + y)ⁿ means choosing x or y from each of the n brackets, and C(n, k) ways choose y from exactly k of them.

  - id: pigeonhole
    title: The pigeonhole principle
    difficulty: 2
    prompt: |
      Write:

      - `guaranteed(n_items, n_boxes)`: the minimum number of items the fullest box is **guaranteed** to have, ⌈n_items / n_boxes⌉. Use integer arithmetic (no floats).
      - `same_remainder(nums, m)`: given a list of **more than** m integers, return a pair `(a, b)` of two numbers from the list (in the order they appear) with the same remainder mod m, so `a - b` is divisible by m. Find the **first** such pair to complete, in one pass, using a dictionary.
      - `subset_with_sum_divisible(nums)`: given a list of n positive integers, return a non-empty run `nums[i:j]` of **consecutive** items whose sum is divisible by n. (Hint: the n + 1 prefix sums 0, nums[0], nums[0] + nums[1], ... can only have n different remainders mod n, so two match.)
    starter: |
      def guaranteed(n_items, n_boxes):
          pass


      def same_remainder(nums, m):
          pass


      def subset_with_sum_divisible(nums):
          pass
    tests:
      - name: guaranteed
        code: |
          assert guaranteed(13, 12) == 2 and guaranteed(100, 7) == 15 and guaranteed(12, 12) == 1 and guaranteed(0, 5) == 0
      - name: same_remainder
        code: |
          assert same_remainder([3, 8, 11, 6], 3) == (8, 11)
          a, b = same_remainder([10, 21, 33, 47, 52, 68], 5)
          assert (a - b) % 5 == 0 and (a, b) == (47, 52)
          import random
          random.seed(1)
          for _ in range(200):
              m = random.randint(1, 20)
              nums = [random.randint(-1000, 1000) for _ in range(m + 1)]
              a, b = same_remainder(nums, m)
              assert (a - b) % m == 0
      - name: subset_with_sum_divisible
        code: |
          import random
          random.seed(2)
          for _ in range(300):
              n = random.randint(1, 30)
              nums = [random.randint(1, 10 ** 6) for _ in range(n)]
              run = subset_with_sum_divisible(nums)
              assert run and sum(run) % n == 0, f"{run} from {nums}"
              s = "".join(f"<{x}>" for x in nums)
              assert "".join(f"<{x}>" for x in run) in s, "Return consecutive items"
    hints:
      - "Ceiling with integers: `(n_items + n_boxes - 1) // n_boxes`."
      - "`same_remainder`: keep `seen = {}` mapping remainder to the earlier number; for each number, if its remainder is already in `seen`, return `(seen[r], number)`."
      - "`subset_with_sum_divisible`: track `first = {0: 0}` (remainder of the prefix sum → index). Walk through with a running total; when a remainder repeats at index j, return `nums[first[r]:j]`."
    solution: |
      def guaranteed(n_items, n_boxes):
          return (n_items + n_boxes - 1) // n_boxes


      def same_remainder(nums, m):
          seen = {}
          for x in nums:
              r = x % m
              if r in seen:
                  return (seen[r], x)
              seen[r] = x
          return None


      def subset_with_sum_divisible(nums):
          n = len(nums)
          first = {0: 0}
          total = 0
          for j, x in enumerate(nums, start=1):
              total += x
              r = total % n
              if r in first:
                  return nums[first[r]:j]
              first[r] = j
          return None
    explanation: |
      Both searches are guaranteed to succeed, and the pigeonhole principle is the proof: m + 1 numbers in m remainder classes must collide, and n + 1 prefix sums in n remainder classes must collide. If prefix sums up to i and up to j have the same remainder, the items between them sum to a multiple of n. The proof doesn't say *which* pair collides, but the code finds one in a single pass.

  - id: inclusion-exclusion
    title: Inclusion-exclusion
    difficulty: 3
    prompt: |
      Write:

      - `count_divisible_brute(N, divisors)`: how many n in 1..N are divisible by **at least one** number in `divisors`, by checking each n.
      - `count_divisible(N, divisors)`: the same, by **inclusion-exclusion** over every non-empty group of divisors, using the least common multiple. Write your own `lcm(a, b)` using `gcd` (provided). It must handle N = 10¹⁸ instantly.
      - `count_coprime(N, primes)`: how many n in 1..N are divisible by **none** of the given primes.
    starter: |
      from itertools import combinations


      def gcd(a, b):
          while b:
              a, b = b, a % b
          return a


      def lcm(a, b):
          pass


      def count_divisible_brute(N, divisors):
          pass


      def count_divisible(N, divisors):
          pass


      def count_coprime(N, primes):
          pass
    tests:
      - name: lcm
        code: |
          assert lcm(4, 6) == 12 and lcm(3, 5) == 15 and lcm(7, 7) == 7
      - name: matches brute force
        code: |
          for N in [1, 10, 100, 997, 2000]:
              for ds in [[2], [2, 3], [2, 3, 5], [4, 6], [6, 10, 15], [7, 11, 13, 17]]:
                  assert count_divisible(N, ds) == count_divisible_brute(N, ds), f"N={N}, divisors={ds}"
          assert count_divisible(100, [2, 3]) == 67
      - name: huge N and coprime
        code: |
          assert count_divisible(10 ** 18, [2, 3, 5]) == 733333333333333334
          assert count_coprime(30, [2, 3, 5]) == 8, "1, 7, 11, 13, 17, 19, 23, 29"
          assert count_coprime(10 ** 12, [2, 3, 5, 7]) == 228571428571
    hints:
      - "`lcm(a, b) = a * b // gcd(a, b)`. For a group, combine them one at a time."
      - "For each `size` from 1 to `len(divisors)`, and each `group` in `combinations(divisors, size)`, add `N // lcm_of_group` if `size` is odd and subtract it if even."
      - "`count_coprime` is a complement: `N - count_divisible(N, primes)`."
    solution: |
      from itertools import combinations


      def gcd(a, b):
          while b:
              a, b = b, a % b
          return a


      def lcm(a, b):
          return a * b // gcd(a, b)


      def count_divisible_brute(N, divisors):
          return sum(1 for n in range(1, N + 1) if any(n % d == 0 for d in divisors))


      def count_divisible(N, divisors):
          total = 0
          for size in range(1, len(divisors) + 1):
              for group in combinations(divisors, size):
                  m = 1
                  for d in group:
                      m = lcm(m, d)
                  count = N // m
                  total += count if size % 2 == 1 else -count
          return total


      def count_coprime(N, primes):
          return N - count_divisible(N, primes)
    explanation: |
      Brute force is O(N); inclusion-exclusion is O(2ᵏ) for k divisors, independent of N, so 10¹⁸ is no harder than 100. Using the lcm (not the product) matters for divisors that share factors: numbers divisible by both 4 and 6 are the multiples of 12, not 24. `count_coprime` with primes counts numbers sharing no factor with their product, which is Euler's totient function, a key ingredient of RSA encryption in Lesson 6.8 and Unit 16.

commonMistakes:
  - title: Using permutations when order doesn't matter
    explanation: |
      A committee or a lottery ticket is a combination; a podium or a password is a sequence. Ask "would a different order count as different?"
  - title: Adding overlapping cases
    explanation: |
      The sum rule needs disjoint options. If they overlap, subtract the overlap (inclusion-exclusion), or you count some things twice.
  - title: Counting "at least one" directly
    explanation: |
      It's usually much easier to count the complement ("none") and subtract from the total.
  - title: Forgetting that 0! = 1
    explanation: |
      There's exactly one way to arrange nothing. This makes formulas like C(n, n) = n! / (n! 0!) = 1 work.
  - title: Expecting the pigeonhole principle to say which pigeons collide
    explanation: |
      It guarantees a collision exists, not where. Finding it is a separate (often easy) algorithmic task.

summary:
  - "**Sum rule**: disjoint options add. **Product rule**: independent steps multiply. Count complements when \"at least one\" is involved."
  - "**Permutations**: n! arrangements of n items; P(n, k) = n!/(n − k)! for k positions."
  - "**Combinations**: C(n, k) = n!/(k!(n − k)!) selections where order doesn't matter; C(n, 2) is the number of pairs."
  - "**Pascal's triangle**: C(n, k) = C(n − 1, k − 1) + C(n − 1, k); row n sums to 2ⁿ and gives the coefficients of (x + y)ⁿ."
  - "**Pigeonhole principle**: more than n items in n boxes forces a shared box; generally some box has ⌈N/n⌉."
  - "**Inclusion-exclusion**: |A ∪ B| = |A| + |B| − |A ∩ B|, extended by alternately adding and subtracting intersections."
next: |
  Counting possibilities is the first step towards measuring **how likely** something is. **Lesson 6.7** introduces **probability**: sample spaces, events, conditional probability, independence, expected value, and simulation with Python's `random` module, the mathematics behind games, randomised algorithms and machine learning.

quiz:
  - type: mcq
    question: "A menu has 3 starters, 5 mains and 2 desserts. How many three-course meals are possible?"
    options: ["10", "30", "15", "60"]
    answer: 1
    explanation: "Product rule: 3 × 5 × 2 = 30."
  - type: mcq
    question: How many ways can 4 runners finish first, second and third out of 10?
    options: ["C(10, 3) = 120", "P(10, 3) = 720", "10³ = 1000", "3! = 6"]
    answer: 1
    explanation: Order matters and no runner repeats, so it's a permutation.
  - type: mcq
    question: How many different 5-card hands can be dealt from a 52-card deck (order doesn't matter)?
    options: ["52⁵", "P(52, 5)", "C(52, 5)", "5!"]
    answer: 2
    explanation: "A hand is a selection, so it's C(52, 5) = 2,598,960."
  - type: mcq
    question: "What is the sum of row 6 of Pascal's triangle (1, 6, 15, 20, 15, 6, 1)?"
    options: ["36", "64", "720", "128"]
    answer: 1
    explanation: Row n sums to 2ⁿ, the total number of subsets.
  - type: mcq
    question: "A hash table has 1,000 buckets and stores 1,001 keys. What can you conclude?"
    options:
      - Nothing
      - At least one bucket holds two or more keys
      - Every bucket holds exactly one key
      - The hash function is broken
    answer: 1
    explanation: The pigeonhole principle forces a collision.
  - type: mcq
    question: "How many numbers from 1 to 30 are divisible by 2 or 5?"
    options: ["21", "18", "15", "3"]
    answer: 1
    explanation: "15 + 6 − 3 = 18 (subtract the multiples of 10)."
