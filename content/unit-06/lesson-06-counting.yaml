    question: |
      On a grid, a path from the bottom-left corner to a point `right` steps across and `up` steps up, moving only right or up, is a sequence of `right + up` moves of which `up` are "up". Write `grid_paths(right, up)` returning the number of such paths, using `math.comb`.
    starter: |
      from math import comb


      def grid_paths(right, up):
          pass
    tests:
      - name: grid_paths works
        code: |
          assert grid_paths(2, 2) == 6 and grid_paths(1, 0) == 1 and grid_paths(0, 0) == 1
          assert grid_paths(10, 10) == 184756
    solution: |
      from math import comb


      def grid_paths(right, up):
          return comb(right + up, up)
