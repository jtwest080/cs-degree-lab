    question: |
      Each of `n` independent components fails with probability `p`. Write `p_any_fails(p, n)` returning the probability that **at least one** fails, using the complement.
    starter: |
      def p_any_fails(p, n):
          pass
    tests:
      - name: p_any_fails works
        code: |
          assert p_any_fails(0.5, 1) == 0.5 and p_any_fails(0.1, 0) == 0
          assert abs(p_any_fails(0.01, 20) - 0.1821) < 0.0001
          from fractions import Fraction
          assert p_any_fails(Fraction(1, 6), 4) == 1 - Fraction(5, 6) ** 4
    solution: |
      def p_any_fails(p, n):
          return 1 - (1 - p) ** n
