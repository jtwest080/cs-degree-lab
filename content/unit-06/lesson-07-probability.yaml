quiz:
  - type: mcq
    question: What is the probability of rolling a total of 2 with two fair dice?
    options: ["1/11", "1/12", "1/36", "1/6"]
    answer: 2
    explanation: "Only (1, 1) of the 36 equally likely outcomes. The totals 2 to 12 are not equally likely."
  - type: mcq
    question: "A fair coin has landed heads 9 times in a row. What's the probability the next flip is heads?"
    options: ["1/1024", "1/2", "Less than 1/2, tails is due", "More than 1/2, it's on a streak"]
    answer: 1
    explanation: Independent flips have no memory; believing otherwise is the gambler's fallacy.
  - type: mcq
    question: "If P(A) = 0.5, P(B) = 0.4 and P(A and B) = 0.2, what is P(A | B)?"
    options: ["0.2", "0.4", "0.5", "0.8"]
    answer: 2
    explanation: "P(A and B) / P(B) = 0.2 / 0.4 = 0.5. Since that equals P(A), A and B are independent."
  - type: mcq
    question: "A rare condition affects 1 in 1,000 people. A test is 99% accurate for both ill and healthy people. Roughly what is the chance someone who tests positive is ill?"
    options: ["99%", "About 50%", "About 9%", "0.1%"]
    answer: 2
    explanation: "Per 100,000 people: 99 true positives, but 999 false positives from the healthy majority. 99 / 1098 ≈ 9%. The base rate dominates."
  - type: mcq
    question: What is the expected total of three fair dice?
    options: ["9", "10.5", "18", "12"]
    answer: 1
    explanation: "Expectations add: 3 × 3.5 = 10.5."
  - type: mcq
    question: "Why call `random.seed(42)` at the start of a simulation?"
    options:
      - To make the numbers more random
      - To make the run repeatable, so results can be tested and debugged
      - To make the simulation faster
      - To limit the numbers to 42 or less
    answer: 1
    explanation: The same seed produces the same sequence of pseudo-random numbers every time.
