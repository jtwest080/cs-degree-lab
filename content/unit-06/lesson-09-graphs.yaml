id: u6-graphs
title: Graphs
minutes: 60
objective: |
  Model connections with **graphs**: use the vocabulary of vertices, edges, degree, paths, cycles, connectivity and trees, prove and use the **handshake lemma**, store graphs as **adjacency lists** and **adjacency matrices**, and find everything **reachable** from a vertex.
outcomes:
  - Describe a situation as a graph, choosing undirected or directed edges
  - Compute degrees and use the handshake lemma to check and reason about graphs
  - Store a graph as an adjacency list or an adjacency matrix, and explain the trade-offs
  - Recognise walks, paths and cycles, and count walks with matrix multiplication
  - Find the vertices reachable from a start vertex, and split a graph into connected components
  - Recognise trees, and decide whether a graph has an Euler path or circuit

sections:
  - heading: Everything is a graph
    body: |
      In 1736 the people of Königsberg had a puzzle. Their city had seven bridges joining two river banks and two islands. Could you walk through the city crossing every bridge exactly once? Leonhard Euler realised the shapes and distances didn't matter, only **which land masses were joined by which bridges**. He drew each land mass as a dot and each bridge as a line, and invented graph theory.

      A **graph** G = (V, E) is a set V of **vertices** (also called nodes) and a set E of **edges**, each joining a pair of vertices. Graphs model anything made of things and connections:

      | Situation | Vertices | Edges |
      |---|---|---|
      | Social network | people | friendships |
      | Road map | junctions | roads |
      | The web | pages | links |
      | Course plan | modules | prerequisites |
      | Computer network | machines | cables |

      Once a problem is a graph, decades of graph algorithms apply to it. That's why graphs may be the most useful idea in this whole unit. Units 7 and 8 build their main algorithms on the foundations here.

  - heading: The vocabulary
    body: |
      - In an **undirected** graph, an edge {u, v} goes both ways, like a friendship. In a **directed** graph (a **digraph**), an edge (u, v) goes one way, like a web link or a prerequisite (Lesson 6.3's relations are digraphs).
      - Two vertices joined by an edge are **adjacent**, or **neighbours**.
      - In a **weighted** graph, each edge carries a number such as a distance or cost (Unit 8).
      - A **simple** graph has no **loops** (edges from a vertex to itself) and at most one edge between any pair. We'll use simple graphs unless we say otherwise.
      - The **degree** of a vertex is its number of edges. In a digraph, the **in-degree** counts edges arriving and the **out-degree** counts edges leaving.
      - A graph where every pair of vertices is joined is **complete**. The complete graph on n vertices has C(n, 2) = n(n − 1)/2 edges (Lesson 6.6). The **density** of a graph is the fraction of those possible edges actually present.

  - heading: The handshake lemma
    body: |
      At a party, everyone counts how many hands they shook, and you add up the counts. The total is always **even**. Why? Each handshake involves two people, so it's counted exactly twice. In graph terms:

      **Handshake lemma**: the sum of the degrees of all vertices = 2 × (number of edges).

      This simple fact has consequences:

      - You can count edges from degrees: a graph with degrees 3, 3, 2, 2, 2 has (3 + 3 + 2 + 2 + 2) / 2 = 6 edges.
      - The number of vertices with **odd degree** is always even. (The odd degrees must add to an even number, since the total is even.) So no group of 7 people can each have exactly 3 friends among themselves: 7 × 3 = 21 is odd.
      - It's an excellent **sanity check** for graph code. If your degrees don't sum to twice your edge count, there's a bug.

      For a digraph, the sum of in-degrees and the sum of out-degrees both equal the number of edges.

  - heading: Storing a graph
    body: |
      There are two standard representations. Label the vertices and take the graph with edges A–B, A–C, B–C, C–D.

      An **adjacency list** maps each vertex to the set of its neighbours. In Python, a dictionary of sets:

      ```python
      graph = {"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B", "D"}, "D": {"C"}}
      ```

      An **adjacency matrix** is an n × n grid of 0s and 1s, with a 1 in row i, column j when vertices i and j are adjacent (a list of lists, Lesson 3.4):

      ```text
           A  B  C  D
        A  0  1  1  0
        B  1  0  1  0
        C  1  1  0  1
        D  0  0  1  0
      ```

      For an undirected graph the matrix is **symmetric**: entry (i, j) equals entry (j, i).

      | | Adjacency list | Adjacency matrix |
      |---|---|---|
      | Memory | O(V + E) | O(V²) |
      | Is u adjacent to v? | O(1) with sets | O(1) |
      | List v's neighbours | O(degree of v) | O(V) |

      Most real graphs are **sparse**: a social network with a billion people where each has a few hundred friends. A matrix would need 10¹⁸ entries, mostly zeros, while an adjacency list needs space for only the actual edges. So adjacency lists are the usual choice; matrices suit small or **dense** graphs, and have neat mathematical properties, as you'll see.

  - heading: Walks, paths and cycles
    body: |
      - A **walk** is a sequence of vertices where each consecutive pair is joined by an edge: A, B, C, A, B is a walk.
      - A **path** is a walk with no repeated vertices: A, B, C, D. Its **length** is its number of edges, here 3.
      - A **cycle** is a walk of length at least 3 that returns to its start, with no other repeated vertices: A, B, C, A.
      - The **distance** between two vertices is the length of a shortest path between them. Finding shortest paths efficiently is breadth-first search (Unit 7) and Dijkstra's algorithm (Unit 8).

      Here's a lovely link between graphs and the nested lists of Unit 3. Square the adjacency matrix M with matrix multiplication: entry (i, j) of M² counts the walks of length 2 from i to j, because each one goes i → k → j through some middle vertex k, and the sum Σₖ M[i][k] × M[k][j] counts exactly those. In general, Mᵏ counts walks of length k, which can be proved by induction on k (Lesson 6.5).

  - heading: Connectivity and reachability
    body: |
      Vertex v is **reachable** from u if there's a path from u to v. An undirected graph is **connected** if every vertex can reach every other. If not, it falls into separate pieces called **connected components**: in a social network, groups with no friendship links between them.

      To find everything reachable from a start vertex, keep a set of **visited** vertices and a **to-do** list:

      1. Put the start vertex in both.
      2. While the to-do list isn't empty, take a vertex out, and for each neighbour not yet visited, mark it visited and add it to the to-do list.
      3. When the to-do list is empty, the visited set is everything reachable.

      Each vertex enters the to-do list at most once and each edge is examined at most twice, so this takes O(V + E) time. If the to-do list is a **stack** (take from the end with `pop()`), this is **depth-first search**; if it's a **queue** (take from the front), it's **breadth-first search**. Units 7 and 8 study both in depth; for now, either finds the same set. Running the search again from each unvisited vertex finds every connected component.

  - heading: Trees and Euler's bridges
    body: |
      A **tree** is a connected graph with no cycles. Trees appear all over computing: file systems, the Python syntax trees you've used with `ast`, family trees, and the search trees of Unit 7. Trees have a remarkable property:

      **A tree with n vertices has exactly n − 1 edges.**

      Proof by induction (Lesson 6.5): a tree with at least 2 vertices has a **leaf** (a vertex of degree 1; follow a longest path, and its end can't have another neighbour without making a longer path or a cycle). Removing the leaf and its edge leaves a tree with n − 1 vertices, which by the inductive hypothesis has n − 2 edges. So the original had n − 1. In fact, a graph with n vertices is a tree exactly when it's connected and has n − 1 edges. Add any edge to a tree and you create a cycle; remove any edge and it disconnects.

      Back to Königsberg. An **Euler path** uses every edge exactly once; an **Euler circuit** also ends where it started. Euler proved:

      - A connected graph has an Euler **circuit** exactly when **every** vertex has even degree. Each visit to a vertex arrives along one edge and leaves along another, using edges in pairs.
      - It has an Euler **path** exactly when it has **0 or 2** odd-degree vertices (the path must start at one and end at the other).

      Königsberg's four land masses had degrees 5, 3, 3 and 3: four odd vertices, so the walk was impossible. Euler answered the puzzle without trying a single route, by reasoning about degrees.

examples:
  - title: Building a graph from edges
    intro: An adjacency list, degrees, and the handshake lemma.
    code: |
      edges = [("Ana", "Ben"), ("Ana", "Cal"), ("Ben", "Cal"), ("Cal", "Dee"), ("Eve", "Fay")]

      graph = {}
      for u, v in edges:
          graph.setdefault(u, set()).add(v)
          graph.setdefault(v, set()).add(u)

      for person in sorted(graph):
          print(person, sorted(graph[person]))
      degrees = {v: len(nbrs) for v, nbrs in graph.items()}
      print("degree sum:", sum(degrees.values()), "edges x 2:", 2 * len(edges))
      n = len(graph)
      print("density:", round(len(edges) / (n * (n - 1) / 2), 3))
    output: |
      Ana ['Ben', 'Cal']
      Ben ['Ana', 'Cal']
      Cal ['Ana', 'Ben', 'Dee']
      Dee ['Cal']
      Eve ['Fay']
      Fay ['Eve']
      degree sum: 10 edges x 2: 10
      density: 0.333
    lines:
      - line: 1
        note: "An **edge list**: the simplest way to write a graph down, often how it arrives in a file."
      - line: 4-6
        note: "`setdefault(key, set())` returns the existing set or creates and stores an empty one. Add each edge in both directions, because friendship is undirected."
      - line: 9
        note: "Sets are unordered, so sort them for repeatable output."
      - line: 10-11
        note: "The handshake lemma as a check: degrees sum to twice the number of edges."
      - line: 13
        note: "5 of the C(6, 2) = 15 possible edges are present."
  - title: Adjacency matrix and walks
    intro: Squaring the matrix counts walks of length 2.
    code: |
      names = ["A", "B", "C", "D"]
      edges = [("A", "B"), ("A", "C"), ("B", "C"), ("C", "D")]
      index = {name: i for i, name in enumerate(names)}

      n = len(names)
      M = [[0] * n for _ in range(n)]
      for u, v in edges:
          M[index[u]][index[v]] = M[index[v]][index[u]] = 1

      def multiply(X, Y):
          return [[sum(X[i][k] * Y[k][j] for k in range(n)) for j in range(n)] for i in range(n)]

      M2 = multiply(M, M)
      for name, row in zip(names, M2):
          print(name, row)
      print("walks A to D of length 2:", M2[index["A"]][index["D"]])
    output: |
      A [2, 1, 1, 1]
      B [1, 2, 1, 1]
      C [1, 1, 3, 0]
      D [1, 1, 0, 1]
      walks A to D of length 2: 1
    lines:
      - line: 3
        note: "A matrix uses numbered rows, so map each name to a number."
      - line: 6
        note: "A list comprehension makes n separate rows. `[[0] * n] * n` would repeat the same row n times (Lesson 3.4)."
      - line: 8
        note: "Undirected: set both (u, v) and (v, u), keeping the matrix symmetric."
      - line: 10-11
        note: "Matrix multiplication: entry (i, j) is Σₖ X[i][k] × Y[k][j]."
      - line: 14-15
        note: "The diagonal of M² gives each vertex's degree: a walk of length 2 from v back to v goes out along an edge and straight back."
      - line: 16
        note: "The single walk A → C → D."
  - title: Reachability and components
    intro: A visited set and a to-do list explore the graph.
    code: |
      graph = {
          1: {2, 3}, 2: {1, 3}, 3: {1, 2, 4}, 4: {3},
          5: {6}, 6: {5},
          7: set(),
      }

      def reachable(graph, start):
          visited = {start}
          todo = [start]
          while todo:
              v = todo.pop()
              for w in graph[v]:
                  if w not in visited:
                      visited.add(w)
                      todo.append(w)
          return visited

      print(sorted(reachable(graph, 4)))

      components = []
      seen = set()
      for v in graph:
          if v not in seen:
              comp = reachable(graph, v)
              seen |= comp
              components.append(sorted(comp))
      print(components)
    output: |
      [1, 2, 3, 4]
      [[1, 2, 3, 4], [5, 6], [7]]
    lines:
      - line: 4
        note: "Vertex 7 has no edges: an **isolated vertex**, a component on its own."
      - line: 8-9
        note: "Visited records what we've found; todo holds vertices whose neighbours we haven't checked yet."
      - line: 11
        note: "`pop()` takes from the end, so todo is a stack: a depth-first search."
      - line: 13-15
        note: "Mark a vertex visited when it's first discovered, so it's never added to todo twice."
      - line: 20-26
        note: "Start a new search from each vertex not yet seen. Each search finds one whole component; `seen |= comp` adds it to the seen set."

playground:
  prompt: |
    Here are the bridges of Königsberg as a **multigraph** (more than one edge can join two places). Check Euler's argument by computing the degrees, then add a bridge (for example `("North", "South")`) and see when an Euler path becomes possible. Two odd vertices allow a path; zero allow a circuit.
  code: |
    bridges = [
        ("North", "Island"), ("North", "Island"),
        ("South", "Island"), ("South", "Island"),
        ("North", "East"), ("South", "East"), ("Island", "East"),
    ]
    degree = {}
    for u, v in bridges:
        degree[u] = degree.get(u, 0) + 1
        degree[v] = degree.get(v, 0) + 1
    print(degree)
    odd = [v for v, d in degree.items() if d % 2 == 1]
    print("odd-degree places:", odd)
    print("Euler path possible:", len(odd) in (0, 2))

exercises:
  - id: build-graph
    title: Edges to adjacency lists
    difficulty: 1
    prompt: |
      Write:

      - `build_graph(edges, vertices=())`: an undirected adjacency list (a dictionary mapping each vertex to a **set** of neighbours) from a list of edge pairs. Also include every vertex in `vertices`, even if it has no edges.
      - `degrees(graph)`: a dictionary mapping each vertex to its degree.
      - `edge_count(graph)`: the number of edges, using the handshake lemma.
      - `possible(degree_list)`: False if the handshake lemma shows no graph can have these degrees (the sum is odd), otherwise True.
    starter: |
      def build_graph(edges, vertices=()):
          pass


      def degrees(graph):
          pass


      def edge_count(graph):
          pass


      def possible(degree_list):
          pass
    tests:
      - name: build_graph
        code: |
          g = build_graph([("A", "B"), ("A", "C"), ("B", "C"), ("C", "D")])
          assert g == {"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B", "D"}, "D": {"C"}}
          g = build_graph([(1, 2)], vertices=[3, 1])
          assert g == {1: {2}, 2: {1}, 3: set()}
      - name: degrees and edge_count
        code: |
          g = build_graph([("A", "B"), ("A", "C"), ("B", "C"), ("C", "D")])
          assert degrees(g) == {"A": 2, "B": 2, "C": 3, "D": 1}
          assert edge_count(g) == 4
          import itertools
          k6 = build_graph(list(itertools.combinations(range(6), 2)))
          assert edge_count(k6) == 15
      - name: possible
        code: |
          assert possible([3, 3, 2, 2, 2]) and not possible([3] * 7) and possible([]) and not possible([1, 2, 2])
    hints:
      - "For each `(u, v)`, use `graph.setdefault(u, set()).add(v)` and the same the other way round. Then `setdefault` each vertex in `vertices` too."
      - "`edge_count` is `sum(degrees(graph).values()) // 2`."
    solution: |
      def build_graph(edges, vertices=()):
          graph = {}
          for u, v in edges:
              graph.setdefault(u, set()).add(v)
              graph.setdefault(v, set()).add(u)
          for v in vertices:
              graph.setdefault(v, set())
          return graph


      def degrees(graph):
          return {v: len(nbrs) for v, nbrs in graph.items()}


      def edge_count(graph):
          return sum(degrees(graph).values()) // 2


      def possible(degree_list):
          return sum(degree_list) % 2 == 0
    explanation: |
      Every edge appears in two neighbour sets, so the degree sum counts each edge twice. An odd degree sum is impossible, which rules out seven people with three friends each. (An even sum isn't always enough: no simple graph has degrees [3, 1], because a vertex with degree 3 needs three other vertices. Deciding exactly which lists work is the Erdős–Gallai theorem.)

  - id: adjacency-matrix
    title: Adjacency matrices
    difficulty: 2
    prompt: |
      Vertices are numbered `0` to `n − 1`. Write:

      - `to_matrix(n, edges, directed=False)`: the n × n adjacency matrix as a list of lists. For an undirected graph set both entries.
      - `to_list(matrix)`: the adjacency list (dictionary of sets) for a matrix, with every vertex present.
      - `in_out_degrees(matrix)`: for a directed graph, a list of `(in_degree, out_degree)` pairs. Out-degree is the row sum; in-degree is the column sum.
      - `is_undirected(matrix)`: True if the matrix is symmetric.
    starter: |
      def to_matrix(n, edges, directed=False):
          pass


      def to_list(matrix):
          pass


      def in_out_degrees(matrix):
          pass


      def is_undirected(matrix):
          pass
    tests:
      - name: to_matrix
        code: |
          assert to_matrix(3, [(0, 1), (1, 2)]) == [[0, 1, 0], [1, 0, 1], [0, 1, 0]]
          assert to_matrix(3, [(0, 1), (1, 2)], directed=True) == [[0, 1, 0], [0, 0, 1], [0, 0, 0]]
          m = to_matrix(3, [])
          m[0][0] = 9
          assert m[1][0] == 0, "Each row must be a separate list"
      - name: to_list
        code: |
          assert to_list([[0, 1, 0], [1, 0, 1], [0, 1, 0]]) == {0: {1}, 1: {0, 2}, 2: {1}}
          assert to_list([[0, 0], [0, 0]]) == {0: set(), 1: set()}
      - name: degrees and symmetry
        code: |
          m = to_matrix(4, [(0, 1), (0, 2), (1, 2), (3, 0)], directed=True)
          assert in_out_degrees(m) == [(1, 2), (1, 1), (2, 0), (0, 1)]
          assert sum(i for i, o in in_out_degrees(m)) == 4 == sum(o for i, o in in_out_degrees(m))
          assert not is_undirected(m) and is_undirected(to_matrix(4, [(0, 1), (0, 2), (1, 2), (3, 0)]))
    hints:
      - "`[[0] * n for _ in range(n)]` makes n separate rows."
      - "`to_list`: `{i: {j for j, x in enumerate(row) if x} for i, row in enumerate(matrix)}`."
      - "Column j's sum is `sum(matrix[i][j] for i in range(n))`. Symmetric means `matrix[i][j] == matrix[j][i]` for all i and j."
    solution: |
      def to_matrix(n, edges, directed=False):
          matrix = [[0] * n for _ in range(n)]
          for u, v in edges:
              matrix[u][v] = 1
              if not directed:
                  matrix[v][u] = 1
          return matrix


      def to_list(matrix):
          return {i: {j for j, x in enumerate(row) if x} for i, row in enumerate(matrix)}


      def in_out_degrees(matrix):
          n = len(matrix)
          return [(sum(matrix[i][j] for i in range(n)), sum(matrix[j])) for j in range(n)]


      def is_undirected(matrix):
          n = len(matrix)
          return all(matrix[i][j] == matrix[j][i] for i in range(n) for j in range(n))
    explanation: |
      Converting between representations is a common first step, since input often arrives in one form but an algorithm wants the other. The in- and out-degree sums both equal the number of edges, the directed handshake lemma. The aliasing trap with `[[0] * n] * n` (all rows the same list) is one of the most common bugs in matrix code.

  - id: walks-paths
    title: Walks, paths and cycles
    difficulty: 2
    prompt: |
      `graph` is an undirected adjacency list (dictionary of sets). Write:

      - `is_walk(graph, seq)`: True if `seq` has at least one vertex, every vertex is in the graph, and each consecutive pair is adjacent.
      - `is_path(graph, seq)`: a walk with no repeated vertex.
      - `is_cycle(graph, seq)`: `seq` starts and ends at the same vertex, has length at least 3 (at least 4 items in `seq`), is a walk, and repeats no vertex apart from the start being equal to the end.
      - `count_walks(matrix, i, j, k)`: the number of walks of length `k` from vertex `i` to vertex `j`, using matrix powers. (Mᵏ for k = 0 is the identity matrix.)
    starter: |
      def is_walk(graph, seq):
          pass


      def is_path(graph, seq):
          pass


      def is_cycle(graph, seq):
          pass


      def count_walks(matrix, i, j, k):
          pass
    tests:
      - name: walks and paths
        code: |
          g = {"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B", "D"}, "D": {"C"}}
          assert is_walk(g, ["A", "B", "C", "A", "B"]) and not is_path(g, ["A", "B", "C", "A", "B"])
          assert is_path(g, ["A", "B", "C", "D"]) and is_path(g, ["D"])
          assert not is_walk(g, ["A", "D"]) and not is_walk(g, []) and not is_walk(g, ["A", "Z"])
      - name: cycles
        code: |
          g = {"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B", "D"}, "D": {"C"}}
          assert is_cycle(g, ["A", "B", "C", "A"])
          assert not is_cycle(g, ["A", "B", "A"]), "Going there and back isn't a cycle"
          assert not is_cycle(g, ["A", "B", "C", "D"])
          sq = {1: {2, 4}, 2: {1, 3}, 3: {2, 4}, 4: {1, 3}}
          assert is_cycle(sq, [1, 2, 3, 4, 1]) and not is_cycle(sq, [1, 2, 1, 4, 1])
      - name: count_walks
        code: |
          M = [[0, 1, 1, 0], [1, 0, 1, 0], [1, 1, 0, 1], [0, 0, 1, 0]]
          assert count_walks(M, 0, 3, 2) == 1 and count_walks(M, 2, 2, 2) == 3
          assert count_walks(M, 0, 0, 0) == 1 and count_walks(M, 0, 1, 0) == 0
          assert count_walks(M, 0, 0, 3) == 2, "A-B-C-A and A-C-B-A"
          tri = [[0, 1, 1], [1, 0, 1], [1, 1, 0]]
          assert count_walks(tri, 0, 0, 10) == 342
    hints:
      - "`is_walk`: check `seq` is non-empty and all vertices are in graph, then `all(seq[i + 1] in graph[seq[i]] for i in range(len(seq) - 1))`."
      - "No repeats: `len(set(seq)) == len(seq)`. For a cycle, check that `seq[:-1]` has no repeats."
      - "Start with the identity matrix and multiply by M, k times; return entry [i][j]."
    solution: |
      def is_walk(graph, seq):
          if not seq or any(v not in graph for v in seq):
              return False
          return all(seq[i + 1] in graph[seq[i]] for i in range(len(seq) - 1))


      def is_path(graph, seq):
          return is_walk(graph, seq) and len(set(seq)) == len(seq)


      def is_cycle(graph, seq):
          return (len(seq) >= 4 and seq[0] == seq[-1] and is_walk(graph, seq)
                  and len(set(seq[:-1])) == len(seq) - 1)


      def multiply(X, Y):
          n = len(X)
          return [[sum(X[i][m] * Y[m][j] for m in range(n)) for j in range(n)] for i in range(n)]


      def count_walks(matrix, i, j, k):
          n = len(matrix)
          power = [[1 if r == c else 0 for c in range(n)] for r in range(n)]
          for _ in range(k):
              power = multiply(power, matrix)
          return power[i][j]
    explanation: |
      These definitions are precise because the algorithms depend on them: a cycle must have length at least 3, otherwise every edge walked there and back would count. The matrix result follows by induction: a walk of length k + 1 from i to j is a walk of length k from i to some m, followed by an edge from m to j, which is exactly what multiplying Mᵏ by M sums up. (You could use square-and-multiply from Lesson 6.8 to compute Mᵏ in O(log k) multiplications.)

  - id: components
    title: Reachability and components
    difficulty: 2
    prompt: |
      `graph` is an undirected adjacency list. Write:

      - `reachable(graph, start)`: the set of vertices reachable from `start`, using a visited set and a to-do list (no recursion, so huge graphs don't hit the recursion limit).
      - `is_connected(graph)`: True if every vertex can reach every other. An empty graph counts as connected.
      - `components(graph)`: a list of the connected components, each a **sorted list**, with the components sorted by their smallest vertex.
      - `same_component(graph, u, v)`: True if u can reach v.
    starter: |
      def reachable(graph, start):
          pass


      def is_connected(graph):
          pass


      def components(graph):
          pass


      def same_component(graph, u, v):
          pass
    tests:
      - name: reachable
        code: |
          g = {1: {2, 3}, 2: {1, 3}, 3: {1, 2, 4}, 4: {3}, 5: {6}, 6: {5}, 7: set()}
          assert reachable(g, 4) == {1, 2, 3, 4} and reachable(g, 7) == {7} and reachable(g, 6) == {5, 6}
      - name: components and connectivity
        code: |
          g = {1: {2, 3}, 2: {1, 3}, 3: {1, 2, 4}, 4: {3}, 5: {6}, 6: {5}, 7: set()}
          assert components(g) == [[1, 2, 3, 4], [5, 6], [7]]
          assert not is_connected(g) and is_connected({1: {2}, 2: {1}}) and is_connected({})
          assert same_component(g, 1, 4) and not same_component(g, 1, 5)
      - name: long chain
        code: |
          n = 50_000
          chain = {i: set() for i in range(n)}
          for i in range(n - 1):
              chain[i].add(i + 1)
              chain[i + 1].add(i)
          assert len(reachable(chain, 0)) == n and is_connected(chain)
          chain[0].discard(1)
          chain[1].discard(0)
          assert len(components(chain)) == 2
    hints:
      - "Start with `visited = {start}` and `todo = [start]`. While todo isn't empty, pop a vertex and add each unvisited neighbour to both."
      - "`is_connected`: if the graph is empty return True; otherwise check `len(reachable(graph, any_vertex)) == len(graph)`."
      - "`components`: loop over the vertices in sorted order, skipping those already seen, and run `reachable` from each new one."
    solution: |
      def reachable(graph, start):
          visited = {start}
          todo = [start]
          while todo:
              v = todo.pop()
              for w in graph[v]:
                  if w not in visited:
                      visited.add(w)
                      todo.append(w)
          return visited


      def is_connected(graph):
          if not graph:
              return True
          start = next(iter(graph))
          return len(reachable(graph, start)) == len(graph)


      def components(graph):
          seen = set()
          result = []
          for v in sorted(graph):
              if v not in seen:
                  comp = reachable(graph, v)
                  seen |= comp
                  result.append(sorted(comp))
          return result


      def same_component(graph, u, v):
          return v in reachable(graph, u)
    explanation: |
      Each vertex is added to the to-do list at most once (it's marked visited when first found), and each edge is looked at twice, so the whole search is O(V + E). A recursive version would reach Python's recursion limit (Lesson 4.5) on the 50,000-vertex chain; an explicit stack has no such limit. If you wanted to answer `same_component` many times, you'd compute the components once and store each vertex's component number, an idea Unit 7 develops into the union-find structure.

  - id: trees-euler
    title: Trees and Euler paths
    difficulty: 3
    prompt: |
      `graph` is an undirected adjacency list of a simple graph. Use your own `reachable` (write it again or adapt it) and the handshake lemma. Write:

      - `is_tree(graph)`: True if the graph is connected and has exactly n − 1 edges (n ≥ 1).
      - `leaves(graph)`: the sorted list of vertices with degree 1.
      - `euler_type(graph)`: `"circuit"` if the graph has an Euler circuit, `"path"` if it has an Euler path but no circuit, otherwise `None`. Ignore isolated vertices (degree 0) when checking connectivity, and return `None` for a graph with no edges.
      - `euler_path(graph)`: if `euler_type` isn't `None`, return a list of vertices forming an Euler path (or circuit), otherwise `None`. Use **Hierholzer's algorithm**: copy the graph; start at an odd-degree vertex if there is one, otherwise at any vertex with edges. Keep a stack, initially holding the start. Repeatedly look at the top vertex v: if v has unused edges, remove one edge (v, w) from the copy (both directions) and push w; otherwise pop v and append it to the result. Finally reverse the result.
    starter: |
      def reachable(graph, start):
          pass


      def is_tree(graph):
          pass


      def leaves(graph):
          pass


      def euler_type(graph):
          pass


      def euler_path(graph):
          pass
    tests:
      - name: trees
        code: |
          star = {0: {1, 2, 3}, 1: {0}, 2: {0}, 3: {0}}
          assert is_tree(star) and leaves(star) == [1, 2, 3]
          tri = {0: {1, 2}, 1: {0, 2}, 2: {0, 1}}
          assert not is_tree(tri) and leaves(tri) == []
          assert is_tree({0: set()})
          assert not is_tree({0: {1}, 1: {0}, 2: {3}, 3: {2}, 4: {5}, 5: {4}, 6: set()})
      - name: euler_type
        code: |
          tri = {0: {1, 2}, 1: {0, 2}, 2: {0, 1}}
          assert euler_type(tri) == "circuit"
          assert euler_type({0: {1}, 1: {0, 2}, 2: {1}}) == "path"
          star = {0: {1, 2, 3}, 1: {0}, 2: {0}, 3: {0}}
          assert euler_type(star) is None
          two_triangles = {0: {1, 2}, 1: {0, 2}, 2: {0, 1}, 3: {4, 5}, 4: {3, 5}, 5: {3, 4}}
          assert euler_type(two_triangles) is None, "Not connected"
          assert euler_type({0: {1, 2}, 1: {0, 2}, 2: {0, 1}, 9: set()}) == "circuit", "Ignore isolated vertices"
      - name: euler_path
        code: |
          def check(graph, path):
              used = set()
              for a, b in zip(path, path[1:]):
                  assert b in graph[a], f"{a}-{b} isn't an edge"
                  e = frozenset((a, b))
                  assert e not in used, f"edge {a}-{b} used twice"
                  used.add(e)
              assert len(used) == sum(len(s) for s in graph.values()) // 2, "Not every edge used"
          house = {0: {1, 2}, 1: {0, 2, 3, 4}, 2: {0, 1, 3, 4}, 3: {1, 2, 4}, 4: {1, 2, 3}}
          p = euler_path(house)
          check(house, p)
          assert {p[0], p[-1]} == {3, 4}
          bowtie = {0: {1, 2}, 1: {0, 2}, 2: {0, 1, 3, 4}, 3: {2, 4}, 4: {2, 3}}
          p = euler_path(bowtie)
          check(bowtie, p)
          assert p[0] == p[-1]
          assert euler_path({0: {1, 2, 3}, 1: {0}, 2: {0}, 3: {0}}) is None
    hints:
      - "Edges = sum of degrees // 2. `is_tree`: the graph is non-empty, connected (reachable from any vertex covers everything), and edges == n − 1."
      - "`euler_type`: let `active` be the vertices with degree > 0. If none, return None. Check that `reachable` from one active vertex includes every active vertex. Then count odd-degree vertices: 0 gives \"circuit\", 2 gives \"path\"."
      - "For Hierholzer: `g = {v: set(n) for v, n in graph.items()}`. While the stack is non-empty: `v = stack[-1]`; if `g[v]`: `w = g[v].pop(); g[w].remove(v); stack.append(w)`; else `result.append(stack.pop())`."
    solution: |
      def reachable(graph, start):
          visited = {start}
          todo = [start]
          while todo:
              v = todo.pop()
              for w in graph[v]:
                  if w not in visited:
                      visited.add(w)
                      todo.append(w)
          return visited


      def edge_total(graph):
          return sum(len(nbrs) for nbrs in graph.values()) // 2


      def is_tree(graph):
          if not graph:
              return False
          start = next(iter(graph))
          return len(reachable(graph, start)) == len(graph) and edge_total(graph) == len(graph) - 1


      def leaves(graph):
          return sorted(v for v, nbrs in graph.items() if len(nbrs) == 1)


      def euler_type(graph):
          active = [v for v, nbrs in graph.items() if nbrs]
          if not active:
              return None
          if not set(active) <= reachable(graph, active[0]):
              return None
          odd = sum(1 for v in active if len(graph[v]) % 2 == 1)
          if odd == 0:
              return "circuit"
          if odd == 2:
              return "path"
          return None


      def euler_path(graph):
          if euler_type(graph) is None:
              return None
          g = {v: set(nbrs) for v, nbrs in graph.items()}
          odd = [v for v, nbrs in g.items() if len(nbrs) % 2 == 1]
          start = odd[0] if odd else next(v for v, nbrs in g.items() if nbrs)
          stack = [start]
          result = []
          while stack:
              v = stack[-1]
              if g[v]:
                  w = g[v].pop()
                  g[w].remove(v)
                  stack.append(w)
              else:
                  result.append(stack.pop())
          return result[::-1]
    explanation: |
      Euler's theorem turns "is there a route?" (which sounds like trying every order of edges, a brute-force search) into "count the odd degrees", a linear-time check. Hierholzer's algorithm then builds the route in O(E): when it gets stuck, it backs up and splices in detours, and the stack takes care of the splicing. The "house" (a square with a roof and crossed walls) can be drawn without lifting your pen only by starting at one bottom corner and ending at the other, the two odd-degree vertices.

commonMistakes:
  - title: Adding undirected edges in only one direction
    explanation: |
      In an adjacency list for an undirected graph, each edge must appear in **both** endpoints' neighbour sets. Forgetting one breaks the handshake check, which is a good way to catch it.
  - title: Building a matrix with [[0] * n] * n
    explanation: |
      That makes n references to the same row, so setting one entry changes a whole column. Use `[[0] * n for _ in range(n)]`.
  - title: Marking vertices visited when they're removed from the to-do list
    explanation: |
      Mark a vertex as visited when it's **first discovered** and added. Otherwise the same vertex can be added many times, wasting time and possibly memory.
  - title: Confusing paths with walks
    explanation: |
      A walk may repeat vertices; a path may not. A cycle needs at least 3 edges, so going along one edge and straight back isn't a cycle.
  - title: Using an adjacency matrix for a huge sparse graph
    explanation: |
      A matrix needs V² entries. With a million vertices that's a trillion entries, nearly all zero. Use an adjacency list.

summary:
  - "A **graph** has vertices and edges; edges may be undirected or directed, and may carry weights."
  - "**Handshake lemma**: the degrees sum to 2 × the number of edges, so the number of odd-degree vertices is even."
  - "**Adjacency lists** use O(V + E) space and suit sparse graphs; **adjacency matrices** use O(V²) and give instant edge lookups."
  - "**Walks** may repeat vertices, **paths** may not, and **cycles** return to their start. Entry (i, j) of Mᵏ counts walks of length k."
  - "A visited set plus a to-do list finds everything **reachable** in O(V + E); repeating it finds the **connected components**."
  - "A **tree** is connected with no cycles, and has exactly n − 1 edges. A connected graph has an **Euler circuit** iff every degree is even, and an **Euler path** iff 0 or 2 degrees are odd."
next: |
  That completes the discrete maths toolkit: logic, sets, proof, induction, counting, probability, number theory and graphs. **Unit 7, Data Structures II**, puts it to work. You'll build stacks, queues, linked lists, hash tables (using modular arithmetic and the pigeonhole principle), trees and heaps (with induction to prove their properties), and graphs with breadth-first and depth-first search, analysing each with the counting and Big-O tools you now have.

quiz:
  - type: mcq
    question: "A graph has vertices with degrees 4, 3, 3, 2, 2. How many edges does it have?"
    options: ["14", "7", "5", "It's impossible"]
    answer: 1
    explanation: "Handshake lemma: (4 + 3 + 3 + 2 + 2) / 2 = 7."
  - type: mcq
    question: Can a group of 9 people each be friends with exactly 5 others in the group?
    options: ["Yes", "No, because 9 × 5 is odd", "Only if the friendships are directed", "Only if 9 is prime"]
    answer: 1
    explanation: "The degree sum would be 45, but it must be twice the number of edges, an even number."
  - type: mcq
    question: "For a social network with 10 million users, each with about 200 friends, which representation is better?"
    options: ["Adjacency matrix", "Adjacency list", "They use the same memory", "An edge list sorted by name"]
    answer: 1
    explanation: "A matrix needs 10¹⁴ entries; an adjacency list needs about 2 × 10⁹ entries, one per friendship direction."
  - type: mcq
    question: How many edges does a tree with 50 vertices have?
    options: ["50", "49", "51", "It depends on its shape"]
    answer: 1
    explanation: Every tree with n vertices has n − 1 edges.
  - type: mcq
    question: "A connected graph has exactly four vertices of odd degree. What can you say?"
    options:
      - It has an Euler circuit
      - It has an Euler path but not a circuit
      - It has no Euler path
      - It must be a tree
    answer: 2
    explanation: "An Euler path needs 0 or 2 odd-degree vertices. This was exactly Königsberg's situation."
  - type: mcq
    question: "In the reachability search, what does the visited set prevent?"
    options:
      - Finding the shortest path
      - Processing the same vertex repeatedly, or looping forever around a cycle
      - Using too many edges
      - Visiting isolated vertices
    answer: 1
    explanation: Without it the search would go round any cycle again and again.
  - type: code
    question: |
      Write `odd_vertices(graph)`, returning the sorted list of vertices with odd degree in an undirected adjacency list (a dictionary of sets).
    starter: |
      def odd_vertices(graph):
          pass
    tests:
      - name: odd_vertices works
        code: |
          assert odd_vertices({"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B", "D"}, "D": {"C"}}) == ["C", "D"]
          assert odd_vertices({0: {1, 2}, 1: {0, 2}, 2: {0, 1}}) == []
          assert odd_vertices({}) == []
    solution: |
      def odd_vertices(graph):
          return sorted(v for v, nbrs in graph.items() if len(nbrs) % 2 == 1)
