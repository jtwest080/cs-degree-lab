title: Social Network Analyser
brief: |
  Social networks, from school friendship groups to platforms with billions of users, are **graphs**: people are vertices and friendships are edges. Companies analyse these graphs to suggest friends, find communities and spot influential people. In this project you'll build a small analyser that does the same, using almost every idea from this unit: sets and intersections (Lesson 6.3), the handshake lemma, adjacency lists and connected components (Lesson 6.9), combinations (Lesson 6.6) and probability (Lesson 6.7).

  The data is in `friends.csv` (created for you each time you run). Each row after the header is `person,friend`. The file is messy in the ways real data is: names may have spaces around them, there are blank lines, some friendships appear twice (once each way round), one row is someone listed as their own friend (ignore the friendship, keep the person), and a row with an empty friend means the person has no friendship on that row but still belongs in the network.

  **Exact requirements** (the tests check each function on networks of their own, including one with thousands of people):

  A **network** is an adjacency list: a dictionary mapping each person to the **set** of their friends. Friendship is undirected.

  - `load_network(filename)`: read the CSV into a network, cleaning it as described above.
  - `edge_count(network)`: the number of friendships, using the handshake lemma (sum of degrees ÷ 2).
  - `handshake_ok(network)`: count the friendships **directly**, as a set of `frozenset({a, b})` pairs, and return True if the degree sum is exactly twice that count. (It's False if some friendship was stored in only one direction.)
  - `degree_ranking(network)`: a list of `(person, degree)` tuples, highest degree first, ties in alphabetical order.
  - `mutual_friends(network, a, b)`: the sorted list of people who are friends with both.
  - `suggest_friends(network, person)`: people who aren't `person` and aren't already their friends, but share at least one mutual friend, as `(candidate, number_of_mutual_friends)` tuples, most mutual friends first, ties alphabetical.
  - `groups(network)`: the connected components, each a sorted list, largest group first, ties ordered by their first name.
  - `count_triangles(network)`: the number of **triangles**: sets of three people who are all friends with each other. It must handle a network of 3,000 people within a few seconds, so don't try every combination of three people.
  - `density(network)`: the number of friendships divided by the number of possible friendships, C(n, 2); this is also the probability that two people chosen at random are friends. Return `0.0` for fewer than 2 people.
  - `clustering(network, person)`: the fraction of pairs of `person`'s friends who are friends with each other (0.0 if they have fewer than 2 friends).
  - `expected_triangles(network)`: how many triangles a **random** network with the same number of people and the same density would have on average: C(n, 3) × density³. (Each of the C(n, 3) groups of three is a triangle if all three of its friendships exist, each with probability equal to the density.)
  - `main()` prints this report for `friends.csv` exactly:

    ```text
    People: 12
    Friendships: 15
    Handshake check: OK
    Density: 0.227
    Most connected: Dev (5), Chloe (4), Amara (3)
    Groups: 3
      Amara, Ben, Chloe, Dev, Elif, Finn
      Gita, Hugo, Ivan, Jonah, Lena
      Kofi
    Triangles: 7 (a random network would have about 2.6)
    Mutual friends of Amara and Dev: Ben, Chloe
    Clustering for Dev: 0.50
    Suggestions for Amara: Elif (2), Finn (1)
    ```

    The last line of the program calls `main()`.

  Real friendship networks have far more triangles than random ones, because friends of friends tend to become friends. Your report measures exactly that.
prelude: |
  # Creates friends.csv fresh before every run.
  with open("friends.csv", "w") as _f:
      _f.write("person,friend\nAmara,Ben\nAmara,Chloe\nBen,Chloe\nBen,Dev\nChloe,Dev\nDev,Elif\nElif,Finn\nFinn,Dev\nAmara,Dev\n Ben , Amara \nGita,Hugo\nHugo,Ivan\nIvan,Gita\nIvan,Jonah\n\nKofi,Kofi\nKofi,\nLena,Jonah\nChloe,Elif\n")
  del _f
steps:
- title: Load and clean the data
  body: Use the file-reading pattern from Lesson 3.9 and the `setdefault` idea from Lesson 6.9. For each non-blank line, split on the comma and strip both parts. Always add the person to the network; add the friendship in **both** directions only if the friend is non-empty and different from the person. Sets make duplicate friendships harmless automatically. Print the network to check it.
- title: Degrees and the handshake check
  body: '`edge_count` is one line using the handshake lemma. For `handshake_ok`, build a set of `frozenset((person, friend))` for every person and friend: a frozenset is a set that can go inside another set (Lesson 3.7), and `frozenset((''A'', ''B'')) == frozenset((''B'', ''A''))`, so each friendship is counted once. Then test it on a broken network where one direction is missing.'
- title: Rankings, mutual friends and suggestions
  body: Sort with a key of `(-degree, name)` to get highest first with alphabetical ties (Lesson 4.8). Mutual friends are a set intersection, `network[a] & network[b]`. For suggestions, look at each friend's friends (people at distance 2) and count how often each candidate appears, skipping the person and existing friends.
- title: Groups
  body: Reuse your `reachable` function and the component loop from the Lesson 6.9 exercises, then sort the groups with a key of `(-len(group), group[0])`.
- title: Triangles without brute force
  body: 'Trying every group of three people means C(3000, 3), about 4.5 billion, checks: far too slow. Instead, for each friendship (p, f), the third corners of its triangles are exactly the **mutual friends** of p and f. Each triangle has three edges, so it would be found three times; count each one once by only counting when `p < f < w` (names compare alphabetically, numbers numerically). This does work proportional to the number of edges times a typical degree.'
- title: Density, clustering and the random baseline
  body: Use `math.comb` for C(n, 2) and C(n, 3). For clustering, look at each pair of the person's friends (`itertools.combinations` works well) and count how many pairs are friends. Then write `main()` and compare your output with the expected report character by character.
checklist:
- text: load_network cleans the CSV into an undirected adjacency list
  test: load_network
- text: edge_count and handshake_ok use the handshake lemma
