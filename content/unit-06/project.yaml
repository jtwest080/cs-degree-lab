- text: Degrees, mutual friends and suggestions are correct and ordered
  test: rankings and suggestions
- text: groups finds the connected components
  test: groups
- text: count_triangles is correct and fast on 3,000 people
  test: triangles
- text: density, clustering and expected_triangles are correct
  test: density and clustering
- text: main prints the report
  test: main prints the report
- text: I explained in a comment why count_triangles doesn't count each triangle three times
- text: I tested each function on a tiny network I drew by hand
starter: |
  # Unit 6 project: Social Network Analyser
  from math import comb
  from itertools import combinations


  def load_network(filename):
      """Read person,friend rows into a dictionary of sets."""


  def edge_count(network):
      """Number of friendships, by the handshake lemma."""


  def handshake_ok(network):
      """True if the degree sum is twice the directly counted friendships."""


  def degree_ranking(network):
      """(person, degree) tuples, highest degree first, ties alphabetical."""


  def mutual_friends(network, a, b):
      """Sorted list of people who are friends with both a and b."""


  def suggest_friends(network, person):
      """(candidate, mutual count) tuples for friends of friends."""


  def groups(network):
      """Connected components, largest first."""


  def count_triangles(network):
      """Number of groups of three mutual friends."""


  def density(network):
      """Friendships divided by possible friendships."""


  def clustering(network, person):
      """Fraction of pairs of person's friends who are friends."""


  def expected_triangles(network):
      """Average triangle count of a random network with the same density."""


  def main():
      """Print the report for friends.csv."""


  main()
tests:
- name: load_network
  code: |
    network = load_network("friends.csv")
    assert len(network) == 12, f"Expected 12 people, got {sorted(network)}"
    assert network["Amara"] == {"Ben", "Chloe", "Dev"}, f"Amara: {network['Amara']}"
    assert network["Kofi"] == set(), "Kofi's only rows are a self-friendship and an empty friend"
    assert "" not in network and " Ben " not in network
    assert all(p in network[f] for p in network for f in network[p]), "Every friendship must go both ways"
    with open("tiny.csv", "w") as f:
        f.write("person,friend\nX,Y\nY,Z\n\nZ , X\nW,\n")
    assert load_network("tiny.csv") == {"X": {"Y", "Z"}, "Y": {"X", "Z"}, "Z": {"X", "Y"}, "W": set()}
- name: handshake
  code: |
    tri = {"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B"}, "D": set()}
    assert edge_count(tri) == 3 and handshake_ok(tri)
    broken = {"A": {"B"}, "B": set()}
    assert not handshake_ok(broken), "A lists B but B doesn't list A"
    assert edge_count(load_network("friends.csv")) == 15
- name: rankings and suggestions
  code: |
    n = {"A": {"B", "C", "D"}, "B": {"A", "C"}, "C": {"A", "B"}, "D": {"A", "E"}, "E": {"D"}}
    assert degree_ranking(n) == [("A", 3), ("B", 2), ("C", 2), ("D", 2), ("E", 1)]
    assert mutual_friends(n, "B", "C") == ["A"] and mutual_friends(n, "B", "E") == []
    assert suggest_friends(n, "B") == [("D", 1)]
    assert suggest_friends(n, "E") == [("A", 1)]
    assert suggest_friends(n, "A") == [("E", 1)]
    big = load_network("friends.csv")
    assert suggest_friends(big, "Amara") == [("Elif", 2), ("Finn", 1)]
    assert suggest_friends(big, "Kofi") == []
- name: groups
  code: |
    n = {1: {2}, 2: {1}, 3: {4, 5}, 4: {3}, 5: {3}, 6: set()}
    assert groups(n) == [[3, 4, 5], [1, 2], [6]]
    assert groups({"b": {"c"}, "c": {"b"}, "a": {"z"}, "z": {"a"}}) == [["a", "z"], ["b", "c"]]
    chain = {i: set() for i in range(20000)}
    for i in range(19999):
        chain[i].add(i + 1)
        chain[i + 1].add(i)
    assert len(groups(chain)) == 1, "Use an explicit stack, not recursion"
- name: triangles
  code: |
    assert count_triangles({"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B"}}) == 1
    from itertools import combinations as _comb
    k5 = {i: {j for j in range(5) if j != i} for i in range(5)}
    assert count_triangles(k5) == 10, "A complete graph on 5 people has C(5, 3) triangles"
    assert count_triangles({1: {2}, 2: {1, 3}, 3: {2}}) == 0
    import random, time
    random.seed(6)
    n = {i: set() for i in range(3000)}
    while sum(len(s) for s in n.values()) < 2 * 30000:
        a, b = random.randrange(3000), random.randrange(3000)
        if a != b:
            n[a].add(b)
            n[b].add(a)
    expected = sum(len(n[a] & n[b]) for a in n for b in n[a]) // 6
    t = time.time()
    assert count_triangles(n) == expected
    assert time.time() - t < 8, "count_triangles is too slow: use mutual friends of each friendship"
- name: density and clustering
  code: |
    tri = {"A": {"B", "C"}, "B": {"A", "C"}, "C": {"A", "B"}, "D": set()}
    assert abs(density(tri) - 0.5) < 1e-9 and density({"A": set()}) == 0.0
    star = {"H": {"1", "2", "3"}, "1": {"H"}, "2": {"H"}, "3": {"H"}}
    assert clustering(star, "H") == 0.0 and clustering(star, "1") == 0.0
    assert abs(clustering(tri, "A") - 1.0) < 1e-9
    n = {"A": {"B", "C", "D"}, "B": {"A", "C"}, "C": {"A", "B"}, "D": {"A"}}
    assert abs(clustering(n, "A") - 1 / 3) < 1e-9
    assert abs(expected_triangles(tri) - 4 * 0.125) < 1e-9
- name: main prints the report
  code: |
    expected = """People: 12
    Friendships: 15
    Handshake check: OK
    Density: 0.227
    Most connected: Dev (5), Chloe (4), Amara (3)
    Groups: 3
      Amara, Ben, Chloe, Dev, Elif, Finn
      Gita, Hugo, Ivan, Jonah, Lena
      Kofi
    Triangles: 7 (a random network would have about 2.6)
    Mutual friends of Amara and Dev: Ben, Chloe
    Clustering for Dev: 0.50
    Suggestions for Amara: Elif (2), Finn (1)"""
    got = output.strip().splitlines()
    for i, line in enumerate(expected.splitlines()):
        assert i < len(got), f"Missing line {i + 1}: {line!r}"
        assert got[i].rstrip() == line, f"Line {i + 1}: expected {line!r}, got {got[i]!r}"
solution: |
  # Unit 6 project: Social Network Analyser
  from math import comb


  def load_network(filename):
      network = {}
      with open(filename) as f:
          f.readline()
          for line in f:
              line = line.strip()
              if not line:
                  continue
              person, friend = [part.strip() for part in line.split(",")]
              network.setdefault(person, set())
              if friend and friend != person:
                  network.setdefault(friend, set())
                  network[person].add(friend)
                  network[friend].add(person)
      return network


  def edge_count(network):
      return sum(len(friends) for friends in network.values()) // 2


  def handshake_ok(network):
      edges = {frozenset((p, f)) for p, friends in network.items() for f in friends}
      return sum(len(friends) for friends in network.values()) == 2 * len(edges)


  def degree_ranking(network):
      return sorted(((p, len(f)) for p, f in network.items()), key=lambda pair: (-pair[1], pair[0]))


  def mutual_friends(network, a, b):
      return sorted(network[a] & network[b])


  def suggest_friends(network, person):
      counts = {}
      for friend in network[person]:
          for candidate in network[friend]:
              if candidate != person and candidate not in network[person]:
                  counts[candidate] = counts.get(candidate, 0) + 1
      return sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))


  def reachable(network, start):
      visited = {start}
      todo = [start]
      while todo:
          p = todo.pop()
          for f in network[p]:
              if f not in visited:
                  visited.add(f)
                  todo.append(f)
      return visited


  def groups(network):
      seen = set()
      result = []
      for p in sorted(network):
          if p not in seen:
              group = reachable(network, p)
              seen |= group
              result.append(sorted(group))
      return sorted(result, key=lambda g: (-len(g), g[0]))


  def count_triangles(network):
      # Each triangle p-f-w has three edges, so it would be found once from each.
      # Counting only when p < f < w counts it exactly once.
      total = 0
      for p, friends in network.items():
          for f in friends:
              if p < f:
                  total += sum(1 for w in network[p] & network[f] if w > f)
      return total


  def density(network):
      n = len(network)
      if n < 2:
          return 0.0
      return edge_count(network) / comb(n, 2)


  def clustering(network, person):
      friends = sorted(network[person])
      pairs = comb(len(friends), 2)
      if pairs == 0:
          return 0.0
      linked = sum(1 for i in range(len(friends)) for j in range(i + 1, len(friends))
                   if friends[j] in network[friends[i]])
      return linked / pairs


  def expected_triangles(network):
      return comb(len(network), 3) * density(network) ** 3


  def main():
      network = load_network("friends.csv")
      print(f"People: {len(network)}")
      print(f"Friendships: {edge_count(network)}")
      print(f"Handshake check: {'OK' if handshake_ok(network) else 'FAILED'}")
      print(f"Density: {density(network):.3f}")
      top = ", ".join(f"{p} ({d})" for p, d in degree_ranking(network)[:3])
      print(f"Most connected: {top}")
      gs = groups(network)
      print(f"Groups: {len(gs)}")
      for g in gs:
          print("  " + ", ".join(g))
      print(f"Triangles: {count_triangles(network)} (a random network would have about {expected_triangles(network):.1f})")
      print(f"Mutual friends of Amara and Dev: {', '.join(mutual_friends(network, 'Amara', 'Dev'))}")
      print(f"Clustering for Dev: {clustering(network, 'Dev'):.2f}")
      suggestions = ", ".join(f"{p} ({n})" for p, n in suggest_friends(network, "Amara"))
      print(f"Suggestions for Amara: {suggestions}")


  main()
stretch:
- 'Add `degrees_of_separation(network, a, b)`: the length of the shortest chain of friendships between two people. (Make the to-do list a queue that you take from the front, and record each person''s distance when they''re discovered: that''s breadth-first search, which Unit 7 covers properly.)'
- Compute the clustering for everyone and print the **average clustering coefficient**. Compare it with a random network of the same size and density, which you can generate with `random.random() < density` for every pair.
- Find the people whose removal would split a group into more pieces (try removing each person and recounting the groups). Who holds the network together?
- 'Simulate gossip: start with one person, and at each step every person who knows a secret tells each friend with probability 0.5. Estimate how many steps it takes for the whole group to know, over 1,000 runs.'
