# Terms introduced in Unit 7. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Abstract data type (ADT)
    definition: A description of what a data structure does (its operations and their behaviour) without saying how it is stored. A stack, a queue and a map are ADTs; an array or a linked list is one way to implement them.
    lesson: u7-adts-arrays
  - term: Data structure
    definition: A concrete way of organising data in memory so that certain operations are efficient, such as a dynamic array, a linked list or a hash table.
    lesson: u7-adts-arrays
  - term: Dynamic array
    definition: An array that grows automatically by allocating a bigger block (usually double the size) and copying the items across when it is full. Python's list is one.
    lesson: u7-adts-arrays
  - term: Capacity
    definition: The number of slots a dynamic array or hash table has allocated, as opposed to the number of items it currently holds.
    lesson: u7-adts-arrays
  - term: Amortised cost
    definition: "The average cost per operation over a long sequence of operations. Appending to a dynamic array is occasionally O(n) but amortised O(1), because the expensive copies are rare."
    lesson: u7-adts-arrays
  - term: Stack (LIFO)
    definition: "An ADT where items are added and removed at the same end, the top: last in, first out. Operations: push, pop, peek."
    lesson: u7-stacks
  - term: Postfix notation
    definition: Writing operators after their operands, as in 3 4 + 2 *, which needs no brackets and is easy to evaluate with a stack. Also called reverse Polish notation.
    lesson: u7-stacks
  - term: Shunting-yard algorithm
    definition: Dijkstra's stack-based algorithm for converting ordinary infix expressions, with precedence and brackets, into postfix.
    lesson: u7-stacks
  - term: Queue (FIFO)
    definition: "An ADT where items join at the back and leave from the front: first in, first out. Operations: enqueue, dequeue, peek."
    lesson: u7-queues
  - term: Deque
    definition: A double-ended queue that supports adding and removing at both ends in O(1). Python provides collections.deque.
    lesson: u7-queues
  - term: Circular buffer
    definition: A fixed-size array used as a queue, where the front and back indices wrap around to the start using the remainder operator, so no items ever need shifting.
    lesson: u7-queues
  - term: Linked list
    definition: A sequence of nodes, each holding a value and a reference to the next node. Inserting or removing at a known node is O(1), but reaching the i-th item is O(n).
    lesson: u7-linked-lists
  - term: Node
    definition: One element of a linked structure (a linked list, tree or graph), holding a value and references to other nodes.
    lesson: u7-linked-lists
  - term: Doubly linked list
    definition: A linked list whose nodes also refer to the previous node, so it can be walked in both directions and a node can be removed in O(1) given only a reference to it.
    lesson: u7-linked-lists
  - term: Floyd's cycle detection
    definition: Finding a loop in a linked list with two pointers, one moving one step at a time and one moving two; they meet if and only if there is a cycle. Also called tortoise and hare.
    lesson: u7-linked-lists
  - term: Hash table
    definition: An array of buckets where a hash function decides which bucket each key goes in, giving average O(1) insert, lookup and delete. Python's dict and set are hash tables.
    lesson: u7-hash-tables
  - term: Hash function
    definition: A function that turns a key into an integer, the same every time for equal keys and ideally spreading different keys evenly across the buckets.
    lesson: u7-hash-tables
  - term: Collision
    definition: Two different keys being assigned to the same bucket. Collisions are unavoidable and are handled by chaining or open addressing.
    lesson: u7-hash-tables
  - term: Separate chaining
    definition: Handling collisions by keeping a list of all the key-value pairs in each bucket.
    lesson: u7-hash-tables
  - term: Open addressing
    definition: Handling collisions by storing every item in the array itself and, if a slot is taken, probing other slots (for example the next one along, in linear probing).
    lesson: u7-hash-tables
  - term: Load factor
    definition: The number of items in a hash table divided by the number of buckets. Tables resize, typically doubling, when it passes a threshold such as 0.75.
    lesson: u7-hash-tables
  - term: LRU cache
    definition: A fixed-size store that, when full, evicts the least recently used item. Built from a hash table plus a structure that keeps items in order of use.
    lesson: u7-hash-tables
  - term: Rooted tree
    definition: A hierarchy of nodes with one root at the top, where every other node has exactly one parent. Nodes with no children are leaves.
    lesson: u7-trees
  - term: Binary tree
    definition: A rooted tree in which every node has at most two children, called left and right.
    lesson: u7-trees
  - term: Height and depth
    definition: A node's depth is the number of edges from the root down to it; a tree's height is the greatest depth of any node.
    lesson: u7-trees
  - term: Tree traversal
    definition: Visiting every node of a tree in a systematic order. Depth-first orders are pre-order (node first), in-order (left, node, right) and post-order (node last); level order visits row by row using a queue.
    lesson: u7-trees
  - term: Binary search tree (BST)
    definition: A binary tree where every key in a node's left subtree is smaller than the node's key and every key in its right subtree is larger, so searching follows one path from the root.
    lesson: u7-bst
  - term: Balanced tree
    definition: A tree whose height stays O(log n), keeping BST operations fast. Self-balancing trees such as AVL and red-black trees rearrange themselves after updates to stay balanced.
    lesson: u7-bst
  - term: In-order successor
    definition: The node with the next larger key in a BST, found as the leftmost node of the right subtree. It replaces a deleted node that has two children.
    lesson: u7-bst
  - term: Binary heap
    definition: A complete binary tree stored in an array where every parent is smaller than (min-heap) or larger than (max-heap) its children. The children of index i are at 2i + 1 and 2i + 2.
    lesson: u7-heaps
  - term: Priority queue
    definition: An ADT where each item has a priority and the most urgent item is removed first. Usually implemented with a binary heap, giving O(log n) insert and remove.
    lesson: u7-heaps
  - term: Sift up and sift down
    definition: Restoring the heap property by swapping a new item upwards with its parent, or a replaced root downwards with its smaller child, until it is in order. Each takes O(log n).
    lesson: u7-heaps
  - term: Heapify
    definition: Turning an arbitrary list into a heap in place, in O(n) time, by sifting down every non-leaf from the bottom up.
    lesson: u7-heaps
  - term: Heapsort
    definition: Sorting by building a heap and repeatedly removing the root. O(n log n) in every case, and in place.
    lesson: u7-heaps
  - term: Lazy deletion
    definition: Removing an item by marking it as deleted rather than finding and removing it straight away; marked items are discarded when they reach the front.
    lesson: u7-heaps
  - term: Breadth-first search (BFS)
    definition: Exploring a graph ring by ring from a start vertex using a queue. Runs in O(V + E) and finds shortest paths in unweighted graphs.
    lesson: u7-graphs
  - term: Depth-first search (DFS)
    definition: Exploring a graph by going as deep as possible before backing up, using recursion or a stack. Runs in O(V + E) and is used for cycle detection and topological sorting.
    lesson: u7-graphs
  - term: BFS tree
    definition: The tree formed by the parent links recorded during a breadth-first search. It contains a shortest path from the start to every reachable vertex.
    lesson: u7-graphs
  - term: Directed acyclic graph (DAG)
    definition: A directed graph with no directed cycles. Dependencies, such as course prerequisites or build steps, form DAGs.
    lesson: u7-graphs
  - term: Topological order
    definition: An ordering of a directed graph's vertices in which every edge goes from an earlier vertex to a later one. It exists exactly when the graph is a DAG.
    lesson: u7-graphs
  - term: Kahn's algorithm
    definition: Producing a topological order by repeatedly taking a vertex with no remaining incoming edges and removing its outgoing edges. If vertices remain, the graph has a cycle.
    lesson: u7-graphs
