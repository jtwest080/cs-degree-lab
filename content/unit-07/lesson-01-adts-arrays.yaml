id: u7-adts-arrays
title: Abstract Data Types and Dynamic Arrays
minutes: 50
objective: |
  Separate **what** a data structure does (its **abstract data type**) from **how** it does it (its implementation), and build a **dynamic array**, the structure behind Python's `list`, explaining with **amortised analysis** why `append` is O(1) on average even though it sometimes copies everything.
outcomes:
  - Explain the difference between an abstract data type and a data structure that implements it
  - Implement the same ADT in two ways and compare their costs
  - Describe how a fixed-size array is stored in memory and why indexing is O(1)
  - Build a dynamic array that grows by doubling, and count the work it does
  - Use amortised analysis to explain why append is O(1) on average
  - Predict the cost of common list operations, such as inserting at the front

sections:
  - heading: Welcome to Data Structures II
    body: |
      In Unit 3 you *used* Python's built-in structures: lists, dictionaries, sets and tuples. In this unit you'll *build* them, and some that Python doesn't include, from the ground up. Why build something Python already provides?

      - **To choose well.** The right data structure can turn a program that takes hours into one that takes a second. You can only choose well if you know what each structure costs, and you understand costs best by building the structure.
      - **To build what isn't provided.** Real systems need priority queues, trees, graphs and caches tailored to the problem.
      - **Because interviews and exams expect it.** Data structures are the core of a CS degree, and the most common topic in technical interviews.

      Each lesson follows the same pattern: what the structure is for, how it works, its costs in Big O (Lesson 4.2), and how to build it as a class (Unit 5).

  - heading: Abstract data types
    body: |
      Think of a car. To drive, you need to know its **interface**: steering wheel, pedals, gear stick. You don't need to know whether the engine is petrol, diesel or electric. Different engines can sit behind the same interface.

      An **abstract data type (ADT)** is the interface of a collection: **which operations it supports and what they mean**, with nothing said about how they work. A **data structure** is a concrete way of implementing an ADT in memory.

      | ADT | Operations | Possible implementations |
      |---|---|---|
      | List | get/set by position, insert, remove, length | dynamic array, linked list |
      | Stack | push, pop, peek | dynamic array, linked list |
      | Queue | enqueue, dequeue | circular array, linked list |
      | Map (dictionary) | put, get, delete by key | hash table, binary search tree |
      | Priority queue | insert, remove smallest | heap, sorted list |

      This is encapsulation (Lesson 5.4) applied to collections. Code that uses a Map only calls its operations, so you can swap a slow implementation for a fast one without changing that code. The choice of implementation decides the **cost** of each operation, and that's what this unit is about.

  - heading: Arrays, the foundation
    body: |
      Underneath almost every data structure is the **array**: a fixed number of slots in one **contiguous** block of memory (Lesson 1.5). If each slot takes 8 bytes and the array starts at address 1000, then slot i is at address 1000 + 8 × i. The computer finds any slot with one multiplication and one addition, however big the array is, so **indexing is O(1)**. This is also why indexes start at 0 (Lesson 3.1).

      The catch: an array's size is fixed when it's created, because the memory just after it may be in use by something else. To make it bigger, you must allocate a **new, larger** block and **copy** every element across, which is O(n).

      Python hides raw arrays from you, so in this unit we'll **simulate** one with a list of a fixed length, such as `[None] * capacity`, and promise ourselves we'll never call `append` or `insert` on it. Only indexing and assignment, which are O(1), are allowed.

  - heading: The dynamic array
    body: |
      A Python `list` can grow forever, yet indexing is O(1). It's built on an array using a simple trick. A **dynamic array** keeps:

      - an underlying array with some **capacity** (the number of slots), and
      - a **size** (how many slots are actually in use).

      To append, put the new item in slot `size` and add 1 to size. If the array is full, first allocate a new array with **double** the capacity, copy everything across, and then append. Most appends are a single O(1) step; occasionally one append costs O(n) for the copy.

      ```text
      capacity 4: [a][b][c][d]           full, append e
      capacity 8: [a][b][c][d][e][ ][ ][ ]  copied 4, then added e
      ```

  - heading: Amortised analysis
    body: |
      If some appends cost O(n), is append O(n)? In the worst case, a *single* append is. But look at a whole **sequence** of n appends, starting from capacity 1. Copies happen when the size reaches 1, 2, 4, 8, ..., so the total number of elements copied is

      1 + 2 + 4 + ... + n/2 + ... < 2n

      (each power of two is more than the sum of all the smaller ones; you proved sums like this in Lesson 6.5). So n appends do fewer than n placements plus 2n copies, about **3 steps per append on average**. We say append is **amortised O(1)**: expensive operations are rare enough that their cost, spread across all operations, is a constant per operation.

      An analogy: a monthly £30 train pass. One day costs £30, the other 29 days cost nothing. Averaged over the month it's £1 a day.

      **Doubling is essential.** Suppose instead the array grows by a fixed 10 slots each time. Then copies happen every 10 appends, copying 10, 20, 30, ... elements, totalling about n²/20. That's O(n) per append on average, so a million appends would take around 50 billion copies. Growing **by a constant factor** (Python uses about 1.125, others use 1.5 or 2) is what keeps appends amortised O(1).

  - heading: The cost of list operations
    body: |
      Knowing that a list is a dynamic array explains every cost in this table:

      | Operation | Cost | Why |
      |---|---|---|
      | `a[i]`, `a[i] = x` | O(1) | address arithmetic |
      | `a.append(x)` | amortised O(1) | occasional doubling |
      | `a.pop()` (from the end) | O(1) | nothing moves |
      | `a.insert(0, x)`, `a.pop(0)` | O(n) | every element shifts one slot |
      | `a.insert(i, x)`, `del a[i]` | O(n − i) | the elements after i shift |
      | `x in a`, `a.index(x)` | O(n) | linear search |
      | `a[i:j]` | O(j − i) | copies the slice |

      So a list is a great **stack** (add and remove at the end) but a terrible **queue** (remove from the front). The next two lessons build structures for each job.

examples:
  - title: One ADT, two implementations
    intro: A Bag (a multiset) built two ways, with the same interface.
    code: |
      class ListBag:
          def __init__(self):
              self._items = []
          def add(self, x):
              self._items.append(x)
          def count(self, x):
              return self._items.count(x)
          def __len__(self):
              return len(self._items)

      class CountBag:
          def __init__(self):
              self._counts = {}
              self._size = 0
          def add(self, x):
              self._counts[x] = self._counts.get(x, 0) + 1
              self._size += 1
          def count(self, x):
              return self._counts.get(x, 0)
          def __len__(self):
              return self._size

      for bag in [ListBag(), CountBag()]:
          for word in "the cat and the hat and the bat".split():
              bag.add(word)
          print(type(bag).__name__, len(bag), bag.count("the"), bag.count("dog"))
    output: |
      ListBag 8 3 0
      CountBag 8 3 0
    lines:
      - line: 1-9
        note: "ListBag stores every item: `add` is O(1) but `count` is O(n), a linear search."
      - line: 11-21
        note: "CountBag stores a count per distinct item: `add` and `count` are both O(1) on average, using a dictionary."
      - line: 23-26
        note: "The loop works with either bag, because both implement the same ADT. Code that uses a bag can't tell them apart, except by speed."
  - title: A dynamic array
    intro: Doubling the capacity when full, and counting the copies.
    code: |
      class DynamicArray:
          def __init__(self):
              self._capacity = 1
              self._size = 0
              self._data = [None] * self._capacity
              self.copies = 0

          def append(self, x):
              if self._size == self._capacity:
                  self._resize(2 * self._capacity)
              self._data[self._size] = x
              self._size += 1

          def _resize(self, new_capacity):
              new_data = [None] * new_capacity
              for i in range(self._size):
                  new_data[i] = self._data[i]
                  self.copies += 1
              self._data = new_data
              self._capacity = new_capacity

          def __getitem__(self, i):
              if not 0 <= i < self._size:
                  raise IndexError("index out of range")
              return self._data[i]

          def __len__(self):
              return self._size

      for n in [10, 1000, 1_000_000]:
          a = DynamicArray()
          for i in range(n):
              a.append(i)
          print(f"{n:>9} appends: {a.copies:>9} copies, {a.copies / n:.2f} per append, capacity {a._capacity}")
    output: |2
             10 appends:        15 copies, 1.50 per append, capacity 16
           1000 appends:      1023 copies, 1.02 per append, capacity 1024
        1000000 appends:   1048575 copies, 1.05 per append, capacity 1048576
    lines:
      - line: 3-5
        note: "The simulated fixed-size array: `[None] * capacity`. We only ever index into it."
      - line: 9-10
        note: "Full? Double the capacity first. This is the rare expensive step."
      - line: 11-12
        note: "The common cheap step: one assignment and one addition."
      - line: 14-20
        note: "Resizing allocates a new array and copies every element across: O(n)."
      - line: 22-25
        note: "`__getitem__` (Lesson 5.3) makes `a[i]` work, with a bounds check like a real list."
      - line: 32
        note: "The copies per append stay below 2 however large n gets: amortised O(1)."
  - title: Watching Python's list grow
    intro: Python's own list over-allocates too. `sys.getsizeof` reports how many bytes it's using.
    code: |
      import sys

      a = []
      last = sys.getsizeof(a)
      grew_at = []
      for i in range(100):
          a.append(i)
          size = sys.getsizeof(a)
          if size != last:
              grew_at.append(len(a))
              last = size
      print("first growth at length:", grew_at[0])
      print("fewer than 20 reallocations in 100 appends:", len(grew_at) < 20)
    output: |
      first growth at length: 1
      fewer than 20 reallocations in 100 appends: True
    lines:
      - line: 6-11
        note: "Record each length at which the list's memory size changed, which means it reallocated."
      - line: 12-13
        note: "CPython grows by about 1/8 plus a little each time, rather than doubling. Print `grew_at` to see the exact lengths, which vary between Python versions; the principle is the same: grow by a proportion, rarely."

playground:
  prompt: |
    Compare growth policies. Change `grow` to `lambda c: c + 10` (a fixed amount) and watch the total copies explode as n grows. Then try `lambda c: c * 3 // 2 + 1` (growing by 1.5).
  code: |
    def total_copies(n, grow):
        capacity, size, copies = 1, 0, 0
        for _ in range(n):
            if size == capacity:
                copies += size
                capacity = grow(capacity)
            size += 1
        return copies

    grow = lambda c: c * 2
    for n in [1_000, 10_000, 100_000]:
        print(n, total_copies(n, grow))

exercises:
  - id: set-two-ways
    title: One interface, two implementations
    difficulty: 1
    prompt: |
      A **Set ADT** has the operations `add(x)`, `discard(x)` (remove x if present, otherwise do nothing), `contains(x)` and `__len__`. Implement it twice:

      - `ListSet`, storing the items in a Python list with **no duplicates** (check before adding).
      - `DictSet`, storing each item as a key of a dictionary (the value doesn't matter; use `True`).

      Then write `cost_of_contains(kind)` returning the Big O of `contains` as a string: `"O(n)"` for `"ListSet"` and `"O(1)"` for `"DictSet"`.
    starter: |
      class ListSet:
          pass


      class DictSet:
          pass


      def cost_of_contains(kind):
          pass
    tests:
      - name: both behave like sets
        code: |
          for cls in [ListSet, DictSet]:
              s = cls()
              for x in [3, 1, 3, 2, 1]:
                  s.add(x)
              assert len(s) == 3, f"{cls.__name__}: duplicates should be ignored"
              assert s.contains(2) and not s.contains(5)
              s.discard(2)
              s.discard(99)
              assert len(s) == 2 and not s.contains(2)
      - name: implementations differ
        code: |
          import ast
          tree = ast.parse(source)
          cls = [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef) and n.name == "ListSet"][0]
          assert not any(isinstance(n, (ast.Dict, ast.Set)) for n in ast.walk(cls)), "ListSet should use a list"
          assert not any(isinstance(n, ast.Name) and n.id in ("set", "dict") for n in ast.walk(cls)), "ListSet should use a list"
      - name: costs
        code: |
          assert cost_of_contains("ListSet") == "O(n)" and cost_of_contains("DictSet") == "O(1)"
    hints:
      - "Give each class an `__init__` that creates `self._items = []` or `self._items = {}`."
      - "`ListSet.add`: `if x not in self._items: self._items.append(x)`. `discard`: `if x in self._items: self._items.remove(x)`."
      - "`DictSet.discard` can use `self._items.pop(x, None)`, which does nothing if x is missing."
    solution: |
      class ListSet:
          def __init__(self):
              self._items = []

          def add(self, x):
              if x not in self._items:
                  self._items.append(x)

          def discard(self, x):
              if x in self._items:
                  self._items.remove(x)

          def contains(self, x):
              return x in self._items

          def __len__(self):
              return len(self._items)


      class DictSet:
          def __init__(self):
              self._items = {}

          def add(self, x):
              self._items[x] = True

          def discard(self, x):
              self._items.pop(x, None)

          def contains(self, x):
              return x in self._items

          def __len__(self):
              return len(self._items)


      def cost_of_contains(kind):
          return {"ListSet": "O(n)", "DictSet": "O(1)"}[kind]
    explanation: |
      Both classes implement the same ADT, so any code using them works unchanged. But `ListSet` does a linear search in `add`, `discard` and `contains`, while `DictSet` uses hashing (Lesson 7.5 shows how). Python's built-in `set` is essentially `DictSet` without the values.

  - id: dynamic-array
    title: Build a dynamic array
    difficulty: 2
    prompt: |
      Write a class `DynamicArray` that stores items in a simulated fixed-size array `self._data = [None] * capacity`. **Never** call `append`, `insert`, `extend`, `pop` or `+` on `self._data`: only index into it and replace it with a new array when resizing.

      - `DynamicArray()` starts with capacity 1 and size 0.
      - `append(x)` doubles the capacity when full.
      - `a[i]` and `a[i] = x` work for 0 ≤ i < size and raise `IndexError` otherwise (`__getitem__`, `__setitem__`).
      - `len(a)` is the size; `a.capacity()` returns the capacity.
      - `a.copies` counts every element copied during resizes.
      - Iterating (`for x in a`) yields the items in order (write `__iter__` as a generator using `yield`, or rely on `__getitem__`).
    starter: |
      class DynamicArray:
          pass
    tests:
      - name: append and index
        code: |
          a = DynamicArray()
          assert len(a) == 0 and a.capacity() == 1
          for x in "abcde":
              a.append(x)
          assert len(a) == 5 and a[0] == "a" and a[4] == "e" and a.capacity() == 8
          a[1] = "B"
          assert list(a) == ["a", "B", "c", "d", "e"]
      - name: bounds
        code: |
          a = DynamicArray()
          a.append(1)
          for bad in [1, 5, -1]:
              try:
                  a[bad]
                  assert False, f"a[{bad}] should raise IndexError"
              except IndexError:
                  pass
          try:
              a[3] = 0
              assert False, "Setting out of range should raise IndexError"
          except IndexError:
              pass
      - name: doubling and copies
        code: |
          a = DynamicArray()
          for i in range(1000):
              a.append(i)
          assert a.capacity() == 1024 and a.copies == 1023
          assert sum(a) == sum(range(1000))
      - name: no list growing
        code: |
          import ast
          tree = ast.parse(source)
          for n in ast.walk(tree):
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr in ("append", "insert", "extend", "pop"):
                  base = n.func.value
                  assert not (isinstance(base, ast.Attribute) and base.attr == "_data"), "Don't grow self._data with list methods"
    hints:
      - "Store `self._capacity`, `self._size`, `self._data` and `self.copies` in `__init__`."
      - "In `append`, if `self._size == self._capacity`, make `new = [None] * (2 * self._capacity)`, copy items 0 to size − 1 one at a time (adding 1 to copies each time), then replace `self._data`."
      - "Write a helper `_check(i)` that raises `IndexError` unless `0 <= i < self._size`, and call it in both `__getitem__` and `__setitem__`."
    solution: |
      class DynamicArray:
          def __init__(self):
              self._capacity = 1
              self._size = 0
              self._data = [None] * self._capacity
              self.copies = 0

          def append(self, x):
              if self._size == self._capacity:
                  self._resize(2 * self._capacity)
              self._data[self._size] = x
              self._size += 1

          def _resize(self, new_capacity):
              new_data = [None] * new_capacity
              for i in range(self._size):
                  new_data[i] = self._data[i]
                  self.copies += 1
              self._data = new_data
              self._capacity = new_capacity

          def _check(self, i):
              if not 0 <= i < self._size:
                  raise IndexError("index out of range")

          def __getitem__(self, i):
              self._check(i)
              return self._data[i]

          def __setitem__(self, i, x):
              self._check(i)
              self._data[i] = x

          def __len__(self):
              return self._size

          def capacity(self):
              return self._capacity

          def __iter__(self):
              for i in range(self._size):
                  yield self._data[i]
    explanation: |
      1,000 appends cause 1 + 2 + 4 + ... + 512 = 1,023 copies, about one per append. The `__iter__` generator uses `yield` to hand out one item at a time; Python turns it into an iterator automatically, so `for`, `list()` and `sum()` all work. (Without `__iter__`, Python would fall back on calling `__getitem__` with 0, 1, 2, ... until `IndexError`, which also works.)

  - id: growth-policies
    title: Doubling versus adding
    difficulty: 2
    prompt: |
      Starting from capacity 1 and an empty array, count the total number of element copies caused by `n` appends under two policies:

      - `copies_doubling(n)`: when full, the capacity doubles.
      - `copies_additive(n, k)`: when full, the capacity grows by `k`.

      Simulate (don't build an array: just track `capacity`, `size` and `copies`). When the array is full and holds `size` items, resizing copies `size` items. Then write `average_cost(n, k)` returning a tuple of the average copies per append for each policy, rounded to 1 decimal place.
    starter: |
      def copies_doubling(n):
          pass


      def copies_additive(n, k):
          pass


      def average_cost(n, k):
          pass
    tests:
      - name: doubling
        code: |
          assert copies_doubling(1) == 0 and copies_doubling(2) == 1 and copies_doubling(5) == 7
          assert copies_doubling(1000) == 1023
          assert all(copies_doubling(n) < 2 * n for n in range(1, 3000))
      - name: additive
        code: |
          assert copies_additive(1, 10) == 0
          assert copies_additive(12, 10) == 1 + 11, f"Got {copies_additive(12, 10)}"
          assert copies_additive(100_000, 10) == 499_960_000
      - name: average_cost
        code: |
          assert average_cost(100_000, 10) == (1.3, 4999.6), f"Got {average_cost(100_000, 10)}"
    hints:
      - "Loop n times. If `size == capacity`, add `size` to copies and grow the capacity. Then add 1 to size."
      - "With capacity 1 and k = 10: the 2nd append copies 1 (capacity becomes 11), the 12th copies 11 (capacity becomes 21), and so on."
    solution: |
      def simulate(n, grow):
          capacity, size, copies = 1, 0, 0
          for _ in range(n):
              if size == capacity:
                  copies += size
                  capacity = grow(capacity)
              size += 1
          return copies


      def copies_doubling(n):
          return simulate(n, lambda c: 2 * c)


      def copies_additive(n, k):
          return simulate(n, lambda c: c + k)


      def average_cost(n, k):
          return (round(copies_doubling(n) / n, 1), round(copies_additive(n, k) / n, 1))
    explanation: |
      With 100,000 appends, doubling averages 1.3 copies per append; adding 10 slots at a time averages about 5,000, nearly 4,000 times worse, and the gap grows with n. The additive total is 1 + 11 + 21 + ... ≈ n²/(2k), quadratic. Passing the growth rule as a function (`grow`) lets one simulator test any policy.

  - id: shrinking
    title: Shrinking safely
    difficulty: 3
    prompt: |
      Write a class `Stackish` (a dynamic array that supports adding and removing at the end) with the same rules as `DynamicArray` (only index into `self._data`):

      - `Stackish()`: capacity 1, size 0. `push(x)` doubles when full.
      - `pop()` removes and returns the last item (raise `IndexError` if empty). Set the freed slot to `None`. After removing, if the size is **at most a quarter** of the capacity and the capacity is more than 1, **halve** the capacity (copying the items).
      - `len(s)`, `s.capacity()` and `s.copies` as before.

      Why a quarter and not a half? If you halved when half full, a push and a pop at the boundary would resize every time. Make `thrash_copies(policy)` demonstrate this: create a structure that pushes 8 items, then does 100 rounds of push-then-pop, and returns the copies made during the 100 rounds. `policy` is `"quarter"` (your class) or `"half"`, which behaves the same but halves when the size is at most half the capacity. (Hint: give your class an optional `shrink_at` parameter, default 4, and use `Stackish(shrink_at=2)` for `"half"`.)
    starter: |
      class Stackish:
          pass


      def thrash_copies(policy):
          pass
    tests:
      - name: push and pop
        code: |
          s = Stackish()
          for i in range(10):
              s.push(i)
          assert len(s) == 10 and s.capacity() == 16
          assert [s.pop() for _ in range(3)] == [9, 8, 7]
          try:
              Stackish().pop()
              assert False, "pop on empty should raise IndexError"
          except IndexError:
              pass
      - name: shrinks at a quarter
        code: |
          s = Stackish()
          for i in range(16):
              s.push(i)
          assert s.capacity() == 16
          while len(s) > 4:
              s.pop()
          assert s.capacity() == 8, f"Size 4 of 16 should halve to 8, got {s.capacity()}"
          while len(s) > 0:
              s.pop()
          assert s.capacity() == 1
          s.push("x")
          assert s.pop() == "x"
      - name: no thrashing
        code: |
          assert thrash_copies("quarter") <= 8, f"At most the one initial growth, got {thrash_copies('quarter')}"
          assert thrash_copies("half") >= 800, f"Got {thrash_copies('half')}"
    hints:
      - "Reuse the `_resize(new_capacity)` method from the dynamic array; it works for shrinking too, as long as the new capacity is at least the size."
      - "In `pop`: take `x = self._data[self._size - 1]`, set that slot to None, subtract 1 from size, then `if self._capacity > 1 and self._size <= self._capacity // self._shrink_at: self._resize(self._capacity // 2)`."
      - "With the half policy: after 8 pushes capacity is 8 (full). Push 9 → grow to 16, copying 8. Pop to 8 → 8 ≤ 16 / 2, shrink to 8, copying 8. That repeats every round."
    solution: |
      class Stackish:
          def __init__(self, shrink_at=4):
              self._capacity = 1
              self._size = 0
              self._data = [None]
              self._shrink_at = shrink_at
              self.copies = 0

          def _resize(self, new_capacity):
              new_data = [None] * new_capacity
              for i in range(self._size):
                  new_data[i] = self._data[i]
                  self.copies += 1
              self._data = new_data
              self._capacity = new_capacity

          def push(self, x):
              if self._size == self._capacity:
                  self._resize(2 * self._capacity)
              self._data[self._size] = x
              self._size += 1

          def pop(self):
              if self._size == 0:
                  raise IndexError("pop from empty Stackish")
              self._size -= 1
              x = self._data[self._size]
              self._data[self._size] = None
              if self._capacity > 1 and self._size <= self._capacity // self._shrink_at:
                  self._resize(self._capacity // 2)
              return x

          def __len__(self):
              return self._size

          def capacity(self):
              return self._capacity


      def thrash_copies(policy):
          s = Stackish(shrink_at=4 if policy == "quarter" else 2)
          for i in range(8):
              s.push(i)
          before = s.copies
          for i in range(100):
              s.push(i)
              s.pop()
          return s.copies - before
    explanation: |
      Shrinking at a quarter leaves room to grow *and* to shrink before the next resize: after halving, the array is half full, so at least n/4 more operations must happen before another resize. That keeps both push and pop amortised O(1). Shrinking at a half creates a boundary where alternating operations resize every time, costing O(n) each, a problem known as **thrashing**. Setting freed slots to `None` lets Python reclaim the removed objects' memory.

  - id: array-list
    title: Insert and delete by shifting
    difficulty: 2
    prompt: |
      Write `ArrayList`, a list backed by a simulated array with a fixed `capacity` given to the constructor (no resizing needed; raise `OverflowError` if it's full). Track `moves`, the number of elements shifted.

      - `insert(i, x)`: insert x at position i (0 ≤ i ≤ size), shifting items i, i + 1, ... one place to the right, **starting from the end**. Raise `IndexError` for a bad i.
      - `delete(i)`: remove and return the item at i (0 ≤ i < size), shifting later items left.
      - `to_list()`: the items as an ordinary Python list.

      Each shift of one element counts as one move.
    starter: |
      class ArrayList:
          def __init__(self, capacity):
              self._data = [None] * capacity
              self._size = 0
              self.moves = 0
    tests:
      - name: insert
        code: |
          a = ArrayList(10)
          a.insert(0, "c")
          a.insert(0, "a")
          a.insert(1, "b")
          a.insert(3, "d")
          assert a.to_list() == ["a", "b", "c", "d"]
          assert a.moves == 0 + 1 + 1 + 0, f"moves = {a.moves}"
      - name: delete
        code: |
          a = ArrayList(10)
          for i, x in enumerate("abcde"):
              a.insert(i, x)
          assert a.delete(0) == "a" and a.moves == 4
          assert a.delete(3) == "e" and a.moves == 4
          assert a.to_list() == ["b", "c", "d"]
      - name: errors
        code: |
          a = ArrayList(2)
          a.insert(0, 1)
          a.insert(1, 2)
          for bad in [lambda: a.insert(0, 3), lambda: a.delete(2), lambda: ArrayList(5).insert(1, 0)]:
              try:
                  bad()
                  assert False, "Should raise"
              except (OverflowError, IndexError):
                  pass
      - name: front inserts are quadratic
        code: |
          a = ArrayList(1000)
          for i in range(1000):
              a.insert(0, i)
          assert a.moves == 999 * 1000 // 2
    hints:
      - "To insert at i, loop `for j in range(self._size, i, -1): self._data[j] = self._data[j - 1]`, counting each move. Going right to left means you never overwrite an item before moving it."
      - "To delete at i, save the item, then loop `for j in range(i, self._size - 1): self._data[j] = self._data[j + 1]`, then clear the last slot."
    solution: |
      class ArrayList:
          def __init__(self, capacity):
              self._data = [None] * capacity
              self._size = 0
              self.moves = 0

          def insert(self, i, x):
              if self._size == len(self._data):
                  raise OverflowError("ArrayList is full")
              if not 0 <= i <= self._size:
                  raise IndexError("bad insert position")
              for j in range(self._size, i, -1):
                  self._data[j] = self._data[j - 1]
                  self.moves += 1
              self._data[i] = x
              self._size += 1

          def delete(self, i):
              if not 0 <= i < self._size:
                  raise IndexError("bad delete position")
              x = self._data[i]
              for j in range(i, self._size - 1):
                  self._data[j] = self._data[j + 1]
                  self.moves += 1
              self._size -= 1
              self._data[self._size] = None
              return x

          def to_list(self):
              return [self._data[i] for i in range(self._size)]
    explanation: |
      Inserting at position i moves size − i elements, so inserting at the front is O(n), and building a list by inserting 1,000 items at the front takes 0 + 1 + ... + 999 ≈ n²/2 moves. That's exactly why `list.insert(0, x)` and `list.pop(0)` are slow, and why Lesson 7.3 builds a better queue.

commonMistakes:
  - title: Confusing the ADT with one implementation
    explanation: |
      "A stack" doesn't mean "a list". It's a set of operations that could be built on a list, a linked list or something else. Design code against the operations, not the storage.
  - title: Calling append amortised O(1) "always O(1)"
    explanation: |
      Any single append can cost O(n) when it triggers a resize. The guarantee is about the **average** over a sequence. That matters for real-time systems, where one slow operation can be a problem.
  - title: Growing by a fixed amount
    explanation: |
      Adding k slots each time makes n appends cost O(n²/k). Grow by a constant **factor** instead.
  - title: Shrinking at half full
    explanation: |
      It causes thrashing: alternating push and pop at the boundary resizes every time. Shrink at a quarter.
  - title: Using list.pop(0) as a queue
    explanation: |
      Removing from the front of a dynamic array shifts every remaining element, O(n) each time. Use `collections.deque` (Lesson 7.3).

summary:
  - "An **abstract data type** says *what* operations a collection supports; a **data structure** says *how* they're implemented and what they cost."
  - "An **array** is contiguous fixed-size memory with O(1) indexing; growing it means allocating and copying."
  - "A **dynamic array** (Python's list) doubles its capacity when full, so append is **amortised O(1)**: n appends cost O(n) in total."
  - "Grow by a constant factor, never a constant amount; shrink at a quarter full to avoid thrashing."
  - "List operations at the end are O(1); inserting or deleting near the front shifts elements and costs O(n)."
next: |
  The dynamic array is perfect for adding and removing at one end. **Lesson 7.2** puts that to work as a **stack**, the last-in, first-out structure behind undo buttons, bracket matching, expression evaluation and the call stack you met in Lesson 2.8.

quiz:
  - type: mcq
    question: What is an abstract data type?
    options:
      - A class with no methods
      - A description of a collection's operations and their meaning, without saying how they're implemented
      - A data structure that uses abstract base classes
      - Any type built into Python
    answer: 1
    explanation: An ADT is an interface; data structures are implementations of it.
  - type: mcq
    question: Why is indexing into an array O(1)?
    options:
      - The computer searches from the start very quickly
      - "The address of slot i is start + i × slot size, one calculation whatever the size"
      - Arrays are always small
      - Python caches every index
    answer: 1
    explanation: Contiguous storage makes the address a simple formula.
  - type: mcq
    question: "A dynamic array doubles when full. What is the total number of copies for 1,024 appends starting at capacity 1?"
    options: ["About 1,000", "About 500,000", "About 10", "About 1,000,000"]
    answer: 0
    explanation: "1 + 2 + 4 + ... + 512 = 1,023, about one copy per append."
  - type: mcq
    question: "What does \"amortised O(1)\" mean for append?"
    options:
      - Every single append takes constant time
      - The average cost per append, over any sequence of appends, is bounded by a constant
      - Append is O(1) only for small lists
      - Append never needs to copy
    answer: 1
    explanation: Occasional expensive resizes are paid for by many cheap appends.
  - type: mcq
    question: Which operation on a Python list is O(n)?
    options: ["a[500]", "a.append(x)", "a.pop()", "a.pop(0)"]
    answer: 3
    explanation: Removing the first element shifts every other element left by one.
  - type: mcq
    question: "If a dynamic array grows by a fixed 100 slots each time it's full, n appends cost about:"
    options: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
    answer: 2
    explanation: "Copies of 100, 200, 300, ... add up to about n²/200, which is quadratic."
  - type: code
    question: |
      Write `resizes(n)`: how many times a dynamic array that starts at capacity 1 and doubles when full has to resize during `n` appends.
    starter: |
      def resizes(n):
          pass
    tests:
      - name: resizes works
        code: |
          assert resizes(0) == 0 and resizes(1) == 0 and resizes(2) == 1 and resizes(3) == 2
          assert resizes(1024) == 10 and resizes(1025) == 11
    solution: |
      def resizes(n):
          capacity, count = 1, 0
          while capacity < n:
              capacity *= 2
              count += 1
          return count
