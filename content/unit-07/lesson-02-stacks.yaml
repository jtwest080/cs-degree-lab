id: u7-stacks
title: Stacks
minutes: 50
objective: |
  Build a **stack**, the last-in, first-out (LIFO) collection, and use it to solve classic problems: **undo and redo**, **bracket matching**, evaluating **postfix expressions**, converting ordinary arithmetic to postfix with the **shunting-yard algorithm**, and replacing recursion with an explicit stack.
outcomes:
  - Describe the stack ADT and its operations push, pop, peek and is_empty
  - Implement a stack class on top of a dynamic array, with O(1) operations
  - Recognise problems where the most recent unfinished item matters, and solve them with a stack
  - Check that brackets are balanced and report where they go wrong
  - Evaluate postfix expressions and convert infix expressions to postfix
  - Explain how the call stack makes recursion work, and simulate recursion with an explicit stack

sections:
  - heading: Last in, first out
    body: |
      Picture a stack of plates. You add a plate to the **top**, and you take a plate from the **top**. The plate you took is always the one most recently added. That's a **stack**: a collection where the last item in is the first item out (**LIFO**).

      The stack ADT has just a few operations:

      | Operation | Meaning |
      |---|---|
      | `push(x)` | put x on top |
      | `pop()` | remove and return the top item (error if empty) |
      | `peek()` | return the top item without removing it (error if empty) |
      | `is_empty()` | is the stack empty? |
      | `len(s)` | how many items |

      There's deliberately **no** way to look at the middle. That restriction is the point: a stack is the right tool whenever only the **most recent unfinished thing** matters.

  - heading: Building a stack
    body: |
      Lesson 7.1 showed that a dynamic array (Python's list) adds and removes at the **end** in amortised O(1). So the end of a list makes a perfect top of stack:

      ```python
      class Stack:
          def __init__(self):
              self._items = []
          def push(self, x):
              self._items.append(x)
          def pop(self):
              if not self._items:
                  raise IndexError("pop from empty stack")
              return self._items.pop()
          def peek(self):
              if not self._items:
                  raise IndexError("peek at empty stack")
              return self._items[-1]
          def is_empty(self):
              return not self._items
          def __len__(self):
              return len(self._items)
      ```

      Every operation is O(1) (push is amortised O(1)). Using the **front** of the list as the top would make push and pop O(n), because every element would shift.

      Why wrap a list in a class at all, when a list already has `append` and `pop`? The class **narrows the interface** (Lesson 5.4): it states the intent ("this is a stack"), prevents accidental access to the middle, and gives clearer errors. In quick scripts, programmers often just use a list as a stack, and that's fine too.

  - heading: Undo, redo and the back button
    body: |
      Every time you edit a document, the editor pushes a record of the change onto an **undo stack**. Pressing undo pops the most recent change and reverses it. Undo again pops the one before. The most recent change is always undone first: LIFO.

      **Redo** uses a second stack. When you undo a change, push it onto the redo stack; redo pops from there and re-applies it (pushing it back onto the undo stack). When you make a **new** edit, the redo stack is cleared, because the old future no longer makes sense.

      A browser's back and forward buttons work the same way, with one stack of pages behind you and one ahead.

  - heading: Matching brackets
    body: |
      Is `{ [ ( ) ] ( ) }` correctly nested? What about `( [ ) ]`? Every compiler checks this, and so does your code editor when it highlights a matching bracket.

      Scan left to right. When you see an **opening** bracket, push it: it's unfinished business. When you see a **closing** bracket, the most recent unfinished opener must match it, so pop and compare. The text is balanced if every closer matches and the stack is empty at the end.

      ```text
      text:   {  [  (  )  ]  (  )  }
      stack:  {  {[ {[( {[ {  {( {  (empty)   balanced
      ```

      For `( [ ) ]`, the `)` arrives while `[` is on top, so it's a mismatch. Counting brackets alone can't catch this; you need to remember their **order**, which is exactly what a stack does.

  - heading: Postfix expressions
    body: |
      We normally write arithmetic in **infix** form, with operators between their operands: `3 + 4 * 2`. That needs precedence rules and brackets. In **postfix** form (also called Reverse Polish Notation), operators come **after** their operands:

      | Infix | Postfix |
      |---|---|
      | 3 + 4 | 3 4 + |
      | 3 + 4 * 2 | 3 4 2 * + |
      | (3 + 4) * 2 | 3 4 + 2 * |

      Postfix needs no brackets and no precedence rules, and a stack evaluates it in one pass: push each **number**; for each **operator**, pop two numbers, apply the operator and push the result. At the end, the single value left is the answer.

      ```text
      3 4 2 * +
      push 3        [3]
      push 4        [3, 4]
      push 2        [3, 4, 2]
      *: pop 2, 4   [3, 8]
      +: pop 8, 3   [11]
      ```

      Careful with order: the **first** number popped is the **right** operand. For `8 2 -`, pop 2 then 8, and compute 8 − 2.

      This is how stack machines work, including the Python virtual machine you met in Lesson 1.6: CPython's bytecode pushes operands and applies operators to the top of a stack.

  - heading: The shunting-yard algorithm
    body: |
      How do you get from infix to postfix? Edsger Dijkstra's **shunting-yard algorithm** (named after railway yards that rearrange carriages) uses a stack of **operators** waiting to be output:

      1. **Number**: send it straight to the output.
      2. **Operator** `o`: while the top of the stack is an operator with **higher or equal** precedence (for left-associative operators like `+ - * /`), pop it to the output. Then push `o`.
      3. **`(`**: push it.
      4. **`)`**: pop operators to the output until you reach `(`, then discard the `(`.
      5. At the end, pop all remaining operators to the output.

      For `3 + 4 * 2`: output 3; push `+`; output 4; `*` has higher precedence than `+`, so push it on top; output 2; at the end pop `*` then `+`. Result: `3 4 2 * +`.

      Together, shunting-yard and postfix evaluation make a calculator. Compilers do something similar when they parse expressions into syntax trees (Lesson 1.6).

  - heading: The call stack and recursion
    body: |
      You met the **call stack** in Lesson 2.8. Each function call pushes a **frame** holding its local variables and where to return to; each return pops it. The most recently called function always finishes first, LIFO again. That's what makes recursion (Lesson 4.5) work: each recursive call gets its own frame on the stack.

      It also means any recursive algorithm can be rewritten with an **explicit stack** that you manage yourself. You did this for graph reachability in Lesson 6.9 to avoid Python's recursion limit. Instead of calling the function on a smaller problem, push the smaller problem onto your stack, and loop while the stack isn't empty. The order of exploration can change slightly, but every subproblem is handled.

examples:
  - title: Balanced brackets
    intro: Openers are pushed; each closer must match the most recent opener.
    code: |
      PAIRS = {")": "(", "]": "[", "}": "{"}

      def balanced(text):
          stack = []
          for ch in text:
              if ch in "([{":
                  stack.append(ch)
              elif ch in PAIRS:
                  if not stack or stack.pop() != PAIRS[ch]:
                      return False
          return not stack

      for t in ["{[()]()}", "([)]", "((", "print(len(x[0]))", ")("]:
          print(f"{t:18} {balanced(t)}")
    output: |
      {[()]()}           True
      ([)]               False
      ((                 False
      print(len(x[0]))   True
      )(                 False
    lines:
      - line: 1
        note: "Map each closer to the opener it needs."
      - line: 6-7
        note: "An opener is unfinished business: push it."
      - line: 8-10
        note: "A closer must match the most recent unmatched opener. If the stack is empty, there's nothing to match. `or` short-circuits (Lesson 2.5), so `pop()` is never called on an empty list."
      - line: 11
        note: "Leftover openers mean something was never closed."
  - title: Evaluating postfix
    intro: Numbers are pushed; operators pop two and push the result.
    code: |
      import operator

      OPS = {"+": operator.add, "-": operator.sub, "*": operator.mul, "/": operator.truediv}

      def eval_postfix(expr):
          stack = []
          for token in expr.split():
              if token in OPS:
                  right = stack.pop()
                  left = stack.pop()
                  stack.append(OPS[token](left, right))
                  print(f"{token}: {left} {token} {right} -> {stack}")
              else:
                  stack.append(int(token))
          return stack.pop()

      print(eval_postfix("5 1 2 + 4 * + 3 -"))
    output: |
      +: 1 + 2 -> [5, 3]
      *: 3 * 4 -> [5, 12]
      +: 5 + 12 -> [17]
      -: 17 - 3 -> [14]
      14
    lines:
      - line: 3
        note: "The `operator` module provides the arithmetic operators as functions, so a dictionary can map each symbol to its function."
      - line: 9-10
        note: "The right operand is popped first, because it was pushed last."
      - line: 13-14
        note: "Anything that isn't an operator is a number."
      - line: 17
        note: "In infix this is 5 + (1 + 2) × 4 − 3 = 14."
  - title: Recursion versus an explicit stack
    intro: Summing a nested list both ways.
    code: |
      def total_recursive(items):
          result = 0
          for x in items:
              result += total_recursive(x) if isinstance(x, list) else x
          return result

      def total_stack(items):
          result = 0
          stack = [items]
          while stack:
              current = stack.pop()
              for x in current:
                  if isinstance(x, list):
                      stack.append(x)
                  else:
                      result += x
          return result

      data = [1, [2, [3, 4]], [[5]], 6]
      print(total_recursive(data), total_stack(data))

      deep = 7
      for _ in range(5000):
          deep = [deep]
      print(total_stack(deep))
      try:
          total_recursive(deep)
      except RecursionError:
          print("recursive version: RecursionError")
    output: |
      21 21
      7
      recursive version: RecursionError
    lines:
      - line: 1-5
        note: "The recursive version from Lesson 4.6: Python's call stack remembers which lists are still being processed."
      - line: 9
        note: "The explicit stack holds lists still waiting to be processed, instead of frames."
      - line: 13-14
        note: "Rather than making a recursive call, push the sublist to deal with later."
      - line: 22-24
        note: "A list nested 5,000 deep. The explicit stack is limited only by memory; the call stack is limited to about 1,000 frames by default."

playground:
  prompt: |
    A tiny browser history with back and forward stacks. Add more `visit`, `back` and `forward` calls and predict each result before running. Notice what happens to the forward stack after a new visit.
  code: |
    back_stack, forward_stack = [], []
    current = "home"

    def visit(page):
        global current
        back_stack.append(current)
        current = page
        forward_stack.clear()

    def back():
        global current
        if back_stack:
            forward_stack.append(current)
            current = back_stack.pop()

    def forward():
        global current
        if forward_stack:
            back_stack.append(current)
            current = forward_stack.pop()

    visit("news"); visit("sport"); back(); back(); forward()
    print("now at", current, "| back:", back_stack, "| forward:", forward_stack)
    visit("weather")
    print("now at", current, "| back:", back_stack, "| forward:", forward_stack)

exercises:
  - id: stack-class
    title: A stack class
    difficulty: 1
    prompt: |
      Write:

      - A custom exception `EmptyStackError`, a subclass of `Exception`.
      - A class `Stack` with `push(x)`, `pop()`, `peek()`, `is_empty()` and `len()` support. `pop` and `peek` raise `EmptyStackError` when the stack is empty. Store items in a list, with the top at the **end**.
      - `__repr__` returning `"Stack([a, b, c])"` with the items bottom to top, using `repr` of each item, so a stack holding 1 and `"x"` gives `Stack([1, 'x'])`.
      - `reverse(seq)`: return a list of the items of `seq` in reverse order, using a `Stack` (push them all, then pop them all).
    starter: |
      class EmptyStackError(Exception):
          pass


      class Stack:
          pass


      def reverse(seq):
          pass
    tests:
      - name: push pop peek
        code: |
          s = Stack()
          assert s.is_empty() and len(s) == 0
          s.push(1); s.push(2); s.push(3)
          assert s.peek() == 3 and len(s) == 3
          assert s.pop() == 3 and s.pop() == 2 and len(s) == 1 and not s.is_empty()
      - name: empty errors
        code: |
          for op in ["pop", "peek"]:
              try:
                  getattr(Stack(), op)()
                  assert False, f"{op} on an empty stack should raise EmptyStackError"
              except EmptyStackError:
                  pass
          assert issubclass(EmptyStackError, Exception)
      - name: repr and reverse
        code: |
          s = Stack()
          s.push(1); s.push("x")
          assert repr(s) == "Stack([1, 'x'])", repr(s)
          assert repr(Stack()) == "Stack([])"
          assert reverse("abc") == ["c", "b", "a"] and reverse([]) == []
      - name: uses the end of the list
        code: |
          import ast
          tree = ast.parse(source)
          for n in ast.walk(tree):
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr in ("insert", "pop") and n.args:
                  arg = n.args[0]
                  assert not (isinstance(arg, ast.Constant) and arg.value == 0), "Use the end of the list as the top: insert(0, …) and pop(0) are O(n)"
    hints:
      - "`__init__` creates `self._items = []`. `push` appends; `pop` checks for empty, then returns `self._items.pop()`; `peek` returns `self._items[-1]`."
      - "`__repr__`: `f\"Stack({self._items!r})\"`. The `!r` uses repr, and a list's repr shows its items with repr."
      - "`reverse`: push every item of seq onto a new Stack, then pop until it's empty, appending each item to a result list."
    solution: |
      class EmptyStackError(Exception):
          pass


      class Stack:
          def __init__(self):
              self._items = []

          def push(self, x):
              self._items.append(x)

          def pop(self):
              if not self._items:
                  raise EmptyStackError("pop from empty stack")
              return self._items.pop()

          def peek(self):
              if not self._items:
                  raise EmptyStackError("peek at empty stack")
              return self._items[-1]

          def is_empty(self):
              return not self._items

          def __len__(self):
              return len(self._items)

          def __repr__(self):
              return f"Stack({self._items!r})"


      def reverse(seq):
          s = Stack()
          for x in seq:
              s.push(x)
          result = []
          while not s.is_empty():
              result.append(s.pop())
          return result
    explanation: |
      Every operation is O(1) because it only touches the end of the list. A custom exception (Lesson 5.8) tells callers precisely what went wrong, and they can catch `EmptyStackError` without catching unrelated `IndexError`s. Reversal is the simplest stack application: LIFO turns any order around.

  - id: bracket-checker
    title: Where do the brackets go wrong?
    difficulty: 2
    prompt: |
      Write `check_brackets(text)` for the brackets `()`, `[]` and `{}`, ignoring every other character. Return `None` if the brackets are balanced. Otherwise return the **index** of the problem:

      - a closing bracket that doesn't match the most recent unclosed opener, or has no opener at all: the index of that closer;
      - otherwise, if openers are left unclosed at the end: the index of the **earliest** unclosed opener.

      Then write `describe(text)`, which returns `"OK"` if balanced, or a two-line string: the text, then a line with spaces and a `^` under the problem position. For example `describe("f(x]")` returns `"f(x]\n   ^"`.
    starter: |
      def check_brackets(text):
          pass


      def describe(text):
          pass
    tests:
      - name: balanced
        code: |
          for t in ["", "abc", "()", "{[()]()}", "print(len(x[0]))", "if (a[i] == b) { c(); }"]:
              assert check_brackets(t) is None, t
      - name: problems
        code: |
          assert check_brackets("(]") == 1
          assert check_brackets("a)") == 1
          assert check_brackets("([)]") == 2
          assert check_brackets("((x)") == 0
          assert check_brackets("x = [1, (2, 3]") == 13
          assert check_brackets("{[(") == 0
          assert check_brackets("()(()") == 2
      - name: describe
        code: |
          assert describe("f(x]") == "f(x]\n   ^", repr(describe("f(x]"))
          assert describe("(a") == "(a\n^"
          assert describe("[ok]") == "OK"
    hints:
      - "Push the **index** of each opener, not just the character, so you know where unclosed ones are. You can look up the character as `text[i]`."
      - "On a closer at index i: if the stack is empty, or `text[stack[-1]]` isn't the matching opener, return i. Otherwise pop."
      - "At the end, if the stack isn't empty, the earliest unclosed opener is at the **bottom**: `stack[0]`."
    solution: |
      PAIRS = {")": "(", "]": "[", "}": "{"}


      def check_brackets(text):
          stack = []
          for i, ch in enumerate(text):
              if ch in "([{":
                  stack.append(i)
              elif ch in PAIRS:
                  if not stack or text[stack[-1]] != PAIRS[ch]:
                      return i
                  stack.pop()
          return stack[0] if stack else None


      def describe(text):
          pos = check_brackets(text)
          if pos is None:
              return "OK"
          return text + "\n" + " " * pos + "^"
    explanation: |
      Pushing positions instead of characters keeps more information for the same cost: the character is still available as `text[i]`. This is how compilers produce messages like "unmatched '(' at line 3". The bottom of the stack holds the oldest unclosed opener, which is usually the most useful one to report.

  - id: postfix
    title: A postfix calculator
    difficulty: 2
    prompt: |
      Write `eval_postfix(expr)` for space-separated postfix expressions with integer operands (possibly negative, like `-3`) and the operators `+`, `-`, `*`, `/` (true division) and `^` (power). Return the result.

      Raise `ValueError` with a helpful message if the expression is malformed: an operator without two operands available, an empty expression, or more than one value left at the end. Raise `ZeroDivisionError` as Python normally would for division by zero.
    starter: |
      def eval_postfix(expr):
          pass
    tests:
      - name: evaluates
        code: |
          assert eval_postfix("3 4 +") == 7
          assert eval_postfix("3 4 2 * +") == 11
          assert eval_postfix("3 4 + 2 *") == 14
          assert eval_postfix("5 1 2 + 4 * + 3 -") == 14
          assert eval_postfix("8 2 -") == 6 and eval_postfix("8 2 /") == 4.0
          assert eval_postfix("2 3 ^ 2 ^") == 64
          assert eval_postfix("-3 4 *") == -12
          assert eval_postfix("42") == 42
      - name: malformed
        code: |
          for bad in ["", "3 +", "+", "3 4", "1 2 + +"]:
              try:
                  eval_postfix(bad)
                  assert False, f"{bad!r} should raise ValueError"
              except ValueError:
                  pass
      - name: division by zero
        code: |
          try:
              eval_postfix("1 0 /")
              assert False
          except ZeroDivisionError:
              pass
    hints:
      - "Check `if token in OPS` before trying `int(token)`, so that `-3` (a number) and `-` (an operator) are told apart: `-` alone is in OPS, `-3` isn't."
      - "Before popping for an operator, check `len(stack) >= 2`, otherwise raise ValueError."
      - "At the end, `len(stack)` must be exactly 1."
    solution: |
      import operator

      OPS = {"+": operator.add, "-": operator.sub, "*": operator.mul, "/": operator.truediv, "^": operator.pow}


      def eval_postfix(expr):
          stack = []
          for token in expr.split():
              if token in OPS:
                  if len(stack) < 2:
                      raise ValueError(f"operator {token!r} needs two operands")
                  right = stack.pop()
                  left = stack.pop()
                  stack.append(OPS[token](left, right))
              else:
                  stack.append(int(token))
          if len(stack) != 1:
              raise ValueError(f"expected one result, found {len(stack)} values")
          return stack[0]
    explanation: |
      Validation is built into the algorithm: a well-formed postfix expression never pops from a stack with fewer than two items and always finishes with exactly one value. That's a tidy invariant (Lesson 6.4): after each token, the stack holds the values of the complete sub-expressions read so far.

  - id: undo-redo
    title: Undo and redo
    difficulty: 2
    prompt: |
      Write a class `Editor` holding a piece of text (initially `""`), with undo and redo built from two stacks:

      - `type(s)`: append the string `s` to the text.
      - `delete(n)`: remove the last `n` characters (or all of them if there are fewer than n).
      - `undo()`: reverse the most recent `type` or `delete` that hasn't been undone. Does nothing if there's nothing to undo.
      - `redo()`: re-apply the most recently undone action. Does nothing if there's nothing to redo. A new `type` or `delete` clears the redo history.
      - `text` is an attribute (or property) holding the current text.

      Store each action so it can be reversed. A neat way: record `("type", s)` or `("delete", removed_text)`.
    starter: |
      class Editor:
          pass
    tests:
      - name: type and delete
        code: |
          e = Editor()
          e.type("Hello")
          e.type(" world")
          e.delete(6)
          assert e.text == "Hello"
          e.delete(100)
          assert e.text == ""
      - name: undo
        code: |
          e = Editor()
          e.type("Hello"); e.type(" world"); e.delete(5)
          e.undo()
          assert e.text == "Hello world"
          e.undo()
          assert e.text == "Hello"
          e.undo(); e.undo()
          assert e.text == ""
      - name: redo
        code: |
          e = Editor()
          e.type("ab"); e.type("cd"); e.undo(); e.undo()
          e.redo()
          assert e.text == "ab"
          e.redo(); e.redo()
          assert e.text == "abcd"
          e.undo()
          e.type("X")
          e.redo()
          assert e.text == "abX", "A new action clears redo"
          e.undo(); e.undo()
          assert e.text == ""
    hints:
      - "Keep `self.text`, `self._undo = []` and `self._redo = []`."
      - "Write private helpers `_apply(action)` and `_reverse(action)`. Applying `(\"type\", s)` adds s; reversing it removes len(s) characters. Applying `(\"delete\", removed)` removes len(removed) characters; reversing it adds removed back."
      - "`type` and `delete` build the action, apply it, push it on the undo stack and clear the redo stack. `undo` pops from undo, reverses, pushes onto redo; `redo` does the opposite."
    solution: |
      class Editor:
          def __init__(self):
              self.text = ""
              self._undo = []
              self._redo = []

          def _apply(self, action):
              kind, s = action
              if kind == "type":
                  self.text += s
              else:
                  self.text = self.text[:len(self.text) - len(s)]

          def _reverse(self, action):
              kind, s = action
              if kind == "type":
                  self.text = self.text[:len(self.text) - len(s)]
              else:
                  self.text += s

          def _do(self, action):
              self._apply(action)
              self._undo.append(action)
              self._redo.clear()

          def type(self, s):
              self._do(("type", s))

          def delete(self, n):
              removed = self.text[max(0, len(self.text) - n):]
              self._do(("delete", removed))

          def undo(self):
              if self._undo:
                  action = self._undo.pop()
                  self._reverse(action)
                  self._redo.append(action)

          def redo(self):
              if self._redo:
                  action = self._redo.pop()
                  self._apply(action)
                  self._undo.append(action)
    explanation: |
      Recording *what was removed* in a delete action is what makes it reversible: you can't undo "delete 5" without knowing which 5 characters went. Real editors use exactly this design (the **command pattern**: each action is an object that can apply and reverse itself). Note the slice `self.text[:len(self.text) - len(s)]`: `self.text[:-len(s)]` would be wrong when `s` is empty, since `[:-0]` is `[:0]`, the empty string.

  - id: shunting-yard
    title: The shunting-yard algorithm
    difficulty: 3
    prompt: |
      Write `to_postfix(expr)`, converting a space-separated infix expression to a space-separated postfix string, using Dijkstra's shunting-yard algorithm with a stack of operators. Support integers, `+ - * /` (left-associative; `* /` bind tighter than `+ -`), `^` (power, binds tightest, and is **right**-associative, so `2 ^ 3 ^ 2` means `2 ^ (3 ^ 2)`), and parentheses. Raise `ValueError` for mismatched parentheses.

      Then write `calculate(expr)` returning the value, using your `to_postfix` and a postfix evaluator (write one, or reuse yours).
    starter: |
      def to_postfix(expr):
          pass


      def calculate(expr):
          pass
    tests:
      - name: precedence
        code: |
          assert to_postfix("3 + 4") == "3 4 +"
          assert to_postfix("3 + 4 * 2") == "3 4 2 * +"
          assert to_postfix("3 * 4 + 2") == "3 4 * 2 +"
          assert to_postfix("8 - 3 - 2") == "8 3 - 2 -", "Left-associative"
      - name: parentheses and power
        code: |
          assert to_postfix("( 3 + 4 ) * 2") == "3 4 + 2 *"
          assert to_postfix("3 + 4 * 2 / ( 1 - 5 ) ^ 2 ^ 3") == "3 4 2 * 1 5 - 2 3 ^ ^ / +"
          assert to_postfix("2 ^ 3 ^ 2") == "2 3 2 ^ ^", "Right-associative"
          for bad in ["( 1 + 2", "1 + 2 )", ") 1 ("]:
              try:
                  to_postfix(bad)
                  assert False, f"{bad!r} should raise ValueError"
              except ValueError:
                  pass
      - name: calculate
        code: |
          assert calculate("3 + 4 * 2") == 11
          assert calculate("( 3 + 4 ) * 2") == 14
          assert calculate("2 ^ 3 ^ 2") == 512
          assert calculate("10 - 4 - 3") == 3
          assert calculate("( 1 + 2 ) * ( 3 + 4 ) / 7") == 3.0
    hints:
      - "Set `PREC = {'+': 1, '-': 1, '*': 2, '/': 2, '^': 3}`. For an operator o, pop while the stack top is an operator (not '(') and either its precedence is greater than o's, or equal and o isn't '^'."
      - "On ')': pop to the output until '('. If the stack runs out first, raise ValueError. Then discard the '('."
      - "At the end, pop everything; finding a '(' left on the stack means a mismatch."
    solution: |
      import operator

      PREC = {"+": 1, "-": 1, "*": 2, "/": 2, "^": 3}
      OPS = {"+": operator.add, "-": operator.sub, "*": operator.mul, "/": operator.truediv, "^": operator.pow}


      def to_postfix(expr):
          output = []
          stack = []
          for token in expr.split():
              if token in PREC:
                  while stack and stack[-1] != "(" and (
                      PREC[stack[-1]] > PREC[token] or (PREC[stack[-1]] == PREC[token] and token != "^")
                  ):
                      output.append(stack.pop())
                  stack.append(token)
              elif token == "(":
                  stack.append(token)
              elif token == ")":
                  while stack and stack[-1] != "(":
                      output.append(stack.pop())
                  if not stack:
                      raise ValueError("unmatched )")
                  stack.pop()
              else:
                  output.append(token)
          while stack:
              op = stack.pop()
              if op == "(":
                  raise ValueError("unmatched (")
              output.append(op)
          return " ".join(output)


      def eval_postfix(expr):
          stack = []
          for token in expr.split():
              if token in OPS:
                  right = stack.pop()
                  left = stack.pop()
                  stack.append(OPS[token](left, right))
              else:
                  stack.append(int(token))
          return stack.pop()


      def calculate(expr):
          return eval_postfix(to_postfix(expr))
    explanation: |
      The operator stack holds operators whose right operand hasn't finished arriving yet. A new operator with lower (or, for left-associative operators, equal) precedence means those waiting operators are complete, so they're released to the output. Right-associative `^` waits instead, so `2 ^ 3 ^ 2` groups as 2^(3^2) = 512. Two stacks and one pass each: a whole calculator in O(n).

commonMistakes:
  - title: Using the front of a list as the top
    explanation: |
      `insert(0, x)` and `pop(0)` shift every element, making each operation O(n). Use the end.
  - title: Popping from an empty stack
    explanation: |
      Always check `is_empty()` (or catch the error) before popping when the stack might be empty, such as when a closing bracket arrives with no opener.
  - title: Getting the operand order wrong
    explanation: |
      In postfix evaluation the first value popped is the **right** operand. Swapping them gives wrong answers for `-` and `/`.
  - title: Forgetting the final check
    explanation: |
      For brackets, the stack must be empty at the end; for postfix, exactly one value must remain. Skipping this accepts `((` or `3 4`.
  - title: Not clearing redo after a new action
    explanation: |
      After undoing and then making a new edit, the old "future" no longer applies. Redoing it would produce nonsense.

summary:
  - "A **stack** is LIFO: `push`, `pop` and `peek` act only on the top, all in O(1) when the top is the end of a dynamic array."
  - "Use a stack when the **most recent unfinished** item matters: undo/redo, back buttons, bracket matching, parsing."
  - "**Postfix** expressions need no brackets and evaluate in one pass with a stack of values."
  - "The **shunting-yard algorithm** converts infix to postfix with a stack of operators, respecting precedence and associativity."
  - "The **call stack** makes recursion work; any recursion can be rewritten as a loop with an explicit stack."
next: |
  A stack serves the newest item first. Often you want the opposite: serve the **oldest** first, like a queue at a shop. **Lesson 7.3** builds **queues** and **deques**, using a circular array to make both ends fast, and uses them to simulate a real queue.

quiz:
  - type: mcq
    question: "You push 1, 2, 3 onto an empty stack, pop once, then push 4. What does pop return now?"
    options: ["1", "2", "3", "4"]
    answer: 3
    explanation: "After popping 3, the stack is [1, 2]; pushing 4 makes 4 the top."
  - type: mcq
    question: Why does a list-based stack use the end of the list as the top?
    options:
      - It's easier to read
      - Appending and popping at the end are O(1); at the front they're O(n)
      - Python lists can't be modified at the front
      - The end of a list uses less memory
    answer: 1
    explanation: Operations at the front shift every element.
  - type: mcq
    question: "What is `6 2 3 + *` in postfix?"
    options: ["15", "30", "11", "20"]
    answer: 1
    explanation: "2 + 3 = 5, then 6 × 5 = 30."
  - type: mcq
    question: "Which string can a simple bracket count (adding 1 for each opener, subtracting 1 for each closer) NOT detect as wrong?"
    options: ["(()", "())", "([)]", ")("]
    answer: 2
    explanation: "The counts balance, but the order is wrong. Only a stack, which remembers which opener is most recent, catches it."
  - type: mcq
    question: "What is `(1 + 2) * 3` in postfix?"
    options: ["1 2 3 + *", "1 2 + 3 *", "+ 1 2 * 3", "1 + 2 3 *"]
    answer: 1
    explanation: "Add 1 and 2 first, then multiply by 3."
  - type: mcq
    question: Why can any recursive function be rewritten using a loop and a stack?
    options:
      - Because loops are always faster
      - Because recursion itself runs on the call stack, and an explicit stack can play the same role
      - Because Python doesn't really support recursion
      - It can't; some recursion is impossible to convert
    answer: 1
    explanation: Each pending recursive call is just a frame on a stack; you can store the same information yourself.
  - type: code
    question: |
      Write `is_palindrome(word)` that pushes the characters of `word` onto a list used as a stack, then pops them off to build the reversed word, and returns True if it equals the original.
    starter: |
      def is_palindrome(word):
          pass
    tests:
      - name: is_palindrome works
        code: |
          assert is_palindrome("racecar") and is_palindrome("") and is_palindrome("a")
          assert not is_palindrome("rocket")
    solution: |
      def is_palindrome(word):
          stack = []
          for ch in word:
              stack.append(ch)
          reversed_word = ""
          while stack:
              reversed_word += stack.pop()
          return reversed_word == word
