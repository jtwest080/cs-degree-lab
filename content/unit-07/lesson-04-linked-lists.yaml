id: u7-linked-lists
title: Linked Lists
minutes: 55
objective: |
  Build **linked lists** from nodes and references: singly linked lists with head and tail, then **doubly linked lists** with sentinel nodes. Learn to traverse, insert, delete and reverse them, use the **two-pointer** tricks for finding the middle and detecting cycles, and compare their costs with dynamic arrays.
outcomes:
  - Represent a sequence as a chain of nodes, each holding a value and a reference to the next node
  - Traverse, search, insert and delete in a singly linked list, handling the empty and one-item cases
  - Make a linked list iterable by writing `__iter__`
  - Reverse a linked list in place, and find its middle with slow and fast pointers
  - Detect a cycle with Floyd's tortoise-and-hare algorithm
  - Build a doubly linked list with sentinels, and compare linked lists with dynamic arrays

sections:
  - heading: Chains of nodes
    body: |
      A dynamic array keeps its items side by side in one block of memory. A **linked list** takes the opposite approach: each item lives in its own small object called a **node**, and each node holds a **reference** to the next node, like a treasure hunt where each clue tells you where the next one is hidden.

      ```text
      head
       ↓
      [ 3 | •]──→[ 8 | •]──→[ 5 | None]
       value next
      ```

      In Python a node is a tiny class:

      ```python
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next
      ```

      Remember from Lesson 3.4 that variables and attributes hold **references** to objects. `node.next` doesn't contain the next node; it refers to it, so nodes can be anywhere in memory. The list itself only needs to remember the first node, the **head**. The last node's `next` is `None`, marking the end.

  - heading: Walking the list
    body: |
      To visit every item, start at the head and follow `next` until you fall off the end:

      ```python
      node = head
      while node is not None:
          print(node.value)
          node = node.next
      ```

      This is the core loop of almost every linked-list operation. There's no way to jump straight to item i, so **finding the item at position i takes O(i) steps**, and searching for a value is O(n). That's the big weakness compared with an array's O(1) indexing.

      You can make a linked list class work with `for` loops by writing `__iter__` as a generator (Lesson 7.1): the same loop, with `yield node.value` instead of `print`.

  - heading: Inserting and deleting
    body: |
      The linked list's strength is changing its shape. To add a value at the **front**, make a new node whose `next` is the old head, and make it the new head:

      ```python
      head = Node(value, head)
      ```

      That's O(1), however long the list: no shifting, unlike `list.insert(0, x)`. Likewise, to insert after a node you already have, or to remove the node after it, you only rewire a couple of references:

      ```text
      insert 7 after the 3:
      [3]──→[8]       becomes      [3]──→[7]──→[8]
      new = Node(7, node.next); node.next = new

      remove the node after the 3:
      [3]──→[7]──→[8] becomes      [3]──→[8]
      node.next = node.next.next
      ```

      The removed node is no longer referenced by anything, so Python's memory manager reclaims it.

      Order matters when rewiring. In the insert, if you set `node.next = new` first, you'd lose your only reference to the rest of the list. A good habit: **draw the boxes and arrows** before writing linked-list code, and check the **edge cases**: an empty list, a one-node list, and changes at the head or the tail.

  - heading: Head and tail
    body: |
      Appending at the **end** needs a walk to the last node: O(n). The fix is to keep a second reference, **tail**, to the last node. Appending becomes O(1):

      ```python
      new = Node(value)
      if self.head is None:      # empty list: new node is both head and tail
          self.head = self.tail = new
      else:
          self.tail.next = new
          self.tail = new
      ```

      The price is that every operation which might change the last node must keep `tail` correct. Most linked-list bugs are a head or tail reference left pointing at the wrong node. A linked list with O(1) push at the front, O(1) append at the back, and O(1) removal from the front is an excellent **queue** (Lesson 7.3).

  - heading: Two pointers
    body: |
      Some neat linked-list techniques use two references moving at different speeds:

      - **Finding the middle**: move `slow` one step and `fast` two steps at a time. When `fast` reaches the end, `slow` is in the middle, after a single pass.
      - **Detecting a cycle**: if a bug makes a node's `next` point back to an earlier node, walking the list loops forever. **Floyd's tortoise and hare** algorithm moves slow and fast pointers the same way. If there's no cycle, fast reaches the end. If there is one, both pointers end up going round the loop, and fast gains one step on slow each round, so it must eventually land exactly on slow. It uses O(1) extra memory, unlike remembering every node visited in a set.

      Reversing a list in place is a different three-pointer dance: walk through the list, turning each `next` arrow round to point backwards, keeping references to the previous, current and next nodes so nothing is lost.

  - heading: Doubly linked lists and sentinels
    body: |
      In a **singly** linked list you can only move forwards, so removing a node requires the node *before* it. A **doubly** linked list gives each node both `next` and `prev` references:

      ```text
      None←[A]⇄[B]⇄[C]→None
      ```

      Now, given any node, you can remove it in O(1) by connecting its neighbours to each other, and you can walk the list backwards. The cost is one extra reference per node and more rewiring per operation.

      Edge cases (empty list, removing the head, removing the tail) make the code fiddly. A classic trick removes them: add two **sentinel** (dummy) nodes that are always present, one before the first real node and one after the last. Every real node then always has a real `prev` and `next`, so the code needs no special cases:

      ```text
      [HEAD]⇄[A]⇄[B]⇄[TAIL]       empty list:  [HEAD]⇄[TAIL]
      ```

      Doubly linked lists power the browser history, the undo history in some editors, and **LRU caches** (Lesson 7.5), which must move any item to the front in O(1).

  - heading: Linked list or dynamic array?
    body: |
      | Operation | Dynamic array | Linked list (head, tail, doubly) |
      |---|---|---|
      | Get item i | O(1) | O(i) |
      | Add or remove at the end | amortised O(1) | O(1) |
      | Add or remove at the front | O(n) | O(1) |
      | Insert or remove next to a node you hold | O(n) | O(1) |
      | Search for a value | O(n) | O(n) |
      | Memory per item | the item | the item plus one or two references |

      In practice, dynamic arrays win more often than the table suggests. Their items sit together in memory, so the CPU cache (Lesson 1.5) loads many at once; a linked list's nodes are scattered, so walking one causes many slow trips to main memory. Python's own `list` is an array for this reason. Choose a linked list when you genuinely need fast insertion and removal **in the middle** at positions you already hold, or a structure that can grow at both ends with no occasional resize pause. Linked structures are also the basis of the trees and graphs in the rest of this unit.

examples:
  - title: A singly linked list
    intro: Nodes, head and tail, iteration and a readable repr.
    code: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next

      class LinkedList:
          def __init__(self):
              self.head = None
              self.tail = None
              self._size = 0

          def push_front(self, value):
              self.head = Node(value, self.head)
              if self.tail is None:
                  self.tail = self.head
              self._size += 1

          def append(self, value):
              new = Node(value)
              if self.head is None:
                  self.head = self.tail = new
              else:
                  self.tail.next = new
                  self.tail = new
              self._size += 1

          def __iter__(self):
              node = self.head
              while node is not None:
                  yield node.value
                  node = node.next

          def __len__(self):
              return self._size

          def __repr__(self):
              return " -> ".join(str(v) for v in self) or "(empty)"

      lst = LinkedList()
      print(lst)
      for x in [8, 5]:
          lst.append(x)
      lst.push_front(3)
      print(lst, "| length", len(lst), "| 5 in list:", 5 in lst)
    output: |
      (empty)
      3 -> 8 -> 5 | length 3 | 5 in list: True
    lines:
      - line: 12-16
        note: "Pushing at the front is O(1). If the list was empty, the new node is also the tail."
      - line: 18-25
        note: "Appending is O(1) thanks to the tail reference. The empty case must set both head and tail."
      - line: 27-31
        note: "A generator walks the chain. Once `__iter__` exists, `for`, `join` and even `in` work, because `in` falls back on iterating."
      - line: 37
        note: "`\" -> \".join(...)` gives an empty string for an empty list, and `or` replaces it with \"(empty)\"."
  - title: Removing and reversing
    intro: Rewiring references, with the head as a special case.
    code: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next

      def from_list(values):
          head = None
          for v in reversed(values):
              head = Node(v, head)
          return head

      def show(head):
          out = []
          while head:
              out.append(str(head.value))
              head = head.next
          return " -> ".join(out) or "(empty)"

      def remove_first(head, value):
          if head is None:
              return None
          if head.value == value:
              return head.next
          node = head
          while node.next is not None and node.next.value != value:
              node = node.next
          if node.next is not None:
              node.next = node.next.next
          return head

      def reverse(head):
          prev = None
          while head is not None:
              head.next, prev, head = prev, head, head.next
          return prev

      h = from_list([1, 2, 3, 4])
      h = remove_first(h, 3)
      print(show(h))
      h = remove_first(h, 1)
      print(show(h))
      print(show(reverse(from_list([1, 2, 3, 4]))))
    output: |
      1 -> 2 -> 4
      2 -> 4
      4 -> 3 -> 2 -> 1
    lines:
      - line: 6-10
        note: "Building from the end with push-front gives the values in their original order."
      - line: 19-29
        note: "Functions that may change the head return the new head, and callers write `h = remove_first(h, ...)`."
      - line: 22-23
        note: "Removing the head is the special case: the new head is the second node."
      - line: 25-26
        note: "Stop at the node *before* the one to remove, because that's the node whose `next` must change."
      - line: 31-35
        note: "Reversal: tuple assignment (Lesson 2.2) evaluates the right-hand side first, so it turns the arrow round, then advances, without losing any node."
  - title: Slow and fast pointers
    intro: Finding the middle and detecting a cycle.
    code: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next

      def chain(n):
          nodes = [Node(i) for i in range(n)]
          for a, b in zip(nodes, nodes[1:]):
              a.next = b
          return nodes

      def middle(head):
          slow = fast = head
          while fast is not None and fast.next is not None:
              slow = slow.next
              fast = fast.next.next
          return slow.value

      def has_cycle(head):
          slow = fast = head
          while fast is not None and fast.next is not None:
              slow = slow.next
              fast = fast.next.next
              if slow is fast:
                  return True
          return False

      nodes = chain(7)
      print("middle of 0..6:", middle(nodes[0]))
      print("cycle?", has_cycle(nodes[0]))
      nodes[-1].next = nodes[3]
      print("after linking 6 back to 3, cycle?", has_cycle(nodes[0]))
    output: |
      middle of 0..6: 3
      cycle? False
      after linking 6 back to 3, cycle? True
    lines:
      - line: 13-16
        note: "Fast moves twice as far as slow, so when fast reaches the end, slow is halfway."
      - line: 24
        note: "`is` checks that they're the very same node object (Lesson 3.4), not just nodes with equal values."
      - line: 30
        note: "Creating a cycle: the last node now points back into the middle. A simple walk would now loop forever."

playground:
  prompt: |
    Draw it to understand it. This prints each step of reversing a list in place. Change the list and follow how `prev`, `current` and the arrows change.
  code: |
    class Node:
        def __init__(self, value, next=None):
            self.value = value
            self.next = next

    def show(node):
        out = []
        while node:
            out.append(str(node.value))
            node = node.next
        return "[" + " -> ".join(out) + "]"

    head = Node(1, Node(2, Node(3, Node(4))))
    prev, current = None, head
    while current:
        nxt = current.next
        current.next = prev
        prev, current = current, nxt
        print("reversed part:", show(prev), "  still to do:", show(current))

exercises:
  - id: linked-list-basics
    title: A linked list class
    difficulty: 1
    prompt: |
      Write `Node` (attributes `value` and `next`) and `LinkedList` with `head`, `tail` and a size counter:

      - `push_front(value)` and `append(value)`, both O(1).
      - `pop_front()`: remove and return the first value, raising `IndexError` if empty. Keep `tail` correct when the list becomes empty.
      - `__len__`, `__iter__` (a generator), and `to_list()`.
      - `find(value)`: the index of the first node holding `value`, or `-1`.
    starter: |
      class Node:
          pass


      class LinkedList:
          pass
    tests:
      - name: push and iterate
        code: |
          lst = LinkedList()
          assert lst.to_list() == [] and len(lst) == 0 and lst.head is None and lst.tail is None
          lst.append(2); lst.push_front(1); lst.append(3)
          assert lst.to_list() == [1, 2, 3] and list(lst) == [1, 2, 3] and len(lst) == 3
          assert lst.head.value == 1 and lst.tail.value == 3 and lst.tail.next is None
      - name: pop_front
        code: |
          lst = LinkedList()
          lst.append("a"); lst.append("b")
          assert lst.pop_front() == "a" and lst.pop_front() == "b"
          assert lst.head is None and lst.tail is None and len(lst) == 0
          lst.append("c")
          assert lst.to_list() == ["c"] and lst.head is lst.tail
          try:
              LinkedList().pop_front(); assert False
          except IndexError:
              pass
      - name: find
        code: |
          lst = LinkedList()
          for x in [5, 7, 5, 9]:
              lst.append(x)
          assert lst.find(5) == 0 and lst.find(9) == 3 and lst.find(4) == -1
      - name: O(1) at both ends
        code: |
          import time
          lst = LinkedList()
          t = time.time()
          for i in range(100_000):
              lst.append(i)
              lst.push_front(i)
          assert time.time() - t < 3 and len(lst) == 200_000
    hints:
      - "`Node.__init__(self, value, next=None)` stores both attributes."
      - "In `pop_front`, after moving `self.head = self.head.next`, if the head is now None, set `self.tail = None` too."
      - "`find`: walk with an index counter, returning it when `node.value == value`."
    solution: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      class LinkedList:
          def __init__(self):
              self.head = None
              self.tail = None
              self._size = 0

          def push_front(self, value):
              self.head = Node(value, self.head)
              if self.tail is None:
                  self.tail = self.head
              self._size += 1

          def append(self, value):
              new = Node(value)
              if self.head is None:
                  self.head = self.tail = new
              else:
                  self.tail.next = new
                  self.tail = new
              self._size += 1

          def pop_front(self):
              if self.head is None:
                  raise IndexError("pop from empty list")
              value = self.head.value
              self.head = self.head.next
              if self.head is None:
                  self.tail = None
              self._size -= 1
              return value

          def __len__(self):
              return self._size

          def __iter__(self):
              node = self.head
              while node is not None:
                  yield node.value
                  node = node.next

          def to_list(self):
              return list(self)

          def find(self, value):
              for i, v in enumerate(self):
                  if v == value:
                      return i
              return -1
    explanation: |
      With push at the front, append at the back and pop from the front all O(1), this class is already a perfectly good queue. Notice how `find` and `to_list` reuse `__iter__`: once a class is iterable, all of Python's iteration tools work with it.

  - id: insert-remove
    title: Insert, get and remove
    difficulty: 2
    prompt: |
      Extend the idea with a class `SinglyList` (a `Node` class with `value` and `next` is provided; there's a `head` and a size counter, no tail):

      - `get(i)`: the value at index i, raising `IndexError` unless 0 ≤ i < len.
      - `insert(i, value)`: insert so the new value ends up at index i (0 ≤ i ≤ len), raising `IndexError` otherwise. Inserting at 0 changes the head.
      - `remove(value)`: remove the **first** node holding `value` and return True, or return False if it isn't there.
      - `remove_all(value)`: remove **every** node holding `value`, returning how many were removed, in a single pass.
      - `to_list()`.
    starter: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      class SinglyList:
          def __init__(self):
              self.head = None
              self._size = 0

          def __len__(self):
              return self._size
    tests:
      - name: insert and get
        code: |
          s = SinglyList()
          s.insert(0, "b"); s.insert(0, "a"); s.insert(2, "d"); s.insert(2, "c")
          assert s.to_list() == ["a", "b", "c", "d"] and len(s) == 4
          assert s.get(0) == "a" and s.get(3) == "d"
          for bad in [lambda: s.get(4), lambda: s.get(-1), lambda: s.insert(6, "x")]:
              try:
                  bad(); assert False
              except IndexError:
                  pass
      - name: remove
        code: |
          s = SinglyList()
          for i, x in enumerate([1, 2, 3, 2]):
              s.insert(i, x)
          assert s.remove(2) and s.to_list() == [1, 3, 2]
          assert s.remove(1) and s.to_list() == [3, 2]
          assert not s.remove(9) and len(s) == 2
          assert s.remove(2) and s.remove(3) and s.to_list() == [] and s.head is None
      - name: remove_all
        code: |
          s = SinglyList()
          for i, x in enumerate([7, 7, 1, 7, 2, 7]):
              s.insert(i, x)
          assert s.remove_all(7) == 4 and s.to_list() == [1, 2] and len(s) == 2
          assert s.remove_all(5) == 0
          s2 = SinglyList()
          for i in range(3):
              s2.insert(i, 0)
          assert s2.remove_all(0) == 3 and s2.head is None
    hints:
      - "A helper `_node_at(i)` that walks i steps from the head saves repeating the loop in `get` and `insert`. To insert at i > 0, find the node at i − 1 and link the new node after it."
      - "`remove`: handle the head separately; otherwise walk with `node` until `node.next` holds the value, then skip it with `node.next = node.next.next`."
      - "`remove_all`: a dummy node in front of the head removes the special case: `dummy = Node(None, self.head)`. Walk from the dummy; when `node.next.value == value`, skip it (don't advance); otherwise advance. Finally `self.head = dummy.next`."
    solution: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      class SinglyList:
          def __init__(self):
              self.head = None
              self._size = 0

          def __len__(self):
              return self._size

          def _node_at(self, i):
              node = self.head
              for _ in range(i):
                  node = node.next
              return node

          def get(self, i):
              if not 0 <= i < self._size:
                  raise IndexError("index out of range")
              return self._node_at(i).value

          def insert(self, i, value):
              if not 0 <= i <= self._size:
                  raise IndexError("index out of range")
              if i == 0:
                  self.head = Node(value, self.head)
              else:
                  before = self._node_at(i - 1)
                  before.next = Node(value, before.next)
              self._size += 1

          def remove(self, value):
              dummy = Node(None, self.head)
              node = dummy
              while node.next is not None:
                  if node.next.value == value:
                      node.next = node.next.next
                      self.head = dummy.next
                      self._size -= 1
                      return True
                  node = node.next
              return False

          def remove_all(self, value):
              dummy = Node(None, self.head)
              node = dummy
              removed = 0
              while node.next is not None:
                  if node.next.value == value:
                      node.next = node.next.next
                      removed += 1
                  else:
                      node = node.next
              self.head = dummy.next
              self._size -= removed
              return removed

          def to_list(self):
              out = []
              node = self.head
              while node is not None:
                  out.append(node.value)
                  node = node.next
              return out
    explanation: |
      The **dummy node** trick (a temporary sentinel) makes the head an ordinary node with a predecessor, so removing it needs no special case. In `remove_all`, the walker doesn't advance after a removal, because the new `node.next` hasn't been checked yet. That's what makes runs like `7, 7, 7` work correctly in one pass.

  - id: reverse-middle
    title: Reverse and middle
    difficulty: 2
    prompt: |
      These functions work directly on chains of `Node`s (provided). Each takes the head node (possibly `None`).

      - `reverse(head)`: reverse the chain **in place** (no new nodes, no Python lists) and return the new head.
      - `middle(head)`: the value of the middle node, using slow and fast pointers in a single pass. For an even number of nodes, return the **second** of the two middle nodes. Return `None` for an empty chain.
      - `is_palindrome(head)`: True if the values read the same forwards and backwards. Do it in O(1) extra memory: find the middle, reverse the second half, compare, then **restore** the second half so the chain is unchanged afterwards.
    starter: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      def reverse(head):
          pass


      def middle(head):
          pass


      def is_palindrome(head):
          pass
    tests:
      - name: reverse
        code: |
          def build(values):
              head = None
              for v in reversed(values):
                  head = Node(v, head)
              return head
          def values(head):
              out = []
              while head:
                  out.append(head.value); head = head.next
              return out
          assert reverse(None) is None
          assert values(reverse(build([1]))) == [1]
          nodes_before = build([1, 2, 3, 4])
          ids = set()
          n = nodes_before
          while n:
              ids.add(id(n)); n = n.next
          r = reverse(nodes_before)
          assert values(r) == [4, 3, 2, 1]
          n = r
          while n:
              assert id(n) in ids, "Reuse the existing nodes"; n = n.next
      - name: middle
        code: |
          def build(values):
              head = None
              for v in reversed(values):
                  head = Node(v, head)
              return head
          assert middle(None) is None and middle(build([1])) == 1
          assert middle(build([1, 2, 3])) == 2 and middle(build([1, 2, 3, 4])) == 3
          assert middle(build(list(range(101)))) == 50
      - name: palindrome
        code: |
          def build(values):
              head = None
              for v in reversed(values):
                  head = Node(v, head)
              return head
          def values(head):
              out = []
              while head:
                  out.append(head.value); head = head.next
              return out
          for vals, expected in [([], True), ([1], True), ([1, 2, 1], True), ([1, 2, 2, 1], True), ([1, 2], False), (list("racecar"), True), (list("rocket"), False)]:
              h = build(vals)
              assert is_palindrome(h) == expected, vals
              assert values(h) == vals, "The chain must be restored afterwards"
    hints:
      - "`reverse`: `prev = None`; while head: save `nxt = head.next`, set `head.next = prev`, then `prev = head`, `head = nxt`. Return prev."
      - "`middle`: move slow one step and fast two steps while `fast and fast.next`. For [1, 2, 3, 4], slow ends on 3."
      - "`is_palindrome`: take the middle **node** (not value), reverse from there to get the second half reversed, compare it with the first half step by step, then reverse it back and reattach it. The node before the middle still points to the middle node, which is now the tail of the reversed half, so reversing back restores everything."
    solution: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      def reverse(head):
          prev = None
          while head is not None:
              nxt = head.next
              head.next = prev
              prev = head
              head = nxt
          return prev


      def middle_node(head):
          slow = fast = head
          while fast is not None and fast.next is not None:
              slow = slow.next
              fast = fast.next.next
          return slow


      def middle(head):
          node = middle_node(head)
          return node.value if node is not None else None


      def is_palindrome(head):
          if head is None:
              return True
          mid = middle_node(head)
          tail = reverse(mid)
          a, b = head, tail
          result = True
          while b is not None:
              if a.value != b.value:
                  result = False
                  break
              a, b = a.next, b.next
          reverse(tail)
          return result
    explanation: |
      After reversing from the middle, the first half's last node still points at the old middle node, which is now the end of the reversed half, so the two halves meet and comparing until the reversed half runs out works for both odd and even lengths. Reversing that half again puts every arrow back. Leaving inputs unchanged ("restore what you borrow") is an important courtesy in functions that modify data in place.

  - id: cycle-detection
    title: Floyd's cycle detection
    difficulty: 3
    prompt: |
      A chain of `Node`s might loop back on itself. Write, using O(1) extra memory (no sets or lists of nodes):

      - `has_cycle(head)`: True if following `next` from head never reaches `None`.
      - `cycle_length(head)`: the number of nodes in the loop, or 0 if there's no cycle. (Once slow and fast meet, they're both inside the loop: keep one still and walk the other round until it returns.)
      - `cycle_start(head)`: the value of the first node of the loop (the node that's reached twice), or `None` if there's no cycle. Floyd's trick: after slow and fast meet, put one pointer back at the head and move both one step at a time; they meet exactly at the start of the loop.
    starter: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      def has_cycle(head):
          pass


      def cycle_length(head):
          pass


      def cycle_start(head):
          pass
    tests:
      - name: no cycle
        code: |
          def chain(n):
              nodes = [Node(i) for i in range(n)]
              for a, b in zip(nodes, nodes[1:]):
                  a.next = b
              return nodes
          for n in [0, 1, 2, 7]:
              nodes = chain(n)
              head = nodes[0] if nodes else None
              assert not has_cycle(head) and cycle_length(head) == 0 and cycle_start(head) is None
      - name: cycles
        code: |
          def chain(n):
              nodes = [Node(i) for i in range(n)]
              for a, b in zip(nodes, nodes[1:]):
                  a.next = b
              return nodes
          for n in range(1, 25):
              for k in range(n):
                  nodes = chain(n)
                  nodes[-1].next = nodes[k]
                  assert has_cycle(nodes[0]), (n, k)
                  assert cycle_length(nodes[0]) == n - k, (n, k)
                  assert cycle_start(nodes[0]) == k, (n, k)
      - name: O(1) memory
        code: |
          import ast
          tree = ast.parse(source)
          bad = [n for n in ast.walk(tree) if isinstance(n, (ast.Set, ast.List, ast.Dict, ast.SetComp, ast.ListComp, ast.DictComp))]
          assert not bad and "set(" not in source and "dict(" not in source, "Use pointers only, no collections of nodes"
    hints:
      - "Write a helper `meeting_point(head)` that runs slow (1 step) and fast (2 steps) and returns the node where they meet, or None if fast reaches the end."
      - "`cycle_length`: from the meeting node, walk `p = meet.next` and count steps until `p is meet`."
      - "`cycle_start`: `a = head`, `b = meeting node`; while `a is not b`, advance both by one. Return `a.value`."
    solution: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      def meeting_point(head):
          slow = fast = head
          while fast is not None and fast.next is not None:
              slow = slow.next
              fast = fast.next.next
              if slow is fast:
                  return slow
          return None


      def has_cycle(head):
          return meeting_point(head) is not None


      def cycle_length(head):
          meet = meeting_point(head)
          if meet is None:
              return 0
          length = 1
          p = meet.next
          while p is not meet:
              p = p.next
              length += 1
          return length


      def cycle_start(head):
          meet = meeting_point(head)
          if meet is None:
              return None
          a, b = head, meet
          while a is not b:
              a, b = a.next, b.next
          return a.value
    explanation: |
      Why does the start-finding trick work? Say the loop starts μ steps from the head and has length λ. When the pointers meet, slow has walked d steps and fast 2d; fast's extra d steps were whole laps of the loop, so d is a multiple of λ. Now pointer A starts at the head and B at the meeting point (d steps from the head). After μ more steps, A is at the loop start. B is μ + d steps from the head: the loop start plus a whole number of laps, so it's at the loop start too, and they meet there. Floyd's algorithm is also used to detect cycles in random number generators and in some factoring algorithms (Unit 16).

  - id: doubly-linked
    title: A doubly linked list with sentinels
    difficulty: 3
    prompt: |
      Write `DNode` (with `value`, `prev`, `next`) and `DoublyLinkedList`, using two sentinel nodes `self._head` and `self._tail` that are always present (empty list: `_head.next is _tail` and `_tail.prev is _head`). With sentinels, **none** of your methods should need an `if` to handle an empty list or the ends, apart from raising errors.

      - `push_front(value)` and `push_back(value)`: add a value and **return its node**.
      - `pop_front()` and `pop_back()`: remove and return a value (raise `IndexError` if empty).
      - `remove(node)`: unlink the given node in O(1) and return its value.
      - `move_to_front(node)`: move an existing node to the front in O(1).
      - `__len__`, `__iter__` (front to back) and `backwards()` (a generator, back to front).
    starter: |
      class DNode:
          pass


      class DoublyLinkedList:
          pass
    tests:
      - name: both ends
        code: |
          d = DoublyLinkedList()
          assert list(d) == [] and len(d) == 0
          d.push_back(2); d.push_front(1); d.push_back(3)
          assert list(d) == [1, 2, 3] and list(d.backwards()) == [3, 2, 1] and len(d) == 3
          assert d.pop_front() == 1 and d.pop_back() == 3 and list(d) == [2]
          assert d.pop_back() == 2 and len(d) == 0
          assert d._head.next is d._tail and d._tail.prev is d._head
          for op in ["pop_front", "pop_back"]:
              try:
                  getattr(d, op)(); assert False
              except IndexError:
                  pass
      - name: remove and move by node
        code: |
          d = DoublyLinkedList()
          nodes = {x: d.push_back(x) for x in "abcde"}
          assert d.remove(nodes["c"]) == "c" and list(d) == ["a", "b", "d", "e"]
          d.move_to_front(nodes["e"])
          assert list(d) == ["e", "a", "b", "d"] and list(d.backwards()) == ["d", "b", "a", "e"]
          d.move_to_front(nodes["e"])
          assert list(d) == ["e", "a", "b", "d"]
          d.remove(nodes["a"]); d.remove(nodes["e"]); d.remove(nodes["d"]); d.remove(nodes["b"])
          assert list(d) == [] and len(d) == 0
      - name: fast
        code: |
          import time
          d = DoublyLinkedList()
          nodes = [d.push_back(i) for i in range(50_000)]
          t = time.time()
          for node in nodes[::2]:
              d.remove(node)
          for node in nodes[1::4]:
              d.move_to_front(node)
          assert time.time() - t < 2 and len(d) == 25_000
    hints:
      - "A private helper `_insert_after(node, new)` sets `new.prev = node`, `new.next = node.next`, then `node.next.prev = new` and `node.next = new`. `push_front` inserts after `_head`; `push_back` inserts after `_tail.prev`."
      - "`_unlink(node)`: `node.prev.next = node.next` and `node.next.prev = node.prev`. Because of the sentinels, both neighbours always exist."
      - "`move_to_front(node)`: unlink it, then insert it after `_head`. Keep the size correct."
    solution: |
      class DNode:
          def __init__(self, value=None):
              self.value = value
              self.prev = None
              self.next = None


      class DoublyLinkedList:
          def __init__(self):
              self._head = DNode()
              self._tail = DNode()
              self._head.next = self._tail
              self._tail.prev = self._head
              self._size = 0

          def _insert_after(self, node, new):
              new.prev = node
              new.next = node.next
              node.next.prev = new
              node.next = new
              self._size += 1
              return new

          def _unlink(self, node):
              node.prev.next = node.next
              node.next.prev = node.prev
              self._size -= 1
              return node.value

          def push_front(self, value):
              return self._insert_after(self._head, DNode(value))

          def push_back(self, value):
              return self._insert_after(self._tail.prev, DNode(value))

          def pop_front(self):
              if self._size == 0:
                  raise IndexError("pop from empty list")
              return self._unlink(self._head.next)

          def pop_back(self):
              if self._size == 0:
                  raise IndexError("pop from empty list")
              return self._unlink(self._tail.prev)

          def remove(self, node):
              return self._unlink(node)

          def move_to_front(self, node):
              self._unlink(node)
              self._insert_after(self._head, node)

          def __len__(self):
              return self._size

          def __iter__(self):
              node = self._head.next
              while node is not self._tail:
                  yield node.value
                  node = node.next

          def backwards(self):
              node = self._tail.prev
              while node is not self._head:
                  yield node.value
                  node = node.prev
    explanation: |
      Two tiny helpers, `_insert_after` and `_unlink`, do all the rewiring, and the sentinels mean every real node always has real neighbours, so there are no special cases. Returning the node from `push_*` lets callers keep a "handle" to an item and later remove or move it in O(1). Store those handles in a dictionary and you have the core of an LRU cache, which you'll build in Lesson 7.5.

commonMistakes:
  - title: Losing the rest of the list
    explanation: |
      Overwriting `node.next` before saving it cuts off everything after it. Save `nxt = node.next` first, or use tuple assignment.
  - title: Forgetting the edge cases
    explanation: |
      Test every operation on an empty list, a one-node list, and at the head and tail. Sentinel or dummy nodes remove most of these special cases.
  - title: Leaving tail pointing at a removed node
    explanation: |
      If a list keeps a tail reference, any operation that removes the last node must update it, including popping the only node.
  - title: Comparing nodes with == instead of is
    explanation: |
      Two different nodes can hold equal values. When you mean "the same node", as in cycle detection, use `is`.
  - title: Expecting O(1) indexing
    explanation: |
      Reaching position i means walking i nodes. If you index by position a lot, use a dynamic array instead.

summary:
  - "A **linked list** is a chain of **nodes**, each holding a value and a reference to the next; the list stores the **head** (and often the **tail**)."
  - "Walking the list is O(n) and indexing is O(i), but inserting or removing at the front, or next to a node you hold, is O(1)."
  - "A **tail** reference makes appending O(1); keep it updated whenever the last node changes."
  - "**Slow and fast pointers** find the middle in one pass and detect cycles in O(1) memory (Floyd's algorithm)."
  - "A **doubly linked list** with **sentinels** supports O(1) removal of any node and has no special cases."
  - "Dynamic arrays are usually faster in practice thanks to cache locality; choose linked lists for cheap changes in the middle."
next: |
  Stacks, queues and lists find items by **position**. Most programs need to find things by **key**: a user by username, a word's definition, a product by barcode. **Lesson 7.5** opens up the dictionary and builds a **hash table**, combining arrays, linked lists and the modular arithmetic of Unit 6 to get O(1) lookups on average.

quiz:
  - type: mcq
    question: What does a singly linked list node store?
    options:
      - Only a value
      - A value and a reference to the next node
      - A value and its index
      - A copy of the whole list
    answer: 1
    explanation: Each node knows its value and where the next node is.
  - type: mcq
    question: What does it cost to get the item at position i of a linked list?
    options: ["O(1)", "O(i)", "O(log n)", "O(n²)"]
    answer: 1
    explanation: You must follow i `next` references from the head.
  - type: mcq
    question: "Which operation is O(1) for a linked list but O(n) for a dynamic array?"
    options: ["Reading item 1000", "Inserting at the front", "Searching for a value", "Finding the length (with a counter)"]
    answer: 1
    explanation: "A new head node needs no shifting; an array must move every element."
  - type: mcq
    question: "To insert `new` after `node`, which order is correct?"
    options:
      - "node.next = new, then new.next = node.next"
      - "new.next = node.next, then node.next = new"
      - Either order works
      - "new.next = node, then node.next = new"
    answer: 1
    explanation: Setting node.next first would lose the reference to the rest of the list.
  - type: mcq
    question: "In Floyd's algorithm, why must the fast pointer eventually meet the slow one if there's a cycle?"
    options:
      - Because the list is sorted
      - "Inside the loop, fast gains exactly one step on slow each move, so the gap closes one step at a time and can't jump over"
      - Because fast resets to the head
      - It doesn't always meet it
    answer: 1
    explanation: A gap shrinking by exactly 1 each step must reach 0.
  - type: mcq
    question: What do sentinel nodes in a doubly linked list achieve?
    options:
      - They make the list sorted
      - Every real node always has real neighbours, so insert and remove need no special cases for ends or empty lists
      - They store the length
      - They speed up indexing
    answer: 1
    explanation: The dummy nodes at each end are never removed, so the edge cases disappear.
  - type: code
    question: |
      A `Node` class with `value` and `next` is provided. Write `total(head)` returning the sum of all values in the chain starting at `head` (which may be `None`), using a `while` loop.
    starter: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      def total(head):
          pass
    tests:
      - name: total works
        code: |
          assert total(None) == 0
          assert total(Node(3, Node(8, Node(5)))) == 16
          assert uses_loop(), "Use a while loop"
    solution: |
      class Node:
          def __init__(self, value, next=None):
              self.value = value
              self.next = next


      def total(head):
          result = 0
          while head is not None:
              result += head.value
              head = head.next
          return result
