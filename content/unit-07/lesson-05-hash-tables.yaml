id: u7-hash-tables
title: Hash Tables
minutes: 60
objective: |
  Open up Python's dictionary and build **hash tables** yourself: turn keys into array positions with **hash functions** and modular arithmetic, handle **collisions** by **chaining** and by **open addressing**, keep operations O(1) on average by **resizing** at a sensible **load factor**, and combine a hash table with a linked list to build an **LRU cache**.
outcomes:
  - Explain how a hash table finds a key's slot, and why lookups are O(1) on average
  - Write a polynomial string hash and explain what makes a hash function good
  - Explain why collisions are unavoidable, using the pigeonhole principle and the birthday problem
  - Implement a hash map with separate chaining and resizing
  - Implement open addressing with linear probing, including deletion with tombstones
  - Use hash tables to speed up algorithms, and build an LRU cache with a dictionary and a doubly linked list

sections:
  - heading: Finding things by key
    body: |
      The **map** ADT (also called a dictionary or associative array) stores **key → value** pairs, with operations `put(key, value)`, `get(key)` and `delete(key)`. You've used Python's `dict` since Lesson 3.6, and noted that lookups are fast "thanks to hashing". This lesson shows how.

      Some ways to build a map:

      | Implementation | get | put |
      |---|---|---|
      | Unsorted list of pairs | O(n) | O(n) (check for an existing key) |
      | Sorted list + binary search | O(log n) | O(n) (shifting) |
      | Hash table | **O(1) average** | **O(1) average** |
      | Balanced search tree (Lesson 7.7) | O(log n) | O(log n) |

      The idea behind the hash table: if keys were small integers 0 to m − 1, you could use the key directly as an array index, which is O(1). This is called **direct addressing**. A **hash function** turns *any* key into such an index.

  - heading: Hash functions
    body: |
      A **hash function** maps a key to an integer, its **hash code**. A hash table with m slots (called **buckets**) then uses `hash(key) % m` as the bucket index: the modulo of Lesson 6.8 squeezes any integer into the range 0 to m − 1.

      A good hash function must be:

      - **Deterministic**: the same key always gives the same hash. That's why keys must be **immutable** (Lesson 3.6): if a list's contents changed after it was stored, its hash would change and it could never be found again. Objects you define can be keys if they implement `__hash__` and `__eq__` consistently (Lesson 5.3).
      - **Fast**: hashing happens on every operation.
      - **Spread out**: similar keys should land in very different buckets, so that keys are distributed evenly.

      For strings, adding up the character codes is a poor hash: "stop", "pots" and "tops" all collide. A **polynomial hash** weights each character by its position:

      h = c₀ × bⁿ⁻¹ + c₁ × bⁿ⁻² + ... + cₙ₋₁   (mod m)

      for some base b, often 31. It's computed left to right with `h = (h * b + ord(ch)) % m`, the same pattern as converting digits to a number (Lesson 1.1). Order now matters, so anagrams get different hashes.

      Python's built-in `hash()` does this job for all immutable types. For strings it's **randomised** each time Python starts, to stop attackers choosing keys that all collide and slowing a server to a crawl (a **hash flooding** attack, Unit 16).

  - heading: Collisions are inevitable
    body: |
      Two different keys landing in the same bucket is a **collision**. Can a clever hash function avoid them? No: there are vastly more possible keys (every string!) than buckets, so by the **pigeonhole principle** (Lesson 6.6) some keys must share a bucket.

      And collisions come sooner than you'd think. By the **birthday problem** (Lesson 6.7), with m buckets you expect the first collision after only about √(πm/2) keys: around 40 keys for 1,000 buckets. So every hash table needs a strategy for collisions. There are two main families.

  - heading: Separate chaining
    body: |
      In **separate chaining**, each bucket holds a small list (a "chain") of the key-value pairs that hashed there:

      ```text
      bucket 0: []
      bucket 1: [("cat", 3)]
      bucket 2: [("dog", 7), ("emu", 1)]    ← collision: both hashed to 2
      bucket 3: []
      ```

      - `get(key)`: compute the bucket, then search its chain for the key.
      - `put(key, value)`: search the chain; replace the value if the key is there, otherwise append the pair.
      - `delete(key)`: search the chain and remove the pair.

      Each operation costs O(1) to find the bucket plus the length of the chain. With n keys in m buckets, the **load factor** is α = n / m, and with a good hash function the average chain length is α. So as long as α stays below a constant, operations are **O(1) on average**.

      In the worst case, if every key landed in one bucket, operations would be O(n). A good, randomised hash function makes that astronomically unlikely, unless an attacker can predict it.

  - heading: Resizing
    body: |
      As keys are added, α grows and chains get longer. The fix is the dynamic array's trick (Lesson 7.1): when α passes a threshold (often 0.75), allocate a table with **double** the buckets and **rehash** every key into it. Every key must be reinserted, not copied to the same index, because `hash(key) % m` changes when m changes.

      A resize costs O(n), but doubling means it happens rarely, so `put` stays **amortised O(1)**.

  - heading: Open addressing
    body: |
      **Open addressing** stores entries directly in the array, at most one per slot, with no chains. On a collision, **probe** for another slot. The simplest scheme is **linear probing**: try slot h, then h + 1, h + 2, ..., wrapping around with `% m`.

      - `put`: probe from `hash(key) % m` until you find the key (replace its value) or an empty slot (store it there).
      - `get`: probe until you find the key, or reach an **empty** slot, which proves the key isn't there.

      Deletion is subtle. If you simply empty a slot, you may break the probe sequence of a key stored further along, making it unfindable. Instead, mark the slot with a **tombstone**: "something was here". Searches skip over tombstones; insertions may reuse them.

      Open addressing uses memory compactly and is cache-friendly, since probes read neighbouring slots (Lesson 1.5). But performance degrades sharply as the table fills (long runs of occupied slots form clusters), so it must be resized at a lower load factor, often 0.5 to 0.7. **Python's `dict` uses open addressing** with a cleverer probe sequence, and keeps a separate compact array of entries, which is how it remembers insertion order.

  - heading: Hashing everywhere
    body: |
      Hash tables turn many O(n²) algorithms into O(n). Whenever an algorithm asks "have I seen this before?" or "where is the item with this key?", reach for a set or dict:

      - Removing duplicates, counting (Lesson 3.6's counting pattern), grouping.
      - **Two sum**: does any pair in a list add up to a target? For each number x, check whether `target - x` is in a set of numbers seen so far: O(n) instead of checking all O(n²) pairs.
      - **Memoisation** (Lesson 4.5): a dict of answers already computed.
      - **Caches**: keeping recently used results so they needn't be fetched or computed again.

      A common cache policy is **least recently used (LRU)**: when the cache is full, evict the item that was used longest ago. An LRU cache combines a hash table (find an item by key in O(1)) with a doubly linked list ordered by use (move an item to the front, or remove the back, in O(1)), exactly the list you built in Lesson 7.4. Python's `functools.lru_cache` decorator gives any function this behaviour.

examples:
  - title: Hash functions and buckets
    intro: A bad hash and a polynomial hash on anagrams.
    code: |
      def sum_hash(s, m):
          return sum(ord(ch) for ch in s) % m

      def poly_hash(s, m, base=31):
          h = 0
          for ch in s:
              h = (h * base + ord(ch)) % m
          return h

      words = ["stop", "pots", "tops", "spot", "opts", "post"]
      print("sum hash: ", [sum_hash(w, 101) for w in words])
      print("poly hash:", [poly_hash(w, 101) for w in words])

      buckets = [0] * 10
      for i in range(1000):
          buckets[poly_hash(f"user{i}", 10)] += 1
      print("1000 keys in 10 buckets:", buckets)
    output: |
      sum hash:  [50, 50, 50, 50, 50, 50]
      poly hash: [35, 46, 7, 33, 1, 16]
      1000 keys in 10 buckets: [100, 100, 100, 100, 100, 100, 100, 100, 100, 100]
    lines:
      - line: 1-2
        note: "Adding character codes ignores order, so all anagrams collide."
      - line: 4-8
        note: "The polynomial hash multiplies the running total by the base before adding each character, so position matters. Taking `% m` at each step keeps numbers small (Lesson 6.8)."
      - line: 14-16
        note: "Keys that look alike (user0, user1, ...) still spread evenly across the buckets."
  - title: A chained hash map
    intro: Buckets of [key, value] pairs, with resizing at load factor 0.75.
    code: |
      class HashMap:
          def __init__(self, buckets=4):
              self._buckets = [[] for _ in range(buckets)]
              self._size = 0

          def _bucket(self, key):
              return self._buckets[hash(key) % len(self._buckets)]

          def put(self, key, value):
              bucket = self._bucket(key)
              for pair in bucket:
                  if pair[0] == key:
                      pair[1] = value
                      return
              bucket.append([key, value])
              self._size += 1
              if self._size / len(self._buckets) > 0.75:
                  self._resize(2 * len(self._buckets))

          def get(self, key):
              for k, v in self._bucket(key):
                  if k == key:
                      return v
              raise KeyError(key)

          def _resize(self, n):
              old = self._buckets
              self._buckets = [[] for _ in range(n)]
              for bucket in old:
                  for k, v in bucket:
                      self._buckets[hash(k) % n].append([k, v])
              print(f"  resized to {n} buckets")

      m = HashMap()
      for i, word in enumerate("the quick brown fox jumps over the lazy dog".split()):
          m.put(word, i)
      print(m.get("the"), m.get("dog"), m._size, "keys,", len(m._buckets), "buckets")
    output: |2
        resized to 8 buckets
        resized to 16 buckets
      6 8 8 keys, 16 buckets
    lines:
      - line: 3
        note: "A list comprehension makes separate empty lists. `[[]] * 4` would make four references to the same list (Lesson 3.4)."
      - line: 6-7
        note: "Python's `hash()` gives the hash code; `% len(buckets)` picks the bucket."
      - line: 11-14
        note: "If the key exists, update its value. Pairs are lists, not tuples, so they can be changed."
      - line: 17-18
        note: "Keep the load factor at most 0.75 by doubling."
      - line: 25-31
        note: "Rehash every key: its bucket depends on the number of buckets, so keys can't stay where they were."
      - line: 36
        note: "\"the\" appears twice, so it was updated rather than added: 8 distinct keys, and the second \"the\" (index 6) won."
  - title: Two sum with a set
    intro: Quadratic versus linear.
    code: |
      def two_sum_slow(nums, target):
          checks = 0
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  checks += 1
                  if nums[i] + nums[j] == target:
                      return (nums[i], nums[j]), checks
          return None, checks

      def two_sum_fast(nums, target):
          seen = set()
          checks = 0
          for x in nums:
              checks += 1
              if target - x in seen:
                  return (target - x, x), checks
              seen.add(x)
          return None, checks

      nums = list(range(0, 4000, 2)) + [7]
      print(two_sum_slow(nums, 3997))
      print(two_sum_fast(nums, 3997))
    output: |
      ((3990, 7), 2000990)
      ((3990, 7), 2001)
    lines:
      - line: 1-8
        note: "Checking every pair: about n²/2 checks."
      - line: 13-17
        note: "For each x, the partner it needs is `target - x`. A set answers \"have I seen it?\" in O(1) on average."
      - line: 20-22
        note: "Both find the same pair, but one needs about 2 million checks and the other about 2,000. Multiply n by 10 and the gap grows a hundredfold."

playground:
  prompt: |
    How full can a table get before collisions hurt? This inserts random keys into a linear-probing table and reports the average number of probes per insert at different load factors. Watch it climb steeply past about 0.7.
  code: |
    import random

    def average_probes(m, load):
        random.seed(1)
        table = [None] * m
        total = 0
        n = int(m * load)
        for _ in range(n):
            key = random.random()
            i = hash(key) % m
            probes = 1
            while table[i] is not None:
                i = (i + 1) % m
                probes += 1
            table[i] = key
            total += probes
        return total / n

    for load in [0.25, 0.5, 0.7, 0.8, 0.9, 0.95, 0.99]:
        print(f"load {load:.2f}: {average_probes(10007, load):6.2f} probes per insert")

exercises:
  - id: hashing-apps
    title: Hashing to the rescue
    difficulty: 1
    prompt: |
      Use Python sets and dictionaries to write O(n) versions (on average) of:

      - `first_repeat(items)`: the first item that appears for a second time (the one whose **second** occurrence comes earliest), or `None`.
      - `two_sum(nums, target)`: a tuple of two **positions** `(i, j)` with i < j and `nums[i] + nums[j] == target`, choosing the pair whose j is smallest (and for that j, any valid i). Return `None` if there's no such pair.
      - `group_anagrams(words)`: a list of groups (lists) of words that are anagrams of each other. Each group keeps the words in their original order, and the groups are ordered by their first word's position. Use a dictionary whose key is the sorted letters of the word.
    starter: |
      def first_repeat(items):
          pass


      def two_sum(nums, target):
          pass


      def group_anagrams(words):
          pass
    tests:
      - name: first_repeat
        code: |
          assert first_repeat([3, 1, 4, 1, 5, 3]) == 1 and first_repeat("abcdeb") == "b" and first_repeat([1, 2, 3]) is None
      - name: two_sum
        code: |
          assert two_sum([2, 7, 11, 15], 9) == (0, 1)
          assert two_sum([3, 2, 4], 6) == (1, 2)
          assert two_sum([3, 3], 6) == (0, 1) and two_sum([1, 2], 7) is None
          i, j = two_sum([5, 1, 9, 4, 6], 10)
          assert (i, j) == (1, 2) or (i, j) == (0, 1) or [5, 1, 9, 4, 6][i] + [5, 1, 9, 4, 6][j] == 10 and j == 2
      - name: group_anagrams
        code: |
          assert group_anagrams(["eat", "tea", "tan", "ate", "nat", "bat"]) == [["eat", "tea", "ate"], ["tan", "nat"], ["bat"]]
          assert group_anagrams([]) == []
      - name: fast
        code: |
          import time
          nums = list(range(0, 400_000, 2)) + [7]
          t = time.time()
          assert two_sum(nums, 7 + 399_998 - 2) is not None
          assert first_repeat(list(range(300_000)) + [5]) == 5
          assert time.time() - t < 3, "Use sets and dictionaries, not nested loops"
    hints:
      - "`first_repeat`: keep a `seen` set; return the first item already in it."
      - "`two_sum`: keep a dictionary from value to the position where it was seen. For each j, if `target - nums[j]` is in the dictionary, return `(that position, j)`; then record `nums[j]`."
      - "`group_anagrams`: `key = \"\".join(sorted(word))`; append the word to `groups.setdefault(key, [])`. Dictionaries remember insertion order, so `list(groups.values())` is already in the right order."
    solution: |
      def first_repeat(items):
          seen = set()
          for x in items:
              if x in seen:
                  return x
              seen.add(x)
          return None


      def two_sum(nums, target):
          position = {}
          for j, x in enumerate(nums):
              if target - x in position:
                  return (position[target - x], j)
              position[x] = j
          return None


      def group_anagrams(words):
          groups = {}
          for word in words:
              groups.setdefault("".join(sorted(word)), []).append(word)
          return list(groups.values())
    explanation: |
      Each function makes one pass with O(1) average work per item, so each is O(n). The anagram key is a **canonical form** (Lesson 6.3): every member of a group maps to the same key, which is exactly what a hash table needs. Checking `target - x` *before* recording x stops a number being paired with itself.

  - id: string-hashing
    title: Hash functions and their quality
    difficulty: 2
    prompt: |
      Write:

      - `poly_hash(s, m, base=31)`: the polynomial hash of string s, modulo m, computed left to right with `h = (h * base + ord(ch)) % m`.
      - `bucket_counts(keys, m, hash_fn)`: a list of length m counting how many keys land in each bucket, where `hash_fn(key, m)` gives the bucket.
      - `collisions(keys, m, hash_fn)`: the number of keys that land in a bucket already holding at least one key (so n keys in one bucket give n − 1 collisions).
      - `expected_first_collision(m)`: the birthday-problem estimate √(π × m / 2), rounded to the nearest integer (use `math`).
    starter: |
      import math


      def poly_hash(s, m, base=31):
          pass


      def bucket_counts(keys, m, hash_fn):
          pass


      def collisions(keys, m, hash_fn):
          pass


      def expected_first_collision(m):
          pass
    tests:
      - name: poly_hash
        code: |
          assert poly_hash("", 101) == 0 and poly_hash("a", 101) == 97
          assert poly_hash("ab", 1000) == (97 * 31 + 98) % 1000
          assert poly_hash("stop", 101) != poly_hash("pots", 101)
          assert poly_hash("hello", 10 ** 9 + 7) == (((((104 * 31 + 101) * 31 + 108) * 31 + 108) * 31) + 111) % (10 ** 9 + 7)
      - name: buckets and collisions
        code: |
          sum_hash = lambda s, m: sum(map(ord, s)) % m
          words = ["stop", "pots", "tops", "spot"]
          assert bucket_counts(words, 7, sum_hash).count(4) == 1
          assert collisions(words, 7, sum_hash) == 3
          keys = [f"key{i}" for i in range(500)]
          counts = bucket_counts(keys, 50, poly_hash)
          assert sum(counts) == 500 and len(counts) == 50 and max(counts) <= 20
          assert collisions(keys, 50, poly_hash) == 500 - sum(1 for c in counts if c > 0)
      - name: birthday estimate
        code: |
          assert expected_first_collision(365) == 24 and expected_first_collision(1000) == 40
          assert expected_first_collision(10 ** 6) == 1253
    hints:
      - "`counts = [0] * m`, then add 1 to `counts[hash_fn(k, m)]` for each key."
      - "Collisions: each non-empty bucket with c keys contributes c − 1. That's n minus the number of non-empty buckets."
      - "`round(math.sqrt(math.pi * m / 2))`."
    solution: |
      import math


      def poly_hash(s, m, base=31):
          h = 0
          for ch in s:
              h = (h * base + ord(ch)) % m
          return h


      def bucket_counts(keys, m, hash_fn):
          counts = [0] * m
          for k in keys:
              counts[hash_fn(k, m)] += 1
          return counts


      def collisions(keys, m, hash_fn):
          counts = bucket_counts(keys, m, hash_fn)
          return sum(c - 1 for c in counts if c > 0)


      def expected_first_collision(m):
          return round(math.sqrt(math.pi * m / 2))
    explanation: |
      Measuring the distribution is how hash functions are evaluated in practice: a good one gives bucket counts close to n/m everywhere. Even a perfect hash function produces collisions early, around 1,253 keys for a million buckets, which is why every table needs a collision strategy.

  - id: chained-map
    title: A hash map with chaining
    difficulty: 2
    prompt: |
      Write `ChainedMap`, a map using separate chaining, with buckets stored as a list of lists of `[key, value]` pairs. Use Python's `hash()` and `% number_of_buckets`. Don't use a `dict` or `set` anywhere inside the class.

      - `ChainedMap(buckets=8)`.
      - `put(key, value)`, `get(key, default=None)`, `delete(key)` (raise `KeyError` if missing).
      - `m[key]`, `m[key] = value`, `del m[key]`, `key in m` and `len(m)` (`__getitem__` raises `KeyError` for a missing key).
      - Resize to double the buckets when the load factor would exceed 0.75 after an insertion. `bucket_count()` returns the number of buckets.
      - `keys()`: a list of all keys (any order).
    starter: |
      class ChainedMap:
          pass
    tests:
      - name: put get delete
        code: |
          m = ChainedMap()
          m.put("a", 1); m["b"] = 2; m.put("a", 10)
          assert m.get("a") == 10 and m["b"] == 2 and len(m) == 2
          assert m.get("zz") is None and m.get("zz", 0) == 0
          assert "a" in m and "zz" not in m
          del m["a"]
          assert "a" not in m and len(m) == 1
          for bad in [lambda: m["a"], lambda: m.delete("a")]:
              try:
                  bad(); assert False
              except KeyError:
                  pass
      - name: resizing
        code: |
          m = ChainedMap(buckets=4)
          for i in range(100):
              m[i] = i * i
          assert len(m) == 100 and m.bucket_count() == 256
          assert all(m[i] == i * i for i in range(100))
          assert sorted(m.keys()) == list(range(100))
      - name: collisions handled
        code: |
          class Same:
              def __init__(self, n): self.n = n
              def __hash__(self): return 42
              def __eq__(self, other): return isinstance(other, Same) and self.n == other.n
          m = ChainedMap()
          for i in range(20):
              m[Same(i)] = i
          assert len(m) == 20 and m[Same(7)] == 7
          del m[Same(7)]
          assert Same(7) not in m and m[Same(8)] == 8
      - name: no dict inside
        code: |
          import ast
          tree = ast.parse(source)
          cls = [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef) and n.name == "ChainedMap"][0]
          assert not any(isinstance(n, (ast.Dict, ast.DictComp, ast.Set, ast.SetComp)) for n in ast.walk(cls))
          assert not any(isinstance(n, ast.Name) and n.id in ("dict", "set") for n in ast.walk(cls)), "Build it from lists"
    hints:
      - "`_find(key)` can return `(bucket, index)` where index is the position of the key's pair in its bucket, or −1. Most methods start by calling it."
      - "`put`: if found, update `bucket[index][1]`; otherwise append `[key, value]`, increase the size, and if `size / bucket_count > 0.75`, resize."
      - "`_resize(n)`: build n new empty buckets and reinsert every pair using `hash(key) % n`."
    solution: |
      class ChainedMap:
          def __init__(self, buckets=8):
              self._buckets = [[] for _ in range(buckets)]
              self._size = 0

          def _find(self, key):
              bucket = self._buckets[hash(key) % len(self._buckets)]
              for i, pair in enumerate(bucket):
                  if pair[0] == key:
                      return bucket, i
              return bucket, -1

          def put(self, key, value):
              bucket, i = self._find(key)
              if i >= 0:
                  bucket[i][1] = value
                  return
              bucket.append([key, value])
              self._size += 1
              if self._size / len(self._buckets) > 0.75:
                  self._resize(2 * len(self._buckets))

          def get(self, key, default=None):
              bucket, i = self._find(key)
              return bucket[i][1] if i >= 0 else default

          def delete(self, key):
              bucket, i = self._find(key)
              if i < 0:
                  raise KeyError(key)
              bucket.pop(i)
              self._size -= 1

          def _resize(self, n):
              old = self._buckets
              self._buckets = [[] for _ in range(n)]
              for bucket in old:
                  for key, value in bucket:
                      self._buckets[hash(key) % n].append([key, value])

          def __getitem__(self, key):
              bucket, i = self._find(key)
              if i < 0:
                  raise KeyError(key)
              return bucket[i][1]

          def __setitem__(self, key, value):
              self.put(key, value)

          def __delitem__(self, key):
              self.delete(key)

          def __contains__(self, key):
              return self._find(key)[1] >= 0

          def __len__(self):
              return self._size

          def bucket_count(self):
              return len(self._buckets)

          def keys(self):
              return [key for bucket in self._buckets for key, _ in bucket]
    explanation: |
      The `Same` test class gives every key the same hash, forcing everything into one chain; the map still works, just slowly, because chaining compares keys with `==` after hashing. That's why `__hash__` and `__eq__` must agree (Lesson 5.3): equal objects must have equal hashes, or a lookup would search the wrong bucket. With 100 keys and doubling at 0.75, the table grows 4 → 8 → ... → 256.

  - id: linear-probing
    title: Open addressing with tombstones
    difficulty: 3
    prompt: |
      Write `ProbingMap`, a map using open addressing with linear probing. Store entries in one list `self._slots` where each slot is `None` (never used), the tombstone object `DELETED` (provided), or a `(key, value)` tuple. No dicts, sets, or lists inside slots.

      - `ProbingMap(capacity=8)`.
      - `put(key, value)`: probe from `hash(key) % capacity`. If you find the key, replace its value. Otherwise store it in the **first tombstone** passed, or else the empty slot that ended the search. After inserting, if (size + tombstones) / capacity > 0.5, resize to double the capacity, reinserting live entries only (this clears tombstones).
      - `get(key)`: raise `KeyError` if missing. Searches stop at `None`, not at tombstones.
      - `delete(key)`: replace the entry with `DELETED`; raise `KeyError` if missing.
      - `len(m)`, `key in m`, and `capacity()`.
    starter: |
      DELETED = object()


      class ProbingMap:
          pass
    tests:
      - name: basic operations
        code: |
          m = ProbingMap()
          m.put("a", 1); m.put("b", 2); m.put("a", 3)
          assert m.get("a") == 3 and m.get("b") == 2 and len(m) == 2 and "b" in m
          m.delete("a")
          assert "a" not in m and len(m) == 1
          for bad in [lambda: m.get("a"), lambda: m.delete("a")]:
              try:
                  bad(); assert False
              except KeyError:
                  pass
      - name: deletion keeps probe chains intact
        code: |
          class H:
              def __init__(self, n, h): self.n, self.h = n, h
              def __hash__(self): return self.h
              def __eq__(self, o): return isinstance(o, H) and o.n == self.n
          m = ProbingMap(capacity=16)
          a, b, c = H(1, 3), H(2, 3), H(3, 3)
          m.put(a, "A"); m.put(b, "B"); m.put(c, "C")
          assert [m._slots[i][1] for i in (3, 4, 5)] == ["A", "B", "C"], "Linear probing from slot 3"
          m.delete(b)
          assert m._slots[4] is DELETED
          assert m.get(c) == "C", "A tombstone must not end the search"
          m.put(H(4, 3), "D")
          assert m._slots[4][1] == "D", "Reuse the first tombstone"
      - name: resizing and many operations
        code: |
          import random
          random.seed(10)
          m, model = ProbingMap(), {}
          for _ in range(5000):
              k = random.randint(0, 300)
              if random.random() < 0.3 and k in model:
                  m.delete(k); del model[k]
              else:
                  v = random.random()
                  m.put(k, v); model[k] = v
          assert len(m) == len(model)
          assert all(m.get(k) == v for k, v in model.items())
          assert all((k in m) == (k in model) for k in range(400))
          assert len(m) / m.capacity() <= 0.5
      - name: no dict inside
        code: |
          import ast
          tree = ast.parse(source)
          cls = [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef) and n.name == "ProbingMap"][0]
          assert not any(isinstance(n, (ast.Dict, ast.DictComp, ast.Set, ast.SetComp)) for n in ast.walk(cls))
    hints:
      - "Write `_probe(key)` that walks `i = hash(key) % cap`, then `(i + 1) % cap`, ... It returns `(found_index, insert_index)`: the slot holding the key (or −1), and the slot where the key should go if inserted (the first tombstone seen, else the `None` that stopped the search)."
      - "Keep counts of live entries (`_size`) and tombstones (`_dead`). Replacing a tombstone with an entry reduces `_dead`."
      - "Because the table is at most half full of entries and tombstones, there's always a `None` slot, so the probe loop always ends."
    solution: |
      DELETED = object()


      class ProbingMap:
          def __init__(self, capacity=8):
              self._slots = [None] * capacity
              self._size = 0
              self._dead = 0

          def _probe(self, key):
              cap = len(self._slots)
              i = hash(key) % cap
              first_tomb = -1
              while True:
                  slot = self._slots[i]
                  if slot is None:
                      return -1, (first_tomb if first_tomb >= 0 else i)
                  if slot is DELETED:
                      if first_tomb < 0:
                          first_tomb = i
                  elif slot[0] == key:
                      return i, i
                  i = (i + 1) % cap

          def put(self, key, value):
              found, where = self._probe(key)
              if found >= 0:
                  self._slots[found] = (key, value)
                  return
              if self._slots[where] is DELETED:
                  self._dead -= 1
              self._slots[where] = (key, value)
              self._size += 1
              if (self._size + self._dead) / len(self._slots) > 0.5:
                  self._resize(2 * len(self._slots))

          def get(self, key):
              found, _ = self._probe(key)
              if found < 0:
                  raise KeyError(key)
              return self._slots[found][1]

          def delete(self, key):
              found, _ = self._probe(key)
              if found < 0:
                  raise KeyError(key)
              self._slots[found] = DELETED
              self._size -= 1
              self._dead += 1

          def _resize(self, capacity):
              old = self._slots
              self._slots = [None] * capacity
              self._size = 0
              self._dead = 0
              for slot in old:
                  if slot is not None and slot is not DELETED:
                      self.put(slot[0], slot[1])

          def __contains__(self, key):
              return self._probe(key)[0] >= 0

          def __len__(self):
              return self._size

          def capacity(self):
              return len(self._slots)
    explanation: |
      The tombstone test shows the danger of naively emptying slots: after deleting `b`, the key `c` sits in slot 5 *because* slot 4 was occupied when it was inserted. If slot 4 became `None`, a search for `c` would stop there and wrongly report it missing. Counting tombstones towards the load factor matters too: a table full of tombstones has no `None` slots, and searches for missing keys would never end.

  - id: lru-cache
    title: An LRU cache
    difficulty: 3
    prompt: |
      Write `LRUCache(capacity)` with O(1) operations, combining a Python `dict` (key → node) with a doubly linked list of nodes ordered from most recently used (front) to least recently used (back). Don't use `OrderedDict` or `functools`. You may write your own node and list code (sentinel nodes make it easy) or adapt your Lesson 7.4 solution.

      - `get(key)`: return the value, or `None` if missing. A successful get makes the key the most recently used.
      - `put(key, value)`: insert or update; the key becomes the most recently used. If this makes the cache exceed its capacity, evict the least recently used key.
      - `keys()`: the keys from most to least recently used.
      - `len(cache)`, and attributes `hits` and `misses` counting successful and unsuccessful `get`s.
    starter: |
      class LRUCache:
          pass
    tests:
      - name: eviction order
        code: |
          c = LRUCache(2)
          c.put("a", 1); c.put("b", 2)
          assert c.get("a") == 1
          c.put("c", 3)
          assert c.get("b") is None, "b was least recently used"
          assert c.keys() == ["c", "a"] and len(c) == 2
          c.put("a", 10)
          assert c.keys() == ["a", "c"] and c.get("a") == 10
          c.put("d", 4)
          assert c.keys() == ["d", "a"] and c.get("c") is None
          assert c.hits == 2 and c.misses == 2
      - name: capacity one
        code: |
          c = LRUCache(1)
          c.put(1, 1); c.put(2, 2)
          assert c.get(1) is None and c.get(2) == 2 and len(c) == 1
      - name: matches a model and is fast
        code: |
          import random, time
          random.seed(11)
          c = LRUCache(50)
          model = []
          t = time.time()
          for _ in range(30000):
              k = random.randint(0, 120)
              if random.random() < 0.5:
                  got = c.get(k)
                  if any(m[0] == k for m in model):
                      v = next(m[1] for m in model if m[0] == k)
                      assert got == v
                      model = [(k, v)] + [m for m in model if m[0] != k]
                  else:
                      assert got is None
              else:
                  c.put(k, k * 2)
                  model = [(k, k * 2)] + [m for m in model if m[0] != k]
                  model = model[:50]
          assert c.keys() == [m[0] for m in model]
      - name: no shortcuts
        code: |
          assert "OrderedDict" not in source and "functools" not in source and "lru_cache" not in source
    hints:
      - "Use sentinel nodes `self._head` and `self._tail`. Helpers: `_unlink(node)` and `_push_front(node)`. Each node stores key, value, prev and next. It must store the key so that eviction can delete it from the dict."
      - "`get`: if the key is in `self._map`, move its node to the front (unlink, then push front), count a hit and return the value; otherwise count a miss."
      - "`put`: if present, update the value and move to front. Otherwise create a node, push it to the front and add it to the map; if `len(self._map) > capacity`, unlink `self._tail.prev` and delete its key from the map."
    solution: |
      class _Node:
          def __init__(self, key=None, value=None):
              self.key = key
              self.value = value
              self.prev = None
              self.next = None


      class LRUCache:
          def __init__(self, capacity):
              self.capacity = capacity
              self._map = {}
              self._head = _Node()
              self._tail = _Node()
              self._head.next = self._tail
              self._tail.prev = self._head
              self.hits = 0
              self.misses = 0

          def _unlink(self, node):
              node.prev.next = node.next
              node.next.prev = node.prev

          def _push_front(self, node):
              node.prev = self._head
              node.next = self._head.next
              self._head.next.prev = node
              self._head.next = node

          def get(self, key):
              node = self._map.get(key)
              if node is None:
                  self.misses += 1
                  return None
              self.hits += 1
              self._unlink(node)
              self._push_front(node)
              return node.value

          def put(self, key, value):
              node = self._map.get(key)
              if node is not None:
                  node.value = value
                  self._unlink(node)
                  self._push_front(node)
                  return
              node = _Node(key, value)
              self._map[key] = node
              self._push_front(node)
              if len(self._map) > self.capacity:
                  oldest = self._tail.prev
                  self._unlink(oldest)
                  del self._map[oldest.key]

          def keys(self):
              out = []
              node = self._head.next
              while node is not self._tail:
                  out.append(node.key)
                  node = node.next
              return out

          def __len__(self):
              return len(self._map)
    explanation: |
      Neither structure could do this alone: the dict finds any node in O(1) but knows nothing about recency, while the linked list keeps recency order with O(1) moves but can't find a key quickly. Together, every operation is O(1). Combining structures like this is a common design move. Real caches (browsers, databases, CPUs in hardware) use LRU or close approximations of it.

commonMistakes:
  - title: Using mutable objects as keys
    explanation: |
      If a key's contents change, its hash changes and the entry becomes unreachable. That's why lists can't be dict keys; use tuples or frozensets.
  - title: Defining __eq__ without a matching __hash__
    explanation: |
      Equal objects must have equal hashes. Otherwise two "equal" keys end up in different buckets and lookups fail.
  - title: Copying entries to the same index when resizing
    explanation: |
      A key's bucket is `hash(key) % m`, which changes with m. Every entry must be rehashed into the new table.
  - title: Emptying slots on deletion in open addressing
    explanation: |
      It breaks the probe chains of keys stored after the deleted one. Use tombstones.
  - title: Assuming a hash table is always O(1)
    explanation: |
      It's O(1) on **average** with a good hash function and a bounded load factor. A bad hash function, or an attacker who can force collisions, makes it O(n).

summary:
  - "A **hash table** stores key-value pairs in an array of buckets, choosing a key's bucket with `hash(key) % m`."
  - "Good **hash functions** are deterministic, fast and spread keys evenly; polynomial hashing handles strings."
  - "**Collisions** are unavoidable (pigeonhole) and arrive early (birthday problem)."
  - "**Separate chaining** keeps a list per bucket; **open addressing** probes for free slots and needs **tombstones** for deletion."
  - "Keeping the **load factor** bounded by **resizing** (doubling and rehashing) gives O(1) average operations, amortised."
  - "Sets and dicts turn many O(n²) algorithms into O(n); dict + doubly linked list gives an O(1) **LRU cache**."
next: |
  Hash tables are unbeatable for exact lookups, but they keep keys in no useful order: you can't ask for "the smallest key" or "every key between M and P". **Lesson 7.6** introduces **trees**, hierarchical structures that will give us ordered data in Lesson 7.7, and teaches the four ways to traverse them.

quiz:
  - type: mcq
    question: "How does a hash table with m buckets decide where a key goes?"
    options:
      - It sorts the keys
      - "It computes hash(key) % m"
      - It uses the next free slot from the start
      - It stores the key at index len(table)
    answer: 1
    explanation: The hash code is reduced to a bucket index with modulo.
  - type: mcq
    question: Why can't a list be used as a dictionary key in Python?
    options:
      - Lists are too large
      - "Lists are mutable, so their hash could change after insertion and the entry would be lost"
      - Lists can't be compared
      - Dictionaries only accept strings
    answer: 1
    explanation: Keys must be hashable, which requires their hash never to change.
  - type: mcq
    question: "A chained hash table has 1,000 buckets and 600 keys. What is its load factor, and the expected average chain length?"
    options: ["0.6 and 0.6", "600 and 600", "1.67 and 1", "0.6 and 6"]
    answer: 0
    explanation: "α = n / m = 0.6, and with a good hash function chains average α items."
  - type: mcq
    question: "Why does open addressing use tombstones when deleting?"
    options:
      - To save memory
      - "An empty slot would stop searches early, hiding keys that were placed further along the probe sequence"
      - To make the table sorted
      - Tombstones speed up insertion
    answer: 1
    explanation: Searches stop at empty slots, so a deleted slot must still say "keep looking".
  - type: mcq
    question: "When a hash table resizes, why must every key be reinserted rather than copied to the same index?"
    options:
      - "Because hash(key) % m changes when m changes"
      - Because the keys get new hash codes
      - To sort the keys
      - It doesn't have to
    answer: 0
    explanation: The bucket index depends on the number of buckets.
  - type: mcq
    question: "An LRU cache needs O(1) lookup by key and O(1) \"move to most recent\". Which combination provides both?"
    options:
      - A sorted list and binary search
      - A hash table mapping keys to nodes of a doubly linked list
      - Two stacks
      - A single dynamic array
    answer: 1
    explanation: The hash table finds the node; the linked list reorders it in O(1).
  - type: code
    question: |
      Write `has_duplicate(items)` returning True if any value appears more than once, in O(n) average time, using a set.
    starter: |
      def has_duplicate(items):
          pass
    tests:
      - name: has_duplicate works
        code: |
          assert has_duplicate([1, 2, 3, 2]) and not has_duplicate([1, 2, 3]) and not has_duplicate([])
          assert has_duplicate(list(range(200_000)) + [0])
    solution: |
      def has_duplicate(items):
          seen = set()
          for x in items:
              if x in seen:
                  return True
              seen.add(x)
          return False
