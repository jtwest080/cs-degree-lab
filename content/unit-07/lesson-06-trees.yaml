id: u7-trees
title: Trees and Traversals
minutes: 55
objective: |
  Represent hierarchies as **trees**, use their vocabulary (root, parent, child, leaf, depth, height), build **binary trees** from nodes, and visit every node in the four standard orders: **preorder**, **inorder**, **postorder** (recursively and with an explicit stack) and **level order** (with a queue).
outcomes:
  - Use tree vocabulary precisely, and recognise trees in file systems, documents and code
  - Represent binary trees and general trees with node classes
  - Write recursive functions over trees by trusting the recursion on each subtree
  - Produce preorder, inorder and postorder traversals, and explain what each is good for
  - Traverse level by level with a queue, and depth first with an explicit stack
  - Rebuild a binary tree from two traversals, and evaluate expression trees

sections:
  - heading: Hierarchies everywhere
    body: |
      Your computer's files are organised in folders inside folders. A web page is elements inside elements. A company has a chief executive, managers below them, and staff below each manager. A Python program is parsed into a syntax tree (Lesson 1.6). All of these are **trees**: hierarchies where each item has exactly one parent, apart from a single item at the top.

      In graph terms (Lesson 6.9), a tree is a connected graph with no cycles. In computing we usually draw it upside down, with the **root** at the top:

      ```text
                A          ← root (depth 0)
              / | \
             B  C  D       ← depth 1
            / \     \
           E   F     G     ← depth 2; E, F, C and G are leaves
      ```

  - heading: The vocabulary
    body: |
      - The **root** is the one node with no parent (A).
      - Every other node has exactly one **parent**; B is the parent of E and F, which are its **children**. Nodes with the same parent are **siblings**.
      - A **leaf** has no children (E, F, C, G); other nodes are **internal**.
      - A node's **descendants** are its children, their children, and so on; its **ancestors** are its parent, its parent's parent, and so on up to the root.
      - Every node is the root of a **subtree** made of itself and its descendants.
      - The **depth** of a node is the number of edges from the root to it (A is 0, G is 2).
      - The **height** of a tree is the number of **levels** it has: 3 for the tree above. (Some books count edges instead, giving 2; we'll count levels, so an empty tree has height 0 and a single node has height 1.)

      A tree with n nodes has n − 1 edges (Lesson 6.9), since every node except the root has exactly one edge up to its parent.

  - heading: Binary trees
    body: |
      In a **binary tree**, every node has at most two children, called **left** and **right**. Binary trees are the basis of binary search trees (Lesson 7.7), heaps (Lesson 7.8) and expression trees. A binary tree node is a small class, like a linked list node with two links:

      ```python
      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right

      root = TreeNode(1, TreeNode(2, TreeNode(4), TreeNode(5)), TreeNode(3))
      ```

      ```text
            1
           / \
          2   3
         / \
        4   5
      ```

      A binary tree of height h has at most 2ʰ − 1 nodes (1 + 2 + 4 + ... + 2ʰ⁻¹, Lesson 6.5). Turned round: a binary tree holding n nodes has height **at least** about log₂ n. A tree that achieves this, with every level full, is **perfect**; one where each level is full except perhaps the last, filled from the left, is **complete**. A tree where each node has only one child is just a linked list with height n. That difference between log n and n will matter enormously in the next lesson.

  - heading: Recursion on trees
    body: |
      A binary tree is either **empty** (`None`) or a node with a **left subtree** and a **right subtree**, which are themselves binary trees. This recursive definition (Lesson 4.6) means almost every tree function has the same shape: handle the empty tree, then combine the answers for the two subtrees.

      ```python
      def size(node):
          if node is None:
              return 0
          return 1 + size(node.left) + size(node.right)

      def height(node):
          if node is None:
              return 0
          return 1 + max(height(node.left), height(node.right))
      ```

      Trust the recursion (the leap of faith from Lesson 4.5): assume `size(node.left)` correctly gives the size of the left subtree, and ask only how to combine. Structural induction (Lesson 6.5) is the proof that this works. Each function visits every node once, so it's O(n).

  - heading: Depth-first traversals
    body: |
      A **traversal** visits every node exactly once. The three **depth-first** orders differ only in *when* a node is visited relative to its subtrees:

      | Order | Visit the node... | For the tree above |
      |---|---|---|
      | **Preorder** | before its subtrees (node, left, right) | 1 2 4 5 3 |
      | **Inorder** | between them (left, node, right) | 4 2 5 1 3 |
      | **Postorder** | after them (left, right, node) | 4 5 2 3 1 |

      ```python
      def preorder(node, out):
          if node is not None:
              out.append(node.value)
              preorder(node.left, out)
              preorder(node.right, out)
      ```

      Move the `append` line after the left call for inorder, or to the end for postorder. Each order has its uses:

      - **Preorder** visits parents before children: copying a tree, printing an indented outline, saving a tree to a file so it can be rebuilt.
      - **Inorder** visits a binary search tree's values in **sorted order** (Lesson 7.7).
      - **Postorder** visits children before parents: deleting a folder (empty it first), computing a folder's total size, and evaluating an expression tree (work out both operands before applying the operator). Postorder of an expression tree gives exactly the postfix notation of Lesson 7.2.

  - heading: Level order and iterative traversals
    body: |
      **Level-order** traversal (also called breadth-first) visits the root, then all nodes at depth 1, then depth 2, and so on: 1 2 3 4 5 for our tree. Recursion doesn't fit this naturally, but a **queue** does (Lesson 7.3): start with the root in the queue; repeatedly dequeue a node, visit it, and enqueue its children. Children join the back of the queue, so they wait until everything on the current level has been visited.

      The depth-first orders can also be done with an explicit **stack** instead of recursion (Lesson 7.2), avoiding the recursion limit for very deep trees. For preorder: push the root; repeatedly pop a node, visit it, then push its right child and then its left child (so the left is popped first). Inorder with a stack is a little trickier, and makes a good exercise.

      Notice the pattern: **stack → depth first; queue → breadth first**. The same two strategies explore graphs in Lesson 7.9.

  - heading: General trees
    body: |
      Not every tree is binary. In a file system, a folder can contain any number of entries. A **general tree** node stores a list of children:

      ```python
      class Entry:
          def __init__(self, name, size=0, children=None):
              self.name = name
              self.size = size                 # files have a size
              self.children = children or []   # folders have children
      ```

      Recursion works just as well, looping over the children instead of handling left and right:

      ```python
      def total_size(entry):
          return entry.size + sum(total_size(c) for c in entry.children)
      ```

      That's a postorder computation: each folder's total needs its children's totals first. Tools like `du` (disk usage) do exactly this.

examples:
  - title: Measuring a binary tree
    intro: Recursive functions with the same shape.
    code: |
      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right

      def size(node):
          if node is None:
              return 0
          return 1 + size(node.left) + size(node.right)

      def height(node):
          if node is None:
              return 0
          return 1 + max(height(node.left), height(node.right))

      def leaves(node):
          if node is None:
              return []
          if node.left is None and node.right is None:
              return [node.value]
          return leaves(node.left) + leaves(node.right)

      root = TreeNode(1, TreeNode(2, TreeNode(4), TreeNode(5, TreeNode(7))), TreeNode(3, None, TreeNode(6)))
      print("size", size(root), "height", height(root), "leaves", leaves(root))

      chain = None
      for v in range(10):
          chain = TreeNode(v, chain)
      print("a 10-node chain has height", height(chain))
    output: |
      size 7 height 4 leaves [4, 7, 6]
      a 10-node chain has height 10
    lines:
      - line: 7-10
        note: "Empty tree: 0. Otherwise: this node plus the sizes of both subtrees."
      - line: 12-15
        note: "Height: one level for this node, plus the taller subtree's height."
      - line: 17-22
        note: "A leaf is a node with no children. Leaves are listed left to right."
      - line: 24
        note: "Draw this tree: 1 has children 2 and 3; 2 has 4 and 5; 5 has a left child 7; 3 has only a right child 6."
      - line: 27-30
        note: "A tree where every node has one child is really a linked list: height n, not log n."
  - title: The four traversals
    intro: Depth first three ways, then level order with a queue.
    code: |
      from collections import deque

      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right

      def preorder(node):
          if node is None:
              return []
          return [node.value] + preorder(node.left) + preorder(node.right)

      def inorder(node):
          if node is None:
              return []
          return inorder(node.left) + [node.value] + inorder(node.right)

      def postorder(node):
          if node is None:
              return []
          return postorder(node.left) + postorder(node.right) + [node.value]

      def level_order(root):
          out = []
          queue = deque([root] if root else [])
          while queue:
              node = queue.popleft()
              out.append(node.value)
              for child in (node.left, node.right):
                  if child is not None:
                      queue.append(child)
          return out

      root = TreeNode("A", TreeNode("B", TreeNode("D"), TreeNode("E")), TreeNode("C", None, TreeNode("F")))
      for f in [preorder, inorder, postorder, level_order]:
          print(f"{f.__name__:12}", " ".join(f(root)))
    output: |
      preorder     A B D E C F
      inorder      D B E A C F
      postorder    D E B F C A
      level_order  A B C D E F
    lines:
      - line: 9-22
        note: "The three depth-first orders differ only in where the node's own value goes: first, middle or last."
      - line: 24-33
        note: "Level order uses a queue: children wait behind everything already queued, so the tree is read level by level."
      - line: 36
        note: "Functions are objects with a `__name__`, so we can loop over them (Lesson 3.5's functions as values)."
  - title: Expression trees and postorder
    intro: Postorder evaluation, and the same tree printed three ways.
    code: |
      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right

      def evaluate(node):
          if node.left is None and node.right is None:
              return node.value
          a, b = evaluate(node.left), evaluate(node.right)
          return {"+": a + b, "-": a - b, "*": a * b}[node.value]

      def postfix(node):
          if node.left is None:
              return str(node.value)
          return f"{postfix(node.left)} {postfix(node.right)} {node.value}"

      def infix(node):
          if node.left is None:
              return str(node.value)
          return f"({infix(node.left)} {node.value} {infix(node.right)})"

      expr = TreeNode("*", TreeNode("+", TreeNode(3), TreeNode(4)), TreeNode("-", TreeNode(10), TreeNode(8)))
      print(infix(expr), "=", evaluate(expr))
      print("postfix:", postfix(expr))
    output: |
      ((3 + 4) * (10 - 8)) = 14
      postfix: 3 4 + 10 8 - *
    lines:
      - line: 7-11
        note: "Postorder: evaluate both operands, then apply the operator. Numbers sit at the leaves."
      - line: 13-16
        note: "Printing in postorder produces postfix notation, which the stack evaluator of Lesson 7.2 understands."
      - line: 18-21
        note: "Printing in inorder, with brackets around each operation, gives ordinary infix."

playground:
  prompt: |
    A tiny file system as a general tree. `show` prints an indented outline (preorder) and `total` adds up sizes (postorder). Add files and folders, then try printing each folder's total next to its name.
  code: |
    class Entry:
        def __init__(self, name, size=0, children=None):
            self.name = name
            self.size = size
            self.children = children or []

    def show(entry, depth=0):
        suffix = "/" if entry.children else f" ({entry.size} KB)"
        print("  " * depth + entry.name + suffix)
        for child in entry.children:
            show(child, depth + 1)

    def total(entry):
        return entry.size + sum(total(c) for c in entry.children)

    home = Entry("home", children=[
        Entry("notes.txt", 4),
        Entry("photos", children=[Entry("cat.jpg", 2100), Entry("dog.jpg", 1800)]),
        Entry("code", children=[Entry("app.py", 12), Entry("lib", children=[Entry("util.py", 3)])]),
    ])
    show(home)
    print("total:", total(home), "KB")

exercises:
  - id: tree-measures
    title: Measuring trees
    difficulty: 1
    prompt: |
      `TreeNode` is provided. Write these recursive functions, each taking a node that may be `None`:

      - `size(node)`: the number of nodes.
      - `height(node)`: the number of levels (0 for an empty tree, 1 for a single node).
      - `total(node)`: the sum of all values.
      - `count_leaves(node)`: the number of nodes with no children.
      - `max_value(node)`: the largest value, or `None` for an empty tree.
    starter: |
      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def size(node):
          pass


      def height(node):
          pass


      def total(node):
          pass


      def count_leaves(node):
          pass


      def max_value(node):
          pass
    tests:
      - name: empty and single
        code: |
          assert size(None) == 0 and height(None) == 0 and total(None) == 0 and count_leaves(None) == 0 and max_value(None) is None
          one = TreeNode(5)
          assert size(one) == 1 and height(one) == 1 and total(one) == 5 and count_leaves(one) == 1 and max_value(one) == 5
      - name: bigger tree
        code: |
          t = TreeNode(1, TreeNode(2, TreeNode(4), TreeNode(5, TreeNode(9))), TreeNode(3, None, TreeNode(-6)))
          assert size(t) == 7 and height(t) == 4 and total(t) == 18
          assert count_leaves(t) == 3 and max_value(t) == 9
      - name: perfect tree
        code: |
          def perfect(h):
              return None if h == 0 else TreeNode(h, perfect(h - 1), perfect(h - 1))
          for h in range(1, 10):
              t = perfect(h)
              assert size(t) == 2 ** h - 1 and height(t) == h and count_leaves(t) == 2 ** (h - 1)
    hints:
      - "Every function starts with `if node is None:` returning the answer for an empty tree."
      - "`count_leaves`: a node with both children `None` counts 1; otherwise add the counts of its subtrees."
      - "`max_value`: collect the node's value and the non-None results of both subtrees, and return the max of those."
    solution: |
      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def size(node):
          if node is None:
              return 0
          return 1 + size(node.left) + size(node.right)


      def height(node):
          if node is None:
              return 0
          return 1 + max(height(node.left), height(node.right))


      def total(node):
          if node is None:
              return 0
          return node.value + total(node.left) + total(node.right)


      def count_leaves(node):
          if node is None:
              return 0
          if node.left is None and node.right is None:
              return 1
          return count_leaves(node.left) + count_leaves(node.right)


      def max_value(node):
          if node is None:
              return None
          candidates = [node.value]
          for sub in (max_value(node.left), max_value(node.right)):
              if sub is not None:
                  candidates.append(sub)
          return max(candidates)
    explanation: |
      All five functions share one template: answer for the empty tree, then combine this node with the results for its subtrees. The perfect-tree test checks the facts from the lesson: a perfect tree of height h has 2ʰ − 1 nodes and 2ʰ⁻¹ leaves, so just over half of its nodes are leaves.

  - id: traversals
    title: The four traversals
    difficulty: 2
    prompt: |
      Write `preorder(root)`, `inorder(root)` and `postorder(root)`, each returning a list of values. Use a recursive **helper** that appends to a single list (rather than concatenating lists, which costs extra copying).

      Then write `levels(root)`: a list of lists, one per level, each holding that level's values left to right, using a `collections.deque` as a queue. For example, a tree with root 1, children 2 and 3, and 4 as a child of 2 gives `[[1], [2, 3], [4]]`.
    starter: |
      from collections import deque


      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def preorder(root):
          pass


      def inorder(root):
          pass


      def postorder(root):
          pass


      def levels(root):
          pass
    tests:
      - name: depth-first orders
        code: |
          t = TreeNode("A", TreeNode("B", TreeNode("D"), TreeNode("E")), TreeNode("C", None, TreeNode("F")))
          assert preorder(t) == list("ABDECF")
          assert inorder(t) == list("DBEACF")
          assert postorder(t) == list("DEBFCA")
          assert preorder(None) == inorder(None) == postorder(None) == []
      - name: levels
        code: |
          t = TreeNode(1, TreeNode(2, TreeNode(4)), TreeNode(3, TreeNode(5), TreeNode(6)))
          assert levels(t) == [[1], [2, 3], [4, 5, 6]]
          assert levels(None) == [] and levels(TreeNode(9)) == [[9]]
      - name: big tree
        code: |
          import random
          random.seed(12)
          def build(lo, hi):
              if lo > hi:
                  return None
              mid = random.randint(lo, hi)
              return TreeNode(mid, build(lo, mid - 1), build(mid + 1, hi))
          t = build(1, 3000)
          assert inorder(t) == list(range(1, 3001))
          assert sorted(preorder(t)) == sorted(postorder(t)) == list(range(1, 3001))
          assert sum(len(l) for l in levels(t)) == 3000
    hints:
      - "Preorder: `out = []`, then define `def walk(node):` that does nothing for None, otherwise appends `node.value` and walks left then right. Call `walk(root)` and return `out`."
      - "Inorder and postorder: move the append between or after the two recursive calls."
      - "`levels`: process the queue one level at a time. At the start of each level, `count = len(queue)`; pop exactly that many nodes into this level's list, enqueueing their children."
    solution: |
      from collections import deque


      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def preorder(root):
          out = []
          def walk(node):
              if node is not None:
                  out.append(node.value)
                  walk(node.left)
                  walk(node.right)
          walk(root)
          return out


      def inorder(root):
          out = []
          def walk(node):
              if node is not None:
                  walk(node.left)
                  out.append(node.value)
                  walk(node.right)
          walk(root)
          return out


      def postorder(root):
          out = []
          def walk(node):
              if node is not None:
                  walk(node.left)
                  walk(node.right)
                  out.append(node.value)
          walk(root)
          return out


      def levels(root):
          result = []
          queue = deque([root] if root is not None else [])
          while queue:
              level = []
              for _ in range(len(queue)):
                  node = queue.popleft()
                  level.append(node.value)
                  if node.left is not None:
                      queue.append(node.left)
                  if node.right is not None:
                      queue.append(node.right)
              result.append(level)
          return result
    explanation: |
      A nested helper function can use (and append to) the `out` list of the function around it, so the whole traversal builds one list in O(n). Concatenating lists at every node, as in the lesson's example, is simpler but can cost O(n²) for unbalanced trees. Counting the queue's length at the start of each level separates the levels neatly, because at that moment the queue holds exactly one complete level.

  - id: iterative-traversals
    title: Traversals without recursion
    difficulty: 2
    prompt: |
      Write `preorder_iter(root)` and `inorder_iter(root)` using an explicit stack (a list) and **no recursion**. They must handle a tree that is a chain 20,000 nodes deep, which would hit Python's recursion limit.

      - Preorder: push the root; repeatedly pop a node, record it, and push its right child and then its left child (skipping `None`s).
      - Inorder: start with `node = root`. Repeatedly: walk as far left as possible, pushing each node; then pop a node, record it, and continue from its right child. Stop when both the stack is empty and `node` is `None`.
    starter: |
      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def preorder_iter(root):
          pass


      def inorder_iter(root):
          pass
    tests:
      - name: correct orders
        code: |
          t = TreeNode("A", TreeNode("B", TreeNode("D"), TreeNode("E")), TreeNode("C", None, TreeNode("F")))
          assert preorder_iter(t) == list("ABDECF")
          assert inorder_iter(t) == list("DBEACF")
          assert preorder_iter(None) == [] and inorder_iter(None) == []
      - name: deep chains
        code: |
          left_chain = None
          for v in range(20000):
              left_chain = TreeNode(v, left_chain)
          assert inorder_iter(left_chain) == list(range(20000))
          assert preorder_iter(left_chain) == list(range(19999, -1, -1))
          right_chain = None
          for v in range(20000):
              right_chain = TreeNode(v, None, right_chain)
          assert inorder_iter(right_chain) == list(range(19999, -1, -1))
      - name: no recursion
        code: |
          import ast
          tree = ast.parse(source)
          for fn in [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name.endswith("_iter")]:
              calls = [c for c in ast.walk(fn) if isinstance(c, ast.Call) and getattr(c.func, "id", "") == fn.name]
              assert not calls and not any(isinstance(c, ast.FunctionDef) for c in fn.body), f"{fn.name} must not recurse"
    hints:
      - "Preorder: `stack = [root] if root else []`; while stack: `node = stack.pop()`, record it, then push `node.right` and `node.left` if they're not None."
      - "Inorder: `while stack or node is not None:` — inner `while node is not None: stack.append(node); node = node.left`; then `node = stack.pop()`, record it, `node = node.right`."
    solution: |
      class TreeNode:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def preorder_iter(root):
          out = []
          stack = [root] if root is not None else []
          while stack:
              node = stack.pop()
              out.append(node.value)
              if node.right is not None:
                  stack.append(node.right)
              if node.left is not None:
                  stack.append(node.left)
          return out


      def inorder_iter(root):
          out = []
          stack = []
          node = root
          while stack or node is not None:
              while node is not None:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              out.append(node.value)
              node = node.right
          return out
    explanation: |
      Pushing the right child before the left means the left is popped first, giving node-left-right order. In the inorder version, the stack holds exactly the ancestors whose own value and right subtree are still pending, which is what the call stack would have held in the recursive version. Both run in O(n) time and use O(height) memory.

  - id: file-tree
