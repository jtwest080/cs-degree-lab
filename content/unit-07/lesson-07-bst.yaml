id: u7-bst
title: Binary Search Trees
minutes: 60
objective: |
  Build a **binary search tree (BST)**, an ordered map that keeps keys sorted as they're inserted: search, insert and delete by walking a single path, answer ordered questions (minimum, floor, ceiling, ranges), and see why **balance** decides whether operations take O(log n) or O(n) time.
outcomes:
  - State the BST property and use it to search by walking one path from the root
  - Insert keys and values, and list keys in sorted order with an inorder traversal
  - Delete keys, including nodes with two children, using the inorder successor
  - Check whether a binary tree satisfies the BST property
  - Answer ordered queries: minimum, maximum, floor, ceiling and range searches
  - Explain how insertion order affects height, and build a perfectly balanced BST from sorted keys

sections:
  - heading: Binary search, as a tree
    body: |
      Binary search (Lesson 4.3) finds a value in a sorted list in O(log n) steps, but inserting into a sorted list costs O(n) because of shifting. A hash table (Lesson 7.5) inserts in O(1) but forgets all order. A **binary search tree** gets both fast searching and fast insertion, while keeping its keys in order.

      A BST is a binary tree (Lesson 7.6) where every node holds a **key** (and usually a value), and the **BST property** holds at every node:

      > All keys in a node's **left** subtree are **smaller** than its key, and all keys in its **right** subtree are **larger**.

      ```text
                 50
               /    \
             30      70
            /  \    /  \
          20   40  60   80
      ```

      Every node is like the middle element of a binary search: smaller things are to its left, larger to its right. And an **inorder** traversal visits the keys in **sorted order**: 20 30 40 50 60 70 80.

  - heading: Searching
    body: |
      To find a key, start at the root and compare:

      - equal: found it;
      - smaller: the key can only be in the left subtree, so go left;
      - larger: go right;
      - fell off the tree (`None`): it isn't there.

      ```python
      def search(node, key):
          while node is not None:
              if key == node.key:
                  return node.value
              node = node.left if key < node.key else node.right
          return None
      ```

      Each step discards a whole subtree, just as binary search discards half the list, and the search follows a single path from the root. So the cost is **O(h)**, where h is the tree's height.

      Following the left links as far as possible reaches the **minimum** key; following the right links reaches the **maximum**. Both are O(h) too.

  - heading: Inserting
    body: |
      Insertion searches for the key. If the key is found, update its value (a map has one value per key). Otherwise the search falls off the tree at exactly the place the new key belongs, so attach a new leaf there:

      ```text
      insert 45:  50 → go left to 30 → go right to 40 → go right: empty, attach 45 there
      ```

      A recursive version is neat: inserting into an empty tree returns a new node; otherwise insert into the correct subtree and reattach the result.

      ```python
      def insert(node, key, value):
          if node is None:
              return Node(key, value)
          if key < node.key:
              node.left = insert(node.left, key, value)
          elif key > node.key:
              node.right = insert(node.right, key, value)
          else:
              node.value = value
          return node
      ```

      Again O(h). New keys always become leaves; existing nodes never move.

  - heading: Deleting
    body: |
      Deleting a node needs care, because the tree must keep the BST property. There are three cases:

      1. **A leaf**: just remove it.
      2. **One child**: replace the node with its child. The child's whole subtree moves up a level, and the ordering is still correct.
      3. **Two children**: find the node's **inorder successor**, the smallest key in its right subtree (go right once, then left as far as possible). Copy the successor's key and value into the node, then delete the successor from the right subtree. The successor has no left child, so deleting it is case 1 or 2.

      Why the successor? It's the next key in sorted order, so it's larger than everything in the left subtree and smaller than everything else in the right subtree: a perfect replacement. (The **predecessor**, the largest key in the left subtree, would work equally well.)

      All three cases cost O(h).

  - heading: Ordered queries
    body: |
      Because a BST keeps keys in order, it can answer questions a hash table can't:

      - **Minimum and maximum**: follow the leftmost or rightmost path.
      - **Floor** (largest key ≤ x) and **ceiling** (smallest key ≥ x): walk down as in a search, remembering the best candidate so far. For a floor, whenever the current key is ≤ x, it's a candidate and anything better lies to its right.
      - **Range search** (all keys between lo and hi): an inorder traversal that **skips** subtrees that can't contain any keys in range. If a node's key is less than lo, its whole left subtree is too small. That makes it O(h + k) for k results, rather than O(n).
      - **Successor and predecessor**: the next or previous key in order.

      These power things like "show all bookings between 9:00 and 12:00", "find the nearest available seat number", or a leaderboard that reports ranks. Databases use a cousin of the BST, the **B-tree** (Unit 12), for exactly these queries.

  - heading: Balance is everything
    body: |
      Every operation is O(h). How tall is a BST? It depends entirely on the **order** of insertion.

      - Insert 50, 30, 70, 20, 40, 60, 80 and you get the perfectly balanced tree above: height 3 for 7 keys, about log₂ n.
      - Insert 20, 30, 40, 50, 60, 70, 80 (already sorted) and each key becomes the right child of the previous one: a chain of height 7. The BST has become a slow linked list, and every operation is O(n).

      Sorted input is common in real life (timestamps, IDs, alphabetical lists), so this isn't a rare problem. Random insertion orders give an expected height of about 2.99 log₂ n, which is fine, but you can't rely on input being random.

      **Self-balancing** BSTs fix this by restructuring the tree as it changes, using small local operations called **rotations** that change a few links while preserving the BST property:

      ```text
        right rotation at y:      y            x
                                 / \          / \
                                x   C   →    A   y
                               / \              / \
                              A   B            B   C
      ```

      **AVL trees** keep the heights of every node's two subtrees within 1 of each other; **red-black trees** use a colouring rule that keeps the height below 2 log₂ n. Both guarantee O(log n) for every operation. Java's `TreeMap` and C++'s `std::map` are red-black trees. Unit 8 returns to balanced trees; in this lesson you'll build a perfectly balanced tree from sorted data, and detect imbalance.

  - heading: BST or hash table?
    body: |
      | | Hash table | Balanced BST |
      |---|---|---|
      | Search, insert, delete | O(1) average | O(log n) worst case |
      | Keys in sorted order | No (O(n log n) to sort) | Yes (O(n) inorder) |
      | Min, max, floor, ceiling, ranges | O(n) | O(log n) (+ k results) |
      | Key requirements | hashable | comparable with `<` |

      Use a hash table when you only need exact lookups; use a balanced BST when order matters. Python has no built-in BST: `dict` and `set` are hash tables. For ordered data, Python programmers often use a sorted list with the `bisect` module (binary search, but O(n) insertion) or the third-party `sortedcontainers` library.

examples:
  - title: A BST map
    intro: Insert, search, and sorted output from an inorder traversal.
    code: |
      class Node:
          def __init__(self, key, value):
              self.key, self.value = key, value
              self.left = self.right = None

      class BST:
          def __init__(self):
              self.root = None

          def put(self, key, value):
              self.root = self._put(self.root, key, value)

          def _put(self, node, key, value):
              if node is None:
                  return Node(key, value)
              if key < node.key:
                  node.left = self._put(node.left, key, value)
              elif key > node.key:
                  node.right = self._put(node.right, key, value)
              else:
                  node.value = value
              return node

          def get(self, key):
              node = self.root
              while node is not None:
                  if key == node.key:
                      return node.value
                  node = node.left if key < node.key else node.right
              return None

          def items(self):
              out = []
              def walk(node):
                  if node:
                      walk(node.left)
                      out.append((node.key, node.value))
                      walk(node.right)
              walk(self.root)
              return out

      ages = BST()
      for name, age in [("Mo", 31), ("Ada", 36), ("Zoe", 24), ("Lin", 29), ("Raj", 42), ("Mo", 32)]:
          ages.put(name, age)
      print(ages.get("Lin"), ages.get("Bob"))
      print(ages.items())
    output: |
      29 None
      [('Ada', 36), ('Lin', 29), ('Mo', 32), ('Raj', 42), ('Zoe', 24)]
    lines:
      - line: 10-11
        note: "The public method calls a recursive helper and stores the (possibly new) root."
      - line: 13-22
        note: "Insertion walks down to an empty spot. An existing key gets its value updated instead."
      - line: 24-30
        note: "Search is a loop down one path, discarding a subtree at every step."
      - line: 32-40
        note: "Inorder gives the keys in sorted (alphabetical) order, whatever order they were inserted."
      - line: 43-44
        note: "\"Mo\" was inserted twice; the second put updated the value to 32."
  - title: Insertion order and height
    intro: The same keys, inserted sorted, randomly, and middle first.
    code: |
      import random

      class Node:
          def __init__(self, key):
              self.key = key
              self.left = self.right = None

      def insert(node, key):
          if node is None:
              return Node(key)
          if key < node.key:
              node.left = insert(node.left, key)
          else:
              node.right = insert(node.right, key)
          return node

      def height(node):
          return 0 if node is None else 1 + max(height(node.left), height(node.right))

      def build(keys):
          root = None
          for k in keys:
              root = insert(root, k)
          return root

      def middle_first(keys):
          if not keys:
              return []
          mid = len(keys) // 2
          return [keys[mid]] + middle_first(keys[:mid]) + middle_first(keys[mid + 1:])

      keys = list(range(1, 301))
      random.seed(5)
      shuffled = random.sample(keys, len(keys))
      print("sorted order:      height", height(build(keys)))
      print("random order:      height", height(build(shuffled)))
      print("middle-first order: height", height(build(middle_first(keys))))
    output: |
      sorted order:      height 300
      random order:      height 15
      middle-first order: height 9
    lines:
      - line: 20-24
        note: "Insertion is recursive here, so 300 sorted keys make 300-deep recursion. Much more and Python's recursion limit would stop us: the chain is the problem."
      - line: 26-30
        note: "Inserting the middle key first, then recursively the middles of each half, gives a perfectly balanced tree."
      - line: 36-38
        note: "log₂ 300 ≈ 8.2, so 9 levels is optimal. The random tree is reasonable, and the sorted one is a linked list."
  - title: Floor, ceiling and ranges
    intro: Ordered questions a hash table can't answer.
    code: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key, self.left, self.right = key, left, right

      root = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))

      def floor(node, x):
          best = None
          while node:
              if node.key == x:
                  return x
              if node.key < x:
                  best = node.key
                  node = node.right
              else:
                  node = node.left
          return best

      visited = []
      def keys_between(node, lo, hi, out):
          if node is None:
              return
          visited.append(node.key)
          if lo < node.key:
              keys_between(node.left, lo, hi, out)
          if lo <= node.key <= hi:
              out.append(node.key)
          if node.key < hi:
              keys_between(node.right, lo, hi, out)

      print("floor(65):", floor(root, 65), " floor(10):", floor(root, 10))
      found = []
      keys_between(root, 55, 75, found)
      print("keys in 55..75:", found, " nodes visited:", visited)
    output: |
      floor(65): 60  floor(10): None
      keys in 55..75: [60, 70]  nodes visited: [50, 70, 60, 80]
    lines:
      - line: 12-14
        note: "A key below x is a candidate floor; a better one could only be to its right (larger, but maybe still ≤ x)."
      - line: 15-16
        note: "A key above x can't be the floor, so look left."
      - line: 23-24
        note: "Only explore the left subtree if it could contain keys ≥ lo."
      - line: 27-28
        note: "Only explore the right subtree if it could contain keys ≤ hi. The whole subtree under 30 was skipped."

playground:
  prompt: |
    Watch deletion keep the tree ordered. `show` prints the tree sideways (the root on the left, right subtree above). Delete a leaf, a node with one child, and the root (two children), and check that the inorder list stays sorted.
  code: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key, self.left, self.right = key, left, right

    def delete(node, key):
        if node is None:
            return None
        if key < node.key:
            node.left = delete(node.left, key)
        elif key > node.key:
            node.right = delete(node.right, key)
        else:
            if node.left is None:
                return node.right
            if node.right is None:
                return node.left
            succ = node.right
            while succ.left:
                succ = succ.left
            node.key = succ.key
            node.right = delete(node.right, succ.key)
        return node

    def show(node, depth=0):
        if node:
            show(node.right, depth + 1)
            print("    " * depth + str(node.key))
            show(node.left, depth + 1)

    root = Node(50, Node(30, Node(20), Node(40, Node(35))), Node(70, Node(60), Node(80)))
    show(root)
    for k in [20, 40, 50]:
        root = delete(root, k)
        print(f"--- after deleting {k} ---")
        show(root)

exercises:
  - id: bst-map
    title: A BST map
    difficulty: 1
    prompt: |
      Write a class `BST` storing key-value pairs in nodes (write your own `Node` class with `key`, `value`, `left` and `right`):

      - `put(key, value)`: insert, or update the value if the key exists.
      - `get(key, default=None)`.
      - `__contains__`, `__len__` (keep a counter, increased only for new keys).
      - `min_key()` and `max_key()`: raise `KeyError` if the tree is empty.
      - `keys()`: all keys in sorted order.
      - `height()`: the number of levels (0 if empty).
    starter: |
      class Node:
          pass


      class BST:
          pass
    tests:
      - name: put and get
        code: |
          t = BST()
          for k, v in [(50, "a"), (30, "b"), (70, "c"), (40, "d"), (30, "B")]:
              t.put(k, v)
          assert t.get(30) == "B" and t.get(40) == "d" and t.get(99) is None and t.get(99, 0) == 0
          assert len(t) == 4 and 70 in t and 35 not in t
      - name: ordered
        code: |
          t = BST()
          for k in [50, 30, 70, 20, 40, 60, 80]:
              t.put(k, str(k))
          assert t.keys() == [20, 30, 40, 50, 60, 70, 80]
          assert t.min_key() == 20 and t.max_key() == 80 and t.height() == 3
          try:
              BST().min_key(); assert False
          except KeyError:
              pass
      - name: random keys
        code: |
          import random
          random.seed(14)
          t = BST()
          keys = random.sample(range(10000), 2000)
          for k in keys:
              t.put(k, -k)
          assert t.keys() == sorted(keys) and len(t) == 2000
          assert all(t.get(k) == -k for k in keys[:200])
          assert t.height() < 40
    hints:
      - "Write `put` with a loop or a recursive helper `_put(node, key, value)` that returns the subtree's root. To count only new keys, increase the size where the new `Node` is created."
      - "`get`: walk from the root, going left when `key < node.key`, right when larger."
      - "`min_key`: follow `.left` until it's None. `keys`: inorder traversal."
    solution: |
      class Node:
          def __init__(self, key, value):
              self.key = key
              self.value = value
              self.left = None
              self.right = None


      class BST:
          def __init__(self):
              self.root = None
              self._size = 0

          def put(self, key, value):
              self.root = self._put(self.root, key, value)

          def _put(self, node, key, value):
              if node is None:
                  self._size += 1
                  return Node(key, value)
              if key < node.key:
                  node.left = self._put(node.left, key, value)
              elif key > node.key:
                  node.right = self._put(node.right, key, value)
              else:
                  node.value = value
              return node

          def _find(self, key):
              node = self.root
              while node is not None and node.key != key:
                  node = node.left if key < node.key else node.right
              return node

          def get(self, key, default=None):
              node = self._find(key)
              return node.value if node is not None else default

          def __contains__(self, key):
              return self._find(key) is not None

          def __len__(self):
              return self._size

          def min_key(self):
              if self.root is None:
                  raise KeyError("empty tree")
              node = self.root
              while node.left is not None:
                  node = node.left
              return node.key

          def max_key(self):
              if self.root is None:
                  raise KeyError("empty tree")
              node = self.root
              while node.right is not None:
                  node = node.right
              return node.key

          def keys(self):
              out = []
              def walk(node):
                  if node is not None:
                      walk(node.left)
                      out.append(node.key)
                      walk(node.right)
              walk(self.root)
              return out

          def height(self):
              def h(node):
                  return 0 if node is None else 1 + max(h(node.left), h(node.right))
              return h(self.root)
    explanation: |
      With 2,000 random keys the height stays small (typically in the 20s), so every operation walks a short path. `_find` is shared by `get` and `__contains__`, so the search logic lives in one place. Keys can be anything comparable with `<`, like strings or tuples, not just numbers.

  - id: validate-bst
    title: Is it a valid BST?
    difficulty: 2
    prompt: |
      Write `is_bst(root)` returning True if the binary tree (nodes with `key`, `left`, `right`; `TreeNode` provided) satisfies the BST property with **distinct** keys: every key in a node's left subtree is smaller, and every key in its right subtree is larger.

      Checking only that each node's children are on the correct side is **not** enough. In the tree below, 60 is the right child of 30, which looks fine locally, but 60 is in the **left** subtree of 50, so the tree is invalid:

      ```text
            50
           /
          30
            \
             60
      ```

      Pass down the allowed range `(low, high)` for each subtree. Then write `first_violation(root)`: the key of the first node, in preorder, that lies outside its allowed range, or `None` if the tree is valid.
    starter: |
      class TreeNode:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def is_bst(root):
          pass


      def first_violation(root):
          pass
    tests:
      - name: valid trees
        code: |
          assert is_bst(None) and is_bst(TreeNode(1))
          t = TreeNode(50, TreeNode(30, TreeNode(20), TreeNode(40)), TreeNode(70, TreeNode(60), TreeNode(80)))
          assert is_bst(t) and first_violation(t) is None
      - name: invalid trees
        code: |
          bad = TreeNode(50, TreeNode(30, None, TreeNode(60)))
          assert not is_bst(bad) and first_violation(bad) == 60
          bad2 = TreeNode(50, TreeNode(30, TreeNode(20), TreeNode(40)), TreeNode(70, TreeNode(45), TreeNode(80)))
          assert not is_bst(bad2) and first_violation(bad2) == 45
          dup = TreeNode(5, TreeNode(5))
          assert not is_bst(dup)
          wrong_side = TreeNode(5, None, TreeNode(3))
          assert not is_bst(wrong_side) and first_violation(wrong_side) == 3
      - name: works with strings
        code: |
          t = TreeNode("m", TreeNode("c", TreeNode("a")), TreeNode("x", TreeNode("p")))
          assert is_bst(t)
          t.right.left.key = "b"
          assert first_violation(t) == "b"
    hints:
      - "Write `check(node, low, high)` where `low` and `high` may be `None`, meaning no limit. A node is fine if `(low is None or node.key > low) and (high is None or node.key < high)`."
      - "Going left, the current key becomes the new `high`; going right, it becomes the new `low`."
      - "`first_violation`: same recursion, but return the offending key (or None), checking the node before its subtrees."
    solution: |
      class TreeNode:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def first_violation(root):
          def check(node, low, high):
              if node is None:
                  return None
              if (low is not None and node.key <= low) or (high is not None and node.key >= high):
                  return node.key
              found = check(node.left, low, node.key)
              if found is not None:
                  return found
              return check(node.right, node.key, high)
          return check(root, None, None)


      def is_bst(root):
          return first_violation(root) is None
    explanation: |
      Every node's key must lie strictly between the nearest ancestor it's to the right of and the nearest ancestor it's to the left of. Passing those bounds down captures all the ancestors at once in O(n). Using `None` for "no bound" (instead of plus or minus infinity) keeps it working for strings and other non-numeric keys. An alternative check: an inorder traversal of a valid BST is strictly increasing.

  - id: bst-delete
    title: Deleting from a BST
    difficulty: 2
    prompt: |
      `Node` (with `key`, `left`, `right`) and an `insert` function are provided. Write `delete(root, key)` returning the root of the tree after deleting `key` (unchanged if the key is missing), handling all three cases. For a node with two children, replace it with its **inorder successor** (the minimum of its right subtree).

      Also write `successor(root, key)`: the smallest key in the tree that is **strictly greater** than `key` (which may or may not be in the tree), or `None`.
    starter: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def insert(node, key):
          if node is None:
              return Node(key)
          if key < node.key:
              node.left = insert(node.left, key)
          elif key > node.key:
              node.right = insert(node.right, key)
          return node


      def delete(root, key):
          pass


      def successor(root, key):
          pass
    tests:
      - name: three cases
        code: |
          def inorder(n):
              return [] if n is None else inorder(n.left) + [n.key] + inorder(n.right)
          def build(keys):
              r = None
              for k in keys:
                  r = insert(r, k)
              return r
          r = build([50, 30, 70, 20, 40, 35, 60, 80])
          r = delete(r, 20)
          assert inorder(r) == [30, 35, 40, 50, 60, 70, 80]
          r = delete(r, 40)
          assert inorder(r) == [30, 35, 50, 60, 70, 80] and r.left.right.key == 35
          r = delete(r, 50)
          assert inorder(r) == [30, 35, 60, 70, 80] and r.key == 60, "Two children: use the successor"
          r = delete(r, 99)
          assert inorder(r) == [30, 35, 60, 70, 80]
      - name: delete everything
        code: |
          import random
          random.seed(15)
          def inorder(n):
              return [] if n is None else inorder(n.left) + [n.key] + inorder(n.right)
          keys = random.sample(range(1000), 300)
          r = None
          for k in keys:
              r = insert(r, k)
          remaining = sorted(keys)
          for k in random.sample(keys, 300):
              r = delete(r, k)
              remaining.remove(k)
              if len(remaining) % 50 == 0:
                  assert inorder(r) == remaining
          assert r is None
      - name: successor
        code: |
          r = None
          for k in [50, 30, 70, 20, 40, 60, 80]:
              r = insert(r, k)
          assert successor(r, 40) == 50 and successor(r, 50) == 60 and successor(r, 45) == 50
          assert successor(r, 80) is None and successor(r, 0) == 20 and successor(None, 1) is None
    hints:
      - "Recursive shape: if key < node.key, `node.left = delete(node.left, key)`; if larger, the same on the right; then `return node`."
      - "When you find the node: if it has no left child, return `node.right`; if no right child, return `node.left`. Otherwise find the minimum of `node.right`, copy its key into node, and delete that key from `node.right`."
      - "`successor`: like floor in reverse. Walk from the root; when `node.key > key`, record it as the best so far and go left; otherwise go right."
    solution: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def insert(node, key):
          if node is None:
              return Node(key)
          if key < node.key:
              node.left = insert(node.left, key)
          elif key > node.key:
              node.right = insert(node.right, key)
          return node


      def delete(root, key):
          if root is None:
              return None
          if key < root.key:
              root.left = delete(root.left, key)
          elif key > root.key:
              root.right = delete(root.right, key)
          else:
              if root.left is None:
                  return root.right
              if root.right is None:
                  return root.left
              succ = root.right
              while succ.left is not None:
                  succ = succ.left
              root.key = succ.key
              root.right = delete(root.right, succ.key)
          return root


      def successor(root, key):
          best = None
          node = root
          while node is not None:
              if node.key > key:
                  best = node.key
                  node = node.left
              else:
                  node = node.right
          return best
    explanation: |
      Returning the new subtree root from each call, and reassigning it with `node.left = delete(node.left, key)`, handles every case uniformly, including deleting the root of the whole tree. Cases 1 and 2 merge neatly: "no left child → return the right child" also covers a leaf (whose right child is `None`). The test deletes all 300 keys in random order, checking the order is preserved along the way.

  - id: ordered-queries
    title: Floor, ceiling and range counts
    difficulty: 2
    prompt: |
      Using `Node` (with `key`, `left`, `right`), write:

      - `floor(root, x)`: the largest key ≤ x, or `None`.
      - `ceiling(root, x)`: the smallest key ≥ x, or `None`.
      - `range_keys(root, lo, hi)`: a sorted list of keys with lo ≤ key ≤ hi, **skipping** subtrees that can't contain any (the test counts how many nodes you visit, using a `visits` list: append each node's key to the global `visits` list when you look at it).
      - `count_range(root, lo, hi)`: how many keys lie in the range.
    starter: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      visits = []


      def floor(root, x):
          pass


      def ceiling(root, x):
          pass


      def range_keys(root, lo, hi):
          pass


      def count_range(root, lo, hi):
          pass
    tests:
      - name: floor and ceiling
        code: |
          r = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))
          assert floor(r, 65) == 60 and floor(r, 50) == 50 and floor(r, 10) is None and floor(r, 99) == 80
          assert ceiling(r, 65) == 70 and ceiling(r, 50) == 50 and ceiling(r, 99) is None and ceiling(r, 1) == 20
      - name: ranges
        code: |
          r = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))
          assert range_keys(r, 35, 65) == [40, 50, 60] and range_keys(r, 81, 90) == []
          assert count_range(r, 0, 100) == 7 and count_range(r, 30, 30) == 1
      - name: skips subtrees
        code: |
          def build(lo, hi):
              if lo > hi:
                  return None
              mid = (lo + hi) // 2
              return Node(mid, build(lo, mid - 1), build(mid + 1, hi))
          big = build(1, 100_000)
          visits.clear()
          assert range_keys(big, 500, 520) == list(range(500, 521))
          assert len(visits) < 100, f"Visited {len(visits)} nodes; skip subtrees outside the range"
    hints:
      - "`floor`: when `node.key <= x`, it's a candidate (record it) and go right for a bigger one; otherwise go left. `ceiling` is the mirror image."
      - "`range_keys`: a recursive inorder walk that appends `node.key` to `visits`, recurses left only if `lo < node.key`, records the key if it's in range, and recurses right only if `node.key < hi`."
      - "`count_range` can return `len(range_keys(...))`."
    solution: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      visits = []


      def floor(root, x):
          best = None
          node = root
          while node is not None:
              if node.key <= x:
                  best = node.key
                  node = node.right
              else:
                  node = node.left
          return best


      def ceiling(root, x):
          best = None
          node = root
          while node is not None:
              if node.key >= x:
                  best = node.key
                  node = node.left
              else:
                  node = node.right
          return best


      def range_keys(root, lo, hi):
          out = []
          def walk(node):
              if node is None:
                  return
              visits.append(node.key)
              if lo < node.key:
                  walk(node.left)
              if lo <= node.key <= hi:
                  out.append(node.key)
              if node.key < hi:
                  walk(node.right)
          walk(root)
          return out


      def count_range(root, lo, hi):
          return len(range_keys(root, lo, hi))
    explanation: |
      In a balanced tree of 100,000 keys, the range search visits only the paths down to the two ends of the range plus the 21 nodes inside it: a few dozen nodes rather than 100,000. That's the O(h + k) bound. (A balanced BST that also stores each subtree's size can count a range in O(log n) without listing it, which is how order-statistics trees work.)

  - id: balancing
    title: Building and checking balance
    difficulty: 3
    prompt: |
      Write:

      - `build_balanced(keys)`: given a **sorted** list of distinct keys, return the root of a BST of minimum height containing them: make the middle key the root and build each half recursively. Use indexes rather than slicing, so it's O(n).
      - `is_balanced(root)`: True if, at **every** node, the heights of the left and right subtrees differ by at most 1 (the AVL condition). It must be O(n): compute heights and check balance in the same recursion, rather than calling a separate `height` function at every node.
      - `rebalance(root)`: return a new balanced BST with the same keys (use an inorder traversal, then `build_balanced`).

      `Node` has `key`, `left` and `right`.
    starter: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def build_balanced(keys):
          pass


      def is_balanced(root):
          pass


      def rebalance(root):
          pass
    tests:
      - name: build_balanced
        code: |
          def height(n):
              return 0 if n is None else 1 + max(height(n.left), height(n.right))
          def inorder(n):
              return [] if n is None else inorder(n.left) + [n.key] + inorder(n.right)
          assert build_balanced([]) is None
          r = build_balanced(list(range(1, 8)))
          assert r.key == 4 and height(r) == 3 and inorder(r) == list(range(1, 8))
          r = build_balanced(list(range(1000)))
          assert height(r) == 10 and inorder(r) == list(range(1000))
      - name: is_balanced
        code: |
          assert is_balanced(None) and is_balanced(Node(1))
          assert is_balanced(Node(2, Node(1), Node(3)))
          assert not is_balanced(Node(1, None, Node(2, None, Node(3))))
          lopsided = Node(10, Node(5, Node(3, Node(1)), Node(7)), Node(20, None, None))
          assert not is_balanced(lopsided)
          deep_but_ok = Node(4, Node(2, Node(1), Node(3)), Node(6, Node(5), Node(7, None, Node(8))))
          assert is_balanced(deep_but_ok)
          tricky = Node(1, Node(2, Node(4, Node(8))), Node(3, None, Node(5, None, Node(6))))
          assert not is_balanced(tricky), "Root heights are equal, but children are unbalanced"
      - name: rebalance a chain
        code: |
          import sys
          def height(n):
              return 0 if n is None else 1 + max(height(n.left), height(n.right))
          chain = None
          for k in range(500, 0, -1):
              chain = Node(k, None, chain)
          r = rebalance(chain)
          assert is_balanced(r) and height(r) == 9
      - name: is_balanced is linear
        code: |
          import time
          r = build_balanced(list(range(100_000)))
          t = time.time()
          assert is_balanced(r)
          assert time.time() - t < 2, "Compute heights and balance together"
    hints:
      - "`build_balanced`: a helper `make(lo, hi)` builds from `keys[lo:hi]`: if lo >= hi return None; mid = (lo + hi) // 2; return `Node(keys[mid], make(lo, mid), make(mid + 1, hi))`."
      - "`is_balanced`: a helper returns the subtree's height, or −1 to mean \"unbalanced somewhere below\". If either child returns −1, or their heights differ by more than 1, return −1."
      - "`rebalance`: collect keys with an inorder traversal (an explicit stack avoids deep recursion on a chain), then call `build_balanced`."
    solution: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def build_balanced(keys):
          def make(lo, hi):
              if lo >= hi:
                  return None
              mid = (lo + hi) // 2
              return Node(keys[mid], make(lo, mid), make(mid + 1, hi))
          return make(0, len(keys))


      def is_balanced(root):
          def check(node):
              if node is None:
                  return 0
              left = check(node.left)
              if left < 0:
                  return -1
              right = check(node.right)
              if right < 0 or abs(left - right) > 1:
                  return -1
              return 1 + max(left, right)
          return check(root) >= 0


      def rebalance(root):
          keys = []
          stack = []
          node = root
          while stack or node is not None:
              while node is not None:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              keys.append(node.key)
              node = node.right
          return build_balanced(keys)
    explanation: |
      Calling a separate height function at every node would cost O(n log n) for balanced trees and O(n²) for chains; returning height and balance together from one postorder recursion is O(n), with −1 as a "failed" signal. Rebuilding the whole tree is O(n), which is fine occasionally but too slow after every insert. Self-balancing trees (AVL, red-black) instead repair the balance locally with rotations in O(log n) per operation.

commonMistakes:
  - title: Checking only parent-child order when validating
    explanation: |
      Every key must fit between the bounds set by **all** its ancestors, not just its parent. Pass `(low, high)` down the recursion.
  - title: Forgetting to reattach after recursive insert or delete
    explanation: |
      Write `node.left = insert(node.left, key)`, not just `insert(node.left, key)`. Otherwise new nodes are created and immediately lost.
  - title: Losing a subtree when deleting
    explanation: |
      A node with one child must be replaced by that child, not removed with its subtree. A node with two children needs its successor.
  - title: Assuming O(log n) without balance
    explanation: |
      Operations are O(height). Sorted input makes a plain BST a chain with height n.
  - title: Duplicates without a policy
    explanation: |
      Decide what equal keys mean. For a map, update the value; for a multiset, store a count in the node.

summary:
  - "In a **binary search tree**, left subtree keys < node key < right subtree keys, at every node."
  - "Search, insert, delete, min and max all walk one path: **O(h)**."
  - "Deleting a node with two children replaces it with its **inorder successor**."
  - "An **inorder** traversal lists keys in sorted order; **floor**, **ceiling** and **range** queries make BSTs ordered maps."
  - "Height ranges from about log₂ n (balanced) to n (a chain from sorted input); **self-balancing** trees use **rotations** to guarantee O(log n)."
  - "Use a hash table for exact lookups, and a balanced BST when order matters."
next: |
  A BST keeps everything in order, but many problems only ever need the **smallest** (or largest) item: the most urgent task, the nearest unvisited city, the next event in a simulation. **Lesson 7.8** builds the **heap**, a simpler tree stored in an array that does exactly that job in O(log n), and uses it for priority queues, heapsort and top-k problems.

quiz:
  - type: mcq
    question: "In a BST, where are all keys smaller than a node's key?"
    options: ["In its right subtree", "In its left subtree", "Anywhere", "Only in its parent"]
    answer: 1
    explanation: The BST property puts smaller keys to the left, at every node.
  - type: mcq
    question: What does an inorder traversal of a BST produce?
    options: ["Keys in insertion order", "Keys in sorted order", "Keys level by level", "Keys in reverse order"]
    answer: 1
    explanation: Left subtree (smaller), node, right subtree (larger), recursively.
  - type: mcq
    question: "Inserting 1, 2, 3, ..., 1000 in that order into a plain BST gives a tree of what height?"
    options: ["About 10", "About 20", "1,000", "500"]
    answer: 2
    explanation: Each key becomes the right child of the previous one, making a chain.
  - type: mcq
    question: "To delete a node with two children, what replaces it?"
    options:
      - Its left child
      - Its inorder successor, the smallest key in its right subtree
      - The root
      - Its parent
    answer: 1
    explanation: The successor is the next key in order, so the BST property still holds.
  - type: mcq
    question: "In the tree 50 (left 30, right 70), with 60 as 70's left child, what is floor(65)?"
    options: ["50", "60", "70", "None"]
    answer: 1
    explanation: "60 is the largest key that's at most 65."
  - type: mcq
    question: "When is a hash table a better choice than a balanced BST?"
    options:
      - When you need keys in sorted order
      - When you need range queries
      - When you only need fast lookups by exact key
      - When keys can't be hashed
    answer: 2
    explanation: "Exact lookups are O(1) on average in a hash table, versus O(log n) in a balanced BST."
