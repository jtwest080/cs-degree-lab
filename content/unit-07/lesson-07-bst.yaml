    starter: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def bst_max(root):
          pass
    tests:
      - name: bst_max works
        code: |
          r = Node(50, Node(30, Node(20)), Node(70, Node(60), Node(80, Node(75))))
          assert bst_max(r) == 80 and bst_max(Node(5)) == 5 and bst_max(Node(5, Node(1))) == 5
    solution: |
      class Node:
          def __init__(self, key, left=None, right=None):
              self.key = key
              self.left = left
              self.right = right


      def bst_max(root):
          node = root
          while node.right is not None:
              node = node.right
          return node.key
