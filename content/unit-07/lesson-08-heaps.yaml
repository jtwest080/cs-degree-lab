id: u7-heaps
title: Heaps and Priority Queues
minutes: 55
objective: |
  Implement the **priority queue** ADT with a **binary heap**: a complete binary tree stored in a plain array, where **sift up** and **sift down** keep the smallest item at the root in O(log n) per operation. Build heaps in O(n), sort with **heapsort**, and use Python's **`heapq`** for top-k, merging and scheduling problems.
outcomes:
  - Describe the priority queue ADT and compare possible implementations
  - Store a complete binary tree in an array, finding parents and children by arithmetic
  - Implement push with sift up and pop with sift down, and explain why each is O(log n)
  - Build a heap from a list in O(n) and sort a list with heapsort
  - Use `heapq`, including tuples with tie-breakers for priorities
  - Solve top-k, k-way merge and running-median problems with heaps

sections:
  - heading: Serving the most urgent first
    body: |
      In a hospital emergency department, patients aren't seen in arrival order: the most urgent case goes first. A **priority queue** is a collection where each item has a **priority**, and removal always takes the item with the **highest priority** (by convention in this lesson, the **smallest** priority number, so priority 1 beats priority 5).

      | Operation | Meaning |
      |---|---|
      | `push(item)` | add an item |
      | `pop()` | remove and return the smallest item |
      | `peek()` | look at the smallest item |

      Priority queues are everywhere: operating systems choosing the next process to run (Unit 10), network routers sending urgent packets first, simulations processing the next event in time order, and the shortest-path and spanning-tree algorithms of Unit 8.

      How could we build one?

      | Implementation | push | pop |
      |---|---|---|
      | Unsorted list | O(1) | O(n) (search for the minimum) |
      | Sorted list | O(n) (insert in place) | O(1) (take from the end) |
      | Balanced BST (Lesson 7.7) | O(log n) | O(log n) |
      | **Binary heap** | **O(log n)** | **O(log n)** |

      A balanced BST works, but it's complicated and keeps a full sorted order we don't need. A heap is far simpler, because it only promises that the **smallest** item is easy to find.

  - heading: The heap property
    body: |
      A **binary min-heap** is a binary tree with two properties:

      1. **Shape**: it's a **complete** binary tree (Lesson 7.6): every level is full except possibly the last, which is filled from the left.
      2. **Heap order**: every node's value is **less than or equal to** its children's values.

      ```text
                 1
               /   \
              3     2
             / \   /
            7   4 5
      ```

      So the smallest value is always at the root. Unlike a BST, there's no order between siblings or between left and right subtrees: 3 is on the left and 2 on the right, and that's fine. Because the tree is complete, its height is always about log₂ n.

      (A **max-heap** flips the order so the largest is at the root. Everything works the same way with the comparisons reversed.)

  - heading: A tree in an array
    body: |
      A complete tree has no gaps, so it can be stored in a plain list **level by level**, with no node objects or links at all:

      ```text
      index:   0  1  2  3  4  5
      value:  [1, 3, 2, 7, 4, 5]
      ```

      Parents and children are found by arithmetic. For the node at index i:

      - left child: 2i + 1
      - right child: 2i + 2
      - parent: (i − 1) // 2

      Check: the children of index 1 (value 3) are indexes 3 and 4 (values 7 and 4). The parent of index 5 (value 5) is (5 − 1) // 2 = 2 (value 2). This compact layout is fast (no pointers to follow, and good cache locality, Lesson 1.5) and uses no extra memory.

  - heading: Push and sift up
    body: |
      To push a value, add it at the **end** of the array, the next free spot in the bottom level, which keeps the shape complete. It might break heap order by being smaller than its parent. So **sift up**: while the new value is smaller than its parent, swap them.

      ```text
      push 0:   [1, 3, 2, 7, 4, 5, 0]    0 is at index 6, parent index 2 (value 2)
      swap:     [1, 3, 0, 7, 4, 5, 2]    now at index 2, parent index 0 (value 1)
      swap:     [0, 3, 1, 7, 4, 5, 2]    at the root: stop
      ```

      Each swap moves up one level, so push is **O(log n)**.

  - heading: Pop and sift down
    body: |
      The smallest value is at index 0. To remove it while keeping the tree complete, move the **last** element into the root's place and shrink the array by one. The new root is probably too big, so **sift down**: while it's larger than one of its children, swap it with the **smaller** child.

      ```text
      pop from [0, 3, 1, 7, 4, 5, 2]:  remove 0, move the last value (2) to the root
               [2, 3, 1, 7, 4, 5]      children 3 and 1: swap with the smaller, 1
               [1, 3, 2, 7, 4, 5]      2's only child is 5: no swap needed, stop
      ```

      Swapping with the smaller child matters: the smaller child becomes the parent of the other, so heap order holds. Pop is also **O(log n)**. Peek is O(1): it's just `heap[0]`.

  - heading: Building a heap and heapsort
    body: |
      To turn an arbitrary list into a heap, you could push items one at a time: O(n log n). The **bottom-up** method is faster: run sift down on every node that has children, starting from the last such node and working back to the root. Each subtree becomes a heap before its parent is processed.

      Surprisingly, this takes only **O(n)** time. Half the nodes are leaves and need no work; a quarter are one level up and sift down at most 1 step; an eighth at most 2 steps; and so on. The total is n/4 × 1 + n/8 × 2 + n/16 × 3 + ... which is less than n.

      **Heapsort** uses a heap to sort: build a heap, then pop n times. With a max-heap you can do it **in place**: repeatedly swap the root (the maximum) with the last element of the heap, shrink the heap by one, and sift the new root down. The maxima collect at the end of the array in sorted order. Heapsort is O(n log n) in the worst case and needs no extra memory, though in practice it's usually slower than merge sort (Lesson 4.7) and quicksort.

  - heading: Python's heapq
    body: |
      Python's `heapq` module provides min-heap functions that work on an ordinary list:

      ```python
      import heapq
      h = []
      heapq.heappush(h, 5)
      heapq.heappush(h, 1)
      heapq.heappush(h, 3)
      heapq.heappop(h)          # 1
      h[0]                      # peek: 3
      heapq.heapify(nums)       # turn a list into a heap in place, O(n)
      heapq.nsmallest(3, nums)  # the 3 smallest, as a sorted list
      heapq.nlargest(3, nums)
      ```

      For **items with priorities**, push tuples: `(priority, item)`. Tuples compare element by element (Lesson 3.5), so the priority decides. If two priorities are equal, Python compares the items next, which fails if they can't be compared (like dictionaries) and doesn't preserve arrival order. The standard fix adds a counter as a tie-breaker: `(priority, count, item)`, where `count` increases with every push. Equal priorities then come out first come, first served.

      There's no max-heap in `heapq`. The usual trick is to push negated priorities: `heappush(h, (-score, name))`.

  - heading: Heap patterns
    body: |
      - **Top k**: to find the k largest of n items (say, the 10 highest scores among millions), keep a **min-heap of size k**. For each new item, if it beats the smallest of the current top k (the heap's root), replace the root. That's O(n log k) time and only O(k) memory, so it works on a stream too large to store or sort.
      - **Merging k sorted lists**: put the first item of each list in a heap. Repeatedly pop the smallest and push the next item from the same list. O(N log k) for N items in total. This is how databases and `sort` commands merge sorted chunks of files too big for memory.
      - **Running median**: keep the smaller half of the numbers in a max-heap and the larger half in a min-heap, with sizes differing by at most 1. The median is always at one of the two roots.
      - **Scheduling and simulation**: a heap of `(time, event)` pairs always yields the next event to happen.

examples:
  - title: A min-heap from scratch
    intro: An array, sift up and sift down.
    code: |
      class MinHeap:
          def __init__(self):
              self._a = []

          def push(self, x):
              a = self._a
              a.append(x)
              i = len(a) - 1
              while i > 0 and a[i] < a[(i - 1) // 2]:
                  parent = (i - 1) // 2
                  a[i], a[parent] = a[parent], a[i]
                  i = parent

          def pop(self):
              a = self._a
              smallest = a[0]
              last = a.pop()
              if a:
                  a[0] = last
                  i = 0
                  while True:
                      left, right = 2 * i + 1, 2 * i + 2
                      child = i
                      if left < len(a) and a[left] < a[child]:
                          child = left
                      if right < len(a) and a[right] < a[child]:
                          child = right
                      if child == i:
                          break
                      a[i], a[child] = a[child], a[i]
                      i = child
              return smallest

      h = MinHeap()
      for x in [5, 3, 8, 1, 9, 2, 7]:
          h.push(x)
          print(f"push {x}: {h._a}")
      print("popped:", [h.pop() for _ in range(7)])
    output: |
      push 5: [5]
      push 3: [3, 5]
      push 8: [3, 5, 8]
      push 1: [1, 3, 8, 5]
      push 9: [1, 3, 8, 5, 9]
      push 2: [1, 3, 2, 5, 9, 8]
      push 7: [1, 3, 2, 5, 9, 8, 7]
      popped: [1, 2, 3, 5, 7, 8, 9]
    lines:
      - line: 6-12
        note: "Push: append at the end, then swap upwards while smaller than the parent at (i − 1) // 2."
      - line: 16-17
        note: "Pop: take the root, and remove the last element (O(1)) to fill the hole."
      - line: 21-29
        note: "Sift down: find the smallest of the node and its children (at 2i + 1 and 2i + 2). If that's a child, swap and continue from there."
      - line: 33-35
        note: "The array is never fully sorted, only heap-ordered, yet popping returns values in sorted order."
  - title: heapq with priorities
    intro: Tuples, a tie-breaking counter, and a max-heap by negation.
    code: |
      import heapq
      from itertools import count

      tickets = []
      order = count()
      for priority, issue in [(2, "printer jam"), (1, "server down"), (3, "new mouse"), (1, "no email"), (2, "slow wifi")]:
          heapq.heappush(tickets, (priority, next(order), issue))

      while tickets:
          priority, _, issue = heapq.heappop(tickets)
          print(priority, issue)

      scores = {"Ana": 82, "Ben": 95, "Cal": 77, "Dee": 95, "Eve": 88}
      heap = [(-s, name) for name, s in scores.items()]
      heapq.heapify(heap)
      print("top 3:", [heapq.heappop(heap)[1] for _ in range(3)])
      print("nsmallest:", heapq.nsmallest(2, scores.values()))
    output: |
      1 server down
      1 no email
      2 printer jam
      2 slow wifi
      3 new mouse
      top 3: ['Ben', 'Dee', 'Eve']
      nsmallest: [77, 82]
    lines:
      - line: 2
        note: "`itertools.count()` gives 0, 1, 2, ... each time `next` is called."
      - line: 7
        note: "`(priority, arrival number, issue)`: equal priorities are ordered by arrival, so the queue is fair."
      - line: 13-16
        note: "Negating the scores turns the min-heap into a max-heap. Ben and Dee tie on 95, so the name decides."
  - title: Top k from a stream
    intro: A size-k min-heap holds the best k seen so far.
    code: |
      import heapq
      import random

      def top_k(stream, k):
          heap = []
          for x in stream:
              if len(heap) < k:
                  heapq.heappush(heap, x)
              elif x > heap[0]:
                  heapq.heapreplace(heap, x)
          return sorted(heap, reverse=True)

      random.seed(2)
      readings = (random.randint(0, 10**6) for _ in range(200_000))
      print(top_k(readings, 5))
      print(top_k([4, 1, 7, 3, 9, 2], 3))
    output: |
      [999995, 999984, 999974, 999974, 999970]
      [9, 7, 4]
    lines:
      - line: 7-8
        note: "Fill the heap with the first k items."
      - line: 9-10
        note: "The root is the smallest of the current top k. Anything bigger replaces it. `heapreplace` pops and pushes in one step."
      - line: 13-14
        note: "A generator expression produces the readings one at a time, so 200,000 numbers are never all in memory: only 5 are kept."

playground:
  prompt: |
    Merging sorted lists with a heap. Each heap entry remembers which list it came from and where. Add more lists, including empty ones, and check the merged result is sorted.
  code: |
    import heapq

    def merge(lists):
        heap = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]
        heapq.heapify(heap)
        out = []
        while heap:
            value, i, j = heapq.heappop(heap)
            out.append(value)
            if j + 1 < len(lists[i]):
                heapq.heappush(heap, (lists[i][j + 1], i, j + 1))
        return out

    print(merge([[1, 4, 9], [2, 3, 10, 11], [], [0, 5]]))

exercises:
  - id: min-heap
    title: Build a min-heap
    difficulty: 2
    prompt: |
      Write a class `MinHeap` storing values in a Python list `self._a` as an array-based binary heap. Don't use `heapq`.

      - `push(x)`: append, then sift up.
      - `pop()`: remove and return the smallest value (raise `IndexError` if empty), then sift down.
      - `peek()`: the smallest value without removing it (raise `IndexError` if empty).
      - `len(h)`, and `is_valid()` returning True if every node is ≤ its children (useful for testing).
    starter: |
      class MinHeap:
          def __init__(self):
              self._a = []
    tests:
      - name: push peek pop
        code: |
          h = MinHeap()
          for x in [5, 3, 8, 1, 9, 2]:
              h.push(x)
              assert h.is_valid()
          assert h.peek() == 1 and len(h) == 6
          assert [h.pop() for _ in range(6)] == [1, 2, 3, 5, 8, 9]
          for op in ["pop", "peek"]:
              try:
                  getattr(MinHeap(), op)(); assert False
              except IndexError:
                  pass
      - name: array layout
        code: |
          h = MinHeap()
          for x in [5, 3, 8, 1, 9, 2, 7]:
              h.push(x)
          assert h._a == [1, 3, 2, 5, 9, 8, 7], h._a
          h.pop()
          assert h._a == [2, 3, 7, 5, 9, 8], h._a
      - name: random workload
        code: |
          import random
          random.seed(16)
          h, model = MinHeap(), []
          for _ in range(5000):
              if model and random.random() < 0.45:
                  m = min(model); model.remove(m)
                  assert h.pop() == m
              else:
                  x = random.randint(0, 500)
                  h.push(x); model.append(x)
          assert h.is_valid() and len(h) == len(model)
      - name: no heapq
        code: |
          assert "heapq" not in source
    hints:
      - "Sift up: `i = len(a) - 1`; while `i > 0` and `a[i] < a[(i - 1) // 2]`, swap with the parent and move i to the parent."
      - "Pop: save `a[0]`, then `last = a.pop()`; if the list isn't empty, put `last` at index 0 and sift down, swapping with the smaller child while a child is smaller."
      - "`is_valid`: for each i, check `a[i] <= a[2*i+1]` and `a[i] <= a[2*i+2]` when those indexes exist."
    solution: |
      class MinHeap:
          def __init__(self):
              self._a = []

          def push(self, x):
              a = self._a
              a.append(x)
              i = len(a) - 1
              while i > 0 and a[i] < a[(i - 1) // 2]:
                  p = (i - 1) // 2
                  a[i], a[p] = a[p], a[i]
                  i = p

          def _sift_down(self, i):
              a = self._a
              n = len(a)
              while True:
                  smallest = i
                  for c in (2 * i + 1, 2 * i + 2):
                      if c < n and a[c] < a[smallest]:
                          smallest = c
                  if smallest == i:
                      return
                  a[i], a[smallest] = a[smallest], a[i]
                  i = smallest

          def pop(self):
              if not self._a:
                  raise IndexError("pop from empty heap")
              smallest = self._a[0]
              last = self._a.pop()
              if self._a:
                  self._a[0] = last
                  self._sift_down(0)
              return smallest

          def peek(self):
              if not self._a:
                  raise IndexError("peek at empty heap")
              return self._a[0]

          def __len__(self):
              return len(self._a)

          def is_valid(self):
              a = self._a
              return all(a[i] <= a[c] for i in range(len(a)) for c in (2 * i + 1, 2 * i + 2) if c < len(a))
    explanation: |
      Both sifts move one level per step through a tree of height about log₂ n, so push and pop are O(log n). The layout test checks your array exactly: after popping 1, the last value (7) moves to the root and sifts down past 2, ending as `[2, 3, 7, 5, 9, 8]`. The random test compares with a simple list model after thousands of operations.

  - id: heapify-heapsort
    title: Heapify and heapsort
    difficulty: 2
    prompt: |
      Write, without `heapq` or `sorted`/`.sort()`:

      - `sift_down(a, i, n)`: sift the value at index i down within the first n elements of list a, as a **max**-heap (each parent ≥ its children). Return the number of swaps made.
      - `build_max_heap(a)`: turn list a into a max-heap **in place**, bottom-up (sift down every index from `len(a) // 2 - 1` down to 0). Return the total number of swaps.
      - `heapsort(a)`: sort list a into **ascending** order in place: build a max-heap, then repeatedly swap `a[0]` with the last element of the heap, shrink the heap by one, and sift down the root. Return a.
    starter: |
      def sift_down(a, i, n):
          pass


      def build_max_heap(a):
          pass


      def heapsort(a):
          pass
    tests:
      - name: build_max_heap
        code: |
          a = [3, 9, 2, 1, 4, 5]
          build_max_heap(a)
          assert a[0] == 9 and all(a[i] >= a[c] for i in range(6) for c in (2*i+1, 2*i+2) if c < 6), a
      - name: heapsort
        code: |
          import random
          random.seed(17)
          for n in [0, 1, 2, 10, 500]:
              a = [random.randint(-100, 100) for _ in range(n)]
              expected = sorted(a)
              assert heapsort(a) == expected and a == expected
          assert heapsort(list("heapsort")) == list("aehoprst")
      - name: building is linear
        code: |
          for n in [1000, 10000, 100000]:
              a = list(range(n))
              swaps = build_max_heap(a)
              assert swaps < n, f"{swaps} swaps for {n} items"
      - name: no shortcuts
        code: |
          assert "heapq" not in source and "sorted(" not in source and ".sort(" not in source
    hints:
      - "`sift_down(a, i, n)`: loop; find the largest of a[i], a[2i+1], a[2i+2] (only indexes < n); if it's a child, swap, count the swap, and continue from that child."
      - "`build_max_heap`: `for i in range(len(a) // 2 - 1, -1, -1): swaps += sift_down(a, i, len(a))`."
      - "`heapsort`: after building, `for end in range(len(a) - 1, 0, -1): a[0], a[end] = a[end], a[0]; sift_down(a, 0, end)`."
    solution: |
      def sift_down(a, i, n):
          swaps = 0
          while True:
              largest = i
              for c in (2 * i + 1, 2 * i + 2):
                  if c < n and a[c] > a[largest]:
                      largest = c
              if largest == i:
                  return swaps
              a[i], a[largest] = a[largest], a[i]
              swaps += 1
              i = largest


      def build_max_heap(a):
          swaps = 0
          for i in range(len(a) // 2 - 1, -1, -1):
              swaps += sift_down(a, i, len(a))
          return swaps


      def heapsort(a):
          build_max_heap(a)
          for end in range(len(a) - 1, 0, -1):
              a[0], a[end] = a[end], a[0]
              sift_down(a, 0, end)
          return a
    explanation: |
      Building from ascending input (the worst case for a max-heap) takes fewer than n swaps, confirming the O(n) analysis: most nodes are near the bottom and can't sift far. Heapsort then does n pops at O(log n) each. The sorted part grows from the right end while the heap shrinks on the left, so no second array is needed.

  - id: heap-patterns
    title: Top k and merging with heapq
    difficulty: 2
    prompt: |
      Use `heapq` to write:

      - `top_k(items, k)`: the k largest values, largest first, using a min-heap that never holds more than k items (works on any iterable, including generators).
      - `k_closest(points, k)`: the k points `(x, y)` closest to the origin (by x² + y²), closest first; break ties by the point itself (smaller tuple first).
      - `merge_sorted(lists)`: merge any number of sorted lists into one sorted list using a heap of `(value, list_index, position)` entries.
    starter: |
      import heapq


      def top_k(items, k):
          pass


      def k_closest(points, k):
          pass


      def merge_sorted(lists):
          pass
    tests:
      - name: top_k
        code: |
          assert top_k([4, 1, 7, 3, 9, 2], 3) == [9, 7, 4]
          assert top_k([5], 3) == [5] and top_k([], 2) == []
          assert top_k((x * 7919 % 10007 for x in range(100_000)), 4) == sorted((x * 7919 % 10007 for x in range(100_000)), reverse=True)[:4]
      - name: k_closest
        code: |
          pts = [(3, 3), (5, -1), (-2, 4), (1, 1), (0, 2), (-1, -1)]
          assert k_closest(pts, 3) == [(-1, -1), (1, 1), (0, 2)]
          assert k_closest(pts, 0) == []
      - name: merge_sorted
        code: |
          assert merge_sorted([[1, 4, 9], [2, 3, 10, 11], [], [0, 5]]) == [0, 1, 2, 3, 4, 5, 9, 10, 11]
          assert merge_sorted([]) == [] and merge_sorted([[], []]) == []
          import random
          random.seed(18)
          lists = [sorted(random.sample(range(10000), 300)) for _ in range(20)]
          assert merge_sorted(lists) == sorted(x for l in lists for x in l)
    hints:
      - "`top_k`: push while the heap has fewer than k items; afterwards, if an item is bigger than `heap[0]`, use `heapq.heapreplace(heap, item)`. Return `sorted(heap, reverse=True)`."
      - "`k_closest`: `heapq.nsmallest(k, points, key=lambda p: (p[0]**2 + p[1]**2, p))`."
      - "`merge_sorted`: start with the first element of each non-empty list, then pop the smallest and push the next element from the same list."
    solution: |
      import heapq


      def top_k(items, k):
          heap = []
          for x in items:
              if len(heap) < k:
                  heapq.heappush(heap, x)
              elif k > 0 and x > heap[0]:
                  heapq.heapreplace(heap, x)
          return sorted(heap, reverse=True)


      def k_closest(points, k):
          return heapq.nsmallest(k, points, key=lambda p: (p[0] ** 2 + p[1] ** 2, p))


      def merge_sorted(lists):
          heap = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]
          heapq.heapify(heap)
          out = []
          while heap:
              value, i, j = heapq.heappop(heap)
              out.append(value)
              if j + 1 < len(lists[i]):
                  heapq.heappush(heap, (lists[i][j + 1], i, j + 1))
          return out
    explanation: |
      Each pattern keeps the heap small: k items for top-k, one item per list for merging. That's what makes them efficient on huge inputs: O(n log k) instead of O(n log n), and memory proportional to k. `nsmallest` with a `key` function is a ready-made version of the top-k pattern; the key's tuple breaks ties between equally distant points.

  - id: priority-scheduler
    title: A fair priority scheduler
    difficulty: 3
    prompt: |
      Write `Scheduler` using `heapq`, where smaller priority numbers run first and equal priorities run in the order they were added:

      - `add(task, priority)`: add a task (a string). Each task name is unique among waiting tasks.
      - `next_task()`: remove and return the task to run next; raise `IndexError` if none are waiting.
      - `change(task, priority)`: change a waiting task's priority. It then counts as newly added for tie-breaking among its new priority.
      - `cancel(task)`: remove a waiting task (raise `KeyError` if it isn't waiting).
      - `len(s)`: the number of waiting tasks.

      Heaps can't remove an item from the middle efficiently. Use **lazy deletion**: keep a dict from task to its current heap entry; to change or cancel, mark the old entry as removed (for example, store entries as lists and set the task field to `None`) and push a fresh one if needed. `next_task` skips removed entries.
    starter: |
      import heapq
      from itertools import count


      class Scheduler:
          pass
    tests:
      - name: priority and fairness
        code: |
          s = Scheduler()
          s.add("backup", 3); s.add("email", 1); s.add("report", 2); s.add("alert", 1)
          assert len(s) == 4
          assert [s.next_task() for _ in range(4)] == ["email", "alert", "report", "backup"]
          try:
              s.next_task(); assert False
          except IndexError:
              pass
      - name: change and cancel
        code: |
          s = Scheduler()
          for t, p in [("a", 5), ("b", 5), ("c", 5), ("d", 1)]:
              s.add(t, p)
          s.change("c", 1)
          s.cancel("b")
          assert len(s) == 3
          assert [s.next_task() for _ in range(3)] == ["d", "c", "a"]
          try:
              s.cancel("b"); assert False
          except KeyError:
              pass
          s.add("b", 2)
          assert s.next_task() == "b"
      - name: random model
        code: |
          import random
          random.seed(19)
          s = Scheduler()
          model = {}
          order = 0
          for step in range(4000):
              r = random.random()
              if r < 0.4:
                  name = f"t{step}"
                  p = random.randint(1, 5)
                  s.add(name, p); model[name] = (p, order); order += 1
              elif r < 0.55 and model:
                  name = random.choice(sorted(model))
                  p = random.randint(1, 5)
                  s.change(name, p); model[name] = (p, order); order += 1
              elif r < 0.65 and model:
                  name = random.choice(sorted(model))
                  s.cancel(name); del model[name]
              elif model:
                  best = min(model, key=lambda n: model[n])
                  assert s.next_task() == best
                  del model[best]
              assert len(s) == len(model)
    hints:
      - "Keep `self._heap = []`, `self._entries = {}` (task → entry) and `self._counter = count()`. An entry is a list `[priority, next(self._counter), task]`."
      - "`cancel(task)`: `entry = self._entries.pop(task)` (KeyError if missing), then `entry[2] = None` to mark it removed. `change` = cancel + add."
      - "`next_task`: pop entries until one has a task that isn't None; delete it from `self._entries` and return it. If the heap runs out, raise IndexError."
    solution: |
      import heapq
      from itertools import count


      class Scheduler:
          def __init__(self):
              self._heap = []
              self._entries = {}
              self._counter = count()

          def add(self, task, priority):
              entry = [priority, next(self._counter), task]
              self._entries[task] = entry
              heapq.heappush(self._heap, entry)

          def cancel(self, task):
              entry = self._entries.pop(task)
              entry[2] = None

          def change(self, task, priority):
              self.cancel(task)
              self.add(task, priority)

          def next_task(self):
              while self._heap:
                  priority, _, task = heapq.heappop(self._heap)
                  if task is not None:
                      del self._entries[task]
                      return task
              raise IndexError("no tasks waiting")

          def __len__(self):
              return len(self._entries)
    explanation: |
      Lazy deletion leaves "dead" entries in the heap and throws them away when they reach the top. Every operation stays O(log n) (amortised over the dead entries popped). The counter guarantees no two entries ever compare equal on their first two fields, so Python never needs to compare the task names, and equal priorities come out in arrival order. This exact design is recommended in Python's `heapq` documentation, and you'll reuse it in the unit project.

  - id: running-median
    title: The running median
    difficulty: 3
    prompt: |
      Write `RunningMedian` with `add(x)` and `median()`, where `median()` returns the median of all numbers added so far (the middle value, or the average of the two middle values for an even count, as a float in that case). Raise `ValueError` if nothing has been added. Both operations must be fast enough for 100,000 additions with a median after each.

      Use two heaps: a **max-heap** `low` for the smaller half (store negated values with `heapq`) and a min-heap `high` for the larger half. Keep every value in `low` ≤ every value in `high`, and `len(low)` equal to `len(high)` or one more.

      Then write `medians(stream)` returning a list of the running median after each value.
    starter: |
      import heapq


      class RunningMedian:
          pass


      def medians(stream):
          pass
    tests:
      - name: small
        code: |
          r = RunningMedian()
          try:
              r.median(); assert False
          except ValueError:
              pass
          r.add(5); assert r.median() == 5
          r.add(15); assert r.median() == 10.0
          r.add(1); assert r.median() == 5
          r.add(3); assert r.median() == 4.0
          assert medians([2, 1, 5, 7, 2, 0, 5]) == [2, 1.5, 2, 3.5, 2, 2.0, 2]
      - name: matches sorting
        code: |
          import random, statistics
          random.seed(20)
          data = [random.randint(-50, 50) for _ in range(500)]
          got = medians(data)
          for i in range(0, 500, 37):
              assert got[i] == statistics.median(data[:i + 1]), i
      - name: fast
        code: |
          import random, time
          random.seed(21)
          data = [random.random() for _ in range(100_000)]
          t = time.time()
          m = medians(data)
          assert len(m) == 100_000 and time.time() - t < 5, "Use two heaps"
    hints:
      - "To add x: push it onto `low` (as -x). Then move the largest of `low` to `high`: `heappush(high, -heappop(low))`. If `high` is now bigger than `low`, move its smallest back: `heappush(low, -heappop(high))`."
      - "This keeps the halves ordered and balanced. The median is `-low[0]` when `low` is bigger, otherwise the average of `-low[0]` and `high[0]`."
    solution: |
      import heapq


      class RunningMedian:
          def __init__(self):
              self._low = []
              self._high = []

          def add(self, x):
              heapq.heappush(self._low, -x)
              heapq.heappush(self._high, -heapq.heappop(self._low))
              if len(self._high) > len(self._low):
                  heapq.heappush(self._low, -heapq.heappop(self._high))

          def median(self):
              if not self._low:
                  raise ValueError("no values added")
              if len(self._low) > len(self._high):
                  return -self._low[0]
              return (-self._low[0] + self._high[0]) / 2


      def medians(stream):
          r = RunningMedian()
          out = []
          for x in stream:
              r.add(x)
              out.append(r.median())
          return out
    explanation: |
      Passing every new value through `low` and then into `high` guarantees the halves stay ordered: whatever moves to `high` is the largest of the small half. Rebalancing then keeps the sizes within one. Each add is a few O(log n) heap operations, so 100,000 medians take O(n log n) in total, instead of O(n² log n) for sorting after every addition.

commonMistakes:
  - title: Expecting a heap to be sorted
    explanation: |
      Only the root is guaranteed to be the smallest. `print(heap)` shows a heap-ordered list, not a sorted one; pop repeatedly (or sort) to get sorted output.
  - title: Swapping with the wrong child in sift down
    explanation: |
      Always swap with the **smaller** child (larger, for a max-heap). Swapping with the other child breaks the heap property.
  - title: Equal priorities comparing items
    explanation: |
      `heappush(h, (priority, item))` compares items when priorities tie, which can crash or be unfair. Add a counter: `(priority, count, item)`.
  - title: Searching a heap for an item
    explanation: |
      Finding or removing an arbitrary item is O(n). Use lazy deletion with a dictionary of entries.
  - title: Using a max-heap for top k
    explanation: |
      For the k **largest** items, keep a **min**-heap of size k, so the weakest of the current top k is at the root, ready to be replaced.

summary:
  - "A **priority queue** always removes the most urgent (smallest) item; a **binary heap** gives O(log n) push and pop."
  - "A heap is a **complete** binary tree with every parent ≤ its children, stored level by level in an array: children of i are 2i + 1 and 2i + 2, parent is (i − 1) // 2."
  - "**Push** appends and sifts up; **pop** moves the last item to the root and sifts down, swapping with the smaller child."
  - "Bottom-up **heapify** is O(n); **heapsort** is O(n log n) in place."
  - "Python's **`heapq`** is a min-heap on a list; use `(priority, counter, item)` tuples, and negate for a max-heap."
  - "Heaps solve **top k**, **k-way merging**, **running medians** and **scheduling** efficiently."
