quiz:
  - type: mcq
    question: "In an array-based heap, where are the children of the node at index 4?"
    options: ["5 and 6", "8 and 9", "9 and 10", "3 and 5"]
    answer: 2
    explanation: "2 × 4 + 1 = 9 and 2 × 4 + 2 = 10."
  - type: mcq
    question: "Which of these lists is a valid min-heap?"
    options: ["[1, 5, 2, 3, 6]", "[2, 1, 3]", "[1, 3, 2, 4, 5]", "[3, 4, 5, 1]"]
    answer: 2
    explanation: "Check each parent against its children at 2i + 1 and 2i + 2: 1 ≤ 3 and 2; 3 ≤ 4 and 5. In the others, 5 > 3, 2 > 1 and 4 > 1 break the rule."
  - type: mcq
    question: "What does pop do in a min-heap, step by step?"
    options:
      - Removes the last element and returns it
      - Returns the root, moves the last element to the root, and sifts it down
      - Sorts the array and removes the first element
      - Removes the root and shifts every element left by one
    answer: 1
    explanation: Moving the last element keeps the tree complete; sifting down restores heap order in O(log n).
  - type: mcq
    question: "Why is building a heap bottom-up O(n) rather than O(n log n)?"
    options:
      - Because it doesn't compare anything
      - "Most nodes are near the bottom and can only sift down a few levels; the total work adds up to less than n"
      - Because the input is already sorted
      - It isn't; it's O(n log n)
    answer: 1
    explanation: "Half the nodes are leaves (0 steps), a quarter move at most 1, an eighth at most 2, and so on."
  - type: mcq
    question: "To find the 10 largest numbers in a stream of a billion, which is best?"
    options:
      - Sort them all and take the last 10
      - Keep a min-heap of size 10, replacing its root when a bigger number arrives
      - Keep a max-heap of all billion numbers
      - Use a hash table
    answer: 1
    explanation: "O(n log 10) time and O(10) memory."
  - type: mcq
    question: "Why push (priority, counter, task) rather than (priority, task) onto a heapq?"
    options:
      - It's faster
      - So that equal priorities come out in arrival order, and tasks are never compared with each other
      - heapq requires exactly three items
      - To save memory
    answer: 1
    explanation: The counter is unique, so ties are broken by arrival and the third field is never compared.
  - type: code
    question: |
      Write `kth_smallest(nums, k)` returning the k-th smallest number (k = 1 is the minimum) using `heapq`: copy the list, heapify it, and pop k times.
    starter: |
      import heapq


      def kth_smallest(nums, k):
          pass
    tests:
      - name: kth_smallest works
        code: |
          nums = [7, 2, 9, 4, 1]
          assert kth_smallest(nums, 1) == 1 and kth_smallest(nums, 3) == 4 and kth_smallest(nums, 5) == 9
          assert nums == [7, 2, 9, 4, 1], "Don't change the input list"
    solution: |
      import heapq


      def kth_smallest(nums, k):
          heap = list(nums)
          heapq.heapify(heap)
          for _ in range(k - 1):
              heapq.heappop(heap)
          return heap[0]
