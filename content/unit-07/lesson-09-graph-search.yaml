quiz:
  - type: mcq
    question: Which data structure does BFS use to decide which vertex to explore next?
    options: ["A stack", "A queue", "A heap", "A hash table"]
    answer: 1
    explanation: "First discovered, first explored: that's what makes it ring by ring."
  - type: mcq
    question: "Why does BFS find shortest paths in an unweighted graph?"
    options:
      - It tries every path
      - "It explores all vertices at distance d before any at distance d + 1, so each vertex is first reached by a shortest route"
      - It always goes towards the goal
      - It uses recursion
    answer: 1
    explanation: The queue holds at most two consecutive distances at any time.
  - type: mcq
    question: "What is the running time of BFS or DFS on a graph stored as adjacency lists?"
    options: ["O(V)", "O(E)", "O(V + E)", "O(V × E)"]
    answer: 2
    explanation: Each vertex is processed once and each edge examined a constant number of times.
  - type: mcq
    question: "In a DFS of a directed graph, you reach a vertex that is grey. What does that mean?"
    options:
      - It's unvisited
      - It's finished, so ignore it
      - It's on the current path, so there's a cycle
      - The graph is undirected
    answer: 2
    explanation: Grey vertices are still being explored, so the edge loops back into the current path.
  - type: mcq
    question: "Which graph has a topological order?"
    options:
      - Any directed graph
      - Only directed graphs with no cycles (DAGs)
      - Only trees
      - Only undirected graphs
    answer: 1
    explanation: "A cycle a → b → ... → a would need a before itself."
  - type: mcq
    question: "In Kahn's algorithm, which vertices can be added to the order next?"
    options:
      - Those with the most outgoing edges
      - Those whose remaining in-degree is 0
      - Any unvisited vertex
      - The alphabetically first vertex, always
    answer: 1
    explanation: In-degree 0 means all of its prerequisites are already in the order.
  - type: code
    question: |
      Write `connected(graph, a, b)` returning True if b can be reached from a in the adjacency dictionary `graph`, using BFS with `collections.deque`.
    starter: |
      from collections import deque


      def connected(graph, a, b):
          pass
    tests:
      - name: connected works
        code: |
          g = {1: [2], 2: [3], 3: [], 4: [1]}
          assert connected(g, 1, 3) and connected(g, 4, 3) and connected(g, 2, 2)
          assert not connected(g, 3, 1) and not connected(g, 1, 4)
    solution: |
      from collections import deque


      def connected(graph, a, b):
          seen = {a}
          queue = deque([a])
          while queue:
              v = queue.popleft()
              if v == b:
                  return True
              for w in graph[v]:
                  if w not in seen:
                      seen.add(w)
                      queue.append(w)
          return False
