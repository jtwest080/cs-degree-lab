id: u7-graphs
title: Graphs and Graph Search
minutes: 60
objective: |
  Build a reusable **graph class**, then explore graphs systematically with **breadth-first search (BFS)**, which finds shortest paths in unweighted graphs, and **depth-first search (DFS)**, which detects cycles. Finish with **topological sorting**: putting tasks in an order that respects their dependencies.
outcomes:
  - Implement a graph class for directed or undirected graphs using an adjacency dictionary of sets
  - Use BFS to compute distances from a start vertex and reconstruct shortest paths
  - Model grids and puzzles as graphs and solve them with BFS
  - Use DFS, recursively and with a stack, and explain how its order differs from BFS
  - Detect cycles in undirected graphs and in directed graphs (with three colours)
  - Order the vertices of a directed acyclic graph topologically with Kahn's algorithm

sections:
  - heading: Graphs, revisited
    body: |
      In Lesson 6.9 you met graphs as mathematics: vertices, edges, degree, paths, components, and an adjacency list stored as a dictionary of sets. This lesson builds on that with the two fundamental ways to **search** a graph. Almost every graph algorithm in Unit 8 (Dijkstra's shortest paths, minimum spanning trees, network flow) is a refinement of one of them.

      A small `Graph` class wraps the adjacency dictionary, so the rest of the code needn't worry whether edges are directed:

      ```python
      class Graph:
          def __init__(self, directed=False):
              self.directed = directed
              self.adj = {}
          def add_vertex(self, v):
              self.adj.setdefault(v, set())
          def add_edge(self, u, v):
              self.add_vertex(u)
              self.add_vertex(v)
              self.adj[u].add(v)
              if not self.directed:
                  self.adj[v].add(u)
          def neighbours(self, v):
              return self.adj[v]
      ```

      With sets, checking whether an edge exists is O(1) on average (Lesson 7.5), and listing a vertex's neighbours is O(degree).

  - heading: Breadth-first search
    body: |
      Drop a stone in a pond and the ripples spread out in rings. **Breadth-first search** explores a graph the same way: first the start vertex, then all its neighbours (distance 1), then all *their* unvisited neighbours (distance 2), and so on, ring by ring.

      The tool for "ring by ring" is a **queue** (Lesson 7.3), exactly as for level-order traversal of a tree (Lesson 7.6):

      ```python
      from collections import deque

      def bfs(graph, start):
          dist = {start: 0}
          queue = deque([start])
          while queue:
              v = queue.popleft()
              for w in graph.neighbours(v):
                  if w not in dist:
                      dist[w] = dist[v] + 1
                      queue.append(w)
          return dist
      ```

      The `dist` dictionary does double duty as the **visited** set: a vertex gets a distance the moment it's discovered, and is never queued twice. Each vertex is queued once and each edge examined once (twice if undirected), so BFS is **O(V + E)**.

      **Why BFS finds shortest paths.** The queue always holds vertices at distance d followed by vertices at distance d + 1, never anything further. So every vertex is first discovered from a vertex one step closer to the start, along a shortest route. This works for **unweighted** graphs, where every edge counts as one step. For weighted edges (road lengths, say), you'll need Dijkstra's algorithm in Unit 8, which replaces the queue with a priority queue (Lesson 7.8).

  - heading: Reconstructing the path
    body: |
      Distances tell you *how far*; to know *which way*, record each vertex's **parent**: the vertex it was discovered from. Then walk backwards from the goal to the start and reverse:

      ```python
      parent = {start: None}
      ...
                  if w not in parent:
                      parent[w] = v
      ...
      path = []
      v = goal
      while v is not None:
          path.append(v)
          v = parent[v]
      path.reverse()
      ```

      The parent links form a **BFS tree**: a tree (Lesson 6.9) containing a shortest path from the start to every reachable vertex. Sat-navs, network routing, "degrees of separation" on social networks, and puzzle solvers all rely on this.

  - heading: Grids are graphs
    body: |
      Many problems don't look like graphs at first. A maze drawn as a grid of characters is a graph: each open square is a vertex, joined to the open squares above, below, left and right.

      ```text
      S . . #
      # # . #
      . . . E
      ```

      You don't need to build an adjacency dictionary. Generate the neighbours on the fly: for square `(row, col)`, try `(row ± 1, col)` and `(row, col ± 1)`, keeping those inside the grid that aren't walls. BFS from S then finds the fewest moves to E.

      The same trick handles **state-space search**: the vertices are the possible states of a puzzle (positions of a sliding-tile puzzle, amounts of water in two jugs, a word in a word ladder), and edges are legal moves. BFS finds the solution with the fewest moves, often without the graph ever being stored in full.

  - heading: Depth-first search
    body: |
      **Depth-first search** goes as deep as possible along one route before backing up to try another, like exploring a maze by always taking the first unexplored turning and retracing your steps at dead ends. It's naturally recursive:

      ```python
      def dfs(graph, v, visited):
          visited.add(v)
          for w in graph.neighbours(v):
              if w not in visited:
                  dfs(graph, w, visited)
      ```

      Or iterative with a **stack** (Lesson 7.2), which avoids the recursion limit on large graphs. You used this for reachability in Lesson 6.9. DFS is also O(V + E) and finds the same set of reachable vertices as BFS, but in a different **order**, and the paths it follows are generally **not** shortest.

      | | BFS | DFS |
      |---|---|---|
      | Structure | queue | stack (or recursion) |
      | Order | ring by ring | deep first, then back up |
      | Shortest paths (unweighted)? | yes | no |
      | Typical uses | shortest paths, levels, nearest first | cycles, topological order, connectivity, mazes, backtracking |

      DFS's strength is that it naturally tracks the **current path** from the start: the vertices whose exploration has begun but not finished. That's exactly what's needed to spot cycles.

  - heading: Detecting cycles
    body: |
      **Undirected graphs.** During a DFS, if you reach an already-visited vertex that isn't the one you just came from (your parent), you've found another route to it: a cycle.

      **Directed graphs** need more care, because reaching a visited vertex isn't always a cycle. In the graph A → B, A → C, C → B, a DFS from A visits B, then from C reaches B again, but there's no cycle: both arrows lead *into* B. The fix is to give each vertex one of three **colours**:

      - **white**: not yet discovered;
      - **grey**: discovered, and still being explored (it's on the current path);
      - **black**: finished, along with everything reachable from it.

      Reaching a **grey** vertex means following an edge back to a vertex on the current path: a cycle. Reaching a black vertex is harmless. Cycle detection matters for dependencies: a spreadsheet whose cells refer to each other in a loop, a build system whose modules import each other, or course prerequisites that can never be satisfied.

  - heading: Topological sorting
    body: |
      Getting dressed has rules: socks before shoes, underwear before trousers, trousers before shoes. A **topological order** of a directed graph lists the vertices so that every edge goes **forwards**: for each edge u → v, u comes before v. One exists exactly when the graph has **no directed cycles**; such a graph is called a **DAG** (directed acyclic graph).

      **Kahn's algorithm** builds the order directly:

      1. Count each vertex's **in-degree** (the number of edges coming into it, Lesson 6.9).
      2. Put every vertex with in-degree 0 (no prerequisites) in a queue.
      3. Repeatedly remove a vertex from the queue and add it to the order. "Remove" its outgoing edges by reducing each neighbour's in-degree by 1; any neighbour that reaches 0 joins the queue.
      4. If the order contains every vertex, it's a valid topological order. If some vertices never reach in-degree 0, they're stuck in a cycle.

      Kahn's algorithm is O(V + E). Use a priority queue (Lesson 7.8) instead of a plain queue and you get the alphabetically smallest valid order. Package managers (`pip`, `npm`), build tools, spreadsheet recalculation and university course planners all use topological sorting. (There's also a DFS-based method: list vertices in **reverse** order of finishing. Unit 8 covers it.)

examples:
  - title: BFS distances and shortest paths
    intro: A small transport network, explored ring by ring.
    code: |
      from collections import deque

      routes = {
          "Ash": {"Bay", "Cove"}, "Bay": {"Ash", "Dale"}, "Cove": {"Ash", "Dale", "Elm"},
          "Dale": {"Bay", "Cove", "Fen"}, "Elm": {"Cove", "Fen"}, "Fen": {"Dale", "Elm"},
          "Gill": set(),
      }

      def bfs(graph, start):
          parent = {start: None}
          dist = {start: 0}
          queue = deque([start])
          while queue:
              v = queue.popleft()
              for w in sorted(graph[v]):
                  if w not in dist:
                      dist[w] = dist[v] + 1
                      parent[w] = v
                      queue.append(w)
          return dist, parent

      def path_to(parent, goal):
          if goal not in parent:
              return None
          path = []
          while goal is not None:
              path.append(goal)
              goal = parent[goal]
          return path[::-1]

      dist, parent = bfs(routes, "Ash")
      print(dist)
      print(path_to(parent, "Fen"), "|", path_to(parent, "Gill"))
    output: |
      {'Ash': 0, 'Bay': 1, 'Cove': 1, 'Dale': 2, 'Elm': 2, 'Fen': 3}
      ['Ash', 'Bay', 'Dale', 'Fen'] | None
    lines:
      - line: 15
        note: "Sorting the neighbours makes the output repeatable; sets have no fixed order."
      - line: 16-19
        note: "A vertex gets its distance and parent when first discovered, so it's queued at most once."
      - line: 22-29
        note: "Follow parent links back from the goal, then reverse. An unreachable vertex has no parent entry."
      - line: 33
        note: "Ash → Cove → Dale → Fen is equally short. BFS returns one shortest path, decided by the order neighbours are checked."
  - title: Solving a maze
    intro: Grid squares are vertices; neighbours are generated on the fly.
    code: |
      from collections import deque

      maze = [
          "S..#....",
          ".#.#.##.",
          ".#...#..",
          ".####.#.",
          "......#E",
      ]

      def solve(maze):
          rows, cols = len(maze), len(maze[0])
          start = next((r, c) for r in range(rows) for c in range(cols) if maze[r][c] == "S")
          parent = {start: None}
          queue = deque([start])
          while queue:
              r, c = queue.popleft()
              if maze[r][c] == "E":
                  path = []
                  node = (r, c)
                  while node:
                      path.append(node)
                      node = parent[node]
                  return path[::-1]
              for nr, nc in [(r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)]:
                  if 0 <= nr < rows and 0 <= nc < cols and maze[nr][nc] != "#" and (nr, nc) not in parent:
                      parent[(nr, nc)] = (r, c)
                      queue.append((nr, nc))
          return None

      path = solve(maze)
      print("moves:", len(path) - 1)
      grid = [list(row) for row in maze]
      for r, c in path[1:-1]:
          grid[r][c] = "*"
      print("\n".join("".join(row) for row in grid))
    output: |
      moves: 15
      S**#****
      .#*#*##*
      .#***#.*
      .####.#*
      ......#E
    lines:
      - line: 13
        note: "`next` with a generator finds the first square holding S."
      - line: 18-24
        note: "Stop as soon as E is dequeued: BFS reaches it by a shortest route."
      - line: 25-28
        note: "The four neighbours of a square, kept if inside the grid, not a wall and not yet seen."
      - line: 32-36
        note: "Mark the path with `*` on a copy of the maze, skipping the S and E squares."
  - title: Cycles and topological order
    intro: Three colours for directed cycles, and Kahn's algorithm for course order.
    code: |
      from collections import deque

      def has_cycle(graph):
          WHITE, GREY, BLACK = 0, 1, 2
          colour = {v: WHITE for v in graph}
          def visit(v):
              colour[v] = GREY
              for w in graph[v]:
                  if colour[w] == GREY:
                      return True
                  if colour[w] == WHITE and visit(w):
                      return True
              colour[v] = BLACK
              return False
          return any(colour[v] == WHITE and visit(v) for v in graph)

      def topo_order(graph):
          indegree = {v: 0 for v in graph}
          for v in graph:
              for w in graph[v]:
                  indegree[w] += 1
          queue = deque(sorted(v for v in graph if indegree[v] == 0))
          order = []
          while queue:
              v = queue.popleft()
              order.append(v)
              for w in sorted(graph[v]):
                  indegree[w] -= 1
                  if indegree[w] == 0:
                      queue.append(w)
          return order if len(order) == len(graph) else None

      courses = {"Intro": ["Data", "Maths"], "Maths": ["Algos"], "Data": ["Algos", "Systems"], "Algos": ["AI"], "Systems": [], "AI": []}
      print(has_cycle(courses), topo_order(courses))
      courses["AI"].append("Intro")
      print(has_cycle(courses), topo_order(courses))
    output: |
      False ['Intro', 'Data', 'Maths', 'Systems', 'Algos', 'AI']
      True None
    lines:
      - line: 7-14
        note: "Grey means \"on the current path\". An edge to a grey vertex closes a loop; black vertices are finished and safe."
      - line: 15
        note: "Start a DFS from every vertex not yet visited, in case the graph isn't connected."
      - line: 18-21
        note: "In-degree counts each course's prerequisites (edges point from prerequisite to course)."
      - line: 22
        note: "Courses with no prerequisites can be taken first."
      - line: 26-29
        note: "Taking a course removes one prerequisite from each course that needs it."
      - line: 32-35
        note: "Making AI a prerequisite of Intro creates a loop: no order exists, and both methods notice."

playground:
  prompt: |
    BFS and DFS visit the same vertices in different orders. Run this on the small directed graph below, then change the start vertex or add edges and predict both orders before running.
  code: |
    from collections import deque

    graph = {1: [2, 3], 2: [4, 5], 3: [6], 4: [], 5: [6], 6: [7], 7: []}

    def bfs_order(start):
        seen, queue, order = {start}, deque([start]), []
        while queue:
            v = queue.popleft()
            order.append(v)
            for w in graph[v]:
                if w not in seen:
                    seen.add(w)
                    queue.append(w)
        return order

    def dfs_order(v, seen=None):
        seen = seen if seen is not None else set()
        seen.add(v)
        order = [v]
        for w in graph[v]:
            if w not in seen:
                order += dfs_order(w, seen)
        return order

    print("BFS:", bfs_order(1))
    print("DFS:", dfs_order(1))

exercises:
  - id: graph-class
    title: A graph class
    difficulty: 1
    prompt: |
      Write a class `Graph(directed=False)` storing an adjacency dictionary of sets in `self.adj`:

      - `add_vertex(v)` (does nothing if v already exists) and `add_edge(u, v)` (adds both vertices if needed; for undirected graphs, the edge goes both ways).
      - `remove_edge(u, v)`: raise `KeyError` if the edge doesn't exist.
      - `has_edge(u, v)`, `neighbours(v)` (a sorted list), `vertices()` (a sorted list).
      - `edge_count()`: the number of edges (each undirected edge counts once).
      - `degree(v)`: for undirected graphs, the number of neighbours; for directed graphs, the out-degree.
      - `in_degree(v)`: the number of edges into v (for undirected graphs, the same as `degree`).
    starter: |
      class Graph:
          pass
    tests:
      - name: undirected
        code: |
          g = Graph()
          g.add_edge("A", "B"); g.add_edge("A", "C"); g.add_edge("B", "C"); g.add_vertex("D"); g.add_vertex("A")
          assert g.vertices() == ["A", "B", "C", "D"] and g.neighbours("A") == ["B", "C"]
          assert g.has_edge("B", "A") and not g.has_edge("A", "D")
          assert g.edge_count() == 3 and g.degree("C") == 2 and g.degree("D") == 0 and g.in_degree("A") == 2
          g.remove_edge("C", "A")
          assert not g.has_edge("A", "C") and g.edge_count() == 2
          try:
              g.remove_edge("A", "D"); assert False
          except KeyError:
              pass
      - name: directed
        code: |
          g = Graph(directed=True)
          g.add_edge(1, 2); g.add_edge(1, 3); g.add_edge(3, 2)
          assert g.has_edge(1, 2) and not g.has_edge(2, 1)
          assert g.edge_count() == 3 and g.degree(1) == 2 and g.in_degree(2) == 2 and g.in_degree(1) == 0
          assert g.neighbours(2) == []
          g.remove_edge(1, 2)
          assert g.edge_count() == 2 and g.vertices() == [1, 2, 3]
    hints:
      - "`add_vertex`: `self.adj.setdefault(v, set())`. `add_edge` calls it for both ends, adds v to u's set, and u to v's set if undirected."
      - "`remove_edge`: if `v not in self.adj.get(u, set())`, raise KeyError; otherwise discard in one or both directions."
      - "`edge_count`: total size of all neighbour sets, halved for undirected graphs (the handshake lemma). `in_degree(v)`: count the vertices whose set contains v."
    solution: |
      class Graph:
          def __init__(self, directed=False):
              self.directed = directed
              self.adj = {}

          def add_vertex(self, v):
              self.adj.setdefault(v, set())

          def add_edge(self, u, v):
              self.add_vertex(u)
              self.add_vertex(v)
              self.adj[u].add(v)
              if not self.directed:
                  self.adj[v].add(u)

          def remove_edge(self, u, v):
              if v not in self.adj.get(u, set()):
                  raise KeyError((u, v))
              self.adj[u].discard(v)
              if not self.directed:
                  self.adj[v].discard(u)

          def has_edge(self, u, v):
              return v in self.adj.get(u, set())

          def neighbours(self, v):
              return sorted(self.adj[v])

          def vertices(self):
              return sorted(self.adj)

          def edge_count(self):
              total = sum(len(s) for s in self.adj.values())
              return total if self.directed else total // 2

          def degree(self, v):
              return len(self.adj[v])

          def in_degree(self, v):
              if not self.directed:
                  return self.degree(v)
              return sum(1 for u in self.adj if v in self.adj[u])
    explanation: |
      A single `directed` flag lets one class serve both kinds of graph, with the difference confined to `add_edge`, `remove_edge` and the counting methods. `in_degree` for a directed graph scans every vertex, O(V); if you needed it often, you'd store a second dictionary of incoming edges, trading memory for speed.

  - id: bfs-paths
    title: Shortest paths with BFS
    difficulty: 2
    prompt: |
      Graphs here are plain adjacency dictionaries (vertex → set or list of neighbours). Write:

      - `distances(graph, start)`: a dictionary of BFS distances from start to every **reachable** vertex.
      - `shortest_path(graph, start, goal)`: a list of vertices from start to goal along a shortest path, or `None` if goal is unreachable. When several shortest paths exist, any is fine.
      - `within(graph, start, k)`: a sorted list of vertices at distance **1 to k** from start (for example, friends and friends-of-friends for k = 2).
      - `eccentricity(graph, start)`: the largest distance from start to any reachable vertex.
    starter: |
      from collections import deque


      def distances(graph, start):
          pass


      def shortest_path(graph, start, goal):
          pass


      def within(graph, start, k):
          pass


      def eccentricity(graph, start):
          pass
    tests:
      - name: distances
        code: |
          g = {1: {2, 3}, 2: {1, 4}, 3: {1, 4}, 4: {2, 3, 5}, 5: {4}, 6: set()}
          assert distances(g, 1) == {1: 0, 2: 1, 3: 1, 4: 2, 5: 3}
          assert distances(g, 6) == {6: 0}
          assert eccentricity(g, 1) == 3 and eccentricity(g, 5) == 3 and eccentricity(g, 4) == 2
      - name: shortest_path
        code: |
          g = {1: {2, 3}, 2: {1, 4}, 3: {1, 4}, 4: {2, 3, 5}, 5: {4}, 6: set()}
          p = shortest_path(g, 1, 5)
          assert p in ([1, 2, 4, 5], [1, 3, 4, 5]), p
          assert shortest_path(g, 1, 1) == [1] and shortest_path(g, 1, 6) is None
          d = {"a": ["b"], "b": ["c"], "c": [], "x": ["a"]}
          assert shortest_path(d, "a", "c") == ["a", "b", "c"] and shortest_path(d, "c", "a") is None
      - name: within
        code: |
          g = {1: {2, 3}, 2: {1, 4}, 3: {1, 4}, 4: {2, 3, 5}, 5: {4}}
          assert within(g, 1, 1) == [2, 3] and within(g, 1, 2) == [2, 3, 4] and within(g, 1, 0) == []
      - name: big grid
        code: |
          n = 150
          g = {}
          for r in range(n):
              for c in range(n):
                  g[(r, c)] = [(r + dr, c + dc) for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)) if 0 <= r + dr < n and 0 <= c + dc < n]
          p = shortest_path(g, (0, 0), (n - 1, n - 1))
          assert len(p) == 2 * n - 1
          assert all(abs(a[0] - b[0]) + abs(a[1] - b[1]) == 1 for a, b in zip(p, p[1:]))
    hints:
      - "`distances`: the BFS from the lesson, with `dist` doubling as the visited set."
      - "`shortest_path`: record `parent[w] = v` when w is discovered. If goal isn't in `parent` at the end, return None; otherwise walk back from goal to start and reverse."
      - "`within` and `eccentricity` can both use `distances`."
    solution: |
      from collections import deque


      def bfs(graph, start):
          dist = {start: 0}
          parent = {start: None}
          queue = deque([start])
          while queue:
              v = queue.popleft()
              for w in graph[v]:
                  if w not in dist:
                      dist[w] = dist[v] + 1
                      parent[w] = v
                      queue.append(w)
          return dist, parent


      def distances(graph, start):
          return bfs(graph, start)[0]


      def shortest_path(graph, start, goal):
          _, parent = bfs(graph, start)
          if goal not in parent:
              return None
          path = []
          v = goal
          while v is not None:
              path.append(v)
              v = parent[v]
          return path[::-1]


      def within(graph, start, k):
          return sorted(v for v, d in distances(graph, start).items() if 1 <= d <= k)


      def eccentricity(graph, start):
          return max(distances(graph, start).values())
    explanation: |
      One BFS gives distances and parents to **every** reachable vertex at once, in O(V + E). On the 150 × 150 grid (22,500 vertices), the shortest path from corner to corner has 2n − 2 moves, and the test checks every step is a single move. The largest eccentricity over all vertices is the graph's **diameter**, a measure of how "spread out" a network is.

  - id: maze-solver
    title: Escape the maze
    difficulty: 2
    prompt: |
      A maze is a list of equal-length strings: `#` is a wall, `.` is open, `S` is the start and `E` the exit. You can move up, down, left or right. Write:

      - `fewest_moves(maze)`: the minimum number of moves from S to E, or `-1` if E can't be reached.
      - `draw_path(maze)`: a list of strings showing a shortest path with `*` on every square between S and E (not on S or E themselves). Return `None` if there's no path.
      - `reachable_count(maze)`: how many open squares (including S and E) can be reached from S.
    starter: |
      from collections import deque


      def fewest_moves(maze):
          pass


      def draw_path(maze):
          pass


      def reachable_count(maze):
          pass
    tests:
      - name: fewest_moves
        code: |
          maze = ["S..#....", ".#.#.##.", ".#...#..", ".####.#.", "......#E"]
          assert fewest_moves(maze) == 15
          assert fewest_moves(["S#E"]) == -1 and fewest_moves(["SE"]) == 1
      - name: draw_path
        code: |
          maze = ["S.#", ".##", "..E"]
          assert draw_path(maze) == ["S.#", "*##", "**E"], draw_path(maze)
          assert draw_path(["S#E"]) is None
          big = ["S..#....", ".#.#.##.", ".#...#..", ".####.#.", "......#E"]
          drawn = draw_path(big)
          assert sum(row.count("*") for row in drawn) == 14
          assert all(len(a) == len(b) for a, b in zip(drawn, big))
      - name: reachable_count
        code: |
          assert reachable_count(["S.#", "##.", "..E"]) == 2
          assert reachable_count(["S..", "...", "..E"]) == 9
      - name: large open maze
        code: |
          n = 120
          rows = ["." * n for _ in range(n)]
          rows[0] = "S" + rows[0][1:]
          rows[-1] = rows[-1][:-1] + "E"
          assert fewest_moves(rows) == 2 * (n - 1)
    hints:
      - "Write one helper `search(maze)` that runs BFS from S over open squares and returns `(parent, end)`, where end is E's position if it was reached (or None)."
      - "A square `(r, c)` is open if it's inside the grid and `maze[r][c] != '#'`."
      - "For `draw_path`, convert the maze to a list of lists of characters, mark the path squares, then join each row back into a string."
    solution: |
      from collections import deque


      def search(maze):
          rows, cols = len(maze), len(maze[0])
          start = next((r, c) for r in range(rows) for c in range(cols) if maze[r][c] == "S")
          parent = {start: None}
          queue = deque([start])
          end = None
          while queue:
              r, c = queue.popleft()
              if maze[r][c] == "E" and end is None:
                  end = (r, c)
              for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                  if 0 <= nr < rows and 0 <= nc < cols and maze[nr][nc] != "#" and (nr, nc) not in parent:
                      parent[(nr, nc)] = (r, c)
                      queue.append((nr, nc))
          return parent, end


      def path_squares(maze):
          parent, end = search(maze)
          if end is None:
              return None
          path = []
          node = end
          while node is not None:
              path.append(node)
              node = parent[node]
          return path[::-1]


      def fewest_moves(maze):
          path = path_squares(maze)
          return -1 if path is None else len(path) - 1


      def draw_path(maze):
          path = path_squares(maze)
          if path is None:
              return None
          grid = [list(row) for row in maze]
          for r, c in path[1:-1]:
              grid[r][c] = "*"
          return ["".join(row) for row in grid]


      def reachable_count(maze):
          parent, _ = search(maze)
          return len(parent)
    explanation: |
      Grid squares are tuples `(row, col)`, which are hashable, so they work as dictionary keys (Lesson 3.5). The graph is never built explicitly: neighbours are calculated when needed. Running the BFS to completion (rather than stopping at E) lets one helper answer all three questions; for a single shortest-path query you could stop as soon as E is dequeued.

  - id: cycle-detection
    title: Detecting cycles
    difficulty: 3
    prompt: |
      Write, for graphs given as adjacency dictionaries:

      - `undirected_has_cycle(graph)`: True if an undirected graph (each edge listed in both directions, no self-loops) contains a cycle. During DFS, a visited neighbour that isn't the vertex you came from means a cycle.
      - `directed_has_cycle(graph)`: True if a directed graph contains a directed cycle (a self-loop `v → v` counts), using white/grey/black colours.
      - `find_cycle(graph)`: for a directed graph, return a list of vertices forming a cycle, starting and ending with the same vertex, like `["b", "c", "d", "b"]`, or `None`. (Keep the current path in a list during DFS; when you reach a grey vertex, the cycle is the part of the path from that vertex onwards.)

      The tests include a chain of 5,000 vertices, so either use an explicit stack or keep your recursion depth safe (you may call `sys.setrecursionlimit(20000)`).
    starter: |
      import sys

      sys.setrecursionlimit(20000)


      def undirected_has_cycle(graph):
          pass


      def directed_has_cycle(graph):
          pass


      def find_cycle(graph):
          pass
    tests:
      - name: undirected
        code: |
          tree = {1: {2, 3}, 2: {1, 4}, 3: {1}, 4: {2}, 5: set()}
          assert not undirected_has_cycle(tree)
          square = {1: {2, 4}, 2: {1, 3}, 3: {2, 4}, 4: {1, 3}}
          assert undirected_has_cycle(square)
          two_parts = {1: {2}, 2: {1}, 3: {4, 5}, 4: {3, 5}, 5: {3, 4}}
          assert undirected_has_cycle(two_parts)
      - name: directed
        code: |
          diamond = {"a": ["b", "c"], "b": ["d"], "c": ["d"], "d": []}
          assert not directed_has_cycle(diamond), "Two routes to d is not a cycle"
          loop = {"a": ["b"], "b": ["c"], "c": ["d"], "d": ["b"]}
          assert directed_has_cycle(loop) and directed_has_cycle({"x": ["x"]})
          assert not directed_has_cycle({})
      - name: find_cycle
        code: |
          loop = {"a": ["b"], "b": ["c"], "c": ["d"], "d": ["b"]}
          c = find_cycle(loop)
          assert c[0] == c[-1] and set(c) == {"b", "c", "d"} and len(c) == 4, c
          assert all(c[i + 1] in loop[c[i]] for i in range(len(c) - 1))
          assert find_cycle({"a": ["b", "c"], "b": ["d"], "c": ["d"], "d": []}) is None
          assert find_cycle({"x": ["x"]}) == ["x", "x"]
      - name: long chains
        code: |
          n = 5000
          chain = {i: [i + 1] for i in range(n)}
          chain[n] = []
          assert not directed_has_cycle(chain) and find_cycle(chain) is None
          chain[n] = [0]
          assert directed_has_cycle(chain) and len(find_cycle(chain)) == n + 2
          und = {i: set() for i in range(n)}
          for i in range(n - 1):
              und[i].add(i + 1); und[i + 1].add(i)
          assert not undirected_has_cycle(und)
    hints:
      - "Undirected: `visit(v, came_from)` marks v visited, then for each neighbour w: if w is unvisited and `visit(w, v)` finds a cycle, return True; if w is visited and `w != came_from`, return True."
      - "Directed: colour every vertex white; `visit(v)` sets grey, checks neighbours (grey → cycle; white → recurse), then sets black. Run it from every white vertex."
      - "`find_cycle`: keep `path = []`; append v when it turns grey and pop when it turns black. On reaching a grey w, return `path[path.index(w):] + [w]`."
    solution: |
      import sys

      sys.setrecursionlimit(20000)


      def undirected_has_cycle(graph):
          visited = set()

          def visit(v, came_from):
              visited.add(v)
              for w in graph[v]:
                  if w not in visited:
                      if visit(w, v):
                          return True
                  elif w != came_from:
                      return True
              return False

          return any(v not in visited and visit(v, None) for v in graph)


      def find_cycle(graph):
          WHITE, GREY, BLACK = 0, 1, 2
          colour = {v: WHITE for v in graph}
          path = []

          def visit(v):
              colour[v] = GREY
              path.append(v)
              for w in graph[v]:
                  if colour[w] == GREY:
                      return path[path.index(w):] + [w]
                  if colour[w] == WHITE:
                      found = visit(w)
                      if found:
                          return found
              path.pop()
              colour[v] = BLACK
              return None

          for v in graph:
              if colour[v] == WHITE:
                  found = visit(v)
                  if found:
                      return found
          return None


      def directed_has_cycle(graph):
          return find_cycle(graph) is not None
    explanation: |
      The grey vertices are exactly the current DFS path, so an edge to a grey vertex closes a loop through vertices on that path, and the list `path` lets you report it. Black vertices have been completely explored without finding a cycle, so revisiting them is safe: that's why the diamond isn't a cycle. In undirected graphs every edge looks like a "back edge" to the parent, which is why that one case must be excluded.

  - id: course-planner
    title: Planning courses with topological sort
    difficulty: 3
    prompt: |
      `prereqs` is a list of pairs `(before, after)` meaning course `before` must be taken before course `after`. `courses` is a list of every course name (some may have no prerequisites at all).

      - `course_order(courses, prereqs)`: a topological order using **Kahn's algorithm** with a **min-heap** (`heapq`) as the queue, so that whenever several courses are available, the alphabetically first is taken. Return `None` if the prerequisites contain a cycle.
      - `semesters(courses, prereqs)`: group courses into semesters, taking **every** available course each semester: semester 1 holds all courses with no prerequisites, semester 2 all courses whose prerequisites are all in semester 1, and so on. Return a list of sorted lists, or `None` for a cycle.
      - `is_valid_order(order, prereqs)`: True if every `(before, after)` pair has `before` earlier in `order`.
    starter: |
      import heapq


      def course_order(courses, prereqs):
          pass


      def semesters(courses, prereqs):
          pass


      def is_valid_order(order, prereqs):
          pass
    tests:
      - name: course_order
        code: |
          courses = ["AI", "Algos", "Data", "Intro", "Maths", "Systems"]
          prereqs = [("Intro", "Data"), ("Intro", "Maths"), ("Data", "Algos"), ("Maths", "Algos"), ("Data", "Systems"), ("Algos", "AI")]
          assert course_order(courses, prereqs) == ["Intro", "Data", "Maths", "Algos", "AI", "Systems"]
          assert course_order(["b", "a", "c"], []) == ["a", "b", "c"]
          assert course_order(["x", "y"], [("x", "y"), ("y", "x")]) is None
      - name: semesters
        code: |
          courses = ["AI", "Algos", "Data", "Intro", "Maths", "Systems", "Art"]
          prereqs = [("Intro", "Data"), ("Intro", "Maths"), ("Data", "Algos"), ("Maths", "Algos"), ("Data", "Systems"), ("Algos", "AI")]
          assert semesters(courses, prereqs) == [["Art", "Intro"], ["Data", "Maths"], ["Algos", "Systems"], ["AI"]]
          assert semesters(["a", "b"], [("a", "b"), ("b", "a")]) is None
      - name: random DAGs
        code: |
          import random
          random.seed(22)
          for _ in range(30):
              names = [f"c{i:03d}" for i in range(80)]
              rank = names[:]
              random.shuffle(rank)
              pairs = set()
              for _ in range(200):
                  i, j = sorted(random.sample(range(80), 2))
                  pairs.add((rank[i], rank[j]))
              pairs = list(pairs)
              order = course_order(names, pairs)
              assert order is not None and sorted(order) == names and is_valid_order(order, pairs)
              groups = semesters(names, pairs)
              flat = [c for g in groups for c in g]
              assert sorted(flat) == names and is_valid_order(flat, pairs)
          assert not is_valid_order(["b", "a"], [("a", "b")])
    hints:
      - "Build `after = {c: [] for c in courses}` and `indegree = {c: 0 for c in courses}` from the pairs."
      - "`course_order`: heapify the courses with in-degree 0; pop the smallest, append it, and decrease the in-degree of each course after it, pushing any that reach 0. If the order is shorter than `courses`, there's a cycle."
      - "`semesters`: `current = sorted(courses with in-degree 0)`; while current isn't empty, record it, then build the next list from courses whose in-degree drops to 0. `is_valid_order`: map each course to its position with a dict."
    solution: |
      import heapq


      def build(courses, prereqs):
          after = {c: [] for c in courses}
          indegree = {c: 0 for c in courses}
          for before, later in prereqs:
              after[before].append(later)
              indegree[later] += 1
          return after, indegree


      def course_order(courses, prereqs):
          after, indegree = build(courses, prereqs)
          heap = [c for c in courses if indegree[c] == 0]
          heapq.heapify(heap)
          order = []
          while heap:
              c = heapq.heappop(heap)
              order.append(c)
              for nxt in after[c]:
                  indegree[nxt] -= 1
                  if indegree[nxt] == 0:
                      heapq.heappush(heap, nxt)
          return order if len(order) == len(courses) else None


      def semesters(courses, prereqs):
          after, indegree = build(courses, prereqs)
          current = sorted(c for c in courses if indegree[c] == 0)
          result = []
          taken = 0
          while current:
              result.append(current)
              taken += len(current)
              following = []
              for c in current:
                  for nxt in after[c]:
                      indegree[nxt] -= 1
                      if indegree[nxt] == 0:
                          following.append(nxt)
              current = sorted(following)
          return result if taken == len(courses) else None


      def is_valid_order(order, prereqs):
          position = {c: i for i, c in enumerate(order)}
          return all(position[a] < position[b] for a, b in prereqs)
    explanation: |
      Kahn's algorithm only ever takes a course whose prerequisites have all been taken, so the order is valid by construction. If a cycle exists, the courses in it wait for each other forever and never reach in-degree 0, which the length check detects. The heap picks the alphabetically first available course in O(log V); the semester version processes the available courses level by level, like BFS, and the number of semesters is the length of the longest prerequisite chain.

commonMistakes:
  - title: Marking vertices visited too late in BFS
    explanation: |
      Mark a vertex (give it a distance or parent) when it's **discovered** and queued, not when it's dequeued. Otherwise it can be queued many times.
  - title: Using DFS to find shortest paths
    explanation: |
      DFS finds *a* path, usually not the shortest. For the fewest edges, use BFS; for weighted edges, Dijkstra (Unit 8).
  - title: Treating every visited vertex as a cycle in a directed graph
    explanation: |
      Reaching a finished (black) vertex isn't a cycle; only reaching one on the current path (grey) is.
  - title: Forgetting disconnected parts
    explanation: |
      A single search only sees what's reachable from its start. For whole-graph questions (any cycle? all components?), start a search from every unvisited vertex.
  - title: Relying on set order
    explanation: |
      Iterating over a set gives no guaranteed order, so BFS and DFS orders can vary. Sort neighbours if you need repeatable output.

summary:
  - "A **graph class** wraps an adjacency dictionary of sets, with a flag for directed edges."
  - "**BFS** uses a queue to explore ring by ring in O(V + E) and finds **shortest paths** in unweighted graphs; record **parents** to rebuild them."
  - "Grids and puzzles are graphs: generate neighbours on the fly and BFS finds the fewest moves."
  - "**DFS** uses recursion or a stack to go deep first, also O(V + E); it tracks the current path."
  - "Cycles: in undirected graphs, a visited neighbour other than the parent; in directed graphs, an edge to a **grey** vertex."
  - "A **topological order** exists exactly for DAGs; **Kahn's algorithm** repeatedly takes vertices with in-degree 0."
