starter: |
  # Unit 7 project: Help Desk
  import heapq
  from collections import deque


  class TicketMap:
      """A hash map with separate chaining. Use lists only: no dict or set."""

      def __init__(self, capacity=8):
          self.buckets = [[] for _ in range(capacity)]
          self.size = 0

      def put(self, key, value):
          pass

      def get(self, key):
          pass

      def remove(self, key):
          pass

      def __contains__(self, key):
          return False

      def __len__(self):
          return self.size

      def keys(self):
          return []


  class TicketQueue:
      """Most urgent first (priority 1 beats 2); ties go to the lower id. Lazy deletion."""

      def __init__(self):
          self.heap = []
          self.entries = {}

      def push(self, ticket_id, priority):
          pass

      def remove(self, ticket_id):
          pass

      def peek(self):
          pass

      def pop(self):
          pass

      def ordered(self):
          return []

      def __len__(self):
          return 0


  class HelpDesk:
      def __init__(self):
          self.tickets = TicketMap()
          self.queue = TicketQueue()
          self.history = []
          self.recent_ids = deque(maxlen=5)
          self.next_id = 1

      def open_ticket(self, title, priority):
          pass

      def next_ticket(self):
          pass

      def escalate(self, ticket_id):
          pass

      def close(self, ticket_id):
          pass

      def undo(self):
          pass

      def counts(self):
          return {"open": 0, "working": 0, "closed": 0}

      def recent(self):
          return []


  def process(desk, line):
      """Run one command line and return the line of output to print."""
      return ""


  def main():
      desk = HelpDesk()
      with open("desk.txt") as f:
          for line in f:
              line = line.strip()
              if line and not line.startswith("#"):
                  print(process(desk, line))


  main()
