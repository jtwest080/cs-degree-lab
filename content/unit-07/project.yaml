solution: |
  # Unit 7 project: Help Desk
  import heapq
  from collections import deque


  class TicketMap:
      """A hash map with separate chaining, built on lists only."""

      def __init__(self, capacity=8):
          self.buckets = [[] for _ in range(capacity)]
          self.size = 0

      def _bucket(self, key):
          return self.buckets[hash(key) % len(self.buckets)]

      def put(self, key, value):
          bucket = self._bucket(key)
          for pair in bucket:
              if pair[0] == key:
                  pair[1] = value
                  return
          bucket.append([key, value])
          self.size += 1
          if self.size > 0.75 * len(self.buckets):
              self._resize(2 * len(self.buckets))

      def _resize(self, capacity):
          old = self.buckets
          self.buckets = [[] for _ in range(capacity)]
          for bucket in old:
              for key, value in bucket:
                  self._bucket(key).append([key, value])

      def get(self, key):
          for k, v in self._bucket(key):
              if k == key:
                  return v
          raise KeyError(key)

      def remove(self, key):
          bucket = self._bucket(key)
          for i, pair in enumerate(bucket):
              if pair[0] == key:
                  bucket.pop(i)
                  self.size -= 1
                  return pair[1]
          raise KeyError(key)

      def __contains__(self, key):
          return any(k == key for k, _ in self._bucket(key))

      def __len__(self):
          return self.size

      def keys(self):
          return [k for bucket in self.buckets for k, _ in bucket]


  class TicketQueue:
      """Most urgent first (priority 1 beats 2); ties go to the lower id."""

      def __init__(self):
          self.heap = []
          self.entries = {}

      def push(self, ticket_id, priority):
          if ticket_id in self.entries:
              self.remove(ticket_id)
          entry = [priority, ticket_id, True]
          self.entries[ticket_id] = entry
          heapq.heappush(self.heap, entry)

      def remove(self, ticket_id):
          entry = self.entries.pop(ticket_id)
          entry[2] = False

      def _clean(self):
          while self.heap and not self.heap[0][2]:
              heapq.heappop(self.heap)

      def peek(self):
          self._clean()
          if not self.heap:
              raise IndexError("queue is empty")
          return self.heap[0][1]

      def pop(self):
          ticket_id = self.peek()
          heapq.heappop(self.heap)
          del self.entries[ticket_id]
          return ticket_id

      def ordered(self):
          return [(e[1], e[0]) for e in sorted(self.entries.values())]

      def __len__(self):
          return len(self.entries)


  class HelpDesk:
      def __init__(self):
          self.tickets = TicketMap()
          self.queue = TicketQueue()
          self.history = []
          self.recent_ids = deque(maxlen=5)
          self.next_id = 1

      def _touch(self, ticket_id):
          if ticket_id in self.recent_ids:
              self.recent_ids.remove(ticket_id)
          self.recent_ids.appendleft(ticket_id)

      def _ticket(self, ticket_id):
          if ticket_id not in self.tickets:
              raise ValueError(f"no ticket #{ticket_id}")
          return self.tickets.get(ticket_id)

      def open_ticket(self, title, priority):
          ticket_id = self.next_id
          self.next_id += 1
          self.tickets.put(ticket_id, {"id": ticket_id, "title": title, "priority": priority, "status": "open"})
          self.queue.push(ticket_id, priority)
          self.history.append(("open", ticket_id))
          self._touch(ticket_id)
          return ticket_id

      def next_ticket(self):
          if len(self.queue) == 0:
              return None
          ticket_id = self.queue.pop()
          self.tickets.get(ticket_id)["status"] = "working"
          self._touch(ticket_id)
          return ticket_id

      def escalate(self, ticket_id):
          ticket = self._ticket(ticket_id)
          if ticket["status"] != "open" or ticket["priority"] == 1:
              raise ValueError(f"cannot escalate #{ticket_id}")
          self.history.append(("escalate", ticket_id, ticket["priority"]))
          ticket["priority"] -= 1
          self.queue.push(ticket_id, ticket["priority"])
          self._touch(ticket_id)
          return ticket["priority"]

      def close(self, ticket_id):
          ticket = self._ticket(ticket_id)
          if ticket["status"] == "closed":
              raise ValueError(f"#{ticket_id} is already closed")
          self.history.append(("close", ticket_id, ticket["status"]))
          if ticket["status"] == "open":
              self.queue.remove(ticket_id)
          ticket["status"] = "closed"
          self._touch(ticket_id)

      def undo(self):
          if not self.history:
              return None
          action = self.history.pop()
          kind, ticket_id = action[0], action[1]
          ticket = self.tickets.get(ticket_id)
          if kind == "open":
              if ticket["status"] == "open":
                  self.queue.remove(ticket_id)
              self.tickets.remove(ticket_id)
              self.next_id -= 1
              if ticket_id in self.recent_ids:
                  self.recent_ids.remove(ticket_id)
          elif kind == "escalate":
              ticket["priority"] = action[2]
              self.queue.push(ticket_id, ticket["priority"])
          else:
              ticket["status"] = action[2]
              if action[2] == "open":
                  self.queue.push(ticket_id, ticket["priority"])
          return f"{kind} #{ticket_id}"

      def counts(self):
          totals = {"open": 0, "working": 0, "closed": 0}
          for ticket_id in self.tickets.keys():
              totals[self.tickets.get(ticket_id)["status"]] += 1
          return totals

      def recent(self):
          return list(self.recent_ids)


  def process(desk, line):
      words = line.split()
      command = words[0]
      try:
          if command == "open":
              ticket_id = desk.open_ticket(" ".join(words[2:]), int(words[1]))
              return f"Opened #{ticket_id} (P{words[1]}): {' '.join(words[2:])}"
          if command == "next":
              ticket_id = desk.next_ticket()
              if ticket_id is None:
                  return "Queue empty"
              return f"Working on #{ticket_id}: {desk.tickets.get(ticket_id)['title']}"
          if command == "escalate":
              priority = desk.escalate(int(words[1]))
              return f"Escalated #{words[1]} to P{priority}"
          if command == "close":
              desk.close(int(words[1]))
              return f"Closed #{words[1]}"
          if command == "undo":
              undone = desk.undo()
              return f"Undid {undone}" if undone else "Nothing to undo"
          if command == "status":
              c = desk.counts()
              return f"Open: {c['open']}, Working: {c['working']}, Closed: {c['closed']}"
          if command == "recent":
              return "Recent: " + ", ".join(f"#{t}" for t in desk.recent())
          if command == "queue":
              items = desk.queue.ordered()
              return "Queue: " + (", ".join(f"#{t} (P{p})" for t, p in items) if items else "empty")
          return f"Unknown command: {command}"
      except ValueError as error:
          return f"Error: {error}"


  def main():
      desk = HelpDesk()
      with open("desk.txt") as f:
          for line in f:
              line = line.strip()
              if line and not line.startswith("#"):
                  print(process(desk, line))


  main()
