    q = TicketQueue()
    for tid, p in [(1, 2), (2, 1), (3, 3), (4, 2), (5, 1)]:
        q.push(tid, p)
    assert len(q) == 5 and q.peek() == 2 and len(q) == 5
    assert q.ordered() == [(2, 1), (5, 1), (1, 2), (4, 2), (3, 3)]
    q.remove(5)
    q.push(3, 1)
    assert len(q) == 4 and [q.pop() for _ in range(4)] == [2, 3, 1, 4]
    assert len(q) == 0
    try:
        q.pop(); assert False, "pop on an empty queue should raise IndexError"
    except IndexError:
        pass
- name: TicketQueue uses lazy deletion
  code: |
    import time
    q = TicketQueue()
    q.push(1, 3)
    q.remove(1)
    assert len(q.heap) == 1, "remove should only mark the entry, leaving it in the heap"
    t = time.time()
    for i in range(20000):
        q.push(i, i % 7 + 1)
    for i in range(0, 20000, 3):
        q.remove(i)
    out = [q.pop() for _ in range(len(q))]
    expected = sorted((i for i in range(20000) if i % 3), key=lambda i: (i % 7 + 1, i))
    assert out == expected
    assert time.time() - t < 5, "Too slow: remove should not search the heap"
- name: HelpDesk opens, assigns, escalates and closes
