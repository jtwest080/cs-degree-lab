title: Help Desk
brief: |
  Every IT department, council office and online shop runs a **help desk**: people report problems as tickets, the most urgent get handled first, and staff need to undo mistakes and see what they touched last. In this project you'll build the engine of one, using four structures from this unit at once: your **own hash map** (Lesson 7.5) to store tickets, a **heap priority queue with lazy deletion** (Lesson 7.8) to pick the next ticket, a **stack** (Lesson 7.2) for undo, and a bounded **deque** (Lesson 7.3) of recent tickets.

  The commands are in `desk.txt` (created for you each time you run). Blank lines and lines starting with `#` are ignored.

  **Exact requirements** (the tests check each class on its own, including with tens of thousands of items):

  - `TicketMap`: a hash map with **separate chaining** built only from lists (no `dict` or `set` inside the class). `self.buckets` is a list of buckets, each a list of `[key, value]` pairs, starting with 8 buckets. `put(key, value)` inserts or updates; when the number of keys exceeds **0.75 × the number of buckets**, double the bucket count and rehash. `get(key)` and `remove(key)` (which returns the value) raise `KeyError` for missing keys. Also `key in m`, `len(m)` and `keys()` (a list, any order).
  - `TicketQueue`: a min-heap of `[priority, ticket_id, live]` entries in `self.heap`, plus a dictionary `self.entries` from ticket id to its entry. Priority 1 is the most urgent; equal priorities go to the **lower ticket id** (tickets are numbered in the order they were opened, so this is first come, first served). `push(ticket_id, priority)` adds a ticket or changes its priority; `remove(ticket_id)` **marks** the entry dead without searching the heap; `peek()` and `pop()` return the most urgent live ticket id (raising `IndexError` if there is none); `ordered()` lists the live `(ticket_id, priority)` pairs in the order they'd be popped; `len(q)` counts live tickets.
  - `HelpDesk` holds `self.tickets` (a `TicketMap` from id to a ticket dictionary with keys `id`, `title`, `priority` and `status`), `self.queue`, `self.history` (the undo stack) and `self.recent_ids` (a `deque(maxlen=5)`).
    - `open_ticket(title, priority)`: create ticket number 1, 2, 3, ... with status `"open"`, queue it, and return its id.
    - `next_ticket()`: pop the most urgent ticket, set its status to `"working"` and return its id, or `None` if the queue is empty.
    - `escalate(ticket_id)`: reduce an **open** ticket's priority by 1 and return the new priority. Raise `ValueError` if the ticket doesn't exist, isn't open, or is already priority 1.
    - `close(ticket_id)`: set an open or working ticket's status to `"closed"` (removing it from the queue if it was waiting). Raise `ValueError` if it doesn't exist or is already closed.
    - `undo()`: reverse the most recent **open**, **escalate** or **close** (`next_ticket` can't be undone) and return a string such as `"close #4"`, or `None` if there's nothing to undo. Undoing an open deletes the ticket and frees its id; undoing a close restores the ticket's previous status (and re-queues it if it was open).
    - `recent()`: the ids of the last five tickets opened, assigned, escalated or closed, most recent first, each listed once. Undo doesn't count as touching a ticket, but undoing an open removes that ticket from the list.
    - `counts()`: a dictionary such as `{"open": 2, "working": 1, "closed": 0}`.
  - `process(desk, line)` runs one command and returns one line of output. Commands: `open PRIORITY TITLE...`, `next`, `escalate ID`, `close ID`, `undo`, `status`, `recent` and `queue`. A `ValueError` becomes `Error: ` followed by its message. The exact wording is in the expected output below.
  - `main()` prints the output of every command in `desk.txt`:

    ```text
    Opened #1 (P2): Printer jammed on floor 3
    Opened #2 (P1): Email server down
    Opened #3 (P3): Request a new mouse
    Opened #4 (P2): VPN keeps disconnecting
    Working on #2: Email server down
    Escalated #3 to P2
    Escalated #3 to P1
    Opened #5 (P1): Payroll site shows an error
    Queue: #3 (P1), #5 (P1), #1 (P2), #4 (P2)
    Closed #4
    Undid close #4
    Error: no ticket #9
    Working on #3: Request a new mouse
    Working on #5: Payroll site shows an error
    Closed #2
    Error: cannot escalate #2
    Open: 2, Working: 2, Closed: 1
    Recent: #2, #5, #3, #4, #1
    Queue: #1 (P2), #4 (P2)
    ```

    The last line of the program calls `main()`.
prelude: |
  # Creates desk.txt fresh before every run.
  with open("desk.txt", "w") as _f:
      _f.write("# Monday morning at the help desk\nopen 2 Printer jammed on floor 3\nopen 1 Email server down\nopen 3 Request a new mouse\nopen 2 VPN keeps disconnecting\n\nnext\nescalate 3\nescalate 3\nopen 1 Payroll site shows an error\nqueue\nclose 4\nundo\nclose 9\nnext\nnext\nclose 2\nescalate 2\nstatus\nrecent\nqueue\n")
  del _f
steps:
- title: The hash map
  body: Start from the chained hash map in Lesson 7.5. `_bucket(key)` returns `self.buckets[hash(key) % len(self.buckets)]`. In `put`, scan the bucket for the key and update it; otherwise append a new pair, add 1 to the size, and resize if the load factor is now above 0.75. Resizing builds a fresh list of empty buckets and re-inserts every pair, because each key's bucket depends on the number of buckets.
- title: The priority queue
  body: Reuse the lazy-deletion scheduler from Lesson 7.8. Entries are lists, not tuples, so `remove` can set `entry[2] = False` and leave the dead entry in the heap. Before peeking or popping, pop dead entries off the top. Pushing an id that's already queued should remove the old entry first, which is how a priority change works. `ordered()` can simply sort the live entries in `self.entries.values()`.
- title: Opening, assigning and closing
  body: Each `HelpDesk` method finds the ticket in the map, checks its status, updates it, and keeps the queue in step. Write a small helper that raises `ValueError` for an unknown id, and another, `_touch(ticket_id)`, that removes the id from the deque if present and then uses `appendleft`, so the newest is first and the oldest falls off the end automatically.
- title: Undo
  body: 'Every undoable action pushes a record onto `self.history` holding what''s needed to reverse it: `("open", id)`, `("escalate", id, old_priority)` or `("close", id, old_status)`. `undo` pops the latest record and applies the opposite change. Because opens happen in order, the ticket being un-opened always has the highest id, so subtracting 1 from the next id is safe.'
- title: Commands and the report
  body: Split each line into words. For `open`, the priority is `words[1]` and the title is the remaining words joined with spaces. Wrap the command handling in `try`/`except ValueError` (Lesson 2.9). Write `main()` and compare your output with the expected session line by line.
