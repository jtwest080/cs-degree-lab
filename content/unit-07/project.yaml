    d = HelpDesk()
    assert d.open_ticket("A", 2) == 1 and d.open_ticket("B", 3) == 2 and d.open_ticket("C", 2) == 3
    assert d.escalate(2) == 2 and d.escalate(2) == 1
    assert d.next_ticket() == 2 and d.tickets.get(2)["status"] == "working"
    d.close(3)
    assert d.counts() == {"open": 1, "working": 1, "closed": 1}
    for bad in (lambda: d.close(3), lambda: d.escalate(2), lambda: d.escalate(42), lambda: d.close(42)):
        try:
            bad(); assert False, "Invalid actions should raise ValueError"
        except ValueError:
            pass
    d.open_ticket("D", 1)
    assert d.next_ticket() == 4 and d.next_ticket() == 1 and d.next_ticket() is None
- name: undo reverses open, escalate and close
  code: |
    d = HelpDesk()
    d.open_ticket("A", 3); d.open_ticket("B", 2)
    d.escalate(1)
    d.close(2)
    assert d.undo() == "close #2" and d.tickets.get(2)["status"] == "open"
    assert d.queue.ordered() == [(1, 2), (2, 2)]
    assert d.undo() == "escalate #1" and d.tickets.get(1)["priority"] == 3
    assert d.queue.ordered() == [(2, 2), (1, 3)]
    assert d.undo() == "open #2" and 2 not in d.tickets and len(d.queue) == 1
    assert d.open_ticket("B again", 1) == 2, "Undoing an open should free up its id"
    d.next_ticket()
    d.close(2)
    d.undo()
    assert d.tickets.get(2)["status"] == "working" and len(d.queue) == 1, "Undoing a close restores the old status"
    d.undo(); d.undo()
    assert d.undo() is None and len(d.tickets) == 0
- name: recent lists the last five tickets touched
  code: |
    d = HelpDesk()
    for i in range(7):
        d.open_ticket(f"T{i}", 2)
    assert d.recent() == [7, 6, 5, 4, 3]
    d.close(5)
    assert d.recent() == [5, 7, 6, 4, 3]
