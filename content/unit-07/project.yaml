    import ast, time
    tree = ast.parse(source)
    cls = next(n for n in ast.walk(tree) if isinstance(n, ast.ClassDef) and n.name == "TicketMap")
    for node in ast.walk(cls):
        assert not isinstance(node, (ast.Dict, ast.DictComp, ast.Set, ast.SetComp)), "TicketMap must be built from lists, not dicts or sets"
        assert not (isinstance(node, ast.Name) and node.id in ("dict", "set")), "TicketMap must not use dict or set"
    m = TicketMap()
    t = time.time()
    for i in range(20000):
        m.put(i, i * i)
    assert len(m) == 20000 and all(m.get(i) == i * i for i in range(0, 20000, 7))
    assert len(m.buckets) >= 20000 / 0.75, f"Resize when the load factor passes 0.75 (only {len(m.buckets)} buckets)"
    for i in range(0, 20000, 2):
        m.remove(i)
    assert len(m) == 10000 and 3 in m and 4 not in m
    assert time.time() - t < 5, "Too slow: is put resizing by doubling?"
