# Terms introduced in Unit 8. `lesson` is the id of the lesson that introduces the term.
terms:
  - term: Big Omega (Ω)
    definition: "A lower bound on growth. f(n) is Ω(g(n)) when f grows at least as fast as a constant multiple of g for large n. It describes how much work is needed at minimum."
    lesson: u8-asymptotics
  - term: Big Theta (Θ)
    definition: "A tight bound. f(n) is Θ(g(n)) when it is both O(g(n)) and Ω(g(n)), so it grows at the same rate as g up to constant factors."
    lesson: u8-asymptotics
  - term: Polynomial time
    definition: "Running time bounded by n raised to some fixed power, such as n, n log n or n³. Problems solvable this way are generally considered practical."
    lesson: u8-asymptotics
  - term: Exponential time
    definition: "Running time that multiplies by a constant for every extra input item, such as 2ⁿ. It becomes impossible for even moderate n."
    lesson: u8-asymptotics
  - term: Recursion tree
    definition: "A diagram of a recursive algorithm in which each node is one call, labelled with the work it does besides recursing. Adding up the work level by level gives the total cost."
    lesson: u8-recurrences
  - term: Unrolling
    definition: "Repeatedly substituting a recurrence into itself to see the pattern of terms and sum them to a closed form."
    lesson: u8-recurrences
  - term: Master theorem
    definition: "A rule for solving recurrences T(n) = aT(n/b) + f(n) by comparing f(n) with n raised to log base b of a, which tells you whether the leaves, every level or the root dominates."
    lesson: u8-recurrences
  - term: Combine step
    definition: "The work in a divide-and-conquer algorithm that merges the solutions of the subproblems into the answer, such as the merge in merge sort."
    lesson: u8-divide-conquer
  - term: Quickselect
    definition: "A divide-and-conquer algorithm that finds the k-th smallest item by partitioning around a pivot and recursing into only the side that holds it, in expected linear time."
    lesson: u8-divide-conquer
  - term: Comparison sort
    definition: "A sorting algorithm that learns about the order only by comparing pairs of items. Every comparison sort needs Ω(n log n) comparisons in the worst case."
    lesson: u8-sorting-bounds
  - term: Decision tree (sorting)
    definition: "A binary tree in which each internal node is one comparison and each leaf is one final ordering. It must have at least n! leaves, so its height is at least log₂(n!), which is Ω(n log n)."
    lesson: u8-sorting-bounds
  - term: Radix sort
    definition: "A non-comparison sort that sorts numbers one digit at a time using a stable sort for each digit, from least to most significant. It takes Θ(d(n + b)) time for d digits in base b."
    lesson: u8-sorting-bounds
  - term: Bucket sort
    definition: "A non-comparison sort that spreads items into buckets by value, sorts each bucket and joins them. It is linear on average for evenly spread data."
    lesson: u8-sorting-bounds
  - term: Greedy-choice property
    definition: "The property that some optimal solution contains the greedy first choice, so making that choice never rules out an optimal answer."
    lesson: u8-greedy
  - term: Optimal substructure
    definition: "The property that an optimal solution to a problem contains optimal solutions to its subproblems. It is what lets greedy algorithms and dynamic programming build answers from smaller parts."
    lesson: u8-greedy
  - term: Greedy stays ahead
    definition: "A proof technique that shows the greedy solution is at least as good as any other solution after every step, and so is best at the end."
    lesson: u8-greedy
  - term: Interval scheduling
    definition: "Choosing the largest set of non-overlapping intervals. Taking the interval that finishes earliest at each step is optimal."
    lesson: u8-greedy
  - term: Interval partitioning
    definition: "Assigning intervals to the fewest resources (such as rooms) so that no two in the same resource overlap. The answer equals the largest number of intervals overlapping at one moment."
    lesson: u8-greedy
  - term: Lateness
    definition: "How long after its deadline a job finishes (zero if it is on time). Running jobs in earliest-deadline-first order minimises the maximum lateness."
    lesson: u8-greedy
  - term: Fractional knapsack
    definition: "The knapsack problem where items may be split. Taking items in order of value per weight is optimal."
    lesson: u8-greedy
  - term: Prefix code
    definition: "A set of codes in which no code is the beginning of another, so an encoded message can be decoded without separators."
    lesson: u8-greedy
  - term: Huffman coding
    definition: "A greedy algorithm that builds an optimal prefix code by repeatedly merging the two least frequent symbols, giving frequent symbols short codes."
    lesson: u8-greedy
  - term: Overlapping subproblems
    definition: "A property of a recursion in which the same smaller problems are solved many times, so storing answers saves a large amount of work."
    lesson: u8-dp-basics
  - term: Tabulation
    definition: "Bottom-up dynamic programming: filling a table of subproblem answers in an order where every cell's dependencies are already filled."
    lesson: u8-dp-basics
  - term: DP state
    definition: "The small set of values that describes one subproblem in a dynamic programming solution, such as the amount in coin change or a pair of prefix lengths."
    lesson: u8-dp-basics
  - term: Coin change
    definition: "The problem of making an amount from the fewest coins (or counting the ways). Greedy fails for some coin systems, but dynamic programming works for any."
    lesson: u8-dp-basics
  - term: Subsequence
    definition: "A sequence obtained from another by deleting some items without changing the order of the rest. The items need not be next to each other."
    lesson: u8-dp-basics
  - term: Longest increasing subsequence
    definition: "The longest subsequence of a list whose values strictly increase. A dynamic programming solution takes O(n²) time."
    lesson: u8-dp-basics
  - term: Longest common subsequence
    definition: "The longest subsequence shared by two sequences. It is the idea behind diff tools and is solved with a two-dimensional table in O(mn) time."
    lesson: u8-dp-sequences
  - term: Edit distance
    definition: "The fewest single-character insertions, deletions and substitutions needed to turn one string into another, also called Levenshtein distance."
    lesson: u8-dp-sequences
  - term: 0/1 knapsack
    definition: "The knapsack problem where each item is taken whole or not at all. Greedy fails, but dynamic programming solves it in O(nW) time."
    lesson: u8-dp-sequences
  - term: Pseudo-polynomial time
    definition: "Running time that is polynomial in the numeric value of an input number (such as the capacity W) but exponential in the number of digits needed to write it."
    lesson: u8-dp-sequences
  - term: Subset sum
    definition: "The problem of deciding whether some subset of a set of numbers adds up to a target. It is knapsack with true or false values."
    lesson: u8-dp-sequences
  - term: Weighted graph
    definition: "A graph in which every edge carries a number, such as a distance, cost or time."
    lesson: u8-shortest-paths
  - term: Shortest path
    definition: "A path between two vertices with the smallest total edge weight, which may use more edges than other paths."
    lesson: u8-shortest-paths
  - term: Relaxation
    definition: "Updating the best known distance to a vertex v when going through a vertex u gives a shorter route, that is when dist[u] + w is less than dist[v]."
    lesson: u8-shortest-paths
  - term: Dijkstra's algorithm
    definition: "A shortest-path algorithm for non-negative weights that repeatedly finalises the closest unfinished vertex using a priority queue. It takes O((V + E) log V) time."
    lesson: u8-shortest-paths
  - term: Bellman-Ford algorithm
    definition: "A shortest-path algorithm that relaxes every edge V − 1 times. It handles negative weights, detects negative cycles and takes O(VE) time."
    lesson: u8-shortest-paths
  - term: Negative cycle
    definition: "A cycle whose edge weights add up to less than zero, so going round it repeatedly makes a path cheaper without limit and no shortest path exists."
    lesson: u8-shortest-paths
  - term: Floyd-Warshall algorithm
    definition: "A dynamic programming algorithm that finds the shortest distances between all pairs of vertices in O(V³) time by allowing one more intermediate vertex at a time."
    lesson: u8-shortest-paths
  - term: Spanning tree
    definition: "A set of V − 1 edges of a connected graph that connects all V vertices without forming a cycle."
    lesson: u8-spanning-trees
  - term: Minimum spanning tree (MST)
    definition: "A spanning tree with the smallest possible total edge weight."
    lesson: u8-spanning-trees
  - term: Cut property
    definition: "Among the edges crossing any division of the vertices into two groups, the cheapest edge belongs to some minimum spanning tree. It is why greedy MST algorithms are correct."
    lesson: u8-spanning-trees
  - term: Union-find
    definition: "A data structure that tracks which items are in the same group, with find and union operations. With path compression and union by size each operation is almost constant time. Also called disjoint-set."
    lesson: u8-spanning-trees
  - term: Path compression
    definition: "A union-find optimisation in which find points every item it passes directly at the root, flattening the tree for later searches."
    lesson: u8-spanning-trees
  - term: Kruskal's algorithm
    definition: "A minimum spanning tree algorithm that sorts the edges by weight and adds each edge that joins two different groups, using union-find. It takes O(E log E) time."
    lesson: u8-spanning-trees
  - term: Prim's algorithm
    definition: "A minimum spanning tree algorithm that grows one tree from a start vertex, repeatedly adding the cheapest edge that leaves the tree. It takes O(E log V) time with a heap."
    lesson: u8-spanning-trees
