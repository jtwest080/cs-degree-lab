id: u8-asymptotics
title: "Big-O, Big-Ω and Big-Θ: Growth Rates Made Precise"
minutes: 55
objective: |
  In Lesson 4.2 you counted steps and described growth informally. Now you'll make it **precise**: define **O**, **Ω** and **Θ** with exact inequalities, prove bounds by choosing constants, apply the rules for combining them, and read the growth of real code from its loops.
outcomes:
  - State the formal definitions of O, Ω and Θ and prove a bound by choosing the constants c and n₀
  - Use the sum, product and transitivity rules, and explain why constants and log bases don't matter
  - Order the common growth classes from constant to factorial and say what each means in practice
  - Work out the exact step count of simple loops, including triangular and halving loops
  - "Keep three ideas apart that beginners mix up: upper bound versus worst case, best/worst/average case, and input size"

sections:
  - heading: Why make it precise?
    body: |
      In Lesson 4.2 you learned to say "linear search is O(n)" and "two nested loops are O(n²)". That informal rule works most of the time, but it leaves questions open. Is `3n² + 10n + 5` really "the same" as `n²`? Is it wrong to say that binary search is O(n)? What does "O" actually promise?

      To compare algorithms honestly, to prove that one is faster than another, and to read the analysis in later units (recurrences, dynamic programming, shortest paths), you need a definition you can **check**. This lesson gives you one, and shows that the informal rules you already use are consequences of it.

      One idea underlies everything: we compare how step counts **grow** as the input size n gets large, ignoring constant factors and small inputs. Constants depend on the computer, the language and the programmer; growth is a property of the algorithm itself.

  - heading: "Big-O: an upper bound"
    body: |
      Let f(n) and g(n) be step counts (functions from input size to a non-negative number of steps). We say

      > **f(n) = O(g(n))** if there are constants **c > 0** and **n₀** such that **f(n) ≤ c · g(n) for every n ≥ n₀**.

      In words: from some point on, f never rises above a constant multiple of g. The constant c absorbs differences like "5 steps per item versus 3"; the threshold n₀ lets us ignore small inputs where lower-order terms still matter.

      **Worked proof.** Show that 3n² + 10n + 5 = O(n²). For every n ≥ 1 we have n ≤ n² and 1 ≤ n², so

      3n² + 10n + 5 ≤ 3n² + 10n² + 5n² = 18n².

      So c = 18 and n₀ = 1 work. Other choices work too: c = 4 with n₀ = 11 is valid, because 3n² + 10n + 5 ≤ 4n² exactly when n² ≥ 10n + 5, which holds from n = 11. A proof only needs **one** pair (c, n₀); you are free to pick convenient ones.

      A common slip is to forget that O is only an **upper** bound. It is perfectly true that n = O(n²) (take c = 1, n₀ = 1), and also that n = O(n³). Those statements are just not very informative. We normally want the **tightest** bound we can prove.

  - heading: Big-Ω and Big-Θ
    body: |
      The mirror image of O is a lower bound:

      > **f(n) = Ω(g(n))** if there are c > 0 and n₀ such that **f(n) ≥ c · g(n) for every n ≥ n₀**.

      And when both hold, the bound is tight:

      > **f(n) = Θ(g(n))** if f(n) = O(g(n)) **and** f(n) = Ω(g(n)). Equivalently, there are constants c₁, c₂ > 0 with **c₁ · g(n) ≤ f(n) ≤ c₂ · g(n)** from some n₀ on.

      So 3n² + 10n + 5 = Θ(n²): it is at most 18n² (shown above) and at least 3n² (drop the positive terms). It is **not** Θ(n), because no constant multiple of n stays above n² forever, and it is **not** Θ(n³), because n³ eventually overtakes any multiple of n².

      | Symbol | Meaning | Think of it as |
      |---|---|---|
      | f = O(g) | f grows **no faster** than g | f ≤ g (up to a constant) |
      | f = Ω(g) | f grows **at least as fast** as g | f ≥ g (up to a constant) |
      | f = Θ(g) | f grows **at the same rate** as g | f ≈ g (up to constants) |

      There are also **little-o** and **little-ω** for "strictly slower" and "strictly faster" (for example n log n = o(n²)), which you'll use informally: if the ratio f(n)/g(n) shrinks towards zero, f is strictly slower than g.

  - heading: Rules that make analysis easy
    body: |
      You rarely need to hunt for constants. A handful of rules, each provable from the definition, do the work:

      - **Constants don't matter.** 7n = Θ(n). Multiplying by a constant changes c but not the growth.
      - **Only the dominant term matters.** A polynomial a·nᵏ + (lower powers) is Θ(nᵏ). In general, Θ(f + g) is the **larger** of the two.
      - **Sum rule.** Doing one part, then another, costs O(f) + O(g) = O(max(f, g)). Two sequential loops, one linear and one quadratic, cost O(n²).
      - **Product rule.** Nested work multiplies: a loop of O(n) iterations, each costing O(log n), is O(n log n).
      - **Transitivity.** If f = O(g) and g = O(h), then f = O(h).
      - **Log bases don't matter.** log₂ n = log₁₀ n / log₁₀ 2, a constant multiple, so O(log₂ n) = O(log₁₀ n) = O(ln n). That's why we write O(log n) without a base.
      - **Powers beat logs; exponentials beat powers.** For any constants a > 0 and k, (log n)ᵏ = o(nᵃ), and nᵏ = o(2ⁿ).

      Watch the difference between a logarithm's base and an exponential's base. Changing the base of a **logarithm** only multiplies by a constant, so it never matters. Changing the base of an **exponential** does matter: 2ⁿ = O(3ⁿ), but 3ⁿ is **not** O(2ⁿ), because (3/2)ⁿ grows without bound.

  - heading: The growth hierarchy
    body: |
      These classes cover nearly every algorithm you'll meet, from slowest-growing to fastest:

      | Class | Name | Example | Time for n = 1,000,000 at 10⁸ steps/s |
      |---|---|---|---|
      | O(1) | constant | list index, dict lookup | instant |
      | O(log n) | logarithmic | binary search, BST in a balanced tree | about 20 steps |
      | O(n) | linear | scan a list | 0.01 s |
      | O(n log n) | linearithmic | merge sort, heapsort | about 0.2 s |
      | O(n²) | quadratic | simple sorts, all pairs | about 3 hours |
      | O(n³) | cubic | naive matrix multiply | about 300 years |
      | O(2ⁿ) | exponential | all subsets, naive Fibonacci | longer than the age of the universe, already at n = 100 |
      | O(n!) | factorial | all orderings (travelling salesman by brute force) | worse still |

      The practical divide is between **polynomial** time (nᵏ for some fixed k) and **exponential** time. Doubling the input multiplies a polynomial algorithm's work by a constant (2ᵏ), but squares an exponential one's. That's why Unit 15 treats "is there a polynomial-time algorithm?" as one of the biggest questions in computer science.

  - heading: Reading growth from code
    body: |
      To analyse a program, count how many times its basic operation runs, as a function of the input size n, then simplify using the rules above.

      - **A loop** that runs n times with O(1) work inside: **n** steps.
      - **Nested loops** multiply: n loops of n steps is **n²**.
      - **A triangular loop**, where the inner loop runs `i` times for i = 0, 1, ..., n − 1, does 0 + 1 + ... + (n − 1) = **n(n − 1)/2** steps. That is Θ(n²): half as many steps as the full square, but the same growth.
      - **A halving loop** (`while n > 1: n //= 2`) runs about **log₂ n** times, because n can be halved only that many times before reaching 1. Any loop that *multiplies or divides* its counter by a constant each time is logarithmic.
      - **A loop that does log n work for each of n items** is **n log n**.
      - **Recursion** needs a recurrence. That's the topic of Lesson 8.2.

      **What counts as the input size?** For a list it is its length. For a number n it is the **number of digits (bits)**, not the value. A loop that counts from 2 up to n to test primality does about n steps, which is linear in the *value* but **exponential in the number of bits** (since n ≈ 2^bits). That difference is why checking a 300-digit number for primality by trial division is hopeless, while the algorithms used in cryptography take time polynomial in the digit count.

  - heading: Best, worst and average are not O, Ω and Θ
    body: |
      These are two separate ideas that beginners often merge.

      - **Best, worst and average case** describe *which inputs* you consider. Insertion sort takes about n steps on an already-sorted list (best case), about n²/2 on a reversed list (worst case), and about n²/4 on a random list (average case).
      - **O, Ω and Θ** describe *how tightly* you bound a particular step-count function.

      You can attach any bound to any case. Insertion sort's best case is Θ(n), its worst case is Θ(n²), and its average case is Θ(n²). So "insertion sort is O(n²)" is a correct statement about **all** inputs, and "insertion sort is Ω(n)" is also correct for all inputs, but there is no single Θ that fits *every* input.

      When someone says "this algorithm is O(n log n)" without a case, they normally mean the worst case. When you need a guarantee, say so: "worst-case O(n log n)", "expected O(n)", "amortised O(1)" (Lesson 7.1).

examples:
  - title: Checking the definition with numbers
    intro: "A short function can test a proposed pair (c, n₀) over a large range of n. This isn't a proof, but it catches wrong constants quickly."
    code: |
      def holds(f, g, c, n0, limit=10_000):
          return all(f(n) <= c * g(n) for n in range(n0, limit + 1))

      f = lambda n: 3 * n * n + 10 * n + 5
      g = lambda n: n * n

      print(holds(f, g, 18, 1))
      print(holds(f, g, 3, 1))
      print(holds(f, g, 4, 11))
      print(min(n0 for n0 in range(1, 100) if holds(f, g, 4, n0)))
    output: |
      True
      False
      True
      11
    lines:
      - line: 1-2
        note: "The definition, checked for every n from n₀ up to a limit. A numerical check can only catch a bad pair; a proof is what shows it works for *all* n."
      - line: 7
        note: "c = 18, n₀ = 1 is the pair from the worked proof."
      - line: 8
        note: "c = 3 fails, because the 10n + 5 part always pushes f above 3n²."
      - line: 9-10
        note: "With c = 4, small n still fail; the bound only starts to hold at n₀ = 11, exactly as the algebra predicted."
  - title: Counting loop steps exactly
    intro: "Three loops with different shapes, counted by running them. Compare each column with the formula."
    code: |
      def triangle(n):
          steps = 0
          for i in range(n):
              for j in range(i):
                  steps += 1
          return steps

      def halving(n):
          steps = 0
          while n > 1:
              n //= 2
              steps += 1
          return steps

      def mixed(n):
          steps = 0
          for i in range(n):
              steps += 1
          for i in range(n):
              for j in range(n):
                  steps += 1
          return steps

      for n in (10, 100, 1000):
          print(n, triangle(n), halving(n), mixed(n))
    output: |
      10 45 3 110
      100 4950 6 10100
      1000 499500 9 1001000
    lines:
      - line: 1-6
        note: "The inner loop runs i times, so the total is 0 + 1 + ... + (n − 1) = n(n − 1)/2: 45, 4,950 and 499,500. Θ(n²)."
      - line: 8-13
        note: "Halving: 10 → 5 → 2 → 1 is three steps, and 1000 needs nine. The count is ⌊log₂ n⌋, which is Θ(log n)."
      - line: 15-22
        note: "A sequential loop (n steps) followed by a nested pair (n² steps) costs n + n². By the sum rule, only the n² matters for growth: 1,001,000 is almost exactly 1,000²."
  - title: The doubling test across the hierarchy
    intro: "Double the input size and see how much the work multiplies by. Each class has a signature ratio."
    code: |
      import math

      steps = {
          "constant":   lambda n: 7,
          "log n":      lambda n: math.ceil(math.log2(n)),
          "n":          lambda n: 3 * n + 20,
          "n log n":    lambda n: n * math.ceil(math.log2(n)),
          "n squared":  lambda n: n * n // 2 + n,
          "2 to the n": lambda n: 2 ** n,
      }

      for name, f in steps.items():
          print(f"{name:11} x{f(128) / f(64):.2f}")
    output: |
      constant    x1.00
      log n       x1.17
      n           x1.91
      n log n     x2.33
      n squared   x3.94
      2 to the n  x18446744073709551616.00
    lines:
      - line: 4-11
        note: "Six step-count functions, including lower-order terms and constants like 3n + 20."
      - line: 14
        note: "Compare n = 128 with n = 64. Constant work stays at ×1; log n creeps up; linear roughly doubles; n log n slightly more than doubles; quadratic roughly quadruples."
      - line: 14
        note: "For 2ⁿ, doubling n squares the work: 2¹²⁸ / 2⁶⁴ = 2⁶⁴, about 1.8 × 10¹⁹ times more. This is what exponential growth means in practice."

playground:
  prompt: |
    Change the functions f and g, and the constants, then run to see whether f(n) ≤ c · g(n) holds. Try f = n log n against g = n² (c = 1), and f = n² against g = n (any c fails). Then use `first_failure` to see where a bound breaks.
  code: |
    import math

    def first_failure(f, g, c, n0, limit=100_000):
        for n in range(n0, limit + 1):
            if f(n) > c * g(n):
                return n
        return None

    f = lambda n: n * math.log2(n)
    g = lambda n: n * n

    print("n log n <= n^2 for n >= 2:", first_failure(f, g, 1, 2))
    print("n^2 <= 1000 * n:", first_failure(lambda n: n * n, lambda n: n, 1000, 1))

exercises:
  - id: witnesses
    title: Finding the constants
    difficulty: 1
    prompt: |
      Write three functions for step-count functions `f` and `g` (each takes an integer n):

      - `holds(f, g, c, n0, limit=2000)`: True if `f(n) <= c * g(n)` for **every** integer n from `n0` to `limit` inclusive.
      - `smallest_n0(f, g, c, limit=2000)`: the smallest n₀ ≥ 1 such that the bound holds for all n from n₀ to `limit`, or `None` if it fails even at `limit`.
      - `find_constant(f, g, n0=1, limit=2000)`: the smallest **integer** c from 1 to 1000 for which `holds(f, g, c, n0, limit)` is true, or `None` if there is none.

      (As in the lesson, this checks a range of n rather than proving the bound for every n.)
    starter: |
      def holds(f, g, c, n0, limit=2000):
          pass


      def smallest_n0(f, g, c, limit=2000):
          pass


      def find_constant(f, g, n0=1, limit=2000):
          pass
    tests:
      - name: holds
        code: |
          f = lambda n: 3 * n * n + 10 * n + 5
          g = lambda n: n * n
          assert holds(f, g, 18, 1) is True
          assert holds(f, g, 3, 1) is False
          assert holds(f, g, 4, 11) is True and holds(f, g, 4, 10) is False
          assert holds(lambda n: n, lambda n: n * n, 1, 1) is True
          assert holds(lambda n: n * n, lambda n: n, 100, 1) is False
      - name: smallest_n0
        code: |
          f = lambda n: 3 * n * n + 10 * n + 5
          g = lambda n: n * n
          assert smallest_n0(f, g, 18) == 1
          assert smallest_n0(f, g, 4) == 11
          assert smallest_n0(f, g, 3) is None
          assert smallest_n0(lambda n: 100 * n, lambda n: n * n, 1) == 100
      - name: find_constant
        code: |
          f = lambda n: 3 * n * n + 10 * n + 5
          g = lambda n: n * n
          assert find_constant(f, g) == 18
          assert find_constant(f, g, n0=11) == 4
          assert find_constant(lambda n: n * n, lambda n: n) is None
          assert find_constant(lambda n: 5 * n, lambda n: n) == 5
    hints:
      - "`holds` is one line: `all(f(n) <= c * g(n) for n in range(n0, limit + 1))`."
      - "`smallest_n0`: walk **down** from `limit` while the bound still holds. The first n where it fails is one below your answer; if it fails right at `limit`, return None."
      - "`find_constant`: try c = 1, 2, 3, ... 1000 and return the first c for which `holds` is true."
    solution: |
      def holds(f, g, c, n0, limit=2000):
          return all(f(n) <= c * g(n) for n in range(n0, limit + 1))


      def smallest_n0(f, g, c, limit=2000):
          n = limit
          while n >= 1 and f(n) <= c * g(n):
              n -= 1
          n0 = n + 1
          return None if n0 > limit else n0


      def find_constant(f, g, n0=1, limit=2000):
          for c in range(1, 1001):
              if holds(f, g, c, n0, limit):
                  return c
          return None
    explanation: |
      `smallest_n0` works from the far end because the definition needs the bound to hold for **all** n from n₀ onwards: the answer is just past the last place it fails. And `find_constant(n², n)` is None because n² / n = n grows without bound, so no constant c can work: that is exactly what it means for n² **not** to be O(n).

  - id: growth-class
    title: Classify by doubling
    difficulty: 2
    prompt: |
      Write `growth_class(steps)`, where `steps(n)` returns the number of steps an algorithm takes on an input of size n. Compute `a = steps(64)` and `b = steps(128)`, let `ratio = b / a`, and return a string by these thresholds:

      | ratio | class |
      |---|---|
      | below 1.05 | `"constant"` |
      | below 1.5 | `"logarithmic"` |
      | below 2.1 | `"linear"` |
      | below 3 | `"linearithmic"` |
      | below 6 | `"quadratic"` |
      | below 12 | `"cubic"` |
      | 12 or more | `"exponential"` |

      Then write `compare(steps_a, steps_b)`, which returns whichever of the two **step functions** grows faster (the function itself, judged by the same classes, ordered as in the table), or the string `"same"` if they are in the same class.
    starter: |
      def growth_class(steps):
          pass


      def compare(steps_a, steps_b):
          pass
    tests:
      - name: growth_class
        code: |
          import math
          assert growth_class(lambda n: 7) == "constant"
          assert growth_class(lambda n: math.ceil(math.log2(n))) == "logarithmic"
          assert growth_class(lambda n: 5 * n + 3) == "linear"
          assert growth_class(lambda n: n * math.ceil(math.log2(n))) == "linearithmic"
          assert growth_class(lambda n: n * n // 2 + n) == "quadratic"
          assert growth_class(lambda n: 4 * n ** 3 + n) == "cubic"
          assert growth_class(lambda n: 2 ** n) == "exponential"
          assert growth_class(lambda n: 3 ** n) == "exponential"
      - name: compare
        code: |
          import math
          lin = lambda n: 3 * n + 1
          quad = lambda n: n * n
          assert compare(lin, quad) is quad and compare(quad, lin) is quad
          assert compare(lin, lambda n: 100 * n) == "same"
    hints:
      - "Compute `ratio = steps(128) / steps(64)`, then check the thresholds in order with `if`/`elif`."
      - "Put the class names in a list ordered from slowest to fastest and have `growth_class`'s logic return one of them; then `compare` can use `list.index` on the names."
    solution: |
      ORDER = ["constant", "logarithmic", "linear", "linearithmic", "quadratic", "cubic", "exponential"]


      def growth_class(steps):
          ratio = steps(128) / steps(64)
          for limit, name in zip([1.05, 1.5, 2.1, 3, 6, 12], ORDER):
              if ratio < limit:
                  return name
          return "exponential"


      def compare(steps_a, steps_b):
          a, b = growth_class(steps_a), growth_class(steps_b)
          if a == b:
              return "same"
          return steps_a if ORDER.index(a) > ORDER.index(b) else steps_b
    explanation: |
      The doubling test is how you'd analyse an algorithm you can't easily read: measure the work at n and 2n and look at the ratio. It's only an estimate (big constants and lower-order terms blur the signal at small n, which is why Big-O is about **large** n), but it turns "feel" into a number.

  - id: loop-formulas
    title: Exact step counts for loops
    difficulty: 2
    prompt: |
      Here are three loops, each counting its inner steps:

      ```python
      def triangle(n):
          steps = 0
          for i in range(n):
              for j in range(i):
                  steps += 1
          return steps

      def halving(n):          # n >= 1
          steps = 0
          while n > 1:
              n //= 2
              steps += 1
          return steps

      def n_log_n(n):          # n >= 1
          steps = 0
          for i in range(n):
              j = 1
              while j < n:
                  j *= 2
                  steps += 1
          return steps
      ```

      Write functions `triangle_steps(n)`, `halving_steps(n)` and `n_log_n_steps(n)` that return the same counts **without running any loops**: closed-form formulas. (Hints: `int.bit_length()` returns how many binary digits a number has, which is ⌊log₂ n⌋ + 1 for n ≥ 1.)
    starter: |
      def triangle_steps(n):
          pass


      def halving_steps(n):
          pass


      def n_log_n_steps(n):
          pass
    tests:
      - name: match the loops
        code: |
          def triangle(n):
              steps = 0
              for i in range(n):
                  for j in range(i):
                      steps += 1
              return steps

          def halving(n):
              steps = 0
              while n > 1:
                  n //= 2
                  steps += 1
              return steps

          def n_log_n(n):
              steps = 0
              for i in range(n):
                  j = 1
                  while j < n:
                      j *= 2
                      steps += 1
              return steps

          for n in range(1, 80):
              assert triangle_steps(n) == triangle(n), f"triangle({n})"
              assert halving_steps(n) == halving(n), f"halving({n})"
              assert n_log_n_steps(n) == n_log_n(n), f"n_log_n({n})"
      - name: huge inputs
        code: |
          assert triangle_steps(10 ** 9) == 10 ** 9 * (10 ** 9 - 1) // 2
          assert halving_steps(2 ** 80) == 80
          assert halving_steps(2 ** 80 - 1) == 79
          assert n_log_n_steps(10 ** 6) == 10 ** 6 * 20
    hints:
      - "Triangle: 0 + 1 + ... + (n − 1) is n(n − 1)/2. Use `//` so the answer is an integer."
      - "Halving: n can be halved ⌊log₂ n⌋ times before reaching 1, and that equals `n.bit_length() - 1`."
      - "n_log_n: the inner loop doubles j from 1 until it reaches n, which takes ⌈log₂ n⌉ steps, and `(n - 1).bit_length()` computes that. Multiply by n."
    solution: |
      def triangle_steps(n):
          return n * (n - 1) // 2


      def halving_steps(n):
          return n.bit_length() - 1


      def n_log_n_steps(n):
          return n * (n - 1).bit_length()
    explanation: |
      Three loops, three growth classes: **n²** (really n²/2), **log n**, and **n log n**. The formulas also finish instantly on inputs where running the loops would take forever (a billion squared halves in the first test). That's the practical power of analysis: you learn what the code will cost **without** running it.

  - id: compare-growth
    title: Who grows faster?
    difficulty: 3
    prompt: |
      Write `compare_growth(f, g)` that estimates how f's growth compares with g's by looking at the ratio f(n) / g(n) at n = 10², 10⁴, 10⁸ and 10¹⁶:

      - if the last ratio is **more than twice** the first, f grows **faster** than g: return `"faster"`;
      - if the last ratio is **less than half** the first, f grows **slower**: return `"slower"`;
      - otherwise the ratio has levelled off at a constant: f and g grow at the **same** rate: return `"same"`.

      (Use ordinary division, `f(n) / g(n)`. Python's integers can handle n = 10¹⁶ with no trouble.) Then write `rank(functions)`, which takes a dictionary mapping names to functions and returns the names ordered from **slowest** to **fastest** growing. Use `compare_growth` to compare pairs (for example with `functools.cmp_to_key`).
    starter: |
      import functools


      def compare_growth(f, g):
          pass


      def rank(functions):
          pass
    tests:
      - name: compare_growth
        code: |
          import math
          assert compare_growth(lambda n: 3 * n * n + n, lambda n: n * n) == "same"
          assert compare_growth(lambda n: 2 * n, lambda n: n) == "same"
          assert compare_growth(lambda n: n * math.log2(n), lambda n: n * n) == "slower"
          assert compare_growth(lambda n: n ** 3, lambda n: n ** 2) == "faster"
          assert compare_growth(lambda n: n, lambda n: n ** 0.5) == "faster"
          assert compare_growth(lambda n: math.log2(n), lambda n: n ** 0.5) == "slower"
          assert compare_growth(lambda n: n, lambda n: n * math.log2(n)) == "slower"
          assert compare_growth(lambda n: n * math.log2(n), lambda n: n) == "faster"
      - name: rank
        code: |
          import math
          fs = {
              "n squared": lambda n: n * n,
              "log n": lambda n: math.log2(n),
              "n": lambda n: n,
              "n cubed": lambda n: n ** 3,
              "sqrt n": lambda n: n ** 0.5,
              "n log n": lambda n: n * math.log2(n),
              "n squared plus n": lambda n: n * n + n,
          }
          order = rank(fs)
          assert order[:2] == ["log n", "sqrt n"] and order[2:4] == ["n", "n log n"], order
          assert order[-1] == "n cubed" and set(order[4:6]) == {"n squared", "n squared plus n"}, order
          assert len(order) == len(fs)
    hints:
      - "Build the list `[f(n) / g(n) for n in (10**2, 10**4, 10**8, 10**16)]`, then compare its last item with its first."
      - "`rank`: `sorted(functions, key=cmp_to_key(lambda a, b: ...))` where the comparison function returns −1 if `a` grows slower than `b`, 1 if faster, and 0 if the same."
    solution: |
      import functools


      def compare_growth(f, g):
          ratios = [f(n) / g(n) for n in (10 ** 2, 10 ** 4, 10 ** 8, 10 ** 16)]
          first, last = ratios[0], ratios[-1]
          if last > 2 * first:
              return "faster"
          if last < first / 2:
              return "slower"
          return "same"


      def rank(functions):
          def cmp(a, b):
              verdict = compare_growth(functions[a], functions[b])
              return {"slower": -1, "same": 0, "faster": 1}[verdict]
          return sorted(functions, key=functools.cmp_to_key(cmp))
    explanation: |
      You've turned "f = o(g)", "f = Θ(g)" and "g = o(f)" into numbers: the ratio f/g **shrinks to zero**, **settles on a constant**, or **blows up**. That is the usual way to compare growth in mathematics (it's the limit of f/g). Notice that n log n versus n only shows a factor of about 8 across a **hundred trillion-fold** change in n: logarithms grow *very* slowly, which is why O(n log n) is practically close to linear.

  - id: insertion-cases
    title: Best, worst and average case
    difficulty: 3
    prompt: |
      Insertion sort (Lesson 4.4) behaves very differently on different inputs. Write:

      - `insertion_comparisons(items)`: sort a **copy** of the list with insertion sort (shift larger items right until the key finds its place) and return the number of times it compares `items[j] > key`. Don't change the original list.
      - `best_and_worst(n)`: the pair `(best, worst)` of comparison counts for lists of n distinct items: **best** for an already-sorted list, **worst** for a reversed one. (Build the two lists and count: don't just return a formula.)
      - `average_estimate(n, trials=100, seed=1)`: the average number of comparisons over `trials` random shuffles of `range(n)`. Use `random.Random(seed)` and its `shuffle` method so the result is repeatable.
    starter: |
      import random


      def insertion_comparisons(items):
          pass


      def best_and_worst(n):
          pass


      def average_estimate(n, trials=100, seed=1):
          pass
    tests:
      - name: counting
        code: |
          data = [2, 1, 3]
          assert insertion_comparisons(data) == 2 and data == [2, 1, 3], "Count on a copy"
          assert insertion_comparisons([1, 2, 3, 4]) == 3
          assert insertion_comparisons([4, 3, 2, 1]) == 6
          assert insertion_comparisons([]) == 0 and insertion_comparisons([5]) == 0
          assert insertion_comparisons([3, 1, 2]) == 3
      - name: best and worst
        code: |
          for n in (1, 2, 10, 50):
              best, worst = best_and_worst(n)
              assert best == max(0, n - 1), (n, best)
              assert worst == n * (n - 1) // 2, (n, worst)
      - name: average
        code: |
          n = 60
          avg = average_estimate(n)
          best, worst = best_and_worst(n)
          assert average_estimate(n) == avg, "Same seed must give the same answer"
          assert best < avg < worst
          assert 0.45 * worst < avg < 0.65 * worst, f"About half of the worst case, got {avg} vs {worst}"
    hints:
      - "Insertion sort: for each i from 1, take `key = a[i]`, set `j = i - 1`, and while `j >= 0 and a[j] > key`, add 1 to a counter, move `a[j]` right, and decrease j. Then put `key` at `a[j + 1]`."
      - "Only count when `a[j] > key` is actually evaluated: when j reaches −1 the loop stops without a comparison."
      - "`best_and_worst`: call `insertion_comparisons(list(range(n)))` and `insertion_comparisons(list(range(n, 0, -1)))`."
      - "`average_estimate`: `rng = random.Random(seed)`, then for each trial `items = list(range(n)); rng.shuffle(items)`, add up the counts and divide by `trials`."
    solution: |
      import random


      def insertion_comparisons(items):
          a = list(items)
          comparisons = 0
          for i in range(1, len(a)):
              key = a[i]
              j = i - 1
              while j >= 0:
                  comparisons += 1
                  if a[j] > key:
                      a[j + 1] = a[j]
                      j -= 1
                  else:
                      break
              a[j + 1] = key
          return comparisons


      def best_and_worst(n):
          return insertion_comparisons(list(range(n))), insertion_comparisons(list(range(n, 0, -1)))


      def average_estimate(n, trials=100, seed=1):
          rng = random.Random(seed)
          total = 0
          for _ in range(trials):
              items = list(range(n))
              rng.shuffle(items)
              total += insertion_comparisons(items)
          return total / trials
    explanation: |
      Best case n − 1 comparisons (Θ(n)), worst case n(n − 1)/2 (Θ(n²)), and a random list lands at roughly half of the worst case: about n²/4, still Θ(n²). So insertion sort has **no single Θ for all inputs**, but it is O(n²) and Ω(n) for every input. This is the difference between *cases* and *bounds* from the lesson, in numbers.

commonMistakes:
  - title: "Treating O as \"worst case\""
    explanation: |
      O is an **upper bound on a function**; worst case is a **choice of inputs**. You can say "the best case is O(n)" or "the worst case is Ω(n²)". The two ideas are independent.
  - title: Keeping constants and lower-order terms
    explanation: |
      Writing O(3n² + 10n) isn't wrong, but it isn't tidy: it is just O(n²). Always simplify to the dominant term with coefficient 1.
  - title: Thinking an O(n²) algorithm is always slower than an O(n) one
    explanation: |
      Big-O hides constants and ignores small n. An O(n²) algorithm with a tiny constant can beat an O(n) algorithm with a huge one on small inputs. Big-O predicts what happens as n **grows**.
  - title: Confusing a number's value with its size
    explanation: |
      A loop up to the **value** n is linear in the value but exponential in the **number of digits**. Always ask: what is the input size, in the units the problem is measured in?
  - title: Using a log base as if it mattered
    explanation: |
      O(log₂ n) and O(log₁₀ n) are the same class (they differ by a constant factor), but O(2ⁿ) and O(3ⁿ) are **different** classes.

summary:
  - "**f = O(g)**: f ≤ c · g for all n ≥ n₀ (an upper bound). **Ω** is the matching lower bound, and **Θ** means both (a tight bound)."
  - "To prove a bound, **choose** c and n₀ and check the inequality; any valid pair is enough."
  - "Constants and lower-order terms vanish, **sums** take the larger term, **nested** work multiplies, and log bases don't matter."
  - "The hierarchy: 1 < log n < n < n log n < n² < n³ < 2ⁿ < n!. Polynomial and exponential growth are practically different worlds."
  - "Count loops exactly when you can: **triangular** loops give n(n − 1)/2, **halving** loops give about log₂ n."
  - "**Best/worst/average case** (which inputs) is separate from **O/Ω/Θ** (how tight the bound). **Input size** means the size of the encoding, not the numeric value."
next: |
  You can now say precisely how fast an algorithm grows. But what about **recursive** algorithms, like merge sort, whose step count is defined in terms of itself? Lesson 8.2 turns recursive code into a **recurrence**, solves it by drawing the recursion tree, and gives you the **master theorem**, a shortcut for the divide-and-conquer recurrences that appear again and again.

quiz:
  - type: mcq
    question: "Which statement about f(n) = 5n² + 3n is correct?"
    options:
      - "f(n) = Θ(n²)"
      - "f(n) = Θ(n)"
      - "f(n) = O(n) but not Ω(n)"
      - "f(n) = Θ(n³)"
    answer: 0
    explanation: "For n ≥ 1, 5n² ≤ 5n² + 3n ≤ 8n², so f is squeezed between constant multiples of n²."
  - type: mcq
    question: An algorithm is O(n²). Which statement must be true?
    options:
      - "For large n it takes at most a constant multiple of n² steps"
      - "It always takes exactly n² steps"
      - "It is never faster than n² steps"
      - "It is Θ(n²)"
    answer: 0
    explanation: "O is only an upper bound. The algorithm might be much faster (even O(n)); it just can't grow faster than quadratically."
  - type: mcq
    question: Why do we write O(log n) without a base?
    options:
      - "Logarithms in different bases differ only by a constant factor"
      - "Every logarithm is the same number"
      - "The base is always 2 by convention"
      - "Because log n doesn't grow"
    answer: 0
    explanation: "log₂ n = log₁₀ n / log₁₀ 2, so changing the base multiplies by a constant, which Big-O ignores."
  - type: mcq
    question: "Which function grows fastest as n gets large?"
    options: ["n²", "n log n", "n³", "2ⁿ"]
    answer: 3
    explanation: "Every polynomial is eventually overtaken by an exponential function."
  - type: mcq
    question: Insertion sort takes about n steps on a sorted list and about n² on a reversed one. Which statement is correct?
    options:
      - "Its best case is Θ(n) and its worst case is Θ(n²)"
      - "It is Θ(n) for every input"
      - "Its worst case is O(n)"
      - "Its best and worst cases have the same growth"
    answer: 0
    explanation: "Cases choose the inputs; each case has its own tight bound. No single Θ fits all inputs."
  - type: mcq
    question: "Is the statement \"n = O(n²)\" true?"
    options:
      - "Yes: Big-O is only an upper bound, so it's allowed (just not tight)"
      - "No: n and n² are different classes, so the statement is false"
      - "No: Big-O only applies to polynomials of the same degree"
      - "Only if n = 1"
    answer: 0
    explanation: "With c = 1 and n₀ = 1, n ≤ n². The bound holds; it just isn't informative. The tight statement is n = Θ(n)."
