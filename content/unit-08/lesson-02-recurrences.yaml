  - type: code
    question: |
      Merge sort on a list of length n makes recursive calls: one call for the whole list, then calls for the two halves (sizes n // 2 and n − n // 2), until a list has length 1 (which makes no further calls). Write `merge_sort_calls(n)` returning the total number of calls, counting the first. For example, a list of length 1 makes 1 call, and a list of length 4 makes 7.
    starter: |
      def merge_sort_calls(n):
          pass
    tests:
      - name: calls
        code: |
          assert merge_sort_calls(1) == 1
          assert merge_sort_calls(2) == 3
          assert merge_sort_calls(4) == 7
          assert merge_sort_calls(5) == 9
          assert merge_sort_calls(1000) == 1999
    solution: |
      def merge_sort_calls(n):
          if n <= 1:
              return 1
          return 1 + merge_sort_calls(n // 2) + merge_sort_calls(n - n // 2)
