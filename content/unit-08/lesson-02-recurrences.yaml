id: u8-recurrences
title: Recurrences and the Master Theorem
minutes: 55
objective: |
  Turn a recursive algorithm into a **recurrence** that describes its running time, solve it by **unrolling** and by drawing the **recursion tree**, and use the **master theorem** to read off the growth of the divide-and-conquer recurrences you will meet again and again.
outcomes:
  - Write the recurrence for a recursive algorithm from its code
  - Solve simple recurrences by unrolling them and by counting work level by level in a recursion tree
  - Apply the master theorem to T(n) = aT(n/b) + Θ(nᵈ) and explain which case applies
  - Recognise recurrences the master theorem does not cover, and say what to do instead
  - Check a recurrence against real code by counting calls or operations

sections:
  - heading: From recursion to recurrence
    body: |
      A loop's cost is a sum you can add up. A **recursive** function's cost is defined in terms of itself: the time to solve a problem of size n is some work **now**, plus the time for the smaller problems it calls. Writing that down gives a **recurrence relation**.

      Take merge sort (Lesson 4.7). Sorting n items means sorting two halves of n/2 items and then merging them, which takes about n steps:

      **T(n) = 2 · T(n/2) + n**, with T(1) = 0 (one item is already sorted).

      Binary search (Lesson 4.3) looks at one item and then searches **one** half:

      **T(n) = T(n/2) + 1**, with T(1) = 1.

      Recursively summing a list by peeling off one item at a time:

      **T(n) = T(n − 1) + 1**, with T(0) = 0.

      Every recurrence has the same two parts: a **recursive part** (how the problem shrinks and how many subproblems there are) and a **base case**. Your job is to find a **closed form**: a formula in n with no T on the right-hand side, such as T(n) = n log₂ n. Often you only need its growth rate, Θ(...), and the techniques below give you that.

  - heading: Solving by unrolling
    body: |
      The most direct method is to **unroll**: substitute the recurrence into itself a few times, spot the pattern, and sum it.

      For T(n) = T(n − 1) + 1 with T(0) = 0:

      T(n) = T(n − 1) + 1 = T(n − 2) + 1 + 1 = ... = T(0) + n = **n**.

      For binary search, T(n) = T(n/2) + 1:

      T(n) = T(n/4) + 1 + 1 = T(n/8) + 3 = ... = T(1) + log₂ n, which is **Θ(log n)**. (Each step halves n, and n can only be halved log₂ n times.)

      For T(n) = T(n − 1) + n, which is what quicksort does in its worst case when the pivot is always the smallest item:

      T(n) = n + (n − 1) + (n − 2) + ... + 1 = n(n + 1)/2 = **Θ(n²)**.

      Unrolling is a proof sketch rather than a proof. To make it rigorous, state the closed form you found and prove it by **induction** (Lesson 6.5): check the base case, then assume it for smaller n and show it for n. For merge sort, for n a power of 2: if T(n/2) = (n/2) log₂(n/2), then T(n) = 2 · (n/2)(log₂ n − 1) + n = n log₂ n − n + n = **n log₂ n**.

  - heading: The recursion tree
    body: |
      For recurrences that split into several subproblems, unrolling gets messy. A **recursion tree** keeps the bookkeeping tidy: draw one node for each call, label it with the work done **outside** its recursive calls, then add up the work **level by level**.

      For T(n) = 2T(n/2) + n (merge sort):

      | Level | Calls | Size of each | Work per call | Work at this level |
      |---|---|---|---|---|
      | 0 | 1 | n | n | n |
      | 1 | 2 | n/2 | n/2 | n |
      | 2 | 4 | n/4 | n/4 | n |
      | ... | ... | ... | ... | n |
      | log₂ n | n | 1 | 1 | n |

      Every level does the same total work, n, because doubling the calls exactly cancels halving the size. There are log₂ n + 1 levels, so the total is **Θ(n log n)**.

      Now try T(n) = 3T(n/2) + n. The number of calls triples each level while the size only halves, so level k does 3ᵏ · (n/2ᵏ) = n · (3/2)ᵏ work: each level costs **more** than the one above it. The total is dominated by the **bottom** level, where there are 3^(log₂ n) = n^(log₂ 3) ≈ n^1.585 calls. So the answer is Θ(n^1.585), which grows faster than n log n.

      And for T(n) = T(n/2) + n, the levels cost n, n/2, n/4, ...: they shrink geometrically, so the **top** level dominates and the total is Θ(n).

      So there are exactly three possibilities: work per level **stays the same** (balanced), **grows** towards the leaves, or **shrinks** towards the leaves. The master theorem is just a rule for deciding which.

  - heading: The master theorem
    body: |
      Many divide-and-conquer algorithms have the form

      **T(n) = a · T(n/b) + Θ(nᵈ)**,

      where a ≥ 1 is the number of subproblems, b > 1 is the factor by which each shrinks, and nᵈ (with d ≥ 0) is the cost of splitting and combining. The recursion tree has **a**ᵏ nodes at level k, so the number of leaves is a^(log_b n) = **n^(log_b a)**. The **critical exponent** log_b a measures how fast the number of subproblems grows. Compare it with d:

      | Case | Condition | Where the work is | Result |
      |---|---|---|---|
      | 1 | d > log_b a | at the **top** (combining dominates) | **Θ(nᵈ)** |
      | 2 | d = log_b a | spread **evenly** over all levels | **Θ(nᵈ log n)** |
      | 3 | d < log_b a | at the **leaves** (the number of subproblems dominates) | **Θ(n^(log_b a))** |

      Some famous recurrences, classified:

      | Algorithm | Recurrence | a, b, d | log_b a | Result |
      |---|---|---|---|---|
      | Binary search | T(n/2) + 1 | 1, 2, 0 | 0 | Θ(log n) (case 2) |
      | Merge sort | 2T(n/2) + n | 2, 2, 1 | 1 | Θ(n log n) (case 2) |
      | Tree traversal | 2T(n/2) + 1 | 2, 2, 0 | 1 | Θ(n) (case 3) |
      | Karatsuba multiplication | 3T(n/2) + n | 3, 2, 1 | 1.585 | Θ(n^1.585) (case 3) |
      | Naive matrix multiply | 8T(n/2) + n² | 8, 2, 2 | 3 | Θ(n³) (case 3) |
      | Strassen's matrix multiply | 7T(n/2) + n² | 7, 2, 2 | 2.807 | Θ(n^2.807) (case 3) |
      | Selecting the median of medians | T(n/2) + n | 1, 2, 1 | 0 | Θ(n) (case 1) |

      Two small details. First, n/b is rarely a whole number; the theorem still holds with floors or ceilings. Second, the theorem needs the combining cost to be **polynomial** (Θ(nᵈ)). Costs like n log n fit a more general version of the theorem, but d must stay a constant here.

  - heading: When the master theorem doesn't apply
    body: |
      The master theorem covers only recurrences that split into **equal** pieces of size n/b. It does **not** help with:

      - **Subtracting** rather than dividing: T(n) = T(n − 1) + n (quicksort's worst case) or T(n) = 2T(n − 1) + 1. Use unrolling. The first is Θ(n²). The second doubles at each of n steps, so it is **Θ(2ⁿ)**, which is why a naive "two recursive calls on n − 1" function (like naive Fibonacci in Lesson 4.5) is exponential.
      - **Unequal** splits: T(n) = T(n/3) + T(2n/3) + n. Use a recursion tree: each level still does at most n work, and the tree has depth log_{3/2} n, so it's still Θ(n log n). (A more general theorem, **Akra–Bazzi**, handles these systematically.)
      - **Overlapping** subproblems: naive Fibonacci's two calls solve the *same* smaller problems again and again. That redundancy, not the arithmetic, is what makes it slow, and the cure is **dynamic programming** (Lessons 8.6 and 8.7).

      **Best-case warning.** Quicksort (Lesson 4.7) has the recurrence T(n) = 2T(n/2) + n when pivots split evenly (so Θ(n log n)) but T(n) = T(n − 1) + n when they split as badly as possible (Θ(n²)). The recurrence you write depends on the case you're analysing, as in Lesson 8.1.

  - heading: Checking a recurrence against code
    body: |
      Recurrences are easy to get slightly wrong (is the combining step n or n − 1? is the base case 0 or 1?). A good habit is to **instrument** the code with a counter and compare its output with the recurrence evaluated directly. If they disagree, one of them has a mistake. If they agree on several sizes, you can trust the recurrence and then solve it.

      This is exactly what you'll do in the exercises: count the multiplications in fast exponentiation, count the digit multiplications in Karatsuba's algorithm, and tabulate the work at each level of a recursion tree.

examples:
  - title: Evaluating a recurrence directly
    intro: "A recurrence is just a recursive function. Evaluate merge sort's recurrence and compare it with the closed form n log₂ n."
    code: |
      import math

      def T(n):
          if n == 1:
              return 0
          return 2 * T(n // 2) + n

      for n in (1, 2, 4, 8, 1024):
          print(n, T(n), n * int(math.log2(n)))
    output: |
      1 0 0
      2 2 2
      4 8 8
      8 24 24
      1024 10240 10240
    lines:
      - line: 3-6
        note: "The recurrence T(n) = 2T(n/2) + n with T(1) = 0, written as code."
      - line: 9
        note: "For n a power of 2 the two numbers agree exactly: 24 = 8 × 3 and 10,240 = 1024 × 10. This is the closed form we proved by induction."
  - title: A master theorem calculator
    intro: "Compare the critical exponent log_b a with d to see which of the three cases applies."
    code: |
      import math

      def master(a, b, d):
          critical = math.log(a, b)
          if abs(d - critical) < 1e-9:
              return "log n" if d == 0 else f"n^{d} log n"
          if d > critical:
              return f"n^{d}"
          return f"n^{critical:.3f}"

      cases = [
          ("binary search", 1, 2, 0),
          ("merge sort", 2, 2, 1),
          ("tree traversal", 2, 2, 0),
          ("Karatsuba", 3, 2, 1),
          ("matrix multiply", 8, 2, 2),
          ("Strassen", 7, 2, 2),
          ("T(n/2) + n", 1, 2, 1),
      ]
      for name, a, b, d in cases:
          print(f"{name:16} Theta({master(a, b, d)})")
    output: |
      binary search    Theta(log n)
      merge sort       Theta(n^1 log n)
      tree traversal   Theta(n^1.000)
      Karatsuba        Theta(n^1.585)
      matrix multiply  Theta(n^3.000)
      Strassen         Theta(n^2.807)
      T(n/2) + n       Theta(n^1)
    lines:
      - line: 4
        note: "The critical exponent log_b a: how fast the number of subproblems grows."
      - line: 5-6
        note: "Case 2 (equal): every level does the same work, so an extra factor of log n appears. Floating-point numbers can be slightly off, so we compare with a small tolerance."
      - line: 7-8
        note: "Case 1: d is bigger than the critical exponent, so the combining work at the top dominates and the answer is nᵈ."
      - line: 9
        note: "Case 3: there are so many subproblems that the leaves dominate. Strassen's 7 multiplications instead of 8 lower the exponent from 3 to 2.807."
  - title: Work per level in a recursion tree
    intro: "For T(n) = 3T(n/2) + n, the work grows at every level, so the leaves dominate."
    code: |
      n = 64
      a, b = 3, 2
      total = 0
      level, size, calls = 0, n, 1
      while size >= 1:
          work = calls * size
          total += work
          print(f"level {level}: {calls:3} calls of size {size:2} -> work {work}")
          level, size, calls = level + 1, size // b, calls * a
      print("total work:", total)
    output: |
      level 0:   1 calls of size 64 -> work 64
      level 1:   3 calls of size 32 -> work 96
      level 2:   9 calls of size 16 -> work 144
      level 3:  27 calls of size  8 -> work 216
      level 4:  81 calls of size  4 -> work 324
      level 5: 243 calls of size  2 -> work 486
      level 6: 729 calls of size  1 -> work 729
      total work: 2059
    lines:
      - line: 4
        note: "Start with one call of size n at level 0."
      - line: 6
        note: "Work at a level = number of calls × the combining work of each call (here the work equals the size)."
      - line: 9
        note: "Each level has a times as many calls, each b times smaller."
      - line: 10
        note: "Each level is 1.5 times the one above (64, 96, 144, ...). The last level alone, with 729 leaves, is a third of the total: the leaves dominate, giving Θ(n^1.585)."

playground:
  prompt: |
    Change `a`, `b` and the work function `f` to explore other recurrences. Try a = 2, b = 2, f = n (balanced, merge sort); a = 1, b = 2, f = n (the top level dominates); a = 4, b = 2, f = n (the leaves dominate). Watch how the "work" column changes from level to level.
  code: |
    n = 256
    a, b = 2, 2
    f = lambda size: size        # work done outside the recursive calls

    level, size, calls, total = 0, n, 1, 0
    while size >= 1:
        work = calls * f(size)
        total += work
        print(f"level {level}: {calls:4} calls, size {size:3}, work {work}")
        level, size, calls = level + 1, size // b, calls * a
    print("total:", total)

exercises:
  - id: evaluate-recurrences
    title: Evaluating recurrences
    difficulty: 1
    prompt: |
      Write `solve(a, b, f, n, base)` that returns T(n) for the recurrence **T(n) = a · T(n // b) + f(n)** with **T(1) = base**, where n is a power of b. Use recursion, but keep it fast for large n by remembering results (for example with `functools.lru_cache` or a dictionary), since `f` may be any function.

      Then write `closed_form_check()`, which uses `solve` and returns the dictionary

      ```python
      {"linear": ..., "log": ..., "nlogn": ..., "tree": ...}
      ```

      where each value is T(1024) for one of these recurrences: **linear** T(n) = T(n/2) + n with T(1) = 1; **log** T(n) = T(n/2) + 1 with T(1) = 0; **nlogn** T(n) = 2T(n/2) + n with T(1) = 0; **tree** T(n) = 2T(n/2) + 1 with T(1) = 1.
    starter: |
      def solve(a, b, f, n, base):
          pass


      def closed_form_check():
          pass
    tests:
      - name: solve
        code: |
          assert solve(2, 2, lambda n: n, 8, 0) == 24
          assert solve(1, 2, lambda n: 1, 16, 0) == 4
          assert solve(2, 2, lambda n: 1, 1, 7) == 7
          assert solve(2, 3, lambda n: n, 27, 0) == 57
          assert solve(2, 2, lambda n: n, 2 ** 40, 0) == 2 ** 40 * 40, "Is it fast for large n?"
      - name: closed forms
        code: |
          r = closed_form_check()
          assert r == {"linear": 2047, "log": 10, "nlogn": 10240, "tree": 2047}, r
    hints:
      - "If n == 1 return `base`; otherwise return `a * solve(a, b, f, n // b, base) + f(n)`."
      - "Only one value is needed per level, so there are only log n different calls: the recursion is already fast, because there is just one recursive call spelled out (multiplied by a)."
      - "T(1024) for `linear`: 1024 + 512 + ... + 2 + 1 = 2047."
    solution: |
      def solve(a, b, f, n, base):
          if n == 1:
              return base
          return a * solve(a, b, f, n // b, base) + f(n)


      def closed_form_check():
          return {
              "linear": solve(1, 2, lambda n: n, 1024, 1),
              "log": solve(1, 2, lambda n: 1, 1024, 0),
              "nlogn": solve(2, 2, lambda n: n, 1024, 0),
              "tree": solve(2, 2, lambda n: 1, 1024, 1),
          }
    explanation: |
      Because all the a subproblems at a level have the same size, you only need to evaluate **one** of them and multiply by a: that's why `solve` takes only about log n steps even though the algorithm it describes would make n calls. The closed forms are 2n − 1 for the linear and tree recurrences, log₂ n for the second, and n log₂ n for merge sort.

  - id: master-theorem
    title: The master theorem in code
    difficulty: 2
    prompt: |
      Write `master(a, b, d)` for T(n) = a·T(n/b) + Θ(nᵈ). Return a pair `(p, k)` meaning the result is **Θ(nᵖ · (log n)ᵏ)**:

      - case 1 (d > log_b a): `(d, 0)`;
      - case 2 (d = log_b a, compare with `math.isclose`): `(d, 1)`;
      - case 3 (d < log_b a): `(math.log(a, b), 0)`.

      Then write `describe(a, b, d)` returning a readable string: for k = 0, `"n^p"` and for k = 1, `"n^p log n"`, with p printed to 2 decimal places, and as `"log n"` when p = 0 and k = 1, as `"n"` when p = 1 and k = 0 (these two special forms first). For example `describe(2, 2, 1)` is `"n^1.00 log n"` and `describe(1, 2, 0)` is `"log n"`.
    starter: |
      import math


      def master(a, b, d):
          pass


      def describe(a, b, d):
          pass
    tests:
      - name: master
        code: |
          import math
          def same(r, p, k):
              return math.isclose(r[0], p, abs_tol=1e-9) and r[1] == k
          assert same(master(1, 2, 0), 0, 1)
          assert same(master(2, 2, 1), 1, 1)
          assert same(master(2, 2, 0), 1, 0)
          assert same(master(3, 2, 1), math.log2(3), 0)
          assert same(master(7, 2, 2), math.log2(7), 0)
          assert same(master(8, 2, 2), 3, 0)
          assert same(master(4, 2, 2), 2, 1)
          assert same(master(1, 2, 1), 1, 0)
          assert same(master(9, 3, 2), 2, 1)
          assert same(master(2, 4, 1), 1, 0)
      - name: describe
        code: |
          assert describe(1, 2, 0) == "log n"
          assert describe(2, 2, 1) == "n^1.00 log n"
          assert describe(1, 2, 1) == "n"
          assert describe(3, 2, 1) == "n^1.58"
          assert describe(8, 2, 2) == "n^3.00"
          assert describe(4, 2, 2) == "n^2.00 log n"
    hints:
      - "`critical = math.log(a, b)`. If `math.isclose(d, critical)` it is case 2; otherwise compare `d > critical` for case 1 versus case 3."
      - "For `describe`, call `master`, then handle the special forms `(0, 1)` and `(1, 0)` before the general format `f\"n^{p:.2f}\"`."
    solution: |
      import math


      def master(a, b, d):
          critical = math.log(a, b)
          if math.isclose(d, critical, abs_tol=1e-9):
              return (d, 1)
          if d > critical:
              return (d, 0)
          return (critical, 0)


      def describe(a, b, d):
          p, k = master(a, b, d)
          if k == 1 and math.isclose(p, 0, abs_tol=1e-9):
              return "log n"
          if k == 0 and math.isclose(p, 1, abs_tol=1e-9):
              return "n"
          text = f"n^{p:.2f}"
          return text + " log n" if k else text
    explanation: |
      Notice how little the theorem needs: just a, b and d. The answer depends only on whether the **leaves** (n^(log_b a) of them) or the **root** (nᵈ) does more work, or whether they tie. For example, Karatsuba's trick of using 3 multiplications instead of 4 drops the critical exponent from 2 to about 1.58, which is why it beats schoolbook multiplication on large numbers.

  - id: fast-power
    title: Fast exponentiation
    difficulty: 2
    prompt: |
      Computing xⁿ by multiplying x by itself n − 1 times is Θ(n). Use the recurrence **T(n) = T(n/2) + O(1)** instead: xⁿ = (x^(n/2))² when n is even, and x · x^(n−1) when n is odd.

      Write `power(x, n)` (n ≥ 0, recursive) returning a pair `(value, multiplications)`, where `multiplications` is the number of times your code multiplies two numbers. By convention x⁰ = 1 uses 0 multiplications. Write `naive_power(x, n)` returning `(value, multiplications)` for the loop version that multiplies n − 1 times (and uses 0 multiplications for n = 0 or 1).
    starter: |
      def power(x, n):
          pass


      def naive_power(x, n):
          pass
    tests:
      - name: values
        code: |
          for x in (2, 3, 7, -2):
              for n in (0, 1, 2, 3, 10, 31, 64):
                  assert power(x, n)[0] == x ** n, (x, n)
                  assert naive_power(x, n)[0] == x ** n
      - name: counting
        code: |
          assert power(5, 0)[1] == 0 and power(5, 1)[1] == 0
          assert power(2, 2)[1] == 1
          assert power(2, 8)[1] == 3
          assert naive_power(2, 10)[1] == 9 and naive_power(2, 1)[1] == 0 and naive_power(2, 0)[1] == 0
          import math
          for n in (100, 1000, 10 ** 6):
              m = power(3, n)[1]
              assert m <= 2 * math.log2(n), (n, m)
              assert naive_power(1, n)[1] == n - 1
      - name: huge exponent
        code: |
          v, m = power(2, 10 ** 5)
          assert v.bit_length() == 10 ** 5 + 1 and m <= 40
    hints:
      - "Base case: n == 0 returns `(1, 0)` and n == 1 returns `(x, 0)`."
      - "Even n: `half, m = power(x, n // 2)`, then the result is `half * half` with `m + 1` multiplications."
      - "Odd n: `rest, m = power(x, n - 1)`, then the result is `x * rest` with `m + 1` multiplications. (The next call is even, so you never have more than two odd steps in a row.)"
    solution: |
      def power(x, n):
          if n == 0:
              return 1, 0
          if n == 1:
              return x, 0
          if n % 2 == 0:
              half, m = power(x, n // 2)
              return half * half, m + 1
          rest, m = power(x, n - 1)
          return x * rest, m + 1


      def naive_power(x, n):
          if n == 0:
              return 1, 0
          result = x
          for _ in range(n - 1):
              result *= x
          return result, max(0, n - 1)
    explanation: |
      The recurrence T(n) = T(n/2) + 1 (plus at most one extra step for odd n) is binary search's recurrence: Θ(log n). Computing 3^1,000,000 takes at most about 40 multiplications instead of a million. This repeated-squaring idea powers modular exponentiation in cryptography (Unit 16), and you used it in Lesson 6.8.

  - id: karatsuba
    title: Karatsuba multiplication
    difficulty: 4
    prompt: |
      Schoolbook multiplication of two n-digit numbers takes n² digit multiplications. **Karatsuba's algorithm** uses divide and conquer with only **three** recursive multiplications instead of four.

      Split each number around the middle: x = a·10ᵐ + b and y = c·10ᵐ + d, where m is half the number of digits of the longer number. Then

      x · y = ac · 10²ᵐ + ((a + b)(c + d) − ac − bd) · 10ᵐ + bd,

      so you only need the three products **ac**, **bd** and **(a + b)(c + d)**.

      Write `karatsuba(x, y)` for non-negative integers, returning `(product, base_multiplications)`, where a **base multiplication** is one multiplication of two numbers that each have a **single digit** (that is, `x < 10` or `y < 10`: then just multiply them directly and count 1). It must return the same product as `x * y`.
    starter: |
      def karatsuba(x, y):
          pass
    tests:
      - name: correct products
        code: |
          import random
          rng = random.Random(8)
          assert karatsuba(0, 12345)[0] == 0 and karatsuba(7, 8)[0] == 56
          assert karatsuba(12, 34)[0] == 408
          assert karatsuba(10 ** 30, 10 ** 30)[0] == 10 ** 60
          for _ in range(300):
              x = rng.randrange(10 ** rng.randint(1, 60))
              y = rng.randrange(10 ** rng.randint(1, 60))
              assert karatsuba(x, y)[0] == x * y, (x, y)
      - name: fewer multiplications
        code: |
          import random
          rng = random.Random(9)
          x = rng.randrange(10 ** 63, 10 ** 64)
          y = rng.randrange(10 ** 63, 10 ** 64)
          p, m = karatsuba(x, y)
          assert p == x * y
          assert m < 64 * 64 // 2, f"{m} multiplications: schoolbook would use {64 * 64}"
          x = rng.randrange(10 ** 255, 10 ** 256)
          y = rng.randrange(10 ** 255, 10 ** 256)
          p, m = karatsuba(x, y)
          assert p == x * y and m < 256 * 256 // 4, m
    hints:
      - "Base case: `if x < 10 or y < 10: return x * y, 1`."
      - "Let `m = max(len(str(x)), len(str(y))) // 2` and `p = 10 ** m`. Use `divmod(x, p)` to get `(a, b)` and `divmod(y, p)` to get `(c, d)`."
      - "Make three recursive calls: `ac, n1 = karatsuba(a, c)`, `bd, n2 = karatsuba(b, d)` and `mid, n3 = karatsuba(a + b, c + d)`, then combine: `ac * p * p + (mid - ac - bd) * p + bd`, with `n1 + n2 + n3` multiplications."
    solution: |
      def karatsuba(x, y):
          if x < 10 or y < 10:
              return x * y, 1
          m = max(len(str(x)), len(str(y))) // 2
          p = 10 ** m
          a, b = divmod(x, p)
          c, d = divmod(y, p)
          ac, n1 = karatsuba(a, c)
          bd, n2 = karatsuba(b, d)
          mid, n3 = karatsuba(a + b, c + d)
          return ac * p * p + (mid - ac - bd) * p + bd, n1 + n2 + n3
    explanation: |
      The recurrence is T(n) = 3T(n/2) + Θ(n): three half-size multiplications, plus additions and shifts that cost linear time. With a = 3, b = 2, d = 1 we have log₂ 3 ≈ 1.585 > 1, so case 3 gives Θ(n^1.585), noticeably better than Θ(n²). At 256 digits the counter shows the gap; Python itself uses Karatsuba for very large integers. The idea of trading one multiplication for a few extra additions also lies behind Strassen's matrix algorithm.

  - id: tree-levels
    title: Work per level
    difficulty: 3
    prompt: |
      For the recurrence T(n) = a·T(n/b) + f(n), where n is a power of b:

      - `level_work(a, b, f, n)` returns a list with the total work of every level of the recursion tree, from the root (level 0) down to the leaves (size 1). Level k has aᵏ calls of size n / bᵏ, each doing f(size) work.
      - `where_is_the_work(a, b, f, n)` returns `"top"` if the root level's work is **more than twice** the leaf level's, `"leaves"` if the leaf level's is more than twice the root's, and `"balanced"` otherwise.
      - `total_work(a, b, f, n, base=1)` returns the sum of the level works, but the leaf level should use `base` per leaf instead of f(1), matching T(1) = base.
    starter: |
      def level_work(a, b, f, n):
          pass


      def where_is_the_work(a, b, f, n):
          pass


      def total_work(a, b, f, n, base=1):
          pass
    tests:
      - name: levels
        code: |
          assert level_work(2, 2, lambda s: s, 8) == [8, 8, 8, 8]
          assert level_work(3, 2, lambda s: s, 64) == [64, 96, 144, 216, 324, 486, 729]
          assert level_work(1, 2, lambda s: s, 8) == [8, 4, 2, 1]
          assert level_work(2, 2, lambda s: 1, 1) == [1]
      - name: where
        code: |
          n = 1024
          assert where_is_the_work(2, 2, lambda s: s, n) == "balanced"
          assert where_is_the_work(1, 2, lambda s: s, n) == "top"
          assert where_is_the_work(4, 2, lambda s: s, n) == "leaves"
          assert where_is_the_work(3, 2, lambda s: s * s, n) == "top"
          assert where_is_the_work(2, 2, lambda s: 1, n) == "leaves"
          assert where_is_the_work(1, 2, lambda s: 1, n) == "balanced"
      - name: totals
        code: |
          def direct(a, b, f, n, base):
              return base if n == 1 else a * direct(a, b, f, n // b, base) + f(n)
          for (a, b, n) in [(2, 2, 64), (3, 2, 32), (1, 2, 256), (4, 3, 81), (2, 4, 256)]:
              for f in (lambda s: s, lambda s: s * s, lambda s: 1):
                  assert total_work(a, b, f, n, 5) == direct(a, b, f, n, 5)
    hints:
      - "Count the levels: keep dividing `size` by `b` while it's at least 1. At level k: `calls = a ** k` and `size = n // b ** k`, so `work = calls * f(size)`."
      - "`where_is_the_work`: `levels = level_work(...)`, then compare `levels[0]` and `levels[-1]`."
      - "`total_work`: every level except the last contributes `levels[i]`; the last level has `a ** depth` leaves, each costing `base`."
    solution: |
      def level_work(a, b, f, n):
          levels = []
          calls, size = 1, n
          while size >= 1:
              levels.append(calls * f(size))
              if size == 1:
                  break
              calls, size = calls * a, size // b
          return levels


      def where_is_the_work(a, b, f, n):
          levels = level_work(a, b, f, n)
          if levels[0] > 2 * levels[-1]:
              return "top"
          if levels[-1] > 2 * levels[0]:
              return "leaves"
          return "balanced"


      def total_work(a, b, f, n, base=1):
          levels = level_work(a, b, f, n)
          if len(levels) == 1:
              return base
          leaves = a ** (len(levels) - 1)
          return sum(levels[:-1]) + leaves * base
    explanation: |
      Each case of the master theorem is one of the three answers here. Merge sort is **balanced**, so every level matters equally and the log n levels multiply the work. Binary search's constant work also balances. A tree with many cheap subproblems (a = 4, b = 2) has its work at the **leaves**. And when the combining step is expensive (f = n² and only 3 half-size calls) the **top** dominates, giving Θ(n²) overall.

commonMistakes:
  - title: Forgetting the base case
    explanation: |
      Every recurrence needs one. T(n) = 2T(n/2) + n has no answer until you say what T(1) is. The base case changes the exact value (and constants) but not the growth rate of these standard recurrences.
  - title: Using the master theorem when it doesn't apply
    explanation: |
      It needs a **constant** number of **equal** subproblems of size n/b. T(n) = T(n − 1) + n, T(n) = 2T(n − 1) + 1 and T(n) = T(n/3) + T(2n/3) + n are all outside its scope.
  - title: Comparing d with a instead of with log_b a
    explanation: |
      The deciding comparison is **d versus log_b a**, not d versus a. For T(n) = 4T(n/2) + n², a = 4 and d = 2 look different, but log₂ 4 = 2 = d, so case 2 gives Θ(n² log n).
  - title: Dropping the log factor in case 2
    explanation: |
      When the work is balanced across levels, you have log n levels of the same work, so the answer is nᵈ **log n**, not nᵈ.
  - title: Treating "T(n) = T(n−1) + T(n−2)" as a divide-and-conquer recurrence
    explanation: |
      It shrinks by subtracting, so use unrolling or a closed form, not the master theorem. Its growth is exponential, about 1.618ⁿ.

summary:
  - "A **recurrence** expresses a recursive algorithm's cost in terms of smaller inputs; a **closed form** (found by unrolling or a recursion tree, proved by induction) gives its growth."
  - "A **recursion tree** has aᵏ calls at level k of size n/bᵏ. Add up the work **per level**, then across levels."
  - "**Master theorem** for T(n) = aT(n/b) + Θ(nᵈ): compare d with log_b a. If d is bigger the answer is **nᵈ**, if equal **nᵈ log n**, and if smaller **n^(log_b a)**."
  - "Famous results: binary search Θ(log n), merge sort Θ(n log n), tree traversal Θ(n), Karatsuba Θ(n^1.585), Strassen Θ(n^2.807)."
  - "The master theorem needs equal splits by division. Subtractive recurrences (T(n − 1) + n gives Θ(n²), 2T(n − 1) + 1 gives Θ(2ⁿ)) and overlapping subproblems need other tools."
  - "Always **check** a recurrence against instrumented code on a few sizes."
next: |
  You now know how to analyse a divide-and-conquer algorithm. Lesson 8.3 puts the master theorem to work on the **classic divide-and-conquer algorithms**: quicksort (and why a random pivot makes it expected O(n log n)), quickselect (finding the k-th smallest item in expected linear time), counting inversions, and the maximum-subarray problem.

