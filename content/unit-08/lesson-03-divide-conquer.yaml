id: u8-divide-conquer
title: Divide and Conquer in Practice
minutes: 55
objective: |
  Use the **divide, conquer, combine** pattern to design and analyse algorithms: **quicksort** with a random pivot (and why it is expected O(n log n)), **quickselect** for the k-th smallest item in expected linear time, **maximum subarray**, and fast **Fibonacci** by repeated squaring. Judge when divide and conquer helps, and when a simpler method beats it.
outcomes:
  - Describe the divide, conquer and combine steps of an algorithm and write its recurrence
  - Implement quicksort with different pivot rules and explain why random pivots give expected O(n log n)
  - Use quickselect to find the k-th smallest item, and the median, in expected O(n) time
  - Solve the maximum-subarray problem by divide and conquer and compare it with a linear scan
  - Decide when a problem has the structure that makes divide and conquer worthwhile

sections:
  - heading: The pattern
    body: |
      You met divide and conquer in Lesson 4.7 with merge sort, and in Lesson 8.2 you learned to analyse it. The pattern has three steps:

      1. **Divide** the problem into smaller subproblems of the same kind.
      2. **Conquer** each subproblem recursively (a tiny subproblem is solved directly: the base case).
      3. **Combine** the answers to the subproblems into an answer for the whole.

      The cost is described by T(n) = a·T(n/b) + (cost of dividing and combining), exactly the form the master theorem solves. The art is in finding a way to divide so that the subproblems are genuinely independent and the combine step is cheap.

      Different algorithms put the hard work in different places. **Merge sort** divides trivially (cut in half) and does its work in the combine step (merging). **Quicksort** is the mirror image: it does its work in the *divide* step (partitioning around a pivot) and its combine step is trivial (just concatenate). This lesson also shows an algorithm that conquers only **one** side (quickselect), and one that must look at pieces that **cross** the dividing line (maximum subarray).

  - heading: Quicksort and the choice of pivot
    body: |
      Quicksort picks a **pivot**, splits the items into those less than, equal to, and greater than the pivot, and sorts the two outer groups recursively:

      ```python
      def quicksort(items):
          if len(items) <= 1:
              return items
          pivot = items[0]
          less = [x for x in items if x < pivot]
          equal = [x for x in items if x == pivot]
          greater = [x for x in items if x > pivot]
          return quicksort(less) + equal + quicksort(greater)
      ```

      Partitioning compares every other item with the pivot, so it costs about n. If the pivot splits the items **evenly**, T(n) = 2T(n/2) + n = Θ(n log n). If the pivot is always the **smallest or largest** item, T(n) = T(n − 1) + n = Θ(n²).

      And there's the catch with the code above: on an input that is **already sorted**, choosing the first item as the pivot is the worst possible choice every time, so a very common input triggers the slowest behaviour. Real programs face sorted or nearly sorted data all the time.

      **Random pivots.** Choose the pivot **uniformly at random**. Call a pivot *good* if it lands in the middle half of the sorted order. That happens with probability 1/2. A good pivot leaves each side with at most 3n/4 items, so after about log_{4/3} n good pivots a branch is down to size 1, and good pivots occur every other call on average. The result is that the recursion has depth O(log n) with high probability and the **expected** number of comparisons is about **2n ln n ≈ 1.39 n log₂ n**: Θ(n log n) on **every** input, with no bad input to be found by an adversary. (This is *expected* time over the algorithm's own random choices, not an average over inputs.)

      Other rules also work: the **median of three** (the median of the first, middle and last items) defeats sorted input; the **middle** item does too. But only a random pivot has a guarantee that doesn't depend on how the data is arranged.

  - heading: In-place partitioning and small cases
    body: |
      The list-comprehension version above allocates new lists at every level, which is clear but slow in practice. Production quicksorts partition **in place** by swapping items within the original array (with two indices scanning from each end), using only O(log n) extra space for the recursion. They also switch to **insertion sort** for tiny subarrays (say, fewer than 16 items), where its low overhead beats recursion. Python's own `sorted` uses neither: it uses **Timsort**, a hybrid of merge sort and insertion sort that is stable and takes advantage of runs already sorted.

      Comparison counts show the algorithm's character most clearly, so in this lesson we count comparisons rather than seconds.

  - heading: "Quickselect: conquering only one side"
    body: |
      Suppose you only need the **k-th smallest** item: the median, say, or the 90th percentile. Sorting everything costs Θ(n log n), which is more than necessary.

      **Quickselect** partitions around a random pivot exactly as quicksort does, but then **recurses into only the side that contains the answer**:

      - if k is smaller than the number of items less than the pivot, search the "less" group;
      - if k lands among the items equal to the pivot, the pivot **is** the answer;
      - otherwise search the "greater" group (with k reduced by the number of items discarded).

      Each round costs about the current size, and a good pivot shrinks the problem to at most 3/4 of its size. So in expectation the total is n + (3/4)n + (3/4)²n + ... = **4n**, or **Θ(n)**. In terms of the master theorem, T(n) = T(n/2) + n has a = 1, b = 2, d = 1: case 1, where the top level dominates. One recursive call instead of two is the whole difference between n log n and n.

      Because it only ever follows one branch, quickselect can be written as a **loop** rather than recursion. There are also deterministic selection algorithms (median of medians) that guarantee linear time in the worst case, at the cost of much larger constants.

  - heading: "Maximum subarray: when the answer crosses the middle"
    body: |
      Given a list of numbers, positive and negative (daily profits, say), find the contiguous stretch with the **largest sum**. For `[-2, 1, -3, 4, -1, 2, 1, -5, 4]` the best stretch is `4, -1, 2, 1`, with sum 6.

      Trying every start and end takes Θ(n²) (or Θ(n³) if you add each stretch up from scratch). A divide-and-conquer approach splits the list at the middle. The best stretch is then in the **left half**, in the **right half**, or it **crosses the middle**. The first two are recursive subproblems. For the third, the best crossing stretch is the best stretch **ending at the middle** on the left (scan leftwards adding items and track the best total) plus the best stretch **starting just after** the middle on the right. That is a linear scan, so

      **T(n) = 2T(n/2) + n = Θ(n log n)**.

      But it can be done better. **Kadane's algorithm** scans once, keeping the best sum of a stretch *ending at the current item*: it's either the item alone or the previous best stretch plus the item. Together with a running maximum that is Θ(n) time and O(1) space.

      Divide and conquer is not always the best algorithm; sometimes it just gives a good *first* design, and a more specialised idea (here, keeping a running state) improves it. It is still a valuable way to think, because the three-way case analysis (left, right, crossing) appears in many problems.

  - heading: Recognising divide-and-conquer problems
    body: |
      Divide and conquer works well when:

      - the problem **splits** into independent subproblems of the same kind (sorting two halves, searching one half);
      - the **combine** step is cheap relative to the whole (a merge is linear, a concatenation is free);
      - subproblems **don't overlap**. If they do (naive Fibonacci recomputes the same values again and again), you need dynamic programming instead (Lessons 8.6 and 8.7).

      A bonus is **parallelism**: independent subproblems can run on different processors at the same time, which is why divide-and-conquer algorithms are the basis of many parallel sorts and map-reduce style systems (Unit 10).

      Other famous examples: **binary search**, **fast exponentiation** and **Karatsuba multiplication** (Lesson 8.2), **Strassen's matrix multiplication**, the **closest pair of points** in a plane in O(n log n), the **fast Fourier transform** (which makes audio and image processing practical), and the **Fibonacci doubling** method you will code in the exercises.

examples:
  - title: Random pivots beat sorted input
    intro: "Count the comparisons of quicksort on an already sorted list, with the first item as pivot and with a random pivot."
    code: |
      import math
      import random

      def quicksort(items, choose, counter):
          if len(items) <= 1:
              return items
          pivot = choose(items)
          less = [x for x in items if x < pivot]
          equal = [x for x in items if x == pivot]
          greater = [x for x in items if x > pivot]
          counter[0] += len(items) - 1
          return quicksort(less, choose, counter) + equal + quicksort(greater, choose, counter)

      rng = random.Random(1)
      data = list(range(500))
      first, rand = [0], [0]
      quicksort(data, lambda xs: xs[0], first)
      quicksort(data, lambda xs: rng.choice(xs), rand)
      print("sorted input, first pivot:", first[0])
      print("sorted input, random pivot under 8000:", rand[0] < 8000)
      print("n log2 n is about", round(500 * math.log2(500)))
    output: |
      sorted input, first pivot: 124750
      sorted input, random pivot under 8000: True
      n log2 n is about 4483
    lines:
      - line: 4
        note: "The pivot rule is a parameter, so the same code can try any rule."
      - line: 10
        note: "Each partition compares every item except the pivot with the pivot: len(items) − 1 comparisons."
      - line: 18
        note: "With the first item as pivot on a sorted list, every partition peels off one item: 499 + 498 + ... + 1 = 124,750 = n(n − 1)/2."
      - line: 19
        note: "A random pivot needs a small multiple of n log₂ n comparisons (the average is about 1.39 of it) on exactly the same input."
  - title: Quickselect finds the median
    intro: "Find the 500th smallest of 1,001 shuffled numbers without sorting them."
    code: |
      import random

      def quickselect(items, k, rng):
          work = 0
          while True:
              pivot = rng.choice(items)
              less = [x for x in items if x < pivot]
              equal = [x for x in items if x == pivot]
              work += len(items)
              if k < len(less):
                  items = less
              elif k < len(less) + len(equal):
                  return pivot, work
              else:
                  k -= len(less) + len(equal)
                  items = [x for x in items if x > pivot]

      rng = random.Random(7)
      data = list(range(1001))
      rng.shuffle(data)
      value, work = quickselect(data, 500, rng)
      print("median:", value)
      print("work under 8n:", work < 8 * len(data))
    output: |
      median: 500
      work under 8n: True
    lines:
      - line: 6
        note: "A random pivot, as in quicksort."
      - line: 10
        note: "Each round examines every remaining item once: we add the current size to the work."
      - line: 11-12
        note: "If k is among the smaller items, throw away the pivot and everything bigger."
      - line: 13-14
        note: "If k falls on the pivot's value, we're done. No sorting was needed."
      - line: 16
        note: "Otherwise keep only the larger items, and adjust k because we discarded the smaller ones and the pivot's equals. A loop replaces recursion because only one side is ever followed."
  - title: Maximum subarray two ways
    intro: "Divide and conquer (left, right, or crossing the middle) and Kadane's one-pass scan agree."
    code: |
      def max_subarray(nums, lo=0, hi=None):
          if hi is None:
              hi = len(nums) - 1
          if lo == hi:
              return nums[lo]
          mid = (lo + hi) // 2
          best_left, total = float("-inf"), 0
          for i in range(mid, lo - 1, -1):
              total += nums[i]
              best_left = max(best_left, total)
          best_right, total = float("-inf"), 0
          for i in range(mid + 1, hi + 1):
              total += nums[i]
              best_right = max(best_right, total)
          return max(max_subarray(nums, lo, mid), max_subarray(nums, mid + 1, hi), best_left + best_right)

      def kadane(nums):
          best = here = nums[0]
          for x in nums[1:]:
              here = max(x, here + x)
              best = max(best, here)
          return best

      data = [-2, 1, -3, 4, -1, 2, 1, -5, 4]
      print(max_subarray(data), kadane(data))
    output: |
      6 6
    lines:
      - line: 4-5
        note: "Base case: a single item is its own best stretch (even if negative: at least one item is required)."
      - line: 7-14
        note: "The best stretch crossing the middle = the best sum ending at mid going left, plus the best sum starting at mid + 1 going right. One linear scan each way."
      - line: 15
        note: "The answer is the best of: entirely in the left half, entirely in the right half, or crossing. T(n) = 2T(n/2) + n."
      - line: 18-23
        note: "Kadane: `here` is the best sum of a stretch ending at the current item: either start fresh with x, or extend the previous stretch. One pass, constant memory."

playground:
  prompt: |
    Try different pivot rules and different inputs. Change `choose` to the middle item (`lambda xs: xs[len(xs) // 2]`) or the median of three, and change `data` to a reversed list or one with many repeated values. Watch how the comparison count changes.
  code: |
    import random

    def quicksort(items, choose, counter):
        if len(items) <= 1:
            return items
        pivot = choose(items)
        less = [x for x in items if x < pivot]
        equal = [x for x in items if x == pivot]
        greater = [x for x in items if x > pivot]
        counter[0] += len(items) - 1
        return quicksort(less, choose, counter) + equal + quicksort(greater, choose, counter)

    rng = random.Random(3)
    data = list(range(300))
    rules = {
        "first": lambda xs: xs[0],
        "middle": lambda xs: xs[len(xs) // 2],
        "random": lambda xs: rng.choice(xs),
    }
    for name, choose in rules.items():
        count = [0]
        quicksort(data, choose, count)
        print(f"{name:7} {count[0]}")

exercises:
  - id: quicksort-rules
    title: Quicksort with pivot rules
    difficulty: 2
    prompt: |
      Write `quicksort(items, rule="first", seed=0)` returning a pair `(sorted_list, comparisons)`. Use the three-way partition from the lesson (less / equal / greater), do not change the input list, and count **len(items) − 1 comparisons for each partition** of a list with more than one item. The pivot `rule` is:

      - `"first"`: the first item;
      - `"middle"`: the item at index `len(items) // 2`;
      - `"random"`: a random item chosen with a `random.Random(seed)` created **once** at the start (use `rng.choice`).

      Raise `ValueError` for any other rule.
    starter: |
      import random


      def quicksort(items, rule="first", seed=0):
          pass
    tests:
      - name: sorting
        code: |
          import random
          rng = random.Random(5)
          for rule in ("first", "middle", "random"):
              for _ in range(30):
                  data = [rng.randint(0, 20) for _ in range(rng.randint(0, 40))]
                  copy = list(data)
                  result, count = quicksort(data, rule)
                  assert result == sorted(data) and data == copy, rule
          try:
              quicksort([1, 2], "best"); assert False
          except ValueError:
              pass
      - name: counts
        code: |
          r, c = quicksort(list(range(100)), "first")
          assert r == list(range(100)) and c == 100 * 99 // 2, c
          r, c = quicksort(list(range(127)), "middle")
          assert c == 642, c
          r, c = quicksort([5] * 50, "first")
          assert c == 49, "Equal items all land in the middle group, so there is one partition"
          assert quicksort([], "random") == ([], 0) and quicksort([9], "first") == ([9], 0)
      - name: random pivot is robust
        code: |
          import math
          n = 1000
          data = list(range(n))
          r, c = quicksort(data, "random", seed=4)
          assert r == data and c < 2 * n * math.log2(n), c
          assert quicksort(data, "random", seed=4)[1] == c, "Same seed, same count"
    hints:
      - "A helper `sort(items)` that returns the sorted list, using a counter you can update (a one-item list or `nonlocal`), keeps the code short."
      - "Choose the pivot with `items[0]`, `items[len(items) // 2]` or `rng.choice(items)`; check the rule name once at the start, so the error is raised even for tiny lists."
      - "Build `less`, `equal` and `greater` with three list comprehensions, add `len(items) - 1` to the count, and return `sort(less) + equal + sort(greater)`."
    solution: |
      import random


      def quicksort(items, rule="first", seed=0):
          if rule not in ("first", "middle", "random"):
              raise ValueError(f"unknown rule {rule!r}")
          rng = random.Random(seed)
          comparisons = 0

          def choose(xs):
              if rule == "first":
                  return xs[0]
              if rule == "middle":
                  return xs[len(xs) // 2]
              return rng.choice(xs)

          def sort(xs):
              nonlocal comparisons
              if len(xs) <= 1:
                  return xs
              pivot = choose(xs)
              less = [x for x in xs if x < pivot]
              equal = [x for x in xs if x == pivot]
              greater = [x for x in xs if x > pivot]
              comparisons += len(xs) - 1
              return sort(less) + equal + sort(greater)

          return sort(list(items)), comparisons
    explanation: |
      The same algorithm, three pivot rules, three very different behaviours on a sorted list: n²/2 for "first", close to n log₂ n for "middle", and about 1.4 n log₂ n for "random". Real data often arrives partly sorted, which is why libraries never use the first item as the pivot. The `[5] * 50` test shows why three-way partitioning matters: with many equal keys, a two-way partition would degrade to quadratic time.

  - id: partition-select
    title: Quickselect and the median
    difficulty: 3
    prompt: |
      Write:

      - `partition(items, pivot)` returning three lists `(less, equal, greater)`, each in the original order.
      - `quickselect(items, k, seed=0)`: the item that would be at index `k` (0-based) if `items` were sorted, using the loop version from the lesson with a `random.Random(seed)` pivot. Do not sort anything and do not change the input. Raise `IndexError` if k is out of range.
      - `median(items)`: for an odd number of items the middle one; for an even number the **average of the two middle ones** (as a float). Raise `ValueError` for an empty list.
    starter: |
      import random


      def partition(items, pivot):
          pass


      def quickselect(items, k, seed=0):
          pass


      def median(items):
          pass
    tests:
      - name: partition
        code: |
          assert partition([3, 1, 4, 1, 5, 9, 2, 6], 3) == ([1, 1, 2], [3], [4, 5, 9, 6])
          assert partition([], 1) == ([], [], [])
          assert partition([2, 2], 2) == ([], [2, 2], [])
      - name: quickselect
        code: |
          import random
          rng = random.Random(11)
          for _ in range(100):
              data = [rng.randint(0, 30) for _ in range(rng.randint(1, 50))]
              copy = list(data)
              k = rng.randrange(len(data))
              assert quickselect(data, k, seed=k) == sorted(data)[k]
              assert data == copy
          for bad in (-1, 3):
              try:
                  quickselect([1, 2, 3], bad); assert False
              except IndexError:
                  pass
      - name: median
        code: |
          assert median([5]) == 5 and median([3, 1, 2]) == 2
          assert median([4, 1, 3, 2]) == 2.5 and median([1, 1, 1, 1]) == 1
          try:
              median([]); assert False
          except ValueError:
              pass
      - name: fast on big input
        code: |
          import random, time
          rng = random.Random(2)
          big = list(range(300000))
          rng.shuffle(big)
          t = time.time()
          assert quickselect(big, 150000) == 150000
          assert median(big) == 149999.5
          assert time.time() - t < 6, "Too slow: don't sort, and don't recurse deeply"
    hints:
      - "`partition` is three list comprehensions."
      - "`quickselect`: loop `while True`: pick `pivot = rng.choice(items)`, call `partition`, then compare k with `len(less)` and `len(less) + len(equal)` as in the lesson. When you go right, reduce k by `len(less) + len(equal)`."
      - "Remember the range check first: `if not 0 <= k < len(items): raise IndexError`."
      - "`median`: for even n it is `(quickselect(items, n // 2 - 1) + quickselect(items, n // 2)) / 2`."
    solution: |
      import random


      def partition(items, pivot):
          less = [x for x in items if x < pivot]
          equal = [x for x in items if x == pivot]
          greater = [x for x in items if x > pivot]
          return less, equal, greater


      def quickselect(items, k, seed=0):
          if not 0 <= k < len(items):
              raise IndexError("k out of range")
          rng = random.Random(seed)
          items = list(items)
          while True:
              pivot = rng.choice(items)
              less, equal, greater = partition(items, pivot)
              if k < len(less):
                  items = less
              elif k < len(less) + len(equal):
                  return pivot
              else:
                  k -= len(less) + len(equal)
                  items = greater


      def median(items):
          n = len(items)
          if n == 0:
              raise ValueError("median of an empty list")
          if n % 2 == 1:
              return quickselect(items, n // 2)
          return (quickselect(items, n // 2 - 1) + quickselect(items, n // 2)) / 2
    explanation: |
      Sorting 300,000 numbers just to read off the middle one is wasteful: quickselect gets there with a few rounds of partitioning, shrinking the list by about a quarter each time, for about 3n comparisons in total. A median of two selections is still Θ(n). Databases and statistics libraries use selection like this for medians and percentiles.

  - id: max-subarray
    title: Maximum subarray
    difficulty: 3
    prompt: |
      Write:

      - `max_subarray_dc(nums)`: the largest sum of a **non-empty** contiguous stretch, by divide and conquer (left half, right half, crossing the middle). Raise `ValueError` for an empty list.
      - `kadane(nums)`: the same answer in a single pass using O(1) extra memory.
      - `best_range(nums)`: a tuple `(total, start, end)` where `nums[start:end + 1]` sums to the best total (any best range is accepted when there are ties).
    starter: |
      def max_subarray_dc(nums):
          pass


      def kadane(nums):
          pass


      def best_range(nums):
          pass
    tests:
      - name: known answers
        code: |
          data = [-2, 1, -3, 4, -1, 2, 1, -5, 4]
          assert max_subarray_dc(data) == 6 and kadane(data) == 6
          assert max_subarray_dc([-3, -1, -2]) == -1 and kadane([-3, -1, -2]) == -1
          assert max_subarray_dc([5]) == 5 and kadane([-5]) == -5
          assert max_subarray_dc([1, 2, 3]) == 6
          for f in (max_subarray_dc, kadane, best_range):
              try:
                  f([]); assert False
              except ValueError:
                  pass
      - name: random lists
        code: |
          import random
          rng = random.Random(21)
          for _ in range(300):
              nums = [rng.randint(-10, 10) for _ in range(rng.randint(1, 25))]
              brute = max(sum(nums[i:j + 1]) for i in range(len(nums)) for j in range(i, len(nums)))
              assert max_subarray_dc(nums) == brute == kadane(nums), nums
              total, s, e = best_range(nums)
              assert total == brute and 0 <= s <= e < len(nums) and sum(nums[s:e + 1]) == total, nums
      - name: speed
        code: |
          import random, time
          rng = random.Random(4)
          nums = [rng.randint(-100, 100) for _ in range(200000)]
          t = time.time()
          a = kadane(nums)
          assert time.time() - t < 1.5
          assert max_subarray_dc(nums[:50000]) == kadane(nums[:50000])
    hints:
      - "Divide and conquer: `mid = (lo + hi) // 2`. Scan left from `mid` down to `lo` keeping the best running total, scan right from `mid + 1` up to `hi` the same way, and add the two bests."
      - "Kadane: `here = max(x, here + x)` and `best = max(best, here)`."
      - "`best_range`: do Kadane while remembering where the current stretch started. When you restart at x (`x > here + x`, meaning `here < 0`), set the start to the current index; when `here` beats `best`, record start and end."
    solution: |
      def max_subarray_dc(nums):
          if not nums:
              raise ValueError("empty list")

          def solve(lo, hi):
              if lo == hi:
                  return nums[lo]
              mid = (lo + hi) // 2
              best_left, total = float("-inf"), 0
              for i in range(mid, lo - 1, -1):
                  total += nums[i]
                  best_left = max(best_left, total)
              best_right, total = float("-inf"), 0
              for i in range(mid + 1, hi + 1):
                  total += nums[i]
                  best_right = max(best_right, total)
              return max(solve(lo, mid), solve(mid + 1, hi), best_left + best_right)

          return solve(0, len(nums) - 1)


      def kadane(nums):
          if not nums:
              raise ValueError("empty list")
          best = here = nums[0]
          for x in nums[1:]:
              here = max(x, here + x)
              best = max(best, here)
          return best


      def best_range(nums):
          if not nums:
              raise ValueError("empty list")
          best = here = nums[0]
          start = best_start = best_end = 0
          for i in range(1, len(nums)):
              if here < 0:
                  here, start = nums[i], i
              else:
                  here += nums[i]
              if here > best:
                  best, best_start, best_end = here, start, i
          return best, best_start, best_end
    explanation: |
      The divide-and-conquer version is Θ(n log n); Kadane's is Θ(n). A negative running total can never help a later stretch, so it's safe to throw it away and start again: that single observation replaces the whole recursion. The test for 200,000 items is only practical for the linear version. Designing with divide and conquer first and then looking for the extra structure is a very common route to a better algorithm.

  - id: majority
    title: Majority element
    difficulty: 3
    prompt: |
      A **majority element** appears **more than half** the time. Write `majority(items)` by divide and conquer: find the majority candidate of the left half and of the right half, count how often each candidate occurs in the **whole** range, and return whichever (if any) has a count above half the range's length. Return `None` if there is no majority (and for an empty list). Do not use `collections.Counter` or `sorted`.

      Also write `majority_count(items)` returning how many items equal the majority (0 if there is none).
    starter: |
      def majority(items):
          pass


      def majority_count(items):
          pass
    tests:
      - name: small cases
        code: |
          assert majority([2, 2, 1, 1, 2, 2, 3]) == 2
          assert majority([1, 2, 3]) is None
          assert majority([]) is None
          assert majority([7]) == 7
          assert majority([1, 1, 2, 2]) is None
          assert majority(["a", "b", "a"]) == "a"
          assert majority_count([2, 2, 1, 1, 2, 2, 3]) == 4
          assert majority_count([1, 2, 3]) == 0
      - name: against Counter
        code: |
          import random
          from collections import Counter
          rng = random.Random(3)
          for _ in range(300):
              n = rng.randint(1, 31)
              data = [rng.choice([0, 0, 0, 1, 2]) for _ in range(n)]
              top, freq = Counter(data).most_common(1)[0]
              expected = top if freq * 2 > n else None
              assert majority(data) == expected, data
              assert majority_count(data) == (freq if expected is not None else 0)
      - name: large
        code: |
          import random, time
          data = [5] * 60001 + [random.Random(1).randint(0, 4) for _ in range(60000)]
          random.Random(2).shuffle(data)
          t = time.time()
          assert majority(data) == 5
          assert time.time() - t < 3
          assert majority(list(range(100000))) is None
    hints:
      - "Base case: an empty list has no majority; a list of one item has that item as its majority."
      - "Combine: `left = majority(items[:mid])`, `right = majority(items[mid:])`. Check each candidate that is not None by counting it in the whole list with `items.count(candidate)`."
      - "A value that is a majority of the whole list must be a majority of at least one half: otherwise it would have at most half in each half."
    solution: |
      def majority(items):
          n = len(items)
          if n == 0:
              return None
          if n == 1:
              return items[0]
          mid = n // 2
          for candidate in (majority(items[:mid]), majority(items[mid:])):
              if candidate is not None and items.count(candidate) * 2 > n:
                  return candidate
          return None


      def majority_count(items):
          winner = majority(items)
          return 0 if winner is None else items.count(winner)
    explanation: |
      Why must a whole-list majority be a majority of one half? If it had at most half of the items in the left half **and** at most half in the right half, it would have at most half overall. So only two candidates need checking, and counting them costs linear time: T(n) = 2T(n/2) + n = Θ(n log n). (A neat Θ(n), O(1)-memory solution exists too: the **Boyer–Moore voting algorithm**, which cancels pairs of different items against each other.)

  - id: fast-fibonacci
    title: Fibonacci in logarithmic time
    difficulty: 4
    prompt: |
      Computing Fibonacci numbers by adding up one at a time takes Θ(n) additions. There is a divide-and-conquer shortcut called **fast doubling**, based on these identities (for F(0) = 0, F(1) = 1):

      - F(2k) = F(k) · (2·F(k + 1) − F(k))
      - F(2k + 1) = F(k)² + F(k + 1)²

      Write `fib_pair(n)` returning the pair **(F(n), F(n + 1))** using these identities recursively (so it makes about log₂ n calls), then `fib(n)` returning F(n). Finally write `fib_calls(n)` returning how many calls to `fib_pair` your algorithm makes for a given n, **counting the first call** (hint: it's the number of recursive levels).
    starter: |
      def fib_pair(n):
          pass


      def fib(n):
          pass


      def fib_calls(n):
          pass
    tests:
      - name: small values
        code: |
          expected = [0, 1]
          for _ in range(60):
              expected.append(expected[-1] + expected[-2])
          for n in range(60):
              assert fib(n) == expected[n], n
              assert fib_pair(n) == (expected[n], expected[n + 1]), n
      - name: large
        code: |
          a, b = 0, 1
          for _ in range(5000):
              a, b = b, a + b
          assert fib(5000) == a
          x = fib(10 ** 5)
          assert x.bit_length() == 69424
          assert fib(10 ** 5 + 1) == fib(10 ** 5) + fib(10 ** 5 - 1)
      - name: calls
        code: |
          assert fib_calls(0) == 1 and fib_calls(1) == 2
          assert fib_calls(2) == 3 and fib_calls(1000) == 11
          assert fib_calls(10 ** 6) == 21
    hints:
      - "Base case: `fib_pair(0)` is `(0, 1)`."
      - "For general n, let `a, b = fib_pair(n // 2)`. Then `c = a * (2 * b - a)` is F(2k) and `d = a * a + b * b` is F(2k + 1). If n is even the answer is `(c, d)`; if n is odd it is `(d, c + d)`."
      - "The call count is 1 for n = 0 and `1 + fib_calls(n // 2)` otherwise."
    solution: |
      def fib_pair(n):
          if n == 0:
              return 0, 1
          a, b = fib_pair(n // 2)
          c = a * (2 * b - a)
          d = a * a + b * b
          if n % 2 == 0:
              return c, d
          return d, c + d


      def fib(n):
          return fib_pair(n)[0]


      def fib_calls(n):
          if n == 0:
              return 1
          return 1 + fib_calls(n // 2)
    explanation: |
      Each call halves n, so there are about log₂ n calls, compared with n additions for the simple loop: T(n) = T(n/2) + O(1) arithmetic operations (although the numbers themselves have about 0.7n bits, so the *bit* cost is larger). Fibonacci(10⁶) needs only about 21 calls. This is the same shape as fast exponentiation in Lesson 8.2, and it shows the pattern: if a problem can be expressed in terms of the same problem at **half** the size, you can often get a logarithmic algorithm.

commonMistakes:
  - title: Choosing the first item as the quicksort pivot without thinking
    explanation: |
      On sorted or nearly sorted data it takes Θ(n²) time and, with recursion, can overflow the call stack. Pick a random or middle (or median-of-three) pivot.
  - title: Dropping three-way partitioning
    explanation: |
      Putting items equal to the pivot on one side (or both) makes lists with many duplicates degrade to quadratic time. Group the equal items in the middle and leave them alone.
  - title: Sorting when you only need one answer
    explanation: |
      For the minimum, maximum, k-th smallest or median, a full sort does far too much work. A scan or quickselect is faster.
  - title: Forgetting the crossing case
    explanation: |
      For problems like maximum subarray or closest pair, the answer may span the dividing line. If you only handle "entirely left" and "entirely right", you'll miss it.
  - title: "Assuming divide and conquer is always the fastest design"
    explanation: |
      It is often a stepping stone. Maximum subarray has an O(n log n) divide-and-conquer solution and a simpler O(n) one. Look for what the recursion is really computing.

summary:
  - "**Divide and conquer**: divide into independent subproblems, conquer them recursively, combine. Analyse with T(n) = aT(n/b) + f(n)."
  - "**Quicksort** does its work in the partition. Pivot rules matter: first-item pivots are Θ(n²) on sorted input, while a **random pivot** gives **expected Θ(n log n)** on every input. Three-way partitioning handles duplicates."
  - "**Quickselect** follows only one side, so T(n) = T(n/2) + n gives expected **Θ(n)** for the k-th smallest item or the median."
  - "**Maximum subarray**: best is in the left half, the right half, or crossing the middle (Θ(n log n)); **Kadane's** scan does it in Θ(n)."
  - "**Fast doubling** computes Fibonacci(n) with about log₂ n calls, like fast exponentiation."
  - "Use divide and conquer when subproblems are independent and the combine step is cheap; use dynamic programming when subproblems overlap."
next: |
  Merge sort, quicksort and heapsort all sort by **comparing** items, and all need about n log n comparisons. Is that a limit of those particular algorithms, or a limit of sorting itself? Lesson 8.4 proves that **no** comparison-based sort can beat n log n, then shows how to **break the barrier** by not comparing at all: counting sort, radix sort and bucket sort sort in linear time under the right conditions.

quiz:
  - type: mcq
    question: "Quicksort uses the first item as its pivot. On which input is it slowest?"
    options:
      - "An already sorted list"
      - "A list in random order"
      - "A list whose items alternate high and low"
      - "A list of two items"
    answer: 0
    explanation: "On sorted input the first item is the smallest, so every partition leaves one side empty and the recursion runs n levels deep: Θ(n²)."
  - type: mcq
    question: Why does a random pivot give quicksort an expected O(n log n) running time on every input?
    options:
      - "Half the pivots land in the middle half of the data, so the problem shrinks geometrically no matter how the input is arranged"
      - "Random pivots are always the median"
      - "Random numbers are faster to compute"
      - "It sorts the input first"
    answer: 0
    explanation: "The randomness is in the algorithm, not the input, so no input can force bad pivots more than a small fraction of the time."
  - type: mcq
    question: Quickselect finds the median in expected linear time because
    options:
      - "it recurses into only one side, so T(n) = T(n/2) + n"
      - "it sorts first"
      - "it recurses into both sides, but each is half the size"
      - "it uses a heap"
    answer: 0
    explanation: "n + n/2 + n/4 + ... = 2n. The recurrence has a = 1, so the top level dominates."
  - type: mcq
    question: "In the divide-and-conquer maximum-subarray algorithm, what are the three places the best stretch can be?"
    options:
      - "Entirely in the left half, entirely in the right half, or crossing the middle"
      - "At the start, in the middle, or at the end"
      - "In the positive numbers, in the negative numbers, or at zero"
      - "In the first item, the last item, or all items"
    answer: 0
    explanation: "The crossing case needs a separate linear scan outward from the middle."
  - type: mcq
    question: Which statement about Kadane's algorithm is true?
    options:
      - "It finds the maximum subarray in one pass using O(1) extra memory"
      - "It is a divide-and-conquer algorithm with T(n) = 2T(n/2) + n"
      - "It requires the numbers to be positive"
      - "It is slower than the divide-and-conquer approach"
    answer: 0
    explanation: "It keeps the best sum of a stretch ending at the current item, which is Θ(n) time and O(1) space."
  - type: mcq
    question: Divide and conquer is a poor fit when
    options:
      - "the subproblems overlap, so the same work is repeated many times"
      - "the problem can be split in half"
      - "the combine step is a simple concatenation"
      - "the subproblems are independent"
    answer: 0
    explanation: "With overlapping subproblems, recursion redoes work. Dynamic programming stores the answers instead."
  - type: code
    question: |
      Write `three_way(items, pivot)` returning the tuple `(less, equal, greater)` of three lists (each keeping the original order) for the items smaller than, equal to, and greater than `pivot`.
    starter: |
      def three_way(items, pivot):
          pass
    tests:
      - name: three way
        code: |
          assert three_way([3, 1, 4, 1, 5], 3) == ([1, 1], [3], [4, 5])
          assert three_way([], 0) == ([], [], [])
          assert three_way([2, 2, 2], 2) == ([], [2, 2, 2], [])
          assert three_way(["b", "a", "c"], "b") == (["a"], ["b"], ["c"])
    solution: |
      def three_way(items, pivot):
          return (
              [x for x in items if x < pivot],
              [x for x in items if x == pivot],
              [x for x in items if x > pivot],
          )
