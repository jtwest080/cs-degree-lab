  - type: code
    question: |
      Write `count_keys(items, k)` returning a list of length `k` whose entry `i` is how many times `i` appears in `items` (all items are in `range(k)`). This is the first pass of counting sort.
    starter: |
      def count_keys(items, k):
          pass
    tests:
      - name: counts
        code: |
          assert count_keys([3, 1, 4, 1, 5], 6) == [0, 2, 0, 1, 1, 1]
          assert count_keys([], 3) == [0, 0, 0]
          assert count_keys([0, 0, 0], 1) == [3]
    solution: |
      def count_keys(items, k):
          counts = [0] * k
          for x in items:
              counts[x] += 1
          return counts
