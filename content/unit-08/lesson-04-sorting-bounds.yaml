      - "So that the digits don't change"
      - "It doesn't need to be stable"
    answer: 0
    explanation: "Stability is what carries the work of earlier passes forward through later ones."
  - type: mcq
    question: For which input would bucket sort take close to quadratic time?
    options:
      - "Numbers all squeezed into a very small part of the range, so they land in one bucket"
      - "Numbers uniformly spread over the range"
      - "Numbers already in sorted order and uniformly spread"
      - "A list of one item"
    answer: 0
    explanation: "Bucket sort bets on an even distribution. If one bucket holds everything, you're just running insertion sort."
