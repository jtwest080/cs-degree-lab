id: u8-sorting-bounds
title: "How Fast Can Sorting Be? The n log n Barrier and How to Break It"
minutes: 55
objective: |
  Prove that **no sorting algorithm that works by comparing items can beat n log n comparisons**, using a **decision tree** argument; then see how **counting sort**, **radix sort** and **bucket sort** sort in **linear time** by exploiting extra knowledge about the keys instead of comparing them.
outcomes:
  - Explain the comparison model and prove the Ω(n log n) lower bound for comparison sorting with a decision tree
  - Say why merge sort and heapsort are asymptotically optimal among comparison sorts
  - Implement counting sort, including the stable version, and explain when it beats n log n
  - Implement radix sort using stable counting sort on each digit
  - Implement bucket sort and say when it runs in expected linear time
  - Explain what a stable sort is and why radix sort depends on stability

sections:
  - heading: A question about all algorithms
    body: |
      So far you've seen sorting algorithms one at a time: selection and insertion sort at Θ(n²), merge sort, heapsort and quicksort at Θ(n log n). An obvious question is whether somebody clever might find a comparison-based sort that does better, say Θ(n) or Θ(n log log n).

      Questions of this kind, "can **any** algorithm do better?", are harder than analysing a particular algorithm, because you must reason about every possible algorithm at once, including ones nobody has thought of. The trick is to **fix a model of computation** that says what steps an algorithm may take, and then prove a bound for every algorithm in the model. This lesson does that for sorting and then shows how to step outside the model.

  - heading: The comparison model
    body: |
      A **comparison sort** learns about the input *only* by asking questions of the form "is item i less than item j?". It never looks inside the items (so it can't see that they are small integers, or how many digits they have). Merge sort, quicksort, heapsort, insertion sort and Python's `sorted` are all comparison sorts.

      Any such algorithm, run on a list of n distinct items, behaves like a **binary tree of questions**, called a **decision tree**:

      - each **internal node** is one comparison, "is a[i] < a[j]?", with a "yes" branch and a "no" branch;
      - each **leaf** is a final answer: the permutation of the input that sorts it.

      Running the algorithm on a particular input follows one path from the root to a leaf. The number of comparisons it makes is the **length of that path**, and the worst case is the **height** of the tree.

  - heading: Why n log n is unavoidable
    body: |
      The argument counts leaves.

      1. The n items could be arranged in **n!** different orders (n factorial: n × (n − 1) × ... × 1). For a correct algorithm, each different input order needs a **different** leaf, because different orders need different sorting permutations. So the tree has **at least n! leaves**.
      2. A binary tree of height h has **at most 2ʰ leaves** (each comparison at most doubles the number of possibilities).
      3. So 2ʰ ≥ n!, which means **h ≥ log₂(n!)**.

      How big is log₂(n!)? The top half of the product n! has n/2 factors that are each at least n/2, so n! ≥ (n/2)^(n/2), and therefore

      log₂(n!) ≥ (n/2) · log₂(n/2) = **Ω(n log n)**.

      (Stirling's formula gives the sharper log₂(n!) ≈ n log₂ n − 1.44 n.) Every comparison sort therefore needs **Ω(n log n) comparisons in the worst case**. Merge sort and heapsort achieve O(n log n), so they are **asymptotically optimal** among comparison sorts: nobody will ever find a faster one in this model.

      For tiny n the bound is very concrete. Five items can be ordered in 5! = 120 ways, and 2⁶ = 64 < 120 ≤ 128 = 2⁷, so **seven** comparisons are necessary in the worst case, no matter how clever the algorithm. (Merge sort uses eight on five items: close to optimal, but not perfect.)

  - heading: "Counting sort: breaking the barrier"
    body: |
      The lower bound has a loophole: it applies only to algorithms that learn about the items **solely by comparing**. If the keys are **small integers** (say between 0 and k − 1), you can use the key as an **index** and never compare anything.

      **Counting sort** works in three steps:

      1. **Count** how many items have each key: `counts[key] += 1`.
      2. Turn the counts into **starting positions** with a running total (the position of the first item with each key in the sorted output).
      3. Go through the items and **place** each in its slot, advancing that key's position.

      ```python
      def counting_sort(items, k):
          counts = [0] * k
          for x in items:
              counts[x] += 1
          start, total = [0] * k, 0
          for key in range(k):
              start[key], total = total, total + counts[key]
          out = [None] * len(items)
          for x in items:
              out[start[x]] = x
              start[x] += 1
          return out
      ```

      The running time is **Θ(n + k)**: a pass over the items to count, a pass over the k keys for positions, and a pass over the items to place. When k is about the same size as n or smaller, that's **linear**. It's no good if the range is huge (sorting n = 100 numbers each up to a billion would need a billion counters).

      Counting sort is **stable**: items with equal keys come out in the same relative order they went in, because we place them in input order. When sorting whole records by a key (people by age, say), stability means that people of the same age stay in their earlier order. That property is what makes the next algorithm work.

  - heading: Radix sort
    body: |
      What if the keys are big integers, like 10-digit phone numbers or 64-bit values? Counting sort can't handle a range of 10¹⁰. **Radix sort** sorts one **digit** at a time, using counting sort for each pass. Starting from the **least significant** digit (LSD radix sort):

      1. Sort all numbers by their **ones** digit (stable).
      2. Sort the result by the **tens** digit (stable).
      3. Continue up to the most significant digit.

      Why does it work? After sorting by digit j, the numbers are ordered by their **last j digits**. Sorting next by digit j + 1 with a **stable** sort puts numbers in order of that digit, and numbers that tie on it stay in the order they already had, i.e., ordered by the lower digits. By induction, after the last pass everything is in order. If the sort were **not** stable, a later pass would scramble the work of the earlier ones.

      Each pass takes Θ(n + b), where b is the number of possible digit values (the **base**), and there are d passes, where d is the number of digits, so the total is **Θ(d · (n + b))**. For numbers up to 10¹⁸ in base 10 that's 18 passes; in base 256 it's only 8 passes of 256 counters each. For fixed-size integers (d constant), radix sort is **linear**. It also sorts strings (one character per pass, if they have the same length) and was used on punched-card machines long before computers.

  - heading: Bucket sort
    body: |
      **Bucket sort** is for numbers spread **evenly** over a known range, such as random decimals between 0 and 1. Create n empty buckets, drop each number into the bucket for its range (x goes in bucket ⌊n · x⌋), sort each bucket on its own (insertion sort is fine), and concatenate.

      If the data really is uniformly distributed, each bucket gets about **one** item on average, so the buckets are tiny and the total is **expected Θ(n)**. The worst case is when everything lands in one bucket, which makes it as slow as whatever sorts that bucket. So bucket sort is a bet on the distribution of the data, in a way that merge sort is not.

      | Algorithm | Time | Needs |
      |---|---|---|
      | Merge sort, heapsort | Θ(n log n) worst case | only comparisons |
      | Quicksort (random pivot) | Θ(n log n) expected | only comparisons |
      | Counting sort | Θ(n + k) | integer keys in 0..k−1 |
      | Radix sort | Θ(d · (n + b)) | fixed-length digit strings or integers |
      | Bucket sort | Θ(n) expected | uniformly spread numbers |

  - heading: Stability and sorting in practice
    body: |
      A sort is **stable** if items with equal keys keep their original relative order (you met this in Lesson 3.5 with `sorted`). Stability lets you sort by several keys one after another: to sort people by (last name, first name), sort by first name **first**, then stably by last name. That is exactly radix sort's idea, with names in place of digits.

      Merge sort and insertion sort are stable. Selection sort, heapsort and the usual quicksort are not (they can swap equal items past each other). Python's `sorted` and `list.sort` are stable (Timsort), which is why you can write `sorted(people, key=...)` in successive steps.

      In everyday programming you should almost always call the library sort: it's carefully optimised, and for most data a comparison sort is plenty. Counting and radix sorts shine in special situations: sorting millions of small integers, ages, zip codes, IP addresses, or fixed-length strings.

examples:
  - title: The decision-tree lower bound in numbers
    intro: "log₂(n!) comparisons are necessary. Compare with what real algorithms use in their worst cases."
    code: |
      import math

      def merge_worst(n):
          if n <= 1:
              return 0
          return merge_worst(n // 2) + merge_worst(n - n // 2) + n - 1

      print("n   lower bound  merge sort  insertion sort")
      for n in range(2, 11):
          bound = math.ceil(math.log2(math.factorial(n)))
          print(f"{n:<3} {bound:<12} {merge_worst(n):<11} {n * (n - 1) // 2}")
    output: |
      n   lower bound  merge sort  insertion sort
      2   1            1           1
      3   3            3           3
      4   5            5           6
      5   7            8           10
      6   10           11          15
      7   13           14          21
      8   16           17          28
      9   19           21          36
      10  22           25          45
    lines:
      - line: 3-6
        note: "Merge sort's worst-case comparison count: sort two halves, then merge them with at most n − 1 comparisons."
      - line: 10
        note: "No algorithm can do better than the ceiling of log₂(n!): with 5 items, 5! = 120 orders need at least 7 yes/no answers because 2⁶ = 64 < 120."
      - line: 11
        note: "Merge sort stays within a few comparisons of the bound, while insertion sort falls further behind as n grows."
  - title: Counting sort, step by step
    intro: "Sort ages (0 to 9) and watch the counts become starting positions."
    code: |
      ages = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5]
      k = 10

      counts = [0] * k
      for x in ages:
          counts[x] += 1
      print("counts:", counts)

      start, total = [0] * k, 0
      for key in range(k):
          start[key], total = total, total + counts[key]
      print("start :", start)

      out = [None] * len(ages)
      for x in ages:
          out[start[x]] = x
          start[x] += 1
      print("sorted:", out)
    output: |
      counts: [0, 2, 1, 2, 1, 3, 1, 0, 0, 1]
      start : [0, 0, 2, 3, 5, 6, 9, 10, 10, 10]
      sorted: [1, 1, 2, 3, 3, 4, 5, 5, 5, 6, 9]
    lines:
      - line: 4-6
        note: "Pass 1: one counter per possible key. Three 5s, two 1s, and so on. No item is compared with another."
      - line: 9-10
        note: "Pass 2: a running total turns counts into the index where each key's group begins. Key 5 starts at index 6, after the six smaller items."
      - line: 13-15
        note: "Pass 3: each item goes to the next free slot of its group. Items with equal keys are placed in input order, which is what makes counting sort stable."
  - title: Radix sort, one digit at a time
    intro: "Three stable passes sort three-digit numbers. Look at how each pass keeps the order from the previous one."
    code: |
      def digit_pass(nums, place):
          buckets = [[] for _ in range(10)]
          for x in nums:
              buckets[x // place % 10].append(x)
          return [x for bucket in buckets for x in bucket]

      nums = [170, 45, 75, 90, 802, 24, 2, 66]
      place = 1
      while place <= max(nums):
          nums = digit_pass(nums, place)
          print(f"after the {place:>3}s digit:", nums)
          place *= 10
    output: |
      after the   1s digit: [170, 90, 802, 2, 24, 45, 75, 66]
      after the  10s digit: [802, 2, 24, 45, 66, 170, 75, 90]
      after the 100s digit: [2, 24, 45, 66, 75, 90, 170, 802]
    lines:
      - line: 2-5
        note: "A stable pass: each number goes into the bucket for its current digit, in order, and the buckets are read out in digit order."
      - line: 4
        note: "`x // place % 10` extracts the digit: for place = 10, 170 → 17 → 7."
      - line: 10
        note: "After the tens pass the list is sorted by the last two digits (02, 24, 45, 66, 70, 75, 90). Because the pass is stable, ties on the tens digit (like 70 and 75, or 02 and 802) keep the earlier order. The final pass finishes the job."

playground:
  prompt: |
    Experiment with counting sort on records. Change the data, or change `key` to sort by a different field, and check that people with the same age stay in their original order (stability).
  code: |
    people = [("Ana", 30), ("Ben", 25), ("Cai", 30), ("Dee", 25), ("Eli", 41)]
    key = lambda p: p[1] // 10          # decade of age: 2, 3 or 4
    k = 5

    counts = [0] * k
    for p in people:
        counts[key(p)] += 1
    start, total = [0] * k, 0
    for i in range(k):
        start[i], total = total, total + counts[i]
    out = [None] * len(people)
    for p in people:
        out[start[key(p)]] = p
        start[key(p)] += 1
    print(out)

exercises:
  - id: lower-bound
    title: The lower bound, exactly
    difficulty: 2
    prompt: |
      Write:

      - `min_comparisons(n)`: the smallest integer c such that 2ᶜ ≥ n!. That is the fewest comparisons any comparison sort needs in the worst case on n items. Use exact integer arithmetic (no `math.log2`, which loses precision for large n), for example with `int.bit_length()`. Return 0 for n ≤ 1.
      - `merge_sort_worst(n)`: the worst-case number of comparisons of merge sort, from the recurrence M(1) = 0, M(n) = M(⌊n/2⌋) + M(⌈n/2⌉) + n − 1.
      - `optimal_gap(n)`: `merge_sort_worst(n) - min_comparisons(n)`, how many comparisons merge sort wastes in the worst case.
      - `first_n_beyond(c)`: the smallest n such that **c comparisons are not enough** to sort n items, i.e. n! > 2ᶜ.
    starter: |
      def min_comparisons(n):
          pass


      def merge_sort_worst(n):
          pass


      def optimal_gap(n):
          pass


      def first_n_beyond(c):
          pass
    tests:
      - name: bound
        code: |
          assert [min_comparisons(n) for n in range(0, 13)] == [0, 0, 1, 3, 5, 7, 10, 13, 16, 19, 22, 26, 29]
          assert min_comparisons(100) == 525
          assert min_comparisons(1000) == 8530
      - name: merge sort
        code: |
          assert [merge_sort_worst(n) for n in range(1, 11)] == [0, 1, 3, 5, 8, 11, 14, 17, 21, 25]
          assert merge_sort_worst(1024) == 1024 * 10 - 1023
      - name: gap and beyond
        code: |
          assert [optimal_gap(n) for n in range(1, 8)] == [0, 0, 0, 0, 1, 1, 1]
          assert all(optimal_gap(n) >= 0 for n in range(1, 200))
          assert first_n_beyond(0) == 2
          assert first_n_beyond(1) == 3 and first_n_beyond(3) == 4 and first_n_beyond(10) == 7
          assert first_n_beyond(29) == 13
    hints:
      - "n! is `math.factorial(n)`. The smallest c with 2ᶜ ≥ f is `(f - 1).bit_length()` for f ≥ 1, which avoids floating point."
      - "`merge_sort_worst` is a direct translation of the recurrence (use `n // 2` and `n - n // 2` for the two halves)."
      - "`first_n_beyond`: start at n = 1 and keep increasing n until `math.factorial(n) > 2 ** c`."
    solution: |
      import math


      def min_comparisons(n):
          if n <= 1:
              return 0
          return (math.factorial(n) - 1).bit_length()


      def merge_sort_worst(n):
          if n <= 1:
              return 0
          return merge_sort_worst(n // 2) + merge_sort_worst(n - n // 2) + n - 1


      def optimal_gap(n):
          return merge_sort_worst(n) - min_comparisons(n)


      def first_n_beyond(c):
          n = 1
          while math.factorial(n) <= 2 ** c:
              n += 1
          return n
    explanation: |
      The decision tree argument predicts the **exact** minimum for small n, such as 7 comparisons for 5 items and 10 for 6. Merge sort wastes at most a few comparisons. That's why O(n log n) is the final answer for comparison sorting and why the algorithms in Lessons 4.7 and 7.8 are optimal up to constant factors. (Finding the *exact* minimum comparisons for each n is a famous, still unsolved problem for larger n.)

  - id: counting-sort
    title: Counting sort
    difficulty: 2
    prompt: |
      Write:

      - `counting_sort(items, k)`: return a new sorted list of the integers in `items`, all of which are in `range(k)`. Raise `ValueError` if any item is outside that range. Use the three-pass method from the lesson (no `sorted`, no `list.sort`).
      - `sort_records(records, key, k)`: a **stable** counting sort of arbitrary records by `key(record)`, where the keys are in `range(k)`. Return the new list.
      - `count_in_range(items)`: build a table of **prefix sums** of the counts (all items are non-negative integers; let `k = max(items) + 1`) and return a function `query(low, high)` that tells you in constant time how many items lie between `low` and `high` inclusive (both within `range(k)`).
    starter: |
      def counting_sort(items, k):
          pass


      def sort_records(records, key, k):
          pass


      def count_in_range(items):
          pass
    tests:
      - name: counting_sort
        code: |
          assert counting_sort([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5], 10) == [1, 1, 2, 3, 3, 4, 5, 5, 5, 6, 9]
          assert counting_sort([], 5) == [] and counting_sort([0, 0], 1) == [0, 0]
          for bad in ([5], [-1]):
              try:
                  counting_sort(bad, 5); assert False
              except ValueError:
                  pass
      - name: stable records
        code: |
          people = [("Ana", 3), ("Ben", 1), ("Cai", 3), ("Dee", 1), ("Eli", 2), ("Fay", 3)]
          out = sort_records(people, lambda p: p[1], 4)
          assert out == [("Ben", 1), ("Dee", 1), ("Eli", 2), ("Ana", 3), ("Cai", 3), ("Fay", 3)], out
          assert people[0] == ("Ana", 3)
      - name: range queries
        code: |
          data = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5]
          q = count_in_range(data)
          assert q(1, 1) == 2 and q(0, 9) == 11 and q(4, 6) == 5 and q(7, 8) == 0
          assert q(5, 5) == 3
      - name: linear time
        code: |
          import random, time
          rng = random.Random(1)
          data = [rng.randrange(1000) for _ in range(500000)]
          t = time.time()
          out = counting_sort(data, 1000)
          assert out == sorted(data)
          assert time.time() - t < 4
    hints:
      - "`counting_sort`: count, then turn counts into start positions, then place. Check `0 <= x < k` while counting."
      - "For `sort_records`, count by `key(r)` and place the records themselves, in their original order, into `start[key(r)]`."
      - "`count_in_range`: `prefix[i]` = number of items with value < i, i.e. `prefix[i + 1] = prefix[i] + counts[i]`. Then the answer is `prefix[high + 1] - prefix[low]`."
    solution: |
      def counting_sort(items, k):
          counts = [0] * k
          for x in items:
              if not 0 <= x < k:
                  raise ValueError(f"{x} is outside range({k})")
              counts[x] += 1
          out = []
          for key in range(k):
              out.extend([key] * counts[key])
          return out


      def sort_records(records, key, k):
          counts = [0] * k
          for r in records:
              counts[key(r)] += 1
          start, total = [0] * k, 0
          for i in range(k):
              start[i], total = total, total + counts[i]
          out = [None] * len(records)
          for r in records:
              out[start[key(r)]] = r
              start[key(r)] += 1
          return out


      def count_in_range(items):
          k = max(items) + 1
          counts = [0] * k
          for x in items:
              counts[x] += 1
          prefix = [0] * (k + 1)
          for i in range(k):
              prefix[i + 1] = prefix[i] + counts[i]
          return lambda low, high: prefix[high + 1] - prefix[low]
    explanation: |
      Counting sort never compares two items, so it sidesteps the n log n lower bound. When items are plain integers, you can rebuild the sorted list straight from the counts (`counting_sort`); when they are **records**, you need the position-table version to carry the records along and keep equal keys in their original order (`sort_records`). The prefix-sum table is the same idea as the starting positions, put to use for fast range queries.

  - id: radix-sort
    title: Radix sort
    difficulty: 3
    prompt: |
      Write `radix_sort(nums, base=10)` for a list of **non-negative integers**, using LSD radix sort: one **stable** pass per digit (in the given base), from the least significant digit up to the most significant digit of the **largest** number. Return a new sorted list; do not change the input; do not use `sorted` or `list.sort`. Each pass must be a stable counting sort or bucket pass on `x // base**i % base`.

      Also write `radix_passes(nums, base=10)`, which returns the number of passes your algorithm makes (0 for an empty list or a list whose maximum is 0, otherwise the number of digits of the maximum), and `strings_radix_sort(words)`, which sorts a list of **equal-length lowercase strings** the same way, with one pass per character from the last to the first.
    starter: |
      def radix_sort(nums, base=10):
          pass


      def radix_passes(nums, base=10):
          pass


      def strings_radix_sort(words):
          pass
    tests:
      - name: radix_sort
        code: |
          import random
          assert radix_sort([170, 45, 75, 90, 802, 24, 2, 66]) == [2, 24, 45, 66, 75, 90, 170, 802]
          assert radix_sort([]) == [] and radix_sort([0, 0]) == [0, 0] and radix_sort([7]) == [7]
          data = [5, 3, 9]
          assert radix_sort(data) == [3, 5, 9] and data == [5, 3, 9]
          rng = random.Random(9)
          for base in (2, 10, 16, 256):
              nums = [rng.randrange(10 ** 12) for _ in range(500)]
              assert radix_sort(nums, base) == sorted(nums), base
          nums = [10 ** 18 + i for i in (5, 3, 4)]
          assert radix_sort(nums, 256) == sorted(nums)
      - name: passes
        code: |
          assert radix_passes([]) == 0 and radix_passes([0]) == 0
          assert radix_passes([9]) == 1 and radix_passes([10, 3]) == 2 and radix_passes([999, 1000]) == 4
          assert radix_passes([255], 256) == 1 and radix_passes([256], 256) == 2
          assert radix_passes([8], 2) == 4
      - name: strings
        code: |
          words = ["dog", "cat", "car", "ant", "bat", "cab"]
          assert strings_radix_sort(words) == ["ant", "bat", "cab", "car", "cat", "dog"]
          assert strings_radix_sort([]) == []
      - name: big
        code: |
          import random, time
          rng = random.Random(3)
          nums = [rng.randrange(2 ** 32) for _ in range(100000)]
          t = time.time()
          assert radix_sort(nums, 256) == sorted(nums)
          assert time.time() - t < 6
    hints:
      - "Number of passes: keep dividing the maximum by `base` until it reaches 0 and count the divisions."
      - "One pass: create `base` empty buckets, append each number to `buckets[x // base**i % base]` in input order, then read the buckets back in order. Appending in order is what keeps it stable."
      - "For strings, use `ord(word[i]) - ord('a')` as the bucket index, and loop `i` from `len(word) - 1` down to 0."
    solution: |
      def radix_passes(nums, base=10):
          biggest = max(nums, default=0)
          passes = 0
          while biggest > 0:
              passes += 1
              biggest //= base
          return passes


      def radix_sort(nums, base=10):
          result = list(nums)
          place = 1
          for _ in range(radix_passes(nums, base)):
              buckets = [[] for _ in range(base)]
              for x in result:
                  buckets[x // place % base].append(x)
              result = [x for bucket in buckets for x in bucket]
              place *= base
          return result


      def strings_radix_sort(words):
          if not words:
              return []
          result = list(words)
          for i in range(len(words[0]) - 1, -1, -1):
              buckets = [[] for _ in range(26)]
              for w in result:
                  buckets[ord(w[i]) - ord("a")].append(w)
              result = [w for bucket in buckets for w in bucket]
          return result
    explanation: |
      Each pass is a stable bucket sort, so after pass i the numbers are in order by their last i digits. For 32-bit numbers in base 256 that's only four passes over the data: radix sort is fast, and its running time grows **linearly** with the number of items. Choosing a bigger base means fewer passes but more buckets per pass; powers of two (like 256 or 65,536) work well in practice because digits can be extracted with fast bit operations.

  - id: bucket-sort
    title: Bucket sort
    difficulty: 3
    prompt: |
      Write:

      - `bucket_sort(values)`: sort floats in the range **[0, 1)** by putting each into one of `n` buckets (bucket index `int(n * x)`, where n is the number of values), sorting each bucket with insertion sort **that you write yourself**, and joining the buckets. Return a new list. Raise `ValueError` for a value outside [0, 1).
      - `bucket_sizes(values)`: the list of bucket sizes for the same bucketing (length n).
      - `insertion_steps(values)`: the total number of **shifts** (item moves) the insertion sorts perform across all buckets. It will be about n for uniform data, and about n²/2 when everything lands in one bucket.
    starter: |
      def bucket_sort(values):
          pass


      def bucket_sizes(values):
          pass


      def insertion_steps(values):
          pass
    tests:
      - name: sorting
        code: |
          import random
          assert bucket_sort([]) == []
          assert bucket_sort([0.5]) == [0.5]
          assert bucket_sort([0.78, 0.17, 0.39, 0.26, 0.72, 0.94, 0.21, 0.12, 0.23, 0.68]) == [0.12, 0.17, 0.21, 0.23, 0.26, 0.39, 0.68, 0.72, 0.78, 0.94]
          rng = random.Random(4)
          data = [rng.random() for _ in range(2000)]
          assert bucket_sort(data) == sorted(data)
          try:
              bucket_sort([0.5, 1.0]); assert False
          except ValueError:
              pass
      - name: sizes
        code: |
          assert bucket_sizes([0.1, 0.15, 0.9, 0.95]) == [2, 0, 0, 2]
          assert sum(bucket_sizes([0.1, 0.5, 0.2])) == 3 and len(bucket_sizes([0.1, 0.5, 0.2])) == 3
      - name: uniform versus clustered
        code: |
          import random
          rng = random.Random(6)
          n = 3000
          uniform = [rng.random() for _ in range(n)]
          clustered = [0.5 + rng.random() * 0.0001 for _ in range(n)]
          assert max(bucket_sizes(uniform)) < 12
          assert max(bucket_sizes(clustered)) == n
          assert insertion_steps(uniform) < 3 * n, insertion_steps(uniform)
          assert insertion_steps(clustered) > n * n / 8
    hints:
      - "Buckets: `[[] for _ in range(n)]`, and `buckets[int(n * x)].append(x)` for each value."
      - "Insertion sort on one bucket: for each item, shift larger items one place to the right until its slot is found. Count each shift for `insertion_steps`."
      - "Write one helper that insertion-sorts a list and returns `(sorted_list, shifts)`, and reuse it in both functions."
    solution: |
      def _bucketise(values):
          n = len(values)
          buckets = [[] for _ in range(n)]
          for x in values:
              if not 0 <= x < 1:
                  raise ValueError(f"{x} is outside [0, 1)")
              buckets[int(n * x)].append(x)
          return buckets


      def _insertion(items):
          items = list(items)
          shifts = 0
          for i in range(1, len(items)):
              key = items[i]
              j = i - 1
              while j >= 0 and items[j] > key:
                  items[j + 1] = items[j]
                  j -= 1
                  shifts += 1
              items[j + 1] = key
          return items, shifts


      def bucket_sort(values):
          out = []
          for bucket in _bucketise(values):
              out.extend(_insertion(bucket)[0])
          return out


      def bucket_sizes(values):
          return [len(b) for b in _bucketise(values)]


      def insertion_steps(values):
          return sum(_insertion(b)[1] for b in _bucketise(values))
    explanation: |
      The experiment tells the story. For **uniform** data the largest bucket holds only a handful of items and the total number of shifts is about n, so the whole sort is linear. For **clustered** data all n items land in the same bucket and the insertion sort does n²/2 shifts: bucket sort is only as good as the assumption about the data. Hash tables (Lesson 7.5) rely on exactly the same idea: spread the keys evenly across buckets and each bucket stays short.

  - id: stability
    title: Is this sort stable?
    difficulty: 3
    prompt: |
      A sorting function `sort_fn(items, key)` returns a sorted **new list** of the items by `key(item)`. Write `is_stable(sort_fn)` that returns `True` if the function is stable on **every** test case you try, and `False` as soon as it finds a case where two items with equal keys have swapped their relative order. Use pairs like `(key, label)` with many repeated keys (try at least 200 random lists with a seeded `random.Random`, and also a few fixed lists of your own), and sort them with `key=lambda p: p[0]`.

      Then write `sort_by_two_keys(people)`, where each person is a tuple `(first, last, age)`, returning the list sorted by **last name, then first name, then age**, using **three successive stable sorts** (one per key, least significant first, with `sorted(..., key=...)` each time) and no combined tuple key.
    starter: |
      import random


      def is_stable(sort_fn):
          pass


      def sort_by_two_keys(people):
          pass
    tests:
      - name: detects stability
        code: |
          def stable_python(items, key):
              return sorted(items, key=key)

          def insertion(items, key):
              a = list(items)
              for i in range(1, len(a)):
                  x = a[i]
                  j = i - 1
                  while j >= 0 and key(a[j]) > key(x):
                      a[j + 1] = a[j]
                      j -= 1
                  a[j + 1] = x
              return a

          def selection(items, key):
              a = list(items)
              for i in range(len(a)):
                  m = min(range(i, len(a)), key=lambda t: key(a[t]))
                  a[i], a[m] = a[m], a[i]
              return a

          def reverse_sort(items, key):
              return sorted(items, key=key, reverse=True)[::-1]

          assert is_stable(stable_python) is True
          assert is_stable(insertion) is True
          assert is_stable(selection) is False
          assert is_stable(lambda items, key: sorted(items, key=key, reverse=True)[::-1]) is False
      - name: two keys
        code: |
          people = [("Zoe", "Lee", 30), ("Amy", "Lee", 25), ("Bob", "Ng", 20), ("Amy", "Lee", 20), ("Cy", "Adams", 41)]
          assert sort_by_two_keys(people) == [
              ("Cy", "Adams", 41), ("Amy", "Lee", 20), ("Amy", "Lee", 25), ("Zoe", "Lee", 30), ("Bob", "Ng", 20)
          ]
          assert people[0] == ("Zoe", "Lee", 30)
          assert sort_by_two_keys([]) == []
    hints:
      - "Build test lists like `[(random.randrange(4), i) for i in range(20)]` so the second field records the original position."
      - "A sort is stable on a list if, for every pair of neighbours in the output with equal keys, the labels are in increasing order (they were in increasing order in the input)."
      - "`sort_by_two_keys`: sort by age first, then by first name, then by last name. Python's sort is stable, so each later sort keeps the order from the earlier ones among ties."
    solution: |
      import random


      def is_stable(sort_fn):
          rng = random.Random(0)
          cases = [[(1, 0), (1, 1), (0, 2), (1, 3), (0, 4)], [(0, i) for i in range(10)]]
          for _ in range(200):
              n = rng.randint(2, 25)
              cases.append([(rng.randrange(4), i) for i in range(n)])
          for items in cases:
              out = sort_fn(list(items), lambda p: p[0])
              for a, b in zip(out, out[1:]):
                  if a[0] == b[0] and a[1] > b[1]:
                      return False
          return True


      def sort_by_two_keys(people):
          result = sorted(people, key=lambda p: p[2])
          result = sorted(result, key=lambda p: p[0])
          result = sorted(result, key=lambda p: p[1])
          return result
    explanation: |
      Selection sort fails the test because swapping the minimum into place jumps over equal items. Insertion sort passes (it only moves an item past **strictly larger** ones), and so does Python's sort. Sorting by several keys with several stable sorts, **least significant first**, is exactly radix sort's trick: the digits are the keys. It's also a handy way to avoid long composite keys.

commonMistakes:
  - title: Saying "sorting needs n log n" without the condition
    explanation: |
      The lower bound is for **comparison** sorts. Counting, radix and bucket sort beat it by using extra information about the keys.
  - title: Using counting sort when the key range is huge
    explanation: |
      Θ(n + k) is only good when k is not much bigger than n. Sorting 100 numbers up to 10⁹ with counting sort would allocate a billion counters; use radix sort or a comparison sort instead.
  - title: Using an unstable sort inside radix sort
    explanation: |
      Each pass must keep the order produced by the earlier passes among equal digits. With an unstable pass, the result is wrong.
  - title: Sorting most-significant digit first
    explanation: |
      The simple LSD radix sort goes from the **least** significant digit upwards. Going from the top down needs a different (recursive) algorithm, MSD radix sort.
  - title: Assuming bucket sort is always linear
    explanation: |
      It's expected linear only when the data is spread evenly across the range. Clustered data lands in a few buckets and the time degrades to that of the sort used inside each bucket.

summary:
  - "A **comparison sort** only learns about its input by comparing items. Its **decision tree** has at least n! leaves and height at least log₂(n!) = **Ω(n log n)**, so merge sort and heapsort are asymptotically optimal."
  - "**Counting sort** uses keys as array indices: count, turn counts into positions, place. **Θ(n + k)**, no comparisons, and **stable**."
  - "**Radix sort** applies a stable sort to each digit from least to most significant: **Θ(d(n + b))**, linear for fixed-size keys."
  - "**Bucket sort** distributes uniformly spread values into n buckets: **expected Θ(n)**, but quadratic if the data clusters."
  - "A sort is **stable** if equal keys keep their original order; stability makes multi-key sorting and radix sort work. Python's `sorted` is stable."
  - "In practice use the library sort; reach for counting or radix sort when keys are small integers or fixed-length strings."
next: |
  Sorting showed how to *prove* that an algorithm is optimal. The next three lessons are about **designing** algorithms for **optimisation problems**, where you want the best of many possible answers. Lesson 8.5 starts with **greedy algorithms**: make the locally best choice at each step and never look back. When does that give the best answer overall? You'll learn the **exchange argument** to prove it, and apply it to scheduling, Huffman coding and more.

quiz:
  - type: mcq
    question: What does the decision-tree argument prove?
    options:
      - "Every comparison-based sorting algorithm needs Ω(n log n) comparisons in the worst case"
      - "Every sorting algorithm needs Ω(n log n) time"
      - "Quicksort is the fastest sorting algorithm"
      - "Sorting needs at least n comparisons only"
    answer: 0
