  - type: code
    question: |
      Write `finish_order(intervals)` returning the list of `(start, end)` intervals sorted by earliest finish time, with ties broken by earlier start. (This is the first step of the earliest-finish scheduling algorithm.)
    starter: |
      def finish_order(intervals):
          pass
    tests:
      - name: order
        code: |
          assert finish_order([(1, 10), (2, 3), (4, 5), (3, 5)]) == [(2, 3), (3, 5), (4, 5), (1, 10)]
          assert finish_order([]) == []
    solution: |
      def finish_order(intervals):
          return sorted(intervals, key=lambda iv: (iv[1], iv[0]))
