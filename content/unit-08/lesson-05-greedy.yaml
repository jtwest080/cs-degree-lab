id: u8-greedy
title: Greedy Algorithms and Exchange Arguments
minutes: 55
objective: |
  Design **greedy algorithms**, which make the best-looking choice at every step and never reconsider, and learn to **prove** when that is correct using the **exchange argument**. Apply it to scheduling, interval partitioning, fractional knapsack and **Huffman coding**, and recognise problems where greedy fails.
outcomes:
  - Describe the greedy-choice property and optimal substructure, and explain why both are needed
  - Prove a greedy algorithm correct with an exchange argument or a "greedy stays ahead" argument
  - Solve interval scheduling, minimising lateness and interval partitioning greedily
  - Solve the fractional knapsack problem greedily, and explain why the 0/1 version defeats the same idea
  - Build a Huffman code with a priority queue and explain why it is optimal among prefix codes
  - Find counterexamples to greedy rules that sound plausible but are wrong

sections:
  - heading: "Greedy: take the best now"
    body: |
      In Lesson 4.8 you met greedy algorithms: build a solution one piece at a time, always taking the choice that looks best **right now**, and **never reconsider**. Making change by taking the largest coin first is the classic example.

      Greedy algorithms are attractive because they are usually **simple** and **fast**: often a sort or a priority queue, followed by one pass, for O(n log n) in total. The difficulty is that they're **not always correct**. For coins of 1, 3 and 4, greedy makes 6 as 4 + 1 + 1 (three coins), but 3 + 3 (two coins) is better. A greedy algorithm needs a **proof**, because testing a few examples can't show that no counterexample exists.

      Two properties are what make a greedy algorithm work:

      - **Greedy-choice property.** There is an optimal solution that **includes** the greedy first choice. So making that choice never loses anything.
      - **Optimal substructure.** After making the choice, what remains is a smaller problem of the same kind, and an optimal solution to it combines with the choice to give an optimal solution to the original.

      If both hold, a simple induction shows that the greedy algorithm is optimal: choose greedily, solve the remainder by induction.

  - heading: The exchange argument
    body: |
      The standard way to prove the greedy-choice property is the **exchange argument**:

      1. Take **any** optimal solution O. (You can't assume anything about how it looks.)
      2. Show that you can **exchange** part of O for the greedy choice **without making it worse**, producing another solution O′ that contains the greedy choice and is **still optimal**.
      3. Conclude that some optimal solution contains the greedy choice.

      **Example: interval scheduling.** You have a room and a list of requests, each with a start and end time. Choose as many **non-overlapping** requests as possible. The greedy rule is to **always pick the request that finishes earliest** (among those that don't clash with ones already chosen).

      *Proof.* Let g be the request that finishes earliest of all, and let O be any optimal schedule, with first request f. Because g finishes no later than f, swapping f for g in O keeps O conflict-free (g ends before the rest of O's requests start, because f did). The number of requests is unchanged, so O′ is still optimal and contains g. After picking g, discard everything that overlaps it and repeat on what's left: the same argument applies by induction. ∎

      Notice that the proof tells you **why this rule and no other**. Rules that also sound sensible, like "earliest start" or "shortest request", have counterexamples (in the exercises you'll find them). The exchange argument is what separates a correct greedy algorithm from a plausible-sounding one.

      A related technique is **"greedy stays ahead"**: show that after each step the greedy solution is at least as good as any other solution at the same step, and conclude it's best at the end.

  - heading: Scheduling classics
    body: |
      **Minimising maximum lateness.** You have jobs, each with a **duration** and a **deadline**, to run one after another on a single machine. A job's **lateness** is how long after its deadline it finishes (zero if on time). Order the jobs to minimise the **largest** lateness. The greedy rule: **earliest deadline first (EDF)**. Exchange argument: if two adjacent jobs are out of deadline order, swapping them can't increase the maximum lateness. So repeatedly fixing such pairs, which is just sorting, reaches an optimal schedule. (Shortest-job-first sounds plausible, but is wrong for this goal.)

      **Interval partitioning.** You have a list of lectures with start and end times and want the **fewest rooms** so that no two lectures in one room overlap. Sort lectures by start time. For each lecture, if some room has become free (its last lecture has already ended), reuse it; otherwise open a new room. Keeping the **end times** of the rooms in a **min-heap** (Lesson 7.8) finds the earliest-finishing room in O(log n), so the whole algorithm is O(n log n). The number of rooms used equals the **maximum number of lectures running at the same moment**, which is obviously a lower bound, so the greedy answer is optimal.

  - heading: Knapsack and where greedy stops working
    body: |
      You have a bag of capacity W and items with a **weight** and a **value**. You want the most valuable load.

      - In the **fractional knapsack** problem you may take part of an item (think of gold dust, flour or time). The greedy rule: sort by **value per unit weight** and take the best-ratio items first, splitting the last one if needed. The exchange argument is easy: if the best-ratio item isn't fully used in an optimal load but something worse is, swap some of the worse for more of the better and the value can only go up.
      - In the **0/1 knapsack** problem each item must be taken **whole** or not at all. The same greedy rule **fails**. With capacity 50 and items (weight 10, value 60), (20, 100), (30, 120), the best ratios are 6, 5, 4, so greedy takes the first two (value 160, weight 30) and can't fit the third; but items 2 and 3 together weigh exactly 50 and are worth **220**. The choice "take the best ratio" isn't safe, because the leftover space it leaves can be wasted. This problem is solved by **dynamic programming** (Lesson 8.7).

      Greedy failing for 0/1 knapsack and coin change with unusual denominations is a warning: **when a choice can leave awkward leftovers, greedy fails.** (Coin systems like 1, 5, 10, 25, 100 happen to be well behaved, which is why cashiers get away with greedy.)

  - heading: "Huffman coding: greedy compression"
    body: |
      Computers normally store each character of text in a fixed number of bits (8 for ASCII). But letters are not equally common: in English, `e` is far more frequent than `z`. **Huffman coding** assigns **short codes to frequent symbols and long codes to rare ones**, saving space overall.

      The codes must be a **prefix code**: no code may be the start of another, or you couldn't tell where one symbol ends and the next begins. (`0` and `01` can't both be codes; `0` and `10` can.) A prefix code is the same as a **binary tree** with the symbols at the **leaves**, where a symbol's code is the path from the root: 0 for left, 1 for right. Decoding just follows the bits down the tree.

      **Huffman's algorithm** builds the best tree greedily:

      1. Make a leaf for every symbol, with its frequency as weight, and put them all in a **min-heap**.
      2. Repeatedly remove the **two lightest** trees, join them under a new parent whose weight is their sum, and put the parent back.
      3. When one tree is left, it is the Huffman tree.

      Rare symbols are merged first, so they end up **deepest** (longest codes). The cost of the finished code, the total number of bits used, equals the sum of all the merged weights (every symbol's frequency is counted once for each level it sits below the root). With n symbols the algorithm does n − 1 merges, each O(log n): **O(n log n)**.

      *Why is it optimal?* An exchange argument: in some optimal tree the two rarest symbols are **siblings at the deepest level** (if not, swap them down: a rarer symbol moved deeper and a more frequent one moved up can only reduce the total). So merging them first, as Huffman does, is a safe greedy choice, and the problem that remains (with the merged pair treated as one symbol) has the same form. Huffman codes are used inside ZIP, GZIP, JPEG and MP3 compression.

examples:
  - title: Interval scheduling by earliest finish
    intro: "Compare the earliest-finish rule with the plausible-looking earliest-start rule on the same requests."
    code: |
      requests = [(1, 10), (2, 3), (4, 5), (6, 7), (8, 9), (3, 6)]

      def greedy(requests, key):
          chosen, last_end = [], float("-inf")
          for start, end in sorted(requests, key=key):
              if start >= last_end:
                  chosen.append((start, end))
                  last_end = end
          return chosen

      by_finish = greedy(requests, key=lambda r: r[1])
      by_start = greedy(requests, key=lambda r: r[0])
      print("earliest finish:", len(by_finish), by_finish)
      print("earliest start :", len(by_start), by_start)
    output: |
      earliest finish: 4 [(2, 3), (4, 5), (6, 7), (8, 9)]
      earliest start : 1 [(1, 10)]
    lines:
      - line: 4
        note: "`last_end` is when the room becomes free. We start with minus infinity so the first request always fits."
      - line: 5
        note: "Requests are considered in the order the rule prefers; the loop is the same for every rule."
      - line: 6
        note: "A request fits only if it starts at or after the last chosen request ended (touching at one instant is allowed here)."
      - line: 11
        note: "Earliest finish packs in four short requests."
      - line: 12
        note: "Earliest start grabs the long request (1, 10) first, which blocks everything else: only one request."
  - title: Fractional knapsack
    intro: "Take the best value-per-kilo first, splitting the last item if needed."
    code: |
      items = [("gold", 10, 60), ("silver", 20, 100), ("copper", 30, 120)]   # (name, kilos, value)
      capacity = 50

      load, total, room = [], 0.0, capacity
      for name, kilos, value in sorted(items, key=lambda it: it[2] / it[1], reverse=True):
          take = min(kilos, room)
          if take == 0:
              break
          load.append((name, take))
          total += value * take / kilos
          room -= take
      print(load)
      print("value:", total)
    output: |
      [('gold', 10), ('silver', 20), ('copper', 20)]
      value: 240.0
    lines:
      - line: 5
        note: "Sort by value per kilo: gold 6, silver 5, copper 4."
      - line: 6
        note: "Take as much of the item as fits: all of it, or just enough to fill the bag."
      - line: 10
        note: "A fraction of an item brings the same fraction of its value."
      - line: 12
        note: "The same items in the 0/1 version (whole items only) are worth at most 220: greedy by ratio would take only gold and silver (160)."
  - title: Building a Huffman code
    intro: "Merge the two lightest trees until one is left. The frequent letter gets the shortest code."
    code: |
      import heapq
      from collections import Counter

      def huffman_codes(text):
          heap = [(count, i, char) for i, (char, count) in enumerate(sorted(Counter(text).items()))]
          heapq.heapify(heap)
          order = len(heap)
          while len(heap) > 1:
              w1, _, left = heapq.heappop(heap)
              w2, _, right = heapq.heappop(heap)
              heapq.heappush(heap, (w1 + w2, order, (left, right)))
              order += 1
          codes = {}
          def walk(node, prefix):
              if isinstance(node, str):
                  codes[node] = prefix or "0"
              else:
                  walk(node[0], prefix + "0")
                  walk(node[1], prefix + "1")
          walk(heap[0][2], "")
          return codes

      text = "abracadabra"
      codes = huffman_codes(text)
      for char in sorted(codes, key=lambda c: (len(codes[c]), c)):
          print(char, codes[char])
      bits = sum(len(codes[c]) for c in text)
      print(bits, "bits, versus", 3 * len(text), "with a fixed 3 bits per letter")
    output: |
      a 0
      b 110
      c 100
      d 101
      r 111
      23 bits, versus 33 with a fixed 3 bits per letter
    lines:
      - line: 5
        note: "One leaf per distinct character, weighted by how often it occurs. The middle number is a tie-breaker so the heap never has to compare two trees."
      - line: 8-12
        note: "The greedy step: remove the two lightest trees and join them. After n − 1 merges one tree is left."
      - line: 14-20
        note: "A symbol's code is the path from the root to its leaf: 0 for left, 1 for right."
      - line: 26
        note: "'a' occurs 5 times of 11 and gets the shortest code. The text takes 23 bits instead of 33, and no code is the prefix of another."

playground:
  prompt: |
    Try your own text. Change `text` to a sentence and see which letters get short codes. Then try a text where every letter is equally common (like "abcdabcd") and notice that Huffman can't save much, since there is no skew to exploit.
  code: |
    import heapq
    from collections import Counter

    text = "mississippi river"
    heap = [(count, i, char) for i, (char, count) in enumerate(sorted(Counter(text).items()))]
    heapq.heapify(heap)
    order = len(heap)
    cost = 0
    while len(heap) > 1:
        w1, _, a = heapq.heappop(heap)
        w2, _, b = heapq.heappop(heap)
        cost += w1 + w2
        heapq.heappush(heap, (w1 + w2, order, (a, b)))
        order += 1
    print("Huffman bits:", cost)
    print("fixed-length bits:", len(text) * (len(set(text)) - 1).bit_length())

exercises:
  - id: scheduling
    title: Lateness and rooms
    difficulty: 2
    prompt: |
      Write:

      - `edf(jobs)`: `jobs` is a list of `(name, duration, deadline)`. Run them one after another from time 0 in **earliest deadline first** order (ties broken by name). Return a pair `(order, max_lateness)`, where `order` is the list of names and `max_lateness` is the largest of `max(0, finish_time - deadline)` over all jobs (0 for no jobs).
      - `rooms_needed(lectures)`: `lectures` is a list of `(start, end)`. Return the minimum number of rooms so that no two lectures in a room overlap. A lecture that **starts exactly when another ends** may use the same room. Use a **min-heap** of room end times (`heapq`).
    starter: |
      import heapq


      def edf(jobs):
          pass


      def rooms_needed(lectures):
          pass
    tests:
      - name: edf
        code: |
          jobs = [("a", 3, 6), ("b", 2, 8), ("c", 1, 9), ("d", 4, 9), ("e", 3, 14), ("f", 2, 15)]
          assert edf(jobs) == (["a", "b", "c", "d", "e", "f"], 1)
          assert edf([]) == ([], 0)
          order, late = edf([("x", 5, 5), ("y", 1, 2)])
          assert order == ["y", "x"] and late == 1
          order, late = edf([("p", 2, 10), ("q", 2, 10)])
          assert order == ["p", "q"] and late == 0
      - name: edf is optimal
        code: |
          import itertools, random
          rng = random.Random(8)
          def lateness(order, jobs):
              d = {n: (dur, dl) for n, dur, dl in jobs}
              t = worst = 0
              for n in order:
                  t += d[n][0]
                  worst = max(worst, t - d[n][1])
              return worst
          for _ in range(100):
              jobs = [(chr(97 + i), rng.randint(1, 6), rng.randint(1, 20)) for i in range(rng.randint(1, 6))]
              best = min(lateness(p, jobs) for p in itertools.permutations([j[0] for j in jobs]))
              assert edf(jobs)[1] == max(0, best), jobs
      - name: rooms
        code: |
          assert rooms_needed([]) == 0
          assert rooms_needed([(1, 4), (2, 5), (4, 6)]) == 2
          assert rooms_needed([(1, 2), (2, 3), (3, 4)]) == 1
          assert rooms_needed([(0, 10), (1, 9), (2, 8), (3, 7)]) == 4
          import random, time
          rng = random.Random(1)
          lectures = [(s := rng.randrange(10 ** 6), s + rng.randint(1, 500)) for _ in range(100000)]
          t = time.time()
          rooms = rooms_needed(lectures)
          events = sorted([(s, 1) for s, e in lectures] + [(e, -1) for s, e in lectures])
          cur = peak = 0
          for _, d in events:
              cur += d
              peak = max(peak, cur)
          assert rooms == peak and time.time() - t < 4
    hints:
      - "`edf`: `sorted(jobs, key=lambda j: (j[2], j[0]))`, then add up the durations to get finish times."
      - "`rooms_needed`: sort by start time. Keep a min-heap of the end times of rooms in use. For each lecture, if the earliest end time is `<=` its start, pop it (reuse that room); then push this lecture's end time. The final heap size is the number of rooms."
    solution: |
      import heapq


      def edf(jobs):
          ordered = sorted(jobs, key=lambda j: (j[2], j[0]))
          time = worst = 0
          for name, duration, deadline in ordered:
              time += duration
              worst = max(worst, time - deadline)
          return [j[0] for j in ordered], worst


      def rooms_needed(lectures):
          ends = []
          for start, end in sorted(lectures):
              if ends and ends[0] <= start:
                  heapq.heapreplace(ends, end)
              else:
                  heapq.heappush(ends, end)
          return len(ends)
    explanation: |
      Both are a **sort followed by one pass**, the signature of a greedy algorithm. The test for EDF brute-forces every ordering of up to six jobs and finds none that beats it, which is the exchange argument in action. For the rooms, the heap gives the earliest-free room instantly: the answer equals the largest number of lectures happening at once, the obvious lower bound.

  - id: knapsack
    title: Fractional and 0/1 knapsack
    difficulty: 3
    prompt: |
      Items are tuples `(name, weight, value)` with positive weights.

      - `fractional_knapsack(items, capacity)`: return `(total_value, amounts)` where `amounts` is a dictionary `{name: fraction_taken}` (fractions between 0 and 1, omitting items not taken at all), filling the bag by best value-per-weight first. The total should be a float.
      - `knapsack_01(items, capacity)`: the best total value (an integer if all values are integers) when each item must be taken whole or not at all. Try **every subset** (this brute force is fine for up to 15 items).
      - `greedy_01(items, capacity)`: the value you get by going down the items in best value-per-weight order and taking each one **whole** if it still fits.
      - `greedy_fails_example()`: return `(items, capacity)` with exactly **3 items** such that `greedy_01` gives a strictly smaller value than `knapsack_01`.
    starter: |
      import itertools


      def fractional_knapsack(items, capacity):
          pass


      def knapsack_01(items, capacity):
          pass


      def greedy_01(items, capacity):
          pass


      def greedy_fails_example():
          pass
    tests:
      - name: fractional
        code: |
          items = [("gold", 10, 60), ("silver", 20, 100), ("copper", 30, 120)]
          total, amounts = fractional_knapsack(items, 50)
          assert abs(total - 240.0) < 1e-9, total
          assert amounts == {"gold": 1.0, "silver": 1.0, "copper": 2 / 3} or (
              amounts["gold"] == 1 and amounts["silver"] == 1 and abs(amounts["copper"] - 2 / 3) < 1e-9)
          total, amounts = fractional_knapsack(items, 5)
          assert abs(total - 30) < 1e-9 and amounts == {"gold": 0.5}
          assert fractional_knapsack(items, 1000)[0] == 280 and fractional_knapsack([], 10) == (0.0, {})
      - name: 0/1
        code: |
          items = [("gold", 10, 60), ("silver", 20, 100), ("copper", 30, 120)]
          assert knapsack_01(items, 50) == 220
          assert greedy_01(items, 50) == 160
          assert knapsack_01(items, 5) == 0 and greedy_01(items, 5) == 0
          assert knapsack_01([], 10) == 0
      - name: counterexample
        code: |
          items, cap = greedy_fails_example()
          assert len(items) == 3 and cap > 0
          assert greedy_01(items, cap) < knapsack_01(items, cap)
      - name: greedy is never better
        code: |
          import random
          rng = random.Random(2)
          for _ in range(200):
              items = [(i, rng.randint(1, 9), rng.randint(1, 20)) for i in range(rng.randint(1, 8))]
              cap = rng.randint(1, 25)
              frac = fractional_knapsack(items, cap)[0]
              best = knapsack_01(items, cap)
              assert greedy_01(items, cap) <= best <= frac + 1e-9
    hints:
      - "Sort with `key=lambda it: it[2] / it[1], reverse=True`."
      - "Fractional: `take = min(weight, room)`; the fraction is `take / weight`; the value is `value * take / weight`. Stop when the room is 0."
      - "0/1 brute force: for each size r, `itertools.combinations(items, r)`; keep the best total value among subsets whose total weight is `<= capacity`."
      - "For the counterexample, adapt the lesson's: capacity 50 with items of (weight, value) = (10, 60), (20, 100), (30, 120)."
    solution: |
      import itertools


      def _by_ratio(items):
          return sorted(items, key=lambda it: it[2] / it[1], reverse=True)


      def fractional_knapsack(items, capacity):
          total, amounts, room = 0.0, {}, capacity
          for name, weight, value in _by_ratio(items):
              if room <= 0:
                  break
              take = min(weight, room)
              amounts[name] = take / weight
              total += value * take / weight
              room -= take
          return total, amounts


      def knapsack_01(items, capacity):
          best = 0
          for r in range(len(items) + 1):
              for subset in itertools.combinations(items, r):
                  if sum(it[1] for it in subset) <= capacity:
                      best = max(best, sum(it[2] for it in subset))
          return best


      def greedy_01(items, capacity):
          total, room = 0, capacity
          for name, weight, value in _by_ratio(items):
              if weight <= room:
                  total += value
                  room -= weight
          return total


      def greedy_fails_example():
          return [("a", 10, 60), ("b", 20, 100), ("c", 30, 120)], 50
    explanation: |
      The chain greedy_01 ≤ best ≤ fractional is true for every instance: a fractional load can imitate any whole-item load, and the greedy whole-item load is one of the possible subsets. When the best-ratio items fill the bag exactly, greedy is also optimal for 0/1: it fails when the leftover space gets wasted. This is the situation where you need dynamic programming.

  - id: huffman
    title: Huffman coding
    difficulty: 4
    prompt: |
      Write:

      - `huffman_codes(text)`: return a dictionary mapping each distinct character of `text` to its Huffman code (a string of `"0"` and `"1"`), built by repeatedly merging the two lightest trees with a min-heap (`heapq`). Break ties in the heap with an increasing counter so that the algorithm never compares two trees. If the text has only one distinct character, give it the code `"0"`. Return `{}` for the empty string.
      - `encode(text, codes)`: the bit string for `text`.
      - `decode(bits, codes)`: the original text from the bit string. (Read the bits and emit a character as soon as the bits read so far match a code: prefix codes make that unambiguous.)
      - `encoded_size(text)`: the number of bits in the Huffman encoding of `text`.
    starter: |
      import heapq
      from collections import Counter


      def huffman_codes(text):
          pass


      def encode(text, codes):
          pass


      def decode(bits, codes):
          pass


      def encoded_size(text):
          pass
    tests:
      - name: prefix code
        code: |
          codes = huffman_codes("abracadabra")
          assert set(codes) == set("abrcd")
          assert all(set(c) <= {"0", "1"} for c in codes.values())
          words = list(codes.values())
          for i, a in enumerate(words):
              for j, b in enumerate(words):
                  assert i == j or not b.startswith(a), (a, b)
          assert len(codes["a"]) == 1
          assert huffman_codes("") == {} and huffman_codes("zzzz") == {"z": "0"}
      - name: optimal cost
        code: |
          import heapq, random
          from collections import Counter
          def optimal_cost(text):
              w = sorted(Counter(text).values())
              if len(w) < 2:
                  return len(text)
              heapq.heapify(w)
              cost = 0
              while len(w) > 1:
                  a, b = heapq.heappop(w), heapq.heappop(w)
                  cost += a + b
                  heapq.heappush(w, a + b)
              return cost
          assert encoded_size("abracadabra") == 23 == optimal_cost("abracadabra")
          rng = random.Random(5)
          for _ in range(100):
              text = "".join(rng.choice("aaaabbbccdefg") for _ in range(rng.randint(1, 60)))
              assert encoded_size(text) == optimal_cost(text), text
      - name: round trip
        code: |
          import random
          rng = random.Random(6)
          for _ in range(50):
              text = "".join(rng.choice("abcdefgh  ") for _ in range(rng.randint(0, 80)))
              codes = huffman_codes(text)
              bits = encode(text, codes)
              assert set(bits) <= {"0", "1"} and decode(bits, codes) == text
          text = "the quick brown fox jumps over the lazy dog " * 40
          assert len(encode(text, huffman_codes(text))) < 8 * len(text) * 0.6
    hints:
      - "Heap entries are `(weight, counter, tree)` where a tree is either a character or a pair `(left, right)`. Start with one entry per character from `Counter(text)`; sort the items first so the result is repeatable."
      - "Pop two entries, push `(w1 + w2, counter, (tree1, tree2))`, and increase the counter. Stop when one entry remains."
      - "Walk the tree: leaf → `codes[char] = prefix` (use `\"0\"` if the prefix is empty), left child adds `\"0\"`, right child adds `\"1\"`."
      - "`decode`: build the reverse dictionary `{code: char}`, then read bits into a buffer and emit when the buffer is in the dictionary."
    solution: |
      import heapq
      from collections import Counter


      def huffman_codes(text):
          if not text:
              return {}
          heap = [(count, i, char) for i, (char, count) in enumerate(sorted(Counter(text).items()))]
          heapq.heapify(heap)
          order = len(heap)
          while len(heap) > 1:
              w1, _, left = heapq.heappop(heap)
              w2, _, right = heapq.heappop(heap)
              heapq.heappush(heap, (w1 + w2, order, (left, right)))
              order += 1
          codes = {}

          def walk(node, prefix):
              if isinstance(node, str):
                  codes[node] = prefix or "0"
              else:
                  walk(node[0], prefix + "0")
                  walk(node[1], prefix + "1")

          walk(heap[0][2], "")
          return codes


      def encode(text, codes):
          return "".join(codes[c] for c in text)


      def decode(bits, codes):
          reverse = {code: char for char, code in codes.items()}
          out, buffer = [], ""
          for bit in bits:
              buffer += bit
              if buffer in reverse:
                  out.append(reverse[buffer])
                  buffer = ""
          return "".join(out)


      def encoded_size(text):
          return len(encode(text, huffman_codes(text)))
    explanation: |
      The two rarest symbols are always merged first, so they end up deepest in the tree. The test compares your total with the **sum of the merge weights**, an independent formula for the same cost, on 100 random texts. The round-trip test shows the prefix property in action: decoding needs no separators between codes. Real compressors store the tree (or the frequencies) at the start of the file so the receiver can rebuild it.

  - id: gas-stops
    title: Refuelling stops
    difficulty: 3
    prompt: |
      A car drives along a straight road from position 0 to position `dest`. A full tank lets it drive `tank` units. Petrol stations are at the sorted positions in the list `stations` (each between 0 and `dest`). The car starts with a full tank and fills up completely at every station where it stops.

      Write `refuel_stops(stations, dest, tank)` that returns the **smallest list of stations** (positions, in increasing order) where the car must stop to reach `dest`, using the greedy rule **drive as far as you can, then stop at the farthest station you can reach**. Return `None` if the destination can't be reached. A car with `tank >= dest` needs no stops (return `[]`).

      Also write `min_stops_brute(stations, dest, tank)`: the minimum **number** of stops found by trying all subsets of stations (fine for up to 12 stations), or `None` if impossible.
    starter: |
      import itertools


      def refuel_stops(stations, dest, tank):
          pass


      def min_stops_brute(stations, dest, tank):
          pass
    tests:
      - name: examples
        code: |
          assert refuel_stops([], 5, 10) == []
          assert refuel_stops([4, 8, 11, 15], 18, 10) == [8]
          assert refuel_stops([3, 6, 9], 12, 4) == [3, 6, 9]
          assert refuel_stops([5], 20, 6) is None
          assert refuel_stops([2, 4], 8, 3) is None
          assert refuel_stops([10], 10, 10) == []
      - name: against brute force
        code: |
          import random
          rng = random.Random(7)
          for _ in range(300):
              dest = rng.randint(5, 40)
              tank = rng.randint(3, 15)
              stations = sorted(rng.sample(range(1, dest), rng.randint(0, min(9, dest - 1))))
              greedy = refuel_stops(stations, dest, tank)
              best = min_stops_brute(stations, dest, tank)
              if best is None:
                  assert greedy is None, (stations, dest, tank)
              else:
                  assert greedy is not None and len(greedy) == best, (stations, dest, tank, greedy, best)
                  pos = tank
                  stops = list(greedy)
                  fuel_at = 0
                  for s in stops:
                      assert s in stations and s <= fuel_at + tank
                      fuel_at = s
                  assert dest <= fuel_at + tank
      - name: long road
        code: |
          stations = list(range(1, 100000, 7))
          stops = refuel_stops(stations, 100000, 50)
          assert stops is not None and len(stops) <= 100000 // 49 + 1
    hints:
      - "Keep `fuel_at`, the position where the tank was last filled (0 at the start). The farthest you can go is `fuel_at + tank`."
      - "While `fuel_at + tank < dest`: among stations with position `<= fuel_at + tank` and `> fuel_at`, pick the **farthest**. If there is none, return None. Otherwise record it and set `fuel_at` to it."
      - "A single left-to-right scan with an index pointer is enough: advance the pointer while the next station is within reach, remember the last one you passed."
      - "Brute force: for each size r in increasing order, try `itertools.combinations(stations, r)`, and check that every gap between consecutive filled positions (0, the chosen stations, `dest`) is at most `tank`."
    solution: |
      import itertools


      def refuel_stops(stations, dest, tank):
          stops = []
          fuel_at = 0
          i = 0
          while fuel_at + tank < dest:
              reach = fuel_at + tank
              best = None
              while i < len(stations) and stations[i] <= reach:
                  if stations[i] > fuel_at:
                      best = stations[i]
                  i += 1
              if best is None:
                  return None
              stops.append(best)
              fuel_at = best
          return stops


      def min_stops_brute(stations, dest, tank):
          for r in range(len(stations) + 1):
              for chosen in itertools.combinations(stations, r):
                  points = [0, *chosen, dest]
                  if all(b - a <= tank for a, b in zip(points, points[1:])):
                      return r
          return None
    explanation: |
      Stopping at the **farthest** reachable station is the greedy choice: an exchange argument shows that any optimal plan can replace its first stop by that station without needing more stops later, because the car then has at least as much road ahead. The brute-force check over all subsets confirms the greedy count on 300 random roads. The scan is O(n) once the stations are sorted.

  - id: wrong-rules
    title: Plausible but wrong
    difficulty: 3
    prompt: |
      Here are three greedy rules for interval scheduling (choose as many non-overlapping intervals as possible; intervals that merely touch, like (1, 3) and (3, 5), do **not** overlap):

      - `"start"`: take intervals in order of earliest **start**;
      - `"shortest"`: take intervals in order of shortest **duration**;
      - `"finish"`: take intervals in order of earliest **finish**.

      Write `greedy_count(intervals, rule)`: scan the intervals in the rule's order (ties broken by the interval tuple itself) and take every one that doesn't overlap those already taken. Return how many were taken. Write `best_count(intervals)`: the optimal number, by trying every subset (fine for up to 10 intervals). Finally write `counterexample(rule)`: return a list of 3 to 5 intervals on which the rule takes **fewer** intervals than the optimum, or `None` if you believe the rule is always optimal.
    starter: |
      import itertools


      def greedy_count(intervals, rule):
          pass


      def best_count(intervals):
          pass


      def counterexample(rule):
          pass
    tests:
      - name: counts
        code: |
          reqs = [(1, 10), (2, 3), (4, 5), (6, 7), (8, 9), (3, 6)]
          assert greedy_count(reqs, "finish") == best_count(reqs) == 4
          assert greedy_count(reqs, "start") == 1
          assert greedy_count([(1, 3), (3, 5)], "finish") == 2
          assert greedy_count([], "finish") == 0 and best_count([]) == 0
          try:
              greedy_count(reqs, "random"); assert False
          except ValueError:
              pass
      - name: counterexamples
        code: |
          for rule in ("start", "shortest"):
              c = counterexample(rule)
              assert c is not None and 3 <= len(c) <= 5, rule
              assert greedy_count(c, rule) < best_count(c), (rule, c)
          assert counterexample("finish") is None
      - name: earliest finish is optimal
        code: |
          import random
          rng = random.Random(3)
          for _ in range(300):
              iv = []
              for _ in range(rng.randint(1, 9)):
                  s = rng.randint(0, 20)
                  iv.append((s, s + rng.randint(1, 8)))
              assert greedy_count(iv, "finish") == best_count(iv), iv
    hints:
      - "Sort key: `start` → `(s, e)`; `shortest` → `(e - s, s, e)`; `finish` → `(e, s)`."
      - "Taking an interval is allowed when `start >= last_end` of the last interval you took (since you scan them in the rule's order, not by time, compare with **all** taken intervals instead: two intervals overlap when `a_start < b_end and b_start < a_end`)."
      - "Counterexample for `start`: one long interval that starts first and covers several short ones. For `shortest`: a short interval that sits in the middle and overlaps two longer ones that don't overlap each other."
    solution: |
      import itertools


      def _key(rule):
          if rule == "start":
              return lambda iv: (iv[0], iv[1])
          if rule == "shortest":
              return lambda iv: (iv[1] - iv[0], iv[0], iv[1])
          if rule == "finish":
              return lambda iv: (iv[1], iv[0])
          raise ValueError(f"unknown rule {rule!r}")


      def _overlap(a, b):
          return a[0] < b[1] and b[0] < a[1]


      def greedy_count(intervals, rule):
          chosen = []
          for iv in sorted(intervals, key=_key(rule)):
              if all(not _overlap(iv, other) for other in chosen):
                  chosen.append(iv)
          return len(chosen)


      def best_count(intervals):
          for r in range(len(intervals), 0, -1):
              for subset in itertools.combinations(intervals, r):
                  if all(not _overlap(a, b) for a, b in itertools.combinations(subset, 2)):
                      return r
          return 0


      def counterexample(rule):
          if rule == "start":
              return [(0, 10), (1, 2), (3, 4), (5, 6)]
          if rule == "shortest":
              return [(0, 5), (4, 7), (6, 11)]
          return None
    explanation: |
      Earliest start grabs the long interval that covers everything, and shortest-duration is fooled by a short interval that overlaps two others that fit together. Earliest **finish** is the only one of the three with an exchange argument, and the 300 random tests back it up. The moral: a rule that sounds sensible is not a proof. Always look for a counterexample (a small brute-force checker like `best_count` is the quickest way) and then look for the exchange argument.

commonMistakes:
  - title: Trusting a greedy rule because it works on the examples
    explanation: |
      Greedy rules often work on small cases and fail on tricky ones (coins 1, 3, 4 for the amount 6). Check against brute force on many small random inputs, then find an exchange argument.
  - title: Choosing the wrong greedy criterion
    explanation: |
      Interval scheduling needs earliest **finish**, not earliest start or shortest length. Lateness needs earliest **deadline**, not shortest job. The right criterion is the one the exchange argument supports.
  - title: Using greedy for 0/1 knapsack
    explanation: |
      Best ratio first is optimal for the fractional version only. With whole items, the leftover space can be wasted. Use dynamic programming.
  - title: Forgetting tie-breaking in a heap
    explanation: |
      When two heap entries have equal weights Python compares the next tuple element. If that element is a tree or a custom object, it may raise an error. Add a unique counter as the second element.
  - title: Making Huffman codes that aren't prefix-free
    explanation: |
      Symbols must be at the **leaves** of the tree. If a symbol also sits at an internal node, its code is a prefix of other codes and decoding breaks.

summary:
  - "A **greedy algorithm** makes the best-looking choice at each step and never revisits it. It works when the problem has the **greedy-choice property** and **optimal substructure**."
  - "Prove it with an **exchange argument** (swap part of any optimal solution for the greedy choice without making it worse) or by showing greedy **stays ahead**."
  - "Correct greedy algorithms: interval scheduling by **earliest finish**, minimising lateness by **earliest deadline**, interval partitioning with a **min-heap** of room end times, **fractional** knapsack by value per weight."
  - "**Huffman coding** repeatedly merges the two lightest trees with a min-heap, giving an optimal prefix code in O(n log n)."
  - "Greedy fails for **0/1 knapsack** and general coin change, where choices leave awkward leftovers. Those need dynamic programming."
  - "Always test a greedy rule against **brute force** on small inputs; a sensible-sounding rule is not a proof."
next: |
  Greedy algorithms commit to a choice and move on. When that's not safe, you need a method that **tries every possibility** without redoing work: **dynamic programming**. Lesson 8.6 starts with the idea that makes it work, **overlapping subproblems**, using memoisation (top-down) and tabulation (bottom-up), and applies it to Fibonacci, climbing stairs, **coin change** done right, and the longest increasing subsequence.

