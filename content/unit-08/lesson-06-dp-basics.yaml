  - type: code
    question: |
      Write `tribonacci(n)` using a bottom-up loop: `t(0) = 0`, `t(1) = 0`, `t(2) = 1`, and `t(n) = t(n-1) + t(n-2) + t(n-3)` for `n >= 3`.
    starter: |
      def tribonacci(n):
          pass
    tests:
      - name: values
        code: |
          assert [tribonacci(n) for n in range(8)] == [0, 0, 1, 1, 2, 4, 7, 13]
          assert tribonacci(60) == 1383410902447554
    solution: |
      def tribonacci(n):
          a, b, c = 0, 0, 1
          if n == 0:
              return 0
          for _ in range(n - 2 if n >= 2 else 0):
              a, b, c = b, c, a + b + c
          return c if n >= 2 else b
