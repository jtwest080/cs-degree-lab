id: u8-dp-basics
title: "Dynamic Programming I: Overlapping Subproblems"
minutes: 55
objective: |
  Recognise when a recursive solution repeats the same work, and remove the repetition with **memoisation** (top-down) or **tabulation** (bottom-up). Use it for Fibonacci, climbing stairs, **coin change** done correctly, and the longest increasing subsequence.
outcomes:
  - Explain overlapping subproblems and why they make plain recursion exponential
  - Speed up a recursion with memoisation using a dictionary or functools.cache
  - Convert a recursion into a bottom-up table and choose the order to fill it
  - Define a DP state and a recurrence for a new problem
  - Solve coin change (fewest coins and number of ways) and the longest increasing subsequence
  - Count the subproblems and the work per subproblem to get the running time

sections:
  - heading: The problem with plain recursion
    body: |
      In Lesson 8.3 divide and conquer split a problem into **independent** pieces: merge sort's two halves share nothing. Some problems split into pieces that **overlap**, so the same subproblem gets solved again and again.

      The classic case is Fibonacci: `fib(n) = fib(n-1) + fib(n-2)`. A direct recursion computes `fib(n-2)` once for `fib(n)` and again inside `fib(n-1)`, and every one of those repeats itself. The number of calls roughly multiplies by 1.6 for each step in n, so `fib(40)` takes hundreds of millions of calls even though there are only **41 different questions** to answer.

      **Dynamic programming (DP)** is the cure: solve each distinct subproblem **once**, remember the answer, and look it up whenever it is needed again. The name is historical and says little. Think of it as **recursion plus a memory**.

      DP applies when a problem has:

      - **Optimal substructure**: the answer is built from answers to smaller subproblems, so you can write a recurrence.
      - **Overlapping subproblems**: the number of *distinct* subproblems is small, even though the recursion tree is huge.

  - heading: Memoisation (top-down)
    body: |
      **Memoisation** keeps the recursive code and adds a cache: before computing, check whether this subproblem has been solved; after computing, store the answer.

      ```python
      from functools import cache

      @cache
      def fib(n):
          return n if n < 2 else fib(n - 1) + fib(n - 2)
      ```

      `@cache` (from `functools`) does the bookkeeping for you: it stores the result for every set of arguments it has seen. Each distinct `n` is computed once, so `fib(n)` takes O(n) time instead of exponential.

      Memoisation is the easiest way to write a DP: first write the correct recursion (getting the **state** and the **recurrence** right is the whole difficulty), then add the cache. Arguments must be hashable (numbers, strings, tuples; not lists). Python's recursion limit (about 1000) can be a problem for very deep recursions.

  - heading: Tabulation (bottom-up)
    body: |
      **Tabulation** fills a table in an order such that everything a cell depends on is already filled. No recursion is needed.

      ```python
      def fib(n):
          table = [0, 1] + [0] * (n - 1)
          for i in range(2, n + 1):
              table[i] = table[i - 1] + table[i - 2]
          return table[n]
      ```

      A tabulated solution is usually faster in practice (no function-call overhead, no recursion limit) and often lets you **throw away old rows**: Fibonacci only needs the last two values, so O(1) memory suffices. The price is that you must work out a valid **filling order**.

      Both styles compute the same thing. A useful way to find the running time is:

      **time = (number of distinct subproblems) × (work to combine per subproblem)**

      For Fibonacci that is n × O(1) = O(n).

  - heading: A recipe for designing a DP
    body: |
      1. **Define the state**: what do you need to know to describe a subproblem? Write it as a sentence: "`ways[i]` is the number of ways to climb `i` stairs".
      2. **Write the recurrence** for a state in terms of smaller states, with the **base cases**.
      3. **Choose an order** (bottom-up) or add a cache (top-down).
      4. **Read off the answer**, which is usually one particular state.
      5. **Count** states × work per state for the running time.

      **Climbing stairs.** You climb n steps, taking 1 or 2 at a time. State: `ways[i]` = the number of ways to reach step `i`. The last move was a 1-step from `i-1` or a 2-step from `i-2`, so `ways[i] = ways[i-1] + ways[i-2]`, with `ways[0] = 1`. It is the Fibonacci recurrence again.

  - heading: "Coin change, done correctly"
    body: |
      In Lesson 8.5 greedy failed for coins 1, 3, 4 and the amount 6. DP always works. **State:** `best[a]` = the fewest coins that make amount `a`. The last coin used is some coin `c`, leaving `a - c` to make, so

      `best[a] = 1 + min(best[a - c] for each coin c <= a)`

      with `best[0] = 0` and "impossible" represented by infinity. There are `amount` states and `len(coins)` choices each, so the time is **O(amount × coins)**, and it is correct for any set of coins.

      A second question has a different recurrence: in **how many ways** can you make an amount, where 1+3 and 3+1 count as the same? Process the coins **one kind at a time**, in an outer loop; for each coin, update `ways[a] += ways[a - coin]`. Putting the coin loop outside is what stops different orderings from being counted separately. (Swap the loops and you count *sequences* instead.)

  - heading: Longest increasing subsequence
    body: |
      A **subsequence** keeps elements in order but may skip some. In `[3, 1, 4, 1, 5, 9, 2, 6]` the longest strictly increasing subsequence is `1, 4, 5, 9` or `3, 4, 5, 6`, so its length is 4.

      **State:** `length[i]` = the length of the longest increasing subsequence that **ends at index i**. It is 1 plus the best `length[j]` over earlier `j` with `a[j] < a[i]` (or just 1 if there is none). The answer is the maximum over all `i`. With n states and O(n) work each, that is **O(n²)**.

      Notice the idea: the state is defined so the **last element is fixed**. Choosing a state that makes the next decision easy is the creative part of DP, and it improves with practice. (A cleverer O(n log n) method uses binary search on the tails of the best subsequences, but the O(n²) DP is the one to learn first.)

examples:
  - title: Counting the calls
    intro: "Count how often a plain recursion runs, then see the same calculation with a cache."
    code: |
      calls = 0

      def slow(n):
          global calls
          calls += 1
          return n if n < 2 else slow(n - 1) + slow(n - 2)

      cache = {}
      fast_calls = 0

      def fast(n):
          global fast_calls
          fast_calls += 1
          if n not in cache:
              cache[n] = n if n < 2 else fast(n - 1) + fast(n - 2)
          return cache[n]

      print(slow(25), calls)
      print(fast(25), fast_calls)
    output: |
      75025 242785
      75025 49
    lines:
      - line: 5
        note: "Count every call, including repeated ones."
      - line: 16
        note: "About a quarter of a million calls for n = 25: the same small questions asked again and again."
      - line: 17
        note: "With the dictionary cache there are only 49 calls: each n is computed once, and every other call is a cheap lookup."
  - title: Coin change table
    intro: "Greedy gives 3 coins for 6 with coins 1, 3, 4; the table finds 2."
    code: |
      def fewest(coins, amount):
          INF = float("inf")
          best = [0] + [INF] * amount
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a and best[a - c] + 1 < best[a]:
                      best[a] = best[a - c] + 1
          return best

      table = fewest([1, 3, 4], 10)
      print(table)
      print("greedy uses 3 coins for 6 (4+1+1); the table says", table[6])
    output: |
      [0, 1, 2, 1, 1, 2, 2, 2, 2, 3, 3]
      greedy uses 3 coins for 6 (4+1+1); the table says 2
    lines:
      - line: 3
        note: "Zero coins make 0; every other amount starts as 'impossible' (infinity)."
      - line: 4
        note: "Amounts are filled in increasing order, so `best[a - c]` is always already known."
      - line: 6
        note: "Try each coin as the last coin used and keep the cheapest."
      - line: 12
        note: "6 = 3 + 3 needs two coins. Greedy's 4 + 1 + 1 needs three."
  - title: Longest increasing subsequence
    intro: "length[i] is the longest increasing subsequence that ends at position i."
    code: |
      def lis(a):
          length = [1] * len(a)
          for i in range(len(a)):
              for j in range(i):
                  if a[j] < a[i]:
                      length[i] = max(length[i], length[j] + 1)
          return length

      data = [3, 1, 4, 1, 5, 9, 2, 6]
      lengths = lis(data)
      print(lengths)
      print("longest:", max(lengths))
    output: |
      [1, 1, 2, 1, 3, 4, 2, 4]
      longest: 4
    lines:
      - line: 2
        note: "Every element alone is an increasing subsequence of length 1."
      - line: 5
        note: "If the earlier element is smaller, element i can extend the subsequence that ends at j."
      - line: 12
        note: "The best subsequence can end anywhere, so the answer is the maximum entry."

playground:
  prompt: |
    Use `@cache` on a recursive function and time it. Try `n = 35`: first without the decorator (comment it out and expect a wait), then with it. Then change the stairs to allow 1, 2 or 3 steps at a time.
  code: |
    from functools import cache

    @cache
    def ways(n):
        if n < 0:
            return 0
        if n == 0:
            return 1
        return ways(n - 1) + ways(n - 2) + ways(n - 3)

    print([ways(n) for n in range(10)])
    print(ways(60))

exercises:
  - id: stairs-memo
    title: Stairs, memoised and tabulated
    difficulty: 2
    prompt: |
      Write `stairs(n, steps)`: the number of ways to climb `n` stairs where each move is a number of stairs taken from the tuple `steps` (for example `(1, 2)` or `(1, 3, 5)`). The order of moves matters (1+2 and 2+1 are different ways). `stairs(0, steps)` is `1`.

      Write it **twice**: `stairs_memo` using recursion with `functools.cache`, and `stairs_table` using a bottom-up list. Both must work for `n` up to 5000 (so the memo version must avoid hitting the recursion limit: fill the cache by calling `stairs_memo` on increasing values inside a loop first, or by any method you like, as long as `stairs_memo(5000, ...)` returns the right answer).
    starter: |
      from functools import cache


      def stairs_memo(n, steps):
          pass


      def stairs_table(n, steps):
          pass
    tests:
      - name: small
        code: |
          for f in (stairs_memo, stairs_table):
              assert f(0, (1, 2)) == 1
              assert f(1, (1, 2)) == 1
              assert f(4, (1, 2)) == 5
              assert f(10, (1, 2)) == 89
              assert f(5, (1, 3, 5)) == 5
              assert f(3, (2,)) == 0
              assert f(6, (2,)) == 1
      - name: large
        code: |
          a = stairs_table(5000, (1, 2))
          assert a % 1000007 == a % 1000007 and a > 10 ** 1000
          assert stairs_memo(5000, (1, 2)) == a
          assert stairs_table(100, (1, 2, 3)) == 180396380815100901214157639
    hints:
      - "Table: `ways = [1] + [0] * n`; for `i` in `1..n`, add `ways[i - s]` for each step `s <= i`."
      - "Memo: define a helper decorated with `@cache` inside the function, or pass `steps` as a tuple (hashable) to a module-level cached function. To avoid deep recursion, call the helper for `k = 0, 1, 2, ... n` in order: each call then only needs values already cached."
    solution: |
      from functools import cache


      def stairs_memo(n, steps):
          steps = tuple(steps)

          @cache
          def ways(k):
              if k < 0:
                  return 0
              if k == 0:
                  return 1
              return sum(ways(k - s) for s in steps)

          for k in range(n + 1):
              ways(k)
          return ways(n)


      def stairs_table(n, steps):
          ways = [1] + [0] * n
          for i in range(1, n + 1):
              ways[i] = sum(ways[i - s] for s in steps if s <= i)
          return ways[i] if False else ways[n]
    explanation: |
      Both versions fill the same n+1 subproblems. Warming the cache in increasing order means every recursive call is already a lookup, which is exactly the order a table uses: **memoisation and tabulation are two ways to run the same recurrence**.

  - id: coin-change
    title: Coin change, two ways
    difficulty: 3
    prompt: |
      Write:

      - `min_coins(coins, amount)`: the fewest coins needed to make `amount` (unlimited coins of each kind), or `-1` if impossible. `min_coins(coins, 0)` is `0`.
      - `count_ways(coins, amount)`: the number of **combinations** of coins that make `amount` (1+3 and 3+1 count once). `count_ways(coins, 0)` is `1`.
      - `coins_used(coins, amount)`: one list of coins (sorted in decreasing order) that achieves the minimum, or `None` if impossible. Rebuild it by remembering which coin was last used in each cell.
    starter: |
      def min_coins(coins, amount):
          pass


      def count_ways(coins, amount):
          pass


      def coins_used(coins, amount):
          pass
    tests:
      - name: min
        code: |
          assert min_coins([1, 3, 4], 6) == 2
          assert min_coins([1, 5, 10, 25], 63) == 6
          assert min_coins([5, 10], 3) == -1
          assert min_coins([2], 7) == -1
          assert min_coins([7], 0) == 0
          assert min_coins([186, 419, 83, 408], 6249) == 20
      - name: ways
        code: |
          assert count_ways([1, 2, 5], 5) == 4
          assert count_ways([2], 3) == 0
          assert count_ways([10], 10) == 1
          assert count_ways([1, 5, 10, 25, 50], 100) == 292
          assert count_ways([1, 2, 3], 0) == 1
      - name: reconstruction
        code: |
          used = coins_used([1, 3, 4], 6)
          assert used == [3, 3]
          used = coins_used([1, 5, 10, 25], 63)
          assert sum(used) == 63 and len(used) == 6 and used == sorted(used, reverse=True)
          assert coins_used([5, 10], 3) is None
          assert coins_used([2], 0) == []
    hints:
      - "`best = [0] + [inf] * amount`; for each amount and each coin `c <= a`, `best[a] = min(best[a], best[a - c] + 1)`."
      - "`count_ways`: `ways = [1] + [0] * amount`; **outer loop over coins**, inner loop `a` from `coin` to `amount`: `ways[a] += ways[a - coin]`."
      - "For reconstruction keep `last[a]` = the coin that gave the best value; then walk back from `amount` subtracting `last[a]` until 0."
    solution: |
      def _table(coins, amount):
          INF = float("inf")
          best = [0] + [INF] * amount
          last = [None] * (amount + 1)
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a and best[a - c] + 1 < best[a]:
                      best[a] = best[a - c] + 1
                      last[a] = c
          return best, last


      def min_coins(coins, amount):
          best, _ = _table(coins, amount)
          return -1 if best[amount] == float("inf") else best[amount]


      def count_ways(coins, amount):
          ways = [1] + [0] * amount
          for coin in coins:
              for a in range(coin, amount + 1):
                  ways[a] += ways[a - coin]
          return ways[amount]


      def coins_used(coins, amount):
          best, last = _table(coins, amount)
          if best[amount] == float("inf"):
              return None
          used = []
          while amount > 0:
              used.append(last[amount])
              amount -= last[amount]
          return sorted(used, reverse=True)
    explanation: |
      The table gives the **value** of the best solution, and the `last` array lets you recover the solution itself, a pattern you'll use in almost every DP. The coin loop **outside** in `count_ways` counts combinations; with the loops swapped it would count ordered sequences (the stairs problem).

  - id: lis
    title: Longest increasing subsequence
    difficulty: 3
    prompt: |
      Write `lis_length(a)`, the length of the longest **strictly increasing** subsequence of the list `a` (0 for an empty list), using the O(n²) DP from the lesson. Then write `lis_sequence(a)` returning one actual longest subsequence as a list. When several are equally long, return the one that ends at the **earliest** index (the first maximum of the length table), following back-pointers that choose the **first** best predecessor.

      Finally write `longest_bitonic(a)`: the length of the longest subsequence that strictly increases and then strictly decreases (either part may have just one element, so a purely increasing or decreasing subsequence counts). Hint: combine an increasing table with a decreasing table.
    starter: |
      def lis_length(a):
          pass


      def lis_sequence(a):
          pass


      def longest_bitonic(a):
          pass
    tests:
      - name: length
        code: |
          assert lis_length([]) == 0
          assert lis_length([5]) == 1
          assert lis_length([3, 1, 4, 1, 5, 9, 2, 6]) == 4
          assert lis_length([5, 4, 3, 2, 1]) == 1
          assert lis_length([1, 2, 3, 4]) == 4
          assert lis_length([2, 2, 2]) == 1
          assert lis_length([10, 9, 2, 5, 3, 7, 101, 18]) == 4
      - name: sequence
        code: |
          assert lis_sequence([]) == []
          assert lis_sequence([3, 1, 4, 1, 5, 9, 2, 6]) == [3, 4, 5, 9]
          assert lis_sequence([5, 4, 3]) == [5]
          import random
          rng = random.Random(4)
          for _ in range(100):
              a = [rng.randint(0, 20) for _ in range(rng.randint(0, 15))]
              s = lis_sequence(a)
              assert len(s) == lis_length(a)
              assert all(x < y for x, y in zip(s, s[1:]))
              it = iter(a)
              assert all(x in it for x in s)
      - name: bitonic
        code: |
          assert longest_bitonic([]) == 0
          assert longest_bitonic([1, 2, 3, 2, 1]) == 5
          assert longest_bitonic([1, 11, 2, 10, 4, 5, 2, 1]) == 6
          assert longest_bitonic([5, 4, 3]) == 3
          assert longest_bitonic([1, 2, 3]) == 3
          assert longest_bitonic([4, 4, 4]) == 1
    hints:
      - "`length[i] = 1 + max(length[j] for j < i if a[j] < a[i])`, with 1 if no such j."
      - "Keep `prev[i]` = the first j that gives the best value (or None). Start from the first index with maximal length and follow `prev` back, then reverse."
      - "Bitonic: `inc[i]` = longest increasing subsequence ending at i; `dec[i]` = longest decreasing subsequence **starting** at i (compute from the right). The answer is `max(inc[i] + dec[i] - 1)`."
    solution: |
      def _inc(a):
          length = [1] * len(a)
          prev = [None] * len(a)
          for i in range(len(a)):
              for j in range(i):
                  if a[j] < a[i] and length[j] + 1 > length[i]:
                      length[i] = length[j] + 1
                      prev[i] = j
          return length, prev


      def lis_length(a):
          return max(_inc(a)[0], default=0)


      def lis_sequence(a):
          if not a:
              return []
          length, prev = _inc(a)
          i = length.index(max(length))
          out = []
          while i is not None:
              out.append(a[i])
              i = prev[i]
          return out[::-1]


      def longest_bitonic(a):
          if not a:
              return 0
          inc, _ = _inc(a)
          dec_rev, _ = _inc(a[::-1])
          dec = dec_rev[::-1]
          return max(i + d - 1 for i, d in zip(inc, dec))
    explanation: |
      Fixing the last element in the state is what makes each step simple. The bitonic problem reuses the same table twice, once from each side, a common trick: combine two simple DPs rather than inventing one complicated one. Reversing the list turns "decreasing from here" into "increasing ending here".

  - id: grid-paths
    title: Counting grid paths
    difficulty: 3
    prompt: |
      A robot stands in the top-left corner of a grid given as a list of strings, where `.` is free and `#` is a wall. It can only move **right** or **down**. Write `paths(grid)` returning the number of different routes to the bottom-right corner (0 if the start or end is a wall, or no route exists). Write `cheapest(costs)`: for a rectangular grid of non-negative numbers, the smallest sum along a right/down route from the top-left to the bottom-right, **including** both corners.
    starter: |
      def paths(grid):
          pass


      def cheapest(costs):
          pass
    tests:
      - name: paths
        code: |
          assert paths(["..", ".."]) == 2
          assert paths(["...", "...", "..."]) == 6
          assert paths(["...", ".#.", "..."]) == 2
          assert paths(["#.", ".."]) == 0
          assert paths([".#", "#."]) == 0
          assert paths(["."]) == 1
          assert paths(["." * 18] * 18) == 2333606220
      - name: cheapest
        code: |
          assert cheapest([[1, 3, 1], [1, 5, 1], [4, 2, 1]]) == 7
          assert cheapest([[5]]) == 5
          assert cheapest([[1, 2, 3]]) == 6
          assert cheapest([[1], [2], [3]]) == 6
          big = [[(i * 7 + j * 3) % 10 for j in range(200)] for i in range(200)]
          assert cheapest(big) > 0
    hints:
      - "State: `ways[r][c]` = number of routes to cell (r, c). It equals `ways[r-1][c] + ways[r][c-1]` for a free cell, and 0 for a wall."
      - "Fill row by row. Treat the missing neighbour on the edges as 0, and set `ways[0][0] = 1` if the start is free."
      - "`cheapest[r][c] = costs[r][c] + min(cheapest[r-1][c], cheapest[r][c-1])` where a missing neighbour is ignored."
    solution: |
      def paths(grid):
          rows, cols = len(grid), len(grid[0])
          if grid[0][0] == "#" or grid[-1][-1] == "#":
              return 0
          ways = [[0] * cols for _ in range(rows)]
          for r in range(rows):
              for c in range(cols):
                  if grid[r][c] == "#":
                      continue
                  if r == 0 and c == 0:
                      ways[r][c] = 1
                      continue
                  up = ways[r - 1][c] if r else 0
                  left = ways[r][c - 1] if c else 0
                  ways[r][c] = up + left
          return ways[-1][-1]


      def cheapest(costs):
          rows, cols = len(costs), len(costs[0])
          best = [[0] * cols for _ in range(rows)]
          for r in range(rows):
              for c in range(cols):
                  options = []
                  if r:
                      options.append(best[r - 1][c])
                  if c:
                      options.append(best[r][c - 1])
                  best[r][c] = costs[r][c] + (min(options) if options else 0)
          return best[-1][-1]
    explanation: |
      Two-dimensional states are just as simple: the table has one cell per subproblem, filled in an order where up and left are already known. Both run in O(rows × columns). The total of 2,333,606,220 for an 18 × 18 grid is the central binomial coefficient C(34, 17), the answer you'd get from counting arrangements of 17 rights and 17 downs.

commonMistakes:
  - title: Memoising something that has no overlap
    explanation: |
      A cache only helps when the same arguments recur. Merge sort's halves never repeat, so caching them just wastes memory.
  - title: A state that is missing information
    explanation: |
      If the recurrence needs something your state does not record (for example, which coin was used last), the table gives wrong answers. Ask "what must I know to continue from here?" and put exactly that in the state.
  - title: Filling the table in the wrong order
    explanation: |
      A cell must be computed after the cells it depends on. In coin change the amounts increase; in grids it is row by row.
  - title: Counting sequences instead of combinations
    explanation: |
      For "number of ways" with coins, the coin loop must be the outer loop. With the amount loop outside, 1+3 and 3+1 are counted separately.
  - title: Unhashable arguments with a cache
    explanation: |
      `functools.cache` cannot key on a list. Convert to a tuple or use indexes instead.

summary:
  - "**Dynamic programming** solves each *distinct* subproblem once and reuses the answer. It applies when there is **optimal substructure** and **overlapping subproblems**."
  - "**Memoisation** adds a cache to a recursion (`@cache`). **Tabulation** fills a table bottom-up in an order that respects dependencies."
  - "Design recipe: define the **state**, write the **recurrence** and base cases, choose the order, read the answer, and count states × work per state."
  - "Fewest-coins DP is correct for **any** coin system, unlike greedy. For counting combinations, loop over coins on the outside."
  - "Longest increasing subsequence uses the state 'best subsequence ending at i' and takes O(n²) time."
  - "Store a back-pointer next to each value to **reconstruct** the solution, not just its value."
next: |
  So far each state has had one or two numbers. Lesson 8.7 moves to **two-sequence problems**: **edit distance**, **longest common subsequence**, and the **0/1 knapsack** that greedy could not solve. You will also see how to save memory by keeping only the rows you need.

quiz:
  - type: mcq
    question: Why is the plain recursive Fibonacci so slow?
    options:
      - "It solves the same subproblems over and over, so the number of calls grows exponentially"
      - "Python is slow at recursion"
      - "It sorts the numbers"
      - "It uses too much memory for the table"
    answer: 0
    explanation: "There are only n + 1 distinct subproblems, but the recursion tree has exponentially many nodes because of repetition."
  - type: mcq
    question: What is the difference between memoisation and tabulation?
    options:
      - "Memoisation is top-down recursion with a cache; tabulation fills a table bottom-up"
      - "Memoisation is faster and always better"
      - "Tabulation uses recursion and memoisation does not"
