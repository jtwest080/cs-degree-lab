  - type: code
    question: |
      Write `lcs_len(a, b)` returning the length of the longest common subsequence of two strings.
    starter: |
      def lcs_len(a, b):
          pass
    tests:
      - name: values
        code: |
          assert lcs_len("ABCBDAB", "BDCABA") == 4
          assert lcs_len("", "x") == 0
          assert lcs_len("abc", "abc") == 3
    solution: |
      def lcs_len(a, b):
          L = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
          for i in range(1, len(a) + 1):
              for j in range(1, len(b) + 1):
                  if a[i - 1] == b[j - 1]:
                      L[i][j] = L[i - 1][j - 1] + 1
                  else:
                      L[i][j] = max(L[i - 1][j], L[i][j - 1])
          return L[-1][-1]
