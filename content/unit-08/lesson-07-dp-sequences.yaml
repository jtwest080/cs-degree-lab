id: u8-dp-sequences
title: "Dynamic Programming II: Sequences and Knapsack"
minutes: 60
objective: |
  Apply dynamic programming to problems with **two sequences or two limits**: the **longest common subsequence**, **edit distance** and the **0/1 knapsack**. Rebuild the actual answer from the table, and save memory by keeping only the rows you need.
outcomes:
  - Define a two-index state and fill a two-dimensional table in a valid order
  - Solve longest common subsequence and edit distance, and explain each cell's three or four options
  - Solve 0/1 knapsack and explain why its running time is pseudo-polynomial
  - Trace back through a table to recover the actual subsequence, edit script or chosen items
  - Reduce memory by keeping a single row or two
  - Use the subset-sum idea to answer yes or no questions with a table of booleans

sections:
  - heading: Two sequences, two indexes
    body: |
      Lesson 8.6 used one number as the state. Many problems involve **two sequences**, such as two strings, and the natural state has **two indexes**: `(i, j)` stands for "the problem on the first i items of one sequence and the first j items of the other". The table is two-dimensional, filled row by row, and the answer is usually the bottom-right cell.

      The same four steps apply: **state, recurrence, order, answer**. The recurrence usually looks at the **last** item of each prefix and asks "how do these two items relate?".

  - heading: Longest common subsequence
    body: |
      A **common subsequence** of two strings is a sequence that appears (in order, not necessarily next to each other) in both. For `"ABCBDAB"` and `"BDCABA"` the longest common subsequence (**LCS**) has length 4, for example `"BCBA"`. It's the idea behind `diff`, which finds the unchanged lines between two versions of a file.

      **State:** `L[i][j]` = the length of the LCS of the first `i` characters of `a` and the first `j` characters of `b`.

      - If the last characters `a[i-1]` and `b[j-1]` are **equal**, they can be matched: `L[i][j] = L[i-1][j-1] + 1`.
      - If they differ, at least one of them isn't in the LCS: `L[i][j] = max(L[i-1][j], L[i][j-1])`.
      - Base case: `L[0][j] = L[i][0] = 0` (an empty string has nothing in common with anything).

      The table has `(m+1)(n+1)` cells with O(1) work each, so the time is **O(mn)**.

      **Recovering the subsequence.** Start at the bottom-right. If the characters match, include one and move diagonally up-left; otherwise move toward the neighbour with the larger value (up or left). Reverse what you collected at the end.

  - heading: Edit distance
    body: |
      The **edit distance** (Levenshtein distance) between two strings is the fewest single-character **insertions, deletions and substitutions** that turn one into the other. It's used in spell checkers, DNA comparison and fuzzy search. `"kitten"` becomes `"sitting"` in 3 edits: substitute `k→s`, substitute `e→i`, insert `g`.

      **State:** `D[i][j]` = the edit distance between the first `i` characters of `a` and the first `j` characters of `b`.

      - Base: `D[i][0] = i` (delete everything) and `D[0][j] = j` (insert everything).
      - If `a[i-1] == b[j-1]`: no edit is needed for the last characters, `D[i][j] = D[i-1][j-1]`.
      - Otherwise take the cheapest of three options, each costing one edit:
        - **delete** `a[i-1]`: `D[i-1][j] + 1`
        - **insert** `b[j-1]`: `D[i][j-1] + 1`
        - **substitute**: `D[i-1][j-1] + 1`

      Again O(mn) time. To list the edits, trace back from `D[m][n]`, at each step choosing a neighbour that explains the value.

  - heading: 0/1 knapsack
    body: |
      Now the problem that greedy couldn't solve (Lesson 8.5). Items have an integer **weight** and a **value**, and the bag holds weight `W`. Each item is taken whole or not at all.

      **State:** `best[i][w]` = the greatest value using only the first `i` items with capacity `w`.

      For item `i` (weight `wt`, value `v`) there are two choices:

      - **skip** it: `best[i-1][w]`
      - **take** it (only if `wt <= w`): `best[i-1][w - wt] + v`

      and `best[i][w]` is the larger. The base row is all zeros. The table has `n × W` cells, so the time is **O(nW)**.

      That looks polynomial, but it's only **pseudo-polynomial**: the running time depends on the *number* W, and W can be huge. Doubling the number of digits in W squares the table size. In terms of the **size of the input in bits**, O(nW) is exponential. (In fact 0/1 knapsack is NP-complete, which you'll meet in Unit 9, so no truly polynomial algorithm is known.)

      **Saving memory.** Row `i` depends only on row `i-1`, so you can keep a single array and update `w` from **high to low** (so you don't use item `i` twice): `best[w] = max(best[w], best[w - wt] + v)`. That uses O(W) memory instead of O(nW), but then you can't trace back which items were chosen, unless you keep the full table.

  - heading: Subset sum and other yes or no versions
    body: |
      **Subset sum** asks: can some of these numbers be added to give exactly `target`? It is knapsack with only booleans. `can[s]` is `True` if some subset sums to `s`. Start with `can[0] = True`; for each number `x`, update `s` from high to low: `can[s] = can[s] or can[s - x]`. Time O(n × target), again pseudo-polynomial.

      A famous application is **partition**: can a list of numbers be split into two groups of equal total? That is subset sum with target `total / 2` (and the total must be even).

      Spot the pattern across the whole of the lesson: the state is a **prefix** of each input (or a prefix plus a numeric budget); the recurrence looks at the **last decision**; the table is filled in increasing order; and the cell you want is the corner. When you meet a new optimisation problem, ask "what small description of a subproblem would let the last decision be made?"

examples:
  - title: Longest common subsequence
    intro: "Fill the table, then walk back from the corner to recover a longest common subsequence."
    code: |
      def lcs(a, b):
          m, n = len(a), len(b)
          L = [[0] * (n + 1) for _ in range(m + 1)]
          for i in range(1, m + 1):
              for j in range(1, n + 1):
                  if a[i - 1] == b[j - 1]:
                      L[i][j] = L[i - 1][j - 1] + 1
                  else:
                      L[i][j] = max(L[i - 1][j], L[i][j - 1])
          out, i, j = [], m, n
          while i > 0 and j > 0:
              if a[i - 1] == b[j - 1]:
                  out.append(a[i - 1])
                  i -= 1
                  j -= 1
              elif L[i - 1][j] >= L[i][j - 1]:
                  i -= 1
              else:
                  j -= 1
          return L[m][n], "".join(reversed(out))

      print(lcs("ABCBDAB", "BDCABA"))
      print(lcs("dynamic", "programming"))
    output: |
      (4, 'BCBA')
      (3, 'ami')
    lines:
      - line: 3
        note: "One extra row and column of zeros for the empty prefixes."
      - line: 6
        note: "Matching last characters extend the best answer for both shorter prefixes."
      - line: 8
        note: "Otherwise drop the last character of one string or the other and keep the better result."
      - line: 10
        note: "The traceback starts at the corner and walks back through the decisions."
      - line: 12
        note: "On a match, keep the character and step diagonally."
  - title: Edit distance
    intro: "Three options for each pair of prefixes: delete, insert or substitute."
    code: |
      def edit_distance(a, b):
          m, n = len(a), len(b)
          D = [[0] * (n + 1) for _ in range(m + 1)]
          for i in range(m + 1):
              D[i][0] = i
          for j in range(n + 1):
              D[0][j] = j
          for i in range(1, m + 1):
              for j in range(1, n + 1):
                  if a[i - 1] == b[j - 1]:
                      D[i][j] = D[i - 1][j - 1]
                  else:
                      D[i][j] = 1 + min(D[i - 1][j], D[i][j - 1], D[i - 1][j - 1])
          return D

      D = edit_distance("kitten", "sitting")
      for row in D:
          print(row)
      print("edit distance:", D[-1][-1])
    output: |
      [0, 1, 2, 3, 4, 5, 6, 7]
      [1, 1, 2, 3, 4, 5, 6, 7]
      [2, 2, 1, 2, 3, 4, 5, 6]
      [3, 3, 2, 1, 2, 3, 4, 5]
      [4, 4, 3, 2, 1, 2, 3, 4]
      [5, 5, 4, 3, 2, 2, 3, 4]
      [6, 6, 5, 4, 3, 3, 2, 3]
      edit distance: 3
    lines:
      - line: 4
        note: "Turning the first i letters into nothing takes i deletions."
      - line: 6
        note: "Turning nothing into the first j letters takes j insertions."
      - line: 10
        note: "Matching letters cost nothing."
      - line: 12
        note: "Otherwise one edit plus the cheapest of delete, insert or substitute."
      - line: 19
        note: "The bottom-right cell is the answer: 3 edits."
  - title: 0/1 knapsack with one row
    intro: "Update the capacities from high to low so that each item is used at most once."
    code: |
      def knapsack(items, capacity):
          best = [0] * (capacity + 1)
          for weight, value in items:
              for w in range(capacity, weight - 1, -1):
                  best[w] = max(best[w], best[w - weight] + value)
          return best

      items = [(10, 60), (20, 100), (30, 120)]
      table = knapsack(items, 50)
      print(table[50], "(greedy by ratio finds only 160)")
      print(table[10:51:10])
    output: |
      220 (greedy by ratio finds only 160)
      [60, 100, 160, 180, 220]
    lines:
      - line: 4
        note: "Going downward means best[w - weight] still holds the value from before this item, so the item is counted once."
      - line: 5
        note: "Skip the item (keep best[w]) or take it (value plus the best for the remaining room)."
      - line: 10
        note: "The two heavier items fill exactly 50 and are worth 220, which greedy missed."

playground:
  prompt: |
    Compute the edit distance between two words you choose, such as "intention" and "execution", using the function from the example. Then try swapping the loop direction in the knapsack (low to high) and see how the answer becomes wrong: items get used more than once.
  code: |
    def edit_distance(a, b):
        prev = list(range(len(b) + 1))
        for i in range(1, len(a) + 1):
            cur = [i] + [0] * len(b)
            for j in range(1, len(b) + 1):
                if a[i - 1] == b[j - 1]:
                    cur[j] = prev[j - 1]
                else:
                    cur[j] = 1 + min(prev[j], cur[j - 1], prev[j - 1])
            prev = cur
        return prev[-1]

    print(edit_distance("intention", "execution"))

exercises:
  - id: lcs
    title: LCS and diff
    difficulty: 3
    prompt: |
      Write:

      - `lcs_length(a, b)`: the length of the longest common subsequence of two strings, using **two rows of memory** only (the previous row and the current one).
      - `lcs_string(a, b)`: one longest common subsequence, found by tracing back through a full table. When there is a choice during the traceback, move **up** (`i -= 1`) if `L[i-1][j] >= L[i][j-1]`, otherwise left.
      - `diff(a, b)`: given two lists of lines, return a list of `(tag, line)` pairs showing how to get from `a` to `b`, where `tag` is `" "` for a line in the LCS, `"-"` for a line only in `a` and `"+"` for a line only in `b`. Process the lines in order, using the same traceback rule; when you reach the top or left edge, emit the remaining `-` lines (or `+` lines).
    starter: |
      def lcs_length(a, b):
          pass


      def lcs_string(a, b):
          pass


      def diff(a, b):
          pass
    tests:
      - name: length
        code: |
          assert lcs_length("ABCBDAB", "BDCABA") == 4
          assert lcs_length("", "abc") == 0
          assert lcs_length("abc", "abc") == 3
          assert lcs_length("abc", "xyz") == 0
          assert lcs_length("dynamic", "programming") == 3
          assert lcs_length("a" * 1500, "a" * 1500) == 1500
      - name: string
        code: |
          assert lcs_string("ABCBDAB", "BDCABA") == "BCBA"
          assert lcs_string("", "x") == ""
          import random
          rng = random.Random(9)
          for _ in range(100):
              a = "".join(rng.choice("abc") for _ in range(rng.randint(0, 12)))
              b = "".join(rng.choice("abc") for _ in range(rng.randint(0, 12)))
              s = lcs_string(a, b)
              assert len(s) == lcs_length(a, b)
              for t in (a, b):
                  it = iter(t)
                  assert all(ch in it for ch in s)
      - name: diff
        code: |
          old = ["a", "b", "c", "d"]
          new = ["a", "c", "d", "e"]
          result = diff(old, new)
          assert result == [(" ", "a"), ("-", "b"), (" ", "c"), (" ", "d"), ("+", "e")]
          assert diff([], ["x"]) == [("+", "x")]
          assert diff(["x"], []) == [("-", "x")]
          assert diff(["same"], ["same"]) == [(" ", "same")]
          assert [l for t, l in diff(old, new) if t != "+"] == old
          assert [l for t, l in diff(old, new) if t != "-"] == new
    hints:
      - "Two rows: `prev = [0] * (n + 1)`; for each character of `a`, build `cur` using `prev[j-1]`, `prev[j]` and `cur[j-1]`; then `prev = cur`."
      - "For `lcs_string` build the whole table (as in the lesson) and trace back, collecting characters in a list; reverse it at the end."
      - "For `diff`, trace back from `(m, n)` and collect tuples; the order is reversed at the end. On a match emit `(' ', line)`. If `L[i-1][j] >= L[i][j-1]` (and `i > 0`), emit `('-', a[i-1])` and `i -= 1`; otherwise emit `('+', b[j-1])` and `j -= 1`. Keep going until `i` and `j` are both 0, handling the edges."
    solution: |
      def _table(a, b):
          m, n = len(a), len(b)
          L = [[0] * (n + 1) for _ in range(m + 1)]
          for i in range(1, m + 1):
              for j in range(1, n + 1):
                  if a[i - 1] == b[j - 1]:
                      L[i][j] = L[i - 1][j - 1] + 1
                  else:
                      L[i][j] = max(L[i - 1][j], L[i][j - 1])
          return L


      def lcs_length(a, b):
          prev = [0] * (len(b) + 1)
          for x in a:
              cur = [0] * (len(b) + 1)
              for j, y in enumerate(b, 1):
                  if x == y:
                      cur[j] = prev[j - 1] + 1
                  else:
                      cur[j] = max(prev[j], cur[j - 1])
              prev = cur
          return prev[-1]


      def lcs_string(a, b):
          L = _table(a, b)
          out, i, j = [], len(a), len(b)
          while i > 0 and j > 0:
              if a[i - 1] == b[j - 1]:
                  out.append(a[i - 1])
                  i -= 1
                  j -= 1
              elif L[i - 1][j] >= L[i][j - 1]:
                  i -= 1
              else:
                  j -= 1
          return "".join(reversed(out))


      def diff(a, b):
          L = _table(a, b)
          out, i, j = [], len(a), len(b)
          while i > 0 or j > 0:
              if i > 0 and j > 0 and a[i - 1] == b[j - 1]:
                  out.append((" ", a[i - 1]))
                  i -= 1
                  j -= 1
              elif i > 0 and (j == 0 or L[i - 1][j] >= L[i][j - 1]):
                  out.append(("-", a[i - 1]))
                  i -= 1
              else:
                  out.append(("+", b[j - 1]))
                  j -= 1
          return out[::-1]
    explanation: |
      Keeping only two rows brings the memory from O(mn) to O(n) when you only need the length, but a traceback needs the whole table. `diff` is the same algorithm that tools like `git diff` are based on: the lines in the LCS are unchanged, and everything else is a removal or an addition.

  - id: edit
    title: Edit distance with an edit script
    difficulty: 4
    prompt: |
      Write:

      - `edit_distance(a, b)`: the Levenshtein distance between two strings.
      - `edit_script(a, b)`: a list of operations that turns `a` into `b`, each a tuple: `("keep", ch)`, `("delete", ch)`, `("insert", ch)` or `("replace", old, new)`. The number of operations that aren't `keep` must equal the distance. Trace back from the bottom-right; when more than one move is possible prefer them in this order: match/keep, then replace, then delete, then insert.
      - `apply_script(a, script)`: return the string you get by applying the script to `a` (use it to check yourself: `apply_script(a, edit_script(a, b)) == b`).
      - `closest(word, dictionary)`: the dictionary word with the smallest edit distance to `word`; ties go to the alphabetically first.
    starter: |
      def edit_distance(a, b):
          pass


      def edit_script(a, b):
          pass


      def apply_script(a, script):
          pass


      def closest(word, dictionary):
          pass
    tests:
      - name: distance
        code: |
          assert edit_distance("kitten", "sitting") == 3
          assert edit_distance("", "abc") == 3
          assert edit_distance("abc", "") == 3
          assert edit_distance("same", "same") == 0
          assert edit_distance("intention", "execution") == 5
          assert edit_distance("flaw", "lawn") == 2
      - name: script
        code: |
          import random
          for a, b in [("kitten", "sitting"), ("", "ab"), ("ab", ""), ("abc", "abc"), ("sunday", "saturday")]:
              script = edit_script(a, b)
              assert apply_script(a, script) == b
              assert sum(1 for op in script if op[0] != "keep") == edit_distance(a, b)
          assert edit_script("ab", "ab") == [("keep", "a"), ("keep", "b")]
          assert edit_script("cat", "cut") == [("keep", "c"), ("replace", "a", "u"), ("keep", "t")]
          rng = random.Random(12)
          for _ in range(100):
              a = "".join(rng.choice("abcd") for _ in range(rng.randint(0, 8)))
              b = "".join(rng.choice("abcd") for _ in range(rng.randint(0, 8)))
              s = edit_script(a, b)
              assert apply_script(a, s) == b
              assert sum(1 for op in s if op[0] != "keep") == edit_distance(a, b)
      - name: closest
        code: |
          words = ["apple", "apply", "ample", "angle", "maple"]
          assert closest("appel", words) == "apple"
          assert closest("ample", words) == "ample"
          assert closest("xyz", ["ab", "cd"]) == "ab"
    hints:
      - "Fill the full table `D` as in the lesson; `edit_distance` is `D[m][n]`."
      - "Traceback at `(i, j)`: if `a[i-1] == b[j-1]` and `D[i][j] == D[i-1][j-1]`, emit keep. Else if `D[i][j] == D[i-1][j-1] + 1` (and i, j > 0) emit replace. Else if `i > 0` and `D[i][j] == D[i-1][j] + 1` emit delete. Else emit insert. Collect and reverse."
      - "`apply_script`: for keep and insert, append the character; for replace append the new one; delete adds nothing."
      - "`closest`: `min(sorted(dictionary), key=lambda w: edit_distance(word, w))` (min returns the first minimum, so sorting handles ties)."
    solution: |
      def _table(a, b):
          m, n = len(a), len(b)
          D = [[0] * (n + 1) for _ in range(m + 1)]
          for i in range(m + 1):
              D[i][0] = i
          for j in range(n + 1):
              D[0][j] = j
          for i in range(1, m + 1):
              for j in range(1, n + 1):
                  if a[i - 1] == b[j - 1]:
                      D[i][j] = D[i - 1][j - 1]
                  else:
                      D[i][j] = 1 + min(D[i - 1][j], D[i][j - 1], D[i - 1][j - 1])
          return D


      def edit_distance(a, b):
          return _table(a, b)[len(a)][len(b)]


      def edit_script(a, b):
          D = _table(a, b)
          i, j = len(a), len(b)
          ops = []
          while i > 0 or j > 0:
              if i > 0 and j > 0 and a[i - 1] == b[j - 1] and D[i][j] == D[i - 1][j - 1]:
                  ops.append(("keep", a[i - 1]))
                  i -= 1
                  j -= 1
              elif i > 0 and j > 0 and D[i][j] == D[i - 1][j - 1] + 1:
                  ops.append(("replace", a[i - 1], b[j - 1]))
                  i -= 1
                  j -= 1
              elif i > 0 and D[i][j] == D[i - 1][j] + 1:
                  ops.append(("delete", a[i - 1]))
                  i -= 1
              else:
                  ops.append(("insert", b[j - 1]))
                  j -= 1
          return ops[::-1]


      def apply_script(a, script):
          out = []
          for op in script:
              if op[0] in ("keep", "insert"):
                  out.append(op[1])
              elif op[0] == "replace":
                  out.append(op[2])
          return "".join(out)


      def closest(word, dictionary):
          return min(sorted(dictionary), key=lambda w: edit_distance(word, w))
    explanation: |
      Each cell's value comes from one of its neighbours plus a cost, so retracing which neighbour explains the value recovers the edits. The check `apply_script(a, script) == b` plus the count of non-keep operations equalling the distance is a complete test that the script is correct and optimal.

  - id: knapsack
    title: Knapsack and subset sum
    difficulty: 4
    prompt: |
      Write:

      - `knapsack(items, capacity)`: items are `(weight, value)` pairs with positive integer weights; return `(best_value, chosen)` where `chosen` is a sorted list of the **indexes** of the chosen items. Use the full two-dimensional table so you can trace back. In the traceback, an item `i` is chosen when `best[i][w] != best[i-1][w]`.
      - `subset_sum(numbers, target)`: `True` if some subset (possibly empty if target is 0) adds to `target`, using a one-dimensional list of booleans.
      - `can_partition(numbers)`: `True` if the list can be split into two parts with equal sums.
    starter: |
      def knapsack(items, capacity):
          pass


      def subset_sum(numbers, target):
          pass


      def can_partition(numbers):
          pass
    tests:
      - name: knapsack
        code: |
          items = [(10, 60), (20, 100), (30, 120)]
          assert knapsack(items, 50) == (220, [1, 2])
          assert knapsack(items, 5) == (0, [])
          assert knapsack([], 10) == (0, [])
          assert knapsack(items, 100) == (280, [0, 1, 2])
      - name: matches brute force
        code: |
          import itertools, random
          rng = random.Random(10)
          for _ in range(100):
              items = [(rng.randint(1, 8), rng.randint(1, 30)) for _ in range(rng.randint(0, 8))]
              cap = rng.randint(0, 25)
              best = max(sum(items[i][1] for i in c)
                         for r in range(len(items) + 1) for c in itertools.combinations(range(len(items)), r)
                         if sum(items[i][0] for i in c) <= cap)
              value, chosen = knapsack(items, cap)
              assert value == best
              assert sum(items[i][1] for i in chosen) == value
              assert sum(items[i][0] for i in chosen) <= cap
              assert chosen == sorted(set(chosen))
      - name: subset sum
        code: |
          assert subset_sum([3, 34, 4, 12, 5, 2], 9) is True
          assert subset_sum([3, 34, 4, 12, 5, 2], 30) is False
          assert subset_sum([], 0) is True
          assert subset_sum([5], 0) is True
          assert subset_sum([5], 5) is True
          assert subset_sum([1, 2, 5], 4) is False
          assert can_partition([1, 5, 11, 5]) is True
          assert can_partition([1, 2, 3, 5]) is False
          assert can_partition([]) is True
          assert can_partition([7]) is False
    hints:
      - "`best = [[0] * (capacity + 1) for _ in range(n + 1)]`. For item `i` (1-based) with `(wt, v)`: `best[i][w] = best[i-1][w]`, and if `wt <= w` try `best[i-1][w - wt] + v`."
      - "Traceback: start at `w = capacity`, `i = n` down to 1. If `best[i][w] != best[i-1][w]`, item `i-1` was taken: record it and subtract its weight from `w`."
      - "`subset_sum`: `can = [True] + [False] * target`; for each number `x`, loop `s` from `target` down to `x` and set `can[s] = can[s] or can[s - x]`."
      - "`can_partition`: if the total is odd return False; otherwise `subset_sum(numbers, total // 2)`."
    solution: |
      def knapsack(items, capacity):
          n = len(items)
          best = [[0] * (capacity + 1) for _ in range(n + 1)]
          for i in range(1, n + 1):
              weight, value = items[i - 1]
              for w in range(capacity + 1):
                  best[i][w] = best[i - 1][w]
                  if weight <= w:
                      best[i][w] = max(best[i][w], best[i - 1][w - weight] + value)
          chosen, w = [], capacity
          for i in range(n, 0, -1):
              if best[i][w] != best[i - 1][w]:
                  chosen.append(i - 1)
                  w -= items[i - 1][0]
          return best[n][capacity], sorted(chosen)


      def subset_sum(numbers, target):
          can = [True] + [False] * target
          for x in numbers:
              for s in range(target, x - 1, -1):
                  if can[s - x]:
                      can[s] = True
          return can[target]


      def can_partition(numbers):
          total = sum(numbers)
          return total % 2 == 0 and subset_sum(numbers, total // 2)
    explanation: |
      The brute-force comparison confirms that DP finds the true optimum where greedy could not. The table is `n × capacity`, which is why this is called pseudo-polynomial: with capacity 10^18 the table would not fit in the universe. Subset sum is the same table with true/false in place of numbers, and partition reduces to it by asking for half the total.

  - id: word-break
    title: Word break
    difficulty: 3
    prompt: |
      Given a string `text` without spaces and a set of words `words`, write:

      - `can_break(text, words)`: `True` if `text` can be written as one or more words from the set, side by side (words may be reused). The empty string counts as `True`.
      - `count_breaks(text, words)`: the number of different ways to do it.
      - `one_break(text, words)`: one valid list of words that joins to `text` (prefer the **shortest first word** at each position), or `None` if impossible.

      State: `ok[i]` is about the first `i` characters of the text. A word ending at position `i` and starting at `j` is usable when `text[j:i]` is in the set and `ok[j]`.
    starter: |
      def can_break(text, words):
          pass


      def count_breaks(text, words):
          pass


      def one_break(text, words):
          pass
    tests:
      - name: can
        code: |
          words = {"apple", "pen", "applepen", "pine", "pineapple"}
          assert can_break("applepenapple", words) is True
          assert can_break("pineapplepenapple", words) is True
          assert can_break("catsandog", {"cats", "dog", "sand", "and", "cat"}) is False
          assert can_break("", words) is True
          assert can_break("aaaaaaaaaaaaaaaaaaaaaaaaaaaaab", {"a", "aa", "aaa"}) is False
      - name: count
        code: |
          assert count_breaks("catsanddog", {"cat", "cats", "and", "sand", "dog"}) == 2
          assert count_breaks("aaaa", {"a", "aa"}) == 5
          assert count_breaks("abc", {"x"}) == 0
          assert count_breaks("", {"a"}) == 1
      - name: one
        code: |
          words = {"cat", "cats", "and", "sand", "dog"}
          result = one_break("catsanddog", words)
          assert "".join(result) == "catsanddog" and all(w in words for w in result)
          assert result == ["cat", "sand", "dog"]
          assert one_break("catsandog", words) is None
          assert one_break("", words) == []
    hints:
      - "`ok = [True] + [False] * n`. For `i` in `1..n`, for `j` in `0..i-1`: if `ok[j]` and `text[j:i] in words`, then `ok[i] = True`."
      - "Counting: `ways[0] = 1`; `ways[i] += ways[j]` for every valid `j`."
      - "`one_break`: store `prev[i] = j` the first time `ok[i]` becomes true (iterate j upward), then walk back from `n`. The shortest-first-word preference comes from reconstructing with a forward table instead: let `ok[i]` mean 'text[i:] can be broken' computed from the right, and choose the smallest `j` at each step."
    solution: |
      def can_break(text, words):
          n = len(text)
          ok = [True] + [False] * n
          for i in range(1, n + 1):
              for j in range(i):
                  if ok[j] and text[j:i] in words:
                      ok[i] = True
                      break
          return ok[n]


      def count_breaks(text, words):
          n = len(text)
          ways = [1] + [0] * n
          for i in range(1, n + 1):
              for j in range(i):
                  if ways[j] and text[j:i] in words:
                      ways[i] += ways[j]
          return ways[n]


      def one_break(text, words):
          n = len(text)
          ok = [False] * n + [True]
          for i in range(n - 1, -1, -1):
              for j in range(i + 1, n + 1):
                  if ok[j] and text[i:j] in words:
                      ok[i] = True
                      break
          if not ok[0]:
              return None
          out, i = [], 0
          while i < n:
              for j in range(i + 1, n + 1):
                  if ok[j] and text[i:j] in words:
                      out.append(text[i:j])
                      i = j
                      break
          return out
    explanation: |
      There are n + 1 states, each trying up to n split points, so the time is O(n²) (times the cost of slicing). Without the table the long string of a's would take exponential time to fail; with it the answer is instant. Counting is the same recurrence with `+` in place of `or`, a very common change.

commonMistakes:
  - title: Updating the knapsack row from low to high
    explanation: |
      With one row, going upward lets an item be used again in the same pass (it becomes an **unbounded** knapsack). Go from high weights to low for 0/1 knapsack.
  - title: Off-by-one between table indexes and string indexes
    explanation: |
      Row `i` of the table is about the first `i` characters, so its last character is `a[i - 1]`. Mixing these up is the most common bug in LCS and edit distance.
  - title: Forgetting the base row and column
    explanation: |
      In edit distance `D[i][0] = i` and `D[0][j] = j`. Leaving them as 0 makes inserting and deleting free.
  - title: Saving memory and losing the traceback
    explanation: |
      Two rows give the *value*; recovering the solution needs the whole table (or a smarter divide-and-conquer method). Decide which you need before you optimise.
  - title: Calling knapsack polynomial
    explanation: |
      O(nW) depends on the numeric value of W, not on the length of its digits, so it is *pseudo*-polynomial.

summary:
  - "Two-sequence problems use a state `(i, j)` for the prefixes, a 2D table filled row by row, and the answer in the corner."
  - "**LCS**: equal last characters extend the diagonal; otherwise take the max of dropping one character. **Edit distance**: base row/column `i` and `j`, then match, delete, insert or substitute. Both are O(mn)."
  - "**0/1 knapsack**: skip or take each item, O(nW) time. Use a 1D array updated from high to low to save memory."
  - "O(nW) is **pseudo-polynomial**: it depends on the *value* of W, so it is exponential in the number of digits."
  - "**Subset sum** and **partition** are knapsack with booleans."
  - "A **traceback** through the table (or stored back-pointers) recovers the actual answer; keeping only a few rows saves memory but loses it."
next: |
  Dynamic programming handles problems where the choices are limited. Lesson 8.8 returns to **graphs** with weights: **shortest paths**. You will meet **Dijkstra's algorithm** (a greedy method with a priority queue), the **Bellman-Ford** algorithm (dynamic programming over edge counts, which copes with negative weights), and **Floyd-Warshall** for all pairs.

