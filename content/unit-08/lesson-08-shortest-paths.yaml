  - type: code
    question: |
      Write `relax_all(dist, edges)` that does one round of Bellman-Ford: for each `(u, v, w)` in `edges`, if `dist[u] + w < dist[v]` set `dist[v] = dist[u] + w`. Return `True` if any distance changed, otherwise `False`. (`dist` is a dictionary, modified in place.)
    starter: |
      def relax_all(dist, edges):
          pass
    tests:
      - name: round
        code: |
          INF = float("inf")
          dist = {"a": 0, "b": INF, "c": INF}
          edges = [("a", "b", 2), ("b", "c", 3)]
          assert relax_all(dist, edges) is True
          assert dist == {"a": 0, "b": 2, "c": 5}
          assert relax_all(dist, edges) is False
    solution: |
      def relax_all(dist, edges):
          changed = False
          for u, v, w in edges:
              if dist[u] + w < dist[v]:
                  dist[v] = dist[u] + w
                  changed = True
          return changed
