id: u8-shortest-paths
title: Shortest Paths in Weighted Graphs
minutes: 60
objective: |
  Find the cheapest route through a graph whose edges have **weights**. Use **Dijkstra's algorithm** (greedy plus a heap) when weights are non-negative, **Bellman-Ford** (dynamic programming over edge counts) when weights may be negative, and **Floyd-Warshall** to get every pair at once.
outcomes:
  - Explain why breadth-first search is not enough once edges have different weights
  - Implement Dijkstra's algorithm with a heap and explain why it needs non-negative weights
  - Reconstruct the actual shortest path from a table of predecessors
  - Implement Bellman-Ford and use it to detect a negative cycle
  - Implement Floyd-Warshall for all-pairs shortest paths
  - Choose the right algorithm from the graph's properties and give each one's running time

sections:
  - heading: Weighted graphs
    body: |
      In Lesson 7.9 breadth-first search found the path with the **fewest edges**. Real networks have different costs per edge: roads have lengths, flights have prices, network links have delays. In a **weighted graph** each edge has a number, and the **length of a path** is the sum of its edge weights. The **shortest path** problem asks for the cheapest path from a start to a target (or to every vertex).

      We store the graph as a dictionary mapping each vertex to a list of `(neighbour, weight)` pairs:

      ```python
      graph = {"A": [("B", 4), ("C", 1)], "B": [], "C": [("B", 2)]}
      ```

      Breadth-first search can fail: the route A→B has 1 edge but cost 4, while A→C→B has 2 edges and cost 3. We need an algorithm that cares about **weights**.

      The key fact is **optimal substructure**: every piece of a shortest path is itself a shortest path (if a better route to an intermediate vertex existed, you could splice it in). It's what makes both greedy (Dijkstra) and dynamic programming (Bellman-Ford) work.

  - heading: Dijkstra's algorithm
    body: |
      **Dijkstra's algorithm** finds the shortest distance from one **source** to every vertex when all weights are **non-negative**. The idea is breadth-first search with a **priority queue** instead of an ordinary queue:

      1. Set `dist[source] = 0` and everything else to infinity. Put `(0, source)` in a min-heap.
      2. Pop the vertex `u` with the **smallest** tentative distance. If it was already finalised, skip it.
      3. For each edge `u → v` with weight `w`, **relax** it: if `dist[u] + w < dist[v]`, update `dist[v]` and push `(dist[v], v)`.
      4. Repeat until the heap is empty.

      *Why it is correct.* When a vertex is popped with the smallest distance on the heap, nothing cheaper can reach it: any other route must leave the finalised set through an edge to a vertex that is still at least as far (the heap's minimum), and adding non-negative weights can only increase it. It's a greedy algorithm with an exchange-style argument (Lesson 8.5).

      *Why negative edges break it.* A later, longer-looking path might become cheaper through a negative edge, after a vertex has already been finalised.

      *Running time.* Each edge causes at most one push (O(log E)), and each pop is O(log E). With a binary heap the total is **O((V + E) log V)**. We skip stale heap entries instead of using a decrease-key operation, because Python's `heapq` has none.

      To rebuild the actual **path**, store `parent[v]` = the vertex you came from when you last improved `dist[v]`, then follow parents back from the target and reverse.

  - heading: Bellman-Ford
    body: |
      **Bellman-Ford** handles **negative** edge weights. It's dynamic programming over the number of edges: let `dist_k[v]` be the shortest distance to `v` using **at most k edges**. A shortest path in a graph with V vertices that has no negative cycle uses at most **V − 1** edges, so after V − 1 rounds of relaxing **every** edge, all distances are final:

      ```python
      for _ in range(V - 1):
          for u, v, w in edges:
              if dist[u] + w < dist[v]:
                  dist[v] = dist[u] + w
      ```

      The running time is **O(V × E)**: slower than Dijkstra, but more general.

      **Negative cycles.** If a cycle's total weight is negative, you can go around it forever and the "shortest" distance is minus infinity. Run **one more round**: if any edge can still be relaxed, there's a reachable negative cycle. (In an undirected graph, a single negative edge is already a negative cycle, since you can walk back and forth along it.)

  - heading: Floyd-Warshall (all pairs)
    body: |
      To get the shortest distance between **every** pair of vertices, you could run Dijkstra from each vertex, or use **Floyd-Warshall**, a small and beautiful DP. Number the vertices 0 to V − 1 and define `d_k[i][j]` as the shortest path from `i` to `j` whose **intermediate** vertices are all among the first `k`. For each new vertex `k` there are two options: the path doesn't use `k` (`d[i][j]` stays) or it goes `i → k → j`:

      ```python
      for k in range(V):
          for i in range(V):
              for j in range(V):
                  d[i][j] = min(d[i][j], d[i][k] + d[k][j])
      ```

      Time **O(V³)**, memory O(V²), and it works with negative edges (but not negative cycles: a negative number on the diagonal `d[i][i] < 0` reveals one). Notice that the vertex loop `k` is **outermost**, a classic place to get it wrong.

      **Which should you use?**

      | Situation | Algorithm | Time |
      |---|---|---|
      | Unweighted (or all weights equal) | BFS | O(V + E) |
      | One source, non-negative weights | Dijkstra | O((V + E) log V) |
      | One source, negative weights allowed | Bellman-Ford | O(VE) |
      | All pairs, small dense graph | Floyd-Warshall | O(V³) |
      | Directed acyclic graph | Relax in topological order | O(V + E) |

examples:
  - title: Dijkstra with path reconstruction
    intro: "A heap always hands us the closest unfinished vertex. Stale entries are skipped."
    code: |
      import heapq

      def dijkstra(graph, source):
          dist = {v: float("inf") for v in graph}
          parent = {source: None}
          dist[source] = 0
          heap = [(0, source)]
          while heap:
              d, u = heapq.heappop(heap)
              if d > dist[u]:
                  continue
              for v, w in graph[u]:
                  if d + w < dist[v]:
                      dist[v] = d + w
                      parent[v] = u
                      heapq.heappush(heap, (dist[v], v))
          return dist, parent

      def path_to(parent, target):
          path = []
          while target is not None:
              path.append(target)
              target = parent[target]
          return path[::-1]

      graph = {
          "A": [("B", 7), ("C", 9), ("F", 14)],
          "B": [("A", 7), ("C", 10), ("D", 15)],
          "C": [("A", 9), ("B", 10), ("D", 11), ("F", 2)],
          "D": [("B", 15), ("C", 11), ("E", 6)],
          "E": [("D", 6), ("F", 9)],
          "F": [("A", 14), ("C", 2), ("E", 9)],
      }
      dist, parent = dijkstra(graph, "A")
      print(dist)
      print(path_to(parent, "E"))
    output: |
      {'A': 0, 'B': 7, 'C': 9, 'D': 20, 'E': 20, 'F': 11}
      ['A', 'C', 'F', 'E']
    lines:
      - line: 5
        note: "Everything starts at infinity except the source."
      - line: 9
        note: "Pop the closest vertex not yet finalised."
      - line: 10
        note: "If this entry is older than the best known distance, a better one was already processed: skip it."
      - line: 13
        note: "Relaxation: going through u is cheaper than the best known route to v."
      - line: 15
        note: "Remember how we got here so the path can be rebuilt later."
      - line: 21
        note: "Follow the parent links from the target back to the source, then reverse."
  - title: Bellman-Ford and a negative cycle
    intro: "Relax every edge V − 1 times. One extra pass tells us whether a negative cycle exists."
    code: |
      def bellman_ford(vertices, edges, source):
          dist = {v: float("inf") for v in vertices}
          dist[source] = 0
          for _ in range(len(vertices) - 1):
              for u, v, w in edges:
                  if dist[u] + w < dist[v]:
                      dist[v] = dist[u] + w
          negative_cycle = any(dist[u] + w < dist[v] for u, v, w in edges)
          return dist, negative_cycle

      V = ["S", "A", "B", "C"]
      edges = [("S", "A", 4), ("S", "B", 5), ("A", "C", -3), ("B", "A", -2), ("C", "B", 6)]
      print(bellman_ford(V, edges, "S"))
      edges.append(("A", "S", -5))
      print(bellman_ford(V, edges, "S")[1])
    output: |
      ({'S': 0, 'A': 3, 'B': 5, 'C': 0}, False)
      True
    lines:
      - line: 4
        note: "A shortest path has at most V − 1 edges, so V − 1 rounds are enough."
      - line: 8
        note: "If an edge can still be relaxed after that, some cycle has negative total weight."
      - line: 13
        note: "Adding A → S with weight −5 creates the cycle S → A → S that costs 4 − 5 = −1, so the extra pass finds an edge that can still be relaxed."
  - title: Floyd-Warshall
    intro: "Three nested loops, with the middle vertex k on the outside."
    code: |
      INF = float("inf")
      d = [
          [0, 3, INF, 7],
          [8, 0, 2, INF],
          [5, INF, 0, 1],
          [2, INF, INF, 0],
      ]
      V = len(d)
      for k in range(V):
          for i in range(V):
              for j in range(V):
                  if d[i][k] + d[k][j] < d[i][j]:
                      d[i][j] = d[i][k] + d[k][j]
      for row in d:
          print(row)
    output: |
      [0, 3, 5, 6]
      [5, 0, 2, 3]
      [3, 6, 0, 1]
      [2, 5, 7, 0]
    lines:
      - line: 10
        note: "k is the newest vertex allowed as a stopover. It must be the outermost loop."
      - line: 13
        note: "Is it cheaper to go from i to j through k?"
      - line: 15
        note: "Entry (i, j) is now the cheapest route from i to j, for all pairs at once."

playground:
  prompt: |
    Add a shortcut edge to the Dijkstra example graph (for instance, `"A": [..., ("E", 5)]`, plus the matching edge back) and see how the distances and the path change. Then try a negative weight and notice that the result becomes wrong, because Dijkstra's assumption is broken.
  code: |
    import heapq

    graph = {
        "home": [("cafe", 4), ("park", 2)],
        "cafe": [("work", 5)],
        "park": [("cafe", 1), ("work", 8)],
        "work": [],
    }
    dist = {v: float("inf") for v in graph}
    dist["home"] = 0
    heap = [(0, "home")]
    while heap:
        d, u = heapq.heappop(heap)
        if d > dist[u]:
            continue
        for v, w in graph[u]:
            if d + w < dist[v]:
                dist[v] = d + w
                heapq.heappush(heap, (d + w, v))
    print(dist)

exercises:
  - id: dijkstra
    title: Dijkstra from scratch
    difficulty: 3
    prompt: |
      A graph is a dictionary `{vertex: [(neighbour, weight), ...]}`. Write:

      - `shortest_distances(graph, source)`: a dictionary of the shortest distance from `source` to every vertex (`float("inf")` if unreachable), using `heapq`.
      - `shortest_path(graph, source, target)`: a pair `(distance, path)` where `path` is the list of vertices from `source` to `target`, or `(float("inf"), None)` if there is no route. If several paths tie, any one is fine.
      - `reachable_within(graph, source, budget)`: the **sorted** list of vertices (excluding the source) whose shortest distance from the source is at most `budget`.
    starter: |
      import heapq


      def shortest_distances(graph, source):
          pass


      def shortest_path(graph, source, target):
          pass


      def reachable_within(graph, source, budget):
          pass
    tests:
      - name: distances
        code: |
          g = {
              "A": [("B", 7), ("C", 9), ("F", 14)],
              "B": [("A", 7), ("C", 10), ("D", 15)],
              "C": [("A", 9), ("B", 10), ("D", 11), ("F", 2)],
              "D": [("B", 15), ("C", 11), ("E", 6)],
              "E": [("D", 6), ("F", 9)],
              "F": [("A", 14), ("C", 2), ("E", 9)],
              "Z": [],
          }
          d = shortest_distances(g, "A")
          assert d == {"A": 0, "B": 7, "C": 9, "D": 20, "E": 20, "F": 11, "Z": float("inf")}
          assert shortest_distances({"x": []}, "x") == {"x": 0}
      - name: path
        code: |
          g = {"A": [("B", 4), ("C", 1)], "B": [], "C": [("B", 2)], "D": []}
          assert shortest_path(g, "A", "B") == (3, ["A", "C", "B"])
          assert shortest_path(g, "A", "A") == (0, ["A"])
          assert shortest_path(g, "A", "D") == (float("inf"), None)
      - name: reachable
        code: |
          g = {"A": [("B", 4), ("C", 1)], "B": [("D", 1)], "C": [("B", 2)], "D": [], "E": []}
          assert reachable_within(g, "A", 3) == ["B", "C"]
          assert reachable_within(g, "A", 0) == []
          assert reachable_within(g, "A", 10) == ["B", "C", "D"]
      - name: random against Bellman-Ford
        code: |
          import random
          rng = random.Random(11)
          for _ in range(50):
              n = rng.randint(2, 9)
              g = {i: [] for i in range(n)}
              edges = []
              for _ in range(rng.randint(0, 25)):
                  u, v, w = rng.randrange(n), rng.randrange(n), rng.randint(0, 9)
                  g[u].append((v, w))
                  edges.append((u, v, w))
              dist = {i: float("inf") for i in range(n)}
              dist[0] = 0
              for _ in range(n):
                  for u, v, w in edges:
                      if dist[u] + w < dist[v]:
                          dist[v] = dist[u] + w
              assert shortest_distances(g, 0) == dist
      - name: speed
        code: |
          import random, time
          rng = random.Random(1)
          n = 30000
          g = {i: [(rng.randrange(n), rng.randint(1, 20)) for _ in range(5)] for i in range(n)}
          t = time.time()
          d = shortest_distances(g, 0)
          assert time.time() - t < 4
    hints:
      - "Follow the example: a heap of `(distance, vertex)`, skip entries with `d > dist[u]`, relax each edge."
      - "For the path, store `parent[v] = u` when you improve `dist[v]`. If `dist[target]` is infinity, return `(float('inf'), None)`."
      - "`reachable_within`: run `shortest_distances` and keep those with distance `<= budget`, but leave out the source itself (its distance 0 always fits)."
    solution: |
      import heapq


      def _dijkstra(graph, source):
          dist = {v: float("inf") for v in graph}
          parent = {source: None}
          dist[source] = 0
          heap = [(0, source)]
          while heap:
              d, u = heapq.heappop(heap)
              if d > dist[u]:
                  continue
              for v, w in graph[u]:
                  if d + w < dist[v]:
                      dist[v] = d + w
                      parent[v] = u
                      heapq.heappush(heap, (dist[v], v))
          return dist, parent


      def shortest_distances(graph, source):
          return _dijkstra(graph, source)[0]


      def shortest_path(graph, source, target):
          dist, parent = _dijkstra(graph, source)
          if dist[target] == float("inf"):
              return float("inf"), None
          path = []
          node = target
          while node is not None:
              path.append(node)
              node = parent[node]
          return dist[target], path[::-1]


      def reachable_within(graph, source, budget):
          dist = shortest_distances(graph, source)
          return sorted(v for v, d in dist.items() if v != source and d <= budget)
    explanation: |
      The comparison with a straightforward Bellman-Ford shows that the heap-based version produces the same distances for 50 random graphs. The stale-entry check (`d > dist[u]`) is what replaces the decrease-key operation that `heapq` doesn't have.

  - id: grid-weights
    title: Cheapest route on a map
    difficulty: 3
    prompt: |
      A map is a list of equal-length strings of digits `1`-`9` (the cost of **entering** a square) and `#` (a wall). You start at the top-left square (which costs nothing to stand on) and may move up, down, left or right.

      Write `cheapest_route(grid)` returning the smallest total cost to reach the bottom-right square, or `-1` if it's unreachable. Then write `route_cells(grid)` returning the list of `(row, col)` cells on one cheapest route (start first, end last), or `None` if unreachable.

      Hint: every cell is a vertex; this is Dijkstra on a grid, with edges built implicitly from the four directions.
    starter: |
      import heapq


      def cheapest_route(grid):
          pass


      def route_cells(grid):
          pass
    tests:
      - name: cost
        code: |
          assert cheapest_route(["11", "11"]) == 2
          assert cheapest_route(["19", "11"]) == 2
          assert cheapest_route(["1#", "#1"]) == -1
          assert cheapest_route(["5"]) == 0
          assert cheapest_route(["131", "191", "111"]) == 4
          big = ["1" * 150 for _ in range(150)]
          assert cheapest_route(big) == 298
      - name: route
        code: |
          grid = ["131", "191", "111"]
          cells = route_cells(grid)
          assert cells[0] == (0, 0) and cells[-1] == (2, 2)
          cost = 0
          for (r1, c1), (r2, c2) in zip(cells, cells[1:]):
              assert abs(r1 - r2) + abs(c1 - c2) == 1
              cost += int(grid[r2][c2])
          assert cost == cheapest_route(grid) == 4
          assert route_cells(["1#", "#1"]) is None
          assert route_cells(["7"]) == [(0, 0)]
    hints:
      - "A heap of `(cost, row, col)`; `dist` as a dict or 2D list of infinities."
      - "Moving into `(nr, nc)` costs `int(grid[nr][nc])` and is allowed only if inside the grid and not `#`."
      - "For the route keep `parent[(r, c)]` and walk back from the bottom-right corner. If the start or end is a wall, return -1 (or None)."
    solution: |
      import heapq


      def _search(grid):
          rows, cols = len(grid), len(grid[0])
          if grid[0][0] == "#" or grid[-1][-1] == "#":
              return None, None
          dist = {(0, 0): 0}
          parent = {(0, 0): None}
          heap = [(0, 0, 0)]
          while heap:
              d, r, c = heapq.heappop(heap)
              if d > dist.get((r, c), float("inf")):
                  continue
              if (r, c) == (rows - 1, cols - 1):
                  return d, parent
              for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  nr, nc = r + dr, c + dc
                  if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != "#":
                      nd = d + int(grid[nr][nc])
                      if nd < dist.get((nr, nc), float("inf")):
                          dist[(nr, nc)] = nd
                          parent[(nr, nc)] = (r, c)
                          heapq.heappush(heap, (nd, nr, nc))
          return None, None


      def cheapest_route(grid):
          cost, _ = _search(grid)
          return -1 if cost is None else cost


      def route_cells(grid):
          cost, parent = _search(grid)
          if cost is None:
              return None
          cell = (len(grid) - 1, len(grid[0]) - 1)
          out = []
          while cell is not None:
              out.append(cell)
              cell = parent[cell]
          return out[::-1]
    explanation: |
      A grid is just a graph whose neighbours are computed on the fly, so no explicit adjacency lists are needed. The search can stop as soon as the target is popped, because at that moment its distance is final.

  - id: bellman
    title: Bellman-Ford and currency arbitrage
    difficulty: 4
    prompt: |
      Write:

      - `bellman_ford(n, edges, source)`: vertices are `0..n-1`; `edges` is a list of `(u, v, w)`. Return `(dist, has_negative_cycle)`. `dist` is a list with `float("inf")` for unreachable vertices. If a negative cycle is reachable from the source, return `(None, True)`.
      - `arbitrage(rates)`: `rates[i][j]` is how many units of currency `j` one unit of currency `i` buys (positive numbers, `rates[i][i] == 1`). Return `True` if some cycle of exchanges ends with more than you started with. Hint: multiplying rates is the same as adding `-log(rate)`, so a cycle with product greater than 1 is a **negative cycle** under the weights `-log(rate)`. Run Bellman-Ford from currency 0 on the complete graph (every currency is reachable from every other), and compare with a small tolerance.
    starter: |
      import math


      def bellman_ford(n, edges, source):
          pass


      def arbitrage(rates):
          pass
    tests:
      - name: distances
        code: |
          INF = float("inf")
          edges = [(0, 1, 4), (0, 2, 5), (1, 3, -3), (2, 1, -2), (3, 2, 6)]
          assert bellman_ford(4, edges, 0) == ([0, 3, 5, 0], False)
          assert bellman_ford(3, [(0, 1, 2)], 0) == ([0, 2, INF], False)
          assert bellman_ford(1, [], 0) == ([0], False)
      - name: negative cycle
        code: |
          assert bellman_ford(3, [(0, 1, 1), (1, 2, -3), (2, 1, 1)], 0) == (None, True)
          assert bellman_ford(3, [(1, 2, -3), (2, 1, 1)], 0) == ([0, float("inf"), float("inf")], False)
      - name: arbitrage
        code: |
          fair = [[1, 2, 4], [0.5, 1, 2], [0.25, 0.5, 1]]
          assert arbitrage(fair) is False
          loop = [[1, 2, 4], [0.5, 1, 2], [0.26, 0.5, 1]]
          assert arbitrage(loop) is True
          assert arbitrage([[1]]) is False
    hints:
      - "Repeat `n - 1` times: for each edge, relax it if `dist[u]` is finite and `dist[u] + w < dist[v]`."
      - "One more pass: if any edge from a reachable vertex can still be relaxed, return `(None, True)`."
      - "Arbitrage: edges `(i, j, -math.log(rates[i][j]))` for all `i != j`; call `bellman_ford`; the answer is its second value. To avoid floating-point noise, only count a relaxation in the final pass if it improves by more than `1e-12`; write that in your own loop, or pass in a tolerance."
    solution: |
      import math


      def bellman_ford(n, edges, source, eps=0.0):
          INF = float("inf")
          dist = [INF] * n
          dist[source] = 0
          for _ in range(n - 1):
              for u, v, w in edges:
                  if dist[u] != INF and dist[u] + w < dist[v]:
                      dist[v] = dist[u] + w
          for u, v, w in edges:
              if dist[u] != INF and dist[u] + w < dist[v] - eps:
                  return None, True
          return dist, False


      def arbitrage(rates):
          n = len(rates)
          edges = [(i, j, -math.log(rates[i][j])) for i in range(n) for j in range(n) if i != j]
          return bellman_ford(n, edges, 0, eps=1e-12)[1]
    explanation: |
      Bellman-Ford needs the "only relax from reachable vertices" check, otherwise infinity plus a negative weight would look like an improvement. The arbitrage trick (take logarithms to turn products into sums) is how real trading systems find mispriced currency loops. The tolerance prevents tiny rounding errors in a fair market from looking like a negative cycle.

  - id: floyd
    title: All pairs with Floyd-Warshall
    difficulty: 3
    prompt: |
      Write `all_pairs(n, edges)` for a directed graph with vertices `0..n-1` and `edges` a list of `(u, v, w)` (weights may be negative, but assume no negative cycle). Return the n × n matrix of shortest distances (`float("inf")` if there is no route, 0 on the diagonal).

      Then write `diameter(n, edges)`: the **largest** finite shortest distance between any two different vertices (0 if there are fewer than two vertices or no route at all), and `center(n, edges)`: the vertex whose **eccentricity** (largest distance to any other vertex) is smallest, assuming every vertex can reach every other vertex; ties go to the smallest index.
    starter: |
      def all_pairs(n, edges):
          pass


      def diameter(n, edges):
          pass


      def center(n, edges):
          pass
    tests:
      - name: matrix
        code: |
          INF = float("inf")
          edges = [(0, 1, 3), (0, 3, 7), (1, 0, 8), (1, 2, 2), (2, 0, 5), (2, 3, 1), (3, 0, 2)]
          assert all_pairs(4, edges) == [[0, 3, 5, 6], [5, 0, 2, 3], [3, 6, 0, 1], [2, 5, 7, 0]]
          assert all_pairs(2, []) == [[0, INF], [INF, 0]]
          assert all_pairs(3, [(0, 1, 4), (1, 2, -1)]) == [[0, 4, 3], [INF, 0, -1], [INF, INF, 0]]
      - name: diameter and center
        code: |
          edges = [(0, 1, 3), (0, 3, 7), (1, 0, 8), (1, 2, 2), (2, 0, 5), (2, 3, 1), (3, 0, 2)]
          assert diameter(4, edges) == 7
          assert center(4, edges) == 1
          assert diameter(1, []) == 0
          line = [(0, 1, 1), (1, 0, 1), (1, 2, 1), (2, 1, 1), (2, 3, 1), (3, 2, 1)]
          assert diameter(4, line) == 3
          assert center(4, line) == 1
    hints:
      - "Start the matrix with 0 on the diagonal, infinity elsewhere, then the edge weights (keep the smaller weight if there are two edges between the same pair)."
      - "Triple loop with `k` outermost."
      - "`diameter`: the max over finite off-diagonal entries. `center`: `min(range(n), key=lambda i: max(d[i][j] for j != i))` (min returns the first smallest, which handles ties)."
    solution: |
      def all_pairs(n, edges):
          INF = float("inf")
          d = [[0 if i == j else INF for j in range(n)] for i in range(n)]
          for u, v, w in edges:
              if w < d[u][v]:
                  d[u][v] = w
          for k in range(n):
              for i in range(n):
                  for j in range(n):
                      if d[i][k] + d[k][j] < d[i][j]:
                          d[i][j] = d[i][k] + d[k][j]
          return d


      def diameter(n, edges):
          d = all_pairs(n, edges)
          finite = [d[i][j] for i in range(n) for j in range(n) if i != j and d[i][j] != float("inf")]
          return max(finite, default=0)


      def center(n, edges):
          d = all_pairs(n, edges)
          return min(range(n), key=lambda i: max((d[i][j] for j in range(n) if j != i), default=0))
    explanation: |
      After the loop for stopover `k`, `d[i][j]` is the best route using only vertices up to `k` in between. The matrix answers many questions at once: diameter (the worst-case trip) and centre (the best place for a depot) both come straight from it. For big sparse graphs, V runs of Dijkstra are usually faster than O(V³).

commonMistakes:
  - title: Using Dijkstra with negative weights
    explanation: |
      Dijkstra finalises a vertex when it is popped. A negative edge discovered later can make an already-finalised vertex cheaper. Use Bellman-Ford.
  - title: Using BFS for weighted graphs
    explanation: |
      BFS minimises the number of edges, not the total weight.
  - title: Floyd-Warshall with the wrong loop order
    explanation: |
      The intermediate vertex `k` must be the outermost loop. Putting it innermost computes something different and gives wrong answers.
  - title: Relaxing from an unreachable vertex
    explanation: |
      `infinity + negative` is still infinity in Python, but in some languages or with sentinel numbers it wraps or looks reachable. Check `dist[u] != INF` before relaxing in Bellman-Ford.
  - title: Forgetting to skip stale heap entries
    explanation: |
      Without `if d > dist[u]: continue`, the same vertex is expanded several times. The answer stays correct but the running time can blow up.

summary:
  - "In a weighted graph the shortest path minimises the **sum of edge weights**, not the number of edges. Every piece of a shortest path is itself shortest."
  - "**Dijkstra** (non-negative weights): repeatedly finalise the closest unfinished vertex using a min-heap and **relax** its edges. O((V + E) log V)."
  - "Keep a **parent** for each vertex to rebuild the path itself."
  - "**Bellman-Ford** relaxes every edge V − 1 times, tolerates negative edges, detects negative cycles with one extra pass, and takes O(VE)."
  - "**Floyd-Warshall** finds all pairs in O(V³) by allowing one more stopover vertex at a time (the stopover loop is outermost)."
  - "Pick by situation: BFS for unweighted, Dijkstra for non-negative, Bellman-Ford for negative edges, Floyd-Warshall for all pairs on small graphs."
next: |
  One more classic graph problem remains. Instead of the cheapest route between two places, Lesson 8.9 asks for the cheapest way to **connect everything**: the **minimum spanning tree**. You will meet **Kruskal's algorithm**, which needs the clever **union-find** data structure, and **Prim's algorithm**, which looks a lot like Dijkstra.

