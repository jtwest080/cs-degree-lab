  - type: code
    question: |
      Write `mst_weight(n, edges)` for edges `(w, u, v)` on vertices `0..n-1` using Kruskal's algorithm; return the total weight of the minimum spanning forest.
    starter: |
      def mst_weight(n, edges):
          pass
    tests:
      - name: weight
        code: |
          assert mst_weight(3, [(1, 0, 1), (2, 1, 2), (4, 0, 2)]) == 3
          assert mst_weight(2, []) == 0
          assert mst_weight(4, [(5, 0, 1), (7, 2, 3)]) == 12
    solution: |
      def mst_weight(n, edges):
          parent = list(range(n))

          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]
                  x = parent[x]
              return x

          total = 0
          for w, u, v in sorted(edges):
              ru, rv = find(u), find(v)
              if ru != rv:
                  parent[ru] = rv
                  total += w
          return total
