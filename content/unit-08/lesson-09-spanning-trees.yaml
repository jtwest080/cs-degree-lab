id: u8-spanning-trees
title: Minimum Spanning Trees and Union-Find
minutes: 55
objective: |
  Connect every vertex of a weighted graph as cheaply as possible. Learn the **cut property** that makes greedy work, implement **Kruskal's** and **Prim's** algorithms, and build the **union-find** (disjoint set) data structure that makes Kruskal fast.
outcomes:
  - Define a spanning tree and a minimum spanning tree, and say how many edges a spanning tree has
  - State the cut property and use it to justify why greedy algorithms find minimum spanning trees
  - Implement union-find with path compression and union by size
  - Implement Kruskal's algorithm and state its running time
  - Implement Prim's algorithm with a heap and explain how it differs from Dijkstra
  - Use a spanning tree algorithm to solve problems such as clustering and detecting cycles

sections:
  - heading: The cheapest way to connect everything
    body: |
      Suppose you must lay cable between several towns. Each possible link has a cost, and you want every town connected, directly or through others, for the **smallest total cost**. You never need a cycle: a cycle means one link is redundant, and removing it still leaves everything connected.

      A **spanning tree** of a connected graph with V vertices is a set of edges that connects all the vertices with **no cycles**. Every spanning tree has exactly **V − 1 edges**. (Fewer would leave something disconnected; more would create a cycle.) A **minimum spanning tree (MST)** is a spanning tree with the smallest possible total weight. There may be several with equal weight, but if all the weights are distinct the MST is unique.

      The MST is not the same thing as the shortest-path tree of Lesson 8.8. Shortest paths minimise the distance from *one source*; the MST minimises the *total* weight of the connecting network.

  - heading: Why greedy works
    body: |
      MST has a rare property: the greedy choices are always safe. The reason is the **cut property**.

      A **cut** divides the vertices into two non-empty groups. **Cut property:** among the edges that cross a cut, the one with the **smallest weight** belongs to some minimum spanning tree (to all of them, if it is the unique cheapest).

      *Exchange argument.* Take any MST T that doesn't contain the cheapest crossing edge e. Adding e to T creates a cycle, and the cycle must cross the cut again by some other edge f, which is at least as heavy as e. Swap f for e: the result is still a spanning tree and it is no heavier. So there is an MST containing e. ∎

      Both algorithms below are just different ways of picking cuts and always choosing the cheapest crossing edge.

  - heading: Union-find (disjoint sets)
    body: |
      Kruskal's algorithm needs to answer one question, quickly and many times: **are these two vertices already connected?** The **union-find** (or **disjoint-set**) data structure keeps track of groups of items, and supports:

      - `find(x)`: which group is `x` in? (returns a representative, the "root" of the group)
      - `union(x, y)`: merge the groups of `x` and `y`.

      Each group is stored as a tree where every item points to a **parent**, and the root points to itself. `find` follows parents up to the root. Two items are in the same group when `find` gives the same root.

      Two small tricks make it astonishingly fast:

      - **Path compression:** during `find`, point every visited item directly at the root, so later finds are short.
      - **Union by size** (or rank): when merging, attach the **smaller** tree under the root of the larger, which keeps trees shallow.

      With both, a sequence of m operations on n items takes O(m α(n)), where α is the **inverse Ackermann function**. It grows so slowly that α(n) is at most 4 for any n you could ever store in the universe. In practice each operation is constant time.

  - heading: Kruskal's algorithm
    body: |
      **Kruskal's algorithm** builds the MST edge by edge:

      1. **Sort** all edges by weight.
      2. For each edge in order: if its endpoints are in **different** groups (`find(u) != find(v)`), add the edge to the tree and `union` the groups. Otherwise skip it, because it would form a cycle.
      3. Stop when V − 1 edges have been chosen.

      Why is it correct? When Kruskal adds an edge, it is the lightest edge leaving the group containing one endpoint: a cut-property edge. The edges it skips connect vertices that are already joined, so they can't be needed.

      The running time is dominated by the sort: **O(E log E)**, which is the same as O(E log V). Union-find adds almost nothing.

      If the graph isn't connected, Kruskal produces a **minimum spanning forest**, one tree per component.

  - heading: Prim's algorithm
    body: |
      **Prim's algorithm** grows a single tree from a starting vertex. The cut is always "inside the tree" versus "outside":

      1. Start with one vertex in the tree. Put its edges in a min-heap.
      2. Pop the cheapest edge. If it leads to a vertex **not yet in the tree**, add the vertex and the edge, and push that vertex's edges onto the heap.
      3. Repeat until V vertices are in the tree.

      It looks almost identical to Dijkstra, with one difference: Dijkstra's priority is **distance from the source** (`dist[u] + w`), while Prim's is just the **edge weight** `w`. The time with a binary heap is **O(E log V)**.

      Which is better? Kruskal is simple when you have a list of edges and works well on sparse graphs; Prim is natural for dense graphs or when the graph is already stored as adjacency lists.

      **Applications.** Network design (cables, pipes, roads), approximating the travelling salesman problem, **clustering** (stop Kruskal early, at k groups, and the groups are the clusters), image segmentation and building mazes.

examples:
  - title: Union-find
    intro: "Each item points at a parent. find follows the pointers and flattens the path."
    code: |
      class UnionFind:
          def __init__(self, n):
              self.parent = list(range(n))
              self.size = [1] * n

          def find(self, x):
              while self.parent[x] != x:
                  self.parent[x] = self.parent[self.parent[x]]
                  x = self.parent[x]
              return x

          def union(self, a, b):
              ra, rb = self.find(a), self.find(b)
              if ra == rb:
                  return False
              if self.size[ra] < self.size[rb]:
                  ra, rb = rb, ra
              self.parent[rb] = ra
              self.size[ra] += self.size[rb]
              return True

      uf = UnionFind(6)
      print(uf.union(0, 1), uf.union(2, 3), uf.union(1, 3))
      print(uf.find(0) == uf.find(2), uf.find(0) == uf.find(4))
      print(uf.union(0, 2))
      print(uf.size[uf.find(0)])
    output: |
      True True True
      True False
      False
      4
    lines:
      - line: 3
        note: "At first every item is its own root."
      - line: 8
        note: "Path halving, a form of path compression: point at the grandparent as we climb."
      - line: 14
        note: "Same root means same group: nothing to merge, so report False."
      - line: 16
        note: "Union by size: the smaller tree goes under the larger one's root."
      - line: 24
        note: "Items 0, 1, 2 and 3 are now one group; item 4 is separate."
  - title: Kruskal's algorithm
    intro: "Go through edges from cheapest to most expensive and keep those that join two different groups."
    code: |
      def kruskal(n, edges):
          parent = list(range(n))

          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]
                  x = parent[x]
              return x

          tree, total = [], 0
          for w, u, v in sorted(edges):
              ru, rv = find(u), find(v)
              if ru != rv:
                  parent[ru] = rv
                  tree.append((u, v, w))
                  total += w
          return total, tree

      edges = [(7, 0, 1), (5, 0, 3), (8, 1, 2), (9, 1, 3), (7, 1, 4),
               (5, 2, 4), (15, 3, 4), (6, 3, 5), (8, 4, 5), (9, 4, 6), (11, 5, 6)]
      total, tree = kruskal(7, edges)
      print(total)
      for edge in tree:
          print(edge)
    output: |
      39
      (0, 3, 5)
      (2, 4, 5)
      (3, 5, 6)
      (0, 1, 7)
      (1, 4, 7)
      (4, 6, 9)
    lines:
      - line: 11
        note: "Edges are written (weight, u, v) so a plain sort puts the cheapest first."
      - line: 13
        note: "Skip an edge whose ends are already connected: it would close a cycle."
      - line: 14
        note: "Merge the two groups."
  - title: Prim's algorithm
    intro: "Grow one tree from vertex 0, always taking the cheapest edge that leaves it."
    code: |
      import heapq

      def prim(graph, start):
          seen = {start}
          heap = [(w, start, v) for v, w in graph[start]]
          heapq.heapify(heap)
          total, tree = 0, []
          while heap and len(seen) < len(graph):
              w, u, v = heapq.heappop(heap)
              if v in seen:
                  continue
              seen.add(v)
              total += w
              tree.append((u, v, w))
              for x, wx in graph[v]:
                  if x not in seen:
                      heapq.heappush(heap, (wx, v, x))
          return total, tree

      graph = {0: [(1, 7), (3, 5)], 1: [(0, 7), (2, 8), (3, 9), (4, 7)],
               2: [(1, 8), (4, 5)], 3: [(0, 5), (1, 9), (4, 15), (5, 6)],
               4: [(1, 7), (2, 5), (3, 15), (5, 8), (6, 9)],
               5: [(3, 6), (4, 8), (6, 11)], 6: [(4, 9), (5, 11)]}
      total, tree = prim(graph, 0)
      print(total)
      print(tree)
    output: |
      39
      [(0, 3, 5), (3, 5, 6), (0, 1, 7), (1, 4, 7), (4, 2, 5), (4, 6, 9)]
    lines:
      - line: 9
        note: "Pop the cheapest edge leaving the tree."
      - line: 10
        note: "If its far end is already in the tree, the edge would form a cycle: skip it."
      - line: 15
        note: "Only the edge weight matters here. In Dijkstra the priority would be the total distance from the source."
      - line: 25
        note: "Same total (39) as Kruskal. With ties the tree edges can differ, but the total is always the minimum."

playground:
  prompt: |
    Change a weight in the Kruskal example so that a different edge becomes the cheapest, and see how the tree changes. Then remove edges until the graph becomes disconnected and notice that the result has fewer than V − 1 edges.
  code: |
    parent = list(range(5))

    def find(x):
        while parent[x] != x:
            x = parent[x]
        return x

    edges = [(1, 0, 1), (2, 1, 2), (3, 0, 2), (4, 3, 4)]
    chosen = []
    for w, u, v in sorted(edges):
        if find(u) != find(v):
            parent[find(u)] = find(v)
            chosen.append((u, v, w))
    print(chosen, "edges:", len(chosen), "vertices: 5")

exercises:
  - id: union-find
    title: Union-find class
    difficulty: 3
    prompt: |
      Write a class `UnionFind` with:

      - `__init__(self, n)`: items `0..n-1`, each in its own group.
      - `find(self, x)`: the root of `x`'s group, with path compression.
      - `union(self, a, b)`: merge the groups, **attaching the smaller group's root under the larger's** (when sizes are equal, attach `b`'s root under `a`'s). Return `True` if two groups were merged and `False` if they were already the same group.
      - `same(self, a, b)`: whether they are in the same group.
      - `group_size(self, x)`: the size of `x`'s group.
      - `count`: an attribute (kept up to date) with the current number of groups.
    starter: |
      class UnionFind:
          def __init__(self, n):
              pass

          def find(self, x):
              pass

          def union(self, a, b):
              pass

          def same(self, a, b):
              pass

          def group_size(self, x):
              pass
    tests:
      - name: basics
        code: |
          uf = UnionFind(6)
          assert uf.count == 6
          assert uf.union(0, 1) is True and uf.union(2, 3) is True
          assert uf.union(1, 0) is False
          assert uf.same(0, 1) and not uf.same(1, 2)
          assert uf.count == 4
          assert uf.union(1, 3) is True
          assert uf.same(0, 2) and uf.group_size(3) == 4 and uf.group_size(5) == 1
          assert uf.count == 3
      - name: root rule
        code: |
          uf = UnionFind(5)
          uf.union(0, 1)
          uf.union(2, 3)
          uf.union(0, 2)
          assert uf.find(3) == 0 and uf.find(1) == 0
          uf.union(4, 0)
          assert uf.find(4) == 0
      - name: speed
        code: |
          import random, time
          n = 200000
          uf = UnionFind(n)
          t = time.time()
          for i in range(n - 1):
              uf.union(i, i + 1)
          assert uf.count == 1 and uf.group_size(0) == n
          rng = random.Random(1)
          for _ in range(100000):
              assert uf.same(rng.randrange(n), rng.randrange(n))
          assert time.time() - t < 4
    hints:
      - "`self.parent = list(range(n))`, `self.size = [1] * n`, `self.count = n`."
      - "`find`: loop `while self.parent[x] != x`, set `self.parent[x] = self.parent[self.parent[x]]`, then `x = self.parent[x]`."
      - "`union`: find both roots; if equal return False. If `size[ra] < size[rb]` swap them; set `parent[rb] = ra`, add the sizes, decrement `count`."
    solution: |
      class UnionFind:
          def __init__(self, n):
              self.parent = list(range(n))
              self.size = [1] * n
              self.count = n

          def find(self, x):
              while self.parent[x] != x:
                  self.parent[x] = self.parent[self.parent[x]]
                  x = self.parent[x]
              return x

          def union(self, a, b):
              ra, rb = self.find(a), self.find(b)
              if ra == rb:
                  return False
              if self.size[ra] < self.size[rb]:
                  ra, rb = rb, ra
              self.parent[rb] = ra
              self.size[ra] += self.size[rb]
              self.count -= 1
              return True

          def same(self, a, b):
              return self.find(a) == self.find(b)

          def group_size(self, x):
              return self.size[self.find(x)]
    explanation: |
      Without the two tricks a chain of 200,000 unions would build a tree 200,000 deep and every `find` would walk it. With them, the work is nearly constant per operation. Keeping `count` and `size` up to date on every merge makes "how many groups?" and "how big is this group?" free queries.

  - id: kruskal
    title: Kruskal and clustering
    difficulty: 3
    prompt: |
      Edges are tuples `(u, v, w)` on vertices `0..n-1`. Write:

      - `mst(n, edges)`: return `(total_weight, chosen_edges)` using Kruskal with union-find. Sort edges by `(w, u, v)` so ties are deterministic. Return the chosen edges as `(u, v, w)` tuples in the order chosen. If the graph isn't connected return the minimum spanning forest.
      - `is_connected(n, edges)`: whether the edges connect all `n` vertices.
      - `clusters(n, edges, k)`: stop Kruskal when only `k` groups remain, and return the groups as a list of sorted lists, ordered by their smallest member. (If the graph has more than `k` components even after using all edges, return those components.)
      - `second_best_total(n, edges)`: the weight of the cheapest spanning tree that differs from some MST by exactly one edge, found by trying to **remove each MST edge** in turn and re-running Kruskal on the rest. Return `None` if no replacement connects the graph.
    starter: |
      def mst(n, edges):
          pass


      def is_connected(n, edges):
          pass


      def clusters(n, edges, k):
          pass


      def second_best_total(n, edges):
          pass
    tests:
      - name: mst
        code: |
          edges = [(0, 1, 7), (0, 3, 5), (1, 2, 8), (1, 3, 9), (1, 4, 7), (2, 4, 5),
                   (3, 4, 15), (3, 5, 6), (4, 5, 8), (4, 6, 9), (5, 6, 11)]
          total, chosen = mst(7, edges)
          assert total == 39 and len(chosen) == 6
          assert chosen[0] == (0, 3, 5)
          assert mst(1, []) == (0, [])
          total, chosen = mst(4, [(0, 1, 2), (2, 3, 3)])
          assert total == 5 and len(chosen) == 2
      - name: connected
        code: |
          assert is_connected(3, [(0, 1, 1), (1, 2, 1)]) is True
          assert is_connected(3, [(0, 1, 1)]) is False
          assert is_connected(1, []) is True
      - name: clusters
        code: |
          edges = [(0, 1, 1), (1, 2, 2), (3, 4, 1), (2, 3, 10), (4, 5, 2)]
          assert clusters(6, edges, 2) == [[0, 1, 2], [3, 4, 5]]
          assert clusters(6, edges, 1) == [[0, 1, 2, 3, 4, 5]]
          assert clusters(6, edges, 6) == [[0], [1], [2], [3], [4], [5]]
          assert clusters(4, [(0, 1, 1)], 2) == [[0, 1], [2], [3]]
      - name: second best
        code: |
          edges = [(0, 1, 1), (1, 2, 2), (0, 2, 4)]
          assert mst(3, edges)[0] == 3
          assert second_best_total(3, edges) == 5
          assert second_best_total(3, [(0, 1, 1), (1, 2, 2)]) is None
      - name: brute-force check
        code: |
          import itertools, random
          rng = random.Random(21)
          for _ in range(60):
              n = rng.randint(2, 6)
              edges = []
              for u in range(n):
                  for v in range(u + 1, n):
                      if rng.random() < 0.7:
                          edges.append((u, v, rng.randint(1, 9)))
              best = None
              for sub in itertools.combinations(edges, n - 1):
                  if is_connected(n, list(sub)):
                      cost = sum(e[2] for e in sub)
                      best = cost if best is None else min(best, cost)
              if best is None:
                  assert not is_connected(n, edges)
              else:
                  assert mst(n, edges)[0] == best, edges
    hints:
      - "Use your own `UnionFind` or a small `find` function with a `parent` list."
      - "`is_connected`: the number of edges chosen by `mst` equals `n - 1` (for `n >= 1`)."
      - "`clusters`: run Kruskal's loop but stop as soon as the group count reaches `k`; then group the vertices by `find` and sort."
      - "`second_best_total`: for each chosen edge, rebuild the list without it, run `mst`, and if the result still has `n - 1` edges note the total. Return the smallest, or `None`."
    solution: |
      def _find(parent, x):
          while parent[x] != x:
              parent[x] = parent[parent[x]]
              x = parent[x]
          return x


      def mst(n, edges):
          parent = list(range(n))
          chosen, total = [], 0
          for u, v, w in sorted(edges, key=lambda e: (e[2], e[0], e[1])):
              ru, rv = _find(parent, u), _find(parent, v)
              if ru != rv:
                  parent[ru] = rv
                  chosen.append((u, v, w))
                  total += w
          return total, chosen


      def is_connected(n, edges):
          return len(mst(n, edges)[1]) == n - 1


      def clusters(n, edges, k):
          parent = list(range(n))
          groups = n
          for u, v, w in sorted(edges, key=lambda e: (e[2], e[0], e[1])):
              if groups <= k:
                  break
              ru, rv = _find(parent, u), _find(parent, v)
              if ru != rv:
                  parent[ru] = rv
                  groups -= 1
          result = {}
          for x in range(n):
              result.setdefault(_find(parent, x), []).append(x)
          return sorted(result.values(), key=lambda g: g[0])


      def second_best_total(n, edges):
          _, chosen = mst(n, edges)
          best = None
          for edge in chosen:
              rest = [e for e in edges if e != edge]
              total, picked = mst(n, rest)
              if len(picked) == n - 1 and (best is None or total < best):
                  best = total
          return best
    explanation: |
      Stopping Kruskal early gives single-linkage clustering: the points joined by the cheapest links form groups, and the heaviest remaining links are exactly the gaps between clusters. The brute-force check, which tries every set of n − 1 edges, confirms that the greedy MST is truly minimal, the cut property at work.

  - id: prim
    title: Prim's algorithm
    difficulty: 3
    prompt: |
      A graph is a dictionary `{vertex: [(neighbour, weight), ...]}` with symmetric edges (undirected). Write:

      - `prim(graph, start)`: return `(total, edges)` where `edges` is the list of `(u, v, w)` chosen, in the order added, using a heap of `(w, u, v)`. If the graph isn't connected, only the component of `start` is covered.
      - `network_cost(graph)`: the total cost of a minimum spanning forest of the whole graph, running Prim from each vertex not yet covered.
      - `bottleneck(graph, a, b)`: the smallest possible value of the **heaviest edge** on a route from `a` to `b` (the minimax path). It is the heaviest edge on the path between `a` and `b` **inside the MST**; return `None` if there's no route, and `0` if `a == b`.
    starter: |
      import heapq


      def prim(graph, start):
          pass


      def network_cost(graph):
          pass


      def bottleneck(graph, a, b):
          pass
    tests:
      - name: prim
        code: |
          g = {0: [(1, 7), (3, 5)], 1: [(0, 7), (2, 8), (3, 9), (4, 7)], 2: [(1, 8), (4, 5)],
               3: [(0, 5), (1, 9), (4, 15), (5, 6)], 4: [(1, 7), (2, 5), (3, 15), (5, 8), (6, 9)],
               5: [(3, 6), (4, 8), (6, 11)], 6: [(4, 9), (5, 11)]}
          total, edges = prim(g, 0)
          assert total == 39 and len(edges) == 6
          assert edges[0] == (0, 3, 5)
          assert prim({"x": []}, "x") == (0, [])
      - name: forest
        code: |
          g = {0: [(1, 4)], 1: [(0, 4)], 2: [(3, 1)], 3: [(2, 1)], 4: []}
          assert prim(g, 0) == (4, [(0, 1, 4)])
          assert network_cost(g) == 5
      - name: bottleneck
        code: |
          g = {"a": [("b", 3), ("c", 10)], "b": [("a", 3), ("c", 4)], "c": [("a", 10), ("b", 4)], "d": []}
          assert bottleneck(g, "a", "c") == 4
          assert bottleneck(g, "a", "b") == 3
          assert bottleneck(g, "a", "a") == 0
          assert bottleneck(g, "a", "d") is None
      - name: agrees with Kruskal
        code: |
          import random
          rng = random.Random(5)
          for _ in range(50):
              n = rng.randint(1, 8)
              g = {i: [] for i in range(n)}
              parent = list(range(n))
              def find(x):
                  while parent[x] != x:
                      parent[x] = parent[parent[x]]
                      x = parent[x]
                  return x
              es = []
              for u in range(n):
                  for v in range(u + 1, n):
                      if rng.random() < 0.5:
                          w = rng.randint(1, 20)
                          g[u].append((v, w)); g[v].append((u, w)); es.append((w, u, v))
              total = 0
              for w, u, v in sorted(es):
                  if find(u) != find(v):
                      parent[find(u)] = find(v)
                      total += w
              assert network_cost(g) == total
    hints:
      - "Push every edge leaving the start onto the heap as `(w, start, v)`. Pop; if `v` is already in `seen`, skip; otherwise add it, record the edge and push the new vertex's edges to unseen neighbours."
      - "`network_cost`: keep a global `seen` set; call a Prim helper from each vertex that isn't covered yet, adding the totals."
      - "`bottleneck`: build the MST of `a`'s component (Prim from `a`), turn its edges into an adjacency list, then search (DFS) for the path from `a` to `b`, tracking the largest edge weight on the way. If `b` isn't reached return None."
    solution: |
      import heapq


      def _grow(graph, start, seen):
          seen.add(start)
          heap = [(w, start, v) for v, w in graph[start]]
          heapq.heapify(heap)
          total, edges = 0, []
          while heap:
              w, u, v = heapq.heappop(heap)
              if v in seen:
                  continue
              seen.add(v)
              total += w
              edges.append((u, v, w))
              for x, wx in graph[v]:
                  if x not in seen:
                      heapq.heappush(heap, (wx, v, x))
          return total, edges


      def prim(graph, start):
          return _grow(graph, start, set())


      def network_cost(graph):
          seen, cost = set(), 0
          for v in graph:
              if v not in seen:
                  cost += _grow(graph, v, seen)[0]
          return cost


      def bottleneck(graph, a, b):
          if a == b:
              return 0
          _, edges = prim(graph, a)
          tree = {}
          for u, v, w in edges:
              tree.setdefault(u, []).append((v, w))
              tree.setdefault(v, []).append((u, w))
          stack = [(a, 0)]
          visited = {a}
          while stack:
              node, worst = stack.pop()
              if node == b:
                  return worst
              for nxt, w in tree.get(node, []):
                  if nxt not in visited:
                      visited.add(nxt)
                      stack.append((nxt, max(worst, w)))
          return None
    explanation: |
      The minimum spanning tree has a surprising extra property: for any two vertices, the path between them *in the MST* also minimises the heaviest edge among all possible routes (the minimax path). That makes MSTs useful for questions such as "what is the narrowest road I must use on the best route?". The random test confirms that Prim and Kruskal agree on the total weight.

  - id: redundant
    title: Redundant links and cycles
    difficulty: 2
    prompt: |
      A network is built by adding links one at a time. Write:

      - `first_redundant(n, links)`: `links` is a list of `(a, b)` pairs on vertices `0..n-1`. Return the first link that joins two vertices that were **already connected** (it closes a cycle), or `None` if no link does.
      - `components_over_time(n, links)`: the list of the number of connected components after each link is added (so it has `len(links)` entries).
      - `has_cycle(n, links)`: whether the undirected graph made of all the links contains a cycle.
    starter: |
      def first_redundant(n, links):
          pass


      def components_over_time(n, links):
          pass


      def has_cycle(n, links):
          pass
    tests:
      - name: redundant
        code: |
          assert first_redundant(4, [(0, 1), (1, 2), (2, 3), (3, 0)]) == (3, 0)
          assert first_redundant(3, [(0, 1), (1, 2)]) is None
          assert first_redundant(3, [(0, 1), (0, 1)]) == (0, 1)
          assert first_redundant(2, []) is None
      - name: components
        code: |
          assert components_over_time(5, [(0, 1), (2, 3), (1, 3), (0, 2), (3, 4)]) == [4, 3, 2, 2, 1]
          assert components_over_time(3, []) == []
      - name: cycle
        code: |
          assert has_cycle(3, [(0, 1), (1, 2), (2, 0)]) is True
          assert has_cycle(4, [(0, 1), (2, 3)]) is False
          assert has_cycle(2, [(0, 1), (1, 0)]) is True
          assert has_cycle(1, []) is False
          big = [(i, i + 1) for i in range(99999)]
          assert has_cycle(100000, big) is False
    hints:
      - "Process each link with union-find. If `find(a) == find(b)` already, that link closes a cycle."
      - "Count components starting from `n`; subtract 1 for every successful merge."
    solution: |
      def _find(parent, x):
          while parent[x] != x:
              parent[x] = parent[parent[x]]
              x = parent[x]
          return x


      def first_redundant(n, links):
          parent = list(range(n))
          for a, b in links:
              ra, rb = _find(parent, a), _find(parent, b)
              if ra == rb:
                  return (a, b)
              parent[ra] = rb
          return None


      def components_over_time(n, links):
          parent = list(range(n))
          count, out = n, []
          for a, b in links:
              ra, rb = _find(parent, a), _find(parent, b)
              if ra != rb:
                  parent[ra] = rb
                  count -= 1
              out.append(count)
          return out


      def has_cycle(n, links):
          return first_redundant(n, links) is not None
    explanation: |
      Union-find answers "are these already connected?" in nearly constant time, so cycle detection in an undirected graph is one pass over the edges. The same pattern is at the heart of Kruskal's algorithm: an edge is useful exactly when it is not redundant.

commonMistakes:
  - title: Confusing the MST with the shortest-path tree
    explanation: |
      The MST minimises total weight of the whole network. Shortest paths from a source minimise each individual distance. The trees can be different.
  - title: Forgetting that a graph may be disconnected
    explanation: |
      A spanning tree exists only for a connected graph. Otherwise Kruskal and Prim from one vertex give a spanning forest or just one component. Check the number of chosen edges against V − 1.
  - title: Using Prim's priority like Dijkstra's
    explanation: |
      In Prim the heap key is the edge weight alone. Adding the distance travelled so far turns it into Dijkstra and gives a different tree.
  - title: Union-find without compression or size
    explanation: |
      A naive union-find can degrade into a long chain, making each find O(n). Add path compression and union by size.
  - title: Comparing groups by find on the stale parent
    explanation: |
      Always compare roots (`find(a) == find(b)`), never `parent[a] == parent[b]`: parents change as trees are merged and compressed.

summary:
  - "A **spanning tree** connects all V vertices with V − 1 edges and no cycle; a **minimum spanning tree** has the smallest total weight."
  - "The **cut property** says the cheapest edge crossing any cut belongs to some MST, so greedy choices are safe."
  - "**Union-find** supports `find` and `union` in almost constant time with **path compression** and **union by size**."
  - "**Kruskal**: sort edges, add each one that joins two different groups. O(E log E)."
  - "**Prim**: grow one tree from a start vertex, always taking the cheapest edge leaving it. O(E log V). It resembles Dijkstra, but the key is the edge weight alone."
  - "Uses: network design, clustering (stop Kruskal at k groups), cycle detection, and bottleneck (minimax) paths."
