starter: |
  # Unit 8 project: Route Planner
  import heapq

  INF = float("inf")


  class UnionFind:
      """Groups of towns. find(x) gives a group's root; union(a, b) merges and returns True if they were separate."""

      def __init__(self, items):
          self.parent = {x: x for x in items}
          self.size = {x: 1 for x in items}

      def find(self, x):
          pass

      def union(self, a, b):
          return False


  def build_graph(roads):
      """roads is a list of (town, town, km). Returns {town: [(neighbour, km), ...]} with both directions."""
      return {}


  def shortest_route(graph, start, goal):
      """Dijkstra. Returns (km, [towns]) or (INF, None) when there is no route."""
      return INF, None


  def cheapest_network(roads):
      """Kruskal. Returns (total_km, kept_roads) with each road as (a, b, km), a < b."""
      return 0, []


  def best_plan(sights, hours):
      """0/1 knapsack. sights is a list of (name, hours, score). Returns (score, sorted names)."""
      return 0, []


  def process(text):
      """Run every command in text and return the output lines."""
      return []


  def main():
      with open("map.txt") as f:
          for line in process(f.read()):
              print(line)


  main()
tests:
- name: UnionFind joins and finds
  code: |
    uf = UnionFind(["a", "b", "c", "d"])
    assert uf.find("a") != uf.find("b")
    assert uf.union("a", "b") is True and uf.union("b", "a") is False
    assert uf.find("a") == uf.find("b")
    assert uf.union("c", "d") is True and uf.union("a", "d") is True
    assert len({uf.find(x) for x in "abcd"}) == 1
- name: UnionFind is fast
  code: |
    import time
    n = 100000
    uf = UnionFind(range(n))
    t = time.time()
    for i in range(n - 1):
        uf.union(i, i + 1)
    assert all(uf.find(i) == uf.find(0) for i in range(0, n, 97))
    assert time.time() - t < 4, "Too slow: use path compression and union by size"
- name: build_graph is two-way
  code: |
    g = build_graph([("a", "b", 3), ("b", "c", 4)])
    assert sorted(g["b"]) == [("a", 3), ("c", 4)]
    assert g["a"] == [("b", 3)] and g["c"] == [("b", 4)]
    assert build_graph([]) == {}
- name: shortest_route finds the cheapest road
  code: |
    g = build_graph([("A", "B", 4), ("A", "C", 1), ("C", "B", 2), ("D", "E", 1)])
    assert shortest_route(g, "A", "B") == (3, ["A", "C", "B"])
    assert shortest_route(g, "A", "A") == (0, ["A"])
    assert shortest_route(g, "A", "D") == (INF, None)
    assert shortest_route(g, "A", "nowhere") == (INF, None)
    assert shortest_route(g, "nowhere", "A") == (INF, None)
- name: shortest_route uses a heap and scales
  code: |
    import random, time
    assert "heappush" in source and "heappop" in source, "Use heapq for Dijkstra"
    rng = random.Random(3)
    n = 20000
    roads = [(i, rng.randrange(n), rng.randint(1, 20)) for i in range(n) for _ in range(3)]
    roads = [(a, b, w) for a, b, w in roads if a != b]
    g = build_graph(roads)
    t = time.time()
    km, path = shortest_route(g, 0, n - 1)
    assert time.time() - t < 4, "Too slow"
    if path is not None:
        assert path[0] == 0 and path[-1] == n - 1
        weight = {}
        for a, b, w in roads:
            weight[(a, b)] = min(w, weight.get((a, b), 99))
            weight[(b, a)] = min(w, weight.get((b, a), 99))
        assert sum(weight[(a, b)] for a, b in zip(path, path[1:])) == km
- name: shortest_route matches brute force
  code: |
    import random
    rng = random.Random(4)
    def brute(roads, s, t):
        towns = sorted({x for a, b, _ in roads for x in (a, b)})
        d = {x: INF for x in towns}
        d[s] = 0
        for _ in range(len(towns)):
            for a, b, w in roads:
                if d[a] + w < d[b]: d[b] = d[a] + w
                if d[b] + w < d[a]: d[a] = d[b] + w
        return d[t]
    for _ in range(60):
        n = rng.randint(2, 8)
        roads = [(rng.randrange(n), rng.randrange(n), rng.randint(1, 9)) for _ in range(rng.randint(1, 14))]
        roads = [r for r in roads if r[0] != r[1]]
        if not roads:
            continue
        g = build_graph(roads)
        a, b = rng.choice(sorted(g)), rng.choice(sorted(g))
        assert shortest_route(g, a, b)[0] == brute(roads, a, b), roads
- name: cheapest_network builds a spanning tree
  code: |
    roads = [("a", "b", 1), ("b", "c", 2), ("c", "a", 4), ("d", "c", 3)]
    total, kept = cheapest_network(roads)
    assert total == 6 and kept == [("a", "b", 1), ("b", "c", 2), ("c", "d", 3)]
    assert cheapest_network([]) == (0, [])
    total, kept = cheapest_network([("y", "x", 5)])
    assert total == 5 and kept == [("x", "y", 5)]
    total, kept = cheapest_network([("a", "b", 2), ("c", "d", 3)])
    assert total == 5 and len(kept) == 2
- name: cheapest_network is minimal
  code: |
    import itertools, random
    rng = random.Random(8)
    for _ in range(40):
        n = rng.randint(2, 6)
        roads = [(chr(97 + u), chr(97 + v), rng.randint(1, 9)) for u in range(n) for v in range(u + 1, n) if rng.random() < 0.7]
        towns = {x for a, b, _ in roads for x in (a, b)}
        if not roads:
            continue
        best = None
        for sub in itertools.combinations(roads, len(towns) - 1):
            uf = UnionFind(towns)
            for a, b, _ in sub:
                uf.union(a, b)
            if len({uf.find(t) for t in towns}) == 1:
                cost = sum(r[2] for r in sub)
                best = cost if best is None else min(best, cost)
        if best is not None:
            assert cheapest_network(roads)[0] == best, roads
- name: best_plan chooses the best sights
  code: |
    sights = [("Castle", 3, 8), ("Museum", 2, 5), ("Market", 1, 3), ("Abbey", 4, 9), ("Gardens", 2, 4)]
    assert best_plan(sights, 6) == (16, ["Castle", "Market", "Museum"])
    assert best_plan(sights, 0) == (0, [])
    assert best_plan(sights, 10) == (25, ["Abbey", "Castle", "Market", "Museum"])
    assert best_plan([], 5) == (0, [])
    assert best_plan([("Big", 9, 100)], 8) == (0, [])
    greedy_trap = [("a", 10, 60), ("b", 20, 100), ("c", 30, 120)]
    assert best_plan(greedy_trap, 50) == (220, ["b", "c"])
- name: best_plan matches brute force
  code: |
    import itertools, random
    rng = random.Random(6)
    for _ in range(60):
        sights = [(chr(97 + i), rng.randint(1, 6), rng.randint(1, 15)) for i in range(rng.randint(0, 7))]
        hours = rng.randint(0, 15)
        best = max(sum(s[2] for s in c) for r in range(len(sights) + 1) for c in itertools.combinations(sights, r) if sum(s[1] for s in c) <= hours)
        score, names = best_plan(sights, hours)
        assert score == best
        chosen = [s for s in sights if s[0] in names]
        assert sum(s[2] for s in chosen) == score and sum(s[1] for s in chosen) <= hours
- name: process handles each command
  code: |
    text = "road a b 4\nroad b c 1\nroad a c 9\nsight s 2 5\nroute a c\nroute a q\nnetwork\nplan 3\n"
    assert process(text) == ["Route a to c: 5 km via a > b > c", "No route from a to q", "Network: 2 roads, 5 km; closing the other 1 roads saves 9 km", "Plan for 3 hours: s (score 5)"]
    assert process("# nothing here\n\n") == []
- name: main prints the session
  code: |
    lines = output.strip().splitlines()
    expected = 'Route Ayr to Goole: 22 km via Ayr > Derby > Frome > Goole\nRoute Crewe to Frome: 13 km via Crewe > Eton > Frome\nRoute Ayr to Ayr: 0 km via Ayr\nNo route from Ayr to Zed\nNetwork: 6 roads, 39 km; closing the other 5 roads saves 51 km\nPlan for 6 hours: Castle, Market, Museum (score 16)\nPlan for 0 hours: nothing (score 0)\nPlan for 10 hours: Abbey, Castle, Market, Museum (score 25)'.splitlines()
    assert lines == expected, "Output differs. First difference: " + next((f"got {a!r}, expected {b!r}" for a, b in zip(lines, expected) if a != b), f"got {len(lines)} lines, expected {len(expected)}")
solution: |
  # Unit 8 project: Route Planner
  import heapq

  INF = float("inf")


  class UnionFind:
      def __init__(self, items):
          self.parent = {x: x for x in items}
          self.size = {x: 1 for x in items}

      def find(self, x):
          while self.parent[x] != x:
              self.parent[x] = self.parent[self.parent[x]]
              x = self.parent[x]
          return x

      def union(self, a, b):
          ra, rb = self.find(a), self.find(b)
          if ra == rb:
              return False
          if self.size[ra] < self.size[rb]:
              ra, rb = rb, ra
          self.parent[rb] = ra
          self.size[ra] += self.size[rb]
          return True


  def build_graph(roads):
      """roads is a list of (town, town, km). Returns {town: [(neighbour, km), ...]}."""
      graph = {}
      for a, b, km in roads:
          graph.setdefault(a, []).append((b, km))
          graph.setdefault(b, []).append((a, km))
      return graph


  def shortest_route(graph, start, goal):
      """Dijkstra. Returns (km, [towns]) or (INF, None) when there is no route."""
      if start not in graph or goal not in graph:
          return INF, None
      dist = {town: INF for town in graph}
      parent = {start: None}
      dist[start] = 0
      heap = [(0, start)]
      while heap:
          d, u = heapq.heappop(heap)
          if d > dist[u]:
              continue
          if u == goal:
              break
          for v, km in graph[u]:
              if d + km < dist[v]:
                  dist[v] = d + km
                  parent[v] = u
                  heapq.heappush(heap, (dist[v], v))
      if dist[goal] == INF:
          return INF, None
      path, town = [], goal
      while town is not None:
          path.append(town)
          town = parent[town]
      return dist[goal], path[::-1]


  def cheapest_network(roads):
      """Kruskal. Returns (total_km, kept_roads) with each road as (a, b, km), a < b."""
      towns = {t for a, b, _ in roads for t in (a, b)}
      groups = UnionFind(towns)
      kept, total = [], 0
      ordered = sorted(((km, min(a, b), max(a, b)) for a, b, km in roads))
      for km, a, b in ordered:
          if groups.union(a, b):
              kept.append((a, b, km))
              total += km
      return total, kept


  def best_plan(sights, hours):
      """0/1 knapsack. sights is a list of (name, hours, score). Returns (score, sorted names)."""
      n = len(sights)
      best = [[0] * (hours + 1) for _ in range(n + 1)]
      for i in range(1, n + 1):
          _, cost, score = sights[i - 1]
          for h in range(hours + 1):
              best[i][h] = best[i - 1][h]
              if cost <= h:
                  best[i][h] = max(best[i][h], best[i - 1][h - cost] + score)
      chosen, h = [], hours
      for i in range(n, 0, -1):
          if best[i][h] != best[i - 1][h]:
              chosen.append(sights[i - 1][0])
              h -= sights[i - 1][1]
      return best[n][hours], sorted(chosen)


  def process(text):
      """Run every command in text and return the output lines."""
      roads, sights, commands = [], [], []
      for line in text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          words = line.split()
          if words[0] == "road":
              roads.append((words[1], words[2], int(words[3])))
          elif words[0] == "sight":
              sights.append((words[1], int(words[2]), int(words[3])))
          else:
              commands.append(words)
      graph = build_graph(roads)
      out = []
      for words in commands:
          if words[0] == "route":
              km, path = shortest_route(graph, words[1], words[2])
              if path is None:
                  out.append(f"No route from {words[1]} to {words[2]}")
              else:
                  out.append(f"Route {words[1]} to {words[2]}: {km} km via {' > '.join(path)}")
          elif words[0] == "network":
              total, kept = cheapest_network(roads)
              everything = sum(km for _, _, km in roads)
              closable = len(roads) - len(kept)
              out.append(f"Network: {len(kept)} roads, {total} km; closing the other {closable} roads saves {everything - total} km")
          elif words[0] == "plan":
              hours = int(words[1])
              score, names = best_plan(sights, hours)
              listing = ", ".join(names) if names else "nothing"
              out.append(f"Plan for {hours} hours: {listing} (score {score})")
      return out


  def main():
      with open("map.txt") as f:
          for line in process(f.read()):
              print(line)


  main()
stretch:
- Add a `via TOWN` option to `route` that forces the journey to pass through a given town (two Dijkstra runs).
- Print the list of roads that could be closed by name, using the roads `cheapest_network` did **not** keep.
- Add a `farthest TOWN` command that reports the town with the longest shortest route from the given one.
- Allow a one-way road with a `oneway` line, and see which algorithms still work.
- 'Add an `unbounded` plan where a sight can be visited several times (the unbounded knapsack: loop the hours upward).'
