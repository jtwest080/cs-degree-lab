title: Route Planner
brief: |
  You are building the planner for a county **road map**. It answers three questions a driver or a council might ask, and each one needs a different algorithm from this unit:

  - **What is the quickest way from one town to another?** Dijkstra's algorithm with a heap (Lesson 8.8).
  - **Which roads must be kept so that every town is still connected as cheaply as possible?** Kruskal's minimum spanning tree with your own union-find (Lesson 8.9).
  - **Which sights can a visitor fit into a given number of hours for the highest total score?** The 0/1 knapsack with dynamic programming (Lesson 8.7).

  The map and the questions are in `map.txt` (created for you each time you run). Blank lines and lines starting with `#` are ignored. The lines are:

  - `road TOWN TOWN KM`: a two-way road.
  - `sight NAME HOURS SCORE`: something to visit.
  - `route FROM TO`, `network` and `plan HOURS`: the questions.

  **Exact requirements** (the tests check each function on its own, including random and large cases):

  - `UnionFind(items)`: `find(x)` returns the root of `x`'s group using **path compression**; `union(a, b)` merges two groups **by size** and returns `True`, or returns `False` if they were already one group. Use the `parent` and `size` dictionaries provided.
  - `build_graph(roads)`: from a list of `(town, town, km)` build `{town: [(neighbour, km), ...]}` with each road stored **in both directions**.
  - `shortest_route(graph, start, goal)`: Dijkstra with `heapq`. Return `(km, [towns from start to goal])`, or `(INF, None)` if there is no route or either town is not on the map. Skip stale heap entries.
  - `cheapest_network(roads)`: Kruskal's algorithm. Sort the roads by `(km, first town, second town)` with the two town names in alphabetical order, keep each road that joins two different groups, and return `(total_km, kept_roads)` where each kept road is `(a, b, km)` with `a < b`, in the order kept. For a map that isn't connected this is a spanning forest.
  - `best_plan(sights, hours)`: the 0/1 knapsack over `(name, hours, score)` triples. Return `(best_score, sorted list of names)`. Rebuild the chosen names by tracing back through the table.
  - `process(text)` carries out the commands in the text and returns the output lines. The wording is in the expected output below.
  - `main()` prints every line of `process` for `map.txt`:

    ```text
    Route Ayr to Goole: 22 km via Ayr > Derby > Frome > Goole
    Route Crewe to Frome: 13 km via Crewe > Eton > Frome
    Route Ayr to Ayr: 0 km via Ayr
    No route from Ayr to Zed
    Network: 6 roads, 39 km; closing the other 5 roads saves 51 km
    Plan for 6 hours: Castle, Market, Museum (score 16)
    Plan for 0 hours: nothing (score 0)
    Plan for 10 hours: Abbey, Castle, Market, Museum (score 25)
    ```

    The last line of the program calls `main()`.
prelude: |
  # Creates map.txt fresh before every run.
  with open("map.txt", "w") as _f:
      _f.write("# The county map\nroad Ayr Bath 7\nroad Ayr Derby 5\nroad Bath Crewe 8\nroad Bath Derby 9\nroad Bath Eton 7\nroad Crewe Eton 5\nroad Derby Eton 15\nroad Derby Frome 6\nroad Eton Frome 8\nroad Eton Goole 9\nroad Frome Goole 11\n\nsight Castle 3 8\nsight Museum 2 5\nsight Market 1 3\nsight Abbey 4 9\nsight Gardens 2 4\n\nroute Ayr Goole\nroute Crewe Frome\nroute Ayr Ayr\nroute Ayr Zed\nnetwork\nplan 6\nplan 0\nplan 10\n")
  del _f
steps:
- title: Union-find
  body: Use the class from Lesson 8.9, but with dictionaries so towns can be any hashable value. `find` walks up `self.parent` until a town is its own parent, pointing each town it visits at its grandparent as it goes. `union` finds both roots, returns `False` if they match, and otherwise attaches the smaller group under the larger and adds the sizes.
- title: The graph
  body: Start from an empty dictionary. For each road `(a, b, km)` use `graph.setdefault(a, []).append((b, km))` and the same with `a` and `b` swapped. A town with no roads never appears, so `shortest_route` must check that both towns are in the graph before searching.
- title: Quickest route
  body: 'Follow the Dijkstra example in Lesson 8.8: a `dist` dictionary starting at infinity, a `parent` dictionary for rebuilding the path, and a heap of `(distance, town)`. When a popped distance is larger than `dist[town]` skip it. You can stop early when the goal is popped, because its distance is final then.'
- title: Cheapest network
  body: Turn each road into `(km, min(a, b), max(a, b))` and sort the list, so ties are broken by town names. Create a `UnionFind` on all the towns, and for every road in order, call `union`; if it returns `True` the road joins two separate groups, so keep it and add its kilometres.
- title: Best plan
  body: 'Build a table with a row for each sight and a column for each hour, as in Lesson 8.7. The cell is the larger of skipping the sight and taking it (its score plus the best for the remaining hours). To find which sights were chosen, walk back from the last row: a sight was taken whenever its row''s value differs from the row above.'
- title: Commands and output
  body: Go through the lines once, collecting roads, sights and commands. Build the graph once and answer the commands in order. `closing the other N roads saves K km` uses the number of roads you did **not** keep and the difference between the total length of all roads and the network's length.
