# Terms introduced in Unit 9 (Computer Systems in C). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Pointer"
    definition: "A variable that holds the memory address of another value. `*p` follows it to the value and `&x` produces the address of x."
    lesson: u9-pointers
  - term: "Address-of operator (&)"
    definition: "The unary `&` produces the memory address of a variable, giving a pointer to it."
    lesson: u9-pointers
  - term: "Dereference"
    definition: "Following a pointer to the value it points to, written `*p`. Dereferencing NULL or an invalid pointer is undefined behaviour."
    lesson: u9-pointers
  - term: "NULL pointer"
    definition: "A pointer value meaning 'points to nothing'. Check for NULL before dereferencing, and use it to mark the end of linked structures."
    lesson: u9-pointers
  - term: "Pointer arithmetic"
    definition: "Adding to or subtracting from a pointer moves it by whole elements, so `p + 1` is the next int when p is an `int *`. It is why `a[i]` means `*(a + i)`."
    lesson: u9-pointers
  - term: "Pass by value"
    definition: "C copies each argument into the function's own parameter, so changing the parameter does not change the caller's variable. Pass a pointer to let a function modify the original."
    lesson: u9-control-functions
  - term: "Output parameter"
    definition: "A pointer argument that a function writes through to give results back to its caller, such as the quotient and remainder of a division routine."
    lesson: u9-pointers
  - term: "Function prototype"
    definition: "A declaration of a function's name, parameter types and return type, so it can be called before its definition appears."
    lesson: u9-control-functions
  - term: "Static variable"
    definition: "A local variable declared `static` keeps its value between calls, because it lives in fixed storage instead of the stack frame."
    lesson: u9-control-functions
  - term: "Stack variable"
    definition: "An automatic local variable stored in a function's stack frame. It exists only until the function returns."
    lesson: u9-heap
  - term: "Null terminator"
    definition: "The character `'\\0'` that ends every C string. A string of n characters occupies n + 1 bytes."
    lesson: u9-arrays-strings
  - term: "C string"
    definition: "An array of char ended by the null terminator. Its length is found by scanning for the terminator, which is what `strlen` does."
    lesson: u9-arrays-strings
  - term: "Array decay"
    definition: "In most expressions an array name turns into a pointer to its first element, which is why arrays passed to functions lose their length."
    lesson: u9-pointers-strings
  - term: "String literal"
    definition: "Text in double quotes in the source, such as \"hello\". It is stored as read-only data, so it must not be modified through a pointer."
    lesson: u9-pointers-strings
  - term: "Buffer overflow"
    definition: "Writing past the end of an array or allocated block, which corrupts neighbouring memory. A leading cause of security vulnerabilities in C."
    lesson: u9-arrays-strings
  - term: "Struct"
    definition: "A user-defined type that groups named fields of possibly different types into one value, accessed with `.` or, through a pointer, `->`."
    lesson: u9-structs
  - term: "Arrow operator (->)"
    definition: "Shorthand for member access through a pointer: `p->field` means `(*p).field`."
    lesson: u9-structs
  - term: "Padding"
    definition: "Unused bytes the compiler inserts inside a struct so each field is aligned, which can make `sizeof` larger than the sum of the fields."
    lesson: u9-structs
  - term: "Alignment"
    definition: "The rule that a value of a given size should start at an address divisible by that size, which the hardware reads fastest."
    lesson: u9-structs
  - term: "Enumeration (enum)"
    definition: "A type with a fixed set of named integer constants, such as RED, GREEN and BLUE, used to make code self-describing."
    lesson: u9-structs
  - term: "typedef"
    definition: "A declaration that gives an existing type a new name, commonly used to avoid writing `struct` everywhere."
    lesson: u9-structs
  - term: "sizeof"
    definition: "An operator that gives the size in bytes of a type or a value. Use it to compute allocation sizes instead of hard-coding numbers."
    lesson: u9-heap
  - term: "malloc"
    definition: "A library function that reserves a block of bytes on the heap at run time and returns its address, or NULL if memory is unavailable."
    lesson: u9-heap
  - term: "calloc"
    definition: "Like malloc but takes a count and element size and fills the block with zeros."
    lesson: u9-heap
  - term: "realloc"
    definition: "Changes the size of a heap block, possibly moving it. Always use its returned address and never the old pointer."
    lesson: u9-heap
  - term: "free"
    definition: "Returns a heap block to the allocator. Every malloc needs exactly one free; freeing NULL is harmless."
    lesson: u9-heap
  - term: "Memory leak"
    definition: "Heap memory that is never freed and can no longer be reached, so it is wasted until the program ends."
    lesson: u9-heap
  - term: "Dangling pointer"
    definition: "A pointer to memory that has been freed or has gone out of scope. Using it is undefined behaviour."
    lesson: u9-heap
  - term: "Use after free"
    definition: "Reading or writing a heap block after it has been freed, which can corrupt data or crash. Setting the pointer to NULL after free helps catch it."
    lesson: u9-heap
  - term: "Double free"
    definition: "Freeing the same block twice, which corrupts the allocator's bookkeeping."
    lesson: u9-heap
  - term: "Ownership"
    definition: "The convention that decides which part of the code is responsible for freeing a block. Clear ownership prevents leaks and double frees."
    lesson: u9-heap
  - term: "AddressSanitizer"
    definition: "A compiler option (`-fsanitize=address`) that instruments a program to report overflows, leaks and use-after-free as they happen."
    lesson: u9-heap
  - term: "Hexadecimal"
    definition: "Base-16 notation using digits 0 to 9 and A to F. Each hex digit is exactly four bits, so it writes bit patterns compactly."
    lesson: u9-bits
  - term: "Bitwise operator"
    definition: "An operator that works on each bit of its operands separately: `&`, `|`, `^`, `~`, `<<` and `>>`."
    lesson: u9-bits
  - term: "Bit mask"
    definition: "A number whose 1-bits select the positions of interest, used with AND, OR and XOR to test, set, clear or toggle bits."
    lesson: u9-bits
  - term: "Bit shift"
    definition: "Moving all bits left or right by some places. A left shift by n multiplies by 2 to the power n, and a right shift divides."
    lesson: u9-bits
  - term: "Flags"
    definition: "A set of independent yes/no options packed one per bit into an integer, combined with `|` and tested with `&`."
    lesson: u9-bits
  - term: "Most significant bit"
    definition: "The leftmost bit of a value, with the highest place value. In two's complement it carries a negative weight."
    lesson: u9-bits
  - term: "Little-endian"
    definition: "A byte order that stores the least significant byte at the lowest address. Used by x86 and most ARM systems."
    lesson: u9-bits
  - term: "Big-endian"
    definition: "A byte order that stores the most significant byte first, as numbers are written. Used by many network protocols, so it is also called network byte order."
    lesson: u9-bits
  - term: "Preprocessor"
    definition: "The first stage of compiling C. It expands `#include`, `#define` and `#ifdef` as plain text before the compiler sees the code."
    lesson: u9-compilation
  - term: "Macro"
    definition: "A name defined with `#define` that the preprocessor replaces with text, optionally with arguments. Parenthesise it carefully because it does no type checking."
    lesson: u9-compilation
  - term: "Include guard"
    definition: "The `#ifndef`/`#define`/`#endif` pattern in a header that prevents it from being included twice."
    lesson: u9-compilation
  - term: "Object file"
    definition: "The output of compiling one source file: machine code plus a symbol table, with addresses of external functions left to be filled in."
    lesson: u9-compilation
  - term: "Linker"
    definition: "The tool that combines object files and libraries into an executable by matching each used symbol to its definition."
    lesson: u9-compilation
  - term: "Undefined reference"
    definition: "A linker error meaning a function or variable was declared and used but no definition was found."
    lesson: u9-compilation
  - term: "Shared library"
    definition: "A library loaded when a program starts and shared among programs (.so, .dll or .dylib), as opposed to a static library copied into the executable."
    lesson: u9-compilation
  - term: "Calling convention"
    definition: "The agreed rules for how a call passes arguments, returns values and preserves registers. On Linux x86-64 the first arguments go in rdi, rsi, rdx, rcx, r8 and r9."
    lesson: u9-compilation
  - term: "Return address"
    definition: "The address of the instruction after a call, pushed by `call` so that `ret` can jump back to the caller."
    lesson: u9-compilation
  - term: "Stack overflow"
    definition: "Running out of stack space, usually from infinite or very deep recursion."
    lesson: u9-compilation
  - term: "Program counter"
    definition: "The register holding the address of the next instruction to run. A jump is just an assignment to it."
    lesson: u9-compilation
  - term: "Virtual machine"
    definition: "A program that emulates a processor by running a fixed instruction set in software, as the JVM and WebAssembly runtimes do."
    lesson: u9-compilation
  - term: "Assembler"
    definition: "A program that translates assembly language into machine code, resolving labels into addresses."
    lesson: u9-compilation
  - term: "Undefined behavior"
    definition: "Code the C standard places no requirements on, such as overflowing a signed int or using freed memory. The compiler may assume it never happens, with unpredictable results."
    lesson: u9-hello-c
  - term: "Integer overflow"
    definition: "A result too large for its type. Unsigned types wrap around; for signed types the behaviour is undefined in C."
    lesson: u9-hello-c
  - term: "Type cast"
    definition: "An explicit conversion of a value from one type to another, written `(type)value`. It changes interpretation, not the stored bits of the source."
    lesson: u9-hello-c
  - term: "Format specifier"
    definition: "A code like `%d`, `%s` or `%x` in a printf format string saying how to print the next argument."
    lesson: u9-hello-c
  - term: "Exit status"
    definition: "The integer a program returns to the operating system. By convention 0 means success and anything else means an error."
    lesson: u9-compilation
