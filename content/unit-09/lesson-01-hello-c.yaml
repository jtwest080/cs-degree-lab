id: u9-hello-c
title: "Hello, C: Types, Sizes and printf"
minutes: 55
objective: |
  Write and run your first C programs. See how C differs from Python (compiled, statically typed, no safety net), learn the basic types and how many bytes each takes, and print values precisely with `printf`.
outcomes:
  - Explain what makes C different from Python and why systems software is still written in it
  - Read the parts of a C program, including the include line, main, statements and the return value
  - Choose between char, short, int, long, float and double, and say how many bytes each uses
  - Predict what happens when an integer goes past its largest value
  - Use printf format codes to print integers, characters, strings, decimals and hexadecimal
  - Use casts and integer division correctly

sections:
  - heading: Why learn C?
    body: |
      Python is wonderful for getting ideas working, but it hides almost everything the computer does. When you write `x = 5` in Python, an object is created somewhere in memory, a name is attached to it, and a clean-up system deletes it later, all without you seeing any of it. The Python program itself is **run by another program** (the interpreter), and that interpreter is written in **C**.

      **C** was created in the early 1970s to write the Unix operating system. It is still the language underneath Linux, Windows, macOS, most databases, web browsers, and the firmware in cars and phones. Learning it shows you what the machine is really doing:

      - **Compiled**: a C program is translated by a **compiler** into machine instructions before it runs, so there is no interpreter in the way and it can be very fast. (Lesson 9.9 follows that translation.)
      - **Statically typed**: every variable has a declared type, such as `int`, fixed when you write the program.
      - **Close to memory**: you see addresses, bytes and sizes, and you decide when memory is created and destroyed.
      - **No safety net**: C trusts you completely. Reading past the end of an array does not raise an error; it just reads whatever is in memory there. Many of the world's security bugs are exactly this.

      Everything from Units 1 to 8 still applies. This unit shows what lies beneath it.

  - heading: How C runs in this app
    body: |
      Real C is turned into a program by a compiler such as `gcc` or `clang`. To let you run C straight in the browser with nothing to install, this app uses **PicoC**, a small C interpreter. It handles the core of the language very well (everything this unit teaches), but it is not a full compiler, so a few things differ from `gcc`:

      - Always end a `printf` line with `\n`. Text without a newline at the end may not show.
      - It models a **32-bit** machine, so pointers and `long` are 4 bytes. On a modern 64-bit computer both are 8 bytes. Each lesson says when this matters.
      - A few features are missing (for example `const` on local variables, `long long`, and function pointers). Where that affects a topic, the lesson shows the real C as plain text for you to read and tells you what to expect.
      - Where real C says "undefined behaviour" (it may do anything), PicoC just does *something*. Never rely on it.

      If you later want the real thing, installing `gcc` takes a few minutes, and everything you learn here carries over directly.

  - heading: Anatomy of a C program
    body: |
      ```c
      #include <stdio.h>

      int main(void) {
          printf("Hello, C!\n");
          return 0;
      }
      ```

      - `#include <stdio.h>` asks the **preprocessor** to paste in the description of the standard input/output functions, such as `printf`, before compiling.
      - `int main(void)` is where every C program **starts**. The `int` says it returns a whole number to the operating system.
      - Curly braces `{ }` mark a block. C ignores indentation; the braces and semicolons give the structure.
      - Every **statement ends with a semicolon**.
      - `printf` prints text. `\n` is the **newline** character.
      - `return 0;` means "finished successfully". Any other number tells the operating system something went wrong (the "exit code").
      - Comments are `// to the end of the line` or `/* between these marks */`.

      In Python, `print("a")` needs no setup. In C, you must declare what you use, spell out the types, and finish with a clean return.

  - heading: Types and their sizes
    body: |
      A variable is declared with its type first: `int count = 3;`. The type decides how many **bytes** the variable occupies and how those bytes are read (Lesson 1.3).

      | Type | Typical size | Holds |
      |---|---|---|
      | `char` | 1 byte | a small integer, usually a character |
      | `short` | 2 bytes | −32,768 to 32,767 |
      | `int` | 4 bytes | about ±2.1 billion |
      | `long` | 4 or 8 bytes | at least as large as `int` |
      | `float` | 4 bytes | decimals, about 7 digits |
      | `double` | 8 bytes | decimals, about 15 digits |

      Put `unsigned` in front of an integer type to forbid negative numbers and double the positive range: an `unsigned char` holds 0 to 255. Unsigned types are used for sizes, counts, bit patterns and bytes.

      The operator **`sizeof`** tells you the size of a type or variable in bytes. In this runner `int` is 4 bytes and `long` is also 4; on a 64-bit Linux or Mac computer `long` is 8 (and on 64-bit Windows it is still 4). C only promises minimum sizes, which is why careful programs use `sizeof` rather than assuming.

      **There is no real text type.** A character such as `'A'` is simply a `char` holding the number 65 (its ASCII code, Lesson 1.3). `'A' + 1` is 66, which prints as `'B'` if you ask for a character. Strings come in Lesson 9.3.

      **There is no true/false type** in the basic language: 0 means false and any other number means true. (A comparison like `a < b` gives 1 or 0.)

  - heading: Integers wrap around
    body: |
      A 4-byte `int` holds one of only 2³² patterns, so there is a largest value, 2,147,483,647. In Python, an integer simply grows. In C, adding 1 to the largest `int` goes **around** to the most negative number, −2,147,483,648, because the bits roll over exactly as in the two's complement arithmetic of Lesson 1.3.

      Unsigned types wrap in a clean, guaranteed way: an `unsigned char` of 255 plus 1 is 0. For **signed** types, the C standard calls overflow *undefined behaviour*, meaning the compiler is free to assume it never happens, and optimised programs can behave strangely. The safe habits are: choose a type big enough for the largest value you expect; use unsigned types when you want wrap-around on purpose; and check before adding if the numbers could be huge.

      This is not a rare corner case. Overflow is behind real disasters such as the 1996 Ariane 5 rocket failure and countless security bugs.

  - heading: Printing with printf
    body: |
      `printf` takes a **format string** with placeholders, followed by the values to put in them. Each placeholder starts with `%`:

      | Code | Prints | Example |
      |---|---|---|
      | `%d` | a signed integer | `printf("%d", 42)` gives `42` |
      | `%u` | an unsigned integer | |
      | `%c` | a character | `printf("%c", 65)` gives `A` |
      | `%s` | a string | |
      | `%f` | a decimal (double) | `%.2f` gives two decimal places |
      | `%x` | hexadecimal | `%x` of 255 is `ff`; `%X` gives `FF` |
      | `%o` | octal | |
      | `%%` | a percent sign | |

      Between `%` and the letter you may put a **width** and flags: `%5d` pads to 5 characters on the left, `%-5d` pads on the right, `%05d` pads with zeros, and `%08x` gives 8 hex digits with leading zeros. The number of placeholders **must match** the values, and each type must match too: printing a decimal with `%d` or the other way round gives nonsense and the compiler will not stop you (good compilers warn).

  - heading: Operators, division and casts
    body: |
      C has the arithmetic operators you know: `+ - * /` and `%` for the remainder, plus `++` and `--` to add or subtract 1.

      **Integer division.** If both sides of `/` are integers, the answer is an integer with the fraction **thrown away**: `7 / 2` is 3, `-7 / 2` is −3 (C truncates towards zero; Python's `//` would give −4). To get a decimal answer at least one side must be a decimal: `7.0 / 2` is 3.5.

      A **cast** converts a value to another type: `(double)a / b` first turns `a` into a double, so the division keeps its fraction. Write the cast *before* dividing; `(double)(a / b)` has already lost the fraction by the time the cast happens.

      Comparison (`== != < > <= >=`) and logic (`&& || !`) operators give 1 or 0. Take care: `=` **assigns** and `==` **compares**. Writing `if (x = 5)` assigns 5 to x and is always true, a classic and nasty mistake that the compiler accepts without complaint.

examples:
  - title: Hello, C
    intro: "The smallest complete program, and a few kinds of output."
    code: |
      #include <stdio.h>

      int main(void) {
          printf("Hello, C!\n");
          int apples = 3;
          double price = 0.5;
          printf("%d apples cost %.2f\n", apples, apples * price);
          return 0;
      }
    output: |
      Hello, C!
      3 apples cost 1.50
    lines:
      - line: 1
        note: "Brings in the declaration of printf."
      - line: 3
        note: "Execution starts at main. It returns an int exit code."
      - line: 4
        note: "\\n ends the line. Without it the next output would continue on the same line."
      - line: 5
        note: "Declare a variable by writing its type first."
      - line: 7
        note: "%d takes the int, %.2f takes the double (apples is converted to double for the multiplication) and prints two decimals."
      - line: 8
        note: "0 tells the operating system the program succeeded."
  - title: How big is everything?
    intro: "sizeof reports the bytes used by each type in this runner."
    code: |
      #include <stdio.h>

      int main(void) {
          printf("char   %d\n", (int)sizeof(char));
          printf("short  %d\n", (int)sizeof(short));
          printf("int    %d\n", (int)sizeof(int));
          printf("double %d\n", (int)sizeof(double));
          int x = 7;
          printf("x      %d\n", (int)sizeof(x));
          return 0;
      }
    output: |
      char   1
      short  2
      int    4
      double 8
      x      4
    lines:
      - line: 4
        note: "sizeof gives a size_t (an unsigned number type). We cast it to int so %d matches."
      - line: 9
        note: "sizeof also works on a variable: it is the size of its type, not its value."
  - title: Wrap-around
    intro: "Unsigned values wrap cleanly; a signed int rolls over to a negative number."
    code: |
      #include <stdio.h>

      int main(void) {
          unsigned char small = 250;
          int i;
          for (i = 0; i < 8; i++) {
              small = small + 1;
              printf("%d ", small);
          }
          printf("\n");
          int big = 2147483647;
          big = big + 1;
          printf("%d\n", big);
          return 0;
      }
    output: |
      251 252 253 254 255 0 1 2 
      -2147483648
    lines:
      - line: 4
        note: "An unsigned char holds 0 to 255."
      - line: 7
        note: "After 255 the next value wraps to 0: the arithmetic is done modulo 256."
      - line: 13
        note: "Signed overflow is undefined behaviour in real C. Most machines wrap like this, but you must not rely on it."
  - title: Formatting, characters and division
    intro: "The same value in several formats, a char used as a number, and integer versus decimal division."
    code: |
      #include <stdio.h>

      int main(void) {
          int n = 255;
          printf("[%d] [%5d] [%-5d] [%05d]\n", n, n, n, n);
          printf("%x %X %o %08x\n", n, n, n, n);
          char c = 'A';
          printf("%c %d %c\n", c, c, c + 2);
          int a = 7, b = 2;
          printf("%d %d %.2f %.2f\n", a / b, a % b, (double)a / b, (double)(a / b));
          printf("%d %d\n", -7 / 2, -7 % 3);
          return 0;
      }
    output: |
      [255] [  255] [255  ] [00255]
      ff FF 377 000000ff
      A 65 C
      3 1 3.50 3.00
      -3 -1
    lines:
      - line: 5
        note: "Plain, padded left to width 5, padded right, and zero padded."
      - line: 6
        note: "Hexadecimal in lower and upper case, octal, and 8 digits with zeros."
      - line: 8
        note: "The same char printed as a character, as its ASCII code, and one letter later."
      - line: 10
        note: "Integer division and remainder, then a decimal division, then a cast placed too late (the fraction is already lost)."
      - line: 11
        note: "C truncates towards zero, and the remainder takes the sign of the left number."

playground:
  prompt: |
    Change the numbers and formats. Try `%5.1f`, print a char with `%d`, store 300 in an `unsigned char`, or print `sizeof(double) * 8` to see how many bits a double has.
  code: |
    #include <stdio.h>

    int main(void) {
        double pi = 3.14159265;
        printf("%f %.3f %8.2f|\n", pi, pi, pi);
        unsigned char u = 300;
        printf("%d\n", u);
        printf("%d bits\n", (int)sizeof(double) * 8);
        return 0;
    }

exercises:
  - id: temperature-table
    title: A temperature table
    difficulty: 1
    prompt: |
      Write a program whose `main` prints a table converting Celsius to Fahrenheit for 0, 10, 20, 30 and 40 degrees using a loop. Each line must look exactly like `  0 C =  32.0 F`: the Celsius value right-aligned in a width of 3, then ` C = `, then the Fahrenheit value with one decimal in a width of 5, then ` F`. The formula is `F = C * 9 / 5 + 32`, so use `9.0 / 5` or a cast to avoid integer division.
    starter: |
      #include <stdio.h>

      int main(void) {
          // Print five lines with a for loop.
          return 0;
      }
    tests:
      - name: five lines
        code: |
          const lines = output.trimEnd().split("\n");
          if (lines.length !== 5) throw new Error(`Expected 5 lines, got ${lines.length}`);
      - name: exact table
        code: |
          const want = ["  0 C =  32.0 F", " 10 C =  50.0 F", " 20 C =  68.0 F", " 30 C =  86.0 F", " 40 C = 104.0 F"].join("\n");
          if (output.trimEnd() !== want) throw new Error("Output should be:\n" + want + "\nbut was:\n" + output);
      - name: uses a loop
        code: |
          if (!/\bfor\b|\bwhile\b/.test(source)) throw new Error("Use a loop (for or while).");
    hints:
      - "`for (int c = 0; c <= 40; c += 10) { ... }`"
      - "The format string is `\"%3d C = %5.1f F\\n\"`. The `%5.1f` means width 5, one decimal."
      - "`c * 9.0 / 5 + 32` is a double. Passing an int where `%f` is expected would print nonsense."
    solution: |
      #include <stdio.h>

      int main(void) {
          for (int c = 0; c <= 40; c += 10) {
              printf("%3d C = %5.1f F\n", c, c * 9.0 / 5 + 32);
          }
          return 0;
      }
    explanation: |
      `%3d` right-aligns the integer in 3 columns and `%5.1f` gives a decimal 5 wide with one digit after the point. Using `9.0` makes the multiplication happen in decimals; with `9 / 5` both sides are integers and the result would be 1, giving wrong temperatures.

  - id: digit-sum
    title: Digit sum with % and /
    difficulty: 2
    prompt: |
      Write `int digit_sum(int n)` that returns the sum of the digits of a non-negative number (`digit_sum(1234)` is 10, `digit_sum(0)` is 0) using only `%` and `/` in a loop, then `int digit_count(int n)` that returns how many digits it has (`digit_count(0)` is 1). Your `main` can test them however you like.
    starter: |
      #include <stdio.h>

      int digit_sum(int n) {
          return 0;
      }

      int digit_count(int n) {
          return 0;
      }

      int main(void) {
          printf("%d %d\n", digit_sum(1234), digit_count(1234));
          return 0;
      }
    tests:
      - name: digit_sum
        append: |
          int main(void) {
              printf("%d %d %d %d\n", digit_sum(1234), digit_sum(0), digit_sum(9), digit_sum(2147483647));
              return 0;
          }
        code: |
          if (output.trim() !== "10 0 9 46") throw new Error(`Expected "10 0 9 46" but got "${output.trim()}"`);
      - name: digit_count
        append: |
          int main(void) {
              printf("%d %d %d %d\n", digit_count(0), digit_count(7), digit_count(10), digit_count(123456789));
              return 0;
          }
        code: |
          if (output.trim() !== "1 1 2 9") throw new Error(`Expected "1 1 2 9" but got "${output.trim()}"`);
      - name: no strings
        code: |
          if (/sprintf|itoa|strlen/.test(source)) throw new Error("Use % and / only, not string functions.");
    hints:
      - "`n % 10` is the last digit; `n / 10` removes it."
      - "Loop `while (n > 0)`, adding `n % 10` to a total each time."
      - "`digit_count(0)` must be 1, but a `while (n > 0)` loop runs zero times for 0, so handle that case first."
    solution: |
      #include <stdio.h>

      int digit_sum(int n) {
          int total = 0;
          while (n > 0) {
              total += n % 10;
              n /= 10;
          }
          return total;
      }

      int digit_count(int n) {
          int count = 1;
          while (n >= 10) {
              count++;
              n /= 10;
          }
          return count;
      }

      int main(void) {
          printf("%d %d\n", digit_sum(1234), digit_count(1234));
          return 0;
      }
    explanation: |
      Integer division by 10 chops off the last digit and remainder by 10 extracts it, the same trick as writing a number in base 10 by hand (Lesson 1.3). The tests replace your `main` with their own, so your functions are what is checked. Parameters in C are copies, so changing `n` inside the function does not change the caller's number.

  - id: shift-letters
    title: Characters are numbers
    difficulty: 2
    prompt: |
      Write `char shift(char c, int k)`: if `c` is a lowercase letter `'a'` to `'z'`, return the letter `k` places later in the alphabet, wrapping from `'z'` back to `'a'` (`k` is between 0 and 25); an uppercase letter is shifted within `'A'` to `'Z'` the same way; any other character is returned unchanged. For example `shift('x', 3)` is `'a'`, `shift('B', 1)` is `'C'` and `shift('!', 5)` is `'!'`.
    starter: |
      #include <stdio.h>

      char shift(char c, int k) {
          return c;
      }

      int main(void) {
          printf("%c%c%c\n", shift('x', 3), shift('B', 1), shift('!', 5));
          return 0;
      }
    tests:
      - name: lowercase
        append: |
          int main(void) {
              printf("%c%c%c%c\n", shift('a', 0), shift('a', 1), shift('x', 3), shift('z', 25));
              return 0;
          }
        code: |
          if (output.trim() !== "abay") throw new Error(`Expected "abay" but got "${output.trim()}"`);
      - name: uppercase
        append: |
          int main(void) {
              printf("%c%c%c\n", shift('B', 1), shift('Z', 1), shift('M', 13));
              return 0;
          }
        code: |
          if (output.trim() !== "CAZ") throw new Error(`Expected "CAZ" but got "${output.trim()}"`);
      - name: others unchanged
        append: |
          int main(void) {
              printf("%c%c%c\n", shift('!', 5), shift('7', 3), shift(' ', 9));
              return 0;
          }
        code: |
          if (output !== "!7 \n") throw new Error(`Expected "!7 " but got "${output}"`);
    hints:
      - "A letter's position in the alphabet is `c - 'a'`, a number from 0 to 25."
      - "Add `k`, take `% 26`, and add `'a'` back."
      - "Write one branch for `c >= 'a' && c <= 'z'` and one for uppercase."
    solution: |
      #include <stdio.h>

      char shift(char c, int k) {
          if (c >= 'a' && c <= 'z') {
              return 'a' + (c - 'a' + k) % 26;
          }
          if (c >= 'A' && c <= 'Z') {
              return 'A' + (c - 'A' + k) % 26;
          }
          return c;
      }

      int main(void) {
          printf("%c%c%c\n", shift('x', 3), shift('B', 1), shift('!', 5));
          return 0;
      }
    explanation: |
      Because a `char` is just a small number, comparing and subtracting characters works directly: `c - 'a'` is the letter's index. Doing the arithmetic on indexes, wrapping with `%`, and converting back is the Caesar cipher. This is the same idea as Python's `ord` and `chr`, except C needs neither: it never distinguished characters from numbers in the first place.

  - id: fix-average
    title: Averages and integer division
    difficulty: 2
    prompt: |
      The function below is meant to return the average of three whole numbers as a decimal, but it always loses the fraction. Fix it so `average3(1, 2, 4)` returns 2.333... and `average3(5, 5, 5)` returns 5.0. Then write `double percent(int part, int whole)` returning `part` as a percentage of `whole` (for example `percent(1, 8)` is 12.5), and 0.0 if `whole` is 0.
    starter: |
      #include <stdio.h>

      double average3(int a, int b, int c) {
          return (a + b + c) / 3;
      }

      double percent(int part, int whole) {
          return 0.0;
      }

      int main(void) {
          printf("%.3f %.1f\n", average3(1, 2, 4), percent(1, 8));
          return 0;
      }
    tests:
      - name: average
        append: |
          int main(void) {
              printf("%.3f %.3f %.3f\n", average3(1, 2, 4), average3(5, 5, 5), average3(0, 0, 1));
              return 0;
          }
        code: |
          if (output.trim() !== "2.333 5.000 0.333") throw new Error(`Expected "2.333 5.000 0.333" but got "${output.trim()}"`);
      - name: percent
        append: |
          int main(void) {
              printf("%.1f %.1f %.1f %.1f\n", percent(1, 8), percent(3, 4), percent(5, 0), percent(0, 9));
              return 0;
          }
        code: |
          if (output.trim() !== "12.5 75.0 0.0 0.0") throw new Error(`Expected "12.5 75.0 0.0 0.0" but got "${output.trim()}"`);
    hints:
      - "The division `(a + b + c) / 3` has two integers, so it truncates before the result is turned into a double."
      - "Divide by `3.0`, or cast the sum with `(double)`."
      - "For `percent`, check `whole == 0` first, then `100.0 * part / whole`."
    solution: |
      #include <stdio.h>

      double average3(int a, int b, int c) {
          return (a + b + c) / 3.0;
      }

      double percent(int part, int whole) {
          if (whole == 0) {
              return 0.0;
          }
          return 100.0 * part / whole;
      }

      int main(void) {
          printf("%.3f %.1f\n", average3(1, 2, 4), percent(1, 8));
          return 0;
      }
    explanation: |
      The type of an expression decides which division is used, and the destination does not matter. Returning a `double` from an integer division does not bring back the fraction that integer division already discarded. Writing `100.0 * part` first makes the whole calculation use decimals and also avoids overflow for large values of `part`.

commonMistakes:
  - title: Forgetting the semicolon or the newline
    explanation: |
      A missing `;` is a compile error and the message often points to the *next* line. A missing `\n` runs your output together or, in this runner, hides the last line.
  - title: Using = where you meant ==
    explanation: |
      `if (x = 5)` assigns 5 and is always true. Many programmers write the constant first (`if (5 == x)`) so a slip becomes an error.
  - title: Integer division where a decimal was wanted
    explanation: |
      `1 / 2` is 0. Make at least one side a decimal (`1.0 / 2`) or cast before dividing.
  - title: Mismatched printf codes
    explanation: |
      `printf("%d", 2.5)` prints garbage, and `printf("%f", 3)` does too. The format code must match the real type of the value.
  - title: Assuming a type has a particular size
    explanation: |
      Only `char` is guaranteed to be 1 byte. Use `sizeof` instead of writing numbers like 4 or 8 into your program.

summary:
  - "C is **compiled**, **statically typed**, close to memory and has **no safety net**. The Python interpreter itself is written in C."
  - "A program starts in `main`, ends statements with `;`, and returns 0 for success. `#include <stdio.h>` brings in `printf`."
  - "Types have sizes: `char` 1 byte, `short` 2, `int` 4, `double` 8. `sizeof` reports them. `unsigned` doubles the positive range."
  - "Integers have a fixed number of bits and **wrap around**; signed overflow is undefined behaviour in real C."
  - "A `char` is just a small number, and 0 is false while anything else is true."
  - "`printf` format codes (`%d %u %c %s %f %x %o`) must match the argument types; width and flags such as `%5d`, `%-5d`, `%05d` and `%.2f` control layout."
  - "`/` on two integers truncates; cast **before** dividing to keep the fraction. `=` assigns and `==` compares."
next: |
  So far everything has run top to bottom. Lesson 9.2 adds the **control flow and functions** that give programs structure: `if`, `switch`, loops, prototypes, scope, and how each function call gets its own **stack frame** in memory, including what happens when recursion goes too deep.

quiz:
  - type: mcq
    question: What does the compiler do that the Python interpreter does not?
    options:
      - "It translates the whole program to machine code before it runs"
      - "It runs each line as it reads it"
      - "It stores every variable as an object"
      - "It checks array bounds at run time"
    answer: 0
    explanation: "A C program is compiled ahead of time; no interpreter is needed when it runs."
  - type: mcq
    question: What is the value of 7 / 2 in C?
    options: ["3", "3.5", "4", "2"]
    answer: 0
    explanation: "Both operands are integers, so the fraction is thrown away."
  - type: mcq
    question: What happens when an unsigned char holding 255 has 1 added to it?
