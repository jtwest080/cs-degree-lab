id: u9-control-functions
title: "Control Flow, Functions and the Call Stack"
minutes: 55
objective: |
  Use C's decisions and loops, write functions with prototypes, understand scope and why arguments are **copies**, and see how every function call gets its own **stack frame** in memory, including what happens when recursion goes too deep.
outcomes:
  - Write if, else if, switch, while, do-while and for statements in C
  - Explain that 0 is false and everything else is true, and use && and || correctly
  - Declare functions with prototypes and explain why C needs them
  - Explain scope, local variables, global variables and static locals
  - Explain pass by value and why a function cannot change its caller's variable by assigning to a parameter
  - Describe a stack frame and explain what a stack overflow is

sections:
  - heading: Decisions
    body: |
      ```c
      if (score >= 90) {
          printf("A\n");
      } else if (score >= 80) {
          printf("B\n");
      } else {
          printf("C or below\n");
      }
      ```

      The condition goes in **parentheses** and there is no colon. Remember that any number can be a condition: 0 is false, everything else is true. `&&` means *and*, `||` means *or*, and `!` means *not*. Python's words `and`, `or`, `not` do not exist in C.

      **Short-circuit evaluation.** `&&` and `||` stop as soon as the answer is known. In `if (n != 0 && total / n > 5)` the division is never attempted when `n` is 0. This is guaranteed by the language and is the standard way to guard against dividing by zero or following a null pointer. (PicoC, the runner in this app, does *not* short-circuit, so a guarded division like that would crash here but is safe in real C. Run such code with a real compiler.)

      **The conditional operator** `condition ? a : b` picks one of two values: `int bigger = (a > b) ? a : b;`.

      **switch** chooses between many whole-number cases:

      ```c
      switch (grade) {
          case 'A': printf("excellent\n"); break;
          case 'B':
          case 'C': printf("fine\n"); break;
          default:  printf("unknown\n");
      }
      ```

      Each case must end with `break;` or execution **falls through** into the next case. That is sometimes useful (cases B and C share one action above) but forgetting `break` is a classic bug.

  - heading: Loops
    body: |
      C has the same three loops you know, with different spelling:

      ```c
      while (n > 0) { n = n / 2; }

      do { printf("at least once\n"); } while (again);

      for (int i = 0; i < 5; i++) { printf("%d ", i); }
      ```

      The **for** loop has three parts: *initialisation*, *condition* and *update*. `i++` means "add 1 to i". `break` leaves the loop and `continue` jumps to the next iteration. A `do-while` tests at the **end**, so the body always runs at least once.

      There is no `range()`; the for loop *is* the counting machine. Be careful with the classic off-by-one: `i < 5` runs 5 times (0 to 4) while `i <= 5` runs 6 times.

      An accidental semicolon is a famous trap: `for (i = 0; i < 3; i++);` has an **empty body**, and the block after it runs once. The compiler accepts it.

  - heading: Functions and prototypes
    body: |
      A C function states its **return type**, name and the **type of every parameter**:

      ```c
      int square(int x) {
          return x * x;
      }
      ```

      A function that returns nothing has the return type `void`. A function with no parameters is written `(void)`.

      The compiler reads a file **top to bottom** and must know a function before it is used. If `main` is at the top and calls `square` defined below it, the compiler will complain (or guess wrongly). The fix is a **prototype**, a declaration that gives the signature without the body:

      ```c
      int square(int x);          // prototype: "this exists, trust me"

      int main(void) { printf("%d\n", square(5)); return 0; }

      int square(int x) { return x * x; }
      ```

      Prototypes are why C programs have **header files** (`.h`): a header is a list of prototypes that other files include so they can call the functions. `#include <stdio.h>` is exactly that for `printf`.

      C functions return **one** value. To hand back more, use a struct (Lesson 9.6) or pointers (Lesson 9.4).

  - heading: Scope, globals and static
    body: |
      A variable declared inside a function (or inside any `{ }` block) is **local**: it exists only there. Two functions can each have a variable named `i` without clashing. Local variables are **not initialised**: until you assign them, they contain whatever happened to be left in that memory. Reading one is a bug.

      A variable declared **outside** every function is **global**. It lives for the whole run and every function can change it, which makes programs hard to reason about. Use globals sparingly.

      A local declared **`static`** keeps its value between calls but is visible only inside its function:

      ```c
      int next_id(void) {
          static int id = 0;   // set up once, before the first call
          id++;
          return id;
      }
      ```

      Each call returns 1, 2, 3, and so on. It is a global in disguise, with a smaller blast radius.

  - heading: Arguments are copies
    body: |
      C passes arguments **by value**: the function receives a **copy**. Changing the parameter changes only the copy:

      ```c
      void add_one(int n) { n = n + 1; }   // changes the copy

      int x = 5;
      add_one(x);
      // x is still 5
      ```

      This is why C needs pointers to let a function modify its caller's variable (Lesson 9.4). It matches what you saw in Python for numbers, but in C it applies to **everything**, including structs, which are copied whole (Lesson 9.6).

  - heading: The call stack
    body: |
      Where do all these copies and local variables live? In a region of memory called the **stack**. Each time a function is called, a **stack frame** is created holding that call's parameters, local variables and the place to return to. When the function returns, its frame is popped and the memory is reused.

      Calling `f`, which calls `g`, which calls `h`, builds three frames, one on top of the other. This is the call stack you saw as a stack in Lessons 7.2 and 4.5, now in real memory.

      The stack has a **fixed size**, often 8 megabytes on Linux and 1 megabyte on Windows. **Recursion** uses one frame per call, so a function that calls itself too many times, or forever, **overflows the stack**. The program is killed with a "stack overflow" or "segmentation fault". In this runner the stack is much smaller (a few hundred levels), so deep recursion fails sooner, which makes the effect easy to see.

      Frame lifetime also explains an important rule: **never return the address of a local variable.** The frame is gone when the function returns, and the memory will be reused. Lesson 9.5 returns to this.

examples:
  - title: Control flow in one program
    intro: "A function with a loop and a switch, called for several grades."
    code: |
      #include <stdio.h>

      void describe(int score) {
          char grade;
          if (score >= 90) grade = 'A';
          else if (score >= 80) grade = 'B';
          else if (score >= 70) grade = 'C';
          else grade = 'F';
          switch (grade) {
              case 'A': printf("%d: excellent\n", score); break;
              case 'B':
              case 'C': printf("%d: fine\n", score); break;
              default:  printf("%d: see me\n", score);
          }
      }

      int main(void) {
          int scores[4] = {95, 82, 70, 41};
          for (int i = 0; i < 4; i++) {
              describe(scores[i]);
          }
          return 0;
      }
    output: |
      95: excellent
      82: fine
      70: fine
      41: see me
    lines:
      - line: 4
        note: "A local variable. It has no value until we assign one on every path."
      - line: 5
        note: "Without braces an if controls exactly one statement."
      - line: 10
        note: "break stops execution falling into the next case."
      - line: 11
        note: "B has no statements and no break, so it falls through into C's code. Two cases share one action."
      - line: 18
        note: "scores is an array of four ints (Lesson 9.3). The loop counts i from 0 to 3."
  - title: Arguments are copies
    intro: "The function changes its parameter. The caller's variable stays the same."
    code: |
      #include <stdio.h>

      void add_one(int n) {
          n = n + 1;
          printf("inside:  %d\n", n);
      }

      int add_one_returning(int n) {
          return n + 1;
      }

      int main(void) {
          int x = 5;
          add_one(x);
          printf("outside: %d\n", x);
          x = add_one_returning(x);
          printf("after:   %d\n", x);
          return 0;
      }
    output: |
      inside:  6
      outside: 5
      after:   6
    lines:
      - line: 4
        note: "This n is a copy of the caller's x. It has its own memory in add_one's stack frame."
      - line: 14
        note: "The copy is thrown away when the function returns; x is untouched."
      - line: 16
        note: "To change a value, return the new one and assign it."
  - title: static keeps a value between calls
    intro: "A static local is initialised once and survives. A normal local starts afresh each call."
    code: |
      #include <stdio.h>

      int ticket(void) {
          static int last = 100;
          int fresh = 100;
          last = last + 1;
          fresh = fresh + 1;
          printf("static %d, normal %d\n", last, fresh);
          return last;
      }

      int main(void) {
          ticket();
          ticket();
          ticket();
          return 0;
      }
    output: |
      static 101, normal 101
      static 102, normal 101
      static 103, normal 101
    lines:
      - line: 4
        note: "This initialiser runs only once, before the first call."
      - line: 5
        note: "A normal local is created again, with value 100, on every call."
  - title: Recursion and the stack
    intro: "Each call to depth() adds a stack frame. A modest depth is fine."
    code: |
      #include <stdio.h>

      int depth(int n) {
          if (n == 0) return 0;
          return 1 + depth(n - 1);
      }

      int factorial(int n) {
          if (n <= 1) return 1;
          return n * factorial(n - 1);
      }

      int main(void) {
          printf("%d\n", depth(100));
          printf("%d\n", factorial(10));
          return 0;
      }
    output: |
      100
      3628800
    lines:
      - line: 6
        note: "Each call has its own n and waits for the next call to return. 100 frames exist at the deepest point."
      - line: 10
        note: "10! is 3628800. 13! would overflow a 32-bit int."

playground:
  prompt: |
    Change `depth(100)` to `depth(100000)` and run it. The stack is a fixed size, so you will see an error. Real C programs crash with a "stack overflow" or "segmentation fault". Then make the function loop instead of recursing and try again.
  code: |
    #include <stdio.h>

    int depth(int n) {
        if (n == 0) return 0;
        return 1 + depth(n - 1);
    }

    int main(void) {
        printf("%d\n", depth(100));
        return 0;
    }

exercises:
  - id: collatz
    title: Collatz steps
    difficulty: 2
    prompt: |
      Write `int collatz_steps(int n)` for `n >= 1`: repeat "if `n` is even divide it by 2, otherwise replace it by `3 * n + 1`" until `n` becomes 1, and return how many steps that took (`collatz_steps(1)` is 0, `collatz_steps(6)` is 8). Use a loop, not recursion.
    starter: |
      #include <stdio.h>

      int collatz_steps(int n) {
          return 0;
      }

      int main(void) {
          printf("%d\n", collatz_steps(6));
          return 0;
      }
    tests:
      - name: values
        append: |
          int main(void) {
              printf("%d %d %d %d\n", collatz_steps(1), collatz_steps(6), collatz_steps(7), collatz_steps(27));
              return 0;
          }
        code: |
          if (output.trim() !== "0 8 16 111") throw new Error(`Expected "0 8 16 111" but got "${output.trim()}"`);
      - name: uses a loop
        code: |
          if (!/\b(while|for)\b/.test(source)) throw new Error("Use a while or for loop.");
    hints:
      - "Keep a counter, and loop `while (n != 1)`."
      - "`n % 2 == 0` tests for even."
      - "Add 1 to the counter inside the loop, after changing n."
    solution: |
      #include <stdio.h>

      int collatz_steps(int n) {
          int steps = 0;
          while (n != 1) {
              if (n % 2 == 0) {
                  n = n / 2;
              } else {
                  n = 3 * n + 1;
              }
              steps++;
          }
          return steps;
      }

      int main(void) {
          printf("%d\n", collatz_steps(6));
          return 0;
      }
    explanation: |
      Because arguments are copies, the function can freely change `n` without affecting the caller. Starting from 27 the sequence climbs to 9232 before falling to 1, which is why int is still big enough here but would not be for larger starting values.

  - id: calendar
    title: Days in a month with switch
    difficulty: 2
    prompt: |
      Write `int days_in_month(int month, int year)` using a `switch`: months 1 to 12; February has 29 days in a leap year and 28 otherwise; April, June, September and November have 30; the rest have 31. A year is a leap year if it is divisible by 4, except years divisible by 100 that are not divisible by 400. Return -1 for an invalid month. Also write `int is_leap(int year)` returning 1 or 0.
    starter: |
      #include <stdio.h>

      int is_leap(int year) {
          return 0;
      }

      int days_in_month(int month, int year) {
          return 0;
      }

      int main(void) {
          printf("%d %d\n", days_in_month(2, 2024), is_leap(1900));
          return 0;
      }
    tests:
      - name: leap years
        append: |
          int main(void) {
              printf("%d%d%d%d%d\n", is_leap(2024), is_leap(2023), is_leap(1900), is_leap(2000), is_leap(2100));
              return 0;
          }
        code: |
          if (output.trim() !== "10010") throw new Error(`Expected "10010" but got "${output.trim()}"`);
      - name: days
        append: |
          int main(void) {
              int m;
              int total = 0;
              for (m = 1; m <= 12; m++) total += days_in_month(m, 2023);
              printf("%d %d %d %d %d\n", total, days_in_month(2, 2024), days_in_month(4, 2023), days_in_month(0, 2023), days_in_month(13, 2023));
              return 0;
          }
        code: |
          if (output.trim() !== "365 29 30 -1 -1") throw new Error(`Expected "365 29 30 -1 -1" but got "${output.trim()}"`);
      - name: uses switch
        code: |
          if (!/\bswitch\b/.test(source)) throw new Error("Use a switch statement.");
    hints:
      - "Group the 30-day months with stacked `case` labels and a single `break`."
      - "`is_leap`: `(year % 4 == 0 && year % 100 != 0) || year % 400 == 0`."
      - "Use `return` inside each case to avoid needing `break`."
    solution: |
      #include <stdio.h>

      int is_leap(int year) {
          return (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;
      }

      int days_in_month(int month, int year) {
          switch (month) {
              case 2:
                  return is_leap(year) ? 29 : 28;
              case 4:
              case 6:
              case 9:
              case 11:
                  return 30;
              case 1: case 3: case 5: case 7: case 8: case 10: case 12:
                  return 31;
              default:
                  return -1;
          }
      }

      int main(void) {
          printf("%d %d\n", days_in_month(2, 2024), is_leap(1900));
          return 0;
      }
    explanation: |
      Stacked case labels are the intentional use of fall-through. A comparison such as `year % 400 == 0` produces 1 or 0, so `is_leap` can return the expression directly. Putting `return` in every branch of the switch means no `break` is needed.

  - id: counter
    title: A function with memory
    difficulty: 3
    prompt: |
      Write `int next_ticket(void)` that returns 1 the first time it is called, 2 the second time, and so on, using a `static` local variable. Then write `int running_max(int value)` that returns the largest value passed to it **so far in the whole program** (so the first call returns the value itself). Also write `void reset_all(void)` that makes both functions start over. To allow that, you will need global (file-level) variables instead of static locals for at least one of them: decide which design is simplest and use it.
    starter: |
      #include <stdio.h>

      int next_ticket(void) {
          return 0;
      }

      int running_max(int value) {
          return 0;
      }

      void reset_all(void) {
      }

      int main(void) {
          printf("%d %d\n", next_ticket(), next_ticket());
          return 0;
      }
    tests:
      - name: tickets
        append: |
          int main(void) {
              printf("%d %d %d\n", next_ticket(), next_ticket(), next_ticket());
              return 0;
          }
        code: |
          if (output.trim() !== "1 2 3") throw new Error(`Expected "1 2 3" but got "${output.trim()}"`);
      - name: running max
        append: |
          int main(void) {
              printf("%d %d %d %d\n", running_max(5), running_max(3), running_max(9), running_max(-4));
              return 0;
          }
        code: |
          if (output.trim() !== "5 5 9 9") throw new Error(`Expected "5 5 9 9" but got "${output.trim()}"`);
      - name: reset
        append: |
          int main(void) {
              next_ticket(); next_ticket(); running_max(50);
              reset_all();
              printf("%d %d\n", next_ticket(), running_max(2));
              return 0;
          }
        code: |
          if (output.trim() !== "1 2") throw new Error(`Expected "1 2" but got "${output.trim()}"`);
    hints:
      - "A `static` local cannot be reached from another function, so `reset_all` cannot reset it. Use globals."
      - "For the running maximum you also need to know whether any value has been seen yet. A separate global flag `have_max` works."
      - "`reset_all` sets the counter to 0 and `have_max` to 0."
    solution: |
      #include <stdio.h>

      int ticket_count = 0;
      int max_so_far = 0;
      int have_max = 0;

      int next_ticket(void) {
          ticket_count++;
          return ticket_count;
      }

      int running_max(int value) {
          if (!have_max || value > max_so_far) {
              max_so_far = value;
              have_max = 1;
          }
          return max_so_far;
      }

      void reset_all(void) {
          ticket_count = 0;
          max_so_far = 0;
          have_max = 0;
      }

      int main(void) {
          printf("%d %d\n", next_ticket(), next_ticket());
          return 0;
      }
    explanation: |
      A static local hides its state inside one function, which is safer but means nothing else can reset or inspect it. Shared state that several functions must reach has to be global (or, in larger programs, stored in a struct that you pass around, Lesson 9.6). Notice the flag: using `0` as "no maximum yet" would be wrong when every value is negative.

  - id: stack-depth
    title: Recursion versus loops
    difficulty: 2
    prompt: |
      Write `int sum_to_rec(int n)` that returns `1 + 2 + ... + n` using **recursion**, and `int sum_to_loop(int n)` that does the same with a **loop**. Both return 0 for `n <= 0`. The tests call the recursive one with small values only, because each call uses a stack frame, and the loop one with a large value.
    starter: |
      #include <stdio.h>

      int sum_to_rec(int n) {
          return 0;
      }

      int sum_to_loop(int n) {
          return 0;
      }

      int main(void) {
          printf("%d %d\n", sum_to_rec(10), sum_to_loop(10));
          return 0;
      }
    tests:
      - name: small values
        append: |
          int main(void) {
              printf("%d %d %d %d\n", sum_to_rec(0), sum_to_rec(1), sum_to_rec(10), sum_to_rec(50));
              printf("%d %d %d %d\n", sum_to_loop(0), sum_to_loop(1), sum_to_loop(10), sum_to_loop(50));
              return 0;
          }
        code: |
          if (output.trim() !== "0 1 55 1275\n0 1 55 1275") throw new Error(`Got "${output.trim()}"`);
      - name: large loop
        append: |
          int main(void) {
              printf("%d %d\n", sum_to_loop(10000), sum_to_loop(-5));
              return 0;
          }
        code: |
          if (output.trim() !== "50005000 0") throw new Error(`Expected "50005000 0" but got "${output.trim()}"`);
      - name: really recursive
        code: |
          const body = source.split("sum_to_rec")[1] || "";
          if (!/sum_to_rec\s*\(\s*n\s*-\s*1\s*\)/.test(source)) throw new Error("sum_to_rec should call itself with n - 1.");
    hints:
      - "Recursive version: base case `n <= 0` returns 0; otherwise return `n + sum_to_rec(n - 1)`."
      - "Loop version: a total variable and a for loop from 1 to n."
      - "10000 levels of recursion would overflow the stack; the loop uses one frame."
    solution: |
      #include <stdio.h>

      int sum_to_rec(int n) {
          if (n <= 0) return 0;
          return n + sum_to_rec(n - 1);
      }

      int sum_to_loop(int n) {
          int total = 0;
          for (int i = 1; i <= n; i++) {
              total += i;
          }
          return total;
      }

      int main(void) {
          printf("%d %d\n", sum_to_rec(10), sum_to_loop(10));
          return 0;
      }
    explanation: |
      Both compute the same value, but the recursive version needs one stack frame per level while the loop uses a single frame. Python limited recursion to about 1000 calls for the same reason; C allows more because its frames are smaller, but the stack is still finite. Any recursion can be turned into a loop, and in C that is often the safer choice when the depth could be large.

commonMistakes:
  - title: Forgetting break in a switch
    explanation: |
      Without `break`, execution falls through into the following case and runs its code too. Only leave it out on purpose, with a comment.
  - title: A semicolon after the loop or if condition
    explanation: |
      `if (x > 0);` and `for (...);` have an empty body. The block that follows always runs. The compiler does not complain.
  - title: Using an uninitialised local variable
    explanation: |
      Locals contain garbage until assigned. Always give a variable a value before reading it.
  - title: Expecting a function to change its argument
    explanation: |
      Parameters are copies. Return the new value, or pass a pointer (Lesson 9.4).
  - title: Calling a function before it is declared
    explanation: |
      Put a prototype above the first call, or define the function above `main`.
  - title: Unbounded recursion
    explanation: |
      Missing or wrong base cases use up the stack. Each call needs to move towards the base case.

summary:
  - "C decisions: `if / else if / else`, `?:` and `switch` (each case needs `break` or it falls through). `&&`, `||` and `!` short-circuit in real C."
  - "Loops: `while`, `do-while` (always runs once) and `for (init; condition; update)`."
  - "A function declares its return type and parameter types; a **prototype** lets you call it before its definition, and headers are collections of prototypes."
  - "Locals live in the function and start with garbage; **globals** live for the whole run; **static** locals keep their value between calls."
  - "Arguments are passed **by value**, as copies, so assigning to a parameter does not change the caller's variable."
  - "Each call gets a **stack frame** holding its parameters and locals. The stack has a fixed size, so runaway recursion causes a **stack overflow**."
next: |
  Variables so far hold single values. Lesson 9.3 introduces **arrays** and **strings**: contiguous blocks of memory, indexed by position, and with no bounds checking. You will see how C stores text as a run of bytes ending in a zero, and why that design is the source of so many security bugs.

quiz:
  - type: mcq
    question: What happens if you leave out break at the end of a switch case?
    options: [
      "Execution continues into the next case",
      "The program does not compile",
      "The switch exits anyway",
      "The case is skipped"
    ]
    answer: 0
    explanation: "This is called fall-through. It is occasionally useful and often a bug."
  - type: mcq
    question: "A function is declared void change(int n) { n = 99; } and called as change(x). What happens to x?"
    options: ["It is unchanged", "It becomes 99", "The program crashes", "It becomes 0"]
    answer: 0
    explanation: "The function received a copy of x."
  - type: mcq
    question: What does a static local variable do?
    options: [
      "It keeps its value between calls to the function",
      "It becomes visible to every function",
      "It cannot be changed",
      "It is created in the heap"
    ]
    answer: 0
    explanation: "It is initialised once and lives for the whole run, but only the function can see it."
  - type: mcq
    question: Why does C need function prototypes?
    options: [
      "The compiler reads top to bottom and must know a function's signature before a call",
      "They make the function run faster",
      "They allocate memory for the function",
      "They are only for comments"
    ]
    answer: 0
    explanation: "A prototype declares the return type and parameter types ahead of the definition."
  - type: mcq
    question: What is stored in a function's stack frame?
    options: [
      "Its parameters, local variables and return address",
      "Only the return value",
      "The whole program's global variables",
      "The source code"
    ]
    answer: 0
    explanation: "The frame is created on each call and removed when the function returns."
  - type: mcq
    question: What is a stack overflow?
    options: [
      "Using up the fixed-size call stack, typically through runaway recursion",
      "Storing too many items in a stack data structure",
      "An integer growing past its maximum",
      "Running out of disk space"
    ]
    answer: 0
    explanation: "Every call uses stack memory and the stack has a fixed size."
  - type: code
    question: |
      Write `int max2(int a, int b)` that returns the larger of its two arguments.
    starter: |
      #include <stdio.h>

      int max2(int a, int b) {
          return 0;
      }

      int main(void) {
          printf("%d\n", max2(3, 8));
          return 0;
      }
    tests:
      - name: values
        append: |
          int main(void) {
              printf("%d %d %d\n", max2(3, 8), max2(8, 3), max2(-5, -2));
              return 0;
          }
        code: |
          if (output.trim() !== "8 8 -2") throw new Error(`Expected "8 8 -2" but got "${output.trim()}"`);
    solution: |
      #include <stdio.h>

      int max2(int a, int b) {
          return a > b ? a : b;
      }

      int main(void) {
          printf("%d\n", max2(3, 8));
          return 0;
      }
