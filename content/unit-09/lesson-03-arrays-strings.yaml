    tests:
      - name: vowels
        append: |
          int main(void) {
              char a[20] = "education";
              char b[20] = "rhythm";
              char c[20] = "";
              printf("%d %d %d\n", count_vowels(a), count_vowels(b), count_vowels(c));
              return 0;
          }
        code: |
          if (output.trim() !== "5 0 0") throw new Error(`Expected "5 0 0" but got "${output.trim()}"`);
    solution: |
      #include <stdio.h>

      int count_vowels(char *s) {
          int count = 0;
          for (int i = 0; s[i] != '\0'; i++) {
              char c = s[i];
              if (c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u') count++;
          }
          return count;
      }

      int main(void) {
          char s[20] = "education";
          printf("%d\n", count_vowels(s));
          return 0;
      }
