id: u9-pointers
title: "Pointers: Variables That Hold Addresses"
minutes: 60
objective: |
  Understand that every variable lives at an **address** in memory, and that a **pointer** is a variable holding such an address. Use `&` and `*`, let functions change their caller's variables, and use pointer arithmetic to walk through an array.
outcomes:
  - Explain what an address is and read the declarations int *p, & and * correctly
  - Use a pointer to read and change another variable
  - Write functions that return several results or modify their arguments through pointers
  - Explain pointer arithmetic and why p + 1 moves by the size of the pointed-to type
  - Explain NULL and the three most common pointer bugs
  - Explain how arrays and pointers are related

sections:
  - heading: Every variable has an address
    body: |
      Computer memory is a long row of numbered bytes (Lesson 1.5). When you declare `int x = 7;`, the compiler picks 4 consecutive bytes for it. The number of the first of those bytes is x's **address**. You can ask for it with the **address-of operator** `&`: `&x` is "the address of x".

      A **pointer** is a variable whose value *is* an address. You declare it with a `*` after the type it points to:

      ```c
      int x = 7;
      int *p = &x;     // p holds the address of x: "p points to x"
      ```

      Here `int *p` reads "p is a pointer to int". Draw it as an arrow: a box labelled `p` with an arrow to the box labelled `x`, which holds 7.

      The addresses themselves are large, meaningless numbers that change from run to run, so we do not care about their values. What matters is **who points at what**.

      Pointers have a size of their own: the size of an address. It is 4 bytes on a 32-bit machine (as in this runner) and 8 bytes on today's 64-bit computers, whatever the type pointed to: `sizeof(char *)` and `sizeof(double *)` are the same.

  - heading: Following a pointer
    body: |
      The **dereference operator** `*` goes the other way: `*p` means "the thing p points to".

      ```c
      int x = 7;
      int *p = &x;
      printf("%d\n", *p);   // 7  : read x through p
      *p = 20;              // write x through p
      printf("%d\n", x);    // 20 : x really changed
      ```

      So `*p` is not a copy; it **is** x, another name for the same memory (an *alias*). This is the missing piece for functions that need to change something.

      The `*` symbol has two jobs, and it confuses everyone at first: in a **declaration** (`int *p`) it says "p is a pointer"; in an **expression** (`*p`) it means "follow the pointer". A helpful way to read declarations: `int *p;` says "`*p` is an int".

      Watch out for `int* a, b;`: only `a` is a pointer; `b` is a plain int. Write `int *a, *b;` for two pointers, or declare them on separate lines.

  - heading: Changing the caller's variables
    body: |
      Lesson 9.2 showed that arguments are copies. If you want a function to change a variable, pass its **address**. The function gets a copy of the *pointer*, but the copy still points at the original variable:

      ```c
      void swap(int *a, int *b) {
          int tmp = *a;
          *a = *b;
          *b = tmp;
      }
      // called as: swap(&x, &y);
      ```

      The caller writes `&x` to hand over x's address, and the function writes `*a` to reach x. Python never needed this: mutable objects like lists are shared by reference automatically. In C you choose.

      This also solves the "return only one value" limit. A function can fill in several results through pointer parameters, called **output parameters**: `scanf("%d", &n)` works exactly this way, receiving the address where it should store the number. That is why the `&` is there.

  - heading: Pointer arithmetic
    body: |
      Adding to a pointer moves it by whole **elements**, not bytes. If `p` is an `int *` pointing at `a[0]`, then `p + 1` points at `a[1]`: the compiler adds `1 * sizeof(int)` = 4 bytes to the address. For a `char *` the step is 1 byte, and for a `double *` it is 8.

      ```c
      int a[3] = {10, 20, 30};
      int *p = a;          // an array name becomes the address of element 0
      *(p + 2)             // 30
      p[2]                 // also 30: p[i] is defined as *(p + i)
      p++;                 // now p points at a[1]
      ```

      That last line explains the relationship you saw in Lesson 9.3: **`a[i]` is just shorthand for `*(a + i)`**. The array name `a` behaves like a pointer to its first element, and indexing is address arithmetic. The cost of C's speed is that nothing checks whether `p + 7` is still inside the array.

      Two pointers into the same array can be subtracted to count the elements between them, and compared with `<`, but this runner does not support those two operations. Use an index counter instead and remember the rule: the result of arithmetic must stay inside the array (or one past its end).

  - heading: NULL and pointer bugs
    body: |
      A pointer that does not point at anything valid should hold the special value **`NULL`** (the address 0, which no variable ever uses). Test it before dereferencing: `if (p != NULL) { ... }`, or just `if (p)`. Dereferencing `NULL` crashes the program (a "segmentation fault"), which is a mercy compared with the alternatives.

      Three bugs cause most pointer disasters:

      1. **Uninitialised pointer.** `int *p; *p = 5;` writes to a random address. Always initialise a pointer, to a real address or to `NULL`.
      2. **Dangling pointer.** The pointed-to memory no longer belongs to you. The classic case is returning the address of a local variable: `int *bad(void) { int x = 5; return &x; }`. When `bad` returns, its stack frame is gone (Lesson 9.2) and the pointer refers to dead memory that will be overwritten by the next call. Lesson 9.7 meets the heap version of the same bug, *use after free*.
      3. **Out of bounds.** `p + n` beyond the array, as in Lesson 9.3.

      None of these produce a compile error. They produce programs that **sometimes** work, which is the worst kind of bug. Tools such as `valgrind` and compiler options like `-fsanitize=address` exist to catch them.

examples:
  - title: Addresses and aliases
    intro: "A pointer to x, reading and writing through it."
    code: |
      #include <stdio.h>

      int main(void) {
          int x = 7;
          int *p = &x;
          printf("x=%d *p=%d\n", x, *p);
          *p = 20;
          printf("x=%d *p=%d\n", x, *p);
          x = x + 1;
          printf("x=%d *p=%d\n", x, *p);
          printf("p points to x: %d\n", p == &x);
          int **pp = &p;
          **pp = 99;
          printf("x=%d\n", x);
          return 0;
      }
    output: |
      x=7 *p=7
      x=20 *p=20
      x=21 *p=21
      p points to x: 1
      x=99
    lines:
      - line: 5
        note: "p stores the address of x. We never print the address itself, only what it leads to."
      - line: 8
        note: "Writing through the pointer changes x."
      - line: 12
        note: "Pointers can be compared. == asks whether they hold the same address."
      - line: 13
        note: "A pointer to a pointer. pp points at p, and **pp is x. Two arrows to follow."
  - title: Swapping through pointers
    intro: "The function receives addresses, so it can change the caller's variables."
    code: |
      #include <stdio.h>

      void swap(int *a, int *b) {
          int tmp = *a;
          *a = *b;
          *b = tmp;
      }

      void divide(int n, int d, int *quotient, int *remainder) {
          *quotient = n / d;
          *remainder = n % d;
      }

      int main(void) {
          int x = 3, y = 8;
          swap(&x, &y);
          printf("x=%d y=%d\n", x, y);
          int q, r;
          divide(47, 5, &q, &r);
          printf("47 = 5 * %d + %d\n", q, r);
          return 0;
      }
    output: |
      x=8 y=3
      47 = 5 * 9 + 2
    lines:
      - line: 3
        note: "a and b are copies of the addresses; *a and *b are the caller's variables."
      - line: 10
        note: "Two output parameters give a function two results."
      - line: 17
        note: "&x hands over x's address. Without the &, the function would get the number 3 and treat it as an address."
  - title: Pointer arithmetic steps by element size
    intro: "Adding 1 to a pointer moves it by sizeof(type) bytes."
    code: |
      #include <stdio.h>

      int main(void) {
          int a[4] = {10, 20, 30, 40};
          int *p = a;
          printf("%d %d %d\n", *p, *(p + 2), p[3]);
          int total = 0;
          for (int i = 0; i < 4; i++) {
              total += *(p + i);
          }
          printf("total=%d\n", total);
          p = p + 1;
          printf("after p+1: %d\n", *p);
          int step = (int)((char *)(p + 1) - (char *)p);
          printf("an int step is %d bytes\n", step);
          double d[2];
          double *dp = d;
          step = (int)((char *)(dp + 1) - (char *)dp);
          printf("a double step is %d bytes\n", step);
          return 0;
      }
    output: |
      10 30 40
      total=100
      after p+1: 20
      an int step is 4 bytes
      a double step is 8 bytes
    lines:
      - line: 5
        note: "The array name stands for the address of its first element."
      - line: 6
        note: "*(p + 2) and p[3] are the same operation written two ways."
      - line: 13
        note: "p now points at the second element."
      - line: 15
        note: "Casting to char * lets us measure in single bytes: p + 1 is 4 bytes further on for an int."
      - line: 19
        note: "For a double the step is 8 bytes."
  - title: Walking and writing through a pointer
    intro: "A function that fills an array using only a pointer and a count."
    code: |
      #include <stdio.h>

      void fill_squares(int *out, int n) {
          for (int i = 0; i < n; i++) {
              *(out + i) = i * i;
          }
      }

      int main(void) {
          int squares[6];
          fill_squares(squares, 6);
          for (int i = 0; i < 6; i++) {
              printf("%d ", squares[i]);
          }
          printf("\n");
          return 0;
      }
    output: |
      0 1 4 9 16 25 
    lines:
      - line: 3
        note: "out is the address of the caller's first element. The function needs the count because a pointer knows nothing about the array's length."
      - line: 5
        note: "Writes into the caller's array, no copying involved."
      - line: 11
        note: "Passing the array name passes the address of element 0."

playground:
  prompt: |
    Make a second pointer to the same variable and change the variable through each one. Try printing `sizeof(p)` for different pointer types. Then try declaring `int *p;` with no value and print `p == NULL` (the value is unpredictable, which is the point).
  code: |
    #include <stdio.h>

    int main(void) {
        int score = 50;
        int *a = &score;
        int *b = &score;
        *a = *a + 10;
        *b = *b * 2;
        printf("score=%d\n", score);
        printf("pointer sizes: %d %d %d\n", (int)sizeof(char *), (int)sizeof(int *), (int)sizeof(double *));
        return 0;
    }

exercises:
  - id: swap-rotate
    title: Swap and rotate
    difficulty: 2
    prompt: |
      Write `void swap(int *a, int *b)` exchanging the two integers, and `void rotate3(int *a, int *b, int *c)` that moves the values around so that the new `*a` is the old `*b`, the new `*b` is the old `*c`, and the new `*c` is the old `*a`. Then write `void sort2(int *lo, int *hi)` that swaps them only if needed so that afterwards `*lo <= *hi`.
    starter: |
      #include <stdio.h>

      void swap(int *a, int *b) {
      }

      void rotate3(int *a, int *b, int *c) {
      }

      void sort2(int *lo, int *hi) {
      }

      int main(void) {
          int x = 1, y = 2, z = 3;
          rotate3(&x, &y, &z);
          printf("%d %d %d\n", x, y, z);
          return 0;
      }
    tests:
      - name: swap
        append: |
          int main(void) {
              int x = 3, y = 8, same = 5;
              swap(&x, &y);
              swap(&same, &same);
              printf("%d %d %d\n", x, y, same);
              return 0;
          }
        code: |
          if (output.trim() !== "8 3 5") throw new Error(`Expected "8 3 5" but got "${output.trim()}"`);
      - name: rotate
        append: |
          int main(void) {
              int x = 1, y = 2, z = 3;
              rotate3(&x, &y, &z);
              printf("%d %d %d\n", x, y, z);
              rotate3(&x, &y, &z);
              printf("%d %d %d\n", x, y, z);
              return 0;
          }
        code: |
          if (output.trim() !== "2 3 1\n3 1 2") throw new Error(`Got "${output.trim()}"`);
      - name: sort2
        append: |
          int main(void) {
              int a = 9, b = 4, c = 1, d = 7, e = 5, f = 5;
              sort2(&a, &b);
              sort2(&c, &d);
              sort2(&e, &f);
              printf("%d %d %d %d %d %d\n", a, b, c, d, e, f);
              return 0;
          }
        code: |
          if (output.trim() !== "4 9 1 7 5 5") throw new Error(`Expected "4 9 1 7 5 5" but got "${output.trim()}"`);
    hints:
      - "Use a temporary: `int tmp = *a; *a = *b; *b = tmp;`."
      - "For `rotate3`, save `*a` first, then `*a = *b; *b = *c; *c = saved;`."
      - "`sort2` can call your `swap` when `*lo > *hi`."
    solution: |
      #include <stdio.h>

      void swap(int *a, int *b) {
          int tmp = *a;
          *a = *b;
          *b = tmp;
      }

      void rotate3(int *a, int *b, int *c) {
          int first = *a;
          *a = *b;
          *b = *c;
          *c = first;
      }

      void sort2(int *lo, int *hi) {
          if (*lo > *hi) {
              swap(lo, hi);
          }
      }

      int main(void) {
          int x = 1, y = 2, z = 3;
          rotate3(&x, &y, &z);
          printf("%d %d %d\n", x, y, z);
          return 0;
      }
    explanation: |
      Inside `sort2`, `lo` and `hi` are already addresses, so you pass them straight on to `swap` without another `&`. The case `swap(&same, &same)` is worth thinking about: with a temporary variable it is harmless, while the clever trick of swapping with XOR would set the value to zero.

  - id: out-params
    title: Several results from one call
    difficulty: 3
    prompt: |
      Write `void divmod(int n, int d, int *quotient, int *remainder)` that stores `n / d` and `n % d` through the pointers (assume `d != 0`). Write `void min_max(int *a, int n, int *min, int *max)` that finds the smallest and largest of the first `n` elements (`n >= 1`) and stores them through the pointers. Write `int safe_divide(int n, int d, int *result)` that returns 1 and stores `n / d` in `*result` if `d != 0`, or returns 0 and leaves `*result` untouched if `d` is 0.
    starter: |
      #include <stdio.h>

      void divmod(int n, int d, int *quotient, int *remainder) {
      }

      void min_max(int *a, int n, int *min, int *max) {
      }

      int safe_divide(int n, int d, int *result) {
          return 0;
      }

      int main(void) {
          int q, r;
          divmod(47, 5, &q, &r);
          printf("%d %d\n", q, r);
          return 0;
      }
    tests:
      - name: divmod
        append: |
          int main(void) {
              int q, r;
              divmod(47, 5, &q, &r);
              printf("%d %d ", q, r);
              divmod(3, 7, &q, &r);
              printf("%d %d\n", q, r);
              return 0;
          }
        code: |
          if (output.trim() !== "9 2 0 3") throw new Error(`Expected "9 2 0 3" but got "${output.trim()}"`);
      - name: min_max
        append: |
          int main(void) {
              int a[6] = {4, -2, 9, 0, 9, -7};
              int lo, hi;
              min_max(a, 6, &lo, &hi);
              printf("%d %d ", lo, hi);
              min_max(a, 1, &lo, &hi);
              printf("%d %d\n", lo, hi);
              return 0;
          }
        code: |
          if (output.trim() !== "-7 9 4 4") throw new Error(`Expected "-7 9 4 4" but got "${output.trim()}"`);
      - name: safe_divide
        append: |
          int main(void) {
              int r = 111;
              int ok1 = safe_divide(20, 4, &r);
              printf("%d %d ", ok1, r);
              int ok2 = safe_divide(5, 0, &r);
              printf("%d %d\n", ok2, r);
              return 0;
          }
        code: |
          if (output.trim() !== "1 5 0 5") throw new Error(`Expected "1 5 0 5" but got "${output.trim()}"`);
    hints:
      - "Write `*quotient = n / d;` and `*remainder = n % d;`."
      - "For `min_max`, start both from `a[0]` and loop over the rest."
      - "Check `d == 0` first in `safe_divide`, and return before writing to `*result`."
    solution: |
      #include <stdio.h>

      void divmod(int n, int d, int *quotient, int *remainder) {
          *quotient = n / d;
          *remainder = n % d;
      }

      void min_max(int *a, int n, int *min, int *max) {
          *min = a[0];
          *max = a[0];
          for (int i = 1; i < n; i++) {
              if (a[i] < *min) *min = a[i];
              if (a[i] > *max) *max = a[i];
          }
      }

      int safe_divide(int n, int d, int *result) {
          if (d == 0) {
              return 0;
          }
          *result = n / d;
          return 1;
      }

      int main(void) {
          int q, r;
          divmod(47, 5, &q, &r);
          printf("%d %d\n", q, r);
          return 0;
      }
    explanation: |
      `safe_divide` shows the standard C pattern for operations that can fail: the **return value** says whether it worked, and the **answer** comes back through a pointer. The standard library does the same thing: `scanf` returns how many values it read and stores them through the pointers you pass. C has no exceptions to signal errors, so return codes like this are everywhere.

  - id: pointer-walk
    title: Walking with pointer arithmetic
    difficulty: 3
    prompt: |
      Write these using pointer arithmetic with `*` (do **not** use the `[ ]` operator in these functions): `int sum(int *a, int n)`, `void copy(int *dest, int *src, int n)` (copies `n` ints) and `void scale(int *a, int n, int factor)` multiplying each element by `factor` in place.
    starter: |
      #include <stdio.h>

      int sum(int *a, int n) {
          return 0;
      }

      void copy(int *dest, int *src, int n) {
      }

      void scale(int *a, int n, int factor) {
      }

      int main(void) {
          int a[3] = {1, 2, 3};
          printf("%d\n", sum(a, 3));
          return 0;
      }
    tests:
      - name: sum
        append: |
          int main(void) {
              int a[5] = {4, 5, 6, 7, 8};
              int e[1] = {0};
              printf("%d %d %d\n", sum(a, 5), sum(a, 2), sum(e, 0));
              return 0;
          }
        code: |
          if (output.trim() !== "30 9 0") throw new Error(`Expected "30 9 0" but got "${output.trim()}"`);
      - name: copy and scale
        append: |
          int main(void) {
              int a[4] = {1, 2, 3, 4};
              int b[4] = {0, 0, 0, 0};
              copy(b, a, 3);
              scale(a, 4, 10);
              printf("%d %d %d %d | %d %d %d %d\n", a[0], a[1], a[2], a[3], b[0], b[1], b[2], b[3]);
              return 0;
          }
        code: |
          if (output.trim() !== "10 20 30 40 | 1 2 3 0") throw new Error(`Got "${output.trim()}"`);
      - name: no brackets
        code: |
          const code = source.split("int main")[0];
          if (/\[|\]/.test(code)) throw new Error("Do not use [ ] in these functions: use *(a + i) or a moving pointer.");
    hints:
      - "`*(a + i)` is the element at index i."
      - "A moving pointer works too: `*a++` reads the element and then advances `a`, but remember the loop count."
      - "`copy`: `*(dest + i) = *(src + i);` inside a loop of `n` steps."
    solution: |
      #include <stdio.h>

      int sum(int *a, int n) {
          int total = 0;
          for (int i = 0; i < n; i++) {
              total += *(a + i);
          }
          return total;
      }

      void copy(int *dest, int *src, int n) {
          for (int i = 0; i < n; i++) {
              *(dest + i) = *(src + i);
          }
      }

      void scale(int *a, int n, int factor) {
          for (int i = 0; i < n; i++) {
              *(a + i) = *(a + i) * factor;
          }
      }

      int main(void) {
          int a[3] = {1, 2, 3};
          printf("%d\n", sum(a, 3));
          return 0;
      }
    explanation: |
      `*(a + i)` is exactly what `a[i]` means: the bracket notation is just a more readable spelling of pointer arithmetic. Both the destination and the source of `copy` are addresses, so a function can write into a caller's array; the function has no way to check that `dest` has room for `n` elements, which is why `memcpy` and `strcpy` are dangerous when misused.

  - id: find-pointer
    title: Returning a pointer
    difficulty: 3
    prompt: |
      Write `int *find(int *a, int n, int target)` that returns a pointer to the **first** element equal to `target`, or `NULL` if there is none. Then write `int *largest(int *a, int n)` returning a pointer to the largest element (the first one if tied; `n >= 1`). The caller can then read or change that element through the result.
    starter: |
      #include <stdio.h>

      int *find(int *a, int n, int target) {
          return NULL;
      }

      int *largest(int *a, int n) {
          return NULL;
      }

      int main(void) {
          int a[4] = {5, 8, 8, 2};
          int *p = find(a, 4, 8);
          if (p != NULL) printf("found %d\n", *p);
          return 0;
      }
    tests:
      - name: find
        append: |
          int main(void) {
              int a[5] = {5, 8, 3, 8, 2};
              int *p = find(a, 5, 8);
              int *q = find(a, 5, 99);
              printf("%d %d ", p == &a[1], q == NULL);
              *p = 100;
              printf("%d %d\n", a[1], a[3]);
              return 0;
          }
        code: |
          if (output.trim() !== "1 1 100 8") throw new Error(`Expected "1 1 100 8" but got "${output.trim()}"`);
      - name: largest
        append: |
          int main(void) {
              int a[5] = {5, 8, 3, 8, 2};
              int *p = largest(a, 5);
              printf("%d %d ", *p, p == &a[1]);
              *p = 0;
              int *q = largest(a, 5);
              printf("%d %d\n", *q, q == &a[3]);
              return 0;
          }
        code: |
          if (output.trim() !== "8 1 8 1") throw new Error(`Expected "8 1 8 1" but got "${output.trim()}"`);
    hints:
      - "Return `a + i` (or `&a[i]`) when you find it, and `NULL` after the loop."
      - "For `largest`, remember the index of the best so far, then return `a + best`."
      - "A pointer into the caller's array is fine to return. Returning the address of a *local variable* would not be."
    solution: |
      #include <stdio.h>

      int *find(int *a, int n, int target) {
          for (int i = 0; i < n; i++) {
              if (*(a + i) == target) {
                  return a + i;
              }
          }
          return NULL;
      }

      int *largest(int *a, int n) {
          int best = 0;
          for (int i = 1; i < n; i++) {
              if (*(a + i) > *(a + best)) {
                  best = i;
              }
          }
          return a + best;
      }

      int main(void) {
          int a[4] = {5, 8, 8, 2};
          int *p = find(a, 4, 8);
          if (p != NULL) printf("found %d\n", *p);
          return 0;
      }
    explanation: |
      Returning a pointer to an existing element lets the caller both read the element and change it in place, and `NULL` is the standard way to say "not found". The returned pointer is safe because it points into the caller's array, which still exists. The dangerous case is a pointer to something that disappears when the function returns, such as a local variable.

commonMistakes:
  - title: Forgetting the & when passing an address
    explanation: |
      `swap(x, y)` passes the *values* where addresses were expected; the function then treats 3 and 8 as memory locations. Pass `&x` and `&y`.
  - title: Using an uninitialised pointer
    explanation: |
      `int *p; *p = 5;` writes to a random location. Point it at something real, or set it to `NULL` and test.
  - title: Returning the address of a local variable
    explanation: |
      The local's stack frame disappears when the function returns, leaving a dangling pointer. Return a value, or a pointer into memory that outlives the call.
  - title: Confusing p and *p
    explanation: |
      `p = 5` changes where the pointer points (and is almost certainly an error), while `*p = 5` changes the thing it points to.
  - title: int* a, b
    explanation: |
      Only `a` is a pointer here; `b` is an int. The `*` binds to the variable name, not the type.
  - title: Treating pointer arithmetic as byte arithmetic
    explanation: |
      `p + 1` moves by `sizeof(*p)` bytes. To step in bytes, cast to `char *` first.

summary:
  - "Every variable lives at an **address**. `&x` gives it, and a **pointer** (`int *p`) is a variable that holds one."
  - "`*p` **dereferences**: it is the variable p points to. Writing `*p = 20` changes the original variable."
  - "Passing `&x` lets a function change the caller's variable. The same trick provides **output parameters** and is how `scanf` works."
  - "**Pointer arithmetic** steps by whole elements: `p + 1` adds `sizeof(*p)` bytes. `a[i]` means `*(a + i)`, so array names act as pointers to the first element."
  - "`NULL` marks a pointer that points nowhere; dereferencing it crashes. Check before using a pointer that might be NULL."
  - "The classic bugs are the **uninitialised**, **dangling** (including the address of a local) and **out-of-bounds** pointer. C stops none of them."
next: |
  You now have the idea; Lesson 9.5 digs into how pointers and arrays really connect. You will see why `sizeof` behaves differently inside a function, how strings become `char *`, how to build arrays of strings, and how `const` documents what a function will not change.

