  - type: code
    question: |
      Write `void set_zero(int *p)` that sets the integer `p` points to to 0, and `void increment(int *p)` that adds 1 to it.
    starter: |
      #include <stdio.h>

      void set_zero(int *p) {
      }

      void increment(int *p) {
      }

      int main(void) {
          int x = 5;
          increment(&x);
          printf("%d\n", x);
          return 0;
      }
    tests:
      - name: effects
        append: |
          int main(void) {
              int x = 5, y = 5;
              increment(&x);
              set_zero(&y);
              printf("%d %d\n", x, y);
              return 0;
          }
        code: |
          if (output.trim() !== "6 0") throw new Error(`Expected "6 0" but got "${output.trim()}"`);
    solution: |
      #include <stdio.h>

      void set_zero(int *p) {
          *p = 0;
      }

      void increment(int *p) {
          *p = *p + 1;
      }

      int main(void) {
          int x = 5;
          increment(&x);
          printf("%d\n", x);
          return 0;
      }
