  - type: code
    question: |
      Write `int count_spaces(char *s)` that returns the number of space characters in the string.
    starter: |
      #include <stdio.h>

      int count_spaces(char *s) {
          return 0;
      }

      int main(void) {
          printf("%d\n", count_spaces("a b c"));
          return 0;
      }
    tests:
      - name: spaces
        append: |
          int main(void) {
              printf("%d %d %d\n", count_spaces("a b c"), count_spaces(""), count_spaces("  "));
              return 0;
          }
        code: |
          if (output.trim() !== "2 0 2") throw new Error(`Expected "2 0 2" but got "${output.trim()}"`);
    solution: |
      #include <stdio.h>

      int count_spaces(char *s) {
          int count = 0;
          while (*s != '\0') {
              if (*s == ' ') count++;
              s++;
          }
          return count;
      }

      int main(void) {
          printf("%d\n", count_spaces("a b c"));
          return 0;
      }
