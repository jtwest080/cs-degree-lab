id: u9-pointers-strings
title: "Pointers, Arrays and Strings Together"
minutes: 55
objective: |
  Pull the last two lessons together. See why an array turns into a pointer when you pass it to a function, walk strings with pointers, build arrays of strings, and use `const` to say what a function promises not to change.
outcomes:
  - Explain array-to-pointer decay and why sizeof gives a different answer inside a function
  - Distinguish a char array from a char pointer to a string literal
  - Walk a string with a moving pointer, using the idiom *s++
  - Build and use an array of strings
  - Explain what const promises, and read declarations that use it
  - Explain why it is safe to return a pointer into the caller's data but not to a local

sections:
  - heading: Arrays decay into pointers
    body: |
      In Lesson 9.4 you saw that an array's name stands for the address of its first element. This happens almost everywhere an array is used in an expression, and it is called **decay**. It has one big consequence for functions.

      When you write `sum(scores, 5)`, the function does **not** receive a copy of the five integers; it receives the address of `scores[0]`. That is why a function can change the caller's array, and why passing a huge array costs nothing.

      It also means the function has lost the length. Inside `sum`, the parameter `int *a` is just an address, so `sizeof(a)` is the size of a **pointer** (4 or 8 bytes), not of the array. The trick `sizeof(a) / sizeof(a[0])` works only where the real array is visible. This is why almost every C function that takes an array also takes a count, such as `sum(int *a, int n)`, and why `main` receives `argc` along with `argv`.

      The spellings `int a[]` and `int *a` mean exactly the same for a parameter. Choose `int *a` to remind yourself that it is a pointer. (As noted in Lesson 9.3, this runner only gets the pointer spelling right when the function modifies the array.)

      The one thing that does *not* decay is `sizeof` itself on the array in its own scope, and `&` on the array. `&scores` is the address of the whole block.

  - heading: char arrays and char pointers
    body: |
      There are two ways to get a string, and they are **different**:

      ```c
      char a[] = "hello";     // an array: 6 bytes of your own, a copy of the text
      char *p = "hello";      // a pointer to a string literal in read-only memory
      ```

      - `a` is a block of 6 bytes you own. You may change them: `a[0] = 'J';` is fine. `sizeof(a)` is 6.
      - `p` is a pointer variable that points at the literal text, which the program stores in a protected area. **Modifying it is undefined behaviour** (usually a crash): `p[0] = 'J';` is wrong. `sizeof(p)` is the size of a pointer, and `p` can later be pointed somewhere else.

      Use an array when you need to change the text, and a pointer when you only read it. To make that intention checkable, declare the pointer `const char *p`, which brings us to const below.

      A string parameter is always `char *` (the address of the first character), and the function finds the end by looking for the zero byte. So a string handed to a function has no length attached either.

  - heading: Walking a string with a pointer
    body: |
      Because a string is a run of bytes ending in zero, a pointer is the natural way to move along it:

      ```c
      int my_strlen(char *s) {
          char *start = s;
          while (*s != '\0') {
              s++;
          }
          return s - start;
      }
      ```

      (In this runner subtracting two pointers is not supported, so the examples count with a separate variable. In real C `s - start` gives the number of elements between them.)

      C programmers write the same loop very compactly. `*s++` means "read the character `s` points at, then move `s` on". A classic copy loop is:

      ```c
      while ((*dest++ = *src++) != '\0') { }
      ```

      It copies one character, moves both pointers, and stops after copying the terminator. This is the heart of `strcpy`. It is also the reason `strcpy` is dangerous: it will happily run on past the end of `dest`.

  - heading: Arrays of strings and argv
    body: |
      A list of words is an **array of pointers**, each pointing at a string:

      ```c
      char *names[] = {"Ada", "Grace", "Alan"};
      ```

      `names[1]` is a `char *` pointing at `"Grace"`, and `names[1][0]` is the character `'G'`. The strings can have different lengths; only the 3 pointers are in the array.

      You have already met one: the full form of `main` is

      ```c
      int main(int argc, char *argv[])
      ```

      where the operating system passes the **command-line words** you typed: `argc` is how many and `argv[0]`, `argv[1]`, ... are the words, as strings (`argv[0]` is the program name). A program started with `./copy a.txt b.txt` sees `argc == 3`. This is how every Unix command, from `ls` to `gcc`, receives its options.

      When you pass such an array to a function, the parameter is written `char **words`: a pointer to the first pointer (a *pointer to a pointer to char*). Real C also accepts `char *words[]` for the same thing, but as in Lesson 9.3 this runner only handles the `**` spelling correctly when the function changes the array.

      Sorting such an array just moves **pointers** around, which is much cheaper than copying the text.

  - heading: const
    body: |
      The keyword **`const`** promises that something will not be changed through this name, and the compiler enforces it:

      ```c
      int length(const char *s);      // I will read s but never modify it
      char *copy(char *dest, const char *src);   // writes dest, only reads src
      ```

      `const char *s` means "s points at characters I may not modify"; the pointer itself can move. `char *const s` is the other way round: the pointer is fixed but the characters can change. Read declarations from the right: `const char *s` is "s is a pointer to char that is const".

      It documents the contract of a function, catches mistakes at compile time (writing through a `const` pointer is an error), and lets string literals be passed safely, since they are constants. The standard library uses it everywhere: `size_t strlen(const char *s)`.

      (This runner's interpreter does not accept `const`, so the code you run here leaves it out and the code samples marked as text show it. In real C, add it.)

  - heading: Pointers into data that lives on
    body: |
      Lesson 9.4 warned against returning the address of a local variable. The rule of thumb for any pointer is: **ask who owns the memory and how long it lives.**

      - A pointer to the caller's array or variable (passed in) is safe to return, because the caller's data outlives the call.
      - A pointer to a **string literal** is safe, because literals live for the whole program.
      - A pointer to a **static** variable is safe, though it is shared between calls.
      - A pointer to a local variable or local array is **not** safe.
      - Memory you create with `malloc` lives until you `free` it, so it can be returned. That is the next lesson.

examples:
  - title: Decay in action
    intro: "A function sees only the address, so the caller must pass the count."
    code: |
      #include <stdio.h>

      void double_all(int *a, int n) {
          for (int i = 0; i < n; i++) {
              a[i] = a[i] * 2;
          }
      }

      int main(void) {
          int data[4] = {1, 2, 3, 4};
          double_all(data, 4);
          for (int i = 0; i < 4; i++) {
              printf("%d ", data[i]);
          }
          printf("\n");
          printf("array: %d bytes\n", (int)sizeof(data));
          return 0;
      }
    output: |
      2 4 6 8 
      array: 16 bytes
    lines:
      - line: 3
        note: "a is the address of the caller's first element. n travels separately because the length is lost."
      - line: 5
        note: "Changing a[i] changes the caller's array: there is only one copy of the numbers."
      - line: 10
        note: "data is passed as the address of data[0]."
      - line: 17
        note: "Here, in the scope that declared it, sizeof still sees the whole array: 16 bytes."
  - title: Moving pointers along a string
    intro: "Counting and copying with *s++, the idiom behind strlen and strcpy."
    code: |
      #include <stdio.h>

      int length(char *s) {
          int n = 0;
          while (*s != '\0') {
              s++;
              n++;
          }
          return n;
      }

      void copy(char *dest, char *src) {
          while (*src != '\0') {
              *dest++ = *src++;
          }
          *dest = '\0';
      }

      int main(void) {
          char original[] = "pointer";
          char buffer[20];
          copy(buffer, original);
          buffer[0] = 'P';
          printf("%s %s %d\n", original, buffer, length(buffer));
          return 0;
      }
    output: |
      pointer Pointer 7
    lines:
      - line: 5
        note: "*s is the character s points at. s++ moves to the next character."
      - line: 14
        note: "Read the character at src, store it at dest, then advance both pointers."
      - line: 16
        note: "Copy the terminator by hand, otherwise buffer is not a valid string."
      - line: 23
        note: "Changing buffer does not affect original: copy made a separate set of bytes."
  - title: An array of strings
    intro: "Each element is a pointer to some text. Sorting moves pointers, not characters."
    code: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char *names[] = {"Grace", "Ada", "Linus", "Alan"};
          int n = 4;
          for (int pass = 0; pass < n - 1; pass++) {
              for (int i = 0; i < n - 1 - pass; i++) {
                  if (strcmp(names[i], names[i + 1]) > 0) {
                      char *tmp = names[i];
                      names[i] = names[i + 1];
                      names[i + 1] = tmp;
                  }
              }
          }
          for (int i = 0; i < n; i++) {
              printf("%s (starts with %c, %d letters)\n", names[i], names[i][0], (int)strlen(names[i]));
          }
          return 0;
      }
    output: |
      Ada (starts with A, 3 letters)
      Alan (starts with A, 4 letters)
      Grace (starts with G, 5 letters)
      Linus (starts with L, 5 letters)
    lines:
      - line: 5
        note: "An array of 4 char pointers. The words can be any length."
      - line: 9
        note: "Bubble sort (Lesson 4.x) comparing the strings with strcmp."
      - line: 10
        note: "Swapping two pointers: the text itself never moves."
      - line: 17
        note: "names[i][0] is the first character of the i-th string."
  - title: A string literal versus an array
    intro: "Only the array is yours to change."
    code: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char mine[] = "cat";
          char *shared = "cat";
          mine[0] = 'b';
          printf("%s %s\n", mine, shared);
          shared = "dog";
          printf("%s %s\n", mine, shared);
          printf("%d %d\n", (int)sizeof(mine), (int)strlen(shared));
          return 0;
      }
    output: |
      bat cat
      bat dog
      4 3
    lines:
      - line: 5
        note: "A 4-byte array holding its own copy of the text."
      - line: 6
        note: "A pointer to the literal text stored in the program. Never write through it."
      - line: 9
        note: "The pointer can be repointed at different text. The array name cannot be reassigned."
  - title: const in real C
    intro: "Not run here, because this runner's interpreter does not accept const. Read it as the contract it states."
    runnable: false
    code: |
      #include <stdio.h>

      int count_char(const char *s, char c) {
          int count = 0;
          while (*s != '\0') {
              if (*s == c) count++;
              s++;
          }
          return count;
      }

      int main(void) {
          const char *text = "mississippi";
          printf("%d\n", count_char(text, 's'));
          /* text[0] = 'M';   <- compile error: text points at const chars */
          return 0;
      }
    lines:
      - line: 3
        note: "const char *s promises count_char never changes the characters. The compiler checks it."
      - line: 5
        note: "s itself may move, because only the characters are const."
      - line: 16
        note: "Uncommenting this line is a compile-time error, not a crash at run time. That is the point of const."

playground:
  prompt: |
    Try the copy loop from the example with a different string. Print `sizeof` of a char array and `strlen` of the same array. Add a fifth name to the array of strings and sort it.
  code: |
    #include <stdio.h>
    #include <string.h>

    int main(void) {
        char words[] = "sort me";
        char *list[] = {"pear", "fig", "apple"};
        printf("%d %d\n", (int)sizeof(words), (int)strlen(words));
        printf("%s %c\n", list[2], list[0][1]);
        return 0;
    }

exercises:
  - id: string-pointers
    title: Strings with moving pointers
    difficulty: 3
    prompt: |
      Write these using a moving `char *` (use `*s`, `s++` and similar; do not index with `[ ]` inside the functions): `int str_length(char *s)`; `int str_equal(char *a, char *b)` returning 1 if the two strings have identical text, else 0; `char *find_char(char *s, char c)` returning a pointer to the first occurrence of `c` in `s`, or `NULL`; and `char *skip_spaces(char *s)` returning a pointer to the first character that is not a space (it may be the terminator).
    starter: |
      #include <stdio.h>

      int str_length(char *s) {
          return 0;
      }

      int str_equal(char *a, char *b) {
          return 0;
      }

      char *find_char(char *s, char c) {
          return NULL;
      }

      char *skip_spaces(char *s) {
          return s;
      }

      int main(void) {
          printf("%d\n", str_length("hello"));
          return 0;
      }
    tests:
      - name: length and equal
        append: |
          int main(void) {
              char a[10] = "same";
              char b[10] = "same";
              char c[10] = "sam";
              printf("%d %d %d %d %d\n", str_length(a), str_length(""), str_equal(a, b), str_equal(a, c), str_equal("", ""));
              return 0;
          }
        code: |
          if (output.trim() !== "4 0 1 0 1") throw new Error(`Expected "4 0 1 0 1" but got "${output.trim()}"`);
      - name: find_char
        append: |
          int main(void) {
              char s[20] = "find the e";
              char *p = find_char(s, 'e');
              char *q = find_char(s, 'z');
              printf("%s %d\n", p, q == NULL);
              p[0] = 'E';
              printf("%s\n", s);
              return 0;
          }
        code: |
          if (output.trim() !== "e e 1\nfind thE e") throw new Error(`Got "${output.trim()}"`);
      - name: skip_spaces
        append: |
          int main(void) {
              char a[20] = "   indented";
              char b[20] = "none";
              char c[20] = "    ";
              printf("[%s] [%s] [%s]\n", skip_spaces(a), skip_spaces(b), skip_spaces(c));
              return 0;
          }
        code: |
          if (output.trim() !== "[indented] [none] []") throw new Error(`Expected "[indented] [none] []" but got "${output.trim()}"`);
      - name: no brackets
        code: |
          const code = source.split("int main")[0];
          if (/\[|\]/.test(code)) throw new Error("Do not use [ ] in these functions: use *s and s++.");
    hints:
      - "`while (*s != '\\0') { ... s++; }`"
      - "`str_equal`: walk both strings together while the characters match; they are equal if you reach both terminators at once."
      - "`find_char` returns `s` itself when `*s == c`, so the caller gets the address of the match."
    solution: |
      #include <stdio.h>

      int str_length(char *s) {
          int n = 0;
          while (*s != '\0') {
              n++;
              s++;
          }
          return n;
      }

      int str_equal(char *a, char *b) {
          while (*a != '\0' && *b != '\0') {
              if (*a != *b) return 0;
              a++;
              b++;
          }
          return *a == *b;
      }

      char *find_char(char *s, char c) {
          while (*s != '\0') {
              if (*s == c) return s;
              s++;
          }
          return NULL;
      }

      char *skip_spaces(char *s) {
          while (*s == ' ') {
              s++;
          }
          return s;
      }

      int main(void) {
          printf("%d\n", str_length("hello"));
          return 0;
      }
    explanation: |
      A pointer into a string is itself a valid string: `find_char` returns the address of the match, and printing it with `%s` shows the text from there to the end. Because that pointer points into the caller's array, changing `p[0]` changed the original. In `str_equal`, the final comparison `*a == *b` covers both "both ended" and "one ended early".

  - id: join-words
    title: Joining an array of strings
    difficulty: 3
    prompt: |
      Write `void join(char *dest, char **words, int n, char sep)` that writes the `n` words into `dest` separated by the character `sep`, followed by the terminator (`join` with words `"a"`, `"bb"`, `"c"` and `'-'` gives `a-bb-c`; with `n == 0` it gives the empty string). Assume `dest` is large enough. Also write `int total_length(char **words, int n)`: the total number of characters in all the words together.
    starter: |
      #include <stdio.h>
      #include <string.h>

      void join(char *dest, char **words, int n, char sep) {
      }

      int total_length(char **words, int n) {
          return 0;
      }

      int main(void) {
          char *w[3] = {"a", "bb", "c"};
          char out[20];
          join(out, w, 3, '-');
          printf("%s %d\n", out, total_length(w, 3));
          return 0;
      }
    tests:
      - name: join
        append: |
          int main(void) {
              char *w[3] = {"a", "bb", "c"};
              char *one[1] = {"solo"};
              char out[30];
              join(out, w, 3, '-');
              printf("[%s] ", out);
              join(out, one, 1, ',');
              printf("[%s] ", out);
              join(out, w, 0, ',');
              printf("[%s]\n", out);
              return 0;
          }
        code: |
          if (output.trim() !== "[a-bb-c] [solo] []") throw new Error(`Expected "[a-bb-c] [solo] []" but got "${output.trim()}"`);
      - name: total_length
        append: |
          int main(void) {
              char *w[4] = {"alpha", "", "be", "ta"};
              printf("%d %d\n", total_length(w, 4), total_length(w, 0));
              return 0;
          }
        code: |
          if (output.trim() !== "9 0") throw new Error(`Expected "9 0" but got "${output.trim()}"`);
    hints:
      - "Keep a write position `pos` in `dest`. For each word, copy its characters one by one, and add `sep` before every word except the first."
      - "Always write the terminator at `dest[pos]` at the end, even when `n` is 0."
      - "`words[i]` is a `char *`; `words[i][j]` is its j-th character."
    solution: |
      #include <stdio.h>
      #include <string.h>

      void join(char *dest, char **words, int n, char sep) {
          int pos = 0;
          for (int i = 0; i < n; i++) {
              if (i > 0) {
                  dest[pos++] = sep;
              }
              for (int j = 0; words[i][j] != '\0'; j++) {
                  dest[pos++] = words[i][j];
              }
          }
          dest[pos] = '\0';
      }

      int total_length(char **words, int n) {
          int total = 0;
          for (int i = 0; i < n; i++) {
              total += (int)strlen(words[i]);
          }
          return total;
      }

      int main(void) {
          char *w[3] = {"a", "bb", "c"};
          char out[20];
          join(out, w, 3, '-');
          printf("%s %d\n", out, total_length(w, 3));
          return 0;
      }
    explanation: |
      The function trusts the caller to supply enough room in `dest`, as `strcpy` and `strcat` do. A safe version would also take the size of `dest` and stop (or report failure) when the result would not fit. Forgetting the final `dest[pos] = '\0'` is a classic bug that produces strings with trailing garbage.

  - id: parse-int
    title: Reading a number from text
    difficulty: 3
    prompt: |
      Write `int parse_int(char *s)` that converts a string such as `"42"`, `"-17"` or `"+5"` to an `int` without using `atoi` or `sscanf`. Skip leading spaces, accept one optional sign, then read digits until a non-digit or the end. A string with no digits gives 0. Also write `int parse_digits(char *s, int *out)` that does the same but stores the number through `out` and returns how many **characters** it consumed (including spaces and the sign), or 0 if no number was found.
    starter: |
      #include <stdio.h>

      int parse_int(char *s) {
          return 0;
      }

      int parse_digits(char *s, int *out) {
          return 0;
      }

      int main(void) {
          printf("%d\n", parse_int("  -17abc"));
          return 0;
      }
    tests:
      - name: parse_int
        append: |
          int main(void) {
              printf("%d %d %d %d %d %d\n", parse_int("42"), parse_int("-17"), parse_int("+5"), parse_int("   9 lives"), parse_int("abc"), parse_int(""));
              printf("%d %d\n", parse_int("-"), parse_int("12345"));
              return 0;
          }
        code: |
          if (output.trim() !== "42 -17 5 9 0 0\n0 12345") throw new Error(`Got "${output.trim()}"`);
      - name: parse_digits
        append: |
          int main(void) {
              int v = -1;
              int used = parse_digits("  -17abc", &v);
              printf("%d %d ", used, v);
              used = parse_digits("abc", &v);
              printf("%d %d ", used, v);
              used = parse_digits("7", &v);
              printf("%d %d\n", used, v);
              return 0;
          }
        code: |
          if (output.trim() !== "5 -17 0 -17 1 7") throw new Error(`Expected "5 -17 0 -17 1 7" but got "${output.trim()}"`);
      - name: no atoi
        code: |
          if (/atoi|sscanf|strtol/.test(source.replace(/parse_\w+/g, ""))) throw new Error("Write the conversion yourself.");
    hints:
      - "Each digit adds to the result: `value = value * 10 + (c - '0')`."
      - "Remember the sign, and apply it at the end."
      - "`parse_digits` should leave `*out` unchanged when it finds no number."
    solution: |
      #include <stdio.h>

      int parse_digits(char *s, int *out) {
          int i = 0;
          while (s[i] == ' ') i++;
          int negative = 0;
          if (s[i] == '-' || s[i] == '+') {
              negative = (s[i] == '-');
              i++;
          }
          if (s[i] < '0' || s[i] > '9') {
              return 0;
          }
          int value = 0;
          while (s[i] >= '0' && s[i] <= '9') {
              value = value * 10 + (s[i] - '0');
              i++;
          }
          *out = negative ? -value : value;
          return i;
      }

      int parse_int(char *s) {
          int value = 0;
          parse_digits(s, &value);
          return value;
      }

      int main(void) {
          printf("%d\n", parse_int("  -17abc"));
          return 0;
      }
    explanation: |
      This is what `atoi` and `strtol` do inside. Returning the number of characters consumed, with the value coming back through a pointer, is the pattern that lets a program parse a whole line piece by piece: add the returned count to the string pointer and parse the next field. Using `parse_int` on text longer than a few digits can overflow an `int`, which real parsers must check.

  - id: longest-word
    title: Choosing from an array of strings
    difficulty: 2
    prompt: |
      Write `char *longest(char **words, int n)` returning the **longest** word (the first one if there is a tie; `n >= 1`), `int count_starting(char **words, int n, char c)` returning how many words start with the letter `c`, and `void sort_words(char **words, int n)` that sorts the pointers alphabetically with `strcmp` (any simple sort).
    starter: |
      #include <stdio.h>
      #include <string.h>

      char *longest(char **words, int n) {
          return words[0];
      }

      int count_starting(char **words, int n, char c) {
          return 0;
      }

      void sort_words(char **words, int n) {
      }

      int main(void) {
          char *w[3] = {"pear", "fig", "banana"};
          printf("%s\n", longest(w, 3));
          return 0;
      }
    tests:
      - name: longest and count
        append: |
          int main(void) {
              char *w[5] = {"kiwi", "banana", "cherry", "date", "blueberry"};
              printf("%s %s %d %d\n", longest(w, 5), longest(w, 3), count_starting(w, 5, 'b'), count_starting(w, 5, 'z'));
              return 0;
          }
        code: |
          if (output.trim() !== "blueberry banana 2 0") throw new Error(`Expected "blueberry banana 2 0" but got "${output.trim()}"`);
      - name: sort
        append: |
          int main(void) {
              char *w[5] = {"kiwi", "banana", "cherry", "apple", "date"};
              sort_words(w, 5);
              printf("%s %s %s %s %s\n", w[0], w[1], w[2], w[3], w[4]);
              return 0;
          }
        code: |
          if (output.trim() !== "apple banana cherry date kiwi") throw new Error(`Got "${output.trim()}"`);
    hints:
      - "`longest`: keep the best pointer so far and compare `strlen` of each word; use `>` (not `>=`) so ties keep the earlier word."
      - "`sort_words`: swapping two entries of `words` swaps pointers; use a temporary `char *`."
      - "`count_starting`: check `words[i][0] == c`."
    solution: |
      #include <stdio.h>
      #include <string.h>

      char *longest(char **words, int n) {
          char *best = words[0];
          for (int i = 1; i < n; i++) {
              if (strlen(words[i]) > strlen(best)) {
                  best = words[i];
              }
          }
          return best;
      }

      int count_starting(char **words, int n, char c) {
          int count = 0;
          for (int i = 0; i < n; i++) {
              if (words[i][0] == c) count++;
          }
          return count;
      }

      void sort_words(char **words, int n) {
          for (int pass = 0; pass < n - 1; pass++) {
              for (int i = 0; i < n - 1 - pass; i++) {
                  if (strcmp(words[i], words[i + 1]) > 0) {
                      char *tmp = words[i];
                      words[i] = words[i + 1];
                      words[i + 1] = tmp;
                  }
              }
          }
      }

      int main(void) {
          char *w[3] = {"pear", "fig", "banana"};
          printf("%s\n", longest(w, 3));
          return 0;
      }
    explanation: |
      Returning one of the input pointers is safe: it points at text that lives on after the function returns. Sorting an array of strings swaps 8-byte (or 4-byte) pointers instead of copying characters, which is how real programs sort large lists of names, and the same reason Python's sort is cheap on lists of strings.

commonMistakes:
  - title: Using sizeof on an array parameter
    explanation: |
      Inside a function, `sizeof(a)` for `int *a` is the size of a pointer. Pass the length as another parameter.
  - title: Modifying a string literal
    explanation: |
      `char *p = "text"; p[0] = 'T';` writes into read-only memory and is undefined behaviour. Use `char p[] = "text";` if you need to change it.
  - title: Forgetting the terminator when building a string
    explanation: |
      After writing characters one at a time, set `dest[pos] = '\0'`. Without it, `printf("%s")` prints whatever follows in memory.
  - title: Confusing a pointer's value with its target
    explanation: |
      `names[i] = "text"` changes which string the slot points to; it does not copy characters. To copy text, use `strcpy` into an array you own.
  - title: Returning a pointer to a local array
    explanation: |
      `char buf[20]; ... return buf;` returns an address that dies with the function. Let the caller supply the buffer, or use memory from `malloc` (Lesson 9.7).

summary:
  - "An array name **decays** into a pointer to its first element when passed to a function, so the function sees only an address and loses the length. Pass the count separately."
  - "`char a[] = \"hi\"` is an array you own and can change. `char *p = \"hi\"` points to a read-only literal."
  - "Walk strings with a moving pointer: `*s` is the current character and `s++` advances. `*dest++ = *src++` is the heart of `strcpy`."
  - "An **array of strings** is an array of pointers (`char *names[]`). Sorting it swaps pointers, not text. `argv` is one."
  - "`const` documents and enforces what a function will not change; the standard library uses it throughout."
  - "A pointer you return must point at memory that outlives the call: the caller's data, a literal, a static, or heap memory, never a local."
