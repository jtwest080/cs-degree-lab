      "char, int, char, short",
      "char, short, int, char",
      "They are all the same size"
    ]
    answer: 0
    explanation: "Large fields first avoids padding gaps: 4 + 2 + 1 + 1 = 8 bytes."
  - type: mcq
    question: What does b = a do when a and b are structs of the same type?
    options: [
      "Copies all the bytes of a into b",
      "Makes b another name for a",
