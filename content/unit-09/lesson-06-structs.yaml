id: u9-structs
title: "Structs, Enums and Unions: Your Own Types"
minutes: 55
objective: |
  Group related values into a single type with a **struct**, name a set of choices with an **enum**, and share one block of memory between alternatives with a **union**. See how the compiler lays structs out in memory, including the invisible **padding** bytes.
outcomes:
  - Declare structs with typedef, access fields with . and ->, and pass structs by value and by pointer
  - Explain that struct assignment copies every byte, including arrays inside the struct
  - Predict sizeof for a struct using alignment and padding, and reorder fields to save space
  - Use enums with switch to name a set of states
  - Explain what a union is and build a tagged union
  - Combine structs and arrays to model records, such as a ring buffer

sections:
  - heading: Structs group related data
    body: |
      So far each variable has been one number or one array of identical items. Real data comes in records: a student has a name, an age and a grade. A **struct** bundles several named **fields** of any types into one unit:

      ```c
      struct Student {
          char name[16];
          int age;
          double gpa;
      };
      ```

      Declare a variable with `struct Student s;` and reach into it with a **dot**: `s.age = 20;`. With **`typedef`** you can give the type a shorter name, so you don't need to write `struct` each time:

      ```c
      typedef struct {
          char name[16];
          int age;
          double gpa;
      } Student;

      Student s;            // no "struct" needed
      ```

      This is C's closest thing to a Python class without methods: data only. Functions that work on the struct are written separately and take it (or a pointer to it) as a parameter. Object-oriented ideas from Unit 5 are built from exactly this pattern.

      Unlike Python objects, a struct variable **contains** its fields directly. The `name` array here is 16 bytes sitting inside the struct, not a pointer to somewhere else.

  - heading: Copying and pointing at structs
    body: |
      Structs are values. **Assigning** one struct to another copies **every byte**, including any arrays inside it:

      ```c
      Student a = ...;
      Student b = a;     // b is an independent copy
      b.age = 99;        // a.age is unchanged
      ```

      Passing a struct to a function also copies it all, as for any argument (Lesson 9.2). That is fine for a small struct, but wasteful for a large one, and the function cannot change the caller's original. The usual fix is to pass a **pointer**. For a pointer to a struct, the arrow operator `->` follows the pointer and picks a field in one step: `p->age` means `(*p).age`.

      ```c
      void birthday(Student *p) {
          p->age = p->age + 1;     // changes the caller's struct
      }
      // birthday(&s);
      ```

      You will see `->` everywhere in C code, in particular in linked lists and trees, where a struct holds a pointer to another struct of its own type:

      ```c
      typedef struct Node {
          int value;
          struct Node *next;
      } Node;
      ```

      (The type name is needed inside its own definition, which is why the struct has a tag, `Node`, as well as the typedef.)

      **Runner limits.** In real C a function may return a typedef name (`Student *best(...)`). This runner cannot parse that, so write `struct Student *best(...)` when a function returns a struct or a pointer to one.

      **Initialisers.** In real C you can write `Student s = {"Ada", 36, 3.9};`. This runner does not support initialiser lists for structs, so the examples set fields one by one.

  - heading: How a struct sits in memory
    body: |
      A struct's fields are stored one after another in the order you declare them. But CPUs read memory fastest when a value of size *n* starts at an address that is a multiple of *n* (it is **aligned**; a 4-byte `int` at an address divisible by 4). To make that true, the compiler inserts invisible **padding** bytes between fields.

      ```c
      struct A { char c; int i; };      // c at offset 0, 3 bytes padding, i at offset 4  : size 8
      struct B { int i; char c; };      // i at offset 0, c at offset 4, 3 bytes padding at the end : size 8
      ```

      The padding at the end of `B` keeps the **next** struct in an array aligned. The size of a struct is therefore usually more than the sum of its fields. **The order of the fields matters:**

      ```c
      struct Loose { char a; int b; char c; };    // 1 + 3 pad + 4 + 1 + 3 pad = 12
      struct Tight { int b; char a; char c; };    // 4 + 1 + 1 + 2 pad          = 8
      ```

      Putting the large fields first (or grouping fields of the same size) wastes less memory. In a program holding millions of structs, that is a real saving. Use `sizeof(struct X)` rather than adding fields up, and the `offsetof` macro (from `<stddef.h>`) to find where a field starts. Padding bytes contain garbage, which is also why you should never compare two structs with `memcmp` or write one to a file as raw bytes if the garbage matters.

  - heading: Enums name the choices
    body: |
      When a variable can only be one of a few named possibilities, such as a traffic light colour or a connection state, use an **enum**:

      ```c
      enum Color { RED, GREEN, BLUE };        // RED is 0, GREEN is 1, BLUE is 2
      enum Color c = GREEN;
      ```

      Each name is a constant integer, numbered from 0 unless you assign values (`enum Level { LOW = 10, HIGH = 20 };`). An enum is just an `int` underneath. C will not stop you from storing 42 in an `enum Color` variable, but the names make the code readable and let a good compiler warn you if a `switch` forgets a case.

      Enums pair naturally with `switch` (Lesson 9.2) and with arrays that are indexed by the enum, such as a table of colour names: `const char *names[] = {"red", "green", "blue"};`, and `names[c]`.

  - heading: Unions share memory
    body: |
      A **union** looks like a struct, but all its fields occupy **the same memory**. Only one is meaningful at a time. The union is as big as its largest field.

      ```c
      union Number {
          int i;
          double d;
      };                       // 8 bytes, not 12
      ```

      Writing `n.d = 2.5` and then reading `n.i` reinterprets the same bytes as an integer, which can be used to look at the raw bytes of a value (Lesson 9.8 does this to reveal byte order). The more important use is the **tagged union**: a struct holding a **tag** that says which variant is currently valid, plus a union of the variants.

      ```c
      struct Value {
          enum { IS_INT, IS_DOUBLE } kind;
          union { int i; double d; } as;
      };
      ```

      You check `kind` before reading `as.i` or `as.d`. This is how interpreters (including the one that runs Python!) store values of different types in the same space, and it is the manual version of what languages like Rust call an enum with data. Nothing stops you reading the wrong field; the tag is the programmer's discipline.

examples:
  - title: A struct, a copy and a pointer
    intro: "Copies are independent; a pointer lets a function change the original."
    code: |
      #include <stdio.h>
      #include <string.h>

      typedef struct {
          char name[16];
          int age;
          double gpa;
      } Student;

      void birthday(Student *p) {
          p->age = p->age + 1;
      }

      void show(Student s) {
          printf("%s is %d with GPA %.1f\n", s.name, s.age, s.gpa);
      }

      int main(void) {
          Student a;
          strcpy(a.name, "Ada");
          a.age = 20;
          a.gpa = 3.9;
          Student b = a;
          b.age = 99;
          strcpy(b.name, "Bob");
          show(a);
          show(b);
          birthday(&a);
          show(a);
          printf("sizeof(Student) = %d\n", (int)sizeof(Student));
          return 0;
      }
    output: |
      Ada is 20 with GPA 3.9
      Bob is 99 with GPA 3.9
      Ada is 21 with GPA 3.9
      sizeof(Student) = 32
    lines:
      - line: 4
        note: "typedef gives the anonymous struct the name Student."
      - line: 11
        note: "p->age is (*p).age: follow the pointer, then pick the field."
      - line: 14
        note: "show receives a full copy of the struct, 28 or more bytes. Changing s there would not affect the caller."
      - line: 24
        note: "Assigning a struct copies all its bytes, including the 16-byte name array."
      - line: 28
        note: "&a hands over the address, so the function can modify the original."
      - line: 30
        note: "16 + 4 + 8 = 28 bytes of fields, but the double wants to start at a multiple of 8, so the compiler rounds the size up. Real 64-bit gcc gives 32."
  - title: Padding and field order
    intro: "The same three fields cost 12 bytes in one order and 8 in another."
    code: |
      #include <stdio.h>

      struct Loose { char a; int b; char c; };
      struct Tight { int b; char a; char c; };

      int main(void) {
          struct Loose x;
          printf("Loose %d, Tight %d\n", (int)sizeof(struct Loose), (int)sizeof(struct Tight));
          printf("offsets of a, b, c in Loose: %d %d %d\n",
                 (int)((char *)&x.a - (char *)&x),
                 (int)((char *)&x.b - (char *)&x),
                 (int)((char *)&x.c - (char *)&x));
          return 0;
      }
    output: |
      Loose 12, Tight 8
      offsets of a, b, c in Loose: 0 4 8
    lines:
      - line: 3
        note: "Loose: a at 0, then 3 padding bytes so b starts at 4, then c at 8, then 3 bytes of padding at the end."
      - line: 4
        note: "Tight: b at 0, a at 4, c at 5, and 2 bytes of padding at the end."
      - line: 10
        note: "Subtracting char pointers gives byte distances between a field and the start of the struct."
  - title: Enums and switch
    intro: "Named states, and a table indexed by the enum."
    code: |
      #include <stdio.h>

      enum Light { RED, GREEN, YELLOW, LIGHT_COUNT };

      enum Light next(enum Light now) {
          switch (now) {
              case RED:    return GREEN;
              case GREEN:  return YELLOW;
              default:     return RED;
          }
      }

      int main(void) {
          char *names[LIGHT_COUNT];
          names[RED] = "red";
          names[GREEN] = "green";
          names[YELLOW] = "yellow";
          enum Light light = RED;
          for (int i = 0; i < 5; i++) {
              printf("%s ", names[light]);
              light = next(light);
          }
          printf("\n");
          printf("RED=%d GREEN=%d YELLOW=%d count=%d\n", RED, GREEN, YELLOW, LIGHT_COUNT);
          return 0;
      }
    output: |
      red green yellow red green 
      RED=0 GREEN=1 YELLOW=2 count=3
    lines:
      - line: 3
        note: "A final LIGHT_COUNT entry is a common trick: it equals the number of real values."
      - line: 15
        note: "The array is sized by the enum and indexed by its names, so no magic numbers appear."
      - line: 26
        note: "Underneath, the names are just the integers 0, 1, 2 and 3."
  - title: A union and a tagged union
    intro: "Two fields sharing one block of memory, then a safe way to use that."
    code: |
      #include <stdio.h>

      union Number {
          int i;
          double d;
      };

      enum Kind { IS_INT, IS_DOUBLE };

      struct Value {
          enum Kind kind;
          union Number as;
      };

      void print_value(struct Value v) {
          if (v.kind == IS_INT) {
              printf("int %d\n", v.as.i);
          } else {
              printf("double %.2f\n", v.as.d);
          }
      }

      int main(void) {
          printf("union %d bytes, int %d, double %d\n",
                 (int)sizeof(union Number), (int)sizeof(int), (int)sizeof(double));
          struct Value a, b;
          a.kind = IS_INT;
          a.as.i = 42;
          b.kind = IS_DOUBLE;
          b.as.d = 2.5;
          print_value(a);
          print_value(b);
          return 0;
      }
    output: |
      union 8 bytes, int 4, double 8
      int 42
      double 2.50
    lines:
      - line: 3
        note: "i and d share the same 8 bytes. Only one is valid at a time."
      - line: 11
        note: "The kind field is the tag that records which member of the union is in use."
      - line: 16
        note: "Always check the tag before reading the union."

playground:
  prompt: |
    Add a field to the Student struct and watch `sizeof` change. Swap the order of the fields. Make an array of three students and fill it with a loop.
  code: |
    #include <stdio.h>

    typedef struct {
        int id;
        char grade;
    } Record;

    int main(void) {
        Record r[3];
        for (int i = 0; i < 3; i++) {
            r[i].id = 100 + i;
            r[i].grade = 'A' + i;
        }
        printf("%d %c, size %d\n", r[2].id, r[2].grade, (int)sizeof(Record));
        return 0;
    }

exercises:
  - id: points
    title: Points and rectangles
    difficulty: 2
    prompt: |
      The structs are declared for you. Write `struct Point make_point(int x, int y)` returning a point, `int manhattan(struct Point a, struct Point b)` returning `|ax - bx| + |ay - by|`, `void translate(struct Point *p, int dx, int dy)` moving the point **in place**, and `int rect_area(struct Rect r)` for a rectangle given by its `top_left` and `bottom_right` points (the bottom-right has larger x and y than the top-left). Write `int rect_contains(struct Rect r, struct Point p)` returning 1 if `p` is inside or on the edge of the rectangle.
    starter: |
      #include <stdio.h>

      struct Point {
          int x;
          int y;
      };

      struct Rect {
          struct Point top_left;
          struct Point bottom_right;
      };

      struct Point make_point(int x, int y) {
          struct Point p;
          return p;
      }

      int manhattan(struct Point a, struct Point b) {
          return 0;
      }

      void translate(struct Point *p, int dx, int dy) {
      }

      int rect_area(struct Rect r) {
          return 0;
      }

      int rect_contains(struct Rect r, struct Point p) {
          return 0;
      }

      int main(void) {
          struct Point a = make_point(1, 2);
          printf("%d %d\n", a.x, a.y);
          return 0;
      }
    tests:
      - name: make and distance
        append: |
          int main(void) {
              struct Point a = make_point(1, 2);
              struct Point b = make_point(4, -2);
              printf("%d %d %d %d ", a.x, a.y, b.x, b.y);
              printf("%d %d\n", manhattan(a, b), manhattan(a, a));
              return 0;
          }
        code: |
          if (output.trim() !== "1 2 4 -2 7 0") throw new Error(`Expected "1 2 4 -2 7 0" but got "${output.trim()}"`);
      - name: translate changes the original
        append: |
          int main(void) {
              struct Point p = make_point(5, 5);
              translate(&p, -2, 10);
              printf("%d %d\n", p.x, p.y);
              return 0;
          }
        code: |
          if (output.trim() !== "3 15") throw new Error(`Expected "3 15" but got "${output.trim()}"`);
      - name: rectangles
        append: |
          int main(void) {
              struct Rect r;
              r.top_left = make_point(1, 1);
              r.bottom_right = make_point(5, 4);
              printf("%d ", rect_area(r));
              printf("%d%d%d%d%d\n",
                  rect_contains(r, make_point(3, 2)),
                  rect_contains(r, make_point(1, 1)),
                  rect_contains(r, make_point(5, 4)),
                  rect_contains(r, make_point(6, 2)),
                  rect_contains(r, make_point(0, 0)));
              return 0;
          }
        code: |
          if (output.trim() !== "12 11100") throw new Error(`Expected "12 11100" but got "${output.trim()}"`);
    hints:
      - "`make_point`: set `p.x = x; p.y = y;` then return `p`. Returning a struct copies it out, which is fine."
      - "Write a tiny helper `int absolute(int n)` for the distances."
      - "`translate` receives a pointer, so use `p->x += dx;`."
      - "Area is `(right.x - left.x) * (bottom.y - top.y)`. Access nested fields with `r.top_left.x`."
    solution: |
      #include <stdio.h>

      struct Point {
          int x;
          int y;
      };

      struct Rect {
          struct Point top_left;
          struct Point bottom_right;
      };

      int absolute(int n) {
          return n < 0 ? -n : n;
      }

      struct Point make_point(int x, int y) {
          struct Point p;
          p.x = x;
          p.y = y;
          return p;
      }

      int manhattan(struct Point a, struct Point b) {
          return absolute(a.x - b.x) + absolute(a.y - b.y);
      }

      void translate(struct Point *p, int dx, int dy) {
          p->x += dx;
          p->y += dy;
      }

      int rect_area(struct Rect r) {
          return (r.bottom_right.x - r.top_left.x) * (r.bottom_right.y - r.top_left.y);
      }

      int rect_contains(struct Rect r, struct Point p) {
          return p.x >= r.top_left.x && p.x <= r.bottom_right.x &&
                 p.y >= r.top_left.y && p.y <= r.bottom_right.y;
      }

      int main(void) {
          struct Point a = make_point(1, 2);
          printf("%d %d\n", a.x, a.y);
          return 0;
      }
    explanation: |
      The two uses of structs differ in exactly the way the lessons predicted: `manhattan` and `rect_area` take copies and only read them, while `translate` takes a pointer and writes through `->`. Returning a struct by value is perfectly valid in C and is a good way to hand back several related results without output parameters.

  - id: student-records
    title: An array of records
    difficulty: 3
    prompt: |
      The `Student` type (a name, an age and a score) is declared for you. Write `double average_score(struct Student *s, int n)` (0.0 for `n == 0`), `int count_passing(struct Student *s, int n, int pass_mark)` counting scores at or above the mark, `struct Student *best(struct Student *s, int n)` returning a pointer to the student with the highest score (the first if tied; `n >= 1`), and `void sort_by_score(struct Student *s, int n)` sorting the array **in place** by score from highest to lowest (use any simple sort; equal scores may end in any order).
    starter: |
      #include <stdio.h>
      #include <string.h>

      struct Student {
          char name[12];
          int age;
          int score;
      };

      double average_score(struct Student *s, int n) {
          return 0.0;
      }

      int count_passing(struct Student *s, int n, int pass_mark) {
          return 0;
      }

      struct Student *best(struct Student *s, int n) {
          return s;
      }

      void sort_by_score(struct Student *s, int n) {
      }

      int main(void) {
          struct Student list[2];
          strcpy(list[0].name, "Ada");
          list[0].age = 20;
          list[0].score = 90;
          strcpy(list[1].name, "Bob");
          list[1].age = 21;
          list[1].score = 70;
          printf("%.1f\n", average_score(list, 2));
          return 0;
      }
    tests:
      - name: setup helpers
        append: |
          void fill(struct Student *s, char *name, int age, int score) {
              strcpy(s->name, name);
              s->age = age;
              s->score = score;
          }
          int main(void) {
              struct Student list[4];
              fill(&list[0], "Ada", 20, 90);
              fill(&list[1], "Bob", 21, 55);
              fill(&list[2], "Cy", 19, 72);
              fill(&list[3], "Di", 22, 90);
              printf("%.2f %d %d %d\n", average_score(list, 4), count_passing(list, 4, 60), count_passing(list, 4, 91), count_passing(list, 0, 0));
              printf("%.1f\n", average_score(list, 0));
              return 0;
          }
        code: |
          if (output.trim() !== "76.75 3 0 0\n0.0") throw new Error(`Got "${output.trim()}"`);
      - name: best
        append: |
          void fill(struct Student *s, char *name, int age, int score) {
              strcpy(s->name, name);
              s->age = age;
              s->score = score;
          }
          int main(void) {
              struct Student list[3];
              fill(&list[0], "Ada", 20, 80);
              fill(&list[1], "Bob", 21, 95);
              fill(&list[2], "Cy", 19, 95);
              struct Student *b = best(list, 3);
              printf("%s %d ", b->name, b == &list[1]);
              b->score = 10;
              printf("%d\n", list[1].score);
              return 0;
          }
        code: |
          if (output.trim() !== "Bob 1 10") throw new Error(`Expected "Bob 1 10" but got "${output.trim()}"`);
      - name: sort
        append: |
          void fill(struct Student *s, char *name, int age, int score) {
              strcpy(s->name, name);
              s->age = age;
              s->score = score;
          }
          int main(void) {
              struct Student list[4];
              fill(&list[0], "Ada", 20, 60);
              fill(&list[1], "Bob", 21, 95);
              fill(&list[2], "Cy", 19, 72);
              fill(&list[3], "Di", 22, 81);
              sort_by_score(list, 4);
              printf("%s %s %s %s | %d %d\n", list[0].name, list[1].name, list[2].name, list[3].name, list[0].age, list[3].age);
              return 0;
          }
        code: |
          if (output.trim() !== "Bob Di Cy Ada | 21 20") throw new Error(`Expected "Bob Di Cy Ada | 21 20" but got "${output.trim()}"`);
    hints:
      - "A `struct Student *s` can be indexed like an array: `s[i].score`."
      - "`best`: remember the index of the highest score, return `s + index` or `&s[index]`."
      - "Sorting: swap whole structs with a temporary `struct Student tmp = s[i]; s[i] = s[j]; s[j] = tmp;`. The assignment copies the name array too."
    solution: |
      #include <stdio.h>
      #include <string.h>

      struct Student {
          char name[12];
          int age;
          int score;
      };

      double average_score(struct Student *s, int n) {
          if (n == 0) return 0.0;
          int total = 0;
          for (int i = 0; i < n; i++) {
              total += s[i].score;
          }
          return (double)total / n;
      }

      int count_passing(struct Student *s, int n, int pass_mark) {
          int count = 0;
          for (int i = 0; i < n; i++) {
              if (s[i].score >= pass_mark) count++;
          }
          return count;
      }

      struct Student *best(struct Student *s, int n) {
          int top = 0;
          for (int i = 1; i < n; i++) {
              if (s[i].score > s[top].score) top = i;
          }
          return &s[top];
      }

      void sort_by_score(struct Student *s, int n) {
          for (int pass = 0; pass < n - 1; pass++) {
              for (int i = 0; i < n - 1 - pass; i++) {
                  if (s[i].score < s[i + 1].score) {
                      struct Student tmp = s[i];
                      s[i] = s[i + 1];
                      s[i + 1] = tmp;
                  }
              }
          }
      }

      int main(void) {
          struct Student list[2];
          strcpy(list[0].name, "Ada");
          list[0].age = 20;
          list[0].score = 90;
          strcpy(list[1].name, "Bob");
          list[1].age = 21;
          list[1].score = 70;
          printf("%.1f\n", average_score(list, 2));
          return 0;
      }
    explanation: |
      Swapping whole structs moves the name, age and score together, which is why sorting an array of records is as easy as sorting numbers. For large structs, real programs often sort an array of *pointers* to the records instead, as in Lesson 9.5, so that each swap moves 8 bytes instead of the whole record. `best` returns a pointer into the caller's array, so changing `b->score` changed `list[1]`.

  - id: pack-fields
    title: Packing a struct
    difficulty: 2
    prompt: |
      The struct `Loose` has four fields in a wasteful order. Define `struct Tight` with **the same four fields** (`char a; int b; char c; short d;`) in an order that makes `sizeof(struct Tight)` equal to **8** bytes, with no padding wasted. Then write `int saved_bytes(void)` returning `sizeof(struct Loose) - sizeof(struct Tight)`.
    starter: |
      #include <stdio.h>

      struct Loose {
          char a;
          int b;
          char c;
          short d;
      };

      struct Tight {
          char a;
          int b;
          char c;
          short d;
      };

      int saved_bytes(void) {
          return 0;
      }

      int main(void) {
          printf("%d %d %d\n", (int)sizeof(struct Loose), (int)sizeof(struct Tight), saved_bytes());
          return 0;
      }
    tests:
      - name: sizes
        append: |
          int main(void) {
              printf("%d %d %d\n", (int)sizeof(struct Loose), (int)sizeof(struct Tight), saved_bytes());
              return 0;
          }
        code: |
          if (output.trim() !== "12 8 4") throw new Error(`Expected "12 8 4" but got "${output.trim()}"`);
      - name: same fields
        code: |
          const tight = source.split("struct Tight")[1] || "";
          const body = tight.slice(tight.indexOf("{"), tight.indexOf("}"));
          for (const f of ["char a;", "int b;", "char c;", "short d;"]) {
            if (!body.includes(f)) throw new Error(`struct Tight must still contain the field "${f}"`);
          }
    hints:
      - "Put the 4-byte `int` first, then the 2-byte `short`, then the two `char` fields."
      - "Fields with larger alignment first usually leaves no gaps."
      - "A struct's size is rounded up to a multiple of its largest field's alignment."
    solution: |
      #include <stdio.h>

      struct Loose {
          char a;
          int b;
          char c;
          short d;
      };

      struct Tight {
          int b;
          short d;
          char a;
          char c;
      };

      int saved_bytes(void) {
          return (int)(sizeof(struct Loose) - sizeof(struct Tight));
      }

      int main(void) {
          printf("%d %d %d\n", (int)sizeof(struct Loose), (int)sizeof(struct Tight), saved_bytes());
          return 0;
      }
    explanation: |
      `Loose` costs 1 + 3 (pad) + 4 + 1 + 1 (pad) + 2 = 12 bytes, because each field must start on its own alignment and the whole struct is rounded up. `Tight` is 4 + 2 + 1 + 1 = 8 with no waste. The saving of 4 bytes per record becomes 400 MB across a hundred million records. In embedded and game code this kind of layout work is routine.

  - id: ring-buffer
    title: A ring buffer in a struct
    difficulty: 4
    prompt: |
      A **ring buffer** is a fixed-size queue stored in an array that wraps around (Lesson 7.3). The struct is declared for you: `data` holds up to 4 integers, `head` is the index of the oldest item and `count` is how many are stored. Write `void ring_init(struct Ring *r)` (empty), `int ring_push(struct Ring *r, int value)` adding at the back and returning 1, or returning 0 and changing nothing if the ring is full, `int ring_pop(struct Ring *r, int *out)` removing the oldest into `*out` and returning 1, or returning 0 if empty, and `int ring_peek_at(struct Ring *r, int i)` returning the i-th oldest item (`0 <= i < count`) without removing it.
    starter: |
      #include <stdio.h>

      struct Ring {
          int data[4];
          int head;
          int count;
      };

      void ring_init(struct Ring *r) {
      }

      int ring_push(struct Ring *r, int value) {
          return 0;
      }

      int ring_pop(struct Ring *r, int *out) {
          return 0;
      }

      int ring_peek_at(struct Ring *r, int i) {
          return 0;
      }

      int main(void) {
          struct Ring r;
          ring_init(&r);
          ring_push(&r, 7);
          printf("%d\n", ring_peek_at(&r, 0));
          return 0;
      }
    tests:
      - name: push and pop in order
        append: |
          int main(void) {
              struct Ring r;
              int v = -1;
              ring_init(&r);
              int a = ring_push(&r, 10);
              int b = ring_push(&r, 20);
              int c = ring_push(&r, 30);
              printf("%d%d%d ", a, b, c);
              printf("%d ", ring_pop(&r, &v));
              printf("%d ", v);
              printf("%d ", ring_pop(&r, &v));
              printf("%d ", v);
              printf("%d ", ring_pop(&r, &v));
              printf("%d ", v);
              printf("%d\n", ring_pop(&r, &v));
              return 0;
          }
        code: |
          if (output.trim() !== "111 1 10 1 20 1 30 0") throw new Error(`Expected "111 1 10 1 20 1 30 0" but got "${output.trim()}"`);
      - name: full ring refuses
        append: |
          int main(void) {
              struct Ring r;
              ring_init(&r);
              int i;
              for (i = 1; i <= 6; i++) printf("%d", ring_push(&r, i * 11));
              printf(" %d %d\n", r.count, ring_peek_at(&r, 3));
              return 0;
          }
        code: |
          if (output.trim() !== "111100 4 44") throw new Error(`Expected "111100 4 44" but got "${output.trim()}"`);
      - name: wraps around
        append: |
          int main(void) {
              struct Ring r;
              int v;
              ring_init(&r);
              int i;
              for (i = 1; i <= 4; i++) ring_push(&r, i);
              ring_pop(&r, &v);
              ring_pop(&r, &v);
              ring_push(&r, 5);
              ring_push(&r, 6);
              printf("%d %d %d %d %d\n", ring_peek_at(&r, 0), ring_peek_at(&r, 1), ring_peek_at(&r, 2), ring_peek_at(&r, 3), r.count);
              printf("%d\n", ring_push(&r, 7));
              return 0;
          }
        code: |
          if (output.trim() !== "3 4 5 6 4\n0") throw new Error(`Got "${output.trim()}"`);
    hints:
      - "The next free slot is `(r->head + r->count) % 4`."
      - "Popping returns `r->data[r->head]`, then moves `head` forward by one (wrapping with `% 4`) and decreases `count`."
      - "`ring_peek_at(r, i)` is `r->data[(r->head + i) % 4]`."
    solution: |
      #include <stdio.h>

      struct Ring {
          int data[4];
          int head;
          int count;
      };

      void ring_init(struct Ring *r) {
          r->head = 0;
          r->count = 0;
      }

      int ring_push(struct Ring *r, int value) {
          if (r->count == 4) {
              return 0;
          }
          r->data[(r->head + r->count) % 4] = value;
          r->count++;
          return 1;
      }

      int ring_pop(struct Ring *r, int *out) {
          if (r->count == 0) {
              return 0;
          }
          *out = r->data[r->head];
          r->head = (r->head + 1) % 4;
          r->count--;
          return 1;
      }

      int ring_peek_at(struct Ring *r, int i) {
          return r->data[(r->head + i) % 4];
      }

      int main(void) {
          struct Ring r;
          ring_init(&r);
          ring_push(&r, 7);
          printf("%d\n", ring_peek_at(&r, 0));
          return 0;
      }
    explanation: |
      The array lives inside the struct, so the whole queue (data plus bookkeeping) is one value you can pass around by pointer. The modulus makes the end of the array connect back to its start. This is how operating systems buffer keyboard input and network packets: a fixed amount of memory, no allocation, and constant time operations. Failing with a return code when full is the C way; the caller decides what to do.

commonMistakes:
  - title: Forgetting that struct assignment is a deep byte copy
    explanation: |
      `b = a` copies every byte, including arrays inside. But pointers inside are copied as addresses, so two structs may then share the same pointed-to data.
  - title: Using . where -> is needed (and the other way round)
    explanation: |
      Use `.` on a struct variable and `->` on a pointer to a struct. `p.age` on a pointer is a compile error; `s->age` on a plain struct is too.
  - title: Assuming sizeof is the sum of the fields
    explanation: |
      Padding makes structs larger. Always use `sizeof`, and put big fields first.
  - title: Comparing structs with ==
    explanation: |
      C cannot compare structs with `==`. Compare field by field. `memcmp` also compares padding garbage, so it is unreliable.
  - title: Reading the wrong member of a union
    explanation: |
      Nothing records which member is valid. Use a tag, and check it every time.
  - title: Passing large structs by value
    explanation: |
      Every call copies the whole struct. Pass a pointer to avoid the copying, and also to let the function change the original.

summary:
  - "A **struct** groups named fields of any types into one value; `typedef` gives it a short name. Use `.` on a variable and `->` on a pointer."
  - "Assigning or passing a struct **copies every byte**. Pass a pointer to avoid the copy and to let a function modify the original."
  - "The compiler inserts **padding** so fields are aligned, so `sizeof` is often more than the sum of the fields; ordering large fields first saves memory."
  - "An **enum** names a set of integer constants and pairs well with `switch` and with arrays indexed by the enum."
  - "A **union** stores its members in the same memory, taking the size of the largest. A **tagged union** adds a field recording which member is valid."
  - "Structs that contain pointers to their own type are the building blocks of linked lists and trees."
next: |
  Every variable so far had a size fixed when you wrote the program. Lesson 9.7 moves to the **heap**, where you ask the operating system for memory at run time with `malloc` and give it back with `free`. It is the power behind every growing list in C and the origin of its most notorious bugs: leaks, double frees and use-after-free.

quiz:
