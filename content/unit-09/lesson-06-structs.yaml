  - type: code
    question: |
      A `struct Pair` with two ints `a` and `b` is declared. Write `int pair_sum(struct Pair *p)` returning `a + b`, and `void pair_swap(struct Pair *p)` that exchanges the two fields.
    starter: |
      #include <stdio.h>

      struct Pair {
          int a;
          int b;
      };

      int pair_sum(struct Pair *p) {
          return 0;
      }

      void pair_swap(struct Pair *p) {
      }

      int main(void) {
          struct Pair p;
          p.a = 1;
          p.b = 2;
          pair_swap(&p);
          printf("%d %d %d\n", p.a, p.b, pair_sum(&p));
          return 0;
      }
    tests:
      - name: pair
        append: |
          int main(void) {
              struct Pair p;
              p.a = 3;
              p.b = 10;
              printf("%d ", pair_sum(&p));
              pair_swap(&p);
              printf("%d %d\n", p.a, p.b);
              return 0;
          }
        code: |
          if (output.trim() !== "13 10 3") throw new Error(`Expected "13 10 3" but got "${output.trim()}"`);
    solution: |
      #include <stdio.h>

      struct Pair {
          int a;
          int b;
      };

      int pair_sum(struct Pair *p) {
          return p->a + p->b;
      }

      void pair_swap(struct Pair *p) {
          int tmp = p->a;
          p->a = p->b;
          p->b = tmp;
      }

      int main(void) {
          struct Pair p;
          p.a = 1;
          p.b = 2;
          pair_swap(&p);
          printf("%d %d %d\n", p.a, p.b, pair_sum(&p));
          return 0;
      }
