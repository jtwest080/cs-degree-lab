    options: [
      "Reading it after the free would be use after free",
      "free changes the next pointer to NULL",
      "The compiler requires it",
      "It makes free faster"
    ]
    answer: 0
    explanation: "Once freed, the node's memory no longer belongs to you."
  - type: mcq
    question: Why does a dynamic array double its capacity rather than growing by one?
    options: [
      "Doubling makes push O(1) on average, since resizes become rare",
      "Doubling is required by realloc",
      "It saves memory",
      "Growing by one is impossible"
    ]
    answer: 0
    explanation: "Copying n items once every n pushes averages to a constant cost per push (amortised analysis)."
