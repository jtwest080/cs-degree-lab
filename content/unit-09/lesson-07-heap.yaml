    question: What is a memory leak?
    options: [
      "Allocated memory that is never freed and can no longer be reached",
      "Using memory after it has been freed",
      "Writing past the end of an array",
      "Freeing memory twice"
    ]
    answer: 0
    explanation: "The memory stays reserved until the program ends, with nothing able to release it."
