    ]
    answer: 0
    explanation: "free(NULL) does nothing, so a second free of the nulled pointer is harmless."
  - type: code
    question: |
      Write `int *make_filled(int n, int value)` returning a new heap array of `n` ints, each equal to `value`.
    starter: |
      #include <stdio.h>
      #include <stdlib.h>

      int *make_filled(int n, int value) {
          return NULL;
      }

      int main(void) {
          int *a = make_filled(3, 7);
          printf("%d %d %d\n", a[0], a[1], a[2]);
          free(a);
          return 0;
      }
    tests:
      - name: filled
        append: |
          int main(void) {
              int *a = make_filled(4, 9);
              int *b = make_filled(1, -3);
              printf("%d %d %d %d %d\n", a[0], a[1], a[2], a[3], b[0]);
              free(a);
              free(b);
              return 0;
          }
        code: |
          if (output.trim() !== "9 9 9 9 -3") throw new Error(`Expected "9 9 9 9 -3" but got "${output.trim()}"`);
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int *make_filled(int n, int value) {
          int *a = (int *)malloc(n * sizeof(int));
          for (int i = 0; i < n; i++) {
              a[i] = value;
          }
          return a;
      }

      int main(void) {
          int *a = make_filled(3, 7);
          printf("%d %d %d\n", a[0], a[1], a[2]);
          free(a);
          return 0;
      }
