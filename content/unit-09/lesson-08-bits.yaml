id: u9-bits
title: "Bits, Bytes and Number Representation"
minutes: 60
objective: |
  Work directly with the bits inside a number: use the bitwise operators, masks and flags, understand how negative numbers are stored (two's complement), and see the individual bytes of a value in memory, including their order (endianness).
outcomes:
  - Apply AND, OR, XOR, NOT and the shift operators, and read values in hexadecimal
  - Test, set, clear and toggle individual bits with masks
  - Pack several small values into one integer and unpack them again
  - Explain two's complement and why `~x + 1` equals `-x`
  - Inspect the bytes of an int through an `unsigned char` pointer
  - Explain little-endian versus big-endian and why it matters for files and networks

sections:
  - heading: Everything is bits
    body: |
      Memory is a long row of **bits**, each 0 or 1. Eight bits make a **byte**, the smallest unit with its own address. A 4-byte `int` is 32 bits. So far you have treated an `int` as "a number", but C lets you treat it as 32 separate switches, and many real programs do: file permissions, graphics colours, network headers, hardware registers, compression, and hash functions.

      **Hexadecimal** (base 16) is the usual way to write bit patterns, because each hex digit is exactly 4 bits:

      | hex | binary | hex | binary |
      |---|---|---|---|
      | 0 | 0000 | 8 | 1000 |
      | 1 | 0001 | 9 | 1001 |
      | 2 | 0010 | A | 1010 |
      | 3 | 0011 | B | 1011 |
      | 4 | 0100 | C | 1100 |
      | 5 | 0101 | D | 1101 |
      | 6 | 0110 | E | 1110 |
      | 7 | 0111 | F | 1111 |

      So `0xFF` is `1111 1111` (one byte, all ones, which is 255), and `0xA5` is `1010 0101`. C writes hex with a `0x` prefix, and `printf` prints it with `%x` (`%08x` pads to 8 digits with zeros).

  - heading: The bitwise operators
    body: |
      These work on every bit position at once. (Do not confuse `&` with the logical `&&`: `&&` asks "are both conditions true?", while `&` combines the bits of two numbers.)

      | Operator | Name | Rule (per bit) | `12 op 10` (`1100` and `1010`) |
      |---|---|---|---|
      | `a & b` | AND | 1 only if both are 1 | `1000` = 8 |
      | `a \| b` | OR | 1 if either is 1 | `1110` = 14 |
      | `a ^ b` | XOR | 1 if they differ | `0110` = 6 |
      | `~a` | NOT | flips every bit | `...0011` = -13 |
      | `a << n` | shift left | move bits up n places, fill with 0 | `12 << 2` = 48 |
      | `a >> n` | shift right | move bits down n places | `12 >> 1` = 6 |

      **Shifts are multiplication and division by powers of two.** `x << n` is `x * 2^n`, and `x >> n` is `x / 2^n` rounded down. Hardware does a shift in one step, which is why optimisers replace `x * 8` with `x << 3`.

      **XOR** has a beautiful property: `a ^ b ^ b` is `a` again. That makes it the core of simple ciphers, parity checks, and the classic trick of swapping two variables without a temporary. `x ^ x` is always 0.

      One caution that is specific to C: shifting a **signed** number right is implementation-defined (usually it copies the top bit, the "arithmetic shift"), and shifting by the width of the type or more is undefined. When you need to pull out bits from a possibly negative value, shift first and then mask with `& 0xFF`, as the examples do. (The interpreter in this app also treats unsigned shifts as signed, so the lessons mask after shifting.)

  - heading: Masks and flags
    body: |
      A **mask** is a number whose 1-bits mark the positions you care about. With it you can inspect or change individual bits, leaving the others alone:

      ```c
      x & (1 << k)            // is bit k set? (nonzero means yes)
      x |= (1 << k);          // set bit k to 1
      x &= ~(1 << k);         // clear bit k to 0
      x ^= (1 << k);          // toggle bit k
      (x >> k) & 1            // the value of bit k, as 0 or 1
      x & 0xFF                // keep only the low 8 bits (the low byte)
      ```

      Bits are numbered from the right, starting at 0 (the **least significant bit**, which has value 1). Bit 7 has value 128.

      **Flags.** A set of independent yes/no options fits in one integer, one bit each. Unix file permissions are the famous example: read = 4, write = 2, execute = 1, so `rwx` is 7 and `r-x` is 5. `chmod 755` means "owner 7, group 5, others 5", three flag-sets packed into three octal digits. Many C APIs accept several options combined with `|`.

      **Packing.** Several small numbers can share one integer. A colour pixel stores red, green, blue and alpha as four bytes in one 32-bit value: `(r << 24) | (g << 16) | (b << 8) | a`. To get green back, shift it down and mask: `(pixel >> 16) & 0xFF`.

  - heading: Two's complement
    body: |
      How are negative numbers stored? Almost every computer uses **two's complement**. In a type with `w` bits, the top bit has a **negative** weight of `-2^(w-1)`; the other bits count normally. In 8 bits:

      ```text
      0000 0101  =   5
      1111 1011  =  -128 + 64 + 32 + 16 + 8 + 2 + 1 = -5
      1000 0000  = -128   (the smallest 8-bit value)
      0111 1111  =  127   (the largest)
      ```

      The negative of a number is found by **flipping all the bits and adding 1**: `-x == ~x + 1`. Check with 5: flipping `0000 0101` gives `1111 1010`, adding 1 gives `1111 1011`, which is -5.

      Why this design? Because **addition and subtraction use the same circuit for signed and unsigned numbers**, with no special case for the sign. Adding `5 + (-5)` gives `1 0000 0000`, and the carry out of the top is discarded, leaving 0. There is also only one zero. The cost is the asymmetry: an 8-bit signed range is -128 to 127, so negating -128 overflows, and `abs(INT_MIN)` is still negative.

      The same bits can be read either way. The 8-bit pattern `1111 1011` is **251** as an `unsigned char` and **-5** as a `signed char`. A cast does not change any bits, only how they are interpreted. This is exactly the wraparound you saw in Lesson 9.1.

  - heading: Bytes in memory and endianness
    body: |
      A 4-byte integer occupies four consecutive addresses. Which byte goes first? There are two conventions:

      - **Little-endian**: the **least** significant byte comes first (at the lowest address). Intel, AMD and almost all ARM devices, including your phone and laptop, work this way.
      - **Big-endian**: the **most** significant byte comes first, as we write numbers on paper. Many network protocols use it, so it is also called **network byte order**.

      The value `0x01020304` is stored in memory as:

      ```text
      address:        +0  +1  +2  +3
      little-endian:  04  03  02  01
      big-endian:     01  02  03  04
      ```

      You can see this by pointing an `unsigned char *` at an `int`: a `char` pointer steps one byte at a time, and `unsigned` avoids negative surprises when you print the byte values.

      Endianness matters whenever data leaves the program: writing a binary file, sending bytes over a network, or reading a format defined by someone else (PNG, ZIP and IP headers are big-endian; BMP and WAV are little-endian). The fix is to convert explicitly with shifts and masks, which behave the same on every machine because they work on **values**, not on memory layout.

examples:
  - title: The operators at work
    intro: "Print the results of each operator, and the same numbers in hex."
    code: |
      #include <stdio.h>

      int main(void) {
          int a = 12;   // 1100
          int b = 10;   // 1010
          printf("and=%d or=%d xor=%d not=%d\n", a & b, a | b, a ^ b, ~a);
          printf("shl=%d shr=%d\n", a << 2, a >> 1);
          int x = 0xA5;
          printf("x=%d hex=%x low nibble=%x high nibble=%x\n", x, x, x & 0xF, (x >> 4) & 0xF);
          int y = 7;
          int z = 9;
          y = y ^ z;
          z = y ^ z;
          y = y ^ z;
          printf("swapped: y=%d z=%d\n", y, z);
          return 0;
      }
    output: |
      and=8 or=14 xor=6 not=-13
      shl=48 shr=6
      x=165 hex=a5 low nibble=5 high nibble=a
      swapped: y=9 z=7
    lines:
      - line: 7
        note: "1100 AND 1010 = 1000 (8). OR = 1110 (14). XOR = 0110 (6). NOT flips every bit of all 32, giving -13."
      - line: 8
        note: "Shifting left by 2 multiplies by 4; shifting right by 1 halves."
      - line: 10
        note: "A nibble is 4 bits, one hex digit. Shift down and mask to pull out the high one."
      - line: 13
        note: "The XOR swap: y becomes y^z, then z becomes the old y, then y becomes the old z. No temporary variable."
  - title: Test, set, clear, toggle
    intro: "Every bit operation is one line with a mask. This prints a byte in binary so you can watch it change."
    code: |
      #include <stdio.h>

      void show(int x) {
          for (int i = 7; i >= 0; i--) {
              printf("%d", (x >> i) & 1);
          }
          printf("\n");
      }

      int main(void) {
          int flags = 0;
          flags |= 1 << 2;
          flags |= 1 << 5;
          show(flags);
          flags ^= 1 << 5;
          show(flags);
          flags |= 0x0F;
          show(flags);
          flags &= ~(1 << 0);
          show(flags);
          printf("bit 2 set? %d, bit 6 set? %d\n", (flags & (1 << 2)) != 0, (flags & (1 << 6)) != 0);
          return 0;
      }
    output: |
      00100100
      00000100
      00001111
      00001110
      bit 2 set? 1, bit 6 set? 0
    lines:
      - line: 5
        note: "Loop from bit 7 down to bit 0: shift the bit into the lowest place and mask with 1."
      - line: 13
        note: "Set bits with OR. Other bits are untouched."
      - line: 16
        note: "XOR with a mask toggles: 5 was on, so it goes off."
      - line: 20
        note: "AND with the inverted mask clears one bit. ~(1 << 0) is all ones except bit 0."
  - title: Packing a colour
    intro: "Pack red, green and blue (0 to 255 each) into one integer, then unpack them."
    code: |
      #include <stdio.h>

      int pack(int r, int g, int b) {
          return (r << 16) | (g << 8) | b;
      }

      int red(int c)   { return (c >> 16) & 0xFF; }
      int green(int c) { return (c >> 8) & 0xFF; }
      int blue(int c)  { return c & 0xFF; }

      int main(void) {
          int orange = pack(255, 165, 0);
          printf("packed: %d = 0x%06x\n", orange, orange);
          printf("r=%d g=%d b=%d\n", red(orange), green(orange), blue(orange));
          int dim = pack(red(orange) / 2, green(orange) / 2, blue(orange) / 2);
          printf("half brightness: #%06x\n", dim);
          return 0;
      }
    output: |
      packed: 16753920 = 0xffa500
      r=255 g=165 b=0
      half brightness: #7f5200
    lines:
      - line: 4
        note: "Each channel moves to its own byte: red to bits 16-23, green to 8-15, blue to 0-7."
      - line: 8
        note: "To read a channel, shift it to the bottom and keep one byte with & 0xFF."
      - line: 14
        note: "%06x prints six hex digits padded with zeros: the familiar web colour code, 0xFFA500 is orange."
  - title: Two's complement
    intro: "Negation is flip and add one. The same 8 bits mean 251 or -5 depending on the type."
    code: |
      #include <stdio.h>

      int main(void) {
          int x = 5;
          int neg = ~x + 1;
          printf("~5=%d  ~5+1=%d\n", ~x, neg);
          unsigned char u = 251;
          signed char s = (signed char)u;
          printf("u=%d s=%d\n", u, s);
          signed char big = 127;
          big = big + 1;
          printf("127+1 as 8 bits = %d\n", big);
          printf("-1 as hex: %x\n", -1);
          printf("-5 low byte: %x\n", -5 & 0xFF);
          return 0;
      }
    output: |
      ~5=-6  ~5+1=-5
      u=251 s=-5
      127+1 as 8 bits = -128
      -1 as hex: ffffffff
      -5 low byte: fb
    lines:
      - line: 5
        note: "Flip all bits (~5 is -6) and add one: -5. This is how the CPU negates."
      - line: 8
        note: "A cast does not change bits, only how they are read."
      - line: 11
        note: "127 + 1 overflows the 8-bit range and wraps to -128."
      - line: 14
        note: "Masking with 0xFF reveals the low byte of -5 as the raw pattern fb."
  - title: Looking at bytes and endianness
    intro: "Point an unsigned char pointer at an int to see the bytes in memory order."
    code: |
      #include <stdio.h>

      int main(void) {
          int x = 0x01020304;
          unsigned char *p = (unsigned char *)&x;
          for (int i = 0; i < 4; i++) {
              printf("byte %d: %02x\n", i, p[i]);
          }
          if (p[0] == 4) {
              printf("little-endian\n");
          } else {
              printf("big-endian\n");
          }
          return 0;
      }
    output: |
      byte 0: 04
      byte 1: 03
      byte 2: 02
      byte 3: 01
      little-endian
    lines:
      - line: 5
        note: "A char pointer moves one byte at a time, so p[0] is the byte at the lowest address."
      - line: 7
        note: "%02x prints each byte as exactly two hex digits."
      - line: 9
        note: "If the least significant byte (04) comes first, this machine is little-endian."

playground:
  prompt: |
    Print 1 shifted left by 0 through 10 (the powers of two). Then use `x & (x - 1)` on 12, 16 and 7 and notice what happens: it clears the lowest set bit, which is why `x & (x - 1) == 0` tests for a power of two.
  code: |
    #include <stdio.h>

    int main(void) {
        int n = 181;
        int ones = 0;
        while (n != 0) {
            ones += n & 1;
            n = n >> 1;
        }
        printf("181 has %d one-bits\n", ones);
        return 0;
    }

exercises:
  - id: bit-ops
    title: Bit toolkit
    difficulty: 2
    prompt: |
      Write four functions on an `int x` and a bit position `k` (0 to 30): `int get_bit(int x, int k)` returns 0 or 1, `int set_bit(int x, int k)` returns `x` with bit `k` set, `int clear_bit(int x, int k)` returns `x` with bit `k` cleared, and `int toggle_bit(int x, int k)` returns `x` with bit `k` flipped. None of them change the argument.
    starter: |
      #include <stdio.h>

      int get_bit(int x, int k) {
          return 0;
      }

      int set_bit(int x, int k) {
          return x;
      }

      int clear_bit(int x, int k) {
          return x;
      }

      int toggle_bit(int x, int k) {
          return x;
      }

      int main(void) {
          printf("%d %d\n", get_bit(5, 0), set_bit(0, 3));
          return 0;
      }
    tests:
      - name: get and set
        append: |
          int main(void) {
              printf("%d %d %d %d\n", get_bit(5, 0), get_bit(5, 1), get_bit(5, 2), get_bit(5, 30));
              printf("%d %d %d\n", set_bit(0, 3), set_bit(8, 3), set_bit(1, 30));
              return 0;
          }
        code: |
          if (output.trim() !== "1 0 1 0\n8 8 1073741825") throw new Error(`Expected "1 0 1 0\\n8 8 1073741825" but got "${output.trim()}"`);
      - name: clear and toggle
        append: |
          int main(void) {
              printf("%d %d %d\n", clear_bit(15, 1), clear_bit(8, 0), clear_bit(1073741825, 30));
              printf("%d %d %d\n", toggle_bit(5, 1), toggle_bit(7, 2), toggle_bit(0, 30));
              return 0;
          }
        code: |
          if (output.trim() !== "13 8 1\n7 3 1073741824") throw new Error(`Expected "13 8 1\\n7 3 1073741824" but got "${output.trim()}"`);
    hints:
      - "`get_bit`: shift right by k, then AND with 1."
      - "`set_bit`: OR with `1 << k`."
      - "`clear_bit`: AND with `~(1 << k)`."
      - "`toggle_bit`: XOR with `1 << k`."
    solution: |
      #include <stdio.h>

      int get_bit(int x, int k) {
          return (x >> k) & 1;
      }

      int set_bit(int x, int k) {
          return x | (1 << k);
      }

      int clear_bit(int x, int k) {
          return x & ~(1 << k);
      }

      int toggle_bit(int x, int k) {
          return x ^ (1 << k);
      }

      int main(void) {
          printf("%d %d\n", get_bit(5, 0), set_bit(0, 3));
          return 0;
      }
    explanation: |
      All four share one mask, `1 << k`, and differ only in the operator: OR sets, AND with the inverse clears, XOR flips, and shifting then ANDing with 1 reads. These four lines are the whole vocabulary of bit manipulation.

  - id: bit-tricks
    title: Counting and power-of-two tricks
    difficulty: 3
    prompt: |
      Write `int popcount(int x)` (the number of 1 bits in a non-negative `x`), `int is_power_of_two(int x)` (1 if `x > 0` and has exactly one 1-bit, else 0, using the `x & (x - 1)` trick, **no loops**), `int lowest_set_bit(int x)` (the value of the lowest 1-bit, e.g. 12 gives 4; 0 gives 0; use `x & -x`), and `int bit_length(int x)` (how many bits are needed to write a non-negative `x`; 0 gives 0, 1 gives 1, 255 gives 8, 256 gives 9).
    starter: |
      #include <stdio.h>

      int popcount(int x) {
          return 0;
      }

      int is_power_of_two(int x) {
          return 0;
      }

      int lowest_set_bit(int x) {
          return 0;
      }

      int bit_length(int x) {
          return 0;
      }

      int main(void) {
          printf("%d %d\n", popcount(255), is_power_of_two(64));
          return 0;
      }
    tests:
      - name: popcount
        append: |
          int main(void) {
              printf("%d %d %d %d\n", popcount(0), popcount(1), popcount(255), popcount(1000000));
              return 0;
          }
        code: |
          if (output.trim() !== "0 1 8 7") throw new Error(`Expected "0 1 8 7" but got "${output.trim()}"`);
      - name: power of two
        append: |
          int main(void) {
              printf("%d %d %d %d %d %d\n", is_power_of_two(1), is_power_of_two(64), is_power_of_two(96), is_power_of_two(0), is_power_of_two(-8), is_power_of_two(1073741824));
              return 0;
          }
        code: |
          if (output.trim() !== "1 1 0 0 0 1") throw new Error(`Expected "1 1 0 0 0 1" but got "${output.trim()}"`);
      - name: lowest bit and length
        append: |
          int main(void) {
              printf("%d %d %d %d\n", lowest_set_bit(12), lowest_set_bit(0), lowest_set_bit(40), lowest_set_bit(7));
              printf("%d %d %d %d %d\n", bit_length(0), bit_length(1), bit_length(255), bit_length(256), bit_length(1000));
              return 0;
          }
        code: |
          if (output.trim() !== "4 0 8 1\n0 1 8 9 10") throw new Error(`Expected "4 0 8 1\\n0 1 8 9 10" but got "${output.trim()}"`);
    hints:
      - "`popcount`: loop while x is nonzero, add `x & 1`, shift right. (Or use `x = x & (x - 1)` to clear one bit per loop and count the loops.)"
      - "`is_power_of_two`: `x > 0 && (x & (x - 1)) == 0`."
      - "`lowest_set_bit`: `x & -x`, since negation flips everything above the lowest 1."
      - "`bit_length`: count how many times you can shift right before x becomes 0."
    solution: |
      #include <stdio.h>

      int popcount(int x) {
          int count = 0;
          while (x != 0) {
              count += x & 1;
              x = x >> 1;
          }
          return count;
      }

      int is_power_of_two(int x) {
          return x > 0 && (x & (x - 1)) == 0;
      }

      int lowest_set_bit(int x) {
          return x & -x;
      }

      int bit_length(int x) {
          int n = 0;
          while (x != 0) {
              n++;
              x = x >> 1;
          }
          return n;
      }

      int main(void) {
          printf("%d %d\n", popcount(255), is_power_of_two(64));
          return 0;
      }
    explanation: |
      `x - 1` flips the lowest 1-bit and all the zeros below it, so `x & (x - 1)` erases exactly the lowest 1-bit. A power of two has only one, so erasing it leaves 0. `x & -x` works because two's complement negation (`~x + 1`) leaves the lowest 1-bit and everything below it unchanged but flips everything above. These tricks appear in memory allocators, hash tables (power-of-two sizes let you use `& (size - 1)` instead of the slow `%`), and bitboards in chess engines.

  - id: pack-unpack
    title: Packing date and time
    difficulty: 3
    prompt: |
      A date can be packed into 16 bits like the old FAT file system did: the year since 1980 in the top 7 bits, the month (1 to 12) in the next 4 bits, and the day (1 to 31) in the low 5 bits. Layout: `yyyyyyy mmmm ddddd`. Write `int pack_date(int year, int month, int day)`, and `int date_year(int d)`, `int date_month(int d)`, `int date_day(int d)` that undo it. `year` is the full year such as 2026.
    starter: |
      #include <stdio.h>

      int pack_date(int year, int month, int day) {
          return 0;
      }

      int date_year(int d) {
          return 0;
      }

      int date_month(int d) {
          return 0;
      }

      int date_day(int d) {
          return 0;
      }

      int main(void) {
          int d = pack_date(2026, 11, 7);
          printf("%d %d %d %d\n", d, date_year(d), date_month(d), date_day(d));
          return 0;
      }
    tests:
      - name: pack value
        append: |
          int main(void) {
              printf("%d %d %d\n", pack_date(1980, 1, 1), pack_date(2026, 11, 7), pack_date(2107, 12, 31));
              return 0;
          }
        code: |
          if (output.trim() !== "33 23911 65439") throw new Error(`Expected "33 23911 65439" but got "${output.trim()}"`);
      - name: round trip
        append: |
          int main(void) {
              int y, m, d;
              int ok = 1;
              for (y = 1980; y <= 2107; y += 9) {
                  for (m = 1; m <= 12; m++) {
                      for (d = 1; d <= 31; d += 10) {
                          int p = pack_date(y, m, d);
                          if (date_year(p) != y || date_month(p) != m || date_day(p) != d) ok = 0;
                      }
                  }
              }
              printf("%d\n", ok);
              return 0;
          }
        code: |
          if (output.trim() !== "1") throw new Error(`Round trip failed: got "${output.trim()}"`);
    hints:
      - "Year goes in bits 9 to 15: `(year - 1980) << 9`. Month goes in bits 5 to 8: `month << 5`. Day needs no shift."
      - "To unpack, shift the field down to the bottom and mask: month is `(d >> 5) & 0xF`, day is `d & 0x1F`."
      - "Year is `(d >> 9) + 1980`; the top field has nothing above it to mask away (as long as `d` is under 65536)."
    solution: |
      #include <stdio.h>

      int pack_date(int year, int month, int day) {
          return ((year - 1980) << 9) | (month << 5) | day;
      }

      int date_year(int d) {
          return ((d >> 9) & 0x7F) + 1980;
      }

      int date_month(int d) {
          return (d >> 5) & 0xF;
      }

      int date_day(int d) {
          return d & 0x1F;
      }

      int main(void) {
          int d = pack_date(2026, 11, 7);
          printf("%d %d %d %d\n", d, date_year(d), date_month(d), date_day(d));
          return 0;
      }
    explanation: |
      Each field is stored by shifting it to its position and combined with OR, and recovered by shifting it back and masking to its width (7 bits is `0x7F`, 4 bits is `0xF`, 5 bits is `0x1F`). Because the fields never overlap, no information is lost. The widths set the limits: 5 bits hold days up to 31, and 7 bits hold 128 years (1980 to 2107), which is why FAT timestamps stop in 2107.

  - id: byte-swap
    title: Fixing byte order
    difficulty: 4
    prompt: |
      Write `unsigned int swap32(unsigned int x)` that reverses the four bytes of `x` (so `0x01020304` becomes `0x04030201`), using shifts and masks only. Then write `unsigned int read_be32(unsigned char *b)` that reads four bytes in **big-endian** order from an array (first byte most significant) and returns the value, and `unsigned int read_le32(unsigned char *b)` that reads them in little-endian order. These work identically on any machine.
    starter: |
      #include <stdio.h>

      unsigned int swap32(unsigned int x) {
          return 0;
      }

      unsigned int read_be32(unsigned char *b) {
          return 0;
      }

      unsigned int read_le32(unsigned char *b) {
          return 0;
      }

      int main(void) {
          unsigned char data[4] = {1, 2, 3, 4};
          printf("%x %x %x\n", read_be32(data), read_le32(data), swap32(0x01020304));
          return 0;
      }
    tests:
      - name: swap
        append: |
          int main(void) {
              printf("%x %x %x\n", swap32(0x01020304), swap32(0x000000FF), swap32(0x12345678));
              printf("%x\n", swap32(swap32(0xAABBCCDD)));
              return 0;
          }
        code: |
          if (output.trim() !== "4030201 ff000000 78563412\naabbccdd") throw new Error(`Got "${output.trim()}"`);
      - name: read big and little
        append: |
          int main(void) {
              unsigned char png[4] = {0, 0, 1, 0};
              unsigned char hdr[4] = {0x89, 0x50, 0x4E, 0x47};
              printf("%u %u\n", read_be32(png), read_le32(png));
              printf("%x %x\n", read_be32(hdr), read_le32(hdr));
              return 0;
          }
        code: |
          if (output.trim() !== "256 65536\n89504e47 474e5089") throw new Error(`Expected "256 65536\\n89504e47 474e5089" but got "${output.trim()}"`);
    hints:
      - "`read_be32`: `((unsigned int)b[0] << 24) | ((unsigned int)b[1] << 16) | ((unsigned int)b[2] << 8) | b[3]`."
      - "`read_le32` is the same with the indices reversed."
      - "`swap32` can reuse the idea: shift each byte to its mirror position, masking after any right shift (`& 0xFF`, `& 0xFF00`)."
    solution: |
      #include <stdio.h>

      unsigned int swap32(unsigned int x) {
          unsigned int b0 = x & 0xFF;
          unsigned int b1 = (x >> 8) & 0xFF;
          unsigned int b2 = (x >> 16) & 0xFF;
          unsigned int b3 = (x >> 24) & 0xFF;
          return (b0 << 24) | (b1 << 16) | (b2 << 8) | b3;
      }

      unsigned int read_be32(unsigned char *b) {
          return ((unsigned int)b[0] << 24) | ((unsigned int)b[1] << 16) | ((unsigned int)b[2] << 8) | (unsigned int)b[3];
      }

      unsigned int read_le32(unsigned char *b) {
          return ((unsigned int)b[3] << 24) | ((unsigned int)b[2] << 16) | ((unsigned int)b[1] << 8) | (unsigned int)b[0];
      }

      int main(void) {
          unsigned char data[4] = {1, 2, 3, 4};
          printf("%x %x %x\n", read_be32(data), read_le32(data), swap32(0x01020304));
          return 0;
      }
    explanation: |
      These functions compute on **values** with shifts, so the result does not depend on the machine's byte order. That is the portable way to parse binary file formats and network packets: decode the bytes explicitly in the order the format specifies. Real systems provide the same idea as `htonl` and `ntohl` ("host to network long").

  - id: perms
    title: Unix permissions
    difficulty: 3
    prompt: |
      Unix permissions use three flags: read = 4, write = 2, execute = 1. A mode like `755` has three octal digits for owner, group and others. Write `int can(int mode, int who, int perm)` where `who` is 0 for owner, 1 for group, 2 for others, and `perm` is 4, 2 or 1; return 1 if allowed. Write `void describe(int mode)` that prints the mode like `rwxr-xr-x` followed by a newline (a dash where a permission is missing). Write `int make_mode(int owner, int group, int others)` combining three digits (each 0 to 7) into one number as `chmod` does (the owner digit is shifted most), e.g. `make_mode(7, 5, 5)` is 493 (that is `0755` in octal).
    starter: |
      #include <stdio.h>

      int can(int mode, int who, int perm) {
          return 0;
      }

      void describe(int mode) {
      }

      int make_mode(int owner, int group, int others) {
          return 0;
      }

      int main(void) {
          int m = make_mode(7, 5, 5);
          printf("%d\n", m);
          describe(m);
          return 0;
      }
    tests:
      - name: make_mode and can
        append: |
          int main(void) {
              int m = make_mode(7, 5, 4);
              printf("%d ", m);
              printf("%d%d%d ", can(m, 0, 2), can(m, 1, 2), can(m, 2, 2));
              printf("%d%d%d ", can(m, 0, 1), can(m, 1, 1), can(m, 2, 1));
              printf("%d%d%d\n", can(m, 0, 4), can(m, 1, 4), can(m, 2, 4));
              return 0;
          }
        code: |
          if (output.trim() !== "492 100 110 111") throw new Error(`Expected "492 100 110 111" but got "${output.trim()}"`);
      - name: describe
        append: |
          int main(void) {
              describe(make_mode(7, 5, 5));
              describe(make_mode(6, 4, 0));
              describe(make_mode(0, 0, 0));
              describe(make_mode(7, 7, 7));
              return 0;
          }
        code: |
          if (output.trim() !== "rwxr-xr-x\nrw-r-----\n---------\nrwxrwxrwx") throw new Error(`Got "${output.trim()}"`);
    hints:
      - "Each class occupies 3 bits: owner at bits 6-8, group at bits 3-5, others at bits 0-2. So the class digit is `(mode >> (3 * (2 - who))) & 7`."
      - "`can` is then `(digit & perm) != 0`."
      - "`describe`: for each of the 9 bit positions from 8 down to 0, print a letter if that bit is set, otherwise `-`. The letters repeat `r w x`."
      - "`make_mode`: `(owner << 6) | (group << 3) | others`."
    solution: |
      #include <stdio.h>

      int can(int mode, int who, int perm) {
          int digit = (mode >> (3 * (2 - who))) & 7;
          return (digit & perm) != 0;
      }

      void describe(int mode) {
          char letters[4] = "rwx";
          for (int i = 8; i >= 0; i--) {
              if ((mode >> i) & 1) {
                  printf("%c", letters[(8 - i) % 3]);
              } else {
                  printf("-");
              }
          }
          printf("\n");
      }

      int make_mode(int owner, int group, int others) {
          return (owner << 6) | (group << 3) | others;
      }

      int main(void) {
          int m = make_mode(7, 5, 5);
          printf("%d\n", m);
          describe(m);
          return 0;
      }
    explanation: |
      Three digits of three bits each pack nine yes/no flags into one small integer, which is exactly how the file system stores them. Octal (base 8) is used for modes because each octal digit is exactly 3 bits, just as each hex digit is 4. This is also the model for any "set of options" API: define one constant per bit and combine them with `|`.

commonMistakes:
  - title: Using & where you meant &&
    explanation: |
      `if (a & b)` combines bits; `if (a && b)` tests that both are nonzero. `1 & 2` is 0 (false!), but `1 && 2` is 1 (true).
  - title: Operator precedence
    explanation: |
      Comparison binds tighter than the bitwise operators, so `x & 1 == 0` means `x & (1 == 0)`. Always parenthesise: `(x & 1) == 0`.
  - title: Shifting a signed number to the right and expecting zeros
    explanation: |
      Right shift of a negative `int` usually fills with copies of the sign bit. Mask afterwards (`& 0xFF`), or use unsigned types.
  - title: Shifting by too much
    explanation: |
      `1 << 32` on a 32-bit `int` is undefined behaviour. The shift amount must be less than the number of bits in the type.
  - title: Reading bytes through a signed char
    explanation: |
      A `char` holding 0xFF prints as -1. Use `unsigned char` when you want raw byte values from 0 to 255.
  - title: Assuming byte order
    explanation: |
      Writing an `int` directly to a file or a network socket bakes in this machine's endianness. Encode multi-byte values explicitly with shifts.

summary:
  - "Memory is bits grouped in bytes. **Hexadecimal** shows them compactly: one hex digit is four bits."
  - "`&` `|` `^` `~` work on every bit at once; `<<` and `>>` multiply and divide by powers of two. Mask with `& 0xFF` after shifting."
  - "To **test, set, clear and toggle** bit k use `x & (1<<k)`, `x |= 1<<k`, `x &= ~(1<<k)`, `x ^= 1<<k`."
  - "**Flags and packing** store many small values in one integer, as Unix permissions and pixel colours do."
  - "**Two's complement** gives the top bit a negative weight; `-x == ~x + 1`. The same bits can be read as signed or unsigned."
  - "**Endianness** is the order of an integer's bytes in memory (little-endian on nearly all modern hardware, big-endian in many file and network formats). Decode with shifts to stay portable."
next: |
  You have now seen both ends of a program: high-level C and the raw bits underneath. Lesson 9.9 connects them. It follows C source through the preprocessor, compiler, assembler and linker; reads a little **assembly language**, the human-readable form of the instructions the CPU runs; and shows how a function call really works on the stack.

quiz:
  - type: mcq
    question: What is 0xA5 & 0x0F?
    options: ["0x05", "0xA0", "0xAF", "0xFF"]
    answer: 0
    explanation: "AND with 0x0F keeps only the low four bits: A5 becomes 05."
  - type: mcq
    question: Which expression sets bit 3 of x without changing the other bits?
    options: ["x | (1 << 3)", "x & (1 << 3)", "x ^ 3", "x << 3"]
    answer: 0
    explanation: "OR with a mask turns on its bits and leaves the rest as they were."
  - type: mcq
    question: In 8-bit two's complement, what value does 1111 1111 represent?
    options: ["-1", "255", "-127", "-128"]
    answer: 0
    explanation: "-128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = -1. As an unsigned byte the same bits mean 255."
  - type: mcq
    question: On a little-endian machine, how is the int 0x01020304 laid out from the lowest address upward?
    options: ["04 03 02 01", "01 02 03 04", "00 00 00 04", "03 04 01 02"]
    answer: 0
    explanation: "Little-endian puts the least significant byte first."
  - type: mcq
    question: What does x << 3 do for a small non-negative int x?
    options: ["Multiplies x by 8", "Divides x by 8", "Adds 3 to x", "Rotates x by 3 bytes"]
    answer: 0
    explanation: "Each left shift doubles the value, so three shifts multiply by 2 to the power 3."
  - type: mcq
    question: Why is `if (x & 1 == 0)` a bug?
    options: [
      "== binds tighter than &, so it computes x & (1 == 0), i.e. x & 0",
      "& cannot be used in an if",
      "1 == 0 is a syntax error",
      "It tests whether x is odd, not even"
    ]
    answer: 0
    explanation: "The comparison is done first. Write (x & 1) == 0."
  - type: code
    question: |
      Write `int low_byte(int x)` that returns the lowest 8 bits of `x` as a number from 0 to 255, and `int second_byte(int x)` that returns the next 8 bits (bits 8 to 15), also from 0 to 255.
    starter: |
      #include <stdio.h>

      int low_byte(int x) {
          return 0;
      }

      int second_byte(int x) {
          return 0;
      }

      int main(void) {
          printf("%d %d\n", low_byte(0x1234), second_byte(0x1234));
          return 0;
      }
    tests:
      - name: bytes
        append: |
          int main(void) {
              printf("%d %d %d %d\n", low_byte(0x1234), second_byte(0x1234), low_byte(-1), second_byte(-256));
              return 0;
          }
        code: |
          if (output.trim() !== "52 18 255 255") throw new Error(`Expected "52 18 255 255" but got "${output.trim()}"`);
    solution: |
      #include <stdio.h>

      int low_byte(int x) {
          return x & 0xFF;
      }

      int second_byte(int x) {
          return (x >> 8) & 0xFF;
      }

      int main(void) {
          printf("%d %d\n", low_byte(0x1234), second_byte(0x1234));
          return 0;
      }
