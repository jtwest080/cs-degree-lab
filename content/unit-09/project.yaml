- name: assemble reports errors
  append: |
    int main(void) {
        int code[30];
        printf("%d ", assemble("FOO A\n", code));
        printf("%d ", assemble("LDI Z, 5\n", code));
        printf("%d ", assemble("ADD A\n", code));
        printf("%d ", assemble("LDI A, x\n", code));
        printf("%d ", assemble("HALT now\n", code));
        printf("%d ", assemble("JMP nowhere\n", code));
        printf("%d ", assemble("JNZ A, nowhere\n", code));
        printf("%d ", assemble("a:\na:\nHALT\n", code));
        printf("%d\n", assemble("; nothing here\n\n", code));
        return 0;
    }
  code: |
    const want = "-1 -2 -2 -2 -2 -3 -3 -4 0"; if (output.trim() !== want) throw new Error(`Expected "${want}" but got "${output.trim()}"`);
- name: run does arithmetic
  append: |
    int main(void) {
        int code[60];
        int out[10];
        int n = assemble("LDI A, 6\nLDI B, 7\nMUL A, B\nOUT A\nSUB A, B\nOUT A\nMOV C, A\nADD C, C\nOUT C\nHALT\n", code);
        int k = run(code, n, out);
        printf("%d: %d %d %d err=%d\n", k, out[0], out[1], out[2], cpu_error);
        return 0;
    }
  code: |
    if (output.trim() !== "3: 42 35 70 err=0") throw new Error(`Expected "3: 42 35 70 err=0" but got "${output.trim()}"`);
- name: run handles loops and jumps
  append: |
    int main(void) {
        int code[90];
        int out[10];
        int n = assemble("LDI A, 0\nLDI B, 10\nLDI C, 1\nloop:\nADD A, B\nSUB B, C\nJNZ B, loop\nOUT A\nLDI D, 0\nJZ D, skip\nOUT D\nskip:\nLDI D, 9\nOUT D\nHALT\n", code);
        int k = run(code, n, out);
        printf("%d: %d %d err=%d\n", k, out[0], out[1], cpu_error);
        return 0;
    }
  code: |
    if (output.trim() !== "2: 55 9 err=0") throw new Error(`Expected "2: 55 9 err=0" but got "${output.trim()}"`);
- name: push, pop, call and ret use the stack
  append: |
    int main(void) {
        int code[90];
        int out[10];
        int n = assemble("LDI A, 1\nLDI B, 2\nPUSH A\nPUSH B\nPOP A\nPOP B\nOUT A\nOUT B\nHALT\n", code);
        int k = run(code, n, out);
        printf("%d: %d %d ", k, out[0], out[1]);
        n = assemble("LDI A, 7\nCALL square\nOUT B\nLDI A, 8\nCALL square\nOUT B\nHALT\nsquare:\nMOV B, A\nMUL B, A\nRET\n", code);
        k = run(code, n, out);
        printf("%d: %d %d ", k, out[0], out[1]);
        n = assemble("CALL f\nOUT A\nHALT\nf:\nLDI A, 1\nCALL g\nADD A, B\nRET\ng:\nLDI B, 41\nRET\n", code);
        k = run(code, n, out);
        printf("%d: %d err=%d\n", k, out[0], cpu_error);
        return 0;
    }
  code: |
    const want = "2: 2 1 2: 49 64 1: 42 err=0"; if (output.trim() !== want) throw new Error(`Expected "${want}" but got "${output.trim()}"`);
- name: run stops with the right error code
  append: |
    int main(void) {
        int code[90];
        int out[10];
        int n = assemble("LDI A, 1\nspin:\nADD A, A\nJMP spin\n", code);
        int k = run(code, n, out);
        printf("%d ", cpu_error);
        n = assemble("POP A\nHALT\n", code);
        k = run(code, n, out);
        printf("%d ", cpu_error);
        n = assemble("RET\n", code);
        k = run(code, n, out);
        printf("%d ", cpu_error);
        n = assemble("LDI A, 5\nOUT A\n", code);
        k = run(code, n, out);
        printf("%d:%d ", cpu_error, k);
        n = assemble("again:\nCALL again\n", code);
        k = run(code, n, out);
        printf("%d ", cpu_error);
        n = assemble("HALT\n", code);
        k = run(code, n, out);
        printf("%d\n", cpu_error);
        return 0;
    }
  code: |
    const want = "1 2 2 3:1 2 0"; if (output.trim() !== want) throw new Error(`Expected "${want}" but got "${output.trim()}"`);
- name: main prints the report
  code: |
    const want = "Factorial: 8 instructions, 1 outputs 720\nSquares: 10 instructions, 2 outputs 49 64\nBroken: assemble error -3\nEndless: 1 instructions, 0 outputs (cpu error 1)"; if (output.trim() !== want) throw new Error(`Expected:\n${want}\nGot:\n${output.trim()}`);
solution: |
  #include <stdio.h>
  #include <stdlib.h>
  #include <string.h>

  char tokens[4][16];
  char label_names[32][16];
  int label_addr[32];
  int label_count = 0;
  int cpu_error = 0;

  int get_line(char *text, int start, char *buf) {
      if (text[start] == '\0') {
          return -1;
      }
      int i = start;
      int n = 0;
      while (text[i] != '\0' && text[i] != '\n') {
          if (n < 79) {
              buf[n] = text[i];
              n++;
          }
          i++;
      }
      buf[n] = '\0';
      if (text[i] == '\n') {
          i++;
      }
      return i;
  }

  int tokenize(char *line) {
      int count = 0;
      int i = 0;
      while (line[i] != '\0' && line[i] != ';') {
          char c = line[i];
          if (c == ' ' || c == ',' || c == '\t') {
              i++;
          } else {
              int n = 0;
              while (line[i] != '\0' && line[i] != ';' && line[i] != ' ' && line[i] != ',' && line[i] != '\t') {
                  if (n < 15 && count < 4) {
                      tokens[count][n] = line[i];
                      n++;
                  }
                  i++;
              }
              if (count < 4) {
                  tokens[count][n] = '\0';
                  count++;
              }
          }
      }
      return count;
  }

  int find_label(char *name) {
      for (int i = 0; i < label_count; i++) {
          if (strcmp(label_names[i], name) == 0) {
              return label_addr[i];
          }
      }
      return -1;
  }

  int reg_index(char *s) {
      if (strlen(s) == 1 && s[0] >= 'A' && s[0] <= 'D') {
          return s[0] - 'A';
      }
      return -1;
  }

  int op_index(char *s) {
      if (strcmp(s, "HALT") == 0) return 0;
      if (strcmp(s, "LDI") == 0) return 1;
      if (strcmp(s, "MOV") == 0) return 2;
      if (strcmp(s, "ADD") == 0) return 3;
      if (strcmp(s, "SUB") == 0) return 4;
      if (strcmp(s, "MUL") == 0) return 5;
      if (strcmp(s, "JMP") == 0) return 6;
      if (strcmp(s, "JNZ") == 0) return 7;
      if (strcmp(s, "JZ") == 0) return 8;
      if (strcmp(s, "OUT") == 0) return 9;
      if (strcmp(s, "PUSH") == 0) return 10;
      if (strcmp(s, "POP") == 0) return 11;
      if (strcmp(s, "CALL") == 0) return 12;
      if (strcmp(s, "RET") == 0) return 13;
      return -1;
  }

  int is_number(char *s) {
      int i = 0;
      if (s[0] == '-') {
          i = 1;
      }
      if (s[i] == '\0') {
          return 0;
      }
      while (s[i] != '\0') {
          if (s[i] < '0' || s[i] > '9') {
              return 0;
          }
          i++;
      }
      return 1;
  }

  int assemble(char *text, int *code) {
      char line[80];
      int pos;
      int count;
      int n;
      int first;
      label_count = 0;
      count = 0;
      pos = 0;
      while ((pos = get_line(text, pos, line)) != -1) {
          n = tokenize(line);
          first = 0;
          if (n > 0 && tokens[0][strlen(tokens[0]) - 1] == ':') {
              tokens[0][strlen(tokens[0]) - 1] = '\0';
              if (find_label(tokens[0]) != -1) {
                  return -4;
              }
              strcpy(label_names[label_count], tokens[0]);
              label_addr[label_count] = count;
              label_count++;
              first = 1;
          }
          if (n > first) {
              count++;
          }
      }
      count = 0;
      pos = 0;
      while ((pos = get_line(text, pos, line)) != -1) {
          n = tokenize(line);
          first = 0;
          if (n > 0 && tokens[0][strlen(tokens[0]) - 1] == ':') {
              first = 1;
          }
          if (n > first) {
              int op = op_index(tokens[first]);
              int a = 0;
              int b = 0;
              int args = n - first - 1;
              if (op < 0) {
                  return -1;
              }
              if (op == 0 || op == 13) {
                  if (args != 0) return -2;
              } else if (op == 1) {
                  if (args != 2) return -2;
                  a = reg_index(tokens[first + 1]);
                  if (a < 0 || !is_number(tokens[first + 2])) return -2;
                  b = atoi(tokens[first + 2]);
              } else if (op >= 2 && op <= 5) {
                  if (args != 2) return -2;
                  a = reg_index(tokens[first + 1]);
                  b = reg_index(tokens[first + 2]);
                  if (a < 0 || b < 0) return -2;
              } else if (op == 6 || op == 12) {
                  if (args != 1) return -2;
                  a = find_label(tokens[first + 1]);
                  if (a < 0) return -3;
              } else if (op == 7 || op == 8) {
                  if (args != 2) return -2;
                  a = reg_index(tokens[first + 1]);
                  if (a < 0) return -2;
                  b = find_label(tokens[first + 2]);
                  if (b < 0) return -3;
              } else {
                  if (args != 1) return -2;
                  a = reg_index(tokens[first + 1]);
                  if (a < 0) return -2;
              }
              code[count * 3] = op;
              code[count * 3 + 1] = a;
              code[count * 3 + 2] = b;
              count++;
          }
      }
      return count;
  }

  int run(int *code, int n, int *out) {
      int reg[4] = {0, 0, 0, 0};
      int stack[64];
      int sp = 0;
      int pc = 0;
      int outs = 0;
      int steps = 0;
      cpu_error = 0;
      while (1) {
          if (pc < 0 || pc >= n) {
              cpu_error = 3;
              return outs;
          }
          if (steps >= 10000) {
              cpu_error = 1;
              return outs;
          }
          steps++;
          int op = code[pc * 3];
          int a = code[pc * 3 + 1];
          int b = code[pc * 3 + 2];
          pc++;
          if (op == 0) {
              return outs;
          } else if (op == 1) {
              reg[a] = b;
          } else if (op == 2) {
              reg[a] = reg[b];
          } else if (op == 3) {
              reg[a] = reg[a] + reg[b];
          } else if (op == 4) {
              reg[a] = reg[a] - reg[b];
          } else if (op == 5) {
              reg[a] = reg[a] * reg[b];
          } else if (op == 6) {
              pc = a;
          } else if (op == 7) {
              if (reg[a] != 0) pc = b;
          } else if (op == 8) {
              if (reg[a] == 0) pc = b;
          } else if (op == 9) {
              out[outs] = reg[a];
              outs++;
          } else if (op == 10) {
              if (sp >= 64) {
                  cpu_error = 2;
                  return outs;
              }
              stack[sp] = reg[a];
              sp++;
          } else if (op == 11) {
              if (sp == 0) {
                  cpu_error = 2;
                  return outs;
              }
              sp--;
              reg[a] = stack[sp];
          } else if (op == 12) {
              if (sp >= 64) {
                  cpu_error = 2;
                  return outs;
              }
              stack[sp] = pc;
              sp++;
              pc = a;
          } else if (op == 13) {
              if (sp == 0) {
                  cpu_error = 2;
                  return outs;
              }
              sp--;
              pc = stack[sp];
          } else {
              cpu_error = 3;
              return outs;
          }
      }
  }

  void report(char *title, char *text) {
      int code[90];
      int out[40];
      int n = assemble(text, code);
      printf("%s: ", title);
      if (n < 0) {
          printf("assemble error %d\n", n);
          return;
      }
      int k = run(code, n, out);
      printf("%d instructions, %d outputs", n, k);
      for (int i = 0; i < k; i++) {
          printf(" %d", out[i]);
      }
      if (cpu_error != 0) {
          printf(" (cpu error %d)", cpu_error);
      }
      printf("\n");
  }

  int main(void) {
      report("Factorial", "LDI A, 1\nLDI B, 6\nLDI C, 1\nloop:\nMUL A, B\nSUB B, C\nJNZ B, loop\nOUT A\nHALT\n");
      report("Squares", "LDI A, 7\nCALL square\nOUT B\nLDI A, 8\nCALL square\nOUT B\nHALT\nsquare:\nMOV B, A\nMUL B, A\nRET\n");
      report("Broken", "JMP nowhere\n");
      report("Endless", "spin:\nJMP spin\n");
      return 0;
  }
