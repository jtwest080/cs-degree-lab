title: Mini CPU
brief: |

  You are going to build a complete little computer in C: an **assembler** that turns readable text into machine code, and an **emulator** (a virtual CPU) that runs that machine code. It uses everything in this unit: strings and pointers, arrays and structs of data, bit-level encoding, the stack, and the fetch-decode-execute loop.

  **The machine.** It has four registers `A`, `B`, `C` and `D` (each an `int`), a program counter, and a stack of up to 64 values. An assembly program looks like this:

  ```text
  ; factorial of 6
        LDI A, 1        ; A = 1  (the answer so far)
        LDI B, 6        ; B = 6  (the counter)
        LDI C, 1
  loop:
        MUL A, B
        SUB B, C
        JNZ B, loop     ; jump back while B is not zero
        OUT A
        HALT
  ```

  A line may have a **label** (`name:`), an **instruction**, a **`;` comment**, or be blank. Operands are separated by spaces and/or commas. Labels may stand alone on a line or in front of an instruction.

  | Instruction | Operands | Effect |
  |---|---|---|
  | `HALT` | none | stop the program |
  | `LDI r, n` | register, number | `r = n` |
  | `MOV r, s` | two registers | `r = s` |
  | `ADD r, s` / `SUB r, s` / `MUL r, s` | two registers | `r = r + s` (or `-`, `*`) |
  | `JMP label` | label | go to the label |
  | `JNZ r, label` / `JZ r, label` | register, label | go to the label if `r` is not zero / is zero |
  | `OUT r` | register | append `r` to the output list |
  | `PUSH r` / `POP r` | register | push `r` onto the stack / pop the top into `r` |
  | `CALL label` | label | push the address of the next instruction, then jump to the label |
  | `RET` | none | pop an address and jump to it |

  **Machine code.** Every instruction is stored as **three ints**: `[opcode, a, b]`. The opcodes are `HALT` 0, `LDI` 1, `MOV` 2, `ADD` 3, `SUB` 4, `MUL` 5, `JMP` 6, `JNZ` 7, `JZ` 8, `OUT` 9, `PUSH` 10, `POP` 11, `CALL` 12, `RET` 13. Registers are numbered `A`=0 to `D`=3. Unused slots are 0. Where each instruction puts its operands:

  - `LDI r, n`: `a` = register number, `b` = n. `MOV/ADD/SUB/MUL r, s`: `a` = r, `b` = s.
  - `JMP label` and `CALL label`: `a` = the label's **instruction number** (the first instruction is number 0; labels and comments do not count).
  - `JNZ r, label` and `JZ r, label`: `a` = register, `b` = the label's instruction number.
  - `OUT r`, `PUSH r`, `POP r`: `a` = register. `HALT` and `RET`: both 0.

  **Functions** (the helpers `get_line`, `tokenize`, `reg_index` and `is_number` are given):

  - `int op_index(char *s)`: the opcode for a mnemonic such as `"MUL"`, or `-1`.
  - `int find_label(char *name)`: the instruction number stored for a label name, or `-1`.
  - `int assemble(char *text, int *code)`: translate the whole program text and return the **number of instructions**, or a negative error: `-1` unknown mnemonic, `-2` wrong operand count or a bad register or number, `-3` undefined label, `-4` label defined twice. Use **two passes**: the first records where every label is (a jump can go forward to a label that has not been seen yet), the second encodes.
  - `int run(int *code, int n, int *out)`: execute the `n` instructions and return how many numbers `OUT` produced (stored in `out`). Set the global `cpu_error` to `0` when the program ends normally with `HALT`, `1` after **10,000 steps** without halting, `2` for a stack underflow (`POP` or `RET` on an empty stack) or overflow (more than 64 entries), and `3` if the program counter runs off the end or hits a bad opcode. On an error, stop and return the outputs so far.
  - `void report(char *title, char *text)`: assemble and run one program and print a line. For an assemble error print `Title: assemble error N`. Otherwise print `Title: K instructions, M outputs`, then a space and each output (every output preceded by a space), and `(cpu error E)` after a space if `cpu_error` is not 0.
  - `main` calls `report` for four programs: a factorial loop, a program with a `square` subroutine, a broken one (`JMP nowhere`) and an endless loop (`spin:` then `JMP spin`). The expected output is:

    ```text
    Factorial: 8 instructions, 1 outputs 720
    Squares: 10 instructions, 2 outputs 49 64
    Broken: assemble error -3
    Endless: 1 instructions, 0 outputs (cpu error 1)
    ```
prelude: ""
steps:
- title: Read the helpers
  body: "Skim `get_line` (copies one line of the text into a buffer and returns where the next line starts, or -1 at the end), `tokenize` (splits a line into words in the global `tokens` array, ignoring commas and comments, and returns how many) and `is_number`. You will call them, not rewrite them. A label shows up as a first token ending in a colon."
- title: Opcodes and labels
  body: "Write `op_index` as a chain of `strcmp` tests, and `find_label` as a loop over the label table. These are small, and every later step depends on them."
- title: "Pass 1: find the labels"
  body: "Loop over the lines. For each line tokenize it; if the first token ends with `:` remove the colon (set that character to `'\\\\0'`), check it is new (otherwise return -4), store it in `label_names` with the current instruction count in `label_addr`, and treat the rest of the line as the instruction. Count an instruction only when something follows the label."
- title: "Pass 2: encode"
  body: "Loop again, this time writing `code[3*i]`, `code[3*i+1]`, `code[3*i+2]`. Decide the operands by opcode, checking the operand count first (the number of tokens after the mnemonic). Return a negative error code as soon as something is wrong. A forward jump now works because every label is already known."
- title: The CPU loop
  body: "Keep `reg[4]`, `stack[64]`, `sp`, `pc`, `outs` and `steps`. Each turn: check `pc` is in range and `steps` is under the limit, then fetch the three ints, advance `pc`, and branch on the opcode. For `CALL`, push `pc` (already advanced) and jump; for `RET`, pop it back into `pc`."
- title: Report and main
  body: "`report` ties the pieces together. Test each part as you go: assemble a tiny program and print the `code` array before trying to run anything."
checklist:
- text: assemble produces the right machine code
  test: assemble encodes instructions
- text: assemble handles labels, comments, blank lines and forward jumps
  test: assemble handles labels and comments
- text: assemble returns the right error codes
  test: assemble reports errors
- text: run does arithmetic and output
  test: run does arithmetic
- text: run handles loops and conditional jumps
  test: run handles loops and jumps
- text: PUSH, POP, CALL and RET work with the stack
  test: push, pop, call and ret use the stack
- text: run reports step-limit, stack and program-counter errors
  test: run stops with the right error code
- text: main prints the report for the four programs
  test: main prints the report
- text: I wrote a comment explaining why the assembler needs two passes
- text: I wrote a comment saying what a real CPU adds that this one lacks (for example memory loads, flags, interrupts)
starter: |
  // Unit 9 project: Mini CPU
  // Given: get_line, tokenize, reg_index, is_number. Yours: op_index, find_label, assemble, run, report.
  #include <string.h>

  char tokens[4][16];
  char label_names[32][16];
  int label_addr[32];
  int label_count = 0;
  int cpu_error = 0;

  int get_line(char *text, int start, char *buf) {
      if (text[start] == '\0') {
          return -1;
      }
      int i = start;
      int n = 0;
      while (text[i] != '\0' && text[i] != '\n') {
          if (n < 79) {
              buf[n] = text[i];
              n++;
          }
          i++;
      }
      buf[n] = '\0';
      if (text[i] == '\n') {
          i++;
      }
      return i;
  }

  int tokenize(char *line) {
      int count = 0;
      int i = 0;
      while (line[i] != '\0' && line[i] != ';') {
          char c = line[i];
          if (c == ' ' || c == ',' || c == '\t') {
              i++;
          } else {
              int n = 0;
              while (line[i] != '\0' && line[i] != ';' && line[i] != ' ' && line[i] != ',' && line[i] != '\t') {
                  if (n < 15 && count < 4) {
                      tokens[count][n] = line[i];
                      n++;
                  }
                  i++;
              }
              if (count < 4) {
                  tokens[count][n] = '\0';
                  count++;
              }
          }
      }
      return count;
  }

  int find_label(char *name) {
      // TODO: search label_names[0..label_count-1]; return its label_addr or -1
      return -1;
  }

  int reg_index(char *s) {
      if (strlen(s) == 1 && s[0] >= 'A' && s[0] <= 'D') {
          return s[0] - 'A';
      }
      return -1;
  }

  int op_index(char *s) {
      // TODO: HALT 0, LDI 1, MOV 2, ADD 3, SUB 4, MUL 5, JMP 6, JNZ 7, JZ 8, OUT 9, PUSH 10, POP 11, CALL 12, RET 13; -1 if unknown
      return -1;
  }

  int is_number(char *s) {
      int i = 0;
      if (s[0] == '-') {
          i = 1;
      }
      if (s[i] == '\0') {
          return 0;
      }
      while (s[i] != '\0') {
          if (s[i] < '0' || s[i] > '9') {
              return 0;
          }
          i++;
      }
      return 1;
  }

  int assemble(char *text, int *code) {
      // TODO: pass 1 records labels, pass 2 encodes 3 ints per instruction
      return -1;
  }

  int run(int *code, int n, int *out) {
      // TODO: the fetch-decode-execute loop
      cpu_error = 0;
      return 0;
  }

  void report(char *title, char *text) {
      // TODO: assemble, run and print one line (see the brief)
  }

  int main(void) {
      report("Factorial", "LDI A, 1\nLDI B, 6\nLDI C, 1\nloop:\nMUL A, B\nSUB B, C\nJNZ B, loop\nOUT A\nHALT\n");
      report("Squares", "LDI A, 7\nCALL square\nOUT B\nLDI A, 8\nCALL square\nOUT B\nHALT\nsquare:\nMOV B, A\nMUL B, A\nRET\n");
      report("Broken", "JMP nowhere\n");
      report("Endless", "spin:\nJMP spin\n");
      return 0;
  }
