- name: assemble encodes instructions
  append: |
    int main(void) {
        int code[30];
        int n = assemble("LDI A, 5\nADD A, B\nOUT A\nHALT\n", code);
        printf("%d:", n);
        for (int i = 0; i < n * 3; i++) {
            printf(" %d", code[i]);
        }
        printf("\n");
        return 0;
    }
  code: |
    if (output.trim() !== "4: 1 0 5 3 0 1 9 0 0 0 0 0") throw new Error(`Expected "4: 1 0 5 3 0 1 9 0 0 0 0 0" but got "${output.trim()}"`);
- name: assemble handles labels and comments
  append: |
    int main(void) {
        int code[60];
        char *text = "; countdown\nstart: LDI A, 3   ; set up\n    LDI B, 1\n\nloop:\n    SUB A, B\n    JNZ A, loop\n    JZ A, done\n    JMP start\ndone:\n    HALT\n";
        int n = assemble(text, code);
        printf("%d:", n);
        for (int i = 0; i < n * 3; i++) {
            printf(" %d", code[i]);
        }
        printf("\n");
        return 0;
    }
  code: |
