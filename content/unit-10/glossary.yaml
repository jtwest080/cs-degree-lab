# Terms introduced in Unit 10 (Operating Systems). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Operating system"
    definition: "Software that manages the hardware and shares it among programs, providing abstractions such as processes, files and virtual memory."
    lesson: u10-os-overview
  - term: "Kernel"
    definition: "The privileged core of the operating system. It runs in kernel mode and has full access to the hardware."
    lesson: u10-os-overview
  - term: "User mode"
    definition: "The restricted CPU mode in which ordinary programs run. Privileged instructions cause a trap."
    lesson: u10-os-overview
  - term: "Kernel mode"
    definition: "The privileged CPU mode in which the kernel runs and may execute any instruction and access any memory."
    lesson: u10-os-overview
  - term: "System call"
    definition: "A controlled request from a program to the kernel (open, read, write, fork, ...), made by trapping into kernel mode."
    lesson: u10-os-overview
  - term: "Trap"
    definition: "A synchronous switch into the kernel caused by the running program, such as a system call or an illegal operation."
    lesson: u10-os-overview
  - term: "Interrupt"
    definition: "An asynchronous signal from hardware (timer, disk, keyboard) that makes the CPU stop and run a handler in the kernel."
    lesson: u10-os-overview
  - term: "File descriptor"
    definition: "A small integer a process uses to refer to an open file, pipe or socket. The kernel keeps a table of them per process."
    lesson: u10-os-overview
  - term: "Standard streams"
    definition: "The three descriptors every process starts with: 0 standard input, 1 standard output and 2 standard error."
    lesson: u10-os-overview
  - term: "Daemon"
    definition: "A background process that provides a service and has no controlling terminal."
    lesson: u10-os-overview
  - term: "Boot"
    definition: "The startup sequence from firmware through the bootloader to the kernel, and then to the first user process."
    lesson: u10-os-overview
  - term: "Microkernel"
    definition: "A kernel design that keeps only the essentials in kernel mode and runs services such as file systems as ordinary user processes."
    lesson: u10-os-overview
  - term: "Process"
    definition: "A running program: its code, memory, open files and CPU state, isolated from other processes."
    lesson: u10-processes
  - term: "Process control block (PCB)"
    definition: "The kernel's record for a process: its id, state, saved registers, memory maps and open files."
    lesson: u10-processes
  - term: "Process state"
    definition: "Where a process is in its life: new, ready, running, waiting (blocked) or terminated."
    lesson: u10-processes
  - term: "Context switch"
    definition: "Saving one process's CPU state and loading another's so the CPU can run it. It is pure overhead."
    lesson: u10-processes
  - term: "Fork"
    definition: "The Unix system call that creates a new process as a copy of the caller. It returns the child's id to the parent and 0 to the child."
    lesson: u10-processes
  - term: "Zombie process"
    definition: "A terminated process whose parent has not yet collected its exit status with wait."
    lesson: u10-processes
  - term: "Orphan process"
    definition: "A process whose parent has exited. The init process adopts it."
    lesson: u10-processes
  - term: "Signal"
    definition: "A small asynchronous notification sent to a process, such as SIGINT or SIGKILL."
    lesson: u10-processes
  - term: "Pipe"
    definition: "A one-way channel that connects the output of one process to the input of another."
    lesson: u10-processes
  - term: "Inter-process communication (IPC)"
    definition: "Mechanisms such as pipes, sockets, signals and shared memory by which processes exchange data."
    lesson: u10-processes
  - term: "Scheduler"
    definition: "The kernel component that chooses which ready process runs next on each CPU."
    lesson: u10-scheduling
  - term: "Dispatcher"
    definition: "The part of the scheduler that performs the context switch to the chosen process."
    lesson: u10-scheduling
  - term: "Preemption"
    definition: "Taking the CPU away from a running process, usually when its time slice ends or a more urgent process becomes ready."
    lesson: u10-scheduling
  - term: "Time slice (quantum)"
    definition: "The maximum time a process may run before the scheduler can preempt it."
    lesson: u10-scheduling
  - term: "Burst time"
    definition: "The amount of CPU time a process needs before it next waits or finishes."
    lesson: u10-scheduling
  - term: "Turnaround time"
    definition: "The time from a job's arrival to its completion."
    lesson: u10-scheduling
  - term: "Waiting time"
    definition: "The time a job spends in the ready queue, equal to turnaround time minus burst time."
    lesson: u10-scheduling
  - term: "Response time"
    definition: "The time from a request's arrival until the system first responds to it."
    lesson: u10-scheduling
  - term: "First come, first served (FCFS)"
    definition: "Scheduling in arrival order without preemption. Simple, but one long job delays all the others."
    lesson: u10-scheduling
  - term: "Shortest job first (SJF)"
    definition: "Scheduling the job with the shortest burst next. It minimises average waiting time but needs to know burst lengths."
    lesson: u10-scheduling
  - term: "Round robin"
    definition: "Scheduling that gives each ready process a time slice in turn."
    lesson: u10-scheduling
  - term: "Convoy effect"
    definition: "Short jobs stuck behind a long one, as in FCFS."
    lesson: u10-scheduling
  - term: "Starvation"
    definition: "A process waiting indefinitely because others are always chosen before it."
    lesson: u10-scheduling
  - term: "Multilevel feedback queue"
    definition: "A scheduler with several priority queues that moves processes between them based on observed behaviour."
    lesson: u10-scheduling
  - term: "Concurrency"
    definition: "Having several tasks in progress at overlapping times, whether or not they run at the same instant."
    lesson: u10-concurrency
  - term: "Parallelism"
    definition: "Running several computations at the same instant on different cores."
    lesson: u10-concurrency
  - term: "Thread"
    definition: "A unit of execution inside a process. Threads of one process share its memory."
    lesson: u10-concurrency
  - term: "Race condition"
    definition: "A bug whose outcome depends on the timing of operations from different threads."
    lesson: u10-concurrency
  - term: "Interleaving"
    definition: "One possible order in which the steps of several threads are mixed together."
    lesson: u10-concurrency
  - term: "Nondeterminism"
    definition: "Different runs of the same program giving different results because of scheduling."
    lesson: u10-concurrency
  - term: "Check-then-act"
    definition: "A pattern that tests a condition and then acts on it, which is a race if anything can change the condition in between."
    lesson: u10-concurrency
  - term: "Amdahl's law"
    definition: "The speedup from n cores is at most 1 / ((1 - p) + p / n), where p is the parallel fraction of the work."
    lesson: u10-concurrency
  - term: "Critical section"
    definition: "A section of code that touches shared data and must not be run by two threads at once."
    lesson: u10-synchronization
  - term: "Mutual exclusion"
    definition: "The guarantee that at most one thread is inside a critical section at a time."
    lesson: u10-synchronization
  - term: "Mutex (lock)"
    definition: "An object that one thread at a time can hold, used to enforce mutual exclusion."
    lesson: u10-synchronization
  - term: "Semaphore"
    definition: "An integer counter with atomic wait (decrement, blocking at zero) and signal (increment) operations."
    lesson: u10-synchronization
  - term: "Atomic operation"
    definition: "An operation that appears to happen all at once, with no other thread able to observe it half done."
    lesson: u10-synchronization
  - term: "Compare-and-swap (CAS)"
    definition: "An atomic instruction that sets a location to a new value only if it still holds an expected one."
    lesson: u10-synchronization
  - term: "Busy waiting (spinning)"
    definition: "Repeatedly testing a condition in a loop instead of sleeping, which wastes CPU time."
    lesson: u10-synchronization
  - term: "Producer-consumer problem"
    definition: "Threads that add items to a shared buffer and threads that remove them, which need synchronisation so neither overruns nor underruns."
    lesson: u10-synchronization
  - term: "Bounded buffer"
    definition: "A fixed-size queue shared by producers and consumers."
    lesson: u10-synchronization
  - term: "Condition variable"
    definition: "A queue where threads sleep until another thread signals that a condition may now be true."
    lesson: u10-synchronization
  - term: "Deadlock"
    definition: "A state in which each member of a group of processes waits for a resource held by another member, so none can proceed."
    lesson: u10-deadlock
  - term: "Wait-for graph"
    definition: "A directed graph with an edge from each process to the process whose resource it awaits. A cycle means deadlock."
    lesson: u10-deadlock
  - term: "Coffman conditions"
    definition: "The four conditions needed for deadlock: mutual exclusion, hold and wait, no preemption and circular wait."
    lesson: u10-deadlock
  - term: "Circular wait"
    definition: "A cycle of processes each waiting for a resource held by the next one."
    lesson: u10-deadlock
  - term: "Lock ordering"
    definition: "Preventing deadlock by requiring that all threads acquire locks in one agreed global order."
    lesson: u10-deadlock
  - term: "Banker's algorithm"
    definition: "A deadlock-avoidance method that grants a request only if the resulting state is safe."
    lesson: u10-deadlock
  - term: "Safe state"
    definition: "A state in which some order exists that lets every process finish with the resources available."
    lesson: u10-deadlock
  - term: "Livelock"
    definition: "Processes that keep changing state in response to each other but make no progress."
    lesson: u10-deadlock
  - term: "Address space"
    definition: "The range of memory addresses a process can use, private to that process."
    lesson: u10-memory
  - term: "Memory management unit (MMU)"
    definition: "Hardware that translates virtual addresses to physical addresses."
    lesson: u10-memory
  - term: "Physical address"
    definition: "An address in the real RAM hardware."
    lesson: u10-memory
  - term: "Virtual address"
    definition: "An address used by a program and translated by the MMU into a physical address."
    lesson: u10-memory
  - term: "Paging"
    definition: "Dividing memory into fixed-size pages and frames so that any page can be placed in any frame."
    lesson: u10-memory
  - term: "Page table"
    definition: "A table, per process, that maps virtual page numbers to physical frame numbers."
    lesson: u10-memory
  - term: "Frame"
    definition: "A fixed-size slot of physical memory that holds one page."
    lesson: u10-memory
  - term: "Page offset"
    definition: "The low bits of an address, giving the position inside a page. It is unchanged by translation."
    lesson: u10-memory
  - term: "Translation lookaside buffer (TLB)"
    definition: "A small fast cache of recent page-table entries."
    lesson: u10-memory
  - term: "Effective access time"
    definition: "The average time for a memory access, weighting hits and misses by their probabilities."
    lesson: u10-memory
  - term: "Internal fragmentation"
    definition: "Wasted space inside an allocated unit, such as the unused end of a page."
    lesson: u10-memory
  - term: "External fragmentation"
    definition: "Free memory scattered in pieces too small to satisfy a request."
    lesson: u10-memory
  - term: "Coalescing"
    definition: "Merging adjacent free blocks into one larger block."
    lesson: u10-memory
  - term: "First fit"
    definition: "Allocating from the first free block that is large enough."
    lesson: u10-memory
  - term: "Best fit"
    definition: "Allocating from the smallest free block that is large enough."
    lesson: u10-memory
  - term: "Worst fit"
    definition: "Allocating from the largest free block."
    lesson: u10-memory
  - term: "Demand paging"
    definition: "Loading a page into memory only when it is first used."
    lesson: u10-virtual-memory
  - term: "Page fault"
    definition: "A trap caused by access to a page that is not in memory, which the kernel handles by loading it."
    lesson: u10-virtual-memory
  - term: "Page replacement"
    definition: "Choosing which resident page to evict when memory is full and a new page must be loaded."
    lesson: u10-virtual-memory
  - term: "Optimal replacement"
    definition: "Evicting the page whose next use is furthest in the future. It is the best possible but needs knowledge of the future."
    lesson: u10-virtual-memory
  - term: "Least recently used (LRU)"
    definition: "Evicting the page that has gone unused for longest, on the idea that the past predicts the future."
    lesson: u10-virtual-memory
  - term: "Clock algorithm"
    definition: "An approximation to LRU that sweeps a pointer around the frames, giving pages a second chance if they were recently used."
    lesson: u10-virtual-memory
  - term: "Belady's anomaly"
    definition: "The surprising fact that, with FIFO replacement, adding frames can increase the number of page faults."
    lesson: u10-virtual-memory
  - term: "Thrashing"
    definition: "Excessive paging, with the system spending its time swapping pages instead of doing useful work."
    lesson: u10-virtual-memory
  - term: "Working set"
    definition: "The set of pages a process has used in its recent window of references."
    lesson: u10-virtual-memory
  - term: "Locality of reference"
    definition: "The tendency of programs to reuse recently used data and to use data near it."
    lesson: u10-virtual-memory
  - term: "Swap space"
    definition: "Disk space used to hold pages evicted from RAM."
    lesson: u10-virtual-memory
  - term: "Copy-on-write (COW)"
    definition: "Sharing pages after a fork and copying one only when a process writes to it."
    lesson: u10-virtual-memory
  - term: "File system"
    definition: "The part of the OS that organises storage into named files and directories."
    lesson: u10-filesystems
  - term: "Inode"
    definition: "A file's metadata record: type, owner, permissions, size and pointers to its data blocks, but not its name."
    lesson: u10-filesystems
  - term: "Directory"
    definition: "A special file that maps names to inode numbers."
    lesson: u10-filesystems
  - term: "Superblock"
    definition: "The block describing the overall layout and size of a file system."
    lesson: u10-filesystems
  - term: "Block"
    definition: "The fixed-size unit in which a disk reads and writes data."
    lesson: u10-filesystems
  - term: "Indirect block"
    definition: "A block that holds pointers to other data blocks, letting an inode reach large files."
    lesson: u10-filesystems
  - term: "Extent"
    definition: "A contiguous run of blocks described by a start and a length."
    lesson: u10-filesystems
  - term: "Hard link"
    definition: "An additional directory entry pointing at the same inode. The file lasts until the link count reaches zero."
    lesson: u10-filesystems
  - term: "Symbolic link"
    definition: "A small file that holds the path of another file."
    lesson: u10-filesystems
  - term: "Link count"
    definition: "The number of directory entries that refer to an inode."
    lesson: u10-filesystems
  - term: "Absolute path"
    definition: "A path starting at the root directory, written with a leading slash."
    lesson: u10-filesystems
  - term: "Relative path"
    definition: "A path interpreted from the current working directory."
    lesson: u10-filesystems
  - term: "Permission bits"
    definition: "Nine bits (read, write, execute for owner, group and others) that control access to a file."
    lesson: u10-filesystems
  - term: "Journaling"
    definition: "Recording intended changes in a log before applying them, so a crash can be repaired by replaying committed entries."
    lesson: u10-filesystems
  - term: "Write-ahead logging"
    definition: "The rule that a description of a change must be safely logged before the change itself is made."
    lesson: u10-filesystems
  - term: "Idempotent"
    definition: "Safe to repeat: doing it twice has the same effect as once."
    lesson: u10-filesystems
  - term: "Seek time"
    definition: "The time for a disk head to move to the right track."
    lesson: u10-filesystems
  - term: "Disk scheduling"
    definition: "Ordering pending disk requests to reduce head movement, as in SSTF, SCAN and LOOK."
    lesson: u10-filesystems
  - term: "Elevator algorithm (SCAN)"
    definition: "Disk scheduling that sweeps the head across the disk serving requests in its path, then reverses."
    lesson: u10-filesystems
  - term: "Page cache"
    definition: "Memory used by the kernel to cache recently used disk blocks."
    lesson: u10-filesystems
  - term: "RAID"
    definition: "Combining several disks into one logical unit for speed, redundancy or both."
    lesson: u10-filesystems
