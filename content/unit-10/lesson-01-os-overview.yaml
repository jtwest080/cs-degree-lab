  - type: code
    question: |
      Write `lowest_free(used)` that returns the smallest non-negative integer that is **not** in the collection `used` (this is how the kernel picks a file descriptor).
    starter: |
      def lowest_free(used):
          pass
    tests:
      - name: lowest
        code: |
          assert lowest_free([]) == 0
          assert lowest_free([0, 1, 2]) == 3
          assert lowest_free({0, 2, 3}) == 1
          assert lowest_free([5, 3, 1]) == 0
          assert lowest_free(range(1000)) == 1000
    solution: |
      def lowest_free(used):
          taken = set(used)
          n = 0
          while n in taken:
              n += 1
          return n
