  - type: code
    question: |
      Write `ready_after(states)`. `states` is a dictionary mapping process names to one of `"ready"`, `"running"`, `"waiting"`, `"terminated"`. Return the sorted list of names of processes that are **ready**.
    starter: |
      def ready_after(states):
          pass
    tests:
      - name: ready
        code: |
          assert ready_after({}) == []
          assert ready_after({"b": "ready", "a": "ready", "c": "running", "d": "waiting", "e": "terminated"}) == ["a", "b"]
          assert ready_after({"x": "waiting"}) == []
    solution: |
      def ready_after(states):
          return sorted(name for name, state in states.items() if state == "ready")
