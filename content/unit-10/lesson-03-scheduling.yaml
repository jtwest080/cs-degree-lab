  - type: code
    question: |
      Write `average_waiting(waits)` returning the average of a list of waiting times, rounded to 2 decimal places, or `0.0` for an empty list.
    starter: |
      def average_waiting(waits):
          pass
    tests:
      - name: average
        code: |
          assert average_waiting([]) == 0.0
          assert average_waiting([0, 6, 4]) == 3.33
          assert average_waiting([5]) == 5.0
    solution: |
      def average_waiting(waits):
          if not waits:
              return 0.0
          return round(sum(waits) / len(waits), 2)
