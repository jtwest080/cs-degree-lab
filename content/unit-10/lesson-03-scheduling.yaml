id: u10-scheduling
title: CPU Scheduling
minutes: 60
objective: |
  Learn how the OS decides which ready process gets the CPU next. Compare first-come first-served, shortest job first, shortest remaining time, round robin and priority scheduling, measure each with turnaround, waiting and response time, and see why no policy wins on every measure.
outcomes:
  - Define CPU burst, arrival time, turnaround time, waiting time and response time
  - Simulate FCFS, SJF, SRTF and round-robin schedulers and draw their Gantt charts
  - Explain the convoy effect, starvation and aging
  - Choose a time quantum and explain the trade-off it makes
  - Explain how a multilevel feedback queue approximates SJF without knowing job lengths
  - Say what changes when there are several CPUs

sections:
  - heading: The scheduling problem
    body: |
      At any moment several processes may be **ready** (Lesson 10.2) while only one CPU is available. The **scheduler** is the part of the kernel that picks which one runs next. It runs whenever a process blocks, exits, or becomes ready, and whenever the timer interrupt fires.

      Programs alternate between **CPU bursts** (computing) and **I/O bursts** (waiting for disk, keyboard or network). A text editor has very short CPU bursts; a video encoder has very long ones. A good scheduler keeps the CPU busy while giving every process a fair and responsive turn.

      Two basic designs:

      - **Non-preemptive**: once a process gets the CPU, it keeps it until it blocks or finishes.
      - **Preemptive**: the OS can take the CPU away, using the timer interrupt, and give it to someone else. Every modern desktop and server OS is preemptive.

      To compare schedulers we need numbers. For each process, with **arrival time** (when it became ready), **burst time** (CPU time it needs) and the time it **completes**:

      | Metric | Formula | Meaning |
      |---|---|---|
      | **Turnaround time** | completion − arrival | total time in the system |
      | **Waiting time** | turnaround − burst | time spent ready but not running |
      | **Response time** | first run − arrival | how long until it first gets the CPU |

      Systems also care about **throughput** (jobs finished per second), **CPU utilisation**, and **fairness**. These goals conflict, and that conflict is what makes scheduling interesting.

  - heading: First-come, first-served
    body: |
      **FCFS** runs processes in the order they arrive, to completion. It is simple (a queue) and fair in the sense of arrival order. But it suffers from the **convoy effect**: one long job at the front makes every short job behind it wait.

      Suppose a 24-unit job arrives just before two 3-unit jobs. The short jobs wait 24 and 27 units. If they had gone first, they would have waited 0 and 3 units, and the long job would barely have noticed.

  - heading: Shortest job first
    body: |
      **Shortest job first (SJF)** picks, among the ready processes, the one with the smallest burst. It is **provably optimal for average waiting time**: swapping any two adjacent jobs so the shorter is first never hurts, the same exchange argument you used for greedy algorithms in Lesson 8.5.

      Two problems:

      - The OS **doesn't know** how long a burst will be. It estimates from history, typically with an exponential average: `estimate = α × last_burst + (1 − α) × old_estimate`.
      - **Starvation.** If short jobs keep arriving, a long job may wait forever.

      The preemptive version, **shortest remaining time first (SRTF)**, switches whenever a newly arrived process has a shorter remaining time than the running one. It gives the best average waiting time of all, but needs more context switches.

  - heading: Round robin
    body: |
      **Round robin (RR)** is the preemptive policy built for interactive systems. Each process gets the CPU for at most one **time quantum** (say 10 ms). If it hasn't finished, it goes to the **back of the ready queue**, and the next process runs.

      - Response time is excellent: with *n* ready processes and quantum *q*, nobody waits more than (*n* − 1) × *q* for a turn.
      - It is fair: no starvation, since everyone is in the queue.
      - **The quantum is a trade-off.** If *q* is huge, RR becomes FCFS. If *q* is tiny, the machine spends its time context switching (Lesson 10.2) and little real work is done. A common rule: make *q* long enough that most CPU bursts finish within one quantum, typically 10 to 100 ms. If a switch costs 1 ms and *q* is 10 ms, about 9% of the CPU is lost.
      - RR's turnaround time is worse than SJF for short jobs, and equal-sized jobs finish all together at the end.

      When a process arrives during another's time slice, convention puts it in the queue **before** the process that was just preempted. The exercises use this rule.

  - heading: Priorities, starvation and aging
    body: |
      Many systems give each process a **priority** and always run the highest-priority ready process. SJF is a priority scheme where priority is the burst length. Priorities can be assigned by the OS (interactive processes high, batch jobs low) or by users (`nice` on Unix lets you lower your own priority).

      The danger is **starvation**: a low-priority process may never run if higher-priority ones keep coming. The cure is **aging**: gradually raise the priority of any process that has waited a long time, so it eventually reaches the top. A famous (probably apocryphal) story says that when MIT shut down its IBM 7094 in 1973, a low-priority job submitted in 1967 had still not run.

      **Priority inversion** is a related problem: a low-priority process holds a lock that a high-priority process needs, while a medium-priority process runs and prevents the low one from releasing it. The 1997 Mars Pathfinder rover reset itself repeatedly because of this. The fix is **priority inheritance**: the lock holder temporarily takes the priority of the highest waiter.

  - heading: Multilevel feedback queues
    body: |
      How can a scheduler favour short jobs when it can't know job lengths? The **multilevel feedback queue (MLFQ)** learns them by observation. There are several queues, each with a priority and a quantum:

      1. A new process starts in the **highest-priority queue** with a short quantum.
      2. If it uses its whole quantum, it was probably CPU-bound, so it is **demoted** to the next queue (lower priority, longer quantum).
      3. If it blocks for I/O before its quantum ends, it stays where it is (interactive jobs stay at the top).
      4. Every so often, all processes are **boosted** back to the top, to prevent starvation and to adapt to changes in behaviour.

      So interactive and short jobs naturally get quick service, while long computations sink to lower queues where they still run, just with less urgency. This idea is the ancestor of the schedulers in Windows, macOS and BSD. Linux's current default, the **Completely Fair Scheduler (CFS)** (and its successor EEVDF), takes another approach: each process receives a share of CPU time proportional to its weight, tracked as a "virtual runtime" in a red-black tree, with the least-served process chosen next.

      **Multiple CPUs** add more questions: should there be one shared ready queue or one per core? Per-core queues avoid lock contention and keep a process's data in its core's cache (**processor affinity**), but need **load balancing** to move work from busy cores to idle ones.

examples:
  - title: A Gantt chart helper
    intro: "A schedule is a list of (name, start, end) slices. This helper draws it as text so you can see what the CPU did."
    code: |
      def gantt(segments):
          line1, line2 = "", ""
          for name, start, end in segments:
              width = max(len(name) + 2, (end - start) * 2)
              line1 += "|" + name.center(width - 1)
              line2 += str(start).ljust(width)
          return line1 + "|\n" + line2 + str(segments[-1][2])


      schedule = [("P1", 0, 3), ("P2", 3, 8), ("P3", 8, 10)]
      print(gantt(schedule))
    output: |
      |  P1 |    P2   | P3|
      0     3         8   10
    lines:
      - line: 2
        note: "Two text lines are built together: the process names on top and the time markers underneath."
      - line: 4
        note: "Each slice gets width in proportion to its length, with a minimum so that the name fits."
  - title: Four schedulers on the same workload
    intro: "The classic example: four jobs arriving close together. FCFS, SJF, SRTF and round robin give very different averages."
    code: |
      def merge(slices):
          out = []
          for name, s, e in slices:
              if out and out[-1][0] == name and out[-1][2] == s:
                  out[-1] = (name, out[-1][1], e)
              else:
                  out.append((name, s, e))
          return out


      def fcfs(procs):
          t, out = 0, []
          for name, arrival, burst in sorted(procs, key=lambda p: (p[1], p[0])):
              t = max(t, arrival)
              out.append((name, t, t + burst))
              t += burst
          return out


      def srtf(procs):
          left = {n: b for n, a, b in procs}
          arrival = {n: a for n, a, b in procs}
          t, out = 0, []
          while any(left.values()):
              ready = [n for n in left if left[n] > 0 and arrival[n] <= t]
              if not ready:
                  t += 1
                  continue
              n = min(ready, key=lambda n: (left[n], arrival[n], n))
              out.append((n, t, t + 1))
              left[n] -= 1
              t += 1
          return merge(out)


      def round_robin(procs, quantum):
          pending = sorted(procs, key=lambda p: (p[1], p[0]))
          left, queue, out, t, i = {}, [], [], 0, 0
          while queue or i < len(pending):
              while i < len(pending) and pending[i][1] <= t:
                  queue.append(pending[i][0])
                  left[pending[i][0]] = pending[i][2]
                  i += 1
              if not queue:
                  t = pending[i][1]
                  continue
              n = queue.pop(0)
              run = min(quantum, left[n])
              out.append((n, t, t + run))
              t += run
              left[n] -= run
              while i < len(pending) and pending[i][1] <= t:
                  queue.append(pending[i][0])
                  left[pending[i][0]] = pending[i][2]
                  i += 1
              if left[n] > 0:
                  queue.append(n)
          return merge(out)


      def average_waiting(procs, slices):
          done = {}
          for name, s, e in slices:
              done[name] = e
          waits = [done[n] - a - b for n, a, b in procs]
          return sum(waits) / len(waits)


      jobs = [("P1", 0, 8), ("P2", 1, 4), ("P3", 2, 9), ("P4", 3, 5)]
      for label, slices in [("FCFS", fcfs(jobs)), ("SRTF", srtf(jobs)), ("RR q=4", round_robin(jobs, 4))]:
          print(f"{label:7} avg waiting {average_waiting(jobs, slices):5.2f}  order:", " ".join(n for n, s, e in slices))
    output: |
      FCFS    avg waiting  8.75  order: P1 P2 P3 P4
      SRTF    avg waiting  6.50  order: P1 P2 P4 P1 P3
      RR q=4  avg waiting 11.75  order: P1 P2 P3 P4 P1 P3 P4 P3
    lines:
      - line: 11
        note: "FCFS: sort by arrival and run each to completion. The CPU idles if the next job hasn't arrived yet."
      - line: 20
        note: "SRTF simulates one time unit at a time, always picking the smallest remaining time. A long job is pre-empted when a shorter one arrives."
      - line: 33
        note: "Round robin keeps a queue. A process that uses its whole quantum goes to the back."
      - line: 51
        note: "Waiting time = completion − arrival − burst: all the time the process was ready but not running."
      - line: 59
        note: "SRTF has the lowest average waiting time, as the theory says. FCFS is worst because P1 is long and arrives first."
  - title: The quantum trade-off
    intro: "With a fixed cost per context switch, a small quantum wastes more CPU. This computes the useful fraction."
    code: |
      def useful_fraction(quantum, switch_cost):
          return quantum / (quantum + switch_cost)


      for q in (1, 2, 5, 10, 20, 50, 100):
          print(f"quantum {q:3} ms: {useful_fraction(q, 1) * 100:5.1f}% of the CPU does real work")
      print()
      # with 10 interactive processes, what is the longest anyone waits for a turn?
      for q in (5, 20, 100):
          print(f"quantum {q:3} ms with 10 processes: worst wait for a turn = {9 * (q + 1)} ms")
    output: |
      quantum   1 ms:  50.0% of the CPU does real work
      quantum   2 ms:  66.7% of the CPU does real work
      quantum   5 ms:  83.3% of the CPU does real work
      quantum  10 ms:  90.9% of the CPU does real work
      quantum  20 ms:  95.2% of the CPU does real work
      quantum  50 ms:  98.0% of the CPU does real work
      quantum 100 ms:  99.0% of the CPU does real work

      quantum   5 ms with 10 processes: worst wait for a turn = 54 ms
      quantum  20 ms with 10 processes: worst wait for a turn = 189 ms
      quantum 100 ms with 10 processes: worst wait for a turn = 909 ms
    lines:
      - line: 2
        note: "Each quantum of useful work is followed by one context switch of pure overhead."
      - line: 10
        note: "The other side of the trade-off: a bigger quantum means everyone else waits longer for their turn, so the system feels sluggish."
  - title: Starvation and aging
    intro: "Low priority jobs starve if high priority jobs keep arriving. Aging raises the priority of waiting jobs."
    code: |
      def run(aging):
          queue = {"low": 5}                 # lower number = higher priority
          waited = {"low": 0}
          finished = []
          for tick in range(1, 13):
              queue[f"hi{tick}"] = 1         # a new high-priority job every tick
              waited[f"hi{tick}"] = 0
              pick = min(queue, key=lambda n: (queue[n], n))
              finished.append(pick)
              del queue[pick]
              for n in queue:
                  waited[n] += 1
                  if aging and waited[n] % 2 == 0:
                      queue[n] = max(0, queue[n] - 1)
          return finished.index("low") + 1 if "low" in finished else None


      print("without aging, the low job ran at tick:", run(False))
      print("with aging, the low job ran at tick:", run(True))
    output: |
      without aging, the low job ran at tick: None
      with aging, the low job ran at tick: 11
    lines:
      - line: 5
        note: "A new priority-1 job arrives on every tick, so the priority-5 job never gets chosen."
      - line: 15
        note: "Every second tick spent waiting improves a job's priority by one level. It can even go to 0, beating the newcomers' priority of 1."
      - line: 19
        note: "None means it never ran in the 12 ticks. With aging, its priority eventually beats the newcomers and it runs."

playground:
  prompt: |
    Change the jobs in the four-schedulers example. Make one very long job arrive first, followed by several short ones, and see how far FCFS falls behind SRTF (the convoy effect). Then try different round-robin quanta and see how the average waiting time changes. Is it monotonic?
  code: |
    jobs = [("long", 0, 20), ("a", 1, 2), ("b", 2, 2), ("c", 3, 2)]
    # FCFS waiting times
    t = 0
    for name, arrival, burst in sorted(jobs, key=lambda j: j[1]):
        t = max(t, arrival)
        print(f"{name:5} waits {t - arrival}")
        t += burst

exercises:
  - id: nonpreemptive
    title: FCFS and shortest job first
    difficulty: 3
    prompt: |
      Processes are `(name, arrival, burst)` tuples with integer times. Write two functions that return the schedule as a list of `(name, start, end)` slices in the order they run (no merging is needed, since each job runs once). `fcfs(procs)` runs jobs in order of arrival (ties by name), each to completion. `sjf(procs)` is the **non-preemptive** shortest job first: whenever the CPU is free, pick from the jobs that have already arrived the one with the smallest burst (ties broken by earlier arrival, then name). In both, if no job has arrived yet the CPU idles until the next arrival (idle time is not listed as a slice).
    starter: |
      def fcfs(procs):
          pass


      def sjf(procs):
          pass
    tests:
      - name: fcfs
        code: |
          P = [("P1", 0, 8), ("P2", 1, 4), ("P3", 2, 9), ("P4", 3, 5)]
          assert fcfs(P) == [("P1", 0, 8), ("P2", 8, 12), ("P3", 12, 21), ("P4", 21, 26)]
          assert fcfs([]) == []
          assert fcfs([("A", 5, 2), ("B", 0, 1)]) == [("B", 0, 1), ("A", 5, 7)]
          assert fcfs([("B", 0, 2), ("A", 0, 2)]) == [("A", 0, 2), ("B", 2, 4)]
      - name: sjf
        code: |
          P = [("P1", 0, 8), ("P2", 1, 4), ("P3", 2, 9), ("P4", 3, 5)]
          assert sjf(P) == [("P1", 0, 8), ("P2", 8, 12), ("P4", 12, 17), ("P3", 17, 26)]
          assert sjf([("A", 0, 5), ("B", 1, 2), ("C", 2, 1)]) == [("A", 0, 5), ("C", 5, 6), ("B", 6, 8)]
          assert sjf([("A", 5, 2), ("B", 0, 1)]) == [("B", 0, 1), ("A", 5, 7)]
          assert sjf([("X", 0, 3), ("Y", 0, 3), ("Z", 0, 1)]) == [("Z", 0, 1), ("X", 1, 4), ("Y", 4, 7)]
      - name: sjf beats fcfs on average waiting
        code: |
          import random
          rng = random.Random(1)
          def total_wait(procs, sched):
              burst = {n: b for n, a, b in procs}
              arr = {n: a for n, a, b in procs}
              return sum(e - arr[n] - burst[n] for n, s, e in sched)
          for _ in range(50):
              procs = [(f"p{i}", rng.randint(0, 6), rng.randint(1, 9)) for i in range(rng.randint(2, 8))]
              f, s = fcfs(procs), sjf(procs)
              assert sorted(n for n, _, _ in s) == sorted(n for n, _, _ in procs)
              for (n, st, en) in s:
                  assert en - st == [b for m, a, b in procs if m == n][0]
              assert total_wait(procs, s) <= total_wait(procs, f)
    hints:
      - "FCFS: sort by `(arrival, name)`, keep a clock `t`, and do `t = max(t, arrival)` before each job."
      - "SJF: keep a list of unfinished jobs. At time `t`, `ready = [p for p in todo if p[1] <= t]`. If it is empty, jump `t` to the earliest arrival."
      - "Choose with `min(ready, key=lambda p: (p[2], p[1], p[0]))`, remove it from the list, and advance `t`."
    solution: |
      def fcfs(procs):
          t = 0
          out = []
          for name, arrival, burst in sorted(procs, key=lambda p: (p[1], p[0])):
              t = max(t, arrival)
              out.append((name, t, t + burst))
              t += burst
          return out


      def sjf(procs):
          todo = list(procs)
          t = 0
          out = []
          while todo:
              ready = [p for p in todo if p[1] <= t]
              if not ready:
                  t = min(p[1] for p in todo)
                  continue
              job = min(ready, key=lambda p: (p[2], p[1], p[0]))
              todo.remove(job)
              out.append((job[0], t, t + job[2]))
              t += job[2]
          return out
    explanation: |
      Both schedulers are a clock plus a rule for choosing the next job. SJF's rule needs only a different `key` function. The test confirms the theorem from the lesson on random workloads: SJF never has a larger total waiting time than FCFS.

  - id: srtf
    title: Shortest remaining time first
    difficulty: 4
    prompt: |
      Write `srtf(procs)`, the **preemptive** version of shortest job first. At every integer time unit, run the arrived, unfinished job with the smallest **remaining** time (ties broken by earlier arrival, then name). Return the schedule as a list of `(name, start, end)` slices, where **consecutive units of the same job are merged into one slice** (for example, a job that runs from 4 to 8 appears as `("A", 4, 8)`, not four slices). Idle time is not listed. All times are integers and every burst is at least 1.
    starter: |
      def srtf(procs):
          pass
    tests:
      - name: examples
        code: |
          P = [("P1", 0, 8), ("P2", 1, 4), ("P3", 2, 9), ("P4", 3, 5)]
          assert srtf(P) == [("P1", 0, 1), ("P2", 1, 5), ("P4", 5, 10), ("P1", 10, 17), ("P3", 17, 26)]
          H = [("A", 0, 5), ("B", 1, 2), ("C", 2, 1)]
          assert srtf(H) == [("A", 0, 1), ("B", 1, 3), ("C", 3, 4), ("A", 4, 8)]
      - name: idle and ties
        code: |
          assert srtf([]) == []
          assert srtf([("A", 5, 2), ("B", 0, 1)]) == [("B", 0, 1), ("A", 5, 7)]
          assert srtf([("B", 0, 2), ("A", 0, 2)]) == [("A", 0, 4 - 2), ("B", 2, 4)]
      - name: total work and optimality
        code: |
          import random, itertools
          rng = random.Random(2)
          for _ in range(40):
              procs = [(f"p{i}", rng.randint(0, 8), rng.randint(1, 6)) for i in range(rng.randint(1, 6))]
              s = srtf(procs)
              done = {}
              ran = {}
              for n, a, b in s:
                  assert a < b
                  ran[n] = ran.get(n, 0) + (b - a)
                  done[n] = b
              assert ran == {n: b for n, a, b in procs}
              assert all(s[i][2] <= s[i + 1][1] for i in range(len(s) - 1))
              arr = {n: a for n, a, b in procs}
              assert all(st >= arr[n] for n, st, en in s)
              def wait(sched):
                  d = {}
                  for n, st, en in sched:
                      d[n] = en
                  return sum(d[n] - a - b for n, a, b in procs)
              # no non-preemptive order can beat SRTF
              best = 10 ** 9
              for perm in itertools.permutations(procs):
                  t = 0
                  total = 0
                  for n, a, b in perm:
                      t = max(t, a) + b
                      total += t - a - b
                  best = min(best, total)
              assert wait(s) <= best
    hints:
      - "Keep a dictionary `left` of remaining times. Simulate one time unit per loop turn."
      - "Each unit, build `ready` from jobs with `left > 0` and `arrival <= t`. If empty, jump `t` forward to the next arrival."
      - "Record 1-unit slices `(name, t, t + 1)` and merge neighbours at the end: if the last slice has the same name and ends where the new one starts, extend it."
    solution: |
      def srtf(procs):
          left = {n: b for n, a, b in procs}
          arrival = {n: a for n, a, b in procs}
          t = 0
          out = []
          while any(left.values()):
              ready = [n for n in left if left[n] > 0 and arrival[n] <= t]
              if not ready:
                  t = min(arrival[n] for n in left if left[n] > 0)
                  continue
              n = min(ready, key=lambda n: (left[n], arrival[n], n))
              if out and out[-1][0] == n and out[-1][2] == t:
                  out[-1] = (n, out[-1][1], t + 1)
              else:
                  out.append((n, t, t + 1))
              left[n] -= 1
              t += 1
          return out
    explanation: |
      Running one tick at a time makes preemption trivial: every tick is a fresh decision, so a newly arrived short job is chosen the moment it is better. Real schedulers are event-driven (they re-decide only on arrivals and completions) for the same result with far fewer decisions, but the tick version is easier to get right.

  - id: round-robin
    title: Round robin
    difficulty: 4
    prompt: |
      Write `round_robin(procs, quantum)`. Jobs enter the ready queue when they arrive (ties by name). The CPU takes the job at the front of the queue and runs it for `min(quantum, remaining)` time units. **Jobs that arrive while it is running, or exactly when its slice ends, join the queue before the job that has just been preempted**, which then goes to the back if it still has work left. If the queue is empty, the CPU idles until the next arrival. Return the schedule as a list of `(name, start, end)` slices; if a job runs two slices in a row, **merge them** into one.
    starter: |
      def round_robin(procs, quantum):
          pass
    tests:
      - name: classic examples
        code: |
          Q = [("A", 0, 24), ("B", 0, 3), ("C", 0, 3)]
          assert round_robin(Q, 4) == [("A", 0, 4), ("B", 4, 7), ("C", 7, 10), ("A", 10, 30)]
          P = [("P1", 0, 8), ("P2", 1, 4), ("P3", 2, 9), ("P4", 3, 5)]
          assert round_robin(P, 4) == [("P1", 0, 4), ("P2", 4, 8), ("P3", 8, 12), ("P4", 12, 16), ("P1", 16, 20), ("P3", 20, 24), ("P4", 24, 25), ("P3", 25, 26)]
      - name: arrival order rule and idle
        code: |
          H = [("A", 0, 5), ("B", 1, 2), ("C", 2, 1)]
          assert round_robin(H, 2) == [("A", 0, 2), ("B", 2, 4), ("C", 4, 5), ("A", 5, 8)]
          assert round_robin(H, 1) == [("A", 0, 1), ("B", 1, 2), ("A", 2, 3), ("C", 3, 4), ("B", 4, 5), ("A", 5, 8)]
          T = [("A", 0, 3), ("B", 2, 3), ("C", 4, 1)]
          assert round_robin(T, 2) == [("A", 0, 2), ("B", 2, 4), ("A", 4, 5), ("C", 5, 6), ("B", 6, 7)]
          assert round_robin([("A", 5, 2), ("B", 0, 1)], 3) == [("B", 0, 1), ("A", 5, 7)]
          assert round_robin([], 3) == []
      - name: huge quantum is fcfs
        code: |
          P = [("P1", 0, 8), ("P2", 1, 4), ("P3", 2, 9), ("P4", 3, 5)]
          assert round_robin(P, 1000) == [("P1", 0, 8), ("P2", 8, 12), ("P3", 12, 21), ("P4", 21, 26)]
      - name: random work is conserved
        code: |
          import random
          rng = random.Random(3)
          for _ in range(60):
              procs = [(f"p{i}", rng.randint(0, 10), rng.randint(1, 7)) for i in range(rng.randint(1, 7))]
              q = rng.randint(1, 5)
              s = round_robin(procs, q)
              ran = {}
              arr = {n: a for n, a, b in procs}
              for n, a, b in s:
                  assert b - a >= 1 and a >= arr[n]
                  ran[n] = ran.get(n, 0) + b - a
              assert ran == {n: b for n, a, b in procs}
              assert all(s[i][2] <= s[i + 1][1] for i in range(len(s) - 1))
              assert all(not (s[i][0] == s[i + 1][0] and s[i][2] == s[i + 1][1]) for i in range(len(s) - 1)), "merge repeated slices"
    hints:
      - "Keep `pending` (sorted by arrival, name), a `queue` of names, a dict of remaining times, a clock `t`, and an index `i` into `pending`."
      - "Write a small loop that moves every pending job with `arrival <= t` into the queue. Call it before the loop and **right after each slice**, before putting the preempted job back."
      - "If the queue is empty but jobs are pending, jump `t` to the next arrival."
      - "Merge at the end (or as you go) when the same job's next slice starts exactly where the last one ended."
    solution: |
      def round_robin(procs, quantum):
          pending = sorted(procs, key=lambda p: (p[1], p[0]))
          left = {}
          queue = []
          out = []
          t = 0
          i = 0

          def admit():
              nonlocal i
              while i < len(pending) and pending[i][1] <= t:
                  queue.append(pending[i][0])
                  left[pending[i][0]] = pending[i][2]
                  i += 1

          admit()
          while queue or i < len(pending):
              if not queue:
                  t = pending[i][1]
                  admit()
                  continue
              n = queue.pop(0)
              run = min(quantum, left[n])
              if out and out[-1][0] == n and out[-1][2] == t:
                  out[-1] = (n, out[-1][1], t + run)
              else:
                  out.append((n, t, t + run))
              t += run
              left[n] -= run
              admit()
              if left[n] > 0:
                  queue.append(n)
          return out
    explanation: |
      The subtle rule is the order of the two queue operations after a slice: arrivals first, then the preempted job. Different textbooks make different choices here and get different charts, which is why the problem statement had to pin it down. The result confirms the theory: with a huge quantum round robin degenerates into FCFS.

  - id: metrics
    title: Measuring a schedule
    difficulty: 3
    prompt: |
      Write `metrics(procs, slices)`. `procs` is a list of `(name, arrival, burst)` and `slices` is a schedule such as the ones above (it may contain several slices for the same name). Return a pair `(per_process, averages)`. `per_process` is a dictionary mapping each name to `(turnaround, waiting, response)`, where turnaround is completion time minus arrival, waiting is turnaround minus burst, and response is the start of the first slice minus arrival. `averages` is a tuple of the three averages over all processes, each rounded to 2 decimal places. For no processes return `({}, (0.0, 0.0, 0.0))`.
    starter: |
      def metrics(procs, slices):
          pass
    tests:
      - name: single slices
        code: |
          P = [("P1", 0, 8), ("P2", 1, 4), ("P3", 2, 9), ("P4", 3, 5)]
          s = [("P1", 0, 8), ("P2", 8, 12), ("P3", 12, 21), ("P4", 21, 26)]
          per, avg = metrics(P, s)
          assert per == {"P1": (8, 0, 0), "P2": (11, 7, 7), "P3": (19, 10, 10), "P4": (23, 18, 18)}
          assert avg == (15.25, 8.75, 8.75)
      - name: preempted jobs
        code: |
          Q = [("A", 0, 24), ("B", 0, 3), ("C", 0, 3)]
          s = [("A", 0, 4), ("B", 4, 7), ("C", 7, 10), ("A", 10, 30)]
          per, avg = metrics(Q, s)
          assert per == {"A": (30, 6, 0), "B": (7, 4, 4), "C": (10, 7, 7)}
          assert avg == (15.67, 5.67, 3.67)
          assert metrics([], []) == ({}, (0.0, 0.0, 0.0))
    hints:
      - "Walk the slices once: `first[name]` is set the first time you see a name, `last[name]` is updated every time."
      - "Then for each process: turnaround = `last - arrival`, waiting = turnaround − burst, response = `first - arrival`."
      - "Average each of the three positions with `round(sum(...) / k, 2)`."
    solution: |
      def metrics(procs, slices):
          if not procs:
              return {}, (0.0, 0.0, 0.0)
          first = {}
          last = {}
          for name, start, end in slices:
              first.setdefault(name, start)
              last[name] = end
          per = {}
          for name, arrival, burst in procs:
              turnaround = last[name] - arrival
              per[name] = (turnaround, turnaround - burst, first[name] - arrival)
          k = len(procs)
          averages = tuple(round(sum(v[i] for v in per.values()) / k, 2) for i in range(3))
          return per, averages
    explanation: |
      Notice that for round robin the response time is small (everyone gets a turn quickly) while the turnaround is large, and for FCFS it is the opposite way round for short jobs stuck behind a long one. A single "best scheduler" does not exist; the right choice depends on whether you care most about throughput, response or fairness.

commonMistakes:
  - title: Assuming shortest-job-first is always the best choice
    explanation: |
      It minimises average waiting time, but it can starve long jobs, and the OS rarely knows burst lengths in advance.
  - title: Picking a time quantum that is too small
    explanation: |
      Context switches are not free. A quantum close to the switch cost wastes much of the CPU.
  - title: Forgetting the idle gap
    explanation: |
      If no process has arrived, the CPU waits. The clock must jump to the next arrival, not stay put.
  - title: Mixing up waiting time and response time
    explanation: |
      Waiting time counts all the time spent ready but not running. Response time only measures the wait until the first run.
  - title: Ignoring arrival order when processes tie
    explanation: |
      A scheduling problem needs a clear tie-breaking rule, or different solutions legitimately disagree.

summary:
  - "The **scheduler** picks which ready process runs next. **Preemptive** schedulers can take the CPU away using the timer; **non-preemptive** ones wait until a process blocks or ends."
  - "Measure with **turnaround** (completion − arrival), **waiting** (turnaround − burst) and **response** (first run − arrival), alongside throughput and fairness."
  - "**FCFS** is simple but suffers the **convoy effect**. **SJF** and **SRTF** minimise average waiting time but need to know burst lengths and can starve long jobs."
  - "**Round robin** gives each process a quantum in turn. A small quantum gives good response but more switching overhead; a huge one becomes FCFS."
  - "**Priority scheduling** risks starvation, which **aging** fixes; **priority inversion** is fixed by priority inheritance."
  - "A **multilevel feedback queue** learns which jobs are short by demoting those that use a full quantum; Linux's CFS shares the CPU in proportion to weights."
next: |
  So far each process has run on its own. Lesson 10.4 turns to **concurrency**: several threads of control sharing the same memory. The result is powerful and treacherous: the timing of the scheduler you just built can make a program give different answers on different runs. You will see a **race condition** happen and learn why it does.

