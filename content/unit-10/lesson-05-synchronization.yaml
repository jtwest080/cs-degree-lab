  - type: code
    question: |
      Write `safe_add(lock_log, value)`, a function that records the order of lock operations. It should append `"acquire"` to `lock_log`, then append `("add", value)`, then append `"release"`, and make sure `"release"` is appended even if `value` is `None` (in which case it must raise `ValueError` after the acquire, instead of appending the add).
    starter: |
      def safe_add(lock_log, value):
          pass
    tests:
      - name: order and exception safety
        code: |
          log = []
          safe_add(log, 5)
          assert log == ["acquire", ("add", 5), "release"]
          log = []
          try:
              safe_add(log, None)
              assert False
          except ValueError:
              pass
          assert log == ["acquire", "release"]
    solution: |
      def safe_add(lock_log, value):
          lock_log.append("acquire")
          try:
              if value is None:
                  raise ValueError("no value")
              lock_log.append(("add", value))
          finally:
              lock_log.append("release")
