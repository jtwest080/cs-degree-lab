    Use the producer-consumer example with two producers and one consumer, or change the buffer capacity to 1. Does the log change? Then try swapping the two `wait` lines in the producer and run it with a capacity of 1 and a consumer that starts later. Can you reproduce a deadlock?
  code: |
    def cas(shared, key, expected, new):
        if shared[key] == expected:
            shared[key] = new
            return True
        return False


    box = {"x": 10}
    print(cas(box, "x", 10, 11), box)
    print(cas(box, "x", 10, 12), box)   # fails: x is no longer 10

exercises:
  - id: semaphore
    title: Build a semaphore
    difficulty: 3
    prompt: |
      Write the class `Semaphore`. It starts with an integer `value` (attribute `value`) and an empty FIFO queue of waiting thread ids (attribute `queue`, a list or deque). `wait(tid)` returns `True` if the thread may continue (the counter was above 0 and is decremented); otherwise it appends `tid` to the queue and returns `False` (the thread must sleep). `signal()` returns the id of the thread that is woken, if any: when the queue is non-empty, remove and return its **first** thread (the counter does **not** change, since the unit passes directly to that thread); when the queue is empty, increment the counter and return `None`.
    starter: |
      class Semaphore:
          def __init__(self, value):
              pass

          def wait(self, tid):
              pass

          def signal(self):
              pass
    tests:
      - name: wait and signal
        code: |
          s = Semaphore(2)
          assert s.wait("a") is True and s.wait("b") is True and s.value == 0
          assert s.wait("c") is False and s.wait("d") is False
          assert list(s.queue) == ["c", "d"]
          assert s.signal() == "c" and s.value == 0 and list(s.queue) == ["d"]
          assert s.signal() == "d" and s.value == 0
          assert s.signal() is None and s.value == 1
          assert s.signal() is None and s.value == 2
      - name: zero and binary
        code: |
          s = Semaphore(0)
          assert s.wait("x") is False
          assert s.signal() == "x" and s.value == 0
          m = Semaphore(1)
          assert m.wait(1) is True and m.wait(2) is False and m.wait(3) is False
          assert m.signal() == 2 and m.signal() == 3 and m.signal() is None and m.value == 1
    hints:
      - "Use `collections.deque` (or a list with `pop(0)`) for the queue so threads are woken in arrival order."
      - "A woken thread takes the unit directly, so `signal` must not also increment `value` in that case."
    solution: |
      from collections import deque


      class Semaphore:
          def __init__(self, value):
              self.value = value
              self.queue = deque()

          def wait(self, tid):
              if self.value > 0:
                  self.value -= 1
                  return True
              self.queue.append(tid)
              return False

          def signal(self):
              if self.queue:
                  return self.queue.popleft()
              self.value += 1
              return None
    explanation: |
      Handing the unit straight to the first waiter, rather than incrementing the counter and letting everyone race for it, is what makes the semaphore **fair**: sleepers are served in the order they arrived, so nobody starves. The real thing needs the whole of `wait` and `signal` to be atomic, which the kernel arranges using a spinlock or by disabling interrupts for these few instructions.

  - id: mutex
    title: A mutex from a semaphore
    difficulty: 3
    prompt: |
      Write the class `Mutex` using a binary `Semaphore` (provided below). `lock(tid)` returns `True` if the thread now owns the mutex, otherwise queues the thread and returns `False`. `unlock(tid)` releases the mutex: it raises `RuntimeError` if `tid` is not the current owner (including when the mutex is unlocked). Otherwise, if some thread is waiting, ownership passes to the **first** waiter and `unlock` returns that thread's id; if nobody waits the mutex becomes free (`owner` is `None`) and `unlock` returns `None`. Keep the owner in the attribute `owner`.
    starter: |
      from collections import deque


      class Semaphore:
          def __init__(self, value):
              self.value = value
              self.queue = deque()

          def wait(self, tid):
              if self.value > 0:
                  self.value -= 1
                  return True
              self.queue.append(tid)
              return False

          def signal(self):
              if self.queue:
                  return self.queue.popleft()
              self.value += 1
              return None


      class Mutex:
          def __init__(self):
              pass

          def lock(self, tid):
              pass

          def unlock(self, tid):
              pass
    tests:
      - name: ownership and handoff
        code: |
          m = Mutex()
          assert m.owner is None
          assert m.lock("a") is True and m.owner == "a"
          assert m.lock("b") is False and m.lock("c") is False
          assert m.owner == "a"
          assert m.unlock("a") == "b" and m.owner == "b"
          assert m.unlock("b") == "c" and m.owner == "c"
          assert m.unlock("c") is None and m.owner is None
          assert m.lock("z") is True and m.owner == "z"
      - name: only the owner may unlock
        code: |
          m = Mutex()
          for who in ("a", None):
              try:
                  m.unlock(who)
                  assert False, "unlocking a free mutex must fail"
              except RuntimeError:
                  pass
          m.lock("a")
          m.lock("b")
          try:
              m.unlock("b")          # b is only waiting
              assert False
          except RuntimeError:
              pass
          assert m.owner == "a"
    hints:
      - "Keep `self.sem = Semaphore(1)` and `self.owner = None`."
      - "`lock`: `if self.sem.wait(tid): self.owner = tid; return True`, otherwise return `False`."
      - "`unlock`: check the owner first. Then `woken = self.sem.signal()`; the owner becomes `woken` (which may be `None`)."
    solution: |
      from collections import deque


      class Semaphore:
          def __init__(self, value):
              self.value = value
              self.queue = deque()

          def wait(self, tid):
              if self.value > 0:
                  self.value -= 1
                  return True
              self.queue.append(tid)
              return False

          def signal(self):
              if self.queue:
                  return self.queue.popleft()
              self.value += 1
              return None


      class Mutex:
          def __init__(self):
              self.sem = Semaphore(1)
              self.owner = None

          def lock(self, tid):
              if self.sem.wait(tid):
                  self.owner = tid
                  return True
              return False

          def unlock(self, tid):
              if self.owner is None or self.owner != tid:
                  raise RuntimeError("unlock by a thread that does not hold the lock")
              woken = self.sem.signal()
              self.owner = woken
              return woken
    explanation: |
      A mutex is a binary semaphore plus **ownership**. The ownership check catches a common bug (releasing a lock you never took) and enables features like priority inheritance, since the kernel knows whom to boost. Python's `threading.RLock` adds a counter on top so that the owner can lock repeatedly.

  - id: critical-section
    title: Protect a counter
    difficulty: 3
    prompt: |
      A small cooperative kernel runs threads written as generators that yield requests: `("step",)` allows a switch, `("wait", sem)` waits on a semaphore and `("signal", sem)` signals it. Write the generator function `counter_thread(shared, sem, times)`. It performs `times` increments of `shared["n"]`; each increment must **wait** on `sem`, read the value, `("step",)` (so a switch could happen mid-update), write the value plus one, then **signal** `sem`. With a binary semaphore the final count must be exactly right however the threads are scheduled.
    starter: |
      def counter_thread(shared, sem, times):
          for _ in range(times):
              yield ("step",)
    tests:
      - name: protected by a binary semaphore
        code: |
          from collections import deque
          class Semaphore:
              def __init__(self, value):
                  self.value, self.queue = value, deque()
              def wait(self, t):
                  if self.value > 0:
                      self.value -= 1
                      return True
                  self.queue.append(t)
                  return False
              def signal(self):
                  if self.queue:
                      return self.queue.popleft()
                  self.value += 1
          def run(threads):
              ready, blocked = deque(threads), 0
              while ready:
                  t = ready.popleft()
                  try:
                      req = next(t)
                  except StopIteration:
                      continue
                  if req[0] == "step":
                      ready.append(t)
                  elif req[0] == "wait":
                      if req[1].wait(t):
                          ready.append(t)
                      else:
                          blocked += 1
                  else:
                      w = req[1].signal()
                      if w is not None:
                          blocked -= 1
                          ready.append(w)
                      ready.append(t)
              return blocked
          for n_threads, times in ((1, 5), (2, 4), (3, 3), (5, 2)):
              shared, sem = {"n": 0}, Semaphore(1)
              stuck = run([counter_thread(shared, sem, times) for _ in range(n_threads)])
              assert stuck == 0 and shared["n"] == n_threads * times, (n_threads, times, shared)
              assert sem.value == 1 and not sem.queue
      - name: the step really is inside the critical section
        code: |
          from collections import deque
          class Semaphore:
              def __init__(self, value):
                  self.value, self.queue = value, deque()
              def wait(self, t):
                  if self.value > 0:
                      self.value -= 1
                      return True
                  self.queue.append(t)
                  return False
              def signal(self):
                  if self.queue:
                      return self.queue.popleft()
                  self.value += 1
          shared, sem = {"n": 0}, Semaphore(5)
          ready = deque(counter_thread(shared, sem, 3) for _ in range(3))
          while ready:
              t = ready.popleft()
              try:
                  req = next(t)
              except StopIteration:
                  continue
              if req[0] == "wait":
                  assert req[1].wait(t)
                  ready.append(t)
              elif req[0] == "signal":
                  req[1].signal()
                  ready.append(t)
              else:
                  ready.append(t)
          assert shared["n"] < 9, "with a semaphore that lets everyone in, updates must be lost"
    hints:
      - "Each loop turn: `yield (\"wait\", sem)`, `tmp = shared[\"n\"]`, `yield (\"step\",)`, `shared[\"n\"] = tmp + 1`, `yield (\"signal\", sem)`."
      - "Do the read and the write between the wait and the signal."
    solution: |
      def counter_thread(shared, sem, times):
          for _ in range(times):
              yield ("wait", sem)
              tmp = shared["n"]
              yield ("step",)
              shared["n"] = tmp + 1
              yield ("signal", sem)
    explanation: |
      The same code that loses updates when the semaphore admits everyone (second test) is exactly right when the semaphore admits one at a time. The structure `wait ... signal` around a critical section is the entire recipe. Making sure it is released on every path, including errors, is why Python offers `with lock:`.

  - id: bounded-buffer
    title: Producers and consumers
    difficulty: 4
    prompt: |
      Using the request protocol from the previous exercise, write two generator functions. `producer(items, buf, empty, full, mutex)` adds each of `items` to the list `buf`, and `consumer(n, buf, empty, full, mutex, out)` removes `n` items from the front of `buf` (`buf.pop(0)`) and appends each to the list `out`. The semaphores are `empty` (free slots, initially the capacity), `full` (filled slots, initially 0) and `mutex` (initially 1). The buffer must never overflow its capacity, no item may be lost or duplicated, and the threads must never deadlock. Mind the order of the `wait` calls.
    starter: |
      def producer(items, buf, empty, full, mutex):
          for item in items:
              yield ("step",)


      def consumer(n, buf, empty, full, mutex, out):
          for _ in range(n):
              yield ("step",)
    tests:
      - name: single producer and consumer
        code: |
          from collections import deque
          class Semaphore:
              def __init__(self, value):
                  self.value, self.queue = value, deque()
              def wait(self, t):
                  if self.value > 0:
                      self.value -= 1
                      return True
                  self.queue.append(t)
                  return False
              def signal(self):
                  if self.queue:
                      return self.queue.popleft()
                  self.value += 1
          class Buf(list):
              peak = 0
              def append(self, x):
                  super().append(x)
                  self.peak = max(self.peak, len(self))
          def run(threads):
              ready, blocked = deque(threads), 0
              while ready:
                  t = ready.popleft()
                  try:
                      req = next(t)
                  except StopIteration:
                      continue
                  if req[0] == "step":
                      ready.append(t)
                  elif req[0] == "wait":
                      if req[1].wait(t):
                          ready.append(t)
                      else:
                          blocked += 1
                  else:
                      w = req[1].signal()
                      if w is not None:
                          blocked -= 1
                          ready.append(w)
                      ready.append(t)
              return blocked
          for cap in (1, 2, 5):
              buf, out = Buf(), []
              e, f, m = Semaphore(cap), Semaphore(0), Semaphore(1)
              items = list(range(10))
              stuck = run([producer(items, buf, e, f, m), consumer(10, buf, e, f, m, out)])
              assert stuck == 0 and out == items, (cap, out)
              assert buf.peak <= cap and buf == []
      - name: consumer starts first and several producers
        code: |
          from collections import deque
          class Semaphore:
              def __init__(self, value):
                  self.value, self.queue = value, deque()
              def wait(self, t):
                  if self.value > 0:
                      self.value -= 1
                      return True
                  self.queue.append(t)
                  return False
              def signal(self):
                  if self.queue:
                      return self.queue.popleft()
                  self.value += 1
          class Buf(list):
              peak = 0
              def append(self, x):
                  super().append(x)
                  self.peak = max(self.peak, len(self))
          def run(threads):
              ready, blocked = deque(threads), 0
              while ready:
                  t = ready.popleft()
                  try:
                      req = next(t)
                  except StopIteration:
                      continue
                  if req[0] == "step":
                      ready.append(t)
                  elif req[0] == "wait":
                      if req[1].wait(t):
                          ready.append(t)
                      else:
                          blocked += 1
                  else:
                      w = req[1].signal()
                      if w is not None:
                          blocked -= 1
                          ready.append(w)
                      ready.append(t)
              return blocked
          for cap in (1, 2, 3):
              buf, out = Buf(), []
              e, f, m = Semaphore(cap), Semaphore(0), Semaphore(1)
              threads = [consumer(12, buf, e, f, m, out)]
              for p in range(3):
                  threads.append(producer([(p, i) for i in range(4)], buf, e, f, m))
              stuck = run(threads)
              assert stuck == 0, "deadlock"
              assert sorted(out) == sorted((p, i) for p in range(3) for i in range(4))
              for p in range(3):
                  assert [x for x in out if x[0] == p] == [(p, i) for i in range(4)]
              assert buf.peak <= cap
    hints:
      - "Producer, for each item: `yield (\"wait\", empty)`, `yield (\"wait\", mutex)`, `buf.append(item)`, `yield (\"signal\", mutex)`, `yield (\"signal\", full)`."
      - "Consumer, `n` times: wait on `full`, then `mutex`, then `out.append(buf.pop(0))`, then signal `mutex`, then signal `empty`."
      - "Always wait on the *counting* semaphore (empty or full) **before** the mutex, and release the mutex before signalling the counting one."
    solution: |
      def producer(items, buf, empty, full, mutex):
          for item in items:
              yield ("wait", empty)
              yield ("wait", mutex)
              buf.append(item)
              yield ("signal", mutex)
              yield ("signal", full)


      def consumer(n, buf, empty, full, mutex, out):
          for _ in range(n):
              yield ("wait", full)
              yield ("wait", mutex)
              out.append(buf.pop(0))
              yield ("signal", mutex)
              yield ("signal", empty)
    explanation: |
      Each semaphore has one job: `empty` counts free slots and stops producers when the buffer is full, `full` counts items and stops consumers when it is empty, and `mutex` protects the list itself. The mutex is held only for the quick append or pop, never while sleeping on `empty` or `full`; that ordering is what prevents deadlock. In real Python code you would simply use `queue.Queue`.

  - id: cas
    title: Lock-free increment
    difficulty: 3
    prompt: |
      Write `cas(shared, key, expected, new)`, which atomically sets `shared[key] = new` and returns `True` if `shared[key] == expected`, or leaves it alone and returns `False` otherwise. (It is one function call here, so treat it as atomic.) Then write the thread generator `cas_increment(shared)`, which increments `shared["n"]` **without any lock**: loop to read the current value into `old`, `yield` (a switch may happen), then try `cas(shared, "n", old, old + 1)`; stop when it succeeds, and retry from the read if it fails.
    starter: |
      def cas(shared, key, expected, new):
          pass


      def cas_increment(shared):
          yield
    tests:
      - name: cas semantics
        code: |
          d = {"x": 5}
          assert cas(d, "x", 5, 6) is True and d == {"x": 6}
          assert cas(d, "x", 5, 7) is False and d == {"x": 6}
          assert cas(d, "x", 6, 6) is True
      - name: no lost updates under random schedules
        code: |
          import random
          assert "cas(" in source
          rng = random.Random(7)
          retried = False
          for trial in range(300):
              shared = {"n": 0}
              k = rng.randint(2, 5)
              gens = [cas_increment(shared) for _ in range(k)]
              alive = list(range(k))
              steps = 0
              while alive:
                  i = rng.choice(alive)
                  steps += 1
                  assert steps < 1000, "a thread never finishes"
                  try:
                      next(gens[i])
                  except StopIteration:
                      alive.remove(i)
              assert shared["n"] == k, (trial, shared)
              if steps > 2 * k:
                  retried = True
          assert retried, "some schedule should force a retry"
    hints:
      - "`cas`: compare, and if equal assign and return True; otherwise return False."
      - "`cas_increment`: `while True:` read `old = shared[\"n\"]`, `yield`, then `if cas(shared, \"n\", old, old + 1): return`."
    solution: |
      def cas(shared, key, expected, new):
          if shared[key] == expected:
              shared[key] = new
              return True
          return False


      def cas_increment(shared):
          while True:
              old = shared["n"]
              yield
              if cas(shared, "n", old, old + 1):
                  return
    explanation: |
      If another thread changed the value between the read and the CAS, the CAS fails and the loop retries with fresh data. Some thread always makes progress, so the whole system never gets stuck, which is the defining property of **lock-free** algorithms. Hardware CAS instructions (`lock cmpxchg` on x86) power atomic counters, lock-free queues and the internals of most language runtimes.

commonMistakes:
  - title: Waiting with an if instead of a while
    explanation: |
      A condition may no longer hold by the time a woken thread runs. Re-check it in a loop.
  - title: Taking the mutex before waiting on a counting semaphore
    explanation: |
      Holding the mutex while sleeping blocks everyone who could wake you: deadlock. Wait on `empty` or `full` first, then lock.
  - title: Forgetting to release a lock on an error path
    explanation: |
      An exception inside the critical section leaves the lock held forever. Use `with lock:` or `try/finally`.
  - title: Holding a lock during slow work
    explanation: |
      Network or disk calls inside a critical section stall every other thread that needs the lock. Copy what you need, release, then do the slow part.
  - title: Locking different data with different locks inconsistently
    explanation: |
      If one code path protects a variable with lock A and another with lock B, nothing protects it. Each shared variable needs one lock that is always used.
  - title: Using a spinlock for long waits
    explanation: |
      Spinning burns CPU. Use it only when the wait is shorter than a context switch.

summary:
  - "A critical-section solution must give **mutual exclusion**, **progress** and **bounded waiting**. A **mutex** (lock) provides mutual exclusion; keep its sections short and always release it (`with lock:`)."
  - "Locks are built on **atomic hardware instructions** like test-and-set and **compare-and-swap**. A **spinlock** busy-waits; a sleeping lock lets the kernel run another thread. CAS enables **lock-free** retries."
  - "A **semaphore** is a counter plus a wait queue: `wait` decrements or sleeps, `signal` wakes the first sleeper or increments. Value 1 is a mutex, value N limits access, value 0 signals an event."
  - "**Bounded buffer:** `empty` (free slots), `full` (items) and `mutex`. Wait on the counting semaphore before the mutex, or you can deadlock."
  - "A **monitor** bundles data with a lock; a **condition variable** lets a thread sleep until a condition is true. Always `wait()` in a `while` loop."
  - "Prefer high-level tools (queues, thread pools, message passing), share little, and acquire multiple locks in one fixed order."
next: |
  Locks fix races but create a new danger: threads that **wait for each other forever**. Lesson 10.6 studies **deadlock**: the four conditions that cause it, how to draw and search a wait-for graph, Dijkstra's banker's algorithm for avoiding it, and the dining philosophers.

