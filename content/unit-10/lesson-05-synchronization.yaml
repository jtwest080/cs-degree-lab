id: u10-synchronization
title: "Synchronization: Locks, Semaphores and Monitors"
minutes: 60
objective: |
  Learn the tools that make shared memory safe: mutual exclusion with locks, counting with semaphores, waiting for conditions, and lock-free updates with compare-and-swap. Build a semaphore and a mutex from scratch, run threads on a small cooperative kernel, and solve the classic producer-consumer problem correctly.
outcomes:
  - "State the three requirements of a critical-section solution: mutual exclusion, progress and bounded waiting"
  - Explain how hardware atomic instructions (test-and-set, compare-and-swap) make locks possible
  - Implement a semaphore with a wait queue and use it as a mutex and as a counter
  - Solve the bounded-buffer producer-consumer problem with three semaphores
  - Explain monitors and condition variables, and why waits go in loops
  - Describe the readers-writers problem and lock-free updates

sections:
  - heading: Mutual exclusion
    body: |
      Lesson 10.4 showed that two threads updating shared data can lose updates. The fix is to make the **critical section** (the code touching the shared data) execute by **one thread at a time**. A correct solution must provide:

      1. **Mutual exclusion**: at most one thread inside the critical section at any moment.
      2. **Progress**: if no thread is inside and some want to enter, one of them is allowed to, in finite time (nobody waits for a thread that isn't interested).
      3. **Bounded waiting**: once a thread asks to enter, only a limited number of other threads may enter before it does (no starvation).

      The standard tool is a **lock** (also called a **mutex**, short for mutual exclusion). Before entering, a thread **acquires** the lock; if another thread holds it, the caller waits. After leaving, it **releases** the lock.

      ```python
      lock.acquire()
      counter += 1          # critical section
      lock.release()
      ```

      In Python the safe way is `with lock:`, which releases automatically even if an exception happens. Forgetting to release, or releasing twice, are classic bugs.

      **Keep critical sections short.** While a thread holds a lock, every other thread that needs it is stuck. Lock the data for the shortest time possible, and never do slow things (disk, network) while holding a lock if you can avoid it.

  - heading: Where locks come from
    body: |
      How can software build a lock out of nothing? A naive attempt (`while locked: pass; locked = True`) has the same check-then-act race it was meant to fix. Early solutions like **Peterson's algorithm** achieve mutual exclusion using only ordinary reads and writes, but they are subtle and break on modern CPUs that reorder memory operations.

      Real locks use special **atomic instructions** that the hardware guarantees cannot be interrupted, even across cores:

      - **Test-and-set**: atomically read a flag and set it to 1, returning the old value. Acquire: `while test_and_set(flag) == 1: pass`. This is a **spinlock**: it wastes CPU while waiting, but is good for very short waits on multi-core machines.
      - **Compare-and-swap (CAS)**: atomically do `if x == expected: x = new; return True; else return False`. It is the building block of nearly all lock-free programming.

      A lock that makes the waiting thread **sleep** (the kernel marks it waiting and runs someone else, Lesson 10.2) saves CPU for long waits, but costs a context switch. Real locks (like Linux's **futex**) spin briefly and then sleep.

      **Lock-free updates.** With CAS you can update a shared value with no lock at all: read the old value, compute the new one, and CAS it in; if somebody else changed it meanwhile, the CAS fails and you simply retry. No thread can ever block another, which avoids deadlock (next lesson) and priority inversion. But it takes care to get right. A famous trap is the **ABA problem**: the value changes from A to B and back to A, so the CAS succeeds although the world changed underneath it.

  - heading: Semaphores
    body: |
      A **semaphore**, invented by Edsger Dijkstra in 1965, is an integer counter with a queue of sleeping threads and two atomic operations:

      - **`wait(s)`** (also called P, down, or acquire): if the counter is above 0, decrement it and continue. If it is 0, the thread **blocks**, joining the semaphore's queue.
      - **`signal(s)`** (V, up, release, or post): if a thread is waiting, wake the first one in the queue (it takes the unit directly). Otherwise increment the counter.

      A semaphore initialised to **1** is a **binary semaphore**, which works as a mutex. A semaphore initialised to *N* is a **counting semaphore**, which lets up to *N* threads in at once: *N* database connections, *N* slots in a buffer, *N* licences. A semaphore initialised to **0** is a signal: one thread waits until another says "go".

      A subtle difference from a mutex: a semaphore has no **owner**, so any thread may signal it. This makes semaphores flexible (one thread can signal an event for another), and also easier to misuse.

      **Producer-consumer (bounded buffer).** Producers add items to a buffer of capacity *N*; consumers remove them. Producers must wait if the buffer is full; consumers must wait if it is empty; and the buffer itself must not be touched by two threads at once. Three semaphores solve it:

      ```text
      empty = Semaphore(N)    # free slots
      full  = Semaphore(0)    # filled slots
      mutex = Semaphore(1)    # protects the buffer

      producer:                  consumer:
        wait(empty)                wait(full)
        wait(mutex)                wait(mutex)
        add item                   remove item
        signal(mutex)              signal(mutex)
        signal(full)               signal(empty)
      ```

      **Order matters.** If the producer waited on `mutex` *before* `empty`, then a producer holding the mutex while the buffer is full would block forever, and no consumer could get the mutex to make room. That's a **deadlock**, the subject of the next lesson.

  - heading: Monitors and condition variables
    body: |
      Semaphores are low-level and easy to get wrong. A **monitor** packages shared data together with the code that accesses it, and guarantees that only **one thread at a time** executes inside the monitor. Java's `synchronized` methods and Python's `threading.Condition` work this way.

      Inside a monitor, threads may need to wait for a **condition** ("buffer not empty"). A **condition variable** supports:

      - **`wait()`**: atomically release the monitor's lock and go to sleep; when woken, re-acquire the lock before continuing.
      - **`notify()`** / **`notify_all()`**: wake one / all sleeping threads.

      Always wait **in a loop**:

      ```python
      with cond:
          while not buffer:          # NOT "if"
              cond.wait()
          item = buffer.pop(0)
      ```

      Why a `while` and not an `if`? Another thread may have taken the item between the wake-up and your re-acquiring the lock, and some systems wake threads **spuriously**. Re-checking the condition makes the code correct either way.

  - heading: Readers and writers, and other classics
    body: |
      Many threads may safely **read** shared data at once, but a **writer** needs exclusive access. A **readers-writers lock** (Python has none built in; Java has `ReadWriteLock`) lets any number of readers in together, or one writer alone. The design question is who gets priority: if readers always win, writers may starve, and vice versa.

      Other classic synchronisation problems you will meet:

      - **Dining philosophers**: five philosophers share five forks and each needs two to eat. A trap for deadlock (Lesson 10.6).
      - **Barrier**: all threads must reach a point before any continues (used in parallel simulations).
      - **Sleeping barber, cigarette smokers**: puzzles that exercise different coordination patterns.

      **Tips for real programs.** (1) Prefer higher-level tools: queues (`queue.Queue` is a thread-safe bounded buffer), thread pools and message passing. (2) Share as little mutable state as you can. (3) Always acquire multiple locks in the **same global order**. (4) Hold locks briefly. (5) Test under stress and with tools like thread sanitizers; reasoning alone misses things.

examples:
  - title: A semaphore and a small kernel
    intro: "Threads are generators that yield requests (step, wait, signal). The kernel runs them in turns and puts blocked threads to sleep on the semaphore's queue."
    code: |
      from collections import deque


      class Semaphore:
          def __init__(self, value):
              self.value = value
              self.queue = deque()

          def wait(self, thread):
              if self.value > 0:
                  self.value -= 1
                  return True              # got it
              self.queue.append(thread)
              return False                 # must sleep

          def signal(self):
              if self.queue:
                  return self.queue.popleft()   # hand the unit to the oldest sleeper
              self.value += 1
              return None


      class Kernel:
          def __init__(self):
              self.ready = deque()
              self.blocked = 0

          def spawn(self, thread):
              self.ready.append(thread)

          def run(self):
              while self.ready:
                  t = self.ready.popleft()
                  try:
                      request = next(t)
                  except StopIteration:
                      continue
                  if request[0] == "step":
                      self.ready.append(t)
                  elif request[0] == "wait":
                      if request[1].wait(t):
                          self.ready.append(t)
                      else:
                          self.blocked += 1
                  elif request[0] == "signal":
                      woken = request[1].signal()
                      if woken is not None:
                          self.blocked -= 1
                          self.ready.append(woken)
                      self.ready.append(t)
              if self.blocked:
                  raise RuntimeError(f"deadlock: {self.blocked} threads asleep forever")


      def counter(shared, sem, times):
          for _ in range(times):
              yield ("wait", sem)
              tmp = shared["n"]
              yield ("step",)              # a switch here is harmless: nobody else can be inside
              shared["n"] = tmp + 1
              yield ("signal", sem)


      for label, start in (("mutex (value 1)", 1), ("no protection (value 3)", 3)):
          kernel, shared, sem = Kernel(), {"n": 0}, Semaphore(start)
          for _ in range(3):
              kernel.spawn(counter(shared, sem, 3))
          kernel.run()
          print(f"{label:24} 3 threads x 3 increments = {shared['n']}")
    output: |
      mutex (value 1)          3 threads x 3 increments = 9
      no protection (value 3)  3 threads x 3 increments = 3
    lines:
      - line: 9
        note: "A positive count means a unit is free: take it and carry on."
      - line: 12
        note: "Otherwise the caller goes to sleep on the queue. In a real OS it is marked waiting (Lesson 10.2)."
      - line: 16
        note: "Signal hands the unit straight to the first sleeper (FIFO), which guarantees bounded waiting."
      - line: 55
        note: "The critical section is the read, the step and the write. The step is exactly where the race of Lesson 10.4 could occur."
      - line: 62
        note: "A semaphore with value 3 lets all three threads in at once, so it protects nothing and updates are lost."
  - title: Producer and consumer with a bounded buffer
    intro: "Three semaphores: empty slots, filled slots, and a mutex for the buffer. The buffer never exceeds its capacity."
    code: |
      from collections import deque


      class Semaphore:
          def __init__(self, value):
              self.value, self.queue = value, deque()

          def wait(self, t):
              if self.value > 0:
                  self.value -= 1
                  return True
              self.queue.append(t)
              return False

          def signal(self):
              if self.queue:
                  return self.queue.popleft()
              self.value += 1
              return None


      def run(threads):
          ready, blocked = deque(threads), 0
          while ready:
              t = ready.popleft()
              try:
                  op, sem = next(t)
              except StopIteration:
                  continue
              if op == "step":
                  ready.append(t)
              elif op == "wait":
                  if sem.wait(t):
                      ready.append(t)
                  else:
                      blocked += 1
              else:
                  woken = sem.signal()
                  if woken is not None:
                      blocked -= 1
                      ready.append(woken)
                  ready.append(t)
          return blocked


      def producer(count, buf, empty, full, mutex, log):
          for i in range(count):
              yield ("wait", empty)
              yield ("wait", mutex)
              buf.append(i)
              log.append(f"put {i} (buffer holds {len(buf)})")
              yield ("signal", mutex)
              yield ("signal", full)


      def consumer(count, buf, empty, full, mutex, log):
          for _ in range(count):
              for _ in range(4):
                  yield ("step", None)     # the consumer is slow
              yield ("wait", full)
              yield ("wait", mutex)
              item = buf.pop(0)
              log.append(f"got {item} (buffer holds {len(buf)})")
              yield ("signal", mutex)
              yield ("signal", empty)


      buf, log = [], []
      empty, full, mutex = Semaphore(2), Semaphore(0), Semaphore(1)
      stuck = run([producer(5, buf, empty, full, mutex, log), consumer(5, buf, empty, full, mutex, log)])
      print("\n".join(log))
      print("threads stuck:", stuck)
    output: |
      put 0 (buffer holds 1)
      put 1 (buffer holds 2)
      got 0 (buffer holds 1)
      put 2 (buffer holds 2)
      got 1 (buffer holds 1)
      put 3 (buffer holds 2)
      got 2 (buffer holds 1)
      put 4 (buffer holds 2)
      got 3 (buffer holds 1)
      got 4 (buffer holds 0)
      threads stuck: 0
    lines:
      - line: 51
        note: "Wait for a free slot first, then for the mutex. Reversing these two lines would risk deadlock."
      - line: 54
        note: "The buffer has capacity 2, so it never holds more than 2 items, even though the producer wants to make 5."
      - line: 66
        note: "Consumers mirror the producers: wait for a filled slot, take the mutex, remove, and free a slot."
      - line: 73
        note: "0 means everything finished: no thread is left asleep."
  - title: A deadlock from the wrong order
    intro: "The consumer takes the mutex first and then waits for an item. The producer can never get the mutex to supply one."
    code: |
      from collections import deque


      class Semaphore:
          def __init__(self, value):
              self.value, self.queue = value, deque()

          def wait(self, t):
              if self.value > 0:
                  self.value -= 1
                  return True
              self.queue.append(t)
              return False

          def signal(self):
              if self.queue:
                  return self.queue.popleft()
              self.value += 1
              return None


      def run(threads):
          ready, blocked = deque(threads), 0
          while ready:
              t = ready.popleft()
              try:
                  op, sem = next(t)
              except StopIteration:
                  continue
              if op == "wait":
                  if sem.wait(t):
                      ready.append(t)
                  else:
                      blocked += 1
              else:
                  woken = sem.signal()
                  if woken is not None:
                      blocked -= 1
                      ready.append(woken)
                  ready.append(t)
          return blocked


      def bad_consumer(buf, full, mutex):
          yield ("wait", mutex)       # grabs the lock first...
          yield ("wait", full)        # ...then sleeps until an item exists
          buf.pop()
          yield ("signal", mutex)


      def producer(buf, full, mutex):
          yield ("wait", mutex)       # can never get the lock
          buf.append("item")
          yield ("signal", mutex)
          yield ("signal", full)


      buf, full, mutex = [], Semaphore(0), Semaphore(1)
      print("threads stuck forever:", run([bad_consumer(buf, full, mutex), producer(buf, full, mutex)]))
    output: |
      threads stuck forever: 2
    lines:
      - line: 46
        note: "The consumer holds the mutex while it sleeps. Whoever could wake it needs that very mutex."
      - line: 53
        note: "Neither thread can proceed: each waits for something only the other could provide. That is deadlock."
  - title: Locks in real Python
    intro: "The same ideas with the real threading module. Not run here, because the browser cannot start threads."
    runnable: false
    code: |
      import threading, queue

      lock = threading.Lock()
      total = 0

      def add(n):
          global total
          for _ in range(100_000):
              with lock:            # acquire, then always release
                  total += n

      threads = [threading.Thread(target=add, args=(1,)) for _ in range(4)]
      for t in threads: t.start()
      for t in threads: t.join()
      print(total)                  # always 400000

      # A thread-safe bounded buffer: Queue already does the semaphore work for you
      q = queue.Queue(maxsize=2)
      def produce():
          for i in range(5):
              q.put(i)              # blocks when full
      def consume():
          for _ in range(5):
              print(q.get())        # blocks when empty
      p, c = threading.Thread(target=produce), threading.Thread(target=consume)
      p.start(); c.start(); p.join(); c.join()
    lines:
      - line: 9
        note: "with lock: acquires on entry and releases on exit, even if the body raises an exception."
      - line: 20
        note: "queue.Queue is the producer-consumer pattern packaged: two semaphores and a mutex inside."

playground:
