  - type: code
    question: |
      Write `lock_order(locks)` that returns the given lock names sorted into the single global order to acquire them in (alphabetical, ignoring duplicates).
    starter: |
      def lock_order(locks):
          pass
    tests:
      - name: order
        code: |
          assert lock_order(["B", "A", "C", "A"]) == ["A", "B", "C"]
          assert lock_order([]) == []
          assert lock_order(["x"]) == ["x"]
    solution: |
      def lock_order(locks):
          return sorted(set(locks))
