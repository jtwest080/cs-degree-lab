title: Mini Kernel
brief: |
  You are building the heart of a toy **operating system**: the part that decides which job runs next, which memory page to throw out, and whether the system has frozen. It reads a **workload** from `jobs.txt` (created for you each time you run) and prints a report. Blank lines and lines starting with `#` are ignored. The lines are:

  - `job NAME ARRIVAL BURST`: a process that arrives at a time and needs that many time units of CPU.
  - `schedule fcfs` or `schedule rr QUANTUM`: run all the jobs defined so far under that policy and report.
  - `pages FRAMES REF REF ...`: a reference string of page numbers and the number of memory frames.
  - `wait P Q`: process `P` is waiting for something held by `Q` (each process waits for at most one other; a later line for the same `P` replaces the earlier one).
  - `deadlock`: report whether the waits so far contain a cycle.

  **Exact requirements** (the tests check each function on its own, including random cases):

  - `fcfs(jobs)`: `jobs` is a list of `(name, arrival, burst)`. Return `{name: finish_time}` running jobs to completion in arrival order (ties in input order). The CPU idles if nothing has arrived. (Lesson 10.3)
  - `round_robin(jobs, quantum)`: return `{name: finish_time}`. A job runs for at most `quantum` units, then goes to the back of the queue. **Jobs that arrive during a slice join the queue before the job that was just preempted.** If the queue is empty the CPU idles until the next arrival. (Lesson 10.3)
  - `averages(jobs, finish)`: return `(average turnaround, average waiting)`, each rounded to 2 places, where turnaround is finish minus arrival and waiting is turnaround minus burst. `(0.0, 0.0)` for no jobs.
  - `page_faults(refs, frames, policy)`: count the faults for `"fifo"`, `"lru"` or `"opt"` (Lesson 10.8). `opt` evicts the page whose next use is furthest away; a page never used again is furthest of all, and ties evict the smaller page number. Raise `ValueError` for any other policy.
  - `find_deadlock(waits)`: `waits` maps a process to the one it waits for. Return the **sorted list of processes that lie on a cycle**. A process that merely waits for a cycle member is not deadlocked by this definition. (Lesson 10.6)
  - `process(text)` carries out the commands and returns the output lines, in the wording shown below. `main()` prints each line for `jobs.txt`:

  ```text
  Schedule fcfs: finish A=5, B=8, C=9, D=11; turnaround 6.75, waiting 4.00
  Schedule rr 2: finish A=11, B=10, C=5, D=9; turnaround 7.25, waiting 4.50
  Schedule rr 10: finish A=5, B=8, C=9, D=11; turnaround 6.75, waiting 4.00
  Pages (3 frames, 13 refs): fifo 10, lru 9, opt 7
  Pages (3 frames, 12 refs): fifo 9, lru 10, opt 7
  Pages (4 frames, 12 refs): fifo 10, lru 8, opt 6
  No deadlock
  Deadlock: P1, P2, P3
  ```

  The last line of the program calls `main()`. Turnaround and waiting use two decimals, and the `deadlock` line lists the cycle members in order.
prelude: |
  # Creates jobs.txt fresh before every run.
  with open("jobs.txt", "w") as _f:
      _f.write("# The workload\njob A 0 5\njob B 1 3\njob C 2 1\njob D 3 2\n\nschedule fcfs\nschedule rr 2\nschedule rr 10\n\npages 3 7 0 1 2 0 3 0 4 2 3 0 3 2\npages 3 1 2 3 4 1 2 5 1 2 3 4 5\npages 4 1 2 3 4 1 2 5 1 2 3 4 5\n\nwait P1 P2\nwait P2 P3\ndeadlock\nwait P3 P1\nwait P4 P1\ndeadlock\n")
  del _f
steps:
- title: Finish times
  body: '`fcfs` is a loop over the jobs sorted by arrival: `clock = max(clock, arrival) + burst` and record `clock`. Python''s sort is stable, so ties keep input order.'
- title: Round robin
  body: 'Keep a `deque` of waiting names, a dictionary of remaining time, and an index into the jobs sorted by arrival. Each turn: admit every job with arrival <= clock; if the queue is empty jump the clock to the next arrival; otherwise pop a job, run it for `min(quantum, left)`, advance the clock, **admit new arrivals again**, and only then put the job back if it still has time left. That order is the whole trick.'
- title: Averages
  body: For each job turnaround = `finish[name] - arrival` and waiting = turnaround - burst. Divide by the number of jobs and `round(..., 2)`. Guard the empty list.
- title: Page faults
  body: Keep a list `memory` of resident pages. A hit for LRU moves the page to the end; FIFO ignores hits. On a fault with a full memory evict `memory[0]` for FIFO and LRU, since both keep the victim at the front. For `opt` look ahead in `refs` for each resident page's next use (`inf` if none) and evict the largest, trying the smaller page number first on ties (`max` returns the first maximum, so iterate in sorted order).
- title: Deadlock
  body: Each process waits for at most one other, so from any start just follow `waits` until you reach a process with no entry (no cycle) or one you have already visited. If you revisit a process, everything from its first visit to the end of your trail is on a cycle. Collect those into a set over all starts.
- title: Commands and output
  body: Go through the lines in order, keeping `jobs` and `waits` as you go. Format the numbers with `:.2f`. A `schedule` line lists the finish times in the order the jobs were defined.
