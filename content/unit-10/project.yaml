  # Unit 10 project: Mini Kernel
  from collections import deque


  def fcfs(jobs):
      """Finish times {name: time} when jobs run to completion in arrival order (ties by input order)."""
      return {}


  def round_robin(jobs, quantum):
      """Finish times {name: time} under round robin. Jobs arriving during a slice join the queue
      before the preempted job. If the queue is empty the CPU idles until the next arrival."""
      return {}


  def averages(jobs, finish):
      """(average turnaround, average waiting), each rounded to 2 places. (0.0, 0.0) for no jobs."""
      return 0.0, 0.0


  def page_faults(refs, frames, policy):
      """Count page faults for 'fifo', 'lru' or 'opt'. opt evicts the page used furthest in
      the future (never used again counts as furthest; ties evict the smaller page number).
      Raise ValueError for any other policy."""
      return 0


  def find_deadlock(waits):
      """waits maps a process to the one process it is waiting for. Return the sorted list of
      processes that lie on a cycle (empty if none)."""
      return []


  def process(text):
      """Carry out every command in text and return the output lines."""
      return []


  def main():
      with open("jobs.txt") as f:
          for line in process(f.read()):
              print(line)


  main()
tests:
- name: fcfs runs jobs in arrival order
  code: |
    assert fcfs([("A", 0, 5), ("B", 1, 3), ("C", 2, 1), ("D", 3, 2)]) == {"A": 5, "B": 8, "C": 9, "D": 11}
    # the CPU idles when nothing has arrived
    assert fcfs([("X", 10, 2), ("Y", 0, 3)]) == {"Y": 3, "X": 12}
    assert fcfs([]) == {}
- name: round_robin matches the worked example
  code: |
    jobs = [("A", 0, 5), ("B", 1, 3), ("C", 2, 1), ("D", 3, 2)]
    assert round_robin(jobs, 2) == {"A": 11, "B": 10, "C": 5, "D": 9}
    assert round_robin(jobs, 100) == fcfs(jobs)
- name: round_robin handles idle gaps
  code: |
    assert round_robin([("A", 0, 1), ("B", 10, 3)], 2) == {"A": 1, "B": 13}
    assert round_robin([("A", 5, 4)], 3) == {"A": 9}
    assert round_robin([], 2) == {}
- name: round_robin matches a tick-by-tick simulation
  code: |
    import random
    def reference(jobs, q):
        left = {n: b for n, a, b in jobs}
        arrive = {}
        for n, a, b in jobs:
            arrive.setdefault(a, []).append(n)
        queue, finish, current, used = [], {}, None, 0
        t = 0
        queue.extend(arrive.get(0, []))
        while len(finish) < len(jobs):
            if current is None and queue:
                current, used = queue.pop(0), 0
            if current is not None:
                left[current] -= 1
                used += 1
            t += 1
            queue.extend(arrive.get(t, []))
            if current is not None:
                if left[current] == 0:
                    finish[current] = t
                    current = None
                elif used == q:
                    queue.append(current)
                    current = None
        return finish
    rng = random.Random(10)
    for _ in range(150):
        n = rng.randint(1, 6)
        jobs = [(chr(65 + i), rng.randint(0, 12), rng.randint(1, 7)) for i in range(n)]
        q = rng.randint(1, 5)
        assert round_robin(jobs, q) == reference(jobs, q), (jobs, q)
- name: averages computes turnaround and waiting
  code: |
    jobs = [("A", 0, 5), ("B", 1, 3), ("C", 2, 1), ("D", 3, 2)]
    assert averages(jobs, {"A": 5, "B": 8, "C": 9, "D": 11}) == (6.75, 4.0)
    assert averages(jobs, {"A": 11, "B": 10, "C": 5, "D": 9}) == (7.25, 4.5)
    assert averages([("A", 0, 3)], {"A": 3}) == (3.0, 0.0)
    assert averages([], {}) == (0.0, 0.0)
    assert averages([("A", 0, 1), ("B", 0, 1), ("C", 0, 1)], {"A": 1, "B": 2, "C": 3}) == (2.0, 1.0)
- name: page_faults counts the textbook example
  code: |
    refs = [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2]
    assert page_faults(refs, 3, "fifo") == 10
    assert page_faults(refs, 3, "lru") == 9
    assert page_faults(refs, 3, "opt") == 7
    assert page_faults([], 3, "lru") == 0
    assert page_faults([1, 1, 1], 1, "fifo") == 1
    assert page_faults([1, 2, 1, 2], 1, "lru") == 4
- name: page_faults shows Belady's anomaly
  code: |
    refs = [1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5]
    assert page_faults(refs, 3, "fifo") == 9
    assert page_faults(refs, 4, "fifo") == 10
    assert page_faults(refs, 3, "lru") == 10 and page_faults(refs, 4, "lru") == 8
- name: page_faults rejects unknown policies
  code: |
    try:
        page_faults([1], 1, "random")
        assert False, "expected ValueError"
    except ValueError:
        pass
- name: opt never loses to fifo or lru
  code: |
    import random
    rng = random.Random(3)
    for _ in range(200):
        refs = [rng.randint(0, 6) for _ in range(rng.randint(0, 25))]
        frames = rng.randint(1, 5)
        o = page_faults(refs, frames, "opt")
        assert o <= page_faults(refs, frames, "fifo") and o <= page_faults(refs, frames, "lru")
        assert o >= len(set(refs)) if frames >= len(set(refs)) else True
- name: find_deadlock finds cycles
  code: |
    assert find_deadlock({}) == []
    assert find_deadlock({"P1": "P2", "P2": "P3"}) == []
    assert find_deadlock({"P1": "P2", "P2": "P3", "P3": "P1"}) == ["P1", "P2", "P3"]
    # P4 waits on the cycle but is not part of it
    assert find_deadlock({"P1": "P2", "P2": "P3", "P3": "P1", "P4": "P1"}) == ["P1", "P2", "P3"]
    assert find_deadlock({"A": "A"}) == ["A"]
    assert find_deadlock({"A": "B", "B": "A", "C": "D", "D": "E", "E": "D"}) == ["A", "B", "D", "E"]
- name: find_deadlock agrees with a brute-force check
  code: |
    import random
    rng = random.Random(8)
    for _ in range(200):
        names = [f"P{i}" for i in range(rng.randint(1, 9))]
        waits = {n: rng.choice(names) for n in names if rng.random() < 0.75}
        expected = []
        for n in names:
            node = waits.get(n)
            for _step in range(len(names) + 1):
                if node is None:
                    break
                if node == n:
                    expected.append(n)
                    break
                node = waits.get(node)
        assert find_deadlock(waits) == sorted(expected), waits
