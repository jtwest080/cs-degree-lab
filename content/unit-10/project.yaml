    lines = output.strip().splitlines()
    expected = 'Schedule fcfs: finish A=5, B=8, C=9, D=11; turnaround 6.75, waiting 4.00\nSchedule rr 2: finish A=11, B=10, C=5, D=9; turnaround 7.25, waiting 4.50\nSchedule rr 10: finish A=5, B=8, C=9, D=11; turnaround 6.75, waiting 4.00\nPages (3 frames, 13 refs): fifo 10, lru 9, opt 7\nPages (3 frames, 12 refs): fifo 9, lru 10, opt 7\nPages (4 frames, 12 refs): fifo 10, lru 8, opt 6\nNo deadlock\nDeadlock: P1, P2, P3'.splitlines()
    assert lines == expected, "Output differs. First difference: " + next((f"got {a!r}, expected {b!r}" for a, b in zip(lines, expected) if a != b), f"got {len(lines)} lines, expected {len(expected)}")
solution: |
  # Unit 10 project: Mini Kernel
  from collections import deque


  def fcfs(jobs):
      """Finish times when jobs run to completion in arrival order (ties by input order)."""
      finish = {}
      clock = 0
      for name, arrival, burst in sorted(jobs, key=lambda j: j[1]):
          clock = max(clock, arrival) + burst
          finish[name] = clock
      return finish


  def round_robin(jobs, quantum):
      """Finish times under round robin. Jobs arriving during a slice join the queue
      before the preempted job. If the queue is empty the CPU idles until the next arrival."""
      pending = sorted(jobs, key=lambda j: j[1])
      left = {name: burst for name, arrival, burst in jobs}
      finish = {}
      queue = deque()
      clock = 0
      i = 0
      while len(finish) < len(jobs):
          while i < len(pending) and pending[i][1] <= clock:
              queue.append(pending[i][0])
              i += 1
          if not queue:
              clock = pending[i][1]
              continue
          name = queue.popleft()
          run = min(quantum, left[name])
          clock += run
          left[name] -= run
          while i < len(pending) and pending[i][1] <= clock:
              queue.append(pending[i][0])
              i += 1
          if left[name] == 0:
              finish[name] = clock
          else:
              queue.append(name)
      return finish


  def averages(jobs, finish):
      """(average turnaround, average waiting), each rounded to 2 places."""
      if not jobs:
          return 0.0, 0.0
      turn = [finish[n] - a for n, a, b in jobs]
      wait = [finish[n] - a - b for n, a, b in jobs]
      return round(sum(turn) / len(jobs), 2), round(sum(wait) / len(jobs), 2)


  def page_faults(refs, frames, policy):
      """Count page faults for 'fifo', 'lru' or 'opt'. opt evicts the page used furthest in
      the future (never used again counts as furthest; ties evict the smaller page number)."""
      if policy not in ("fifo", "lru", "opt"):
          raise ValueError(policy)
      memory = []
      faults = 0
      for i, page in enumerate(refs):
          if page in memory:
              if policy == "lru":
                  memory.remove(page)
                  memory.append(page)
              continue
          faults += 1
          if len(memory) == frames:
              if policy == "opt":
                  def next_use(p):
                      for j in range(i + 1, len(refs)):
                          if refs[j] == p:
                              return j
                      return float("inf")
                  victim = max(sorted(memory), key=next_use)
                  memory.remove(victim)
              else:
                  memory.pop(0)
          memory.append(page)
      return faults


  def find_deadlock(waits):
      """waits maps a process to the one process it is waiting for. Return the sorted list of
      processes that lie on a cycle (empty if none)."""
      stuck = set()
      for start in waits:
          seen = []
          node = start
          while node in waits and node not in seen:
              seen.append(node)
              node = waits[node]
          if node in seen:
              stuck.update(seen[seen.index(node):])
      return sorted(stuck)


  def process(text):
      jobs, waits, out = [], {}, []
      for line in text.splitlines():
          parts = line.split()
          if not parts or parts[0].startswith("#"):
              continue
          cmd = parts[0]
          if cmd == "job":
              jobs.append((parts[1], int(parts[2]), int(parts[3])))
          elif cmd == "schedule":
              if parts[1] == "fcfs":
                  finish, label = fcfs(jobs), "fcfs"
              else:
                  finish, label = round_robin(jobs, int(parts[2])), "rr " + parts[2]
              turn, wait = averages(jobs, finish)
              done = ", ".join(f"{n}={finish[n]}" for n, a, b in jobs)
              out.append(f"Schedule {label}: finish {done}; turnaround {turn:.2f}, waiting {wait:.2f}")
          elif cmd == "pages":
              frames = int(parts[1])
              refs = [int(x) for x in parts[2:]]
              counts = ", ".join(f"{p} {page_faults(refs, frames, p)}" for p in ("fifo", "lru", "opt"))
              out.append(f"Pages ({frames} frames, {len(refs)} refs): {counts}")
          elif cmd == "wait":
              waits[parts[1]] = parts[2]
          elif cmd == "deadlock":
              stuck = find_deadlock(waits)
              out.append("Deadlock: " + ", ".join(stuck) if stuck else "No deadlock")
      return out


  def main():
      with open("jobs.txt") as f:
          for line in process(f.read()):
              print(line)


  main()
stretch:
- Add a `schedule srtf` policy (preemptive shortest remaining time first) and compare its averages with round robin.
- Add a `pages` policy `clock` (the second-chance algorithm from Lesson 10.8) and see whether it lands between FIFO and LRU.
- 'Report the context switches for round robin: how many times does the CPU change from one job to a different one as the quantum shrinks?'
- Let a process wait for several others (`wait P Q R`) and detect a deadlock with a depth-first search for a cycle.
- 'Add a `bankers` command: given available resources, allocations and maximum needs, print whether the state is safe (Lesson 10.6).'
