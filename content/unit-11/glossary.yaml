# Terms introduced in Unit 11 (Networking). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Packet"
    definition: "A small chunk of data sent across a network on its own, carrying the address of its destination."
    lesson: u11-layers
  - term: "Packet switching"
    definition: "Sending messages as separate packets that share links, instead of reserving a circuit for each conversation."
    lesson: u11-layers
  - term: "Host"
    definition: "A computer or device connected to a network."
    lesson: u11-layers
  - term: "Router"
    definition: "A device that receives packets and forwards each toward its destination using the IP header."
    lesson: u11-layers
  - term: "Protocol"
    definition: "An agreed set of rules for the format of messages and what to do on receiving them."
    lesson: u11-layers
  - term: "Layered model"
    definition: "Organising protocols in layers, each using the layer below and hiding it from the layer above."
    lesson: u11-layers
  - term: "Link layer"
    definition: "The layer that delivers frames across a single link, such as Ethernet or Wi-Fi."
    lesson: u11-layers
  - term: "Internet layer"
    definition: "The layer that delivers packets between hosts across many networks, using IP addresses."
    lesson: u11-layers
  - term: "Transport layer"
    definition: "The layer that delivers data between programs on hosts, using ports (TCP and UDP)."
    lesson: u11-layers
  - term: "Application layer"
    definition: "The layer of protocols that programs use to talk to each other, such as HTTP and DNS."
    lesson: u11-layers
  - term: "Encapsulation"
    definition: "Wrapping data in a header at each layer on its way down the stack."
    lesson: u11-layers
  - term: "Decapsulation"
    definition: "Removing each layer's header as data moves up the stack at the receiver."
    lesson: u11-layers
  - term: "Header"
    definition: "Control information placed in front of the data by a protocol."
    lesson: u11-layers
  - term: "Network byte order"
    definition: "Big-endian order, with the most significant byte first, used for multi-byte numbers in protocol headers."
    lesson: u11-layers
  - term: "Checksum"
    definition: "A small number computed from data and sent with it, so the receiver can detect accidental damage."
    lesson: u11-layers
  - term: "Bandwidth"
    definition: "The number of bits per second a link can carry."
    lesson: u11-layers
  - term: "Latency"
    definition: "The time for a single bit or message to travel from sender to receiver."
    lesson: u11-layers
  - term: "Round-trip time (RTT)"
    definition: "The time for a message to reach the other end and for the reply to return."
    lesson: u11-layers
  - term: "Store-and-forward"
    definition: "A router receiving a whole packet before sending it on."
    lesson: u11-layers
  - term: "Pipelining"
    definition: "Sending the next packet before earlier ones have been acknowledged or fully delivered, so several links work at once."
    lesson: u11-layers
  - term: "IP address"
    definition: "A number that identifies a network interface; IPv4 addresses have 32 bits."
    lesson: u11-ip
  - term: "Dotted quad"
    definition: "The usual way of writing an IPv4 address as four decimal bytes separated by dots."
    lesson: u11-ip
  - term: "Prefix"
    definition: "The leading bits of an address that name the network."
    lesson: u11-ip
  - term: "CIDR"
    definition: "Classless Inter-Domain Routing: writing a network as an address and a prefix length, such as 192.168.1.0/24."
    lesson: u11-ip
  - term: "Subnet mask"
    definition: "A 32-bit number with ones in the network part and zeros in the host part."
    lesson: u11-ip
  - term: "Network address"
    definition: "The first address of a subnet, with all host bits zero. It names the subnet itself."
    lesson: u11-ip
  - term: "Broadcast address"
    definition: "The last address of a subnet, with all host bits one. Packets sent to it reach every host."
    lesson: u11-ip
  - term: "Subnetting"
    definition: "Dividing a network into smaller networks by lengthening the prefix."
    lesson: u11-ip
  - term: "Default gateway"
    definition: "The router a host uses for destinations outside its own subnet."
    lesson: u11-ip
  - term: "Private address"
    definition: "An address from a range reserved for use inside a network and not routed on the public internet."
    lesson: u11-ip
  - term: "Loopback"
    definition: "The address 127.0.0.1 and its range, which always means this machine."
    lesson: u11-ip
  - term: "NAT"
    definition: "Network address translation: a router rewriting private addresses and ports to its own public address."
    lesson: u11-ip
  - term: "DHCP"
    definition: "A protocol that gives a device an address, mask, gateway and other settings automatically."
    lesson: u11-ip
  - term: "ARP"
    definition: "A protocol that finds the hardware address that goes with an IP address on the local link."
    lesson: u11-ip
  - term: "Forwarding table"
    definition: "A router's list of prefixes and the next hop for each."
    lesson: u11-ip
  - term: "Longest-prefix match"
    definition: "Choosing, among the table entries that contain the destination, the one with the longest prefix."
    lesson: u11-ip
  - term: "IPv6"
    definition: "The newer internet protocol with 128-bit addresses."
    lesson: u11-ip
  - term: "Routing"
    definition: "Building the forwarding tables: working out the best next hop for each destination."
    lesson: u11-routing
  - term: "Forwarding"
    definition: "Moving each packet toward its destination using the forwarding table."
    lesson: u11-routing
  - term: "Link-state routing"
    definition: "Routing in which every router learns the whole network map and runs Dijkstra's algorithm."
    lesson: u11-routing
  - term: "Distance-vector routing"
    definition: "Routing in which each router tells its neighbours its cost to every destination and applies the Bellman-Ford update."
    lesson: u11-routing
  - term: "Next hop"
    definition: "The neighbouring router to which a packet is sent on its way to a destination."
    lesson: u11-routing
  - term: "Convergence"
    definition: "The state in which all routers' tables agree and are correct after a change."
    lesson: u11-routing
  - term: "Counting to infinity"
    definition: "The slow growth of route costs in distance-vector routing after a link fails."
    lesson: u11-routing
  - term: "Split horizon"
    definition: "Not advertising a route back to the neighbour it was learned from."
    lesson: u11-routing
  - term: "TTL (time to live)"
    definition: "A counter in a packet decremented by each router; at zero the packet is dropped."
    lesson: u11-routing
  - term: "Autonomous system (AS)"
    definition: "A network under one administration, with its own AS number."
    lesson: u11-routing
  - term: "BGP"
    definition: "Border Gateway Protocol: the path-vector protocol that exchanges routes between autonomous systems."
    lesson: u11-routing
  - term: "AS path"
    definition: "The list of autonomous systems a BGP route has crossed. Used to prevent loops and to compare routes."
    lesson: u11-routing
  - term: "Port"
    definition: "A 16-bit number that identifies a program endpoint on a host."
    lesson: u11-transport
  - term: "Ephemeral port"
    definition: "A temporary port number chosen by the OS for the client end of a connection."
    lesson: u11-transport
  - term: "Multiplexing"
    definition: "Letting many programs share one network connection by labelling data with ports."
    lesson: u11-transport
  - term: "Demultiplexing"
    definition: "Delivering arriving data to the right program according to its port."
    lesson: u11-transport
  - term: "UDP"
    definition: "A minimal transport protocol: ports and a checksum on top of IP, with no connection, delivery guarantee or order."
    lesson: u11-transport
  - term: "Datagram"
    definition: "A self-contained packet sent without a connection, as in UDP."
    lesson: u11-transport
  - term: "TCP"
    definition: "The transport protocol that provides a reliable, ordered byte stream between two programs."
    lesson: u11-transport
  - term: "Segment"
    definition: "The unit of data in TCP: a header and a piece of the byte stream."
    lesson: u11-transport
  - term: "Sequence number"
    definition: "A number giving the position in the byte stream of a segment's first byte."
    lesson: u11-transport
  - term: "Acknowledgement number"
    definition: "The sequence number of the next byte the receiver expects."
    lesson: u11-transport
  - term: "Three-way handshake"
    definition: "The SYN, SYN+ACK, ACK exchange that opens a TCP connection."
    lesson: u11-transport
  - term: "SYN"
    definition: "The TCP flag that starts a connection and synchronises sequence numbers."
    lesson: u11-transport
  - term: "FIN"
    definition: "The TCP flag that says a side has finished sending."
    lesson: u11-transport
  - term: "MSS"
    definition: "Maximum segment size: the largest amount of data TCP puts in one segment."
    lesson: u11-transport
  - term: "Reassembly"
    definition: "Putting received segments back in order using their sequence numbers."
    lesson: u11-transport
  - term: "TIME_WAIT"
    definition: "The TCP state in which the closing side waits for stray segments to die before closing completely."
    lesson: u11-transport
  - term: "ARQ"
    definition: "Automatic repeat request: retransmitting data that is not acknowledged."
    lesson: u11-reliability
  - term: "Stop-and-wait"
    definition: "A reliable protocol that sends one packet and waits for its acknowledgement before sending the next."
    lesson: u11-reliability
  - term: "Bandwidth-delay product"
    definition: "Bandwidth times round-trip time: the amount of data needed in flight to fill a link."
    lesson: u11-reliability
  - term: "Sliding window"
    definition: "A protocol that lets a sender have several unacknowledged packets in flight."
    lesson: u11-reliability
  - term: "Go-back-N"
    definition: "A sliding-window protocol that resends the whole window from the first lost packet."
    lesson: u11-reliability
  - term: "Selective repeat"
    definition: "A sliding-window protocol that resends only the packets that were lost."
    lesson: u11-reliability
  - term: "Duplicate ACK"
    definition: "A repeated acknowledgement of the same number, signalling that a later segment arrived but an earlier one is missing."
    lesson: u11-reliability
  - term: "Fast retransmit"
    definition: "Resending a segment after three duplicate acknowledgements, without waiting for the timer."
    lesson: u11-reliability
  - term: "Retransmission timeout (RTO)"
    definition: "The time a sender waits for an acknowledgement before resending."
    lesson: u11-reliability
  - term: "Exponential backoff"
    definition: "Doubling the wait after each failure."
    lesson: u11-reliability
  - term: "Flow control"
    definition: "Limiting the sender to the receiver's advertised window so the receiver is not overwhelmed."
    lesson: u11-reliability
  - term: "Congestion control"
    definition: "Adjusting the sending rate to avoid overloading the network."
    lesson: u11-reliability
  - term: "Congestion window (cwnd)"
    definition: "The sender's limit on unacknowledged data, adjusted as it senses congestion."
    lesson: u11-reliability
  - term: "Slow start"
    definition: "The phase in which the congestion window doubles every round trip."
    lesson: u11-reliability
  - term: "AIMD"
    definition: "Additive increase, multiplicative decrease: grow the window by one per round trip and halve it on loss."
    lesson: u11-reliability
  - term: "DNS"
    definition: "The Domain Name System: a distributed database that maps names to addresses and other information."
    lesson: u11-dns
  - term: "Domain name"
    definition: "A hierarchical name made of labels separated by dots, read from right to left."
    lesson: u11-dns
  - term: "Top-level domain (TLD)"
    definition: "The last label of a domain name, such as com or uk."
    lesson: u11-dns
  - term: "Zone"
    definition: "The part of the DNS name space managed by one party."
    lesson: u11-dns
  - term: "Root server"
    definition: "One of the servers at the top of the DNS hierarchy that know who runs each top-level domain."
    lesson: u11-dns
  - term: "Authoritative server"
    definition: "A DNS server that holds the actual records for a zone."
    lesson: u11-dns
  - term: "Recursive resolver"
    definition: "A DNS server that looks up answers on behalf of clients by following referrals."
    lesson: u11-dns
  - term: "Delegation"
    definition: "A record that hands responsibility for a part of the name space to another server."
    lesson: u11-dns
  - term: "Resource record"
    definition: "One entry in DNS with a name, type, TTL and value."
    lesson: u11-dns
  - term: "CNAME"
    definition: "A DNS record that makes one name an alias for another."
    lesson: u11-dns
  - term: "MX record"
    definition: "A DNS record naming the mail servers of a domain, with preference numbers."
    lesson: u11-dns
  - term: "NXDOMAIN"
    definition: "The DNS answer saying that a name does not exist."
    lesson: u11-dns
  - term: "DNS cache poisoning"
    definition: "Getting a resolver to accept and store a forged answer."
    lesson: u11-dns
  - term: "DNSSEC"
    definition: "Digital signatures on DNS records that let resolvers verify answers."
    lesson: u11-dns
  - term: "URL"
    definition: "A string naming a resource and how to fetch it: scheme, host, port, path, query and fragment."
    lesson: u11-http
  - term: "Percent-encoding"
    definition: "Writing an unsafe byte in a URL as a percent sign followed by two hex digits."
    lesson: u11-http
  - term: "HTTP"
    definition: "The HyperText Transfer Protocol: the request-and-response protocol of the web."
    lesson: u11-http
  - term: "HTTP method"
    definition: "The verb of a request, such as GET, POST, PUT or DELETE."
    lesson: u11-http
  - term: "Status code"
    definition: "A three-digit number in a response saying how the request went."
    lesson: u11-http
  - term: "Safe method"
    definition: "An HTTP method that does not change anything on the server, such as GET."
    lesson: u11-http
  - term: "Cookie"
    definition: "A small piece of data a server asks the browser to store and send back, used to keep sessions."
    lesson: u11-http
  - term: "ETag"
    definition: "A fingerprint of a resource's content, used to check whether a cached copy is still current."
    lesson: u11-http
  - term: "Conditional request"
    definition: "A request that asks the server to respond in full only if something has changed."
    lesson: u11-http
  - term: "REST"
    definition: "A style of web API in which resources have URLs and standard methods act on them."
    lesson: u11-http
  - term: "JSON"
    definition: "JavaScript Object Notation: a text format for objects, arrays, strings, numbers and booleans."
    lesson: u11-http
  - term: "HTTP/2"
    definition: "A version of HTTP that multiplexes many requests as binary streams on one connection."
    lesson: u11-http
  - term: "HTTP/3"
    definition: "A version of HTTP carried over QUIC and UDP."
    lesson: u11-http
  - term: "Socket"
    definition: "The operating system's handle for one end of a network connection."
    lesson: u11-sockets
  - term: "Listening socket"
    definition: "A server socket that accepts incoming connections."
    lesson: u11-sockets
  - term: "Backlog"
    definition: "The queue of connections that have completed the handshake and wait to be accepted."
    lesson: u11-sockets
  - term: "Byte stream"
    definition: "Data delivered in order with no message boundaries, as in TCP."
    lesson: u11-sockets
  - term: "Framing"
    definition: "Marking where messages begin and end in a byte stream, for example with a delimiter or length prefix."
    lesson: u11-sockets
  - term: "Length prefix"
    definition: "A number at the start of a message giving its size."
    lesson: u11-sockets
  - term: "Event loop"
    definition: "A loop that waits for sockets to become ready and handles each briefly, without blocking."
    lesson: u11-sockets
  - term: "Non-blocking I/O"
    definition: "Network calls that return at once instead of waiting for data."
    lesson: u11-sockets
  - term: "Timeout"
    definition: "A limit on how long to wait for a network operation before giving up."
    lesson: u11-sockets
  - term: "Rate limiting"
    definition: "Restricting how many requests a client may make in a period of time."
    lesson: u11-sockets
  - term: "Token bucket"
    definition: "A rate limiter in which tokens refill at a steady rate and each request consumes one, allowing short bursts."
    lesson: u11-sockets
  - term: "Man-in-the-middle attack"
    definition: "An attack in which someone sits between two parties, relaying and possibly altering their messages."
    lesson: u11-network-security
  - term: "Replay attack"
    definition: "Re-sending a valid captured message later."
    lesson: u11-network-security
  - term: "Nonce"
    definition: "A number used once, included in a message to prevent replay."
    lesson: u11-network-security
  - term: "Hash function"
    definition: "A function that turns data into a fixed-size fingerprint, one-way and extremely sensitive to change."
    lesson: u11-network-security
  - term: "Symmetric encryption"
    definition: "Encryption in which the same secret key locks and unlocks the data."
    lesson: u11-network-security
  - term: "Public-key cryptography"
    definition: "Cryptography with a public key anyone may use and a matching private key held by its owner."
    lesson: u11-network-security
  - term: "Digital signature"
    definition: "A value made with a private key that anyone can verify with the public key, proving who produced a message."
    lesson: u11-network-security
  - term: "HMAC"
    definition: "A message authentication code made by hashing a message together with a secret key."
    lesson: u11-network-security
  - term: "Diffie-Hellman"
    definition: "A method for two parties to agree on a shared secret over a public channel."
    lesson: u11-network-security
  - term: "Discrete logarithm"
    definition: "Finding x from g to the power x modulo p. It is believed to be hard for large primes."
    lesson: u11-network-security
  - term: "TLS"
    definition: "Transport Layer Security: the protocol that encrypts and authenticates connections, as in HTTPS."
    lesson: u11-network-security
  - term: "Certificate"
    definition: "A signed document binding a public key to a name."
    lesson: u11-network-security
  - term: "Certificate authority (CA)"
    definition: "An organisation trusted to sign certificates."
    lesson: u11-network-security
  - term: "Chain of trust"
    definition: "The sequence of certificates from a site's certificate through intermediates to a trusted root."
    lesson: u11-network-security
  - term: "Firewall"
    definition: "A device or software that allows or blocks traffic according to rules."
    lesson: u11-network-security
  - term: "Stateful firewall"
    definition: "A firewall that remembers connections so replies to outgoing traffic are allowed back in."
    lesson: u11-network-security
  - term: "VPN"
    definition: "A virtual private network: an encrypted tunnel between a device and a gateway."
    lesson: u11-network-security
  - term: "Port scan"
    definition: "Probing many ports on a host to find out which services are running."
    lesson: u11-network-security
  - term: "Defence in depth"
    definition: "Using several layers of protection so that one failure does not give an attacker everything."
    lesson: u11-network-security
