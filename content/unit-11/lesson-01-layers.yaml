id: u11-layers
title: "How the Internet Is Layered"
minutes: 55
objective: |
  Understand how a message gets from one program to another across the world: the idea of layered protocols, how each layer wraps data in its own header, how bytes are laid out in a header, how a checksum catches damage, and why delay has two separate parts, latency and bandwidth.
outcomes:
  - Describe packet switching and why the internet breaks messages into packets
  - Name the four layers of the internet model and say what each is responsible for
  - Explain encapsulation and decapsulation, and build and parse a header with `struct`
  - Compute an internet checksum and say which errors it can and cannot catch
  - Calculate transfer time from bandwidth and latency, including store-and-forward delay

sections:
  - heading: Networks and packets
    body: |
      A **network** is computers (called **hosts**) connected by links and by **routers** that pass traffic along. The internet is a network of networks: your home network, your internet provider's network, a company's network, all connected together.

      Old telephone networks used **circuit switching**: a call reserved a dedicated path for its whole length, even during silences. The internet uses **packet switching** instead. A message is cut into **packets** of at most a few thousand bytes. Each packet is sent separately, carrying the address of its destination, and each router along the way decides where to send it next. Packets from many conversations share the same links, so the links stay busy and nobody needs to reserve anything. The price is that packets can be **delayed, reordered, duplicated or lost**, and something else must cope with that. Most of this unit is about who does that and how.

      To make the whole thing manageable, networking is built from **protocols**: agreed rules about the format of messages and what to do when you receive one. A web browser and a web server can talk because both follow HTTP. Your laptop and your router can talk because both follow Wi-Fi's rules. Nobody needs to understand the whole system, only the protocols at their own level.

  - heading: The layers
    body: |
      Protocols are organised in **layers**. Each layer uses the services of the layer below and offers a simpler service to the layer above, hiding everything underneath. The internet model has four:

      | Layer | Job | Examples | Unit of data |
      |---|---|---|---|
      | **Application** | what the programs say to each other | HTTP, DNS, SMTP (email), TLS | message |
      | **Transport** | delivery between *programs*, with ports; optionally reliable and ordered | TCP, UDP | segment / datagram |
      | **Internet** | delivery between *hosts* across many networks, using IP addresses and routing | IP | packet |
      | **Link** | delivery across *one* link, using hardware addresses | Ethernet, Wi-Fi | frame |

      A famous seven-layer teaching model called **OSI** splits these differently (it separates physical signals, sessions and presentation), and you will meet its numbers in job descriptions ("layer 2 switch", "layer 7 load balancer"). Layer 2 is the link layer, layer 3 the network (internet) layer, layer 4 the transport layer and layer 7 the application layer.

      The point of layering is **separation of concerns**: the web does not care whether you are on Wi-Fi or a cable, and Wi-Fi does not care what the bytes mean. You can replace one layer, say moving from IPv4 to IPv6 or from Ethernet to 5G, without rewriting the others. The one narrow waist everything depends on is **IP**: every network speaks it.

  - heading: Encapsulation
    body: |
      When an application sends data, each layer on the way down **wraps** it by adding a **header** (and sometimes a trailer) in front. This is **encapsulation**:

      1. The application produces a message, for example an HTTP request.
      2. TCP adds a header (source port, destination port, sequence number, ...) making a **segment**.
      3. IP adds a header (source address, destination address, time to live, ...) making a **packet**.
      4. Ethernet or Wi-Fi adds a header and trailer making a **frame**, and the hardware sends the bits.

      At the receiver the process is reversed, **decapsulation**: the link layer checks the frame and strips its header, IP reads its header and strips it, TCP does the same, and finally the message reaches the application. A router in the middle only looks at the **link and IP headers**: it strips the old frame, picks the next hop using the destination address, and wraps the packet in a new frame for the next link. It never needs to understand the TCP or HTTP inside. Each layer talks to the *same layer* at the other end (TCP to TCP) while physically using the layer below.

      This nesting is the same pattern as a function call stack or an envelope inside an envelope, and as the nested brackets you will parse in this lesson's first exercise.

  - heading: Headers are bytes
    body: |
      A header is not text; it is a precise layout of **bytes** and even single **bits**, so that every computer reads it identically. Network protocols use **big-endian** order for multi-byte numbers (the most significant byte first), called **network byte order**, which is why Lesson 9.8's endianness matters here.

      Python's `struct` module packs and unpacks these layouts. A format string describes the fields: `>` means big-endian, `B` is one unsigned byte, `H` an unsigned 16-bit integer, `I` an unsigned 32-bit integer.

      ```python
      import struct
      header = struct.pack(">HHH", 80, 50000, 12)   # 6 bytes
      src, dst, length = struct.unpack(">HHH", header)
      ```

      Often several fields share a byte. You extract them with the shifts and masks from Lesson 9.8: the IPv4 header's first byte holds the version (the top 4 bits, always 4) and the header length (the bottom 4 bits). `byte >> 4` and `byte & 0x0F` pull them out. When you read a hex dump of a real packet, this is what you are doing.

      A header also needs a **length** field or a fixed size, so the receiver knows where the header ends and the payload begins. Protocols that forget this are hard to extend.

  - heading: Detecting damage with a checksum
    body: |
      Bits get flipped by noise, so protocols include a **checksum**: a small number computed from the data, sent along with it. The receiver recomputes it and discards the packet on a mismatch. The **internet checksum** (used by IP, TCP and UDP) is simple:

      1. Treat the data as a sequence of 16-bit big-endian words (pad an odd final byte with a zero byte).
      2. Add them all up as ordinary integers.
      3. While the sum is larger than 16 bits, **fold** the carry back in: `(sum & 0xFFFF) + (sum >> 16)`.
      4. The checksum is the **bitwise NOT** (one's complement) of the result, in 16 bits.

      The receiver adds up all the words *including* the checksum, folds, and expects all ones (`0xFFFF`). It is cheap to compute, and it catches every single-bit error and most bursts. But it is weak: it cannot see two 16-bit words **swapped**, because addition ignores order, and a determined attacker can easily make a corrupted packet pass. Stronger checks (the CRC in Ethernet frames, cryptographic hashes) exist at other layers, and the checksum is a reminder that **each layer checks only what it needs to**.

  - heading: Delay, latency and bandwidth
    body: |
      People say "fast internet" for two different things:

      - **Bandwidth** (or throughput) is how many bits per second a link can carry, like the width of a pipe. Units are bits per second: kbps, Mbps, Gbps. Note the **bits**: a file size is in bytes, so a 100 MB file is 800 megabits.
      - **Latency** is how long a single bit takes to get from one end to the other, like the length of the pipe. It is limited by the speed of light in cable (about 200,000 km/s, so roughly 5 ms per 1000 km), plus processing.

      The time to deliver a message is roughly **latency + size / bandwidth**. Which term dominates depends on the size: for a tiny message latency is everything, so a 1 Gbps link does not make a chat message to Australia arrive sooner; for a huge file bandwidth is everything. A protocol that needs many **round trips** (a request and a reply) pays the latency every time, which is why much protocol design aims to reduce round trips.

      A router must receive a whole packet before forwarding it (**store-and-forward**). So the delay of a packet over a path adds, for **each link**, its **transmission delay** (packet bits divided by link rate) and its **propagation delay** (the latency of that link). With several packets, the links work like an assembly line (**pipelining**): the first packet takes the whole path delay, and each later one follows one *slowest-link transmission time* behind it. That is why splitting a big message into packets makes it arrive sooner than sending it as one huge block.

examples:
  - title: Encapsulation as nesting
    intro: "Each layer wraps what the layer above produced. Unwrapping goes in the reverse order."
    code: |
      def wrap(payload, layers):
          for layer in layers:                  # the first layer applied ends up innermost
              payload = f"{layer}[{payload}]"
          return payload


      message = "GET /index.html"
      packet = wrap(message, ["TCP", "IP", "ETH"])
      print(packet)

      # A router only needs to look at the outside.
      outer = packet.split("[", 1)[0]
      print("the link layer sees a", outer, "frame")
      inside = packet[len(outer) + 1:-1]
      print("after stripping it:", inside)
    output: |
      ETH[IP[TCP[GET /index.html]]]
      the link layer sees a ETH frame
      after stripping it: IP[TCP[GET /index.html]]
    lines:
      - line: 3
        note: "Each trip around the loop adds one more header around everything so far."
      - line: 8
        note: "TCP was applied first, so it ends up innermost. The link layer, applied last, is outermost."
      - line: 13
        note: "Stripping the outermost layer is one slice. Decapsulation is the same step repeated."
  - title: Packing a header with struct
    intro: "Fixed-size fields in network byte order, then unpacked again. The hex dump is how engineers read real packets."
    code: |
      import struct

      # a toy header: source port, destination port, length (each 16-bit, big-endian)
      header = struct.pack(">HHH", 49152, 80, 20)
      print("bytes:", header.hex(" "))
      print("length:", len(header))

      src, dst, length = struct.unpack(">HHH", header)
      print("decoded:", src, dst, length)

      # two small fields sharing one byte, like an IPv4 version and header length
      version, ihl = 4, 5
      first = (version << 4) | ihl
      print(f"packed byte: {first:#04x}  ->  version {first >> 4}, length {first & 0x0F}")

      # the same 16-bit number in the two byte orders
      print("big-endian   :", (80).to_bytes(2, "big").hex(" "))
      print("little-endian:", (80).to_bytes(2, "little").hex(" "))
    output: |
      bytes: c0 00 00 50 00 14
      length: 6
      decoded: 49152 80 20
      packed byte: 0x45  ->  version 4, length 5
      big-endian   : 00 50
      little-endian: 50 00
    lines:
      - line: 4
        note: "`>HHH` means big-endian, three unsigned 16-bit integers, so six bytes in all."
      - line: 12
        note: "Shift one field into the top four bits and put the other in the bottom four."
      - line: 17
        note: "Network byte order puts the most significant byte first. A mismatch here is a classic bug."
  - title: The internet checksum
    intro: "Add 16-bit words, fold the carries, invert. One flipped bit changes the answer; swapped words do not."
    code: |
      def internet_checksum(data):
          if len(data) % 2:
              data += b"\x00"
          total = 0
          for i in range(0, len(data), 2):
              total += (data[i] << 8) | data[i + 1]
          while total > 0xFFFF:
              total = (total & 0xFFFF) + (total >> 16)
          return ~total & 0xFFFF


      data = bytes([0x00, 0x01, 0xF2, 0x03, 0xF4, 0xF5, 0xF6, 0xF7])
      print(f"checksum of the sample: {internet_checksum(data):#06x}")

      damaged = bytearray(data)
      damaged[3] ^= 0x01                       # flip one bit
      print(f"after one flipped bit : {internet_checksum(bytes(damaged)):#06x}")

      swapped = data[2:4] + data[0:2] + data[4:]   # swap the first two 16-bit words
      print(f"after swapping words  : {internet_checksum(swapped):#06x}")
      print("odd length:", f"{internet_checksum(b'abc'):#06x}", "| empty:", f"{internet_checksum(b''):#06x}")
    output: |
      checksum of the sample: 0x220d
      after one flipped bit : 0x220e
      after swapping words  : 0x220d
      odd length: 0x3b9d | empty: 0xffff
    lines:
      - line: 3
        note: "An odd final byte is padded with a zero byte so the last word is complete."
      - line: 7
        note: "Fold the carry out of the top back into the bottom (end-around carry)."
      - line: 9
        note: "Invert and mask to 16 bits. The receiver adding everything, checksum included, expects 0xFFFF."
      - line: 20
        note: "Addition does not care about order, so reordering whole words is invisible to this checksum."
  - title: Latency versus bandwidth
    intro: "Transfer time is the latency plus size over bandwidth, plus one latency for every extra round trip. Watch which term dominates."
    code: |
      def transfer_ms(size_bytes, mbps, latency_ms, round_trips=1):
          return round_trips * latency_ms + size_bytes * 8 / (mbps * 1000)


      print(f"{'what':22} {'size':>10} {'link':>10} {'latency':>8} {'time':>10}")
      cases = [
          ("chat message", 200, 1000, 150),
          ("web page", 2_000_000, 100, 20),
          ("movie download", 4_000_000_000, 100, 20),
          ("movie, faster link", 4_000_000_000, 1000, 20),
          ("chat, faster link", 200, 10_000, 150),
      ]
      for name, size, mbps, latency in cases:
          ms = transfer_ms(size, mbps, latency)
          shown = f"{ms:,.1f} ms" if ms < 1000 else f"{ms / 1000:,.1f} s"
          print(f"{name:22} {size:>10,} {mbps:>6} Mbps {latency:>5} ms {shown:>10}")

      print("page needing 6 round trips:", f"{transfer_ms(2_000_000, 100, 20, 6):.1f} ms")
    output: |
      what                         size       link  latency       time
      chat message                  200   1000 Mbps   150 ms   150.0 ms
      web page                2,000,000    100 Mbps    20 ms   180.0 ms
      movie download         4,000,000,000    100 Mbps    20 ms    320.0 s
      movie, faster link     4,000,000,000   1000 Mbps    20 ms     32.0 s
      chat, faster link             200  10000 Mbps   150 ms   150.0 ms
      page needing 6 round trips: 280.0 ms
    lines:
      - line: 2
        note: "Bytes become bits (times 8). Mbps is 1000 bits per millisecond."
      - line: 11
        note: "A hundred times more bandwidth barely helps the chat message: its time is almost all latency."
      - line: 16
        note: "A big transfer is the opposite: ten times the bandwidth cuts the time by almost ten."
      - line: 20
        note: "Protocols that need several round trips pay the latency each time."

playground:
  prompt: |
    Change the layer list to add a fifth layer, or flip a different bit in the checksum example. Then work out by hand how long a 5 MB file takes at 50 Mbps with 80 ms latency and check it with `transfer_ms`.
  code: |
    import struct

    def transfer_ms(size_bytes, mbps, latency_ms, round_trips=1):
        return round_trips * latency_ms + size_bytes * 8 / (mbps * 1000)

    print(transfer_ms(5_000_000, 50, 80))
    print(struct.pack(">HI", 1, 2).hex(" "))

exercises:
  - id: wrap-unwrap
    title: Wrapping and unwrapping layers
    difficulty: 3
    prompt: |
      Write `wrap(payload, layers)` and `unwrap(packet)`. `layers` lists layer names in the order they are **applied**, so the first name ends up innermost: `wrap("hi", ["TCP", "IP", "ETH"])` is `"ETH[IP[TCP[hi]]]"`. `unwrap(packet)` peels the layers from the **outside in** and returns `(layers, payload)` with the layers listed outermost first: `unwrap("ETH[IP[TCP[hi]]]")` is `(["ETH", "IP", "TCP"], "hi")`. A packet with no brackets is just a payload: `([], "hi")`. The payload itself never contains brackets. Raise `ValueError` for a malformed packet: unbalanced brackets, an empty layer name (like `"[hi]"`), or stray brackets inside the payload.
    starter: |
      def wrap(payload, layers):
          pass


      def unwrap(packet):
          pass
    tests:
      - name: wrap
        code: |
          assert wrap("hi", ["TCP", "IP", "ETH"]) == "ETH[IP[TCP[hi]]]"
          assert wrap("hi", []) == "hi"
          assert wrap("", ["A"]) == "A[]"
          assert wrap("data", ["X", "Y"]) == "Y[X[data]]"
      - name: unwrap
        code: |
          assert unwrap("ETH[IP[TCP[hi]]]") == (["ETH", "IP", "TCP"], "hi")
          assert unwrap("hi") == ([], "hi")
          assert unwrap("A[B[]]") == (["A", "B"], "")
          assert unwrap("") == ([], "")
          assert unwrap("GET /index.html") == ([], "GET /index.html")
      - name: round trip
        code: |
          import random
          rng = random.Random(1)
          names = ["TCP", "UDP", "IP", "ETH", "TLS", "HTTP"]
          for _ in range(100):
              layers = [rng.choice(names) for _ in range(rng.randint(0, 6))]
              payload = "".join(rng.choice("abc 12") for _ in range(rng.randint(0, 8)))
              assert unwrap(wrap(payload, layers)) == (list(reversed(layers)), payload)
      - name: malformed packets
        code: |
          for bad in ("ETH[IP[hi]", "[hi]", "ETH[hi]]", "ETH[IP]hi", "A[b]c", "A[[x]]", "hi]", "A[B[x]"):
              try:
                  unwrap(bad)
                  assert False, repr(bad) + " should be rejected"
              except ValueError:
                  pass
    hints:
      - "`wrap`: loop over `layers` and replace `payload` with `f\"{layer}[{payload}]\"` each time."
      - "`unwrap`: loop while the packet contains `[`. Find `i = packet.index('[')`. The name is `packet[:i]` (must be non-empty) and the packet must end with `]`; the new packet is `packet[i + 1:-1]`."
      - "When the loop ends, the leftover is the payload. If it still contains `]` raise `ValueError`."
      - "Check `\"[\" in packet` and `packet.endswith(\"]\")` before slicing, and that the name has no `]` in it."
    solution: |
      def wrap(payload, layers):
          for layer in layers:
              payload = f"{layer}[{payload}]"
          return payload


      def unwrap(packet):
          layers = []
          while "[" in packet:
              i = packet.index("[")
              name = packet[:i]
              if not name or "]" in name or not packet.endswith("]"):
                  raise ValueError("malformed packet")
              layers.append(name)
              packet = packet[i + 1:-1]
          if "]" in packet:
              raise ValueError("malformed packet")
          return layers, packet
    explanation: |
      Unwrapping is decapsulation: peel the outermost header, learn which protocol it was, and hand the inside to the next layer. Real stacks do this with byte offsets rather than brackets, but the structure is identical, and each layer must validate its own header before trusting it, since a malformed packet can arrive from anywhere.

  - id: frame
    title: Building and parsing a frame
    difficulty: 3
    prompt: |
      A toy link-layer frame has a 6-byte header made of three big-endian unsigned 16-bit fields (destination address, source address, payload length) followed by the payload bytes. Write `build_frame(dst, src, payload)` returning the frame as `bytes`, and `parse_frame(frame)` returning `(dst, src, payload)`. `parse_frame` raises `ValueError` if the frame is shorter than the 6-byte header or if the length field does not equal the number of payload bytes actually present. Use the `struct` module.
    starter: |
      import struct


      def build_frame(dst, src, payload):
          pass


      def parse_frame(frame):
          pass
    tests:
      - name: build
        code: |
          f = build_frame(1, 2, b"hi")
          assert f == b"\x00\x01\x00\x02\x00\x02hi"
          assert build_frame(0xABCD, 0x0102, b"") == bytes([0xAB, 0xCD, 0x01, 0x02, 0, 0])
          assert isinstance(f, bytes) and len(build_frame(1, 2, b"x" * 100)) == 106
      - name: parse
        code: |
          assert parse_frame(b"\x00\x01\x00\x02\x00\x02hi") == (1, 2, b"hi")
          assert parse_frame(build_frame(65535, 0, b"")) == (65535, 0, b"")
          for payload in (b"", b"a", bytes(range(256)) * 3):
              assert parse_frame(build_frame(7, 9, payload)) == (7, 9, payload)
      - name: errors
        code: |
          for bad in (b"", b"\x00\x01\x00\x02\x00", b"\x00\x01\x00\x02\x00\x05abc", b"\x00\x01\x00\x02\x00\x01abc"):
              try:
                  parse_frame(bad)
                  assert False, bad
              except ValueError:
                  pass
    hints:
      - "The format string is `\">HHH\"`: `>` is big-endian, each `H` is an unsigned 16-bit integer."
      - "`struct.pack(\">HHH\", dst, src, len(payload)) + payload` builds the frame."
      - "`struct.unpack(\">HHH\", frame[:6])` reads the header; compare `length` with `len(frame) - 6`."
      - "Check `len(frame) < 6` first, so `unpack` is never given too few bytes."
    solution: |
      import struct

      HEADER = ">HHH"
      HEADER_SIZE = struct.calcsize(HEADER)


      def build_frame(dst, src, payload):
          return struct.pack(HEADER, dst, src, len(payload)) + payload


      def parse_frame(frame):
          if len(frame) < HEADER_SIZE:
              raise ValueError("frame shorter than its header")
          dst, src, length = struct.unpack(HEADER, frame[:HEADER_SIZE])
          payload = frame[HEADER_SIZE:]
          if length != len(payload):
              raise ValueError("length field does not match the payload")
          return dst, src, payload
    explanation: |
      Every binary protocol is a variation on this: a fixed header, a length, and a payload. The length check matters for security as well as correctness. Many historic vulnerabilities (Heartbleed among them) came from code that trusted a length field without comparing it with the data actually received.

  - id: checksum
    title: The internet checksum
    difficulty: 3
    prompt: |
      Write `internet_checksum(data)` for a `bytes` object, as described in the lesson: pad an odd length with a zero byte, add the 16-bit big-endian words, fold carries back in until the sum fits in 16 bits, and return the bitwise NOT masked to 16 bits. Then write `checksum_ok(data, checksum)` which returns `True` when `checksum` is the correct checksum of `data`, **without** calling `internet_checksum`: instead add the data words **and** the checksum, fold, and test whether the result is `0xFFFF`.
    starter: |
      def internet_checksum(data):
          pass


      def checksum_ok(data, checksum):
          pass
    tests:
      - name: known values
        code: |
          sample = bytes([0x00, 0x01, 0xF2, 0x03, 0xF4, 0xF5, 0xF6, 0xF7])
          assert internet_checksum(sample) == 0x220D
          assert internet_checksum(b"") == 0xFFFF
          assert internet_checksum(b"\x00\x00") == 0xFFFF
          assert internet_checksum(b"\xFF\xFF") == 0x0000
          assert internet_checksum(b"abc") == internet_checksum(b"abc\x00")
          assert internet_checksum(b"\x45\x00\x00\x3c") == (~0x4500 - 0x3c) & 0xFFFF
      - name: checksum_ok
        code: |
          sample = bytes([0x00, 0x01, 0xF2, 0x03, 0xF4, 0xF5, 0xF6, 0xF7])
          assert checksum_ok(sample, 0x220D) is True
          assert checksum_ok(sample, 0x220E) is False
          assert checksum_ok(b"", 0xFFFF) is True and checksum_ok(b"abc", internet_checksum(b"abc")) is True
      - name: error detection
        code: |
          import random
          rng = random.Random(5)
          for _ in range(100):
              data = bytes(rng.randrange(256) for _ in range(rng.randint(1, 40)))
              c = internet_checksum(data)
              assert checksum_ok(data, c)
              bad = bytearray(data)
              bad[rng.randrange(len(bad))] ^= 1 << rng.randrange(8)
              assert internet_checksum(bytes(bad)) != c        # every single-bit error is caught
              assert not checksum_ok(bytes(bad), c)
      - name: swapped words are not detected
        code: |
          data = b"\x12\x34\x56\x78\x9a\xbc"
          swapped = b"\x56\x78\x12\x34\x9a\xbc"
          assert data != swapped and internet_checksum(data) == internet_checksum(swapped)
    hints:
      - "Pad with `data += b'\\x00'` when `len(data)` is odd, then step through the bytes two at a time: `(data[i] << 8) | data[i + 1]`."
      - "Fold with `while total > 0xFFFF: total = (total & 0xFFFF) + (total >> 16)`, then `return ~total & 0xFFFF`."
      - "Share the summing code in a helper `_folded_sum(data)` returning the folded sum, and let `checksum_ok` fold the sum plus the checksum again before comparing with `0xFFFF`."
    solution: |
      def _folded_sum(data, extra=0):
          if len(data) % 2:
              data += b"\x00"
          total = extra
          for i in range(0, len(data), 2):
              total += (data[i] << 8) | data[i + 1]
          while total > 0xFFFF:
              total = (total & 0xFFFF) + (total >> 16)
          return total


      def internet_checksum(data):
          return ~_folded_sum(data) & 0xFFFF


      def checksum_ok(data, checksum):
          return _folded_sum(data, checksum) == 0xFFFF
    explanation: |
      Receivers verify by summing everything, checksum included, because the checksum is the number that makes the total all ones. The last test shows the weakness: addition is commutative, so reordered words go unnoticed. That is acceptable at the transport layer because the link layer has a stronger CRC, and higher layers such as TLS add cryptographic integrity.

  - id: path-delay
    title: Delay along a path
    difficulty: 3
    prompt: |
      A path is a list of links, each `(mbps, delay_ms)`: the link's bandwidth in megabits per second and its propagation delay in milliseconds. Routers are **store-and-forward**. Write `path_delay_ms(packet_bytes, links)`: the time for one packet to cross the whole path, which is the sum over the links of its transmission time (`packet_bytes * 8` bits at the link's rate; one Mbps is 1000 bits per millisecond) plus the link's propagation delay. Write `file_time_ms(total_bytes, packet_bytes, links)`: the total time for the last packet of a file to arrive, when the file is split into `ceil(total_bytes / packet_bytes)` packets, **all of full size**, sent back to back. After the first packet, each further packet arrives one **bottleneck transmission time** later (the largest transmission time among the links). Round every result to 3 decimal places. An empty path takes 0 ms, and a file of 0 bytes takes 0 ms.
    starter: |
      import math


      def path_delay_ms(packet_bytes, links):
          pass


      def file_time_ms(total_bytes, packet_bytes, links):
          pass
    tests:
      - name: one packet
        code: |
          assert path_delay_ms(1500, [(12, 0)]) == 1.0
          assert path_delay_ms(1500, [(100, 5), (10, 20)]) == 26.32
          assert path_delay_ms(1500, []) == 0
          assert path_delay_ms(0, [(10, 7)]) == 7.0
          assert path_delay_ms(125, [(1, 1), (1, 1), (1, 1)]) == 6.0
      - name: a file
        code: |
          links = [(100, 5), (10, 20)]
          assert file_time_ms(1500, 1500, links) == 26.32
          assert file_time_ms(3000, 1500, links) == 27.52
          assert file_time_ms(3001, 1500, links) == 28.72
          assert file_time_ms(0, 1500, links) == 0
          assert file_time_ms(10000, 1500, []) == 0
      - name: splitting helps
        code: |
          links = [(100, 2), (100, 2), (100, 2)]
          whole = path_delay_ms(1_000_000, links)
          split = file_time_ms(1_000_000, 1000, links)
          assert split < whole / 2
          assert abs(split - (3 * 0.08 + 6 + 999 * 0.08)) < 0.01
    hints:
      - "Transmission time in ms is `packet_bytes * 8 / (mbps * 1000)`. Sum it with the propagation delay over all links, then `round(..., 3)`."
      - "For the file, `n = math.ceil(total_bytes / packet_bytes)`. If `n == 0` or there are no links, return 0."
      - "Total = path delay of the first packet + `(n - 1)` times the largest per-link transmission time. Round at the end."
    solution: |
      import math


      def _tx(packet_bytes, mbps):
          return packet_bytes * 8 / (mbps * 1000)


      def path_delay_ms(packet_bytes, links):
          return round(sum(_tx(packet_bytes, mbps) + delay for mbps, delay in links), 3)


      def file_time_ms(total_bytes, packet_bytes, links):
          n = math.ceil(total_bytes / packet_bytes)
          if n == 0 or not links:
              return 0
          first = sum(_tx(packet_bytes, mbps) + delay for mbps, delay in links)
          bottleneck = max(_tx(packet_bytes, mbps) for mbps, delay in links)
          return round(first + (n - 1) * bottleneck, 3)
    explanation: |
      Pipelining is why the formula has a "first packet" term and a "per extra packet" term. Sending the million bytes as one block would pay every link's full transmission time in turn; packetising overlaps the links, so all of them work at once, and the slowest one sets the pace. This is the same assembly-line idea as the CPU pipeline of Lesson 1.6.

commonMistakes:
  - title: Mixing up bits and bytes
    explanation: |
      Link speeds are in bits per second, file sizes in bytes. A 100 Mbps link moves about 12.5 megabytes per second, not 100.
  - title: Assuming faster bandwidth means lower latency
    explanation: |
      Bandwidth is the width of the pipe and latency its length. Upgrading to a faster plan does not move Sydney any closer to London.
  - title: Using the wrong byte order
    explanation: |
      Network protocols are big-endian. Packing with the machine's native order (no `>` or `!` in `struct`) works on your computer and breaks on another.
  - title: Trusting a length field
    explanation: |
      Always compare a length claimed in a header with the number of bytes you actually have before using it.
  - title: Thinking a router reads the whole packet
    explanation: |
      Routers look at the link and IP headers only. The transport and application data are opaque payload to them (though some "deep packet inspection" devices peek anyway).
  - title: Believing a checksum protects against attackers
    explanation: |
      A checksum catches accidents, not malice. Anyone who can change the data can recompute the checksum. Security needs cryptography (Unit 16).

summary:
  - "The internet uses **packet switching**: messages are cut into packets that share links and may be delayed, reordered or lost."
  - "**Protocols** are layered: link, internet (IP), transport (TCP/UDP) and application (HTTP, DNS, ...). Each layer uses the one below and hides it from the one above."
  - "**Encapsulation** wraps data in a header at each layer on the way down; **decapsulation** unwraps it on the way up. Routers handle only link and IP headers."
  - "Headers are precise byte layouts in **network byte order** (big-endian). Python's `struct` packs and unpacks them, and shifts and masks extract fields that share a byte."
  - "The **internet checksum** adds 16-bit words, folds carries and inverts. It catches single-bit errors but not reordered words, and offers no protection against an attacker."
  - "Delay is **latency + size / bandwidth**, plus a latency per round trip. Store-and-forward adds each link's transmission and propagation delay, and **pipelining** packets overlaps the links."
next: |
  Packets need addresses. Next is **IP**: how addresses are written and divided into networks, how a router chooses the next hop with a forwarding table, and how many devices share one address.

