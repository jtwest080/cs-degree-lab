  - type: code
    question: |
      Write `same_network(a, b, prefix)` returning `True` if the dotted-quad addresses `a` and `b` have the same first `prefix` bits.
    starter: |
      def same_network(a, b, prefix):
          pass
    tests:
      - name: networks
        code: |
          assert same_network("192.168.1.5", "192.168.1.200", 24) is True
          assert same_network("192.168.1.5", "192.168.1.200", 25) is False
          assert same_network("10.1.2.3", "10.200.0.1", 8) is True
          assert same_network("1.2.3.4", "1.2.3.5", 32) is False
          assert same_network("1.2.3.4", "200.0.0.1", 0) is True
    solution: |
      def same_network(a, b, prefix):
          def to_int(t):
              p = [int(x) for x in t.split(".")]
              return (p[0] << 24) | (p[1] << 16) | (p[2] << 8) | p[3]
          mask = (0xFFFFFFFF << (32 - prefix)) & 0xFFFFFFFF
          return to_int(a) & mask == to_int(b) & mask
