id: u11-routing
title: "Routing: Finding the Way"
minutes: 60
objective: |
  Learn how routers build their forwarding tables. Distinguish forwarding from routing, see how link-state routing runs Dijkstra on a map every router shares, how distance-vector routing computes the same thing with only neighbour-to-neighbour gossip, why loops and "counting to infinity" happen, and how the internet links thousands of independently run networks with BGP.
outcomes:
  - Distinguish forwarding (per packet) from routing (building the tables)
  - Compute next hops with a link-state calculation (Dijkstra) over a network graph
  - Simulate distance-vector routing, including the Bellman-Ford update rule and convergence
  - Explain routing loops, TTL, counting to infinity and split horizon
  - Describe autonomous systems and how BGP chooses routes using policy and path length

sections:
  - heading: Forwarding versus routing
    body: |
      Two jobs are easily confused. **Forwarding** is what a router does to every packet: look at the destination address, find the longest matching prefix in the forwarding table (Lesson 11.2) and send the packet out of the right link. It must happen in nanoseconds. **Routing** is the slower job of *building* that table: working out which neighbour leads to each destination, and keeping the answer current when links break or appear.

      We can model a network as a **weighted graph** (Unit 6 and Unit 8): routers are nodes, links are edges, and each link has a **cost** (distance, delay, or a number the operator chooses). The goal of routing is each router's **next hop** for every destination, such that following the next hops from router to router gives the cheapest path. The two classic approaches differ in what each router knows.

  - heading: Link-state routing
    body: |
      In **link-state** routing (OSPF, IS-IS), every router learns the **whole map**:

      1. Each router discovers its neighbours and the cost of the links to them.
      2. It **floods** this *link-state advertisement* to every other router. Each router passes on a new advertisement to all neighbours except the one it came from, and remembers the latest sequence number so that each advertisement is flooded once.
      3. Now every router holds the same graph, and runs **Dijkstra's algorithm** (Lesson 8.8) from itself. Instead of storing the whole path to each destination, it records only the **first hop**.

      Because everyone computes from identical data, the tables are consistent. When a link fails, its neighbours flood a new advertisement and every router recomputes. The price is memory and CPU proportional to the whole network, so link-state is used inside one organisation, not across the whole internet.

      One practical detail: when two paths cost the same (**equal-cost multipath**), all routers must break ties the same way (or deliberately split traffic) or packets may loop. Our exercises always pick the lexicographically smallest path.

  - heading: Distance-vector routing
    body: |
      In **distance-vector** routing (RIP and the classic Bellman-Ford approach), a router does **not** know the map. It only knows its neighbours and what they tell it. Each router keeps a table of `destination → (cost, next hop)` and periodically sends its **vector of costs** to its neighbours. On receiving neighbour *N*'s vector, with *c* the link cost to *N*, the router applies the **Bellman-Ford update** for each destination *d*:

      > `cost(d) = min(cost(d), c + N's cost(d))`

      A cheaper route replaces the old one, with *N* as the new next hop. Repeating this, good news spreads one hop per round, and after at most (number of routers − 1) rounds every table is correct. No router needs the map, which makes distance-vector simple and cheap. But there is a famous weakness.

      **Counting to infinity.** Suppose A reaches C through B, and the link B–C breaks. B now has no route to C, but A still advertises "I can reach C at cost 2", so B decides to route through A, at cost 3. A then hears B's new cost and updates to 4, then B to 5, and so on: the two routers keep adding to each other's cost, each stuck in a **routing loop** in which packets bounce between them. Bad news travels slowly. Protocols mitigate this with:

      - a small maximum that counts as **infinity** (RIP uses 16), so the counting stops;
      - **split horizon**: never advertise a route back to the neighbour it came through (and **poison reverse**: advertise it with cost infinity);
      - **triggered updates**: send news of a change immediately instead of waiting for the next periodic update.

      Split horizon cures the two-router loop but not all loops, which is one reason large networks prefer link-state.

  - heading: TTL, loops and traceroute
    body: |
      Routing tables can be briefly inconsistent while news propagates, so packets may travel in circles. To stop a looping packet from living forever, every IP packet carries a **TTL** (time to live), a counter that each router **decrements**. When it reaches zero the router drops the packet and sends back an error message (ICMP "time exceeded").

      The `traceroute` tool turns this into a map: it sends probes with TTL 1, 2, 3, ... and each router along the path reports itself when it discards the packet that expired there. Seeing the list of routers (and the delay to each) shows where a slow link is.

  - heading: The internet is a network of networks
    body: |
      No single protocol can run the whole internet: it is too large for link-state, and different organisations want to keep their internals private and apply their own policies. The internet is divided into about 100,000 **autonomous systems (AS)**: networks under one administration, such as an ISP, a university or a cloud provider, each with an AS number.

      - Inside an AS, an **interior gateway protocol** (OSPF, RIP) finds the best paths by cost.
      - Between ASes, **BGP** (Border Gateway Protocol) exchanges *reachability*. A BGP router tells its neighbours: "I can reach this prefix, via this **AS path**" such as `AS 64500 → AS 64510 → AS 64520`. Receivers **prepend** their own AS number before passing the route on.

      BGP is a **path-vector** protocol. Seeing the whole AS path has two benefits. It prevents loops: a router discards any route whose AS path already contains its own AS number. And it lets operators apply **policy**: ASes prefer routes through customers (who pay them) over peers over providers, and often choose by business reasons, not shortest path. Among otherwise equal routes, the shorter AS path wins.

      Because BGP is built on trust, a mistaken or malicious announcement can divert the traffic of the world: in 2008 a Pakistani ISP's attempt to block YouTube accidentally took it offline globally, and similar leaks still happen. Securing BGP is an ongoing effort (Unit 16).

examples:
  - title: "Link-state: Dijkstra from each router"
    intro: "Every router has the same map. Each runs Dijkstra and keeps only the first hop toward every destination."
    code: |
      import heapq

      graph = {
          "A": {"B": 1, "C": 4},
          "B": {"A": 1, "C": 2, "D": 5},
          "C": {"A": 4, "B": 2, "D": 1},
          "D": {"B": 5, "C": 1, "E": 3},
          "E": {"D": 3},
      }


      def next_hops(graph, source):
          settled = {}
          heap = [(0, (source,))]
          while heap:
              cost, path = heapq.heappop(heap)
              node = path[-1]
              if node in settled:
                  continue
              settled[node] = (cost, path[1] if len(path) > 1 else None)
              for neighbour, weight in graph[node].items():
                  if neighbour not in settled:
                      heapq.heappush(heap, (cost + weight, path + (neighbour,)))
          return settled


      for router in ("A", "E"):
          print("forwarding table of", router)
          for dest, (cost, hop) in sorted(next_hops(graph, router).items()):
              if dest != router:
                  print(f"   to {dest}: cost {cost}, send to {hop}")
    output: |
      forwarding table of A
         to B: cost 1, send to B
         to C: cost 3, send to B
         to D: cost 4, send to B
         to E: cost 7, send to B
      forwarding table of E
         to A: cost 7, send to D
         to B: cost 6, send to D
         to C: cost 4, send to D
         to D: cost 3, send to D
    lines:
      - line: 15
        note: "The heap holds (cost, whole path). Ties on cost are broken by comparing the paths, so the result is always the same."
      - line: 21
        note: "A router only keeps the first step, the next hop, not the whole path."
  - title: "Distance-vector: gossip until nothing changes"
    intro: "Each round, every router looks at its neighbours' tables from the last round. News travels one hop per round."
    code: |
      graph = {"A": {"B": 1}, "B": {"A": 1, "C": 2}, "C": {"B": 2, "D": 1}, "D": {"C": 1}}

      tables = {n: {n: 0} for n in graph}
      rounds = 0
      while True:
          old = {n: dict(t) for n, t in tables.items()}
          changed = False
          for node, links in graph.items():
              for neighbour, cost in links.items():
                  for dest, ncost in old[neighbour].items():
                      if cost + ncost < tables[node].get(dest, float("inf")):
                          tables[node][dest] = cost + ncost
                          changed = True
          if not changed:
              break
          rounds += 1
          print(f"after round {rounds}: A knows", dict(sorted(tables["A"].items())))

      print("converged; tables:")
      for node in sorted(tables):
          print(" ", node, dict(sorted(tables[node].items())))
    output: |
      after round 1: A knows {'A': 0, 'B': 1}
      after round 2: A knows {'A': 0, 'B': 1, 'C': 3}
      after round 3: A knows {'A': 0, 'B': 1, 'C': 3, 'D': 4}
      converged; tables:
        A {'A': 0, 'B': 1, 'C': 3, 'D': 4}
        B {'A': 1, 'B': 0, 'C': 2, 'D': 3}
        C {'A': 3, 'B': 2, 'C': 0, 'D': 1}
        D {'A': 4, 'B': 3, 'C': 1, 'D': 0}
    lines:
      - line: 6
        note: "Snapshot the tables first, so all routers in a round use last round's information."
      - line: 11
        note: "The Bellman-Ford update: a route through a neighbour costs the link plus the neighbour's advertised cost."
      - line: 16
        note: "A learns about D, three hops away, only in the third round."
  - title: Counting to infinity
    intro: "After the B–C link breaks, A and B keep feeding each other stale news. Infinity is capped at 16, as in RIP."
    code: |
      INF = 16
      # Before the failure: A reaches C through B at cost 2, and B reaches C directly at cost 1.
      # Now the link B-C breaks. B has lost its direct route; A has not noticed yet.


      def simulate(split_horizon):
          a, b = 2, INF
          history = [(a, b)]
          for _ in range(40):
              # each router uses what the other advertised last round
              adv_a = INF if split_horizon else a      # A learned C from B, so split horizon hides it from B
              adv_b = b
              new_b = min(INF, adv_a + 1)
              new_a = min(INF, adv_b + 1)
              if (new_a, new_b) == (a, b):
                  break
              a, b = new_a, new_b
              history.append((a, b))
              if a == INF and b == INF:
                  break
          return history


      plain = simulate(False)
      print("without split horizon (A's cost, B's cost to C):")
      print(plain[:9], "...")
      print("rounds until both give up:", len(plain) - 1)
      guarded = simulate(True)
      print("with split horizon:", guarded)
    output: |
      without split horizon (A's cost, B's cost to C):
      [(2, 16), (16, 3), (4, 16), (16, 5), (6, 16), (16, 7), (8, 16), (16, 9), (10, 16)] ...
      rounds until both give up: 14
      with split horizon: [(2, 16), (16, 16)]
    lines:
      - line: 9
        note: "A starts with a stale route to C at cost 2; B has already lost its link."
      - line: 12
        note: "With split horizon, A never advertises to B the route it learned from B."
      - line: 25
        note: "The costs climb in steps until they reach the cap. Packets for C bounce between A and B the whole time."
  - title: A forwarding loop and TTL
    intro: "Two routers with inconsistent tables each think the other is the way. The TTL ends the loop."
    code: |
      tables = {
          "A": {"C": "B"},
          "B": {"C": "A"},       # after a failure, B's table points back at A
      }


      def forward(tables, src, dst, ttl):
          path, here = [src], src
          while here != dst:
              if ttl == 0:
                  return path, "TTL expired"
              hop = tables.get(here, {}).get(dst)
              if hop is None:
                  return path, "no route"
              ttl -= 1
              here = hop
              path.append(here)
          return path, "delivered"


      print(forward(tables, "A", "C", 6))
      print(forward(tables, "A", "A", 6))
      print(forward(tables, "C", "A", 6))
    output: |
      (['A', 'B', 'A', 'B', 'A', 'B', 'A'], 'TTL expired')
      (['A'], 'delivered')
      (['C'], 'no route')
    lines:
      - line: 10
        note: "A packet with TTL zero that has not arrived is discarded."
      - line: 14
        note: "Each router decrements the TTL before passing the packet on."
      - line: 20
        note: "C has no table at all, so there is no route."
  - title: Choosing a BGP route
    intro: "Routes carry the list of ASes they cross. Discard routes that already contain your own AS, then prefer the shortest."
    code: |
      def choose(my_as, routes):
          usable = [(n, path) for n, path in routes if my_as not in path]
          if not usable:
              return None
          return min(usable, key=lambda r: (len(r[1]), r[1]))


      routes = [
          (64510, [64510, 64530, 64540]),
          (64520, [64520, 64540]),
          (64550, [64550, 64500, 64540]),     # passes through us
      ]
      print(choose(64500, routes))
      print(choose(64500, [(64550, [64550, 64500, 64540])]))
      print(choose(64500, []))
      advertised = [64500] + choose(64500, routes)[1]
      print("what we tell our neighbours:", advertised)
    output: |
      (64520, [64520, 64540])
      None
      None
      what we tell our neighbours: [64500, 64520, 64540]
    lines:
      - line: 2
        note: "Loop prevention: a route through our own AS would come straight back to us."
      - line: 5
        note: "Shorter AS path wins; equal lengths fall back to comparing the paths so the choice is deterministic."
      - line: 17
        note: "Before passing a route on, we prepend our own AS number."

