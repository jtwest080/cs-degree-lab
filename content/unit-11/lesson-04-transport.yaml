id: u11-transport
title: "Ports, UDP and TCP"
minutes: 60
objective: |
  See how data gets from a program on one machine to a program on another. Learn what ports are and how a host sorts arriving packets, how simple and fast UDP is, and how TCP turns an unreliable packet network into a reliable, ordered byte stream using sequence numbers, acknowledgements, a three-way handshake and a state machine.
outcomes:
  - Explain ports, multiplexing and the (address, port) pairs that identify a connection
  - Build and parse a UDP datagram and say what UDP does and does not guarantee
  - Describe TCP segments, flags, sequence and acknowledgement numbers, and trace a handshake and a teardown
  - Split a byte stream into segments and reassemble it from out-of-order arrivals
  - Walk a TCP connection through its states
  - Choose between TCP and UDP for an application

sections:
  - heading: From host to program
    body: |
      IP delivers a packet to a **host**. But a host runs many programs at once: a browser with twenty tabs, a music app, a mail client. The **transport layer** finishes the delivery to the right **program**. The mechanism is the **port**: a 16-bit number (0 to 65535) that names an endpoint on a host.

      A server **listens** on a well-known port so clients know where to find it: 80 for HTTP, 443 for HTTPS, 22 for SSH, 25 for email, 53 for DNS. Ports below 1024 are "well-known", reserved for services run by the system. A client program does not need a fixed port: the operating system gives it a random **ephemeral** port (typically in the 49152 to 65535 range) for each connection.

      A TCP connection is therefore identified by four numbers, the **4-tuple** *(source address, source port, destination address, destination port)*. Two browser tabs talking to the same web server share the server's address and port 443, but their ephemeral source ports differ, so the server (and the OS) can tell the conversations apart. Sending incoming data to the right program is called **demultiplexing**; letting many programs share one network connection is **multiplexing**.

      The transport layer offers two main services:

      - **UDP**: a thin wrapper that adds ports and a checksum to IP's "best effort" delivery.
      - **TCP**: a full, reliable, ordered **byte stream** between two programs, built from UDP-like pieces plus a great deal of machinery.

  - heading: "UDP: the minimal transport"
    body: |
      The **User Datagram Protocol** has an 8-byte header with four 16-bit fields:

      | Field | Meaning |
      |---|---|
      | Source port | where replies go |
      | Destination port | which program should receive it |
      | Length | header plus data, in bytes |
      | Checksum | the internet checksum (Lesson 11.1) over a pseudo-header, the header and the data |

      That is all. UDP has **no connection**, no acknowledgements, no retransmission and no ordering. Each **datagram** is sent independently, may be lost, duplicated or reordered, and keeps its boundaries (one send is one receive). A damaged datagram is silently dropped.

      This sounds like a bad deal, but it is exactly right for some jobs. It adds no setup delay (nothing to negotiate), no waiting for retransmissions (an old video frame is worthless anyway), and little overhead. So UDP carries **DNS** queries (one tiny question, one tiny answer; the application just asks again if there is no reply), **voice and video calls**, **online games**, and **QUIC**, the newer transport that HTTP/3 uses, which builds its own reliability on top of UDP.

  - heading: "TCP: a reliable byte stream"
    body: |
      The **Transmission Control Protocol** gives programs the illusion of a pipe: bytes written at one end come out of the other **complete, in order and without duplicates**, even though the network underneath loses, reorders and duplicates packets. TCP is **connection-oriented**: the two ends first agree to talk, and keep state for the connection.

      A TCP **segment** has a header of at least 20 bytes. The fields that matter most:

      - **source and destination port** (16 bits each),
      - **sequence number** (32 bits): the position in the stream of the first data byte in this segment,
      - **acknowledgement number** (32 bits): the position of the next byte the sender of this segment expects to receive,
      - **flags**: **SYN** (open a connection), **ACK** (the acknowledgement number is valid), **FIN** (I have finished sending), **RST** (abort), **PSH** and **URG**,
      - **window**: how many more bytes the sender of this segment is willing to receive (flow control, next lesson),
      - **checksum**.

      **Sequence numbers count bytes**, not segments. If a segment has sequence number 1000 and carries 500 bytes, it covers bytes 1000 to 1499, and the receiver acknowledges with 1500: "I have everything up to 1499 and want 1500 next". That is a **cumulative acknowledgement**. SYN and FIN each consume one sequence number, as if they were a byte, so that they too can be acknowledged. Sequence numbers are 32 bits and wrap around, so arithmetic on them is done modulo 2³².

      **Segmentation.** The application hands TCP any amount of data. TCP cuts it into segments no larger than the **MSS** (maximum segment size), usually 1460 bytes, so each fits in a 1500-byte Ethernet frame after the IP and TCP headers. The receiver puts segments back in order by their sequence numbers (**reassembly**), holds on to early arrivals, and delivers bytes to the program only up to the first gap.

  - heading: The three-way handshake
    body: |
      Before data flows, the two ends synchronise their sequence numbers. Each side picks a random **initial sequence number (ISN)**, which prevents old stray segments of a previous connection from being mistaken for new ones (and makes blind spoofing harder). The exchange takes three segments, the **three-way handshake**:

      1. **Client → server: SYN**, `seq = x`. "I'd like to connect; my numbers start at x."
      2. **Server → client: SYN+ACK**, `seq = y, ack = x + 1`. "OK; mine start at y, and I expect your next byte to be x + 1."
      3. **Client → server: ACK**, `seq = x + 1, ack = y + 1`. "Got it."

      Now the connection is **established**. The client can send data in the very next segment. Notice the cost: one full **round trip** before any data moves, which is why latency (Lesson 11.1) makes opening connections expensive, and why HTTP keeps connections open for reuse.

      Closing is done with FINs. Each direction is closed independently: the side finished with its data sends **FIN**, the other **ACK**s it; later the other side sends its own FIN and receives an ACK. So a normal close takes four segments. The side that closes first lingers in **TIME_WAIT** for a couple of minutes, so that late stray segments cannot confuse a new connection that reuses the same 4-tuple. A **RST** aborts a connection immediately, for example when a segment arrives for a port nobody is listening on.

  - heading: The TCP state machine
    body: |
      Each end of a connection keeps a **state** and moves between states when events happen: the application calls something, or a segment arrives. The main states for a client and a server:

      | State | Meaning |
      |---|---|
      | `CLOSED` | no connection |
      | `LISTEN` | a server waiting for a SYN |
      | `SYN_SENT` | client sent SYN, waiting for SYN+ACK |
      | `SYN_RCVD` | server got SYN, sent SYN+ACK, waiting for ACK |
      | `ESTABLISHED` | data can flow both ways |
      | `FIN_WAIT_1` / `FIN_WAIT_2` | I sent FIN; waiting for its ACK, then for the other side's FIN |
      | `CLOSE_WAIT` | the other side finished; I may still send |
      | `LAST_ACK` | I sent my FIN after theirs; waiting for the final ACK |
      | `TIME_WAIT` | waiting out stray segments before closing for good |

      When you see thousands of connections stuck in `CLOSE_WAIT` on a server, it usually means the program forgot to close its sockets: the state tells you whose fault it is. `netstat` and `ss` show these states.

  - heading: TCP or UDP?
    body: |
      **Choose TCP** when every byte must arrive correctly and in order and you can afford some delay: web pages, email, file transfers, SSH, databases. **Choose UDP** when timeliness matters more than completeness, when messages are tiny and independent, or when you want to design your own reliability: DNS lookups, live audio and video, games, streaming telemetry. A lost frame in a video call is better skipped than waited for. The next lesson shows how TCP detects loss and what it does about it.

examples:
  - title: A UDP datagram
    intro: "Eight bytes of header, then the data. The length field covers both."
    code: |
      import struct


      def internet_checksum(data):
          if len(data) % 2:
              data += b"\x00"
          total = sum((data[i] << 8) | data[i + 1] for i in range(0, len(data), 2))
          while total > 0xFFFF:
              total = (total & 0xFFFF) + (total >> 16)
          return ~total & 0xFFFF


      def make_udp(src, dst, payload):
          length = 8 + len(payload)
          checksum = internet_checksum(struct.pack(">HHHH", src, dst, length, 0) + payload)
          return struct.pack(">HHHH", src, dst, length, checksum or 0xFFFF) + payload


      datagram = make_udp(50000, 53, b"example.com?")
      print(datagram.hex(" "))
      src, dst, length, checksum = struct.unpack(">HHHH", datagram[:8])
      print(f"from port {src} to port {dst}, {length} bytes in all, checksum {checksum:#06x}")
      print("payload:", datagram[8:])
    output: |
      c3 50 00 35 00 14 cf 36 65 78 61 6d 70 6c 65 2e 63 6f 6d 3f
      from port 50000 to port 53, 20 bytes in all, checksum 0xcf36
      payload: b'example.com?'
    lines:
      - line: 12
        note: "The length includes the 8-byte header, so an empty datagram has length 8."
      - line: 13
        note: "The checksum is computed with the checksum field set to zero."
      - line: 14
        note: "In UDP a computed checksum of zero is sent as all ones, since zero means 'no checksum'."
  - title: Ports and demultiplexing
    intro: "A server socket is identified by its address and port; each connection by the whole 4-tuple."
    code: |
      class Host:
          def __init__(self, address):
              self.address = address
              self.listeners = {}        # port -> service name
              self.connections = {}      # (src address, src port, dst port) -> service name

          def listen(self, port, service):
              self.listeners[port] = service

          def receive(self, src_address, src_port, dst_port):
              if dst_port not in self.listeners:
                  return "RST (nobody is listening on port %d)" % dst_port
              key = (src_address, src_port, dst_port)
              self.connections.setdefault(key, self.listeners[dst_port])
              return f"delivered to {self.listeners[dst_port]}, connection #{list(self.connections).index(key) + 1}"


      server = Host("203.0.113.9")
      server.listen(80, "web server")
      server.listen(22, "ssh daemon")

      print(server.receive("198.51.100.4", 50001, 80))     # browser tab 1
      print(server.receive("198.51.100.4", 50002, 80))     # browser tab 2
      print(server.receive("198.51.100.4", 50001, 80))     # more data for tab 1
      print(server.receive("198.51.100.77", 50001, 22))    # someone else, ssh
      print(server.receive("198.51.100.4", 50003, 8080))   # nobody listening
      print(len(server.connections), "connections")
    output: |
      delivered to web server, connection #1
      delivered to web server, connection #2
      delivered to web server, connection #1
      delivered to ssh daemon, connection #3
      RST (nobody is listening on port 8080)
      3 connections
    lines:
      - line: 12
        note: "A new 4-tuple makes a new connection; a known one is the same conversation."
      - line: 19
        note: "Both tabs go to port 80 but have different source ports, so they are separate connections."
      - line: 23
        note: "A segment for a closed port is answered with a reset."
  - title: A TCP conversation, segment by segment
    intro: "The handshake, a request and a reply, then the close. Watch the sequence and acknowledgement numbers."
    code: |
      def conversation(client_isn, server_isn, sends):
          M = 2 ** 32
          trace = []
          cnext, snext = (client_isn + 1) % M, (server_isn + 1) % M
          trace.append(("client", "SYN", client_isn, 0, 0))
          trace.append(("server", "SYN+ACK", server_isn, cnext, 0))
          trace.append(("client", "ACK", cnext, snext, 0))
          for who, n in sends:
              if who == "client":
                  trace.append(("client", "ACK", cnext, snext, n))
                  cnext = (cnext + n) % M
                  trace.append(("server", "ACK", snext, cnext, 0))
              else:
                  trace.append(("server", "ACK", snext, cnext, n))
                  snext = (snext + n) % M
                  trace.append(("client", "ACK", cnext, snext, 0))
          trace.append(("client", "FIN+ACK", cnext, snext, 0))
          trace.append(("server", "ACK", snext, (cnext + 1) % M, 0))
          trace.append(("server", "FIN+ACK", snext, (cnext + 1) % M, 0))
          trace.append(("client", "ACK", (cnext + 1) % M, (snext + 1) % M, 0))
          return trace


      print(f"{'from':7} {'flags':8} {'seq':>5} {'ack':>5} {'bytes':>5}")
      for row in conversation(100, 500, [("client", 40), ("server", 120)]):
          print(f"{row[0]:7} {row[1]:8} {row[2]:>5} {row[3]:>5} {row[4]:>5}")
    output: |
      from    flags      seq   ack bytes
      client  SYN        100     0     0
      server  SYN+ACK    500   101     0
      client  ACK        101   501     0
      client  ACK        101   501    40
      server  ACK        501   141     0
      server  ACK        501   141   120
      client  ACK        141   621     0
      client  FIN+ACK    141   621     0
      server  ACK        621   142     0
      server  FIN+ACK    621   142     0
      client  ACK        142   622     0
    lines:
      - line: 5
        note: "SYN uses up one sequence number, so the next byte is isn + 1."
      - line: 11
        note: "Sending n bytes advances the sender's next sequence number by n, and the receiver acknowledges it."
      - line: 19
        note: "FIN also consumes one sequence number, so it is acknowledged with +1."
  - title: Segmenting and reassembling a stream
    intro: "Cut the data by MSS and number the pieces by byte position; the receiver uses the numbers to restore order."
    code: |
      import random


      def segment(data, mss, isn):
          return [((isn + i) % 2 ** 32, data[i:i + mss]) for i in range(0, len(data), mss)]


      def reassemble(segments, isn):
          buffer = bytearray()
          for seq, chunk in sorted(segments, key=lambda s: (s[0] - isn) % 2 ** 32):
              offset = (seq - isn) % 2 ** 32
              if offset > len(buffer):
                  break                            # a gap: stop and wait for the missing bytes
              buffer += chunk[len(buffer) - offset:]
          return bytes(buffer), (isn + len(buffer)) % 2 ** 32


      message = b"The quick brown fox jumps over the lazy dog."
      parts = segment(message, 10, 4294967290)       # sequence numbers wrap around
      for seq, chunk in parts:
          print(seq, chunk)

      random.Random(1).shuffle(parts)
      arrived = parts + [parts[0]]                    # one duplicate
      data, expected = reassemble(arrived, 4294967290)
      print(data == message, "next expected byte:", expected)

      missing = [p for p in parts if p[0] != 14]          # drop the segment that starts at sequence number 14
      data, expected = reassemble(missing, 4294967290)
      print(data, expected)
    output: |
      4294967290 b'The quick '
      4 b'brown fox '
      14 b'jumps over'
      24 b' the lazy '
      34 b'dog.'
      True next expected byte: 38
      b'The quick brown fox ' 14
    lines:
      - line: 5
        note: "A segment's sequence number is the stream position of its first byte, wrapped at 2^32."
      - line: 9
        note: "Sort by distance from the start so that wrapped numbers come out in the right order."
      - line: 12
        note: "If the next piece does not begin where the buffer ends, there is a hole, so stop. Anything after it waits."
      - line: 13
        note: "Slicing off the part we already have means duplicates and overlaps are harmless."
  - title: A client and server through their states
    intro: "A table of (state, event) -> next state is the whole protocol machine."
    code: |
      TRANSITIONS = {
          ("CLOSED", "passive_open"): "LISTEN",
          ("CLOSED", "active_open"): "SYN_SENT",
          ("LISTEN", "recv_SYN"): "SYN_RCVD",
          ("SYN_SENT", "recv_SYN_ACK"): "ESTABLISHED",
          ("SYN_RCVD", "recv_ACK"): "ESTABLISHED",
          ("ESTABLISHED", "close"): "FIN_WAIT_1",
          ("ESTABLISHED", "recv_FIN"): "CLOSE_WAIT",
          ("FIN_WAIT_1", "recv_ACK"): "FIN_WAIT_2",
          ("FIN_WAIT_2", "recv_FIN"): "TIME_WAIT",
          ("CLOSE_WAIT", "close"): "LAST_ACK",
          ("LAST_ACK", "recv_ACK"): "CLOSED",
          ("TIME_WAIT", "timeout"): "CLOSED",
      }


      def walk(name, state, events):
          print(name)
          for event in events:
              new = TRANSITIONS.get((state, event))
              if new is None:
                  print(f"   {state} + {event}: not allowed here")
                  return
              print(f"   {state:12} --{event}--> {new}")
              state = new


      walk("client", "CLOSED", ["active_open", "recv_SYN_ACK", "close", "recv_ACK", "recv_FIN", "timeout"])
      walk("server", "CLOSED", ["passive_open", "recv_SYN", "recv_ACK", "recv_FIN", "close", "recv_ACK"])
      walk("confused", "LISTEN", ["recv_FIN"])
    output: |
      client
         CLOSED       --active_open--> SYN_SENT
         SYN_SENT     --recv_SYN_ACK--> ESTABLISHED
         ESTABLISHED  --close--> FIN_WAIT_1
         FIN_WAIT_1   --recv_ACK--> FIN_WAIT_2
         FIN_WAIT_2   --recv_FIN--> TIME_WAIT
         TIME_WAIT    --timeout--> CLOSED
      server
         CLOSED       --passive_open--> LISTEN
         LISTEN       --recv_SYN--> SYN_RCVD
         SYN_RCVD     --recv_ACK--> ESTABLISHED
         ESTABLISHED  --recv_FIN--> CLOSE_WAIT
         CLOSE_WAIT   --close--> LAST_ACK
         LAST_ACK     --recv_ACK--> CLOSED
      confused
         LISTEN + recv_FIN: not allowed here
    lines:
      - line: 1
        note: "Every legal move is one entry in a dictionary keyed by the state and the event."
      - line: 19
        note: "An event that has no entry for the current state is a protocol error."
      - line: 29
        note: "The client closes first, so it ends up in TIME_WAIT. The server closes second and goes straight to CLOSED."

