exercises:
  - id: udp
    title: UDP datagrams
    difficulty: 3
    prompt: |
      The function `internet_checksum(data)` from Lesson 11.1 is provided in the starter. Write `make_udp(src_port, dst_port, payload)` returning the datagram `bytes`: a header of four big-endian 16-bit fields (source port, destination port, length = 8 + payload length, checksum) followed by the payload. The checksum is the internet checksum of the header (with the checksum field zero) plus the payload, and if it comes out as `0` it is sent as `0xFFFF`. Write `parse_udp(datagram)` returning `(src_port, dst_port, payload)` and raising `ValueError` if the datagram is shorter than 8 bytes, if the length field does not equal the actual datagram length, or if the checksum is wrong. A checksum field of `0xFFFF` is accepted when the recomputed checksum is `0`.
    starter: |
      import struct


      def internet_checksum(data):
          if len(data) % 2:
              data += b"\x00"
          total = sum((data[i] << 8) | data[i + 1] for i in range(0, len(data), 2))
          while total > 0xFFFF:
              total = (total & 0xFFFF) + (total >> 16)
          return ~total & 0xFFFF


      def make_udp(src_port, dst_port, payload):
          pass


      def parse_udp(datagram):
          pass
    tests:
      - name: make
        code: |
          d = make_udp(50000, 53, b"hello")
          assert len(d) == 13 and d[8:] == b"hello"
          assert struct.unpack(">HHH", d[:6]) == (50000, 53, 13)
          assert make_udp(1, 2, b"")[4:6] == b"\x00\x08"
          assert isinstance(d, bytes)
      - name: round trip
        code: |
          import random
          rng = random.Random(7)
          for _ in range(200):
              payload = bytes(rng.randrange(256) for _ in range(rng.randint(0, 50)))
              s, t = rng.randrange(65536), rng.randrange(65536)
              assert parse_udp(make_udp(s, t, payload)) == (s, t, payload)
      - name: damage is detected
        code: |
          d = bytearray(make_udp(1234, 80, b"GET /"))
          d[9] ^= 0x04
          for bad in (bytes(d), b"", b"short", make_udp(1, 2, b"abc")[:-1], make_udp(1, 2, b"abc") + b"x"):
              try:
                  parse_udp(bad)
                  assert False, bad
              except ValueError:
                  pass
      - name: zero checksum becomes all ones
        code: |
          # find a payload whose checksum would be 0
          found = False
          for a in range(256):
              for b in range(256):
                  payload = bytes([a, b])
                  raw = struct.pack(">HHHH", 0, 0, 10, 0) + payload
                  if internet_checksum(raw) == 0:
                      d = make_udp(0, 0, payload)
                      assert d[6:8] == b"\xff\xff"
                      assert parse_udp(d) == (0, 0, payload)
                      found = True
                      break
              if found:
                  break
          assert found
    hints:
      - "`struct.pack(\">HHHH\", src, dst, 8 + len(payload), 0) + payload` is the header with a zero checksum."
      - "`checksum = internet_checksum(that) or 0xFFFF` handles the zero case."
      - "To verify, extract the fields, rebuild the zero-checksum version, recompute, and compare (treating `0xFFFF` as 0)."
    solution: |
      import struct


      def internet_checksum(data):
          if len(data) % 2:
              data += b"\x00"
          total = sum((data[i] << 8) | data[i + 1] for i in range(0, len(data), 2))
          while total > 0xFFFF:
              total = (total & 0xFFFF) + (total >> 16)
          return ~total & 0xFFFF


      def make_udp(src_port, dst_port, payload):
          length = 8 + len(payload)
          checksum = internet_checksum(struct.pack(">HHHH", src_port, dst_port, length, 0) + payload)
          return struct.pack(">HHHH", src_port, dst_port, length, checksum or 0xFFFF) + payload


      def parse_udp(datagram):
          if len(datagram) < 8:
              raise ValueError("too short")
          src, dst, length, checksum = struct.unpack(">HHHH", datagram[:8])
          payload = datagram[8:]
          if length != len(datagram):
              raise ValueError("bad length")
          expected = internet_checksum(struct.pack(">HHHH", src, dst, length, 0) + payload) or 0xFFFF
          if checksum != expected:
              raise ValueError("bad checksum")
          return src, dst, payload
    explanation: |
      The real UDP checksum also covers a "pseudo-header" of the IP addresses, so a datagram delivered to the wrong host is caught too; we left that out to keep the exercise self-contained. The `or 0xFFFF` rule exists because zero is reserved to mean "the sender did not compute a checksum".

  - id: flags
    title: TCP flags
    difficulty: 2
    prompt: |
      TCP flags are bits in one byte: `FIN` = 1, `SYN` = 2, `RST` = 4, `PSH` = 8, `ACK` = 16, `URG` = 32. Write `flags_to_byte(names)` turning a collection of flag names into the byte (duplicates are fine; raise `ValueError` for an unknown name), `byte_to_flags(value)` returning the list of names set in the byte, **in the order FIN, SYN, RST, PSH, ACK, URG** (raise `ValueError` unless `0 <= value <= 63`), and `describe(value)` returning the names joined with `"+"`, or `"none"` for 0, but writing `ACK` last as is customary: `describe(18)` is `"SYN+ACK"`.
    starter: |
      def flags_to_byte(names):
          pass


      def byte_to_flags(value):
          pass


      def describe(value):
          pass
    tests:
      - name: to byte
        code: |
          assert flags_to_byte(["SYN"]) == 2
          assert flags_to_byte(["SYN", "ACK"]) == 18
          assert flags_to_byte(["ACK", "SYN", "ACK"]) == 18
          assert flags_to_byte([]) == 0
          assert flags_to_byte({"FIN", "ACK"}) == 17
          assert flags_to_byte(["FIN", "SYN", "RST", "PSH", "ACK", "URG"]) == 63
          try:
              flags_to_byte(["SYN", "WAT"])
              assert False
          except ValueError:
              pass
      - name: from byte
        code: |
          assert byte_to_flags(0) == []
          assert byte_to_flags(18) == ["SYN", "ACK"]
          assert byte_to_flags(17) == ["FIN", "ACK"]
          assert byte_to_flags(63) == ["FIN", "SYN", "RST", "PSH", "ACK", "URG"]
          assert byte_to_flags(24) == ["PSH", "ACK"]
          for bad in (-1, 64, 255):
              try:
                  byte_to_flags(bad)
                  assert False
              except ValueError:
                  pass
      - name: describe
        code: |
          assert describe(0) == "none"
          assert describe(2) == "SYN" and describe(18) == "SYN+ACK" and describe(16) == "ACK"
          assert describe(17) == "FIN+ACK" and describe(4) == "RST"
          assert describe(24) == "PSH+ACK"
          assert describe(63) == "FIN+SYN+RST+PSH+URG+ACK"
          for v in range(64):
              assert flags_to_byte(byte_to_flags(v)) == v
    hints:
      - "Keep a list of `(name, bit)` pairs in the required order, plus a dictionary built from it."
      - "`flags_to_byte`: OR together `1 << position` or the bit value for each name."
      - "`describe`: take `byte_to_flags`, move `\"ACK\"` to the end if present, join with `+`."
    solution: |
      ORDER = ["FIN", "SYN", "RST", "PSH", "ACK", "URG"]
      BIT = {name: 1 << i for i, name in enumerate(ORDER)}


      def flags_to_byte(names):
          value = 0
          for name in names:
              if name not in BIT:
                  raise ValueError("unknown flag " + name)
              value |= BIT[name]
          return value


      def byte_to_flags(value):
          if not 0 <= value <= 63:
              raise ValueError("flag byte out of range")
          return [name for name in ORDER if value & BIT[name]]


      def describe(value):
          names = byte_to_flags(value)
          if not names:
              return "none"
          if "ACK" in names:
              names.remove("ACK")
              names.append("ACK")
          return "+".join(names)
    explanation: |
      Flags are exactly the masks and bit-sets of Lesson 9.8, and tools like Wireshark show them this way: `[SYN, ACK]`. Every segment of a connection after the first carries ACK, and a SYN with no ACK means "someone is starting a connection" - the packet that port scanners and SYN floods send.

  - id: segments
    title: Segmentation and reassembly
    difficulty: 4
    prompt: |
      Write `segment(data, mss, isn)` returning a list of `(seq, chunk)` for `bytes` data: chunks of at most `mss` bytes in order, where `seq = (isn + offset) % 2**32` and `offset` is the position of the chunk's first byte. Empty data gives `[]`. Write `reassemble(segments, isn)` for segments that arrive in **any order, with duplicates, and possibly overlapping**. Return `(data, next_seq)`: the longest contiguous run of bytes starting at `isn` that has been received, and `next_seq = (isn + len(data)) % 2**32`, the next byte expected. Bytes that arrive after a gap are not delivered. Offsets are computed modulo 2**32, so sequence numbers may wrap around.
    starter: |
      def segment(data, mss, isn):
          pass


      def reassemble(segments, isn):
          pass
    tests:
      - name: segment
        code: |
          assert segment(b"abcdefg", 3, 100) == [(100, b"abc"), (103, b"def"), (106, b"g")]
          assert segment(b"", 3, 100) == []
          assert segment(b"abcdef", 3, 2**32 - 2) == [(2**32 - 2, b"abc"), (1, b"def")]
          assert segment(b"ab", 10, 0) == [(0, b"ab")]
      - name: in order, shuffled and duplicated
        code: |
          import random
          msg = bytes(range(200))
          parts = segment(msg, 17, 1000)
          assert reassemble(parts, 1000) == (msg, 1200)
          rng = random.Random(3)
          for _ in range(50):
              mixed = parts + rng.sample(parts, 5)
              rng.shuffle(mixed)
              assert reassemble(mixed, 1000) == (msg, 1200)
      - name: gaps and overlaps
        code: |
          parts = segment(b"0123456789", 2, 50)           # 50:01 52:23 54:45 56:67 58:89
          without = [p for p in parts if p[0] != 54]
          assert reassemble(without, 50) == (b"0123", 54)
          assert reassemble([], 50) == (b"", 50)
          assert reassemble([(52, b"23")], 50) == (b"", 50)
          overlap = [(50, b"0123"), (52, b"2345"), (55, b"56789")]
          assert reassemble(overlap, 50) == (b"0123456789", 60)
          assert reassemble([(50, b"abcdef"), (51, b"bc")], 50) == (b"abcdef", 56)
      - name: wraparound
        code: |
          import random
          msg = b"wrap around the end of the sequence space"
          isn = 2**32 - 13
          parts = segment(msg, 8, isn)
          assert any(seq < 100 for seq, _ in parts) and any(seq > 2**32 - 100 for seq, _ in parts)
          random.Random(8).shuffle(parts)
          data, nxt = reassemble(parts, isn)
          assert data == msg and nxt == (isn + len(msg)) % 2**32
    hints:
      - "`segment`: `range(0, len(data), mss)` gives each offset."
      - "`reassemble`: compute `offset = (seq - isn) % 2**32` for each segment and sort by it."
      - "Keep a `bytearray`. For each segment in order: if `offset > len(buffer)` there is a gap, so stop. Otherwise append `chunk[len(buffer) - offset:]`, which skips bytes you already have (and does nothing for a duplicate)."
    solution: |
      M = 2 ** 32


      def segment(data, mss, isn):
          return [((isn + i) % M, data[i:i + mss]) for i in range(0, len(data), mss)]


      def reassemble(segments, isn):
          buffer = bytearray()
          for seq, chunk in sorted(segments, key=lambda s: (s[0] - isn) % M):
              offset = (seq - isn) % M
              if offset > len(buffer):
                  break
              buffer += chunk[len(buffer) - offset:]
          return bytes(buffer), (isn + len(buffer)) % M
    explanation: |
      This is TCP's receive buffer in miniature. `next_seq` is exactly the acknowledgement number the receiver would send back: everything below it has arrived. When a gap appears the receiver keeps sending the same acknowledgement (a "duplicate ACK"), which is the signal the sender uses to notice a loss, as you'll see in the next lesson.

  - id: states
    title: The TCP state machine
    difficulty: 3
    prompt: |
      Implement `next_state(state, event)` using the transition table from the lesson's last example (12 transitions): `CLOSED`+`passive_open`→`LISTEN`, `CLOSED`+`active_open`→`SYN_SENT`, `LISTEN`+`recv_SYN`→`SYN_RCVD`, `SYN_SENT`+`recv_SYN_ACK`→`ESTABLISHED`, `SYN_RCVD`+`recv_ACK`→`ESTABLISHED`, `ESTABLISHED`+`close`→`FIN_WAIT_1`, `ESTABLISHED`+`recv_FIN`→`CLOSE_WAIT`, `FIN_WAIT_1`+`recv_ACK`→`FIN_WAIT_2`, `FIN_WAIT_2`+`recv_FIN`→`TIME_WAIT`, `CLOSE_WAIT`+`close`→`LAST_ACK`, `LAST_ACK`+`recv_ACK`→`CLOSED`, `TIME_WAIT`+`timeout`→`CLOSED`. Raise `ValueError` for any other pair. Write `simulate(state, events)` returning the list of states visited **including the starting one**, and raising `ValueError` at the first illegal event. Write `is_open(state)` returning `True` only for `ESTABLISHED`. Write `can_send(state)` (`ESTABLISHED` and `CLOSE_WAIT`) and `can_receive(state)` (`ESTABLISHED`, `FIN_WAIT_1` and `FIN_WAIT_2`).
    starter: |
      def next_state(state, event):
          pass


      def simulate(state, events):
          pass


      def is_open(state):
          pass


      def can_send(state):
          pass


      def can_receive(state):
          pass
    tests:
      - name: transitions
        code: |
          assert next_state("CLOSED", "active_open") == "SYN_SENT"
          assert next_state("LISTEN", "recv_SYN") == "SYN_RCVD"
          assert next_state("TIME_WAIT", "timeout") == "CLOSED"
          assert next_state("ESTABLISHED", "recv_FIN") == "CLOSE_WAIT"
          for bad in (("CLOSED", "close"), ("LISTEN", "recv_FIN"), ("NOWHERE", "close"), ("ESTABLISHED", "recv_SYN")):
              try:
                  next_state(*bad)
                  assert False, bad
              except ValueError:
                  pass
      - name: whole conversations
        code: |
          client = simulate("CLOSED", ["active_open", "recv_SYN_ACK", "close", "recv_ACK", "recv_FIN", "timeout"])
          assert client == ["CLOSED", "SYN_SENT", "ESTABLISHED", "FIN_WAIT_1", "FIN_WAIT_2", "TIME_WAIT", "CLOSED"]
          server = simulate("CLOSED", ["passive_open", "recv_SYN", "recv_ACK", "recv_FIN", "close", "recv_ACK"])
          assert server == ["CLOSED", "LISTEN", "SYN_RCVD", "ESTABLISHED", "CLOSE_WAIT", "LAST_ACK", "CLOSED"]
          assert simulate("LISTEN", []) == ["LISTEN"]
          try:
              simulate("CLOSED", ["active_open", "recv_FIN"])
              assert False
          except ValueError:
              pass
      - name: abilities
        code: |
          states = ["CLOSED", "LISTEN", "SYN_SENT", "SYN_RCVD", "ESTABLISHED", "FIN_WAIT_1", "FIN_WAIT_2", "CLOSE_WAIT", "LAST_ACK", "TIME_WAIT"]
          assert [s for s in states if is_open(s)] == ["ESTABLISHED"]
          assert [s for s in states if can_send(s)] == ["ESTABLISHED", "CLOSE_WAIT"]
          assert [s for s in states if can_receive(s)] == ["ESTABLISHED", "FIN_WAIT_1", "FIN_WAIT_2"]
    hints:
      - "A dictionary keyed by `(state, event)` pairs holds the whole table; `TABLE.get((state, event))` returns `None` for an illegal pair."
      - "`simulate`: start a list with `[state]`, and for each event call `next_state` and append the result."
      - "The three yes/no functions are just membership tests on small tuples."
    solution: |
      TABLE = {
          ("CLOSED", "passive_open"): "LISTEN",
          ("CLOSED", "active_open"): "SYN_SENT",
          ("LISTEN", "recv_SYN"): "SYN_RCVD",
          ("SYN_SENT", "recv_SYN_ACK"): "ESTABLISHED",
          ("SYN_RCVD", "recv_ACK"): "ESTABLISHED",
          ("ESTABLISHED", "close"): "FIN_WAIT_1",
          ("ESTABLISHED", "recv_FIN"): "CLOSE_WAIT",
          ("FIN_WAIT_1", "recv_ACK"): "FIN_WAIT_2",
          ("FIN_WAIT_2", "recv_FIN"): "TIME_WAIT",
          ("CLOSE_WAIT", "close"): "LAST_ACK",
          ("LAST_ACK", "recv_ACK"): "CLOSED",
          ("TIME_WAIT", "timeout"): "CLOSED",
      }


      def next_state(state, event):
          new = TABLE.get((state, event))
          if new is None:
              raise ValueError(f"{event} is not allowed in {state}")
          return new


      def simulate(state, events):
          visited = [state]
          for event in events:
              state = next_state(state, event)
              visited.append(state)
          return visited


      def is_open(state):
          return state == "ESTABLISHED"


      def can_send(state):
          return state in ("ESTABLISHED", "CLOSE_WAIT")


      def can_receive(state):
          return state in ("ESTABLISHED", "FIN_WAIT_1", "FIN_WAIT_2")
    explanation: |
      Protocol implementations are state machines: a table of what is legal in each state turns a thicket of "if" statements into data you can read and test. Lesson 10.2's process states used the same idea. The `can_send` / `can_receive` split shows TCP's half-close: after `close()` you can no longer send, but the other side may still be sending.

  - id: conversation
    title: Tracing a TCP conversation
    difficulty: 4
    prompt: |
      Write `conversation(client_isn, server_isn, sends)` returning the list of segments as tuples `(sender, flags, seq, ack, length)` for a complete connection, with `sender` `"client"` or `"server"`. All sequence and acknowledgement numbers are modulo 2**32. The segments, in order: (1) client `SYN` with `seq = client_isn`, `ack = 0`; (2) server `SYN+ACK` with `seq = server_isn`, `ack = client_isn + 1`; (3) client `ACK` with `seq = client_isn + 1`, `ack = server_isn + 1`. Then for each `(who, n)` in `sends` with `n > 0`: that side sends a data segment with flags `ACK` carrying `n` bytes (its `seq` is its next sequence number, its `ack` is the next byte it expects from the other side), then the other side sends a pure `ACK` (length 0) acknowledging it; entries with `n == 0` are skipped. Finally the close: client `FIN+ACK`, server `ACK`, server `FIN+ACK`, client `ACK`, each using the current numbers (a FIN uses one sequence number). Raise `ValueError` if `who` is not `"client"` or `"server"`, or `n` is negative.
    starter: |
      def conversation(client_isn, server_isn, sends):
          pass
    tests:
      - name: worked example
        code: |
          assert conversation(100, 500, [("client", 10), ("server", 20)]) == [
              ("client", "SYN", 100, 0, 0),
              ("server", "SYN+ACK", 500, 101, 0),
              ("client", "ACK", 101, 501, 0),
              ("client", "ACK", 101, 501, 10),
              ("server", "ACK", 501, 111, 0),
              ("server", "ACK", 501, 111, 20),
              ("client", "ACK", 111, 521, 0),
              ("client", "FIN+ACK", 111, 521, 0),
              ("server", "ACK", 521, 112, 0),
              ("server", "FIN+ACK", 521, 112, 0),
              ("client", "ACK", 112, 522, 0),
          ]
      - name: no data and zero-length sends
        code: |
          assert conversation(0, 0, []) == [
              ("client", "SYN", 0, 0, 0), ("server", "SYN+ACK", 0, 1, 0), ("client", "ACK", 1, 1, 0),
              ("client", "FIN+ACK", 1, 1, 0), ("server", "ACK", 1, 2, 0), ("server", "FIN+ACK", 1, 2, 0), ("client", "ACK", 2, 2, 0),
          ]
          assert conversation(0, 0, [("client", 0), ("server", 0)]) == conversation(0, 0, [])
      - name: wraparound
        code: |
          t = conversation(2**32 - 1, 2**32 - 5, [("client", 3)])
          assert t[0] == ("client", "SYN", 2**32 - 1, 0, 0)
          assert t[1] == ("server", "SYN+ACK", 2**32 - 5, 0, 0)
          assert t[2] == ("client", "ACK", 0, 2**32 - 4, 0)
          assert t[3] == ("client", "ACK", 0, 2**32 - 4, 3)
          assert t[4] == ("server", "ACK", 2**32 - 4, 3, 0)
      - name: acknowledgements add up
        code: |
          import random
          rng = random.Random(6)
          for _ in range(50):
              c, s = rng.randrange(2**32), rng.randrange(2**32)
              sends = [(rng.choice(["client", "server"]), rng.randint(0, 50)) for _ in range(rng.randint(0, 6))]
              t = conversation(c, s, sends)
              sent = {"client": 0, "server": 0}
              for who, n in sends:
                  sent[who] += n
              fin = t[-4]
              assert fin[1] == "FIN+ACK" and fin[2] == (c + 1 + sent["client"]) % 2**32
              assert t[-1][3] == (s + 2 + sent["server"]) % 2**32 and t[-1][2] == (c + 2 + sent["client"]) % 2**32
      - name: errors
        code: |
          for bad in ([("proxy", 5)], [("client", -1)]):
              try:
                  conversation(1, 2, bad)
                  assert False
              except ValueError:
                  pass
    hints:
      - "Keep two counters: `cnext = client_isn + 1` and `snext = server_isn + 1`, reduced modulo `2**32` every time they change."
      - "A data segment from the client is `(\"client\", \"ACK\", cnext, snext, n)`; afterwards `cnext += n` and the server replies `(\"server\", \"ACK\", snext, cnext, 0)`. The server's case is the mirror image."
      - "Validate the whole `sends` list before building anything, so errors come first."
      - "The close: the FIN consumes one number, so the server's ACK acknowledges `cnext + 1`, and the client's last ACK acknowledges `snext + 1`."
    solution: |
      def conversation(client_isn, server_isn, sends):
          M = 2 ** 32
          for who, n in sends:
              if who not in ("client", "server") or n < 0:
                  raise ValueError("bad send")
          trace = []
          cnext, snext = (client_isn + 1) % M, (server_isn + 1) % M
          trace.append(("client", "SYN", client_isn % M, 0, 0))
          trace.append(("server", "SYN+ACK", server_isn % M, cnext, 0))
          trace.append(("client", "ACK", cnext, snext, 0))
          for who, n in sends:
              if n == 0:
                  continue
              if who == "client":
                  trace.append(("client", "ACK", cnext, snext, n))
                  cnext = (cnext + n) % M
                  trace.append(("server", "ACK", snext, cnext, 0))
              else:
                  trace.append(("server", "ACK", snext, cnext, n))
                  snext = (snext + n) % M
                  trace.append(("client", "ACK", cnext, snext, 0))
          trace.append(("client", "FIN+ACK", cnext, snext, 0))
          trace.append(("server", "ACK", snext, (cnext + 1) % M, 0))
          trace.append(("server", "FIN+ACK", snext, (cnext + 1) % M, 0))
          trace.append(("client", "ACK", (cnext + 1) % M, (snext + 1) % M, 0))
          return trace
    explanation: |
      Wireshark shows exactly this table for every TCP connection. Learning to read `seq` and `ack` is a real debugging skill: a stuck `ack` number tells you which byte the receiver is still missing, and a SYN with no SYN+ACK in reply tells you the server is unreachable or a firewall is dropping the packets.

commonMistakes:
  - title: Thinking an IP address is enough to reach a program
    explanation: |
      The address finds the host. The port finds the program on it. A connection needs both ends' addresses and ports.
  - title: Assuming UDP is just "TCP without the checks" for everything
    explanation: |
      UDP gives no delivery, order or duplicate guarantees. If you need them with UDP, your application must build them.
  - title: Counting segments instead of bytes
    explanation: |
      TCP sequence numbers count bytes. An acknowledgement of 1500 means bytes up to 1499 were received, whatever the segment sizes were.
  - title: Forgetting SYN and FIN use a sequence number
    explanation: |
      Each consumes one number. That is why the handshake's acknowledgement is the ISN plus one even though no data was sent.
  - title: Expecting one send to equal one receive on TCP
    explanation: |
      TCP is a stream with no message boundaries. Two `send` calls may arrive as one `recv`, or one send as several. Applications must mark their own message ends (a length prefix or a delimiter).
  - title: Ignoring wraparound
    explanation: |
      32-bit sequence numbers wrap around. Compare them using differences modulo 2^32, never with a plain `<`.

summary:
  - "**Ports** (16-bit numbers) let a host deliver packets to the right program. A TCP connection is identified by the **4-tuple** of both addresses and both ports."
  - "**UDP** adds ports and a checksum to IP and nothing else: no connection, delivery, order or retransmission. It suits DNS, calls, games and custom protocols."
  - "**TCP** provides a reliable, ordered **byte stream** using **sequence numbers** (counting bytes), **cumulative acknowledgements**, **segmentation** by MSS and **reassembly** by sequence number."
  - "A connection opens with the **three-way handshake** (SYN, SYN+ACK, ACK) and closes with FIN/ACK in each direction. SYN and FIN each consume a sequence number."
  - "Each end follows a **state machine** (`LISTEN`, `SYN_SENT`, `ESTABLISHED`, `FIN_WAIT`, `CLOSE_WAIT`, `TIME_WAIT`, ...), which tools like `ss` display."
  - "Use TCP when completeness matters, and UDP when timeliness and low overhead matter more."
next: |
  TCP promises reliability on an unreliable network. How does it actually notice a lost segment and fix it, and how does it avoid flooding a slow receiver or an overloaded network? That is the next lesson: **retransmission, flow control and congestion control**.

quiz:
  - type: mcq
    question: What identifies one TCP connection uniquely?
    options: [
      "Source address, source port, destination address and destination port",
      "Only the destination port",
      "Only the destination address",
      "The sequence number"
    ]
    answer: 0
    explanation: "The 4-tuple. That is why many clients can connect to the same server port."
  - type: mcq
    question: Which service would most naturally use UDP?
    options: ["A live video call", "Downloading an operating system image", "Sending an email", "Loading a bank's web page"]
    answer: 0
    explanation: "Live media prefers fresh data over perfect data. The others need every byte to arrive correctly."
  - type: mcq
    question: A TCP segment with sequence number 3000 carries 250 bytes of data. What acknowledgement number does the receiver send when it has received it and everything before it?
    options: ["3250", "3000", "251", "3249"]
    answer: 0
    explanation: "The acknowledgement is the number of the next byte expected: 3000 + 250."
  - type: mcq
    question: What does the second step of the three-way handshake (SYN+ACK) acknowledge?
    options: [
      "The client's SYN, with ack = client ISN + 1",
      "The client's data",
      "The server's own SYN",
      "Nothing; it is just a reply"
    ]
    answer: 0
    explanation: "The SYN consumed one sequence number, so it is acknowledged with ISN + 1."
  - type: mcq
    question: A server shows thousands of connections in CLOSE_WAIT. What is the likely cause?
    options: [
      "The program received the other side's FIN but never closed its own socket",
      "The network is too slow",
      "The clients crashed before connecting",
      "UDP is flooding the port"
    ]
    answer: 0
    explanation: "CLOSE_WAIT means the other end finished and the local application has not yet called close."
  - type: mcq
    question: Why does UDP's header contain a length field while UDP has no connections?
    options: [
      "Each datagram is independent and the receiver needs to know where the data ends",
      "Because UDP retransmits lost data",
      "To count the packets",
      "It is unused"
    ]
    answer: 0
    explanation: "UDP preserves datagram boundaries, so each datagram says how long it is."
  - type: code
    question: |
      Write `ack_number(seq, length, syn_or_fin=False)` returning the acknowledgement number a receiver sends after getting a segment with sequence number `seq` carrying `length` bytes of data. A SYN or FIN counts as one extra sequence number. Numbers are modulo 2**32.
    starter: |
      def ack_number(seq, length, syn_or_fin=False):
          pass
    tests:
      - name: acks
        code: |
          assert ack_number(3000, 250) == 3250
          assert ack_number(100, 0, True) == 101
          assert ack_number(2**32 - 1, 0, True) == 0
          assert ack_number(2**32 - 10, 20) == 10
          assert ack_number(5, 0) == 5
    solution: |
      def ack_number(seq, length, syn_or_fin=False):
          return (seq + length + (1 if syn_or_fin else 0)) % 2 ** 32
