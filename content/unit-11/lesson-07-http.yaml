  - type: code
    question: |
      Write `status_class(code)` returning `"success"` for 200-299, `"redirect"` for 300-399, `"client error"` for 400-499, `"server error"` for 500-599, and `"other"` for anything else.
    starter: |
      def status_class(code):
          pass
    tests:
      - name: classes
        code: |
          assert status_class(200) == "success" and status_class(204) == "success"
          assert status_class(301) == "redirect" and status_class(304) == "redirect"
          assert status_class(404) == "client error" and status_class(429) == "client error"
          assert status_class(500) == "server error" and status_class(503) == "server error"
          assert status_class(101) == "other" and status_class(0) == "other" and status_class(600) == "other"
    solution: |
      def status_class(code):
          if 200 <= code < 300:
              return "success"
          if 300 <= code < 400:
              return "redirect"
          if 400 <= code < 500:
              return "client error"
          if 500 <= code < 600:
              return "server error"
          return "other"
