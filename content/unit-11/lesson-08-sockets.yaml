id: u11-sockets
title: "Sockets, Clients and Servers"
minutes: 65
objective: |
  Learn how programs actually use the network: the socket API with its bind, listen, accept, connect, send and receive calls. Understand why TCP gives you a stream with no message boundaries and how to frame messages, how a server handles many clients, and how to write clients that survive failures with timeouts, retries, backoff and rate limits. Everything is practised on a simulated network.
outcomes:
  - Describe the socket lifecycle for a TCP server and client
  - Explain why a TCP stream has no message boundaries, and frame messages with length prefixes or delimiters
  - Build and test an in-memory network with listening, connecting, sending, receiving and closing
  - Design a simple line-based chat protocol as a state machine
  - Write a client that retries with exponential backoff, and a token-bucket rate limiter
  - Compare threads, event loops and asynchronous I/O for serving many clients

sections:
  - heading: The socket API
    body: |
      A **socket** is the operating system's handle for one end of a network conversation (Lesson 10.1 called such handles file descriptors; a socket is one). Every network program, from a browser to a game server, is built on this small API, which first appeared in Berkeley Unix in 1983.

      **A TCP server** goes through these steps:

      1. `socket()` creates a socket.
      2. `bind(address, port)` attaches it to a local address and port, such as `("0.0.0.0", 8080)`, where `0.0.0.0` means "any of my addresses". If the port is already taken the call fails with "address already in use".
      3. `listen()` turns it into a **listening socket** and starts a queue (the **backlog**) of connections waiting to be accepted.
      4. `accept()` takes the next waiting connection and returns a **new socket** for it, plus the client's address. The listening socket keeps listening; each client gets its own connected socket.
      5. `recv(n)` and `send(data)` move bytes. `close()` finishes.

      **A TCP client** is shorter: `socket()`, `connect((host, port))` (which performs the three-way handshake of Lesson 11.4), then `send` and `recv`, then `close`. The client never calls `bind`: the OS picks an **ephemeral port** for it.

      A **UDP** socket skips the connection: it uses `sendto(data, address)` and `recvfrom(n)`, and each call is one datagram.

      Our browser-based Python cannot open real sockets, so in this lesson you will build a **simulated network** with the same shape of API. The code you write in the exercises has the same logic as the real thing.

  - heading: A stream has no message boundaries
    body: |
      This is the most important fact about TCP programming. TCP delivers a **stream of bytes**, not messages. If a client calls `send(b"hello")` and then `send(b"world")`, the server's `recv(100)` might return `b"helloworld"`, or `b"hello"` then `b"world"`, or `b"hel"` then `b"loworld"`. The network may split and merge data in any way, and it can differ from run to run. Code that assumes "one send equals one recv" works on a developer's laptop and fails in production.

      Two things follow.

      - `recv(n)` returns **up to** `n` bytes: whatever has arrived, at least one byte. It returns an **empty** `b""` only when the other side has closed the connection (**end of file**). To read exactly `n` bytes you must loop.
      - Your protocol must mark **where messages end**. The usual methods are:
        - **Delimiter**: messages end with a special byte, typically a newline (`\n`), as in HTTP headers, SMTP and Redis. Simple to read and debug; the data cannot contain the delimiter without escaping.
        - **Length prefix**: each message begins with its length, for example 4 bytes in network byte order, then that many bytes. Works for binary data; the reader needs to buffer partial messages.
        - **Fixed size**, or closing the connection to mean "done" (HTTP/1.0 did that).

      The receiving side keeps a **buffer**: append every `recv` result, and repeatedly extract any complete messages from the front, keeping the incomplete remainder for next time. Always **cap the length** you will accept: a hostile client can announce a four-gigabyte message to exhaust your memory.

  - heading: Serving many clients
    body: |
      A basic server handles one client at a time: while it is talking to one connection, others wait in the backlog. Real servers need concurrency, and there are three classic designs (using ideas from Unit 10):

      - **A thread (or process) per connection.** The simplest to write: each connection has its own code path that can block freely. It costs memory (a stack per thread) and scheduling overhead, so a few thousand connections is the limit.
      - **An event loop with non-blocking sockets.** One thread asks the OS, with `select`, `poll` or `epoll`, "which of my sockets are ready to read or write?", and handles each ready one briefly without waiting. This is how nginx and Redis serve tens of thousands of connections on one thread. The cost is that the code is split into pieces driven by events.
      - **Asynchronous I/O (`async`/`await`).** A language-level version of the event loop where `await conn.read()` suspends only that task. Python's `asyncio`, JavaScript's `await` and Rust's `tokio` are of this kind. This is the generator machinery from Lesson 10.4, with a loop that resumes tasks when their I/O is ready.

      In our simulation `recv` returns `None` when nothing has arrived yet, instead of waiting: a non-blocking socket. The event-loop idea then becomes visible, since the program has to check again later.

  - heading: Designing a protocol
    body: |
      A **protocol** is the agreement between client and server about what messages exist and what they mean. Text protocols (HTTP/1.1, SMTP, IRC) are easy to try by hand with `telnet` or `nc` and to debug. Binary protocols (DNS, TCP itself, gRPC) are compact and fast to parse. When you design one:

      - Decide the **framing** first.
      - Define every message and every error. A server must reply to nonsense with a clear error, never crash.
      - Be **strict in what you send, careful in what you accept**: validate everything that arrives, since the bytes come from strangers (Unit 16).
      - Include a **version** so the protocol can change.
      - Think about **state**: what messages are legal now? (Lesson 11.4's TCP state machine, and the chat server in this lesson's exercises.)

  - heading: Failure is normal
    body: |
      Networks fail constantly: connections are refused (nobody is listening), reset (the other side crashed), or simply go silent. A robust client assumes failure.

      - Set a **timeout** on every network call. A call with no timeout can block forever.
      - **Retry** failures that are likely to be temporary (timeouts, connection resets, 503 responses), but never retry blindly something that is not **idempotent** (Lesson 11.7).
      - Use **exponential backoff**: wait 0.5 s, then 1 s, 2 s, 4 s, capped at some maximum, so that a recovering server is not buried under retries from thousands of clients at once. Add **random jitter** in real systems so that clients do not retry in lockstep.
      - Give up after a bounded number of attempts and report the error.

      Servers protect themselves with **rate limiting**. The classic algorithm is the **token bucket**: a bucket holds up to *capacity* tokens and is refilled at a steady *rate* per second; each request removes a token, and a request that finds the bucket empty is refused (HTTP 429 Too Many Requests). It allows short **bursts** up to the capacity while enforcing the long-run average rate.

examples:
  - title: A real TCP echo server and client
    intro: "This is the genuine socket API in Python. It needs a real operating system, so read it here and run it on your own computer."
    runnable: false
    code: |
      import socket


      def serve(port=8080):
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(("0.0.0.0", port))
              server.listen()
              while True:
                  conn, addr = server.accept()              # blocks until a client connects
                  with conn:
                      print("connection from", addr)
                      while True:
                          data = conn.recv(4096)            # up to 4096 bytes
                          if not data:                      # b"" means the client closed
                              break
                          conn.sendall(data)                # send everything back


      def client(host="127.0.0.1", port=8080):
          with socket.create_connection((host, port), timeout=5) as conn:
              conn.sendall(b"hello")
              print(conn.recv(4096))
    lines:
      - line: 6
        note: "AF_INET is IPv4 and SOCK_STREAM means TCP. A SOCK_DGRAM socket would be UDP."
      - line: 7
        note: "Allows restarting the server immediately without 'address already in use'."
      - line: 10
        note: "The backlog queue now holds clients that finished the handshake and are waiting for accept."
      - line: 12
        note: "accept returns a brand new socket for this client. The listening socket continues listening."
      - line: 19
        note: "sendall keeps sending until all the bytes are gone. A plain send may send only part."
      - line: 24
        note: "create_connection resolves the name (DNS, Lesson 11.6), connects (Lesson 11.4) and applies a timeout."
  - title: A simulated network
    intro: "The same lifecycle on an in-memory network. `recv` returns None when no data has arrived yet, standing in for blocking."
    code: |
      class Net:
          def __init__(self):
              self.listeners = {}
              self.next_port = 49152

          def listen(self, host, port):
              if (host, port) in self.listeners:
                  raise OSError("address already in use")
              self.listeners[(host, port)] = []            # the backlog: connections waiting for accept
              return (host, port)

          def connect(self, client_host, host, port):
              if (host, port) not in self.listeners:
                  raise ConnectionRefusedError(f"nobody is listening on {host}:{port}")
              client = Conn((client_host, self.next_port))
              server = Conn((host, port))
              self.next_port += 1
              client.peer, server.peer = server, client
              self.listeners[(host, port)].append(server)
              return client

          def accept(self, listener):
              backlog = self.listeners[listener]
              return backlog.pop(0) if backlog else None


      class Conn:
          def __init__(self, address):
              self.address, self.peer, self.buffer, self.closed = address, None, b"", False

          def send(self, data):
              self.peer.buffer += data
              return len(data)

          def recv(self, n):
              if self.buffer:
                  data, self.buffer = self.buffer[:n], self.buffer[n:]
                  return data
              return b"" if self.peer.closed else None


      net = Net()
      server_addr = net.listen("10.0.0.1", 7)
      client = net.connect("10.0.0.2", "10.0.0.1", 7)
      print("client talks from", client.address)
      conn = net.accept(server_addr)
      print("server accepted a connection from", conn.peer.address)
      print("nothing received yet:", conn.recv(100))
      client.send(b"hello")
      client.send(b"world")
      print("one recv gets both sends:", conn.recv(100))
      client.send(b"abcdef")
      print("a short recv gets part:", conn.recv(3), conn.recv(3))
      client.closed = True
      print("after the client closes:", conn.recv(10))
      try:
          net.connect("10.0.0.2", "10.0.0.1", 8)
      except ConnectionRefusedError as error:
          print("refused:", error)
    output: |
      client talks from ('10.0.0.2', 49152)
      server accepted a connection from ('10.0.0.2', 49152)
      nothing received yet: None
      one recv gets both sends: b'helloworld'
      a short recv gets part: b'abc' b'def'
      after the client closes: b''
      refused: nobody is listening on 10.0.0.1:8
    lines:
      - line: 17
        note: "The new connected socket is queued until the server calls accept."
      - line: 41
        note: "Two sends were merged: the stream has no memory of where each send ended."
      - line: 49
        note: "Once the buffer is empty and the peer has closed, recv returns b'' (end of file)."
  - title: Framing messages
    intro: "A delimiter and a length prefix, each with a receive buffer that copes with partial and merged data."
    code: |
      import struct


      def split_lines(buffer):
          *lines, rest = buffer.split(b"\n")
          return lines, rest


      buffer = b""
      for chunk in (b"HEL", b"LO\nWOR", b"LD\nPING\nhalf a li"):
          buffer += chunk
          lines, buffer = split_lines(buffer)
          print(f"received {chunk!r:22} -> complete messages {lines}, waiting with {buffer!r}")

      print()


      def frame(message):
          return struct.pack(">I", len(message)) + message


      stream = frame(b"first") + frame(b"") + frame(b"third message")
      print(stream)
      buffer, messages = b"", []
      for i in range(0, len(stream), 5):                 # the network delivers 5 bytes at a time
          buffer += stream[i:i + 5]
          while len(buffer) >= 4:
              (size,) = struct.unpack(">I", buffer[:4])
              if len(buffer) < 4 + size:
                  break
              messages.append(buffer[4:4 + size])
              buffer = buffer[4 + size:]
      print(messages)
    output: |
      received b'HEL'                 -> complete messages [], waiting with b'HEL'
      received b'LO\nWOR'             -> complete messages [b'HELLO'], waiting with b'WOR'
      received b'LD\nPING\nhalf a li' -> complete messages [b'WORLD', b'PING'], waiting with b'half a li'

      b'\x00\x00\x00\x05first\x00\x00\x00\x00\x00\x00\x00\rthird message'
      [b'first', b'', b'third message']
    lines:
      - line: 5
        note: "Splitting on the delimiter leaves the unfinished piece as the last item. Keep it for next time."
      - line: 14
        note: "Whatever the chunk sizes were, the same messages come out."
      - line: 17
        note: "4 bytes of length in network byte order, then the message."
      - line: 28
        note: "Wait until the whole message has arrived before cutting it out of the buffer."
  - title: Retrying with exponential backoff
    intro: "A flaky operation, a bounded number of attempts, and growing pauses between them. The pauses are recorded instead of slept."
    code: |
      def retry(op, attempts=4, base=0.5, factor=2, max_delay=4.0):
          delays = []
          for attempt in range(attempts):
              try:
                  return op(attempt), delays
              except (TimeoutError, ConnectionError) as error:
                  print(f"   attempt {attempt + 1} failed: {error}")
                  if attempt == attempts - 1:
                      raise
                  delays.append(min(max_delay, base * factor ** attempt))


      def flaky(fail_times):
          def op(attempt):
              if attempt < fail_times:
                  raise TimeoutError("no reply")
              return "OK"
          return op


      print(retry(flaky(0)))
      print(retry(flaky(2)))
      print(retry(flaky(3), attempts=6, base=1, max_delay=2))
      try:
          retry(flaky(10))
      except TimeoutError:
          print("gave up")
    output: |
      ('OK', [])
         attempt 1 failed: no reply
         attempt 2 failed: no reply
      ('OK', [0.5, 1.0])
         attempt 1 failed: no reply
         attempt 2 failed: no reply
         attempt 3 failed: no reply
      ('OK', [1, 2, 2])
         attempt 1 failed: no reply
         attempt 2 failed: no reply
         attempt 3 failed: no reply
         attempt 4 failed: no reply
      gave up
    lines:
      - line: 6
        note: "Only errors that are likely to be temporary are retried. Any other exception passes straight through."
      - line: 10
        note: "The wait doubles each time, up to a ceiling: 0.5, 1, 2, 4, 4, ..."
  - title: A token bucket
    intro: "A steady refill, a burst allowance, and a refusal when the bucket is empty."
    code: |
      class TokenBucket:
          def __init__(self, capacity, rate):
              self.capacity, self.rate = capacity, rate
              self.tokens, self.last = capacity, None

          def allow(self, now):
              if self.last is not None:
                  self.tokens = min(self.capacity, self.tokens + (now - self.last) * self.rate)
              self.last = now
              if self.tokens >= 1:
                  self.tokens -= 1
                  return True
              return False


      bucket = TokenBucket(capacity=3, rate=1)           # a burst of 3, then 1 request per second
      times = [0, 0, 0, 0, 0.5, 1, 1.5, 2, 10, 10, 10, 10]
      print([int(bucket.allow(t)) for t in times])
    output: |
      [1, 1, 1, 0, 0, 1, 0, 1, 1, 1, 1, 0]
    lines:
      - line: 7
        note: "Add the tokens earned since the last request, but never beyond the capacity."
      - line: 19
        note: "At time 0 the burst of 3 passes and the 4th is refused. After a long quiet time the bucket is full again."

