  - type: code
    question: |
      Write `allowed(rules, port)` for a firewall that lists rules as `(action, port)` pairs, where `action` is `"allow"` or `"deny"`. The first rule whose port equals `port` decides. If no rule matches the answer is `False`. Return `True` for allow and `False` for deny.
    starter: |
      def allowed(rules, port):
          pass
    tests:
      - name: first match
        code: |
          rules = [("deny", 22), ("allow", 22), ("allow", 443)]
          assert allowed(rules, 22) is False
          assert allowed(rules, 443) is True
          assert allowed(rules, 80) is False
          assert allowed([], 80) is False
    solution: |
      def allowed(rules, port):
          for action, rule_port in rules:
              if rule_port == port:
                  return action == "allow"
          return False
