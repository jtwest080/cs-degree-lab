title: Mini Network Toolkit
brief: |
  You are building the **toolkit of a small network operator**: it answers questions about subnets, forwards packets with a routing table, resolves names through a caching resolver, reassembles a TCP byte stream that arrives out of order, and takes URLs apart. It reads a script from `network.txt` (created for you each time you run) and prints a report. Blank lines and lines starting with `#` are ignored. The commands are:

  - `route CIDR NEXT_HOP`: add an entry to the forwarding table.
  - `record NAME ADDRESS TTL`: a name the authoritative servers know, and the TTL they give it.
  - `at SECONDS`: set the current time (it starts at 0).
  - `subnet CIDR`, `forward ADDRESS`, `dns NAME`: ask a question.
  - `stream ISN MSS ORDER TEXT`: send TEXT as a stream whose first byte has sequence number ISN, cut it into segments of MSS bytes, deliver only the segments listed in ORDER (comma-separated segment numbers, counting from 0, in the order they arrive; repeats are allowed), and report what the receiver can read.
  - `url URL`: parse a URL.

  **Exact requirements** (the tests check each piece on its own, including random cases):

  - `ip_to_int`, `int_to_ip` and `percent_decode` are given.
  - `subnet_info(cidr)`: return `(network, netmask, broadcast, usable_hosts)`. (Lesson 11.2)
  - `lookup(table, ip)`: longest-prefix match over a list of `(cidr, next_hop)`; `None` if nothing matches; the first entry wins a tie. (Lesson 11.2)
  - `DnsCache`: `put(name, ip, ttl, now)`, `put_negative(name, ttl, now)`, `get(name, now)` returning `("hit", ip)`, `("nxdomain", None)` or `("miss", None)`, and `remaining(name, now)`. Names are case-insensitive and an entry is valid while `now < now_when_stored + ttl`. (Lesson 11.6)
  - `segment(data, mss, isn)` and `reassemble(segments, isn)` for bytes, with 32-bit wraparound. (Lesson 11.4)
  - `parse_url(url)`: return `(scheme, host, port, path, query)`. (Lesson 11.7)
  - `process(text)` carries out the commands and returns the output lines. `main()` prints each line for `network.txt`:

  ```text
  Subnet 192.168.1.128/26: mask 255.255.255.192, broadcast 192.168.1.191, 62 usable hosts
  Subnet 10.0.0.0/8: mask 255.0.0.0, broadcast 10.255.255.255, 16777214 usable hosts
  Subnet 172.16.5.8/30: mask 255.255.255.252, broadcast 172.16.5.11, 2 usable hosts
  10.1.2.7 -> lab
  10.1.9.9 -> branch
  10.200.0.1 -> core
  192.168.1.1 -> office
  8.8.8.8 -> no route
  t=0 example.com -> 93.184.216.34 (looked up, ttl 60)
  t=10 example.com -> 93.184.216.34 (cached, 50s left)
  t=10 missing.example.com -> NXDOMAIN (looked up)
  t=25 missing.example.com -> NXDOMAIN (cached, 15s left)
  t=70 example.com -> 93.184.216.34 (looked up, ttl 60)
  t=70 www.example.com -> 93.184.216.35 (looked up, ttl 120)
  Stream: 'Hello, world!' complete, next seq 1013
  Stream: 'Hello' incomplete, next seq 1005
  Stream: 'Wrap around' complete, next seq 5
  URL: https example.com:8443/search query={'q': ['café au lait'], 'page': ['2']}
  URL: http example.com:80/ query={}
  Bad URL: ftp://example.com/file
  Bad URL: http://example.com:99999/
  ```

  The last line of the program calls `main()`. In the `dns` lines, a fresh answer says `looked up` and a cached one says `cached`; both show the time `t=` and the lower-cased name. A bad URL prints `Bad URL: ` followed by the URL.
prelude: |
  # Creates network.txt fresh before every run.
  with open("network.txt", "w") as _f:
      _f.write("# A mini network session\nroute 10.0.0.0/8 core\nroute 10.1.0.0/16 branch\nroute 10.1.2.0/24 lab\nroute 192.168.0.0/16 office\n\nrecord example.com 93.184.216.34 60\nrecord www.example.com 93.184.216.35 120\n\nsubnet 192.168.1.130/26\nsubnet 10.0.0.0/8\nsubnet 172.16.5.9/30\n\nforward 10.1.2.7\nforward 10.1.9.9\nforward 10.200.0.1\nforward 192.168.1.1\nforward 8.8.8.8\n\nat 0\ndns example.com\nat 10\ndns example.com\ndns missing.example.com\nat 25\ndns missing.example.com\nat 70\ndns Example.COM\ndns www.example.com\n\nstream 1000 5 0,2,1 Hello, world!\nstream 1000 5 0,2 Hello, world!\nstream 4294967290 4 2,0,1,2 Wrap around\n\nurl https://Example.com:8443/search?q=caf%C3%A9+au+lait&page=2#top\nurl http://example.com\nurl ftp://example.com/file\nurl http://example.com:99999/\n")
  del _f
steps:
- title: Addresses and subnets
  body: Use the given `ip_to_int` and `int_to_ip`. The mask is `(0xFFFFFFFF << (32 - p)) & 0xFFFFFFFF`; the network is `ip & mask`; the broadcast is `network | (~mask & 0xFFFFFFFF)`. Remember the special counts for /31 and /32 (Lesson 11.2).
- title: Forwarding
  body: Loop over the table and keep the entry with the longest prefix that contains the address. Use `>` (not `>=`) when comparing prefix lengths so that the first of two equal prefixes wins (Lesson 11.2).
- title: The DNS cache
  body: Store `(kind, value, expires)` per lower-cased name, as in Lesson 11.6. An entry is valid while `now < expires`; a ttl of 0 stores nothing. `remaining` returns the whole seconds left.
- title: Streams
  body: '`segment` is a range loop over the byte offsets. For `reassemble`, sort the segments by `(seq - isn) % 2**32`, stop at the first gap, and append only the bytes you do not already have (Lesson 11.4).'
- title: URLs
  body: Take off the fragment first, then the query, then split the host part from the path (Lesson 11.7). Decode keys and values with `percent_decode(..., True)`. Raise `ValueError` for bad input.
- title: Commands and output
  body: '`process` keeps the route table, the DNS records, a `DnsCache` and the current time `now` while it reads the lines in order. A `dns` lookup first asks the cache, and only on a miss looks in the records, caching the answer (or an NXDOMAIN for 30 seconds). Print the wording shown in the expected output exactly.'
