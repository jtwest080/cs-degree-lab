# Terms introduced in Unit 12 (Databases). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Database"
    definition: "An organised collection of data stored so that it can be searched, changed and shared safely."
    lesson: u12-relational
  - term: "DBMS"
    definition: "Database management system: the program that stores data, enforces rules, handles many users and answers queries."
    lesson: u12-relational
  - term: "Relational database"
    definition: "A database that stores all data in tables of rows and columns related by keys."
    lesson: u12-relational
  - term: "SQL"
    definition: "Structured Query Language, the standard declarative language for working with relational databases."
    lesson: u12-relational
  - term: "SQLite"
    definition: "A small database engine stored in a single file and built into many applications; used throughout this unit."
    lesson: u12-relational
  - term: "Declarative language"
    definition: "A language where you describe the result you want rather than the steps to get it."
    lesson: u12-relational
  - term: "Table"
    definition: "A named collection of rows that all have the same columns; one kind of thing."
    lesson: u12-relational
  - term: "Row"
    definition: "One record in a table, describing one particular thing."
    lesson: u12-relational
  - term: "Column"
    definition: "One named, typed property of the things in a table."
    lesson: u12-relational
  - term: "Schema"
    definition: "The definition of a database's tables, columns, types, keys and constraints, as opposed to its current data."
    lesson: u12-relational
  - term: "Primary key"
    definition: "A column or columns whose value is unique and never missing for every row, giving the row its identity."
    lesson: u12-relational
  - term: "Foreign key"
    definition: "A column that holds the primary key of a row in another table, linking the two."
    lesson: u12-relational
  - term: "Composite key"
    definition: "A primary key made of more than one column."
    lesson: u12-relational
  - term: "Query"
    definition: "A request written in SQL that returns a result set."
    lesson: u12-relational
  - term: "Result set"
    definition: "The table of rows a query returns."
    lesson: u12-relational
  - term: "SELECT"
    definition: "The SQL statement that reads data and chooses which columns to return."
    lesson: u12-relational
  - term: "WHERE"
    definition: "The clause that keeps only rows for which a condition is true."
    lesson: u12-relational
  - term: "ORDER BY"
    definition: "The clause that sorts a result."
    lesson: u12-relational
  - term: "LIMIT"
    definition: "The clause that keeps only the first rows of a result."
    lesson: u12-relational
  - term: "DISTINCT"
    definition: "A keyword that removes duplicate rows from a result."
    lesson: u12-relational
  - term: "Alias"
    definition: "A temporary name given to a column or table in a query with AS."
    lesson: u12-relational
  - term: "NULL"
    definition: "The SQL value meaning missing or unknown; it is not zero and not an empty string."
    lesson: u12-relational
  - term: "Three-valued logic"
    definition: "SQL's logic in which a condition can be true, false or unknown, with WHERE keeping only true rows."
    lesson: u12-relational
  - term: "COALESCE"
    definition: "A function returning the first of its arguments that is not NULL."
    lesson: u12-relational
  - term: "LIKE"
    definition: "A comparison matching text against a pattern in which % means any run of characters and _ means one character."
    lesson: u12-filtering
  - term: "IN"
    definition: "An operator that tests whether a value equals any value in a list or subquery result."
    lesson: u12-filtering
  - term: "BETWEEN"
    definition: "An operator testing whether a value lies in a range, including both ends."
    lesson: u12-filtering
  - term: "CASE expression"
    definition: "An expression that returns the value for the first condition that is true, like an if statement inside a query."
    lesson: u12-filtering
  - term: "Integer division"
    definition: "Division of two integers that discards the fraction, so 7 / 2 is 3 in SQLite."
    lesson: u12-filtering
  - term: "ISO date"
    definition: "A date written as YYYY-MM-DD, which sorts correctly as text."
    lesson: u12-filtering
  - term: "Inner join"
    definition: "A join that keeps only the pairs of rows that satisfy the condition."
    lesson: u12-joins
  - term: "Left join"
    definition: "A join that keeps every row of the left table, filling the right side with NULL where nothing matches."
    lesson: u12-joins
  - term: "Cross join"
    definition: "A join that pairs every row of one table with every row of another."
    lesson: u12-joins
  - term: "Self join"
    definition: "Joining a table to itself, using two aliases."
    lesson: u12-joins
  - term: "Anti-join"
    definition: "A query that finds rows with no match in another table, using LEFT JOIN with IS NULL or NOT EXISTS."
    lesson: u12-joins
  - term: "Link table"
    definition: "A table that connects two others to represent a many-to-many relationship."
    lesson: u12-joins
  - term: "One-to-many relationship"
    definition: "A relationship where one row of a table relates to many rows of another, stored as a foreign key on the many side."
    lesson: u12-joins
  - term: "Many-to-many relationship"
    definition: "A relationship where rows on both sides can relate to many on the other, stored with a link table."
    lesson: u12-joins
  - term: "Qualified name"
    definition: "A column name written with its table, such as student.id, to avoid ambiguity."
    lesson: u12-joins
  - term: "Aggregate function"
    definition: "A function such as COUNT, SUM, AVG, MIN or MAX that collapses many rows into one value."
    lesson: u12-aggregation
  - term: "GROUP BY"
    definition: "A clause that sorts rows into groups so aggregates are computed per group."
    lesson: u12-aggregation
  - term: "HAVING"
    definition: "A clause that filters groups after aggregation."
    lesson: u12-aggregation
  - term: "Window function"
    definition: "A function used with OVER that computes a value across related rows without collapsing them."
    lesson: u12-aggregation
  - term: "RANK"
    definition: "A window function that numbers rows in order, giving ties the same number and skipping ahead."
    lesson: u12-aggregation
  - term: "Running total"
    definition: "A sum that includes every row up to the current one in a given order."
    lesson: u12-aggregation
  - term: "Order of evaluation"
    definition: "The sequence in which a database applies the parts of a query: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT."
    lesson: u12-aggregation
  - term: "Subquery"
    definition: "A SELECT written inside another statement, in parentheses."
    lesson: u12-subqueries
  - term: "Scalar subquery"
    definition: "A subquery that returns a single value."
    lesson: u12-subqueries
  - term: "Correlated subquery"
    definition: "A subquery that refers to a column of the outer query and so is evaluated for each outer row."
    lesson: u12-subqueries
  - term: "EXISTS"
    definition: "An operator that is true when its subquery returns at least one row."
    lesson: u12-subqueries
  - term: "Common table expression"
    definition: "A named subquery defined with WITH for use in one statement."
    lesson: u12-subqueries
  - term: "Recursive query"
    definition: "A common table expression that refers to itself to repeat a step until nothing new appears."
    lesson: u12-subqueries
  - term: "INTERSECT"
    definition: "A set operation returning rows that appear in both results."
    lesson: u12-subqueries
  - term: "EXCEPT"
    definition: "A set operation returning rows of the first result that are not in the second."
    lesson: u12-subqueries
  - term: "CRUD"
    definition: "The four basic data operations: create, read, update, delete."
    lesson: u12-modifying
  - term: "INSERT"
    definition: "The statement that adds rows to a table."
    lesson: u12-modifying
  - term: "UPDATE"
    definition: "The statement that changes values in existing rows."
    lesson: u12-modifying
  - term: "DELETE"
    definition: "The statement that removes rows from a table."
    lesson: u12-modifying
  - term: "Constraint"
    definition: "A rule the database enforces on every change, such as NOT NULL, UNIQUE or CHECK."
    lesson: u12-modifying
  - term: "NOT NULL"
    definition: "A constraint requiring a column to always have a value."
    lesson: u12-modifying
  - term: "UNIQUE"
    definition: "A constraint forbidding two rows from having the same value in a column."
    lesson: u12-modifying
  - term: "CHECK constraint"
    definition: "A constraint requiring a condition on the row to hold."
    lesson: u12-modifying
  - term: "Default value"
    definition: "The value a column gets when an insert does not provide one."
    lesson: u12-modifying
  - term: "Referential integrity"
    definition: "The guarantee that every foreign key points at a row that exists."
    lesson: u12-modifying
  - term: "Cascade"
    definition: "A rule that deletes or updates referencing rows automatically when the referenced row changes."
    lesson: u12-modifying
  - term: "Type affinity"
    definition: "SQLite's flexible typing, where a column prefers a type but accepts others."
    lesson: u12-modifying
  - term: "ALTER TABLE"
    definition: "A statement that changes the structure of an existing table."
    lesson: u12-modifying
  - term: "View"
    definition: "A saved, named query that behaves like a table but stores no data of its own."
    lesson: u12-modifying
  - term: "Migration"
    definition: "A numbered script that moves a database schema from one version to the next."
    lesson: u12-modifying
  - term: "Entity"
    definition: "A kind of thing a database must remember, which usually becomes a table."
    lesson: u12-design
  - term: "ER diagram"
    definition: "A diagram of entities as boxes and their relationships as lines."
    lesson: u12-design
  - term: "Cardinality"
    definition: "How many rows on one side of a relationship can relate to one row on the other."
    lesson: u12-design
  - term: "Surrogate key"
    definition: "A meaningless identifier invented by the database, such as an auto-assigned number."
    lesson: u12-design
  - term: "Natural key"
    definition: "A real-world identifier used as a key, such as a course code."
    lesson: u12-design
  - term: "Redundancy"
    definition: "The same fact stored in more than one place."
    lesson: u12-design
  - term: "Update anomaly"
    definition: "A problem where changing a repeated fact in some rows but not others leaves the data inconsistent."
    lesson: u12-design
  - term: "Insert anomaly"
    definition: "A problem where a fact cannot be stored until some unrelated fact exists."
    lesson: u12-design
  - term: "Delete anomaly"
    definition: "A problem where deleting one fact accidentally destroys another."
    lesson: u12-design
  - term: "Functional dependency"
    definition: "A rule that equal values of A always come with equal values of B, written A → B."
    lesson: u12-design
  - term: "Normalization"
    definition: "Restructuring tables to remove redundancy so that each fact is stored once."
    lesson: u12-design
  - term: "First normal form"
    definition: "The rule that every cell holds a single atomic value."
    lesson: u12-design
  - term: "Second normal form"
    definition: "First normal form plus no column depending on only part of a composite key."
    lesson: u12-design
  - term: "Third normal form"
    definition: "Second normal form plus no non-key column depending on another non-key column."
    lesson: u12-design
  - term: "Transitive dependency"
    definition: "A dependency of a column on the key through another non-key column."
    lesson: u12-design
  - term: "Denormalization"
    definition: "Deliberately copying data to avoid joins and speed up reads."
    lesson: u12-design
  - term: "Lossless decomposition"
    definition: "Splitting a table so that joining the parts gives back exactly the original rows."
    lesson: u12-design
  - term: "Transaction"
    definition: "A group of statements that either all take effect or none do."
    lesson: u12-transactions
  - term: "COMMIT"
    definition: "The statement that makes a transaction's changes permanent."
    lesson: u12-transactions
  - term: "ROLLBACK"
    definition: "The statement that undoes all changes made in the current transaction."
    lesson: u12-transactions
  - term: "Savepoint"
    definition: "A marked point inside a transaction to which you can roll back without ending the transaction."
    lesson: u12-transactions
  - term: "ACID"
    definition: "The four guarantees of transactions: atomicity, consistency, isolation, durability."
    lesson: u12-transactions
  - term: "Atomicity"
    definition: "The guarantee that all of a transaction's changes happen or none do."
    lesson: u12-transactions
  - term: "Isolation"
    definition: "The guarantee that concurrent transactions do not see each other's unfinished work."
    lesson: u12-transactions
  - term: "Durability"
    definition: "The guarantee that a committed change survives crashes."
    lesson: u12-transactions
  - term: "Dirty read"
    definition: "Reading data another transaction has changed but not yet committed."
    lesson: u12-transactions
  - term: "Non-repeatable read"
    definition: "Getting a different value when reading the same row twice in one transaction."
    lesson: u12-transactions
  - term: "Phantom read"
    definition: "A repeated query returning a new row that another transaction added."
    lesson: u12-transactions
  - term: "Lost update"
    definition: "A concurrency bug in which one transaction overwrites another's change."
    lesson: u12-transactions
  - term: "Isolation level"
    definition: "A setting that chooses how strongly concurrent transactions are kept apart."
    lesson: u12-transactions
  - term: "MVCC"
    definition: "Multiversion concurrency control: readers see a consistent snapshot while writers create new versions."
    lesson: u12-transactions
  - term: "Write-ahead log"
    definition: "A log of changes written to disk before the data files are changed, used for recovery."
    lesson: u12-transactions
  - term: "B-tree"
    definition: "A balanced, sorted tree with many keys per node, used for database indexes."
    lesson: u12-indexes
  - term: "Table scan"
    definition: "Reading every row of a table to answer a query."
    lesson: u12-indexes
  - term: "Query planner"
    definition: "The part of a database that chooses how to execute a query."
    lesson: u12-indexes
  - term: "Query plan"
    definition: "The steps the database will use to run a query, shown by EXPLAIN."
    lesson: u12-indexes
  - term: "Composite index"
    definition: "An index on several columns, useful for queries that use its leftmost columns."
    lesson: u12-indexes
  - term: "Covering index"
    definition: "An index that contains every column a query needs, so the table is never read."
    lesson: u12-indexes
  - term: "Selectivity"
    definition: "How small a fraction of the table a condition matches; high selectivity makes indexes useful."
    lesson: u12-indexes
  - term: "SQL injection"
    definition: "An attack that changes a query's meaning by smuggling SQL through user input pasted into the query text."
    lesson: u12-indexes
  - term: "Parameterized query"
    definition: "A query sent with placeholders and the values supplied separately, so values are never read as SQL."
    lesson: u12-indexes
  - term: "Prepared statement"
    definition: "A query compiled once with placeholders and run many times with different values."
    lesson: u12-indexes
