sections:
  - heading: Why databases?
    body: |
      So far your programs kept data in variables and, at best, in files. That works for a to-do list. It stops working when many people use the data at once, when the data is far bigger than memory, when a crash must never leave it half-written, or when you need to answer questions such as "which students got an A in a course taught by the Computer Science department?" without writing a new program each time.

      A **database** is an organised collection of data. A **database management system (DBMS)** is the program that looks after it: it stores the data safely on disk, lets many users read and change it at once without corrupting it, keeps it consistent by enforcing rules, finds things quickly using indexes, and answers questions written in a **query language**. Well-known systems are PostgreSQL, MySQL, SQL Server, Oracle and **SQLite**, a tiny one that lives in a single file and is built into phones, browsers and your operating system. This unit uses SQLite, compiled to run right here in your browser, so everything you type really executes.

      Most databases you will meet are **relational**: all data is stored in **tables**. The language for working with them is **SQL** (say "sequel" or "S-Q-L"), standardised since the 1980s and still the most widely used data language in the world. It is **declarative**: you describe *what* you want ("the names of third-year students, best grade first") and the database works out *how* to get it. That is a very different way of thinking from the step-by-step code you have written so far, and it is why SQL feels strange for a few days and then feels like a superpower.

  - heading: The relational model
    body: |
      A **table** (formally a *relation*) stores one kind of thing: students, courses, orders. Each **column** (attribute) is one property with a name and a type. Each **row** (record, tuple) is one particular thing. In our university database the `student` table has columns `id`, `name`, `major_id`, `year`, `gpa` and `email`, and one row per student.

      Two ideas make tables work together:

      - A **primary key** is a column (or columns) whose value is **unique** for every row and never missing. It is the row's identity. `student.id` is a primary key: two students may share a name, but never an id. Choose keys that never change; an email address looks unique but people change it.
      - A **foreign key** is a column that holds the primary key of a row in another table, linking them. `student.major_id` holds a `department.id`. Rather than writing "Computer Science" into every student's row (and fixing hundreds of rows when the department is renamed), we store the department once and refer to it by number. The database can enforce that a foreign key always points at a row that really exists.

      The `enrollment` table connects students and courses. A student takes many courses and a course has many students, so each row says "this student took this course in this term and got this grade". Its primary key is **three columns together**, a *composite key*: the same student may retake a course in another term, but not enroll twice in the same term.

      The set of all tables and their columns, types and keys is the database's **schema**. The rows currently in them are the **data**. Schemas change rarely; data changes constantly.

  - heading: SELECT, FROM and WHERE
    body: |
      A **query** asks a question; the answer is itself a table (a **result set**). The core is `SELECT ... FROM ... WHERE ...`:

      ```sql
      SELECT name, gpa      -- which columns do I want?
      FROM student          -- from which table?
      WHERE year = 3;       -- which rows?
      ```

      `SELECT *` means "all columns". The `WHERE` clause keeps only rows for which its condition is true. Conditions use `=` (a single equals sign, not two), `<>` or `!=` (not equal), `<`, `>`, `<=`, `>=`, and combine with `AND`, `OR` and `NOT`. Text goes in **single quotes** (`'Physics'`; double quotes are for column names). Keywords are not case sensitive, but writing them in capitals and putting each clause on its own line makes queries far easier to read. Statements end with a semicolon.

      Although you *write* SELECT first, the database *reads* the query in a different order: first FROM (find the table), then WHERE (filter rows), then SELECT (pick columns), and finally ORDER BY and LIMIT. Keeping that order in mind explains many puzzling errors later.

  - heading: Sorting, limiting and removing duplicates
    body: |
      Rows in a table have **no guaranteed order**. If you care about order, say so with `ORDER BY`, which sorts ascending by default; add `DESC` for descending, and list several columns to break ties: `ORDER BY year DESC, name`. `LIMIT n` keeps only the first n rows of the (sorted) result, which is how "top 3" queries are written. `OFFSET k` skips k rows first, useful for paging through results.

      `DISTINCT` removes duplicate rows from the result: `SELECT DISTINCT year FROM student` lists each year once. You can rename a column in the output with an **alias**: `SELECT gpa * 25 AS percent_scale`. You can compute with columns (`+ - * /`), join text with `||`, and call functions such as `UPPER(name)`, `LENGTH(name)` or `ROUND(gpa, 1)`. The result still has one row per input row; computing does not change how many rows come back.

  - heading: NULL, the missing value
    body: |
      Real data has gaps: Carl has no email, Barbara has no GPA yet. SQL represents "unknown or missing" with the special value **NULL**. It is not zero and not an empty string; it means *no value here*. Because the truth about a NULL is unknown, SQL uses **three-valued logic**: a condition can be true, false or **unknown**, and `WHERE` keeps only rows where it is *true*.

      - Any comparison with NULL is unknown: `gpa > 3.5` is unknown when gpa is NULL, and so is `gpa = NULL`, and even `NULL = NULL`.
      - Therefore `WHERE email = NULL` returns **nothing**, ever. The right test is `WHERE email IS NULL` (or `IS NOT NULL`).
      - Arithmetic with NULL gives NULL, and `NOT (unknown)` is still unknown, so `WHERE NOT gpa > 3.5` does *not* return the students whose GPA is missing.
      - `COALESCE(a, b, ...)` returns its first non-NULL argument, handy for substituting a default: `COALESCE(email, 'none')`.
      - In `ORDER BY`, SQLite sorts NULLs first.

      NULL is the biggest source of silent mistakes in SQL: queries run without error and return a plausible, wrong answer. Whenever a column can be NULL, ask yourself what should happen to those rows.

examples:
  - title: Your first query
    intro: "Choose columns, a table and a condition. The result is a table. (The widths line up automatically.)"
    code: |
      SELECT name, year, gpa
      FROM student
      WHERE year = 4;
    output: |
      name        | year | gpa
      ------------+------+-----
      Alan Turing | 4    | 3.8
      Marie Curie | 4    | 3.85
    lines:
      - line: 1
        note: "Only the listed columns come back, in the order you list them."
      - line: 2
        note: "FROM names the table to read rows from."
      - line: 3
        note: "Only rows where the condition is true are kept. A single = compares."
  - title: Sorting, limiting and aliases
    intro: "The three best GPAs, shown as a percentage. Notice NULL (Barbara) is not among the top because it sorts first when ascending and last when descending."
    code: |
      SELECT name, gpa, ROUND(gpa / 4.0 * 100, 1) AS percent
      FROM student
      WHERE gpa IS NOT NULL
      ORDER BY gpa DESC
      LIMIT 3;
    output: |
      name              | gpa  | percent
      ------------------+------+--------
      Emmy Noether      | 3.95 | 98.8
      Ada Lovelace      | 3.9  | 97.5
      Katherine Johnson | 3.9  | 97.5
    lines:
      - line: 1
        note: "A calculation with an alias. AS names the new column."
      - line: 3
        note: "Remove the missing GPA before sorting, so only real numbers are compared."
      - line: 4
        note: "DESC puts the largest first."
      - line: 5
        note: "LIMIT is applied last, after sorting, so these really are the top three."
  - title: DISTINCT and combining conditions
    intro: "Which years have at least one student above 3.5, and which departments exist? DISTINCT removes repeated rows."
    code: |
      SELECT DISTINCT year
      FROM student
      WHERE gpa > 3.5 AND major_id IS NOT NULL
      ORDER BY year;
    output: |
      year
      ----
      2
      3
      4
    lines:
      - line: 1
        note: "Without DISTINCT, year 3 would appear several times, once per matching student."
      - line: 3
        note: "Both conditions must be true. A row whose gpa is NULL is dropped, because NULL > 3.5 is unknown."
  - title: NULL is not equal to anything
    intro: "The same question asked wrongly and rightly. The first query returns nothing at all."
    code: |
      SELECT name FROM student WHERE email = NULL;
    output: |
      (no rows returned)
    lines:
      - line: 1
        note: "email = NULL is unknown for every row, so no row is kept. There is no error, which is what makes this dangerous."
  - title: IS NULL and COALESCE
    intro: "The right test, and a default value for display."
    code: |
      SELECT name, COALESCE(email, '(no email)') AS contact
      FROM student
      WHERE email IS NULL OR gpa IS NULL;
    output: |
      name           | contact
      ---------------+----------------
      Carl Gauss     | (no email)
      Linus Pauling  | (no email)
      Barbara Liskov | barbara@uni.edu
    lines:
      - line: 1
        note: "COALESCE returns the first argument that is not NULL."
      - line: 3
        note: "IS NULL is the only correct way to look for missing values."
  - title: Reading a schema
    intro: "SQLite keeps its own schema in a table you can query. This is how you discover what a database contains."
    code: |
      SELECT name AS table_name
      FROM sqlite_master
      WHERE type = 'table'
      ORDER BY name;
    output: |
      table_name
      ----------
      course
      department
      enrollment
      student
    lines:
      - line: 2
        note: "sqlite_master is a built-in table describing every table, index and view."

playground:
  prompt: |
    Explore the four tables. Try `SELECT * FROM course;`, then find all courses worth 4 credits, then sort the students by name. What happens if you ask for a column that does not exist?
  code: |
    SELECT * FROM course
    ORDER BY credits DESC, code;

exercises:
  - id: third-years
    title: Third-year students
    difficulty: 1
    prompt: |
      Write a query that returns the `name` and `gpa` of every student in year 3, in alphabetical order by name.
    starter: |
      -- write your query here
    tests:
      - name: right columns
        code: |
          expectColumns(["name", "gpa"]);
      - name: right rows in order
        code: |
          expectRows([["Ada Lovelace", 3.9], ["Barbara Liskov", null], ["Emmy Noether", 3.95], ["Hannah Arendt", 3.6]]);
    hints:
      - "Start with `SELECT name, gpa FROM student`."
      - "Add `WHERE year = 3`."
      - "Finish with `ORDER BY name;`."
    solution: |
      SELECT name, gpa
      FROM student
      WHERE year = 3
      ORDER BY name;
    explanation: "Choose the columns, filter with WHERE and sort last. Barbara still appears because year = 3 is true for her; her NULL gpa only matters if you compare it."
  - id: honours
    title: Honour roll
    difficulty: 2
    prompt: |
      List the `name` of every student whose `gpa` is **at least 3.8**, best GPA first. If two students tie, order them by name.
    starter: |
      -- write your query here
    tests:
      - name: rows
        code: |
          expectRows([["Emmy Noether"], ["Ada Lovelace"], ["Katherine Johnson"], ["Marie Curie"], ["Alan Turing"]]);
    hints:
      - "Use `WHERE gpa >= 3.8`."
      - "Sort with `ORDER BY gpa DESC, name`."
    solution: |
      SELECT name
      FROM student
      WHERE gpa >= 3.8
      ORDER BY gpa DESC, name;
    explanation: "A second column in ORDER BY breaks ties. Ada and Katherine both have 3.9, so Ada (alphabetically first) comes first."
  - id: no-email
    title: Who has no email?
    difficulty: 2
    prompt: |
      Return the `id` and `name` of every student who has **no email address** (the `email` is NULL), ordered by `id`.
    starter: |
      SELECT id, name FROM student WHERE email = NULL;
    tests:
      - name: columns
        code: |
          expectColumns(["id", "name"]);
      - name: rows
        code: |
          expectRows([[5, "Carl Gauss"], [9, "Linus Pauling"]]);
    hints:
      - "The starter returns nothing, because `= NULL` is never true."
      - "Use `IS NULL` instead."
    solution: |
      SELECT id, name
      FROM student
      WHERE email IS NULL
      ORDER BY id;
    explanation: "Comparing with NULL is always unknown. IS NULL is the operator made for the job."
  - id: stats-views
    title: Contact list with defaults
    difficulty: 3
    prompt: |
      Produce a contact list: for every student with a declared major (`major_id` is not NULL), return `name` and a column called `contact` that is the student's email, or the text `unknown` when the email is missing. Order by `name`.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["name", "contact"]);
      - name: row count
        code: |
          if (rows.length !== 11) throw new Error("Expected 11 students with a major, got " + rows.length);
      - name: defaults
        code: |
          const m = Object.fromEntries(rows);
          if (m["Carl Gauss"] !== "unknown") throw new Error("Carl has no email, so his contact should be 'unknown'");
          if (m["Ada Lovelace"] !== "ada@uni.edu") throw new Error("Ada's contact should be her email");
          if ("Linus Pauling" in m) throw new Error("Linus has no major and should be left out");
      - name: sorted
        code: |
          const names = rows.map((r) => r[0]);
          if (JSON.stringify(names) !== JSON.stringify([...names].sort())) throw new Error("Order the rows by name");
    hints:
      - "Filter with `WHERE major_id IS NOT NULL`."
      - "`COALESCE(email, 'unknown') AS contact` supplies the default."
    solution: |
      SELECT name, COALESCE(email, 'unknown') AS contact
      FROM student
      WHERE major_id IS NOT NULL
      ORDER BY name;
    explanation: "WHERE removes the student without a major; COALESCE fills the gap in the email column for display."
  - id: top-courses
    title: Biggest courses first
    difficulty: 3
    prompt: |
      From the `course` table, return the `code` and `title` of the **three** courses with the most credits. Break ties by `code`, alphabetically.
    starter: |
      -- write your query here
    tests:
      - name: rows
        code: |
          expectRows([["CS101", "Intro to Programming"], ["CS201", "Data Structures"], ["MA101", "Calculus I"]]);
      - name: columns
        code: |
          expectColumns(["code", "title"]);
    hints:
      - "Sort with `ORDER BY credits DESC, code`."
      - "Then `LIMIT 3`."
    solution: |
      SELECT code, title
      FROM course
      ORDER BY credits DESC, code
      LIMIT 3;
    explanation: "LIMIT runs after ORDER BY, so you get the first three of the sorted rows. You do not have to select the column you sort by."

commonMistakes:
  - title: "Comparing with NULL using ="
    explanation: "`WHERE email = NULL` returns nothing and gives no error. Use `IS NULL` or `IS NOT NULL`."
    wrong: |
      SELECT name FROM student WHERE email = NULL;
    right: |
      SELECT name FROM student WHERE email IS NULL;
  - title: "Using double quotes for text"
    explanation: "Text values go in single quotes. Double quotes mean a column or table name, so SQLite may quietly treat \"Physics\" as a column and give a confusing result or error."
    wrong: |
      SELECT * FROM department WHERE name = "Physics";
    right: |
      SELECT * FROM department WHERE name = 'Physics';
  - title: "Assuming rows come back in a fixed order"
    explanation: "Without ORDER BY the database may return rows in any order, and the order can change after an update. If order matters, say so."
  - title: "Thinking NOT (x > 3.5) keeps the NULL rows"
    explanation: "NOT of unknown is unknown, so rows with a NULL gpa are dropped by both `gpa > 3.5` and `NOT gpa > 3.5`. Handle NULL explicitly with `OR gpa IS NULL` if you want them."

summary:
  - "A DBMS stores data safely, shares it between users, enforces rules and answers questions; SQL is declarative, so you say what you want, not how to get it."
  - "Tables hold rows; a primary key identifies a row and a foreign key refers to a row in another table."
  - "SELECT chooses columns, FROM names the table, WHERE filters rows, ORDER BY sorts, LIMIT cuts the result, DISTINCT removes duplicates."
  - "The database reads FROM, then WHERE, then SELECT, then ORDER BY and LIMIT."
  - "NULL means missing. Comparisons with it are unknown, WHERE keeps only true rows, so use IS NULL and COALESCE."
next: u12-filtering

quiz:
  - type: mcq
    question: What does a primary key guarantee?
    options: [
      "Each row has a unique, non-missing identity",
      "The table is sorted by that column",
      "The column can never be updated by anyone",
      "The column is stored as text"
    ]
    answer: 0
    explanation: "A primary key identifies each row. It must be unique and never NULL."
  - type: mcq
    question: What is a foreign key?
    options: [
      "A column that refers to the primary key of a row in another table",
      "A key stored on a different computer",
      "An encrypted primary key",
      "A column that can only hold numbers"
    ]
    answer: 0
    explanation: "Foreign keys link tables, for example student.major_id holding a department.id."
  - type: mcq
    question: Which clause is evaluated first by the database?
    options: ["FROM", "SELECT", "ORDER BY", "LIMIT"]
    answer: 0
    explanation: "The database finds the table (FROM), then filters rows (WHERE), then picks columns (SELECT), then sorts and limits."
  - type: mcq
    question: How many rows does `SELECT name FROM student WHERE gpa = NULL` return?
    options: ["None", "All of them", "Only the rows where gpa is NULL", "It is an error"]
    answer: 0
    explanation: "gpa = NULL is unknown for every row, and WHERE only keeps rows where the condition is true."
  - type: mcq
    question: What does `SELECT DISTINCT year FROM student` do?
    options: [
      "Returns each year value once",
      "Returns the largest year",
      "Deletes duplicate students",
      "Sorts the table by year permanently"
    ]
    answer: 0
    explanation: "DISTINCT removes duplicate rows from the result. It never changes the stored table."
  - type: mcq
    question: "A table is queried with `SELECT * FROM student LIMIT 3` and no ORDER BY. Which statement is right?"
    options: [
      "Which three rows you get is not guaranteed",
      "You always get the three oldest rows",
      "You always get the three lowest ids",
      "It is an error without ORDER BY"
    ]
    answer: 0
    explanation: "Tables are unordered sets of rows. Without ORDER BY any three rows may be returned."
  - type: code
    question: |
      Write a query returning the `code` of every course in department 1 (`dept_id = 1`) that is worth fewer than 4 credits, ordered by `code`.
    starter: |
      -- write your query here
    tests:
      - name: rows
        code: |
          expectRows([["CS301"], ["CS401"]]);
    solution: |
      SELECT code
      FROM course
      WHERE dept_id = 1 AND credits < 4
      ORDER BY code;
