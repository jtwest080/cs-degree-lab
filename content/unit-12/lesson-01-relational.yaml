id: u12-relational
title: "Tables, Keys and Your First Queries"
minutes: 55
objective: |
  Understand why programs use databases instead of files, how the relational model organises data into tables, rows and keys, and how to ask questions with SELECT, WHERE, ORDER BY, LIMIT and DISTINCT, including the surprising behaviour of NULL.
outcomes:
  - Explain what a database management system does that a plain file cannot
  - Describe tables, rows, columns, primary keys and foreign keys
  - Write SELECT queries that choose columns, filter rows, sort and limit results
  - Use DISTINCT and column aliases, and explain the order in which a query is read
  - Predict how NULL behaves in comparisons and use IS NULL correctly

prelude: |
  CREATE TABLE department (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    building TEXT
  );
  CREATE TABLE student (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    major_id INTEGER REFERENCES department(id),
    year INTEGER,
    gpa REAL,
    email TEXT
  );
  CREATE TABLE course (
    code TEXT PRIMARY KEY,
    title TEXT NOT NULL,
    dept_id INTEGER REFERENCES department(id),
    credits INTEGER
  );
  CREATE TABLE enrollment (
    student_id INTEGER REFERENCES student(id),
    course_code TEXT REFERENCES course(code),
    term TEXT,
    grade TEXT,
    PRIMARY KEY (student_id, course_code, term)
  );
  INSERT INTO department VALUES (1,'Computer Science','Gates Hall'),(2,'Mathematics','Euler Building'),(3,'Physics','Newton Hall'),(4,'History',NULL);
  INSERT INTO student VALUES
   (1,'Ada Lovelace',1,3,3.9,'ada@uni.edu'),
