sections:
  - heading: Patterns, lists and ranges
    body: |
      Equality is only the start. SQL has shorthand for the most common filters:

      - `x IN (a, b, c)` is true when x equals any value in the list; `NOT IN` is the opposite. It is the readable form of several `OR`s.
      - `x BETWEEN low AND high` includes **both ends**: `year BETWEEN 2 AND 3` is `year >= 2 AND year <= 3`.
      - `text LIKE pattern` matches text against a pattern in which `%` stands for any number of characters (including none) and `_` for exactly one character. `'Gr%'` matches names starting with Gr, `'%son'` ends with son, `'%a%'` contains an a, and `'_a%'` has a as its second letter. In SQLite `LIKE` ignores upper and lower case for ordinary letters; `GLOB` is the case sensitive cousin.

      Patterns have a cost: `LIKE 'abc%'` (a known start) can use an index, but `LIKE '%abc'` must examine every row. You will see why in the lesson on indexes.

  - heading: Combining conditions
    body: |
      `AND` binds tighter than `OR`, just as multiplication binds tighter than addition. So

      ```sql
      WHERE year = 1 OR year = 2 AND gpa > 3.5
      ```

      means `year = 1 OR (year = 2 AND gpa > 3.5)`, which is probably not what you meant. Whenever you mix them, **use parentheses**. Writing the brackets costs nothing and removes the doubt.

      Remember three-valued logic from last lesson: `true AND unknown` is unknown, `false AND unknown` is false, `true OR unknown` is true, and `false OR unknown` is unknown. `WHERE` keeps only true. A useful consequence: `x NOT IN (1, 2, NULL)` can **never** be true, because comparing with the NULL is always unknown. Be careful with `NOT IN` when the list might contain NULL.

  - heading: Expressions and functions
    body: |
      The SELECT list can hold any **expression**, not just column names: arithmetic (`credits * 15` hours of lectures), string concatenation (`||`) and functions. SQLite has many; the ones you will use daily:

      | Function | Result |
      |---|---|
      | `UPPER(s)`, `LOWER(s)` | change case |
      | `LENGTH(s)` | number of characters |
      | `SUBSTR(s, start, len)` | part of a string, counting from 1 |
      | `INSTR(s, t)` | position of t in s, or 0 |
      | `REPLACE(s, a, b)` | replace every a with b |
      | `ROUND(x, n)`, `ABS(x)` | rounding and absolute value |
      | `COALESCE(a, b, ...)` | first non-NULL value |
      | `NULLIF(a, b)` | NULL if a equals b, otherwise a |
      | `MIN(a, b, ...)`, `MAX(a, b, ...)` | smallest/largest of several values in one row |

      **Integer division** surprises people: in SQLite `7 / 2` is `3`, because both are integers. Write `7 / 2.0` to get `3.5`. Also remember that `||` with a NULL gives NULL.

  - heading: "CASE: choices inside a query"
    body: |
      `CASE` is SQL's if-statement for expressions. It checks conditions in order and returns the value for the first one that is true:

      ```sql
      CASE
        WHEN gpa >= 3.8 THEN 'high honours'
        WHEN gpa >= 3.5 THEN 'honours'
        ELSE 'none'
      END
      ```

      Without an `ELSE` the result is NULL when nothing matches. Note the NULL gpa: `NULL >= 3.8` is unknown, so it falls through to `ELSE`. If that is wrong for your purpose, add `WHEN gpa IS NULL THEN 'n/a'` first. CASE can appear in SELECT, WHERE and ORDER BY, and it is how you turn raw values into categories for reports.

  - heading: Dates and times
    body: |
      SQLite has no special date type. Dates are stored as **text** in the ISO format `YYYY-MM-DD` (or `YYYY-MM-DD HH:MM:SS`), as numbers or as Unix timestamps. The ISO format is chosen so that comparing the *text* gives the right chronological order: `'2024-03-09' < '2024-11-02'` is true. Never store dates as `3/9/24`: that sorts wrongly and is ambiguous.

      The functions `date(x)`, `time(x)`, `datetime(x)` and `strftime(format, x)` parse and format them, and accept modifiers: `date('2024-01-31', '+1 month')`, `date('2024-03-15', 'start of month')`, `date('now')` (the current date, which changes, so avoid it in tests). `julianday(a) - julianday(b)` is the number of days between two dates. Other databases have real `DATE` and `TIMESTAMP` types, but the ISO text habit works everywhere.

examples:
  - title: LIKE, IN and BETWEEN
    intro: "Three shortcuts in one query: students in years 2 to 3 whose names start with a letter from a list."
    code: |
      SELECT name, year
      FROM student
      WHERE year BETWEEN 2 AND 3
        AND (name LIKE 'A%' OR name LIKE 'G%' OR name LIKE '%son')
      ORDER BY name;
    output: |
      name              | year
      ------------------+-----
      Ada Lovelace      | 3
      Grace Hopper      | 2
      Katherine Johnson | 2
    lines:
      - line: 3
        note: "BETWEEN includes both 2 and 3."
      - line: 4
        note: "Parentheses make the OR group apply together with the AND. % matches any run of characters."
  - title: Precedence trap
    intro: "The same three tests with and without parentheses give different answers."
    code: |
      SELECT name, year, gpa FROM student
      WHERE year = 1 OR year = 2 AND gpa > 3.7
      ORDER BY id;
    output: |
      name              | year | gpa
      ------------------+------+----
      Carl Gauss        | 1    | 3.5
      Linus Pauling     | 1    | 3
      Katherine Johnson | 2    | 3.9
      Donald Knuth      | 1    | 3.4
    lines:
      - line: 2
        note: "AND happens first: year = 2 AND gpa > 3.7. Then OR: all of year 1 plus that group. Grace (year 2, 3.7) is correctly absent but every first-year, even with a low gpa, is included."
  - title: Calculated columns and functions
    intro: "Build new values from old ones. Notice integer versus real division."
    code: |
      SELECT UPPER(name) AS shout,
             LENGTH(name) AS letters,
             SUBSTR(email, 1, INSTR(email, '@') - 1) AS handle,
             7 / 2 AS int_div,
             7 / 2.0 AS real_div
      FROM student
      WHERE id IN (1, 5, 7)
      ORDER BY id;
    output: |
      shout        | letters | handle | int_div | real_div
      -------------+---------+--------+---------+---------
      ADA LOVELACE | 12      | ada    | 3       | 3.5
      CARL GAUSS   | 10      | NULL   | 3       | 3.5
      ISAAC NEWTON | 12      | isaac  | 3       | 3.5
    lines:
      - line: 3
        note: "Everything before the @ sign. For Carl, email is NULL so every function on it gives NULL."
      - line: 4
        note: "Both numbers are integers, so the answer is truncated."
      - line: 5
        note: "One real number is enough to make the division exact."
  - title: CASE for categories
    intro: "Label each student. The missing gpa is handled before the numeric tests."
    code: |
      SELECT name,
             CASE
               WHEN gpa IS NULL THEN 'n/a'
               WHEN gpa >= 3.8 THEN 'high honours'
               WHEN gpa >= 3.5 THEN 'honours'
               ELSE 'standard'
             END AS standing
      FROM student
      ORDER BY id
      LIMIT 6;
    output: |
      name         | standing
      -------------+-------------
      Ada Lovelace | high honours
      Alan Turing  | high honours
      Grace Hopper | honours
      Emmy Noether | high honours
      Carl Gauss   | honours
      Marie Curie  | high honours
    lines:
      - line: 3
        note: "Checked first, so NULL never reaches the numeric comparisons."
      - line: 4
        note: "WHEN branches are tried top to bottom and the first true one wins."
      - line: 6
        note: "ELSE catches everything else."
  - title: NOT IN and NULL
    intro: "A list containing NULL makes NOT IN never true. Compare the two queries."
    code: |
      SELECT COUNT(*) AS with_null
      FROM student
      WHERE year NOT IN (1, 2, NULL);
    output: |
      with_null
      ---------
      0
    lines:
      - line: 3
        note: "For every row the comparison with NULL is unknown, so no row can be true. The answer is 0 even though many students are in year 3 or 4."
  - title: Dates are text that sorts
    intro: "ISO dates compare correctly as text, and modifiers do calendar arithmetic."
    code: |
      SELECT date('2024-01-31', '+1 month') AS next_month,
             date('2024-03-15', 'start of month') AS month_start,
             strftime('%Y', '2024-03-15') AS yr,
             julianday('2024-12-25') - julianday('2024-03-15') AS days_between,
             '2024-03-09' < '2024-11-02' AS earlier;
    output: |
      next_month | month_start | yr   | days_between | earlier
      -----------+-------------+------+--------------+--------
      2024-03-02 | 2024-03-01  | 2024 | 285          | 1
    lines:
      - line: 1
        note: "January 31 plus one month overflows February, so SQLite rolls into March."
      - line: 5
        note: "A true comparison is the integer 1."

playground:
  prompt: |
    Write a query that labels each course 'big' or 'small' by credits and shows its code in lower case. Then try a LIKE pattern that finds every course whose title contains the word "Data".
  code: |
    SELECT code, title
    FROM course
    WHERE title LIKE '%a%'
    ORDER BY title;

exercises:
  - id: name-pattern
    title: Names with a pattern
    difficulty: 2
    prompt: |
      Return the `name` of every student whose name **contains the letter 'n'** (any case) and who is in year 2 or later (`year >= 2`), ordered by `name`.
    starter: |
      -- write your query here
    tests:
      - name: shape
        code: |
          expectColumns(["name"]);
          if (rows.length !== 5) throw new Error("Expected 5 names, got " + rows.length);
      - name: rows
        code: |
          expectRows(query("SELECT name FROM student WHERE year >= 2 AND LOWER(name) LIKE '%n%' ORDER BY name"));
    hints:
      - "LIKE ignores case for ordinary letters in SQLite, so `name LIKE '%n%'` is enough."
      - "Add `AND year >= 2` and `ORDER BY name`."
    solution: |
      SELECT name
      FROM student
      WHERE name LIKE '%n%' AND year >= 2
      ORDER BY name;
    explanation: "% matches any run of characters on both sides, so the pattern means 'contains n'."
  - id: parens
    title: Parentheses matter
    difficulty: 3
    prompt: |
      Return `name` and `gpa` of students who are in **year 3 or 4** and have a gpa **above 3.8**, **or** who are in year 1 (any gpa). Order by `name`. Use parentheses so the logic is exactly this.
    starter: |
      SELECT name, gpa FROM student
      WHERE year = 3 OR year = 4 AND gpa > 3.8 OR year = 1
      ORDER BY name;
    tests:
      - name: rows
        code: |
          expectRows(query("SELECT name, gpa FROM student WHERE ((year = 3 OR year = 4) AND gpa > 3.8) OR year = 1 ORDER BY name"));
      - name: count
        code: |
          if (rows.length !== 6) throw new Error("Expected 6 rows, got " + rows.length);
    hints:
      - "The starter runs AND before OR. Group the year test: `(year = 3 OR year = 4) AND gpa > 3.8`."
      - "Or use `year IN (3, 4)`."
    solution: |
      SELECT name, gpa
      FROM student
      WHERE (year IN (3, 4) AND gpa > 3.8) OR year = 1
      ORDER BY name;
    explanation: "AND binds tighter than OR, so brackets are needed to group the two years. IN is a shorter way to write the list."
  - id: case-standing
    title: Class standing
    difficulty: 3
    prompt: |
      Return `name` and a column `standing` that is `'senior'` for year 4, `'junior'` for year 3, `'sophomore'` for year 2 and `'freshman'` for year 1. Order by `id`.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["name", "standing"]);
      - name: values
        code: |
          const m = Object.fromEntries(rows);
          if (m["Alan Turing"] !== "senior") throw new Error("Alan (year 4) should be senior");
          if (m["Ada Lovelace"] !== "junior") throw new Error("Ada (year 3) should be junior");
          if (m["Grace Hopper"] !== "sophomore") throw new Error("Grace (year 2) should be sophomore");
          if (m["Carl Gauss"] !== "freshman") throw new Error("Carl (year 1) should be freshman");
      - name: all rows in order
        code: |
          if (rows.length !== 12) throw new Error("Expected 12 rows");
          expectRows(query("SELECT name, CASE year WHEN 4 THEN 'senior' WHEN 3 THEN 'junior' WHEN 2 THEN 'sophomore' ELSE 'freshman' END FROM student ORDER BY id"));
    hints:
      - "`CASE WHEN year = 4 THEN 'senior' ... END AS standing`."
      - "You can use `ELSE 'freshman'` for the last case."
    solution: |
      SELECT name,
             CASE year
               WHEN 4 THEN 'senior'
               WHEN 3 THEN 'junior'
               WHEN 2 THEN 'sophomore'
               ELSE 'freshman'
             END AS standing
      FROM student
      ORDER BY id;
    explanation: "CASE can compare one expression with several values (the short form used here) or test full conditions in each WHEN."
  - id: handles
    title: Email handles
    difficulty: 3
    prompt: |
      For students who **have** an email, return `name` and `handle`: the part of the email before the `@`, in **upper case**. Order by `name`.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["name", "handle"]);
      - name: rows
        code: |
          if (rows.length !== 10) throw new Error("Expected 10 students with an email, got " + rows.length);
          if (rows[0][0] !== "Ada Lovelace" || rows[0][1] !== "ADA") throw new Error("First row should be Ada Lovelace / ADA");
          expectRows(query("SELECT name, UPPER(SUBSTR(email, 1, INSTR(email, '@') - 1)) FROM student WHERE email IS NOT NULL ORDER BY name"));
    hints:
      - "`INSTR(email, '@')` is the position of the @ sign; the handle has one fewer characters."
      - "`UPPER(SUBSTR(email, 1, INSTR(email, '@') - 1))`."
    solution: |
      SELECT name, UPPER(SUBSTR(email, 1, INSTR(email, '@') - 1)) AS handle
      FROM student
      WHERE email IS NOT NULL
      ORDER BY name;
    explanation: "Functions nest: INSTR finds the @, SUBSTR cuts everything before it, UPPER changes the case."

commonMistakes:
  - title: "Forgetting that AND binds tighter than OR"
    explanation: "Mixed conditions without brackets are read as AND-groups joined by OR. Add parentheses whenever you use both."
    wrong: |
      WHERE year = 1 OR year = 2 AND gpa > 3.7
    right: |
      WHERE (year = 1 OR year = 2) AND gpa > 3.7
  - title: "NOT IN with a list that contains NULL"
    explanation: "`x NOT IN (1, NULL)` is never true. Remove NULLs from the list or use NOT EXISTS (Lesson 12.5)."
  - title: "Dividing integers"
    explanation: "`7 / 2` is 3 in SQLite. Make one side a real number: `7 / 2.0`."
  - title: "Storing dates in a local format"
    explanation: "Use `YYYY-MM-DD`. Formats like `3/9/24` sort and compare incorrectly."

summary:
  - "IN, BETWEEN and LIKE are shorthand for common filters; % matches any run, _ matches one character."
  - "AND binds tighter than OR, so use parentheses when mixing them."
  - "Expressions and functions create new columns without changing the number of rows; integer division truncates."
  - "CASE returns the value for the first true WHEN and NULL when none matches and there is no ELSE."
  - "Dates are ISO text, which compares in time order; date functions do calendar arithmetic."
next: u12-joins

quiz:
  - type: mcq
    question: What does `name LIKE '_a%'` match?
    options: [
      "Names whose second letter is a",
      "Names that start with a",
      "Names that contain exactly one a",
      "Names with an underscore"
    ]
    answer: 0
    explanation: "_ matches exactly one character and % matches any run, so the second character must be a."
  - type: mcq
    question: Is the value 3 included by `year BETWEEN 2 AND 3`?
    options: ["Yes, BETWEEN includes both ends", "No, the upper end is excluded", "Only if year is text", "It depends on the database"]
    answer: 0
    explanation: "BETWEEN a AND b is the same as >= a AND <= b."
  - type: mcq
    question: What is `WHERE a OR b AND c` the same as?
    options: ["a OR (b AND c)", "(a OR b) AND c", "a AND b AND c", "(a OR b) OR c"]
    answer: 0
    explanation: "AND is evaluated before OR."
  - type: mcq
    question: What does `SELECT 7 / 2` return in SQLite?
    options: ["3", "3.5", "4", "2"]
    answer: 0
    explanation: "Two integers divide as integers, discarding the fraction."
  - type: mcq
    question: What does CASE return when no WHEN matches and there is no ELSE?
    options: ["NULL", "0", "An empty string", "An error"]
    answer: 0
    explanation: "Missing ELSE means NULL."
  - type: mcq
    question: Why store dates as YYYY-MM-DD text?
    options: [
      "Comparing the text gives chronological order",
      "It uses less space than a number",
      "SQL requires it",
      "It prevents invalid dates"
    ]
    answer: 0
    explanation: "With the biggest unit first, alphabetical order is the same as time order."
  - type: code
    question: |
      Return `code` and `title` of every course in departments 1 or 2 whose code starts with `CS` or `MA`, but only courses worth **4** credits. Order by `code`.
    starter: |
      -- write your query here
    tests:
      - name: rows
        code: |
          expectRows([["CS101", "Intro to Programming"], ["CS201", "Data Structures"], ["MA101", "Calculus I"]]);
    solution: |
      SELECT code, title
      FROM course
      WHERE dept_id IN (1, 2)
        AND (code LIKE 'CS%' OR code LIKE 'MA%')
        AND credits = 4
      ORDER BY code;
