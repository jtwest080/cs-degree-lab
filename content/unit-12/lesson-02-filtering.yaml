id: u12-filtering
title: "Filtering, Expressions and CASE"
minutes: 50
objective: |
  Sharpen your queries with pattern matching, ranges, lists and calculated columns: LIKE, IN, BETWEEN, string and number functions, CASE expressions and dates, and learn how operator precedence and NULL affect combined conditions.
outcomes:
  - Match text with LIKE patterns and lists with IN, and ranges with BETWEEN
  - Combine AND, OR and NOT correctly using parentheses
  - Compute new columns with arithmetic, string and rounding functions
  - Turn values into categories with CASE
  - Work with dates stored as text and understand why SQLite has no separate date type

prelude: |
  CREATE TABLE department (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    building TEXT
  );
  CREATE TABLE student (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    major_id INTEGER REFERENCES department(id),
    year INTEGER,
    gpa REAL,
    email TEXT
  );
  CREATE TABLE course (
    code TEXT PRIMARY KEY,
    title TEXT NOT NULL,
    dept_id INTEGER REFERENCES department(id),
    credits INTEGER
  );
  CREATE TABLE enrollment (
    student_id INTEGER REFERENCES student(id),
    course_code TEXT REFERENCES course(code),
    term TEXT,
    grade TEXT,
    PRIMARY KEY (student_id, course_code, term)
  );
