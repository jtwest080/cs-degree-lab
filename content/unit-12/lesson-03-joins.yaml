sections:
  - heading: Why split data, and how to put it back
    body: |
      Imagine one giant table with a row per enrollment holding the student's name, their major's name, the department's building, the course title and the grade. The department's name would repeat in every row of every student. Rename a department and you must find and fix hundreds of rows; miss one and the data contradicts itself. This is why relational designs store each fact **once**, in its own table, and link tables with keys. The next-but-one lesson turns that into a systematic method called normalisation.

      The price is that the answer to a question is often spread over several tables. A **join** combines rows from two tables into wider rows, pairing them according to a condition, normally *foreign key = primary key*:

      ```sql
      SELECT student.name, department.name
      FROM student
      JOIN department ON student.major_id = department.id;
      ```

      Think of it as: for each student row, look for department rows where the `ON` condition holds, and output one combined row for each match. Because both tables have a column called `name` (and `id`), you must say which you mean by **qualifying** it with the table name. Long names get tedious, so give each table a short **alias** after its name: `FROM student s JOIN department d ON s.major_id = d.id`.

  - heading: INNER and LEFT joins
    body: |
      A plain `JOIN` (short for `INNER JOIN`) keeps only combined rows where the condition matched. A student with no major (`major_id` is NULL) has no match, so that student **disappears** from the result. Sometimes that is right; sometimes it silently loses data.

      A **LEFT JOIN** keeps *every* row from the left table. Where there is no match, the right table's columns are filled with NULL:

      ```sql
      SELECT s.name, d.name AS major
      FROM student s
      LEFT JOIN department d ON s.major_id = d.id;
      ```

      Now Linus appears with a NULL major. (`RIGHT JOIN` and `FULL OUTER JOIN` exist in many databases, but swapping the table order turns a RIGHT into a LEFT, and SQLite added both only recently, so LEFT is all you need.) There is also the **CROSS JOIN**, every row of one table paired with every row of the other, with no condition; the result has n × m rows, which is occasionally useful and often a bug.

      A rule of thumb: **ON** says how rows are matched; **WHERE** filters the result afterwards. For a LEFT JOIN that difference matters. A condition on the right table put in `WHERE` (like `WHERE d.name = 'History'`) throws away the NULL-filled rows and quietly turns your LEFT join into an inner one. Put it in `ON` if you want to keep the unmatched left rows.

  - heading: Many tables, many-to-many
    body: |
      Relationships come in three shapes. **One-to-many**: one department has many students (the foreign key lives on the "many" side). **One-to-one**: rare, usually two tables describing the same thing. **Many-to-many**: students and courses, where each can have many of the other. A many-to-many relationship always needs a third **link table** (also called a junction or association table), here `enrollment`, with a foreign key to each side. Its own columns, like `term` and `grade`, describe the *relationship*.

      To answer "which courses did Ada take, with grades?" you hop across the link table:

      ```sql
      SELECT c.title, e.term, e.grade
      FROM student s
      JOIN enrollment e ON e.student_id = s.id
      JOIN course c     ON c.code = e.course_code
      WHERE s.name = 'Ada Lovelace';
      ```

      Add one `JOIN ... ON` per extra table. Read it as a path through the diagram of tables: student, to enrollment, to course. If you add a table but forget its `ON`, or write the wrong condition, you get many more rows than expected (rows multiplying is the classic sign).

  - heading: Self joins and finding what is missing
    body: |
      A table can be joined to **itself** by giving it two aliases, which is how you relate rows of the same kind: employees to their managers, or pairs of students in the same year:

      ```sql
      SELECT a.name, b.name
      FROM student a JOIN student b ON a.year = b.year AND a.id < b.id;
      ```

      The `a.id < b.id` keeps each pair once and stops a student being paired with themselves.

      A question like "which students are enrolled in **nothing**?" asks about rows with no match. The idiom is a LEFT JOIN followed by a test for the NULL it creates:

      ```sql
      SELECT s.name
      FROM student s
      LEFT JOIN enrollment e ON e.student_id = s.id
      WHERE e.student_id IS NULL;
      ```

      This is called an **anti-join**. Test a column that can never be NULL in a real row, such as a key. (A cleaner alternative using `NOT EXISTS` comes in the subqueries lesson.)

examples:
  - title: A simple join
    intro: "Each student next to the name of their major. Linus has no major and so is missing."
    code: |
      SELECT s.name AS student, d.name AS major
      FROM student s
      JOIN department d ON s.major_id = d.id
      WHERE d.name <> 'Computer Science'
      ORDER BY s.id;
    output: |
      student           | major
      ------------------+------------
      Emmy Noether      | Mathematics
      Carl Gauss        | Mathematics
      Marie Curie       | Physics
      Isaac Newton      | Physics
      Hannah Arendt     | History
      Katherine Johnson | Mathematics
    lines:
      - line: 2
        note: "Aliases s and d keep the query short. Qualified names say which table each column comes from."
      - line: 3
        note: "The ON condition pairs a student with the department whose id is stored in major_id."
  - title: LEFT JOIN keeps the unmatched
    intro: "Every student appears; Linus gets NULL for the major."
    code: |
      SELECT s.name AS student, d.name AS major
      FROM student s
      LEFT JOIN department d ON s.major_id = d.id
      WHERE s.year = 1
      ORDER BY s.id;
    output: |
      student       | major
      --------------+-----------------
      Carl Gauss    | Mathematics
      Linus Pauling | NULL
      Donald Knuth  | Computer Science
    lines:
      - line: 3
        note: "LEFT means every row of the table on the left of the word JOIN is kept."
      - line: 4
        note: "This WHERE refers to the left table, so it is safe."
  - title: Across a link table
    intro: "Three tables: student to enrollment to course. This is Ada's transcript."
    code: |
      SELECT c.code, c.title, e.term, e.grade
      FROM student s
      JOIN enrollment e ON e.student_id = s.id
      JOIN course c ON c.code = e.course_code
      WHERE s.name = 'Ada Lovelace'
      ORDER BY e.term, c.code;
    output: |
      code  | title                | term | grade
      ------+----------------------+------+------
      CS101 | Intro to Programming | F23  | A
      CS301 | Databases            | F24  | A
      MA201 | Linear Algebra       | F24  | B
      CS201 | Data Structures      | S24  | A
    lines:
      - line: 2
        note: "Start from the student we care about."
      - line: 3
        note: "Hop into the link table. One student row matches several enrollment rows, so the result grows."
      - line: 4
        note: "Hop out to the course. Each ON links one pair of tables."
  - title: Anti-join, rows with no match
    intro: "Students with no enrollments at all."
    code: |
      SELECT s.name
      FROM student s
      LEFT JOIN enrollment e ON e.student_id = s.id
      WHERE e.student_id IS NULL;
    output: |
      name
      --------------
      Barbara Liskov
    lines:
      - line: 3
        note: "A real enrollment row can never have a NULL student_id, so NULL here means the join found nothing."
  - title: Joining a table to itself
    intro: "Pairs of different students who are in the same year and in the same department."
    code: |
      SELECT a.name AS first, b.name AS second, a.year
      FROM student a
      JOIN student b ON a.major_id = b.major_id AND a.year = b.year AND a.id < b.id
      ORDER BY a.year, a.name;
    output: |
      first        | second         | year
      -------------+----------------+-----
      Ada Lovelace | Barbara Liskov | 3
    lines:
      - line: 2
        note: "The same table with two aliases acts like two separate tables."
      - line: 3
        note: "a.id < b.id lists each pair once and never pairs a student with themselves."
  - title: The WHERE trap on a LEFT JOIN
    intro: "Counting rows shows how a filter on the right table undoes the LEFT JOIN."
    code: |
      SELECT
        (SELECT COUNT(*) FROM student s LEFT JOIN department d ON s.major_id = d.id) AS kept,
        (SELECT COUNT(*) FROM student s LEFT JOIN department d ON s.major_id = d.id
          WHERE d.name <> 'History') AS after_where;
    output: |
      kept | after_where
      -----+------------
      12   | 10
    lines:
      - line: 2
        note: "All twelve students, including the one with no department."
      - line: 4
        note: "d.name is NULL for Linus, and NULL <> 'History' is unknown, so Linus (and Hannah, the History major) are dropped."

playground:
  prompt: |
    List each course with its department name, then change JOIN to LEFT JOIN and see what changes. Then try removing an ON clause to see the rows multiply.
  code: |
    SELECT c.code, c.title, d.name AS department
    FROM course c
    JOIN department d ON d.id = c.dept_id
    ORDER BY c.code;

exercises:
  - id: course-dept
    title: Courses with their departments
    difficulty: 2
    prompt: |
      Return `code`, `title` and the department's `name` (call it `department`) for every course, ordered by `code`.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["code", "title", "department"]);
      - name: rows
        code: |
          if (rows.length !== 8) throw new Error("Expected one row per course (8), got " + rows.length);
          if (rows[0][2] !== "Computer Science") throw new Error("CS101 belongs to Computer Science");
          if (rows[7][0] !== "PH101" || rows[7][2] !== "Physics") throw new Error("Last row should be PH101 / Physics");
    hints:
      - "Join `course` to `department` where `course.dept_id = department.id`."
      - "Both tables have a `name`, so alias the department's: `d.name AS department`."
    solution: |
      SELECT c.code, c.title, d.name AS department
      FROM course c
      JOIN department d ON d.id = c.dept_id
      ORDER BY c.code;
    explanation: "A foreign key joined to its primary key: each course matches exactly one department."
  - id: all-majors
    title: Students and majors, nobody left out
    difficulty: 3
    prompt: |
      Return each student's `name` and `major` (the department name, or the text `undeclared` when they have none), ordered by `name`. Every one of the 12 students must appear.
    starter: |
      SELECT s.name, d.name AS major
      FROM student s
      JOIN department d ON s.major_id = d.id
      ORDER BY s.name;
    tests:
      - name: columns
        code: |
          expectColumns(["name", "major"]);
      - name: nobody missing
        code: |
          if (rows.length !== 12) throw new Error("Expected all 12 students, got " + rows.length);
      - name: undeclared
        code: |
          const m = Object.fromEntries(rows);
          if (m["Linus Pauling"] !== "undeclared") throw new Error("Linus has no major: show 'undeclared'");
          if (m["Marie Curie"] !== "Physics") throw new Error("Marie majors in Physics");
    hints:
      - "A plain JOIN drops Linus. Use LEFT JOIN."
      - "`COALESCE(d.name, 'undeclared') AS major`."
    solution: |
      SELECT s.name, COALESCE(d.name, 'undeclared') AS major
      FROM student s
      LEFT JOIN department d ON s.major_id = d.id
      ORDER BY s.name;
    explanation: "LEFT JOIN keeps unmatched students with NULL in the department columns, and COALESCE gives that NULL a readable label."
  - id: grades-cs
    title: Grades in Databases
    difficulty: 3
    prompt: |
      Return the `name` of each student and their `grade` in the course titled `Databases`, ordered by `name`.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["name", "grade"]);
      - name: rows
        code: |
          expectRows([["Ada Lovelace", "A"], ["Alan Turing", "B"]]);
    hints:
      - "You need student, enrollment and course: two joins."
      - "Filter with `c.title = 'Databases'`."
    solution: |
      SELECT s.name, e.grade
      FROM student s
      JOIN enrollment e ON e.student_id = s.id
      JOIN course c ON c.code = e.course_code
      WHERE c.title = 'Databases'
      ORDER BY s.name;
    explanation: "The path student, enrollment, course connects the people to the course; the grade lives on the link row."
  - id: no-courses
    title: Courses nobody took in F24
    difficulty: 4
    prompt: |
      Find the courses that had **no enrollments in term `F24`**. Return `code` and `title`, ordered by `code`. (Courses with no enrollments in any term count too.) The term condition belongs in the `ON` clause, as the lesson explained.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["code", "title"]);
      - name: rows
        code: |
          expectRows([["CS201", "Data Structures"], ["CS401", "Compilers"]]);
    hints:
      - "LEFT JOIN course to enrollment on the course code AND the term: `ON e.course_code = c.code AND e.term = 'F24'`."
      - "Keep rows where the enrollment side is NULL: `WHERE e.course_code IS NULL`."
    solution: |
      SELECT c.code, c.title
      FROM course c
      LEFT JOIN enrollment e ON e.course_code = c.code AND e.term = 'F24'
      WHERE e.course_code IS NULL
      ORDER BY c.code;
    explanation: "Putting the term test in ON means courses with other-term enrollments still get no match. Testing it in WHERE would wrongly remove every unmatched row."
  - id: same-term-pairs
    title: Classmates
    difficulty: 4
    prompt: |
      List pairs of **different students who took `CS101` in the same term `F24`**. Return `first` and `second` (their names, with the lower student id as `first`), ordered by `first` then `second`.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["first", "second"]);
      - name: rows
        code: |
          if (rows.length !== 10) throw new Error("Expected 10 pairs, got " + rows.length);
          expectRows(query("SELECT s1.name, s2.name FROM enrollment a JOIN enrollment b ON a.course_code = b.course_code AND a.term = b.term AND a.student_id < b.student_id JOIN student s1 ON s1.id = a.student_id JOIN student s2 ON s2.id = b.student_id WHERE a.course_code = 'CS101' AND a.term = 'F24' ORDER BY s1.name, s2.name"));
    hints:
      - "Join `enrollment` to itself (two aliases), matching the same course and term."
      - "`a.student_id < b.student_id` avoids pairing a student with themselves and repeating pairs."
      - "Then join `student` twice to get both names."
    solution: |
      SELECT s1.name AS first, s2.name AS second
      FROM enrollment a
      JOIN enrollment b ON a.course_code = b.course_code
                       AND a.term = b.term
                       AND a.student_id < b.student_id
      JOIN student s1 ON s1.id = a.student_id
      JOIN student s2 ON s2.id = b.student_id
      WHERE a.course_code = 'CS101' AND a.term = 'F24'
      ORDER BY s1.name, s2.name;
    explanation: "A self join with an inequality on the key lists each unordered pair once. Joining student twice turns ids into names."

commonMistakes:
  - title: "Forgetting the ON condition"
    explanation: "Without a condition every row pairs with every row (a cross join). If a result has far too many rows, check every JOIN has the right ON."
  - title: "Ambiguous column names"
    explanation: "When two tables share a column name you must qualify it (s.id, d.id). SQLite reports an ambiguous column error otherwise."
  - title: "A WHERE on the right table turns LEFT into INNER"
    explanation: "Rows created by the LEFT JOIN have NULL in the right table's columns, and WHERE d.name = 'x' discards them. Put such a condition in the ON clause if you want to keep unmatched rows."
    wrong: |
      SELECT s.name FROM student s LEFT JOIN department d ON s.major_id = d.id WHERE d.name = 'History';
    right: |
      SELECT s.name, d.name FROM student s LEFT JOIN department d ON s.major_id = d.id AND d.name = 'History';
  - title: "Testing the wrong column in an anti-join"
    explanation: "Check a column that is NULL only because there was no match, such as the right table's key."

summary:
  - "Facts are stored once and linked by keys; a join recombines rows by an ON condition, usually foreign key = primary key."
  - "INNER JOIN keeps matches only; LEFT JOIN also keeps unmatched left rows with NULLs."
  - "Many-to-many relationships need a link table; chain one JOIN per table."
  - "Aliases let you join a table to itself; a LEFT JOIN with IS NULL finds rows with no match."
  - "ON decides how rows match; filters on the right table of a LEFT JOIN belong in ON."
next: u12-aggregation

quiz:
  - type: mcq
    question: What does an INNER JOIN do with a left row that has no matching right row?
    options: ["Leaves it out of the result", "Keeps it with NULLs", "Raises an error", "Pairs it with every right row"]
    answer: 0
    explanation: "Only matched pairs survive an inner join."
  - type: mcq
    question: What does a LEFT JOIN guarantee?
    options: [
      "Every row of the left table appears at least once",
      "Every row of the right table appears at least once",
      "Rows are sorted by the left table",
      "No row appears twice"
    ]
    answer: 0
    explanation: "Unmatched left rows are kept with NULL in the right table's columns."
  - type: mcq
    question: A many-to-many relationship between students and courses is stored using
    options: ["A third link table with a foreign key to each", "A list of ids inside one column", "Duplicate rows in student", "A single foreign key in course"]
    answer: 0
    explanation: "A link table (here enrollment) holds one row for each pairing."
  - type: mcq
    question: You join two tables and forget the ON clause. If they have 10 and 20 rows, how many rows can come back?
    options: ["200", "30", "20", "10"]
    answer: 0
    explanation: "With no condition every row pairs with every row: 10 x 20."
  - type: mcq
    question: How do you find students with no enrollments using joins?
    options: [
      "LEFT JOIN enrollment and keep rows where the enrollment key IS NULL",
      "INNER JOIN enrollment and count the rows",
      "JOIN enrollment ON 1 = 1",
      "ORDER BY enrollment.student_id"
    ]
    answer: 0
    explanation: "The LEFT JOIN creates NULLs exactly for students with no match."
  - type: mcq
    question: Why alias a table when joining it to itself?
    options: [
      "The two copies need different names so columns can be qualified",
      "It makes the query faster",
      "SQL forbids repeating a table name",
      "It copies the table on disk"
    ]
    answer: 0
    explanation: "The aliases let you say which copy a column comes from."
  - type: code
    question: |
      Return the `title` of every course taken in term `S24`, once each, ordered by `title`.
    starter: |
      -- write your query here
    tests:
      - name: rows
        code: |
          expectRows([["Data Structures"], ["Compilers"], ["Intro to Programming"]].sort((a, b) => a[0] < b[0] ? -1 : 1));
    solution: |
      SELECT DISTINCT c.title
      FROM enrollment e
      JOIN course c ON c.code = e.course_code
      WHERE e.term = 'S24'
      ORDER BY c.title;
