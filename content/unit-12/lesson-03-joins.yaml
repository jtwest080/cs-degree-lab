id: u12-joins
title: "Joining Tables"
minutes: 55
objective: |
  Combine rows from several tables with joins: understand why data is split across tables, write INNER and LEFT joins on keys, use table aliases, chain more than two tables, join a table to itself, and find rows that have no match.
outcomes:
  - Explain why related data lives in separate tables and how a join puts it back together
  - Write INNER JOIN and LEFT JOIN queries using ON conditions
  - Use table aliases and qualified column names to avoid ambiguity
  - Chain joins across three or more tables, including a many-to-many link table
  - Find unmatched rows with LEFT JOIN ... IS NULL and join a table to itself

prelude: |
  CREATE TABLE department (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    building TEXT
  );
  CREATE TABLE student (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    major_id INTEGER REFERENCES department(id),
    year INTEGER,
    gpa REAL,
    email TEXT
  );
  CREATE TABLE course (
    code TEXT PRIMARY KEY,
    title TEXT NOT NULL,
    dept_id INTEGER REFERENCES department(id),
    credits INTEGER
  );
  CREATE TABLE enrollment (
    student_id INTEGER REFERENCES student(id),
    course_code TEXT REFERENCES course(code),
    term TEXT,
    grade TEXT,
    PRIMARY KEY (student_id, course_code, term)
  );
  INSERT INTO department VALUES (1,'Computer Science','Gates Hall'),(2,'Mathematics','Euler Building'),(3,'Physics','Newton Hall'),(4,'History',NULL);
  INSERT INTO student VALUES
   (1,'Ada Lovelace',1,3,3.9,'ada@uni.edu'),
   (2,'Alan Turing',1,4,3.8,'alan@uni.edu'),
   (3,'Grace Hopper',1,2,3.7,'grace@uni.edu'),
   (4,'Emmy Noether',2,3,3.95,'emmy@uni.edu'),
   (5,'Carl Gauss',2,1,3.5,NULL),
   (6,'Marie Curie',3,4,3.85,'marie@uni.edu'),
