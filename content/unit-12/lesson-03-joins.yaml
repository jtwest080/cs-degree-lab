  INSERT INTO course VALUES ('CS101','Intro to Programming',1,4),('CS201','Data Structures',1,4),('CS301','Databases',1,3),('CS401','Compilers',1,3),('MA101','Calculus I',2,4),('MA201','Linear Algebra',2,3),('PH101','Mechanics',3,4),('HI101','World History',4,3);
