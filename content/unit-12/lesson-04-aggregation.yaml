id: u12-aggregation
title: "Aggregation and Grouping"
minutes: 55
objective: |
  Summarise many rows into few: use COUNT, SUM, AVG, MIN and MAX, group rows with GROUP BY, filter groups with HAVING, understand how NULL affects aggregates, and combine aggregation with joins without counting rows twice.
outcomes:
  - Use the aggregate functions and explain how they treat NULL
  - Group rows with GROUP BY and filter the groups with HAVING
  - Explain the difference between WHERE and HAVING, and the full order of evaluation
  - Combine joins with aggregation and avoid double counting
  - Use window functions such as RANK and a running total to compute without collapsing rows

