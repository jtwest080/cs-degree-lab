id: u12-subqueries
title: "Subqueries, CTEs and Set Operations"
minutes: 55
objective: |
  Build bigger questions out of smaller ones: put a query inside another (scalar, list and table subqueries), correlate a subquery with the outer row, test existence with EXISTS, name steps with WITH (common table expressions), and combine results with UNION, INTERSECT and EXCEPT.
outcomes:
  - Use scalar, IN and table (FROM) subqueries
  - Write a correlated subquery and explain how it runs once per outer row
  - Use EXISTS and NOT EXISTS, and say why NOT EXISTS is safer than NOT IN
  - Name intermediate results with WITH and chain several of them
  - Combine result sets with UNION, UNION ALL, INTERSECT and EXCEPT

prelude: |
  CREATE TABLE department (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    building TEXT
