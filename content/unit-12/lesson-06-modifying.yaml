sections:
  - heading: INSERT, UPDATE, DELETE
    body: |
      Queries only read. Three statements change the data (together with `SELECT` they are the **CRUD** operations: create, read, update, delete):

      ```sql
      INSERT INTO course (code, title, dept_id, credits)
      VALUES ('CS501', 'Machine Learning', 1, 3);

      UPDATE student SET gpa = 3.5 WHERE id = 12;

      DELETE FROM enrollment WHERE grade IS NULL;
      ```

      Always list the column names in `INSERT`; relying on their position breaks the day someone adds a column. Several rows can be given at once: `VALUES (...), (...)`, and `INSERT INTO t SELECT ...` copies the result of a query. Columns you leave out get their default value (NULL unless the table says otherwise).

      **`UPDATE` and `DELETE` without a `WHERE` change every row.** `DELETE FROM student;` empties the table instantly and there is no "are you sure?". The habit of experienced people: write the `WHERE`, then run it as a `SELECT` first to see exactly which rows it will touch, then turn it into the `UPDATE` or `DELETE`. `UPDATE` can compute from the old value: `SET credits = credits + 1`. Each statement is atomic, meaning it either changes all the rows it matches or none; the next-but-one lesson explains how to extend that to groups of statements.

  - heading: Creating tables and choosing types
    body: |
      `CREATE TABLE` defines a table's name, columns and rules. Each column has a **type**. SQLite is relaxed about types (it uses **type affinity**: a column of declared type `INTEGER` tries to store numbers as integers but will accept text), while other databases are strict. The main families are `INTEGER`, `REAL` (floating point), `TEXT` and `BLOB` (raw bytes). Money should be stored as an integer count of cents, never as floating point, for the same reason you met in Unit 9: `0.1 + 0.2` is not `0.3`.

      ```sql
      CREATE TABLE room (
        id       INTEGER PRIMARY KEY,
        building TEXT NOT NULL,
        number   TEXT NOT NULL,
        seats    INTEGER NOT NULL CHECK (seats > 0),
        UNIQUE (building, number)
      );
      ```

      An `INTEGER PRIMARY KEY` in SQLite is special: if you omit it on insert, the database assigns the next free number (an **auto-increment** key). `DROP TABLE name` deletes a table and its data for good, so be careful; `DROP TABLE IF EXISTS` does not complain when it is already gone.

  - heading: Constraints
    body: |
      **Constraints** are rules the database enforces on every change, whoever or whatever makes it: your app, a script, a colleague at 2 a.m. That is far stronger than hoping every program remembers to check.

      | Constraint | Meaning |
      |---|---|
      | `PRIMARY KEY` | unique and not NULL; the row's identity (can span several columns) |
      | `NOT NULL` | a value is required |
      | `UNIQUE` | no two rows may have the same value (several NULLs are allowed) |
      | `CHECK (condition)` | the condition must not be false, e.g. `gpa BETWEEN 0 AND 4` |
      | `DEFAULT value` | the value used when none is given |
      | `FOREIGN KEY ... REFERENCES` | the value must exist in another table's key |

      A statement that breaks a constraint fails with an error and changes **nothing**. This is a feature: it turns a silent data corruption into a loud, immediate bug.

      **Foreign keys** need one extra step in SQLite: run `PRAGMA foreign_keys = ON;` for each connection (for historical reasons it is off by default; most other databases always enforce them). With enforcement on you cannot insert an enrollment for a student who does not exist, and you cannot delete a department that students still reference, unless you chose a rule for it: `ON DELETE CASCADE` deletes the referencing rows too, `ON DELETE SET NULL` clears the reference, `ON DELETE RESTRICT` (the default behaviour) refuses.

  - heading: Altering tables and views
    body: |
      Schemas evolve. `ALTER TABLE student ADD COLUMN phone TEXT;` adds a column (existing rows get NULL or the default); `ALTER TABLE student RENAME TO pupil;` and `RENAME COLUMN` rename; `DROP COLUMN` removes one. Bigger changes (such as adding a constraint to an existing column) are done in SQLite by creating a new table, copying the rows with `INSERT INTO ... SELECT`, dropping the old table and renaming the new one. Real systems keep such changes in numbered **migration** scripts so every copy of the database can be brought to the same version.

      A **view** is a saved query with a name. It stores no data of its own; each time you query the view the database runs the saved SELECT:

      ```sql
      CREATE VIEW honours AS
        SELECT id, name, gpa FROM student WHERE gpa >= 3.8;
      SELECT * FROM honours;
      ```

      Views hide complexity (a join written once, used everywhere), restrict access (show some columns of a table, hide others) and give old programs a stable face while the tables underneath change. Because a view is just a stored query, it is always up to date.

examples:
  - title: Insert, update, delete
    intro: "Three changes, then a SELECT to see the result. Only the last SELECT is displayed."
    code: |
      INSERT INTO course (code, title, dept_id, credits)
      VALUES ('CS501', 'Machine Learning', 1, 3);

      UPDATE course SET credits = credits + 1 WHERE code = 'CS501';

      DELETE FROM course WHERE code IN ('HI101', 'PH101');

      SELECT code, title, credits FROM course ORDER BY code;
    output: |
      code  | title                | credits
      ------+----------------------+--------
      CS101 | Intro to Programming | 4
      CS201 | Data Structures      | 4
      CS301 | Databases            | 3
      CS401 | Compilers            | 3
      CS501 | Machine Learning     | 4
      MA101 | Calculus I           | 4
      MA201 | Linear Algebra       | 3
    lines:
      - line: 1
        note: "Naming the columns makes the statement survive later schema changes."
      - line: 4
        note: "The new value is computed from the old one, for the matching row only."
      - line: 6
        note: "Without the WHERE this would delete every course. (Foreign keys are off here, so enrollments pointing at these courses are left dangling; the next example shows the fix.)"
  - title: Constraints stop bad data
    intro: "A new table with rules. The failing insert is the point: the error message names the rule."
    code: |
      CREATE TABLE room (
        id INTEGER PRIMARY KEY,
        building TEXT NOT NULL,
        number TEXT NOT NULL,
        seats INTEGER NOT NULL CHECK (seats > 0),
        UNIQUE (building, number)
      );
      INSERT INTO room (building, number, seats) VALUES ('Gates Hall', '101', 120);
      INSERT INTO room (building, number, seats) VALUES ('Gates Hall', '101', 60);
    expectError: true
    error: "UNIQUE constraint failed: room.building, room.number"
    lines:
      - line: 7
        note: "The id is chosen automatically because an INTEGER PRIMARY KEY is auto-assigned."
      - line: 8
        note: "The same building and number twice violates UNIQUE (building, number). The statement fails and nothing is stored."
  - title: Foreign keys
    intro: "With enforcement turned on, a row cannot point at something that does not exist."
    code: |
      PRAGMA foreign_keys = ON;
      INSERT INTO enrollment (student_id, course_code, term, grade)
      VALUES (99, 'CS101', 'S25', NULL);
    expectError: true
    error: "FOREIGN KEY constraint failed"
    lines:
      - line: 1
        note: "SQLite needs this on every connection. Other databases enforce foreign keys always."
      - line: 3
        note: "There is no student 99, so the insert is rejected."
  - title: Defaults, CHECK and ALTER
    intro: "Add a column to an existing table with a default, update through it, and read it back."
    code: |
      ALTER TABLE student ADD COLUMN status TEXT NOT NULL DEFAULT 'active';
      UPDATE student SET status = 'graduated' WHERE year = 4;
      SELECT status, COUNT(*) AS n FROM student GROUP BY status ORDER BY status;
    output: |
      status    | n
      ----------+---
      active    | 10
      graduated | 2
    lines:
      - line: 1
        note: "Every existing row receives the default value."
      - line: 2
        note: "Two year-4 students change; the rest keep the default."
  - title: A view
    intro: "Save a join as a view and query it like a table."
    code: |
      CREATE VIEW transcript AS
        SELECT s.name AS student, c.title AS course, e.term, e.grade
        FROM enrollment e
        JOIN student s ON s.id = e.student_id
        JOIN course c ON c.code = e.course_code;

      SELECT student, course, grade FROM transcript
      WHERE term = 'S24' ORDER BY student, course;
    output: |
      student       | course               | grade
      --------------+----------------------+------
      Ada Lovelace  | Data Structures      | A
      Alan Turing   | Compilers            | A
      Hannah Arendt | Intro to Programming | B
    lines:
      - line: 1
        note: "A view stores the query, not the rows."
      - line: 7
        note: "The view is queried exactly like a table, and always reflects the current data."

playground:
  prompt: |
    Insert yourself as a student, change your GPA with an UPDATE, then SELECT to confirm. Then try to insert a row with the same id twice and read the error.
  code: |
    INSERT INTO student (id, name, year) VALUES (13, 'Your Name', 1);
    SELECT * FROM student WHERE id = 13;

exercises:
  - id: add-course
    title: Add a course
    difficulty: 1
    prompt: |
      Insert a new course with code `CS450`, title `Operating Systems`, department 1 and 4 credits. Then raise the credits of **every** CS course (department 1) by 1.
    starter: |
      -- write your statements here
    tests:
      - name: inserted
        code: |
          const r = query("SELECT title, dept_id FROM course WHERE code = 'CS450'");
          if (r.length !== 1) throw new Error("CS450 is missing");
          if (r[0][0] !== "Operating Systems" || r[0][1] !== 1) throw new Error("Wrong title or department");
      - name: credits raised
        code: |
          const r = query("SELECT code, credits FROM course WHERE dept_id = 1 ORDER BY code");
          const want = [["CS101", 5], ["CS201", 5], ["CS301", 4], ["CS401", 4], ["CS450", 5]];
          if (JSON.stringify(r) !== JSON.stringify(want)) throw new Error("Expected " + JSON.stringify(want) + " but got " + JSON.stringify(r));
      - name: others untouched
        code: |
          const r = query("SELECT SUM(credits) FROM course WHERE dept_id <> 1");
          if (r[0][0] !== 14) throw new Error("Courses outside CS must not change");
    hints:
      - "`INSERT INTO course (code, title, dept_id, credits) VALUES (...)`."
      - "`UPDATE course SET credits = credits + 1 WHERE dept_id = 1;` after the insert, so the new course is raised too."
    solution: |
      INSERT INTO course (code, title, dept_id, credits)
      VALUES ('CS450', 'Operating Systems', 1, 4);
      UPDATE course SET credits = credits + 1 WHERE dept_id = 1;
    explanation: "Statements run in order, so the update also covers the course just inserted."
  - id: clean-ungraded
    title: Remove ungraded enrollments
    difficulty: 2
    prompt: |
      Delete every enrollment row whose `grade` is NULL. Then, for the remaining rows, change the term label `F24` to `FALL24`.
    starter: |
      DELETE FROM enrollment WHERE grade = NULL;
    tests:
      - name: deleted
        code: |
          const r = query("SELECT COUNT(*) FROM enrollment WHERE grade IS NULL");
          if (r[0][0] !== 0) throw new Error("Rows with a NULL grade are still there");
      - name: kept the rest
        code: |
          const r = query("SELECT COUNT(*) FROM enrollment");
          if (r[0][0] !== 25) throw new Error("Expected 25 enrollments to remain, found " + r[0][0]);
      - name: renamed
        code: |
          const r = query("SELECT COUNT(*) FROM enrollment WHERE term = 'F24'");
          if (r[0][0] !== 0) throw new Error("No row should still say F24");
          const n = query("SELECT COUNT(*) FROM enrollment WHERE term = 'FALL24'");
          if (n[0][0] !== 11) throw new Error("Expected 11 rows in FALL24, found " + n[0][0]);
    hints:
      - "`= NULL` never matches. Use `IS NULL`."
      - "Then `UPDATE enrollment SET term = 'FALL24' WHERE term = 'F24';`."
    solution: |
      DELETE FROM enrollment WHERE grade IS NULL;
      UPDATE enrollment SET term = 'FALL24' WHERE term = 'F24';
    explanation: "The same NULL rule applies to DELETE and UPDATE. Always check which rows a WHERE matches before running a change."
  - id: create-room
    title: Design a table
    difficulty: 3
    prompt: |
      Create a table `exam` with columns: `id` (integer primary key), `course_code` (text, required, must refer to `course(code)`), `exam_date` (text, required), and `max_points` (integer, required, default 100, must be greater than 0). Then insert one exam for `CS101` on `2025-05-12` with the default points.
    starter: |
      -- write your statements here
    tests:
      - name: table exists with columns
        code: |
          const cols = query("SELECT name FROM pragma_table_info('exam') ORDER BY cid").map((r) => r[0]);
          if (JSON.stringify(cols) !== JSON.stringify(["id", "course_code", "exam_date", "max_points"])) throw new Error("Columns should be id, course_code, exam_date, max_points; got " + JSON.stringify(cols));
      - name: row inserted with default
        code: |
          const r = query("SELECT course_code, exam_date, max_points FROM exam");
          if (JSON.stringify(r) !== JSON.stringify([["CS101", "2025-05-12", 100]])) throw new Error("Expected one CS101 exam with 100 points, got " + JSON.stringify(r));
      - name: constraints
        code: |
          const info = query("SELECT name, \"notnull\", dflt_value, pk FROM pragma_table_info('exam') ORDER BY cid");
          if (info[0][3] !== 1) throw new Error("id must be the primary key");
          if (info[1][1] !== 1 || info[2][1] !== 1 || info[3][1] !== 1) throw new Error("course_code, exam_date and max_points must be NOT NULL");
          if (String(info[3][2]) !== "100") throw new Error("max_points needs DEFAULT 100");
          const fk = query("SELECT \"table\", \"from\", \"to\" FROM pragma_foreign_key_list('exam')");
          if (JSON.stringify(fk) !== JSON.stringify([["course", "course_code", "code"]])) throw new Error("course_code must reference course(code)");
    hints:
      - "`CREATE TABLE exam (id INTEGER PRIMARY KEY, course_code TEXT NOT NULL REFERENCES course(code), ...)`."
      - "`max_points INTEGER NOT NULL DEFAULT 100 CHECK (max_points > 0)`."
      - "Insert without naming max_points: `INSERT INTO exam (course_code, exam_date) VALUES (...)`."
    solution: |
      CREATE TABLE exam (
        id INTEGER PRIMARY KEY,
        course_code TEXT NOT NULL REFERENCES course(code),
        exam_date TEXT NOT NULL,
        max_points INTEGER NOT NULL DEFAULT 100 CHECK (max_points > 0)
      );
      INSERT INTO exam (course_code, exam_date) VALUES ('CS101', '2025-05-12');
    explanation: "Constraints live in the table definition. The default fills max_points when the insert leaves it out."
  - id: dept-view
    title: A summary view
    difficulty: 3
    prompt: |
      Create a view `dept_summary` with the columns `department` (the department name), `students` (number of students majoring in it) and `avg_gpa` (average gpa rounded to 2 decimals). Include departments with no students (students = 0). Then select everything from the view, ordered by `department`.
    starter: |
      -- write your statements here
    tests:
      - name: output columns
        code: |
          expectColumns(["department", "students", "avg_gpa"]);
      - name: rows
        code: |
          expectRows([["Computer Science", 5, 3.7], ["History", 1, 3.6], ["Mathematics", 3, 3.78], ["Physics", 2, 3.53]].map((r) => r));
      - name: it is a view
        code: |
          const r = query("SELECT type FROM sqlite_master WHERE name = 'dept_summary'");
          if (r.length !== 1 || r[0][0] !== "view") throw new Error("dept_summary should be a VIEW");
    hints:
      - "`CREATE VIEW dept_summary AS SELECT ...` with a LEFT JOIN from department to student."
      - "Count `s.id` so empty departments show 0; group by the department."
    solution: |
      CREATE VIEW dept_summary AS
        SELECT d.name AS department,
               COUNT(s.id) AS students,
               ROUND(AVG(s.gpa), 2) AS avg_gpa
        FROM department d
        LEFT JOIN student s ON s.major_id = d.id
        GROUP BY d.id, d.name;
      SELECT * FROM dept_summary ORDER BY department;
    explanation: "A view is just a saved SELECT; the final SELECT queries it like a table."

commonMistakes:
  - title: "UPDATE or DELETE without WHERE"
    explanation: "It changes every row. Run the WHERE as a SELECT first."
    wrong: |
      DELETE FROM enrollment;
    right: |
      DELETE FROM enrollment WHERE student_id = 9;
  - title: "Assuming foreign keys are enforced in SQLite"
    explanation: "Run `PRAGMA foreign_keys = ON;` first, or invalid references will be accepted."
  - title: "Storing money as REAL"
    explanation: "Floating point cannot represent most decimals exactly. Store whole cents as an integer."
  - title: "INSERT without a column list"
    explanation: "`INSERT INTO t VALUES (...)` depends on column order. Name the columns."

summary:
  - "INSERT adds rows, UPDATE changes rows, DELETE removes rows; UPDATE and DELETE affect every row unless WHERE limits them."
  - "CREATE TABLE sets the types and constraints (PRIMARY KEY, NOT NULL, UNIQUE, CHECK, DEFAULT, FOREIGN KEY) that protect the data."
  - "A statement that violates a constraint fails and changes nothing."
  - "Foreign keys keep references valid; ON DELETE chooses RESTRICT, CASCADE or SET NULL."
  - "ALTER TABLE evolves a schema; a view is a saved query with a name and stores no data."
