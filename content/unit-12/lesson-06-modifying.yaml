id: u12-modifying
title: "Changing Data and Defining Tables"
minutes: 55
objective: |
  Write data and structure: INSERT, UPDATE and DELETE rows, create tables with types and constraints (PRIMARY KEY, NOT NULL, UNIQUE, CHECK, DEFAULT, FOREIGN KEY), alter tables, and save a query as a view.
outcomes:
  - Insert, update and delete rows, and explain why UPDATE and DELETE need a WHERE clause
  - Create tables with column types and constraints that protect the data
  - Explain how foreign keys keep references valid, and the choices on delete
  - Alter a table and drop objects safely
  - Create and use a view

prelude: |
  CREATE TABLE department (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    building TEXT
  );
  CREATE TABLE student (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    major_id INTEGER REFERENCES department(id),
    year INTEGER,
    gpa REAL,
    email TEXT
  );
  CREATE TABLE course (
    code TEXT PRIMARY KEY,
    title TEXT NOT NULL,
    dept_id INTEGER REFERENCES department(id),
    credits INTEGER
  );
  CREATE TABLE enrollment (
    student_id INTEGER REFERENCES student(id),
    course_code TEXT REFERENCES course(code),
    term TEXT,
    grade TEXT,
    PRIMARY KEY (student_id, course_code, term)
  );
  INSERT INTO department VALUES (1,'Computer Science','Gates Hall'),(2,'Mathematics','Euler Building'),(3,'Physics','Newton Hall'),(4,'History',NULL);
