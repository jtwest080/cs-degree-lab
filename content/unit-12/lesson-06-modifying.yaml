quiz:
  - type: mcq
    question: What happens when you run `UPDATE student SET gpa = 4.0;` with no WHERE?
    options: ["Every student's gpa becomes 4.0", "Nothing, WHERE is required", "Only the first row changes", "Only rows with a NULL gpa change"]
    answer: 0
    explanation: "Without WHERE, every row matches."
  - type: mcq
    question: What does a CHECK constraint do?
    options: [
      "Rejects changes that make its condition false",
      "Speeds up queries",
      "Creates a foreign key",
      "Copies a table"
    ]
    answer: 0
    explanation: "CHECK (seats > 0) refuses any row where seats is not greater than 0."
  - type: mcq
    question: "A statement violates a NOT NULL constraint. What is the state of the data afterwards?"
    options: ["Unchanged by that statement", "Partly updated", "The row is stored with a default", "The table is locked forever"]
    answer: 0
    explanation: "A failed statement changes nothing."
  - type: mcq
    question: What does ON DELETE CASCADE do?
    options: [
      "Deleting the parent row also deletes the rows that reference it",
      "It refuses the delete",
      "It sets the reference to NULL",
      "It archives the parent row"
    ]
    answer: 0
    explanation: "CASCADE propagates the delete to referencing rows."
  - type: mcq
    question: What does a view store?
    options: ["A named query, no data of its own", "A copy of the data", "An index", "A backup"]
    answer: 0
    explanation: "Each time you query the view the saved SELECT runs on the current tables."
  - type: mcq
    question: Why store money as an integer number of cents?
    options: [
      "Floating point cannot represent most decimal fractions exactly",
      "Integers use less memory",
      "SQL forbids decimals",
      "Cents sort faster"
    ]
    answer: 0
    explanation: "0.1 + 0.2 is not exactly 0.3 in binary floating point; integers are exact."
  - type: code
    question: |
      Add a column `nickname` (text, may be empty) to `department`, then set the nickname of department 1 to `CS`.
    starter: |
      -- write your statements here
    tests:
      - name: column and value
        code: |
          const r = query("SELECT id, nickname FROM department ORDER BY id");
          if (JSON.stringify(r) !== JSON.stringify([[1, "CS"], [2, null], [3, null], [4, null]])) throw new Error("Got " + JSON.stringify(r));
    solution: |
      ALTER TABLE department ADD COLUMN nickname TEXT;
      UPDATE department SET nickname = 'CS' WHERE id = 1;
