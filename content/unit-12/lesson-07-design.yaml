id: u12-design
title: "Database Design and Normalization"
minutes: 55
objective: |
  Design tables that store each fact once: model entities and relationships, recognise update, insert and delete anomalies, find functional dependencies, and normalise a messy table into first, second and third normal form, while knowing when breaking the rules is sensible.
outcomes:
  - Turn a description into entities, attributes and relationships with their cardinalities
  - Explain the three kinds of anomaly caused by redundancy
  - State a functional dependency and use a query to test whether it holds
  - Apply 1NF, 2NF and 3NF to split a table without losing information
  - Choose between natural and surrogate keys, and explain when denormalising helps

prelude: |
  CREATE TABLE flat_sale (
    sale_id INTEGER PRIMARY KEY,
    sale_date TEXT,
    customer_name TEXT,
    customer_city TEXT,
    product_name TEXT,
    product_price INTEGER,
    qty INTEGER
  );
  INSERT INTO flat_sale VALUES
   (1,'2025-01-03','Asha','Pune','Notebook',120,2),
   (2,'2025-01-03','Asha','Pune','Pen',20,10),
   (3,'2025-01-04','Ben','Leeds','Notebook',120,1),
   (4,'2025-01-07','Chloe','Oslo','Lamp',900,1),
   (5,'2025-01-09','Ben','Leeds','Pen',20,5),
   (6,'2025-01-10','Asha','Puna','Lamp',900,1),
   (7,'2025-01-12','Dmitri','Kyiv','Pen',20,3),
   (8,'2025-01-15','Chloe','Oslo','Notebook',125,4),
   (9,'2025-01-16','Dmitri','Kyiv','Lamp',900,2);

sections:
  - heading: Start with the things, not the tables
    body: |
      Good schemas begin on paper, not in SQL. List the **entities** (the things the system must remember: students, courses, departments), their **attributes** (properties: a student's name and year) and the **relationships** between them (a student *enrolls in* a course). Each relationship has a **cardinality**: one-to-one, one-to-many or many-to-many, and each side may be mandatory or optional (must a student have a major? In our data, no).

      A diagram of entities as boxes and relationships as lines is an **entity-relationship (ER) diagram**. Turning it into tables follows three rules you already know from the last lessons: each entity becomes a table with a primary key; a one-to-many relationship becomes a foreign key on the "many" side; a many-to-many relationship becomes a link table holding two foreign keys (and any attributes of the relationship itself, like a grade).

      **Choosing keys.** A *natural key* is a real-world identifier (course code, passport number); a *surrogate key* is a meaningless number invented by the database (`id INTEGER PRIMARY KEY`). Natural keys are readable but real-world identifiers do change, get reused, or turn out not to be unique. Most designs use a surrogate key for the primary key and keep natural identifiers as `UNIQUE` columns.

  - heading: What goes wrong with one big table
    body: |
      The table `flat_sale` in this lesson's database records sales with the customer's name and city and the product's name and price repeated on every row. That **redundancy** causes three kinds of **anomaly**:

      - **Update anomaly.** Asha's city is stored three times. One was typed as `Puna`, the other two as `Pune`. Change a city and you must change every row; miss one and the data contradicts itself. (Look at sales 6 and 8: the notebook costs 120 in one row and 125 in another. Which is right?)
      - **Insert anomaly.** You cannot record a new product until somebody buys it, because a product only exists inside a sale row. You would have to invent a sale or leave sale columns empty.
      - **Delete anomaly.** If Chloe's only purchase is cancelled and its row deleted, the *fact that Chloe lives in Oslo* disappears with it.

      The cure is to give every fact its own home: a customer's city lives in one row of a `customer` table, a product's price in one row of a `product` table. A sale refers to them by key.

  - heading: Functional dependencies
    body: |
      The theory behind this is the **functional dependency (FD)**. We write `A → B` ("A determines B") when any two rows that agree on A must also agree on B. Examples that should hold in real life: `customer_name → customer_city` (a customer lives in one city, assuming names are unique), `product_name → product_price`, and `sale_id → everything` (the key).

      You can **test** a dependency in the data with a query. If a dependency holds, no value of A can map to two different values of B:

      ```sql
      SELECT customer_name FROM flat_sale
      GROUP BY customer_name HAVING COUNT(DISTINCT customer_city) > 1;
      ```

      Any row returned is a **violation**, either a data error (the `Puna` typo) or proof that the dependency does not really hold. Remember that data can only *refute* a dependency; whether it is true is a fact about the real world, which you must decide by understanding the domain.

      A **key** is a set of columns that determines every other column in the row, and is minimal (no column can be removed). The problem tables above have the key `sale_id`, yet customer and product facts depend on only *part* of the row's meaning, which is what the normal forms address.

  - heading: Normal forms
    body: |
      **Normal forms** are checklists for removing redundancy, each stricter than the last.

      - **First normal form (1NF).** Every cell holds a single, atomic value, and rows are distinct. A column such as `courses = 'CS101,CS201,MA101'` violates it: you cannot index it, join it, count it, or enforce that each course exists. Move each value to its own row in a related table. Repeating columns (`course1`, `course2`, `course3`) violate the spirit too.
      - **Second normal form (2NF).** In 1NF, and no column depends on only *part* of a composite key. Consider `enrollment(student_id, course_code, student_name, grade)` with the key `(student_id, course_code)`: `student_name` depends on `student_id` alone, so it does not belong here. Move it to the `student` table. (A table with a single-column key is automatically in 2NF.)
      - **Third normal form (3NF).** In 2NF, and no non-key column depends on another non-key column. In `student(id, major_id, major_name)`, `major_name` is determined by `major_id`, which is not the key. This is a *transitive* dependency (id → major_id → major_name). Move `major_name` to `department`. A catchphrase: *every column depends on the key, the whole key, and nothing but the key.*
      - **Boyce-Codd normal form (BCNF)** is a slightly stricter 3NF that handles rare overlapping-key cases. Most practical designs aim for 3NF.

      Splitting must be **lossless**: joining the pieces back must give exactly the original rows. Splitting on a genuine functional dependency guarantees that.

  - heading: When to break the rules
    body: |
      Normalisation optimises for correctness: each fact in one place. It costs joins at query time. Data warehouses and reporting systems often deliberately **denormalise**, copying values into one wide table so reads need no joins and are fast, accepting that a loader process must keep the copies consistent. Caches and summary tables are the same trade. A sound approach: **normalise first** to get a correct model; denormalise later, deliberately, where measurements show a real read bottleneck, and know which copy is the source of truth.

      Other design habits worth knowing: name tables in the singular and columns clearly (`created_at`, not `d1`); never put two facts in one column; store each fact in the units you will compute with; add `NOT NULL`, `UNIQUE`, `CHECK` and foreign keys so the database defends the design; and keep a column for each real thing you will search by.

examples:
  - title: Seeing the redundancy
    intro: "The same customer and product facts repeat on many rows. Counting distinct combinations shows how few separate facts there really are."
    code: |
      SELECT COUNT(*) AS sale_rows,
             COUNT(DISTINCT customer_name) AS customers,
             COUNT(DISTINCT product_name) AS products,
             COUNT(DISTINCT customer_name || '/' || customer_city) AS customer_city_pairs
      FROM flat_sale;
    output: |
      sale_rows | customers | products | customer_city_pairs
      ----------+-----------+----------+--------------------
      9         | 4         | 3        | 5
    lines:
      - line: 2
        note: "Only four different customers exist, but there are nine rows."
      - line: 4
        note: "Five pairs for four customers: Asha appears with two different cities. This is an update anomaly already in the data."
  - title: Testing a functional dependency
    intro: "Does customer_name determine customer_city? A query finds the counter-examples."
    code: |
      SELECT customer_name,
             COUNT(DISTINCT customer_city) AS cities,
             GROUP_CONCAT(DISTINCT customer_city) AS seen
      FROM flat_sale
      GROUP BY customer_name
      HAVING COUNT(DISTINCT customer_city) > 1;
    output: |
      customer_name | cities | seen
      --------------+--------+----------
      Asha          | 2      | Pune,Puna
    lines:
      - line: 3
        note: "GROUP_CONCAT joins the values of a group into one text, handy for inspecting them."
      - line: 5
        note: "Every row returned is a violation of customer_name → customer_city."
  - title: "Another violation: the price"
    intro: "The same test for product_name → product_price finds the inconsistent notebook price."
    code: |
      SELECT product_name, GROUP_CONCAT(DISTINCT product_price) AS prices
      FROM flat_sale
      GROUP BY product_name
      HAVING COUNT(DISTINCT product_price) > 1;
    output: |
      product_name | prices
      -------------+--------
      Notebook     | 120,125
    lines:
      - line: 4
        note: "Notebook is recorded at two prices. Sale 8 may be a discount, a typo, or a new price: the data cannot tell us, which is exactly why the price should belong to the product, not the sale."
  - title: Splitting into 3NF
    intro: "Create customer and product tables from the data (after deciding which values are right), then a sale table that refers to them. The final SELECT shows the result."
    code: |
      CREATE TABLE customer (id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE, city TEXT NOT NULL);
      CREATE TABLE product  (id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE, price INTEGER NOT NULL);
      CREATE TABLE sale (
        id INTEGER PRIMARY KEY, sale_date TEXT NOT NULL,
        customer_id INTEGER NOT NULL REFERENCES customer(id),
        product_id  INTEGER NOT NULL REFERENCES product(id),
        qty INTEGER NOT NULL CHECK (qty > 0)
      );
      INSERT INTO customer (name, city)
        SELECT customer_name, MAX(customer_city) FROM flat_sale GROUP BY customer_name;
      INSERT INTO product (name, price)
        SELECT product_name, MIN(product_price) FROM flat_sale GROUP BY product_name;
      INSERT INTO sale (id, sale_date, customer_id, product_id, qty)
        SELECT f.sale_id, f.sale_date, c.id, p.id, f.qty
        FROM flat_sale f
        JOIN customer c ON c.name = f.customer_name
        JOIN product p ON p.name = f.product_name;
      SELECT (SELECT COUNT(*) FROM customer) AS customers,
             (SELECT COUNT(*) FROM product) AS products,
             (SELECT COUNT(*) FROM sale) AS sales;
    output: |
      customers | products | sales
      ----------+----------+------
      4         | 3        | 9
    lines:
      - line: 8
        note: "One row per customer. MAX picks Pune over Puna here, a deliberate (and arguable) choice to settle the conflict; a real project would ask Asha."
      - line: 12
        note: "The sale table keeps only the keys and the facts about the sale itself."
  - title: Lossless? Rebuild the original
    intro: "Joining the three tables back must give the original nine rows, apart from the two conflicts we resolved."
    code: |
      CREATE TABLE customer (id INTEGER PRIMARY KEY, name TEXT UNIQUE, city TEXT);
      CREATE TABLE product (id INTEGER PRIMARY KEY, name TEXT UNIQUE, price INTEGER);
      CREATE TABLE sale (id INTEGER PRIMARY KEY, sale_date TEXT, customer_id INTEGER, product_id INTEGER, qty INTEGER);
      INSERT INTO customer (name, city) SELECT customer_name, MAX(customer_city) FROM flat_sale GROUP BY customer_name;
      INSERT INTO product (name, price) SELECT product_name, MIN(product_price) FROM flat_sale GROUP BY product_name;
      INSERT INTO sale SELECT f.sale_id, f.sale_date, c.id, p.id, f.qty
        FROM flat_sale f JOIN customer c ON c.name = f.customer_name JOIN product p ON p.name = f.product_name;

      SELECT COUNT(*) AS rebuilt_rows,
             SUM(f.customer_city = c.city AND f.product_price = p.price) AS identical_rows
      FROM sale s
      JOIN customer c ON c.id = s.customer_id
      JOIN product p ON p.id = s.product_id
      JOIN flat_sale f ON f.sale_id = s.id;
    output: |
      rebuilt_rows | identical_rows
      -------------+---------------
      9            | 7
    lines:
      - line: 9
        note: "Same nine sales come back."
      - line: 10
        note: "Seven rows match the original exactly; the two that differ are the typo and the notebook price we standardised. That is information we chose to correct, not lose."
  - title: Atomic values (1NF)
    intro: "A comma-separated list in one cell is hard to query correctly."
    code: |
      CREATE TABLE bad (student TEXT, courses TEXT);
      INSERT INTO bad VALUES ('Ada', 'CS101,CS201'), ('Ben', 'CS101'), ('Cy', 'CS1011');
      SELECT student FROM bad WHERE courses LIKE '%CS101%';
    output: |
      student
      -------
      Ada
      Ben
      Cy
    lines:
      - line: 3
        note: "Cy wrongly matches because CS1011 contains CS101. With one value per row and a proper join, this class of bug cannot happen."

playground:
  prompt: |
    Look at the flat_sale table and decide which other functional dependencies might hold. Test one with a GROUP BY ... HAVING COUNT(DISTINCT ...) > 1 query. Is `sale_date → customer_name` a real dependency?
  code: |
    SELECT sale_date, GROUP_CONCAT(DISTINCT customer_name) AS customers
    FROM flat_sale
    GROUP BY sale_date
    HAVING COUNT(DISTINCT customer_name) > 1;

exercises:
  - id: find-conflicts
    title: Find conflicting facts
    difficulty: 2
    prompt: |
      Return the `product_name` and the number of different prices (`prices`) for every product that is recorded at **more than one price**.
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["product_name", "prices"]);
      - name: rows
        code: |
          expectRows([["Notebook", 2]]);
    hints:
      - "`GROUP BY product_name`."
      - "`HAVING COUNT(DISTINCT product_price) > 1`."
    solution: |
      SELECT product_name, COUNT(DISTINCT product_price) AS prices
      FROM flat_sale
      GROUP BY product_name
      HAVING COUNT(DISTINCT product_price) > 1;
    explanation: "The same test used for the FD earlier: a dependency product_name → product_price is broken whenever one name has two prices."
  - id: build-customers
    title: Extract the customers
    difficulty: 3
    prompt: |
      Create a table `customer` with columns `id` (integer primary key), `name` (text, unique, required) and `city` (text, required). Fill it from `flat_sale` with **one row per customer**, using the city that is written **most often** for that customer (for Asha that is `Pune`; you may assume no ties).
    starter: |
      -- write your statements here
    tests:
      - name: rows
        code: |
          const r = query("SELECT name, city FROM customer ORDER BY name");
          const want = [["Asha", "Pune"], ["Ben", "Leeds"], ["Chloe", "Oslo"], ["Dmitri", "Kyiv"]];
          if (JSON.stringify(r) !== JSON.stringify(want)) throw new Error("Expected " + JSON.stringify(want) + " but got " + JSON.stringify(r));
      - name: constraints
        code: |
          const info = query("SELECT name, \"notnull\", pk FROM pragma_table_info('customer') ORDER BY cid");
          if (info.length !== 3 || info[0][2] !== 1) throw new Error("customer needs id (primary key), name, city");
          if (info[1][1] !== 1 || info[2][1] !== 1) throw new Error("name and city must be NOT NULL");
          const idx = query("SELECT COUNT(*) FROM pragma_index_list('customer') WHERE \"unique\" = 1");
          if (idx[0][0] < 1) throw new Error("name must be UNIQUE");
    hints:
      - "Count each (customer_name, customer_city) pair in a subquery, then keep the pair with the highest count per customer."
      - "A simple way: a CTE `c` with `GROUP BY customer_name, customer_city` and `COUNT(*) AS n`, then choose rows where n equals the max n for that customer."
    solution: |
      CREATE TABLE customer (
        id INTEGER PRIMARY KEY,
        name TEXT NOT NULL UNIQUE,
        city TEXT NOT NULL
      );
      INSERT INTO customer (name, city)
      WITH c AS (
        SELECT customer_name AS name, customer_city AS city, COUNT(*) AS n
        FROM flat_sale GROUP BY customer_name, customer_city
      )
      SELECT name, city FROM c
      WHERE n = (SELECT MAX(n) FROM c c2 WHERE c2.name = c.name);
    explanation: "Resolve the conflict by majority vote, with a correlated subquery. Whichever rule you choose, write it down: you are deciding which fact is true."
  - id: sale-lines
    title: Revenue per customer
    difficulty: 3
    prompt: |
      Using only `flat_sale`, return `customer_name` and `total`, where `total` is the sum of `qty * product_price` over that customer's sales. Order by `total` descending. (Notice that the answer depends on trusting the price copied onto every row.)
    starter: |
      -- write your query here
    tests:
      - name: columns
        code: |
          expectColumns(["customer_name", "total"]);
      - name: rows
        code: |
          expectRows([["Dmitri", 1860], ["Chloe", 1400], ["Asha", 1340], ["Ben", 220]]);
    hints:
      - "`SUM(qty * product_price)` grouped by `customer_name`."
    solution: |
      SELECT customer_name, SUM(qty * product_price) AS total
      FROM flat_sale
      GROUP BY customer_name
      ORDER BY total DESC;
    explanation: "Even in a denormalised table you can compute totals; the weakness is trusting a repeated price."
  - id: split-list
    title: Normalise a list column
    difficulty: 4
    prompt: |
      A table `tags_bad(post_id, tags)` holds `1|'sql,db'`, `2|'db'`, `3|'sql,web,db'`. Create a proper table `post_tag(post_id, tag)` with **one row per post and tag**, then return, for each tag, how many posts have it. Columns `tag`, `posts`, ordered by `posts` descending then `tag`. Use the rows listed: write the INSERTs yourself.
    starter: |
      -- write your statements here
    tests:
      - name: columns
        code: |
          expectColumns(["tag", "posts"]);
      - name: rows
        code: |
          expectRows([["db", 3], ["sql", 2], ["web", 1]]);
      - name: table shape
        code: |
          const cols = query("SELECT name FROM pragma_table_info('post_tag') ORDER BY cid").map((r) => r[0]);
          if (JSON.stringify(cols) !== JSON.stringify(["post_id", "tag"])) throw new Error("post_tag needs the columns post_id and tag");
    hints:
      - "`CREATE TABLE post_tag (post_id INTEGER, tag TEXT);` then insert (1,'sql'), (1,'db'), ..."
      - "Finish with `SELECT tag, COUNT(*) AS posts FROM post_tag GROUP BY tag ORDER BY posts DESC, tag;`."
    solution: |
      CREATE TABLE post_tag (post_id INTEGER, tag TEXT, PRIMARY KEY (post_id, tag));
      INSERT INTO post_tag VALUES (1,'sql'),(1,'db'),(2,'db'),(3,'sql'),(3,'web'),(3,'db');
      SELECT tag, COUNT(*) AS posts FROM post_tag GROUP BY tag ORDER BY posts DESC, tag;
    explanation: "One value per cell makes counting, searching and joining trivial. The composite primary key stops a post being tagged twice with the same tag."

commonMistakes:
  - title: "Storing a list in one column"
    explanation: "Comma-separated values defeat joins, constraints and indexes. Use a related table with one row per value."
  - title: "Using a changeable real-world value as the primary key"
    explanation: "Emails, names and phone numbers change. Use a surrogate key and keep the natural value UNIQUE."
  - title: "Copying a value into several tables 'for convenience'"
    explanation: "Each copy can drift. Store it once and join, or document the copy as deliberate denormalisation."
  - title: "Over-splitting"
    explanation: "Normalising is a means to correctness. Do not split a street, a city and a postcode into three tables unless your queries need that."

summary:
  - "Model entities, attributes and relationships first; one-to-many becomes a foreign key and many-to-many a link table."
  - "Redundancy causes update, insert and delete anomalies."
  - "A functional dependency A → B means equal A implies equal B; queries can refute but not prove one."
  - "1NF: atomic cells. 2NF: no dependence on part of a key. 3NF: nothing but the key determines a column."
  - "Splits must be lossless; denormalise deliberately and only for measured read performance."
next: u12-transactions

quiz:
  - type: mcq
    question: A product's price is stored on every sale row. What is this an example of?
    options: ["Redundancy that causes update anomalies", "Good normalisation", "A foreign key", "A transaction"]
    answer: 0
    explanation: "Changing the price means updating many rows, and missing one leaves contradictions."
  - type: mcq
    question: What does the functional dependency A → B mean?
    options: [
      "Rows that agree on A must agree on B",
      "A and B are always equal",
      "B is the primary key",
      "A is unique"
    ]
    answer: 0
    explanation: "A determines B: the value of A fixes the value of B."
  - type: mcq
    question: Which violates first normal form?
    options: [
      "A column holding the text 'CS101,CS201'",
      "A table with a composite key",
      "A NULL in a column",
      "A foreign key"
    ]
    answer: 0
    explanation: "1NF requires one atomic value per cell."
  - type: mcq
    question: "A table enrollment(student_id, course_code, student_name, grade) has key (student_id, course_code). What is wrong with student_name?"
    options: [
      "It depends on only part of the key",
      "It is not unique",
      "It should be a number",
      "Nothing"
    ]
    answer: 0
    explanation: "student_name is determined by student_id alone, a partial dependency violating 2NF."
  - type: mcq
    question: What is a transitive dependency?
    options: [
      "A non-key column determined by another non-key column",
      "A column determined by the whole key",
      "A foreign key to another table",
      "Two tables with the same name"
    ]
    answer: 0
    explanation: "id → major_id → major_name: major_name depends on the key only through major_id. 3NF removes it."
  - type: mcq
    question: When is denormalisation reasonable?
    options: [
      "When measured read performance needs it and you manage the copies",
      "Whenever a query uses a join",
      "Never",
      "Only for tiny tables"
    ]
    answer: 0
    explanation: "Normalise for correctness first, then copy data on purpose where it pays off."
  - type: code
    question: |
      Using `flat_sale`, return each `customer_name` and the number of distinct `product_name` values they bought as `kinds`, ordered by `kinds` descending then `customer_name`.
    starter: |
      -- write your query here
    tests:
      - name: rows
        code: |
          expectRows([["Asha", 3], ["Chloe", 2], ["Dmitri", 2], ["Ben", 2]].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)));
    solution: |
      SELECT customer_name, COUNT(DISTINCT product_name) AS kinds
      FROM flat_sale
      GROUP BY customer_name
      ORDER BY kinds DESC, customer_name;
