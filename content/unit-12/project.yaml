starter: |
  -- Campus Registrar: write your whole script here.
  -- The raw data is in the table raw_registration. Try:
  --   SELECT * FROM raw_registration;

  -- 1. Tables

  -- 2. Load the cleaned data

  -- 3. View and index

  -- 4. The withdrawal (inside a transaction)

  -- 5. The report (must be the last statement)
tests:
- name: student table is well formed
  code: |2

    const info = query("SELECT name, \"notnull\", pk FROM pragma_table_info('student') ORDER BY cid");
    const names = info.map((r) => r[0]);
    for (const n of ["id", "name", "email"]) if (!names.includes(n)) throw new Error("student needs a column named " + n);
    const get = (n) => info.find((r) => r[0] === n);
    if (get("id")[2] !== 1) throw new Error("student.id must be the primary key");
    if (get("name")[1] !== 1 || get("email")[1] !== 1) throw new Error("name and email must be NOT NULL");
    const uq = query("SELECT COUNT(*) FROM pragma_index_list('student') WHERE \"unique\" = 1 AND origin = 'u'");
    if (uq[0][0] < 1) throw new Error("email must be declared UNIQUE");
- name: course table is well formed
  code: |2

    const info = query("SELECT name, \"notnull\", pk FROM pragma_table_info('course') ORDER BY cid");
    const names = info.map((r) => r[0]);
    for (const n of ["code", "title", "credits"]) if (!names.includes(n)) throw new Error("course needs a column named " + n);
    if (info.find((r) => r[0] === "code")[2] !== 1) throw new Error("course.code must be the primary key");
    let rejected = false;
    try { query("INSERT INTO course (code, title, credits) VALUES ('ZZ999', 'Bad', 0)"); } catch (e) { rejected = true; }
    if (!rejected) throw new Error("credits must be CHECKed to be greater than 0");
- name: enrollment has keys and checks
  code: |2

    const pk = query("SELECT name FROM pragma_table_info('enrollment') WHERE pk > 0 ORDER BY pk").map((r) => r[0]);
    if (JSON.stringify(pk) !== JSON.stringify(["student_id", "course_code", "term"])) throw new Error("The primary key must be (student_id, course_code, term), got " + JSON.stringify(pk));
    const fk = query("SELECT \"table\", \"from\" FROM pragma_foreign_key_list('enrollment') ORDER BY \"from\"");
    if (JSON.stringify(fk) !== JSON.stringify([["course", "course_code"], ["student", "student_id"]])) throw new Error("enrollment needs foreign keys to student and course, got " + JSON.stringify(fk));
    let rejected = false;
    try { query("INSERT INTO enrollment VALUES (1, 'CS101', 'F99', 'Z')"); } catch (e) { rejected = true; }
    if (!rejected) throw new Error("grade must be one of A, B, C, D, F, or NULL");
- name: students are loaded and cleaned
  code: |2

    const r = query("SELECT email FROM student ORDER BY email").map((x) => x[0]);
    const want = ["ana@campus.edu", "bo@campus.edu", "cy@campus.edu", "di@campus.edu", "eli@campus.edu", "fay@campus.edu", "gus@campus.edu", "hana@campus.edu"];
    if (JSON.stringify(r) !== JSON.stringify(want)) throw new Error("Expected the " + want.length + " distinct, lower-case, trimmed emails, got " + JSON.stringify(r));
    const names = query("SELECT name FROM student ORDER BY email").map((x) => x[0]);
    const wn = ["Ana Ruiz", "Bo Chen", "Cy Dube", "Di Okafor", "Eli Park", "Fay Novak", "Gus Weber", "Hana Ito"];
    if (JSON.stringify(names) !== JSON.stringify(wn)) throw new Error("Names should be trimmed and attached to the right email, got " + JSON.stringify(names));
- name: courses are loaded and cleaned
  code: |2

    const r = query("SELECT code, title, credits FROM course ORDER BY code");
    const want = [["AR100", "Art History", 2], ["CS101", "Intro Programming", 4], ["CS210", "Algorithms", 4], ["CS320", "Databases", 3], ["MA110", "Calculus", 4], ["PH101", "Physics", 4]];
    if (JSON.stringify(r) !== JSON.stringify(want)) throw new Error("Expected " + JSON.stringify(want) + " but got " + JSON.stringify(r));
- name: enrollments are loaded without duplicates
  code: |2

    const n = query("SELECT COUNT(*) FROM v_transcript")[0][0] + 2;
    if (n !== 37) throw new Error("Expected 37 distinct enrollments before the withdrawal, found " + n);
    const empty = query("SELECT COUNT(*) FROM enrollment WHERE grade = ''")[0][0];
    if (empty !== 0) throw new Error("A missing grade must be NULL, not an empty string");
    const upper = query("SELECT COUNT(*) FROM enrollment WHERE course_code <> UPPER(TRIM(course_code))")[0][0];
    if (upper !== 0) throw new Error("Course codes must be upper case and trimmed");
- name: v_transcript joins everything
  code: |2

    const cols = query("SELECT name FROM pragma_table_info('v_transcript') ORDER BY cid").map((r) => r[0]);
    if (JSON.stringify(cols) !== JSON.stringify(["student", "email", "course", "title", "term", "grade"])) throw new Error("v_transcript needs the columns student, email, course, title, term, grade; got " + JSON.stringify(cols));
    const t = query("SELECT type FROM sqlite_master WHERE name = 'v_transcript'");
    if (t.length !== 1 || t[0][0] !== "view") throw new Error("v_transcript must be a VIEW");
    const a = query("SELECT student, course, term FROM v_transcript WHERE email = 'ana@campus.edu' ORDER BY course, term");
    const want = [["Ana Ruiz", "AR100", "S24"], ["Ana Ruiz", "CS101", "S24"], ["Ana Ruiz", "CS320", "S24"], ["Ana Ruiz", "PH101", "S24"]];
    if (JSON.stringify(a) !== JSON.stringify(want)) throw new Error("Ana's transcript should be " + JSON.stringify(want) + " but is " + JSON.stringify(a));
- name: the index is used
  code: |2

    const idx = query("SELECT name FROM pragma_index_info('idx_enrollment_course')").map((r) => r[0]);
    if (JSON.stringify(idx) !== JSON.stringify(["course_code"])) throw new Error("Create idx_enrollment_course on enrollment(course_code)");
    const plan = query("EXPLAIN QUERY PLAN SELECT * FROM enrollment WHERE course_code = 'CS101'").map((r) => r[3]).join(" ");
    if (!/idx_enrollment_course/.test(plan)) throw new Error("The planner should use the index for course_code lookups; plan: " + plan);
- name: the withdrawal was logged
  code: |2

    const log = query("SELECT student_id, course_code, term FROM withdrawal_log ORDER BY course_code");
    const want = [[2, "CS320", "F24"], [2, "MA110", "F24"]];
    if (JSON.stringify(log) !== JSON.stringify(want)) throw new Error("withdrawal_log should be " + JSON.stringify(want) + " but is " + JSON.stringify(log));
- name: the withdrawal removed the enrollments
  code: |2

    const left = query("SELECT COUNT(*) FROM enrollment WHERE term = 'F24' AND student_id = 2")[0][0];
    if (left !== 0) throw new Error("Bo Chen still has F24 enrollments");
    const total = query("SELECT COUNT(*) FROM enrollment")[0][0];
    if (total !== 35) throw new Error("Only Bo's F24 enrollments should be removed; expected 35 rows, found " + total);
    if (!/BEGIN/i.test(source) || !/COMMIT/i.test(source)) throw new Error("Do the withdrawal inside BEGIN ... COMMIT");
