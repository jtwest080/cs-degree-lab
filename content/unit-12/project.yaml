title: Campus Registrar Database
brief: |-
  You are building the **registration database for a small college** from a messy export. The old system gave you one flat table, `raw_registration`, with a row per enrollment: the student's name and email, the course code, title and credits, the term and the grade. It is dirty: emails and course codes come in mixed case with stray spaces, the same enrollment appears more than once, and an ungraded course has an empty string `''` instead of a real missing value.

  Write **one SQL script** that:

  1. Creates three clean tables with proper constraints: `student(id, name, email)`, `course(code, title, credits)` and `enrollment(student_id, course_code, term, grade)`.
  2. Loads them from `raw_registration`, cleaning as it goes.
  3. Creates a view `v_transcript` and an index `idx_enrollment_course`.
  4. Processes a withdrawal inside a transaction.
  5. Ends with a report query: one row per course, ranked by popularity.

  **Exact requirements:**

  - `student`: `id INTEGER PRIMARY KEY` (auto-assigned), `name` and `email` both `NOT NULL`, `email` declared `UNIQUE`. One row per distinct email after lower-casing and trimming. The name is the trimmed name.
  - `course`: `code TEXT PRIMARY KEY` (upper case, trimmed), `title` `NOT NULL`, `credits INTEGER NOT NULL` with a `CHECK` that it is greater than 0.
  - `enrollment`: `student_id` and `course_code` are foreign keys to the other two tables, `term` is required, `grade` is `NULL` or one of `'A','B','C','D','F'` (a `CHECK`), and the primary key is `(student_id, course_code, term)`. Duplicate rows in the raw data become **one** enrollment. Empty-string grades become `NULL`.
  - `v_transcript` has the columns `student` (name), `email`, `course` (code), `title`, `term`, `grade`, one row per enrollment.
  - `idx_enrollment_course` is an index on `enrollment(course_code)`, so that finding everyone in a course does not scan the table.
  - **Withdrawal:** the student `bo@campus.edu` withdraws from all courses in term `F24`. Create a table `withdrawal_log(student_id, course_code, term)`. In **one transaction** (`BEGIN` ... `COMMIT`) copy those enrollments into the log, then delete them from `enrollment`.
  - **Report** (the last statement): columns `code`, `enrolled` (current enrollments, 0 if none), `avg_points` (average of the graded enrollments, with A=4, B=3, C=2, D=1, F=0, rounded to 2 decimals, `NULL` if none are graded) and `popularity` (`RANK()` by `enrolled`, highest first). Every course appears. Order by `popularity`, then `code`.

  Only the result of the **last** statement is shown, so the report must come last.
