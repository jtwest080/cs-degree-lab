steps:
- title: Design the tables
  body: Write the three CREATE TABLE statements first, with every constraint from the list. `PRAGMA foreign_keys = ON;` first makes the database check your foreign keys while you load data (Lesson 12.6).
- title: Clean and load
  body: '`LOWER(TRIM(email))` makes emails comparable. `GROUP BY` the cleaned values to remove duplicates, and `NULLIF(TRIM(grade), '''')` turns an empty grade into NULL. Load `student` first (ids are assigned for you), then `course`, then join back to `student` on the cleaned email to get each `student_id` (Lessons 12.3 and 12.7).'
- title: View and index
  body: The view is the three-table join from Lesson 12.6 with aliases for the column names. The index is one `CREATE INDEX` (Lesson 12.9). Check the plan of `SELECT * FROM enrollment WHERE course_code = 'CS101'` to see it used.
- title: The withdrawal
  body: 'Wrap two statements in `BEGIN; ... COMMIT;`: an `INSERT ... SELECT` into `withdrawal_log`, then a `DELETE` with the same condition (Lesson 12.8). Look up Bo''s id with a subquery on the email.'
- title: The report
  body: Count with `COUNT(e.student_id)` after a `LEFT JOIN` so that empty courses show 0 (Lesson 12.4). Turn grades into points with `CASE` (a missing grade becomes NULL and `AVG` skips it), compute it in a CTE, and rank in the outer query with `RANK() OVER (ORDER BY enrolled DESC)`.
