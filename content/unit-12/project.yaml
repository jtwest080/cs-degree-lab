  code: |2

    expectColumns(["code", "enrolled", "avg_points", "popularity"]);
- name: the report is correct
  code: |2

    expectRows([["CS101", 7, 2.4, 1], ["CS320", 7, 2.6, 1], ["PH101", 7, 2.5, 1], ["AR100", 6, 2.8, 4], ["CS210", 5, 3.2, 5], ["MA110", 3, 2.67, 6]]);
solution: |
  -- 1. Clean tables with constraints
  PRAGMA foreign_keys = ON;
  CREATE TABLE student (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    email TEXT NOT NULL UNIQUE
  );
  CREATE TABLE course (
    code TEXT PRIMARY KEY,
    title TEXT NOT NULL,
    credits INTEGER NOT NULL CHECK (credits > 0)
  );
  CREATE TABLE enrollment (
    student_id INTEGER NOT NULL REFERENCES student(id),
    course_code TEXT NOT NULL REFERENCES course(code),
    term TEXT NOT NULL,
    grade TEXT CHECK (grade IN ('A','B','C','D','F')),
    PRIMARY KEY (student_id, course_code, term)
  );

  -- 2. Load the cleaned data
  INSERT INTO student (name, email)
    SELECT MIN(TRIM(student_name)), LOWER(TRIM(student_email))
    FROM raw_registration
    GROUP BY LOWER(TRIM(student_email))
    ORDER BY LOWER(TRIM(student_email));
  INSERT INTO course (code, title, credits)
    SELECT UPPER(TRIM(course_code)), MIN(course_title), MIN(credits)
    FROM raw_registration
    GROUP BY UPPER(TRIM(course_code));
  INSERT INTO enrollment (student_id, course_code, term, grade)
    SELECT s.id, UPPER(TRIM(r.course_code)), r.term, MAX(NULLIF(TRIM(r.grade), ''))
    FROM raw_registration r
    JOIN student s ON s.email = LOWER(TRIM(r.student_email))
    GROUP BY s.id, UPPER(TRIM(r.course_code)), r.term;

  -- 3. A view and an index
  CREATE VIEW v_transcript AS
    SELECT s.name AS student, s.email, c.code AS course, c.title, e.term, e.grade
    FROM enrollment e
    JOIN student s ON s.id = e.student_id
    JOIN course c ON c.code = e.course_code;
  CREATE INDEX idx_enrollment_course ON enrollment (course_code);

  -- 4. Bo Chen withdraws from every F24 course, in one transaction
  CREATE TABLE withdrawal_log (student_id INTEGER, course_code TEXT, term TEXT);
  BEGIN;
  INSERT INTO withdrawal_log (student_id, course_code, term)
    SELECT e.student_id, e.course_code, e.term
    FROM enrollment e JOIN student s ON s.id = e.student_id
    WHERE s.email = 'bo@campus.edu' AND e.term = 'F24';
  DELETE FROM enrollment
    WHERE term = 'F24'
      AND student_id = (SELECT id FROM student WHERE email = 'bo@campus.edu');
  COMMIT;

  -- 5. The report (must be the last statement)
  WITH per_course AS (
    SELECT c.code,
           COUNT(e.student_id) AS enrolled,
           ROUND(AVG(CASE e.grade WHEN 'A' THEN 4 WHEN 'B' THEN 3 WHEN 'C' THEN 2 WHEN 'D' THEN 1 WHEN 'F' THEN 0 END), 2) AS avg_points
    FROM course c
    LEFT JOIN enrollment e ON e.course_code = c.code
    GROUP BY c.code
  )
  SELECT code, enrolled, avg_points,
         RANK() OVER (ORDER BY enrolled DESC) AS popularity
  FROM per_course
  ORDER BY popularity, code;
stretch:
- Add a `CHECK` that `term` looks like a letter followed by two digits, using `GLOB 'F[0-9][0-9]'`-style patterns, and extend the loading to reject bad terms.
- Add a `capacity` column to `course` and a trigger (or a query) that prevents enrolling more students than seats.
- Create a view `v_gpa` with each student's average grade points, using a window function to also show the rank within the college.
- Write the report again using only a view per step and compare the query plans.
- Use a recursive CTE to produce a calendar of the terms F23, S24, F24 and join the enrollments onto it.
