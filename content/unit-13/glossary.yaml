# Terms introduced in Unit 13 (Web Development). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "HTML"
    definition: "HyperText Markup Language, the language that gives a web page its content and structure."
    lesson: u13-html
  - term: "Browser"
    definition: "The program that fetches web pages, builds them and shows them."
    lesson: u13-html
  - term: "DOM"
    definition: "The Document Object Model: the tree of objects the browser builds from HTML, which scripts can read and change."
    lesson: u13-html
  - term: "Tag"
    definition: "The markup in angle brackets that starts or ends an HTML element."
    lesson: u13-html
  - term: "Void element"
    definition: "An HTML element with no content and no closing tag, such as br or img."
    lesson: u13-html
  - term: "Character reference"
    definition: "A code such as &lt; that stands for a character that HTML would otherwise treat as markup."
    lesson: u13-html
  - term: "Anchor"
    definition: "The a element, which makes a link to another page or to a place on the same page."
    lesson: u13-html
  - term: "Alt text"
    definition: "A text alternative for an image, read by screen readers and shown if the image fails."
    lesson: u13-html
  - term: "Front end"
    definition: "The part of a web application that runs in the browser."
    lesson: u13-html
  - term: "Back end"
    definition: "The part of a web application that runs on the server."
    lesson: u13-html
  - term: "Semantic HTML"
    definition: "Choosing elements for what content means rather than how it looks."
    lesson: u13-html-forms
  - term: "Landmark"
    definition: "A semantic region such as nav or main that assistive technology can jump to."
    lesson: u13-html-forms
  - term: "Form"
    definition: "An HTML element that collects input and sends it as name-value pairs."
    lesson: u13-html-forms
  - term: "Label"
    definition: "An element that names a form control and is linked to it with for and id."
    lesson: u13-html-forms
  - term: "Client-side validation"
    definition: "Checking input in the browser; a convenience that the server must repeat."
    lesson: u13-html-forms
  - term: "Accessibility"
    definition: "Building pages that people with disabilities can use, often written a11y."
    lesson: u13-html-forms
  - term: "ARIA"
    definition: "Attributes that describe custom widgets to assistive technology."
    lesson: u13-html-forms
  - term: "Screen reader"
    definition: "Software that reads a page aloud for people who cannot see it."
    lesson: u13-html-forms
  - term: "CSS"
    definition: "Cascading Style Sheets: the language that describes how HTML looks."
    lesson: u13-css
  - term: "Selector"
    definition: "The part of a CSS rule that says which elements it applies to."
    lesson: u13-css
  - term: "Declaration"
    definition: "A property and value pair in a CSS rule."
    lesson: u13-css
  - term: "Specificity"
    definition: "A measure of how precisely a selector targets an element, deciding which rule wins."
    lesson: u13-css
  - term: "Pseudo-class"
    definition: "A selector for an element in a certain state or position, such as :hover."
    lesson: u13-css
  - term: "Box model"
    definition: "The model in which every element is a box of content, padding, border and margin."
    lesson: u13-css
  - term: "Margin"
    definition: "The space outside an element's border."
    lesson: u13-css
  - term: "box-sizing"
    definition: "A CSS property deciding whether width includes padding and border."
    lesson: u13-css
  - term: "rem"
    definition: "A CSS unit equal to the root font size."
    lesson: u13-css
  - term: "Custom property"
    definition: "A CSS variable such as --accent that holds a reusable value."
    lesson: u13-css
  - term: "Normal flow"
    definition: "The default layout in which blocks stack and inline content wraps."
    lesson: u13-layout
  - term: "Flexbox"
    definition: "A CSS layout mode that arranges items along one axis."
    lesson: u13-layout
  - term: "Main axis"
    definition: "The direction along which a flex container lays out its items."
    lesson: u13-layout
  - term: "CSS grid"
    definition: "A CSS layout mode that arranges items in rows and columns."
    lesson: u13-layout
  - term: "fr unit"
    definition: "A grid unit meaning a share of the free space."
    lesson: u13-layout
  - term: "Media query"
    definition: "A CSS condition, such as a minimum width, that applies rules only when it is true."
    lesson: u13-layout
  - term: "Responsive design"
    definition: "Making one page work well on screens of any size."
    lesson: u13-layout
  - term: "Viewport"
    definition: "The visible area of a web page in the browser window."
    lesson: u13-layout
  - term: "Mobile-first"
    definition: "Writing the narrow-screen layout as the default and adding wider layouts with media queries."
    lesson: u13-layout
  - term: "JavaScript"
    definition: "The programming language of the web, run by every browser."
    lesson: u13-js-language
  - term: "Template literal"
    definition: "A JavaScript string in backticks that can contain ${expressions}."
    lesson: u13-js-language
  - term: "Strict equality"
    definition: "The === operator, which compares value and type without conversion."
    lesson: u13-js-language
  - term: "Truthy"
    definition: "A value that counts as true in a condition; everything except false, 0, empty string, null, undefined and NaN."
    lesson: u13-js-language
  - term: "Arrow function"
    definition: "A short function syntax, (x) => x * 2, that keeps the surrounding this."
    lesson: u13-js-language
  - term: "Closure"
    definition: "A function that remembers the variables of the place where it was created."
    lesson: u13-js-language
  - term: "Destructuring"
    definition: "Pulling values out of arrays or objects into variables with a pattern."
    lesson: u13-js-language
  - term: "Spread syntax"
    definition: "The ... operator that expands an array or object into another."
    lesson: u13-js-language
  - term: "Optional chaining"
    definition: "The ?. operator, which gives undefined instead of an error when a link is missing."
    lesson: u13-js-language
  - term: "Nullish coalescing"
    definition: "The ?? operator, which supplies a default only for null or undefined."
    lesson: u13-js-language
  - term: "Callback"
    definition: "A function passed to be called later, when something finishes."
    lesson: u13-async
  - term: "Promise"
    definition: "An object representing a value that will exist later; pending, fulfilled or rejected."
    lesson: u13-async
  - term: "async/await"
    definition: "Syntax that lets promise-based code read like step-by-step code."
    lesson: u13-async
  - term: "Microtask"
    definition: "A queued job, such as a promise reaction, that runs before the next task."
    lesson: u13-async
  - term: "fetch"
    definition: "The browser function that makes an HTTP request and returns a promise of a response."
    lesson: u13-async
  - term: "Same-origin policy"
    definition: "The browser rule that stops a page from reading responses from other origins."
    lesson: u13-async
  - term: "Document"
    definition: "The object representing the page, the entry point to the DOM."
    lesson: u13-dom
  - term: "Event listener"
    definition: "A function registered to be called when an event happens."
    lesson: u13-dom
  - term: "Event bubbling"
    definition: "The way an event travels up from its target through its ancestors."
    lesson: u13-dom
  - term: "Event delegation"
    definition: "Handling events from many children with one listener on their parent."
    lesson: u13-dom
  - term: "preventDefault"
    definition: "An event method that cancels the browser's default action."
    lesson: u13-dom
  - term: "XSS"
    definition: "Cross-site scripting: an attack that makes a page run an attacker's script."
    lesson: u13-dom
  - term: "Data attribute"
    definition: "A custom data-* attribute that attaches your own data to an element."
    lesson: u13-dom
  - term: "Render function"
    definition: "A function that draws the page from the current state."
    lesson: u13-dom
  - term: "localStorage"
    definition: "Small per-site storage in the browser that keeps text between visits."
    lesson: u13-dom
  - term: "Framework"
    definition: "A library that structures an application and automates updating the UI from state."
    lesson: u13-frameworks
  - term: "Component"
    definition: "A reusable piece of UI, a function from props and state to a description of the UI."
    lesson: u13-frameworks
  - term: "Props"
    definition: "The inputs a parent passes to a component."
    lesson: u13-frameworks
  - term: "Virtual DOM"
    definition: "A lightweight tree of plain objects describing the UI, compared with the previous one to update the real DOM."
    lesson: u13-frameworks
  - term: "Reconciliation"
    definition: "Comparing the old and new UI trees and applying only the differences."
    lesson: u13-frameworks
  - term: "Reducer"
    definition: "A pure function (state, action) => new state."
    lesson: u13-frameworks
  - term: "One-way data flow"
    definition: "Data flowing down as props and changes flowing up as events or actions."
    lesson: u13-frameworks
  - term: "Server-side rendering"
    definition: "Producing a page's HTML on the server instead of in the browser."
    lesson: u13-frameworks
  - term: "Route"
    definition: "A method and path pattern paired with the handler that answers matching requests."
    lesson: u13-backend
  - term: "Middleware"
    definition: "A function that sees a request before the handler and can change it, answer it or pass it on."
    lesson: u13-backend
  - term: "Authentication"
    definition: "Proving who you are."
    lesson: u13-backend
  - term: "Authorization"
    definition: "Deciding what an authenticated user is allowed to do."
    lesson: u13-backend
  - term: "Session"
    definition: "Server-side memory that links a series of requests to one logged-in user."
    lesson: u13-backend
  - term: "Mass assignment"
    definition: "A vulnerability where a client sets fields it should not by sending extra data."
    lesson: u13-backend
  - term: "CSRF"
    definition: "Cross-site request forgery: tricking a logged-in browser into sending an unwanted request."
    lesson: u13-backend
  - term: "CORS"
    definition: "Cross-origin resource sharing: headers by which a server allows other origins to read its responses."
    lesson: u13-backend
  - term: "Content-Security-Policy"
    definition: "A response header that restricts where a page may load scripts and other resources from."
    lesson: u13-backend
