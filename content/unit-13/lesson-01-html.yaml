quiz:
  - type: mcq
    question: What does the browser build from the HTML it receives?
    options: ["A tree of elements called the DOM", "A compiled program", "A database", "A list of CSS rules only"]
    answer: 0
    explanation: "HTML is parsed into the Document Object Model, a tree that CSS styles and JavaScript can change."
  - type: mcq
    question: Which element holds the text shown on the browser tab?
    options: ["<title> in the head", "<h1> in the body", "<meta> in the head", "<header>"]
    answer: 0
    explanation: "The title element, inside head, names the page."
  - type: mcq
    question: What is the purpose of the alt attribute?
    options: ["A text alternative for an image", "The image size", "The link target", "The image file type"]
    answer: 0
    explanation: "It is shown if the image fails and read aloud by screen readers."
  - type: mcq
    question: Which is a void element (no closing tag)?
    options: ["<br>", "<p>", "<ul>", "<a>"]
    answer: 0
    explanation: "br, hr, img and input have no content and no end tag."
  - type: mcq
    question: How do you show the characters <p> as visible text?
    options: ["&lt;p&gt;", "\\<p\\>", "<<p>>", "<!--p-->"]
    answer: 0
    explanation: "Use the character references &lt; and &gt;."
  - type: mcq
    question: What does <a href=\"#contact\"> do?
    options: ["Jumps to the element with id contact on the same page", "Opens the contact file", "Emails the contact", "Creates an element named contact"]
    answer: 0
    explanation: "A fragment link scrolls to the element whose id matches."
  - type: code
    question: |
      Write a page with an `<h2>` containing `Menu` and an unordered list (`<ul>`) with the two items `Tea` and `Cake`.
    starter: |
      <!-- write your page here -->
    tests:
      - name: structure
        code: |
          assert($("h2") && $("h2").textContent.trim() === "Menu", "Add h2 Menu");
          const items = $$("ul > li").map((l) => l.textContent.trim());
          assert(JSON.stringify(items) === JSON.stringify(["Tea", "Cake"]), "ul needs Tea and Cake, found " + JSON.stringify(items));
    solution: |
      <h2>Menu</h2>
      <ul><li>Tea</li><li>Cake</li></ul>
