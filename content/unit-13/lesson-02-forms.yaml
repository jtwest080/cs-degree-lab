id: u13-html-forms
title: "Semantic HTML, Forms and Accessibility"
minutes: 55
language: html
objective: |
  Structure pages with meaningful elements and collect input with forms: landmarks such as header, nav, main and footer, tables, form controls with labels and validation, and the basics of making a page usable with a keyboard and a screen reader.
outcomes:
  - Use semantic landmark elements instead of anonymous divs
  - Build data tables with headers
  - Create forms with labelled inputs, selects, checkboxes, radio buttons and buttons
  - Use built-in validation attributes
  - Explain why accessibility matters and apply labels, alt text and keyboard access

sections:
  - heading: Say what things are
    body: |
      Two elements have no meaning of their own: `<div>` (a block container) and `<span>` (an inline container). They are useful hooks for CSS, but a page built only of divs tells browsers, search engines and assistive technology nothing. HTML has **semantic elements** that name the role of a region:

      | Element | Meaning |
      |---|---|
      | `<header>` | introductory content of the page or of a section (logo, title) |
      | `<nav>` | a block of navigation links |
      | `<main>` | the main content, **once per page** |
      | `<article>` | a self-contained piece (a blog post, a news story) |
      | `<section>` | a themed group of content, normally with a heading |
      | `<aside>` | related side content |
      | `<footer>` | closing content: copyright, contact |
      | `<figure>` and `<figcaption>` | an image or diagram with its caption |
      | `<time datetime="2025-05-12">` | a date or time a machine can read |

      These **landmarks** let a screen reader user jump straight to the navigation or the main content, much as sighted people scan a page layout. They also help search engines. The rule is: if there is an element whose meaning fits, use it; use `div` only when nothing else does.

  - heading: Tables for data
    body: |
      A `<table>` is for **tabular data**, not for page layout (that was a bad old habit; CSS does layout, Lesson 13.4). Rows are `<tr>`; cells are `<td>` and header cells `<th>`. Group them with `<thead>`, `<tbody>` and `<tfoot>`, add a `<caption>` that names the table, and use `scope="col"` or `scope="row"` on headers so assistive technology can announce "Grade, row Ada" for each cell. `colspan` and `rowspan` let a cell cover several columns or rows.

      ```html
      <table>
        <caption>Marks</caption>
        <thead><tr><th scope="col">Student</th><th scope="col">Mark</th></tr></thead>
        <tbody><tr><th scope="row">Ada</th><td>92</td></tr></tbody>
      </table>
      ```

  - heading: Forms
    body: |
      A **form** collects input and sends it to a server (or, as you will do from Lesson 13.7, to JavaScript). The `<form>` element wraps the controls; its `action` is the URL to send to and `method` is `get` (data goes in the URL, for searches) or `post` (data goes in the request body, for changes and anything private).

      The workhorse is `<input>`, whose `type` decides the control: `text`, `email`, `password`, `number`, `date`, `checkbox`, `radio`, `range`, `color`, `file`, `submit`. Others: `<textarea>` for several lines, `<select>` with `<option>` for a drop-down, and `<button type="submit">`. Each control that sends data needs a `name` attribute: the **name** is the key and the value is what the user entered, so submitting becomes `?email=ada%40example.org&plan=pro` (the percent encoding from Lesson 11.7). Radio buttons that share a `name` form a group of which one can be chosen.

      **Every control needs a label.** `<label for="email">Email</label>` with `<input id="email">` links them. Clicking the label focuses the input, and a screen reader announces the label when the control is reached. The alternative is to wrap the input inside the label. A placeholder is not a label: it vanishes as you type.

      ```html
      <form action="/signup" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <label><input type="checkbox" name="news"> Send me news</label>
        <button>Sign up</button>
      </form>
      ```

  - heading: Validation and good input types
    body: |
      The browser can check input before sending, with no JavaScript: `required`, `minlength`, `maxlength`, `min`, `max`, `step`, `pattern="[0-9]{4}"` (a regular expression), and the type itself (`type="email"` must look like an address). A form with a failing control will not submit and the browser shows a message. The CSS pseudo-classes `:valid` and `:invalid` can style the state, and JavaScript can ask `input.checkValidity()`.

      Choosing the right `type` is free usability: `type="email"` brings the right keyboard on a phone, `type="number"` a number pad, `type="date"` a date picker. Add `autocomplete="email"` so browsers can fill in known values.

      **Never trust client-side validation.** Anyone can bypass the browser (turn off JavaScript, send the request by hand, as Unit 11 showed). Validation in the page is for the user's convenience; the **server must check everything again** (Lesson 13.9).

  - heading: Accessibility
    body: |
      About one person in five has a disability that affects how they use the web: blindness or low vision, deafness, limited movement, dyslexia, or a broken arm for a month. Accessibility (often written **a11y**, "a" + 11 letters + "y") means building pages that work for all of them. It is also good engineering: the same techniques help search engines, voice assistants, and everyone on a poor connection or bright sun. In many countries it is the law for public services.

      A few habits cover most of it:
      - Use **semantic elements** (headings in order, lists, landmarks, buttons for buttons and links for links).
      - Give every control a **label** and every meaningful image **alt text**.
      - Make everything work with the **keyboard**: Tab moves through links and controls in the order of the page, Enter or Space activates. Do not remove the focus outline without replacing it. A `<div onclick>` cannot be reached by keyboard, a `<button>` can.
      - Do not use **colour alone** to carry meaning (a red border for errors; add text), and keep enough **contrast** between text and background.
      - Where HTML has no element for it, **ARIA** attributes (`aria-label`, `aria-expanded`, `role`) describe custom widgets. The first rule of ARIA: use a real HTML element if one exists; ARIA only changes what is announced, not how it behaves.

examples:
  - title: A semantic page
    intro: "The same content in landmarks. The script lists the landmarks a screen reader would offer."
    code: |
      <header><h1>Campus Cafe</h1></header>
      <nav><a href="#menu">Menu</a> <a href="#hours">Hours</a></nav>
      <main>
        <section id="menu"><h2>Menu</h2><p>Tea and cake.</p></section>
        <section id="hours"><h2>Hours</h2><p>9 to 5.</p></section>
      </main>
      <footer>&copy; Campus Cafe</footer>
      <script>
        const names = ["header", "nav", "main", "section", "footer"];
        for (const n of names) console.log(n, document.querySelectorAll(n).length);
      </script>
    output: |
      header 1
      nav 1
      main 1
      section 2
      footer 1
    lines:
      - line: 3
        note: "main appears once per page and holds the content unique to it."
      - line: 4
        note: "Each section has a heading, so it appears in the page outline."
  - title: A data table
    intro: "Headers with scope, a caption and body rows. The script sums the marks."
    code: |
      <table>
        <caption>Exam marks</caption>
        <thead><tr><th scope="col">Student</th><th scope="col">Mark</th></tr></thead>
        <tbody>
          <tr><th scope="row">Ada</th><td>92</td></tr>
          <tr><th scope="row">Ben</th><td>78</td></tr>
        </tbody>
      </table>
      <script>
        const marks = [...document.querySelectorAll("tbody td")].map((td) => Number(td.textContent));
        console.log(marks, marks.reduce((a, b) => a + b, 0));
      </script>
    output: |
      [92,78] 170
    lines:
      - line: 2
        note: "The caption names the table for everyone."
      - line: 5
        note: "A th with scope=row labels its row."
  - title: A labelled form
    intro: "Label for/id links, input types, a checkbox, a drop-down, radios and a submit button."
    code: |
      <form id="signup">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="plan">Plan</label>
        <select id="plan" name="plan">
          <option value="free">Free</option>
          <option value="pro">Pro</option>
        </select>

        <fieldset>
          <legend>Billing</legend>
          <label><input type="radio" name="billing" value="monthly" checked> Monthly</label>
          <label><input type="radio" name="billing" value="yearly"> Yearly</label>
        </fieldset>

        <label><input type="checkbox" name="news"> Send me news</label>
        <button type="submit">Sign up</button>
      </form>
      <script>
        const data = new FormData(document.getElementById("signup"));
        console.log([...data.keys()].join(","));
        console.log(document.getElementById("email").labels[0].textContent);
      </script>
    output: |
      email,plan,billing
      Email
    lines:
      - line: 2
        note: "for matches the input's id, so the label belongs to it."
      - line: 13
        note: "Radios that share a name are one group; checked chooses the default."
      - line: 22
        note: "FormData collects the successful controls. The empty email is sent as an empty string, but the unticked checkbox sends nothing."
  - title: Built-in validation
    intro: "The browser checks the rules with no JavaScript. checkValidity tells us whether each control passes."
    code: |
      <form>
        <input id="age" type="number" min="18" max="99" value="12" required>
        <input id="zip" pattern="[0-9]{5}" value="9021" required>
        <input id="mail" type="email" value="ada@example.org" required>
      </form>
      <script>
        for (const id of ["age", "zip", "mail"]) {
          const el = document.getElementById(id);
          console.log(id, el.checkValidity(), el.validationMessage ? "has message" : "ok");
        }
      </script>
    output: |
      age false has message
      zip false has message
      mail true ok
    lines:
      - line: 2
        note: "12 is below min=18, so it is invalid."
      - line: 3
        note: "pattern needs exactly five digits; 9021 has four."
  - title: Button or div?
    intro: "A button can be focused and pressed with the keyboard; a plain div cannot."
    code: |
      <div id="d" onclick="1">Fake button</div>
      <button id="b">Real button</button>
      <script>
        console.log("div focusable:", document.getElementById("d").tabIndex >= 0);
        console.log("button focusable:", document.getElementById("b").tabIndex >= 0);
      </script>
    output: |
      div focusable: false
      button focusable: true
    lines:
      - line: 4
        note: "A div has tabIndex -1 by default, so keyboard users cannot reach it."

playground:
  prompt: |
    Build a contact form with a labelled name, a labelled email (required) and a message textarea. Try submitting it empty and read the browser's message.
  code: |
    <form>
      <label for="n">Name</label>
      <input id="n" name="name">
      <button>Send</button>
    </form>

exercises:
  - id: landmarks
    title: Landmarks
    difficulty: 1
    prompt: |
      Rewrite this page using semantic elements: wrap the title in a `<header>`, the links in a `<nav>`, the text in a `<main>` and the copyright line in a `<footer>`. Keep the same content.
    starter: |
      <div><h1>Notes</h1></div>
      <div><a href="/a">A</a> <a href="/b">B</a></div>
      <div><p>Welcome.</p></div>
      <div>(c) Me</div>
    tests:
      - name: landmarks present
        code: |
          for (const t of ["header", "nav", "main", "footer"]) assert($$(t).length === 1, "Use exactly one " + t);
      - name: content in the right place
        code: |
          assert($("header h1"), "The h1 belongs in the header");
          assert($$("nav a").length === 2, "Both links belong in the nav");
          assert($("main p"), "The paragraph belongs in main");
          assert(/Me/.test($("footer").textContent), "The copyright text belongs in the footer");
    hints:
      - "Replace each div with the matching element."
    solution: |
      <header><h1>Notes</h1></header>
      <nav><a href="/a">A</a> <a href="/b">B</a></nav>
      <main><p>Welcome.</p></main>
      <footer>(c) Me</footer>
    explanation: "The same words, but now the page has regions that assistive technology can jump between."
  - id: login-form
    title: A login form
    difficulty: 2
    prompt: |
      Build a form with a required email input (`type="email"`, `name="email"`, `id="email"`) with a `<label>` that says `Email`, a password input (`type="password"`, `name="password"`, `id="pw"`) with a label `Password` that needs at least 8 characters, and a submit button with the text `Log in`.
    starter: |
      <form>
      </form>
    tests:
      - name: email
        code: |
          const e = $("#email"); assert(e, "Add the email input"); assert(e.type === "email" && e.name === "email", "type=email and name=email");
          assert(e.required, "The email must be required");
          const l = $("label[for=email]"); assert(l && l.textContent.trim() === "Email", "Add <label for=\"email\">Email</label>");
      - name: password
        code: |
          const p = $("#pw"); assert(p, "Add the password input"); assert(p.type === "password" && p.name === "password", "type=password and name=password");
          assert(p.minLength === 8, "Require at least 8 characters with minlength");
          const l = $("label[for=pw]"); assert(l && l.textContent.trim() === "Password", "Label the password");
      - name: submit
        code: |
          const b = $("form button[type=submit], form button:not([type]), form input[type=submit]"); assert(b, "Add a submit button inside the form");
          assert((b.textContent || b.value).trim() === "Log in", "The button should say Log in");
      - name: validation works
        code: |
          const e = $("#email"); e.value = "not-an-email"; assert(!e.checkValidity(), "A bad address should be invalid");
          const p = $("#pw"); p.value = "short"; p.dispatchEvent(new Event("input"));
          e.value = "a@b.org"; assert(e.checkValidity(), "A good address should be valid");
    hints:
      - "`<label for=\"email\">Email</label><input id=\"email\" name=\"email\" type=\"email\" required>`"
      - "minlength=\"8\" on the password input."
    solution: |
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <label for="pw">Password</label>
        <input id="pw" name="password" type="password" minlength="8" required>
        <button type="submit">Log in</button>
      </form>
    explanation: "Types, required and minlength give validation for free; labels connect each control to its name."
  - id: grade-table
    title: A grade table
    difficulty: 2
    prompt: |
      Create a table with a caption `Grades`, a header row with the column headers `Name` and `Grade`, and two body rows: `Ada` / `A` and `Ben` / `B`. Use `th` with `scope="col"` for the column headers.
    starter: |
      <table>
      </table>
    tests:
      - name: caption and headers
        code: |
          assert($("table caption") && $("table caption").textContent.trim() === "Grades", "Add caption Grades");
          const th = $$("thead th, tr:first-child th"); assert(th.length >= 2, "Add header cells");
          assert(th.slice(0, 2).every((h) => h.getAttribute("scope") === "col"), "Give the header cells scope=\"col\"");
          assert(th[0].textContent.trim() === "Name" && th[1].textContent.trim() === "Grade", "Headers should be Name and Grade");
      - name: body rows
        code: |
          const rows = $$("tbody tr").map((r) => [...r.children].map((c) => c.textContent.trim()));
          assert(JSON.stringify(rows) === JSON.stringify([["Ada", "A"], ["Ben", "B"]]), "Body rows should be Ada/A and Ben/B in a tbody; got " + JSON.stringify(rows));
    hints:
      - "Put the header row in <thead> and the data rows in <tbody>."
    solution: |
      <table>
        <caption>Grades</caption>
        <thead><tr><th scope="col">Name</th><th scope="col">Grade</th></tr></thead>
        <tbody>
          <tr><td>Ada</td><td>A</td></tr>
          <tr><td>Ben</td><td>B</td></tr>
        </tbody>
      </table>
    explanation: "thead, tbody, caption and scope give structure to tabular data."
  - id: plan-select
    title: Radio group and select
    difficulty: 3
    prompt: |
      Add a `<select name="size" id="size">` with the options `Small` (value `s`), `Medium` (value `m`, selected by default) and `Large` (value `l`), and a group of two radio buttons named `drink` with the values `tea` and `coffee`, where `coffee` is checked by default. Label every control.
    starter: |
      <form id="order">
      </form>
    tests:
      - name: select
        code: |
          const s = $("select#size[name=size]"); assert(s, "Add the select");
          const o = [...s.options].map((x) => [x.value, x.textContent.trim()]);
          assert(JSON.stringify(o) === JSON.stringify([["s", "Small"], ["m", "Medium"], ["l", "Large"]]), "Options wrong: " + JSON.stringify(o));
          assert(s.value === "m", "Medium should be selected by default");
      - name: radios
        code: |
          const r = $$("input[type=radio][name=drink]"); assert(r.length === 2, "Add two radios named drink");
          assert(JSON.stringify(r.map((x) => x.value)) === JSON.stringify(["tea", "coffee"]), "Values should be tea and coffee");
          assert(r.find((x) => x.checked).value === "coffee", "coffee should be checked by default");
      - name: labels
        code: |
          assert($("#size").labels.length >= 1, "Label the select");
          for (const x of $$("input[type=radio]")) assert(x.labels.length >= 1, "Label each radio");
    hints:
      - "`<option value=\"m\" selected>Medium</option>`"
      - "Wrap each radio in a label or use for/id."
    solution: |
      <form id="order">
        <label for="size">Size</label>
        <select name="size" id="size">
          <option value="s">Small</option>
          <option value="m" selected>Medium</option>
          <option value="l">Large</option>
        </select>
        <label><input type="radio" name="drink" value="tea"> Tea</label>
        <label><input type="radio" name="drink" value="coffee" checked> Coffee</label>
      </form>
    explanation: "Option values are what gets submitted; the visible text is what people read."

commonMistakes:
  - title: "Using a placeholder instead of a label"
    explanation: "A placeholder disappears when you type and is not reliably announced. Use a real label."
  - title: "Controls without a name attribute"
    explanation: "A control with no name is not submitted. The name is the key of the key-value pair."
  - title: "A div or span as a button"
    explanation: "It cannot be focused or pressed by keyboard. Use <button>."
  - title: "Trusting browser validation"
    explanation: "Validation attributes help honest users. The server must validate again."

summary:
  - "Use semantic elements (header, nav, main, section, article, footer) so the page has meaning and landmarks."
  - "Tables are for data: caption, thead/tbody, th with scope."
  - "A form sends name-value pairs; every control needs a name and a label."
  - "required, min, max, pattern and input types validate in the browser, but the server must validate again."
  - "Accessibility: semantics, labels, alt text, keyboard access, contrast, and ARIA only when HTML has no element."
