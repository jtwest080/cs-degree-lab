quiz:
  - type: mcq
    question: Which element marks the main content of a page?
    options: ["<main>", "<section>", "<body>", "<div>"]
    answer: 0
    explanation: "main is used once per page for the central content."
  - type: mcq
    question: What links a label to an input?
    options: ["for on the label matching id on the input", "Putting them on the same line", "The same class", "The name attribute"]
    answer: 0
    explanation: "label for=\"x\" and input id=\"x\" are associated."
  - type: mcq
    question: A text input has no name attribute. What happens when the form is submitted?
    options: ["Its value is not sent", "It is sent with the name \"text\"", "The form fails", "It is sent as the first value"]
    answer: 0
    explanation: "Only controls with a name contribute to the submitted data."
  - type: mcq
    question: Which is best for a clickable action?
    options: ["<button>", "<div onclick>", "<span onclick>", "<p onclick>"]
    answer: 0
    explanation: "A button is focusable and works with the keyboard by default."
  - type: mcq
    question: Why must a server validate input even if the page already does?
    options: ["Anyone can bypass the page and send requests directly", "Browsers cannot validate", "HTML forms are not allowed to validate", "It makes pages faster"]
    answer: 0
    explanation: "Client-side checks are a convenience, not a security control."
  - type: mcq
    question: What is ARIA for?
    options: ["Describing custom widgets to assistive technology", "Styling pages", "Fetching data", "Compressing images"]
    answer: 0
    explanation: "ARIA attributes change what is announced; native elements are still preferred."
  - type: code
    question: |
      Write a labelled search form: a `<label for="q">Search</label>`, an `<input id="q" name="q" type="search">` and a button with the text `Go`, all inside a `<form method="get">`.
    starter: |
      <!-- write your form here -->
    tests:
      - name: search form
        code: |
          const f = $("form"); assert(f && f.method === "get", "Add a form with method get");
          const i = $("input#q[name=q]"); assert(i && i.type === "search", "Add the search input");
          assert($("label[for=q]").textContent.trim() === "Search", "Add the label");
          assert($("form button").textContent.trim() === "Go", "Add the Go button");
    solution: |
      <form method="get">
        <label for="q">Search</label>
        <input id="q" name="q" type="search">
        <button>Go</button>
      </form>
