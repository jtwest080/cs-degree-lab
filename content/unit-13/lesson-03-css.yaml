id: u13-css
title: "CSS: Selectors, the Cascade and the Box Model"
minutes: 55
language: html
objective: |
  Style a page with CSS: write rules with selectors and declarations, predict which rule wins using specificity and the cascade, understand inheritance, units and colours, and size and space elements with the box model.
outcomes:
  - Write CSS rules with type, class, id, descendant, child and attribute selectors, and pseudo-classes
  - Calculate specificity and explain how the cascade and inheritance decide a property's value
  - Use common units (px, rem, em, %, vw) and colour formats
  - Explain content, padding, border and margin, and box-sizing
  - Use custom properties (variables) to keep a design consistent

sections:
  - heading: Rules, selectors and declarations
    body: |
      CSS (**Cascading Style Sheets**) describes how elements look. A stylesheet is a list of **rules**. Each rule has a **selector** (which elements) and a block of **declarations** (what to change), each a `property: value;` pair:

      ```css
      h1 {
        color: darkblue;
        font-size: 2rem;
      }
      ```

      Put CSS in a `<style>` element in the head (as in this unit's examples), in a separate file linked with `<link rel="stylesheet" href="site.css">` (best for real sites: it is shared and cached), or in a `style="..."` attribute on one element (avoid: it is hard to override and reuse).

      The selectors you use every day:

      | Selector | Matches |
      |---|---|
      | `p` | every `<p>` (a **type** selector) |
      | `.card` | elements with `class="card"` |
      | `#top` | the element with `id="top"` |
      | `nav a` | an `a` anywhere **inside** a nav (descendant) |
      | `ul > li` | an `li` that is a **direct child** of a ul |
      | `h2 + p` | a `p` immediately after an h2 |
      | `a[href^="https"]` | a with an href starting with https (attribute selector) |
      | `h1, h2, h3` | any of them (a list) |
      | `*` | everything |
      | `a:hover`, `input:focus`, `li:first-child`, `li:nth-child(odd)`, `input:invalid` | **pseudo-classes**: elements in a certain state or position |
      | `p::first-line`, `li::before` | **pseudo-elements**: a part of an element, or generated content |

      Prefer **classes** for styling: they are reusable and not too specific. Use `id` for unique anchors and JavaScript hooks, not for styles.

  - heading: The cascade, specificity and inheritance
    body: |
      Many rules can apply to one element and disagree. The browser decides property by property, in this order:

      1. **Importance and origin**: `!important` declarations beat normal ones (avoid; it makes later changes painful).
      2. **Specificity**: the more specific selector wins.
      3. **Order**: with equal specificity, the rule that comes **last** wins.

      **Specificity** is counted as three numbers (ids, classes/attributes/pseudo-classes, types): `p` is (0,0,1), `.note` is (0,1,0), `p.note` is (0,1,1), `#top` is (1,0,0), `nav a:hover` is (0,1,2). Compare left to right, so a single id beats any number of classes, and one class beats any number of type selectors. An inline `style` attribute beats all of these.

      Some properties are **inherited**: a child takes its parent's value if no rule sets it. Text properties (`color`, `font-family`, `font-size`, `line-height`, `text-align`) inherit, so setting `font-family` on `body` styles the whole page. Box properties (`margin`, `padding`, `border`, `background`) do not. Each property has an **initial** value, and the keywords `inherit`, `initial` and `unset` force one of the behaviours.

      When a style does not apply, the browser's developer tools (right-click, Inspect) show every matching rule, which are overridden (struck through) and why. That is the main debugging tool for CSS.

  - heading: Values, units and colour
    body: |
      Lengths come in **absolute** and **relative** units. Prefer relative ones so a design adapts to the reader's settings and screen:

      - `px`: a CSS pixel (not a device pixel). Fine for borders and shadows.
      - `rem`: a multiple of the **root** font size (normally 16px), so `1.5rem` is 24px and respects a user's chosen text size. The best choice for font sizes and spacing.
      - `em`: a multiple of the **element's own** font size (for padding that scales with text).
      - `%`: a percentage of the parent's matching dimension.
      - `vw`, `vh`: 1% of the viewport width or height. `ch`: the width of a zero, handy for text columns (`max-width: 65ch`).
      - `fr`: a share of free space in grid layouts (Lesson 13.4).

      Colours: names (`tomato`), hex (`#1e90ff` or `#1e90ff80` with transparency), `rgb(30 144 255)`, and `hsl(210 100% 56%)` (hue, saturation, lightness), which is the easiest to reason about when building a palette. Always check **contrast** between text and background (WCAG asks for at least 4.5 to 1 for normal text).

      Text styling: `font-family` (give a fallback stack: `system-ui, sans-serif`), `font-size`, `font-weight`, `line-height` (about 1.5 for body text), `text-align`, `text-decoration`, `letter-spacing`.

  - heading: The box model
    body: |
      Every element is drawn as a rectangular **box** made of four layers, from the inside out: the **content**, **padding** (space inside the border), the **border**, and the **margin** (space outside, separating it from neighbours). Setting `width` and `height` sizes the content by default, which means a box with `width: 200px; padding: 20px; border: 5px solid` is really 250px wide. That surprises everyone, so almost every stylesheet begins with:

      ```css
      *, *::before, *::after { box-sizing: border-box; }
      ```

      With `border-box`, `width` includes padding and border, and the layout does what you expect.

      The shorthand `margin: 10px 20px` means 10px top and bottom, 20px left and right; `margin: 1px 2px 3px 4px` goes clockwise from the top (**top, right, bottom, left**: "TRouBLe"). Vertical margins of neighbouring blocks **collapse**: two blocks with margin 20px stacked have 20px between them, not 40. `margin: 0 auto` on a block with a set `width` centres it. A block is as wide as its parent by default; an **inline** element ignores `width`, `height` and vertical margins; `display: inline-block` gives an inline element a box you can size. `display: none` removes an element from the layout entirely.

      Finally, **custom properties** (CSS variables) hold values you reuse: `:root { --accent: #1e90ff; --gap: 1rem; }` then `color: var(--accent);`. Change a design in one place, or switch themes by redefining them, as this very app does for dark mode.

examples:
  - title: Selectors in action
    intro: "Three rules. The script reads the resulting colours with getComputedStyle, which gives the final value after the cascade."
    code: |
      <style>
        p { color: black; }
        .note { color: green; }
        #special { color: purple; }
      </style>
      <p>Plain</p>
      <p class="note">A note</p>
      <p class="note" id="special">Both</p>
      <script>
        for (const p of document.querySelectorAll("p")) console.log(p.textContent, getComputedStyle(p).color);
      </script>
    output: |
      Plain rgb(0, 0, 0)
      A note rgb(0, 128, 0)
      Both rgb(128, 0, 128)
    lines:
      - line: 3
        note: "A class beats a type selector, even though the type rule came first."
      - line: 4
        note: "An id beats a class."
  - title: Specificity and order
    intro: "Equal specificity: the last rule wins. Higher specificity wins whatever the order."
    code: |
      <style>
        .a { color: red; }
        .a { color: blue; }
        div p { color: orange; }
        p.b { color: green; }
      </style>
      <div>
        <p class="a">first</p>
        <p class="b">second</p>
      </div>
      <script>
        for (const p of document.querySelectorAll("p")) console.log(p.className, getComputedStyle(p).color);
      </script>
    output: |
      a rgb(0, 0, 255)
      b rgb(0, 128, 0)
    lines:
      - line: 3
        note: "Same specificity as the line before, so the later one (blue) wins."
      - line: 4
        note: "div p is (0,0,2); it loses to .a at (0,1,0), because one class beats any number of types."
      - line: 5
        note: "p.b (0,1,1) beats div p (0,0,2)."
  - title: Inheritance
    intro: "Colour and font inherit from parent to child. Border does not."
    code: |
      <style>
        body { color: teal; font-family: Georgia, serif; border: 3px solid red; }
      </style>
      <p>Inside the body</p>
      <script>
        const cs = getComputedStyle(document.querySelector("p"));
        console.log(cs.color, cs.fontFamily.split(",")[0], cs.borderTopWidth);
      </script>
    output: |
      rgb(0, 128, 128) Georgia 0px
    lines:
      - line: 2
        note: "Set once on body, applied to every paragraph by inheritance."
      - line: 6
        note: "The border width is 0px: borders are not inherited."
  - title: The box model
    intro: "A box 200 wide with padding and border. Compare the two box-sizing settings by measuring the box."
    code: |
      <style>
        .box { width: 200px; padding: 20px; border: 5px solid navy; margin: 10px; }
        #b2 { box-sizing: border-box; }
      </style>
      <div class="box" id="b1">content-box</div>
      <div class="box" id="b2">border-box</div>
      <script>
        for (const id of ["b1", "b2"]) {
          const r = document.getElementById(id).getBoundingClientRect();
          console.log(id, r.width, r.height > 0);
        }
      </script>
    output: |
      b1 250 true
      b2 200 true
    lines:
      - line: 2
        note: "200 content + 2 x 20 padding + 2 x 5 border = 250."
      - line: 3
        note: "With border-box the width already includes padding and border."
  - title: Units
    intro: "rem follows the root font size, em follows the element, percentages follow the parent."
    code: |
      <style>
        html { font-size: 20px; }
        .parent { width: 400px; font-size: 10px; }
        .a { width: 5rem; }
        .b { width: 5em; }
        .c { width: 50%; }
      </style>
      <div class="parent"><div class="a">a</div><div class="b">b</div><div class="c">c</div></div>
      <script>
        for (const c of ["a", "b", "c"]) console.log(c, getComputedStyle(document.querySelector("." + c)).width);
      </script>
    output: |
      a 100px
      b 50px
      c 200px
    lines:
      - line: 2
        note: "The root font size is 20px, so 1rem is 20px."
      - line: 5
        note: "The parent's font size is 10px, so 5em is 50px."
  - title: Custom properties
    intro: "Define a design token once and reuse it. Changing it in one place changes everything that uses it."
    code: |
      <style>
        :root { --accent: #1e90ff; --gap: 8px; }
        .btn { background: var(--accent); padding: var(--gap) calc(var(--gap) * 2); color: white; border: 0; }
        .dark { --accent: #003366; }
      </style>
      <button class="btn">Light</button>
      <div class="dark"><button class="btn">Dark</button></div>
      <script>
        for (const b of document.querySelectorAll(".btn")) console.log(b.textContent, getComputedStyle(b).backgroundColor);
      </script>
    output: |
      Light rgb(30, 144, 255)
      Dark rgb(0, 51, 102)
    lines:
      - line: 4
        note: "Redefining the variable inside .dark changes it for everything inside, thanks to inheritance."

playground:
  prompt: |
    Style the page: give the card a border, padding and a background, centre it with `margin: 0 auto` and `max-width`, and try box-sizing. Open the browser's developer tools on this app to inspect the box model diagram of your element.
  code: |
    <style>
      .card { max-width: 20rem; }
    </style>
    <div class="card"><h2>Card</h2><p>Some text.</p></div>

exercises:
  - id: style-headings
    title: Style the headings
    difficulty: 1
    prompt: |
      Add CSS so that every `<h1>` is `crimson` and every element with the class `lead` has a `font-size` of `1.25rem`.
    starter: |
      <h1>Title</h1>
      <p class="lead">Lead paragraph</p>
      <p>Normal paragraph</p>
    tests:
      - name: h1 colour
        code: |
          assert(css("h1", "color") === "rgb(220, 20, 60)", "The h1 should be crimson, it is " + css("h1", "color"));
      - name: lead size
        code: |
          assert(css(".lead", "font-size") === "20px", "The lead should be 1.25rem (20px), it is " + css(".lead", "font-size"));
          const normal = $$("p")[1]; assert(css(normal, "font-size") === "16px", "Only .lead should change size");
    hints:
      - "`h1 { color: crimson; }` and `.lead { font-size: 1.25rem; }` inside a style element."
    solution: |
      <style>
        h1 { color: crimson; }
        .lead { font-size: 1.25rem; }
      </style>
      <h1>Title</h1>
      <p class="lead">Lead paragraph</p>
      <p>Normal paragraph</p>
    explanation: "A type selector for h1 and a class selector for .lead. 1.25rem is 1.25 times 16px."
  - id: specificity-fix
    title: Win the cascade
    difficulty: 3
    prompt: |
      The paragraph with `id="intro"` and `class="muted"` must be `green`, but the existing rules make it grey. Add **one** rule (do not edit the existing ones and do not use `!important`) that makes it green.
    starter: |
      <style>
        p.muted { color: gray; }
        article p { color: black; }
      </style>
      <article><p id="intro" class="muted">Hello</p></article>
    tests:
      - name: green
        code: |
          assert(css("#intro", "color") === "rgb(0, 128, 0)", "The paragraph is " + css("#intro", "color") + ", make it green");
      - name: no important, existing rules kept
        code: |
          assert(!/!important/.test(source), "Do not use !important");
          assert(source.includes("p.muted { color: gray; }") && source.includes("article p { color: black; }"), "Keep the two existing rules unchanged");
    hints:
      - "p.muted is (0,1,1). You need something more specific: an id selector is (1,0,0)."
    solution: |
      <style>
        p.muted { color: gray; }
        article p { color: black; }
        #intro { color: green; }
      </style>
      <article><p id="intro" class="muted">Hello</p></article>
    explanation: "An id selector has higher specificity than a class plus a type, so it wins regardless of order."
  - id: card-box
    title: Build a card
    difficulty: 2
    prompt: |
      Style `.card` so it is exactly `300px` wide **including** its `16px` padding and `2px` border (use `box-sizing: border-box`), has a `1rem` margin on all sides and a `solid` border.
    starter: |
      <div class="card">A card</div>
    tests:
      - name: total width
        code: |
          const r = $(".card").getBoundingClientRect(); assert(r.width === 300, "The card should be 300px wide in total, it is " + r.width);
      - name: padding and border
        code: |
          assert(css(".card", "padding-left") === "16px" && css(".card", "padding-top") === "16px", "Padding should be 16px");
          assert(css(".card", "border-top-width") === "2px" && css(".card", "border-top-style") === "solid", "Border should be 2px solid");
      - name: margin
        code: |
          for (const s of ["top", "right", "bottom", "left"]) assert(css(".card", "margin-" + s) === "16px", "margin-" + s + " should be 1rem (16px)");
    hints:
      - "`box-sizing: border-box; width: 300px; padding: 16px; border: 2px solid black; margin: 1rem;`"
    solution: |
      <style>
        .card { box-sizing: border-box; width: 300px; padding: 16px; border: 2px solid black; margin: 1rem; }
      </style>
      <div class="card">A card</div>
    explanation: "With border-box the declared width is the total width, so the content shrinks to make room for padding and border."
  - id: variables
    title: Use a custom property
    difficulty: 3
    prompt: |
      Define a custom property `--brand` as `#ff6600` on `:root`, then use it with `var(--brand)` for the background of `.btn` and for the `border-color` of `.btn` (with `border: 2px solid`). Do not write the colour anywhere else.
    starter: |
      <button class="btn">Buy</button>
    tests:
      - name: colours
        code: |
          assert(css(".btn", "background-color") === "rgb(255, 102, 0)", "Background should be #ff6600");
          assert(css(".btn", "border-top-color") === "rgb(255, 102, 0)", "Border colour should be #ff6600");
      - name: single definition
        code: |
          assert(/--brand\s*:\s*#ff6600/i.test(source), "Define --brand: #ff6600");
          assert((source.match(/#ff6600/gi) || []).length === 1, "Write the colour only once");
          assert((source.match(/var\(--brand\)/g) || []).length >= 2, "Use var(--brand) twice");
    hints:
      - "`:root { --brand: #ff6600; }`"
    solution: |
      <style>
        :root { --brand: #ff6600; }
        .btn { background: var(--brand); border: 2px solid var(--brand); }
      </style>
      <button class="btn">Buy</button>
    explanation: "Custom properties give one source of truth for a value."
  - id: zebra
    title: Zebra stripes
    difficulty: 3
    prompt: |
      Using a pseudo-class selector (no extra classes), give every **odd** `li` inside `#list` the background `lightgray`, and make the **first** item bold (`font-weight: 700`).
    starter: |
      <ul id="list"><li>one</li><li>two</li><li>three</li><li>four</li></ul>
    tests:
      - name: stripes
        code: |
          const lis = $$("#list li").map((l) => css(l, "background-color"));
          assert(lis[0] === "rgb(211, 211, 211)" && lis[2] === "rgb(211, 211, 211)", "Odd items should be lightgray");
          assert(lis[1] === "rgba(0, 0, 0, 0)" && lis[3] === "rgba(0, 0, 0, 0)", "Even items should have no background");
      - name: first bold
        code: |
          const w = $$("#list li").map((l) => css(l, "font-weight"));
          assert(w[0] === "700", "The first item should be bold"); assert(w[1] === "400", "Others stay normal");
      - name: no classes
        code: |
          assert($$("#list li[class]").length === 0, "Do not add classes to the items");
    hints:
      - "`li:nth-child(odd)` and `li:first-child`."
    solution: |
      <style>
        #list li:nth-child(odd) { background: lightgray; }
        #list li:first-child { font-weight: 700; }
      </style>
      <ul id="list"><li>one</li><li>two</li><li>three</li><li>four</li></ul>
    explanation: "Structural pseudo-classes select by position, so the HTML stays clean."

commonMistakes:
  - title: "Fighting specificity with !important"
    explanation: "It wins today and blocks tomorrow's changes. Write a simpler, better-ordered selector instead."
  - title: "Forgetting box-sizing"
    explanation: "Without border-box, padding and border are added to width and boxes overflow their containers."
  - title: "Styling with ids"
    explanation: "Id selectors are so specific that nothing can override them gracefully. Use classes."
  - title: "Fixed pixel font sizes"
    explanation: "px text ignores the reader's size preference. Use rem."

summary:
  - "A rule is a selector plus declarations; select by type, class, id, relationship, attribute and state."
  - "The cascade decides by importance, then specificity (ids, classes, types), then order; some properties inherit."
  - "Prefer rem and % to px; use hsl or hex colours and check contrast."
  - "A box is content, padding, border, margin; use box-sizing: border-box."
  - "Custom properties keep values in one place and can be redefined per region."
next: u13-layout

quiz:
  - type: mcq
    question: Which selector has the highest specificity?
    options: ["#nav", ".nav.active", "ul li a", "a:hover"]
    answer: 0
    explanation: "One id (1,0,0) beats any number of classes or types."
  - type: mcq
    question: Two rules have equal specificity and set the same property. Which wins?
    options: ["The one that comes later", "The one that comes first", "The longer one", "Neither; it is an error"]
    answer: 0
    explanation: "With a tie, the last rule in the source wins."
  - type: mcq
    question: Which property is inherited by default?
    options: ["color", "margin", "border", "padding"]
    answer: 0
    explanation: "Text properties such as color inherit; box properties do not."
  - type: mcq
    question: A div has width 200px, padding 20px and border 5px with the default box-sizing. How wide is it in total?
    options: ["250px", "200px", "225px", "270px"]
    answer: 0
    explanation: "200 + 2 x 20 + 2 x 5 = 250."
  - type: mcq
    question: "What does margin: 10px 20px mean?"
    options: ["10px top and bottom, 20px left and right", "10px left and right", "10px top, 20px bottom", "10px all around and 20px extra"]
    answer: 0
    explanation: "Two values: vertical then horizontal."
  - type: mcq
    question: Why prefer rem for font sizes?
    options: ["It respects the user's chosen base text size", "It is faster", "It is the only unit browsers support", "It disables zoom"]
    answer: 0
    explanation: "rem scales with the root font size, which readers can change."
  - type: code
    question: |
      Style paragraphs that are **direct children** of `.box` so they are `blue`, without affecting a paragraph nested deeper inside a `div`.
    starter: |
      <div class="box"><p id="a">direct</p><div><p id="b">nested</p></div></div>
    tests:
      - name: child only
        code: |
          assert(css("#a", "color") === "rgb(0, 0, 255)", "The direct paragraph should be blue");
          assert(css("#b", "color") !== "rgb(0, 0, 255)", "The nested paragraph must not be blue");
    solution: |
      <style>.box > p { color: blue; }</style>
      <div class="box"><p id="a">direct</p><div><p id="b">nested</p></div></div>
