quiz:
  - type: mcq
    question: In a flex row, which property distributes items along the main axis?
    options: ["justify-content", "align-items", "float", "z-index"]
    answer: 0
    explanation: "justify-content works along the main axis; align-items across it."
  - type: mcq
    question: What does 1fr mean in grid-template-columns?
    options: ["One share of the free space", "One pixel", "One fraction of the viewport", "One full row"]
    answer: 0
    explanation: "fr divides the space left after fixed tracks and gaps."
  - type: mcq
    question: An absolutely positioned element is placed relative to
    options: ["The nearest positioned ancestor", "Its previous sibling", "The body always", "Its first child"]
    answer: 0
    explanation: "If no ancestor is positioned, it uses the initial containing block (the page)."
  - type: mcq
    question: What does mobile-first mean?
    options: ["Default CSS is for narrow screens, with min-width queries adding wide layouts", "Only support phones", "Write JavaScript before CSS", "Hide the desktop site"]
    answer: 0
    explanation: "Start with the simplest layout and enhance it as space allows."
  - type: mcq
    question: Which layout tool is best for a card gallery that reflows automatically?
    options: ["Grid with repeat(auto-fit, minmax())", "position: absolute", "A table", "float"]
    answer: 0
    explanation: "auto-fit with minmax creates as many columns as fit without media queries."
  - type: mcq
    question: What does the viewport meta tag do?
    options: ["Makes the page width follow the device width on phones", "Hides the address bar", "Loads CSS", "Sets the language"]
    answer: 0
    explanation: "Without it phones assume a wide virtual viewport and zoom out."
  - type: code
    question: |
      Make `.row` display its three children in a flex row with `gap: 12px`, and make the **last** child take all the remaining space with `flex: 1`.
    starter: |
      <style>.row { width: 400px; } .row div { width: 50px; }</style>
      <div class="row"><div>1</div><div>2</div><div>3</div></div>
    tests:
      - name: layout
        code: |
          const d = $$(".row div").map((x) => x.getBoundingClientRect());
          assert(css(".row", "display") === "flex", "Use display: flex");
          assert(Math.abs(d[1].left - d[0].right - 12) < 1, "gap should be 12px");
          assert(Math.abs(d[2].right - $(".row").getBoundingClientRect().right) < 1, "The last child should fill the rest");
    solution: |
      <style>.row { width: 400px; display: flex; gap: 12px; } .row div { width: 50px; } .row div:last-child { flex: 1; }</style>
      <div class="row"><div>1</div><div>2</div><div>3</div></div>
