id: u13-layout
title: "CSS Layout: Flexbox, Grid and Responsive Design"
minutes: 55
language: html
objective: |
  Arrange pages with modern CSS layout: normal flow, flexbox for rows and columns, grid for two-dimensional layouts, positioning, and media queries that adapt a design from phone to desktop.
outcomes:
  - Explain normal flow, block versus inline, and when layout leaves it
  - Use flexbox to align and distribute items along one axis
  - Use CSS grid to build rows-and-columns layouts with gaps and fractional tracks
  - Position elements with relative, absolute, fixed and sticky
  - Make a layout responsive with a viewport meta tag, fluid units and media queries

sections:
  - heading: Normal flow
    body: |
      Without any layout CSS the browser uses **normal flow**: **block** elements stack top to bottom, each as wide as its parent, and **inline** elements flow left to right and wrap like words in a paragraph. This is the right layout for text and costs nothing. Most of layout work is deciding where to leave flow.

      Setting `display` changes how an element behaves: `block`, `inline`, `inline-block`, `none`, and the two modern layout modes `flex` and `grid`, which apply to an element's **children**. Think of it as two jobs: the **container** (display: flex or grid, plus gap and alignment) and its **items** (how each child sizes itself).

  - heading: "Flexbox: one dimension"
    body: |
      `display: flex` turns an element into a **flex container**; its children become **flex items** laid out in a row (or column) called the **main axis**; the perpendicular direction is the **cross axis**.

      Container properties:
      - `flex-direction`: `row` (default), `column`, or reversed versions: sets the main axis.
      - `justify-content`: distribution along the **main** axis: `flex-start`, `center`, `flex-end`, `space-between`, `space-around`, `space-evenly`.
      - `align-items`: alignment on the **cross** axis: `stretch` (default), `center`, `flex-start`, `flex-end`, `baseline`.
      - `gap`: space between items (use this instead of margins).
      - `flex-wrap: wrap`: let items move to a new line when they do not fit.

      Item properties: `flex: 1` means "share the leftover space equally"; `flex: 0 0 200px` is "do not grow, do not shrink, start at 200px". `flex-grow` decides how extra space is split, `flex-shrink` how a shortage is, and `flex-basis` the starting size. `align-self` overrides alignment for one item, `order` changes the visual order (take care: keyboard order does not follow it).

      Flexbox is perfect for toolbars, navigation bars, centring (`display: flex; justify-content: center; align-items: center;` finally centres a box both ways), and rows of cards that should wrap.

  - heading: "Grid: two dimensions"
    body: |
      `display: grid` lays children on a grid of rows **and** columns. You define the **tracks**:

      ```css
      .page {
        display: grid;
        grid-template-columns: 200px 1fr 1fr;  /* a fixed column and two sharing the rest */
        grid-template-rows: auto 1fr auto;
        gap: 1rem;
      }
      ```

      `fr` is a **fraction of the free space**. `repeat(3, 1fr)` makes three equal columns; `repeat(auto-fit, minmax(12rem, 1fr))` makes as many columns of at least 12rem as will fit, which gives a card gallery that reflows with **no media queries at all**. Items go into cells automatically in order, or you place them: `grid-column: 1 / 3` (from line 1 to line 3, i.e. spanning two columns) or `grid-column: span 2`. Named areas make layouts readable:

      ```css
      grid-template-areas: "head head" "side main" "foot foot";
      header { grid-area: head; }
      ```

      Rule of thumb: **flexbox** when content decides the layout (a row of things), **grid** when the layout decides where the content goes (page structure, galleries). They combine well: a grid of cards, each card a flex column.

  - heading: Positioning
    body: |
      The `position` property takes an element partly or fully out of flow:

      | Value | Behaviour |
      |---|---|
      | `static` | normal flow (default) |
      | `relative` | stays in flow, but can be nudged with `top/left`; also becomes the **anchor** for absolutely positioned children |
      | `absolute` | removed from flow, placed relative to the nearest positioned ancestor |
      | `fixed` | removed from flow, placed relative to the viewport; stays when scrolling (a cookie banner) |
      | `sticky` | in flow until it would scroll off, then sticks (a table header) |

      Overlapping elements are ordered by `z-index` (only among positioned elements). Use positioning for badges, tooltips, overlays and sticky bars, not for the main layout, where flex and grid are more robust. `overflow: auto` makes a box scroll rather than spill; `overflow: hidden` clips.

  - heading: Responsive design
    body: |
      People view your page on phones, tablets and wide monitors. **Responsive design** makes one page fit all of them. The recipe:

      1. Include `<meta name="viewport" content="width=device-width, initial-scale=1">` in the head. Without it phones pretend to be 980px wide and shrink the page.
      2. Use **fluid** sizes: percentages, `fr`, `max-width: 100%` on images (`img { max-width: 100%; height: auto; }`), rem for text, and `max-width: 65ch` on text columns.
      3. Design **mobile-first**: write the layout for narrow screens as the default and add **media queries** for larger ones:

      ```css
      .layout { display: grid; gap: 1rem; }               /* one column on phones */
      @media (min-width: 40rem) {
        .layout { grid-template-columns: 1fr 2fr; }       /* two columns when there is room */
      }
      ```

      Media queries can also test `prefers-color-scheme: dark`, `prefers-reduced-motion`, and `print`. Choose the **breakpoints** where your content starts to look bad, not at the sizes of specific devices. Test by resizing the window or using the browser's device mode.

      Finally remember touch: make tap targets at least about 44px, and do not rely on `:hover`, which phones do not have.

examples:
  - title: Flexbox row
    intro: "Three boxes in a row, spaced out, centred vertically. The script measures where they ended up."
    code: |
      <style>
        .row { display: flex; justify-content: space-between; align-items: center; width: 400px; height: 100px; gap: 10px; }
        .row div { width: 60px; background: tomato; }
        .row div:nth-child(2) { height: 40px; }
      </style>
      <div class="row"><div>A</div><div>B</div><div>C</div></div>
      <script>
        const [a, b, c] = [...document.querySelectorAll(".row div")].map((d) => d.getBoundingClientRect());
        console.log("A left", a.left - 8, "C right", c.right - 8);
        console.log("B centred:", Math.round(b.top - 8 + b.height / 2));
      </script>
    output: |
      A left 0 C right 400
      B centred: 50
    lines:
      - line: 2
        note: "space-between puts the first item at the start, the last at the end and equal space between."
      - line: 4
        note: "A shorter item is centred on the cross axis. (The default 8px page margin is subtracted in the script.)"
  - title: Flex grow
    intro: "flex: 1 shares the leftover space. The middle item takes twice as much as the others."
    code: |
      <style>
        .bar { display: flex; width: 600px; }
        .bar div { flex: 1; }
        .bar .wide { flex: 2; }
      </style>
      <div class="bar"><div>one</div><div class="wide">two</div><div>three</div></div>
      <script>
        console.log([...document.querySelectorAll(".bar div")].map((d) => d.getBoundingClientRect().width));
      </script>
    output: |
      [150,300,150]
    lines:
      - line: 3
        note: "Every item grows equally into the free space."
      - line: 4
        note: "A grow factor of 2 gets twice the share, so 150 : 300 : 150."
  - title: Grid with fr
    intro: "A fixed sidebar and a flexible main column, with a gap."
    code: |
      <style>
        .page { display: grid; grid-template-columns: 200px 1fr; gap: 20px; width: 700px; }
        header { grid-column: 1 / -1; }
      </style>
      <div class="page"><header>Header</header><nav>Nav</nav><main>Main</main></div>
      <script>
        const w = (s) => document.querySelector(s).getBoundingClientRect().width;
        console.log(w("header"), w("nav"), w("main"));
      </script>
    output: |
      700 200 480
    lines:
      - line: 2
        note: "700 - 200 - 20 gap = 480 for the 1fr column."
      - line: 3
        note: "grid-column: 1 / -1 spans from the first line to the last, the full width."
  - title: A gallery without media queries
    intro: "repeat(auto-fit, minmax(...)) creates as many columns as fit. Changing the container width changes the column count."
    code: |
      <style>
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .gallery div { background: steelblue; height: 40px; }
      </style>
      <div class="gallery" id="g"><div></div><div></div><div></div><div></div><div></div><div></div></div>
      <script>
        const g = document.getElementById("g");
        const cols = (px) => { g.style.width = px + "px"; return getComputedStyle(g).gridTemplateColumns.split(" ").length; };
        console.log(cols(700), cols(400), cols(160));
      </script>
    output: |
      4 2 1
    lines:
      - line: 2
        note: "Each column is at least 150px and shares the leftover space."
      - line: 7
        note: "700px fits four 150px columns with gaps, 400px fits two, 160px only one."
  - title: Absolute positioning
    intro: "A badge pinned to the corner of a relatively positioned card."
    code: |
      <style>
        .card { position: relative; width: 200px; height: 100px; background: #eee; margin: 20px; }
        .badge { position: absolute; top: 0; right: 0; background: red; color: white; }
      </style>
      <div class="card" id="c">Card<span class="badge" id="b">NEW</span></div>
      <script>
        const c = document.getElementById("c").getBoundingClientRect();
        const b = document.getElementById("b").getBoundingClientRect();
        console.log("badge at top-right:", b.top === c.top && b.right === c.right);
      </script>
    output: |
      badge at top-right: true
    lines:
      - line: 2
        note: "position: relative makes the card the anchor."
      - line: 3
        note: "The badge is positioned against the card, not the page."
  - title: A media query
    intro: "A one-column list at narrow widths and two columns when wide. The script asks the browser which queries currently match."
    code: |
      <style>
        .cols { display: grid; gap: 8px; }
        @media (min-width: 100px) { .cols { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 99999px) { .cols { grid-template-columns: 1fr 1fr 1fr 1fr; } }
      </style>
      <div class="cols" id="x"><div>1</div><div>2</div><div>3</div></div>
      <script>
        console.log(getComputedStyle(document.getElementById("x")).gridTemplateColumns.split(" ").length);
        console.log(matchMedia("(min-width: 100px)").matches, matchMedia("(min-width: 99999px)").matches);
      </script>
    output: |
      2
      true false
    lines:
      - line: 3
        note: "This query applies because the viewport is at least 100px wide."
      - line: 4
        note: "No screen is 99,999px wide, so this rule never applies."

playground:
  prompt: |
    Make a navigation bar with flexbox: a logo on the left and three links on the right (`margin-left: auto` on the first link pushes the rest). Then turn it into a vertical menu below 30rem with a media query.
  code: |
    <style>
      nav { display: flex; gap: 1rem; }
    </style>
    <nav><strong>Logo</strong> <a href="#">Home</a> <a href="#">About</a> <a href="#">Contact</a></nav>

exercises:
  - id: centre
    title: Centre a box
    difficulty: 2
    prompt: |
      Make `.stage` a flex container that centres its single child `.dot` both horizontally and vertically inside the 300 by 200 stage.
    starter: |
      <style>
        .stage { width: 300px; height: 200px; background: #ddd; }
        .dot { width: 40px; height: 40px; background: black; }
      </style>
      <div class="stage"><div class="dot"></div></div>
    tests:
      - name: is flex
        code: |
          assert(css(".stage", "display") === "flex", "Use display: flex on .stage");
      - name: centred
        code: |
          const s = $(".stage").getBoundingClientRect(), d = $(".dot").getBoundingClientRect();
          assert(Math.abs((d.left + d.width / 2) - (s.left + s.width / 2)) < 1, "Not centred horizontally");
          assert(Math.abs((d.top + d.height / 2) - (s.top + s.height / 2)) < 1, "Not centred vertically");
    hints:
      - "`justify-content: center; align-items: center;`"
    solution: |
      <style>
        .stage { width: 300px; height: 200px; background: #ddd; display: flex; justify-content: center; align-items: center; }
        .dot { width: 40px; height: 40px; background: black; }
      </style>
      <div class="stage"><div class="dot"></div></div>
    explanation: "justify-content works on the main axis, align-items on the cross axis."
  - id: holy-grail
    title: Page layout with grid
    difficulty: 3
    prompt: |
      Lay out the page with CSS grid, width 800px: a `header` spanning the full width on top, a `nav` of 160px on the left, `main` filling the rest, and a `footer` spanning the full width at the bottom. Use `gap: 10px`.
    starter: |
      <style>
        .page { width: 800px; }
      </style>
      <div class="page"><header>H</header><nav>N</nav><main>M</main><footer>F</footer></div>
    tests:
      - name: grid
        code: |
          assert(css(".page", "display") === "grid", "Use display: grid on .page");
      - name: widths
        code: |
          const w = (s) => $(s).getBoundingClientRect().width;
          assert(w("header") === 800 && w("footer") === 800, "header and footer should span 800px");
          assert(w("nav") === 160, "nav should be 160px, it is " + w("nav"));
          assert(w("main") === 630, "main should fill the rest: 630px, it is " + w("main"));
      - name: order
        code: |
          const t = (s) => $(s).getBoundingClientRect();
          assert(t("header").bottom <= t("nav").top && t("nav").bottom <= t("footer").top, "header above, footer below");
          assert(t("nav").top === t("main").top && t("nav").right <= t("main").left, "nav is to the left of main on the same row");
    hints:
      - "`grid-template-columns: 160px 1fr; gap: 10px;`"
      - "`header, footer { grid-column: 1 / -1; }`"
    solution: |
      <style>
        .page { width: 800px; display: grid; grid-template-columns: 160px 1fr; gap: 10px; }
        header, footer { grid-column: 1 / -1; }
      </style>
      <div class="page"><header>H</header><nav>N</nav><main>M</main><footer>F</footer></div>
    explanation: "800 - 160 - 10 = 630 for the flexible column. Spanning from line 1 to line -1 covers every column."
  - id: nav-bar
    title: A navigation bar
    difficulty: 3
    prompt: |
      Make the `nav` a flex container with a `gap` of `16px`. The first element (`.logo`) stays on the left and the three links are pushed to the right edge (use `margin-left: auto` on the first link, `.first`). Nav width is 600px.
    starter: |
      <style>
        nav { width: 600px; }
      </style>
      <nav><span class="logo">Logo</span><a class="first" href="#">Home</a><a href="#">About</a><a href="#">Contact</a></nav>
    tests:
      - name: flex with gap
        code: |
          assert(css("nav", "display") === "flex", "nav should be a flex container"); assert(css("nav", "column-gap") === "16px", "gap should be 16px");
      - name: logo at left, links at right
        code: |
          const n = $("nav").getBoundingClientRect(), l = $(".logo").getBoundingClientRect(), last = $$("nav a").pop().getBoundingClientRect();
          assert(l.left === n.left, "The logo should be at the left edge");
          assert(Math.abs(last.right - n.right) < 1, "The last link should touch the right edge");
      - name: links stay together
        code: |
          const a = $$("nav a").map((x) => x.getBoundingClientRect());
          assert(Math.abs(a[1].left - a[0].right - 16) < 1 && Math.abs(a[2].left - a[1].right - 16) < 1, "The links should be 16px apart");
    hints:
      - "An auto margin takes all the free space on that side."
    solution: |
      <style>
        nav { width: 600px; display: flex; gap: 16px; }
        .first { margin-left: auto; }
      </style>
      <nav><span class="logo">Logo</span><a class="first" href="#">Home</a><a href="#">About</a><a href="#">Contact</a></nav>
    explanation: "An auto margin in flexbox absorbs free space, a handy way to push items apart."
  - id: responsive
    title: A responsive switch
    difficulty: 4
    prompt: |
      `.items` should be a single column by default. When the viewport is **at least 700px wide**, make it three equal columns (`1fr 1fr 1fr`). Use a media query. (The test frame is wider than 700px.)
    starter: |
      <style>
        .items { display: grid; gap: 8px; }
      </style>
      <div class="items"><div>1</div><div>2</div><div>3</div></div>
    tests:
      - name: media query present
        code: |
          assert(/@media[^{]*min-width\s*:\s*700px/.test(source), "Use @media (min-width: 700px)");
      - name: three columns when wide
        code: |
          assert(getComputedStyle($(".items")).gridTemplateColumns.split(" ").length === 3, "Expect three columns on a wide screen");
      - name: single column base
        code: |
          const base = source.replace(/@media[^{]*\{[^{}]*\{[^}]*\}\s*\}/g, "");
          assert(!/grid-template-columns/.test(base), "The default (outside the media query) should stay one column");
    hints:
      - "`@media (min-width: 700px) { .items { grid-template-columns: repeat(3, 1fr); } }`"
    solution: |
      <style>
        .items { display: grid; gap: 8px; }
        @media (min-width: 700px) { .items { grid-template-columns: repeat(3, 1fr); } }
      </style>
      <div class="items"><div>1</div><div>2</div><div>3</div></div>
    explanation: "Mobile-first: the narrow layout is the default and the media query adds the wide one."

commonMistakes:
  - title: "Confusing justify-content and align-items"
    explanation: "justify-content follows the main axis (direction of flex-direction), align-items the cross axis. Switching flex-direction swaps them."
  - title: "Using margins instead of gap"
    explanation: "gap spaces items without extra space at the ends and is simpler."
  - title: "Positioning absolutely without a positioned parent"
    explanation: "The element anchors to the page or the nearest positioned ancestor. Add position: relative to the intended parent."
  - title: "Forgetting the viewport meta tag"
    explanation: "Without it phones render at about 980px and shrink the page, so media queries do not work as expected."

summary:
  - "Normal flow stacks blocks and wraps inline content; leave it deliberately."
  - "Flexbox lays items along one axis: justify-content (main), align-items (cross), gap, flex-grow."
  - "Grid lays items in rows and columns with fr tracks, gap, spanning and auto-fit galleries."
  - "position: relative/absolute/fixed/sticky and z-index handle overlays; avoid them for main layout."
  - "Responsive design: viewport meta tag, fluid units, mobile-first media queries."
