quiz:
  - type: mcq
    question: What does `typeof null` return?
    options: ["\"object\" (a historical quirk)", "\"null\"", "\"undefined\"", "\"number\""]
    answer: 0
    explanation: "It is a long-standing bug that cannot be fixed without breaking old pages. Check null with === null."
  - type: mcq
    question: Which is truthy?
    options: ["[]", "0", "\"\"", "null"]
    answer: 0
    explanation: "An empty array is an object, so it is truthy; the others are falsy."
  - type: mcq
    question: What is the result of "5" + 2?
    options: ["\"52\"", "7", "NaN", "An error"]
    answer: 0
    explanation: "With a string on one side + concatenates."
  - type: mcq
    question: What does const mean?
    options: ["The variable cannot be reassigned", "The value is deeply frozen", "The variable is global", "The variable is private"]
    answer: 0
    explanation: "const stops reassignment, but an object or array it holds can still be changed."
  - type: mcq
    question: What does [1, 2, 3].map(x => x * 2) return?
    options: ["A new array [2,4,6]", "The array changed in place", "6", "undefined"]
    answer: 0
    explanation: "map returns a new array and leaves the original alone."
  - type: mcq
    question: What is a closure?
    options: ["A function that remembers the variables where it was created", "A way to close a browser tab", "A private class", "A loop that ends"]
    answer: 0
    explanation: "The returned function keeps access to the outer variables."
  - type: code
    question: |
      Write `unique(arr)` returning a new array with duplicates removed, keeping the first occurrence order. `unique([3, 1, 3, 2, 1])` is `[3, 1, 2]`.
    starter: |
      function unique(arr) {
      }
    tests:
      - name: unique
        code: |
          const r = unique([3, 1, 3, 2, 1]);
          if (JSON.stringify(r) !== JSON.stringify([3, 1, 2])) throw new Error("Got " + JSON.stringify(r));
          if (unique([]).length !== 0) throw new Error("empty in, empty out");
    solution: |
      function unique(arr) {
        return [...new Set(arr)];
      }
