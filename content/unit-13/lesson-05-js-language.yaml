exercises:
  - id: js-fizz
    title: Count and label
    difficulty: 1
    prompt: |
      Write `labels(n)` that returns an array of the numbers from 1 to `n` where multiples of 3 are replaced by `"Fizz"`, multiples of 5 by `"Buzz"` and multiples of both by `"FizzBuzz"`. `labels(5)` is `[1, 2, "Fizz", 4, "Buzz"]`.
    starter: |
      function labels(n) {
      }
    tests:
      - name: examples
        code: |
          const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          if (!eq(labels(5), [1, 2, "Fizz", 4, "Buzz"])) throw new Error("labels(5) is " + JSON.stringify(labels(5)));
          if (!eq(labels(15).slice(-1), ["FizzBuzz"])) throw new Error("15 should be FizzBuzz");
          if (!eq(labels(0), [])) throw new Error("labels(0) should be empty");
    hints:
      - "Build an array with a for loop from 1 to n."
      - "Check `i % 15 === 0` first."
    solution: |
      function labels(n) {
        const out = [];
        for (let i = 1; i <= n; i++) {
          if (i % 15 === 0) out.push("FizzBuzz");
          else if (i % 3 === 0) out.push("Fizz");
          else if (i % 5 === 0) out.push("Buzz");
          else out.push(i);
        }
        return out;
      }
    explanation: "Test the combined case first, otherwise the multiples of 15 would match 3 or 5 first."
  - id: js-wordfreq
    title: Word frequencies
    difficulty: 2
    prompt: |
      Write `wordCounts(text)` that returns an object mapping each lower-cased word to how many times it appears. Words are separated by spaces; ignore empty pieces. `wordCounts("A b a")` is `{ a: 2, b: 1 }`.
    starter: |
      function wordCounts(text) {
      }
    tests:
      - name: counts
        code: |
          const r = wordCounts("A b a");
          if (r.a !== 2 || r.b !== 1 || Object.keys(r).length !== 2) throw new Error("Got " + JSON.stringify(r));
          const s = wordCounts("  the  The THE cat ");
          if (s.the !== 3 || s.cat !== 1 || Object.keys(s).length !== 2) throw new Error("Got " + JSON.stringify(s));
          if (Object.keys(wordCounts("")).length !== 0) throw new Error("Empty text has no words");
    hints:
      - "`text.toLowerCase().split(\" \").filter(Boolean)` gives the words."
      - "`counts[w] = (counts[w] ?? 0) + 1`"
    solution: |
      function wordCounts(text) {
        const counts = {};
        for (const w of text.toLowerCase().split(" ").filter(Boolean)) {
          counts[w] = (counts[w] ?? 0) + 1;
        }
        return counts;
      }
    explanation: "?? supplies 0 only when the key is missing. filter(Boolean) removes empty strings."
  - id: js-pipeline
    title: map, filter, reduce
    difficulty: 3
    prompt: |
      Given an array of orders like `{ item: "pen", price: 2, qty: 3, paid: true }`, write `revenue(orders)` returning the total of `price * qty` for **paid** orders only, and `topItems(orders, n)` returning the names of the `n` unpaid-or-paid orders with the highest `price * qty`, best first (ties keep their original order).
    starter: |
      function revenue(orders) {
      }
      function topItems(orders, n) {
      }
    tests:
      - name: revenue
        code: |
          const o = [{ item: "pen", price: 2, qty: 3, paid: true }, { item: "ink", price: 10, qty: 1, paid: false }, { item: "pad", price: 4, qty: 5, paid: true }];
          if (revenue(o) !== 26) throw new Error("revenue should be 26, got " + revenue(o));
          if (revenue([]) !== 0) throw new Error("no orders, no revenue");
      - name: topItems
        code: |
          const o = [{ item: "a", price: 1, qty: 5 }, { item: "b", price: 3, qty: 3 }, { item: "c", price: 2, qty: 2 }, { item: "d", price: 1, qty: 9 }];
          const r = topItems(o, 2);
          if (JSON.stringify(r) !== JSON.stringify(["b", "d"])) throw new Error("Expected [b,d] (9 and 9, ties in original order), got " + JSON.stringify(r));
          if (JSON.stringify(o.map((x) => x.item)) !== JSON.stringify(["a", "b", "c", "d"])) throw new Error("Do not change the input array");
    hints:
      - "`orders.filter(o => o.paid).reduce((s, o) => s + o.price * o.qty, 0)`"
      - "Copy before sorting: `[...orders].sort((x, y) => y.price * y.qty - x.price * x.qty)`; sort is stable."
    solution: |
      function revenue(orders) {
        return orders.filter(o => o.paid).reduce((s, o) => s + o.price * o.qty, 0);
      }
      function topItems(orders, n) {
        return [...orders]
          .sort((x, y) => y.price * y.qty - x.price * x.qty)
          .slice(0, n)
          .map(o => o.item);
      }
    explanation: "Chain the array methods. Copying with spread avoids changing the caller's array, because sort works in place."
  - id: js-closure
    title: A rate limiter closure
    difficulty: 4
    prompt: |
      Write `makeLimiter(max)` that returns a function. The returned function returns `true` for the first `max` calls and `false` for every call after that. Each limiter has its own count.
    starter: |
      function makeLimiter(max) {
      }
    tests:
      - name: limits
        code: |
          const l = makeLimiter(2);
          const r = [l(), l(), l(), l()];
          if (JSON.stringify(r) !== JSON.stringify([true, true, false, false])) throw new Error("Got " + JSON.stringify(r));
      - name: independent
        code: |
          const a = makeLimiter(1), b = makeLimiter(1);
          a(); a();
          if (b() !== true) throw new Error("b has its own count");
          if (makeLimiter(0)() !== false) throw new Error("max 0 allows nothing");
    hints:
      - "Declare `let used = 0;` inside makeLimiter and return an arrow function that increments it."
    solution: |
      function makeLimiter(max) {
        let used = 0;
        return () => {
          if (used >= max) return false;
          used++;
          return true;
        };
      }
    explanation: "The returned function closes over used, so the count survives between calls and is private."
  - id: js-class
    title: A Stack class
    difficulty: 3
    prompt: |
      Write a class `Stack` with methods `push(x)`, `pop()` (throws `new Error("empty")` when empty), `peek()` (returns `undefined` when empty) and a getter `size`.
    starter: |
      class Stack {
      }
    tests:
      - name: behaviour
        code: |
          const s = new Stack(); s.push(1); s.push(2);
          if (s.size !== 2 || s.peek() !== 2) throw new Error("size/peek wrong");
          if (s.pop() !== 2 || s.pop() !== 1) throw new Error("pop order wrong");
          if (s.peek() !== undefined) throw new Error("peek of empty is undefined");
      - name: empty pop
        code: |
          let msg = null; try { new Stack().pop(); } catch (e) { msg = e.message; }
          if (msg !== "empty") throw new Error("pop on empty should throw Error('empty')");
    hints:
      - "Keep the items in `this.items = []` created in the constructor."
    solution: |
      class Stack {
        constructor() { this.items = []; }
        push(x) { this.items.push(x); }
        pop() {
          if (this.items.length === 0) throw new Error("empty");
          return this.items.pop();
        }
        peek() { return this.items[this.items.length - 1]; }
        get size() { return this.items.length; }
      }
    explanation: "A getter is read like a property. Indexing past the end of an array gives undefined rather than an error."

commonMistakes:
  - title: "Using == instead of ==="
    explanation: "== converts types and gives surprising results. Use === and !==."
    wrong: |
      if (x == 0) { }
    right: |
      if (x === 0) { }
  - title: "Sorting numbers without a comparator"
    explanation: "[10, 9, 1].sort() compares text. Use sort((a, b) => a - b)."
  - title: "Assuming an empty array is falsy"
    explanation: "In JavaScript [] and {} are truthy. Test .length instead."
  - title: "Losing this in a callback"
    explanation: "A regular function used as a callback has its own this. Use an arrow function to keep the surrounding one."

summary:
  - "Use const and let, === and !==; falsy values are false, 0, empty string, null, undefined and NaN."
  - "Functions are values; arrow functions are short; closures remember their surrounding variables."
  - "Arrays and objects with destructuring and spread; map, filter and reduce replace loops; prefer new values to mutation."
  - "Classes have constructors, methods, getters and private fields; errors use throw and try/catch."
  - "JavaScript converts types silently, so be explicit."
