id: u13-js-language
title: "JavaScript: The Language"
minutes: 60
language: javascript
objective: |
  Learn the core of JavaScript, the language of the browser, by comparing it with Python: variables with let and const, types and the surprising rules of equality, functions and arrow functions, arrays and objects, destructuring and spread, array methods, closures, classes and error handling.
outcomes:
  - Declare variables with const and let and explain truthiness and the difference between == and ===
  - Write functions, arrow functions and default parameters
  - Work with arrays and objects, destructuring, spread, and the map, filter and reduce methods
  - Explain closures and use them to keep private state
  - Define classes and handle errors with try, catch and throw

sections:
  - heading: A second language, on purpose
    body: |
      You already know Python well. JavaScript (JS) does the same jobs with different spelling, so this lesson goes quickly by comparing the two. JavaScript runs in every browser, so it is the language of the front end, and with Node.js it also runs servers (Lesson 13.9). Despite the name it has nothing to do with Java.

      Code in this lesson runs in a worker without a page: output comes from `console.log(...)`. Statements end with `;` (optional but recommended), blocks use `{ }` rather than indentation, and conditions go in parentheses:

      ```js
      const name = "Ada";
      if (name.length > 2) {
        console.log(`Hello, ${name}!`);   // template literal, like an f-string
      }
      ```

      Comments are `// like this` or `/* like this */`. Strings use `'single'`, `"double"` or `` `backtick` `` quotes; backticks allow `${expression}` inside and multi-line text.

  - heading: Variables, types and equality
    body: |
      Declare variables with **`const`** (cannot be reassigned; use it by default) or **`let`** (can be). Old code uses `var`, which has confusing scoping; do not use it. Both `const` and `let` are **block scoped**: they exist only inside the nearest `{ }`.

      The types: `number` (one type for integers and floats, a 64-bit float like Python's `float`, so `0.1 + 0.2 !== 0.3`), `bigint` (`123n`), `string`, `boolean`, `undefined` (a variable with no value yet), `null` (deliberately empty), `symbol`, and `object` (everything else, including arrays and functions). `typeof 5` is `"number"`. There is no `int` division: `7 / 2` is `3.5`; use `Math.floor(7 / 2)` or `Math.trunc`.

      **Equality.** JavaScript has two equal operators. `==` converts types first and gives bizarre results (`0 == "0"` true, `"" == 0` true, `null == undefined` true). **Always use `===` and `!==`**, which compare value and type with no conversion.

      **Truthiness.** In conditions these values are **falsy**: `false`, `0`, `""`, `null`, `undefined`, `NaN`. Everything else is truthy, including `"0"`, `[]` and `{}` (unlike Python, where an empty list is falsy). Operators `&&` and `||` return one of their operands, so `name || "guest"` is a default value, and `??` is a stricter default that only replaces `null` and `undefined`. Optional chaining `user?.address?.city` gives `undefined` instead of an error when a link is missing.

  - heading: Functions
    body: |
      ```js
      function area(w, h = 1) { return w * h; }        // declaration, with a default
      const area2 = (w, h = 1) => w * h;               // arrow function
      const greet = name => `Hi ${name}`;              // one parameter: no brackets needed
      ```

      Functions are **values**: store them, pass them as arguments, return them (just like Python). **Arrow functions** are the short form used for callbacks (`items.map(x => x * 2)`); with a single expression the `return` is implicit. Missing arguments are `undefined` rather than an error, and extra ones are ignored. **Rest parameters** gather the rest: `function sum(...nums) { ... }`, and **spread** unpacks: `Math.max(...numbers)`.

      A **closure** is a function that remembers the variables of the place where it was created, even after that place has finished:

      ```js
      function counter() {
        let n = 0;
        return () => ++n;          // remembers n
      }
      const next = counter();
      next(); next();              // 1, then 2
      ```

      `n` is private: only the returned function can reach it. Closures are how JavaScript hides state, and the engine behind callbacks, event handlers (Lesson 13.7) and, later, framework hooks (Lesson 13.8).

  - heading: Arrays and objects
    body: |
      An **array** is Python's list: `[1, 2, 3]`, indexed from 0, with `.length`, `.push(x)`, `.pop()`, `.slice(a, b)`, `.includes(x)`, `.indexOf(x)`, `.join(", ")`. Negative indexes do not work: use `arr.at(-1)` for the last element. An **object** is Python's dictionary: `{ name: "Ada", age: 36 }`, read with `obj.name` or `obj["name"]`, with keys that are strings. Objects are the basis of JSON (Lesson 13.6): `JSON.stringify(obj)` and `JSON.parse(text)`.

      **Destructuring** pulls values out concisely, and **spread** (`...`) copies:

      ```js
      const [first, second] = [10, 20, 30];
      const { name, age = 18 } = person;
      const copy = { ...person, age: 37 };       // new object with one change
      const more = [...numbers, 4];
      ```

      Prefer making a **new** array or object over changing the old one (immutability): it is easier to reason about and is exactly what UI frameworks expect.

      The array **methods** replace most loops: `map` transforms each element, `filter` keeps some, `reduce` folds into one value, plus `find`, `some`, `every`, `sort`, `flat` and `forEach`.

      ```js
      [1, 2, 3, 4].filter(x => x % 2 === 0).map(x => x * 10)    // [20, 40]
      [1, 2, 3].reduce((sum, x) => sum + x, 0)                  // 6
      ```

      Beware: `sort()` with no argument sorts as **text** (`[10, 9, 1].sort()` is `[1, 10, 9]`); pass a comparator `(a, b) => a - b`. And `sort` changes the array in place.

  - heading: Classes, modules and errors
    body: |
      ```js
      class Account {
        #balance = 0;                       // a private field
        constructor(owner) { this.owner = owner; }
        deposit(x) { if (x <= 0) throw new Error("Amount must be positive"); this.#balance += x; }
        get balance() { return this.#balance; }
      }
      ```

      `class` is syntax over JavaScript's prototype system; `constructor` is `__init__`, `this` is `self` (but always written explicitly inside methods, and its value depends on **how the function is called**, which is a classic source of confusion; arrow functions keep the `this` of where they were written). `extends` and `super` give inheritance. Files can be **modules**: `export function f() {}` and `import { f } from "./f.js"`.

      Errors use `throw new Error("message")` and `try { ... } catch (e) { ... } finally { ... }`, like Python's try/except. Many JavaScript mistakes do not throw at all: a missing property is `undefined`, `"5" * 2` is 10, `"5" + 2` is `"52"`. A value of `NaN` ("not a number") from bad arithmetic quietly spreads through calculations; check with `Number.isNaN(x)`.

examples:
  - title: Variables, equality and truthiness
    intro: "The rules that differ most from Python."
    code: |
      const n = 7;
      console.log(typeof n, 7 / 2, Math.floor(7 / 2), 0.1 + 0.2 === 0.3);
      console.log(0 == "0", 0 === "0", null == undefined, null === undefined);
      for (const v of [0, "", "0", [], {}, null, undefined, NaN]) {
        console.log(JSON.stringify(v), Boolean(v));
      }
      const user = { name: "Ada", address: null };
      console.log(user.nickname ?? "none", user.address?.city, user.name || "guest");
    output: |
      number 3.5 3 false
      true false true false
      0 false
      "" false
      "0" true
      [] true
      {} true
      null false
      undefined false
      null false
      none undefined Ada
    lines:
      - line: 3
        note: "== converts types (surprising); === does not. Use ===."
      - line: 4
        note: "An empty array and an empty object are truthy in JavaScript, unlike Python."
      - line: 8
        note: "?? only replaces null or undefined; ?. stops at a missing link instead of throwing."
  - title: Functions and closures
    intro: "Arrow functions, defaults, rest parameters and a closure that keeps a private counter."
    code: |
      const add = (a, b = 10) => a + b;
      const sum = (...nums) => nums.reduce((s, x) => s + x, 0);
      console.log(add(1), add(1, 2), sum(), sum(1, 2, 3));

      function counter(start = 0) {
        let n = start;
        return { next: () => ++n, reset: () => { n = start; } };
      }
      const a = counter(), b = counter(100);
      a.next(); a.next(); b.next();
      console.log(a.next(), b.next());
      a.reset();
      console.log(a.next());
    output: |
      11 3 0 6
      3 102
      1
    lines:
      - line: 1
        note: "The default is used when the argument is missing."
      - line: 5
        note: "Each call to counter creates a new n, remembered by the two returned functions."
      - line: 12
        note: "reset changes the same n that next uses: they share one closure."
  - title: Arrays and objects
    intro: "Destructuring, spread and the array methods that replace loops."
    code: |
      const people = [
        { name: "Ada", age: 36 }, { name: "Ben", age: 17 }, { name: "Cy", age: 52 },
      ];
      const adults = people.filter(p => p.age >= 18).map(p => p.name);
      const total = people.reduce((s, p) => s + p.age, 0);
      console.log(adults, total, people.find(p => p.age > 50).name);

      const [first, ...rest] = adults;
      const older = { ...people[0], age: people[0].age + 1 };
      console.log(first, rest, older, people[0].age);
      console.log([10, 9, 1].sort(), [10, 9, 1].sort((a, b) => a - b));
    output: |
      ["Ada","Cy"] 105 Cy
      Ada ["Cy"] {"name":"Ada","age":37} 36
      [1,10,9] [1,9,10]
    lines:
      - line: 7
        note: "Rest in destructuring collects the remaining elements."
      - line: 8
        note: "Spread copies the object and then the later age overrides. The original is unchanged."
      - line: 10
        note: "The default sort compares as text, which puts 10 before 9."
  - title: Classes and errors
    intro: "A class with a private field, validation by throwing, and try/catch."
    code: |
      class Account {
        #balance = 0;
        constructor(owner) { this.owner = owner; }
        deposit(x) {
          if (typeof x !== "number" || x <= 0) throw new Error("Amount must be positive");
          this.#balance += x;
          return this;
        }
        get balance() { return this.#balance; }
      }
      const acc = new Account("Ada").deposit(50).deposit(25);
      console.log(acc.owner, acc.balance);
      try {
        acc.deposit(-5);
      } catch (e) {
        console.log(e.name + ": " + e.message);
      } finally {
        console.log("done");
      }
      console.log(acc.balance, "5" * 2, "5" + 2, Number.isNaN("x" * 2));
    output: |
      Ada 75
      Error: Amount must be positive
      done
      75 10 52 true
    lines:
      - line: 2
        note: "#balance is private: outside the class it cannot be read or written."
      - line: 7
        note: "Returning this lets calls chain."
      - line: 14
        note: "throw jumps to the nearest catch."
      - line: 20
        note: "JavaScript converts types silently: a string times a number is numeric, a string plus a number concatenates."
  - title: Scope and this
    intro: "let is block scoped; an arrow function keeps the surrounding this, a function does not."
    code: |
      for (let i = 0; i < 3; i++) { }
      console.log(typeof i);

      const timer = {
        label: "T",
        regular() { return [1].map(function () { return this === undefined; })[0]; },
        arrow() { return [1].map(() => this.label)[0]; },
      };
      console.log(timer.regular(), timer.arrow());
    output: |
      undefined
      true T
    lines:
      - line: 2
        note: "i only exists inside the loop, so typeof reports undefined (rather than throwing)."
      - line: 6
        note: "A plain function called as a callback has no this (in strict mode)."
      - line: 7
        note: "The arrow function uses the this of the arrow method around it."

playground:
  prompt: |
    Write a function `groupBy(items, keyFn)` that returns an object mapping each key to an array of items. Use it to group the words ["apple", "avocado", "banana", "blueberry", "cherry"] by their first letter.
  code: |
    const words = ["apple", "avocado", "banana", "blueberry", "cherry"];
