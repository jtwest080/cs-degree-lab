quiz:
  - type: mcq
    question: What order does this print? console.log(1); setTimeout(()=>console.log(2),0); Promise.resolve().then(()=>console.log(3)); console.log(4);
    options: ["1 4 3 2", "1 2 3 4", "1 4 2 3", "1 3 4 2"]
    answer: 0
    explanation: "Sync code (1, 4), then the microtask (3), then the timer (2)."
  - type: mcq
    question: What does an async function always return?
    options: ["A promise", "undefined", "The value directly", "A callback"]
    answer: 0
    explanation: "Even if it returns a plain value, it is wrapped in a promise."
  - type: mcq
    question: When does fetch reject its promise?
    options: ["On a network failure", "On any status above 399", "When the body is empty", "Never"]
    answer: 0
    explanation: "HTTP errors like 404 and 500 still resolve; check response.ok."
  - type: mcq
    question: Which runs three independent requests fastest?
    options: ["await Promise.all([a(), b(), c()])", "await a(); await b(); await c();", "Three nested callbacks", "A while loop that polls"]
    answer: 0
    explanation: "All three start immediately and the total is the slowest one."
  - type: mcq
    question: Which is valid JSON?
    options: ["{\"a\": 1}", "{a: 1}", "{'a': 1}", "{\"a\": 1,}"]
    answer: 0
    explanation: "JSON requires double-quoted keys and no trailing commas."
  - type: mcq
    question: Why must JavaScript not wait synchronously for a server?
    options: ["It has one thread, so the page would freeze", "Servers are slow", "Browsers forbid HTTP", "Promises are faster"]
    answer: 0
    explanation: "The same thread draws the page and runs event handlers."
  - type: code
    question: |
      Write `async function userCount()` that fetches `/api/users` and returns how many users there are.
    starter: |
      async function userCount() {
      }
    tests:
      - name: count
        code: |
          if ((await userCount()) !== 2) throw new Error("There are 2 users");
    solution: |
      async function userCount() {
        const res = await fetch("/api/users");
        const users = await res.json();
        return users.length;
      }
