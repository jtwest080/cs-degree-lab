id: u13-async
title: "Asynchronous JavaScript, JSON and fetch"
minutes: 55
language: javascript
objective: |
  Understand how JavaScript does many things at once with a single thread: the event loop, callbacks, promises, async and await, error handling in asynchronous code, and how a page talks to a server with fetch and JSON.
outcomes:
  - Explain the event loop, the task queue and why a slow operation must not block
  - Predict the order of synchronous code, microtasks (promises) and timers
  - Create and chain promises, and use Promise.all and Promise.race
  - Write async functions with await and try/catch
  - Use fetch to read and send JSON, and check response status

sections:
  - heading: One thread, many waits
    body: |
      A web page has **one thread** running your JavaScript. If it stopped to wait for a server for two seconds, the whole page, including scrolling and clicking, would freeze. So JavaScript never waits: anything slow (a network request, a timer, reading a file, a click) is started, and the program carries on. When the slow thing finishes, a **callback** is queued to run.

      The machinery is the **event loop**. It repeats: take the next waiting task from the **task queue** (a timer firing, a click, a response arriving), run it to completion, then run all queued **microtasks** (promise reactions), then let the browser redraw, then take the next task. A task is never interrupted: while your function runs, nothing else does, so a long `while` loop freezes the page (this is the concurrency of Unit 10, using one thread and cooperation instead of preemption).

      ```js
      console.log("A");
      setTimeout(() => console.log("B"), 0);
      Promise.resolve().then(() => console.log("C"));
      console.log("D");
      ```

      prints **A, D, C, B**. First the synchronous code (A, D), then the microtask (C), and only then the timer task (B), even with a delay of 0. In this unit's runner timers use a **virtual clock**: `setTimeout(f, 5000)` runs promptly, but in the correct order relative to other timers.

      The old style is the **callback**: `setTimeout(done, 1000)`. Nesting callbacks inside callbacks (to do step 2 after step 1 after step 0) gets deep and tangled, called callback hell, and error handling is awkward. Promises fix that.

  - heading: Promises
    body: |
      A **promise** is an object representing a value that will exist later. It is in one of three states: **pending**, **fulfilled** (with a value) or **rejected** (with an error). Once settled it never changes.

      ```js
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      wait(100).then(() => console.log("100 ms later"));
      ```

      `new Promise((resolve, reject) => { ... })` runs your function immediately; call `resolve(value)` or `reject(error)` when done. You consume one with `.then(onValue)`, `.catch(onError)` and `.finally(cleanup)`. Each of these **returns a new promise**, so they chain flat instead of nesting:

      ```js
      fetchUser(1)
        .then(user => fetchOrders(user.id))     // returning a promise waits for it
        .then(orders => console.log(orders.length))
        .catch(err => console.log("failed:", err.message));   // catches a rejection anywhere above
      ```

      A value returned from a `then` becomes the next step's input; a thrown error skips ahead to the next `catch`. Combinators run promises together: `Promise.all([a, b, c])` waits for **all** (and rejects at once if any rejects), `Promise.allSettled` waits for all and reports each result, `Promise.race` takes the first to settle, and `Promise.any` the first to succeed.

  - heading: async and await
    body: |
      `async`/`await` is syntax that lets promise code read like ordinary step-by-step code:

      ```js
      async function loadName(id) {
        try {
          const response = await fetch(`/api/users/${id}`);
          if (!response.ok) throw new Error("HTTP " + response.status);
          const user = await response.json();
          return user.name;
        } catch (err) {
          return "unknown";
        }
      }
      ```

      An `async` function **always returns a promise**. Inside it, `await somePromise` pauses *that function* (not the thread; other tasks keep running) until the promise settles, then gives the fulfilled value or throws the rejection, so ordinary `try`/`catch` handles errors. Common mistakes:
      - Forgetting `await`: you get a promise object instead of the value.
      - Awaiting in a loop when requests are independent. `for (const id of ids) await load(id)` runs them **one after another**; `await Promise.all(ids.map(load))` runs them **together**, which is much faster.
      - An `async` function that throws and whose promise nobody awaits produces an **unhandled rejection**, an error that appears only in the console.

  - heading: "Talking to servers: fetch and JSON"
    body: |
      `fetch(url, options)` makes an HTTP request (Lesson 11.7) and returns a promise of a **response**. It resolves as soon as headers arrive and rejects **only on network failure**; a `404` or `500` is still a successful fetch, so always check `response.ok` (status 200 to 299). Then read the body with `await response.json()` (parse JSON), or `.text()`.

      ```js
      const response = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: "Cy" }),
      });
      ```

      **JSON** (JavaScript Object Notation) is the text format APIs use to exchange data: objects `{"name": "Ada", "age": 36}`, arrays, strings, numbers, `true`, `false`, `null`. Keys and strings need **double quotes**; no comments, no trailing commas. `JSON.stringify(value)` turns a value into text (functions and `undefined` are dropped; `Date` becomes a string) and `JSON.parse(text)` turns it back, throwing `SyntaxError` on bad input. A deep copy trick is `JSON.parse(JSON.stringify(x))`; the modern way is `structuredClone(x)`.

      In this lesson's runner `fetch` talks to a pretend server in memory with these routes: `GET /api/users` (a list of two users), `GET /api/users/1` and `/api/users/2` (one user, 404 for others), `POST /api/users` (returns the body plus `id: 3`, status 201), `GET /api/slow` (answers after 500 ms) and `GET /api/fail` (a network error). Real browsers also enforce the **same-origin policy**: a page may only read responses from its own origin unless the server allows others with CORS headers (Lesson 13.9).

examples:
  - title: The event loop order
    intro: "Synchronous code first, then microtasks (promises), then timers, even with a delay of zero."
    code: |
      console.log("1 sync");
      setTimeout(() => console.log("5 timer 0 ms"), 0);
      setTimeout(() => console.log("6 timer 10 ms"), 10);
      Promise.resolve().then(() => console.log("3 microtask"));
      queueMicrotask(() => console.log("4 another microtask"));
      console.log("2 sync again");
    output: |
      1 sync
      2 sync again
      3 microtask
      4 another microtask
      5 timer 0 ms
      6 timer 10 ms
    lines:
      - line: 2
        note: "The callback is only queued; it runs after the current code finishes."
      - line: 4
        note: "Promise reactions are microtasks and run before the next timer task."
  - title: Chaining promises
    intro: "Each then returns a new promise, so the steps read top to bottom. A thrown error skips to the catch."
    code: |
      const wait = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));

      wait(100, 2)
        .then((n) => { console.log("got", n); return n * 10; })
        .then((n) => wait(50, n + 1))
        .then((n) => { console.log("then", n); throw new Error("boom"); })
        .then(() => console.log("skipped"))
        .catch((e) => console.log("caught", e.message))
        .finally(() => console.log("cleanup"));
    output: |
      got 2
      then 21
      caught boom
      cleanup
    lines:
      - line: 5
        note: "Returning a promise makes the chain wait for it."
      - line: 7
        note: "The thrown error rejects the chain; the next then is skipped."
      - line: 9
        note: "finally runs whatever happened."
  - title: Sequential versus parallel
    intro: "Three independent waits. Awaiting them one by one takes the sum; Promise.all takes the longest. The virtual clock lets us measure."
    code: |
      const wait = (ms) => new Promise((r) => setTimeout(() => r(ms), ms));

      async function main() {
        const sequential = [];
        for (const ms of [300, 200, 100]) sequential.push(await wait(ms));
        const results = await Promise.all([wait(300), wait(200), wait(100)]);
        console.log(sequential, results);
      }
      main();
    output: |
      [300,200,100] [300,200,100]
    lines:
      - line: 6
        note: "Each await finishes before the next wait even starts: 600 ms of waiting in a real browser."
      - line: 7
        note: "All three timers start at once and finish after the longest, 300 ms."
  - title: async functions and errors
    intro: "await gives the value or throws the rejection, so try/catch works. An async function returns a promise."
    code: |
      async function safeDivide(a, b) {
        if (b === 0) throw new Error("division by zero");
        return a / b;
      }
      async function main() {
        console.log(await safeDivide(10, 4));
        try {
          await safeDivide(1, 0);
        } catch (e) {
          console.log("error:", e.message);
        }
        const p = safeDivide(9, 3);
        console.log(p instanceof Promise, await p);
      }
      main();
    output: |
      2.5
      error: division by zero
      true 3
    lines:
      - line: 2
        note: "Throwing inside an async function rejects the promise it returned."
      - line: 12
        note: "Without await you hold the promise; with await you get the value."
  - title: fetch with JSON
    intro: "Read a list, read one user, handle a 404 and a network failure, and POST some JSON."
    code: |
      async function main() {
        const list = await (await fetch("/api/users")).json();
        console.log(list.map((u) => u.name).join(", "));

        const missing = await fetch("/api/users/99");
        console.log("status", missing.status, "ok?", missing.ok);

        try {
          await fetch("/api/fail");
        } catch (e) {
          console.log(e.name + ": " + e.message);
        }

        const created = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: "Cy" }),
        });
        console.log(created.status, JSON.stringify(await created.json()));
      }
      main();
    output: |
      Ada, Ben
      status 404 ok? false
      TypeError: Failed to fetch
      201 {"id":3,"name":"Cy"}
    lines:
      - line: 5
        note: "A 404 does not reject the promise. You must check ok or status."
      - line: 9
        note: "Only a network failure rejects the fetch promise."
      - line: 17
        note: "The pretend server returns the new record with an id."
  - title: JSON in detail
    intro: "What survives stringify and parse, and what does not."
    code: |
      const data = { name: "Ada", tags: ["a", "b"], nested: { ok: true }, skip: undefined, fn() {}, when: new Date(0) };
      const text = JSON.stringify(data);
      console.log(text);
      console.log(JSON.parse(text).when === "1970-01-01T00:00:00.000Z");
      try { JSON.parse("{'bad': 1}"); } catch (e) { console.log(e.name); }
      console.log(JSON.stringify({ a: 1, b: [1, 2] }, null, 2));
    output: |
      {"name":"Ada","tags":["a","b"],"nested":{"ok":true},"when":"1970-01-01T00:00:00.000Z"}
      true
      SyntaxError
      {
        "a": 1,
        "b": [
          1,
          2
        ]
      }
    lines:
      - line: 3
        note: "undefined and functions are dropped; a Date becomes a string."
      - line: 5
        note: "JSON needs double quotes, so single quotes are a SyntaxError."
      - line: 6
        note: "The third argument indents the output for people."

playground:
  prompt: |
    Write an async function `userNames()` that fetches /api/users and returns an array of names. Call it and log the result. Then change it to load /api/users/1 and /api/users/2 in parallel with Promise.all.
  code: |
    async function main() {
      const res = await fetch("/api/users");
      console.log(await res.json());
    }
    main();

exercises:
  - id: sleep
    title: Write a sleep function
    difficulty: 2
    prompt: |
      Write `sleep(ms, value)` returning a promise that resolves with `value` after `ms` milliseconds, and `later(fn, ms)` that returns a promise resolving with the result of calling `fn()` after `ms` milliseconds.
    starter: |
      function sleep(ms, value) {
      }
      function later(fn, ms) {
      }
    tests:
      - name: sleep
        code: |
          const v = await sleep(100, "x");
          if (v !== "x") throw new Error("sleep should resolve with the value");
      - name: order of timers
        code: |
          const out = [];
          await Promise.all([sleep(300).then(() => out.push("c")), sleep(100).then(() => out.push("a")), sleep(200).then(() => out.push("b"))]);
          if (out.join("") !== "abc") throw new Error("Timers should fire in time order, got " + out.join(""));
      - name: later
        code: |
          if ((await later(() => 40 + 2, 50)) !== 42) throw new Error("later should resolve with fn()");
    hints:
      - "`return new Promise(resolve => setTimeout(() => resolve(value), ms));`"
    solution: |
      function sleep(ms, value) {
        return new Promise((resolve) => setTimeout(() => resolve(value), ms));
      }
      function later(fn, ms) {
        return new Promise((resolve) => setTimeout(() => resolve(fn()), ms));
      }
    explanation: "Wrapping setTimeout in a promise turns a callback API into one you can await."
  - id: parallel-names
    title: Load users in parallel
    difficulty: 3
    prompt: |
      Write an async function `names(ids)` that fetches `/api/users/<id>` for every id **in parallel** and returns an array of the users' names in the same order as `ids`. If a user does not exist (status 404) use `"?"` as the name for that id.
    starter: |
      async function names(ids) {
      }
    tests:
      - name: results
        code: |
          const r = await names([2, 1, 99]);
          if (JSON.stringify(r) !== JSON.stringify(["Ben", "Ada", "?"])) throw new Error("Got " + JSON.stringify(r));
          if ((await names([])).length !== 0) throw new Error("empty list in, empty list out");
      - name: returns a promise
        code: |
          if (!(names([1]) instanceof Promise)) throw new Error("names must be async");
    hints:
      - "`Promise.all(ids.map(async id => { ... }))` keeps the order."
      - "Check `res.ok` before calling `res.json()`."
    solution: |
      async function names(ids) {
        return Promise.all(ids.map(async (id) => {
          const res = await fetch(`/api/users/${id}`);
          if (!res.ok) return "?";
          return (await res.json()).name;
        }));
      }
    explanation: "map starts every request at once; Promise.all gathers the results in the original order."
  - id: retry
    title: Retry on failure
    difficulty: 4
    prompt: |
      Write `async function retry(fn, times)` that calls the async function `fn()` and returns its result. If it rejects, try again, up to `times` calls in total. If every call rejects, throw the **last** error. `retry(fn, 3)` makes at most 3 calls.
    starter: |
      async function retry(fn, times) {
      }
    tests:
      - name: succeeds after failures
        code: |
          let calls = 0;
          const flaky = async () => { calls++; if (calls < 3) throw new Error("fail " + calls); return "ok"; };
          const r = await retry(flaky, 5);
          if (r !== "ok" || calls !== 3) throw new Error("expected ok after 3 calls, got " + r + " after " + calls);
      - name: gives up
        code: |
          let calls = 0;
          const bad = async () => { calls++; throw new Error("fail " + calls); };
          let msg = "";
          try { await retry(bad, 3); } catch (e) { msg = e.message; }
          if (calls !== 3 || msg !== "fail 3") throw new Error("expected 3 calls and the last error, got " + calls + " / " + msg);
      - name: no extra calls
        code: |
          let calls = 0;
          await retry(async () => { calls++; return 1; }, 4);
          if (calls !== 1) throw new Error("do not call again after a success");
    hints:
      - "A loop with try/catch around `return await fn()`. Remember the error from the last attempt."
    solution: |
      async function retry(fn, times) {
        let lastError;
        for (let i = 0; i < times; i++) {
          try {
            return await fn();
          } catch (e) {
            lastError = e;
          }
        }
        throw lastError;
      }
    explanation: "return await inside try is needed so the rejection is caught here and not passed to the caller."
  - id: timeout
    title: Add a timeout
    difficulty: 4
    prompt: |
      Write `withTimeout(promise, ms)` that resolves with `promise`'s value if it settles within `ms` milliseconds, otherwise rejects with `new Error("timeout")`. Use `Promise.race`.
    starter: |
      function withTimeout(promise, ms) {
      }
    tests:
      - name: fast
        code: |
          const fast = new Promise((r) => setTimeout(() => r("fast"), 10));
          if ((await withTimeout(fast, 100)) !== "fast") throw new Error("should resolve with the value");
      - name: slow
        code: |
          const slow = new Promise((r) => setTimeout(() => r("slow"), 500));
          let msg = ""; try { await withTimeout(slow, 100); } catch (e) { msg = e.message; }
          if (msg !== "timeout") throw new Error("should reject with timeout, got " + msg);
      - name: slow real fetch
        code: |
          let msg = ""; try { await withTimeout(fetch("/api/slow"), 100); } catch (e) { msg = e.message; }
          if (msg !== "timeout") throw new Error("a slow fetch should time out");
          const ok = await withTimeout(fetch("/api/slow"), 1000);
          if (!ok.ok) throw new Error("a fetch within the limit should work");
    hints:
      - "Race the original promise against `new Promise((_, reject) => setTimeout(() => reject(new Error(\"timeout\")), ms))`."
    solution: |
      function withTimeout(promise, ms) {
        const timer = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms));
        return Promise.race([promise, timer]);
      }
    explanation: "Promise.race settles with whichever promise settles first, the real result or the timer."
  - id: parse-safe
    title: Parse JSON safely
    difficulty: 2
    prompt: |
      Write `parseJson(text, fallback)` that returns the parsed value, or `fallback` if `text` is not valid JSON. Then write `pick(obj, keys)` returning a new object with only the listed keys that exist in `obj`.
    starter: |
      function parseJson(text, fallback) {
      }
      function pick(obj, keys) {
      }
    tests:
      - name: parseJson
        code: |
          if (parseJson('{"a":1}', null).a !== 1) throw new Error("valid JSON should parse");
          if (parseJson("{bad", 5) !== 5) throw new Error("invalid JSON should give the fallback");
          if (parseJson("null", 5) !== null) throw new Error("a valid null is null, not the fallback");
      - name: pick
        code: |
          const o = { a: 1, b: 2, c: 3 };
          if (JSON.stringify(pick(o, ["a", "c", "z"])) !== JSON.stringify({ a: 1, c: 3 })) throw new Error("pick wrong");
          if (JSON.stringify(o) !== JSON.stringify({ a: 1, b: 2, c: 3 })) throw new Error("do not change the original");
    hints:
      - "try { return JSON.parse(text); } catch { return fallback; }"
      - "For pick use Object.fromEntries(keys.filter(k => k in obj).map(k => [k, obj[k]]))."
    solution: |
      function parseJson(text, fallback) {
        try { return JSON.parse(text); } catch { return fallback; }
      }
      function pick(obj, keys) {
        return Object.fromEntries(keys.filter((k) => k in obj).map((k) => [k, obj[k]]));
      }
    explanation: "JSON.parse throws on bad input, so wrap it in try/catch where input is not trusted."

commonMistakes:
  - title: "Forgetting await"
    explanation: "Without await you get a promise, not the value. console.log shows Promise {pending}."
  - title: "Awaiting independent requests one by one"
    explanation: "Use Promise.all to run them together."
  - title: "Assuming fetch rejects on 404"
    explanation: "fetch only rejects on network failure. Check response.ok."
  - title: "Blocking the thread"
    explanation: "A long loop freezes the page. Break the work up or move it to a worker."

summary:
  - "JavaScript has one thread and an event loop: synchronous code, then microtasks (promises), then the next task (timers, events)."
  - "A promise is pending, fulfilled or rejected; then, catch and finally chain; all, race, allSettled and any combine."
  - "async functions return promises; await pauses the function and try/catch handles rejections."
  - "fetch resolves on any HTTP response; check ok, then json(); JSON.stringify and JSON.parse convert text."
  - "Run independent work in parallel with Promise.all."
