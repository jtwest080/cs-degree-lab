id: u13-dom
title: "The DOM and Events"
minutes: 55
language: html
objective: |
  Make pages interactive: find elements in the DOM, read and change them, create and remove elements, respond to clicks, typing and form submission with events, and use event delegation, classes and data attributes to build small applications.
outcomes:
  - Select elements with querySelector and querySelectorAll
  - Change text, attributes, classes and styles, and create or remove elements
  - Add event listeners and use the event object
  - Handle form submission and input, and prevent default behaviour
  - Use event delegation and keep application state separate from the display

sections:
  - heading: The page as a tree you can change
    body: |
      When the browser parses your HTML it builds the **DOM**, a tree of objects. JavaScript gets it through the global `document`, and every change you make to the tree is shown at once. So interactive pages are JavaScript that **finds** elements, **changes** them and **reacts** to events.

      **Finding** elements: `document.querySelector("css selector")` returns the first match or `null`; `document.querySelectorAll(...)` returns all matches (a NodeList you can loop over or turn into an array with `[...list]`). They accept the same selectors as CSS (Lesson 13.3). `getElementById("id")` is the fast special case. From an element you can search inside it: `card.querySelector(".title")`, and walk the tree with `parentElement`, `children`, `nextElementSibling` and `closest("selector")`.

      The script must run after the elements exist. Put `<script>` at the end of the body (as the examples do), or use `defer`: `<script src="app.js" defer></script>`, which waits until the document is parsed.

  - heading: Reading and changing elements
    body: |
      ```js
      const title = document.querySelector("h1");
      title.textContent = "New title";            // set text (safe)
      title.classList.add("highlight");           // add a class; also remove, toggle, contains
      title.setAttribute("title", "Tooltip");     // or el.id, el.href, el.src, el.value directly
      title.style.color = "tomato";               // inline style (prefer classes)
      title.hidden = true;                        // the hidden attribute
      ```

      **`textContent` versus `innerHTML`.** `textContent` treats the string as plain text; `innerHTML` parses it as HTML. Assigning user-provided text to `innerHTML` lets an attacker insert `<script>` or `<img onerror=...>`: **cross-site scripting (XSS)**, one of the most common web vulnerabilities (Lesson 13.9). Use `textContent`, or build elements, whenever the text did not come from you.

      **Creating** elements: `const li = document.createElement("li"); li.textContent = "Milk"; list.append(li);`. `append`/`prepend` add inside, `before`/`after` add beside, `el.remove()` deletes, `replaceChildren(...)` empties or replaces the content, and `el.cloneNode(true)` copies. For anything bigger the `<template>` element holds inert markup to clone.

      **Data attributes** attach your own data to elements: `<li data-id="42">` is read with `li.dataset.id` (always a string). Form controls expose `value` (string), `checked` (boolean), and `disabled`.

  - heading: Events
    body: |
      An **event** is something that happened: a click, a key press, a form submission, a page finishing loading, the mouse moving. You register a **listener**, a function the browser calls (it is a callback, as in Lesson 13.6):

      ```js
      button.addEventListener("click", (event) => {
        console.log("clicked", event.target);
      });
      ```

      The **event object** says what happened: `event.type`, `event.target` (the element that was the source), `event.currentTarget` (the element the listener is on), `event.key` for keyboard events, `event.clientX/Y` for the mouse. Frequent events: `click`, `input` (every change in a text box), `change`, `submit`, `keydown`, `focus`, `blur`, `DOMContentLoaded`, `scroll`, `resize`.

      **Default actions.** Some events do something on their own: a link navigates, a form submit reloads the page. `event.preventDefault()` cancels that, which is what you want when JavaScript handles the form: `form.addEventListener("submit", (e) => { e.preventDefault(); ... })`.

      **Bubbling.** After the target handles an event it **bubbles** up through its ancestors, so a click on a button inside a list also reaches the list and the document. This enables **event delegation**: one listener on the parent handles all its children, including ones added later:

      ```js
      list.addEventListener("click", (e) => {
        const item = e.target.closest("li");
        if (item && list.contains(item)) item.classList.toggle("done");
      });
      ```

      `event.stopPropagation()` stops the bubbling (use sparingly). Remove a listener with `removeEventListener` using the same function reference.

  - heading: State and rendering
    body: |
      A to-do list application has **state**: the list of tasks. The beginner's way is to treat the page as the state: read text out of elements and edit them one by one. It breaks as soon as there is more than one way to change a thing (add, delete, filter, edit). The robust pattern, which every framework in Lesson 13.8 automates, is:

      1. Keep the state in ordinary JavaScript data (`const todos = [{ id: 1, text: "Milk", done: false }]`).
      2. Write one **`render()`** function that draws the page *from* the state.
      3. Event handlers only **change the state and call `render()`**.

      ```js
      function render() {
        list.replaceChildren(...todos.map((t) => {
          const li = document.createElement("li");
          li.textContent = t.text;
          li.classList.toggle("done", t.done);
          li.dataset.id = t.id;
          return li;
        }));
        count.textContent = todos.filter((t) => !t.done).length + " left";
      }
      ```

      The page can never disagree with the data because it is always recomputed from it. For the small apps here, redrawing everything is plenty fast; frameworks add clever ways to redraw only what changed.

      Finally, to remember data between visits, `localStorage.setItem("todos", JSON.stringify(todos))` and `JSON.parse(localStorage.getItem("todos") ?? "[]")` keep a small amount of text in the browser, per site (Lesson 13.6's JSON again). Do not put secrets there: any script on the page can read it.

examples:
  - title: Find and change
    intro: "Select, read and update elements. The script prints what it did."
    code: |
      <h1 id="title">Hello</h1>
      <ul id="list"><li class="item">one</li><li class="item">two</li></ul>
      <script>
        const title = document.getElementById("title");
        title.textContent = "Hello, DOM";
        title.classList.add("big");
        const items = document.querySelectorAll(".item");
        items[1].textContent = items[1].textContent.toUpperCase();
        items[0].dataset.note = "first";
        console.log(title.textContent, title.className, items.length);
        console.log(items[1].textContent, items[0].getAttribute("data-note"));
        console.log(document.querySelector("li:last-child").closest("ul").id);
      </script>
    output: |
      Hello, DOM big 2
      TWO first
      list
    lines:
      - line: 5
        note: "textContent replaces the text of the element."
      - line: 9
        note: "dataset.note writes a data-note attribute."
      - line: 12
        note: "closest walks up the tree to the nearest matching ancestor."
  - title: Create and remove elements
    intro: "Build list items from an array, then remove one."
    code: |
      <ul id="list"></ul>
      <script>
        const list = document.getElementById("list");
        for (const word of ["red", "green", "blue"]) {
          const li = document.createElement("li");
          li.textContent = word;
          list.append(li);
        }
        console.log(list.children.length, list.innerHTML);
        list.children[1].remove();
        console.log([...list.children].map((li) => li.textContent).join(","));
        list.replaceChildren();
        console.log(list.children.length);
      </script>
    output: |
      3 <li>red</li><li>green</li><li>blue</li>
      red,blue
      0
    lines:
      - line: 5
        note: "createElement makes an element that is not in the page yet."
      - line: 7
        note: "append puts it into the tree, which is when it becomes visible."
  - title: Clicks, with the event object
    intro: "A counter button. The script clicks it twice programmatically, as a user would."
    code: |
      <button id="btn">Clicked 0 times</button>
      <script>
        const btn = document.getElementById("btn");
        let count = 0;
        btn.addEventListener("click", (event) => {
          count++;
          btn.textContent = `Clicked ${count} times`;
          console.log(event.type, event.target.id);
        });
        btn.click();
        btn.click();
        console.log(btn.textContent);
      </script>
    output: |
      click btn
      click btn
      Clicked 2 times
    lines:
      - line: 5
        note: "The listener is a closure over count and btn."
      - line: 10
        note: "click() dispatches a real click event, so the listener runs."
  - title: Forms and preventDefault
    intro: "Handle a submit in JavaScript without reloading the page."
    code: |
      <form id="f"><input id="name" name="name" value="Ada"><button>Greet</button></form>
      <p id="out"></p>
      <script>
        document.getElementById("f").addEventListener("submit", (e) => {
          e.preventDefault();
          const name = new FormData(e.target).get("name").trim();
          document.getElementById("out").textContent = name ? `Hello, ${name}!` : "Please enter a name";
          console.log("defaultPrevented:", e.defaultPrevented);
        });
        document.querySelector("button").click();
        console.log(document.getElementById("out").textContent);
      </script>
    output: |
      defaultPrevented: true
      Hello, Ada!
    lines:
      - line: 5
        note: "Without this the browser would navigate to the form action and reload."
      - line: 6
        note: "FormData reads every named control."
  - title: Event delegation
    intro: "One listener on the list handles clicks on every item, even ones added later."
    code: |
      <ul id="list"><li>a</li><li>b</li></ul>
      <script>
        const list = document.getElementById("list");
        list.addEventListener("click", (e) => {
          const li = e.target.closest("li");
          if (li) li.classList.toggle("done");
        });
        const added = document.createElement("li");
        added.textContent = "c (added later)";
        list.append(added);
        list.children[0].click();
        added.click();
        console.log([...list.children].map((li) => li.className || "-").join(" "));
      </script>
    output: |
      done - done
    lines:
      - line: 4
        note: "The click bubbles from the li up to the ul, where the single listener sees it."
      - line: 8
        note: "The new item needs no listener of its own."
  - title: State and render
    intro: "State lives in an array; render redraws the list from it; handlers change state and call render."
    code: |
      <input id="new"><button id="add">Add</button>
      <ul id="list"></ul><p id="count"></p>
      <script>
        const todos = [{ id: 1, text: "Milk", done: false }];
        let nextId = 2;
        const list = document.getElementById("list");
        function render() {
          list.replaceChildren(...todos.map((t) => {
            const li = document.createElement("li");
            li.textContent = t.text;
            li.dataset.id = t.id;
            li.classList.toggle("done", t.done);
            return li;
          }));
          document.getElementById("count").textContent = todos.filter((t) => !t.done).length + " left";
        }
        document.getElementById("add").addEventListener("click", () => {
          const input = document.getElementById("new");
          if (!input.value.trim()) return;
          todos.push({ id: nextId++, text: input.value.trim(), done: false });
          input.value = "";
          render();
        });
        list.addEventListener("click", (e) => {
          const li = e.target.closest("li"); if (!li) return;
          const todo = todos.find((t) => t.id === Number(li.dataset.id));
          todo.done = !todo.done;
          render();
        });
        render();
        document.getElementById("new").value = "Eggs";
        document.getElementById("add").click();
        list.children[0].click();
        console.log(document.getElementById("count").textContent, list.children.length);
      </script>
    output: |
      1 left 2
    lines:
      - line: 7
        note: "render draws everything from the todos array."
      - line: 19
        note: "Handlers only change the data and call render."
      - line: 25
        note: "dataset values are strings, so convert before comparing with a number id."

playground:
  prompt: |
    Build a character counter: a textarea and a paragraph that shows how many characters are typed so far, updated on every `input` event. Try pasting text.
  code: |
    <textarea id="t" rows="3"></textarea>
    <p id="n">0 characters</p>
