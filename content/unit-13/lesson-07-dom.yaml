quiz:
  - type: mcq
    question: What does document.querySelector(".a") return if nothing matches?
    options: ["null", "An empty array", "undefined", "It throws"]
    answer: 0
    explanation: "querySelector returns null; querySelectorAll returns an empty list."
  - type: mcq
    question: Which is safe for inserting text typed by a user?
    options: ["element.textContent = text", "element.innerHTML = text", "document.write(text)", "eval(text)"]
    answer: 0
    explanation: "textContent never interprets the text as HTML."
  - type: mcq
    question: What does event.preventDefault() do in a submit handler?
    options: ["Stops the browser's default action, such as reloading the page", "Stops the event bubbling", "Deletes the form", "Validates the form"]
    answer: 0
    explanation: "It cancels the default action only."
  - type: mcq
    question: What is event delegation?
    options: ["One listener on a parent handles events from its children", "Passing events to a server", "Cancelling an event", "Adding a listener to every child"]
    answer: 0
    explanation: "Events bubble, so the parent can inspect event.target."
  - type: mcq
    question: What type is element.dataset.id for data-id=\"5\"?
    options: ["string", "number", "boolean", "object"]
    answer: 0
    explanation: "dataset values are always strings."
  - type: mcq
    question: Why keep state in a variable and render from it?
    options: ["The page cannot disagree with the data", "It is shorter", "Browsers require it", "It avoids JavaScript"]
    answer: 0
    explanation: "A single source of truth keeps different views in step."
  - type: code
    question: |
      Make clicking `#btn` change the text of `#out` to `Clicked!`.
    starter: |
      <button id="btn">Go</button><p id="out"></p>
      <script>
      </script>
    tests:
      - name: click
        code: |
          click("#btn"); assert($("#out").textContent === "Clicked!", "The paragraph should say Clicked!");
    solution: |
      <button id="btn">Go</button><p id="out"></p>
      <script>
        document.getElementById("btn").addEventListener("click", () => {
          document.getElementById("out").textContent = "Clicked!";
        });
      </script>
