exercises:
  - id: set-text
    title: Change the page
    difficulty: 1
    prompt: |
      Write a script that changes the text of `#title` to `Welcome` and adds the class `ready` to `#title`.
    starter: |
      <h1 id="title">Loading</h1>
      <script>
      </script>
    tests:
      - name: text and class
        code: |
          assert($("#title").textContent === "Welcome", "The text should be Welcome");
          assert($("#title").classList.contains("ready"), "Add the class ready");
    hints:
      - "`document.getElementById(\"title\")`, then `.textContent` and `.classList.add`."
    solution: |
      <h1 id="title">Loading</h1>
      <script>
        const t = document.getElementById("title");
        t.textContent = "Welcome";
        t.classList.add("ready");
      </script>
    explanation: "Find the element once and change it; classList is the clean way to add classes."
  - id: toggle-menu
    title: A toggle button
    difficulty: 2
    prompt: |
      Clicking the button `#toggle` should show or hide the element `#menu` by toggling its `hidden` property, and set the button's text to `Hide menu` while the menu is visible and `Show menu` while it is hidden. The page starts with the menu visible and the button saying `Hide menu`.
    starter: |
      <button id="toggle">Hide menu</button>
      <nav id="menu">Menu items</nav>
      <script>
      </script>
    tests:
      - name: hides
        code: |
          click("#toggle");
          assert($("#menu").hidden === true, "The first click should hide the menu");
          assert($("#toggle").textContent === "Show menu", "The button should now say Show menu");
      - name: shows again
        code: |
          click("#toggle"); click("#toggle");
          assert($("#menu").hidden === false, "The second click should show the menu");
          assert($("#toggle").textContent === "Hide menu", "The button should say Hide menu again");
    hints:
      - "`menu.hidden = !menu.hidden;` then set the text from `menu.hidden`."
    solution: |
      <button id="toggle">Hide menu</button>
      <nav id="menu">Menu items</nav>
      <script>
        const btn = document.getElementById("toggle");
        const menu = document.getElementById("menu");
        btn.addEventListener("click", () => {
          menu.hidden = !menu.hidden;
          btn.textContent = menu.hidden ? "Show menu" : "Hide menu";
        });
      </script>
    explanation: "The button text is computed from the state after the change, so the two can never disagree."
  - id: live-counter
    title: Live character count
    difficulty: 2
    prompt: |
      As the user types in `#msg` (an `<input>`), update the paragraph `#count` to read `N / 20` where N is the current length. When N is greater than 20 add the class `over` to `#count`, otherwise remove it. Show `0 / 20` at the start.
    starter: |
      <input id="msg"><p id="count">0 / 20</p>
      <script>
      </script>
    tests:
      - name: counts
        code: |
          const i = $("#msg"); i.value = "hello"; fire(i, "input");
          assert($("#count").textContent === "5 / 20", "Expected 5 / 20, got " + $("#count").textContent);
          assert(!$("#count").classList.contains("over"), "Not over yet");
      - name: over
        code: |
          const i = $("#msg"); i.value = "x".repeat(25); fire(i, "input");
          assert($("#count").textContent === "25 / 20", "Expected 25 / 20");
          assert($("#count").classList.contains("over"), "Add the class over");
          i.value = "ok"; fire(i, "input");
          assert(!$("#count").classList.contains("over"), "Remove over again");
    hints:
      - "Listen for the input event. `classList.toggle(\"over\", n > 20)`."
    solution: |
      <input id="msg"><p id="count">0 / 20</p>
      <script>
        const msg = document.getElementById("msg");
        const count = document.getElementById("count");
        msg.addEventListener("input", () => {
          const n = msg.value.length;
          count.textContent = `${n} / 20`;
          count.classList.toggle("over", n > 20);
        });
      </script>
    explanation: "The input event fires on every change. toggle with a second argument adds or removes by a condition."
  - id: todo-add
    title: Add to a list
    difficulty: 3
    prompt: |
      Submitting the form `#form` must add a new `<li>` with the typed text to `#list` and clear the input `#text`. Empty or whitespace-only text must add nothing. The page must not reload (prevent the default). Clicking an item must toggle its `done` class (use delegation on the list).
    starter: |
      <form id="form"><input id="text"><button>Add</button></form>
      <ul id="list"></ul>
      <script>
      </script>
    tests:
      - name: adds and clears
        code: |
          const f = $("#form"), t = $("#text");
          t.value = "  Buy milk  ";
          const ev = new Event("submit", { bubbles: true, cancelable: true }); f.dispatchEvent(ev);
          assert(ev.defaultPrevented, "Call preventDefault");
          assert($$("#list li").length === 1 && $("#list li").textContent === "Buy milk", "Add a trimmed li with the text");
          assert(t.value === "", "Clear the input");
      - name: ignores empty
        code: |
          const f = $("#form"), t = $("#text");
          t.value = "   "; f.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          assert($$("#list li").length === 0, "Do not add empty items");
      - name: delegated toggle
        code: |
          const f = $("#form"), t = $("#text");
          for (const w of ["a", "b"]) { t.value = w; f.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true })); }
          $$("#list li")[1].click();
          assert(!$$("#list li")[0].classList.contains("done") && $$("#list li")[1].classList.contains("done"), "Clicking toggles done on that item only");
          $$("#list li")[1].click();
          assert(!$$("#list li")[1].classList.contains("done"), "Clicking again removes done");
    hints:
      - "`form.addEventListener(\"submit\", e => { e.preventDefault(); ... })`."
      - "Use `textContent` for the new item."
    solution: |
      <form id="form"><input id="text"><button>Add</button></form>
      <ul id="list"></ul>
      <script>
        const form = document.getElementById("form");
        const text = document.getElementById("text");
        const list = document.getElementById("list");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const value = text.value.trim();
          if (!value) return;
          const li = document.createElement("li");
          li.textContent = value;
          list.append(li);
          text.value = "";
        });
        list.addEventListener("click", (e) => {
          const li = e.target.closest("li");
          if (li) li.classList.toggle("done");
        });
      </script>
    explanation: "Using textContent keeps typed text from being read as HTML, and delegation covers items added later."
  - id: render-state
    title: Render from state
    difficulty: 4
    prompt: |
      You are given `const items = [...]` (objects with `name` and `qty`). Write `render()` so that `#table` (a `<tbody>`) contains one `<tr>` per item with two cells (name, qty), and `#total` shows `Total: N` where N is the sum of the quantities. Clicking a button with class `plus` inside a row (add one to each row: a `<button class="plus">+</button>` as a third cell) must add 1 to that item's `qty` and re-render. Call `render()` once at the start.
    starter: |
      <table><tbody id="table"></tbody></table><p id="total"></p>
      <script>
        const items = [{ name: "Pens", qty: 2 }, { name: "Ink", qty: 5 }];
        function render() {
        }
        render();
      </script>
    tests:
      - name: initial render
        code: |
          const rows = $$("#table tr").map((r) => [...r.children].slice(0, 2).map((c) => c.textContent));
          assert(JSON.stringify(rows) === JSON.stringify([["Pens", "2"], ["Ink", "5"]]), "Rows wrong: " + JSON.stringify(rows));
          assert($("#total").textContent === "Total: 7", "Total should be 7, it is " + $("#total").textContent);
          assert($$("#table .plus").length === 2, "Each row needs a plus button");
      - name: plus button
        code: |
          $$("#table .plus")[1].click();
          assert($$("#table tr")[1].children[1].textContent === "6", "Ink should now be 6");
          assert($("#total").textContent === "Total: 8", "Total should be 8");
          assert($$("#table tr").length === 2, "Still two rows (no duplicates)");
          $$("#table .plus")[0].click();
          assert($("#total").textContent === "Total: 9", "Total should be 9");
    hints:
      - "Use replaceChildren(...rows) so each render replaces the old rows."
      - "Give each button a click handler that changes items[i].qty and calls render()."
    solution: |
      <table><tbody id="table"></tbody></table><p id="total"></p>
      <script>
        const items = [{ name: "Pens", qty: 2 }, { name: "Ink", qty: 5 }];
        function render() {
          const table = document.getElementById("table");
          table.replaceChildren(...items.map((item) => {
            const tr = document.createElement("tr");
            const name = document.createElement("td"); name.textContent = item.name;
            const qty = document.createElement("td"); qty.textContent = item.qty;
            const cell = document.createElement("td");
            const plus = document.createElement("button");
            plus.className = "plus"; plus.textContent = "+";
            plus.addEventListener("click", () => { item.qty++; render(); });
            cell.append(plus);
            tr.append(name, qty, cell);
            return tr;
          }));
          document.getElementById("total").textContent = "Total: " + items.reduce((s, i) => s + i.qty, 0);
        }
        render();
      </script>
    explanation: "State changes, render redraws. The page cannot disagree with the data because it is always built from it."

commonMistakes:
  - title: "Running the script before the elements exist"
    explanation: "A script in the head cannot find body elements. Put it at the end of the body or use defer."
  - title: "Using innerHTML with user text"
    explanation: "It runs injected HTML and scripts (XSS). Use textContent."
    wrong: |
      el.innerHTML = userText;
    right: |
      el.textContent = userText;
  - title: "Calling the handler instead of passing it"
    explanation: "addEventListener(\"click\", go()) runs go now. Pass the function: addEventListener(\"click\", go)."
  - title: "Forgetting that dataset and value are strings"
    explanation: "Convert with Number(...) before comparing or adding."

summary:
  - "The DOM is a tree you can search (querySelector), read and change (textContent, classList, attributes, dataset)."
  - "Create elements with createElement and append; remove with remove or replaceChildren."
  - "Events call listeners with an event object; preventDefault cancels default actions; events bubble, enabling delegation."
  - "Keep state in data and render the page from it; handlers change state then call render."
  - "Never put untrusted text into innerHTML."
