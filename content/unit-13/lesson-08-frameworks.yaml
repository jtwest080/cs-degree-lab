id: u13-frameworks
title: "Components, State and Front-end Frameworks"
minutes: 55
language: javascript
objective: |
  Understand what front-end frameworks such as React, Vue and Svelte automate by building the core ideas yourself: describing a UI as data, components as functions, rendering and escaping, stores with subscriptions, and a simple diff that finds what changed.
outcomes:
  - Describe a UI as a tree of plain objects (virtual nodes) and render it to HTML text
  - Write components as functions from props to UI and compose them
  - Escape text correctly to prevent cross-site scripting
  - Build a store with state, actions and subscribers, and explain one-way data flow
  - Compute a diff between two trees and explain why frameworks do this

sections:
  - heading: Why frameworks exist
    body: |
      The last lesson ended with a pattern: keep **state** in data and write a `render()` that builds the page from it. In a big application you would write thousands of lines of `createElement` calls, keep many `render` functions in step, and decide which parts of the page to update when something changes. A **framework** (React, Vue, Svelte, Angular, Solid) automates this. They differ in detail but share the same ideas:

      1. **The UI is a function of state.** You describe what the page *should* look like for the current data. The framework makes the real page match.
      2. **Components.** A page is a tree of small, reusable pieces (a button, a card, a login form), each taking inputs (**props**) and perhaps keeping its own state.
      3. **One-way data flow.** Data flows down from parents to children as props; events flow up as function calls. That makes it easy to find why something changed.
      4. **Efficient updates.** When state changes the framework compares the new description with the old one and changes only the parts of the DOM that differ.

      In this lesson there is no page to draw on, so you will build these ideas as pure JavaScript functions that produce **HTML text** or plain objects, which also makes them easy to test. Everything here is a simplified version of what a real framework does; the point is that you understand the machine, not that you write your own.

  - heading: Describing UI as data
    body: |
      A **virtual node** is a plain object describing an element: its tag, attributes and children. A helper `h` (for "hyperscript") makes them short:

      ```js
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      const tree = h("ul", { class: "list" },
        h("li", null, "milk"),
        h("li", { class: "done" }, "eggs"));
      ```

      Nothing is drawn: `tree` is just data you can print, test, copy and compare. (React's JSX, `<ul class="list">...</ul>` inside JavaScript, is a notation that turns into exactly these `h` calls.) To show it you write a function that **renders** the tree, here to an HTML string:

      ```js
      const render = (n) => typeof n === "string" ? escape(n)
        : `<${n.tag}${attrs(n.props)}>${n.children.map(render).join("")}</${n.tag}>`;
      ```

      Because rendering is a function of data, the same tree can be drawn into the DOM, sent from a server as HTML (**server-side rendering**), or turned into a native phone screen.

      **Escaping.** Any text that goes into HTML must have `&`, `<`, `>`, `"` and `'` replaced by `&amp;` `&lt;` `&gt;` `&quot;` `&#39;`. Frameworks do this automatically for text children, which is why they are safe by default, and why escape hatches such as React's `dangerouslySetInnerHTML` carry that name.

  - heading: Components
    body: |
      A **component** is a function that takes props and returns a tree. Components return trees that contain other components, which composes the page:

      ```js
      const Item = ({ text, done }) => h("li", { class: done ? "done" : "" }, text);
      const List = ({ items }) => h("ul", null, items.map((i) => Item(i)));
      const App = ({ todos }) => h("main", null, h("h1", null, "To do"), List({ items: todos }));
      ```

      A component that only turns props into output, with no hidden state and no side effects, is **pure**: the same props always give the same result. This makes components easy to test (call the function, check the tree) and easy to reason about. Real frameworks add **local state** (React's `useState`, Vue's `ref`), **effects** (running code after rendering, such as fetching data), and **keys**: a unique `key` on each list item so the framework can tell which item is which after a reorder.

      **Composition over inheritance.** Components are built by nesting and by passing children, not by class hierarchies. A `Card` component takes `children` and wraps them; a `Button` takes `onClick` as a prop. This is the same idea as passing a function as an argument, from Lesson 13.5.

  - heading: Stores and one-way data flow
    body: |
      State shared by many components lives in a **store**. The smallest useful store holds state, lets code **subscribe** to changes, and changes only through named **actions**:

      ```js
      function createStore(reducer, initial) {
        let state = initial;
        const listeners = new Set();
        return {
          getState: () => state,
          dispatch(action) { state = reducer(state, action); listeners.forEach((l) => l(state)); },
          subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
        };
      }
      ```

      A **reducer** is a pure function `(state, action) => newState` that never changes the old state but returns a new one: `{ ...state, count: state.count + 1 }`. This is the heart of Redux and of the Elm architecture. The cycle is **one way**: the view shows state; the user acts; the event dispatches an action; the reducer makes new state; subscribers re-render. Because every change is an action in a list, you can log them, undo by replaying fewer, and find bugs by reading the sequence.

  - heading: Finding what changed
    body: |
      Replacing the entire page on every key press would lose the cursor position and scroll position, restart animations and be slow. So frameworks compare the **old tree** with the **new tree** and produce a small list of changes to apply to the real DOM. This is called **diffing** (React calls the tree the **virtual DOM** and the process **reconciliation**).

      A simple diff walks both trees together:
      - no old node: **create** the new one; no new node: **remove** the old one;
      - different tag (or one is text and one is an element): **replace** it;
      - same tag: **update** the changed attributes, then diff the children pairwise.

      Comparing arbitrary trees optimally is slow (cubic), so frameworks use two assumptions that hold for UIs: elements of different types produce different trees, and a **key** marks which children are stable across renders. This reduces the work to one pass. Newer frameworks (Svelte, Solid) skip the diff and generate code that updates exactly the parts that depend on each piece of state, but the goal is the same: **describe the UI for the current state and let the machine do the minimal DOM work.**

examples:
  - title: Virtual nodes and rendering
    intro: "Build a tree with h and render it to an HTML string, with automatic escaping."
    code: |
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const attrs = (p) => Object.entries(p).filter(([, v]) => v !== false && v != null && v !== "")
        .map(([k, v]) => v === true ? ` ${k}` : ` ${k}="${esc(v)}"`).join("");
      const render = (n) => typeof n === "string" || typeof n === "number" ? esc(n)
        : `<${n.tag}${attrs(n.props)}>${n.children.map(render).join("")}</${n.tag}>`;

      const tree = h("ul", { class: "list" },
        h("li", null, "milk"),
        h("li", { class: "done" }, "eggs & <b>bread</b>"));
      console.log(render(tree));
      console.log(tree.children.length, tree.children[1].props);
    output: |
      <ul class="list"><li>milk</li><li class="done">eggs &amp; &lt;b&gt;bread&lt;/b&gt;</li></ul>
      2 {"class":"done"}
    lines:
      - line: 1
        note: "A node is a plain object; flat() lets us pass arrays of children."
      - line: 8
        note: "Text children are escaped, so the <b> in the data becomes harmless text."
  - title: Components compose
    intro: "Small pure functions from props to trees, combined into an application."
    code: |
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const render = (n) => typeof n === "string" ? esc(n)
        : `<${n.tag}${n.props.class ? ` class="${n.props.class}"` : ""}>${n.children.map(render).join("")}</${n.tag}>`;

      const Item = ({ text, done }) => h("li", { class: done ? "done" : "" }, text);
      const List = ({ items }) => h("ul", null, items.map(Item));
      const Count = ({ items }) => h("p", null, `${items.filter((i) => !i.done).length} left`);
      const App = ({ todos }) => h("main", null, h("h1", null, "To do"), List({ items: todos }), Count({ items: todos }));

      const todos = [{ text: "Milk", done: true }, { text: "Eggs", done: false }];
      console.log(render(App({ todos })));
      console.log(render(App({ todos: [] })));
    output: |
      <main><h1>To do</h1><ul><li class="done">Milk</li><li>Eggs</li></ul><p>1 left</p></main>
      <main><h1>To do</h1><ul></ul><p>0 left</p></main>
    lines:
      - line: 6
        note: "A component is a function from props to a tree."
      - line: 9
        note: "App composes the others."
  - title: A store with one-way flow
    intro: "A reducer computes new state; subscribers are told. The old state object is never changed."
    code: |
      function createStore(reducer, initial) {
        let state = initial;
        const listeners = new Set();
        return {
          getState: () => state,
          dispatch(action) { state = reducer(state, action); listeners.forEach((l) => l(state)); },
          subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
        };
      }
      function reducer(state, action) {
        switch (action.type) {
          case "add": return { ...state, todos: [...state.todos, { text: action.text, done: false }] };
          case "toggle": return { ...state, todos: state.todos.map((t, i) => i === action.index ? { ...t, done: !t.done } : t) };
          default: return state;
        }
      }
      const store = createStore(reducer, { todos: [] });
      const first = store.getState();
      const unsubscribe = store.subscribe((s) => console.log("render:", s.todos.map((t) => (t.done ? "x " : "- ") + t.text).join(", ")));
      store.dispatch({ type: "add", text: "Milk" });
      store.dispatch({ type: "add", text: "Eggs" });
      store.dispatch({ type: "toggle", index: 0 });
      unsubscribe();
      store.dispatch({ type: "add", text: "silent" });
      console.log(first.todos.length, store.getState().todos.length);
    output: |
      render: - Milk
      render: - Milk, - Eggs
      render: x Milk, - Eggs
      0 3
    lines:
      - line: 12
        note: "The reducer returns a new object each time: copy with spread, then change one field."
      - line: 24
        note: "After unsubscribing nothing is printed, but the state still changed."
      - line: 25
        note: "The first state object still has zero items: it was never mutated."
  - title: Diffing two trees
    intro: "Compare an old and a new tree and list the minimal changes."
    code: |
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      function diff(a, b, path = "root") {
        if (a === undefined) return [`create ${path}`];
        if (b === undefined) return [`remove ${path}`];
        if (typeof a === "string" || typeof b === "string") return a === b ? [] : [`replace ${path}`];
        if (a.tag !== b.tag) return [`replace ${path}`];
        const out = [];
        for (const k of new Set([...Object.keys(a.props), ...Object.keys(b.props)])) {
          if (a.props[k] !== b.props[k]) out.push(`set ${path}.${k}=${b.props[k]}`);
        }
        const n = Math.max(a.children.length, b.children.length);
        for (let i = 0; i < n; i++) out.push(...diff(a.children[i], b.children[i], `${path}/${i}`));
        return out;
      }
      const before = h("ul", null, h("li", null, "milk"), h("li", { class: "done" }, "eggs"));
      const after = h("ul", null, h("li", null, "milk"), h("li", null, "eggs"), h("li", null, "bread"));
      console.log(diff(before, after));
      console.log(diff(before, before));
    output: |
      ["set root/1.class=undefined","create root/2"]
      []
    lines:
      - line: 5
        note: "Different text means that text node is replaced."
      - line: 9
        note: "Same tag: compare each attribute and only report differences."
      - line: 12
        note: "Children are compared pairwise by position (a real framework uses keys to match reordered items)."
      - line: 18
        note: "Identical trees need no DOM work at all."

playground:
  prompt: |
    Add a `Button` component that renders `<button>` with a label, and use it inside `App`. Then render the tree to a string and check the output.
  code: |
    const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
    console.log(JSON.stringify(h("p", null, "hi")));

exercises:
  - id: h-render
    title: Render a tree
    difficulty: 2
    prompt: |
      A node is `{ tag, props, children }` where a child is either a string or another node. Write `render(node)` returning an HTML string. Escape `&`, `<` and `>` in text. Attributes are written as ` name="value"` in the order of the props object; a prop whose value is `false` or `null` is left out. Tags `br`, `hr` and `img` are void: write `<br>` with no closing tag and no children.
    starter: |
      function render(node) {
      }
    tests:
      - name: nesting and text
        code: |
          const n = { tag: "p", props: {}, children: ["a ", { tag: "b", props: {}, children: ["bold"] }] };
          if (render(n) !== "<p>a <b>bold</b></p>") throw new Error("Got " + render(n));
      - name: attributes
        code: |
          const n = { tag: "a", props: { href: "/x", id: "k", hidden: false, title: null }, children: ["go"] };
          if (render(n) !== '<a href="/x" id="k">go</a>') throw new Error("Got " + render(n));
      - name: escaping
        code: |
          const n = { tag: "p", props: {}, children: ["1 < 2 & 3 > 2"] };
          if (render(n) !== "<p>1 &lt; 2 &amp; 3 &gt; 2</p>") throw new Error("Got " + render(n));
          if (render("<script>") !== "&lt;script&gt;") throw new Error("A bare string must be escaped too");
      - name: void tags
        code: |
          if (render({ tag: "br", props: {}, children: [] }) !== "<br>") throw new Error("br is void");
          if (render({ tag: "img", props: { alt: "x" }, children: [] }) !== '<img alt="x">') throw new Error("img is void");
    hints:
      - "Escape & first, then < and >."
      - "A string node: return escape(node). Otherwise build the opening tag from Object.entries(props)."
    solution: |
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const VOID = new Set(["br", "hr", "img"]);
      function render(node) {
        if (typeof node === "string") return esc(node);
        const attrs = Object.entries(node.props)
          .filter(([, v]) => v !== false && v !== null)
          .map(([k, v]) => ` ${k}="${v}"`).join("");
        if (VOID.has(node.tag)) return `<${node.tag}${attrs}>`;
        return `<${node.tag}${attrs}>${node.children.map(render).join("")}</${node.tag}>`;
      }
    explanation: "Escaping & first avoids double-escaping the & in the other entities."
  - id: components
    title: A table of components
    difficulty: 3
    prompt: |
      Using the `h` helper below, write components `Row({ name, qty })` returning a `tr` with two `td` children, and `Table({ rows })` returning a `table` whose children are a `tr` header (two `th`: `Item`, `Qty`) followed by one `Row` per entry. Rows with `qty` 0 get the prop `class: "empty"` on the `tr`.
    starter: |
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      function Row({ name, qty }) {
      }
      function Table({ rows }) {
      }
    tests:
      - name: row
        code: |
          const r = Row({ name: "Pen", qty: 3 });
          if (r.tag !== "tr" || r.children.length !== 2 || r.children[0].tag !== "td") throw new Error("Row should be a tr with two td");
          if (r.children[0].children[0] !== "Pen" || String(r.children[1].children[0]) !== "3") throw new Error("Cells should hold the name and qty");
          if (Row({ name: "Ink", qty: 0 }).props.class !== "empty") throw new Error("qty 0 gets class empty");
          if (r.props.class === "empty") throw new Error("only qty 0 is empty");
      - name: table
        code: |
          const t = Table({ rows: [{ name: "A", qty: 1 }, { name: "B", qty: 2 }] });
          if (t.tag !== "table" || t.children.length !== 3) throw new Error("table needs a header row plus one row per entry");
          const th = t.children[0].children.map((c) => c.tag + ":" + c.children[0]).join(",");
          if (th !== "th:Item,th:Qty") throw new Error("Header wrong: " + th);
          if (Table({ rows: [] }).children.length !== 1) throw new Error("no rows means just the header");
    hints:
      - "`h(\"tr\", { class: qty === 0 ? \"empty\" : \"\" }, h(\"td\", null, name), h(\"td\", null, String(qty)))` would set class to an empty string for non-empty rows; leave the prop out instead."
    solution: |
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      function Row({ name, qty }) {
        return h("tr", qty === 0 ? { class: "empty" } : null, h("td", null, name), h("td", null, String(qty)));
      }
      function Table({ rows }) {
        return h("table", null, h("tr", null, h("th", null, "Item"), h("th", null, "Qty")), rows.map(Row));
      }
    explanation: "Components are plain functions. h flattens the array of rows into the children."
  - id: reducer
    title: A reducer
    difficulty: 3
    prompt: |
      Write `reducer(state, action)` for a counter with state `{ count, history }` (history is an array of previous counts). Actions: `{ type: "inc" }` and `{ type: "dec" }` change count by 1 and push the **old** count onto `history`; `{ type: "add", n }` adds `n`; `{ type: "undo" }` restores the last count from history (and removes it); unknown actions return the same state object. Never change the input state.
    starter: |
      function reducer(state, action) {
      }
    tests:
      - name: inc dec add
        code: |
          let s = { count: 0, history: [] };
          s = reducer(s, { type: "inc" }); s = reducer(s, { type: "add", n: 5 }); s = reducer(s, { type: "dec" });
          if (s.count !== 5 || JSON.stringify(s.history) !== "[0,1,6]") throw new Error("Got " + JSON.stringify(s));
      - name: undo
        code: |
          let s = reducer(reducer({ count: 0, history: [] }, { type: "inc" }), { type: "inc" });
          s = reducer(s, { type: "undo" });
          if (s.count !== 1 || JSON.stringify(s.history) !== "[0]") throw new Error("Got " + JSON.stringify(s));
          const e = { count: 3, history: [] };
          if (reducer(e, { type: "undo" }) !== e) throw new Error("undo with no history returns the same state");
      - name: purity
        code: |
          const s = Object.freeze({ count: 1, history: Object.freeze([]) });
          const t = reducer(s, { type: "inc" });
          if (t === s || s.count !== 1 || s.history.length !== 0) throw new Error("Do not change the old state");
          if (reducer(s, { type: "nope" }) !== s) throw new Error("unknown action returns the same object");
    hints:
      - "Return new objects: `{ count: state.count + 1, history: [...state.history, state.count] }`."
    solution: |
      function reducer(state, action) {
        switch (action.type) {
          case "inc": return { count: state.count + 1, history: [...state.history, state.count] };
          case "dec": return { count: state.count - 1, history: [...state.history, state.count] };
          case "add": return { count: state.count + action.n, history: [...state.history, state.count] };
          case "undo":
            if (state.history.length === 0) return state;
            return { count: state.history[state.history.length - 1], history: state.history.slice(0, -1) };
          default: return state;
        }
      }
    explanation: "A pure reducer builds new objects, so old states stay valid and undo is simply a stack."
  - id: memo-diff
    title: Count the DOM work
    difficulty: 4
    prompt: |
      Write `diffCount(a, b)` for virtual nodes (`{ tag, props, children }` or strings). It returns the number of DOM operations needed to turn tree `a` into tree `b`: a missing or extra node counts 1 (create or remove, however large its subtree); a different tag, or a text change, counts 1 (replace); for the same tag, every prop that differs (added, removed or changed) counts 1, then children are compared by position and summed.
    starter: |
      function diffCount(a, b) {
      }
    tests:
      - name: identical
        code: |
          const t = { tag: "p", props: { class: "x" }, children: ["hi"] };
          if (diffCount(t, JSON.parse(JSON.stringify(t))) !== 0) throw new Error("identical trees need 0 operations");
      - name: text and props
        code: |
          const a = { tag: "p", props: { class: "x", id: "k" }, children: ["hi"] };
          const b = { tag: "p", props: { class: "y" }, children: ["bye"] };
          if (diffCount(a, b) !== 3) throw new Error("class changed, id removed, text replaced = 3, got " + diffCount(a, b));
      - name: create and remove
        code: |
          const li = (t) => ({ tag: "li", props: {}, children: [t] });
          const ul = (...c) => ({ tag: "ul", props: {}, children: c });
          if (diffCount(ul(li("a")), ul(li("a"), li("b"), li("c"))) !== 2) throw new Error("two new items = 2");
          if (diffCount(ul(li("a"), li("b")), ul(li("a"))) !== 1) throw new Error("one removed item = 1");
          if (diffCount({ tag: "p", props: {}, children: [] }, { tag: "div", props: {}, children: [] }) !== 1) throw new Error("different tag = 1");
    hints:
      - "Handle undefined first, then strings, then tags, then props, then recurse over the longer children list."
    solution: |
      function diffCount(a, b) {
        if (a === undefined || b === undefined) return 1;
        if (typeof a === "string" || typeof b === "string") return a === b ? 0 : 1;
        if (a.tag !== b.tag) return 1;
        let n = 0;
        for (const k of new Set([...Object.keys(a.props), ...Object.keys(b.props)])) {
          if (a.props[k] !== b.props[k]) n++;
        }
        const len = Math.max(a.children.length, b.children.length);
        for (let i = 0; i < len; i++) n += diffCount(a.children[i], b.children[i]);
        return n;
      }
    explanation: "A framework applies exactly this kind of walk, then performs only the counted operations on the real page."

commonMistakes:
  - title: "Mutating state in a reducer"
    explanation: "Changing the old object makes it impossible to compare old and new, and breaks undo. Return a new object."
    wrong: |
      state.count++; return state;
    right: |
      return { ...state, count: state.count + 1 };
  - title: "Building HTML by concatenating unescaped text"
    explanation: "It invites XSS. Escape every text child, or let the framework do it."
  - title: "Using array indexes as keys for lists that reorder"
    explanation: "The framework matches items by key; index keys make the wrong items be reused after a reorder."
  - title: "Putting everything into one global state"
    explanation: "Keep state as local as possible and share only what several components need."

summary:
  - "A framework keeps the UI a function of state, built from reusable components, with one-way data flow and efficient updates."
  - "A virtual node is a plain object (tag, props, children); rendering turns it into HTML or DOM, and text must be escaped."
  - "Components are functions from props to trees; pure components are easy to test and compose."
  - "A store holds state; reducers return new state; subscribers re-render; actions make the history explicit."
  - "Diffing compares old and new trees and applies only the differences."
next: u13-backend

quiz:
  - type: mcq
    question: What is a component?
    options: ["A reusable function from props (and state) to UI", "A CSS file", "A database table", "An HTTP method"]
    answer: 0
    explanation: "Components compose into trees that describe the page."
  - type: mcq
    question: What does one-way data flow mean?
    options: ["Data goes down as props; changes go up as events or actions", "Data can never change", "Only the server may send data", "Components cannot talk"]
    answer: 0
    explanation: "A single direction makes it easy to trace changes."
  - type: mcq
    question: What must a reducer not do?
    options: ["Change the old state object", "Return a new object", "Take an action", "Be called several times"]
    answer: 0
    explanation: "It must be pure: build and return new state."
  - type: mcq
    question: Why do frameworks diff trees?
    options: ["To change only what changed in the real DOM", "To compress the HTML", "To validate the HTML", "To find bugs"]
    answer: 0
    explanation: "Touching the DOM is expensive and loses state like focus."
  - type: mcq
    question: Why are framework text children safe against XSS?
    options: ["They are escaped automatically", "They are cached", "They are encrypted", "Browsers block all scripts"]
    answer: 0
    explanation: "Special characters become entities, so injected tags are shown as text."
  - type: mcq
    question: What does a key on a list item help the framework do?
