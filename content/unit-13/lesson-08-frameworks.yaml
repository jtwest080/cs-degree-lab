  - type: code
    question: |
      Write `Badge({ label, count })` using the given `h` that returns `h("span", { class: "badge" }, label + ": " + count)`, but returns `null` when `count` is 0.
    starter: |
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      function Badge({ label, count }) {
      }
    tests:
      - name: badge
        code: |
          const b = Badge({ label: "Mail", count: 3 });
          if (b.tag !== "span" || b.props.class !== "badge" || b.children[0] !== "Mail: 3") throw new Error("Got " + JSON.stringify(b));
          if (Badge({ label: "x", count: 0 }) !== null) throw new Error("count 0 renders nothing");
    solution: |
      const h = (tag, props, ...children) => ({ tag, props: props ?? {}, children: children.flat() });
      function Badge({ label, count }) {
        if (count === 0) return null;
        return h("span", { class: "badge" }, label + ": " + count);
      }
