    question: Which status code means the client is logged in but not allowed?
    options: ["403", "401", "404", "500"]
    answer: 0
    explanation: "401 means unauthenticated; 403 means authenticated but forbidden."
  - type: mcq
    question: Which HTTP method should create a new resource and let the server choose its id?
    options: ["POST", "GET", "PUT", "HEAD"]
    answer: 0
    explanation: "POST to the collection creates; the server answers 201 Created."
  - type: mcq
    question: What does middleware do when it does not call next()?
    options: ["It ends the chain and answers itself", "The request is retried", "The server crashes", "The next handler still runs"]
    answer: 0
    explanation: "Not calling next stops the chain, as an auth check does for a rejected request."
  - type: mcq
    question: Why must a server validate input even if the web page already does?
    options: ["Anyone can send requests without using the page", "Browsers do not validate", "JavaScript cannot validate", "It is faster"]
    answer: 0
    explanation: "Client-side validation is a convenience only."
  - type: mcq
    question: What is the best defence against XSS?
    options: ["Escape untrusted text when writing HTML", "Use POST instead of GET", "Hide the URL", "Use bigger passwords"]
    answer: 0
    explanation: "Escaping stops injected markup from being parsed as HTML."
  - type: mcq
    question: What does the same-origin policy prevent?
    options: ["A page reading responses from another origin", "Servers talking to each other", "Users opening two tabs", "Images loading from other sites"]
    answer: 0
    explanation: "Browsers stop one site's scripts from reading another site's responses unless CORS allows it."
  - type: code
    question: |
      Write `statusFor(result)` returning the HTTP status for: `"created"` → 201, `"ok"` → 200, `"missing"` → 404, `"invalid"` → 400, `"unauthenticated"` → 401, `"forbidden"` → 403, anything else → 500.
    starter: |
      function statusFor(result) {
      }
    tests:
      - name: codes
        code: |
          const m = { created: 201, ok: 200, missing: 404, invalid: 400, unauthenticated: 401, forbidden: 403, boom: 500, "": 500 };
          for (const [k, v] of Object.entries(m)) if (statusFor(k) !== v) throw new Error(k + " should be " + v);
    solution: |
      function statusFor(result) {
        const codes = { created: 201, ok: 200, missing: 404, invalid: 400, unauthenticated: 401, forbidden: 403 };
        return Object.hasOwn(codes, result) ? codes[result] : 500;
      }
