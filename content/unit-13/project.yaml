title: Task Manager Page
language: html
brief: |-
  You are building a complete **task manager web page**: one HTML document with its own CSS and JavaScript, using everything from this unit: semantic HTML and accessible forms, CSS box model and layout, and a state-and-render JavaScript app. Run the page to try it in the preview; the checks click and type for you.

  **Structure** (ids and classes are used by the checks):

  - A `<main>` containing an `<h1>`, a form, filter buttons, the list and a footer line.
  - `form#add-form` with a labelled required `input#task-input`, a labelled `select#priority` with options `low`, `normal` (the default) and `high`, and a submit button.
  - `p#error` for messages, `ul#tasks` for the tasks, `span#remaining` for the counter and `button#clear-done`.
  - Three buttons with `data-filter` set to `all`, `active` and `done`.

  **Behaviour:**

  - Submitting the form adds a task (the text trimmed, at the end of the list) with the chosen priority and clears the input. Do not reload the page. A blank text adds nothing and shows `Please enter a task` in `#error`; a later valid add clears the message.
  - Each task is an `<li>` with the class `priority-low`, `priority-normal` or `priority-high`, containing a checkbox (with an `aria-label`), a `<span class="text">` with the text, and a `<button class="delete">` with the `aria-label` `Delete: ` followed by the text. Task text must be shown as text, never as HTML.
  - Ticking the checkbox marks the task done: the `<li>` gets the class `done`, its text is struck through, and unticking undoes it.
  - `#remaining` always says `N left`, where N is the number of tasks not done (whatever the filter).
  - The filter buttons show all tasks, only open tasks or only done tasks (filtered-out tasks are not in the list); the current filter button has the class `active`. New tasks respect the current filter.
  - `#clear-done` removes all done tasks. The delete button removes one task.

  **Styling:** remove the list bullets; `main` is centred and at most 600px wide; the form is a flex container with a `gap` of 8px; every `li` has a 4px left border, which is `#dc2626` for high priority and a different colour for low priority; use `box-sizing: border-box`.

  The page must not log any script errors.
steps:
- title: Write the HTML skeleton
  body: Start with the full document (Lesson 13.1), a `main`, the form with labels (Lesson 13.2) and empty `ul`/`p` elements with the required ids.
- title: Style it
  body: 'Set `box-sizing`, centre `main` with `max-width` and `margin: 0 auto`, make the form `display: flex; gap: 8px`, and style priority borders with classes (Lessons 13.3 and 13.4).'
- title: Keep state in data
  body: Create an array of task objects (`id`, `text`, `priority`, `done`) and a `filter` variable (Lesson 13.7).
- title: Write render()
  body: Build every `li` with `createElement` and `textContent` so the text is never read as HTML. Update the counter and the active filter button in the same function.
- title: Wire the events
  body: Use `submit` with `preventDefault` for adding, and delegation on the list for the checkbox and delete button (Lesson 13.7). Every handler changes the data and calls `render()`.
checklist:
- text: The page has the required structure and ids
  test: page structure
- text: Controls have labels and accessible names
  test: labels and accessible names
- text: Tasks can be added with a priority
  test: adding a task
- text: Blank tasks are rejected with a message
  test: empty tasks are rejected
- text: Tasks can be completed and reopened
  test: completing tasks
- text: Tasks can be deleted
  test: deleting tasks
- text: The filters work
  test: filters
- text: New tasks respect the current filter
  test: filters keep working for new tasks
- text: Completed tasks can be cleared
  test: clear completed
- text: Task text is escaped
  test: text is shown as text, not HTML
- text: The styling and layout rules are met
  test: styling
- text: There are no script errors
  test: no script errors
