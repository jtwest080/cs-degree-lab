tests:
- name: page structure
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    assert($("main") && $("h1"), "Use a main element and an h1");
    assert($("form#add-form"), "Add a form with id add-form");
    assert($("input#task-input"), "Add the input #task-input");
    assert($("select#priority"), "Add the select #priority");
    assert($$("#priority option").map((o) => o.value).join() === "low,normal,high", "The select needs options low, normal, high");
    assert($("#priority").value === "normal", "normal should be the default priority");
    assert($("ul#tasks"), "Add the list #tasks");
    assert($("#remaining"), "Add the counter #remaining");
    assert($("#clear-done"), "Add the button #clear-done");
    assert($$("[data-filter]").map((b) => b.dataset.filter).join() === "all,active,done", "Add three filter buttons with data-filter all, active, done");
- name: labels and accessible names
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    assert($("#task-input").labels.length >= 1, "Label the task input");
    assert($("#priority").labels.length >= 1, "Label the priority select");
    assert($("#task-input").required, "The input should be required");
    add("Buy milk");
    const del = $("#tasks li .delete"); assert(del, "Each task needs a .delete button");
    assert((del.getAttribute("aria-label") || "").includes("Buy milk"), "The delete button needs an aria-label that includes the task text, e.g. Delete: Buy milk");
    const box = $("#tasks li input[type=checkbox]"); assert(box, "Each task needs a checkbox");
    assert(box.labels.length >= 1 || box.getAttribute("aria-label"), "Label the checkbox");
- name: adding a task
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("Buy milk");
    assert(texts().join() === "Buy milk", "The task should appear. Got: " + texts().join());
    assert($("#task-input").value === "", "Clear the input after adding");
    assert($("#tasks li").classList.contains("priority-normal"), "A task gets the class priority-normal by default");
    assert($("#remaining").textContent.trim() === "1 left", "The counter should say 1 left, it says: " + $("#remaining").textContent);
    add("  Walk dog  ", "high");
    assert(texts().join("|") === "Buy milk|Walk dog", "Text is trimmed and added at the end. Got: " + texts().join("|"));
    assert($$("#tasks li")[1].classList.contains("priority-high"), "The second task is high priority");
    assert($("#remaining").textContent.trim() === "2 left", "Counter should be 2 left");
- name: empty tasks are rejected
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("   ");
    assert($$("#tasks li").length === 0, "A blank task must not be added");
    assert($("#error").textContent.trim() === "Please enter a task", "Show Please enter a task in #error, it shows: " + $("#error").textContent);
    add("Real task");
    assert($$("#tasks li").length === 1, "A real task is added");
    assert($("#error").textContent.trim() === "", "Clear the error after a valid add");
- name: completing tasks
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("One"); add("Two");
    const box = $$("#tasks li input[type=checkbox]")[0];
    box.click();
    assert($$("#tasks li")[0].classList.contains("done"), "A completed task gets the class done");
    assert(!$$("#tasks li")[1].classList.contains("done"), "Only the clicked task");
    assert($("#remaining").textContent.trim() === "1 left", "Counter should be 1 left");
    assert(css($$("#tasks li .text")[0], "text-decoration-line") === "line-through", "Completed text should be struck through");
    assert(css($$("#tasks li .text")[1], "text-decoration-line") === "none", "Open text is not struck through");
    $$("#tasks li input[type=checkbox]")[0].click();
    assert(!$$("#tasks li")[0].classList.contains("done"), "Clicking again reopens the task");
    assert($("#remaining").textContent.trim() === "2 left", "Counter back to 2 left");
- name: deleting tasks
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("A"); add("B"); add("C");
    $$("#tasks li .delete")[1].click();
    assert(texts().join() === "A,C", "B should be gone. Got: " + texts().join());
    assert($("#remaining").textContent.trim() === "2 left", "Counter should be 2 left");
    $$("#tasks li .delete")[0].click(); $$("#tasks li .delete")[0].click();
    assert($$("#tasks li").length === 0 && $("#remaining").textContent.trim() === "0 left", "Everything deleted, 0 left");
- name: filters
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("A"); add("B"); add("C");
    $$("#tasks li input[type=checkbox]")[1].click();
    click('[data-filter=active]');
    assert(texts().join() === "A,C", "Active shows open tasks only. Got: " + texts().join());
    assert($("[data-filter=active]").classList.contains("active") && !$("[data-filter=all]").classList.contains("active"), "Mark the current filter button with the class active");
    click('[data-filter=done]');
    assert(texts().join() === "B", "Done shows completed tasks only. Got: " + texts().join());
    click('[data-filter=all]');
    assert(texts().join() === "A,B,C", "All shows everything");
    assert($("[data-filter=all]").classList.contains("active"), "all is active again");
    assert($("#remaining").textContent.trim() === "2 left", "The counter counts open tasks whatever the filter");
- name: filters keep working for new tasks
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("A");
    click('[data-filter=done]');
    add("B");
    assert($$("#tasks li").length === 0, "A new open task must not show under the done filter");
    click('[data-filter=all]');
    assert(texts().join() === "A,B", "Both tasks exist");
- name: clear completed
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("A"); add("B"); add("C");
    $$("#tasks li input[type=checkbox]")[0].click(); $$("#tasks li input[type=checkbox]")[2].click();
    click("#clear-done");
    assert(texts().join() === "B", "Only open tasks remain. Got: " + texts().join());
    assert($("#remaining").textContent.trim() === "1 left", "1 left");
- name: text is shown as text, not HTML
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("<b>bold</b> & <img src=x onerror=alert(1)>");
    assert($$("#tasks li b").length === 0 && $$("#tasks li img").length === 0, "Do not insert user text as HTML");
    assert(texts()[0] === "<b>bold</b> & <img src=x onerror=alert(1)>", "The text should be shown exactly as typed");
- name: styling
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("Urgent", "high"); add("Later", "low"); add("Normal");
    const li = $$("#tasks li");
    assert(css(li[0], "border-left-color") === "rgb(220, 38, 38)" && css(li[0], "border-left-width") === "4px", "High priority tasks have a 4px left border in #dc2626");
    assert(css(li[1], "border-left-color") !== css(li[0], "border-left-color"), "Low priority has a different border colour");
    assert(css(li[0], "list-style-type") === "none", "Remove the list bullets");
    assert(css("#add-form", "display") === "flex", "The form should be a flex container");
    assert(css("#add-form", "column-gap") === "8px" || css("#add-form", "gap") === "8px", "Use a gap of 8px in the form");
    const w = $("main").getBoundingClientRect().width;
    assert(w <= 600 && w > 0, "main should be at most 600px wide, it is " + w);
    const m = $("main").getBoundingClientRect(); const room = innerWidth;
    assert(Math.abs(m.left - (room - m.right)) < 1, "main should be centred");
    assert(css("body", "box-sizing") === "border-box" || css("main", "box-sizing") === "border-box", "Use box-sizing: border-box");
- name: no script errors
  code: |
    const add = (text, prio) => {
      const input = $("#task-input"); input.value = text;
      if (prio) $("#priority").value = prio;
      fire("#add-form", "submit");
    };
    const texts = () => $$("#tasks li .text").map((e) => e.textContent);
    add("x"); $("#tasks li input[type=checkbox]").click(); click("#clear-done"); add("");
    assert(errors.length === 0, "The page logged errors: " + errors.join("; "));
solution: |
  <!doctype html>
  <html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f5f5f5; }
    main { max-width: 600px; margin: 0 auto; background: white; padding: 1.5rem; border-radius: 8px; }
    #add-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    #add-form label { display: flex; flex-direction: column; font-size: 0.9rem; }
    #add-form .grow { flex: 1; }
    #error { color: #b91c1c; min-height: 1.25rem; }
    .filters { display: flex; gap: 8px; margin: 1rem 0; }
    .filters button.active { background: #1e40af; color: white; }
    #tasks { list-style: none; padding: 0; margin: 0; }
    #tasks li { display: flex; align-items: center; gap: 8px; padding: 0.5rem; margin-bottom: 4px; border-left: 4px solid #9ca3af; background: #fafafa; }
    #tasks li .text { flex: 1; }
    #tasks li.done .text { text-decoration: line-through; color: #6b7280; }
    .priority-high { border-left-color: #dc2626 !important; }
    .priority-low { border-left-color: #16a34a !important; }
    .priority-normal { border-left-color: #9ca3af; }
  </style>
  </head>
  <body>
  <main>
    <h1>Task manager</h1>
    <form id="add-form">
      <label class="grow">Task <input id="task-input" required></label>
      <label>Priority
        <select id="priority">
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
        </select>
      </label>
      <button type="submit">Add</button>
    </form>
    <p id="error" role="alert"></p>
    <div class="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="done">Done</button>
    </div>
    <ul id="tasks"></ul>
    <p><span id="remaining">0 left</span> <button type="button" id="clear-done">Clear completed</button></p>
  </main>
  <script>
    const tasks = [];
    let nextId = 1;
    let filter = "all";
    const list = document.getElementById("tasks");

    function render() {
      const shown = tasks.filter((t) => filter === "all" || (filter === "done") === t.done);
      list.replaceChildren(...shown.map((t) => {
        const li = document.createElement("li");
        li.dataset.id = t.id;
        li.className = "priority-" + t.priority + (t.done ? " done" : "");
        const box = document.createElement("input");
        box.type = "checkbox"; box.checked = t.done;
        box.setAttribute("aria-label", "Done: " + t.text);
        const text = document.createElement("span");
        text.className = "text"; text.textContent = t.text;
        const del = document.createElement("button");
        del.type = "button"; del.className = "delete"; del.textContent = "\u00d7";
        del.setAttribute("aria-label", "Delete: " + t.text);
        li.append(box, text, del);
        return li;
      }));
      document.getElementById("remaining").textContent = tasks.filter((t) => !t.done).length + " left";
      for (const b of document.querySelectorAll("[data-filter]")) b.classList.toggle("active", b.dataset.filter === filter);
    }

    document.getElementById("add-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("task-input");
      const text = input.value.trim();
      const error = document.getElementById("error");
      if (!text) { error.textContent = "Please enter a task"; return; }
      error.textContent = "";
      tasks.push({ id: nextId++, text, priority: document.getElementById("priority").value, done: false });
      input.value = "";
      render();
    });

    list.addEventListener("click", (e) => {
      const li = e.target.closest("li");
      if (!li) return;
      const task = tasks.find((t) => t.id === Number(li.dataset.id));
      if (e.target.matches(".delete")) tasks.splice(tasks.indexOf(task), 1);
      else if (e.target.matches("input[type=checkbox]")) task.done = e.target.checked;
      else return;
      render();
    });

    document.querySelector(".filters").addEventListener("click", (e) => {
      const b = e.target.closest("[data-filter]");
      if (!b) return;
      filter = b.dataset.filter;
      render();
    });

    document.getElementById("clear-done").addEventListener("click", () => {
      for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i].done) tasks.splice(i, 1);
      render();
    });

    render();
  </script>
  </body>
  </html>
stretch:
- Save the tasks with `localStorage` (on a real site) and load them when the page opens.
- Add a due date input and sort tasks by date, using ISO date strings.
- Let a double click turn the text into an input so a task can be renamed.
- 'Add keyboard shortcuts: Delete removes the focused task, Enter in the text field adds it.'
- Add a dark theme with custom properties and a `prefers-color-scheme` media query.
