# Terms introduced in Unit 14 (Software Engineering). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Software engineering"
    definition: "The discipline of building, running and changing software that is large, shared and long-lived."
    lesson: u14-process
  - term: "Maintenance"
    definition: "Fixing, improving and adapting software after its first release, usually the largest cost."
    lesson: u14-process
  - term: "Software life cycle"
    definition: "The activities of requirements, design, implementation, verification, deployment and maintenance."
    lesson: u14-process
  - term: "Verification"
    definition: "Checking that software was built to its specification: did we build it right?"
    lesson: u14-process
  - term: "Validation"
    definition: "Checking that software meets the real need: did we build the right thing?"
    lesson: u14-process
  - term: "Waterfall"
    definition: "A process in which each phase finishes before the next starts."
    lesson: u14-process
  - term: "Agile"
    definition: "An approach that builds software in short cycles with frequent feedback and change."
    lesson: u14-process
  - term: "Scrum"
    definition: "An agile framework of fixed-length sprints, a backlog and regular meetings."
    lesson: u14-process
  - term: "Sprint"
    definition: "A fixed period, often one to four weeks, in which a team delivers a small working increment."
    lesson: u14-process
  - term: "Kanban"
    definition: "A method that limits work in progress on a board of columns such as To Do, Doing and Done."
    lesson: u14-process
  - term: "Retrospective"
    definition: "A team meeting about how to work better, held at the end of a sprint."
    lesson: u14-process
  - term: "Requirement"
    definition: "A statement of what a system must do or how well it must do it."
    lesson: u14-process
  - term: "Functional requirement"
    definition: "A requirement describing a behaviour the system must have."
    lesson: u14-process
  - term: "Non-functional requirement"
    definition: "A requirement about quality such as speed, security or accessibility."
    lesson: u14-process
  - term: "User story"
    definition: "A one-sentence requirement written as: as a role, I want a goal, so that a benefit."
    lesson: u14-process
  - term: "INVEST"
    definition: "A checklist for good stories: independent, negotiable, valuable, estimable, small, testable."
    lesson: u14-process
  - term: "Acceptance criteria"
    definition: "Concrete conditions that must hold for a story to count as done."
    lesson: u14-process
  - term: "Given-When-Then"
    definition: "A format for acceptance criteria describing a starting state, an action and an expected outcome."
    lesson: u14-process
  - term: "Definition of done"
    definition: "The shared checklist every piece of work must meet to be called finished."
    lesson: u14-process
  - term: "MoSCoW"
    definition: "A prioritisation scheme of Must, Should, Could and Won't have."
    lesson: u14-process
  - term: "Planning fallacy"
    definition: "The tendency to underestimate how long tasks will take."
    lesson: u14-process
  - term: "Story point"
    definition: "A relative measure of the size of a story, used instead of hours."
    lesson: u14-process
  - term: "Velocity"
    definition: "The number of story points a team completes per sprint."
    lesson: u14-process
  - term: "Burndown chart"
    definition: "A chart of work remaining over time compared with an ideal line."
    lesson: u14-process
  - term: "Scope creep"
    definition: "The growth of a project's requirements after work has started."
    lesson: u14-process
  - term: "Goodhart's law"
    definition: "When a measure becomes a target it stops being a good measure."
    lesson: u14-process
  - term: "Version control"
    definition: "A system that records changes to files over time so you can review and restore them."
    lesson: u14-git
  - term: "Git"
    definition: "A distributed version control system."
    lesson: u14-git
  - term: "Distributed version control"
    definition: "Version control in which every developer holds a full copy of the history."
    lesson: u14-git
  - term: "Repository"
    definition: "A project's files together with the full history of their changes."
    lesson: u14-git
  - term: "Blob"
    definition: "A Git object holding the contents of one file."
    lesson: u14-git
  - term: "Tree"
    definition: "A Git object listing file names and the objects they point to."
    lesson: u14-git
  - term: "Content addressing"
    definition: "Naming a stored object by a hash of its contents."
    lesson: u14-git
  - term: "Parent commit"
    definition: "The commit that came directly before another in history."
    lesson: u14-git
  - term: "Branch"
    definition: "A named pointer to a commit that moves forward as new commits are made."
    lesson: u14-git
  - term: "HEAD"
    definition: "The pointer to the branch or commit you are currently working on."
    lesson: u14-git
  - term: "Merge commit"
    definition: "A commit with two parents that joins two lines of history."
    lesson: u14-git
  - term: "Fast-forward"
    definition: "A merge that just moves a branch pointer ahead because no histories have diverged."
    lesson: u14-git
  - term: "Merge base"
    definition: "The closest common ancestor of two commits."
    lesson: u14-git
  - term: "Three-way merge"
    definition: "A merge that compares both sides with their merge base."
    lesson: u14-git
  - term: "Merge conflict"
    definition: "A change both sides made differently to the same place, which a person must resolve."
    lesson: u14-git
  - term: "Rebase"
    definition: "Replaying commits on top of another branch to make history linear, which rewrites them."
    lesson: u14-git
  - term: "Pull request"
    definition: "A request to review and merge a branch, usually on a hosting service."
    lesson: u14-git
  - term: ".gitignore"
    definition: "A file listing paths that Git should not track."
    lesson: u14-git
  - term: "Regression"
    definition: "A bug in behaviour that used to work."
    lesson: u14-testing
  - term: "Unit test"
    definition: "A fast automated test of one small piece of code in isolation."
    lesson: u14-testing
  - term: "Integration test"
    definition: "A test that checks several parts working together."
    lesson: u14-testing
  - term: "End-to-end test"
    definition: "A test that drives the whole system as a user would."
    lesson: u14-testing
  - term: "Testing pyramid"
    definition: "A guide to have many unit tests, fewer integration tests and very few end-to-end tests."
    lesson: u14-testing
  - term: "Arrange-Act-Assert"
    definition: "The pattern of setting up, running the code, then checking the result in a test."
    lesson: u14-testing
  - term: "Test framework"
    definition: "A tool that finds, runs and reports on tests."
    lesson: u14-testing
  - term: "Fixture"
    definition: "Shared set-up code that gives tests a known starting state."
    lesson: u14-testing
  - term: "Stub"
    definition: "A test double that returns fixed answers."
    lesson: u14-testing
  - term: "Fake"
    definition: "A simple working replacement for a dependency, such as an in-memory database."
    lesson: u14-testing
  - term: "Mock"
    definition: "A test double that records how it was used so the test can check the interaction."
    lesson: u14-testing
  - term: "Test-driven development"
    definition: "Writing a failing test first, then the code to pass it, then refactoring."
    lesson: u14-testing
  - term: "Code coverage"
    definition: "The share of code that runs during tests."
    lesson: u14-testing
  - term: "Property-based testing"
    definition: "Checking that rules hold over many generated inputs."
    lesson: u14-testing
  - term: "Flaky test"
    definition: "A test that sometimes passes and sometimes fails without any code change."
    lesson: u14-testing
  - term: "YAGNI"
    definition: "You Aren't Gonna Need It: do not build features for imagined future needs."
    lesson: u14-design
  - term: "Magic number"
    definition: "An unexplained literal value in code."
    lesson: u14-design
  - term: "Design pattern"
    definition: "A named, reusable solution to a common design problem."
    lesson: u14-patterns
  - term: "Strategy pattern"
    definition: "Making an algorithm swappable by passing in the behaviour."
    lesson: u14-patterns
  - term: "Observer pattern"
    definition: "Letting subscribers be notified when a subject's state changes or an event occurs."
    lesson: u14-patterns
  - term: "Factory pattern"
    definition: "Putting the decision of which class to create in one place."
    lesson: u14-patterns
  - term: "Singleton"
    definition: "A class limited to one instance, often criticised as disguised global state."
    lesson: u14-patterns
  - term: "Decorator pattern"
    definition: "Adding behaviour by wrapping an object or function with the same interface."
    lesson: u14-patterns
  - term: "Adapter pattern"
    definition: "A wrapper that makes an incompatible interface fit the one expected."
    lesson: u14-patterns
  - term: "Iterator pattern"
    definition: "A uniform way to walk the items of a collection."
    lesson: u14-patterns
  - term: "Software architecture"
    definition: "The high-level structure of a system: its parts and how they communicate."
    lesson: u14-architecture
  - term: "Quality attribute"
    definition: "A property such as performance, security or maintainability that a system must have."
    lesson: u14-architecture
  - term: "Modularity"
    definition: "Dividing a system into parts with clear jobs and small interfaces."
    lesson: u14-architecture
  - term: "Information hiding"
    definition: "Keeping the internals of a module private behind its interface."
    lesson: u14-architecture
  - term: "Layered architecture"
    definition: "Organising code in layers that depend only on the layer below."
    lesson: u14-architecture
  - term: "Dependency rule"
    definition: "The rule that dependencies point one way, toward lower or more central layers."
    lesson: u14-architecture
  - term: "Monolith"
    definition: "An application deployed as a single unit."
    lesson: u14-architecture
  - term: "Microservices"
    definition: "An architecture of many small independently deployed services."
    lesson: u14-architecture
  - term: "Event-driven architecture"
    definition: "A design in which components publish events and others react to them."
    lesson: u14-architecture
  - term: "Message queue"
    definition: "A buffer that lets producers add work for consumers to handle later."
    lesson: u14-architecture
  - term: "API versioning"
    definition: "Offering numbered versions of an API so old clients keep working."
    lesson: u14-architecture
  - term: "Backward compatibility"
    definition: "Keeping old callers working when something changes."
    lesson: u14-architecture
  - term: "Architecture decision record"
    definition: "A short note recording the context, decision and consequences of an architectural choice."
    lesson: u14-architecture
  - term: "Big ball of mud"
    definition: "A system with no clear structure where everything depends on everything."
    lesson: u14-architecture
  - term: "Bisecting"
    definition: "Repeatedly halving a range of versions to find which one introduced a bug."
    lesson: u14-reliability
  - term: "Stack trace"
    definition: "A listing of the function calls active when an error occurred."
    lesson: u14-reliability
  - term: "Log level"
    definition: "A severity label such as DEBUG, INFO, WARNING or ERROR on a log message."
    lesson: u14-reliability
  - term: "Structured logging"
    definition: "Writing log entries as key-value data that machines can search."
    lesson: u14-reliability
  - term: "Correlation id"
    definition: "An identifier attached to every log line of one request so it can be followed."
    lesson: u14-reliability
  - term: "Observability"
    definition: "How well you can understand a running system's behaviour from its outputs."
    lesson: u14-reliability
  - term: "Metric"
    definition: "A number measured over time, such as requests per second."
    lesson: u14-reliability
  - term: "Tracing"
    definition: "Following one request across the many services that handle it."
    lesson: u14-reliability
  - term: "Jitter"
    definition: "Random variation added to delays so clients do not retry in step."
    lesson: u14-reliability
  - term: "Idempotency key"
    definition: "A unique id for a request that lets a server ignore duplicates."
    lesson: u14-reliability
  - term: "Circuit breaker"
    definition: "A guard that stops calls to a failing service for a while and fails fast."
    lesson: u14-reliability
  - term: "Graceful degradation"
    definition: "Keeping the rest of a system useful when one part fails."
    lesson: u14-reliability
  - term: "Service level objective"
    definition: "A reliability target such as 99.9% of requests succeeding."
    lesson: u14-reliability
  - term: "Error budget"
    definition: "The amount of unreliability an objective allows, which funds risk-taking."
    lesson: u14-reliability
  - term: "Blameless post-mortem"
    definition: "A review of an incident that looks at the system, not at whom to blame."
    lesson: u14-reliability
  - term: "Code review"
    definition: "Having a teammate read a change before it is merged."
    lesson: u14-quality
  - term: "Linter"
    definition: "A tool that reads code without running it and flags likely mistakes."
    lesson: u14-quality
  - term: "Formatter"
    definition: "A tool that applies a consistent code style automatically."
    lesson: u14-quality
  - term: "Static analysis"
    definition: "Examining code for problems without running it."
    lesson: u14-quality
  - term: "Type checker"
    definition: "A tool that uses type hints to find mismatches before the code runs."
    lesson: u14-quality
  - term: "Cyclomatic complexity"
    definition: "A count of the independent paths through a function."
    lesson: u14-quality
  - term: "Continuous integration"
    definition: "Merging often and automatically building and testing every change."
    lesson: u14-quality
  - term: "Continuous delivery"
    definition: "Keeping software always ready to release at the push of a button."
    lesson: u14-quality
  - term: "Continuous deployment"
    definition: "Releasing every change that passes the pipeline automatically."
    lesson: u14-quality
  - term: "Pipeline"
    definition: "A sequence of automated stages such as build, test and deploy."
    lesson: u14-quality
  - term: "Blue-green deployment"
    definition: "Running two identical environments and switching traffic from old to new."
    lesson: u14-quality
  - term: "Canary release"
    definition: "Releasing a new version to a small share of users first."
    lesson: u14-quality
  - term: "Feature flag"
    definition: "A switch that turns a feature on or off without redeploying."
    lesson: u14-quality
  - term: "Technical debt"
    definition: "The extra future cost of changes caused by shortcuts or outdated design."
    lesson: u14-quality
  - term: "Boy scout rule"
    definition: "Leave the code a little cleaner than you found it."
    lesson: u14-quality
  - term: "Critical path"
    definition: "The longest chain of dependent tasks, which sets the shortest project duration."
    lesson: u14-teams
  - term: "Slack"
    definition: "The time a task can slip without delaying the project."
    lesson: u14-teams
  - term: "Precedence network"
    definition: "A graph of tasks and the dependencies between them."
    lesson: u14-teams
  - term: "PERT"
    definition: "A technique that estimates durations from optimistic, likely and pessimistic values."
    lesson: u14-teams
  - term: "Three-point estimate"
    definition: "An estimate made of an optimistic, most likely and pessimistic value."
    lesson: u14-teams
  - term: "Brooks's law"
    definition: "Adding people to a late software project makes it later."
    lesson: u14-teams
  - term: "Psychological safety"
    definition: "A team climate in which people can raise problems without fear of punishment."
    lesson: u14-teams
  - term: "Bus factor"
    definition: "The number of people whose loss would stop a project."
    lesson: u14-teams
  - term: "Pair programming"
    definition: "Two developers working together at one computer."
    lesson: u14-teams
  - term: "Software licence"
    definition: "The terms under which others may use, change and share software."
    lesson: u14-teams
  - term: "Permissive licence"
    definition: "A licence such as MIT that allows almost any use, including in closed products."
    lesson: u14-teams
  - term: "Copyleft"
    definition: "A licence that requires derived software to be shared under the same terms."
    lesson: u14-teams
  - term: "Open source"
    definition: "Software whose source code is available under a licence allowing use and modification."
    lesson: u14-teams
  - term: "Data minimisation"
    definition: "Collecting only the personal data that is needed."
    lesson: u14-teams
  - term: "GDPR"
    definition: "The European Union law governing the handling of personal data."
    lesson: u14-teams
  - term: "Algorithmic bias"
    definition: "Systematically unfair results caused by biased data or design."
    lesson: u14-teams
  - term: "Code of ethics"
    definition: "A professional body's statement of the responsibilities of its members."
    lesson: u14-teams
