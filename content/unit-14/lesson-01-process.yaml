id: u14-process
title: "What Software Engineering Is: Process and Requirements"
minutes: 55
objective: |
  Understand why building software with a team over years is a different job from writing a program alone, and learn the basic tools for deciding what to build: the software life cycle, waterfall versus agile, requirements, user stories, acceptance criteria, estimation, and measuring progress with velocity and burndown.
outcomes:
  - Explain how software engineering differs from programming and name the stages of the life cycle
  - Compare waterfall and agile approaches and say when each fits
  - Write functional and non-functional requirements, user stories and acceptance criteria
  - Prioritise work by value and effort
  - Compute velocity, forecast completion and a burndown from sprint data

sections:
  - heading: Programming versus engineering
    body: |
      Until now you have written programs that you alone understood, ran a few times, and finished. **Software engineering** is what changes when software is large, used by other people, built by a team, and has to keep working and changing for years. Surveys of real projects find that most of the cost of software is not writing it the first time but **maintaining** it: fixing bugs, adding features, adapting to new systems. Code is read far more often than it is written, usually by someone who does not remember (or never knew) why it was written that way. That person is often you in six months.

      So engineering is about managing things that do not matter in a 50-line script:
      - **Complexity.** No one can hold a million lines in their head, so we split systems into parts with clear interfaces (Lessons 14.4 to 14.6).
      - **Change.** Requirements change while you build. A design that cannot change is a liability.
      - **People.** Teams need shared understanding, shared tools and agreed ways of working (Lessons 14.2, 14.8 and 14.9).
      - **Quality and risk.** Bugs cost money, and in some software (aircraft, medical devices, banks) they cost lives. Testing, review and monitoring are how we gain confidence (Lessons 14.3, 14.7 and 14.8).

      The classic failures are instructive. A software error crashed the first Ariane 5 rocket 37 seconds after launch in 1996, when a number converted from 64-bit float to a 16-bit integer overflowed (Lesson 1.2's overflow, at a cost of about half a billion dollars). A flaw in the Therac-25 radiation machine killed patients. Healthcare.gov launched in 2013 and could not handle the traffic. Most large projects that fail do so not because the code is hard but because **nobody agreed what to build**, the scope kept growing, or problems were discovered too late.

  - heading: The software life cycle
    body: |
      Whatever the method, building software goes through the same activities:

      1. **Requirements**: find out what the users and the business need.
      2. **Design**: decide the structure: parts, interfaces, data, technology.
      3. **Implementation**: write the code.
      4. **Verification**: check it works (testing, review). *Verification* asks "did we build it right?" (does it meet the spec) and *validation* asks "did we build the right thing?" (does it meet the user's need).
      5. **Deployment**: put it into use.
      6. **Maintenance**: fix, improve and adapt, usually the longest and costliest phase.

      The methods differ in how they order and repeat these. In the **waterfall** model each phase finishes before the next starts, with documents handed over at each step. It is predictable and easy to manage when requirements are stable and well understood, and when mistakes are very expensive to fix after the fact (a bridge, a satellite). Its weakness is that you learn what is wrong only at the end, when changing it costs the most. The cost of fixing a defect grows steeply the later it is found.

      **Agile** methods (the 2001 Agile Manifesto: individuals and interactions, working software, customer collaboration, responding to change) run the whole cycle in short loops. Teams deliver a small working piece every one to four weeks, get feedback, and adjust. **Scrum** organises this into fixed-length **sprints**: a planning meeting chooses work from a prioritised **backlog**; the team meets briefly each day; at the end it demonstrates working software (a *review*) and discusses how to improve (a *retrospective*). **Kanban** instead limits the number of tasks in progress on a board with columns such as To Do, Doing, Done. Most modern teams are agile in some form, usually with the engineering practices of Lessons 14.3 and 14.8 (automated tests, continuous integration) underneath, because short cycles only work if releasing is cheap and safe.

  - heading: Requirements
    body: |
      A **requirement** says what a system must do or be. Two kinds:

      - **Functional requirements** are behaviours: "A student can enrol in a course", "The system emails a receipt".
      - **Non-functional requirements** (quality attributes) are how well: performance ("search results in under 300 ms for 95% of requests"), availability, security, usability, accessibility, privacy, maintainability. They are often the ones that decide the architecture, and the ones most often forgotten.

      Good requirements are **specific, testable and agreed**. "The system should be fast" cannot be checked; "95% of page loads finish in under 2 seconds on a 4G phone" can. Vague requirements are the main source of arguments at the end of a project.

      Agile teams write requirements as **user stories**: one sentence from the user's point of view, `As a <role>, I want <goal> so that <benefit>`, e.g. "As a student, I want to see my timetable so that I know where to go." The "so that" matters: it tells the team the real need, which may have a better solution than the one the requester imagined. Good stories are **INVEST**: Independent, Negotiable, Valuable, Estimable, Small, Testable.

      Each story gets **acceptance criteria**: concrete conditions that must hold for it to count as done, often written as **Given / When / Then** scenarios: *Given* I am logged in as a student with two enrolments, *When* I open my timetable, *Then* I see both classes in time order. These are the seed of automated tests (Lesson 14.3) and settle the "is it finished?" argument. A shared **definition of done** (code reviewed, tests pass, documented, deployed) applies to every story.

  - heading: Prioritising and estimating
    body: |
      There is never enough time to build everything, so teams **prioritise**. A simple method scores each item's **value** (what it is worth to users or the business) against its **effort** and works on the highest value-for-effort first. **MoSCoW** sorts items into *Must have*, *Should have*, *Could have* and *Won't have this time*, which is a useful way to negotiate a fixed deadline: the musts are protected, the coulds are what you drop when you run late.

      Estimating is hard: people are consistently optimistic (the **planning fallacy**), and the unexpected always happens. Agile teams estimate in **story points**, a relative size (1, 2, 3, 5, 8, 13: roughly Fibonacci, because bigger items are less certain) rather than hours, comparing each story to ones they have already done. A team's **velocity** is the number of points it actually completes per sprint, measured from experience. From the velocity and the remaining backlog you can **forecast**: `remaining points / velocity`, rounded up, is the number of sprints left, and with an average of the last few sprints it is a more honest estimate than any plan made in advance. Report a range, not a single date.

      A **burndown chart** plots the points remaining against time; the **ideal** line falls evenly to zero and the actual line shows whether you are ahead or behind. A line that goes up means work was added (scope creep) or found (it is not a failure to be honest about this). Remember the warning known as Goodhart's law: when a measure becomes a target it stops being a good measure. Velocity is for planning, not for judging people, because teams will inflate points to look fast.

examples:
  - title: Parsing a user story
    intro: "A user story has a fixed shape, so a program can pick it apart. Regular expressions (Unit 2) do the work."
    code: |
      import re

      PATTERN = re.compile(r"^As an? (?P<role>.+?), I want (?P<goal>.+?) so that (?P<benefit>.+?)\.?$")

      def parse_story(text):
          m = PATTERN.match(text.strip())
          if not m:
              raise ValueError("not a user story: " + text)
          return m.groupdict()

      story = "As a student, I want to see my timetable so that I know where to go."
      print(parse_story(story))
      try:
          parse_story("Make the site faster")
      except ValueError as e:
          print("error:", e)
    output: |
      {'role': 'student', 'goal': 'to see my timetable', 'benefit': 'I know where to go'}
      error: not a user story: Make the site faster
    lines:
      - line: 3
        note: "Named groups capture the role, the goal and the benefit. The lazy .+? stops at the first ', I want' or ' so that'."
      - line: 8
        note: "A requirement that is not in the story shape is rejected instead of silently accepted."
  - title: Prioritising by value over effort
    intro: "Rank the backlog by value per point of effort. Ties keep the order they were written in, so the list is deterministic."
    code: |
      backlog = [
          {"name": "Login", "value": 8, "effort": 3},
          {"name": "Dark mode", "value": 2, "effort": 2},
          {"name": "Search", "value": 9, "effort": 5},
          {"name": "Export CSV", "value": 3, "effort": 1},
          {"name": "Profile photo", "value": 2, "effort": 2},
      ]
      ranked = sorted(backlog, key=lambda item: -item["value"] / item["effort"])
      for i, item in enumerate(ranked, 1):
          print(i, item["name"], round(item["value"] / item["effort"], 2))
    output: |
      1 Export CSV 3.0
      2 Login 2.67
      3 Search 1.8
      4 Dark mode 1.0
      5 Profile photo 1.0
    lines:
      - line: 8
        note: "The negative sign sorts the highest ratio first. Python's sort is stable, so Dark mode stays before Profile photo."
  - title: Velocity and forecast
    intro: "Use the last three sprints to forecast how many more sprints a backlog needs."
    code: |
      import math

      completed = [18, 23, 20, 25, 22]          # points done in each past sprint
      velocity = sum(completed[-3:]) / 3
      remaining = 140
      print("velocity:", round(velocity, 1))
      print("sprints needed:", math.ceil(remaining / velocity))

      slowest, fastest = min(completed), max(completed)
      print("range:", math.ceil(remaining / fastest), "to", math.ceil(remaining / slowest), "sprints")
    output: |
      velocity: 22.3
      sprints needed: 7
      range: 6 to 8 sprints
    lines:
      - line: 4
        note: "Average of the last three sprints, a recent and honest estimate."
      - line: 9
        note: "A range from best to worst case is more truthful than one number."
  - title: A burndown
    intro: "Remaining work after each day, next to the ideal straight line. A rise means scope was added."
    code: |
      total = 40
      done = [0, 5, 4, 0, 6, -8, 7, 9, 8]          # points finished each day; -8 means 8 points were added
      remaining, ideal = [total], [total]
      days = len(done)
      for i, d in enumerate(done, 1):
          remaining.append(remaining[-1] - d)
          ideal.append(round(total - total * i / days, 1))
      print("actual:", remaining)
      print("ideal: ", ideal)
      print("behind on day 5:", remaining[5] > ideal[5])
    output: |
      actual: [40, 40, 35, 31, 31, 25, 33, 26, 17, 9]
      ideal:  [40, 35.6, 31.1, 26.7, 22.2, 17.8, 13.3, 8.9, 4.4, 0.0]
      behind on day 5: True
    lines:
      - line: 2
        note: "A negative number models work added during the sprint."
      - line: 9
        note: "The ideal line falls by the same amount every day."
  - title: Acceptance criteria as a test
    intro: "A Given / When / Then scenario turned into a check. This is the idea behind tools such as Cucumber."
    code: |
      def timetable(enrolments):
          return sorted(enrolments, key=lambda e: e["start"])

      def scenario():
          # Given a student with two enrolments
          enrolments = [{"course": "SQL", "start": 11}, {"course": "Python", "start": 9}]
          # When they open the timetable
          result = timetable(enrolments)
          # Then both classes are shown in time order
          assert [e["course"] for e in result] == ["Python", "SQL"]
          return "scenario passed"

      print(scenario())
    output: |
      scenario passed
    lines:
      - line: 5
        note: "Given sets up the starting state."
      - line: 8
        note: "When performs the action under test."
      - line: 10
        note: "Then checks the outcome. Writing it first is the first step towards test-driven development."

playground:
  prompt: |
    Add your own five-item backlog. Score each item's value and effort from 1 to 10, rank it, and then change one score and watch the ranking change. Which item is always at the bottom?
  code: |
    backlog = [("Login", 8, 3), ("Search", 9, 5)]
    for name, value, effort in sorted(backlog, key=lambda b: -b[1] / b[2]):
        print(name, round(value / effort, 2))

exercises:
  - id: parse-story
    title: Parse a user story
    difficulty: 2
    prompt: |
      Write `parse_story(text)` that takes a story such as `"As a teacher, I want to mark work so that students get feedback."` and returns a dictionary with the keys `role`, `goal` and `benefit` (`"teacher"`, `"to mark work"`, `"students get feedback"`, without the final full stop). Accept `"As an ..."` too and ignore spaces at the ends. Raise `ValueError` if the text does not have all three parts.
    starter: |
      def parse_story(text):
          pass
    tests:
      - name: valid stories
        code: |
          r = parse_story("As a teacher, I want to mark work so that students get feedback.")
          assert r == {"role": "teacher", "goal": "to mark work", "benefit": "students get feedback"}, r
          r = parse_story("  As an admin, I want to ban a user so that spam stops  ")
          assert r == {"role": "admin", "goal": "to ban a user", "benefit": "spam stops"}, r
      - name: invalid stories
        code: |
          for bad in ["Make it faster", "As a user, I want a thing", "I want a thing so that it works", "As a , I want x so that y", ""]:
              try:
                  parse_story(bad)
                  assert False, repr(bad) + " should be rejected"
              except ValueError:
                  pass
    hints:
      - "A regular expression with three named groups does it: `As an? (?P<role>.+?), I want (?P<goal>.+?) so that (?P<benefit>.+?)\\.?$`."
      - "Use `re.match` after `strip()`. If it returns `None`, raise `ValueError`."
      - "The role group must not be empty, so use `.+?` rather than `.*?`."
    solution: |
      import re

      _PATTERN = re.compile(r"^As an? (?P<role>.+?), I want (?P<goal>.+?) so that (?P<benefit>.+?)\.?$")


      def parse_story(text):
          m = _PATTERN.match(text.strip())
          if not m:
              raise ValueError("not a user story")
          return m.groupdict()
    explanation: "Named groups give the three parts directly. The pattern insists on all three, which is the whole point of the story format."
  - id: velocity-forecast
    title: Forecast the sprints left
    difficulty: 2
    prompt: |
      Write `forecast(completed, remaining, window=3)`. `completed` is a list of points finished in past sprints. The velocity is the average of the last `window` sprints (or all of them if there are fewer). Return a tuple `(velocity, sprints_left)` where `sprints_left` is `remaining / velocity` rounded **up** to a whole number, and 0 if `remaining <= 0`. Raise `ValueError` if `completed` is empty or the velocity is 0.
    starter: |
      def forecast(completed, remaining, window=3):
          pass
    tests:
      - name: forecasts
        code: |
          assert forecast([18, 23, 20, 25, 22], 140) == (22.333333333333332, 7)
          assert forecast([10, 10], 35) == (10.0, 4)
          assert forecast([10], 10) == (10.0, 1)
          assert forecast([5, 10, 15, 20], 60, window=2) == (17.5, 4)
      - name: nothing left and errors
        code: |
          assert forecast([10, 10], 0) == (10.0, 0)
          assert forecast([10, 10], -5) == (10.0, 0)
          for bad in ([], [0, 0, 0]):
              try:
                  forecast(bad, 10)
                  assert False, "should raise"
              except ValueError:
                  pass
    hints:
      - "`recent = completed[-window:]` gives the last few sprints."
      - "`math.ceil(remaining / velocity)` rounds up."
    solution: |
      import math


      def forecast(completed, remaining, window=3):
          if not completed:
              raise ValueError("no sprint data")
          recent = completed[-window:]
          velocity = sum(recent) / len(recent)
          if velocity == 0:
              raise ValueError("velocity is zero")
          if remaining <= 0:
              return velocity, 0
          return velocity, math.ceil(remaining / velocity)
    explanation: "A slice with a negative start takes the last few items and works even when there are fewer than the window."
  - id: burndown
    title: Build a burndown
    difficulty: 3
    prompt: |
      Write `burndown(total, done_per_day)` returning a tuple `(actual, ideal)`. `actual` starts with `total` and subtracts each day's points (a negative number adds work). `ideal` starts with `total` and falls by an equal amount each day, ending at 0, each value rounded to 1 decimal place. Both lists have `len(done_per_day) + 1` items. Add a function `days_behind(actual, ideal)` returning how many of the days (after the start) have `actual` strictly greater than `ideal`.
    starter: |
      def burndown(total, done_per_day):
          pass


      def days_behind(actual, ideal):
          pass
    tests:
      - name: lists
        code: |
          a, i = burndown(40, [0, 5, 4, 0, 6, -8, 7, 9, 8])
          assert a == [40, 40, 35, 31, 31, 25, 33, 26, 17, 9], a
          assert i == [40, 35.6, 31.1, 26.7, 22.2, 17.8, 13.3, 8.9, 4.4, 0.0], i
      - name: other sizes
        code: |
          a, i = burndown(10, [5, 5])
          assert a == [10, 5, 0] and i == [10, 5.0, 0.0], (a, i)
          a, i = burndown(3, [])
          assert a == [3] and i == [3], (a, i)
      - name: days behind
        code: |
          a, i = burndown(40, [0, 5, 4, 0, 6, -8, 7, 9, 8])
          assert days_behind(a, i) == 9, days_behind(a, i)
          a, i = burndown(10, [5, 5])
          assert days_behind(a, i) == 0
    hints:
      - "`ideal` at day `k` is `round(total - total * k / days, 1)`."
      - "For no days, return `[total]` for both lists."
      - "`days_behind` compares `actual[k] > ideal[k]` for `k` from 1."
    solution: |
      def burndown(total, done_per_day):
          days = len(done_per_day)
          actual = [total]
          for d in done_per_day:
              actual.append(actual[-1] - d)
          ideal = [total] + [round(total - total * k / days, 1) for k in range(1, days + 1)]
          return actual, ideal


      def days_behind(actual, ideal):
          return sum(1 for a, i in zip(actual[1:], ideal[1:]) if a > i)
    explanation: "Two parallel lists make the comparison simple. Rounding the ideal avoids showing long decimals."
  - id: moscow
    title: Plan with MoSCoW
    difficulty: 3
    prompt: |
      Write `plan(items, capacity)` where `items` is a list of `(name, category, points)` and `category` is `"must"`, `"should"`, `"could"` or `"wont"`. Take items in category order (must, then should, then could; never wont), keeping each category's original order, and add an item to the plan only if it **fits** in the remaining capacity (skip one that does not, but continue with later ones). Return `(plan_names, skipped_musts)`: the names chosen, and the names of must items that did **not** fit.
    starter: |
      def plan(items, capacity):
          pass
    tests:
      - name: fits in order
        code: |
          items = [("a", "could", 2), ("b", "must", 3), ("c", "should", 4), ("d", "wont", 1), ("e", "must", 2)]
          assert plan(items, 20) == (["b", "e", "c", "a"], [])
          assert plan(items, 5) == (["b", "e"], [])
          assert plan(items, 6) == (["b", "e"], [])
      - name: skipping
        code: |
          items = [("m1", "must", 8), ("m2", "must", 5), ("s1", "should", 1), ("c1", "could", 2)]
          assert plan(items, 6) == (["m2", "s1"], ["m1"])
          assert plan(items, 0) == ([], ["m1", "m2"])
    hints:
      - "Loop over the categories in order and the items in each with a nested loop (or sort by category rank; Python's sort is stable)."
      - "Track `left = capacity` and subtract points as you add."
    solution: |
      def plan(items, capacity):
          chosen, skipped = [], []
          left = capacity
          for category in ("must", "should", "could"):
              for name, cat, points in items:
                  if cat != category:
                      continue
                  if points <= left:
                      chosen.append(name)
                      left -= points
                  elif category == "must":
                      skipped.append(name)
          return chosen, skipped
    explanation: "Protecting the musts first, then filling with what fits, is how a fixed deadline is negotiated."

commonMistakes:
  - title: "Vague requirements"
    explanation: "'Fast' and 'user friendly' cannot be tested. State a measurable number or an observable behaviour."
    wrong: |
      The search must be fast.
    right: |
      95% of searches return within 300 ms with 10,000 products.
  - title: "Estimating in hours and treating them as promises"
    explanation: "People are optimistic. Use relative points, measured velocity and a range."
  - title: "Using velocity to compare teams or judge people"
    explanation: "It is a planning tool for one team. Used as a target it will be inflated and become meaningless."
  - title: "Skipping non-functional requirements"
    explanation: "Performance, security and accessibility are expensive to add at the end. Ask about them at the start."

summary:
  - "Software engineering is about complexity, change, people and quality across a software's whole life, and maintenance is usually the biggest cost."
  - "The life cycle is requirements, design, implementation, verification, deployment and maintenance; waterfall does them in order, agile in short loops."
  - "Requirements are functional or non-functional and must be specific and testable; user stories with Given/When/Then criteria make them concrete."
  - "Prioritise by value against effort (or MoSCoW); estimate in relative points; forecast with measured velocity as a range."
  - "A burndown shows remaining work against the ideal; measures guide planning but become useless when turned into targets."
