quiz:
  - type: mcq
    question: Which phase of a software system's life usually costs the most?
    options: ["Maintenance", "Requirements", "Coding", "Design"]
    answer: 0
    explanation: "Systems live for years after the first release, being fixed and changed."
  - type: mcq
    question: What is the difference between verification and validation?
    options: [
      "Verification asks whether we built it right; validation asks whether we built the right thing",
      "They are the same",
      "Verification is testing in production; validation is code review",
      "Validation is done by programmers only"
    ]
    answer: 0
    explanation: "Verification checks against the specification, validation against the real need."
  - type: mcq
    question: Which is a non-functional requirement?
    options: [
      "95% of pages load in under 2 seconds",
      "A user can reset a password",
      "The system sends a receipt",
      "A teacher can mark work"
    ]
    answer: 0
    explanation: "It describes how well the system performs, not a behaviour."
  - type: mcq
    question: What do the three parts of a user story give the team?
    options: [
      "The user, the goal and the reason for it",
      "The cost, the deadline and the owner",
      "The design, the code and the test",
      "The server, the client and the database"
    ]
    answer: 0
    explanation: "As a role, I want a goal, so that a benefit."
  - type: mcq
    question: A team's last three sprints completed 20, 25 and 15 points. 120 points remain. How many sprints does the forecast say?
    options: ["6", "5", "7", "4"]
    answer: 0
    explanation: "Velocity is 20, and 120 / 20 = 6."
  - type: mcq
    question: What does a rise in a burndown line usually mean?
    options: ["Work was added or discovered", "The team stopped working", "The chart is wrong", "The sprint is finished"]
    answer: 0
    explanation: "Remaining work grew because scope increased or was understood better."
  - type: code
    question: |
      Write `scope_creep(points_per_day, total)` returning how many points were **added** during a sprint: the sum of the negative numbers in `points_per_day` (a negative value means points were added), as a positive number. The `total` argument is not needed for this but must be accepted.
    starter: |
      def scope_creep(points_per_day, total):
          pass
    tests:
      - name: sums negatives
        code: |
          assert scope_creep([0, 5, 4, 0, 6, -8, 7, 9, 8], 40) == 8
          assert scope_creep([3, -2, -3], 10) == 5
          assert scope_creep([], 10) == 0
          assert scope_creep([1, 2], 3) == 0
    solution: |
      def scope_creep(points_per_day, total):
          return -sum(p for p in points_per_day if p < 0)
