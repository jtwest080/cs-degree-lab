id: u14-git
title: "Version Control: How Git Works"
minutes: 60
objective: |
  Understand version control from the inside by building a tiny Git: content-addressed objects, commits that form a graph, branches as movable labels, and a three-way merge. Knowing the model makes every Git command predictable.
outcomes:
  - Explain why teams use version control and what a commit, branch and merge are
  - Describe how Git stores snapshots as content-addressed objects using hashes
  - Walk a commit graph to find history and common ancestors
  - Perform a three-way merge and recognise a conflict
  - Choose sensible branching and commit habits

sections:
  - heading: Why version control
    body: |
      **Version control** records every change to a set of files, who made it and why, so you can go back, compare, and work in parallel. Without it, teams email files named `final_v3_REAL.docx` and overwrite each other's work. With it you get a **history** you can search (`who changed this line and why?`), safe experiments on **branches**, and a way to **merge** the work of many people. **Git** is the dominant system. It is **distributed**: every developer holds the full history, so you can commit offline and there is no single point of failure. Services such as GitHub add a shared copy, pull requests and review on top.

  - heading: Snapshots and hashes
    body: |
      Git stores **snapshots**, not differences. A **blob** holds one file's contents, a **tree** lists file names with the blob (or sub-tree) each points to, and a **commit** points to a tree plus its **parent** commit(s), an author and a message. Each object is stored under its **hash**, a fingerprint computed from its contents (Git uses SHA-1, moving to SHA-256; Unit 11 covered hashing). This is **content addressing**: identical content always has the same name, so Git stores it once, and changing even one byte gives a completely different hash. Because a commit's hash includes its parent's hash, history is tamper-evident: altering an old commit changes every hash after it.

      Commits form a **directed acyclic graph** (Unit 7): each points back to its parent, and a merge commit has two parents. A **branch** is just a named pointer to a commit, and `HEAD` points at the branch you are on. Making a commit moves that pointer forward. This is why branches are so cheap: creating one writes 41 bytes.

  - heading: Branching and merging
    body: |
      A feature branch lets you work without disturbing `main`. When it is ready you **merge** it back. If `main` has not moved, Git just slides the pointer forward (a **fast-forward**). If both sides changed, Git does a **three-way merge**: it finds the **merge base** (the latest common ancestor of the two commits) and compares each side with it. For each file (or line): if only one side changed it, take that change; if both changed it identically, take it; if both changed it differently, that is a **conflict** and a human must choose. Comparing against the base is what lets Git tell "I changed it" from "they changed it", which a plain two-way comparison cannot.

      **Rebase** replays your commits on top of another branch for a straight history, rewriting them (so never rebase commits others have pulled). `git pull` is fetch plus merge. A **pull request** asks for your branch to be reviewed and merged.

  - heading: Good habits
    body: |
      - **Commit small and often**, each commit one logical change that builds and passes tests, with a message saying *why*: a short summary line, a blank line, then details.
      - **Branch per task**, keep branches short-lived, and merge to `main` often; long-lived branches make painful merges.
      - **Never commit secrets** (keys, passwords) or generated files; use `.gitignore`. Anything pushed should be treated as public forever.
      - **Review before merging**; protect `main` so changes arrive by reviewed pull request with passing checks.
      - Pull before you push, and read `git status` and `git diff` before committing.

examples:
  - title: Content-addressed storage
    intro: "A tiny object store: the key is the hash of the content, so equal content is stored once."
    code: |
      import hashlib

      store = {}

      def put(content):
          key = hashlib.sha1(content.encode()).hexdigest()[:7]
          store[key] = content
          return key

      a = put("hello")
      b = put("hello")
      c = put("hellp")
      print(a, b, c)
      print(a == b, a == c, len(store))
    output: |
      aaf4c61 aaf4c61 d4baaad
      True False 2
    lines:
      - line: 6
        note: "The name of the object is derived from its content."
      - line: 12
        note: "Same content, same key, stored once. One changed letter gives a different key."
  - title: Commits and branches
    intro: "A commit is a message and a parent; a branch is a name pointing at a commit."
    code: |
      commits = {}
      branches = {}
      head = "main"

      def commit(msg, parent=None):
          cid = "c" + str(len(commits) + 1)
          commits[cid] = {"msg": msg, "parents": [parent] if parent else []}
          return cid

      branches["main"] = commit("start")
      branches["main"] = commit("add login", branches["main"])
      branches["feature"] = branches["main"]
      branches["feature"] = commit("add search", branches["feature"])
      branches["main"] = commit("fix typo", branches["main"])

      def log(cid):
          out = []
          while cid:
              out.append(commits[cid]["msg"])
              parents = commits[cid]["parents"]
              cid = parents[0] if parents else None
          return out

      print("main:   ", log(branches["main"]))
      print("feature:", log(branches["feature"]))
    output: |
      main:    ['fix typo', 'add login', 'start']
      feature: ['add search', 'add login', 'start']
    lines:
      - line: 13
        note: "Creating a branch copies a pointer, nothing else."
      - line: 16
        note: "Committing moves only the current branch's pointer."
      - line: 23
        note: "Log follows parent links back to the root."
  - title: Finding the merge base
    intro: "The merge base is the nearest commit reachable from both branches. Collect one side's ancestors, then walk the other."
    code: |
      parents = {"c1": [], "c2": ["c1"], "c3": ["c2"], "c4": ["c2"], "c5": ["c4"]}

      def ancestors(c):
          seen = set()
          stack = [c]
          while stack:
              x = stack.pop()
              if x not in seen:
                  seen.add(x)
                  stack.extend(parents[x])
          return seen

      def merge_base(a, b):
          common = ancestors(a) & ancestors(b)
          return max(common, key=lambda c: int(c[1:]))     # newest id wins in this tiny history

      print(sorted(ancestors("c3")))
      print(merge_base("c3", "c5"))
    output: |
      ['c1', 'c2', 'c3']
      c2
    lines:
      - line: 3
        note: "Depth-first walk of the parent links (a graph traversal from Unit 7)."
      - line: 14
        note: "Common ancestors of both tips. Here the highest number is the most recent."
  - title: Three-way merge of one file
    intro: "Each side is compared with the base. A conflict only arises when both sides changed the same thing differently."
    code: |
      def merge3(base, ours, theirs):
          if ours == theirs:
              return ours
          if ours == base:
              return theirs
          if theirs == base:
              return ours
          return "<<<<<<< ours\n" + ours + "\n=======\n" + theirs + "\n>>>>>>> theirs"

      print(merge3("v1", "v1", "v2"))
      print(merge3("v1", "v2", "v1"))
      print(merge3("v1", "v2", "v2"))
      print(merge3("v1", "v2", "v3"))
    output: |
      v2
      v2
      v2
      <<<<<<< ours
      v2
      =======
      v3
      >>>>>>> theirs
    lines:
      - line: 4
        note: "We did not change it, so take theirs."
      - line: 8
        note: "Both changed it differently: write conflict markers for a human to resolve."

playground:
  prompt: |
    Change the three versions in `merge3` to create your own conflict-free and conflicting cases. Which combinations never conflict?
  code: |
    def merge3(base, ours, theirs):
        if ours == theirs or theirs == base:
            return ours
        if ours == base:
            return theirs
        return "CONFLICT"

    print(merge3("a", "b", "a"))

exercises:
  - id: object-store
    title: A content-addressed store
    difficulty: 2
    prompt: |
      Write a class `ObjectStore` with `put(content)` that stores a string under the first 8 hex characters of its SHA-1 hash (`hashlib.sha1(content.encode()).hexdigest()[:8]`) and returns that key, `get(key)` that returns the content (raising `KeyError` if missing), and `__len__` giving the number of stored objects.
    starter: |
      import hashlib

      class ObjectStore:
          pass
    tests:
      - name: store and fetch
        code: |
          s = ObjectStore()
          k = s.put("hello")
          assert k == "aaf4c61d", k
          assert s.get(k) == "hello"
          assert s.put("hello") == k and len(s) == 1
          k2 = s.put("hellp")
          assert k2 != k and len(s) == 2
      - name: missing key
        code: |
          s = ObjectStore()
          try:
              s.get("nope")
              assert False
          except KeyError:
              pass
    hints:
      - "Keep a dictionary in `__init__`."
      - "`hashlib.sha1(content.encode()).hexdigest()[:8]` is the key."
    solution: |
      import hashlib


      class ObjectStore:
          def __init__(self):
              self._objects = {}

          def put(self, content):
              key = hashlib.sha1(content.encode()).hexdigest()[:8]
              self._objects[key] = content
              return key

          def get(self, key):
              return self._objects[key]

          def __len__(self):
              return len(self._objects)
    explanation: "The key comes from the content, so duplicate content collapses into one entry."
  - id: commit-log
    title: Walk the history
    difficulty: 2
    prompt: |
      `parents` is a dictionary from commit id to a list of parent ids (empty for the first commit; two for a merge). Write `history(parents, tip)` returning the list of every commit reachable from `tip` (including `tip`) ordered by id as a sorted list of strings.
    starter: |
      def history(parents, tip):
          pass
    tests:
      - name: linear and merge
        code: |
          p = {"a": [], "b": ["a"], "c": ["b"], "d": ["b"], "e": ["c", "d"]}
          assert history(p, "c") == ["a", "b", "c"]
          assert history(p, "e") == ["a", "b", "c", "d", "e"]
          assert history(p, "a") == ["a"]
    hints:
      - "Use a stack and a `seen` set, as in the lesson."
    solution: |
      def history(parents, tip):
          seen = set()
          stack = [tip]
          while stack:
              c = stack.pop()
              if c not in seen:
                  seen.add(c)
                  stack.extend(parents[c])
          return sorted(seen)
    explanation: "A merge commit has two parents, so the walk must follow all of them and avoid visiting a commit twice."
  - id: merge-base
    title: Find the merge base
    difficulty: 3
    prompt: |
      Write `merge_base(parents, a, b)` returning the common ancestor of `a` and `b` (a commit counts as its own ancestor) that is **closest**: a common ancestor that is not an ancestor of any other common ancestor. Assume there is exactly one such. Return it as a string.
    starter: |
      def merge_base(parents, a, b):
          pass
    tests:
      - name: bases
        code: |
          p = {"1": [], "2": ["1"], "3": ["2"], "4": ["2"], "5": ["4"]}
          assert merge_base(p, "3", "5") == "2"
          assert merge_base(p, "3", "2") == "2"
          assert merge_base(p, "5", "5") == "5"
          assert merge_base(p, "1", "5") == "1"
    hints:
      - "Compute the set of ancestors of each, intersect them, then drop any that is an ancestor of another member."
    solution: |
      def merge_base(parents, a, b):
          def anc(c):
              seen, stack = set(), [c]
              while stack:
                  x = stack.pop()
                  if x not in seen:
                      seen.add(x)
                      stack.extend(parents[x])
              return seen

          common = anc(a) & anc(b)
          for c in common:
              if all(c == o or c not in anc(o) for o in common):
                  return c
    explanation: "The best common ancestor is the one no other common ancestor descends from."
  - id: merge-files
    title: Three-way merge of lines
    difficulty: 4
    prompt: |
      Write `merge_lines(base, ours, theirs)` taking three lists of strings **of the same length** (one entry per line). For each position apply the three-way rule. Return `(merged, conflicts)` where `merged` is the list of resulting lines (for a conflicting position, use the string `"<CONFLICT>"`) and `conflicts` is the list of conflicting indexes.
    starter: |
      def merge_lines(base, ours, theirs):
          pass
    tests:
      - name: merges
        code: |
          base   = ["a", "b", "c", "d"]
          ours   = ["a", "B", "c", "d"]
          theirs = ["a", "b", "C", "d"]
          assert merge_lines(base, ours, theirs) == (["a", "B", "C", "d"], [])
      - name: conflicts
        code: |
          m, c = merge_lines(["x", "y"], ["x", "1"], ["x", "2"])
          assert m == ["x", "<CONFLICT>"] and c == [1], (m, c)
          m, c = merge_lines(["x", "y"], ["z", "y"], ["z", "q"])
          assert m == ["z", "q"] and c == [], (m, c)
    hints:
      - "Apply the `merge3` logic to each position with `zip`."
    solution: |
      def merge_lines(base, ours, theirs):
          merged, conflicts = [], []
          for i, (b, o, t) in enumerate(zip(base, ours, theirs)):
              if o == t:
                  merged.append(o)
              elif o == b:
                  merged.append(t)
              elif t == b:
                  merged.append(o)
              else:
                  merged.append("<CONFLICT>")
                  conflicts.append(i)
          return merged, conflicts
    explanation: "Per-line comparison against the base is exactly the idea behind Git's merge, simplified."

commonMistakes:
  - title: "Committing secrets"
    explanation: "Deleting a key in a later commit does not remove it from history. Rotate the key and keep secrets out of the repository."
  - title: "Giant commits with message 'update'"
    explanation: "Small commits with a reason make history searchable and changes revertable."
  - title: "Rebasing shared history"
    explanation: "Rewriting commits others already pulled forces everyone to untangle diverged histories."

summary:
  - "Version control records history and lets people work in parallel; Git is distributed."
  - "Git stores snapshots as content-addressed objects: blobs, trees and commits named by their hashes."
  - "Commits form a graph; a branch is a movable pointer to a commit."
  - "A three-way merge compares both sides to their merge base and conflicts only when both changed the same thing differently."
  - "Commit small, branch per task, review changes, never commit secrets."
