quiz:
  - type: mcq
    question: What does Git store for each commit?
    options: ["A snapshot (via tree and blobs) plus parent links", "Only the lines that changed", "A zip of the whole disk", "Only the commit message"]
    answer: 0
    explanation: "Snapshots are stored efficiently by sharing identical objects."
  - type: mcq
    question: Why does changing an old commit change all later commit hashes?
    options: ["Each commit's hash includes its parent's hash", "Git renumbers commits", "Hashes are random", "Branches are copied"]
    answer: 0
    explanation: "That makes history tamper-evident."
  - type: mcq
    question: What is a branch in Git?
    options: ["A movable pointer to a commit", "A copy of all files", "A separate repository", "A type of merge"]
    answer: 0
    explanation: "That is why branching is cheap."
  - type: mcq
    question: In a three-way merge, only 'ours' changed a line from the base. What happens?
    options: ["Our change is kept without conflict", "Always a conflict", "Their version wins", "The line is deleted"]
    answer: 0
    explanation: "Only one side changed it, so take that change."
  - type: mcq
    question: What is a fast-forward merge?
    options: ["Moving a branch pointer ahead when no divergence exists", "Merging very large files", "Deleting a branch", "Squashing all commits"]
    answer: 0
    explanation: "No new merge commit is needed."
  - type: mcq
    question: Which should you never do with commits others have pulled?
    options: ["Rebase them", "Review them", "Tag them", "Read them"]
    answer: 0
    explanation: "Rebase rewrites history and diverges from others' copies."
  - type: code
    question: |
      Write `merge3(base, ours, theirs)` returning the merged value, or the string `"CONFLICT"` if both sides changed from `base` to different values.
    starter: |
      def merge3(base, ours, theirs):
          pass
    tests:
      - name: cases
        code: |
          assert merge3("a", "a", "b") == "b"
          assert merge3("a", "b", "a") == "b"
          assert merge3("a", "b", "b") == "b"
          assert merge3("a", "b", "c") == "CONFLICT"
          assert merge3("a", "a", "a") == "a"
    solution: |
      def merge3(base, ours, theirs):
          if ours == theirs:
              return ours
          if ours == base:
              return theirs
          if theirs == base:
              return ours
          return "CONFLICT"
