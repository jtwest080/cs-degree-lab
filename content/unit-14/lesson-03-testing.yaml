quiz:
  - type: mcq
    question: In the testing pyramid, which kind of test should there be the most of?
    options: ["Unit tests", "End-to-end tests", "Manual tests", "Load tests"]
    answer: 0
    explanation: "Unit tests are fast, cheap and pinpoint failures."
  - type: mcq
    question: What are the three steps of a typical test?
    options: ["Arrange, act, assert", "Plan, build, ship", "Read, write, run", "Setup, deploy, monitor"]
    answer: 0
    explanation: "Set up, call the code, check the result."
  - type: mcq
    question: What is the difference between a stub and a mock?
    options: ["A mock also records how it was called", "A stub is slower", "A mock is a real database", "No difference"]
    answer: 0
    explanation: "A stub only supplies fixed answers."
  - type: mcq
    question: What is the first step of test-driven development?
    options: ["Write a failing test", "Write the code", "Refactor", "Deploy"]
    answer: 0
    explanation: "Red comes first."
  - type: mcq
    question: What does 100% line coverage guarantee?
    options: ["Every line ran during tests, not that behaviour was checked", "The code has no bugs", "All edge cases pass", "The tests are good"]
    answer: 0
    explanation: "A test can execute a line without asserting anything about it."
  - type: mcq
    question: Which makes a test flaky?
    options: ["Depending on the current time or the network", "Using assert", "Having a clear name", "Testing one behaviour"]
    answer: 0
    explanation: "Uncontrolled dependencies give different results on different runs."
  - type: code
    question: |
      Write `check_sorted_property(fn, cases)`. `fn` is a sorting function and `cases` a list of lists. Return `True` if for every case `fn(case)` is in order and has the same items as the input (compare with `sorted`), otherwise `False`.
    starter: |
      def check_sorted_property(fn, cases):
          pass
    tests:
      - name: properties
        code: |
          assert check_sorted_property(sorted, [[3, 1, 2], [], [1], [2, 2, 1]]) is True
          assert check_sorted_property(lambda xs: xs, [[3, 1, 2]]) is False
          assert check_sorted_property(lambda xs: [1, 2, 3], [[3, 1, 2], [5]]) is False
          assert check_sorted_property(sorted, []) is True
    solution: |
      def check_sorted_property(fn, cases):
          for case in cases:
              out = fn(list(case))
              if sorted(out) != sorted(case):
                  return False
              if any(a > b for a, b in zip(out, out[1:])):
                  return False
          return True
