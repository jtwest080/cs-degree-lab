id: u14-testing
title: "Testing: Proving Code Works"
minutes: 60
objective: |
  Learn why and how to test software automatically: the testing pyramid, unit tests with arrange/act/assert, test doubles (stubs, fakes and mocks), test-driven development, and what coverage does and does not tell you. You will build a miniature test framework to see how tools like pytest work.
outcomes:
  - Explain the kinds of tests and the testing pyramid
  - Write unit tests in arrange, act, assert form with edge cases
  - Use a stub or mock to isolate code from slow or random dependencies
  - Apply the red, green, refactor cycle of test-driven development
  - Explain what coverage measures and why it is not proof of correctness

sections:
  - heading: Why test automatically
    body: |
      Testing can show that bugs exist, never that none do, but good tests give **confidence to change code**. Every exercise in this course has been checked by automated tests, and professional teams do the same on a larger scale: when a developer changes one function, thousands of tests re-run in minutes to catch **regressions**, old behaviour that broke. Without them, each change is a gamble and teams become afraid to touch old code.

      The **testing pyramid** describes a healthy mix. Many fast **unit tests** check single functions or classes in isolation. Fewer **integration tests** check that parts work together (code with a real database). Very few **end-to-end tests** drive the whole system like a user (a browser clicking through checkout). Lower tests are fast, cheap and pinpoint failures; higher tests are slow, brittle, and prove the whole thing works. An upside-down pyramid, mostly slow end-to-end tests, gives long waits and flaky results.

  - heading: Anatomy of a unit test
    body: |
      A good test is small, fast, deterministic and checks one behaviour. The pattern is **Arrange, Act, Assert**: set up the inputs and objects, call the code, check the result. Name tests for the behaviour (`test_empty_cart_total_is_zero`), so a failure tells you what broke.

      Choose cases deliberately: the normal case, the **boundaries** (empty, one item, the maximum, just either side of a limit), and **error cases** (invalid input must raise the right exception). Most bugs live at the edges. A test should fail for one reason and never depend on the order of other tests, the clock, the network or randomness.

      Frameworks such as `unittest` and `pytest` supply the plumbing: they find test functions, run each in isolation, catch the exceptions raised by failing `assert` statements, and report. They also give **fixtures** (shared set-up) and **parametrised tests** (one test, many inputs).

  - heading: Test doubles
    body: |
      Code often depends on things that are slow, random or outside your control: the clock, a payment API, a database. A **test double** replaces such a **dependency** during a test. A **stub** returns fixed answers. A **fake** is a simple working version (an in-memory dictionary instead of a database). A **mock** also records how it was called, so the test can check that `send_email` was called once with the right address. Doubles only work if the code lets you pass the dependency in (**dependency injection**: give the function the clock, instead of having it call `time.time()` itself), which is one reason testable code tends to be well-designed code (Lessons 14.4 and 14.5).

      Beware over-mocking: a test full of mocks checks that the code calls what you told it to, not that the system works, and breaks whenever the implementation is refactored. Prefer real objects or fakes where they are fast, and mock only at the boundaries.

  - heading: Test-driven development and coverage
    body: |
      **Test-driven development (TDD)** repeats a tight cycle: **red** (write a small failing test for the next behaviour), **green** (write the simplest code that passes it), **refactor** (clean up with the tests as a safety net). It leads to testable designs, tiny steps and a test for every behaviour.

      **Coverage** is the share of lines (or branches) executed by the tests. Low coverage tells you code is untested; high coverage does *not* tell you it is tested well, because a test can run a line without checking anything. Treat coverage as a way to find gaps, not a goal. Other techniques extend testing: **property-based testing** generates many random inputs and checks rules that must always hold (sorting twice equals sorting once), **mutation testing** deliberately breaks the code to see whether the tests notice, and **fuzzing** throws malformed input at a program to find crashes. Tests are code too: keep them readable, because they are also living documentation of what the system does.

examples:
  - title: A miniature test runner
    intro: "This is the heart of pytest: find functions starting with test_, run each, and record failures."
    code: |
      def test_add():
          assert 1 + 1 == 2

      def test_upper():
          assert "ab".upper() == "AB"

      def test_broken():
          assert len([1, 2]) == 3, "wrong length"

      def run(tests):
          results = {}
          for name, fn in tests.items():
              try:
                  fn()
                  results[name] = "pass"
              except AssertionError as e:
                  results[name] = "FAIL: " + str(e)
          return results

      found = {n: f for n, f in globals().items() if n.startswith("test_") and callable(f)}
      for name, outcome in run(found).items():
          print(name, outcome)
    output: |
      test_add pass
      test_upper pass
      test_broken FAIL: wrong length
    lines:
      - line: 17
        note: "Each test runs inside try/except so one failure does not stop the others."
      - line: 20
        note: "Discovery by naming convention, just like real frameworks."
  - title: Arrange, act, assert with edge cases
    intro: "Test the normal case and the boundaries of one small function."
    code: |
      def clamp(x, low, high):
          return max(low, min(x, high))

      def check(name, got, expected):
          print(name, "ok" if got == expected else "FAIL got " + repr(got))

      check("inside", clamp(5, 0, 10), 5)
      check("below", clamp(-3, 0, 10), 0)
      check("above", clamp(99, 0, 10), 10)
      check("at low edge", clamp(0, 0, 10), 0)
      check("at high edge", clamp(10, 0, 10), 10)
      check("float", clamp(0.5, 0, 1), 0.5)
    output: |
      inside ok
      below ok
      above ok
      at low edge ok
      at high edge ok
      float ok
    lines:
      - line: 8
        note: "The three regions: below, inside and above the range."
      - line: 10
        note: "Edges are where off-by-one bugs live."
  - title: A stub for the clock
    intro: "Passing the time in makes a time-dependent function deterministic to test."
    code: |
      def greeting(now):
          hour = now()
          if hour < 12:
              return "Good morning"
          if hour < 18:
              return "Good afternoon"
          return "Good evening"

      print(greeting(lambda: 9))
      print(greeting(lambda: 12))
      print(greeting(lambda: 23))
    output: |
      Good morning
      Good afternoon
      Good evening
    lines:
      - line: 2
        note: "The clock is a dependency passed in, not fetched inside."
      - line: 10
        note: "A lambda that always returns 12 is a stub: a fixed answer for the test."
  - title: A mock that records calls
    intro: "A mock remembers how it was used so the test can check the interaction."
    code: |
      class MockMailer:
          def __init__(self):
              self.sent = []
          def send(self, to, body):
              self.sent.append((to, body))

      def welcome(user, mailer):
          if user.get("email"):
              mailer.send(user["email"], "Welcome " + user["name"])

      m = MockMailer()
      welcome({"name": "Ana", "email": "ana@example.com"}, m)
      welcome({"name": "Bo"}, m)
      print(m.sent)
      print(len(m.sent) == 1)
    output: |
      [('ana@example.com', 'Welcome Ana')]
      True
    lines:
      - line: 5
        note: "The mock records instead of sending real email."
      - line: 15
        note: "The test asserts the interaction: one email, to the right person."
  - title: A property check
    intro: "Instead of picking examples, check rules over many generated inputs."
    code: |
      import random

      def my_sort(xs):
          return sorted(xs)

      random.seed(1)
      ok = True
      for _ in range(200):
          xs = [random.randint(-50, 50) for _ in range(random.randint(0, 12))]
          out = my_sort(xs)
          same_items = sorted(out) == sorted(xs)
          ordered = all(a <= b for a, b in zip(out, out[1:]))
          idempotent = my_sort(out) == out
          if not (same_items and ordered and idempotent):
              ok = False
      print("all properties hold:", ok)
    output: |
      all properties hold: True
    lines:
      - line: 8
        note: "The seed makes the random inputs repeatable, so failures can be reproduced."
      - line: 12
        note: "Three rules any sort must obey: same items, in order, sorting again changes nothing."

playground:
  prompt: |
    Write a function with a deliberate bug at a boundary (for example `is_adult(age)` using `>` instead of `>=`). Then write checks that would catch it. Which input finds the bug?
  code: |
    def is_adult(age):
        return age > 18

    print(is_adult(17), is_adult(18), is_adult(19))

exercises:
  - id: mini-runner
    title: Build a test runner
    difficulty: 3
    prompt: |
      Write `run_tests(tests)` where `tests` is a dictionary of name to function. Call each in the dictionary's order. Return a dictionary of name to result: `"pass"` if it returns normally, `"fail: <message>"` if it raises `AssertionError` (use `str(e)`), and `"error: <TypeName>"` for any other exception (e.g. `"error: ZeroDivisionError"`).
    starter: |
      def run_tests(tests):
          pass
    tests:
      - name: results
        code: |
          def ok(): assert True
          def bad(): assert 1 == 2, "nope"
          def boom(): 1 / 0
          r = run_tests({"ok": ok, "bad": bad, "boom": boom})
          assert r == {"ok": "pass", "bad": "fail: nope", "boom": "error: ZeroDivisionError"}, r
          assert list(r) == ["ok", "bad", "boom"]
          assert run_tests({}) == {}
    hints:
      - "Catch `AssertionError` first, then `Exception`."
      - "`type(e).__name__` is the exception's name."
    solution: |
      def run_tests(tests):
          results = {}
          for name, fn in tests.items():
              try:
                  fn()
                  results[name] = "pass"
              except AssertionError as e:
                  results[name] = "fail: " + str(e)
              except Exception as e:
                  results[name] = "error: " + type(e).__name__
          return results
    explanation: "A failing assertion and an unexpected crash are different outcomes, so the runner reports them differently."
  - id: stub-clock
    title: Test with a stubbed clock
    difficulty: 2
    prompt: |
      Write `is_open(now, open_hour=9, close_hour=17)` where `now` is a function returning the current hour (0 to 23). The shop is open from `open_hour` up to but **not including** `close_hour`. Return `True` or `False`.
    starter: |
      def is_open(now, open_hour=9, close_hour=17):
          pass
    tests:
      - name: boundaries
        code: |
          assert is_open(lambda: 9) is True
          assert is_open(lambda: 8) is False
          assert is_open(lambda: 16) is True
          assert is_open(lambda: 17) is False
          assert is_open(lambda: 12, 10, 14) is True
          assert is_open(lambda: 14, 10, 14) is False
    hints:
      - "`open_hour <= now() < close_hour`."
    solution: |
      def is_open(now, open_hour=9, close_hour=17):
          return open_hour <= now() < close_hour
    explanation: "Passing the clock in makes the function trivially testable at each boundary."
  - id: mock-notifier
    title: Write a recording mock
    difficulty: 3
    prompt: |
      Write a class `MockNotifier` with `notify(user, message)` that records each call as a tuple in a list `calls`, and `called_with(user, message)` returning whether that exact call happened. Then write `alert_if_low(stock, threshold, notifier)` that calls `notifier.notify("ops", "low stock: " + str(stock))` only when `stock < threshold`.
    starter: |
      class MockNotifier:
          pass

      def alert_if_low(stock, threshold, notifier):
          pass
    tests:
      - name: mock behaviour
        code: |
          n = MockNotifier()
          alert_if_low(5, 10, n)
          assert n.calls == [("ops", "low stock: 5")], n.calls
          assert n.called_with("ops", "low stock: 5") is True
          assert n.called_with("ops", "low stock: 6") is False
      - name: no alert
        code: |
          n = MockNotifier()
          alert_if_low(10, 10, n)
          alert_if_low(50, 10, n)
          assert n.calls == []
    hints:
      - "Create `self.calls = []` in `__init__`."
    solution: |
      class MockNotifier:
          def __init__(self):
              self.calls = []

          def notify(self, user, message):
              self.calls.append((user, message))

          def called_with(self, user, message):
              return (user, message) in self.calls


      def alert_if_low(stock, threshold, notifier):
          if stock < threshold:
              notifier.notify("ops", "low stock: " + str(stock))
    explanation: "The mock lets the test verify the interaction without sending anything real."
  - id: tdd-fizz
    title: "TDD: a leap year function"
    difficulty: 3
    prompt: |
      Write `is_leap(year)`: divisible by 4 is a leap year, except years divisible by 100 are not, except years divisible by 400 are. Then write `leap_tests()` returning a list of the four `(year, expected)` pairs that cover every rule: one ordinary leap year, one ordinary non-leap year, one century non-leap and one 400-year leap. Use `[(2024, True), (2023, False), (1900, False), (2000, True)]`.
    starter: |
      def is_leap(year):
          pass

      def leap_tests():
          pass
    tests:
      - name: rules
        code: |
          for y, e in leap_tests():
              assert is_leap(y) is e, (y, e)
          assert is_leap(2100) is False and is_leap(2400) is True and is_leap(1) is False
      - name: the listed cases
        code: |
          assert leap_tests() == [(2024, True), (2023, False), (1900, False), (2000, True)]
    hints:
      - "`(year % 4 == 0 and year % 100 != 0) or year % 400 == 0`."
    solution: |
      def is_leap(year):
          return (year % 4 == 0 and year % 100 != 0) or year % 400 == 0


      def leap_tests():
          return [(2024, True), (2023, False), (1900, False), (2000, True)]
    explanation: "Each rule has a test case that fails if that rule is missing, which is what TDD builds up one case at a time."

commonMistakes:
  - title: "Tests that depend on the clock, randomness or order"
    explanation: "They pass today and fail tomorrow. Inject the dependency or fix the seed."
  - title: "Testing only the happy path"
    explanation: "Empty input, boundaries and errors are where the bugs are."
  - title: "Chasing 100% coverage"
    explanation: "A line can run without being checked. Use coverage to find untested code, not as proof."
  - title: "Mocking everything"
    explanation: "Tests tied to the implementation break on every refactor and prove little."

summary:
  - "Automated tests catch regressions and make changing code safe; the pyramid favours many fast unit tests."
  - "Arrange, act, assert; test normal cases, boundaries and errors, deterministically."
  - "Stubs, fakes and mocks replace dependencies, which works best when dependencies are injected."
  - "TDD cycles red, green, refactor; coverage finds gaps but does not prove quality."
