id: u14-design
title: "Design Principles and Refactoring"
minutes: 60
objective: |
  Learn what makes code easy to change: cohesion and coupling, the SOLID principles, DRY and YAGNI, and refactoring, which improves structure without changing behaviour. You will see a messy function become clean through small, safe steps.
outcomes:
  - Define cohesion and coupling and say which to maximise or minimise
  - Explain the SOLID principles with an example of each
  - Spot common code smells
  - Refactor code in small steps while keeping behaviour the same
  - Use dependency injection and interfaces to reduce coupling

sections:
  - heading: Designing for change
    body: |
      Working code is the minimum. The real question is how hard it will be to change next month. Good design keeps the cost of change low as the system grows. Two ideas measure it. **Cohesion** is how closely the parts of one module belong together: a `Invoice` class with `total()` and `add_item()` is cohesive; one that also sends email and formats HTML is not. **Coupling** is how much one module depends on the details of another: if changing the database forces edits in 40 files, coupling is high. Aim for **high cohesion and low coupling**. Hiding details behind small, stable **interfaces** (abstraction and encapsulation from Unit 4) is the main tool.

      Other slogans capture the same wisdom. **DRY** (Don't Repeat Yourself): each piece of knowledge should live in one place, so a fix is made once. **YAGNI** (You Aren't Gonna Need It): do not build for imagined future needs, since you will guess wrong and pay for the complexity. **KISS**: the simplest design that works is best. Beware the opposite error too: merging two things that only look alike creates false coupling.

  - heading: The SOLID principles
    body: |
      Five guidelines for object-oriented design, from Robert Martin:

      - **S, Single Responsibility.** A class should have one reason to change. A `Report` that calculates figures *and* prints them changes when either the maths or the layout does. Split it.
      - **O, Open/Closed.** Software should be open for extension, closed for modification: add new behaviour by adding new code (a new class), not by editing a growing `if/elif` chain.
      - **L, Liskov Substitution.** Anywhere a base type is expected, a subtype must work without surprises. A `Square` that breaks a `Rectangle`'s promise that width and height are independent violates this.
      - **I, Interface Segregation.** Prefer several small interfaces to one large one, so classes are not forced to implement methods they do not use.
      - **D, Dependency Inversion.** High-level code should depend on abstractions, not concrete details. The checkout logic should depend on "a payment method", not on one provider's library, and receive the real one from outside (**dependency injection**), which also makes it testable (Lesson 14.3).

      These are guides, not laws. Applied mechanically they give needless layers; used with judgement they keep code flexible. Python adds its own flavour: functions are objects, so often a function passed in replaces a whole class hierarchy.

  - heading: Code smells and refactoring
    body: |
      A **code smell** is a surface sign of a deeper problem: a very long function; a long list of parameters; duplicated code; a class that knows too much about another (**feature envy**); a giant `if/elif` chain switching on type; **magic numbers** (`if status == 3`); vague names; deep nesting; comments that explain confusing code instead of fixing it.

      **Refactoring** improves structure *without changing behaviour*. The rules: have tests first (Lesson 14.3), make **small steps**, and re-run the tests after each one. Common moves: **extract function** (give a block a name), **rename**, **replace magic number with a constant**, **replace conditional with polymorphism or a lookup table**, **inline** a needless helper, **introduce parameter object** (group related arguments). Because each step is tiny and tested, you can always stop, and the code is never left broken. Refactor continually as part of normal work, not in a big rewrite; rewrites usually take longer than expected and lose the hard-won fixes in the old code.

examples:
  - title: A function with too many jobs
    intro: "Calculating, formatting and discount rules are tangled in one function. This is the 'before'."
    code: |
      def order_report(items, customer_type):
          total = 0
          lines = []
          for name, price, qty in items:
              total += price * qty
              lines.append(name + " x" + str(qty) + " = " + str(price * qty))
          if customer_type == "gold":
              total = total * 0.9
          elif customer_type == "silver":
              total = total * 0.95
          lines.append("TOTAL " + str(round(total, 2)))
          return "\n".join(lines)

      print(order_report([("pen", 2, 3), ("book", 10, 1)], "gold"))
    output: |
      pen x3 = 6
      book x1 = 10
      TOTAL 14.4
    lines:
      - line: 5
        note: "Calculation and formatting mixed in one loop."
      - line: 7
        note: "A growing if/elif chain: every new customer type edits this function (Open/Closed)."
  - title: After refactoring
    intro: "Same output, with each job in its own small function and the discounts in a lookup table."
    code: |
      DISCOUNTS = {"gold": 0.10, "silver": 0.05}

      def line_total(price, qty):
          return price * qty

      def apply_discount(total, customer_type):
          return total * (1 - DISCOUNTS.get(customer_type, 0))

      def format_line(name, price, qty):
          return name + " x" + str(qty) + " = " + str(line_total(price, qty))

      def order_report(items, customer_type):
          total = sum(line_total(p, q) for _, p, q in items)
          lines = [format_line(*item) for item in items]
          lines.append("TOTAL " + str(round(apply_discount(total, customer_type), 2)))
          return "\n".join(lines)

      print(order_report([("pen", 2, 3), ("book", 10, 1)], "gold"))
    output: |
      pen x3 = 6
      book x1 = 10
      TOTAL 14.4
    lines:
      - line: 1
        note: "Data replaces the if/elif chain: a new tier is one more entry, no code edit."
      - line: 14
        note: "Now each function has one reason to change."
  - title: Open/Closed with a function table
    intro: "New shapes are added by adding entries, not by editing the area function."
    code: |
      import math

      AREA = {
          "circle": lambda r: math.pi * r * r,
          "square": lambda s: s * s,
      }

      def area(kind, size):
          return AREA[kind](size)

      AREA["triangle"] = lambda b: b * b * math.sqrt(3) / 4      # extension without modifying area()
      print(round(area("circle", 1), 3), area("square", 3), round(area("triangle", 2), 3))
    output: |
      3.142 9 1.732
    lines:
      - line: 11
        note: "Extending behaviour touched no existing function."
  - title: Dependency injection
    intro: "The checkout receives a payment function, so tests and different providers need no change to checkout."
    code: |
      def checkout(cart_total, pay):
          if cart_total <= 0:
              return "nothing to pay"
          return pay(cart_total)

      def card(amount):
          return "charged card " + str(amount)

      def always_fails(amount):
          return "declined"

      print(checkout(25, card))
      print(checkout(25, always_fails))
      print(checkout(0, card))
    output: |
      charged card 25
      declined
      nothing to pay
    lines:
      - line: 1
        note: "checkout depends on 'something callable', not on a concrete provider."
      - line: 12
        note: "Swapping the dependency is a one-word change; a stub makes testing trivial."
  - title: Liskov in action
    intro: "A subtype that changes the promised behaviour breaks code written for the base type."
    code: |
      class Rectangle:
          def __init__(self, w, h):
              self.w, self.h = w, h
          def set_width(self, w):
              self.w = w
          def area(self):
              return self.w * self.h

      class BadSquare(Rectangle):
          def set_width(self, w):
              self.w = self.h = w                        # surprise: changes the height too

      def stretch(rect):
          rect.set_width(10)
          return rect.area()

      print(stretch(Rectangle(2, 3)))
      print(stretch(BadSquare(3, 3)))
    output: |
      30
      100
    lines:
      - line: 11
        note: "BadSquare violates the Rectangle contract that set_width only changes the width."
      - line: 19
        note: "Code written for Rectangle expects 30 (10 x 3) but gets 100."

playground:
  prompt: |
    Add a "platinum" tier with a 15% discount to the refactored version. How many lines of existing code did you have to change?
  code: |
    DISCOUNTS = {"gold": 0.10, "silver": 0.05}
    print(100 * (1 - DISCOUNTS.get("gold", 0)))

exercises:
  - id: discount-table
    title: Replace a conditional with a table
    difficulty: 2
    prompt: |
      Write `price_after(price, tier)` using a dictionary `RATES = {"gold": 0.10, "silver": 0.05, "bronze": 0.02}` of discount rates (define it at module level). Return `round(price * (1 - rate), 2)`, with a rate of 0 for unknown tiers.
    starter: |
      def price_after(price, tier):
          pass
    tests:
      - name: tiers
        code: |
          assert price_after(100, "gold") == 90.0
          assert price_after(100, "silver") == 95.0
          assert price_after(50, "bronze") == 49.0
          assert price_after(19.99, "none") == 19.99
          assert RATES["gold"] == 0.10
    hints:
      - "`RATES.get(tier, 0)` returns 0 for an unknown key."
    solution: |
      RATES = {"gold": 0.10, "silver": 0.05, "bronze": 0.02}


      def price_after(price, tier):
          return round(price * (1 - RATES.get(tier, 0)), 2)
    explanation: "A table is data: adding a tier means adding an entry, not editing logic."
  - id: extract-functions
    title: Refactor a long function
    difficulty: 3
    prompt: |
      This behaviour must stay exactly the same: `summary(scores)` returns `"n=<count> mean=<mean rounded to 1 decimal> best=<max> pass=<number >= 50>"`, and for an empty list returns `"no scores"`. Write it using three small helper functions: `mean(xs)`, `count_passing(xs, mark=50)` and `summary(scores)`.
    starter: |
      def mean(xs):
          pass

      def count_passing(xs, mark=50):
          pass

      def summary(scores):
          pass
    tests:
      - name: helpers
        code: |
          assert mean([2, 4]) == 3.0
          assert count_passing([10, 50, 90]) == 2
          assert count_passing([10, 50, 90], 60) == 1
      - name: summary
        code: |
          assert summary([40, 60, 80]) == "n=3 mean=60.0 best=80 pass=2", summary([40, 60, 80])
          assert summary([10]) == "n=1 mean=10.0 best=10 pass=0"
          assert summary([]) == "no scores"
    hints:
      - "Each helper is one line. `summary` guards the empty case first."
    solution: |
      def mean(xs):
          return sum(xs) / len(xs)


      def count_passing(xs, mark=50):
          return sum(1 for x in xs if x >= mark)


      def summary(scores):
          if not scores:
              return "no scores"
          return "n={} mean={} best={} pass={}".format(
              len(scores), round(mean(scores), 1), max(scores), count_passing(scores))
    explanation: "Small named helpers are individually testable and reusable."
  - id: pluggable-payment
    title: Dependency injection
    difficulty: 3
    prompt: |
      Write `checkout(items, pay, tax=0.2)`. `items` is a list of `(price, qty)`. Compute the subtotal, add tax (`subtotal * (1 + tax)`, rounded to 2 decimals), and return `pay(total)`. If the subtotal is 0 return `"nothing to pay"` without calling `pay`.
    starter: |
      def checkout(items, pay, tax=0.2):
          pass
    tests:
      - name: injected payment
        code: |
          calls = []
          def pay(amount):
              calls.append(amount)
              return "paid " + str(amount)
          assert checkout([(10, 2), (5, 1)], pay) == "paid 30.0", checkout([(10, 2), (5, 1)], pay)
          assert calls == [30.0]
          assert checkout([(10, 1)], pay, tax=0) == "paid 10"
      - name: empty
        code: |
          called = []
          assert checkout([], lambda a: called.append(a)) == "nothing to pay"
          assert checkout([(5, 0)], lambda a: called.append(a)) == "nothing to pay"
          assert called == []
    hints:
      - "Compute `subtotal = sum(p * q for p, q in items)` first and check it is 0."
    solution: |
      def checkout(items, pay, tax=0.2):
          subtotal = sum(p * q for p, q in items)
          if subtotal == 0:
              return "nothing to pay"
          return pay(round(subtotal * (1 + tax), 2))
    explanation: "The payment provider is passed in, so a test can use a recording function instead of a real one."
  - id: plugin-registry
    title: Open for extension
    difficulty: 4
    prompt: |
      Write a `Formatter` class with `register(name, fn)` to add a formatting function, `format(name, text)` that applies it (raising `KeyError("unknown formatter: <name>")`-style `KeyError` for an unknown name), and `names()` returning the registered names sorted. A new format must be addable without editing the class.
    starter: |
      class Formatter:
          pass
    tests:
      - name: registry
        code: |
          f = Formatter()
          f.register("upper", str.upper)
          f.register("title", str.title)
          assert f.format("upper", "hi there") == "HI THERE"
          assert f.format("title", "hi there") == "Hi There"
          assert f.names() == ["title", "upper"]
          f.register("shout", lambda s: s.upper() + "!")
          assert f.format("shout", "hey") == "HEY!"
      - name: unknown
        code: |
          f = Formatter()
          try:
              f.format("nope", "x")
              assert False
          except KeyError:
              pass
    hints:
      - "Keep a dictionary of name to function."
    solution: |
      class Formatter:
          def __init__(self):
              self._fns = {}

          def register(self, name, fn):
              self._fns[name] = fn

          def format(self, name, text):
              if name not in self._fns:
                  raise KeyError("unknown formatter: " + name)
              return self._fns[name](text)

          def names(self):
              return sorted(self._fns)
    explanation: "Behaviour is added by registering, never by modifying existing code."

commonMistakes:
  - title: "Refactoring without tests"
    explanation: "Without tests you cannot know behaviour stayed the same. Write them first."
  - title: "Abstracting too early"
    explanation: "Wait until you see the same shape three times. Wrong abstractions cost more than duplication."
  - title: "Applying SOLID mechanically"
    explanation: "Layers of interfaces for a 50-line script add noise. Use judgement and YAGNI."
  - title: "Big-bang rewrites"
    explanation: "Improve code in small, tested steps instead."

summary:
  - "Aim for high cohesion and low coupling; hide details behind small interfaces."
  - "DRY, YAGNI and KISS keep design honest."
  - "SOLID: single responsibility, open/closed, Liskov substitution, interface segregation, dependency inversion."
  - "Refactoring changes structure not behaviour, in small steps protected by tests."
next: u14-patterns

quiz:
  - type: mcq
    question: What do we want from cohesion and coupling?
    options: ["High cohesion, low coupling", "Low cohesion, high coupling", "High both", "Low both"]
    answer: 0
    explanation: "Related things together, with few dependencies between modules."
  - type: mcq
    question: What does the Single Responsibility Principle say?
    options: ["A class should have one reason to change", "A class should have one method", "A program should have one class", "Every function returns one value"]
    answer: 0
    explanation: "Mixing responsibilities means unrelated changes hit the same code."
  - type: mcq
    question: A long if/elif chain on type that needs editing for each new type most violates which principle?
    options: ["Open/Closed", "Interface Segregation", "DRY", "YAGNI"]
    answer: 0
    explanation: "New behaviour should arrive by extension rather than modification."
  - type: mcq
    question: What is refactoring?
    options: ["Changing structure without changing behaviour", "Adding features", "Fixing bugs", "Rewriting from scratch"]
    answer: 0
    explanation: "External behaviour must stay the same."
  - type: mcq
    question: Why does dependency injection help testing?
    options: ["A test can pass in a stub or mock", "It makes code faster", "It removes the need for tests", "It hides errors"]
    answer: 0
    explanation: "The dependency is supplied from outside."
  - type: mcq
    question: What is a 'magic number'?
    options: ["An unexplained literal such as 3 in an if", "A prime number", "A random value", "A constant with a name"]
    answer: 0
    explanation: "Name it as a constant so the meaning is clear."
  - type: code
    question: |
      Replace this logic with a table. Write `shipping(zone)` returning 5 for `"local"`, 12 for `"national"`, 30 for `"international"`, and 0 for any other zone, using a dictionary named `COST`.
    starter: |
      def shipping(zone):
          pass
    tests:
      - name: zones
        code: |
          assert shipping("local") == 5
          assert shipping("national") == 12
          assert shipping("international") == 30
          assert shipping("mars") == 0
          assert COST["local"] == 5
    solution: |
      COST = {"local": 5, "national": 12, "international": 30}


      def shipping(zone):
          return COST.get(zone, 0)
