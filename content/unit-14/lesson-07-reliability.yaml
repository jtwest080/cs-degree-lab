quiz:
  - type: mcq
    question: What does bisecting do when hunting a bug?
    options: ["Halves the search space repeatedly", "Tests every version in order", "Deletes half the code", "Rewrites the program"]
    answer: 0
    explanation: "Binary search finds the first bad version in about log2(n) tests."
  - type: mcq
    question: Which log level fits 'payment failed for order 42'?
    options: ["ERROR", "DEBUG", "INFO", "TRACE"]
    answer: 0
    explanation: "An operation failed."
  - type: mcq
    question: Why add jitter to retry delays?
    options: ["So clients don't all retry at the same moment", "To make waits shorter", "To hide errors", "To avoid logging"]
    answer: 0
    explanation: "Synchronised retries can overwhelm a recovering service."
  - type: mcq
    question: Which operation is idempotent?
    options: ["Set balance to 100", "Add 10 to balance", "Append a row", "Send an email"]
    answer: 0
    explanation: "Doing it twice has the same effect as once."
  - type: mcq
    question: What does an open circuit breaker do?
    options: ["Fails fast without calling the broken service", "Calls the service faster", "Restarts the server", "Deletes data"]
    answer: 0
    explanation: "It protects the failing service and the caller."
  - type: mcq
    question: Roughly how much downtime per 30-day month does a 99.9% SLO allow?
    options: ["About 43 minutes", "About 7 hours", "About 4 minutes", "None"]
    answer: 0
    explanation: "0.1% of 43,200 minutes is 43.2."
  - type: code
    question: |
      Write `retry_count(outcomes)` where `outcomes` is a list of booleans (`True` means the attempt succeeded). Return how many attempts were made until and including the first success, or `len(outcomes)` if none succeeded.
    starter: |
      def retry_count(outcomes):
          pass
    tests:
      - name: attempts
        code: |
          assert retry_count([False, False, True, True]) == 3
          assert retry_count([True]) == 1
          assert retry_count([False, False]) == 2
          assert retry_count([]) == 0
    solution: |
      def retry_count(outcomes):
          for i, ok in enumerate(outcomes, 1):
              if ok:
                  return i
          return len(outcomes)
