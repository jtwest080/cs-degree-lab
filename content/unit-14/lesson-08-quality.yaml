id: u14-quality
title: "Code Quality, CI/CD and Technical Debt"
minutes: 55
objective: |
  Learn how teams keep quality high as code grows: code review, style and linting, measuring complexity, continuous integration and delivery pipelines, deployment strategies, and managing technical debt.
outcomes:
  - Explain what code review, linting and static analysis catch
  - Compute cyclomatic complexity of a function from its syntax tree
  - Describe a CI/CD pipeline and its stages
  - Compare deployment strategies such as blue-green, canary and feature flags
  - Explain technical debt and decide when to pay it down

sections:
  - heading: Review, style and static analysis
    body: |
      Quality is maintained by habit and by tools. **Code review**: before a change is merged, a teammate reads it. Reviews catch bugs, spread knowledge, and keep the style consistent; the best reviews are kind, specific and about the code, not the person. Keep changes small so they can be reviewed well.

      A **style guide** (Python's is PEP 8) removes pointless arguments, and a **formatter** such as Black applies it automatically. A **linter** (flake8, ruff) reads the code without running it and flags likely mistakes: unused variables, undefined names, suspicious patterns. **Static analysis** goes further and a **type checker** (mypy) uses type hints (Unit 4) to find mismatches before the code runs. All of these run automatically on every change, so review time goes to design and logic rather than commas.

      **Metrics** can point to trouble spots, but only point. **Cyclomatic complexity** counts the independent paths through a function: start at 1 and add 1 for each decision (`if`, `elif`, `for`, `while`, `except`, each `and`/`or`, and each branch of a conditional expression). Under about 10 is comfortable; much higher means a function is hard to test (each path needs a test case) and hard to understand. It is a prompt to refactor (Lesson 14.4), not a score to chase.

  - heading: Continuous integration and delivery
    body: |
      In **continuous integration (CI)**, every push automatically triggers a server to build the project and run the tests, linters and checks, and reports pass or fail within minutes. Developers **merge to the main branch often** (at least daily) so problems surface while the change is small and fresh, instead of in a painful "integration week" before release. A broken main branch is fixed first, before anything else.

      **Continuous delivery** extends the pipeline so every change that passes can be released at the push of a button; **continuous deployment** releases it automatically. A typical **pipeline** has stages: *build* (compile or package), *test* (unit, then integration), *analyse* (lint, security scan), *deploy to staging* (a copy of production), *deploy to production*. Each stage gates the next; the early stages are fast so developers get feedback quickly. Builds should be **reproducible**: the same input gives the same output, with dependencies pinned. This very project builds its web and desktop apps this way.

      Release safely: **blue-green** runs two identical environments and switches traffic from old (blue) to new (green), allowing instant rollback. **Canary** releases send the new version to 1 to 5% of users first and watch the metrics before widening. **Feature flags** ship code switched off and enable it for chosen users, separating deploying from releasing. Always have a **rollback** plan, and make database changes (**migrations**) backward-compatible so old and new code can run together.

  - heading: Technical debt
    body: |
      **Technical debt** is a metaphor: a quick, imperfect solution gets the feature out faster now, but, like a loan, charges **interest**: every later change in that area is slower and riskier. Some debt is a sensible choice (a prototype to test an idea); the danger is debt nobody tracks. Sources include rushed code, missing tests, outdated dependencies, and designs that no longer fit (the architecture of Lesson 14.6 eroding).

      Manage it deliberately: keep a visible list, prioritise by the interest it costs (code you change every week, or that causes incidents, matters more than code nobody touches), and pay it down steadily, for example by the **boy scout rule** (leave the code a little cleaner than you found it) and a fixed share of each sprint. Refuse the opposite trap too: endless polishing delays the value users are waiting for. **Dependencies** carry debt as well: update them regularly in small steps, because skipping years makes upgrading a huge risk, and watch for known security flaws in them (the supply-chain risk of Unit 11).

examples:
  - title: Cyclomatic complexity with ast
    intro: "Python can parse its own source. Walk the syntax tree and count decision points."
    code: |
      import ast

      def complexity(source):
          tree = ast.parse(source)
          score = 1
          for node in ast.walk(tree):
              if isinstance(node, (ast.If, ast.For, ast.While, ast.ExceptHandler, ast.IfExp)):
                  score += 1
              elif isinstance(node, ast.BoolOp):
                  score += len(node.values) - 1
          return score

      simple = "def f(x):\n    return x + 1\n"
      branchy = """
      def g(x, y):
          if x > 0 and y > 0:
              return 1
          elif x < 0:
              return 2
          for i in range(y):
              if i == 3:
                  break
          return 0
      """
      print(complexity(simple), complexity(branchy))
    output: |
      1 6
    lines:
      - line: 5
        note: "ast.parse turns source text into a tree (Unit 6 covered parsing)."
      - line: 10
        note: "'a and b' is one extra path; three operands are two extra."
  - title: A tiny linter
    intro: "Find assigned-but-never-used names by looking at the tree."
    code: |
      import ast

      def unused_names(source):
          tree = ast.parse(source)
          stored, loaded = set(), set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Name):
                  (stored if isinstance(node.ctx, ast.Store) else loaded).add(node.id)
          return sorted(stored - loaded)

      code = "total = 0\ntemp = 5\nfor n in [1, 2]:\n    total = total + n\nprint(total)\n"
      print(unused_names(code))
    output: |
      ['temp']
    lines:
      - line: 8
        note: "Store means assigned, Load means read."
      - line: 12
        note: "'temp' is assigned but never read, the kind of thing a linter reports."
  - title: A pipeline that stops at the first failure
    intro: "Each stage gates the next. The checks here are stand-ins for real tools."
    code: |
      def build(): return True
      def lint(): return True
      def unit_tests(): return False
      def deploy(): return True

      pipeline = [("build", build), ("lint", lint), ("unit tests", unit_tests), ("deploy", deploy)]

      for name, stage in pipeline:
          ok = stage()
          print(name, "passed" if ok else "FAILED")
          if not ok:
              print("pipeline stopped; nothing was deployed")
              break
    output: |
      build passed
      lint passed
      unit tests FAILED
      pipeline stopped; nothing was deployed
    lines:
      - line: 12
        note: "A failed stage prevents the later stages, so a broken build never ships."
  - title: Canary routing
    intro: "Send a fixed percentage of users to the new version, chosen by a stable hash so each user always sees the same one."
    code: |
      import hashlib

      def version_for(user_id, canary_percent):
          bucket = int(hashlib.md5(user_id.encode()).hexdigest(), 16) % 100
          return "new" if bucket < canary_percent else "old"

      users = ["u" + str(i) for i in range(1000)]
      counts = {"new": 0, "old": 0}
      for u in users:
          counts[version_for(u, 5)] += 1
      print(counts)
      print(version_for("u7", 5) == version_for("u7", 5))
    output: |
      {'new': 54, 'old': 946}
      True
    lines:
      - line: 4
        note: "Hashing gives each user a fixed bucket from 0 to 99."
      - line: 13
        note: "The same user always gets the same version, unlike a random choice per request."
  - title: Feature flag
    intro: "Code ships dark and is turned on for chosen users."
    code: |
      FLAGS = {"new_checkout": {"enabled": True, "users": {"ana", "bo"}}}

      def is_on(flag, user):
          f = FLAGS.get(flag)
          return bool(f and f["enabled"] and user in f["users"])

      for u in ("ana", "cy"):
          print(u, "new checkout" if is_on("new_checkout", u) else "old checkout")
    output: |
      ana new checkout
      cy old checkout
    lines:
      - line: 5
        note: "A missing flag or disabled flag is simply off, the safe default."

playground:
  prompt: |
    Add a loop with an if inside to the `branchy` function. How much does the complexity go up? Which functions in your own earlier code would score highest?
  code: |
    import ast
    print(len([n for n in ast.walk(ast.parse("if x:\n    pass")) if isinstance(n, ast.If)]))

exercises:
  - id: complexity-score
    title: Measure cyclomatic complexity
    difficulty: 4
    prompt: |
      Write `complexity(source)` taking Python source text and returning its cyclomatic complexity: 1 plus one for each `if`/`elif` (`ast.If`), `for`, `while`, `except` handler, conditional expression (`ast.IfExp`), and `len(values) - 1` for each `and`/`or` expression (`ast.BoolOp`).
    starter: |
      import ast

      def complexity(source):
          pass
    tests:
      - name: counts
        code: |
          assert complexity("x = 1") == 1
          assert complexity("if a:\n    pass") == 2
          assert complexity("if a:\n    pass\nelif b:\n    pass") == 3
          assert complexity("for i in x:\n    while i:\n        pass") == 3
          assert complexity("y = a if b else c") == 2
          assert complexity("y = a and b and c") == 3
          assert complexity("try:\n    pass\nexcept A:\n    pass\nexcept B:\n    pass") == 3
    hints:
      - "`ast.walk(tree)` visits every node."
      - "An `elif` is an `If` nested in the `orelse` of another, so it is counted automatically."
    solution: |
      import ast


      def complexity(source):
          score = 1
          for node in ast.walk(ast.parse(source)):
              if isinstance(node, (ast.If, ast.For, ast.While, ast.ExceptHandler, ast.IfExp)):
                  score += 1
              elif isinstance(node, ast.BoolOp):
                  score += len(node.values) - 1
          return score
    explanation: "Each decision adds a path that needs a test; the tree makes them easy to count."
  - id: unused-vars
    title: Find unused names
    difficulty: 3
    prompt: |
      Write `unused(source)` returning the sorted list of names that are assigned (`ast.Store`) but never read (`ast.Load`) anywhere in the source. Ignore the name `_`.
    starter: |
      import ast

      def unused(source):
          pass
    tests:
      - name: finds them
        code: |
          assert unused("a = 1\nb = 2\nprint(a)") == ["b"]
          assert unused("x = 1\ny = x") == ["y"]
          assert unused("for _ in range(3):\n    pass") == []
          assert unused("total = 0\ntotal = total + 1") == []
          assert unused("") == []
    hints:
      - "Collect two sets while walking and return their sorted difference."
    solution: |
      import ast


      def unused(source):
          stored, loaded = set(), set()
          for node in ast.walk(ast.parse(source)):
              if isinstance(node, ast.Name):
                  (stored if isinstance(node.ctx, ast.Store) else loaded).add(node.id)
          return sorted(stored - loaded - {"_"})
    explanation: "A real linter does this with scopes, but the core idea is the same difference of sets."
  - id: pipeline-runner
    title: A pipeline runner
    difficulty: 3
    prompt: |
      Write `run_pipeline(stages)` where `stages` is a list of `(name, fn)`. Call each `fn()` in order. It returns `(passed, report)`: `report` is a list of `(name, "ok")` or `(name, "failed")` for the stages that ran. Stop at the first stage that returns `False` or raises an exception (treat both as failed); `passed` is `True` only if every stage succeeded.
    starter: |
      def run_pipeline(stages):
          pass
    tests:
      - name: success
        code: |
          ok, rep = run_pipeline([("a", lambda: True), ("b", lambda: True)])
          assert ok is True and rep == [("a", "ok"), ("b", "ok")]
      - name: stops
        code: |
          ran = []
          def c(): ran.append("c"); return True
          def boom(): raise RuntimeError("x")
          ok, rep = run_pipeline([("a", lambda: True), ("b", lambda: False), ("c", c)])
          assert ok is False and rep == [("a", "ok"), ("b", "failed")] and ran == []
          ok, rep = run_pipeline([("a", boom), ("c", c)])
          assert ok is False and rep == [("a", "failed")] and ran == []
          assert run_pipeline([]) == (True, [])
    hints:
      - "Wrap `fn()` in try/except and treat anything but `True` as a failure."
    solution: |
      def run_pipeline(stages):
          report = []
          for name, fn in stages:
              try:
                  ok = fn() is True
              except Exception:
                  ok = False
              report.append((name, "ok" if ok else "failed"))
              if not ok:
                  return False, report
          return True, report
    explanation: "Failing fast stops a broken change from reaching later stages like deployment."
  - id: canary-bucket
    title: Stable canary buckets
    difficulty: 3
    prompt: |
      Write `bucket(user_id)` returning `int(hashlib.sha256(user_id.encode()).hexdigest(), 16) % 100`, and `in_canary(user_id, percent)` returning `True` when `bucket(user_id) < percent`. The same user must always get the same answer, and `percent=0` selects nobody and `percent=100` everybody.
    starter: |
      import hashlib

      def bucket(user_id):
          pass

      def in_canary(user_id, percent):
          pass
    tests:
      - name: stable and ranged
        code: |
          users = ["u" + str(i) for i in range(500)]
          assert all(0 <= bucket(u) < 100 for u in users)
          assert all(bucket(u) == bucket(u) for u in users)
          assert not any(in_canary(u, 0) for u in users)
          assert all(in_canary(u, 100) for u in users)
          n = sum(in_canary(u, 10) for u in users)
          assert 20 <= n <= 90, n
          assert bucket("u1") == int(__import__("hashlib").sha256(b"u1").hexdigest(), 16) % 100
    hints:
      - "Follow the formula in the prompt."
    solution: |
      import hashlib


      def bucket(user_id):
          return int(hashlib.sha256(user_id.encode()).hexdigest(), 16) % 100


      def in_canary(user_id, percent):
          return bucket(user_id) < percent
    explanation: "Hashing gives a stable, roughly uniform assignment, so ramping from 1% to 100% only ever adds users."

commonMistakes:
  - title: "Letting main stay broken"
    explanation: "A red build blocks everyone. Fix or revert first."
  - title: "Treating metrics as goals"
    explanation: "Complexity and coverage are signals. Targeting the number invites gaming."
  - title: "Deploying without a rollback plan"
    explanation: "Know how to undo before you do. Keep database migrations backward-compatible."
  - title: "Never paying down technical debt"
    explanation: "The interest compounds until every change is slow and risky."

summary:
  - "Reviews, formatters, linters and type checkers catch problems early and automatically."
  - "Cyclomatic complexity counts decision paths and flags functions that are hard to test and read."
  - "CI builds and tests every change; delivery pipelines gate stages; canary, blue-green and feature flags release safely."
  - "Technical debt is a deliberate trade-off that must be tracked and paid down by interest."
