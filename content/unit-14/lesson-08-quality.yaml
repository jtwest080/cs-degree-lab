quiz:
  - type: mcq
    question: What does a linter do?
    options: ["Reads code without running it to flag likely mistakes", "Runs the program faster", "Deploys code", "Encrypts files"]
    answer: 0
    explanation: "It is static analysis."
  - type: mcq
    question: What is the cyclomatic complexity of a function with no branches or loops?
    options: ["1", "0", "2", "10"]
    answer: 0
    explanation: "One path through the code."
  - type: mcq
    question: What is the main point of continuous integration?
    options: ["Merge often and test every change automatically", "Release once a year", "Avoid tests", "Keep branches for months"]
    answer: 0
    explanation: "Problems surface while changes are small."
  - type: mcq
    question: What is a canary release?
    options: ["Sending the new version to a small share of users first", "Releasing to everyone at once", "A rollback", "A type of test"]
    answer: 0
    explanation: "You watch the metrics before widening."
  - type: mcq
    question: What does a feature flag separate?
    options: ["Deploying code from releasing a feature", "Tests from code", "Users from servers", "Files from folders"]
    answer: 0
    explanation: "Code ships switched off and is enabled later."
  - type: mcq
    question: Which technical debt should usually be paid first?
    options: ["Code that is changed often or causes incidents", "Code nobody touches", "Whatever is newest", "Whatever is shortest"]
    answer: 0
    explanation: "That is where the interest is highest."
  - type: code
    question: |
      Write `count_branches(source)` returning how many `if` statements (`ast.If`, including `elif`) the Python source contains.
    starter: |
      import ast

      def count_branches(source):
          pass
    tests:
      - name: counts ifs
        code: |
          assert count_branches("x = 1") == 0
          assert count_branches("if a:\n    pass\nelif b:\n    pass\nelse:\n    pass") == 2
          assert count_branches("if a:\n    if b:\n        pass") == 2
    solution: |
      import ast


      def count_branches(source):
          return sum(isinstance(n, ast.If) for n in ast.walk(ast.parse(source)))
