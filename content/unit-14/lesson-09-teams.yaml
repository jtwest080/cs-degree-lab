quiz:
  - type: mcq
    question: What is the critical path?
    options: ["The longest chain of dependent tasks", "The cheapest tasks", "The first task", "The most important feature"]
    answer: 0
    explanation: "It sets the minimum project duration."
  - type: mcq
    question: What is the PERT expected value of O=2, M=4, P=12?
    options: ["5", "6", "4", "7"]
    answer: 0
    explanation: "(2 + 16 + 12) / 6 = 5."
  - type: mcq
    question: What does Brooks's law say?
    options: ["Adding people to a late project makes it later", "More tests mean fewer bugs", "Code reviews are slow", "Deadlines are exact"]
    answer: 0
    explanation: "Training and communication cost time."
  - type: mcq
    question: Which licence type requires derived software to be released under the same terms?
    options: ["Copyleft such as GPL", "MIT", "BSD", "Apache 2.0"]
    answer: 0
    explanation: "Permissive licences allow closed use."
  - type: mcq
    question: What is data minimisation?
    options: ["Collecting only the personal data you need", "Compressing files", "Deleting all logs", "Using small variables"]
    answer: 0
    explanation: "Data you do not hold cannot leak."
  - type: mcq
    question: What does a bus factor of one mean?
    options: ["Only one person understands something critical", "One bus per team", "One release a year", "One test per function"]
    answer: 0
    explanation: "Losing that person would stop the work."
  - type: code
    question: |
      Write `expected(o, m, p)` returning the PERT expected duration `(o + 4m + p) / 6`, rounded to 2 decimals.
    starter: |
      def expected(o, m, p):
          pass
    tests:
      - name: pert
        code: |
          assert expected(2, 4, 12) == 5.0
          assert expected(1, 2, 3) == 2.0
          assert expected(3, 5, 13) == 6.0
    solution: |
      def expected(o, m, p):
          return round((o + 4 * m + p) / 6, 2)
