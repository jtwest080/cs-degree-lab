id: u14-teams
title: "Teams, Estimation and Professional Ethics"
minutes: 55
objective: |
  Learn how software is built by people working together: planning a project with dependencies and the critical path, estimating with three-point (PERT) estimates, working well in teams, documentation, and the ethical and legal responsibilities of an engineer, including licences, privacy and bias.
outcomes:
  - Compute a project schedule and critical path from tasks and dependencies
  - Use three-point (PERT) estimates to express uncertainty
  - "Describe habits of effective teams: communication, documentation and code ownership"
  - Distinguish common open-source licences and explain privacy duties
  - Apply a professional code of ethics to realistic dilemmas

sections:
  - heading: Planning with dependencies
    body: |
      A project is a set of **tasks**, each with a duration and some **dependencies** (tasks that must finish first). Drawn as a graph (Unit 7) this is a **precedence network**. Its most useful result is the **critical path**: the longest chain of dependent tasks from start to finish. Its length is the **shortest possible project duration**, because nothing can finish sooner than the longest chain. Tasks on that path have no **slack**: any delay to them delays the whole project. Tasks off it have slack, time they can slip without harm. Managers focus on the critical path: protect it, shorten it by splitting or parallelising the work, and add people with care. Adding staff to a late project often makes it later, because newcomers must be taught and communication grows with team size (**Brooks's law**: with n people there are n(n-1)/2 communication paths).

      Compute it with two passes: a **forward pass** finds the earliest each task can start (after all its dependencies finish) and finish; a **backward pass** finds the latest it can without delaying the end. The difference is the slack.

  - heading: Estimating under uncertainty
    body: |
      A single number hides how unsure you are. **Three-point estimation** asks for an **optimistic** (O), **most likely** (M) and **pessimistic** (P) duration. The PERT formula gives the expected value `(O + 4M + P) / 6` and a standard deviation `(P - O) / 6`. For a whole project of independent tasks along the critical path, add the expected values and **add the variances** (the squares of the deviations), so the total deviation is the square root of their sum. Then a range such as "expected 40 days, about 95% likely to finish within 40 + 2 x 3.2 = 46 days" is an honest commitment. Estimates improve by comparing with similar finished work, breaking work into small pieces, and tracking actual against estimate. Beware the **90% done** syndrome, and commitments pressed on people as promises: estimates are not deadlines.

  - heading: Working well together
    body: |
      Most project trouble is about people, not code. Effective teams share a few habits: a clear goal and **shared ownership** of the code (anyone may fix anything, with review); **psychological safety**, meaning people can raise problems or admit mistakes without being punished; frequent, direct communication; and written decisions. **Documentation** should be proportionate: a README that gets a newcomer running in ten minutes, decision records (Lesson 14.6), API docs generated from the code, and comments that explain *why*, not *what*. Code that needs a comment to say what it does should be clearer instead. Pair programming and mob programming spread knowledge; code review does too. Avoid the **bus factor** of one: if only one person understands something critical, you are one resignation away from trouble.

  - heading: Licences, privacy and ethics
    body: |
      Code you write belongs to someone and others may only use it under a **licence**. **Permissive** licences (MIT, BSD, Apache 2.0) allow almost any use, including in closed products, if you keep the notice. **Copyleft** licences (GPL) require that software built on the code be released under the same terms; the AGPL extends this to software offered over a network. Code with no licence is *not* free to use. You must follow the licences of your dependencies, and generated or copied code carries obligations too. **Open source** is a huge benefit but also a responsibility: maintainers are often unpaid, and vulnerabilities in widely used libraries affect everyone.

      Software handles personal data, so engineers have duties: collect only what you need (**data minimisation**), protect it (Unit 11), get meaningful consent, let people see and delete their data, and obey laws such as the EU's GDPR. Algorithms can embed **bias**: a model trained on past hiring decisions may repeat past discrimination, and a face-recognition system tested mostly on one group performs worse on others. Accessibility is an ethical requirement too, since software that excludes disabled users is simply incomplete.

      Professional bodies such as the ACM publish a **code of ethics**: contribute to society and avoid harm, be honest, respect privacy, give credit, and take responsibility. When you are asked to build something harmful or deceptive, "I was told to" is not a defence; the Volkswagen emissions scandal (software that detected tests and cheated them) ended in prison sentences for engineers. Raise concerns, document them, and know where you will draw the line.

examples:
  - title: Critical path
    intro: "Earliest finish times from a forward pass; the longest chain sets the project length."
    code: |
      tasks = {
          "design": (3, []),
          "backend": (5, ["design"]),
          "frontend": (4, ["design"]),
          "test": (2, ["backend", "frontend"]),
          "docs": (3, ["design"]),
      }

      finish = {}
      def earliest_finish(t):
          if t not in finish:
              duration, deps = tasks[t]
              finish[t] = duration + max((earliest_finish(d) for d in deps), default=0)
          return finish[t]

      total = max(earliest_finish(t) for t in tasks)
      print({t: earliest_finish(t) for t in tasks})
      print("project length:", total)
    output: |
      {'design': 3, 'backend': 8, 'frontend': 7, 'test': 10, 'docs': 6}
      project length: 10
    lines:
      - line: 12
        note: "A task finishes its own duration after the latest of its dependencies."
      - line: 17
        note: "design (3) + backend (5) + test (2) = 10 is the longest chain."
  - title: PERT estimates
    intro: "A weighted average that leans on the most likely value, plus a measure of spread."
    code: |
      import math

      tasks = [(2, 4, 8), (3, 5, 13), (1, 2, 3)]       # optimistic, likely, pessimistic

      total, var = 0, 0
      for o, m, p in tasks:
          expected = (o + 4 * m + p) / 6
          sd = (p - o) / 6
          total += expected
          var += sd ** 2
          print((o, m, p), "expected", round(expected, 2), "sd", round(sd, 2))
      print("total", round(total, 2), "sd", round(math.sqrt(var), 2))
      print("95% by", round(total + 2 * math.sqrt(var), 1))
    output: |
      (2, 4, 8) expected 4.33 sd 1.0
      (3, 5, 13) expected 6.0 sd 1.67
      (1, 2, 3) expected 2.0 sd 0.33
      total 12.33 sd 1.97
      95% by 16.3
    lines:
      - line: 8
        note: "The expected value weighs the most likely case four times."
      - line: 12
        note: "Variances add, not standard deviations, for independent tasks."
  - title: Brooks's law
    intro: "Communication paths grow roughly with the square of team size."
    code: |
      for n in (2, 5, 10, 20, 50):
          print(n, "people ->", n * (n - 1) // 2, "paths")
    output: |
      2 people -> 1 paths
      5 people -> 10 paths
      10 people -> 45 paths
      20 people -> 190 paths
      50 people -> 1225 paths
    lines:
      - line: 2
        note: "Each pair of people is a path that can break down."
  - title: Licence compatibility check
    intro: "A simplified rule: can code under each licence be included in a closed-source product?"
    code: |
      LICENCES = {
          "MIT": {"closed_ok": True},
          "Apache-2.0": {"closed_ok": True},
          "BSD-3-Clause": {"closed_ok": True},
          "GPL-3.0": {"closed_ok": False},
          "AGPL-3.0": {"closed_ok": False},
      }

      def blockers(deps):
          return sorted(name for name, lic in deps.items() if not LICENCES.get(lic, {"closed_ok": False})["closed_ok"])

      deps = {"requests": "Apache-2.0", "left-pad": "MIT", "fancylib": "GPL-3.0", "mystery": "none"}
      print(blockers(deps))
    output: |
      ['fancylib', 'mystery']
    lines:
      - line: 10
        note: "Unknown or missing licences count as blockers: no licence means no permission."
      - line: 13
        note: "A real check needs a lawyer. This only shows the idea of auditing dependencies."

playground:
  prompt: |
