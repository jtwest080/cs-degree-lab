exercises:
  - id: critical-path
    title: Find the project length
    difficulty: 4
    prompt: |
      `tasks` maps a name to `(duration, [dependencies])`. Write `project_length(tasks)` returning the total duration of the longest dependency chain, and `critical_path(tasks)` returning the list of task names on that longest chain in order. If two chains tie, the one whose last task name comes first alphabetically wins, and so on back along the chain (use the dependency with the largest finish time, breaking ties alphabetically). An empty dictionary has length 0 and path `[]`.
    starter: |
      def project_length(tasks):
          pass

      def critical_path(tasks):
          pass
    tests:
      - name: length
        code: |
          t = {"design": (3, []), "backend": (5, ["design"]), "frontend": (4, ["design"]),
               "test": (2, ["backend", "frontend"]), "docs": (3, ["design"])}
          assert project_length(t) == 10
          assert project_length({}) == 0
          assert project_length({"a": (4, [])}) == 4
      - name: path
        code: |
          t = {"design": (3, []), "backend": (5, ["design"]), "frontend": (4, ["design"]),
               "test": (2, ["backend", "frontend"]), "docs": (3, ["design"])}
          assert critical_path(t) == ["design", "backend", "test"]
          assert critical_path({}) == []
          assert critical_path({"a": (1, []), "b": (1, ["a"]), "c": (9, [])}) == ["c"]
    hints:
      - "Compute `finish[t] = duration + max(finish of deps)` with memoised recursion."
      - "Start from the task with the largest finish (ties: smallest name) and repeatedly step to its dependency with the largest finish."
    solution: |
      def _finish_times(tasks):
          finish = {}

          def f(t):
              if t not in finish:
                  d, deps = tasks[t]
                  finish[t] = d + max((f(x) for x in deps), default=0)
              return finish[t]

          for t in tasks:
              f(t)
          return finish


      def project_length(tasks):
          finish = _finish_times(tasks)
          return max(finish.values(), default=0)


      def critical_path(tasks):
          if not tasks:
              return []
          finish = _finish_times(tasks)
          best = max(sorted(tasks), key=lambda t: finish[t])
          path = [best]
          while tasks[path[-1]][1]:
              deps = tasks[path[-1]][1]
              nxt = max(sorted(deps), key=lambda t: finish[t])
              path.append(nxt)
          return path[::-1]
    explanation: "Memoised recursion over the dependency graph gives each task's earliest finish; walking back along the largest finish recovers the critical path."
  - id: pert
    title: PERT estimate
    difficulty: 3
    prompt: |
      Write `pert(tasks)` where `tasks` is a list of `(optimistic, likely, pessimistic)` tuples. Return `(expected_total, std_dev)`: the sum of each task's `(o + 4m + p) / 6`, and the square root of the sum of each task's `((p - o) / 6) ** 2`, both rounded to 2 decimals. An empty list gives `(0.0, 0.0)`.
    starter: |
      import math

      def pert(tasks):
          pass
    tests:
      - name: estimates
        code: |
          assert pert([(2, 4, 8), (3, 5, 13), (1, 2, 3)]) == (13.0, 2.0) or True
          r = pert([(2, 4, 8), (3, 5, 13), (1, 2, 3)])
          assert r == (round(26/6 + 36/6 + 2, 2), round(((6/6)**2 + (10/6)**2 + (2/6)**2) ** 0.5, 2)), r
          assert pert([(1, 1, 1)]) == (1.0, 0.0)
          assert pert([]) == (0.0, 0.0)
    hints:
      - "Add variances, then take the square root once at the end."
    solution: |
      import math


      def pert(tasks):
          total = sum((o + 4 * m + p) / 6 for o, m, p in tasks)
          var = sum(((p - o) / 6) ** 2 for o, m, p in tasks)
          return round(total, 2), round(math.sqrt(var), 2)
    explanation: "Uncertainty adds in squares: independent errors partly cancel, so the total is less uncertain than the sum of its parts."
  - id: license-audit
    title: Audit licences
    difficulty: 2
    prompt: |
      Write `audit(deps, allowed)` where `deps` maps a package name to its licence string and `allowed` is a set of acceptable licences. Return the sorted list of package names whose licence is **not** in `allowed` (a missing licence of `None` is never allowed).
    starter: |
      def audit(deps, allowed):
          pass
    tests:
      - name: audit
        code: |
          deps = {"a": "MIT", "b": "GPL-3.0", "c": None, "d": "Apache-2.0"}
          assert audit(deps, {"MIT", "Apache-2.0"}) == ["b", "c"]
          assert audit(deps, {"MIT", "Apache-2.0", "GPL-3.0"}) == ["c"]
          assert audit({}, {"MIT"}) == []
    hints:
      - "`lic not in allowed` is already true for `None` unless `None` is in the set. Guard it explicitly."
    solution: |
      def audit(deps, allowed):
          return sorted(name for name, lic in deps.items() if lic is None or lic not in allowed)
    explanation: "Automated dependency audits are a normal part of a CI pipeline."
  - id: team-paths
    title: Communication paths
    difficulty: 1
    prompt: |
      Write `paths(n)` returning the number of pairwise communication paths in a team of `n` people, `n * (n - 1) // 2`, and `team_for_paths(limit)` returning the largest team size whose paths do not exceed `limit` (at least 1).
    starter: |
      def paths(n):
          pass

      def team_for_paths(limit):
          pass
    tests:
      - name: paths
        code: |
          assert paths(1) == 0 and paths(2) == 1 and paths(5) == 10 and paths(10) == 45
      - name: limit
        code: |
          assert team_for_paths(10) == 5
          assert team_for_paths(44) == 9
          assert team_for_paths(45) == 10
          assert team_for_paths(0) == 1
    hints:
      - "Increase n while `paths(n + 1) <= limit`."
    solution: |
      def paths(n):
          return n * (n - 1) // 2


      def team_for_paths(limit):
          n = 1
          while paths(n + 1) <= limit:
              n += 1
          return n
    explanation: "Quadratic growth is why big teams split into smaller ones with clear interfaces."

commonMistakes:
  - title: "Adding people to a late project"
    explanation: "Onboarding and communication costs usually slow the work first."
  - title: "Treating estimates as promises"
    explanation: "Give a range with a confidence level, and update it as you learn."
  - title: "Copying code without checking the licence"
    explanation: "No licence means no permission, and copyleft code can force your project's licence."
  - title: "Collecting personal data 'just in case'"
    explanation: "Data you hold can leak or be misused. Collect only what you need."
  - title: "Assuming algorithms are neutral"
    explanation: "Models learn the biases in their data. Test across different groups."

summary:
  - "The critical path is the longest dependency chain and sets the shortest possible project length."
  - "Three-point (PERT) estimates, (O + 4M + P) / 6, add variances to express uncertainty honestly."
  - "Teams need shared ownership, safe communication and proportionate documentation; adding people to a late project often slows it."
  - "Licences, privacy law, bias and professional codes of ethics are part of an engineer's responsibility."
