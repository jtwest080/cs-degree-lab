title: Mini Git
language: python
brief: |-
  You will build **Mini Git**: a small version-control system that stores snapshots, branches, and merges with a three-way merge, using ideas from every lesson in this unit.

  A repository holds commits. A **commit** is a snapshot: a dictionary mapping each file name to its text, plus a message and a list of parent commit ids. A **branch** is a name pointing at a tip commit. Write the class `Repo` with these methods:

  - `commit(files, message)` snapshots `files` (the complete set of files, replacing everything) on the current branch. Its parent is the branch's current tip (no parents for the first commit). The id is the first 7 hex characters of `sha1` of `json.dumps({"files": files, "message": message, "parents": parents}, sort_keys=True)`. The branch moves to the new commit, and the id is returned.
  - `branch(name)` creates a branch at the current tip (which may be `None` in an empty repository). Raise `ValueError` if it already exists.
  - `checkout(name)` makes `name` current and returns a **copy** of its tip's files (`{}` if empty). Raise `ValueError` for an unknown branch.
  - `log()` returns `[(id, message), ...]` for the current branch, newest first, following the **first parent** of each commit.
  - `merge_base(a, b)` returns the closest common ancestor of two commits (a commit counts as its own ancestor; `None` if there is none, or if either argument is `None`). Closest means a common ancestor that is not an ancestor of any other common ancestor; if there are several, return the smallest id.
  - `merge(name)` merges branch `name` into the current branch and returns a tuple:
    - `("up-to-date", tip)` if `name` is empty or already contained in the current branch;
    - `("fast-forward", tip)` if the current branch is empty or is contained in `name`: just move the current branch pointer;
    - otherwise do a **three-way merge** against the merge base (an empty file set if there is none). For every file name, with `b`, `o`, `t` the base, our and their text (`None` if the file is missing): if `o == t` take it; else if `o == b` take theirs; else if `t == b` take ours; else it is a **conflict**. A result of `None` means the file is deleted. If there are conflicts, return `("conflict", sorted_file_names)` and change nothing. Otherwise create a commit with message `"Merge " + name`, the merged files, and parents `[our_tip, their_tip]`, move the current branch to it, and return `("merged", id)`.
steps:
- title: Commits and ids
  body: |-
    Store commits in `self.commits` as `{id: {"files": ..., "message": ..., "parents": [...]}}`. A small helper that builds the id from `json.dumps(..., sort_keys=True)` and stores the commit will be used by both `commit` and `merge` (Lesson 14.2).
- title: Branches are pointers
  body: |-
    `branch` copies the current tip id; `checkout` changes `self.current`. Nothing about the history is copied. Return a *copy* of the files so a caller cannot change the stored snapshot by accident.
- title: Walking history
  body: |-
    `log` follows `parents[0]` until there are none. For `merge_base`, collect the ancestors of each commit with a stack and a `seen` set (they include the commit itself), intersect them, and remove any common ancestor that is an ancestor of another one (Lesson 14.2).
- title: Fast-forward and up-to-date
  body: |-
    `theirs in ancestors(ours)` means there is nothing to merge. `ours in ancestors(theirs)` (or an empty current branch) means moving the pointer is enough. Check up-to-date first so merging a branch into itself does nothing.
- title: Three-way merge
  body: |-
    Loop over the sorted union of file names in the base and both sides. Apply the rules in order: equal sides, only they changed, only we changed, otherwise conflict. Leave out files whose result is `None`. If any file conflicted, return early without storing anything.
checklist:
- text: commit stores snapshots with deterministic 7-character ids
  test: commit ids and log
- text: log walks the first-parent history, newest first
  test: commit ids and log
- text: branch and checkout move pointers without copying history
  test: branching
- text: invalid branch operations raise ValueError
  test: branch errors
- text: an empty repository behaves sensibly
  test: empty repository
- text: merge_base finds the closest common ancestor
  test: merge base
- text: merge reports up-to-date and fast-forwards when it can
  test: up to date and fast forward
- text: a clean three-way merge makes a two-parent commit
  test: clean three-way merge
- text: identical changes and deletions merge correctly
  test: same change on both sides and deletions
- text: conflicts are reported and change nothing
  test: conflicts
- text: delete-versus-edit is a conflict
  test: delete versus edit conflict
- text: repeated merges keep the history right
  test: history after merging twice
- text: unrelated histories merge from an empty base
  test: unrelated histories
starter: |
  import hashlib
  import json


  class Repo:
      """A tiny version-control system. See the steps for the exact behaviour."""

      def __init__(self):
          self.commits = {}              # id -> {"files": {...}, "message": str, "parents": [ids]}
          self.branches = {"main": None}  # branch name -> tip commit id (None while empty)
          self.current = "main"

      def commit(self, files, message):
          pass

      def branch(self, name):
          pass

      def checkout(self, name):
          pass

      def log(self):
          pass

      def merge_base(self, a, b):
          pass

      def merge(self, name):
          pass
