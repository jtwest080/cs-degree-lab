solution: |
  import hashlib
  import json


  class Repo:
      def __init__(self):
          self.commits = {}
          self.branches = {"main": None}
          self.current = "main"

      # -- helpers -----------------------------------------------------------
      def _tip(self):
          return self.branches[self.current]

      def _make(self, files, message, parents):
          body = json.dumps({"files": files, "message": message, "parents": parents}, sort_keys=True)
          cid = hashlib.sha1(body.encode()).hexdigest()[:7]
          self.commits[cid] = {"files": dict(files), "message": message, "parents": list(parents)}
          return cid

      def _ancestors(self, cid):
          seen, stack = set(), [cid] if cid else []
          while stack:
              c = stack.pop()
              if c not in seen:
                  seen.add(c)
                  stack.extend(self.commits[c]["parents"])
          return seen

      # -- public API --------------------------------------------------------
      def commit(self, files, message):
          tip = self._tip()
          cid = self._make(files, message, [tip] if tip else [])
          self.branches[self.current] = cid
          return cid

      def branch(self, name):
          if name in self.branches:
              raise ValueError("branch exists: " + name)
          self.branches[name] = self._tip()

      def checkout(self, name):
          if name not in self.branches:
              raise ValueError("no such branch: " + name)
          self.current = name
          tip = self._tip()
          return dict(self.commits[tip]["files"]) if tip else {}

      def log(self):
          out, c = [], self._tip()
          while c:
              out.append((c, self.commits[c]["message"]))
              parents = self.commits[c]["parents"]
              c = parents[0] if parents else None
          return out

      def merge_base(self, a, b):
          common = self._ancestors(a) & self._ancestors(b)
          best = [c for c in common if not any(c != o and c in self._ancestors(o) for o in common)]
          return sorted(best)[0] if best else None

      def merge(self, name):
          if name not in self.branches:
              raise ValueError("no such branch: " + name)
          ours, theirs = self._tip(), self.branches[name]
          if theirs is None or theirs in self._ancestors(ours):
              return ("up-to-date", ours)
          if ours is None or ours in self._ancestors(theirs):
              self.branches[self.current] = theirs
              return ("fast-forward", theirs)
          base = self.merge_base(ours, theirs)
          bf = self.commits[base]["files"] if base else {}
          of, tf = self.commits[ours]["files"], self.commits[theirs]["files"]
          merged, conflicts = {}, []
          for f in sorted(set(bf) | set(of) | set(tf)):
              b, o, t = bf.get(f), of.get(f), tf.get(f)
              if o == t:
                  result = o
              elif o == b:
                  result = t
              elif t == b:
                  result = o
              else:
                  conflicts.append(f)
                  continue
              if result is not None:
                  merged[f] = result
          if conflicts:
              return ("conflict", conflicts)
          cid = self._make(merged, "Merge " + name, [ours, theirs])
          self.branches[self.current] = cid
          return ("merged", cid)
stretch:
- Add `diff(a, b)` returning which files were added, removed or changed between two commits (Lesson 14.2).
- Add `tag(name)` (a fixed pointer to a commit) and `reset(commit_id)` that moves the current branch back, then explain why reset can lose work.
- Make `merge` choose a message from an optional argument, and keep conflicting files as text with conflict markers like real Git (Lesson 14.2).
- Add a simple line-by-line merge so that two people editing different lines of the same file do not conflict.
- Write a `Pipeline` that refuses to `merge` unless a list of checks passes (Lesson 14.8).
