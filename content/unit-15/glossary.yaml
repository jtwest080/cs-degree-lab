# Terms introduced in Unit 15 (Theory of Computation). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Theory of computation"
    definition: "The study of what problems can be solved by machines and how efficiently."
    lesson: u15-languages
  - term: "Alphabet"
    definition: "A finite set of symbols from which strings are built."
    lesson: u15-languages
  - term: "String"
    definition: "A finite sequence of symbols from an alphabet."
    lesson: u15-languages
  - term: "Empty string"
    definition: "The string of length zero, written epsilon."
    lesson: u15-languages
  - term: "Language"
    definition: "A set of strings over an alphabet."
    lesson: u15-languages
  - term: "Kleene star"
    definition: "The operation giving zero or more strings of a language joined in a row."
    lesson: u15-languages
  - term: "Shortlex order"
    definition: "Listing strings by length, and alphabetically within each length."
    lesson: u15-languages
  - term: "Decision problem"
    definition: "A yes-or-no question about an input, equivalent to deciding membership in a language."
    lesson: u15-languages
  - term: "Proof by induction"
    definition: "Proving a claim for all natural numbers from a base case and an inductive step."
    lesson: u15-languages
  - term: "Diagonalisation"
    definition: "A proof technique that builds an object differing from every item in a list."
    lesson: u15-languages
  - term: "Countable set"
    definition: "A set whose elements can be listed one after another in a sequence."
    lesson: u15-languages
  - term: "Uncountable set"
    definition: "An infinite set that cannot be listed, such as the infinite binary sequences."
    lesson: u15-languages
  - term: "Finite automaton"
    definition: "A machine with a finite number of states that reads input one symbol at a time."
    lesson: u15-dfa
  - term: "DFA"
    definition: "Deterministic finite automaton: a finite automaton with exactly one move for each state and symbol."
    lesson: u15-dfa
  - term: "Transition function"
    definition: "The rule giving the next state for each current state and input symbol."
    lesson: u15-dfa
  - term: "Accepting state"
    definition: "A state in which finishing the input means the string is accepted."
    lesson: u15-dfa
  - term: "Regular language"
    definition: "A language recognised by some finite automaton or described by a regular expression."
    lesson: u15-dfa
  - term: "Dead state"
    definition: "A trap state that a machine can never leave and that is not accepting."
    lesson: u15-dfa
  - term: "Product construction"
    definition: "Running two automata at once on pairs of states to build union or intersection."
    lesson: u15-dfa
  - term: "Closure property"
    definition: "A fact that combining languages in some way gives a language of the same kind."
    lesson: u15-dfa
  - term: "Equivalent states"
    definition: "States that no input string can tell apart."
    lesson: u15-dfa
  - term: "DFA minimisation"
    definition: "Merging equivalent states to get the smallest DFA for a language."
    lesson: u15-dfa
  - term: "NFA"
    definition: "Nondeterministic finite automaton: a finite automaton that may have several or no moves for a symbol."
    lesson: u15-nfa
  - term: "Epsilon transition"
    definition: "A move that reads no input symbol."
    lesson: u15-nfa
  - term: "Epsilon closure"
    definition: "The states reachable from a set of states using only epsilon moves."
    lesson: u15-nfa
  - term: "Subset construction"
    definition: "Converting an NFA to a DFA whose states are sets of NFA states."
    lesson: u15-nfa
  - term: "Regular expression"
    definition: "An expression built from symbols, union, concatenation and star that describes a regular language."
    lesson: u15-regex
  - term: "Kleene's theorem"
    definition: "The result that regular expressions, DFAs and NFAs describe the same languages."
    lesson: u15-regex
  - term: "Thompson's construction"
    definition: "A method of building an NFA from a regular expression."
    lesson: u15-regex
  - term: "Brzozowski derivative"
    definition: "The language of strings that remain after removing a given first symbol from a language's strings."
    lesson: u15-regex
  - term: "Pumping lemma"
    definition: "A property of regular languages that long strings contain a part that can be repeated, used to prove languages non-regular."
    lesson: u15-regex
  - term: "Pumping length"
    definition: "The number p in the pumping lemma beyond which strings can be pumped."
    lesson: u15-regex
  - term: "Backreference"
    definition: "A regex feature that matches a copy of earlier matched text, going beyond regular languages."
    lesson: u15-regex
  - term: "Catastrophic backtracking"
    definition: "Exponential matching time caused by a backtracking engine trying many ways to split a string."
    lesson: u15-regex
  - term: "Context-free grammar"
    definition: "A set of rules replacing variables by strings of variables and terminals to generate a language."
    lesson: u15-cfg
  - term: "Production rule"
    definition: "A grammar rule saying a variable can be replaced by a given string."
    lesson: u15-cfg
  - term: "Terminal"
    definition: "A symbol that appears in the strings of a grammar's language."
    lesson: u15-cfg
  - term: "Derivation"
    definition: "A sequence of rule applications leading from the start variable to a string."
    lesson: u15-cfg
  - term: "Parse tree"
    definition: "A tree showing how a string is derived from a grammar's start variable."
    lesson: u15-cfg
  - term: "Ambiguous grammar"
    definition: "A grammar in which some string has more than one parse tree."
    lesson: u15-cfg
  - term: "Context-free language"
    definition: "A language generated by a context-free grammar."
    lesson: u15-cfg
  - term: "Pushdown automaton"
    definition: "A finite automaton equipped with a stack."
    lesson: u15-cfg
  - term: "Chomsky normal form"
    definition: "A grammar form whose rules are either two variables or a single terminal."
    lesson: u15-cfg
  - term: "CYK algorithm"
    definition: "A dynamic-programming algorithm that decides whether a grammar in Chomsky normal form generates a string."
    lesson: u15-cfg
  - term: "Turing machine"
    definition: "A finite controller with an unbounded tape and a head that reads, writes and moves."
    lesson: u15-turing
  - term: "Tape"
    definition: "The unbounded memory of a Turing machine, made of cells each holding one symbol."
    lesson: u15-turing
  - term: "Configuration"
    definition: "A snapshot of a machine: its state, tape contents and head position."
    lesson: u15-turing
  - term: "Halting"
    definition: "A machine entering an accepting or rejecting state so that its computation ends."
    lesson: u15-turing
  - term: "Decidable language"
    definition: "A language for which some Turing machine always halts with the right answer."
    lesson: u15-turing
  - term: "Recognisable language"
    definition: "A language for which some Turing machine halts and accepts exactly its strings."
    lesson: u15-turing
  - term: "Church-Turing thesis"
    definition: "The claim that anything effectively computable can be computed by a Turing machine."
    lesson: u15-turing
  - term: "Universal Turing machine"
    definition: "A Turing machine that simulates any other machine given its description and input."
    lesson: u15-turing
  - term: "Halting problem"
    definition: "The problem of deciding whether a program halts on a given input, which is undecidable."
    lesson: u15-computability
  - term: "Undecidable problem"
    definition: "A problem for which no program is correct on every input."
    lesson: u15-computability
  - term: "Computability"
    definition: "The study of which problems can be solved by any program at all."
    lesson: u15-computability
  - term: "Reduction"
    definition: "A conversion of instances of one problem into instances of another that preserves the answer."
    lesson: u15-computability
  - term: "Rice's theorem"
    definition: "The result that every non-trivial question about what a program computes is undecidable."
    lesson: u15-computability
  - term: "Self-reference"
    definition: "An object referring to or acting on itself, the source of paradoxes and of the halting proof."
    lesson: u15-computability
  - term: "Time complexity"
    definition: "How the running time of an algorithm grows with the size of its input."
    lesson: u15-complexity
  - term: "Complexity class"
    definition: "A set of problems solvable within some resource bound."
    lesson: u15-complexity
  - term: "P"
    definition: "The class of decision problems solvable in polynomial time."
    lesson: u15-complexity
  - term: "NP"
    definition: "The class of decision problems whose yes-answers can be verified in polynomial time."
    lesson: u15-complexity
  - term: "Verifier"
    definition: "An algorithm that checks a certificate against an input."
    lesson: u15-complexity
  - term: "P versus NP"
    definition: "The open question of whether every quickly verifiable problem is also quickly solvable."
    lesson: u15-complexity
  - term: "SAT"
    definition: "The problem of deciding whether a Boolean formula can be made true by some assignment."
    lesson: u15-complexity
  - term: "Hamiltonian path"
    definition: "A path through a graph that visits every vertex exactly once."
    lesson: u15-complexity
  - term: "Clique"
    definition: "A set of vertices in which every pair is joined by an edge."
    lesson: u15-complexity
  - term: "coNP"
    definition: "The class of problems whose no-answers have short certificates."
    lesson: u15-complexity
  - term: "PSPACE"
    definition: "The class of problems solvable using a polynomial amount of memory."
    lesson: u15-complexity
  - term: "Polynomial-time reduction"
    definition: "A reduction computable in polynomial time that preserves yes and no answers."
    lesson: u15-npcomplete
  - term: "NP-hard"
    definition: "At least as hard as every problem in NP."
    lesson: u15-npcomplete
  - term: "NP-complete"
    definition: "In NP and NP-hard: a hardest problem in NP."
    lesson: u15-npcomplete
  - term: "Cook-Levin theorem"
    definition: "The theorem that SAT is NP-complete."
    lesson: u15-npcomplete
  - term: "3-SAT"
    definition: "SAT restricted to formulas whose clauses each have three literals."
    lesson: u15-npcomplete
  - term: "Independent set"
    definition: "A set of vertices with no edge between any two of them."
    lesson: u15-npcomplete
  - term: "Vertex cover"
    definition: "A set of vertices that touches every edge of a graph."
    lesson: u15-npcomplete
  - term: "DPLL"
    definition: "A backtracking SAT algorithm using unit propagation."
    lesson: u15-npcomplete
  - term: "Unit propagation"
    definition: "Forcing the one remaining literal of a clause to be true and simplifying."
    lesson: u15-npcomplete
  - term: "Approximation algorithm"
    definition: "A polynomial-time algorithm with a proven bound on how far its answer is from optimal."
    lesson: u15-npcomplete
  - term: "Heuristic"
    definition: "A method that usually gives good answers quickly but has no guarantee."
    lesson: u15-npcomplete
  - term: "Fixed-parameter tractable"
    definition: "Solvable in time exponential only in a small parameter and polynomial in the input size."
    lesson: u15-npcomplete
