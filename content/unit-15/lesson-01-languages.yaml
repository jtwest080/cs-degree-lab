exercises:
  - id: shortlex
    title: Shortlex order
    difficulty: 2
    prompt: |
      Write `shortlex(alphabet, count)` returning a list of the first `count` strings over `alphabet` (a string such as `"ab"`) in shortlex order: shorter strings first, and strings of the same length in dictionary order given by the alphabet's order. The first string is the empty string.
    starter: |
      def shortlex(alphabet, count):
          pass
    tests:
      - name: order
        code: |
          assert shortlex("01", 8) == ["", "0", "1", "00", "01", "10", "11", "000"]
          assert shortlex("ab", 4) == ["", "a", "b", "aa"]
          assert shortlex("x", 4) == ["", "x", "xx", "xxx"]
          assert shortlex("01", 0) == []
          assert shortlex("abc", 8)[-1] == "ba"
    hints:
      - "Build length by length with `itertools.product(alphabet, repeat=n)`."
      - "Stop as soon as you have `count` strings."
    solution: |
      from itertools import product


      def shortlex(alphabet, count):
          out = []
          n = 0
          while len(out) < count:
              for tup in product(alphabet, repeat=n):
                  if len(out) == count:
                      break
                  out.append("".join(tup))
              n += 1
          return out
    explanation: "Because there are finitely many strings of each length, listing by length reaches every string after finitely many steps. That is why Σ* is countable."
  - id: count-strings
    title: Count strings in a language
    difficulty: 3
    prompt: |
      Write `count_language(pred, alphabet, n)` returning how many strings of **exactly** length `n` over `alphabet` satisfy the predicate `pred(w)`. Then write `no_double_one(w)` which is `True` when the binary string `w` has no two consecutive `1`s.
    starter: |
      from itertools import product

      def count_language(pred, alphabet, n):
          pass

      def no_double_one(w):
          pass
    tests:
      - name: counts
        code: |
          assert count_language(lambda w: True, "01", 4) == 16
          assert count_language(lambda w: w.count("1") % 2 == 0, "01", 4) == 8
          assert count_language(lambda w: False, "01", 3) == 0
          assert count_language(lambda w: True, "01", 0) == 1
      - name: no double one
        code: |
          assert no_double_one("") and no_double_one("0101") and no_double_one("1")
          assert not no_double_one("0110") and not no_double_one("11")
          assert [count_language(no_double_one, "01", n) for n in range(1, 8)] == [2, 3, 5, 8, 13, 21, 34]
    hints:
      - "Loop over `product(alphabet, repeat=n)`, join each tuple and count when `pred` is true."
      - "`no_double_one` is `'11' not in w`."
    solution: |
      from itertools import product


      def count_language(pred, alphabet, n):
          return sum(1 for t in product(alphabet, repeat=n) if pred("".join(t)))


      def no_double_one(w):
          return "11" not in w
    explanation: "The counts of binary strings with no two 1s in a row are the Fibonacci numbers: 2, 3, 5, 8, 13... (Unit 8's dynamic programming in disguise)."
  - id: language-ops
    title: Operations on finite languages
    difficulty: 3
    prompt: |
      Write `concat(A, B)` returning the set of all `a + b` for `a` in `A` and `b` in `B`; `power(A, k)` returning `A` concatenated with itself `k` times (`power(A, 0) == {""}`); and `star_upto(A, maxlen)` returning every string of `A*` whose length is at most `maxlen`.
    starter: |
      def concat(A, B):
          pass

      def power(A, k):
          pass

      def star_upto(A, maxlen):
          pass
    tests:
      - name: concat and power
        code: |
          assert concat({"a", "b"}, {"x"}) == {"ax", "bx"}
          assert concat({""}, {"x", "y"}) == {"x", "y"}
          assert concat(set(), {"x"}) == set()
          assert power({"a", "bb"}, 0) == {""}
          assert power({"a", "bb"}, 2) == {"aa", "abb", "bba", "bbbb"}
      - name: star
        code: |
          assert star_upto({"ab"}, 5) == {"", "ab", "abab"}
          assert star_upto({"a", "bb"}, 3) == {"", "a", "aa", "bb", "aaa", "abb", "bba"}
          assert star_upto(set(), 3) == {""}
    hints:
      - "A set comprehension with two `for` clauses does `concat`."
      - "For the star, start from `{''}` and keep concatenating `A`, discarding strings longer than `maxlen`, until nothing new appears."
    solution: |
      def concat(A, B):
          return {a + b for a in A for b in B}


      def power(A, k):
          result = {""}
          for _ in range(k):
              result = concat(result, A)
          return result


      def star_upto(A, maxlen):
          result = {""}
          while True:
              bigger = result | {s for s in concat(result, A) if len(s) <= maxlen}
              if bigger == result:
                  return result
              result = bigger
    explanation: "A* is the union of A^0, A^1, A^2, ... The length cap keeps the computation finite."
  - id: diagonal
    title: Diagonalise a list
    difficulty: 3
    prompt: |
      Write `diagonal(rows)` where `rows` is a list of `n` binary strings, each of length at least `n`. Return the string of length `n` whose `i`-th character is the opposite (`'0'` ↔ `'1'`) of the `i`-th character of `rows[i]`. Then write `escapes(rows)` returning `True` when that string is different from every row.
    starter: |
      def diagonal(rows):
          pass

      def escapes(rows):
          pass
    tests:
      - name: diagonal
        code: |
          assert diagonal(["0110", "1010", "1111", "0001"]) == "1100"
          assert diagonal(["0"]) == "1"
          assert diagonal([]) == ""
      - name: always escapes
        code: |
          assert escapes(["0110", "1010", "1111", "0001"])
          import random
          random.seed(3)
          for _ in range(50):
              n = random.randint(1, 8)
              rows = ["".join(random.choice("01") for _ in range(n)) for _ in range(n)]
              assert escapes(rows)
    hints:
      - "`'1' if row[i] == '0' else '0'` flips one character."
      - "`escapes` is `diagonal(rows) not in rows` when rows have the same length as the diagonal; be careful if rows are longer."
    solution: |
      def diagonal(rows):
          return "".join("1" if row[i] == "0" else "0" for i, row in enumerate(rows))


      def escapes(rows):
          d = diagonal(rows)
          return all(row[: len(d)] != d for row in rows)
    explanation: "The new string differs from row i at position i. Applied to an infinite list it produces a sequence that is nowhere in the list, which is Cantor's proof that the real numbers cannot be listed."

commonMistakes:
  - title: "Confusing ε with the empty set"
    explanation: "ε is a string of length 0. The language {ε} has one string; the language ∅ has none. They are different languages."
  - title: "Thinking a test is a proof"
    explanation: "Testing a claim for many values of n never proves it for all n. Use induction."
  - title: "Forgetting the base case of an induction"
    explanation: "Without the base case the dominoes never start falling. Also check that the inductive step really works from n to n + 1."
  - title: "Assuming all infinite sets are the same size"
    explanation: "The strings can be listed; the infinite binary sequences cannot. That difference is the source of non-computable problems."

summary:
  - "Computation theory asks what can be computed at all and what can be computed efficiently, using precise models of machines."
  - "An alphabet is a finite set of symbols, a string is a finite sequence, a language is a set of strings; Σ* is the (countable) set of all strings."
  - "Every yes/no problem is a language-membership question; a machine decides a language if it answers correctly for every string."
  - "Proof tools: direct proof, contradiction, induction, counting (pigeonhole) and diagonalisation."
  - "Diagonalisation shows there are uncountably many languages but only countably many programs, so most languages are undecidable."
