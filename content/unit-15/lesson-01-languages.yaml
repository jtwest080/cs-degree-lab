id: u15-languages
title: "Strings, Languages and Proofs"
minutes: 55
objective: |
  Meet the vocabulary of the theory of computation: alphabets, strings and languages, where a "problem" is the question of whether a string belongs to a set. Learn the proof techniques you will use for the rest of the unit: direct proof, contradiction, induction and the counting and diagonal arguments.
outcomes:
  - Define alphabets, strings, languages and the operations on them
  - Express a decision problem as a language-membership question
  - Enumerate the strings of a language in length order
  - Write proofs by induction and by contradiction in small examples
  - Explain Cantor's diagonal argument and why some sets cannot be listed

sections:
  - heading: What the theory of computation asks
    body: |
      Two big questions sit behind everything in this unit. **What can computers do at all?** (Computability: some problems have no program, however clever or powerful the machine.) **What can they do efficiently?** (Complexity: some problems have a program but not one that finishes before the universe ends.) The surprise is that these questions have precise, provable answers. To get there we strip computing to its core: a machine reads a finite input, follows fixed rules, and says yes or no.

      Proving things about "all possible programs" needs a precise model. We study a ladder of ever more powerful models: **finite automata** (no memory beyond a state), **pushdown automata** (one stack), and **Turing machines** (unlimited tape). Each rung can solve problems the one below cannot, and the top rung is believed to capture everything any computer can do. This is the content of the Church-Turing thesis (Lesson 15.6).

  - heading: Alphabets, strings and languages
    body: |
      An **alphabet** is a finite set of symbols, written Σ (sigma). Σ = {0, 1} is the binary alphabet; Σ = {a, b, ..., z} the lower-case letters. A **string** is a finite sequence of symbols from Σ; its **length** `|w|` is the number of symbols. The **empty string** ε (epsilon) has length 0 and is not the same as "nothing": it is a string, just a short one. **Concatenation** joins strings: if x = 01 and y = 10 then xy = 0110, and εx = x. The set of **all** strings over Σ is Σ*. Over {0, 1} there are 2^n strings of length n, so Σ* is infinite but **countable**: you can list it, shortest first, and within a length alphabetically (**shortlex** order): ε, 0, 1, 00, 01, 10, 11, 000, ...

      A **language** is any set of strings over Σ, that is, any subset of Σ*. {0, 01, 011} is a language; so is "all binary strings with an even number of 1s", "all valid Python programs", and "all English sentences". Because languages are sets we can combine them: **union** (A ∪ B), **intersection**, **complement** (strings not in A), **concatenation** AB (a string from A followed by one from B), and the **Kleene star** A* (zero or more strings from A, in a row).

      Here is the key idea: **every yes/no problem is a language**. "Is this number prime?" is the language of binary strings that encode primes. "Does this program have a bug?" is the language of buggy programs. A **decision problem** asks whether a given string is in the language, and a machine that answers correctly for every string **decides** the language. Everything in this unit is about which languages can be decided by which machines, and at what cost.

  - heading: Proof techniques
    body: |
      Theory is proof-driven, so the toolkit matters. A **direct proof** starts from assumptions and reasons forward. **Proof by contradiction** assumes the opposite of what you want and derives something impossible (the classic: √2 is irrational). **Proof by induction** shows a claim holds for every natural number n: prove the **base case** (usually n = 0 or 1) and the **inductive step** (if it holds for n then it holds for n + 1); the dominoes then fall. A variant, **strong induction**, assumes the claim for all smaller values. Induction is how we prove things about strings and programs, because they are built up step by step: "a string over {0, 1} of length n has exactly 2^n possible values" follows because each new symbol doubles the count.

      A **counting argument** shows something exists by showing there are more candidates than ways to handle them (the pigeonhole principle: put n + 1 pigeons in n holes and some hole has two). It underlies the pumping lemma (Lesson 15.4). Finally, **diagonalisation**, due to Georg Cantor, shows some infinite sets are strictly bigger than others. Suppose you could list all infinite binary sequences s₁, s₂, s₃, ...; build a new sequence whose n-th digit is the **opposite** of the n-th digit of s_n. It differs from every listed sequence in at least one place, so it is not in the list, a contradiction. So the infinite binary sequences are **uncountable**, while the strings and the programs (which are finite strings) are countable. That gap, **more languages than programs**, is the heart of Lesson 15.7: most languages cannot be decided by any program at all.

examples:
  - title: Listing strings in shortlex order
    intro: "Σ* is infinite but countable: this generator lists it shortest first."
    code: |
      from itertools import product, islice

      def strings(alphabet):
          n = 0
          while True:
              for tup in product(alphabet, repeat=n):
                  yield "".join(tup)
              n += 1

      first = list(islice(strings("01"), 10))
      print(first)
      print(first[0] == "", len(first[0]))
    output: |
      ['', '0', '1', '00', '01', '10', '11', '000', '001', '010']
      True 0
    lines:
      - line: 6
        note: "product(alphabet, repeat=n) gives every string of length n in dictionary order."
      - line: 11
        note: "The empty string is a real string of length 0, listed first."
  - title: Languages as predicates
    intro: "A language is a set of strings; a program can test membership with a predicate."
    code: |
      def even_ones(w):
          return w.count("1") % 2 == 0

      def ends_01(w):
          return w.endswith("01")

      universe = ["", "0", "1", "01", "11", "101", "1001", "0110"]
      print("even number of 1s:", [w for w in universe if even_ones(w)])
      print("ends with 01:     ", [w for w in universe if ends_01(w)])
      print("both (intersection):", [w for w in universe if even_ones(w) and ends_01(w)])
    output: |
      even number of 1s: ['', '0', '11', '101', '1001', '0110']
      ends with 01:      ['01', '101', '1001']
      both (intersection): ['101', '1001']
    lines:
      - line: 1
        note: "The language is the set of strings where this function returns True."
      - line: 11
        note: "Intersection of languages is 'and' of their predicates."
  - title: Concatenation and Kleene star
    intro: "Operations on whole languages, computed up to a maximum length."
    code: |
      def concat(A, B, maxlen):
          return {a + b for a in A for b in B if len(a + b) <= maxlen}

      def star(A, maxlen):
          result = {""}
          while True:
              bigger = result | concat(result, A, maxlen)
              if bigger == result:
                  return result
              result = bigger

      A = {"a", "bb"}
      print(sorted(concat(A, {"x", "y"}, 4)))
      print(sorted(star(A, 4), key=lambda s: (len(s), s)))
    output: |
      ['ax', 'ay', 'bbx', 'bby']
      ['', 'a', 'aa', 'bb', 'aaa', 'abb', 'bba', 'aaaa', 'aabb', 'abba', 'bbaa', 'bbbb']
    lines:
      - line: 5
        note: "A* always contains the empty string (zero repetitions)."
      - line: 7
        note: "Keep adding strings until nothing new appears; the length cap makes this finite."
  - title: Induction by checking
    intro: "A program cannot prove an induction, but it can test the claim for many n. Claim: 1 + 2 + ... + n = n(n+1)/2."
    code: |
      def claim(n):
          return sum(range(1, n + 1)) == n * (n + 1) // 2

      print(all(claim(n) for n in range(0, 1000)))

      # The inductive step in numbers: if S(n) = n(n+1)/2 then S(n+1) = S(n) + (n+1)
      n = 10
      print(n * (n + 1) // 2 + (n + 1) == (n + 1) * (n + 2) // 2)
    output: |
      True
      True
    lines:
      - line: 4
        note: "Testing proves nothing for all n, only for these. Induction proves it for every n."
      - line: 8
        note: "This is the algebra behind the inductive step."
  - title: A diagonal argument in miniature
    intro: "Given a finite list of binary sequences, build one that differs from every one of them."
    code: |
      listed = ["0110", "1010", "1111", "0001"]

      def diagonal(rows):
          return "".join("1" if row[i] == "0" else "0" for i, row in enumerate(rows))

      d = diagonal(listed)
      print(d)
      print([row == d for row in listed])
      print([row[i] != d[i] for i, row in enumerate(listed)])
    output: |
      1100
      [False, False, False, False]
      [True, True, True, True]
    lines:
      - line: 4
        note: "The i-th digit of the new string flips the i-th digit of the i-th row."
      - line: 9
        note: "It differs from row i at position i, so it cannot equal any row."

