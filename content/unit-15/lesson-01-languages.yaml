quiz:
  - type: mcq
    question: What is the length of the empty string ε?
    options: ["0", "1", "undefined", "infinite"]
    answer: 0
    explanation: "It has no symbols."
  - type: mcq
    question: What is a language in this theory?
    options: ["Any set of strings over an alphabet", "A programming language only", "A single string", "A finite set only"]
    answer: 0
    explanation: "Any subset of Σ* is a language."
  - type: mcq
    question: How many binary strings have length exactly 5?
    options: ["32", "10", "25", "5"]
    answer: 0
    explanation: "Each of the 5 positions has 2 choices, so 2^5 = 32."
  - type: mcq
    question: What does A* (Kleene star) contain?
    options: ["Zero or more strings from A concatenated", "Exactly one string from A", "The complement of A", "Only the empty string"]
    answer: 0
    explanation: "It always includes ε (zero repetitions)."
  - type: mcq
    question: What does a proof by induction need?
    options: ["A base case and an inductive step", "Testing many examples", "A counterexample", "A diagram"]
    answer: 0
    explanation: "Base case plus 'n implies n + 1' covers every natural number."
  - type: mcq
    question: What does Cantor's diagonal argument show about the infinite binary sequences?
    options: ["They cannot be listed", "They are finite", "They are countable", "They are all equal"]
    answer: 0
    explanation: "The diagonal sequence escapes any proposed list."
  - type: code
    question: |
      Write `count_len(alphabet_size, n)` returning the number of strings of length exactly `n` over an alphabet with `alphabet_size` symbols, and `count_upto(alphabet_size, n)` returning the number of strings of length at most `n`.
    starter: |
      def count_len(alphabet_size, n):
          pass

      def count_upto(alphabet_size, n):
          pass
    tests:
      - name: counts
        code: |
          assert count_len(2, 5) == 32 and count_len(3, 0) == 1 and count_len(26, 2) == 676
          assert count_upto(2, 3) == 1 + 2 + 4 + 8
          assert count_upto(1, 4) == 5
          assert count_upto(10, 0) == 1
    solution: |
      def count_len(alphabet_size, n):
          return alphabet_size ** n


      def count_upto(alphabet_size, n):
          return sum(alphabet_size ** k for k in range(n + 1))
