id: u15-dfa
title: "Deterministic Finite Automata"
minutes: 60
objective: |
  Learn the simplest model of computation: the deterministic finite automaton (DFA), a machine with a fixed number of states and no other memory. You will define DFAs precisely, simulate them, design them for given languages, combine them with product constructions and minimise them.
outcomes:
  - Define a DFA by its five parts and trace it on an input
  - Design a DFA for a language by deciding what each state must remember
  - Build complement, union and intersection DFAs
  - Find reachable and equivalent states and minimise a DFA
  - Explain what a DFA can and cannot recognise

sections:
  - heading: The machine with no memory
    body: |
      A **deterministic finite automaton (DFA)** reads a string one symbol at a time, left to right, and moves between a fixed, finite set of **states**. At the end it either **accepts** or **rejects**. It has no memory other than which state it is in, which is why it can only "remember" a bounded amount of information about what it has read. Many real devices are DFAs: a turnstile (locked, unlocked), a vending machine, the lexer of a compiler (Unit 6), a traffic light, the protocol state of a network connection (Unit 11).

      Formally, a DFA is five things (Q, Σ, δ, q₀, F):
      - **Q**, a finite set of states;
      - **Σ**, the input alphabet;
      - **δ** (delta), the **transition function** δ: Q × Σ → Q, which says exactly one next state for each (state, symbol);
      - **q₀ ∈ Q**, the **start state**;
      - **F ⊆ Q**, the set of **accepting** (final) states.

      The word *deterministic* means that for every state and symbol there is exactly one move, so a given input always follows one path. The DFA **accepts** `w` if the path from q₀ reading `w` ends in a state in F. The set of all accepted strings is the **language of the DFA**, L(M). A language recognised by some DFA is called a **regular language**. In a diagram, states are circles, accepting states have a double circle, the start state has an arrow into it, and each transition is an arrow labelled with a symbol. In Python we store δ in a dictionary from `(state, symbol)` to the next state.

  - heading: Designing a DFA
    body: |
      The art of DFA design is to decide **what the machine must remember** and give each distinct piece of information its own state. For "binary strings with an even number of 1s" we only need the parity so far: two states, `even` and `odd`, and a 1 flips between them. For "strings that end in 01" we must remember the last symbols that could start such an ending: no progress, last symbol was 0, last two were 01. For "strings whose value as a binary number is divisible by 3" we remember the remainder so far (0, 1, 2); reading a bit `b` turns the value `v` into `2v + b`, so the new remainder is `(2r + b) mod 3`. Divisibility by any fixed number needs only that many states.

      Make the DFA **total**: every state must have a move for every symbol. If a string can no longer be accepted, send it to a **dead state** (a trap) that loops on every symbol. Check your design on small inputs, including the empty string.

  - heading: Combining and minimising
    body: |
      DFAs combine neatly. The **complement** (strings the machine rejects) is built by swapping accepting and non-accepting states, which works only because the DFA is total and deterministic. **Union** and **intersection** use the **product construction**: run two DFAs at the same time on the same input, using pairs of states (p, q). The pair is accepting for union if either state accepts, for intersection if both do. So regular languages are **closed** under complement, union and intersection: combine regular languages this way and you stay regular.

      Different DFAs can accept the same language, so we ask for the smallest. Two states are **equivalent** if no string can tell them apart (every string leads both to accepting or both to rejecting). **Minimisation** removes states that cannot be reached from q₀ and merges equivalent ones. The standard method, **partition refinement**, starts with two groups (accepting, non-accepting) and keeps splitting any group whose members send the same symbol to different groups, until nothing changes. The result is the unique smallest DFA (up to renaming) for the language, which makes it possible to test whether two DFAs are equivalent.

      What a DFA cannot do is count without bound. No DFA recognises `0ⁿ1ⁿ` (n zeros then n ones), because that needs to remember n, and a machine with k states runs out of memory for n > k. The **pumping lemma** in Lesson 15.4 turns this idea into a rigorous proof.

examples:
  - title: Simulating a DFA
    intro: "The transition function is a dictionary. This DFA accepts binary strings with an even number of 1s."
    code: |
      dfa = {
          "start": "even",
          "accept": {"even"},
          "delta": {
              ("even", "0"): "even", ("even", "1"): "odd",
              ("odd", "0"): "odd", ("odd", "1"): "even",
          },
      }

      def accepts(dfa, w):
          state = dfa["start"]
          for ch in w:
              state = dfa["delta"][(state, ch)]
          return state in dfa["accept"]

      for w in ["", "1", "11", "1011", "0000", "10101"]:
          print(repr(w), accepts(dfa, w))
    output: |
      '' True
      '1' False
      '11' True
      '1011' False
      '0000' True
      '10101' False
    lines:
      - line: 11
        note: "Exactly one transition for each (state, symbol), so the loop has no choices to make."
      - line: 14
        note: "Accept if the final state is in F. The empty string leaves us in the start state."
  - title: Divisible by 3
    intro: "States are remainders. Reading a bit b turns the value v into 2v + b."
    code: |
      def make_div(k):
          delta = {(r, b): (2 * r + int(b)) % k for r in range(k) for b in "01"}
          return {"start": 0, "accept": {0}, "delta": delta}

      def accepts(dfa, w):
          state = dfa["start"]
          for ch in w:
              state = dfa["delta"][(state, ch)]
          return state in dfa["accept"]

      d3 = make_div(3)
      for n in [0, 3, 4, 6, 9, 10, 12, 45]:
          w = format(n, "b")
          print(n, w, accepts(d3, w), n % 3 == 0)
    output: |
      0 0 True True
      3 11 True True
      4 100 False False
      6 110 True True
      9 1001 True True
      10 1010 False False
      12 1100 True True
      45 101101 True True
    lines:
      - line: 2
        note: "Three states are enough, however long the number is."
      - line: 14
        note: "The automaton agrees with real arithmetic on every number."
  - title: Complement
    intro: "Flip which states accept. This works because the DFA is total and deterministic."
    code: |
      def complement(dfa, states):
          return {**dfa, "accept": set(states) - dfa["accept"]}

      def accepts(dfa, w):
          s = dfa["start"]
          for ch in w:
              s = dfa["delta"][(s, ch)]
          return s in dfa["accept"]

      even1 = {"start": "e", "accept": {"e"},
               "delta": {("e", "0"): "e", ("e", "1"): "o", ("o", "0"): "o", ("o", "1"): "e"}}
      odd1 = complement(even1, {"e", "o"})
      for w in ["", "1", "11", "101"]:
          print(repr(w), accepts(even1, w), accepts(odd1, w))
    output: |
      '' True False
      '1' False True
      '11' True False
      '101' True False
    lines:
      - line: 2
        note: "Every string ends in some state, so every string is accepted by exactly one of the two machines."
  - title: Product construction
    intro: "Run two machines at once. States are pairs; the accept rule decides union or intersection."
    code: |
      def product(a, b, mode):
          start = (a["start"], b["start"])
          delta, seen, todo = {}, {start}, [start]
          while todo:
              p, q = todo.pop()
              for ch in "01":
                  nxt = (a["delta"][(p, ch)], b["delta"][(q, ch)])
                  delta[((p, q), ch)] = nxt
                  if nxt not in seen:
                      seen.add(nxt)
                      todo.append(nxt)
          op = (lambda x, y: x or y) if mode == "or" else (lambda x, y: x and y)
          accept = {(p, q) for (p, q) in seen if op(p in a["accept"], q in b["accept"])}
          return {"start": start, "accept": accept, "delta": delta}, len(seen)

      def accepts(dfa, w):
          s = dfa["start"]
          for ch in w:
              s = dfa["delta"][(s, ch)]
          return s in dfa["accept"]

      even1 = {"start": "e", "accept": {"e"},
               "delta": {("e", "0"): "e", ("e", "1"): "o", ("o", "0"): "o", ("o", "1"): "e"}}
      ends0 = {"start": "n", "accept": {"y"},
               "delta": {("n", "0"): "y", ("n", "1"): "n", ("y", "0"): "y", ("y", "1"): "n"}}
      both, size = product(even1, ends0, "and")
      print("states reached:", size)
      for w in ["", "0", "10", "110", "1010", "100"]:
          print(repr(w), accepts(both, w))
    output: |
      states reached: 4
      '' False
      '0' True
      '10' False
      '110' True
      '1010' True
      '100' False
    lines:
      - line: 7
        note: "A pair of states moves by moving both halves on the same symbol."
      - line: 12
        note: "'and' gives the intersection: even number of 1s and ends in 0."
  - title: Minimising a DFA
    intro: "Partition refinement: start by splitting accepting from non-accepting and refine until stable."
    code: |
      def minimise(states, alphabet, delta, accept):
          groups = [set(accept), set(states) - set(accept)]
          groups = [g for g in groups if g]
          while True:
              where = {s: i for i, g in enumerate(groups) for s in g}
              new = {}
              for s in states:
                  key = (where[s], tuple(where[delta[(s, ch)]] for ch in alphabet))
                  new.setdefault(key, set()).add(s)
              new_groups = list(new.values())
              if len(new_groups) == len(groups):
                  return sorted(sorted(g) for g in new_groups)
              groups = new_groups

      # strings ending in 0, written wastefully with four states
      states = ["a", "b", "c", "d"]
      delta = {("a", "0"): "b", ("a", "1"): "c", ("b", "0"): "b", ("b", "1"): "c",
               ("c", "0"): "d", ("c", "1"): "c", ("d", "0"): "d", ("d", "1"): "c"}
      print(minimise(states, "01", delta, {"b", "d"}))
    output: |
      [['a', 'c'], ['b', 'd']]
    lines:
      - line: 2
        note: "Initial partition: accepting versus non-accepting."
      - line: 7
        note: "Two states stay together only if they are in the same group and move to the same groups."
      - line: 20
        note: "Four states collapse to two: 'ends in 0' needs just that one bit of memory."

