quiz:
  - type: mcq
    question: What makes a finite automaton deterministic?
    options: ["Exactly one transition for each state and symbol", "It always accepts", "It has one state", "It has no start state"]
    answer: 0
    explanation: "A given input follows exactly one path."
  - type: mcq
    question: How do you build a DFA for the complement of a language?
    options: ["Swap accepting and non-accepting states", "Reverse all arrows", "Add a start state", "Delete the dead state"]
    answer: 0
    explanation: "This needs the DFA to be total and deterministic."
  - type: mcq
    question: What is the minimum number of states for a DFA accepting binary strings with an even number of 1s?
    options: ["2", "1", "3", "4"]
    answer: 0
    explanation: "It only needs to remember the parity."
  - type: mcq
    question: What is a regular language?
    options: ["A language recognised by some DFA", "A language with regular spelling", "A finite language only", "A programming language"]
    answer: 0
    explanation: "Equivalently, by an NFA or a regular expression."
  - type: mcq
    question: Why can't a DFA recognise 0^n 1^n?
    options: ["It would need to remember n, unbounded memory", "The alphabet is too big", "There is no start state", "The strings are too short"]
    answer: 0
    explanation: "A machine with k states cannot count past k."
  - type: mcq
    question: What does the product construction build?
    options: ["A DFA running two DFAs at once on pairs of states", "A bigger alphabet", "A Turing machine", "A regular expression"]
    answer: 0
    explanation: "Choose the accepting pairs for union or intersection."
  - type: code
    question: |
      Write `div_dfa(k)` returning `(start, accept, delta)` for the DFA that accepts binary strings whose numeric value is divisible by `k`. States are remainders `0..k-1`, start and accept are `0`, and `delta[(r, b)] = (2*r + int(b)) % k`.
    starter: |
      def div_dfa(k):
          pass
    tests:
      - name: divisibility
        code: |
          start, accept, delta = div_dfa(5)
          def run(w):
              s = start
              for ch in w:
                  s = delta[(s, ch)]
              return s in accept
          assert all(run(format(n, "b")) == (n % 5 == 0) for n in range(0, 200))
          assert run("") is True
          assert len(delta) == 10
    solution: |
      def div_dfa(k):
          delta = {(r, b): (2 * r + int(b)) % k for r in range(k) for b in "01"}
          return 0, {0}, delta
