exercises:
  - id: run-dfa
    title: Run a DFA
    difficulty: 2
    prompt: |
      Write `run_dfa(start, accept, delta, w)` returning `True` if the DFA accepts `w`. `delta` is a dictionary from `(state, symbol)` to the next state. If a transition is missing, the machine rejects immediately (treat it as going to a dead state).
    starter: |
      def run_dfa(start, accept, delta, w):
          pass
    tests:
      - name: runs
        code: |
          delta = {("e", "0"): "e", ("e", "1"): "o", ("o", "0"): "o", ("o", "1"): "e"}
          assert run_dfa("e", {"e"}, delta, "") is True
          assert run_dfa("e", {"e"}, delta, "1") is False
          assert run_dfa("e", {"e"}, delta, "1010") is True
          assert run_dfa("e", {"e"}, delta, "10101") is False
      - name: missing transition
        code: |
          delta = {("s", "a"): "t"}
          assert run_dfa("s", {"t"}, delta, "a") is True
          assert run_dfa("s", {"t"}, delta, "ab") is False
          assert run_dfa("s", {"t"}, delta, "b") is False
    hints:
      - "Loop over the characters, updating `state = delta[(state, ch)]`; if the key is missing, return False."
    solution: |
      def run_dfa(start, accept, delta, w):
          state = start
          for ch in w:
              if (state, ch) not in delta:
                  return False
              state = delta[(state, ch)]
          return state in accept
    explanation: "The simulator is a six-line loop. That simplicity is why DFAs are so useful in practice."
  - id: build-ends-with
    title: Strings that end with a pattern
    difficulty: 4
    prompt: |
      Write `ends_with_dfa(pattern, alphabet="01")` returning a tuple `(start, accept, delta)` for a DFA accepting exactly the strings that **end with** `pattern`. Use states `0..len(pattern)`, where state `i` means "the longest suffix of the input read so far that is a prefix of `pattern` has length `i`". The accepting state is `len(pattern)`. (This is the idea behind the KMP string search from Unit 8.)
    starter: |
      def ends_with_dfa(pattern, alphabet="01"):
          pass
    tests:
      - name: language
        code: |
          from itertools import product
          def run(m, w):
              start, accept, delta = m
              s = start
              for ch in w:
                  s = delta[(s, ch)]
              return s in accept
          for pat in ["01", "110", "0", "1011"]:
              m = ends_with_dfa(pat)
              assert len(m[1]) == 1 and next(iter(m[1])) == len(pat)
              for n in range(0, 9):
                  for t in product("01", repeat=n):
                      w = "".join(t)
                      assert run(m, w) == w.endswith(pat), (pat, w)
      - name: larger alphabet
        code: |
          start, accept, delta = ends_with_dfa("ab", "abc")
          def run(w):
              s = start
              for ch in w:
                  s = delta[(s, ch)]
              return s in accept
          assert run("cab") and run("aab") and not run("abc") and not run("")
    hints:
      - "From state `i` reading `ch`, the new state is the length of the longest suffix of `pattern[:i] + ch` that is also a prefix of `pattern`."
      - "Try lengths from `min(len(pattern), i + 1)` down to 0 and take the first that matches."
    solution: |
      def ends_with_dfa(pattern, alphabet="01"):
          n = len(pattern)
          delta = {}
          for i in range(n + 1):
              for ch in alphabet:
                  text = pattern[:i] + ch
                  k = min(n, len(text))
                  while k > 0 and not text.endswith(pattern[:k]):
                      k -= 1
                  delta[(i, ch)] = k
          return 0, {n}, delta
    explanation: "Each state remembers how much of the pattern has been matched so far. The transition on a mismatch falls back to the longest partial match, exactly like KMP."
  - id: product-dfa
    title: Intersection by product
    difficulty: 4
    prompt: |
      Write `intersect(m1, m2, alphabet="01")` where each machine is a tuple `(start, accept, delta)` with a complete `delta`. Return a new machine of the same shape accepting the strings both accept. States are pairs `(p, q)`; build only the pairs reachable from the start pair.
    starter: |
      def intersect(m1, m2, alphabet="01"):
          pass
    tests:
      - name: language
        code: |
          from itertools import product as prod
          def run(m, w):
              s, acc, d = m
              for ch in w:
                  s = d[(s, ch)]
              return s in acc
          even1 = ("e", {"e"}, {("e", "0"): "e", ("e", "1"): "o", ("o", "0"): "o", ("o", "1"): "e"})
          ends0 = ("n", {"y"}, {("n", "0"): "y", ("n", "1"): "n", ("y", "0"): "y", ("y", "1"): "n"})
          both = intersect(even1, ends0)
          for n in range(0, 9):
              for t in prod("01", repeat=n):
                  w = "".join(t)
                  assert run(both, w) == (run(even1, w) and run(ends0, w)), w
          assert both[0] == ("e", "n")
          assert all(isinstance(k[0], tuple) for k in both[2])
    hints:
      - "Explore from the start pair with a stack; for each pair and symbol, move both components."
      - "A pair accepts when both components accept."
    solution: |
      def intersect(m1, m2, alphabet="01"):
          s1, a1, d1 = m1
          s2, a2, d2 = m2
          start = (s1, s2)
          delta, seen, todo = {}, {start}, [start]
          while todo:
              p, q = todo.pop()
              for ch in alphabet:
                  nxt = (d1[(p, ch)], d2[(q, ch)])
                  delta[((p, q), ch)] = nxt
                  if nxt not in seen:
                      seen.add(nxt)
                      todo.append(nxt)
          accept = {(p, q) for (p, q) in seen if p in a1 and q in a2}
          return start, accept, delta
    explanation: "Running both machines in lock step needs only pairs of states, so the product has at most |Q1| x |Q2| states."
  - id: dfa-minimise
    title: Count the states of the minimal DFA
    difficulty: 4
    prompt: |
      Write `minimal_size(states, alphabet, delta, accept)` returning the number of states of the minimal DFA. First drop states unreachable from `states[0]` (the start), then do partition refinement as in the lesson and return the number of groups.
    starter: |
      def minimal_size(states, alphabet, delta, accept):
          pass
    tests:
      - name: sizes
        code: |
          delta = {("a", "0"): "b", ("a", "1"): "c", ("b", "0"): "b", ("b", "1"): "c",
                   ("c", "0"): "d", ("c", "1"): "c", ("d", "0"): "d", ("d", "1"): "c"}
          assert minimal_size(["a", "b", "c", "d"], "01", delta, {"b", "d"}) == 2
          # unreachable state z is ignored
          delta2 = dict(delta)
          delta2[("z", "0")] = "z"; delta2[("z", "1")] = "a"
          assert minimal_size(["a", "b", "c", "d", "z"], "01", delta2, {"b", "d"}) == 2
      - name: already minimal
        code: |
          d = {("e", "0"): "e", ("e", "1"): "o", ("o", "0"): "o", ("o", "1"): "e"}
          assert minimal_size(["e", "o"], "01", d, {"e"}) == 2
          # accepts everything: one state
          d2 = {("p", "0"): "q", ("p", "1"): "q", ("q", "0"): "p", ("q", "1"): "p"}
          assert minimal_size(["p", "q"], "01", d2, {"p", "q"}) == 1
    hints:
      - "Find reachable states with a stack from `states[0]` first."
      - "Repeat: group states by (current group, tuple of groups of their successors) until the number of groups stops changing."
    solution: |
      def minimal_size(states, alphabet, delta, accept):
          start = states[0]
          reach, todo = {start}, [start]
          while todo:
              s = todo.pop()
              for ch in alphabet:
                  t = delta[(s, ch)]
                  if t not in reach:
                      reach.add(t)
                      todo.append(t)
          live = [s for s in states if s in reach]
          groups = [g for g in (set(s for s in live if s in accept), set(s for s in live if s not in accept)) if g]
          while True:
              where = {s: i for i, g in enumerate(groups) for s in g}
              new = {}
              for s in live:
                  key = (where[s], tuple(where[delta[(s, ch)]] for ch in alphabet))
                  new.setdefault(key, set()).add(s)
              if len(new) == len(groups):
                  return len(new)
              groups = list(new.values())
    explanation: "Equivalent states have identical futures, so merging them cannot change the language, and the process never splits states that really are distinguishable."

commonMistakes:
  - title: "Forgetting the dead state"
    explanation: "A DFA must have a move for every state and symbol. Send hopeless inputs to a trap state."
  - title: "Complementing a partial DFA"
    explanation: "Swapping accepting states only works if the machine is total. Add the dead state first."
  - title: "Using one state per input seen"
    explanation: "A DFA's states are a fixed finite set. Decide what must be remembered and give each distinct situation one state."
  - title: "Expecting a DFA to count"
    explanation: "A DFA cannot check that the number of 0s equals the number of 1s, since that needs unbounded memory."

summary:
  - "A DFA is (Q, Σ, δ, q₀, F): finitely many states, exactly one move per state and symbol, and no other memory."
  - "The language of a DFA is the set of strings that end in an accepting state; such languages are called regular."
  - "Design by deciding what must be remembered; add a dead state to make the machine total."
  - "Regular languages are closed under complement (flip accepting states) and union and intersection (product construction)."
  - "Minimisation merges equivalent states and gives the unique smallest DFA; DFAs cannot count without bound."
