id: u15-nfa
title: "Nondeterministic Finite Automata"
minutes: 60
objective: |
  Learn nondeterminism: machines that may have several possible moves, or none, and accept if any path leads to acceptance. You will simulate NFAs by tracking sets of states, add epsilon moves, convert an NFA to a DFA with the subset construction, and see that nondeterminism adds convenience but not power.
outcomes:
  - Define an NFA and explain what it means for it to accept a string
  - Simulate an NFA by tracking the set of possible states
  - Use epsilon transitions and compute epsilon closures
  - Convert an NFA to an equivalent DFA with the subset construction
  - Explain why the number of DFA states can grow exponentially

sections:
  - heading: Many choices at once
    body: |
      A **nondeterministic finite automaton (NFA)** relaxes the DFA rules: from a state, reading a symbol, the machine may have **zero, one or several** possible next states. It accepts a string if **there exists at least one** sequence of choices that ends in an accepting state. It is not a real machine that guesses: it is a way of describing a language compactly. Imagine that at every choice the machine clones itself and follows all options at once; if any clone ends in an accepting state, the input is accepted.

      NFAs make some languages much easier to describe. "Binary strings whose third symbol from the end is 1" needs only four NFA states: stay in the start state reading anything, *guess* that this 1 is the third from the end, then check that exactly two more symbols follow. A DFA must remember the last three symbols and needs eight states. In general a language of this shape needs about 2ⁿ DFA states but n + 1 NFA states.

      Formally an NFA is (Q, Σ, δ, q₀, F) as before, but the transition function returns a **set** of states: δ: Q × Σ → P(Q) (the power set of Q). An empty set means "no move": that clone dies. Missing transitions need no dead state.

  - heading: Simulating an NFA
    body: |
      To run an NFA on a computer we do not guess: we track the **set of all states the machine could be in**. Start with {q₀}. For each input symbol, replace the set by the union of everything reachable by that symbol from any state in it. Accept if the final set contains an accepting state. This is the clone idea made concrete, and it costs at most |Q| work per step, so simulating an NFA is as fast as a DFA up to a factor of |Q|.

      **Epsilon transitions** (ε-moves) let an NFA change state without reading any input. They make it easy to glue machines together: to accept "A or B" add a new start state with ε-moves to the starts of both. To simulate them, take the **ε-closure** of a set: all states reachable by following ε-arrows any number of times (a graph search, Unit 7). Take the closure at the start and after each symbol.

  - heading: The subset construction
    body: |
      NFAs are no more powerful than DFAs: every NFA has an equivalent DFA. The **subset construction** makes it: each state of the new DFA is a **set** of NFA states. The start state is the ε-closure of {q₀}. The transition from a set S on symbol `a` is the ε-closure of everything reachable from any member of S by `a`. A set is accepting if it contains an NFA accepting state. We only build the sets we can actually reach. Our simulation above does exactly this step by step; the construction just records the answers in a table.

      The price is size. An NFA with n states can need up to **2ⁿ** DFA states, and for some languages (like "the n-th symbol from the end is 1") this blow-up cannot be avoided. So NFAs are exponentially more concise but exactly as expressive: the class of languages is still the **regular languages**. Conversely a DFA is already an NFA, so the two models recognise the same languages. This equivalence will be used in Lesson 15.4 to turn regular expressions into machines, and you will meet the same idea again whenever a problem says "there exists a choice such that..." (Lesson 15.8's NP is the nondeterministic version of polynomial time).

examples:
  - title: Simulating an NFA with a set of states
    intro: "This NFA accepts binary strings whose third symbol from the end is 1. Missing transitions mean the clone dies."
    code: |
      delta = {
          ("q0", "0"): {"q0"}, ("q0", "1"): {"q0", "q1"},
          ("q1", "0"): {"q2"}, ("q1", "1"): {"q2"},
          ("q2", "0"): {"q3"}, ("q2", "1"): {"q3"},
      }
      start, accept = "q0", {"q3"}

      def accepts(w):
          current = {start}
          for ch in w:
              current = set().union(*(delta.get((s, ch), set()) for s in current))
          return bool(current & accept)

      for w in ["100", "0100", "1", "011", "1011", "00000"]:
          print(w, accepts(w))
    output: |
      100 True
      0100 True
      1 False
      011 False
      1011 False
      00000 False
    lines:
      - line: 11
        note: "All the possible states after this symbol: the union of every state's possible moves."
      - line: 13
        note: "Accept if any possible state is accepting."
  - title: Epsilon closure
    intro: "Follow ε-arrows any number of times. This is a graph search."
    code: |
      eps = {"a": {"b", "c"}, "b": {"d"}, "c": set(), "d": {"b"}, "e": {"a"}}

      def closure(states):
          seen = set(states)
          stack = list(states)
          while stack:
              s = stack.pop()
              for t in eps.get(s, set()):
                  if t not in seen:
                      seen.add(t)
                      stack.append(t)
          return seen

      print(sorted(closure({"a"})))
      print(sorted(closure({"e"})))
      print(sorted(closure({"c"})))
    output: |
      ['a', 'b', 'c', 'd']
      ['a', 'b', 'c', 'd', 'e']
      ['c']
    lines:
      - line: 5
        note: "A state is always in its own closure (zero ε-moves)."
      - line: 9
        note: "Cycles (b to d to b) are safe because we never revisit a state."
  - title: Subset construction
    intro: "Build the DFA whose states are frozen sets of NFA states, exploring only reachable sets."
    code: |
      def subset_construction(start, accept, delta, alphabet):
          s0 = frozenset([start])
          dfa, todo = {}, [s0]
          while todo:
              S = todo.pop()
              if S in dfa:
                  continue
              dfa[S] = {}
              for ch in alphabet:
                  T = frozenset(set().union(*(delta.get((q, ch), set()) for q in S)))
                  dfa[S][ch] = T
                  todo.append(T)
          accepting = {S for S in dfa if S & accept}
          return s0, accepting, dfa

      delta = {
          ("q0", "0"): {"q0"}, ("q0", "1"): {"q0", "q1"},
          ("q1", "0"): {"q2"}, ("q1", "1"): {"q2"},
          ("q2", "0"): {"q3"}, ("q2", "1"): {"q3"},
      }
      s0, acc, dfa = subset_construction("q0", {"q3"}, delta, "01")
      print("NFA states: 4   DFA states reached:", len(dfa))
      print("accepting DFA states:", len(acc))
    output: |
      NFA states: 4   DFA states reached: 8
      accepting DFA states: 4
    lines:
      - line: 10
        note: "The new state is the set of everywhere the NFA could be."
      - line: 20
        note: "Exactly 8 = 2^3 states: the DFA must remember the last three symbols, so the blow-up is unavoidable here."
  - title: Union with an epsilon start
    intro: "A new start state with ε-moves to two machines accepts the union. Tracking sets with closures does the rest."
    code: |
      # machine A accepts strings "a"*, machine B accepts "b"*; union via a new start state
      delta = {
          ("A", "a"): {"A"},
          ("B", "b"): {"B"},
      }
      eps = {"S": {"A", "B"}}
      accept = {"A", "B"}

      def closure(states):
          out, stack = set(states), list(states)
          while stack:
              s = stack.pop()
              for t in eps.get(s, set()):
                  if t not in out:
                      out.add(t); stack.append(t)
          return out

      def accepts(w):
          cur = closure({"S"})
          for ch in w:
              cur = closure(set().union(*(delta.get((s, ch), set()) for s in cur)))
          return bool(cur & accept)

      for w in ["", "aaa", "bb", "ab", "ba"]:
          print(repr(w), accepts(w))
    output: |
      '' True
      'aaa' True
      'bb' True
      'ab' False
      'ba' False
    lines:
      - line: 6
        note: "The new start state S reaches both machines without reading anything."
      - line: 21
        note: "Closure after every symbol, as well as at the start."

playground:
  prompt: |
    Change the NFA so it accepts strings whose **second** symbol from the end is 1. How many states does your NFA need? How many DFA states does the subset construction reach?
  code: |
    states = {"q0"}
    print(sorted(states))

exercises:
  - id: nfa-run
    title: Run an NFA
    difficulty: 3
    prompt: |
      Write `nfa_accepts(start, accept, delta, w)` where `delta` maps `(state, symbol)` to a **set** of next states (a missing key means no move). Return `True` if some path reading all of `w` ends in an accepting state. Track the set of possible states.
    starter: |
      def nfa_accepts(start, accept, delta, w):
          pass
    tests:
      - name: third from end
        code: |
          delta = {
              ("q0", "0"): {"q0"}, ("q0", "1"): {"q0", "q1"},
              ("q1", "0"): {"q2"}, ("q1", "1"): {"q2"},
              ("q2", "0"): {"q3"}, ("q2", "1"): {"q3"},
          }
          from itertools import product
          for n in range(0, 9):
              for t in product("01", repeat=n):
                  w = "".join(t)
                  expected = len(w) >= 3 and w[-3] == "1"
                  assert nfa_accepts("q0", {"q3"}, delta, w) == expected, w
      - name: dead ends
        code: |
          delta = {("s", "a"): {"t"}}
          assert nfa_accepts("s", {"t"}, delta, "a") is True
          assert nfa_accepts("s", {"t"}, delta, "b") is False
          assert nfa_accepts("s", {"s"}, delta, "") is True
    hints:
      - "`current = {start}`; for each character set `current` to the union of `delta.get((s, ch), set())` over `s` in `current`."
    solution: |
      def nfa_accepts(start, accept, delta, w):
          current = {start}
          for ch in w:
              nxt = set()
              for s in current:
                  nxt |= delta.get((s, ch), set())
              current = nxt
          return bool(current & set(accept))
    explanation: "Tracking all possible states replaces guessing. If the set ever becomes empty every clone has died."
  - id: eps-closure
    title: Epsilon closure
    difficulty: 3
    prompt: |
      Write `eps_closure(states, eps)` where `eps` maps a state to the set of states reachable by one ε-move (missing key means none). Return the set of all states reachable from `states` by following zero or more ε-moves.
    starter: |
      def eps_closure(states, eps):
          pass
    tests:
      - name: closure
        code: |
          eps = {"a": {"b", "c"}, "b": {"d"}, "d": {"b"}, "e": {"a"}}
          assert eps_closure({"a"}, eps) == {"a", "b", "c", "d"}
          assert eps_closure({"e"}, eps) == {"e", "a", "b", "c", "d"}
          assert eps_closure({"c"}, eps) == {"c"}
          assert eps_closure(set(), eps) == set()
          assert eps_closure({"b", "c"}, eps) == {"b", "c", "d"}
    hints:
      - "A stack and a `seen` set, as in any graph search."
    solution: |
      def eps_closure(states, eps):
          seen = set(states)
          stack = list(states)
          while stack:
              s = stack.pop()
              for t in eps.get(s, set()):
                  if t not in seen:
                      seen.add(t)
                      stack.append(t)
          return seen
    explanation: "Epsilon moves are just edges in a graph, and the closure is the set of nodes reachable from the starting ones."
  - id: subset-size
    title: Subset construction
    difficulty: 4
    prompt: |
      Write `to_dfa(start, accept, delta, alphabet)` that converts an NFA (without ε-moves) to a DFA by the subset construction. Return `(dfa_start, dfa_accept, dfa_delta)` where DFA states are `frozenset`s of NFA states, `dfa_delta` maps `(frozenset, symbol)` to a frozenset, and only reachable sets are included. The empty set is a normal (dead) state if reached.
    starter: |
      def to_dfa(start, accept, delta, alphabet):
          pass
    tests:
      - name: equivalent language
        code: |
          nfa = {
              ("q0", "0"): {"q0"}, ("q0", "1"): {"q0", "q1"},
              ("q1", "0"): {"q2"}, ("q1", "1"): {"q2"},
              ("q2", "0"): {"q3"}, ("q2", "1"): {"q3"},
          }
          s, acc, d = to_dfa("q0", {"q3"}, nfa, "01")
          assert s == frozenset({"q0"})
          states = {k[0] for k in d}
          assert len(states) == 8, len(states)
          from itertools import product
          for n in range(0, 9):
              for t in product("01", repeat=n):
                  w = "".join(t)
                  cur = s
                  for ch in w:
                      cur = d[(cur, ch)]
                  assert (cur in acc) == (len(w) >= 3 and w[-3] == "1"), w
      - name: dead state
        code: |
          nfa = {("s", "a"): {"t"}}
          s, acc, d = to_dfa("s", {"t"}, nfa, "ab")
          assert d[(frozenset({"s"}), "b")] == frozenset()
          assert d[(frozenset(), "a")] == frozenset()
          assert acc == {frozenset({"t"})}
    hints:
      - "Process each new set once; for each symbol the next set is the union of the NFA moves of its members."
      - "A DFA state accepts if it intersects the NFA's accepting set."
    solution: |
      def to_dfa(start, accept, delta, alphabet):
          s0 = frozenset([start])
          dfa, seen, todo = {}, {s0}, [s0]
          while todo:
              S = todo.pop()
              for ch in alphabet:
                  T = frozenset(set().union(*(delta.get((q, ch), set()) for q in S)))
                  dfa[(S, ch)] = T
                  if T not in seen:
                      seen.add(T)
                      todo.append(T)
          accepting = {S for S in seen if S & set(accept)}
          return s0, accepting, dfa
    explanation: "The DFA's state is the set of NFA states we could be in. For the 'third from the end' language the construction reaches all 2^3 = 8 sets."
  - id: nth-from-end
    title: States needed for the nth symbol from the end
    difficulty: 3
    prompt: |
      Write `nfa_nth_from_end(n)` returning `(start, accept, delta)` of an NFA over `"01"` with states `0..n` accepting strings whose `n`-th symbol from the end is `1` (state 0 loops on both symbols and on `1` also goes to 1; states `1..n-1` move to the next state on either symbol; state `n` accepts). Also write `dfa_states_needed(n)` returning the number of states the subset construction reaches for it, computed by actually building it (you may reuse the idea of tracking sets).
    starter: |
      def nfa_nth_from_end(n):
          pass

      def dfa_states_needed(n):
          pass
    tests:
      - name: sizes
        code: |
          start, accept, delta = nfa_nth_from_end(3)
          assert start == 0 and accept == {3}
          assert delta[(0, "1")] == {0, 1} and delta[(0, "0")] == {0}
          assert delta[(1, "0")] == {2} and delta[(2, "1")] == {3}
          assert [dfa_states_needed(n) for n in range(1, 6)] == [2, 4, 8, 16, 32]
    hints:
      - "Build the delta dictionary in loops. For `dfa_states_needed`, explore reachable frozensets with a stack."
    solution: |
      def nfa_nth_from_end(n):
          delta = {(0, "0"): {0}, (0, "1"): {0, 1}}
          for i in range(1, n):
              delta[(i, "0")] = {i + 1}
              delta[(i, "1")] = {i + 1}
          return 0, {n}, delta


      def dfa_states_needed(n):
          start, accept, delta = nfa_nth_from_end(n)
          s0 = frozenset([start])
          seen, todo = {s0}, [s0]
          while todo:
              S = todo.pop()
              for ch in "01":
                  T = frozenset(set().union(*(delta.get((q, ch), set()) for q in S)))
                  if T not in seen:
                      seen.add(T)
                      todo.append(T)
          return len(seen)
    explanation: "n + 1 NFA states force 2^n DFA states: nondeterminism can be exponentially more compact."

commonMistakes:
  - title: "Thinking an NFA guesses correctly by magic"
    explanation: "An NFA is a mathematical description: accept if any path works. A computer simulates it by tracking all possible states."
  - title: "Forgetting the closure at the start"
    explanation: "With ε-moves, the machine may already be in several states before reading a symbol."
  - title: "Believing NFAs recognise more languages"
    explanation: "They recognise exactly the regular languages, just with fewer states."
  - title: "Adding a dead state to an NFA"
    explanation: "It is unnecessary. A missing move simply means that path ends."

summary:
  - "An NFA allows zero, one or many moves per state and symbol; it accepts if any path reaches an accepting state."
  - "Simulate by tracking the set of possible states; ε-moves are handled with the ε-closure, a graph search."
  - "The subset construction turns an NFA into a DFA whose states are sets of NFA states."
  - "NFAs and DFAs recognise exactly the regular languages, but an NFA can be exponentially smaller."
