quiz:
  - type: mcq
    question: When does an NFA accept a string?
    options: ["If some path ends in an accepting state", "If every path ends in an accepting state", "If its first move is accepting", "Only if it has one path"]
    answer: 0
    explanation: "There only has to exist one accepting computation."
  - type: mcq
    question: What is an ε-transition?
    options: ["A move that reads no input", "A move to the dead state", "A transition on the symbol e", "A loop on every symbol"]
    answer: 0
    explanation: "It lets the machine change state for free."
  - type: mcq
    question: Which languages do NFAs recognise?
    options: ["Exactly the regular languages", "More than regular languages", "Only finite languages", "All languages"]
    answer: 0
    explanation: "The subset construction shows every NFA has an equivalent DFA."
  - type: mcq
    question: In the subset construction, what is a DFA state?
    options: ["A set of NFA states", "A single NFA state", "A string", "An input symbol"]
    answer: 0
    explanation: "It records every state the NFA could be in."
  - type: mcq
    question: An NFA has n states. At most how many states can the equivalent DFA need?
    options: ["2^n", "n", "n^2", "n!"]
    answer: 0
    explanation: "There are 2^n subsets of n states."
  - type: mcq
    question: What is the ε-closure of a set of states?
    options: ["All states reachable using only ε-moves", "The accepting states", "States reachable by one symbol", "The start state"]
    answer: 0
    explanation: "Including the states themselves."
  - type: code
    question: |
      Write `step(current, ch, delta)` returning the set of NFA states reachable from any state in `current` by reading `ch`. `delta` maps `(state, symbol)` to a set; a missing key means no move.
    starter: |
      def step(current, ch, delta):
          pass
    tests:
      - name: step
        code: |
          delta = {("a", "x"): {"b", "c"}, ("b", "x"): {"c"}, ("c", "y"): {"a"}}
          assert step({"a"}, "x", delta) == {"b", "c"}
          assert step({"a", "b"}, "x", delta) == {"b", "c"}
          assert step({"c"}, "x", delta) == set()
          assert step({"c"}, "y", delta) == {"a"}
          assert step(set(), "x", delta) == set()
    solution: |
      def step(current, ch, delta):
          out = set()
          for s in current:
              out |= delta.get((s, ch), set())
          return out
