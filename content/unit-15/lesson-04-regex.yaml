  - type: code
    question: |
      Write `plus(r)` and `optional(r)` building the tuple-form expressions for `R+` (one or more) and `R?` (zero or one) from `r`, using only `("cat", ...)`, `("star", ...)`, `("alt", ...)` and `("eps",)`. For `plus` use `R R*`; for `optional` use `R | ε`.
    starter: |
      def plus(r):
          pass

      def optional(r):
          pass
    tests:
      - name: shorthand
        code: |
          a = ("sym", "a")
          assert plus(a) == ("cat", a, ("star", a))
          assert optional(a) == ("alt", a, ("eps",))
    solution: |
      def plus(r):
          return ("cat", r, ("star", r))


      def optional(r):
          return ("alt", r, ("eps",))
