id: u15-regex
title: "Regular Expressions and the Pumping Lemma"
minutes: 60
objective: |
  Connect three views of the same languages: regular expressions, finite automata, and the limits of both. You will define regular expressions formally, match them with a small engine, convert a regular expression to an NFA (Thompson's construction), and prove that some languages are not regular using the pumping lemma.
outcomes:
  - Define regular expressions from union, concatenation and star
  - Match strings against a regular expression using Brzozowski derivatives
  - Explain how a regular expression becomes an NFA and why the models are equivalent
  - State the pumping lemma and use it to show a language is not regular
  - Distinguish regular expressions in theory from the regex libraries used in practice

sections:
  - heading: Regular expressions
    body: |
      You met regular expressions as a practical tool in Unit 2. Here they are a mathematical object. A **regular expression** over an alphabet Σ is built from just three operations:

      - **Union** `R|S` (or `R + S`): strings matching R or S.
      - **Concatenation** `RS`: a string matching R followed by one matching S.
      - **Star** `R*`: zero or more strings matching R, in a row.

      The base cases are a single symbol `a`, the empty string `ε`, and the empty set `∅` (matches nothing). Everything else in practical regex syntax, like `R+` (= `RR*`), `R?` (= `R|ε`), character classes `[abc]` (= `a|b|c`) and `.` (any symbol), is shorthand for these. A regular expression **denotes a language**: `(0|1)*1` is "all binary strings ending in 1"; `0*10*10*` is "exactly two 1s".

      The central theorem is **Kleene's theorem**: *a language is regular (recognised by a DFA or NFA) if and only if some regular expression denotes it.* Three kinds of description, DFAs, NFAs and regular expressions, are the same thing in three clothes. To prove it we convert in both directions; we show the useful direction, regex to NFA, next.

  - heading: From regex to machine
    body: |
      **Thompson's construction** builds an NFA (with ε-moves) from a regular expression, one operator at a time, and each piece has one start state and one accept state. A symbol `a` is two states joined by an `a` arrow. For `R|S`, add a new start with ε-arrows to the starts of R and S, and ε-arrows from both accept states to a new accept. For `RS`, ε-link R's accept to S's start. For `R*`, add ε-arrows letting you skip R or loop back to its start. The NFA has at most about twice as many states as the expression has symbols and operators, so building it is cheap, and simulating it with sets of states (Lesson 15.3) matches a string in time proportional to the string times the expression size. This is how fast regex engines such as RE2 and grep work. The direction back, from a DFA to a regular expression, works by eliminating states one at a time, replacing arrows with expressions.

      A neat alternative to building machines is **Brzozowski derivatives**: the derivative of a language L with respect to a symbol `a` is the set of strings `w` such that `aw` is in L. For regular expressions it is computed by simple rules (e.g. the derivative of `R|S` is the union of the derivatives, and of `RS` depends on whether R matches the empty string), giving a very short matcher: to test `w`, take the derivative for each symbol in turn and finally check whether what is left accepts ε. The expression *is* the state of the DFA.

  - heading: What regular languages cannot do
    body: |
      Finite memory has limits. The **pumping lemma** captures why. *If L is regular, there is a number p (the pumping length, at most the number of states in some DFA for L) such that every string `w` in L with |w| ≥ p can be split into three parts `w = xyz` with (1) |y| ≥ 1, (2) |xy| ≤ p, and (3) `x yⁱ z` is in L for every i ≥ 0.* The reason is the pigeonhole principle (Lesson 15.1): reading p symbols visits p + 1 states, so a state repeats, and the loop between the repeats (the part `y`) can be skipped or repeated any number of times without changing whether the string is accepted.

      To use it, argue by **contradiction**: assume L is regular with pumping length p, **pick** a cunning string in L of length at least p, show that **every** legal split `xyz` can be pumped out of L. The classic example: L = {0ⁿ1ⁿ}. Take w = 0ᵖ1ᵖ. Since |xy| ≤ p, y lies entirely within the 0s, so `xy²z` has more 0s than 1s and is not in L. Contradiction, so L is not regular. The lemma is a *necessary* condition only: it can prove a language non-regular but never that one is regular. Other non-regular languages: balanced parentheses, palindromes, {1^(n²)}, and the strings with equal numbers of 0s and 1s. The next lesson adds a stack to recognise some of them.

      Beware: practical "regex" libraries (Python's `re`, Perl) add **backreferences** (`(a*)\1`), which match non-regular languages like `ww`, and they use backtracking, which can take exponential time on bad patterns ("catastrophic backtracking", a real source of denial-of-service bugs). Theoretical regular expressions need no such tricks and always run in linear time.

examples:
  - title: A regular expression as a data structure
    intro: "Represent expressions as tuples and check membership by brute-force on a small set of strings."
    code: |
      # ("sym", "a"), ("cat", R, S), ("alt", R, S), ("star", R), ("eps",), ("empty",)
      def matches(r, w):
          tag = r[0]
          if tag == "empty":
              return False
          if tag == "eps":
              return w == ""
          if tag == "sym":
              return w == r[1]
          if tag == "alt":
              return matches(r[1], w) or matches(r[2], w)
          if tag == "cat":
              return any(matches(r[1], w[:i]) and matches(r[2], w[i:]) for i in range(len(w) + 1))
          if tag == "star":
              if w == "":
                  return True
              return any(matches(r[1], w[:i]) and matches(r, w[i:]) for i in range(1, len(w) + 1))

      zero, one = ("sym", "0"), ("sym", "1")
      any_bit = ("alt", zero, one)
      ends_in_1 = ("cat", ("star", any_bit), one)
      for w in ["", "1", "10", "0101", "110"]:
          print(repr(w), matches(ends_in_1, w))
    output: |
      '' False
      '1' True
      '10' False
      '0101' True
      '110' False
    lines:
      - line: 15
        note: "Try every way of splitting the string between the two halves."
      - line: 19
        note: "Star: the first piece is non-empty so the recursion always shrinks the string."
  - title: Derivatives
    intro: "Match by differentiating: strip one symbol at a time and ask whether the rest accepts the empty string."
    code: |
      def nullable(r):
          t = r[0]
          if t in ("eps", "star"):
              return True
          if t in ("empty", "sym"):
              return False
          if t == "alt":
              return nullable(r[1]) or nullable(r[2])
          return nullable(r[1]) and nullable(r[2])

      def deriv(r, a):
          t = r[0]
          if t in ("empty", "eps"):
              return ("empty",)
          if t == "sym":
              return ("eps",) if r[1] == a else ("empty",)
          if t == "alt":
              return ("alt", deriv(r[1], a), deriv(r[2], a))
          if t == "star":
              return ("cat", deriv(r[1], a), r)
          first = ("cat", deriv(r[1], a), r[2])
          return ("alt", first, deriv(r[2], a)) if nullable(r[1]) else first

      def match(r, w):
          for a in w:
              r = deriv(r, a)
          return nullable(r)

      zero, one = ("sym", "0"), ("sym", "1")
      two_ones = ("cat", ("star", zero), ("cat", one, ("cat", ("star", zero), ("cat", one, ("star", zero)))))
      for w in ["11", "0101", "0110", "1", "111", ""]:
          print(repr(w), match(two_ones, w))
    output: |
      '11' True
      '0101' True
      '0110' True
      '1' False
      '111' False
      '' False
    lines:
      - line: 12
        note: "The derivative removes one leading symbol from every string in the language."
      - line: 31
        note: "0*10*10*: exactly two 1s. Each step shrinks the expression's job, as a DFA state would."
  - title: Thompson's construction
    intro: "Build an NFA fragment (start, accept, transitions) for each operator. Edges labelled None are ε."
    code: |
      import itertools
      counter = itertools.count()

      def build(r):
          s, a = next(counter), next(counter)
          edges = []
          t = r[0]
          if t == "sym":
              edges.append((s, r[1], a))
          elif t == "eps":
              edges.append((s, None, a))
          elif t == "alt":
              s1, a1, e1 = build(r[1]); s2, a2, e2 = build(r[2])
              edges += e1 + e2 + [(s, None, s1), (s, None, s2), (a1, None, a), (a2, None, a)]
          elif t == "cat":
              s1, a1, e1 = build(r[1]); s2, a2, e2 = build(r[2])
              edges += e1 + e2 + [(s, None, s1), (a1, None, s2), (a2, None, a)]
          elif t == "star":
              s1, a1, e1 = build(r[1])
              edges += e1 + [(s, None, s1), (a1, None, s1), (a1, None, a), (s, None, a)]
          return s, a, edges

      def run(r, w):
          start, accept, edges = build(r)
          def closure(S):
              S = set(S); todo = list(S)
              while todo:
                  q = todo.pop()
                  for (x, c, y) in edges:
                      if x == q and c is None and y not in S:
                          S.add(y); todo.append(y)
              return S
          cur = closure({start})
          for ch in w:
              cur = closure({y for (x, c, y) in edges if x in cur and c == ch})
          return accept in cur, len(edges)

      zero, one = ("sym", "0"), ("sym", "1")
      r = ("cat", ("star", ("alt", zero, one)), one)
      print(run(r, "0101"), run(r, "10"))
    output: |
      (True, 14) (False, 14)
    lines:
      - line: 5
        note: "Every fragment has exactly one start and one accept state."
      - line: 25
        note: "Closure after every symbol, as in Lesson 15.3."
  - title: Pumping a string
    intro: "Pump y in the middle of 0^p 1^p and watch the string leave the language."
    code: |
      def in_L(w):
          n = len(w) // 2
          return len(w) % 2 == 0 and w == "0" * n + "1" * n

      p = 4
      w = "0" * p + "1" * p
      print(w, in_L(w))
      x, y, z = "", "00", w[2:]          # the only kind of split allowed: y inside the 0s
      for i in range(4):
          s = x + y * i + z
          print(i, s, in_L(s))
    output: |
      00001111 True
      0 001111 False
      1 00001111 True
      2 0000001111 False
      3 000000001111 False
    lines:
      - line: 9
        note: "|xy| <= p forces y to lie within the leading zeros."
      - line: 11
        note: "Pumping up or down changes only the zeros, so the counts no longer match."
  - title: Why catastrophic backtracking happens
    intro: "A naive backtracking matcher on (a*)* tries exponentially many ways to split a string that cannot match."
    code: |
      import re, time

      def count_splits(n):
          # number of ways to cut a string of n a's into non-empty pieces
          return 2 ** (n - 1) if n else 1

      for n in (5, 10, 20, 30):
          print(n, count_splits(n))
      print(bool(re.fullmatch(r"(a|b)*c", "ab" * 10 + "c")))
    output: |
      5 16
      10 512
      20 524288
      30 536870912
      True
    lines:
      - line: 5
        note: "Each gap between letters can be a cut or not: 2^(n-1) splits."
      - line: 10
        note: "A well-behaved pattern runs fast; the dangerous ones nest stars (a*)* and then fail."

playground:
  prompt: |
    Write a regular expression (as nested tuples) for strings over {a, b} with an even number of a's. Test it with `matches`. Then try to find a pumping split for the language of binary palindromes to see why it fails.
  code: |
    a, b = ("sym", "a"), ("sym", "b")
    print(a, b)

exercises:
  - id: regex-match
    title: Match a regular expression
    difficulty: 3
    prompt: |
      Write `matches(r, w)` for regular expressions represented as tuples: `("empty",)`, `("eps",)`, `("sym", c)`, `("alt", r, s)`, `("cat", r, s)`, `("star", r)`. Return `True` if the whole string `w` is in the language of `r`.
    starter: |
      def matches(r, w):
          pass
    tests:
      - name: basics
        code: |
          a, b = ("sym", "a"), ("sym", "b")
          assert matches(("empty",), "") is False
          assert matches(("eps",), "") is True and matches(("eps",), "a") is False
          assert matches(a, "a") and not matches(a, "b") and not matches(a, "")
          ab = ("alt", a, b)
          assert matches(ab, "b") and not matches(ab, "ab")
          assert matches(("cat", a, b), "ab") and not matches(("cat", a, b), "ba")
      - name: star
        code: |
          a, b = ("sym", "a"), ("sym", "b")
          s = ("star", ("alt", a, b))
          for w in ["", "a", "abba", "bbbb"]:
              assert matches(s, w), w
          assert not matches(("star", a), "aab")
          # even number of a's: (b* a b* a b*)* b*
          bs = ("star", b)
          even_a = ("cat", ("star", ("cat", bs, ("cat", a, ("cat", bs, ("cat", a, bs))))), bs)
          for w in ["", "b", "aa", "abab", "baba", "bbaabb"]:
              assert matches(even_a, w), w
          for w in ["a", "aaa", "bab", "baab" + "a"]:
              assert not matches(even_a, w), w
    hints:
      - "For `cat`, try every split point `i` from 0 to `len(w)`."
      - "For `star`, the empty string matches; otherwise the first piece must be non-empty (`i >= 1`) and the rest must match the star again."
    solution: |
      def matches(r, w):
          t = r[0]
          if t == "empty":
              return False
          if t == "eps":
              return w == ""
          if t == "sym":
              return w == r[1]
          if t == "alt":
              return matches(r[1], w) or matches(r[2], w)
          if t == "cat":
              return any(matches(r[1], w[:i]) and matches(r[2], w[i:]) for i in range(len(w) + 1))
          if t == "star":
              if w == "":
                  return True
              return any(matches(r[1], w[:i]) and matches(r, w[i:]) for i in range(1, len(w) + 1))
    explanation: "The recursive definition follows the grammar of regular expressions exactly. Requiring a non-empty first piece in a star stops infinite recursion."
  - id: nullable-deriv
    title: Derivative matching
    difficulty: 4
    prompt: |
      Using the same tuple representation, write `nullable(r)` (does `r` match the empty string?), `deriv(r, a)` (the derivative with respect to symbol `a`, using the rules: empty/eps give empty; a symbol gives eps if equal else empty; alt gives the alt of derivatives; star gives cat(deriv(inner), star); cat gives cat(deriv(first), second), plus deriv(second) in an alt if first is nullable), and `match(r, w)` that differentiates by each symbol of `w` and tests `nullable` at the end.
    starter: |
      def nullable(r):
          pass

      def deriv(r, a):
          pass

      def match(r, w):
          pass
    tests:
      - name: nullable
        code: |
          a = ("sym", "a")
          assert nullable(("eps",)) and nullable(("star", a)) and not nullable(a) and not nullable(("empty",))
          assert nullable(("alt", a, ("eps",))) and not nullable(("cat", a, ("eps",)))
          assert nullable(("cat", ("star", a), ("eps",)))
      - name: match
        code: |
          a, b = ("sym", "a"), ("sym", "b")
          s = ("cat", ("star", ("alt", a, b)), a)       # strings over {a,b} ending in a
          from itertools import product
          for n in range(0, 8):
              for t in product("ab", repeat=n):
                  w = "".join(t)
                  assert match(s, w) == w.endswith("a"), w
          assert match(("star", ("cat", a, b)), "ababab") and not match(("star", ("cat", a, b)), "aba")
    hints:
      - "`deriv` of a symbol is `('eps',)` if it equals `a`, otherwise `('empty',)`."
      - "For `cat`, when the first part is nullable also include the derivative of the second part."
    solution: |
      def nullable(r):
          t = r[0]
          if t in ("eps", "star"):
              return True
          if t in ("empty", "sym"):
              return False
          if t == "alt":
              return nullable(r[1]) or nullable(r[2])
          return nullable(r[1]) and nullable(r[2])


      def deriv(r, a):
          t = r[0]
          if t in ("empty", "eps"):
              return ("empty",)
          if t == "sym":
              return ("eps",) if r[1] == a else ("empty",)
          if t == "alt":
              return ("alt", deriv(r[1], a), deriv(r[2], a))
          if t == "star":
              return ("cat", deriv(r[1], a), r)
          first = ("cat", deriv(r[1], a), r[2])
          return ("alt", first, deriv(r[2], a)) if nullable(r[1]) else first


      def match(r, w):
          for a in w:
              r = deriv(r, a)
          return nullable(r)
    explanation: "Each derivative strips one leading symbol. After reading the whole string, the string matches exactly when what remains accepts the empty string."
  - id: pump-check
    title: Check a pumping split
    difficulty: 3
    prompt: |
      Write `pumps_out(in_lang, w, p)` that tries **every** legal split `w = xyz` (with `|y| >= 1` and `|xy| <= p`) and returns `True` if for every such split there is some `i` in `0..3` for which `x + y*i + z` is **not** in the language (so the split fails to pump, which is what a non-regularity proof needs for every split). Return `False` as soon as some split pumps for all of `i = 0..3`.
    starter: |
      def pumps_out(in_lang, w, p):
          pass
    tests:
      - name: equal zeros and ones
        code: |
          def eq(w):
              n = len(w) // 2
              return len(w) % 2 == 0 and w == "0" * n + "1" * n
          for p in (1, 2, 3, 5):
              assert pumps_out(eq, "0" * p + "1" * p, p) is True
      - name: a regular language can pump
        code: |
          even_len = lambda w: len(w) % 2 == 0
          assert pumps_out(even_len, "0000", 4) is False
          no11 = lambda w: "11" not in w
          assert pumps_out(no11, "010101", 3) is False
    hints:
      - "Loop `i` over the start of `y` and `j` over its end: `x = w[:i]`, `y = w[i:j]`, `z = w[j:]`, with `i < j <= min(p, len(w))`."
    solution: |
      def pumps_out(in_lang, w, p):
          for j in range(1, min(p, len(w)) + 1):
              for i in range(j):
                  x, y, z = w[:i], w[i:j], w[j:]
                  if all(in_lang(x + y * k + z) for k in range(4)):
                      return False
          return True
    explanation: "A proof by the pumping lemma must defeat every split. For regular languages some split always survives pumping."
  - id: thompson-size
    title: Size of Thompson's NFA
    difficulty: 2
    prompt: |
      Thompson's construction gives each symbol or `eps` 2 states, and each `alt`, `cat` or `star` adds 2 states on top of those of its parts. `empty` also uses 2 states. Write `nfa_states(r)` returning the total number of states for the tuple-form expression `r`. (For `cat` the two parts' states stay separate: just add.)
    starter: |
      def nfa_states(r):
          pass
    tests:
      - name: sizes
        code: |
          a, b = ("sym", "a"), ("sym", "b")
          assert nfa_states(a) == 2 and nfa_states(("eps",)) == 2 and nfa_states(("empty",)) == 2
          assert nfa_states(("alt", a, b)) == 2 + 2 + 2
          assert nfa_states(("cat", a, b)) == 2 + 2 + 2
          assert nfa_states(("star", a)) == 2 + 2
          assert nfa_states(("cat", ("star", ("alt", a, b)), b)) == 6 + 2 + 2 + 2
    hints:
      - "Recurse on the parts and add 2 for each operator."
    solution: |
      def nfa_states(r):
          t = r[0]
          if t in ("sym", "eps", "empty"):
              return 2
          if t in ("alt", "cat"):
              return 2 + nfa_states(r[1]) + nfa_states(r[2])
          return 2 + nfa_states(r[1])
    explanation: "The NFA grows linearly with the expression, so matching with Thompson's NFA is fast."

commonMistakes:
  - title: "Choosing the wrong string in a pumping proof"
    explanation: "Pick a string whose structure forces y into one part (like the zeros of 0^p 1^p), not an arbitrary string."
  - title: "Using the pumping lemma to prove a language regular"
    explanation: "It is only a necessary condition. Some non-regular languages satisfy it. To show regularity, give a DFA, NFA or regular expression."
  - title: "Assuming practical regexes are regular expressions"
    explanation: "Backreferences go beyond regular languages and backtracking can be exponentially slow."
  - title: "Forgetting ∅ and ε are different"
    explanation: "ε matches the empty string; ∅ matches nothing. R∅ is ∅ but Rε is R."

summary:
  - "Regular expressions are built from symbols, union, concatenation and star; ε and ∅ are base cases."
  - "Kleene's theorem: DFAs, NFAs and regular expressions describe exactly the regular languages."
  - "Thompson's construction turns a regular expression into an NFA of linear size; derivatives give a tiny matcher."
  - "The pumping lemma shows a language is not regular by contradiction; it can never show a language is regular."
  - "Real regex libraries add non-regular features and backtracking, which can be exponentially slow."
