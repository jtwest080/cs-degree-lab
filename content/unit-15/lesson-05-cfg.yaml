id: u15-cfg
title: "Context-Free Grammars and Pushdown Automata"
minutes: 60
objective: |
  Add a stack to a finite automaton and get the next level of power: context-free languages. You will write grammars that generate nested structures such as balanced parentheses and arithmetic, derive and parse strings, remove ambiguity, convert to Chomsky normal form, and recognise strings with the CYK algorithm and with a pushdown automaton.
outcomes:
  - Define a context-free grammar and derive strings from it
  - Show a string's parse tree and recognise ambiguity
  - Design grammars for nested and counted structures like 0^n 1^n and balanced brackets
  - Recognise strings with a pushdown automaton (a stack)
  - Decide membership with the CYK dynamic-programming algorithm

sections:
  - heading: Grammars generate languages
    body: |
      A DFA cannot match nested brackets, but programming languages are full of them (Unit 6 wrote a parser for exactly this). A **context-free grammar (CFG)** generates strings from **rules** (also called productions). It has **variables** (non-terminals, like `S`), **terminals** (the symbols of the strings, like `0`, `1`, `(`), a set of **rules** `A → w` meaning "A can be replaced by the string `w`" (made of variables and terminals), and a **start variable**. A **derivation** starts with the start variable and repeatedly replaces a variable by the right side of one of its rules until only terminals remain. The strings so derivable form the grammar's **language**.

      Example: `S → 0S1 | ε` generates `ε, 01, 0011, 000111, ...`, which is exactly {0ⁿ1ⁿ}, the language that no DFA can recognise. Each use of the rule wraps one more 0 and 1 around the middle. Balanced parentheses: `S → (S)S | ε`. Arithmetic: `E → E+T | T`, `T → T*F | F`, `F → (E) | n` encodes that `*` binds tighter than `+`, because `*` sits deeper in the grammar. Languages with such a grammar are **context-free languages**; the regular languages are a proper subset (a regular grammar only ever puts a variable at the end of the right side).

      A derivation can be drawn as a **parse tree**: the root is the start variable, each node's children are the symbols on the right side of the rule used, and the leaves read left to right spell the string. Parsers in compilers build exactly these trees. A grammar is **ambiguous** if some string has two different parse trees, as `E → E+E | E*E | n` does for `n+n*n` (is it `(n+n)*n` or `n+(n*n)`?). Ambiguity is a problem for languages that must have one meaning, and it is why real grammars encode precedence in layers like the one above. Some context-free languages are *inherently* ambiguous and every grammar for them is.

  - heading: Pushdown automata
    body: |
      The machine matching context-free languages is the **pushdown automaton (PDA)**: an NFA with a **stack**. On each step it reads an input symbol (or none), looks at the top of the stack, and may push or pop. To recognise {0ⁿ1ⁿ} push a marker for each 0, pop one for each 1, and accept if the stack ends empty exactly when the input does. Balanced brackets work the same way. The stack gives it unbounded memory, but only last-in first-out, so it can match nesting, not arbitrary cross-referencing. It cannot recognise {aⁿbⁿcⁿ}, or {ww}: a stack that counts the a's and b's together is emptied by the time it reads the c's. The **equivalence** theorem says PDAs recognise exactly the context-free languages. Deterministic PDAs are weaker than non-deterministic ones (unlike finite automata): palindromes need the machine to *guess* the middle.

      A pushdown automaton is a good picture for how a program's call stack matches nested calls, and why recursive-descent parsers handle nested constructs.

  - heading: Normal forms and CYK
    body: |
      To parse in general we use **Chomsky normal form (CNF)**: every rule is either `A → BC` (two variables) or `A → a` (one terminal), plus possibly `S → ε`. Every context-free grammar can be converted to CNF (remove ε rules, unit rules, split long right sides, replace terminals inside longer rules by variables). With CNF, the **CYK algorithm** (Cocke, Younger, Kasami) decides membership by dynamic programming (Unit 8): for each substring, find the set of variables that can derive it. Substrings of length 1 come from the `A → a` rules. A longer substring from position `i` of length `l` is derivable from `A` if for some split point `k` there is a rule `A → BC` with B deriving the left part and C the right. The answer is whether the start variable derives the whole string. It takes O(n³ · |G|) time for a string of length n, fast enough for natural language fragments but too slow for large programs, which is why programming languages use restricted grammars (LL, LR) parsed in linear time.

      Context-free languages are closed under union, concatenation and star, but **not** under intersection or complement (the intersection of {aⁿbⁿc*} and {a*bⁿcⁿ} is {aⁿbⁿcⁿ}, which is not context-free). A **pumping lemma for context-free languages** exists too, with two pumped parts, and is used to prove languages like {aⁿbⁿcⁿ} are not context-free. Here we need a more powerful machine: the Turing machine of the next lesson.

examples:
  - title: Generating strings from a grammar
    intro: "A grammar is a dictionary from variable to a list of right sides. Expand the leftmost variable until none remain, up to a length limit."
    code: |
      grammar = {"S": ["0S1", ""]}

      def generate(grammar, start="S", maxlen=8):
          results, todo = set(), [start]
          while todo:
              form = todo.pop()
              vars_ = [i for i, c in enumerate(form) if c.isupper()]
              if not vars_:
                  results.add(form)
                  continue
              i = vars_[0]
              for rhs in grammar[form[i]]:
                  new = form[:i] + rhs + form[i + 1:]
                  if len(new) - sum(c.isupper() for c in new) <= maxlen:
                      todo.append(new)
          return sorted(results, key=lambda s: (len(s), s))

      print(generate(grammar))
    output: |
      ['', '01', '0011', '000111', '00001111']
    lines:
      - line: 1
        note: "S -> 0S1 | epsilon. Each use wraps one more 0 and 1 around the middle."
      - line: 9
        note: "Expand the leftmost variable in every possible way: a leftmost derivation."
  - title: A recursive-descent recogniser
    intro: "Each grammar rule becomes a function. Balanced brackets: S -> (S)S | epsilon."
    code: |
      def balanced(s):
          pos = 0

          def S():
              nonlocal pos
              if pos < len(s) and s[pos] == "(":
                  pos += 1
                  if not S():
                      return False
                  if pos >= len(s) or s[pos] != ")":
                      return False
                  pos += 1
                  return S()
              return True               # epsilon

          return S() and pos == len(s)

      for t in ["", "()", "(())()", "(()", ")(", "())"]:
          print(repr(t), balanced(t))
    output: |
      '' True
      '()' True
      '(())()' True
      '(()' False
      ')(' False
      '())' False
    lines:
      - line: 12
        note: "After the closing bracket the rule continues with another S."
      - line: 16
        note: "Success means S matched AND the whole input was consumed."
  - title: A pushdown automaton for 0^n 1^n
    intro: "Push on every 0, pop on every 1, and require that the stack empties exactly with the input."
    code: |
      def accepts(w):
          stack, seen_one = [], False
          for ch in w:
              if ch == "0":
                  if seen_one:
                      return False
                  stack.append("0")
              elif ch == "1":
                  seen_one = True
                  if not stack:
                      return False
                  stack.pop()
              else:
                  return False
          return not stack

      for w in ["", "01", "0011", "001", "0110", "000111", "10"]:
          print(repr(w), accepts(w))
    output: |
      '' True
      '01' True
      '0011' True
      '001' False
      '0110' False
      '000111' True
      '10' False
    lines:
      - line: 6
        note: "A 0 after a 1 would break the pattern 0*1*."
      - line: 15
        note: "Accept only if every 0 was matched: the stack is empty."
  - title: CYK for a grammar in Chomsky normal form
    intro: "Fill a table: for each substring, which variables can derive it?"
    code: |
      # CNF grammar for 0^n 1^n (n >= 1): S -> A B | A C ; C -> S B ; A -> 0 ; B -> 1
      binary = [("S", "A", "B"), ("S", "A", "C"), ("C", "S", "B")]
      terminal = {"0": {"A"}, "1": {"B"}}

      def cyk(w, start="S"):
          n = len(w)
          if n == 0:
              return False
          table = [[set() for _ in range(n)] for _ in range(n)]       # table[length-1][start]
          for i, ch in enumerate(w):
              table[0][i] = set(terminal.get(ch, set()))
          for length in range(2, n + 1):
              for i in range(n - length + 1):
                  for k in range(1, length):
                      left, right = table[k - 1][i], table[length - k - 1][i + k]
                      for (a, b, c) in binary:
                          if b in left and c in right:
                              table[length - 1][i].add(a)
          return start in table[n - 1][0]

      for w in ["01", "0011", "000111", "001", "0101", "10"]:
          print(w, cyk(w))
    output: |
      01 True
      0011 True
      000111 True
      001 False
      0101 False
      10 False
    lines:
      - line: 11
        note: "Length-1 substrings come from the A -> a rules."
      - line: 14
        note: "Try every split point k: left part has length k, right part length - k."
  - title: Ambiguity
    intro: "Count the distinct parse trees of a string under E -> E+E | E*E | n. More than one means the grammar is ambiguous."
    code: |
      from functools import lru_cache

      def count_trees(tokens):
          @lru_cache(maxsize=None)
          def count(i, j):                    # trees for tokens[i:j]
              if j - i == 1:
                  return 1 if tokens[i] == "n" else 0
              total = 0
              for k in range(i + 1, j - 1):
                  if tokens[k] in "+*":
                      total += count(i, k) * count(k + 1, j)
              return total
          return count(0, len(tokens))

      for expr in ["n", "n+n", "n+n*n", "n+n+n", "n+n*n+n"]:
          print(expr, count_trees(tuple(expr)))
    output: |
      n 1
      n+n 1
      n+n*n 2
      n+n+n 2
      n+n*n+n 5
    lines:
      - line: 10
        note: "Each operator can be the root, splitting the rest into a left and a right expression."
      - line: 16
        note: "n+n*n has two trees: (n+n)*n and n+(n*n). The layered grammar removes this."

