quiz:
  - type: mcq
    question: Which grammar generates {0^n 1^n}?
    options: ["S → 0S1 | ε", "S → 0S | 1S | ε", "S → S0 | S1", "S → 01"]
    answer: 0
    explanation: "Each use wraps a 0 and a 1 around the middle."
  - type: mcq
    question: What does a PDA have that a DFA does not?
    options: ["A stack", "More states", "A larger alphabet", "A start state"]
    answer: 0
    explanation: "The stack gives unbounded last-in first-out memory."
  - type: mcq
    question: What is an ambiguous grammar?
    options: ["One with a string that has two different parse trees", "One that generates no strings", "One that is too long", "One with no terminals"]
    answer: 0
    explanation: "E → E+E | E*E | n is ambiguous on n+n*n."
  - type: mcq
    question: What is the running time of CYK for a string of length n?
    options: ["O(n^3)", "O(n)", "O(log n)", "O(2^n)"]
    answer: 0
    explanation: "Three nested loops: length, start and split."
  - type: mcq
    question: Which language is not context-free?
    options: ["{a^n b^n c^n}", "{a^n b^n}", "Balanced brackets", "Palindromes"]
    answer: 0
    explanation: "A single stack cannot compare three counts."
  - type: mcq
    question: What form do the rules have in Chomsky normal form?
    options: ["A → BC or A → a", "A → any string", "A → aB only", "A → ε only"]
    answer: 0
    explanation: "Two variables or one terminal, which suits CYK."
  - type: code
    question: |
      Write `an_bn(w)` returning `True` if `w` is `"0"*n + "1"*n` for some `n >= 0` (so the empty string counts), using a counter rather than a regular expression.
    starter: |
      def an_bn(w):
          pass
    tests:
      - name: language
        code: |
          for w in ["", "01", "0011", "000111"]:
              assert an_bn(w), w
          for w in ["0", "1", "10", "011", "0101", "001", "0a1"]:
              assert not an_bn(w), w
    solution: |
      def an_bn(w):
          n = len(w) // 2
          return len(w) % 2 == 0 and w == "0" * n + "1" * n
