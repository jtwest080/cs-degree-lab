exercises:
  - id: balanced-stack
    title: Balanced brackets with a stack
    difficulty: 2
    prompt: |
      Write `balanced(s)` for strings of `()[]{}` characters (and nothing else): return `True` if the brackets are properly nested and matched, using a stack. Any other character makes the result `False`.
    starter: |
      def balanced(s):
          pass
    tests:
      - name: balanced
        code: |
          assert balanced("") and balanced("()") and balanced("([]{})") and balanced("()[]{}")
      - name: unbalanced
        code: |
          for bad in ["(", ")", "(]", "([)]", "((", "())", "{[}]", "(a)"]:
              assert not balanced(bad), bad
    hints:
      - "Push an opening bracket. On a closing bracket the stack must be non-empty and its top the matching opening bracket."
    solution: |
      def balanced(s):
          pairs = {")": "(", "]": "[", "}": "{"}
          stack = []
          for ch in s:
              if ch in "([{":
                  stack.append(ch)
              elif ch in pairs:
                  if not stack or stack.pop() != pairs[ch]:
                      return False
              else:
                  return False
          return not stack
    explanation: "The stack remembers which brackets are still open, in the order they must close. A finite automaton cannot do this for unbounded nesting."
  - id: derive
    title: Does the grammar generate it?
    difficulty: 4
    prompt: |
      Write `generates(grammar, w, start="S")`. `grammar` maps a variable (an upper-case letter) to a list of right-hand side strings (`""` is ε); every other character is a terminal. Return `True` if `w` can be derived from `start`. Use a breadth-first search over sentential forms, always expanding the leftmost variable and pruning any form whose terminal prefix does not match `w` or whose length of terminals already exceeds `len(w)`. Assume the grammar has no ε-loops that make the search infinite on its own (prune forms longer than `len(w) + 3` variables plus terminals).
    starter: |
      def generates(grammar, w, start="S"):
          pass
    tests:
      - name: anbn
        code: |
          g = {"S": ["0S1", ""]}
          for w in ["", "01", "0011", "000111"]:
              assert generates(g, w), w
          for w in ["0", "1", "10", "001", "0101", "011"]:
              assert not generates(g, w), w
      - name: palindromes and balanced
        code: |
          pal = {"S": ["aSa", "bSb", "a", "b", ""]}
          for w in ["", "a", "abba", "abbba", "baab"]:
              assert generates(pal, w), w
          for w in ["ab", "abb", "aab"]:
              assert not generates(pal, w), w
          bal = {"S": ["(S)S", ""]}
          assert generates(bal, "(())()") and not generates(bal, "(()")
    hints:
      - "Keep a queue of sentential forms; for each, find the first upper-case letter and replace it by each right-hand side."
      - "If there are no variables left, compare the form with `w`."
      - "Prune a form if its leading terminals (before the first variable) are not a prefix of `w`."
    solution: |
      from collections import deque


      def generates(grammar, w, start="S"):
          seen = {start}
          queue = deque([start])
          limit = len(w) + 3
          while queue:
              form = queue.popleft()
              idx = next((i for i, c in enumerate(form) if c.isupper()), None)
              if idx is None:
                  if form == w:
                      return True
                  continue
              if not w.startswith(form[:idx]):
                  continue
              for rhs in grammar[form[idx]]:
                  new = form[:idx] + rhs + form[idx + 1:]
                  if len(new) <= limit and new not in seen:
                      seen.add(new)
                      queue.append(new)
          return False
    explanation: "Pruning by the matched prefix and by length keeps the search finite. Real parsers do this far more cleverly (CYK, LL, LR)."
  - id: cyk-table
    title: CYK recogniser
    difficulty: 4
    prompt: |
      Write `cyk(w, binary, terminal, start="S")`. `binary` is a list of `(A, B, C)` triples for rules `A → B C`; `terminal` maps a character to the set of variables `A` with `A → char`. Return `True` if `start` derives the non-empty string `w` and `False` otherwise (including for the empty string).
    starter: |
      def cyk(w, binary, terminal, start="S"):
          pass
    tests:
      - name: anbn
        code: |
          binary = [("S", "A", "B"), ("S", "A", "C"), ("C", "S", "B")]
          terminal = {"0": {"A"}, "1": {"B"}}
          for w in ["01", "0011", "000111", "00001111"]:
              assert cyk(w, binary, terminal), w
          for w in ["", "0", "1", "10", "001", "0101", "00111"]:
              assert not cyk(w, binary, terminal), w
      - name: another grammar
        code: |
          # strings over {a,b} with the form a+ b : S -> A S | A B  with A -> a, B -> b  (needs CNF: S -> A S, S -> A B)
          binary = [("S", "A", "S"), ("S", "A", "B")]
          terminal = {"a": {"A"}, "b": {"B"}}
          assert cyk("ab", binary, terminal) and cyk("aaab", binary, terminal)
          assert not cyk("b", binary, terminal) and not cyk("aab" + "b", binary, terminal) and not cyk("ba", binary, terminal)
    hints:
      - "`table[l][i]` = set of variables deriving the substring of length `l + 1` starting at `i`."
      - "For each split, check each rule `(A, B, C)` with `B` in the left cell and `C` in the right."
    solution: |
      def cyk(w, binary, terminal, start="S"):
          n = len(w)
          if n == 0:
              return False
          table = [[set() for _ in range(n)] for _ in range(n)]
          for i, ch in enumerate(w):
              table[0][i] = set(terminal.get(ch, set()))
          for length in range(2, n + 1):
              for i in range(n - length + 1):
                  for k in range(1, length):
                      left = table[k - 1][i]
                      right = table[length - k - 1][i + k]
                      for a, b, c in binary:
                          if b in left and c in right:
                              table[length - 1][i].add(a)
          return start in table[n - 1][0]
    explanation: "This is dynamic programming over substrings, O(n^3) time. Every substring is solved from its two halves."
  - id: tree-count
    title: Count parse trees
    difficulty: 4
    prompt: |
      For the ambiguous grammar `E → E+E | E*E | n`, write `count_trees(s)` returning the number of different parse trees for the string `s` (made of `n`, `+`, `*`). Return 0 if `s` is not a valid expression. (A string of k operators balanced this way has Catalan-number-many trees.)
    starter: |
      def count_trees(s):
          pass
    tests:
      - name: counts
        code: |
          assert count_trees("n") == 1
          assert count_trees("n+n") == 1
          assert count_trees("n+n*n") == 2
          assert count_trees("n+n+n") == 2
          assert count_trees("n+n+n+n") == 5
          assert count_trees("n+n+n+n+n") == 14
          assert count_trees("+n") == 0 and count_trees("nn") == 0 and count_trees("") == 0
    hints:
      - "`count(i, j)`: if the substring is a single `n` the answer is 1; otherwise sum over every operator position `k` of `count(i, k) * count(k+1, j)`."
      - "Use `functools.lru_cache`."
    solution: |
      from functools import lru_cache


      def count_trees(s):
          @lru_cache(maxsize=None)
          def count(i, j):
              if j - i == 1:
                  return 1 if s[i] == "n" else 0
              total = 0
              for k in range(i + 1, j - 1):
                  if s[k] in "+*":
                      total += count(i, k) * count(k + 1, j)
              return total

          return count(0, len(s)) if s else 0
    explanation: "The counts 1, 1, 2, 5, 14 are the Catalan numbers. A real language fixes the ambiguity with layered rules for precedence."

commonMistakes:
  - title: "Using a counter in a DFA for nested structures"
    explanation: "Unbounded nesting needs a stack, so a finite automaton cannot do it. Use a PDA or a grammar."
  - title: "Writing an ambiguous expression grammar"
    explanation: "Use layers (expression, term, factor) so each string has one parse tree and the right precedence."
  - title: "Left recursion in a recursive-descent parser"
    explanation: "E → E+T makes a parser call itself without consuming input. Rewrite it as a loop or use a different parsing method."
  - title: "Thinking all languages with a stack are context-free"
    explanation: "A PDA has one stack. Languages like a^n b^n c^n need more than that."

summary:
  - "A context-free grammar generates a language by replacing variables using rules; parse trees show the structure."
  - "Grammars handle nesting: 0^n 1^n, balanced brackets, arithmetic with precedence (using layered rules)."
  - "A PDA is a finite automaton plus a stack; PDAs recognise exactly the context-free languages."
  - "Chomsky normal form and the CYK dynamic-programming algorithm decide membership in O(n^3)."
  - "Context-free languages are closed under union, concatenation and star, but not intersection or complement; a^n b^n c^n is not context-free."
