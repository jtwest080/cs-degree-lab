id: u15-turing
title: "Turing Machines and the Church-Turing Thesis"
minutes: 60
objective: |
  Meet the model that captures everything a computer can do: the Turing machine, a finite-state controller with an unbounded tape. You will build a simulator, program machines for arithmetic and for languages no PDA can recognise, compare variants, and understand the Church-Turing thesis and universal machines.
outcomes:
  - Define a Turing machine and trace its configurations
  - Write a simulator and program machines for decision and function problems
  - Distinguish deciding from recognising (halting versus looping)
  - Explain why extra tapes and nondeterminism add no computing power
  - State the Church-Turing thesis and explain the idea of a universal machine

sections:
  - heading: A finite controller and an infinite tape
    body: |
      In 1936 Alan Turing asked what it means to compute and answered with a deliberately simple machine, imitating a person with a pencil and unlimited paper. A **Turing machine (TM)** has a **tape**: an endless row of cells, each holding one symbol; the input is written on it, and the rest is blank (`_`). A **head** sits on one cell and can read it, write a symbol, and move one cell **left or right**. A finite **controller** holds the current **state** and a table of rules: *in state q, reading symbol a: write b, move L or R, and go to state q'*. The machine starts in the start state with the head on the first input symbol. It **halts** when it enters the special **accept** or **reject** state. If it never enters either, it runs forever.

      Formally a TM is (Q, Σ, Γ, δ, q₀, q_accept, q_reject): states, input alphabet, tape alphabet (which includes the blank and anything the machine writes), a transition function δ: Q × Γ → Q × Γ × {L, R}, a start state and two halting states. Compared with a DFA it has two powers added: it can **write**, and it can **go back**, so its memory is the whole tape and does not run out. A **configuration** is a snapshot: the tape contents, the head position and the state. A computation is a sequence of configurations, and tracing one by hand shows how little is going on at each step.

      Three outcomes are possible for an input: the machine **accepts**, **rejects**, or **loops**. A language is **Turing-recognisable** (recursively enumerable) if some TM accepts exactly its strings (it may loop on others). It is **decidable** (recursive) if some TM accepts its strings and *rejects all others*, always halting. The difference matters hugely in the next lesson.

  - heading: Programming a Turing machine
    body: |
      Programming a TM feels like writing assembly, but the ideas are familiar. To decide {0ⁿ1ⁿ} (which a DFA cannot) we could cross off one 0 (writing X), travel right to the first 1 and cross it off (writing Y), go back left, and repeat; accept if only X's and Y's remain, reject if the counts differ. For {aⁿbⁿcⁿ}, which no PDA can recognise, the same idea works with three markers. To add 1 to a binary number, go to the right end, then walk left turning 1s into 0s until you find a 0 (or the blank) and turn it into 1. A TM can copy, compare, add and multiply by repeating such moves, and "use a marker to remember where I was" is its version of a variable.

      **Variants do not add power.** A TM with several tapes, a tape that is infinite in both directions, a head that may stay put, or non-determinism (several rules for one situation) can each be simulated by the plain one-tape, deterministic machine, usually with a polynomial or at worst exponential slowdown. This **robustness** is evidence that the model is natural. Different formalisms invented independently, including Church's λ-calculus, Gödel's recursive functions, Post's rewriting systems, random-access machines, and every real programming language (given unlimited memory), turn out to compute exactly the same functions.

  - heading: The Church-Turing thesis and universality
    body: |
      The **Church-Turing thesis** says: *anything that can be computed by an effective step-by-step procedure can be computed by a Turing machine.* It is a thesis, not a theorem, because "effective procedure" is an informal notion and cannot be proven equal to a formal one, but no counter-example has ever been found in ninety years, and every new model has matched it. So when we show that no TM can solve a problem, we conclude that no program in any language, on any computer, ever can.

      Turing's other great idea: a TM is described by a finite table, so it can be written as a string and **given as input to another machine**. A **universal Turing machine** U takes a description ⟨M⟩ of a machine and an input w, and simulates M on w. That is a programmable computer: the program (⟨M⟩) is data. Every interpreter, virtual machine and operating system is a universal machine in this sense (Unit 6 compilers, Unit 10 processes). It also sets up the self-reference at the heart of the next lesson: a machine can be asked questions about *machines*, including itself.

examples:
  - title: A Turing machine simulator
    intro: "A rule table maps (state, symbol) to (new state, symbol to write, direction). The tape is a dictionary so it can grow either way."
    code: |
      def run_tm(rules, w, start="q0", accept="acc", reject="rej", blank="_", max_steps=10000):
          tape = {i: c for i, c in enumerate(w)}
          pos, state, steps = 0, start, 0
          while state not in (accept, reject) and steps < max_steps:
              sym = tape.get(pos, blank)
              if (state, sym) not in rules:
                  state = reject
                  break
              state, write, move = rules[(state, sym)]
              tape[pos] = write
              pos += 1 if move == "R" else -1
              steps += 1
          out = "".join(tape[i] for i in sorted(tape)).strip(blank)
          return state, steps, out

      # increment a binary number (most significant bit first)
      rules = {
          ("q0", "0"): ("q0", "0", "R"), ("q0", "1"): ("q0", "1", "R"), ("q0", "_"): ("q1", "_", "L"),
          ("q1", "1"): ("q1", "0", "L"), ("q1", "0"): ("acc", "1", "R"), ("q1", "_"): ("acc", "1", "R"),
      }
      for w in ["0", "1", "1011", "111"]:
          print(w, run_tm(rules, w))
    output: |
      0 ('acc', 3, '1')
      1 ('acc', 4, '10')
      1011 ('acc', 8, '1100')
      111 ('acc', 8, '1000')
    lines:
      - line: 11
        note: "A rule gives the next state, what to write, and which way to move."
      - line: 20
        note: "Go to the right end (q0), then carry leftward (q1): 1 becomes 0 until a 0 or the blank becomes 1."
  - title: Deciding 0^n 1^n by crossing off
    intro: "Mark a 0 with X, find the matching 1 and mark it Y, return to the left, repeat."
    code: |
      def run_tm(rules, w, start="q0", accept="acc", reject="rej", blank="_", max_steps=100000):
          tape = {i: c for i, c in enumerate(w)}
          pos, state, steps = 0, start, 0
          while state not in (accept, reject) and steps < max_steps:
              sym = tape.get(pos, blank)
              if (state, sym) not in rules:
                  return reject, steps
              state, write, move = rules[(state, sym)]
              tape[pos] = write
              pos += 1 if move == "R" else -1
              steps += 1
          return state, steps

      rules = {
          ("q0", "0"): ("q1", "X", "R"),            # cross off a 0
          ("q0", "Y"): ("q3", "Y", "R"),            # no 0s left: check that only Ys remain
          ("q0", "_"): ("acc", "_", "R"),
          ("q1", "0"): ("q1", "0", "R"), ("q1", "Y"): ("q1", "Y", "R"),
          ("q1", "1"): ("q2", "Y", "L"),            # cross off the matching 1
          ("q2", "0"): ("q2", "0", "L"), ("q2", "Y"): ("q2", "Y", "L"),
          ("q2", "X"): ("q0", "X", "R"),            # back to the left end
          ("q3", "Y"): ("q3", "Y", "R"), ("q3", "_"): ("acc", "_", "R"),
      }
      for w in ["", "01", "0011", "000111", "001", "0111", "10", "0101"]:
          print(repr(w), run_tm(rules, w))
    output: |
      '' ('acc', 1)
      '01' ('acc', 5)
      '0011' ('acc', 13)
      '000111' ('acc', 25)
      '001' ('rej', 7)
      '0111' ('rej', 4)
      '10' ('rej', 0)
      '0101' ('rej', 4)
    lines:
      - line: 15
        note: "A missing rule means reject: the machine is stuck in a bad situation."
      - line: 27
        note: "Steps grow roughly as n squared: each pair costs a trip across the tape."
  - title: Infinite loops are possible
    intro: "A machine that moves right forever on blanks never halts. The step limit stops our simulator."
    code: |
      def run_tm(rules, w, start="q0", max_steps=50):
          tape = dict(enumerate(w))
          pos, state, steps = 0, start, 0
          while state not in ("acc", "rej") and steps < max_steps:
              sym = tape.get(pos, "_")
              state, write, move = rules[(state, sym)]
              tape[pos] = write
              pos += 1 if move == "R" else -1
              steps += 1
          return state if state in ("acc", "rej") else "still running", steps

      forever = {("q0", "_"): ("q0", "_", "R"), ("q0", "1"): ("q0", "1", "R")}
      print(run_tm(forever, "11"))
      halts = {("q0", "_"): ("acc", "_", "R"), ("q0", "1"): ("q0", "1", "R")}
      print(run_tm(halts, "11"))
    output: |
      ('still running', 50)
      ('acc', 3)
    lines:
      - line: 13
        note: "On a blank this machine stays in q0 and moves right, forever."
      - line: 15
        note: "With one different rule it halts. Telling these two apart in general is the halting problem."
  - title: Machines as data
    intro: "A rule table is just a dictionary, so one program can run any other. This is a universal machine in miniature."
    code: |
      def universal(description, w, max_steps=1000):
          rules = {}
          for line in description.strip().splitlines():
              state, sym, new, write, move = line.split()
              rules[(state, sym)] = (new, write, move)
          tape, pos, state, steps = dict(enumerate(w)), 0, "q0", 0
          while state not in ("acc", "rej") and steps < max_steps:
              key = (state, tape.get(pos, "_"))
              if key not in rules:
                  state = "rej"
                  break
              state, tape[pos], move = rules[key][0], rules[key][1], rules[key][2]
              pos += 1 if move == "R" else -1
              steps += 1
          return state

      even_ones = """
      q0 0 q0 0 R
      q0 1 q1 1 R
      q0 _ acc _ R
      q1 0 q1 0 R
      q1 1 q0 1 R
      """
      for w in ["", "11", "101", "0110", "1"]:
          print(repr(w), universal(even_ones, w))
    output: |
      '' acc
      '11' acc
      '101' acc
      '0110' acc
      '1' rej
    lines:
      - line: 1
        note: "The machine's description is an ordinary string: data."
      - line: 12
        note: "The same loop runs any machine given to it."

playground:
  prompt: |
    Write a rule table that flips every bit of a binary string (0 to 1, 1 to 0) and accepts at the first blank. Trace it on "1011" with the simulator.
  code: |
    rules = {("q0", "0"): ("q0", "1", "R"), ("q0", "1"): ("q0", "0", "R"), ("q0", "_"): ("acc", "_", "R")}
    print(rules[("q0", "1")])

exercises:
  - id: tm-simulator
    title: Write a Turing machine simulator
    difficulty: 3
    prompt: |
      Write `run_tm(rules, w, max_steps=10000)`. `rules` maps `(state, symbol)` to `(new_state, write_symbol, move)` with `move` `"L"` or `"R"`. The start state is `"q0"`, the halting states are `"acc"` and `"rej"`, and `"_"` is the blank. A missing rule means reject. Return `(result, steps, tape)` where `result` is `"acc"`, `"rej"`, or `"timeout"` if `max_steps` steps were taken without halting, `steps` is the number of steps taken, and `tape` is the final tape contents from the leftmost to the rightmost non-blank cell as a string.
    starter: |
      def run_tm(rules, w, max_steps=10000):
          pass
    tests:
      - name: increment
        code: |
          rules = {
              ("q0", "0"): ("q0", "0", "R"), ("q0", "1"): ("q0", "1", "R"), ("q0", "_"): ("q1", "_", "L"),
              ("q1", "1"): ("q1", "0", "L"), ("q1", "0"): ("acc", "1", "R"), ("q1", "_"): ("acc", "1", "R"),
          }
          assert run_tm(rules, "1011") == ("acc", 8, "1100"), run_tm(rules, "1011")
          assert run_tm(rules, "111")[0] == "acc" and run_tm(rules, "111")[2] == "1000"
          assert run_tm(rules, "0")[2] == "1"
      - name: reject and timeout
        code: |
          rules = {("q0", "1"): ("q0", "1", "R")}
          assert run_tm(rules, "1")[0] == "rej"
          assert run_tm({("q0", "_"): ("q0", "_", "R")}, "", max_steps=25)[:2] == ("timeout", 25)
          assert run_tm({("q0", "a"): ("acc", "b", "R")}, "a") == ("acc", 1, "b")
    hints:
      - "Keep the tape in a dictionary from position to symbol; `tape.get(pos, '_')` reads a blank by default."
      - "Loop while the state is not `acc`/`rej` and `steps < max_steps`."
      - "Build the output with `''.join(tape[i] for i in sorted(tape) if tape[i] != '_')` after stripping the outer blanks."
    solution: |
      def run_tm(rules, w, max_steps=10000):
          tape = dict(enumerate(w))
          pos, state, steps = 0, "q0", 0
          while state not in ("acc", "rej"):
              if steps >= max_steps:
                  state = "timeout"
                  break
              key = (state, tape.get(pos, "_"))
              if key not in rules:
                  state = "rej"
                  break
              state, write, move = rules[key]
              tape[pos] = write
              pos += 1 if move == "R" else -1
              steps += 1
          cells = [i for i in sorted(tape) if tape[i] != "_"]
          out = "".join(tape.get(i, "_") for i in range(cells[0], cells[-1] + 1)) if cells else ""
          return state, steps, out
    explanation: "Twelve lines are enough to run any Turing machine. A dictionary makes the tape unbounded in both directions."
  - id: tm-flip
    title: "Program a machine: complement the bits"
    difficulty: 2
    prompt: |
      Write `flip_rules()` returning a rule table (in the format of the simulator) that, started on a binary string, replaces every `0` with `1` and every `1` with `0`, then accepts when it reaches the blank at the end. Use only the states `"q0"` and `"acc"`.
    starter: |
      def flip_rules():
          pass
    tests:
      - name: flips
        code: |
          def run(rules, w):
              tape = dict(enumerate(w)); pos, state = 0, "q0"
              for _ in range(1000):
                  if state in ("acc", "rej"): break
                  key = (state, tape.get(pos, "_"))
                  if key not in rules: state = "rej"; break
                  state, tape[pos], mv = rules[key]
                  pos += 1 if mv == "R" else -1
              return state, "".join(tape[i] for i in sorted(tape) if tape[i] != "_")
          r = flip_rules()
          assert run(r, "1011") == ("acc", "0100")
          assert run(r, "") == ("acc", "")
          assert run(r, "000") == ("acc", "111")
          assert {k[0] for k in r} == {"q0"}
    hints:
      - "Three rules: on 0 write 1 and move right; on 1 write 0 and move right; on the blank go to `acc`."
    solution: |
      def flip_rules():
          return {
              ("q0", "0"): ("q0", "1", "R"),
              ("q0", "1"): ("q0", "0", "R"),
              ("q0", "_"): ("acc", "_", "R"),
          }
    explanation: "A single left-to-right sweep suffices. Many TM programs are sweeps with a little bookkeeping."
  - id: tm-palindrome-steps
    title: Count the steps
    difficulty: 4
    prompt: |
      A Turing machine that decides whether a string is a palindrome compares the first and last symbols, erases them, and repeats. Write `palindrome_tm_steps(n)` returning the number of head moves such a machine makes in the worst case, modelled as follows: for a string of length `n`, the first round travels `n` cells right, the next `n - 1`, ... ; each round also returns, so the total moves are `sum` over the rounds. Use this model: round `r` (starting at 1) with `m = n - 2*(r-1)` symbols left costs `2*m` moves, and rounds continue while `m >= 2`. Return the total (0 for `n < 2`). Then write `grows_quadratically(f, n)` returning `True` if `f(2*n) / f(n)` is between 3.5 and 4.5.
    starter: |
      def palindrome_tm_steps(n):
          pass

      def grows_quadratically(f, n):
          pass
    tests:
      - name: counts
        code: |
          assert palindrome_tm_steps(0) == 0 and palindrome_tm_steps(1) == 0
          assert palindrome_tm_steps(2) == 4
          assert palindrome_tm_steps(5) == 2*5 + 2*3
          assert palindrome_tm_steps(6) == 2*6 + 2*4 + 2*2
      - name: quadratic
        code: |
          assert grows_quadratically(palindrome_tm_steps, 100) is True
          assert grows_quadratically(lambda n: n, 100) is False
          assert grows_quadratically(lambda n: n ** 3, 100) is False
    hints:
      - "Loop `m = n, n-2, n-4, ...` while `m >= 2` adding `2*m`."
    solution: |
      def palindrome_tm_steps(n):
          total, m = 0, n
          while m >= 2:
              total += 2 * m
              m -= 2
          return total


      def grows_quadratically(f, n):
          return 3.5 <= f(2 * n) / f(n) <= 4.5
    explanation: "A one-tape machine must walk back and forth across the tape, so even simple tasks like palindromes take quadratic time. This is one reason time classes (Lesson 15.8) are carefully defined."
  - id: universal
    title: Run a machine from its description
    difficulty: 4
    prompt: |
      Write `universal(description, w, max_steps=1000)`. `description` is a multi-line string, each line `state symbol new_state write move` (space-separated). Start in `q0`, treat `acc` and `rej` as halting, treat `_` as the blank, and reject on a missing rule. Return `"acc"`, `"rej"` or `"timeout"`.
    starter: |
      def universal(description, w, max_steps=1000):
          pass
    tests:
      - name: even ones
        code: |
          d = """
          q0 0 q0 0 R
          q0 1 q1 1 R
          q0 _ acc _ R
          q1 0 q1 0 R
          q1 1 q0 1 R
          """
          from itertools import product
          for n in range(0, 7):
              for t in product("01", repeat=n):
                  w = "".join(t)
                  expect = "acc" if w.count("1") % 2 == 0 else "rej"
                  assert universal(d, w) == expect, w
      - name: timeout
        code: |
          assert universal("q0 _ q0 _ R", "", max_steps=40) == "timeout"
          assert universal("q0 a acc a R", "a") == "acc"
          assert universal("q0 a acc a R", "b") == "rej"
    hints:
      - "Parse each line with `line.split()` into a dictionary of rules first."
    solution: |
      def universal(description, w, max_steps=1000):
          rules = {}
          for line in description.strip().splitlines():
              if not line.strip():
                  continue
              state, sym, new, write, move = line.split()
              rules[(state, sym)] = (new, write, move)
          tape, pos, state, steps = dict(enumerate(w)), 0, "q0", 0
          while state not in ("acc", "rej"):
              if steps >= max_steps:
                  return "timeout"
              key = (state, tape.get(pos, "_"))
              if key not in rules:
                  return "rej"
              state, tape[pos], move = rules[key]
              pos += 1 if move == "R" else -1
              steps += 1
          return state
    explanation: "The machine description is itself just data. One fixed program that runs any other is the idea behind a stored-program computer."

commonMistakes:
  - title: "Thinking a TM halts on every input"
    explanation: "It may loop forever. Deciding requires halting on all inputs; recognising does not."
  - title: "Treating the tape as finite"
    explanation: "The tape is unbounded. A real computer has finite memory, so it is a very large finite automaton; the TM is the idealisation."
  - title: "Thinking the Church-Turing thesis is a proven theorem"
    explanation: "It links an informal idea (effective procedure) to a formal one. It has never been contradicted but cannot be proved."
  - title: "Assuming extra tapes make a TM more powerful"
    explanation: "They only change speed (by a polynomial factor), never what is computable."

summary:
  - "A Turing machine has a finite controller, an unbounded tape and a head that reads, writes and moves; it accepts, rejects or loops."
  - "Decidable languages have a TM that always halts; recognisable languages only need acceptance to halt."
  - "Extra tapes, two-way tape or non-determinism do not add computing power."
  - "The Church-Turing thesis: anything effectively computable is computable by a Turing machine."
  - "A universal Turing machine runs any machine from its description: programs are data."
next: u15-computability

quiz:
  - type: mcq
    question: What can a Turing machine do that a DFA cannot?
    options: ["Write to an unbounded tape and move both ways", "Read the input", "Have states", "Accept strings"]
    answer: 0
    explanation: "Unbounded read/write memory is the difference."
  - type: mcq
    question: Which outcomes are possible for a TM on an input?
    options: ["Accept, reject, or loop forever", "Only accept or reject", "Only accept", "Only loop"]
    answer: 0
    explanation: "Possible non-termination is what makes the halting problem interesting."
  - type: mcq
    question: What is a decidable language?
    options: ["One for which some TM always halts with the right answer", "One a TM may loop on", "One with a regular expression", "A finite language"]
    answer: 0
    explanation: "It accepts members and rejects non-members, always halting."
  - type: mcq
    question: What does the Church-Turing thesis say?
    options: ["Any effectively computable function is computable by a Turing machine", "All problems are solvable", "Turing machines are fast", "Computers can think"]
    answer: 0
    explanation: "It is a thesis because 'effective' is informal."
  - type: mcq
    question: What is a universal Turing machine?
    options: ["One that simulates any machine given its description and input", "A machine with infinite states", "A machine that solves all problems", "A machine with no tape"]
    answer: 0
    explanation: "It is the model of a programmable computer."
  - type: mcq
    question: Does adding a second tape let a TM decide more languages?
    options: ["No, it only changes speed", "Yes, all languages", "Yes, but only regular ones", "Yes, exactly the context-free ones"]
    answer: 0
    explanation: "A one-tape machine can simulate it."
  - type: code
    question: |
      Write `moves(w)` returning the number of head moves a simple TM makes when it scans a string `w` from left to right once, stopping on the first blank after the input, which is `len(w) + 1`. Then write `sweep_cost(n, k)` returning the moves for `k` full back-and-forth sweeps over `n` cells, `2 * n * k`.
    starter: |
      def moves(w):
          pass

      def sweep_cost(n, k):
          pass
    tests:
      - name: counts
        code: |
          assert moves("") == 1 and moves("abc") == 4
          assert sweep_cost(10, 3) == 60 and sweep_cost(0, 5) == 0
    solution: |
      def moves(w):
          return len(w) + 1


      def sweep_cost(n, k):
          return 2 * n * k
