id: u15-computability
title: "Computability and the Halting Problem"
minutes: 60
objective: |
  Prove that some well-defined problems can never be solved by any program. You will see why programs can be counted but problems cannot, prove the halting problem undecidable by diagonalisation, use reductions to show other problems undecidable, and meet Rice's theorem and the limits of program analysis.
outcomes:
  - Explain why there are more problems than programs
  - Prove that the halting problem is undecidable
  - Use a reduction to transfer undecidability to another problem
  - State Rice's theorem and what it means for tools such as bug finders
  - Distinguish decidable, recognisable and unrecognisable problems

sections:
  - heading: More problems than programs
    body: |
      Every program is a finite string over a fixed alphabet, so the set of all programs is **countable**: list them in shortlex order (Lesson 15.1). But a *problem* is a language, a set of strings, and there are **uncountably many** sets of strings (the same diagonal argument as for infinite binary sequences: a language is just an infinite 0/1 table saying which strings are in it). So there are **vastly more problems than programs**. Therefore some languages, in fact almost all of them, are not decidable by any program. This counting argument is non-constructive: it proves unsolvable problems exist without naming one. To name one we need to point to a specific problem and prove it unsolvable.

  - heading: The halting problem
    body: |
      The **halting problem** asks: *given a program P and an input x, will P halt on x or run forever?* It would be wonderful to have such a checker: it would catch every infinite loop before you ran the code. **Alan Turing proved in 1936 that no program can do it.**

      Suppose, for contradiction, there were a function `halts(P, x)` that always returns True/False correctly. Then write this new program:

      ```
      def D(P):
          if halts(P, P):   # does P halt when fed its own source?
              while True: pass   # then loop forever
          else:
              return        # otherwise halt
      ```

      Now ask: what does `D(D)` do? If `halts(D, D)` says True ("D halts on D"), then D loops forever, so the answer was wrong. If it says False ("D loops on D"), then D returns immediately, so the answer was wrong again. Either answer is wrong, so `halts` cannot exist. The proof is a diagonalisation: line up all programs against all inputs in a table of halts/loops, and D does the opposite of the diagonal. The same self-reference lies behind Gödel's incompleteness theorem and the liar paradox ("this sentence is false").

      The halting problem is **recognisable**: simulate P on x and accept if it halts. If it halts you find out; if it does not, you wait forever. So it is recognisable but not decidable. Its **complement** (does P run forever?) is not even recognisable: if it were, we could run both recognisers at once and decide halting.

  - heading: Reductions and Rice's theorem
    body: |
      Once one problem is undecidable, others follow by **reduction**: to show B is undecidable, show that a decider for B would let you build a decider for the halting problem (A). Write A ≤ B ("A reduces to B"): a computable function turns every instance of A into an instance of B with the same answer. If A is undecidable and A ≤ B then B is undecidable. Example: "does program P ever print Hello?" is undecidable, because we can turn "does P halt on x?" into "does this modified program print Hello?" by running P on x and printing Hello only after it finishes. Other undecidable problems: whether two programs compute the same function; whether a program has a bug; whether a program ever reaches a given line; whether a program is a virus; whether a grammar is ambiguous; Hilbert's tenth problem (does a polynomial equation have an integer solution?); and the tiling of the plane by given tiles.

      **Rice's theorem** says this is no accident: *every non-trivial question about what a program does (its behaviour, not its text) is undecidable.* Non-trivial means some programs have the property and some do not. So no tool can perfectly decide "this program never crashes", "this code is dead", "this program sorts correctly". Real tools get around it by being **approximate**: they may refuse or give up (a compiler's type checker rejects some good programs, a linter reports false alarms and misses things), or they check only *syntactic* properties, or they run with timeouts. Complete correctness checking is out of reach in general, which is why testing, careful design and proofs on restricted programs (Unit 14) matter.

      Note what is still computable: a **bounded** version is decidable. "Does P halt on x **within a million steps**?" can be answered by simulation. And one can sometimes prove termination for particular programs; the theorem says no method works for all of them.

examples:
  - title: Counting programs versus problems
    intro: "Programs of length n over a small alphabet are finite in number, but the number of languages grows far faster."
    code: |
      alphabet = 2
      for n in range(1, 6):
          programs = alphabet ** n
          languages_on_strings_up_to_n = 2 ** (2 ** (n + 1) - 1)       # subsets of all strings of length <= n
          print(n, "programs:", programs, "  languages:", languages_on_strings_up_to_n)
    output: |
      1 programs: 2   languages: 8
      2 programs: 4   languages: 128
      3 programs: 8   languages: 32768
      4 programs: 16   languages: 2147483648
      5 programs: 32   languages: 9223372036854775808
    lines:
      - line: 4
        note: "Strings of length at most n number 2^(n+1) - 1 and each is in or out of a language."
      - line: 5
        note: "Languages outgrow programs doubly exponentially, hinting at the infinite gap."
  - title: Halting is recognisable but not decidable
    intro: "Simulating with a step budget answers 'halts within k steps'. A 'No' only means 'not yet'."
    code: |
      def halts_within(f, arg, steps):
          """Run a generator-based program; each 'yield' is one step."""
          gen = f(arg)
          for count in range(steps):
              try:
                  next(gen)
              except StopIteration:
                  return True, count
          return None, steps               # unknown

      def collatz(n):
          while n != 1:
              n = n // 2 if n % 2 == 0 else 3 * n + 1
              yield

      def forever(_):
          while True:
              yield

      print(halts_within(collatz, 27, 200))
      print(halts_within(collatz, 27, 50))
      print(halts_within(forever, 0, 10000))
    output: |
      (True, 111)
      (None, 50)
      (None, 10000)
    lines:
      - line: 8
        note: "'Unknown' is the honest answer: the program may halt later."
      - line: 20
        note: "27 needs 111 steps. With only 50 we cannot tell, and no budget works for every program."
  - title: The diagonal contradiction, in code
    intro: "Assume any claimed checker halts(P, x). The program D built from it defeats it."
    code: |
      def make_D(halts):
          def D(prog):
              if halts(prog, prog):
                  return "loops forever (simulated)"      # D would loop here
              return "halts"
          return D

      # Try two obviously wrong 'halting checkers'. Each is contradicted by D run on itself.
      for name, guess in [("always yes", lambda p, x: True), ("always no", lambda p, x: False)]:
          D = make_D(guess)
          says = guess(D, D)
          does = "halts" if D(D) == "halts" else "loops"
          print(name, "-> checker says halts:", says, " D(D) actually", does, " checker correct:", says == (does == "halts"))
    output: |
      always yes -> checker says halts: True  D(D) actually loops  checker correct: False
      always no -> checker says halts: False  D(D) actually halts  checker correct: False
    lines:
      - line: 3
        note: "D does the opposite of whatever the checker predicts for D(D)."
      - line: 12
        note: "Whatever the checker says about D on D, it is wrong; so no correct checker exists."
  - title: A reduction
    intro: "From 'does P halt on x?' to 'does P' print Hello?', so a Hello-detector would solve halting."
    code: |
      def build_hello_program(P, x):
          """Return a new program that prints Hello exactly when P halts on x."""
          def P_prime(_ignored):
              P(x)              # runs forever if P loops on x
              return "Hello"    # only reached if P halted
          return P_prime

      def halts_fast(x):
          return x

      def loops(x):
          while True:
              pass

      p1 = build_hello_program(halts_fast, 5)
      print(p1(None))
      p2 = build_hello_program(loops, 5)      # p2 never prints Hello, and we do not run it
      print("built p2 without running it")
    output: |
      Hello
      built p2 without running it
    lines:
      - line: 5
        note: "Hello can only be printed after P(x) has finished."
      - line: 17
        note: "If a program could detect Hello-printing, it would decide halting. So it cannot exist."
  - title: What testing cannot do
    intro: "Even a single input hides trouble: this loop's termination is an open problem for all n (the Collatz conjecture)."
    code: |
      def steps_to_one(n):
          count = 0
          while n != 1:
              n = n // 2 if n % 2 == 0 else 3 * n + 1
              count += 1
          return count

      best = max(range(1, 10000), key=steps_to_one)
      print(best, steps_to_one(best))
      print(all(steps_to_one(n) >= 0 for n in range(1, 10000)))
    output: |
      6171 261
      True
    lines:
      - line: 9
        note: "Every n below 10,000 reaches 1, but nobody has proved this for all n."
      - line: 10
        note: "A test on many inputs is evidence, not a proof of termination."

