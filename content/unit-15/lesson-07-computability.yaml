quiz:
  - type: mcq
    question: Why are there problems no program can solve?
    options: ["There are uncountably many languages but only countably many programs", "Programs are too slow", "Memory is finite", "Some languages are infinite"]
    answer: 0
    explanation: "A counting (diagonal) argument."
  - type: mcq
    question: What does the halting problem ask?
    options: ["Whether a program halts on a given input", "Whether a program is fast", "Whether a program compiles", "Whether a program has bugs"]
    answer: 0
    explanation: "Turing proved no program can answer this for all programs and inputs."
  - type: mcq
    question: What does the program D do in the proof?
    options: ["The opposite of what the checker predicts for D on D", "Runs forever always", "Halts always", "Calls itself twice"]
    answer: 0
    explanation: "That makes any prediction about D(D) wrong."
  - type: mcq
    question: Which is true of the halting problem?
    options: ["It is recognisable but not decidable", "It is decidable", "It is not even recognisable", "It is regular"]
    answer: 0
    explanation: "Simulating the program accepts exactly when it halts."
  - type: mcq
    question: What does Rice's theorem say?
    options: ["Every non-trivial question about a program's behaviour is undecidable", "All programs terminate", "Syntax checks are undecidable", "Testing is impossible"]
    answer: 0
    explanation: "Tools can only approximate such properties."
  - type: mcq
    question: To prove problem B undecidable by reduction, which should you reduce?
    options: ["A known undecidable problem to B", "B to a known undecidable problem", "B to itself", "A decidable problem to B"]
    answer: 0
    explanation: "A decider for B would then decide A."
  - type: code
    question: |
      Write `diagonalise(table)` where `table` is a list of `n` strings of `'0'`/`'1'` of length at least `n`; return the string of length `n` whose `i`-th character differs from `table[i][i]`.
    starter: |
      def diagonalise(table):
          pass
    tests:
      - name: diag
        code: |
          assert diagonalise(["010", "111", "000"]) == "101"
          assert diagonalise([]) == ""
          assert diagonalise(["1"]) == "0"
    solution: |
      def diagonalise(table):
          return "".join("1" if row[i] == "0" else "0" for i, row in enumerate(table))
