exercises:
  - id: halts-budget
    title: Halting with a step budget
    difficulty: 3
    prompt: |
      A "program" is a generator function `f(arg)` where each `yield` is one step. Write `run_budget(f, arg, budget)` returning `("halted", steps)` if the generator finishes within `budget` steps (`steps` is the number of `yield`s executed before it stopped), or `("unknown", budget)` if it has not finished after `budget` steps. Never run more than `budget` steps.
    starter: |
      def run_budget(f, arg, budget):
          pass
    tests:
      - name: halting and not
        code: |
          def count(n):
              for _ in range(n):
                  yield
          assert run_budget(count, 5, 100) == ("halted", 5)
          assert run_budget(count, 0, 100) == ("halted", 0)
          assert run_budget(count, 500, 100) == ("unknown", 100)
          def forever(_):
              while True:
                  yield
          assert run_budget(forever, None, 1000) == ("unknown", 1000)
      - name: boundary
        code: |
          def count(n):
              for _ in range(n):
                  yield
          assert run_budget(count, 10, 10) == ("halted", 10)
          assert run_budget(count, 11, 10) == ("unknown", 10)
    hints:
      - "Call `next(gen)` up to `budget` times, counting; catching `StopIteration` means it halted."
      - "A generator that yields `n` times needs one more `next` to raise `StopIteration`. Allow that extra call."
    solution: |
      def run_budget(f, arg, budget):
          gen = f(arg)
          steps = 0
          while steps <= budget:
              try:
                  next(gen)
              except StopIteration:
                  return ("halted", steps)
              steps += 1
              if steps >= budget + 1:
                  break
          return ("unknown", budget)
    explanation: "A budget turns the undecidable question into a decidable one, at the price of sometimes answering 'unknown'. A generator that yields n times has n steps; the extra next() that raises StopIteration is the halt itself."
  - id: diagonal-table
    title: Defeat a list of programs
    difficulty: 3
    prompt: |
      A table `halts[i][j]` is `True` if program `i` halts on input `j` (for `i, j` in `range(n)`). Write `diagonal_row(halts)` returning a list `d` of length `n` where `d[j]` is the **opposite** of `halts[j][j]`, and `is_new_row(halts)` returning `True` if that row is different from every row of the table. This is the program D from the lesson, which differs from program `j` on input `j`.
    starter: |
      def diagonal_row(halts):
          pass

      def is_new_row(halts):
          pass
    tests:
      - name: row
        code: |
          t = [[True, False, True], [False, False, True], [True, True, True]]
          assert diagonal_row(t) == [False, True, False]
          assert is_new_row(t) is True
          assert diagonal_row([]) == []
      - name: random tables
        code: |
          import random
          random.seed(5)
          for _ in range(40):
              n = random.randint(1, 7)
              t = [[random.random() < 0.5 for _ in range(n)] for _ in range(n)]
              assert is_new_row(t)
    hints:
      - "`not halts[j][j]` for each `j`."
      - "`diagonal_row(halts) not in halts` once rows are lists."
    solution: |
      def diagonal_row(halts):
          return [not halts[j][j] for j in range(len(halts))]


      def is_new_row(halts):
          d = diagonal_row(halts)
          return all(row != d for row in halts)
    explanation: "The diagonal row disagrees with row j at position j, so it cannot be any row of the table, no matter how the table is filled."
  - id: reduce-hello
    title: A reduction in code
    difficulty: 4
    prompt: |
      Programs here are Python functions. Write `make_hello_prog(P, x)` returning a function `Q()` that first calls `P(x)` and then returns the string `"Hello"`. Write `prints_hello(Q)` that simply calls `Q()` and returns `True` if the result is `"Hello"` (it is only safe to call when you know `Q` halts). Explain by the tests that `Q` outputs Hello exactly when `P` halts on `x`.
    starter: |
      def make_hello_prog(P, x):
          pass

      def prints_hello(Q):
          pass
    tests:
      - name: reduction
        code: |
          log = []
          def P(x):
              log.append(x)
              return x * 2
          Q = make_hello_prog(P, 21)
          assert log == [], "building Q must not run P"
          assert prints_hello(Q) is True
          assert log == [21]
          def bad(x):
              raise RuntimeError("stuck")
          Q2 = make_hello_prog(bad, 1)
          try:
              Q2()
              assert False
          except RuntimeError:
              pass
    hints:
      - "Define an inner function that calls `P(x)` then returns `\"Hello\"`."
    solution: |
      def make_hello_prog(P, x):
          def Q():
              P(x)
              return "Hello"
          return Q


      def prints_hello(Q):
          return Q() == "Hello"
    explanation: "Q prints Hello if and only if P(x) finishes. So a perfect Hello-detector would solve the halting problem, which is impossible."
  - id: busy-count
    title: A step-counting experiment
    difficulty: 3
    prompt: |
      Write `longest_collatz(limit)` returning `(n, steps)` for the starting value `n` in `1..limit` (inclusive) whose Collatz sequence (`n/2` if even, `3n+1` if odd, until reaching 1) takes the most steps; if several tie, return the smallest `n`. Write `all_reach_one(limit)` returning `True` (it will, for small limits, but this is not a proof for all n).
    starter: |
      def longest_collatz(limit):
          pass

      def all_reach_one(limit):
          pass
    tests:
      - name: results
        code: |
          assert longest_collatz(10) == (9, 19)
          assert longest_collatz(30) == (27, 111)
          assert longest_collatz(1) == (1, 0)
          assert all_reach_one(1000) is True
    hints:
      - "Write a helper `steps(n)` counting iterations until `n == 1`."
      - "`max(range(1, limit + 1), key=steps)` returns the first maximum, which is the smallest n."
    solution: |
      def _steps(n):
          count = 0
          while n != 1:
              n = n // 2 if n % 2 == 0 else 3 * n + 1
              count += 1
          return count


      def longest_collatz(limit):
          best = max(range(1, limit + 1), key=_steps)
          return best, _steps(best)


      def all_reach_one(limit):
          return all(_steps(n) >= 0 for n in range(1, limit + 1))
    explanation: "We can compute for each n, but whether the loop always terminates is an open problem. Programs this simple can already be beyond our reach."

commonMistakes:
  - title: "Believing a smarter checker could solve the halting problem"
    explanation: "The proof covers every possible checker, however clever. Practical tools approximate or restrict the programs they accept."
  - title: "Confusing undecidable with unsolvable on instances"
    explanation: "Individual programs can often be proved to halt or loop. What is impossible is one method that works for all of them."
  - title: "Treating a long-running program as one that never halts"
    explanation: "Running longer is the only way to find out, and you may never learn the answer. A time limit gives 'unknown'."
  - title: "Reducing in the wrong direction"
    explanation: "To prove B undecidable, reduce a known undecidable A to B (A ≤ B), not the other way round."

summary:
  - "Programs are countable but languages are not, so most problems are not solvable by any program."
  - "The halting problem is undecidable: a program D that does the opposite of the predicted behaviour of D on itself contradicts any checker."
  - "Halting is recognisable (simulate and wait) but its complement is not."
  - "Reductions transfer undecidability; Rice's theorem makes every non-trivial semantic property of programs undecidable."
  - "Bounded versions such as halting within k steps are decidable, and practical tools work by approximation."
