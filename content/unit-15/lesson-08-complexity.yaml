quiz:
  - type: mcq
    question: What does a verifier do?
    options: ["Checks a proposed certificate in polynomial time", "Finds a solution", "Proves a problem is hard", "Compiles code"]
    answer: 0
    explanation: "It takes the input and the certificate and answers yes or no."
  - type: mcq
    question: What is the relationship between P and NP?
    options: ["P is a subset of NP", "NP is a subset of P", "They are disjoint", "They are proven equal"]
    answer: 0
    explanation: "A problem solvable fast is also checkable fast."
  - type: mcq
    question: Which problem is known to be in P?
    options: ["Shortest path in a graph", "Hamiltonian path", "General SAT", "Travelling salesperson"]
    answer: 0
    explanation: "Dijkstra's algorithm is polynomial. The others have no known polynomial algorithm."
  - type: mcq
    question: What would P = NP imply?
    options: ["Every quickly checkable problem is quickly solvable", "All problems are decidable", "All programs halt", "Exponential algorithms are fast"]
    answer: 0
    explanation: "Search would be as easy as checking."
  - type: mcq
    question: What is a certificate for 'this Boolean formula is satisfiable'?
    options: ["A satisfying assignment", "The number of variables", "The formula's length", "A proof it is unsatisfiable"]
    answer: 0
    explanation: "Plugging it in verifies the formula in linear time."
  - type: mcq
    question: What is the brute-force time for SAT with n variables?
    options: ["About 2^n times the formula size", "About n", "About n^2", "Constant"]
    answer: 0
    explanation: "It tries every assignment."
  - type: code
    question: |
      Write `verify_subset(numbers, target, indices)` returning `True` if `indices` is a list of distinct valid positions in `numbers` whose values sum to `target`.
    starter: |
      def verify_subset(numbers, target, indices):
          pass
    tests:
      - name: verify
        code: |
          n = [3, 34, 4, 12, 5, 2]
          assert verify_subset(n, 9, [2, 4]) and not verify_subset(n, 9, [0, 1])
          assert not verify_subset(n, 8, [4, 4, 0]) and not verify_subset(n, 3, [9])
          assert verify_subset(n, 0, [])
    solution: |
      def verify_subset(numbers, target, indices):
          if len(set(indices)) != len(indices):
              return False
          if any(not (0 <= i < len(numbers)) for i in indices):
              return False
          return sum(numbers[i] for i in indices) == target
