exercises:
  - id: verify-sat
    title: Verify a SAT assignment
    difficulty: 2
    prompt: |
      Write `verify_sat(formula, assignment)` where `formula` is a list of clauses (lists of non-zero ints; `3` means variable 3, `-3` means NOT variable 3) and `assignment` is a dict from variable number to a boolean. Return `True` if every clause has at least one true literal. An empty formula is satisfied; an empty clause is not.
    starter: |
      def verify_sat(formula, assignment):
          pass
    tests:
      - name: verify
        code: |
          f = [[1, -2, 3], [-1, 2], [-3, 2], [1, 2, 3]]
          assert verify_sat(f, {1: True, 2: True, 3: False}) is True
          assert verify_sat(f, {1: True, 2: False, 3: False}) is False
          assert verify_sat([], {}) is True
          assert verify_sat([[]], {1: True}) is False
          assert verify_sat([[-1]], {1: False}) is True
    hints:
      - "`any(assignment[abs(l)] == (l > 0) for l in clause)` checks one clause."
    solution: |
      def verify_sat(formula, assignment):
          return all(any(assignment[abs(l)] == (l > 0) for l in clause) for clause in formula)
    explanation: "The check is linear in the size of the formula, which is why SAT is in NP."
  - id: solve-sat
    title: Brute-force SAT
    difficulty: 3
    prompt: |
      Write `solve_sat(formula, n)` that tries all assignments to variables `1..n` and returns the first satisfying assignment as a dict (trying `False` before `True`, variable 1 changing slowest) or `None`. Also write `count_models(formula, n)` returning how many assignments satisfy the formula.
    starter: |
      from itertools import product

      def solve_sat(formula, n):
          pass

      def count_models(formula, n):
          pass
    tests:
      - name: solve
        code: |
          f = [[1, 2], [-1, 2]]
          assert solve_sat(f, 2) == {1: False, 2: True}
          assert solve_sat([[1], [-1]], 1) is None
          assert solve_sat([], 2) == {1: False, 2: False}
      - name: count
        code: |
          assert count_models([[1, 2]], 2) == 3
          assert count_models([[1], [-1]], 1) == 0
          assert count_models([], 3) == 8
          assert count_models([[1, -2, 3], [-1, 2], [-3, 2], [1, 2, 3]], 3) == 3
    hints:
      - "`product([False, True], repeat=n)` lists assignments with the first variable changing slowest."
    solution: |
      from itertools import product


      def _ok(formula, a):
          return all(any(a[abs(l)] == (l > 0) for l in clause) for clause in formula)


      def solve_sat(formula, n):
          for bits in product([False, True], repeat=n):
              a = {i + 1: b for i, b in enumerate(bits)}
              if _ok(formula, a):
                  return a
          return None


      def count_models(formula, n):
          total = 0
          for bits in product([False, True], repeat=n):
              a = {i + 1: b for i, b in enumerate(bits)}
              if _ok(formula, a):
                  total += 1
          return total
    explanation: "Checking is cheap but there are 2^n things to check. That gap is the P versus NP question in miniature."
  - id: verify-hampath
    title: Verify a Hamiltonian path
    difficulty: 3
    prompt: |
      Write `verify_ham_path(graph, path)` for an undirected graph given as a dict from vertex to a set of neighbours. Return `True` if `path` (a list of vertices) visits **every vertex exactly once** and each consecutive pair is an edge.
    starter: |
      def verify_ham_path(graph, path):
          pass
    tests:
      - name: verify
        code: |
          g = {1: {2, 3}, 2: {1, 3, 4}, 3: {1, 2, 4}, 4: {2, 3}}
          assert verify_ham_path(g, [1, 2, 3, 4]) and verify_ham_path(g, [1, 3, 2, 4])
          assert not verify_ham_path(g, [1, 4, 2, 3])
          assert not verify_ham_path(g, [1, 2, 3])
          assert not verify_ham_path(g, [1, 2, 3, 3, 4])
          assert verify_ham_path({1: set()}, [1])
          assert not verify_ham_path({1: set()}, [])
    hints:
      - "Compare `sorted(path)` to `sorted(graph)` for the 'every vertex once' part."
    solution: |
      def verify_ham_path(graph, path):
          if sorted(path) != sorted(graph):
              return False
          return all(path[i + 1] in graph[path[i]] for i in range(len(path) - 1))
    explanation: "Verifying takes linear time; finding such a path in a large graph has no known polynomial algorithm."
  - id: subset-sum-dp
    title: Subset sum when numbers are small
    difficulty: 4
    prompt: |
      Write `subset_sum(numbers, target)` returning `True` if some subset of the non-negative integers `numbers` sums to `target`, using dynamic programming over reachable sums (Unit 8). Then write `dp_steps(numbers, target)` returning the number of (number, sum) updates your table does: `len(numbers) * (target + 1)`.
    starter: |
      def subset_sum(numbers, target):
          pass

      def dp_steps(numbers, target):
          pass
    tests:
      - name: sums
        code: |
          assert subset_sum([3, 34, 4, 12, 5, 2], 9) is True
          assert subset_sum([3, 34, 4, 12, 5, 2], 30) is False
          assert subset_sum([], 0) is True and subset_sum([], 5) is False
          assert subset_sum([5], 0) is True
          assert subset_sum([1, 2, 5], 8) is True
      - name: steps
        code: |
          assert dp_steps([1, 2, 3], 10) == 33
          assert dp_steps([], 10) == 0
    hints:
      - "`reachable = {0}`; for each number add `r + x` for each `r` in `reachable` that stays at most `target`."
    solution: |
      def subset_sum(numbers, target):
          reachable = {0}
          for x in numbers:
              reachable |= {r + x for r in reachable if r + x <= target}
          return target in reachable


      def dp_steps(numbers, target):
          return len(numbers) * (target + 1)
    explanation: "The time is polynomial in the *value* of the target, not in the number of bits needed to write it, so this is 'pseudo-polynomial' and does not show P = NP."

commonMistakes:
  - title: "Reading NP as 'not polynomial'"
    explanation: "NP means nondeterministic polynomial time, or quickly verifiable. P is inside NP."
  - title: "Assuming exponential time means useless"
    explanation: "Exponential algorithms are fine for small inputs. And practical SAT solvers handle huge instances that follow structure."
  - title: "Confusing finding with checking"
    explanation: "Checking a solution is polynomial for NP problems. Finding one may seem to need exponential search."
  - title: "Treating pseudo-polynomial as polynomial"
    explanation: "A running time of target x n is polynomial in the number's value, but the input only has log(target) bits."

summary:
  - "Running time is measured against input size; polynomial time is the working notion of efficient, exponential time is not."
  - "P: problems decidable in polynomial time. NP: problems whose yes-answers have short certificates a polynomial verifier can check."
  - "P ⊆ NP ⊆ PSPACE ⊆ EXPTIME; whether P = NP is the most famous open problem in computer science."
  - "Brute force over certificates solves any NP problem in exponential time; no polynomial method is known for SAT, Hamiltonian path or subset sum."
  - "Subset sum with small numbers is solvable by dynamic programming (pseudo-polynomial), which does not resolve P vs NP."
