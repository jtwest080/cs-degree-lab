id: u15-complexity
title: "Complexity: P, NP and Verification"
minutes: 60
objective: |
  Move from "can it be solved?" to "how fast?". You will define running time as a function of input size, meet the class P of efficiently solvable problems and the class NP of problems whose answers can be checked quickly, work with certificates and verifiers, and understand the P versus NP question.
outcomes:
  - Define time complexity and explain polynomial versus exponential growth
  - Define P and NP using deciders and verifiers
  - Write a polynomial-time verifier for problems such as SAT, subset sum and Hamiltonian path
  - Explain why checking can be easier than finding
  - State the P versus NP question and what it would mean to answer it

sections:
  - heading: Measuring time
    body: |
      Some solvable problems are solvable only in theory: a program exists but would not finish before the sun burns out. We measure the **running time** of a Turing machine (or any program, since they all simulate each other with only polynomial slowdown) as a function of the **input size** n: the longest running time over all inputs of that length (the **worst case**, as in Unit 4). We care about how it **grows**, so we use Big-O: a polynomial algorithm takes O(nᵏ) steps for some constant k; an exponential one takes something like 2ⁿ.

      The difference is dramatic. At a billion steps a second, an n² algorithm handles n = 100,000 in about 10 seconds, but a 2ⁿ algorithm handles n = 60 in over 30 years and n = 100 in more time than the age of the universe. Doubling the speed of a computer lets a 2ⁿ algorithm handle only one more input symbol. So **polynomial time is the working definition of "efficient"**. This is a convention, and a rough one (n¹⁰⁰ is not practical, and some exponential algorithms are fine on real data), but it is robust: polynomial time is the same for every reasonable machine model (the *extended* Church-Turing thesis), and polynomials are closed under composition, so calling an efficient subroutine a polynomial number of times is efficient.

  - heading: P and NP
    body: |
      **P** is the class of decision problems solvable by a deterministic algorithm in polynomial time. Sorting, shortest paths (Unit 8), connectivity, primality testing (proved in P in 2002), matching, linear programming and 2-colouring a graph are all in P.

      Many important problems seem to have no polynomial algorithm but share a special feature: if someone *shows* you a solution, you can check it quickly. A **certificate** (or witness) is such a proof of a "yes" answer, and a **verifier** is a polynomial-time algorithm that checks a candidate certificate against the input. **NP** (nondeterministic polynomial time) is the class of decision problems that have a polynomial-time verifier, equivalently, solvable in polynomial time by a **nondeterministic** machine that guesses the certificate (the NFA idea of Lesson 15.3 applied to time: "there exists a choice such that..."). Examples:
      - **SAT** (satisfiability): is there an assignment of true/false to the variables that makes a Boolean formula true? Certificate: the assignment; verification: evaluate the formula.
      - **Subset sum**: does some subset of these numbers add up to the target? Certificate: the subset.
      - **Hamiltonian path**: is there a path through a graph visiting every vertex exactly once? Certificate: the path (the vertex order).
      - **Clique**: does the graph contain k vertices all pairwise adjacent? **Vertex cover**, **graph colouring with 3 colours**, **travelling salesperson** (is there a tour of length at most L?), the **knapsack** decision version, and **integer factoring** (does n have a factor below k?) are in NP as well.

      Every problem in P is in NP (a verifier can ignore the certificate and just solve the problem), so **P ⊆ NP**. The great open question is whether **P = NP**: can every problem whose solutions are quick to check also be quickly *solved*? Almost everyone believes **not**: finding a proof seems harder than checking one, finding a needle harder than recognising it, writing a symphony harder than recognising a good one. But after more than fifty years nobody has proved it, and it is one of the seven Clay Millennium Problems with a million-dollar prize. If P = NP then breaking most cryptography (Unit 16), optimal scheduling, protein design and mathematical theorem finding would all be efficiently solvable; the world would change.

  - heading: Finding versus checking
    body: |
      Brute force always works for problems in NP, since there are finitely many candidate certificates: try them all. SAT with n variables has 2ⁿ assignments; subset sum with n numbers has 2ⁿ subsets; Hamiltonian path has up to n! orderings. That is exponential time, so **NP ⊆ EXPTIME**. The truth for each problem lies somewhere between P (known fast algorithm) and exponential (known only slow). For many, we have clever algorithms (dynamic programming for subset sum with small numbers, Unit 8; SAT solvers that handle millions of variables on real inputs) but nothing that is polynomial in the worst case.

      Two warnings about the definitions. First, NP means "verifiable quickly", **not** "not polynomial": it contains P. Second, the definition covers only **yes** answers: proving that a formula is *unsatisfiable* has no obvious short certificate. The class of problems whose "no" answers have short certificates is **coNP**; whether NP = coNP is also open. Between P and NP there are suspected "intermediate" problems such as graph isomorphism and integer factoring, which are not known to be in P and are not believed to be NP-complete (Lesson 15.9). Finally, complexity classes exist for **space** too: PSPACE contains problems solvable using a polynomial amount of memory, however long they take, such as many two-player game positions. The known chain is P ⊆ NP ⊆ PSPACE ⊆ EXPTIME, with P ≠ EXPTIME proven, so at least one of these inclusions is strict, but we don't know which.

examples:
  - title: Polynomial versus exponential
    intro: "How long would n steps, n^2, n^3 and 2^n take at a billion steps per second?"
    code: |
      def pretty(seconds):
          for unit, size in [("years", 365 * 24 * 3600), ("days", 86400), ("hours", 3600), ("minutes", 60)]:
              if seconds >= size:
                  return f"{seconds / size:,.1f} {unit}"
          return f"{seconds:.3g} seconds"

      speed = 1e9
      for n in (20, 40, 60, 100):
          row = [pretty(f(n) / speed) for f in (lambda n: n, lambda n: n ** 2, lambda n: n ** 3, lambda n: 2 ** n)]
          print(n, row)
    output: |
      20 ['2e-08 seconds', '4e-07 seconds', '8e-06 seconds', '0.00105 seconds']
      40 ['4e-08 seconds', '1.6e-06 seconds', '6.4e-05 seconds', '18.3 minutes']
      60 ['6e-08 seconds', '3.6e-06 seconds', '0.000216 seconds', '36.6 years']
      100 ['1e-07 seconds', '1e-05 seconds', '0.001 seconds', '40,196,936,841,331.5 years']
    lines:
      - line: 9
        note: "n, n squared, n cubed, and 2 to the n."
      - line: 10
        note: "At n = 100 the exponential column is astronomical while the polynomials are instant."
  - title: A verifier for SAT
    intro: "Checking an assignment is easy: evaluate each clause. Finding one by brute force tries all 2^n."
    code: |
      # CNF formula: list of clauses, each a list of literals; +i means variable i, -i means NOT i
      formula = [[1, -2, 3], [-1, 2], [-3, 2], [1, 2, 3]]

      def verify(formula, assignment):
          return all(any(assignment[abs(l)] == (l > 0) for l in clause) for clause in formula)

      def brute_force(formula, n):
          from itertools import product
          tried = 0
          for bits in product([False, True], repeat=n):
              tried += 1
              assignment = {i + 1: b for i, b in enumerate(bits)}
              if verify(formula, assignment):
                  return assignment, tried
          return None, tried

      print(verify(formula, {1: True, 2: True, 3: False}))
      print(brute_force(formula, 3))
    output: |
      True
      ({1: False, 2: True, 3: True}, 4)
    lines:
      - line: 5
        note: "A clause is satisfied if some literal is true; the formula if every clause is. Time is linear in the formula size."
      - line: 10
        note: "Brute force tries up to 2^n assignments."
  - title: A verifier for subset sum
    intro: "Given a claimed subset, check membership and sum in polynomial time."
    code: |
      from itertools import combinations
      numbers = [3, 34, 4, 12, 5, 2]
      target = 9

      def verify(numbers, target, subset_indices):
          return len(set(subset_indices)) == len(subset_indices) and \
                 all(0 <= i < len(numbers) for i in subset_indices) and \
                 sum(numbers[i] for i in subset_indices) == target

      print(verify(numbers, target, [2, 4]))        # 4 + 5
      print(verify(numbers, target, [0, 1]))        # 3 + 34
      found = next((c for r in range(len(numbers) + 1) for c in combinations(range(len(numbers)), r) if verify(numbers, target, c)), None)
      print(found)
    output: |
      True
      False
      (2, 4)
    lines:
      - line: 5
        note: "The certificate is just a list of indices: the subset is short to describe and quick to check."
      - line: 12
        note: "Searching tries all 2^n subsets in the worst case."
  - title: A verifier for Hamiltonian path
    intro: "A certificate is the proposed path; check it visits every vertex once along real edges."
    code: |
      graph = {1: {2, 3}, 2: {1, 3, 4}, 3: {1, 2, 4}, 4: {2, 3}}

      def verify(graph, path):
          if sorted(path) != sorted(graph):
              return False
          return all(path[i + 1] in graph[path[i]] for i in range(len(path) - 1))

      print(verify(graph, [1, 2, 3, 4]))
      print(verify(graph, [1, 3, 2, 4]))
      print(verify(graph, [1, 4, 2, 3]))
      print(verify(graph, [1, 2, 3]))
    output: |
      True
      True
      False
      False
    lines:
      - line: 5
        note: "Visits each vertex exactly once: the path is a permutation of the vertices."
      - line: 6
        note: "Every consecutive pair must be joined by an edge."
  - title: Unlike 2-SAT, 3-SAT has no known fast algorithm
    intro: "2-SAT clauses force implications, so propagation solves it in polynomial time. This simple solver is a tiny taste."
    code: |
      def two_sat(clauses, n):
          # build the implication graph: (a OR b) means (NOT a -> b) and (NOT b -> a)
          from collections import defaultdict
          g = defaultdict(set)
          for a, b in clauses:
              g[-a].add(b); g[-b].add(a)
          def reach(s):
              seen, stack = {s}, [s]
              while stack:
                  u = stack.pop()
                  for v in g[u]:
                      if v not in seen:
                          seen.add(v); stack.append(v)
              return seen
          # unsatisfiable iff some x reaches NOT x and NOT x reaches x
          return not any(-x in reach(x) and x in reach(-x) for x in range(1, n + 1))

      print(two_sat([(1, 2), (-1, 2), (1, -2)], 2))
      print(two_sat([(1, 2), (-1, 2), (1, -2), (-1, -2)], 2))
    output: |
      True
      False
    lines:
      - line: 3
        note: "Each clause (a or b) gives two implications, so propagation determines everything."
      - line: 15
        note: "Graph reachability is polynomial. For clauses with three literals no such trick is known."

