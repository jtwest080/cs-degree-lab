quiz:
  - type: mcq
    question: What does A ≤ₚ B mean?
    options: ["A polynomial-time conversion turns instances of A into instances of B with the same answer", "A is slower than B", "B is a subset of A", "A is in P"]
    answer: 0
    explanation: "Solving B quickly would then solve A quickly."
  - type: mcq
    question: What is an NP-complete problem?
    options: ["A problem in NP to which every problem in NP reduces", "A problem outside NP", "A problem with no solution", "A problem in P"]
    answer: 0
    explanation: "It is a hardest problem in NP."
  - type: mcq
    question: What would a polynomial-time algorithm for SAT prove?
    options: ["P = NP", "P ≠ NP", "All programs halt", "NP = EXPTIME"]
    answer: 0
    explanation: "Every NP problem reduces to SAT."
  - type: mcq
    question: A graph has n vertices. How are independent sets and vertex covers related?
    options: ["S is independent exactly when the other vertices form a cover", "They are unrelated", "Independent sets are always bigger", "A cover is always a clique"]
    answer: 0
    explanation: "Hence max independent set + min cover = n."
  - type: mcq
    question: What guarantee does the 2-approximation for vertex cover give?
    options: ["The cover is at most twice the optimum", "The cover is optimal", "It runs in constant time", "It finds a clique"]
    answer: 0
    explanation: "The picked edges form a matching, a lower bound on the optimum."
