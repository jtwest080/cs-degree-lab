          pass
    tests:
      - name: complement
        code: |
          V = {1, 2, 3}
          assert complement_graph(V, [(1, 2)]) == {frozenset({1, 3}), frozenset({2, 3})}
          assert complement_graph(V, []) == {frozenset({1, 2}), frozenset({1, 3}), frozenset({2, 3})}
          assert complement_graph({1}, []) == set()
          assert complement_graph(V, [(1, 2), (2, 3), (1, 3)]) == set()
    solution: |
      from itertools import combinations


      def complement_graph(V, edges):
          present = {frozenset(e) for e in edges}
          return {frozenset(p) for p in combinations(sorted(V), 2)} - present
