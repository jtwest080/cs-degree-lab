id: u15-npcomplete
title: "NP-Completeness and Coping with Hard Problems"
minutes: 60
objective: |
  Learn how problems are shown to be as hard as any in NP, using polynomial-time reductions, and how to reduce 3-SAT to independent set, clique and vertex cover. Then learn what engineers do when a problem is NP-complete: exact search with pruning, approximation algorithms, heuristics and special cases.
outcomes:
  - Define polynomial-time reductions, NP-hard and NP-complete
  - Explain the Cook-Levin theorem and why SAT is the first NP-complete problem
  - Reduce 3-SAT to independent set, and independent set to clique and vertex cover
  - Implement a backtracking SAT solver with unit propagation
  - Implement and analyse a 2-approximation for vertex cover

sections:
  - heading: Reductions and NP-completeness
    body: |
      Inside NP there are problems that are, in a precise sense, the **hardest**. A **polynomial-time reduction** from A to B (written A ≤ₚ B) is a function, computable in polynomial time, that converts every instance x of A into an instance f(x) of B such that **x is a yes-instance of A if and only if f(x) is a yes-instance of B**. If we could solve B fast, we could solve A fast: convert, then solve. (Compare the reductions of Lesson 15.7, which only asked for computability.) A problem is **NP-hard** if every problem in NP reduces to it, and **NP-complete** if it is also in NP. An NP-complete problem is therefore a hardest problem in NP: **a fast algorithm for any one of them would solve every problem in NP fast**, and so would prove P = NP. Conversely, if P ≠ NP, none of them has a polynomial algorithm.

      How do we get the first one? **The Cook-Levin theorem (1971)** proved **SAT is NP-complete**. The idea: any problem in NP has a polynomial-time verifier running on a Turing machine; the machine's computation, a table of tape contents over time, can be described by a huge Boolean formula that is satisfiable exactly when the verifier can be made to accept, so the formula encodes "there is a certificate that makes the machine accept". Once SAT is known to be hard, new problems are shown hard by reducing a known hard problem *to* them. In 1972 Richard Karp did this for 21 problems, and now thousands of problems in scheduling, packing, routing, logic, games and biology are known to be NP-complete.

  - heading: A chain of reductions
    body: |
      **3-SAT** restricts SAT to formulas in which every clause has exactly three literals. It is still NP-complete (any clause can be broken into three-literal clauses with extra variables), while **2-SAT** is in P (Lesson 15.8). It is the usual starting point.

      **3-SAT ≤ₚ Independent Set.** An **independent set** of size k in a graph is k vertices with no edge between any two of them. Given a 3-SAT formula with m clauses, build a graph with a **triangle** for each clause (one vertex for each of its three literals) and add an edge between every pair of vertices labelled by **complementary literals** (x and ¬x). Ask for an independent set of size m. An independent set can take at most one vertex from each triangle (they are connected), so size m means exactly one literal per clause; the extra edges forbid choosing both x and ¬x. Setting the chosen literals true gives a satisfying assignment, and a satisfying assignment gives one true literal per clause, which gives the independent set. So the formula is satisfiable iff the graph has an independent set of size m.

      The rest follow easily. **Independent set ≤ₚ Clique:** a set is independent in G exactly when it is a clique in the **complement** graph (edges and non-edges swapped). **Independent set ≤ₚ Vertex cover:** a **vertex cover** is a set of vertices touching every edge, and S is independent exactly when all the vertices *outside* S form a vertex cover, so a graph has an independent set of size k iff it has a vertex cover of size n − k. These facts mean that Clique, Independent Set and Vertex Cover are all NP-complete, three faces of the same problem.

  - heading: When the problem is NP-complete
    body: |
      NP-completeness is not a reason to give up; it tells you which expectations to drop. Engineers use several strategies.

      - **Exact search with pruning.** Backtracking explores the space of choices but abandons a branch as soon as it cannot succeed. For SAT, **DPLL** assigns variables one at a time, simplifies the formula, and uses **unit propagation** (a clause with one remaining literal forces that literal). Modern **SAT solvers** extend this with clause learning and run on formulas with millions of variables, routinely solving hardware verification, planning and scheduling problems that look impossible by theory, because real instances have structure.
      - **Approximation algorithms** run in polynomial time and give a provably near-optimal answer. Vertex cover has a simple **2-approximation**: repeatedly pick any edge that is still uncovered and add *both* endpoints; the result is at most twice the optimal size, because the picked edges share no vertices (a matching) and any cover needs one endpoint of each. Some problems cannot be approximated well unless P = NP (general travelling salesperson), while others have schemes getting arbitrarily close.
      - **Heuristics and local search** (greedy choices, hill climbing, simulated annealing, genetic algorithms) give good answers with no guarantee; common in practice (Unit 17 meets related ideas).
      - **Special cases.** Restricting the input often makes it easy: 2-SAT, bipartite graphs, trees, small numbers (Lesson 15.8's dynamic programming), or a small parameter k (**fixed-parameter tractable**: vertex cover is solvable in O(2ᵏ · n)).
      - **Change the problem.** Settle for an average-case, probabilistic or "good enough" answer.

      A last remark: hardness can be a feature. Cryptography (Unit 16) relies on problems believed hard on average, like factoring. But note that factoring is *not* known to be NP-complete, and the cryptography needs hardness for *typical* instances, which is a stronger thing than worst-case NP-hardness.

examples:
  - title: Reduce 3-SAT to independent set
    intro: "A triangle per clause, plus edges between complementary literals. Satisfiable iff an independent set of size m exists."
    code: |
      from itertools import combinations

      def reduce_3sat(clauses):
          vertices = [(i, lit) for i, c in enumerate(clauses) for lit in c]
          edges = set()
          for i, c in enumerate(clauses):
              for a, b in combinations(c, 2):
                  edges.add(frozenset([(i, a), (i, b)]))
          for (i, a), (j, b) in combinations(vertices, 2):
              if a == -b:
                  edges.add(frozenset([(i, a), (j, b)]))
          return vertices, edges, len(clauses)

      def has_independent_set(vertices, edges, k):
          for S in combinations(vertices, k):
              if all(frozenset([a, b]) not in edges for a, b in combinations(S, 2)):
                  return True
          return False

      sat = [[1, 2, 3], [-1, -2, 3], [1, -2, -3]]
      unsat = [[1, 1, 1], [-1, -1, -1]]
      for name, f in [("satisfiable", sat), ("unsatisfiable", unsat)]:
          v, e, k = reduce_3sat(f)
          print(name, len(v), len(e), has_independent_set(v, e, k))
    output: |
      satisfiable 9 15 True
      unsatisfiable 6 3 False
    lines:
      - line: 5
        note: "One vertex for each literal of each clause, remembering which clause it belongs to."
      - line: 9
        note: "The triangle: at most one literal can be chosen from each clause."
      - line: 12
        note: "Complementary literals conflict, so the chosen literals form a consistent assignment."
  - title: Independent set, clique and vertex cover
    intro: "The same vertex sets give answers to three different problems."
    code: |
      from itertools import combinations

      V = {1, 2, 3, 4, 5}
      E = {frozenset(e) for e in [(1, 2), (2, 3), (3, 4), (4, 5), (1, 5), (2, 4)]}

      def independent(S):
          return all(frozenset(p) not in E for p in combinations(S, 2))

      def cover(S):
          return all(e & S for e in E)

      comp = {frozenset(p) for p in combinations(V, 2)} - E
      def clique_in_complement(S):
          return all(frozenset(p) in comp for p in combinations(S, 2))

      for S in [{1, 3}, {1, 3, 4}, {2, 5}]:
          print(sorted(S), "independent:", independent(S),
                " clique in complement:", clique_in_complement(S),
                " rest is a vertex cover:", cover(V - S))
    output: |
      [1, 3] independent: True  clique in complement: True  rest is a vertex cover: True
      [1, 3, 4] independent: False  clique in complement: False  rest is a vertex cover: False
      [2, 5] independent: True  clique in complement: True  rest is a vertex cover: True
    lines:
      - line: 10
        note: "Swap edges and non-edges to get the complement graph."
      - line: 17
        note: "The three questions have the same answer for every set."
  - title: DPLL with unit propagation
    intro: "Assign variables, simplify, and backtrack. Unit clauses force their literal."
    code: |
      def simplify(formula, lit):
          out = []
          for clause in formula:
              if lit in clause:
                  continue
              reduced = [l for l in clause if l != -lit]
              out.append(reduced)
          return out

      def dpll(formula, assignment=None):
          assignment = dict(assignment or {})
          formula = [list(c) for c in formula]
          while True:
              if any(len(c) == 0 for c in formula):
                  return None
              unit = next((c[0] for c in formula if len(c) == 1), None)
              if unit is None:
                  break
              assignment[abs(unit)] = unit > 0
              formula = simplify(formula, unit)
          if not formula:
              return assignment
          lit = formula[0][0]
          for choice in (lit, -lit):
              res = dpll(simplify(formula, choice), {**assignment, abs(choice): choice > 0})
              if res is not None:
                  return res
          return None

      print(dpll([[1, 2], [-1, 2], [-2, 3], [-3, -1]]))
      print(dpll([[1], [-1, 2], [-2]]))
    output: |
      {1: False, 2: True, 3: True}
      None
    lines:
      - line: 14
        note: "A one-literal clause leaves no choice, so propagate it without branching."
      - line: 24
        note: "Branch on a literal; the recursive call backtracks if both choices fail."
  - title: A 2-approximation for vertex cover
    intro: "Pick an uncovered edge and take both endpoints. The answer is never more than twice the optimum."
    code: |
      from itertools import combinations

      edges = [(1, 2), (2, 3), (3, 4), (4, 5), (1, 5), (2, 4), (5, 6), (6, 7)]

      def approx_cover(edges):
          chosen, matching = set(), []
          for u, v in edges:
              if u not in chosen and v not in chosen:
                  chosen |= {u, v}
                  matching.append((u, v))
          return chosen, matching

      def optimal_cover(edges):
          vs = sorted({x for e in edges for x in e})
          for k in range(len(vs) + 1):
              for S in combinations(vs, k):
                  if all(u in S or v in S for u, v in edges):
                      return set(S)

      approx, matching = approx_cover(edges)
      best = optimal_cover(edges)
      print(sorted(approx), len(approx))
      print(sorted(best), len(best))
      print("ratio:", len(approx) / len(best), " matching size:", len(matching))
    output: |
      [1, 2, 3, 4, 5, 6] 6
      [1, 2, 4, 6] 4
      ratio: 1.5  matching size: 3
    lines:
      - line: 7
        note: "An edge with neither endpoint chosen yet: add both."
      - line: 25
        note: "The chosen edges form a matching, and any cover needs one endpoint of each, so the optimum is at least the matching size."
  - title: "A heuristic with no guarantee: nearest neighbour for TSP"
    intro: "Always go to the closest unvisited city. Fast, and often decent, but it can be far from optimal."
    code: |
      from itertools import permutations
      from math import dist

      cities = {"A": (0, 0), "B": (1, 5), "C": (5, 2), "D": (6, 6), "E": (3, 3)}

      def tour_length(order):
          return sum(dist(cities[order[i]], cities[order[(i + 1) % len(order)]]) for i in range(len(order)))

      def nearest(start):
          left, order = set(cities) - {start}, [start]
          while left:
              nxt = min(left, key=lambda c: dist(cities[order[-1]], cities[c]))
              order.append(nxt); left.remove(nxt)
          return order

      greedy = nearest("A")
      best = min((("A",) + p for p in permutations(set(cities) - {"A"})), key=tour_length)
      print(greedy, round(tour_length(greedy), 2))
      print("best tour length:", round(tour_length(best), 2))
    output: |
      ['A', 'E', 'C', 'D', 'B'] 20.8
      best tour length: 20.8
    lines:
      - line: 11
        note: "Greedy: nothing looks ahead."
      - line: 17
        note: "The exact answer needs (n-1)! tours checked: 24 here, but 87 billion for 15 cities."

