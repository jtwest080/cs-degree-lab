exercises:
  - id: indep-to-cover
    title: Independent set and vertex cover
    difficulty: 3
    prompt: |
      A graph is given as a vertex set `V` and a list of edges (pairs). Write `is_independent(V, edges, S)` (no edge has both endpoints in `S`), `is_vertex_cover(V, edges, C)` (every edge has an endpoint in `C`), and `max_independent_size(V, edges)` computed by brute force over subsets. Then write `min_cover_size(V, edges)` via brute force. For every graph, `max_independent_size + min_cover_size == len(V)`.
    starter: |
      from itertools import combinations

      def is_independent(V, edges, S):
          pass

      def is_vertex_cover(V, edges, C):
          pass

      def max_independent_size(V, edges):
          pass

      def min_cover_size(V, edges):
          pass
    tests:
      - name: definitions
        code: |
          V = {1, 2, 3, 4, 5}
          E = [(1, 2), (2, 3), (3, 4), (4, 5), (1, 5), (2, 4)]
          assert is_independent(V, E, {1, 3}) and not is_independent(V, E, {1, 2})
          assert is_vertex_cover(V, E, {2, 4, 5}) and not is_vertex_cover(V, E, {1, 3})
          assert is_independent(V, E, set()) and is_vertex_cover(V, E, V)
      - name: complementary sizes
        code: |
          import random
          random.seed(11)
          for _ in range(12):
              n = random.randint(1, 7)
              V = set(range(n))
              E = [(a, b) for a in range(n) for b in range(a + 1, n) if random.random() < 0.4]
              assert max_independent_size(V, E) + min_cover_size(V, E) == n, (n, E)
          assert max_independent_size({1, 2, 3}, []) == 3 and min_cover_size({1, 2, 3}, []) == 0
    hints:
      - "`frozenset((u, v)) <= S` or `u in S and v in S` tests an edge inside `S`."
      - "Try sizes from the largest down for independent sets and from 0 up for covers, with `itertools.combinations`."
    solution: |
      from itertools import combinations


      def is_independent(V, edges, S):
          S = set(S)
          return not any(u in S and v in S for u, v in edges)


      def is_vertex_cover(V, edges, C):
          C = set(C)
          return all(u in C or v in C for u, v in edges)


      def max_independent_size(V, edges):
          vs = sorted(V)
          for k in range(len(vs), -1, -1):
              if any(is_independent(V, edges, S) for S in combinations(vs, k)):
                  return k


      def min_cover_size(V, edges):
          vs = sorted(V)
          for k in range(len(vs) + 1):
              if any(is_vertex_cover(V, edges, S) for S in combinations(vs, k)):
                  return k
    explanation: "A set is independent exactly when its complement is a vertex cover, so the two problems are equivalent: a size-k independent set exists iff a size-(n-k) cover does."
  - id: reduce-3sat
    title: Build the 3-SAT graph
    difficulty: 4
    prompt: |
      Write `three_sat_to_graph(clauses)` where `clauses` is a list of 3-literal clauses (ints, negative means NOT). Return `(vertices, edges, k)`: vertices are `(clause_index, literal)` pairs in order, `edges` is a set of `frozenset({u, v})` pairs for (a) every pair of vertices in the same clause and (b) every pair of vertices in different clauses whose literals are complements, and `k` is the number of clauses. Write `satisfiable_via_graph(clauses)` that returns True if an independent set of size `k` exists (brute force).
    starter: |
      from itertools import combinations

      def three_sat_to_graph(clauses):
          pass

      def satisfiable_via_graph(clauses):
          pass
    tests:
      - name: graph shape
        code: |
          v, e, k = three_sat_to_graph([[1, 2, 3], [-1, -2, 3]])
          assert k == 2 and len(v) == 6
          assert v[0] == (0, 1) and v[5] == (1, 3)
          assert len(e) == 3 + 3 + 2, len(e)
          assert frozenset({(0, 1), (1, -1)}) in e and frozenset({(0, 2), (1, -2)}) in e
      - name: same answer as direct solving
        code: |
          from itertools import product
          def direct(clauses):
              n = max(abs(l) for c in clauses for l in c)
              for bits in product([False, True], repeat=n):
                  a = {i + 1: b for i, b in enumerate(bits)}
                  if all(any(a[abs(l)] == (l > 0) for l in c) for c in clauses):
                      return True
              return False
          import random
          random.seed(2)
          for _ in range(25):
              m = random.randint(1, 4)
              cl = [[random.choice([-1, 1]) * random.randint(1, 3) for _ in range(3)] for _ in range(m)]
              assert satisfiable_via_graph(cl) == direct(cl), cl
          assert satisfiable_via_graph([[1, 1, 1], [-1, -1, -1]]) is False
    hints:
      - "Use `itertools.combinations` over all vertex pairs and add an edge if they share a clause index, or the literals sum to zero."
      - "Duplicate literals in a clause are different vertices because the vertex includes the clause position... here the pair `(i, lit)` is not unique for duplicates, so deduplicate within a clause for the shape test but note the unsat example."
    solution: |
      from itertools import combinations


      def three_sat_to_graph(clauses):
          vertices = [(i, lit) for i, c in enumerate(clauses) for lit in c]
          edges = set()
          for (i, a), (j, b) in combinations(vertices, 2):
              if i == j and (i, a) != (j, b):
                  edges.add(frozenset({(i, a), (j, b)}))
              elif i != j and a == -b:
                  edges.add(frozenset({(i, a), (j, b)}))
          return vertices, edges, len(clauses)


      def satisfiable_via_graph(clauses):
          vertices, edges, k = three_sat_to_graph(clauses)
          vs = sorted(set(vertices))
          for S in combinations(vs, k):
              if len({i for i, _ in S}) == k and not any(frozenset({a, b}) in edges for a, b in combinations(S, 2)):
                  return True
          return False
    explanation: "Choosing one vertex per triangle is choosing a literal per clause, and the cross edges rule out contradictions, so an independent set of size m is a satisfying assignment."
  - id: dpll-solver
    title: Backtracking SAT with unit propagation
    difficulty: 4
    prompt: |
      Write `dpll(formula)` returning a satisfying assignment (a dict from variable number to boolean; variables that do not appear may be left out) or `None` if unsatisfiable. Use unit propagation: whenever a clause has exactly one literal, set it true. Otherwise pick the first literal of the first clause and try it true, then false. The result must satisfy every clause when you fill unspecified variables with `False`.
    starter: |
      def dpll(formula):
          pass
    tests:
      - name: satisfiable
        code: |
          def ok(f, a):
              return all(any(a.get(abs(l), False) == (l > 0) for l in c) for c in f)
          for f in [[[1, 2], [-1, 2], [-2, 3], [-3, -1]], [[1, 2, 3], [-1], [-2, 3]], [], [[1], [2], [3]],
                    [[1, -2], [2, -3], [3, -1], [1, 2, 3]]]:
              a = dpll(f)
              assert a is not None and ok(f, a), (f, a)
      - name: unsatisfiable
        code: |
          assert dpll([[1], [-1]]) is None
          assert dpll([[1, 2], [-1, 2], [1, -2], [-1, -2]]) is None
          assert dpll([[]]) is None
    hints:
      - "A helper `simplify(formula, lit)` removes clauses containing `lit` and deletes `-lit` from the others."
      - "An empty clause after simplifying means a contradiction on this branch."
    solution: |
      def _simplify(formula, lit):
          out = []
          for clause in formula:
              if lit in clause:
                  continue
              out.append([l for l in clause if l != -lit])
          return out


      def dpll(formula, assignment=None):
          assignment = dict(assignment or {})
          formula = [list(c) for c in formula]
          while True:
              if any(len(c) == 0 for c in formula):
                  return None
              unit = next((c[0] for c in formula if len(c) == 1), None)
              if unit is None:
                  break
              assignment[abs(unit)] = unit > 0
              formula = _simplify(formula, unit)
          if not formula:
              return assignment
          lit = formula[0][0]
          for choice in (lit, -lit):
              res = dpll(_simplify(formula, choice), {**assignment, abs(choice): choice > 0})
              if res is not None:
                  return res
          return None
    explanation: "Propagation shrinks the search enormously on structured formulas; branching only happens when nothing is forced."
  - id: approx-cover
    title: The 2-approximation
    difficulty: 3
    prompt: |
      Write `approx_vertex_cover(edges)` that goes through the edges in order and, whenever an edge has neither endpoint chosen yet, adds **both** endpoints. Return the chosen set. Then write `ratio(edges, optimal_size)` returning `len(approx_vertex_cover(edges)) / optimal_size`.
    starter: |
      def approx_vertex_cover(edges):
          pass

      def ratio(edges, optimal_size):
          pass
    tests:
      - name: valid cover, within 2x
        code: |
          from itertools import combinations
          def opt(edges):
              vs = sorted({x for e in edges for x in e})
              for k in range(len(vs) + 1):
                  for S in combinations(vs, k):
                      if all(u in S or v in S for u, v in edges):
                          return k
          import random
          random.seed(4)
          for _ in range(30):
              n = random.randint(2, 8)
              E = [(a, b) for a in range(n) for b in range(a + 1, n) if random.random() < 0.35]
              if not E:
                  continue
              C = approx_vertex_cover(E)
              assert all(u in C or v in C for u, v in E)
              assert len(C) <= 2 * opt(E), (E, C)
      - name: examples
        code: |
          assert approx_vertex_cover([(1, 2), (1, 3), (1, 4)]) == {1, 2}
          assert ratio([(1, 2), (1, 3), (1, 4)], 1) == 2.0
          assert approx_vertex_cover([]) == set()
    hints:
      - "Keep a set `chosen`; for each `(u, v)` with both endpoints outside it, add both."
    solution: |
      def approx_vertex_cover(edges):
          chosen = set()
          for u, v in edges:
              if u not in chosen and v not in chosen:
                  chosen.add(u)
                  chosen.add(v)
          return chosen


      def ratio(edges, optimal_size):
          return len(approx_vertex_cover(edges)) / optimal_size
    explanation: "The edges that triggered a pick share no endpoint, and any cover must include one endpoint of each, so the optimum is at least half the answer."

commonMistakes:
  - title: "Reducing in the wrong direction"
    explanation: "To show B is NP-hard, reduce a known NP-hard problem A to B (A ≤ B), turning A's instances into B's."
  - title: "Saying NP-hard means 'impossible'"
    explanation: "It means no known polynomial algorithm for the worst case. Many instances are easy, and approximations and SAT solvers work well in practice."
  - title: "Forgetting that a reduction must preserve the answer"
    explanation: "The transformed instance must be a yes-instance exactly when the original is, in both directions."
  - title: "Treating approximation as a heuristic"
    explanation: "An approximation algorithm has a proven guarantee on the answer's quality; a heuristic has none."

summary:
  - "A ≤ₚ B means a polynomial-time conversion that preserves yes/no answers. NP-complete problems are in NP and every problem in NP reduces to them."
  - "Cook-Levin: SAT is NP-complete. 3-SAT, independent set, clique and vertex cover are NP-complete through chains of reductions."
  - "A fast algorithm for any NP-complete problem would prove P = NP."
  - "Coping strategies: pruned exact search (DPLL), approximation with guarantees (vertex cover 2-approximation), heuristics, special cases, small parameters."
  - "Hardness is a worst-case statement; real instances and relaxed goals are often tractable."
