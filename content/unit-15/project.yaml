solution: |
  from itertools import combinations


  # ---------- regular expressions ----------
  def parse_regex(text):
      pos = 0

      def peek():
          return text[pos] if pos < len(text) else None

      def alt():
          nonlocal pos
          left = cat()
          while peek() == "|":
              pos += 1
              left = ("alt", left, cat())
          return left

      def cat():
          parts = []
          while peek() is not None and peek() not in "|)":
              parts.append(star())
          if not parts:
              return ("eps",)
          node = parts[0]
          for p in parts[1:]:
              node = ("cat", node, p)
          return node

      def star():
          nonlocal pos
          node = atom()
          while peek() == "*":
              pos += 1
              node = ("star", node)
          return node

      def atom():
          nonlocal pos
          ch = peek()
          if ch == "(":
              pos += 1
              node = alt()
              if peek() != ")":
                  raise ValueError("missing )")
              pos += 1
              return node
          if ch is None or ch in "|)*":
              raise ValueError("unexpected " + repr(ch))
          pos += 1
          return ("sym", ch)

      tree = alt()
      if pos != len(text):
          raise ValueError("unexpected " + repr(peek()))
      return tree


  def nullable(r):
      t = r[0]
      if t in ("eps", "star"):
          return True
      if t in ("sym", "empty"):
          return False
      if t == "alt":
          return nullable(r[1]) or nullable(r[2])
      return nullable(r[1]) and nullable(r[2])


  def deriv(r, a):
      t = r[0]
      if t == "eps":
          return ("empty",)
      if t == "empty":
          return ("empty",)
      if t == "sym":
          return ("eps",) if r[1] == a else ("empty",)
      if t == "alt":
          return ("alt", deriv(r[1], a), deriv(r[2], a))
      if t == "star":
          return ("cat", deriv(r[1], a), r)
      first = ("cat", deriv(r[1], a), r[2])
      return ("alt", first, deriv(r[2], a)) if nullable(r[1]) else first


  def regex_match(text, w):
      r = parse_regex(text)
      for a in w:
          r = deriv(r, a)
      return nullable(r)


  # ---------- Turing machine ----------
  def run_tm(rules, w, max_steps=10000):
      tape = dict(enumerate(w))
      pos, state, steps = 0, "q0", 0
      while state not in ("acc", "rej"):
          if steps >= max_steps:
              return "timeout"
          key = (state, tape.get(pos, "_"))
          if key not in rules:
              return "rej"
          state, write, move = rules[key]
          tape[pos] = write
          pos += 1 if move == "R" else -1
          steps += 1
      return state


  # ---------- SAT ----------
  def _simplify(formula, lit):
      return [[l for l in c if l != -lit] for c in formula if lit not in c]


  def solve_sat(formula, assignment=None):
      assignment = dict(assignment or {})
      formula = [list(c) for c in formula]
      while True:
          if any(len(c) == 0 for c in formula):
              return None
          unit = next((c[0] for c in formula if len(c) == 1), None)
          if unit is None:
              break
          assignment[abs(unit)] = unit > 0
          formula = _simplify(formula, unit)
      if not formula:
          return assignment
      lit = formula[0][0]
      for choice in (lit, -lit):
          res = solve_sat(_simplify(formula, choice), {**assignment, abs(choice): choice > 0})
          if res is not None:
              return res
      return None


  # ---------- vertex cover ----------
  def approx_vertex_cover(edges):
      chosen = set()
      for u, v in edges:
          if u not in chosen and v not in chosen:
              chosen |= {u, v}
      return chosen


  def min_vertex_cover(edges):
      vs = sorted({x for e in edges for x in e})
      for k in range(len(vs) + 1):
          for S in combinations(vs, k):
              if all(u in S or v in S for u, v in edges):
                  return set(S)
stretch:
- Add `to_dfa(text, alphabet)` that builds a DFA by exploring derivatives (simplify `alt` of equal parts and `cat` with `empty` so that the number of states stays finite), then minimise it (Lesson 15.2).
- Write a `compile_tm(description)` that reads machine rules from text like the universal machine of Lesson 15.6, and use it to write a machine that decides {a^n b^n c^n}.
- Make `solve_sat` pick the most frequent variable instead of the first one and measure how many branches that saves on random 3-SAT formulas.
- Implement `reduce_3sat_to_independent_set` (Lesson 15.9) and check it against `solve_sat` on random formulas.
- Write `min_vertex_cover` as a search that tries to cover an uncovered edge by one of its two endpoints (an O(2^k) algorithm for cover size k).
