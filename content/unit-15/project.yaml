title: Computation Lab
language: python
brief: |-
  You will build a small **computation lab**: six tools that put the whole unit to work. Write all of them in one file.

  1. `parse_regex(text)` turns a regular expression string into a tree. The syntax is single-character symbols, `|` for union, juxtaposition for concatenation, `*` for star, and parentheses. Return `("sym", c)`, `("cat", r, s)`, `("alt", r, s)`, `("star", r)` or `("eps",)` (for an empty pattern, an empty alternative, or `()`). **Precedence:** star binds tightest, then concatenation, then `|`. Concatenation and `|` are **left-associative** (`abc` is `cat(cat(a, b), c)`). A stray `)`, a missing `)`, or a `*` with nothing before it raises `ValueError`.
  2. `regex_match(text, w)` returns `True` if the **whole** string `w` matches the expression. Use Brzozowski derivatives (Lesson 15.4): differentiate by each symbol of `w`, then check whether what is left matches the empty string. Remember that the derivative of `("eps",)` and of `("empty",)` is `("empty",)`, and that `("empty",)` is not nullable.
  3. `run_tm(rules, w, max_steps=10000)` runs a Turing machine (Lesson 15.6). `rules` maps `(state, symbol)` to `(new_state, write, move)`; the start state is `"q0"`, the halting states are `"acc"` and `"rej"`, and `"_"` is the blank. A missing rule rejects. Return `"acc"`, `"rej"`, or `"timeout"` if `max_steps` steps pass without halting.
  4. `solve_sat(formula)` returns a satisfying assignment (dict from variable number to boolean) or `None`. The formula is a list of clauses of non-zero ints (negative means NOT). Use unit propagation and backtracking (Lesson 15.9). Variables that do not matter may be left out of the dictionary.
  5. `approx_vertex_cover(edges)` returns a vertex cover (a set) built by taking, for each edge in order that has neither endpoint chosen yet, **both** endpoints (the 2-approximation of Lesson 15.9).
  6. `min_vertex_cover(edges)` returns a smallest vertex cover (a set) by brute force over subsets in increasing size, so that you can check how close the approximation is.
steps:
- title: Parsing by recursive descent
  body: |-
    Write one function per level: `alt` (calls `cat` and loops on `|`), `cat` (collects `star`s until it sees `|`, `)` or the end), `star` (an `atom` followed by any number of `*`), and `atom` (a symbol or a parenthesised `alt`). Keep a position that all of them share (Lesson 15.5's recursive-descent recogniser). After parsing, the whole text must be consumed.
- title: Matching by derivatives
  body: |-
    Copy `nullable` and `deriv` from Lesson 15.4, but treat `("empty",)` as an extra node type that is not nullable. Then `regex_match` is a loop over the characters followed by one `nullable` call.
- title: A step-limited machine
  body: |-
    Store the tape in a dictionary so it can grow either way, use `tape.get(pos, "_")` for blanks, and check the step counter before every step (Lesson 15.6). The step limit is what turns possible non-termination into the answer `"timeout"` (Lesson 15.7).
- title: Unit propagation and branching
  body: |-
    Simplify with a chosen literal by dropping satisfied clauses and removing the opposite literal from the rest. Repeat while some clause has exactly one literal; an empty clause means this branch failed. If clauses remain, branch on the first literal of the first clause, trying it true and then false (Lesson 15.9).
- title: Approximation versus optimum
  body: |-
    Both vertex cover functions return `set`s. The brute-force version tries `combinations(vertices, k)` for `k = 0, 1, 2...` and returns the first cover found. The tests check that the approximation is a valid cover and never more than twice the size of the optimum.
