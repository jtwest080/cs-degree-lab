# Terms introduced in Unit 16 (Security). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Threat model"
    definition: "A structured description of what you protect, who might attack it and how."
    lesson: u16-mindset
  - term: "Attack surface"
    definition: "All the points where an attacker can try to enter or extract data."
    lesson: u16-mindset
  - term: "CIA triad"
    definition: "Confidentiality, integrity and availability: the three core security goals."
    lesson: u16-mindset
  - term: "Confidentiality"
    definition: "Keeping information from people who should not see it."
    lesson: u16-mindset
  - term: "Integrity"
    definition: "Making sure data is not changed without being noticed."
    lesson: u16-mindset
  - term: "Availability"
    definition: "Keeping a system usable when it is needed."
    lesson: u16-mindset
  - term: "Vulnerability"
    definition: "A weakness that an attacker could exploit."
    lesson: u16-mindset
  - term: "Exploit"
    definition: "Code or a technique that takes advantage of a vulnerability."
    lesson: u16-mindset
  - term: "STRIDE"
    definition: "A checklist of threat types: spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege."
    lesson: u16-mindset
  - term: "Social engineering"
    definition: "Tricking people rather than machines into giving access or information."
    lesson: u16-mindset
  - term: "Phishing"
    definition: "A fraudulent message that tricks someone into revealing secrets or running malware."
    lesson: u16-mindset
  - term: "Kerckhoffs's principle"
    definition: "A system should stay secure even if everything except the key is public."
    lesson: u16-symmetric
  - term: "Plaintext"
    definition: "The readable message before encryption."
    lesson: u16-symmetric
  - term: "Ciphertext"
    definition: "The scrambled message after encryption."
    lesson: u16-symmetric
  - term: "Block cipher"
    definition: "An algorithm that encrypts fixed-size blocks of data under a key."
    lesson: u16-symmetric
  - term: "Stream cipher"
    definition: "An algorithm that encrypts data by combining it with a keystream."
    lesson: u16-symmetric
  - term: "One-time pad"
    definition: "A cipher using a truly random key as long as the message, used once; perfectly secret."
    lesson: u16-symmetric
  - term: "Initialization vector"
    definition: "A value that makes encryption of the same data different each time."
    lesson: u16-symmetric
  - term: "Authenticated encryption"
    definition: "Encryption that also detects tampering, such as AES-GCM."
    lesson: u16-symmetric
  - term: "Brute-force attack"
    definition: "Trying every possible key or password until one works."
    lesson: u16-symmetric
  - term: "Key stretching"
    definition: "Making password guessing slow by repeating a hash many times."
    lesson: u16-hashing
  - term: "Cryptographic hash function"
    definition: "A one-way function that maps data to a fixed-size fingerprint."
    lesson: u16-hashing
  - term: "Collision resistance"
    definition: "The property that it is infeasible to find two inputs with the same hash."
    lesson: u16-hashing
  - term: "Salt"
    definition: "Random data added to a password before hashing so equal passwords give different hashes."
    lesson: u16-hashing
  - term: "Rainbow table"
    definition: "A precomputed table of hashes used to reverse unsalted passwords."
    lesson: u16-hashing
  - term: "Message authentication code"
    definition: "A short tag proving a message came from someone holding the key and was not altered."
    lesson: u16-hashing
  - term: "Constant-time comparison"
    definition: "Comparing secrets without leaking, through timing, where they first differ."
    lesson: u16-hashing
  - term: "PBKDF2"
    definition: "A standard password-hashing method that repeats HMAC many times."
    lesson: u16-hashing
  - term: "Key exchange"
    definition: "A protocol that lets two parties agree on a shared secret over an open channel."
    lesson: u16-publickey
  - term: "Certificate authority"
    definition: "A trusted organisation that signs certificates."
    lesson: u16-publickey
  - term: "Forward secrecy"
    definition: "Protection so that stealing a long-term key does not reveal past sessions."
    lesson: u16-publickey
  - term: "Injection"
    definition: "An attack where untrusted input is interpreted as commands or code."
    lesson: u16-injection
  - term: "Command injection"
    definition: "Making a program run attacker-chosen shell commands."
    lesson: u16-injection
  - term: "Path traversal"
    definition: "Using ../ in a path to reach files outside the intended directory."
    lesson: u16-injection
  - term: "Allowlist"
    definition: "A list of what is permitted; everything else is refused."
    lesson: u16-injection
  - term: "Input validation"
    definition: "Checking that input has the expected form before using it."
    lesson: u16-injection
  - term: "Memory safety"
    definition: "The guarantee that a program cannot read or write memory it should not."
    lesson: u16-injection
  - term: "Origin"
    definition: "The combination of scheme, host and port of a web address."
    lesson: u16-websec
  - term: "Cross-site scripting"
    definition: "Injecting script into a web page that then runs in other users' browsers."
    lesson: u16-websec
  - term: "Output encoding"
    definition: "Converting special characters to a safe form for the place they will be used."
    lesson: u16-websec
  - term: "Cross-site request forgery"
    definition: "Tricking a logged-in browser into sending an unwanted request to a site."
    lesson: u16-websec
  - term: "CSRF token"
    definition: "A secret value in a form that a forged request cannot know."
    lesson: u16-websec
  - term: "SameSite cookie"
    definition: "A cookie setting that limits sending it on cross-site requests."
    lesson: u16-websec
  - term: "HttpOnly"
    definition: "A cookie flag that hides the cookie from JavaScript."
    lesson: u16-websec
  - term: "Session fixation"
    definition: "Planting a known session id in a victim's browser before they log in."
    lesson: u16-websec
  - term: "Clickjacking"
    definition: "Hiding a site in a frame so a user is tricked into clicking it."
    lesson: u16-websec
  - term: "Open redirect"
    definition: "A site feature that can send users to an attacker-chosen address."
    lesson: u16-websec
  - term: "Server-side request forgery"
    definition: "Making a server fetch a URL of the attacker's choosing, often reaching internal systems."
    lesson: u16-websec
  - term: "HSTS"
    definition: "A header telling browsers to use only HTTPS for a site."
    lesson: u16-websec
  - term: "Multi-factor authentication"
    definition: "Using two or more different kinds of proof, such as a password and a phone."
    lesson: u16-auth
  - term: "One-time password"
    definition: "A code that is valid only once or for a short time."
    lesson: u16-auth
  - term: "TOTP"
    definition: "A time-based one-time password computed from a shared secret and the clock."
    lesson: u16-auth
  - term: "Credential stuffing"
    definition: "Trying username and password pairs leaked from other sites."
    lesson: u16-auth
  - term: "Password spraying"
    definition: "Trying a few common passwords against many accounts."
    lesson: u16-auth
  - term: "Role-based access control"
    definition: "Granting permissions to roles and assigning roles to users."
    lesson: u16-auth
  - term: "Attribute-based access control"
    definition: "Deciding access from attributes of the user, resource and context."
    lesson: u16-auth
  - term: "Least privilege"
    definition: "Giving each user or process only the access it needs."
    lesson: u16-auth
  - term: "Insecure direct object reference"
    definition: "Accessing another user's object by changing an id because ownership is not checked."
    lesson: u16-auth
  - term: "Privilege escalation"
    definition: "Gaining more access than intended."
    lesson: u16-auth
  - term: "JSON Web Token"
    definition: "A signed token carrying claims, written as three base64 parts."
    lesson: u16-auth
  - term: "OAuth"
    definition: "A standard that lets an app get limited access to an account without the password."
    lesson: u16-auth
  - term: "Passkey"
    definition: "A phishing-resistant login based on public-key cryptography."
    lesson: u16-auth
  - term: "Fail-safe defaults"
    definition: "Denying access unless explicitly allowed."
    lesson: u16-secure
  - term: "Secrets management"
    definition: "Storing and distributing passwords and keys outside source code."
    lesson: u16-secure
  - term: "Supply-chain attack"
    definition: "Compromising software by attacking its dependencies or build process."
    lesson: u16-secure
  - term: "Typosquatting"
    definition: "Publishing a malicious package with a name close to a popular one."
    lesson: u16-secure
  - term: "Dependency confusion"
    definition: "Tricking a build into fetching a public package instead of an internal one."
    lesson: u16-secure
  - term: "Lockfile"
    definition: "A file recording exact dependency versions for reproducible builds."
    lesson: u16-secure
  - term: "Software bill of materials"
    definition: "A list of all components that make up a piece of software."
    lesson: u16-secure
  - term: "Semantic versioning"
    definition: "A MAJOR.MINOR.PATCH numbering scheme describing the kind of change."
    lesson: u16-secure
  - term: "Fuzzing"
    definition: "Testing with large numbers of random or mutated inputs to find crashes and bugs."
    lesson: u16-secure
  - term: "Penetration test"
    definition: "An authorised attempt to break into a system to find weaknesses."
    lesson: u16-defence
  - term: "Incident response"
    definition: "The organised process of handling a security incident."
    lesson: u16-defence
  - term: "Security logging"
    definition: "Recording security-relevant events for detection and investigation."
    lesson: u16-defence
  - term: "SIEM"
    definition: "A system that collects and correlates security logs to raise alerts."
    lesson: u16-defence
  - term: "Honeytoken"
    definition: "A fake credential or file whose use reveals an intruder."
    lesson: u16-defence
  - term: "Ransomware"
    definition: "Malware that encrypts data and demands payment."
    lesson: u16-defence
  - term: "3-2-1 backup rule"
    definition: "Keep three copies on two kinds of media with one off-site."
    lesson: u16-defence
  - term: "Pseudonymisation"
    definition: "Replacing identifiers with tokens while keeping a protected link."
    lesson: u16-defence
  - term: "k-anonymity"
    definition: "A property where each combination of identifying attributes is shared by at least k people."
    lesson: u16-defence
  - term: "Differential privacy"
    definition: "Adding calibrated noise so one person's data barely changes published results."
    lesson: u16-defence
  - term: "Responsible disclosure"
    definition: "Privately reporting a vulnerability and allowing time to fix it before publishing."
    lesson: u16-defence
  - term: "Bug bounty"
    definition: "A programme that rewards researchers for reporting vulnerabilities."
    lesson: u16-defence
  - term: "Risk"
    definition: "The product of how likely a threat is and how bad its impact would be."
    lesson: u16-defence
