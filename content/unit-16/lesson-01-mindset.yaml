quiz:
  - type: mcq
    question: A ransomware attack that encrypts all your files most directly breaks which property?
    options: ["Availability", "Confidentiality only", "Authentication", "Non-repudiation"]
    answer: 0
    explanation: "You can no longer use your data, which is an availability failure."
  - type: mcq
    question: What does Kerckhoffs's principle say?
    options: ["A system should be secure even if everything except the key is public", "Keep the design secret", "Use as many layers as possible", "Never write code"]
    answer: 0
    explanation: "Secrecy belongs in the key, not in the algorithm."
  - type: mcq
    question: What does the S in STRIDE stand for?
    options: ["Spoofing", "Sniffing", "Scanning", "Stealing"]
    answer: 0
    explanation: "Pretending to be someone else."
  - type: mcq
    question: In an attack tree, how do you compute an AND node's cost?
    options: ["Sum of its children", "Minimum of its children", "Maximum of its children", "Average of its children"]
    answer: 0
    explanation: "The attacker must complete all of them."
  - type: mcq
    question: How does one extra bit of entropy change brute-force work?
    options: ["It doubles it", "It adds one guess", "It squares it", "It has no effect"]
    answer: 0
    explanation: "There are twice as many possibilities."
  - type: mcq
    question: What does least privilege mean?
    options: ["Give each user or program only the access it needs", "Give everyone read access", "Use the cheapest tools", "Run everything as administrator"]
    answer: 0
    explanation: "It limits what a compromised account or bug can do."
  - type: code
    question: |
      Write `risk_score(likelihood, impact)` returning their product, and `needs_action(score, threshold=6)` returning `True` when the score is at least the threshold.
    starter: |
      def risk_score(likelihood, impact):
          pass

      def needs_action(score, threshold=6):
          pass
    tests:
      - name: scores
        code: |
          assert risk_score(3, 5) == 15 and risk_score(1, 1) == 1
          assert needs_action(6) and not needs_action(5) and needs_action(12, 12) and not needs_action(11, 12)
    solution: |
      def risk_score(likelihood, impact):
          return likelihood * impact


      def needs_action(score, threshold=6):
          return score >= threshold
