id: u16-mindset
title: "The Security Mindset and Threat Modelling"
minutes: 55
objective: |
  Learn to think about systems the way both an attacker and a defender do. You will learn the core security goals (confidentiality, integrity, availability), how to describe assets, threats and attackers, how to rank risks, how to reason with attack trees, and why password strength is really about entropy.
outcomes:
  - Explain confidentiality, integrity and availability and give an example of each failing
  - Describe a system's assets, attack surface, threats and attackers using STRIDE
  - Rank risks by likelihood and impact and decide what to do about them
  - Compute the cost of the cheapest attack from an attack tree
  - Estimate password entropy and brute-force time

sections:
  - heading: What security is and is not
    body: |
      **Security** is about making a system behave correctly in the presence of an **adversary**: someone who is trying to make it misbehave. Most of this course asked whether code does what you intended for ordinary inputs. Security asks what happens when someone chooses the input, the timing, the network messages, or the dependencies **specifically to hurt you**. A program that works perfectly for friendly users can be completely broken against a hostile one. Defenders must close every hole; an attacker needs one.

      We describe goals with three words, the **CIA triad**. **Confidentiality**: only authorised people can read the data (a stolen medical record breaks it). **Integrity**: data and programs cannot be changed without authorisation, or the change is detected (a tampered bank balance breaks it). **Availability**: the system works when needed (a denial-of-service attack or ransomware breaks it). Related goals: **authentication** (proving who someone is), **authorisation** (what they are allowed to do), **accountability** or non-repudiation (logs that prove who did what), and **privacy**. No system is perfectly secure, and security always costs convenience, money or speed, so the real question is *secure enough against which attackers, at what cost?*

      Two principles to remember throughout this unit. **Kerckhoffs's principle**: a system should stay secure even if everything about it except the key is public. Secrecy of design ("security by obscurity") is fragile; well-reviewed open designs with secret keys are not. **Defence in depth**: use several independent layers (firewall, authentication, encryption, monitoring), so that one failure is not the end. Also **least privilege** (give each person and program only the access it needs), **fail safe** (when something goes wrong, deny access), and **keep it simple** (complexity is where bugs, and therefore vulnerabilities, live).

  - heading: Threat modelling
    body: |
      You cannot defend against threats you have not thought of. **Threat modelling** is the habit of asking four questions at design time: *What are we building? What can go wrong? What will we do about it? Did we do a good job?* Start by listing the **assets** (what is worth protecting: customer data, passwords, uptime, reputation), the **actors** (users, administrators, attackers inside and outside), and the **attack surface**: every place where an attacker can interact with the system, such as network ports, web forms, APIs, file uploads, USB ports, third-party libraries and employees. Reduce the attack surface and you reduce risk: turn off unused services.

      A checklist for "what can go wrong" is **STRIDE**, six kinds of threat: **S**poofing (pretending to be someone else), **T**ampering (changing data), **R**epudiation (denying having done something), **I**nformation disclosure (leaking data), **D**enial of service, and **E**levation of privilege (gaining rights you should not have). Walk through each part of the design and ask which of the six applies. Draw **trust boundaries** on your diagram, lines where data crosses from less trusted to more trusted (the internet to your server, a user's browser to your database): everything crossing a trust boundary must be validated.

      Not every threat deserves the same effort. A simple **risk** estimate is likelihood times impact, scored on small scales; handle the highest first. For each, choose a response: **mitigate** (add a control), **avoid** (remove the feature), **transfer** (insurance, a trusted provider), or **accept** (knowingly live with it). Attackers vary too: a curious teenager, a criminal group after money, an insider, a state agency. A defence that stops the first does nothing against the last, so match defences to the realistic attacker.

  - heading: Attack trees and entropy
    body: |
      An **attack tree** puts the attacker's goal at the root and lists ways to achieve it as children. An **OR** node needs only one child to succeed; an **AND** node needs all of them. Attach a cost to each leaf. The cheapest successful attack follows the cheapest child at every OR node and the sum of the children at every AND node. That cheapest path is the weak link: spend on strengthening it, because strengthening the strong parts changes nothing. A bank vault with a steel door and a cheap lock on the back window is only as safe as the window.

      Passwords show the same logic in numbers. A secret chosen uniformly from N possibilities has **entropy** log₂(N) bits; each extra bit doubles the attacker's work. A random 8-character password from 94 printable characters has about 52 bits; a random 4-word passphrase from a 7776-word list has about 52 bits; an 8-character password a human chooses ("Summer2024!") has far less, because humans are predictable and attackers try likely guesses first (dictionaries, leaked-password lists, common patterns). Brute-force time is about N/2 guesses on average divided by the guess rate, and the rate depends on how the password is stored (Lesson 16.3): billions per second against a fast hash, a few per second against a deliberately slow one. This is why **length and unpredictability** matter more than complexity rules, and why password managers that generate random passwords are good advice.

examples:
  - title: Ranking risks
    intro: "Likelihood and impact on a 1 to 5 scale. Risk is their product. Rank, then decide on a response."
    code: |
      risks = [
          ("Customer database leaked via SQL injection", 3, 5),
          ("Office wifi password shared with visitors", 4, 2),
          ("Ransomware encrypts file server", 2, 5),
          ("Typo in marketing page", 5, 1),
          ("Admin account without second factor", 3, 4),
      ]
      ranked = sorted(risks, key=lambda r: -(r[1] * r[2]))
      for name, likelihood, impact in ranked:
          score = likelihood * impact
          action = "mitigate now" if score >= 12 else "plan" if score >= 6 else "accept"
          print(f"{score:>2}  {action:<12} {name}")
    output: |
      15  mitigate now Customer database leaked via SQL injection
      12  mitigate now Admin account without second factor
      10  plan         Ransomware encrypts file server
       8  plan         Office wifi password shared with visitors
       5  accept       Typo in marketing page
    lines:
      - line: 9
        note: "The score is likelihood times impact. Sort largest first."
      - line: 12
        note: "Thresholds turn the score into a decision: mitigate, plan or accept."
  - title: STRIDE checklist for one data flow
    intro: "For each element crossing a trust boundary ask all six questions. A tiny table makes the review systematic."
    code: |
      STRIDE = {
          "Spoofing": "Can someone pretend to be the client?",
          "Tampering": "Can the request be altered in transit?",
          "Repudiation": "Can the user deny placing the order?",
          "Information disclosure": "Can the response leak other users' data?",
          "Denial of service": "Can one client exhaust the server?",
          "Elevation of privilege": "Can a normal user reach admin functions?",
      }
      controls = {"Spoofing": "login + session", "Tampering": "TLS", "Information disclosure": "authorisation checks"}
      for threat, question in STRIDE.items():
          print(f"{threat:<24} {controls.get(threat, 'NO CONTROL YET')}")
    output: |
      Spoofing                 login + session
      Tampering                TLS
      Repudiation              NO CONTROL YET
      Information disclosure   authorisation checks
      Denial of service        NO CONTROL YET
      Elevation of privilege   NO CONTROL YET
    lines:
      - line: 9
        note: "Controls recorded so far."
      - line: 11
        note: "Missing entries show the gaps to discuss: repudiation, denial of service and privilege."
  - title: Cheapest attack in an attack tree
    intro: "Leaves have costs. An OR node takes its cheapest child; an AND node needs the sum of its children."
    code: |
      tree = ("OR", [
          ("AND", [("leaf", "steal phone", 500), ("leaf", "crack PIN", 200)]),
          ("leaf", "phish password", 150),
          ("AND", [("leaf", "bribe insider", 5000), ("leaf", "avoid audit log", 1000)]),
      ])

      def cheapest(node):
          kind = node[0]
          if kind == "leaf":
              return node[2]
          costs = [cheapest(child) for child in node[1]]
          return min(costs) if kind == "OR" else sum(costs)

      print("cheapest attack costs", cheapest(tree))
      print("if phishing is stopped:", cheapest(("OR", [tree[1][0], tree[1][2]])))
    output: |
      cheapest attack costs 150
      if phishing is stopped: 700
    lines:
      - line: 11
        note: "A leaf costs what it says; inner nodes combine their children."
      - line: 16
        note: "Fixing the cheapest path (phishing) only moves the weak link to the next one, so the total improves less than expected."
  - title: Password entropy
    intro: "Entropy is the number of bits of unpredictability; every bit doubles the work."
    code: |
      import math

      def entropy_bits(alphabet_size, length):
          return length * math.log2(alphabet_size)

      def years_to_crack(bits, guesses_per_second):
          return 2 ** (bits - 1) / guesses_per_second / (3600 * 24 * 365)

      cases = [("8 random lowercase letters", 26, 8), ("8 random printable ASCII", 94, 8),
               ("4 random words from 7776", 7776, 4), ("12 random printable ASCII", 94, 12)]
      for name, size, length in cases:
          bits = entropy_bits(size, length)
          print(f"{name:<28} {bits:5.1f} bits   fast hash: {years_to_crack(bits, 1e10):12.6f} years   slow hash: {years_to_crack(bits, 100):.3e} years")
    output: |
      8 random lowercase letters    37.6 bits   fast hash:     0.000000 years   slow hash: 3.311e+01 years
      8 random printable ASCII      52.4 bits   fast hash:     0.009665 years   slow hash: 9.665e+05 years
      4 random words from 7776      51.7 bits   fast hash:     0.005797 years   slow hash: 5.797e+05 years
      12 random printable ASCII     78.7 bits   fast hash: 754566.709180 years   slow hash: 7.546e+13 years
    lines:
      - line: 7
        note: "On average the attacker finds it after trying half of the possibilities: 2^(bits-1)."
      - line: 13
        note: "The same password is trivial or safe depending on how fast each guess can be made."
  - title: Least privilege
    intro: "A tiny access-control check that denies by default."
    code: |
      PERMISSIONS = {
          "viewer": {"read"},
          "editor": {"read", "write"},
          "admin": {"read", "write", "delete", "manage_users"},
      }

      def allowed(role, action):
          return action in PERMISSIONS.get(role, set())

      for role, action in [("viewer", "read"), ("viewer", "write"), ("editor", "delete"),
                           ("admin", "manage_users"), ("ghost", "read"), ("editor", "")]:
          print(role, action, allowed(role, action))
    output: |
      viewer read True
      viewer write False
      editor delete False
      admin manage_users True
      ghost read False
      editor  False
    lines:
      - line: 8
        note: "Unknown roles get an empty set, so everything is denied (fail safe)."

playground:
  prompt: |
    Add your own risks (a school, a game server, a family photo backup) to the risk list and rank them. Then add a leaf to the attack tree that is cheaper than phishing and see how the cheapest attack changes.
  code: |
    risks = [("Lost laptop", 3, 3), ("Weak router password", 4, 4)]
    print(sorted(risks, key=lambda r: -(r[1] * r[2])))

exercises:
  - id: risk-rank
    title: Rank the risks
    difficulty: 2
    prompt: |
      Write `rank_risks(risks)` where `risks` is a list of `(name, likelihood, impact)` with both numbers from 1 to 5. Return a list of `(name, score, action)` sorted by score from highest to lowest (equal scores keep their original order), where `score = likelihood * impact` and `action` is `"mitigate"` if the score is at least 12, `"plan"` if at least 6, otherwise `"accept"`.
    starter: |
      def rank_risks(risks):
          pass
    tests:
      - name: ranking
        code: |
          r = [("a", 3, 5), ("b", 4, 2), ("c", 2, 5), ("d", 5, 1), ("e", 3, 4), ("f", 4, 3)]
          assert rank_risks(r) == [("a", 15, "mitigate"), ("e", 12, "mitigate"), ("f", 12, "mitigate"),
                                   ("c", 10, "plan"), ("b", 8, "plan"), ("d", 5, "accept")], rank_risks(r)
          assert rank_risks([]) == []
          assert rank_risks([("x", 2, 3)]) == [("x", 6, "plan")]
    hints:
      - "`sorted` with `key=lambda t: -t[1]` is stable, so ties keep their order."
    solution: |
      def rank_risks(risks):
          scored = [(name, l * i) for name, l, i in risks]
          scored.sort(key=lambda t: -t[1])
          out = []
          for name, score in scored:
              action = "mitigate" if score >= 12 else "plan" if score >= 6 else "accept"
              out.append((name, score, action))
          return out
    explanation: "Turning judgement into a score is crude but makes the discussion explicit and repeatable."
  - id: attack-tree
    title: Cheapest attack
    difficulty: 3
    prompt: |
      An attack tree node is `("leaf", name, cost)`, `("OR", [children])` or `("AND", [children])`. Write `cheapest(node)` returning the minimum cost to achieve the goal at that node (an OR takes its cheapest child, an AND needs all its children), and `cheapest_path(node)` returning the list of leaf names used by that cheapest attack (for an AND, all children's paths in order; for an OR, the path of the cheapest child, the first one on ties).
    starter: |
      def cheapest(node):
          pass

      def cheapest_path(node):
          pass
    tests:
      - name: cost
        code: |
          tree = ("OR", [
              ("AND", [("leaf", "steal phone", 500), ("leaf", "crack PIN", 200)]),
              ("leaf", "phish password", 150),
              ("AND", [("leaf", "bribe insider", 5000), ("leaf", "avoid audit log", 1000)]),
          ])
          assert cheapest(tree) == 150
          assert cheapest(("AND", [("leaf", "a", 1), ("leaf", "b", 2)])) == 3
          assert cheapest(("leaf", "x", 7)) == 7
      - name: path
        code: |
          tree = ("OR", [
              ("AND", [("leaf", "steal phone", 500), ("leaf", "crack PIN", 200)]),
              ("leaf", "phish password", 150),
          ])
          assert cheapest_path(tree) == ["phish password"]
          t2 = ("AND", [("OR", [("leaf", "a", 5), ("leaf", "b", 3)]), ("leaf", "c", 1)])
          assert cheapest_path(t2) == ["b", "c"] and cheapest(t2) == 4
          t3 = ("OR", [("leaf", "p", 2), ("leaf", "q", 2)])
          assert cheapest_path(t3) == ["p"]
    hints:
      - "Recurse. For `OR`, use `min(children, key=cheapest)`, which returns the first of equal minima."
    solution: |
      def cheapest(node):
          kind = node[0]
          if kind == "leaf":
              return node[2]
          costs = [cheapest(c) for c in node[1]]
          return min(costs) if kind == "OR" else sum(costs)


      def cheapest_path(node):
          kind = node[0]
          if kind == "leaf":
              return [node[1]]
          if kind == "OR":
              best = min(node[1], key=cheapest)
              return cheapest_path(best)
          path = []
          for child in node[1]:
              path += cheapest_path(child)
          return path
    explanation: "The weak link of the system is the cheapest path. A defender improves security most by raising that cost."
  - id: entropy
    title: Password entropy
    difficulty: 2
    prompt: |
      Write `entropy_bits(alphabet_size, length)` returning `length * log2(alphabet_size)` rounded to 1 decimal place, and `guesses_needed(bits)` returning the average number of guesses `2 ** (bits - 1)` as a float. Then write `compare(a, b)` returning how many times larger the work for entropy `a` is than for entropy `b` (`2 ** (a - b)`).
    starter: |
      import math

      def entropy_bits(alphabet_size, length):
          pass

      def guesses_needed(bits):
          pass

      def compare(a, b):
          pass
    tests:
      - name: entropy
        code: |
          assert entropy_bits(2, 10) == 10.0
          assert entropy_bits(26, 8) == 37.6
          assert entropy_bits(94, 8) == 52.4
          assert entropy_bits(7776, 4) == 51.7
          assert entropy_bits(10, 0) == 0.0
      - name: work
        code: |
          assert guesses_needed(1) == 1.0 and guesses_needed(11) == 1024.0
          assert compare(52, 42) == 1024.0 and compare(40, 40) == 1.0
    hints:
      - "`round(length * math.log2(alphabet_size), 1)`."
    solution: |
      import math


      def entropy_bits(alphabet_size, length):
          return round(length * math.log2(alphabet_size), 1)


      def guesses_needed(bits):
          return float(2 ** (bits - 1))


      def compare(a, b):
          return float(2 ** (a - b))
    explanation: "Every extra bit doubles the attacker's work, so ten extra bits is a thousand times more."
  - id: least-privilege
    title: Deny by default
    difficulty: 2
    prompt: |
      Write `can(user, action, resource, rules)`. `rules` is a list of `(role, action, resource)` triples that are **allowed**, where `"*"` as the action or resource matches anything. `user` is a dict `{"roles": [...]}`. Return `True` only if some rule matches one of the user's roles and the action and resource; otherwise `False` (deny by default). A user with no roles can do nothing.
    starter: |
      def can(user, action, resource, rules):
          pass
    tests:
      - name: rules
        code: |
          rules = [("viewer", "read", "*"), ("editor", "write", "doc"), ("admin", "*", "*")]
          assert can({"roles": ["viewer"]}, "read", "doc", rules) is True
          assert can({"roles": ["viewer"]}, "write", "doc", rules) is False
          assert can({"roles": ["editor"]}, "write", "doc", rules) is True
          assert can({"roles": ["editor"]}, "write", "billing", rules) is False
          assert can({"roles": ["admin"]}, "delete", "billing", rules) is True
          assert can({"roles": []}, "read", "doc", rules) is False
          assert can({"roles": ["viewer", "editor"]}, "write", "doc", rules) is True
          assert can({"roles": ["ghost"]}, "read", "doc", []) is False
    hints:
      - "`any(...)` over the rules, checking role membership and the two wildcards."
    solution: |
      def can(user, action, resource, rules):
          roles = set(user["roles"])
          return any(
              role in roles and rule_action in ("*", action) and rule_resource in ("*", resource)
              for role, rule_action, rule_resource in rules
          )
    explanation: "Because nothing is allowed unless a rule says so, forgetting a rule fails safely."

commonMistakes:
  - title: "Security by obscurity"
    explanation: "Hoping nobody finds how your system works is not a defence. Assume the attacker knows the design and protect the keys."
  - title: "Securing the strong part"
    explanation: "An attacker takes the cheapest path. Find the weakest link first."
  - title: "Treating all inputs as friendly"
    explanation: "Anything that crosses a trust boundary can be chosen by an attacker. Validate it."
  - title: "Complexity rules instead of length"
    explanation: "A long random passphrase beats a short 'complex' password. Entropy comes from unpredictability."
  - title: "Adding security at the end"
    explanation: "Threat model at design time. Retrofitting is costly and leaves gaps."

summary:
  - "Security is correct behaviour under an adversary; the CIA triad is confidentiality, integrity, availability."
  - "Kerckhoffs's principle, defence in depth, least privilege, fail safe and simplicity guide design."
  - "Threat modelling lists assets, attack surface and threats (STRIDE), ranks risks by likelihood and impact, and picks mitigate, avoid, transfer or accept."
  - "Attack trees reveal the cheapest path; strengthen the weak link, not the strong parts."
  - "Entropy measures unpredictability: each bit doubles the attacker's work, so length and randomness matter."
