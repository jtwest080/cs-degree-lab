quiz:
  - type: mcq
    question: What breaks if a one-time pad key is used twice?
    options: ["The XOR of the two plaintexts is revealed", "Nothing", "Only the first message leaks", "The key becomes longer"]
    answer: 0
    explanation: "c1 XOR c2 equals m1 XOR m2."
  - type: mcq
    question: What property does a Feistel network have?
    options: ["It is invertible even if the round function is not", "It needs a quantum computer", "It uses public keys", "It only encrypts text"]
    answer: 0
    explanation: "The round function is only ever XORed in."
  - type: mcq
    question: Why is ECB mode a poor choice?
    options: ["Identical plaintext blocks give identical ciphertext blocks", "It is too slow", "It needs two keys", "It only works for small keys"]
    answer: 0
    explanation: "Patterns in the data remain visible."
  - type: mcq
    question: What does a MAC provide?
    options: ["Detection of tampering", "Secrecy", "Compression", "Key distribution"]
    answer: 0
    explanation: "It proves the message came from someone with the key and was not altered."
  - type: mcq
    question: What is the safe order for encrypt-then-MAC when receiving?
    options: ["Verify the MAC, then decrypt", "Decrypt, then verify the MAC", "Skip the MAC", "Decrypt twice"]
    answer: 0
    explanation: "Never process unauthenticated ciphertext."
  - type: mcq
    question: Which should you use to generate a secret key?
    options: ["secrets or os.urandom", "random.random", "the current time", "a short password"]
    answer: 0
    explanation: "Only a cryptographically secure random generator is unpredictable."
  - type: code
    question: |
      Write `brute_force_xor(cipher, check)` where `cipher` is `bytes` encrypted with a **single-byte** XOR key. Try all 256 keys and return the key (an int) for which `check(plaintext)` returns `True` (return the lowest such key), or `None`.
    starter: |
      def brute_force_xor(cipher, check):
          pass
    tests:
      - name: finds the key
        code: |
          m = b"the quick brown fox"
          c = bytes(b ^ 77 for b in m)
          assert brute_force_xor(c, lambda p: p.startswith(b"the ")) == 77
          assert brute_force_xor(c, lambda p: False) is None
    solution: |
      def brute_force_xor(cipher, check):
          for k in range(256):
              if check(bytes(b ^ k for b in cipher)):
                  return k
          return None
