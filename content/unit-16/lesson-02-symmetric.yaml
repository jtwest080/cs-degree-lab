id: u16-symmetric
title: "Symmetric Encryption"
minutes: 60
objective: |
  Learn how secret-key encryption works and how it fails. You will build the one-time pad, see why reusing a key is fatal, build a small Feistel block cipher, compare modes of operation (ECB, CBC, CTR), and add authentication with a MAC. Everything is a toy for learning: real systems use vetted libraries, never homemade ciphers.
outcomes:
  - Explain encryption, keys, ciphertext, Kerckhoffs's principle and the goal of semantic security
  - Implement XOR stream encryption and show why key reuse breaks the one-time pad
  - Build a Feistel network and explain block ciphers like AES
  - Compare ECB, CBC and CTR modes and explain nonces and IVs
  - Combine encryption with a MAC to detect tampering and explain why you must not roll your own crypto

sections:
  - heading: Encryption and the one-time pad
    body: |
      **Encryption** turns readable **plaintext** into unreadable **ciphertext** using a **key**; **decryption** reverses it. In **symmetric** (secret-key) encryption the same key encrypts and decrypts, so the two parties must share the key in advance (Lesson 16.4 solves how). By Kerckhoffs's principle (Lesson 16.1) the algorithm is public and only the key is secret.

      The simplest cipher that is perfectly secure is the **one-time pad**: XOR the message, bit by bit, with a **truly random key as long as the message**, used **once**. XOR is its own inverse (`(m ⊕ k) ⊕ k = m`, Unit 9), so the same operation decrypts. Claude Shannon proved in 1949 that with a random, never-reused key the ciphertext tells an eavesdropper *nothing* about the message, since every plaintext of that length is equally likely. The catches are practical: the key must be as long as all the data, random, shared securely, and **never reused**. Use the key twice and `c₁ ⊕ c₂ = m₁ ⊕ m₂`: the key cancels out, leaving the XOR of the two plaintexts, which leaks structure (known words, "crib dragging", spaces in text). This two-time-pad mistake has broken real systems, including Soviet cables in the 1940s and the WEP wifi protocol.

      Practical **stream ciphers** replace the long random key with a short key stretched into a long **keystream** by a pseudo-random generator, then XOR it with the message. The same rule applies: never use the same key and **nonce** (a number used once) together twice. Modern examples are ChaCha20 and AES in counter mode.

  - heading: Block ciphers and Feistel networks
    body: |
      A **block cipher** encrypts a fixed-size **block** (AES: 128 bits) under a key, as a keyed permutation: each key picks one scrambling of all possible blocks, undoable with the key. A good block cipher has **confusion** (each ciphertext bit depends on the key in a complicated way) and **diffusion** (changing one plaintext bit flips about half the ciphertext bits, the **avalanche effect**). It gets there by repeating a simple **round** many times, mixing in a different **round key** each time.

      A **Feistel network** (used in DES) is a neat way to build an invertible cipher from *any* round function, even a non-invertible one. Split the block into halves L and R. In each round: `L' = R` and `R' = L ⊕ F(R, roundkey)`. To decrypt, run the same rounds with the round keys in **reverse order**, and the halves swap back. Because the function F is only ever XORed in, it never needs to be inverted. AES uses a different structure (a substitution-permutation network) but the same principle: many rounds of simple steps give a complex scrambling.

      Key length sets the **brute-force** cost: a k-bit key has 2ᵏ possibilities. DES's 56-bit key was broken by 1998 and is obsolete; 128-bit AES is considered safe against any foreseeable brute force (2¹²⁸ is more than the number of atoms in a few thousand Earths), and 256-bit keys cover even quantum speed-ups. Real attacks target implementation mistakes, keys, and modes, not the cipher itself.

  - heading: Modes of operation and authentication
    body: |
      A block cipher handles one block; real messages are longer, so we need a **mode of operation**. The naive **ECB** (electronic codebook) mode encrypts every block independently with the same key: identical plaintext blocks give identical ciphertext blocks, so patterns show through. (Encrypt a bitmap image in ECB and the picture's outline is still visible.) **Never use ECB.** **CBC** (cipher block chaining) XORs each plaintext block with the previous ciphertext block before encrypting, and starts with a random **initialisation vector (IV)**, so equal blocks differ. **CTR** (counter) mode encrypts a counter (nonce plus block number) and XORs the result with the plaintext, turning the block cipher into a stream cipher; it can be parallelised and needs no padding, but a repeated nonce under the same key is catastrophic.

      Encryption alone gives **confidentiality but not integrity**. An attacker can flip ciphertext bits without knowing the key: in a stream cipher, flipping bit i of the ciphertext flips bit i of the plaintext (**malleability**), for example turning "pay 100" into "pay 900". So we add a **message authentication code (MAC)**: a short tag computed from the message and a secret key, such as **HMAC-SHA256**. The receiver recomputes it and rejects any message whose tag does not match, comparing in **constant time** (`hmac.compare_digest`) so timing does not leak how many bytes matched. The safe pattern is **encrypt-then-MAC**: encrypt, then MAC the ciphertext (and the IV and any headers), and verify the MAC *before* decrypting. Modern libraries bundle this as **authenticated encryption (AEAD)**, for example AES-GCM or ChaCha20-Poly1305. Rules to carry forward: use a vetted library; never invent your own cipher or protocol; always authenticate; never reuse a nonce; generate keys and IVs with a cryptographically secure random source (`secrets`, `os.urandom`), never `random`.

examples:
  - title: The one-time pad
    intro: "XOR with a random key as long as the message. The same operation encrypts and decrypts."
    code: |
      def xor_bytes(a, b):
          return bytes(x ^ y for x, y in zip(a, b))

      message = b"ATTACK AT DAWN"
      key = bytes([17, 203, 44, 9, 250, 118, 31, 77, 160, 5, 99, 201, 12, 140])    # use os.urandom in real life
      cipher = xor_bytes(message, key)
      print(cipher.hex())
      print(xor_bytes(cipher, key))
      wrong_key = bytes([k ^ 1 for k in key])
      print(xor_bytes(cipher, wrong_key))
    output: |
      509f7848b93d3f0cf42527885bc2
      b'ATTACK AT DAWN'
      b'@UU@BJ!@U!E@VO'
    lines:
      - line: 5
        note: "A real pad key must come from a secure random source and be used exactly once."
      - line: 8
        note: "XOR twice with the same key returns the message."
  - title: Why you must never reuse a pad
    intro: "Two ciphertexts under the same key XOR to the XOR of the two plaintexts. The key vanishes, and a guessed word reveals the other message."
    code: |
      def xor_bytes(a, b):
          return bytes(x ^ y for x, y in zip(a, b))

      key = bytes([91, 7, 133, 240, 12, 66, 190, 33, 5, 77, 128, 19, 204, 99, 10, 61])
      m1 = b"transfer 1000 usd"[:16]
      m2 = b"meeting at noon!!"[:16]
      c1, c2 = xor_bytes(m1, key), xor_bytes(m2, key)

      leak = xor_bytes(c1, c2)                      # equals m1 XOR m2, key gone
      print(leak == xor_bytes(m1, m2))
      guess = b"transfer 1000 us"                   # attacker guesses the start of m1
      print(xor_bytes(leak, guess))                 # reveals the start of m2
    output: |
      True
      b'meeting at noon!'
    lines:
      - line: 9
        note: "The key cancels: (m1 ^ k) ^ (m2 ^ k) = m1 ^ m2."
      - line: 12
        note: "Knowing part of one message exposes the same part of the other."
  - title: A Feistel network
    intro: "Each round swaps halves and XORs in a function of the other half. Decrypting uses the same code with reversed round keys."
    code: |
      def F(half, round_key):
          return (half * 31 + round_key * 17 + (half >> 3)) & 0xFFFF           # any scrambling function works

      def feistel(block, keys):
          L, R = (block >> 16) & 0xFFFF, block & 0xFFFF
          for k in keys:
              L, R = R, L ^ F(R, k)
          return (R << 16) | L                                                  # undo the final swap

      keys = [0x1A2B, 0x3C4D, 0x5E6F, 0x7081]
      plain = 0x12345678
      cipher = feistel(plain, keys)
      print(hex(cipher))
      print(hex(feistel(cipher, keys[::-1])))
      print(feistel(plain, keys) != feistel(plain ^ 1, keys))
    output: |
      0x4f0e6e5b
      0x12345678
      True
    lines:
      - line: 6
        note: "New left is the old right; new right is left XOR F(right, key). F need not be invertible."
      - line: 13
        note: "Running the same network with the keys reversed decrypts."
  - title: ECB leaks patterns, CTR does not
    intro: "Encrypt a message of repeating blocks with a toy keyed permutation in two modes and count distinct ciphertext blocks."
    code: |
      import hashlib

      def block_encrypt(block, key):
          # toy keyed function standing in for a real block cipher (not decryptable, just for pattern demonstration)
          return hashlib.sha256(key + block).digest()[:8]

      def ecb(data, key):
          return [block_encrypt(data[i:i + 8], key) for i in range(0, len(data), 8)]

      def ctr(data, key, nonce):
          out = []
          for n, i in enumerate(range(0, len(data), 8)):
              stream = block_encrypt(nonce + n.to_bytes(4, "big"), key)
              out.append(bytes(a ^ b for a, b in zip(data[i:i + 8], stream)))
          return out

      data = b"SAMEBLK!" * 6
      key = b"secretkey"
      print("ECB distinct blocks:", len(set(ecb(data, key))), "of 6")
      print("CTR distinct blocks:", len(set(ctr(data, key, b"nonce123"))), "of 6")
    output: |
      ECB distinct blocks: 1 of 6
      CTR distinct blocks: 6 of 6
    lines:
      - line: 7
        note: "ECB: the same block always encrypts the same way."
      - line: 12
        note: "CTR: a different counter value for each block makes the keystream differ."
  - title: Encrypt-then-MAC
    intro: "A MAC tag over the ciphertext lets the receiver reject tampered messages before decrypting."
    code: |
      import hmac, hashlib

      def keystream(key, nonce, n):
          out, counter = b"", 0
          while len(out) < n:
              out += hashlib.sha256(key + nonce + counter.to_bytes(4, "big")).digest()
              counter += 1
          return out[:n]

      def seal(enc_key, mac_key, nonce, plaintext):
          ct = bytes(a ^ b for a, b in zip(plaintext, keystream(enc_key, nonce, len(plaintext))))
          tag = hmac.new(mac_key, nonce + ct, hashlib.sha256).digest()
          return ct, tag

      def open_(enc_key, mac_key, nonce, ct, tag):
          expected = hmac.new(mac_key, nonce + ct, hashlib.sha256).digest()
          if not hmac.compare_digest(expected, tag):
              raise ValueError("tampered")
          return bytes(a ^ b for a, b in zip(ct, keystream(enc_key, nonce, len(ct))))

      ek, mk, nonce = b"enc-key-1", b"mac-key-1", b"nonce-0001"
      ct, tag = seal(ek, mk, nonce, b"pay 100 to Bob")
      print(open_(ek, mk, nonce, ct, tag))
      forged = bytes([ct[4] ^ ord("1") ^ ord("9")]) + ct[5:]
      bad = ct[:4] + forged
      try:
          open_(ek, mk, nonce, bad, tag)
      except ValueError as e:
          print("rejected:", e)
    output: |
      b'pay 100 to Bob'
      rejected: tampered
    lines:
      - line: 13
        note: "The tag covers the nonce and the ciphertext, so any change to either is detected."
      - line: 18
        note: "compare_digest takes the same time however many bytes match, which avoids timing leaks."
      - line: 25
        note: "Flipping ciphertext bits would silently change the plaintext without the MAC."

playground:
  prompt: |
    Change one byte of the ciphertext in the encrypt-then-MAC example and confirm that it is rejected. Then remove the MAC check and see what plaintext comes out.
  code: |
    c = bytes([1, 2, 3])
    print(bytes(x ^ 255 for x in c))

exercises:
  - id: xor-cipher
    title: Repeating-key XOR
    difficulty: 2
    prompt: |
      Write `xor_cipher(data, key)` where `data` and `key` are `bytes` and the key is repeated as often as needed (`key[i % len(key)]`). Return `bytes`. Encrypting twice with the same key must give back the original. Raise `ValueError` if the key is empty.
    starter: |
      def xor_cipher(data, key):
          pass
    tests:
      - name: round trip
        code: |
          m = b"Meet me at the station at 9."
          k = b"key"
          c = xor_cipher(m, k)
          assert c != m and xor_cipher(c, k) == m
          assert xor_cipher(b"", b"k") == b""
          assert xor_cipher(b"\x00\x01", b"\xff") == b"\xff\xfe"
      - name: empty key
        code: |
          try:
              xor_cipher(b"abc", b"")
              assert False
          except ValueError:
              pass
    hints:
      - "`bytes(b ^ key[i % len(key)] for i, b in enumerate(data))`."
    solution: |
      def xor_cipher(data, key):
          if not key:
              raise ValueError("empty key")
          return bytes(b ^ key[i % len(key)] for i, b in enumerate(data))
    explanation: "A short repeating key is far weaker than a one-time pad, since the key repeats and patterns appear. This is the Vigenère-style cipher, easily broken by frequency analysis."
  - id: two-time-pad
    title: Recover plaintext from a reused pad
    difficulty: 3
    prompt: |
      Two messages were encrypted with the same keystream. Write `crib(c1, c2, guess)` where `c1` and `c2` are the ciphertexts (equal-length `bytes`) and `guess` is a guess of the **start** of message 1. Return the corresponding start of message 2 as `bytes` (`len(guess)` bytes). Also write `xor_pair(c1, c2)` returning the byte-wise XOR of the ciphertexts.
    starter: |
      def xor_pair(c1, c2):
          pass

      def crib(c1, c2, guess):
          pass
    tests:
      - name: crib
        code: |
          key = bytes([91, 7, 133, 240, 12, 66, 190, 33, 5, 77, 128, 19, 204, 99, 10, 61])
          m1, m2 = b"transfer 1000 usd"[:16], b"meeting at noon!!"[:16]
          c1 = bytes(a ^ b for a, b in zip(m1, key))
          c2 = bytes(a ^ b for a, b in zip(m2, key))
          assert xor_pair(c1, c2) == bytes(a ^ b for a, b in zip(m1, m2))
          assert crib(c1, c2, b"transfer") == b"meeting "
          assert crib(c1, c2, m1) == m2
          assert crib(c1, c2, b"") == b""
    hints:
      - "XOR the two ciphertexts, then XOR the result with the guess."
    solution: |
      def xor_pair(c1, c2):
          return bytes(a ^ b for a, b in zip(c1, c2))


      def crib(c1, c2, guess):
          leak = xor_pair(c1, c2)
          return bytes(a ^ b for a, b in zip(leak, guess))
    explanation: "The key never appears: the attacker needs only a guess about one message. Reusing a keystream destroys the one-time pad's guarantee."
  - id: feistel-roundtrip
    title: A Feistel cipher
    difficulty: 4
    prompt: |
      Write `feistel_encrypt(block, keys)` for a 32-bit block using the round function `F(half, k) = (half * 31 + k * 17 + (half >> 3)) & 0xFFFF`. Split into 16-bit halves `L, R`; for each key do `L, R = R, L ^ F(R, k)`; return `(R << 16) | L`. Then `feistel_decrypt(block, keys)` which decrypts by running the same function with the keys reversed. Decrypt must undo encrypt for every block.
    starter: |
      def F(half, k):
          return (half * 31 + k * 17 + (half >> 3)) & 0xFFFF

      def feistel_encrypt(block, keys):
          pass

      def feistel_decrypt(block, keys):
          pass
    tests:
      - name: round trip
        code: |
          import random
          random.seed(13)
          for _ in range(200):
              keys = [random.randrange(65536) for _ in range(random.randint(1, 8))]
              b = random.randrange(2 ** 32)
              c = feistel_encrypt(b, keys)
              assert 0 <= c < 2 ** 32
              assert feistel_decrypt(c, keys) == b, (b, keys)
      - name: scrambles
        code: |
          keys = [0x1A2B, 0x3C4D, 0x5E6F, 0x7081]
          assert feistel_encrypt(0x12345678, keys) != 0x12345678
          assert feistel_encrypt(0x12345678, keys) != feistel_encrypt(0x12345679, keys)
          assert feistel_encrypt(0, []) == 0
    hints:
      - "Decryption is just `feistel_encrypt(block, keys[::-1])`."
    solution: |
      def F(half, k):
          return (half * 31 + k * 17 + (half >> 3)) & 0xFFFF


      def feistel_encrypt(block, keys):
          L, R = (block >> 16) & 0xFFFF, block & 0xFFFF
          for k in keys:
              L, R = R, L ^ F(R, k)
          return (R << 16) | L


      def feistel_decrypt(block, keys):
          return feistel_encrypt(block, keys[::-1])
    explanation: "XOR-ing F into one half is reversible no matter what F is, which is why Feistel ciphers never need an inverse round function."
  - id: avalanche
    title: Measure the avalanche effect
    difficulty: 3
    prompt: |
      Write `bit_diff(a, b)` returning the number of bits that differ between the integers `a` and `b` (`bin(a ^ b).count("1")`). Write `avalanche(f, x, bits)` that flips each of the lowest `bits` bits of `x` one at a time and returns the **average** number of output bits that change, `f` being a function from int to int. For a good function with 32-bit output the average is near 16.
    starter: |
      def bit_diff(a, b):
          pass

      def avalanche(f, x, bits):
          pass
    tests:
      - name: bit diff
        code: |
          assert bit_diff(0, 0) == 0 and bit_diff(0b1010, 0b0110) == 2 and bit_diff(255, 0) == 8
      - name: avalanche
        code: |
          import hashlib
          h = lambda v: int.from_bytes(hashlib.sha256(v.to_bytes(8, "big")).digest()[:4], "big")
          a = avalanche(h, 123456789, 32)
          assert 13 <= a <= 19, a
          assert avalanche(lambda v: v, 5, 8) == 1.0
          assert avalanche(lambda v: v & 0xF0, 5, 4) == 0.0
    hints:
      - "Loop `i` over `range(bits)`, compute `bit_diff(f(x), f(x ^ (1 << i)))` and average them."
    solution: |
      def bit_diff(a, b):
          return bin(a ^ b).count("1")


      def avalanche(f, x, bits):
          total = 0
          for i in range(bits):
              total += bit_diff(f(x), f(x ^ (1 << i)))
          return total / bits
    explanation: "A cryptographic function should change about half its output bits for a single input bit. The identity function changes exactly one."
  - id: encrypt-then-mac
    title: Seal and open with a MAC
    difficulty: 4
    prompt: |
      Write `seal(enc_key, mac_key, nonce, plaintext)` returning `(ciphertext, tag)`: encrypt by XOR with `keystream(enc_key, nonce, len(plaintext))` (given below), then `tag = hmac.new(mac_key, nonce + ciphertext, hashlib.sha256).digest()`. Write `open_sealed(enc_key, mac_key, nonce, ciphertext, tag)` that checks the tag with `hmac.compare_digest` **before** decrypting and raises `ValueError("tampered")` on a mismatch, otherwise returns the plaintext.
    starter: |
      import hmac, hashlib

      def keystream(key, nonce, n):
          out, counter = b"", 0
          while len(out) < n:
              out += hashlib.sha256(key + nonce + counter.to_bytes(4, "big")).digest()
              counter += 1
          return out[:n]

      def seal(enc_key, mac_key, nonce, plaintext):
          pass

      def open_sealed(enc_key, mac_key, nonce, ciphertext, tag):
          pass
    tests:
      - name: round trip
        code: |
          ek, mk, n = b"enc", b"mac", b"nonce-1"
          for m in [b"", b"x", b"pay 100 to Bob", b"a" * 100]:
              ct, tag = seal(ek, mk, n, m)
              assert len(ct) == len(m) and len(tag) == 32
              assert open_sealed(ek, mk, n, ct, tag) == m
      - name: tampering detected
        code: |
          ek, mk, n = b"enc", b"mac", b"nonce-1"
          ct, tag = seal(ek, mk, n, b"pay 100 to Bob")
          bad = bytes([ct[0] ^ 1]) + ct[1:]
          for args in [(ek, mk, n, bad, tag), (ek, mk, b"nonce-2", ct, tag), (ek, mk, n, ct, bytes(32)), (ek, b"other", n, ct, tag)]:
              try:
                  open_sealed(*args)
                  assert False, "should have been rejected"
              except ValueError as e:
                  assert str(e) == "tampered"
    hints:
      - "XOR each plaintext byte with the matching keystream byte."
      - "Compute the expected tag exactly as in `seal`, then `hmac.compare_digest(expected, tag)`."
    solution: |
      import hmac, hashlib


      def keystream(key, nonce, n):
          out, counter = b"", 0
          while len(out) < n:
              out += hashlib.sha256(key + nonce + counter.to_bytes(4, "big")).digest()
              counter += 1
          return out[:n]


      def seal(enc_key, mac_key, nonce, plaintext):
          ks = keystream(enc_key, nonce, len(plaintext))
          ct = bytes(a ^ b for a, b in zip(plaintext, ks))
          tag = hmac.new(mac_key, nonce + ct, hashlib.sha256).digest()
          return ct, tag


      def open_sealed(enc_key, mac_key, nonce, ciphertext, tag):
          expected = hmac.new(mac_key, nonce + ciphertext, hashlib.sha256).digest()
          if not hmac.compare_digest(expected, tag):
              raise ValueError("tampered")
          ks = keystream(enc_key, nonce, len(ciphertext))
          return bytes(a ^ b for a, b in zip(ciphertext, ks))
    explanation: "Verifying before decrypting means an attacker's modified ciphertext is never processed. The MAC also covers the nonce so it cannot be swapped."

commonMistakes:
  - title: "Reusing a key and nonce"
    explanation: "With a stream cipher or CTR mode, a repeated (key, nonce) pair leaks the XOR of the plaintexts. Use a fresh nonce for every message."
  - title: "Using ECB mode"
    explanation: "Identical blocks give identical ciphertext. Use an authenticated mode such as AES-GCM."
  - title: "Encrypting without authenticating"
    explanation: "An attacker can modify ciphertext in predictable ways. Always add a MAC or use AEAD."
  - title: "Inventing your own cipher"
    explanation: "Ciphers that look unbreakable to their authors are routinely broken by experts. Use well-reviewed libraries."
  - title: "Using `random` for keys"
    explanation: "It is predictable. Use `secrets` or `os.urandom` for anything secret."

summary:
  - "Symmetric encryption uses a shared key; the one-time pad is perfectly secure but needs a random one-use key as long as the message."
  - "Reusing a keystream leaks the XOR of the plaintexts, which is why nonces must never repeat."
  - "Block ciphers (like AES) are keyed permutations with confusion and diffusion; Feistel networks build them from any round function."
  - "Modes matter: ECB leaks patterns; CBC needs a random IV; CTR needs a unique nonce."
  - "Add authentication (encrypt-then-MAC or AEAD), compare tags in constant time, use vetted libraries and secure randomness."
