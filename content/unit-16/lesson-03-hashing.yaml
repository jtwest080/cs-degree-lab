exercises:
  - id: file-fingerprint
    title: Checksums
    difficulty: 1
    prompt: |
      Write `sha256_hex(data)` returning the SHA-256 digest of the `bytes` `data` as a hex string, and `verify_checksum(data, expected)` returning `True` if the digest equals `expected` (compare with `hmac.compare_digest`).
    starter: |
      import hashlib, hmac

      def sha256_hex(data):
          pass

      def verify_checksum(data, expected):
          pass
    tests:
      - name: digests
        code: |
          assert sha256_hex(b"") == "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          assert sha256_hex(b"abc") == "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          assert verify_checksum(b"abc", "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad") is True
          assert verify_checksum(b"abd", "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad") is False
    hints:
      - "`hashlib.sha256(data).hexdigest()`."
    solution: |
      import hashlib, hmac


      def sha256_hex(data):
          return hashlib.sha256(data).hexdigest()


      def verify_checksum(data, expected):
          return hmac.compare_digest(sha256_hex(data), expected)
    explanation: "A published checksum lets you detect a corrupted or substituted download, provided the checksum itself came from a trusted place."
  - id: birthday
    title: Find a truncated collision
    difficulty: 3
    prompt: |
      Write `find_collision(bits)` that hashes the strings `"0"`, `"1"`, `"2"`, ... with SHA-256, keeps only the top `bits` bits of each digest (as an integer, `int.from_bytes(digest, "big") >> (256 - bits)`), and returns `(i, j, n)` for the first pair of different numbers `i < j` whose truncated hashes are equal, where `n = j + 1` is the number of hashes computed. Write `expected_tries(bits)` returning `2 ** (bits / 2)`.
    starter: |
      import hashlib

      def find_collision(bits):
          pass

      def expected_tries(bits):
          pass
    tests:
      - name: collision
        code: |
          import hashlib
          def trunc(i, bits):
              return int.from_bytes(hashlib.sha256(str(i).encode()).digest(), "big") >> (256 - bits)
          for bits in (8, 12, 16, 20):
              i, j, n = find_collision(bits)
              assert i < j and trunc(i, bits) == trunc(j, bits) and n == j + 1
              assert all(trunc(k, bits) != trunc(m, bits) for m in range(j) for k in range(m)) if bits <= 12 else True
          i, j, n = find_collision(24)
          assert n < 20 * expected_tries(24) and n > expected_tries(24) / 20, n
      - name: expected
        code: |
          assert expected_tries(16) == 256.0 and expected_tries(0) == 1.0
    hints:
      - "Keep a dictionary from truncated hash to the first `i` that produced it."
    solution: |
      import hashlib


      def find_collision(bits):
          seen = {}
          i = 0
          while True:
              v = int.from_bytes(hashlib.sha256(str(i).encode()).digest(), "big") >> (256 - bits)
              if v in seen:
                  return seen[v], i, i + 1
              seen[v] = i
              i += 1


      def expected_tries(bits):
          return float(2 ** (bits / 2))
    explanation: "Collisions are found after roughly the square root of the number of possible digests."
  - id: merkle-root
    title: Merkle root
    difficulty: 4
    prompt: |
      Write `merkle_root(blocks)` for a list of `bytes`. Hash each block with SHA-256 for the leaves. While there is more than one node in the level, if the level has an odd number of nodes duplicate the last one, then replace each pair `(a, b)` by `sha256(a + b)`. Return the root as a hex string. An empty list returns `sha256(b"")` as hex; a single block returns the hex of its leaf hash. Also write `leaf_changed(blocks, i, new)` returning `True` if replacing block `i` by `new` changes the root.
    starter: |
      import hashlib

      def merkle_root(blocks):
          pass

      def leaf_changed(blocks, i, new):
          pass
    tests:
      - name: roots
        code: |
          import hashlib
          h = lambda b: hashlib.sha256(b).digest()
          assert merkle_root([]) == hashlib.sha256(b"").hexdigest()
          assert merkle_root([b"a"]) == h(b"a").hex()
          assert merkle_root([b"a", b"b"]) == h(h(b"a") + h(b"b")).hex()
          ab, cc = h(h(b"a") + h(b"b")), h(h(b"c") + h(b"c"))
          assert merkle_root([b"a", b"b", b"c"]) == h(ab + cc).hex()
      - name: changes
        code: |
          blocks = [b"a", b"b", b"c", b"d", b"e"]
          assert leaf_changed(blocks, 2, b"X") is True
          assert leaf_changed(blocks, 2, b"c") is False
          assert merkle_root(blocks) != merkle_root(blocks[:-1])
    hints:
      - "Loop with `while len(level) > 1`, padding by `level.append(level[-1])` when the length is odd."
    solution: |
      import hashlib


      def merkle_root(blocks):
          if not blocks:
              return hashlib.sha256(b"").hexdigest()
          level = [hashlib.sha256(b).digest() for b in blocks]
          while len(level) > 1:
              if len(level) % 2:
                  level.append(level[-1])
              level = [hashlib.sha256(level[i] + level[i + 1]).digest() for i in range(0, len(level), 2)]
          return level[0].hex()


      def leaf_changed(blocks, i, new):
          changed = list(blocks)
          changed[i] = new
          return merkle_root(changed) != merkle_root(blocks)
    explanation: "The root is a single fingerprint for all the data; a change anywhere changes it."
  - id: password-store
    title: Salted password storage
    difficulty: 3
    prompt: |
      Write `hash_password(password, salt, iterations=1000)` returning the string `"pbkdf2_sha256$<iterations>$<salt hex>$<hash hex>"` where the hash is `hashlib.pbkdf2_hmac("sha256", password.encode(), salt, iterations).hex()`. Write `verify_password(password, stored)` that parses that string, recomputes with the stored salt and iteration count, and returns `True` or `False` using `hmac.compare_digest`. Return `False` (do not raise) if the stored string is malformed or uses another algorithm.
    starter: |
      import hashlib, hmac

      def hash_password(password, salt, iterations=1000):
          pass

      def verify_password(password, stored):
          pass
    tests:
      - name: round trip
        code: |
          s = hash_password("hunter2", b"\x00\x01\x02\x03", 1000)
          parts = s.split("$")
          assert parts[0] == "pbkdf2_sha256" and parts[1] == "1000" and parts[2] == "00010203" and len(parts[3]) == 64
          assert verify_password("hunter2", s) is True
          assert verify_password("Hunter2", s) is False
          assert verify_password("", s) is False
      - name: salts and malformed input
        code: |
          a = hash_password("pw", b"salt-a", 500)
          b = hash_password("pw", b"salt-b", 500)
          assert a != b
          assert verify_password("pw", a) and verify_password("pw", b)
          assert verify_password("pw", "garbage") is False
          assert verify_password("pw", "md5$1$00$00") is False
          assert verify_password("pw", "pbkdf2_sha256$x$00$00") is False
    hints:
      - "`stored.split(\"$\")` should have exactly four parts and the first must be `pbkdf2_sha256`."
      - "Wrap the parsing in `try/except (ValueError, TypeError)` and return `False`."
    solution: |
      import hashlib, hmac


      def hash_password(password, salt, iterations=1000):
          dk = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, iterations)
          return "pbkdf2_sha256$%d$%s$%s" % (iterations, salt.hex(), dk.hex())


      def verify_password(password, stored):
          try:
              algo, iterations, salt_hex, hash_hex = stored.split("$")
              if algo != "pbkdf2_sha256":
                  return False
              dk = hashlib.pbkdf2_hmac("sha256", password.encode(), bytes.fromhex(salt_hex), int(iterations))
          except (ValueError, TypeError):
              return False
          return hmac.compare_digest(dk.hex(), hash_hex)
    explanation: "Real code would use a library such as argon2-cffi or bcrypt, but the structure is the same: parameters, salt and hash are stored together."
  - id: audit-passwords
    title: Audit your own users' passwords
    difficulty: 3
    prompt: |
      A defender checks whether stolen unsalted SHA-256 password hashes would fall to a common-password list. Write `weak_users(hashes, wordlist)` where `hashes` maps username to the SHA-256 hex of the password, and return the sorted list of usernames whose password is in `wordlist`. Also write `duplicate_groups(hashes)` returning a sorted list of sorted lists of users who share the same hash (only groups with at least two users), which shows why salting matters.
    starter: |
      import hashlib

      def weak_users(hashes, wordlist):
          pass

      def duplicate_groups(hashes):
          pass
    tests:
      - name: audit
        code: |
          import hashlib
          H = lambda p: hashlib.sha256(p.encode()).hexdigest()
          hashes = {"ana": H("sunshine"), "bo": H("sunshine"), "cy": H("x7!Qm2$pLr"), "di": H("letmein"), "ed": H("x7!Qm2$pLr")}
          words = ["password", "sunshine", "letmein"]
          assert weak_users(hashes, words) == ["ana", "bo", "di"]
          assert duplicate_groups(hashes) == [["ana", "bo"], ["cy", "ed"]]
          assert weak_users({}, words) == [] and duplicate_groups({"a": H("x")}) == []
    hints:
      - "Build a set of hashes of the wordlist, then filter users."
      - "Group users in a dictionary keyed by hash."
    solution: |
      import hashlib


      def weak_users(hashes, wordlist):
          weak = {hashlib.sha256(w.encode()).hexdigest() for w in wordlist}
          return sorted(u for u, h in hashes.items() if h in weak)


      def duplicate_groups(hashes):
          groups = {}
          for user, h in hashes.items():
              groups.setdefault(h, []).append(user)
          return sorted(sorted(g) for g in groups.values() if len(g) > 1)
    explanation: "Identical hashes reveal that users share a password. Per-user salts remove this signal and make precomputed tables useless."

commonMistakes:
  - title: "Storing passwords in plain text or encrypted"
    explanation: "Store a salted slow hash. Encrypted passwords can all be decrypted if the key is stolen."
  - title: "Using MD5 or SHA-1, or a fast hash for passwords"
    explanation: "They are broken for collisions or far too fast for guessing. Use Argon2, bcrypt, scrypt or PBKDF2."
  - title: "One global salt"
    explanation: "Salts must be unique per password so that attackers cannot attack all users at once."
  - title: "Using H(key + message) as a MAC"
    explanation: "It is vulnerable to length extension for SHA-2. Use HMAC."
  - title: "Comparing secrets with =="
    explanation: "It stops at the first difference and leaks timing. Use hmac.compare_digest."

summary:
  - "Cryptographic hashes are one-way, second-preimage and collision resistant; collisions cost about 2^(n/2) because of the birthday effect."
  - "HMAC makes a keyed tag that avoids the length-extension weakness of H(key + message)."
  - "A Merkle tree commits to many blocks with one root and proves membership with a logarithmic-size path."
  - "Passwords need a unique salt and a deliberately slow KDF (Argon2, scrypt, bcrypt, PBKDF2) so offline guessing is expensive."
  - "Use constant-time comparison, check against breached passwords and add rate limits and multi-factor authentication."
