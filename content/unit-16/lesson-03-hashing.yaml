  - type: code
    question: |
      Write `bits_changed(a, b)` returning how many bits differ between two `bytes` objects of equal length (the count of 1 bits in the XOR).
    starter: |
      def bits_changed(a, b):
          pass
    tests:
      - name: bits
        code: |
          assert bits_changed(b"\x00", b"\xff") == 8
          assert bits_changed(b"ab", b"ab") == 0
          assert bits_changed(b"\x0f\x01", b"\x00\x00") == 5
    solution: |
      def bits_changed(a, b):
          return sum(bin(x ^ y).count("1") for x, y in zip(a, b))
