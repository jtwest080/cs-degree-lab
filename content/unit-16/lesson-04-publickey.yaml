  - type: code
    question: |
      Write `dh_agree(g, p, a, b)` returning `True` when Alice's secret `a` and Bob's secret `b` produce the same shared value, computing each side from the other's public value with `pow`.
    starter: |
      def dh_agree(g, p, a, b):
          pass
    tests:
      - name: agrees
        code: |
          assert dh_agree(5, 23, 6, 15) is True
          assert dh_agree(3, 2 ** 61 - 1, 12345, 67890) is True
    solution: |
      def dh_agree(g, p, a, b):
          A, B = pow(g, a, p), pow(g, b, p)
          return pow(B, a, p) == pow(A, b, p)
