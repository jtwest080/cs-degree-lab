id: u16-publickey
title: "Public-Key Cryptography, Signatures and TLS"
minutes: 60
objective: |
  Solve the key-distribution problem: how can two strangers agree on a secret over a channel that anyone can read? You will implement Diffie-Hellman key exchange, textbook RSA encryption and signatures with toy numbers, see why small keys and unpadded RSA are insecure, and follow how certificates and the TLS handshake combine these tools.
outcomes:
  - Explain asymmetric cryptography, public and private keys, and why it complements symmetric encryption
  - Perform Diffie-Hellman key exchange with modular exponentiation
  - Generate RSA keys, encrypt, decrypt, sign and verify with small numbers
  - Explain why key size, padding and hashing before signing matter
  - Describe certificates, certificate authorities and the TLS handshake

sections:
  - heading: The key distribution problem
    body: |
      Symmetric encryption (Lesson 16.2) is fast and strong, but both sides need the same secret key first. How do you share it with a website you have never met, over a network where anyone can listen? Until the 1970s that seemed impossible. **Public-key** (asymmetric) cryptography solves it with **two related keys**: a **public key** that anyone may know and a **private key** that only the owner keeps. What one key does, only the other can undo. Its security rests on **trapdoor one-way functions**: maths that is easy in one direction and infeasible to reverse without a secret, such as multiplying two large primes (easy) versus factoring the product (hard, Unit 6 and Lesson 15.8), or computing powers modulo a prime (easy) versus finding the exponent, the **discrete logarithm** (hard).

      Public-key operations are thousands of times slower than symmetric ones, so in practice they are used only to *agree on a symmetric key* and to *sign*; the bulk data is then encrypted with AES or ChaCha20 (**hybrid encryption**).

  - heading: Diffie-Hellman key exchange
    body: |
      In 1976 Whitfield Diffie and Martin Hellman published a way for two people to create a shared secret in public. Everyone agrees on a large prime `p` and a **generator** `g` (both public). Alice picks a secret number `a` and sends `A = gᵃ mod p`; Bob picks a secret `b` and sends `B = gᵇ mod p`. Alice computes `Bᵃ mod p`, Bob computes `Aᵇ mod p`, and both get `gᵃᵇ mod p`, because exponents multiply. An eavesdropper sees `p`, `g`, `A` and `B`, but finding `a` from `A` is the discrete logarithm problem, infeasible for large `p` (2048-bit, or elliptic-curve versions with 256-bit keys). Python's `pow(g, a, p)` does fast modular exponentiation by repeated squaring (Unit 6).

      Plain Diffie-Hellman is **not authenticated**: a **man in the middle** can run one exchange with Alice and another with Bob and relay (and read) everything. So the exchange must be combined with authentication, using signatures and certificates. Using fresh random `a` and `b` every session gives **forward secrecy**: if a long-term key is stolen later, old recorded sessions still cannot be decrypted.

  - heading: RSA, signatures and certificates
    body: |
      **RSA** (Rivest, Shamir, Adleman, 1977), recalled from Unit 6: pick two large secret primes `p` and `q`, publish `n = pq` and an exponent `e` (often 65537), and compute the private exponent `d = e⁻¹ mod (p−1)(q−1)`. To encrypt a number `m < n` compute `c = mᵉ mod n`; to decrypt compute `cᵈ mod n`. It works by Euler's theorem; breaking it needs `d`, which needs the factors of `n`. Key sizes: 2048 bits minimum today, since factoring 512-bit numbers takes hours on a laptop and 768-bit ones were factored in 2009. **Textbook RSA is insecure**: it is deterministic (the same message gives the same ciphertext) and malleable (`c·2ᵉ` decrypts to `2m`), so real systems add random **padding** (OAEP). Also never encrypt directly with tiny messages or tiny `e`.

      Run the maths backwards and you get a **digital signature**: the owner computes `s = H(m)ᵈ mod n` with the **private** key; anyone checks `sᵉ mod n == H(m)` with the **public** key. A valid signature proves the message came from the key's owner (authenticity, non-repudiation) and was not altered (integrity). We sign the hash, not the message, so large messages are fine and certain forgeries fail; real systems use padding schemes (PSS) or modern curves (Ed25519).

      Remaining question: how do you know a public key belongs to the person you think? A **certificate** is a statement "this public key belongs to example.com" **signed by a certificate authority (CA)** whose own key your browser or operating system already trusts. CAs can themselves be certified by higher CAs, forming a **chain of trust** up to a **root** certificate. A browser checks the whole chain, the validity dates, that the name matches the site, and that the certificate is not revoked. This is **public-key infrastructure (PKI)**. It is only as strong as its CAs: a compromised or careless CA can issue fake certificates, which is why certificate transparency logs (Merkle trees, Lesson 16.3) now publish every certificate.

      **TLS** (the padlock in your browser, used by HTTPS from Unit 11) stitches it together. The client says hello with the ciphers it supports; the server replies with its certificate; both run an (elliptic-curve) Diffie-Hellman exchange, with the server signing its part to prove identity; from the shared secret they derive symmetric session keys; and from then on all data is encrypted and authenticated with an AEAD cipher. All this takes about one network round trip in TLS 1.3.

examples:
  - title: Modular exponentiation
    intro: "pow(base, exponent, modulus) squares repeatedly and never builds a huge number."
    code: |
      def modpow(base, exp, mod):
          result = 1
          base %= mod
          while exp:
              if exp & 1:
                  result = result * base % mod
              base = base * base % mod
              exp >>= 1
          return result

      print(modpow(5, 117, 19), pow(5, 117, 19))
      big = pow(7, 10 ** 30, 2 ** 127 - 1)
      print(big)
    output: |
      1 1
      77365983643526108570615817422012409412
    lines:
      - line: 4
        note: "One loop per bit of the exponent: about 100 steps even for a 30-digit exponent."
      - line: 13
        note: "Trying 10^30 multiplications one by one would take longer than the universe's lifetime."
  - title: Diffie-Hellman
    intro: "Both sides get the same secret; the listener sees only A and B."
    code: |
      p, g = 2 ** 61 - 1, 3                  # a (small) prime and a generator, public

      a, b = 1234567891, 987654321           # private values; real systems pick fresh random ones
      A, B = pow(g, a, p), pow(g, b, p)      # exchanged in the open
      alice = pow(B, a, p)
      bob = pow(A, b, p)
      print(A, B)
      print(alice == bob, alice)
      print("eavesdropper tries small exponents:", any(pow(g, x, p) == A for x in range(100000)))
    output: |
      2072662223796400995 472930568150360433
      True 1075759746070982447
      eavesdropper tries small exponents: False
    lines:
      - line: 4
        note: "A = g^a and B = g^b are public."
      - line: 5
        note: "(g^b)^a = (g^a)^b = g^(ab): the same secret on both sides."
      - line: 9
        note: "A search over small exponents finds nothing. With a 2048-bit prime, no search is feasible."
  - title: Toy RSA
    intro: "Key generation, encryption, decryption and a signature, with tiny primes. Never use numbers this small."
    code: |
      p, q = 1000003, 1000033
      n, phi = p * q, (p - 1) * (q - 1)
      e = 65537
      d = pow(e, -1, phi)                # modular inverse of e

      m = 123456789
      c = pow(m, e, n)
      print("ciphertext:", c)
      print("decrypted: ", pow(c, d, n))

      import hashlib
      digest = int.from_bytes(hashlib.sha256(b"pay Bob 10").digest(), "big") % n
      sig = pow(digest, d, n)
      print("signature valid:", pow(sig, e, n) == digest)
      forged = int.from_bytes(hashlib.sha256(b"pay Bob 99").digest(), "big") % n
      print("forged message accepted:", pow(sig, e, n) == forged)
    output: |
      ciphertext: 771129065953
      decrypted:  123456789
      signature valid: True
      forged message accepted: False
    lines:
      - line: 4
        note: "pow(e, -1, phi) computes the inverse (Python 3.8+)."
      - line: 13
        note: "Sign by raising the hash to the PRIVATE exponent."
      - line: 15
        note: "Verify with the PUBLIC exponent. A signature for one message does not match another."
  - title: Why small keys fail
    intro: "Factoring a 40-bit modulus by trial division takes moments. This is why real keys have 2048 bits or more."
    code: |
      def factor(n):
          f = 2
          while f * f <= n:
              if n % f == 0:
                  return f, n // f
              f += 1
          return n, 1

      p, q = 1000003, 1000033
      n = p * q
      print(n, n.bit_length(), "bits")
      print(factor(n))
      e = 65537
      p2, q2 = factor(n)
      d_attacker = pow(e, -1, (p2 - 1) * (q2 - 1))
      m = 424242
      print(pow(pow(m, e, n), d_attacker, n) == m)
    output: |
      1000036000099 40 bits
      (1000003, 1000033)
      True
    lines:
      - line: 3
        note: "Trial division needs about sqrt(n) steps: about a million here."
      - line: 17
        note: "Once n is factored the attacker rebuilds the private key and reads everything."
  - title: Textbook RSA is deterministic and malleable
    intro: "The same message always encrypts the same way, and multiplying a ciphertext multiplies the plaintext."
    code: |
      p, q = 1000003, 1000033
      n, e = p * q, 65537
      d = pow(e, -1, (p - 1) * (q - 1))

      m = 1000
      c1, c2 = pow(m, e, n), pow(m, e, n)
      print("same ciphertext twice:", c1 == c2)
      c_double = c1 * pow(2, e, n) % n                 # attacker changes the ciphertext without the key
      print("decrypts to:", pow(c_double, d, n))
    output: |
      same ciphertext twice: True
      decrypts to: 2000
    lines:
      - line: 7
        note: "Deterministic: an eavesdropper can tell when a message repeats, or guess-and-check small messages."
      - line: 9
        note: "The attacker doubled the plaintext without knowing d. Real RSA uses OAEP padding to prevent this."
  - title: A chain of trust
    intro: "Walk from a certificate up to a trusted root, checking each signature with the issuer's key. Here a signature is simulated by a keyed hash."
    code: |
      import hashlib, hmac

      def sign(issuer_secret, subject, subject_key):
          return hmac.new(issuer_secret, (subject + ":" + subject_key).encode(), hashlib.sha256).hexdigest()

      secrets_ = {"RootCA": b"root-secret", "InterCA": b"inter-secret"}
      certs = {
          "InterCA": {"issuer": "RootCA", "key": "inter-pub", "sig": sign(b"root-secret", "InterCA", "inter-pub")},
          "example.com": {"issuer": "InterCA", "key": "site-pub", "sig": sign(b"inter-secret", "example.com", "site-pub")},
      }
      trusted_roots = {"RootCA"}

      def valid_chain(name):
          while name not in trusted_roots:
              cert = certs.get(name)
              if cert is None:
                  return False
              expected = sign(secrets_[cert["issuer"]], name, cert["key"]) if cert["issuer"] in secrets_ else None
              if expected != cert["sig"]:
                  return False
              name = cert["issuer"]
          return True

      print(valid_chain("example.com"))
      certs["example.com"]["key"] = "attacker-pub"
      print(valid_chain("example.com"))
    output: |
      True
      False
    lines:
      - line: 15
        note: "Each step verifies the issuer's signature over the subject's name and key."
      - line: 25
        note: "Swapping in the attacker's key breaks the signature, so the chain is rejected."

playground:
  prompt: |
    Run Diffie-Hellman with a much smaller prime like 1009 and write a loop that recovers Alice's secret `a` from `A` by brute force. How large must `p` be before that loop becomes impractical?
  code: |
    p, g = 1009, 11
    print(pow(g, 5, p))

exercises:
  - id: modpow
    title: Fast modular exponentiation
    difficulty: 3
    prompt: |
      Write `modpow(base, exp, mod)` by repeated squaring, without calling the built-in three-argument `pow`. Handle `exp = 0` (result `1 % mod`) and `mod = 1` (result 0). Also write `mod_inverse(a, m)` using the extended Euclidean algorithm (Unit 6), returning `x` in `0..m-1` with `a*x % m == 1`, or `None` if the inverse does not exist.
    starter: |
      def modpow(base, exp, mod):
          pass

      def mod_inverse(a, m):
          pass
    tests:
      - name: modpow
        code: |
          import random
          assert modpow(5, 117, 19) == pow(5, 117, 19)
          assert modpow(2, 0, 7) == 1 and modpow(2, 10, 1) == 0 and modpow(0, 0, 5) == 1
          random.seed(1)
          for _ in range(100):
              b, e, m = random.randrange(10 ** 6), random.randrange(10 ** 6), random.randrange(1, 10 ** 6)
              assert modpow(b, e, m) == pow(b, e, m)
      - name: inverse
        code: |
          assert mod_inverse(3, 11) == 4 and mod_inverse(65537, 3120 * 4) is not None or True
          assert mod_inverse(6, 9) is None and mod_inverse(1, 7) == 1
          for m in (7, 11, 97, 1009):
              for a in range(1, 20):
                  inv = mod_inverse(a, m)
                  if a % m:
                      assert inv is not None and a * inv % m == 1
    hints:
      - "Loop over the bits of `exp`: multiply into the result when the low bit is 1, then square the base and shift."
      - "Extended Euclid: keep `(old_r, r)` and `(old_s, s)`; at the end if `old_r != 1` there is no inverse."
    solution: |
      def modpow(base, exp, mod):
          result = 1 % mod
          base %= mod
          while exp:
              if exp & 1:
                  result = result * base % mod
              base = base * base % mod
              exp >>= 1
          return result


      def mod_inverse(a, m):
          old_r, r = a % m, m
          old_s, s = 1, 0
          while r:
              q = old_r // r
              old_r, r = r, old_r - q * r
              old_s, s = s, old_s - q * s
          if old_r != 1:
              return None
          return old_s % m
    explanation: "Both algorithms take time proportional to the number of bits, which is why RSA and Diffie-Hellman work with huge numbers."
  - id: dh-exchange
    title: Diffie-Hellman
    difficulty: 3
    prompt: |
      Write `dh_public(g, secret, p)` returning `g**secret mod p`, and `dh_shared(their_public, my_secret, p)` returning the shared secret. Then write `crack_dh(g, A, p, limit)` that tries exponents `0..limit` and returns the first `x` with `g**x mod p == A`, or `None`, to show brute force works only when the secret is small.
    starter: |
      def dh_public(g, secret, p):
          pass

      def dh_shared(their_public, my_secret, p):
          pass

      def crack_dh(g, A, p, limit):
          pass
    tests:
      - name: exchange
        code: |
          p, g = 2 ** 61 - 1, 3
          a, b = 123456789, 987654321
          A, B = dh_public(g, a, p), dh_public(g, b, p)
          assert dh_shared(B, a, p) == dh_shared(A, b, p) == pow(g, a * b, p)
          assert A != B
      - name: brute force only for small secrets
        code: |
          p, g = 1009, 11
          A = dh_public(g, 345, p)
          x = crack_dh(g, A, p, 1008)
          assert x is not None and pow(g, x, p) == A
          p2, g2 = 2 ** 61 - 1, 3
          assert crack_dh(g2, dh_public(g2, 10 ** 9, p2), p2, 1000) is None
    hints:
      - "Use the built-in `pow(a, b, m)` here."
    solution: |
      def dh_public(g, secret, p):
          return pow(g, secret, p)


      def dh_shared(their_public, my_secret, p):
          return pow(their_public, my_secret, p)


      def crack_dh(g, A, p, limit):
          value = 1
          for x in range(limit + 1):
              if value == A:
                  return x
              value = value * g % p
          return None
    explanation: "The attacker needs the discrete logarithm. For small primes it is a quick loop, for 2048-bit primes there is no known feasible method."
  - id: rsa-roundtrip
    title: Toy RSA
    difficulty: 4
    prompt: |
      Write `rsa_keys(p, q, e=65537)` returning `((n, e), (n, d))` where `n = p*q` and `d` is the inverse of `e` modulo `(p-1)*(q-1)`. Write `rsa_encrypt(m, public)` and `rsa_decrypt(c, private)` for integers `0 <= m < n`, and `rsa_sign(message, private)` / `rsa_verify(message, signature, public)` for `bytes` messages, signing `int.from_bytes(sha256(message).digest(), "big") % n`.
    starter: |
      import hashlib

      def rsa_keys(p, q, e=65537):
          pass

      def rsa_encrypt(m, public):
          pass

      def rsa_decrypt(c, private):
          pass

      def rsa_sign(message, private):
          pass

      def rsa_verify(message, signature, public):
          pass
    tests:
      - name: encryption
        code: |
          pub, priv = rsa_keys(1000003, 1000033)
          assert pub == (1000003 * 1000033, 65537) and priv[0] == pub[0]
          for m in (0, 1, 2, 123456789, pub[0] - 1):
              assert rsa_decrypt(rsa_encrypt(m, pub), priv) == m
          assert rsa_encrypt(5, pub) == rsa_encrypt(5, pub)
      - name: signatures
        code: |
          pub, priv = rsa_keys(1000003, 1000033)
          s = rsa_sign(b"pay Bob 10", priv)
          assert rsa_verify(b"pay Bob 10", s, pub) is True
          assert rsa_verify(b"pay Bob 99", s, pub) is False
          assert rsa_verify(b"pay Bob 10", s + 1, pub) is False
    hints:
      - "`d = pow(e, -1, (p - 1) * (q - 1))`."
      - "Sign: `pow(h, d, n)`. Verify: `pow(sig, e, n) == h`."
    solution: |
      import hashlib


      def rsa_keys(p, q, e=65537):
          n = p * q
          d = pow(e, -1, (p - 1) * (q - 1))
          return (n, e), (n, d)


      def rsa_encrypt(m, public):
          n, e = public
          return pow(m, e, n)


      def rsa_decrypt(c, private):
          n, d = private
          return pow(c, d, n)


      def _digest(message, n):
          return int.from_bytes(hashlib.sha256(message).digest(), "big") % n


      def rsa_sign(message, private):
          n, d = private
          return pow(_digest(message, n), d, n)


      def rsa_verify(message, signature, public):
          n, e = public
          return pow(signature, e, n) == _digest(message, n)
    explanation: "Encryption uses the public exponent and decryption the private one. Signatures swap the roles, so only the key's owner can sign while anyone can verify."
  - id: break-small-rsa
    title: Why key size matters
    difficulty: 3
    prompt: |
      Write `factor(n)` returning `(p, q)` with `p <= q` for `n = p*q`, using trial division, or `None` if `n` is prime or less than 4. Write `recover_private(n, e)` that factors `n` and returns the private exponent `d`, or `None` when `n` cannot be factored. This shows that anyone can break a key that is too small, which is why real moduli have at least 2048 bits.
    starter: |
      def factor(n):
          pass

      def recover_private(n, e):
          pass
    tests:
      - name: factoring
        code: |
          assert factor(1000003 * 1000033) == (1000003, 1000033)
          assert factor(15) == (3, 5) and factor(91) == (7, 13)
          assert factor(97) is None and factor(2) is None and factor(1) is None
      - name: private key recovered
        code: |
          p, q, e = 10007, 10009, 65537
          n = p * q
          d = recover_private(n, e)
          assert d == pow(e, -1, (p - 1) * (q - 1))
          m = 12345
          assert pow(pow(m, e, n), d, n) == m
          assert recover_private(97, 5) is None
    hints:
      - "Try divisors `f` from 2 while `f * f <= n`."
    solution: |
      def factor(n):
          if n < 4:
              return None
          f = 2
          while f * f <= n:
              if n % f == 0:
                  return f, n // f
              f += 1
          return None


      def recover_private(n, e):
          pq = factor(n)
          if pq is None:
              return None
          p, q = pq
          return pow(e, -1, (p - 1) * (q - 1))
    explanation: "Trial division takes about sqrt(n) steps, fine for 40 bits and impossible for 2048. Better algorithms exist but remain infeasible at real key sizes."
  - id: cert-chain
    title: Verify a certificate chain
    difficulty: 4
    prompt: |
      Certificates are dicts `{"subject": s, "issuer": i, "key": k, "sig": sig}` where `sig` is `sha256((i_key + ":" + s + ":" + k).encode()).hexdigest()` and `i_key` is the issuer's public key. Write `verify_chain(chain, roots)`: `chain` is a list of certificates from the leaf up; `roots` maps trusted root names to their keys. Return `True` only if each certificate's issuer is the next certificate's subject (the last certificate's issuer must be in `roots`), each signature matches the issuer's key (the next certificate's `key`, or the root's key for the last one), and the chain is non-empty.
    starter: |
      import hashlib

      def verify_chain(chain, roots):
          pass
    tests:
      - name: chains
        code: |
          import hashlib
          def mk(subject, issuer, key, issuer_key):
              sig = hashlib.sha256((issuer_key + ":" + subject + ":" + key).encode()).hexdigest()
              return {"subject": subject, "issuer": issuer, "key": key, "sig": sig}
          roots = {"RootCA": "root-key"}
          inter = mk("InterCA", "RootCA", "inter-key", "root-key")
          leaf = mk("example.com", "InterCA", "site-key", "inter-key")
          assert verify_chain([leaf, inter], roots) is True
          assert verify_chain([inter], roots) is True
          assert verify_chain([], roots) is False
          assert verify_chain([leaf], roots) is False
          evil = dict(leaf, key="attacker-key")
          assert verify_chain([evil, inter], roots) is False
          other = mk("InterCA", "OtherCA", "inter-key", "other-key")
          assert verify_chain([leaf, other], roots) is False
          assert verify_chain([leaf, dict(inter, sig="00")], roots) is False
    hints:
      - "For each position `i`, the issuer's key is `chain[i+1]['key']`, or `roots[chain[i]['issuer']]` for the last."
    solution: |
      import hashlib


      def verify_chain(chain, roots):
          if not chain:
              return False
          for i, cert in enumerate(chain):
              if i + 1 < len(chain):
                  issuer = chain[i + 1]
                  if cert["issuer"] != issuer["subject"]:
                      return False
                  issuer_key = issuer["key"]
              else:
                  if cert["issuer"] not in roots:
                      return False
                  issuer_key = roots[cert["issuer"]]
              expected = hashlib.sha256((issuer_key + ":" + cert["subject"] + ":" + cert["key"]).encode()).hexdigest()
              if expected != cert["sig"]:
                  return False
          return True
    explanation: "Trust flows down from the root keys already in your browser. Any break in the chain, a wrong name or a bad signature, rejects it."

commonMistakes:
  - title: "Encrypting data directly with RSA"
    explanation: "Use hybrid encryption: RSA or Diffie-Hellman to agree a key, then AES-GCM for the data, with proper padding."
  - title: "Trusting a public key without verifying whose it is"
    explanation: "Key exchange without authentication allows man-in-the-middle attacks. Certificates and signatures bind keys to identities."
  - title: "Small or reused keys and primes"
    explanation: "Use 2048-bit RSA or elliptic curves. Poor randomness in key generation has produced real breakable keys."
  - title: "Signing the message directly"
    explanation: "Sign a padded hash of the message, not the raw message, so forgeries fail."
  - title: "Ignoring certificate errors"
    explanation: "Click-through on certificate warnings is how man-in-the-middle attacks succeed."

summary:
  - "Public-key cryptography uses a public and a private key based on trapdoor problems such as factoring and discrete logarithms."
  - "Diffie-Hellman creates a shared secret in public: both compute g^(ab); it needs authentication to stop man-in-the-middle attacks."
  - "RSA encrypts with the public key and decrypts with the private key; signatures reverse the roles on a hash. Textbook RSA needs padding and large keys."
  - "Certificates signed by CAs bind public keys to names through a chain of trust; TLS uses them with key exchange and symmetric encryption."
  - "Hybrid encryption and forward secrecy are standard practice."
