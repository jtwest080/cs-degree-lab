quiz:
  - type: mcq
    question: What is the root cause of SQL injection?
    options: ["Untrusted data becomes part of the query's code", "A weak password", "An old browser", "Too many users"]
    answer: 0
    explanation: "The database cannot tell the developer's SQL from the attacker's text."
  - type: mcq
    question: What is the best primary defence against SQL injection?
    options: ["Parameterised queries", "Deleting quotes from input", "Hiding the table names", "Longer passwords"]
    answer: 0
    explanation: "Values are sent separately from the SQL structure."
  - type: mcq
    question: Why is an allowlist better than a denylist?
    options: ["It rejects everything unexpected, including tricks you did not think of", "It is shorter", "It is faster", "It needs no testing"]
    answer: 0
    explanation: "Attackers invent encodings that a denylist misses."
  - type: mcq
    question: What does ../../etc/passwd attempt?
    options: ["Path traversal out of the intended folder", "SQL injection", "A buffer overflow", "Cross-site scripting"]
    answer: 0
    explanation: "Each .. climbs one directory."
  - type: mcq
    question: What does a buffer overflow let an attacker do?
    options: ["Overwrite nearby memory such as a return address", "Read the source code", "Guess passwords faster", "Slow the network"]
    answer: 0
    explanation: "Writing past the end of a buffer corrupts adjacent data."
  - type: mcq
    question: Which is a memory-safe language?
    options: ["Python", "C", "Assembly", "C with no bounds checks"]
    answer: 0
    explanation: "It checks bounds and manages memory for you."
  - type: code
    question: |
      Write `quote_shell(arg)` returning `shlex.quote(arg)`, and `is_safe_arg(arg)` returning `True` if `arg` is non-empty and contains only letters, digits, dot, dash and underscore.
    starter: |
      import shlex, re

      def quote_shell(arg):
          pass

      def is_safe_arg(arg):
          pass
    tests:
      - name: quoting
        code: |
          assert quote_shell("a b") == "'a b'" and quote_shell("safe") == "safe"
          assert quote_shell("x; rm") == "'x; rm'"
          assert is_safe_arg("file-1.txt") and not is_safe_arg("a b") and not is_safe_arg("") and not is_safe_arg("x;y")
    solution: |
      import shlex, re


      def quote_shell(arg):
          return shlex.quote(arg)


      def is_safe_arg(arg):
          return bool(re.fullmatch(r"[A-Za-z0-9._-]+", arg))
