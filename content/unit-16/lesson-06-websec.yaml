id: u16-websec
title: "Web Security: XSS, CSRF, Cookies and Headers"
minutes: 60
objective: |
  Apply security to the web stack you met in Units 11 and 13. You will learn the same-origin policy, how cross-site scripting (XSS) and cross-site request forgery (CSRF) work and how to prevent them, how to protect sessions and cookies, how security headers such as Content-Security-Policy help, and how server-side request forgery and open redirects arise.
outcomes:
  - Explain the same-origin policy and what cross-origin requests are allowed
  - Prevent XSS with context-aware output encoding and a Content-Security-Policy
  - Prevent CSRF with SameSite cookies and unguessable tokens
  - Create and verify signed session cookies with secure flags
  - Validate URLs to defend against open redirects and server-side request forgery

sections:
  - heading: The browser as a security boundary
    body: |
      Your browser runs code from many sites at once, so it needs rules to stop one site from reading another's data. The core rule is the **same-origin policy**: a page's **origin** is the triple *scheme + host + port* (`https://shop.example:443`), and scripts from one origin may not read responses or the DOM of another. Requests can still be *sent* across origins (an `<img>`, a form post, a link), which is why CSRF exists, but reading the response needs the other server's permission through **CORS** headers (Unit 13). Cookies follow a looser rule: they are attached to every request for their domain, whichever page triggered it.

      Remember that **the client is not trusted**. Anything the browser sends (form fields, headers, cookies, hidden inputs, JavaScript checks) can be forged by an attacker with a few lines of code. The server must enforce authentication, authorisation and validation itself.

  - heading: Cross-site scripting
    body: |
      **Cross-site scripting (XSS)** is injection (Lesson 16.5) where the target language is HTML or JavaScript. If a site puts user-controlled text into a page without encoding it, an attacker's text such as `<script>...</script>` or `<img src=x onerror=...>` becomes code that runs **with the site's privileges** in the victim's browser: it can read the page, steal the session cookie, make requests as the user, or rewrite the page. **Stored XSS** keeps the payload in the database (a comment, a profile name) so every visitor is hit; **reflected XSS** bounces it off a URL parameter in a link the victim is tricked into opening; **DOM-based XSS** happens entirely in client-side JavaScript that writes to `innerHTML` (Unit 13).

      Defences. **Encode output for its context**: in HTML text convert `& < > " '` to entities (`html.escape`); in an attribute always quote the attribute and encode; in a URL use percent-encoding; in JavaScript never splice data into script source (put it in a data attribute or JSON). Modern **template engines escape by default**, so do not disable that. In the browser prefer `textContent` to `innerHTML`. If you must allow some HTML (rich text), use a well-tested **sanitiser** with an allowlist of tags. Add a **Content-Security-Policy** (CSP) response header such as `default-src 'self'; script-src 'self'` that tells the browser to run scripts only from your own origin and to block inline scripts, a strong second layer. Mark session cookies **HttpOnly** so that scripts cannot read them even if XSS occurs.

  - heading: CSRF, sessions and cookies
    body: |
      **Cross-site request forgery (CSRF)** abuses the fact that browsers send cookies automatically. You are logged in to `bank.example`; you visit `evil.example`, which contains a hidden form that posts to `bank.example/transfer`. The browser dutifully attaches your session cookie, and the bank sees a legitimate-looking authenticated request. The attacker cannot read the response, but state-changing actions are enough.

      Defences. **SameSite cookies**: `SameSite=Lax` (now the browser default) or `Strict` stops cookies being sent on cross-site POSTs. **CSRF tokens**: embed a random, unguessable, per-session (or per-request) token in every form and require it back on each state-changing request; a forged cross-site form cannot know it. Check the `Origin` header as well. Never change state with a GET request. **Re-authenticate** or confirm for sensitive actions.

      A **session** lets the server recognise a returning user: after login it gives the browser a **session id** (a long, unguessable random value), usually in a cookie, and keeps the session data server-side; or it stores data in a **signed cookie** whose HMAC (Lesson 16.3) stops the user editing it. Cookie flags: **Secure** (only over HTTPS), **HttpOnly** (invisible to JavaScript), **SameSite**, a sensible **expiry**, and a narrow **domain and path**. Generate ids with a secure random source, **regenerate the id on login** (to stop **session fixation**, where an attacker plants a known id before the victim logs in), and destroy the session on logout. Use HTTPS everywhere, with **HSTS** (`Strict-Transport-Security`) so browsers refuse plain HTTP.

  - heading: Headers, redirects and server-side requests
    body: |
      A handful of response headers harden a site cheaply: `Content-Security-Policy` (limits where scripts and other resources load from), `X-Content-Type-Options: nosniff` (do not guess file types), `X-Frame-Options: DENY` or CSP `frame-ancestors 'none'` (stop **clickjacking**, where your site is loaded invisibly inside another page and the user is tricked into clicking it), `Referrer-Policy`, and `Strict-Transport-Security`. They cost nothing and block whole classes of attack.

      Two more mistakes that come from trusting a URL. An **open redirect** (`/login?next=https://evil.example`) lets an attacker use your good domain to bounce victims to a phishing page; only redirect to relative paths or allowlisted hosts. **Server-side request forgery (SSRF)** happens when a server fetches a URL supplied by the user (a "fetch preview" feature): the attacker points it at `http://localhost/admin` or the cloud metadata address `http://169.254.169.254/`, reaching internal systems the attacker cannot touch directly. Defences: allowlist hosts and schemes, resolve the name and reject private, loopback and link-local addresses, do not follow redirects blindly, and use network-level egress limits. Parse URLs with a real parser (`urllib.parse`), never with string tricks: `https://trusted.example@evil.example/` has the *host* `evil.example`.

examples:
  - title: Output encoding stops XSS
    intro: "The same text is dangerous raw and harmless once encoded."
    code: |
      import html

      comment = '<script>steal(document.cookie)</script> & "friends"'
      unsafe_page = "<p>" + comment + "</p>"
      safe_page = "<p>" + html.escape(comment) + "</p>"
      print(unsafe_page)
      print(safe_page)

      attr_attack = '" onmouseover="steal()'
      print('<input value="' + attr_attack + '">')
      print('<input value="' + html.escape(attr_attack, quote=True) + '">')
    output: |
      <p><script>steal(document.cookie)</script> & "friends"</p>
      <p>&lt;script&gt;steal(document.cookie)&lt;/script&gt; &amp; &quot;friends&quot;</p>
      <input value="" onmouseover="steal()">
      <input value="&quot; onmouseover=&quot;steal()">
    lines:
      - line: 6
        note: "Raw output: the browser would execute the script tag."
      - line: 7
        note: "Encoded: the same characters now display as text."
      - line: 12
        note: "Inside an attribute the double quote must be encoded too, or the attacker breaks out of the value."
  - title: A CSRF token
    intro: "A secret per-session token embedded in forms. A forged form from another site cannot know it."
    code: |
      import hmac, hashlib

      SERVER_SECRET = b"server-side-secret"

      def csrf_token(session_id):
          return hmac.new(SERVER_SECRET, session_id.encode(), hashlib.sha256).hexdigest()

      def check_csrf(session_id, submitted):
          return hmac.compare_digest(csrf_token(session_id), submitted)

      session = "sess-8f3a"
      token = csrf_token(session)
      print("legitimate form:", check_csrf(session, token))
      print("forged form from another site:", check_csrf(session, "guess"))
      print("token from a different session:", check_csrf(session, csrf_token("sess-other")))
    output: |
      legitimate form: True
      forged form from another site: False
      token from a different session: False
    lines:
      - line: 6
        note: "Derived from the session id and a server secret, so the attacker cannot compute it."
      - line: 9
        note: "Constant-time comparison again."
  - title: A signed session cookie
    intro: "Store the data in the cookie but add an HMAC so tampering is detected."
    code: |
      import hmac, hashlib, base64, json

      KEY = b"cookie-signing-key"

      def b64(b):
          return base64.urlsafe_b64encode(b).decode().rstrip("=")

      def sign(data):
          payload = b64(json.dumps(data, sort_keys=True).encode())
          mac = b64(hmac.new(KEY, payload.encode(), hashlib.sha256).digest())
          return payload + "." + mac

      def load(cookie):
          payload, _, mac = cookie.partition(".")
          good = b64(hmac.new(KEY, payload.encode(), hashlib.sha256).digest())
          if not hmac.compare_digest(mac, good):
              return None
          return json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))

      cookie = sign({"user": "ana", "admin": False})
      print(load(cookie))
      forged_payload = b64(json.dumps({"admin": True, "user": "ana"}, sort_keys=True).encode())
      print(load(forged_payload + "." + cookie.split(".")[1]))
    output: |
      {'admin': False, 'user': 'ana'}
      None
    lines:
      - line: 10
        note: "The tag covers the exact payload bytes."
      - line: 24
        note: "Changing admin to True without the key leaves the old tag, so loading fails and returns None."
  - title: Cookie flags
    intro: "Build a Set-Cookie header with the protective attributes."
    code: |
      def set_cookie(name, value, max_age=3600):
          return f"{name}={value}; Max-Age={max_age}; Path=/; Secure; HttpOnly; SameSite=Lax"

      print(set_cookie("session", "9f8e7d6c5b4a"))

      def audit(header):
          h = header.lower()
          return {flag: flag in h for flag in ("secure", "httponly", "samesite=")}

      print(audit(set_cookie("session", "abc")))
      print(audit("session=abc; Path=/"))
    output: |
      session=9f8e7d6c5b4a; Max-Age=3600; Path=/; Secure; HttpOnly; SameSite=Lax
      {'secure': True, 'httponly': True, 'samesite=': True}
      {'secure': False, 'httponly': False, 'samesite=': False}
    lines:
      - line: 2
        note: "Secure: HTTPS only. HttpOnly: invisible to scripts. SameSite: not sent on most cross-site requests."
      - line: 11
        note: "A cookie without the flags is exposed to eavesdropping, XSS and CSRF."
  - title: "URL tricks: the real host"
    intro: "String checks like startswith are fooled. A real URL parser reports the host the browser will contact."
    code: |
      from urllib.parse import urlparse

      urls = [
          "https://trusted.example/path",
          "https://trusted.example@evil.example/path",
          "https://trusted.example.evil.example/",
          "https://evil.example/?next=https://trusted.example",
          "//evil.example/x",
          "/account/settings",
      ]
      for u in urls:
          p = urlparse(u)
          print(f"{u:<50} host={p.hostname!r:<28} startswith: {u.startswith('https://trusted.example')}")
    output: |
      https://trusted.example/path                       host='trusted.example'            startswith: True
      https://trusted.example@evil.example/path          host='evil.example'               startswith: True
      https://trusted.example.evil.example/              host='trusted.example.evil.example' startswith: True
      https://evil.example/?next=https://trusted.example host='evil.example'               startswith: False
      //evil.example/x                                   host='evil.example'               startswith: False
      /account/settings                                  host=None                         startswith: False
    lines:
      - line: 12
        note: "startswith says True for the 2nd and 3rd URLs, but the browser would contact evil.example."
  - title: Blocking server-side request forgery
    intro: "Reject non-HTTP schemes, unknown hosts and private addresses before fetching a user-supplied URL."
    code: |
      import ipaddress
      from urllib.parse import urlparse

      ALLOWED_HOSTS = {"images.example.com", "cdn.example.com"}

      def safe_to_fetch(url):
          p = urlparse(url)
          if p.scheme not in ("http", "https") or not p.hostname:
              return False
          try:
              ip = ipaddress.ip_address(p.hostname)
              return not (ip.is_private or ip.is_loopback or ip.is_link_local)
          except ValueError:
              return p.hostname in ALLOWED_HOSTS

      for u in ["https://images.example.com/a.png", "http://localhost/admin", "http://127.0.0.1:8080/",
                "http://169.254.169.254/latest/meta-data/", "file:///etc/passwd", "http://10.0.0.5/", "https://evil.example/"]:
          print(u, safe_to_fetch(u))
    output: |
      https://images.example.com/a.png True
      http://localhost/admin False
      http://127.0.0.1:8080/ False
      http://169.254.169.254/latest/meta-data/ False
      file:///etc/passwd False
      http://10.0.0.5/ False
      https://evil.example/ False
    lines:
      - line: 12
        note: "An IP literal must be public. Private, loopback and link-local ranges (including the cloud metadata address) are refused."
      - line: 14
        note: "Names must be on the allowlist. A real defence also resolves the name and checks the resulting IP."

playground:
  prompt: |
    Write a comment containing an image tag with an `onerror` handler, then escape it with `html.escape` and print both versions. Which characters does `html.escape` change?
  code: |
    import html
    print(html.escape("<b>\"hi\" & 'bye'</b>"))

exercises:
  - id: escape-html
    title: Escape for HTML
    difficulty: 2
    prompt: |
      Write `escape_html(text)` replacing `&` with `&amp;`, `<` with `&lt;`, `>` with `&gt;`, `"` with `&quot;` and `'` with `&#x27;`. The ampersand must be replaced first. Then write `render_comment(author, text)` returning `'<div class="comment"><b>AUTHOR</b>: TEXT</div>'` with both author and text escaped.
    starter: |
      def escape_html(text):
          pass

      def render_comment(author, text):
          pass
    tests:
      - name: escaping
        code: |
          assert escape_html("a & b") == "a &amp; b"
          assert escape_html("<script>") == "&lt;script&gt;"
          assert escape_html('say "hi"') == "say &quot;hi&quot;"
          assert escape_html("it's") == "it&#x27;s"
          assert escape_html("&lt;") == "&amp;lt;"
          assert escape_html("plain") == "plain"
      - name: rendering
        code: |
          out = render_comment("<i>Eve</i>", '<img src=x onerror="steal()">')
          assert out == '<div class="comment"><b>&lt;i&gt;Eve&lt;/i&gt;</b>: &lt;img src=x onerror=&quot;steal()&quot;&gt;</div>', out
          assert "<img" not in out and "<i>" not in out
    hints:
      - "Replace `&` first, or the `&` in the other entities would be escaped again."
    solution: |
      def escape_html(text):
          return (text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                      .replace('"', "&quot;").replace("'", "&#x27;"))


      def render_comment(author, text):
          return '<div class="comment"><b>' + escape_html(author) + "</b>: " + escape_html(text) + "</div>"
    explanation: "After escaping, markup characters are shown as text. Each output context (HTML, attribute, URL, JavaScript) needs its own encoding."
  - id: csrf-tokens
    title: CSRF tokens
    difficulty: 3
    prompt: |
      Write `make_token(secret, session_id)` returning `hmac.new(secret, session_id.encode(), hashlib.sha256).hexdigest()` and `check_token(secret, session_id, submitted)` using `hmac.compare_digest`. Then write `handle_post(secret, session_id, form, method)` that accepts only `POST`. For `POST` it requires `form.get("csrf")` to be a valid token and returns `"ok"`; otherwise `"forbidden"`. For any other method return `"method not allowed"`.
    starter: |
      import hmac, hashlib

      def make_token(secret, session_id):
          pass

      def check_token(secret, session_id, submitted):
          pass

      def handle_post(secret, session_id, form, method):
          pass
    tests:
      - name: tokens
        code: |
          s = b"k"
          t = make_token(s, "sess1")
          assert len(t) == 64 and t != make_token(s, "sess2") and t != make_token(b"other", "sess1")
          assert check_token(s, "sess1", t) is True
          assert check_token(s, "sess1", "0" * 64) is False
          assert check_token(s, "sess1", "") is False
      - name: requests
        code: |
          s = b"k"
          t = make_token(s, "sess1")
          assert handle_post(s, "sess1", {"csrf": t, "amount": "5"}, "POST") == "ok"
          assert handle_post(s, "sess1", {"amount": "5"}, "POST") == "forbidden"
          assert handle_post(s, "sess1", {"csrf": "x", "amount": "5"}, "POST") == "forbidden"
          assert handle_post(s, "sess1", {"csrf": make_token(s, "other")}, "POST") == "forbidden"
          assert handle_post(s, "sess1", {"csrf": t}, "GET") == "method not allowed"
    hints:
      - "`form.get('csrf', '')` avoids a KeyError when the field is missing."
    solution: |
      import hmac, hashlib


      def make_token(secret, session_id):
          return hmac.new(secret, session_id.encode(), hashlib.sha256).hexdigest()


      def check_token(secret, session_id, submitted):
          return hmac.compare_digest(make_token(secret, session_id), submitted)


      def handle_post(secret, session_id, form, method):
          if method != "POST":
              return "method not allowed"
          if check_token(secret, session_id, form.get("csrf", "")):
              return "ok"
          return "forbidden"
    explanation: "A forged cross-site request carries the victim's cookie but not the token, which the attacker's page cannot read."
  - id: signed-cookie
    title: Signed session cookies
    difficulty: 4
    prompt: |
      Write `sign_cookie(key, data)` returning `payload + "." + mac`, where `payload` is the URL-safe base64 (no `=` padding) of `json.dumps(data, sort_keys=True)` and `mac` is the URL-safe base64 (no padding) of `HMAC-SHA256(key, payload)`. Write `load_cookie(key, cookie)` returning the data dict if the MAC is valid, and `None` for a bad MAC, missing dot, bad base64 or bad JSON (it must never raise).
    starter: |
      import hmac, hashlib, base64, json

      def sign_cookie(key, data):
          pass

      def load_cookie(key, cookie):
          pass
    tests:
      - name: round trip
        code: |
          k = b"key"
          c = sign_cookie(k, {"user": "ana", "admin": False})
          assert "=" not in c and c.count(".") == 1
          assert load_cookie(k, c) == {"admin": False, "user": "ana"}
          assert load_cookie(b"other", c) is None
      - name: tampering and garbage
        code: |
          import base64, json
          k = b"key"
          c = sign_cookie(k, {"user": "ana", "admin": False})
          payload, mac = c.split(".")
          forged = base64.urlsafe_b64encode(json.dumps({"admin": True, "user": "ana"}, sort_keys=True).encode()).decode().rstrip("=")
          for bad in [forged + "." + mac, "nodot", "", ".", payload + ".", payload + "." + mac[:-2], "!!!.???"]:
              assert load_cookie(k, bad) is None, bad
    hints:
      - "Verify the MAC over the payload string first, then decode. Re-add padding with `'=' * (-len(s) % 4)`."
      - "Wrap decoding in `try/except (ValueError, ...)` and return `None`."
    solution: |
      import hmac, hashlib, base64, json


      def _b64(b):
          return base64.urlsafe_b64encode(b).decode().rstrip("=")


      def _mac(key, payload):
          return _b64(hmac.new(key, payload.encode(), hashlib.sha256).digest())


      def sign_cookie(key, data):
          payload = _b64(json.dumps(data, sort_keys=True).encode())
          return payload + "." + _mac(key, payload)


      def load_cookie(key, cookie):
          payload, dot, mac = cookie.partition(".")
          if not dot or not hmac.compare_digest(_mac(key, payload), mac):
              return None
          try:
              raw = base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4))
              return json.loads(raw)
          except Exception:
              return None
    explanation: "The server only trusts data it signed itself. Note that a signed cookie is readable by the user (it is not encrypted), so it must not hold secrets."
  - id: safe-redirect
    title: Safe redirects and SSRF checks
    difficulty: 4
    prompt: |
      Write `safe_redirect(target, allowed_hosts)` returning `True` only if `target` is a relative path starting with a single `/` (not `//`, not `/\\`), or an `http`/`https` URL whose parsed **hostname** is in `allowed_hosts`. Write `safe_to_fetch(url, allowed_hosts)` returning `True` only for `http`/`https` URLs with a hostname that is in `allowed_hosts`, or an IP address literal that is **not** private, loopback, link-local or reserved (use `ipaddress`). Hostnames not in the allowlist are refused.
    starter: |
      import ipaddress
      from urllib.parse import urlparse

      def safe_redirect(target, allowed_hosts):
          pass

      def safe_to_fetch(url, allowed_hosts):
          pass
    tests:
      - name: redirects
        code: |
          h = {"trusted.example"}
          for ok in ["/account", "/a/b?x=1", "https://trusted.example/x", "http://trusted.example"]:
              assert safe_redirect(ok, h) is True, ok
          for bad in ["//evil.example", "/\\evil.example", "https://evil.example", "https://trusted.example@evil.example/",
                      "https://trusted.example.evil.example/", "javascript:alert(1)", "", "account", "ftp://trusted.example"]:
              assert safe_redirect(bad, h) is False, bad
      - name: fetching
        code: |
          h = {"images.example.com"}
          assert safe_to_fetch("https://images.example.com/a.png", h) is True
          assert safe_to_fetch("http://93.184.216.34/", h) is True
          for bad in ["http://localhost/admin", "http://127.0.0.1/", "http://10.0.0.5/", "http://169.254.169.254/latest",
                      "http://192.168.1.1/", "file:///etc/passwd", "gopher://images.example.com/", "https://evil.example/", "http:///nohost"]:
              assert safe_to_fetch(bad, h) is False, bad
    hints:
      - "For a redirect, a leading `/` must not be followed by another `/` or a backslash; otherwise parse and check the hostname."
      - "`ipaddress.ip_address(host)` raises `ValueError` for a name that is not an IP literal."
    solution: |
      import ipaddress
      from urllib.parse import urlparse


      def safe_redirect(target, allowed_hosts):
          if target.startswith("/"):
              return not (target.startswith("//") or target.startswith("/\\"))
          p = urlparse(target)
          return p.scheme in ("http", "https") and p.hostname in allowed_hosts


      def safe_to_fetch(url, allowed_hosts):
          p = urlparse(url)
          if p.scheme not in ("http", "https") or not p.hostname:
              return False
          try:
              ip = ipaddress.ip_address(p.hostname)
          except ValueError:
              return p.hostname in allowed_hosts
          return not (ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_reserved)
    explanation: "A URL parser tells you the real host. Allowlists and address-range checks stop attackers using your server or your domain as a springboard."
  - id: header-audit
    title: Audit security headers
    difficulty: 3
    prompt: |
      Write `audit_headers(headers)` where `headers` is a dict of response headers (names case-insensitive). Return the sorted list of **missing or weak** items, using these rules: `"csp"` if there is no `Content-Security-Policy` or it contains `unsafe-inline`; `"hsts"` if there is no `Strict-Transport-Security`; `"nosniff"` unless `X-Content-Type-Options` equals `nosniff`; `"framing"` unless `X-Frame-Options` is `DENY` or `SAMEORIGIN` or the CSP contains `frame-ancestors`.
    starter: |
      def audit_headers(headers):
          pass
    tests:
      - name: audit
        code: |
          good = {"Content-Security-Policy": "default-src 'self'; frame-ancestors 'none'", "Strict-Transport-Security": "max-age=31536000",
                  "X-Content-Type-Options": "nosniff"}
          assert audit_headers(good) == []
          assert audit_headers({}) == ["csp", "framing", "hsts", "nosniff"]
          weak = {"content-security-policy": "script-src 'self' 'unsafe-inline'", "x-frame-options": "DENY",
                  "strict-transport-security": "max-age=1", "x-content-type-options": "NOSNIFF"}
          assert audit_headers(weak) == ["csp"], audit_headers(weak)
          assert audit_headers({"X-Frame-Options": "ALLOW-FROM x"}) == ["csp", "framing", "hsts", "nosniff"]
    hints:
      - "Lower-case the header names into a new dict first."
    solution: |
      def audit_headers(headers):
          h = {k.lower(): v for k, v in headers.items()}
          csp = h.get("content-security-policy", "")
          problems = []
          if not csp or "unsafe-inline" in csp:
              problems.append("csp")
          if "strict-transport-security" not in h:
              problems.append("hsts")
          if h.get("x-content-type-options", "").lower() != "nosniff":
              problems.append("nosniff")
          framing_ok = h.get("x-frame-options", "").upper() in ("DENY", "SAMEORIGIN") or "frame-ancestors" in csp
          if not framing_ok:
              problems.append("framing")
          return sorted(problems)
    explanation: "Security headers are cheap, automatic hardening. Scanners such as securityheaders.com perform this kind of check."

commonMistakes:
  - title: "Using innerHTML or unescaped templates with user data"
    explanation: "Encode for the output context. Use textContent and auto-escaping templates."
  - title: "Relying on the Referer or a hidden form field for CSRF"
    explanation: "Use SameSite cookies and unpredictable per-session tokens, and never change state with GET."
  - title: "Session cookies without Secure, HttpOnly and SameSite"
    explanation: "Each flag removes a class of theft or forgery."
  - title: "Checking URLs with startswith or contains"
    explanation: "Parse the URL and test the real hostname against an allowlist."
  - title: "Trusting client-side checks"
    explanation: "Anything in the browser can be bypassed. Enforce rules on the server."

summary:
  - "The same-origin policy separates sites in the browser, but requests can be sent cross-origin and cookies attach automatically."
  - "XSS is injection into HTML/JS: encode output by context, avoid innerHTML, add CSP and HttpOnly cookies."
  - "CSRF is defeated with SameSite cookies, unguessable tokens and no state changes on GET."
  - "Sessions need random ids, signed or server-side data, Secure/HttpOnly/SameSite cookies, regeneration on login and HTTPS with HSTS."
  - "Parse URLs properly to prevent open redirects and SSRF; security headers add cheap layers of defence."
