  - type: code
    question: |
      Write `same_origin(a, b)` returning `True` if two URLs have the same scheme, hostname and port (use the default port 80 for `http` and 443 for `https` when none is given). Use `urllib.parse.urlparse`.
    starter: |
      from urllib.parse import urlparse

      def same_origin(a, b):
          pass
    tests:
      - name: origins
        code: |
          assert same_origin("https://a.example/x", "https://a.example/y?q=1")
          assert same_origin("https://a.example", "https://a.example:443/")
          assert not same_origin("https://a.example", "http://a.example")
          assert not same_origin("https://a.example", "https://b.example")
          assert not same_origin("https://a.example:8443", "https://a.example")
    solution: |
      from urllib.parse import urlparse


      def _origin(u):
          p = urlparse(u)
          port = p.port or {"http": 80, "https": 443}.get(p.scheme)
          return (p.scheme, p.hostname, port)


      def same_origin(a, b):
          return _origin(a) == _origin(b)
