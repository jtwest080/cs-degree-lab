  - type: code
    question: |
      Write `can_view(user, doc)` where `doc` is a dict with `"owner"` and `"shared_with"` (a list). Return `True` if `user` is the owner or in `shared_with`, otherwise `False`. A `doc` of `None` returns `False`.
    starter: |
      def can_view(user, doc):
          pass
    tests:
      - name: view
        code: |
          d = {"owner": "ana", "shared_with": ["bo"]}
          assert can_view("ana", d) is True
          assert can_view("bo", d) is True
          assert can_view("cy", d) is False
          assert can_view("ana", None) is False
    solution: |
      def can_view(user, doc):
          if doc is None:
              return False
          return user == doc["owner"] or user in doc["shared_with"]
