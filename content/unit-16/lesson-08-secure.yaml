quiz:
  - type: mcq
    question: What does the principle of least privilege say?
    options: ["Give each account only the access it needs", "Give admins everything", "Share one account", "Disable logging"]
    answer: 0
    explanation: "It limits the damage if something is compromised."
  - type: mcq
    question: What should you do first if a secret was committed to a public repository?
    options: ["Revoke and rotate it", "Delete the file and hope", "Rename the repository", "Wait a week"]
    answer: 0
    explanation: "Assume it was copied the moment it was public."
  - type: mcq
    question: What is typosquatting?
    options: ["Publishing a malicious package with a name close to a popular one", "A typing test", "A weak hash", "Fast typing"]
    answer: 0
    explanation: "Users who mistype install the attacker's package."
  - type: mcq
    question: What is the purpose of pinning dependencies by hash?
    options: ["To detect a swapped or tampered file", "To make installs faster", "To save disk space", "To hide versions"]
    answer: 0
    explanation: "If the bytes differ, the hash differs."
  - type: mcq
    question: What does fuzzing do?
    options: ["Feeds many random or mutated inputs to find crashes and bugs", "Encrypts files", "Formats code", "Measures speed"]
    answer: 0
    explanation: "It finds inputs the developers never considered."
  - type: mcq
    question: What is an SBOM?
    options: ["A list of the components in a piece of software", "A type of firewall", "A password manager", "A compiler flag"]
    answer: 0
    explanation: "It lets you quickly find whether you use a vulnerable component."
  - type: code
    question: |
      Write `mask(secret, visible=4)` returning the secret with all but the last `visible` characters replaced by `*`. If the secret is no longer than `visible`, return all `*` characters with the same length.
    starter: |
      def mask(secret, visible=4):
          pass
    tests:
      - name: mask
        code: |
          assert mask("abcdefgh") == "****efgh"
          assert mask("abcdefgh", 2) == "******gh"
          assert mask("abc") == "***"
          assert mask("abcd") == "****"
          assert mask("") == ""
    solution: |
      def mask(secret, visible=4):
          if len(secret) <= visible:
              return "*" * len(secret)
          return "*" * (len(secret) - visible) + secret[-visible:]
