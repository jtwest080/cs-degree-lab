exercises:
  - id: log-parse
    title: Parse and summarise a log
    difficulty: 3
    prompt: |
      Each log line looks like `2026-11-13T10:00:05 ana login_failed 203.0.113.7`. Write `summarise(lines)` returning a dict with `"events"` (dict mapping event name to count), `"failed_by_user"` (dict mapping user to count of `login_failed` events), and `"ips"` (sorted list of distinct addresses). Skip blank lines and lines with fewer than 4 fields.
    starter: |
      def summarise(lines):
          pass
    tests:
      - name: summary
        code: |
          lines = [
              "2026-11-13T10:00:05 ana login_failed 203.0.113.7",
              "2026-11-13T10:00:07 ana login_failed 203.0.113.7",
              "",
              "bad line",
              "2026-11-13T10:01:00 bo login_ok 198.51.100.2",
              "2026-11-13T10:02:00 cy login_failed 192.0.2.9",
          ]
          r = summarise(lines)
          assert r["events"] == {"login_failed": 3, "login_ok": 1}
          assert r["failed_by_user"] == {"ana": 2, "cy": 1}
          assert r["ips"] == ["192.0.2.9", "198.51.100.2", "203.0.113.7"]
          assert summarise([]) == {"events": {}, "failed_by_user": {}, "ips": []}
    hints:
      - "`line.split()` gives the four fields. Use `dict.get(k, 0) + 1` to count."
    solution: |
      def summarise(lines):
          events, failed, ips = {}, {}, set()
          for line in lines:
              parts = line.split()
              if len(parts) < 4:
                  continue
              _, user, event, ip = parts[:4]
              events[event] = events.get(event, 0) + 1
              if event == "login_failed":
                  failed[user] = failed.get(user, 0) + 1
              ips.add(ip)
          return {"events": events, "failed_by_user": failed, "ips": sorted(ips)}
    explanation: "Turning raw lines into counts is the first step of every detection rule."
  - id: spray-detect
    title: Detect password spraying
    difficulty: 4
    prompt: |
      `events` is a list of `(time, ip, user, ok)` tuples. Write `spraying(events, min_users=3, window=60)` returning the sorted list of IPs that had **failed** logins (`ok` False) against at least `min_users` **different** users within some `window`-second span (`t2 - t1 < window`). This is the opposite of brute force: few tries per account but many accounts.
    starter: |
      def spraying(events, min_users=3, window=60):
          pass
    tests:
      - name: spray
        code: |
          ev = [(0, "1.1.1.1", "a", False), (10, "1.1.1.1", "b", False), (20, "1.1.1.1", "c", False),
                (0, "2.2.2.2", "a", False), (5, "2.2.2.2", "a", False), (9, "2.2.2.2", "a", False), (12, "2.2.2.2", "a", False),
                (0, "3.3.3.3", "a", False), (100, "3.3.3.3", "b", False), (200, "3.3.3.3", "c", False),
                (0, "4.4.4.4", "a", True), (1, "4.4.4.4", "b", True), (2, "4.4.4.4", "c", True)]
          assert spraying(ev) == ["1.1.1.1"]
          assert spraying(ev, min_users=2, window=101) == ["1.1.1.1", "3.3.3.3"]
          assert spraying([]) == []
    hints:
      - "For each IP take its failed events sorted by time and slide a start index; collect the distinct users in the window."
    solution: |
      def spraying(events, min_users=3, window=60):
          by_ip = {}
          for t, ip, user, ok in events:
              if not ok:
                  by_ip.setdefault(ip, []).append((t, user))
          flagged = []
          for ip, items in by_ip.items():
              items.sort()
              for i, (t, _) in enumerate(items):
                  users = {u for t2, u in items[i:] if t2 - t < window}
                  if len(users) >= min_users:
                      flagged.append(ip)
                      break
          return sorted(flagged)
    explanation: "Spraying evades per-account lockouts, so detection must also look across accounts for each source."
  - id: k-anon
    title: Check k-anonymity
    difficulty: 4
    prompt: |
      Write `k_anonymity(rows, quasi)` that returns the smallest group size when rows are grouped by the quasi-identifier columns in `quasi` (a list of keys); an empty `rows` returns 0. Write `generalise_age(age, width=10)` returning a string like `"30-39"`. Write `suppress_small(rows, quasi, k)` returning the rows whose group has at least `k` members (original order).
    starter: |
      def k_anonymity(rows, quasi):
          pass

      def generalise_age(age, width=10):
          pass

      def suppress_small(rows, quasi, k):
          pass
    tests:
      - name: k
        code: |
          rows = [{"age": "30-39", "zip": "803**", "d": "flu"}, {"age": "30-39", "zip": "803**", "d": "asthma"},
                  {"age": "50-59", "zip": "804**", "d": "flu"}]
          assert k_anonymity(rows, ["age", "zip"]) == 1
          assert k_anonymity(rows[:2], ["age", "zip"]) == 2
          assert k_anonymity(rows, ["d"]) == 1
          assert k_anonymity([], ["age"]) == 0
      - name: generalise and suppress
        code: |
          assert generalise_age(34) == "30-39" and generalise_age(0) == "0-9" and generalise_age(59, 20) == "40-59"
          rows = [{"age": "30-39", "zip": "803**", "d": "flu"}, {"age": "30-39", "zip": "803**", "d": "asthma"},
                  {"age": "50-59", "zip": "804**", "d": "flu"}]
          assert suppress_small(rows, ["age", "zip"], 2) == rows[:2]
          assert suppress_small(rows, ["age", "zip"], 1) == rows
          assert suppress_small(rows, ["age", "zip"], 3) == []
    hints:
      - "Use `collections.Counter` on tuples of the quasi-identifier values."
    solution: |
      from collections import Counter


      def _key(row, quasi):
          return tuple(row[q] for q in quasi)


      def k_anonymity(rows, quasi):
          if not rows:
              return 0
          return min(Counter(_key(r, quasi) for r in rows).values())


      def generalise_age(age, width=10):
          lo = age // width * width
          return f"{lo}-{lo + width - 1}"


      def suppress_small(rows, quasi, k):
          counts = Counter(_key(r, quasi) for r in rows)
          return [r for r in rows if counts[_key(r, quasi)] >= k]
    explanation: "A person with a unique combination of attributes can be singled out, so rare groups are generalised further or removed."
  - id: risk-register
    title: A risk register
    difficulty: 3
    prompt: |
      Write `rank_risks(risks)` where each risk is a dict `{"name", "likelihood" (1-5), "impact" (1-5)}`. Return a list of `(name, score, level)` tuples sorted by score descending, then name ascending. `score = likelihood * impact`; `level` is `"high"` for 15 or more, `"medium"` for 6 to 14 and `"low"` below 6.
    starter: |
      def rank_risks(risks):
          pass
    tests:
      - name: rank
        code: |
          r = [{"name": "typo", "likelihood": 5, "impact": 1}, {"name": "sqli", "likelihood": 4, "impact": 5},
               {"name": "flood", "likelihood": 1, "impact": 5}, {"name": "laptop", "likelihood": 3, "impact": 2},
               {"name": "admin pw", "likelihood": 4, "impact": 4}, {"name": "ddos", "likelihood": 2, "impact": 3}]
          assert rank_risks(r) == [("sqli", 20, "high"), ("admin pw", 16, "high"), ("ddos", 6, "medium"),
                                   ("laptop", 6, "medium"), ("flood", 5, "low"), ("typo", 5, "low")]
          assert rank_risks([]) == []
    hints:
      - "`sorted(items, key=lambda t: (-t[1], t[0]))`."
    solution: |
      def rank_risks(risks):
          out = []
          for r in risks:
              score = r["likelihood"] * r["impact"]
              level = "high" if score >= 15 else "medium" if score >= 6 else "low"
              out.append((r["name"], score, level))
          return sorted(out, key=lambda t: (-t[1], t[0]))
    explanation: "Scoring turns an overwhelming list of worries into an ordered work plan. Real frameworks (DREAD, CVSS, FAIR) refine the same idea."
  - id: backup-check
    title: Check the 3-2-1 backup rule
    difficulty: 3
    prompt: |
      Each backup copy is a dict `{"media": str, "offsite": bool, "immutable": bool}`. Write `check_321(copies)` returning a list of problem strings (empty if all fine): `"need at least 3 copies"` if fewer than 3 copies, `"need at least 2 media types"` if fewer than 2 distinct media, `"need an off-site copy"` if none is off-site, and `"need an immutable or offline copy"` if none is immutable. Problems appear in that order.
    starter: |
      def check_321(copies):
          pass
    tests:
      - name: backups
        code: |
          good = [{"media": "disk", "offsite": False, "immutable": False},
                  {"media": "tape", "offsite": True, "immutable": True},
                  {"media": "disk", "offsite": False, "immutable": False}]
          assert check_321(good) == []
          assert check_321([]) == ["need at least 3 copies", "need at least 2 media types", "need an off-site copy", "need an immutable or offline copy"]
          weak = [{"media": "disk", "offsite": False, "immutable": False}] * 3
          assert check_321(weak) == ["need at least 2 media types", "need an off-site copy", "need an immutable or offline copy"]
    hints:
      - "`len({c['media'] for c in copies})` counts distinct media."
    solution: |
      def check_321(copies):
          problems = []
          if len(copies) < 3:
              problems.append("need at least 3 copies")
          if len({c["media"] for c in copies}) < 2:
              problems.append("need at least 2 media types")
          if not any(c["offsite"] for c in copies):
              problems.append("need an off-site copy")
          if not any(c["immutable"] for c in copies):
              problems.append("need an immutable or offline copy")
          return problems
    explanation: "Ransomware deletes reachable backups, so at least one copy must be offline or immutable, and restores must be tested."

commonMistakes:
  - title: "Logging passwords, tokens or full personal data"
    explanation: "Logs are widely accessible and kept for years. Redact before writing."
  - title: "Never testing backups"
    explanation: "Practise restoring, and keep one copy offline or immutable."
  - title: "Believing that removing names makes data anonymous"
    explanation: "Combinations of age, ZIP and sex can re-identify people. Generalise and measure k."
  - title: "Testing systems without written permission"
    explanation: "Good intentions are not authorization. Stay inside the agreed scope."
  - title: "Alerting on everything"
    explanation: "Too many false alarms cause alert fatigue. Tune rules to what matters."

summary:
  - "Assume breach: log the right events safely, detect brute force, spraying and anomalies, and keep tamper-proof central logs."
  - "Incident response has preparation, detection, containment, eradication, recovery and a blameless review; follow 3-2-1 backups and test restores."
  - "Collect less data, pseudonymise carefully, measure k-anonymity and respect privacy rights and law."
  - "Ethical security work needs authorization, a defined scope and responsible disclosure."
  - "Risk is likelihood times impact: rank, mitigate, transfer, accept or avoid, and keep revisiting."
