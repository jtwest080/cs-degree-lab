id: u16-defence
title: "Defence, Monitoring, Privacy and Ethics"
minutes: 60
objective: |
  Finish the unit by looking at security as an ongoing practice: logging and detecting suspicious behaviour, responding to incidents, protecting personal data and privacy, and the legal and ethical rules that govern security work. You will write log analysers, an anomaly detector, a data-minimisation and anonymisation toolkit, and a risk scorer.
outcomes:
  - Design useful, safe security logs and detect brute force and anomalies from them
  - Describe the stages of incident response and the value of backups and recovery drills
  - Explain data minimisation, pseudonymisation and k-anonymity
  - "Describe the rules of ethical security work: authorization, scope, responsible disclosure"
  - Score and prioritise risks with likelihood and impact

sections:
  - heading: Detect, respond, recover
    body: |
      No defence is perfect, so assume that some attack will succeed and plan to **detect** it quickly, **respond**, and **recover**. Prevention alone leaves you blind; studies regularly find that breaches go unnoticed for months. Detection depends on **logging** the right events: logins (success and failure), changes of permission, access to sensitive data, configuration changes, errors, and unusual volumes. Good logs are **structured** (JSON fields, not free text), carry a **timestamp** in a single timezone, a **user and source address**, and an **event type**; they go to a **central, write-protected store** so an intruder cannot erase their tracks; and they never contain passwords, tokens or full personal data (Lesson 16.8). Alerts need tuning: too many false alarms and people ignore them (**alert fatigue**), too few and attacks are missed.

      Typical detections: many failed logins from one address (brute force) or one account failing from many addresses (spraying), a login from a new country minutes after one from another (**impossible travel**), a spike in data downloaded by one user, a new administrator account created at 3 a.m., and requests containing `' OR 1=1` or `../`. Tools called **SIEM** (security information and event management) collect and correlate logs; **IDS/IPS** (intrusion detection/prevention systems) inspect network traffic; **EDR** watches endpoints; **honeytokens** are fake credentials or files that nobody legitimate touches, so any use is a strong alert.

  - heading: Incident response and resilience
    body: |
      When something is found, follow a rehearsed plan, commonly the NIST stages: **preparation** (roles, contacts, tools, runbooks), **detection and analysis** (is it real, how big, what was touched?), **containment** (isolate the machine, disable the account, block the address, without destroying evidence), **eradication** (remove the malware, close the hole, rotate every secret that may have leaked), **recovery** (restore from clean backups, monitor closely), and **lessons learned** (a blameless **post-mortem** that fixes the process, not a hunt for someone to blame). Communicate clearly and early with affected users, and obey legal notification deadlines.

      Resilience matters as much as defence. **Backups** follow the **3-2-1 rule**: three copies, on two kinds of media, one off-site and offline or immutable, because **ransomware** encrypts or deletes whatever it can reach, including connected backups. A backup you have never **restored** is a hope, not a backup, so practise recovery. Measure **RTO** (recovery time objective: how long can we be down?) and **RPO** (recovery point objective: how much data can we lose?). Keep systems **patched**, since most breaches use flaws that were already fixed.

  - heading: Privacy and personal data
    body: |
      Security protects data from attackers, **privacy** governs what data we collect and how we may use it. Personal data (names, emails, addresses, locations, health, browsing history, device ids) belongs to the person, and laws such as the EU's **GDPR** and California's **CCPA** give them rights: to know what is held, to correct and delete it, to withdraw consent, and to take it elsewhere, while obliging organisations to collect only what they need for a stated purpose and to report breaches. Engineering principles: **data minimisation** (do not collect what you do not need, delete what you no longer need), **purpose limitation**, **encryption** at rest and in transit, **access control and audit trails**, and **privacy by design**.

      Removing names does not make data anonymous. **Pseudonymisation** replaces identifiers with tokens (keeping a protected mapping); it reduces risk but the data can still be linked back. **Re-identification** attacks join "anonymous" records with other data: a famous study found that **87%** of Americans are uniquely identified by just ZIP code, birth date and sex. **k-anonymity** requires every combination of identifying attributes (**quasi-identifiers**) to be shared by at least *k* people, usually by **generalising** (age 34 becomes "30-39", ZIP 80302 becomes "803**") or suppressing rows. **Differential privacy** goes further: it adds calibrated random noise to statistics so that the presence or absence of any single person barely changes the result.

  - heading: Ethics, law and careers
    body: |
      Security knowledge is dual-use: the same skills defend and attack. The rule is **authorization**. Testing a system you do not own, or exceeding the permission you were given, is a crime in most countries (for example the US **Computer Fraud and Abuse Act** and the UK **Computer Misuse Act**), however good your intentions. Professionals work under a written **scope and rules of engagement**: which systems, which techniques, which dates, who to call if something breaks. **Penetration testers** and **red teams** attack with permission; **blue teams** defend; **bug bounty** programmes invite researchers to test specified systems for rewards.

      If you find a vulnerability, practise **responsible (coordinated) disclosure**: report it privately to the owner, give a reasonable time to fix it (often 90 days), do not access more data than needed to prove the issue, do not publish exploits against unpatched systems, and never extort. Weigh the **harms** of your design choices: surveillance, bias, addictive patterns and weak protection of vulnerable people are security and ethics problems too. Codes of ethics such as the **ACM Code of Ethics** ask you to avoid harm, be honest, respect privacy and confidentiality, and take responsibility for your work.

      Finally, manage risk rationally. **Risk = likelihood × impact.** You cannot remove all risk, so rank threats (using your threat model from Lesson 16.1), fix the high-risk ones first, **mitigate**, **transfer** (insurance), **accept** or **avoid** the rest, and revisit as the system changes. Security is a process, never a finished product.

examples:
  - title: Structured, safe logging
    intro: "JSON log lines are easy to search. Sensitive fields are removed before writing."
    code: |
      import json

      SENSITIVE = {"password", "token", "card_number"}

      def log_event(event, **fields):
          clean = {k: ("[REDACTED]" if k in SENSITIVE else v) for k, v in fields.items()}
          return json.dumps({"event": event, **clean}, sort_keys=True)

      print(log_event("login_failed", user="ana", ip="203.0.113.7", password="hunter2"))
      print(log_event("export", user="bo", rows=5000, token="abc123"))
    output: |
      {"event": "login_failed", "ip": "203.0.113.7", "password": "[REDACTED]", "user": "ana"}
      {"event": "export", "rows": 5000, "token": "[REDACTED]", "user": "bo"}
    lines:
      - line: 6
        note: "Redact on the way in, so a forgotten log statement cannot leak a secret."
  - title: Detecting brute force from a log
    intro: "Count failed logins per source address in a sliding time window."
    code: |
      logs = [
          (0, "10.0.0.1", "fail"), (3, "10.0.0.1", "fail"), (5, "10.0.0.2", "ok"),
          (6, "10.0.0.1", "fail"), (8, "10.0.0.1", "fail"), (9, "10.0.0.1", "fail"),
          (50, "10.0.0.3", "fail"), (200, "10.0.0.1", "fail"),
      ]

      def brute_force(logs, threshold=5, window=10):
          alerts = set()
          for ip in {ip for _, ip, _ in logs}:
              times = sorted(t for t, i, r in logs if i == ip and r == "fail")
              for i, t in enumerate(times):
                  in_window = [x for x in times[i:] if x - t < window]
                  if len(in_window) >= threshold:
                      alerts.add(ip)
          return sorted(alerts)

      print(brute_force(logs))
    output: |
      ['10.0.0.1']
    lines:
      - line: 14
        note: "10.0.0.1 fails five times within 10 seconds, so it raises an alert. 10.0.0.3 fails once and is ignored."
  - title: Impossible travel
    intro: "Two logins too far apart in too little time cannot be the same person."
    code: |
      import math

      def km(a, b):
          lat1, lon1, lat2, lon2 = map(math.radians, (*a, *b))
          h = math.sin((lat2 - lat1) / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin((lon2 - lon1) / 2) ** 2
          return 2 * 6371 * math.asin(math.sqrt(h))

      logins = [(0, "ana", (40.7, -74.0)), (3600, "ana", (51.5, -0.1)), (7200, "bo", (48.9, 2.4)), (9000, "bo", (48.8, 2.3))]

      def impossible(logins, max_kmh=900):
          last, flagged = {}, []
          for t, user, pos in logins:
              if user in last:
                  t0, p0 = last[user]
                  speed = km(p0, pos) / ((t - t0) / 3600)
                  if speed > max_kmh:
                      flagged.append((user, round(speed)))
              last[user] = (t, pos)
          return flagged

      print(round(km((40.7, -74.0), (51.5, -0.1))), "km New York to London")
      print(impossible(logins))
    output: |
      5573 km New York to London
      [('ana', 5573)]
    lines:
      - line: 4
        note: "The haversine formula gives the great-circle distance."
      - line: 19
        note: "5,500 km in one hour is faster than an aeroplane, so ana's second login is suspicious (maybe a stolen password or a VPN)."
  - title: Pseudonymisation and k-anonymity
    intro: "Generalise quasi-identifiers until every group has at least k members."
    code: |
      import hashlib
      from collections import Counter

      people = [
          {"name": "Ana", "age": 34, "zip": "80302", "illness": "flu"},
          {"name": "Bo", "age": 37, "zip": "80304", "illness": "asthma"},
          {"name": "Cy", "age": 31, "zip": "80301", "illness": "flu"},
          {"name": "Di", "age": 52, "zip": "80403", "illness": "diabetes"},
          {"name": "Ed", "age": 58, "zip": "80401", "illness": "flu"},
      ]

      def pseudonym(name, salt="s"):
          return hashlib.sha256((salt + name).encode()).hexdigest()[:8]

      def generalise(p):
          lo = p["age"] // 10 * 10
          return {"id": pseudonym(p["name"]), "age": f"{lo}-{lo + 9}", "zip": p["zip"][:3] + "**", "illness": p["illness"]}

      table = [generalise(p) for p in people]
      groups = Counter((r["age"], r["zip"]) for r in table)
      print(dict(groups))
      print("k =", min(groups.values()))
    output: |
      {('30-39', '803**'): 3, ('50-59', '804**'): 2}
      k = 2
    lines:
      - line: 13
        note: "A salted hash tokenises the name. Without the salt it can still be reversed by guessing names."
      - line: 17
        note: "Age bands and a shortened ZIP make several people look alike."
      - line: 23
        note: "Every group has at least 2 members, so this table is 2-anonymous."
  - title: Scoring risk
    intro: "Risk = likelihood x impact. Sort the list and fix the biggest first."
    code: |
      risks = [
          ("SQL injection in search form", 4, 5),
          ("Laptop stolen", 3, 3),
          ("Data centre flood", 1, 5),
          ("Weak admin password", 4, 4),
          ("Typo on About page", 5, 1),
      ]
      for name, p, i in sorted(risks, key=lambda r: r[1] * r[2], reverse=True):
          level = "HIGH" if p * i >= 15 else "MEDIUM" if p * i >= 6 else "LOW"
          print(f"{p * i:>2} {level:<6} {name}")
    output: |
      20 HIGH   SQL injection in search form
      16 HIGH   Weak admin password
       9 MEDIUM Laptop stolen
       5 LOW    Data centre flood
       5 LOW    Typo on About page
    lines:
      - line: 8
        note: "Sorted by score. Likelihood and impact are each rated 1 to 5."

