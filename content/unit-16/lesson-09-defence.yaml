quiz:
  - type: mcq
    question: What is the 3-2-1 backup rule?
    options: ["3 copies, 2 media types, 1 off-site", "3 servers, 2 users, 1 admin", "3 passwords, 2 keys, 1 salt", "3 days, 2 hours, 1 minute"]
    answer: 0
    explanation: "It protects against hardware failure, disasters and ransomware."
  - type: mcq
    question: What does pseudonymisation do?
    options: ["Replaces identifiers with tokens while keeping a protected mapping", "Makes data impossible to link", "Encrypts the network", "Deletes the data"]
    answer: 0
    explanation: "It reduces risk, but re-linking is still possible with the mapping or other data."
  - type: mcq
    question: What does k-anonymity require?
    options: ["Every combination of quasi-identifiers is shared by at least k people", "A key of length k", "k passwords", "k firewalls"]
    answer: 0
    explanation: "No one can be singled out within a group smaller than k."
  - type: mcq
    question: Why must penetration testers have written authorization?
    options: ["Testing without permission can be illegal, whatever the intent", "It makes tests faster", "It is only a formality", "Tools require it"]
    answer: 0
    explanation: "Scope and permission separate ethical work from crime."
  - type: mcq
    question: What is responsible disclosure?
    options: ["Privately reporting a vulnerability and allowing time to fix it before publishing", "Posting exploits at once", "Selling the bug", "Keeping it secret forever"]
    answer: 0
    explanation: "It protects users while still getting the problem fixed."
  - type: mcq
    question: How is risk usually scored?
    options: ["Likelihood multiplied by impact", "Cost divided by time", "Number of users", "Length of the code"]
    answer: 0
    explanation: "Both how likely and how bad matter."
  - type: code
    question: |
      Write `failed_per_user(events)` where `events` is a list of `(user, ok)` pairs. Return a dict of user to the number of failed (`ok` False) events, omitting users with no failures.
    starter: |
      def failed_per_user(events):
          pass
    tests:
      - name: count
        code: |
          ev = [("a", False), ("b", True), ("a", False), ("c", False), ("b", False)]
          assert failed_per_user(ev) == {"a": 2, "c": 1, "b": 1}
          assert failed_per_user([("a", True)]) == {}
    solution: |
      def failed_per_user(events):
          out = {}
          for user, ok in events:
              if not ok:
                  out[user] = out.get(user, 0) + 1
          return out
