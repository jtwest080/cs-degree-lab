solution: |
  import hmac, hashlib, base64, json, posixpath, secrets


  # ---------- path traversal ----------
  def safe_join(base, user_path):
      if "\x00" in user_path:
          raise ValueError("null byte")
      full = posixpath.normpath(posixpath.join(base, user_path))
      base_n = posixpath.normpath(base)
      if full != base_n and not full.startswith(base_n.rstrip("/") + "/"):
          raise ValueError("path escapes base directory")
      return full


  # ---------- output encoding ----------
  def escape_html(text):
      return (text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                  .replace('"', "&quot;").replace("'", "&#x27;"))


  # ---------- passwords ----------
  def hash_password(password, salt=None, iterations=1000):
      if salt is None:
          salt = secrets.token_hex(8)
      dk = hashlib.pbkdf2_hmac("sha256", password.encode(), salt.encode(), iterations)
      return f"pbkdf2${iterations}${salt}${dk.hex()}"


  def verify_password(password, stored):
      try:
          scheme, iters, salt, digest = stored.split("$")
          if scheme != "pbkdf2":
              return False
          candidate = hash_password(password, salt, int(iters))
      except (ValueError, TypeError):
          return False
      return hmac.compare_digest(candidate, stored)


  # ---------- signed cookies ----------
  def _b64(b):
      return base64.urlsafe_b64encode(b).decode().rstrip("=")


  def _mac(key, payload):
      return _b64(hmac.new(key, payload.encode(), hashlib.sha256).digest())


  def sign_cookie(key, data):
      payload = _b64(json.dumps(data, sort_keys=True).encode())
      return payload + "." + _mac(key, payload)


  def load_cookie(key, cookie):
      payload, dot, mac = cookie.partition(".")
      if not dot or not hmac.compare_digest(_mac(key, payload), mac):
          return None
      try:
          return json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
      except Exception:
          return None


  # ---------- parameterised queries ----------
  def build_select(table, columns, filters, schema):
      if table not in schema:
          raise ValueError("unknown table")
      if not columns:
          raise ValueError("no columns")
      for c in list(columns) + list(filters):
          if c not in schema[table]:
              raise ValueError("unknown column " + str(c))
      sql = "SELECT " + ", ".join(columns) + " FROM " + table
      params = []
      if filters:
          keys = sorted(filters)
          sql += " WHERE " + " AND ".join(k + " = ?" for k in keys)
          params = [filters[k] for k in keys]
      return sql, params


  # ---------- rate limiting ----------
  class RateLimiter:
      def __init__(self, max_fail=3, window=60):
          self.max_fail, self.window, self.fails = max_fail, window, {}

      def allowed(self, key, now):
          recent = [t for t in self.fails.get(key, []) if now - t < self.window]
          self.fails[key] = recent
          return len(recent) < self.max_fail

      def failure(self, key, now):
          self.fails.setdefault(key, []).append(now)

      def success(self, key):
          self.fails.pop(key, None)
stretch:
- Add `check_password_strength(pw, breached)` that rejects short passwords, passwords in a breached set, and ones containing the username, and returns a list of reasons.
- Make `hash_password` support a `"scrypt"` scheme with `hashlib.scrypt` and let `verify_password` read the scheme from the stored string, plus a `needs_rehash(stored)` check for old, weaker parameters.
- Add an expiry to the signed cookie (an `exp` claim) and a `load_cookie(key, cookie, now)` that rejects expired ones.
- Write a `Session` store that creates ids with `secrets.token_urlsafe`, rotates the id on login (against session fixation) and expires idle sessions.
- Extend the threat model of Lesson 16.1 for a small app of your own and write one test per mitigated threat.
