- text: sign_cookie and load_cookie round-trip
  test: sign_cookie and load_cookie
- text: load_cookie rejects forged, truncated and malformed cookies
  test: tampered and garbage cookies
- text: build_select produces parameterised SQL
  test: build_select makes parameterised SQL
- text: build_select rejects unknown tables and columns
  test: build_select rejects unknown names
- text: RateLimiter locks out after too many recent failures
  test: RateLimiter blocks after repeated failures
- text: RateLimiter uses a sliding window and clears on success
  test: RateLimiter window and reset
