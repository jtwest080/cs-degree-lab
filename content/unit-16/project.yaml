title: Security Toolkit
language: python
brief: |-
  You will build a small **defensive security toolkit**: six safe building blocks that a web application can use. Every one of them is a defence from this unit, written in one file.

  1. `safe_join(base, user_path)` joins a user-supplied path onto a base directory and returns the normalised result, but raises `ValueError` if the result escapes `base` (via `..`, an absolute path, or a null byte). Use `posixpath` (Lesson 16.5). The base itself is allowed.
  2. `escape_html(text)` encodes `&`, `<`, `>`, `"` and `'` as `&amp;`, `&lt;`, `&gt;`, `&quot;` and `&#x27;` (Lesson 16.6). Replace the ampersand first.
  3. `hash_password(password, salt=None, iterations=1000)` returns `"pbkdf2$ITERATIONS$SALT$HEXDIGEST"` using `hashlib.pbkdf2_hmac("sha256", ...)`. If no salt is given, create one with `secrets.token_hex(8)`. `verify_password(password, stored)` recomputes the hash from the stored parameters and compares in constant time; any malformed stored value returns `False` and never raises (Lesson 16.3).
  4. `sign_cookie(key, data)` and `load_cookie(key, cookie)` implement the signed session cookie of Lesson 16.6: `payload.mac`, both URL-safe base64 without padding, where `payload` encodes `json.dumps(data, sort_keys=True)` and `mac` is HMAC-SHA256 of the payload. `load_cookie` returns the data, or `None` for anything forged or malformed.
  5. `build_select(table, columns, filters, schema)` returns `(sql, params)` for a parameterised query (Lesson 16.5). `schema` maps allowed table names to sets of allowed column names. Names are checked against the schema (`ValueError` if unknown, or if `columns` is empty); values go only into `params`. Filters are sorted by column name and joined with `AND`.
  6. `RateLimiter(max_fail=3, window=60)` has `allowed(key, now)`, `failure(key, now)` and `success(key)`. A key is allowed while it has fewer than `max_fail` failures within the last `window` seconds (a failure at time `t` counts while `now - t < window`). `success` forgets the key's failures (Lesson 16.7).
steps:
- title: Normalise, then check
  body: |-
    Join first, then `posixpath.normpath`, then check that the result equals the base or starts with the base plus `/`. Do not try to filter `..` by hand: normalising does the work, and checking the *result* is what makes the function safe (Lesson 16.5).
- title: Escape in the right order
  body: |-
    Replace `&` before the other characters, or the `&` inside the entities you just inserted would be escaped again.
- title: Store everything needed to verify
  body: |-
    The stored string holds the scheme, iteration count and salt, so `verify_password` can recompute the digest. Use `hmac.compare_digest` on the whole strings. Wrap the parsing in `try/except` so junk input returns `False`.
- title: Sign the payload, then verify first
  body: |-
    Compute the MAC over the payload string exactly as transmitted. In `load_cookie`, verify the MAC before decoding anything, and restore the base64 padding with `"=" * (-len(s) % 4)` when decoding.
- title: Names from an allowlist, values as parameters
  body: |-
    Never put a value into the SQL text. Column and table names cannot be parameters, so they must be checked against the schema. Sort the filter keys so the output is deterministic.
- title: Keep a list of failure times
  body: |-
    Store failure timestamps per key and prune those older than the window each time you check. The sliding window means attackers cannot lock people out for long (Lesson 16.7).
checklist:
- text: safe_join returns normalised paths inside the base directory
  test: safe_join accepts paths inside the base
- text: safe_join rejects ../, absolute paths and null bytes
