# Terms introduced in Unit 17 (AI and Machine Learning). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Artificial intelligence"
    definition: "The study of building machines that do things that would need intelligence if people did them."
    lesson: u17-search
  - term: "Intelligent agent"
    definition: "Something that perceives its environment and acts to achieve goals."
    lesson: u17-search
  - term: "Rational agent"
    definition: "An agent that picks the action expected to maximise its performance measure."
    lesson: u17-search
  - term: "Performance measure"
    definition: "A score of how well an agent is achieving its goals."
    lesson: u17-search
  - term: "State space"
    definition: "The set of all states of a problem with the actions that connect them."
    lesson: u17-search
  - term: "Frontier"
    definition: "The set of discovered states that have not yet been expanded in a search."
    lesson: u17-search
  - term: "Branching factor"
    definition: "The number of successors of a typical state in a search."
    lesson: u17-search
  - term: "Breadth-first search"
    definition: "Search that expands the shallowest states first and finds fewest-step paths."
    lesson: u17-search
  - term: "Uniform-cost search"
    definition: "Search that always expands the cheapest path so far."
    lesson: u17-search
  - term: "Heuristic function"
    definition: "An estimate of the remaining cost from a state to the goal."
    lesson: u17-search
  - term: "Admissible heuristic"
    definition: "A heuristic that never overestimates the true remaining cost."
    lesson: u17-search
  - term: "A* search"
    definition: "Search that expands the state with the smallest cost so far plus estimated cost to go."
    lesson: u17-search
  - term: "Greedy best-first search"
    definition: "Search that expands the state that looks closest to the goal and ignores cost so far."
    lesson: u17-search
  - term: "Manhattan distance"
    definition: "The sum of the absolute differences of coordinates."
    lesson: u17-search
  - term: "Optimal solution"
    definition: "A solution with the lowest possible path cost."
    lesson: u17-search
  - term: "Zero-sum game"
    definition: "A game where one player's gain is exactly the other's loss."
    lesson: u17-games
  - term: "Game tree"
    definition: "The tree of all possible sequences of moves in a game."
    lesson: u17-games
  - term: "Minimax"
    definition: "An algorithm that picks the move with the best guaranteed outcome against an optimal opponent."
    lesson: u17-games
  - term: "Utility"
    definition: "A number scoring how good an outcome is for a player."
    lesson: u17-games
  - term: "Alpha-beta pruning"
    definition: "A speed-up of minimax that skips branches that cannot change the result."
    lesson: u17-games
  - term: "Evaluation function"
    definition: "A cheap estimate of how good a position is, used when the search stops early."
    lesson: u17-games
  - term: "Transposition table"
    definition: "A cache of already-analysed positions reached by different move orders."
    lesson: u17-games
  - term: "Monte Carlo tree search"
    definition: "A game search that plays many random games from a position and favours moves that win."
    lesson: u17-games
  - term: "Winning position"
    definition: "A position where the player to move can force a win."
    lesson: u17-games
  - term: "Prior"
    definition: "The probability of a hypothesis before seeing the evidence."
    lesson: u17-bayes
  - term: "Likelihood"
    definition: "How probable the evidence is if the hypothesis is true."
    lesson: u17-bayes
  - term: "Posterior"
    definition: "The updated probability of a hypothesis after seeing the evidence."
    lesson: u17-bayes
  - term: "Base-rate fallacy"
    definition: "Ignoring how common something is when judging a test result."
    lesson: u17-bayes
  - term: "Sensitivity"
    definition: "The share of real positive cases that a test detects."
    lesson: u17-bayes
  - term: "Naive Bayes"
    definition: "A classifier that assumes features are independent given the class."
    lesson: u17-bayes
  - term: "Laplace smoothing"
    definition: "Adding one to every count so unseen events do not get probability zero."
    lesson: u17-bayes
  - term: "Bayesian network"
    definition: "A directed graph with tables giving each variable's probability given its parents."
    lesson: u17-bayes
  - term: "Markov chain"
    definition: "A random process where the next state depends only on the current state."
    lesson: u17-bayes
  - term: "Stationary distribution"
    definition: "The long-run distribution of a Markov chain."
    lesson: u17-bayes
  - term: "Machine learning"
    definition: "Building models that learn patterns from data instead of following hand-written rules."
    lesson: u17-ml
  - term: "Supervised learning"
    definition: "Learning from examples that come with the right answers."
    lesson: u17-ml
  - term: "Unsupervised learning"
    definition: "Finding structure in data that has no labels."
    lesson: u17-ml
  - term: "Feature"
    definition: "An input variable describing an example."
    lesson: u17-ml
  - term: "Classification"
    definition: "Predicting a category."
    lesson: u17-ml
  - term: "Hyperparameter"
    definition: "A setting chosen before training, such as the number of neighbours k."
    lesson: u17-ml
  - term: "k-nearest neighbours"
    definition: "A classifier that votes among the k closest training examples."
    lesson: u17-ml
  - term: "Training set"
    definition: "The data used to fit a model."
    lesson: u17-ml
  - term: "Validation set"
    definition: "Data used to choose hyperparameters and compare models."
    lesson: u17-ml
  - term: "Test set"
    definition: "Held-back data used once for a final unbiased estimate."
    lesson: u17-ml
  - term: "Overfitting"
    definition: "Fitting noise so the model does well on training data and badly on new data."
    lesson: u17-ml
  - term: "Underfitting"
    definition: "A model too simple to capture the pattern, poor on all data."
    lesson: u17-ml
  - term: "Bias-variance trade-off"
    definition: "Simple models err by being too rigid, complex ones by being too sensitive to the data."
    lesson: u17-ml
  - term: "Cross-validation"
    definition: "Rotating which part of the data is held out and averaging the scores."
    lesson: u17-ml
  - term: "Data leakage"
    definition: "Information from the test set influencing training."
    lesson: u17-ml
  - term: "Confusion matrix"
    definition: "A table of true and false positives and negatives."
    lesson: u17-ml
  - term: "Precision"
    definition: "Of the cases flagged positive, the fraction that really are."
    lesson: u17-ml
  - term: "Recall"
    definition: "Of the real positives, the fraction found."
    lesson: u17-ml
  - term: "F1 score"
    definition: "The harmonic mean of precision and recall."
    lesson: u17-ml
  - term: "Standardisation"
    definition: "Rescaling a feature to mean 0 and standard deviation 1."
    lesson: u17-ml
  - term: "Linear regression"
    definition: "Fitting a straight line or hyperplane to predict a number."
    lesson: u17-regression
  - term: "Loss function"
    definition: "A number measuring how wrong a model's predictions are."
    lesson: u17-regression
  - term: "Mean squared error"
    definition: "The average of the squared prediction errors."
    lesson: u17-regression
  - term: "Least squares"
    definition: "Choosing the parameters that minimise the squared error."
    lesson: u17-regression
  - term: "Gradient"
    definition: "The vector of partial derivatives, pointing in the direction of steepest increase."
    lesson: u17-regression
  - term: "Gradient descent"
    definition: "Minimising a loss by repeatedly stepping against the gradient."
    lesson: u17-regression
  - term: "Learning rate"
    definition: "The size of each step in gradient descent."
    lesson: u17-regression
  - term: "Stochastic gradient descent"
    definition: "Gradient descent using one example or a small batch per update."
    lesson: u17-regression
  - term: "Mini-batch"
    definition: "A small random subset of the training data used for one update."
    lesson: u17-regression
  - term: "R-squared"
    definition: "The fraction of the variation in the target that a model explains."
    lesson: u17-regression
  - term: "Regularisation"
    definition: "Adding a penalty on model complexity to reduce overfitting."
    lesson: u17-regression
  - term: "Ridge regression"
    definition: "Linear regression with a penalty on the squared weights."
    lesson: u17-regression
  - term: "Polynomial regression"
    definition: "Regression using powers of the features."
    lesson: u17-regression
  - term: "Perceptron"
    definition: "A single linear unit that learns by correcting its mistakes."
    lesson: u17-classification
  - term: "Linearly separable"
    definition: "Data that a straight line or plane can split into the classes."
    lesson: u17-classification
  - term: "Decision boundary"
    definition: "The surface where a classifier switches from one class to another."
    lesson: u17-classification
  - term: "Logistic regression"
    definition: "A classifier that passes a linear score through a sigmoid to give a probability."
    lesson: u17-classification
  - term: "Sigmoid function"
    definition: "The function 1/(1+e^-z) that squashes numbers into the range 0 to 1."
    lesson: u17-classification
  - term: "Log-loss"
    definition: "The negative log-probability the model gave to the true labels."
    lesson: u17-classification
  - term: "Decision tree"
    definition: "A classifier that asks a sequence of questions about features."
    lesson: u17-classification
  - term: "Gini impurity"
    definition: "A measure of how mixed the classes are in a group."
    lesson: u17-classification
  - term: "Information gain"
    definition: "The reduction in entropy from a split."
    lesson: u17-classification
  - term: "Random forest"
    definition: "An ensemble of decision trees trained on random samples that vote."
    lesson: u17-classification
  - term: "Bagging"
    definition: "Training models on bootstrap samples and combining their votes."
    lesson: u17-classification
  - term: "Ensemble"
    definition: "A combination of several models whose errors tend to cancel."
    lesson: u17-classification
  - term: "Support vector machine"
    definition: "A classifier that finds the boundary with the widest margin."
    lesson: u17-classification
  - term: "ROC curve"
    definition: "A plot of true-positive rate against false-positive rate across thresholds."
    lesson: u17-classification
  - term: "Artificial neuron"
    definition: "A unit that applies an activation to a weighted sum of inputs plus a bias."
    lesson: u17-neural
  - term: "Activation function"
    definition: "A nonlinear function applied to a neuron's weighted sum."
    lesson: u17-neural
  - term: "ReLU"
    definition: "The activation max(0, z)."
    lesson: u17-neural
  - term: "Hidden layer"
    definition: "A layer between the input and output layers of a network."
    lesson: u17-neural
  - term: "Forward pass"
    definition: "Computing a network's output from its input."
    lesson: u17-neural
  - term: "Backpropagation"
    definition: "Using the chain rule backwards through a network to compute every gradient."
    lesson: u17-neural
  - term: "Epoch"
    definition: "One pass through the whole training set."
    lesson: u17-neural
  - term: "Vanishing gradient"
    definition: "Gradients shrinking toward zero in deep networks so early layers learn slowly."
    lesson: u17-neural
  - term: "Dropout"
    definition: "Randomly switching off neurons during training to reduce overfitting."
    lesson: u17-neural
  - term: "Convolutional neural network"
    definition: "A network that slides small shared kernels across an image."
    lesson: u17-neural
  - term: "Softmax"
    definition: "A function turning scores into probabilities that sum to 1."
    lesson: u17-neural
  - term: "Cross-entropy"
    definition: "A loss that is the negative log-probability of the true class."
    lesson: u17-neural
  - term: "Deep learning"
    definition: "Machine learning with many-layered neural networks."
    lesson: u17-neural
  - term: "Universal approximation theorem"
    definition: "A network with a hidden layer can approximate any reasonable function given enough units."
    lesson: u17-neural
  - term: "Transformer"
    definition: "A neural network architecture based on attention."
    lesson: u17-neural
  - term: "Clustering"
    definition: "Grouping similar items without labels."
    lesson: u17-unsupervised
  - term: "k-means"
    definition: "A clustering algorithm alternating assignment to nearest centroids and moving centroids to means."
    lesson: u17-unsupervised
  - term: "Centroid"
    definition: "The mean position of a cluster's points."
    lesson: u17-unsupervised
  - term: "Inertia"
    definition: "The sum of squared distances from points to their cluster centroids."
    lesson: u17-unsupervised
  - term: "Elbow method"
    definition: "Choosing k from the bend in the plot of inertia against k."
    lesson: u17-unsupervised
  - term: "Dimensionality reduction"
    definition: "Compressing many features into few while keeping most information."
    lesson: u17-unsupervised
  - term: "Principal component analysis"
    definition: "Projecting data onto the directions of greatest variance."
    lesson: u17-unsupervised
  - term: "Anomaly detection"
    definition: "Finding rare items that differ from the rest."
    lesson: u17-unsupervised
  - term: "Z-score"
    definition: "The number of standard deviations a value is from the mean."
    lesson: u17-unsupervised
  - term: "Reinforcement learning"
    definition: "Learning by trial and error from rewards."
    lesson: u17-unsupervised
  - term: "Reward"
    definition: "The numerical feedback an RL agent receives after an action."
    lesson: u17-unsupervised
  - term: "Policy"
    definition: "A rule giving the action to take in each state."
    lesson: u17-unsupervised
  - term: "Discount factor"
    definition: "A number below 1 that makes future rewards count less."
    lesson: u17-unsupervised
  - term: "Exploration versus exploitation"
    definition: "The trade-off between trying new actions and using the best known one."
    lesson: u17-unsupervised
  - term: "Multi-armed bandit"
    definition: "A problem of choosing among options with unknown payouts."
    lesson: u17-unsupervised
  - term: "Markov decision process"
    definition: "A model of sequential decisions with states, actions, transitions and rewards."
    lesson: u17-unsupervised
  - term: "Bellman equation"
    definition: "The value of a state equals the best action's reward plus discounted value of the next state."
    lesson: u17-unsupervised
  - term: "Value iteration"
    definition: "Repeatedly applying the Bellman update to find optimal values."
    lesson: u17-unsupervised
  - term: "Q-learning"
    definition: "Learning action values from experience with a temporal-difference update."
    lesson: u17-unsupervised
  - term: "Temporal-difference error"
    definition: "The gap between predicted and observed value plus the estimate of the future."
    lesson: u17-unsupervised
  - term: "Language model"
    definition: "A model that gives probabilities to the next token of text."
    lesson: u17-modern
  - term: "N-gram"
    definition: "A sequence of n consecutive words."
    lesson: u17-modern
  - term: "Perplexity"
    definition: "How many equally likely words a language model is torn between at each step."
    lesson: u17-modern
  - term: "Byte-pair encoding"
    definition: "Building a vocabulary by repeatedly merging the most frequent adjacent pair."
    lesson: u17-modern
  - term: "Embedding"
    definition: "A learned vector that represents a token or item so similar ones are close."
    lesson: u17-modern
  - term: "Cosine similarity"
    definition: "The cosine of the angle between two vectors, measuring similarity of direction."
    lesson: u17-modern
  - term: "Attention"
    definition: "A mechanism that mixes value vectors with weights from query-key similarity."
    lesson: u17-modern
  - term: "Large language model"
    definition: "A transformer with billions of parameters trained to predict the next token."
    lesson: u17-modern
  - term: "Pre-training"
    definition: "Training a model on a huge general data set before specialising it."
    lesson: u17-modern
  - term: "Fine-tuning"
    definition: "Further training of a pre-trained model on a narrower task."
    lesson: u17-modern
  - term: "RLHF"
    definition: "Reinforcement learning from human feedback, used to align model outputs with preferences."
    lesson: u17-modern
  - term: "Hallucination"
    definition: "A fluent statement from a language model that is not true."
    lesson: u17-modern
  - term: "Temperature"
    definition: "A setting controlling how random a language model's sampling is."
    lesson: u17-modern
  - term: "Prompt injection"
    definition: "Hidden instructions in text that manipulate a language model."
    lesson: u17-modern
  - term: "Demographic parity"
    definition: "The same share of each group receives the positive outcome."
    lesson: u17-modern
  - term: "Equal opportunity"
    definition: "The same true-positive rate for each group among those who qualify."
    lesson: u17-modern
  - term: "Adversarial example"
    definition: "An input altered slightly to make a model give a wrong answer."
    lesson: u17-modern
  - term: "Data poisoning"
    definition: "Corrupting training data to change a model's behaviour."
    lesson: u17-modern
  - term: "Federated learning"
    definition: "Training a model across many devices without gathering their raw data."
    lesson: u17-modern
  - term: "AI alignment"
    definition: "Making AI systems pursue the goals their designers actually intend."
    lesson: u17-modern
