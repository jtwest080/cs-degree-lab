exercises:
  - id: bfs-grid
    title: Shortest path in a maze
    difficulty: 3
    prompt: |
      Write `shortest_path(grid)` where `grid` is a list of strings using `S` (start), `G` (goal), `.` (open) and `#` (wall). Return the **number of steps** of the shortest path using up, down, left and right moves, or `-1` if the goal cannot be reached.
    starter: |
      from collections import deque

      def shortest_path(grid):
          pass
    tests:
      - name: mazes
        code: |
          assert shortest_path(["S.G"]) == 2
          assert shortest_path(["S#G"]) == -1
          assert shortest_path(["S..", ".#.", "..G"]) == 4
          m = ["S..#....", ".#.#.##.", ".#...#..", ".####.#.", "......#G"]
          assert shortest_path(m) == 15
          assert shortest_path(["SG"]) == 1
          assert shortest_path(["S.#", "###", "..G"]) == -1
    hints:
      - "Find S and G first, then run BFS from S with a `deque` and a `dist` dictionary."
    solution: |
      from collections import deque


      def shortest_path(grid):
          start = goal = None
          for r, row in enumerate(grid):
              for c, ch in enumerate(row):
                  if ch == "S":
                      start = (r, c)
                  elif ch == "G":
                      goal = (r, c)
          dist = {start: 0}
          q = deque([start])
          while q:
              r, c = q.popleft()
              if (r, c) == goal:
                  return dist[(r, c)]
              for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  nr, nc = r + dr, c + dc
                  if 0 <= nr < len(grid) and 0 <= nc < len(grid[nr]) and grid[nr][nc] != "#" and (nr, nc) not in dist:
                      dist[(nr, nc)] = dist[(r, c)] + 1
                      q.append((nr, nc))
          return -1
    explanation: "BFS expands states in order of distance, so the first time it reaches the goal it has found a shortest path."
  - id: word-ladder
    title: Word ladder
    difficulty: 4
    prompt: |
      Write `ladder(start, end, words)` that returns the **length of the shortest sequence** of words from `start` to `end` (counting both ends) where each step changes exactly one letter and every word after the first must be in the set `words`. Return `0` if there is no such sequence. For example `ladder("hit", "cog", {"hot","dot","dog","lot","log","cog"})` is 5 (hit, hot, dot, dog, cog).
    starter: |
      from collections import deque

      def ladder(start, end, words):
          pass
    tests:
      - name: ladders
        code: |
          w = {"hot", "dot", "dog", "lot", "log", "cog"}
          assert ladder("hit", "cog", w) == 5
          assert ladder("hit", "cog", {"hot", "dot", "dog", "lot", "log"}) == 0
          assert ladder("a", "c", {"a", "b", "c"}) == 2
          assert ladder("cat", "cat", {"cat"}) == 1
          assert ladder("cold", "warm", {"cord", "card", "ward", "warm", "worm", "word"}) == 5
    hints:
      - "A state is a word. Neighbours are the words in the set that differ in exactly one position."
    solution: |
      from collections import deque


      def ladder(start, end, words):
          if start == end:
              return 1
          dist = {start: 1}
          q = deque([start])
          while q:
              cur = q.popleft()
              for w in words:
                  if w not in dist and len(w) == len(cur) and sum(a != b for a, b in zip(cur, w)) == 1:
                      if w == end:
                          return dist[cur] + 1
                      dist[w] = dist[cur] + 1
                      q.append(w)
          return 0
    explanation: "Every puzzle that has states and moves can be solved with the same BFS. Only the neighbours function changes."
  - id: ucs-route
    title: Cheapest route
    difficulty: 3
    prompt: |
      Write `cheapest(graph, start, goal)` where `graph` maps each node to a dict of `{neighbour: cost}`. Return `(total_cost, path)` for the cheapest path (a list of nodes), or `None` if the goal is unreachable. Use uniform-cost search with `heapq`.
    starter: |
      import heapq

      def cheapest(graph, start, goal):
          pass
    tests:
      - name: routes
        code: |
          g = {"A": {"B": 4, "C": 1}, "B": {"D": 1}, "C": {"B": 2, "D": 5}, "D": {"E": 3}, "E": {}}
          assert cheapest(g, "A", "E") == (7, ["A", "C", "B", "D", "E"])
          assert cheapest(g, "A", "A") == (0, ["A"])
          assert cheapest(g, "E", "A") is None
          assert cheapest({"X": {}}, "X", "Y") is None
    hints:
      - "Push `(cost, node, path)` tuples. Skip a node you have already finished more cheaply."
    solution: |
      import heapq


      def cheapest(graph, start, goal):
          frontier = [(0, start, [start])]
          done = set()
          while frontier:
              cost, node, path = heapq.heappop(frontier)
              if node == goal:
                  return cost, path
              if node in done:
                  continue
              done.add(node)
              for nxt, step in graph.get(node, {}).items():
                  if nxt not in done:
                      heapq.heappush(frontier, (cost + step, nxt, path + [nxt]))
          return None
    explanation: "The heap keeps the cheapest partial path on top, which is why the first time a node is popped its cost is optimal."
  - id: astar-grid
    title: A* on a grid
    difficulty: 4
    prompt: |
      Write `astar(grid)` for a grid with `S`, `G`, `.` and `#` where moving to a cell costs 1 (4 directions). Return `(steps, expanded)` where `steps` is the shortest path length (or `-1`) and `expanded` is the number of states taken from the heap and expanded (skip stale heap entries). Use the Manhattan distance to `G` as the heuristic. Break ties in the heap with `(f, g, row, col)` so results are deterministic.
    starter: |
      import heapq

      def astar(grid):
          pass
    tests:
      - name: astar
        code: |
          assert astar(["S.G"]) == (2, 3)
          assert astar(["S#G"]) == (-1, 1)
          steps, expanded = astar(["S....", ".....", "....G"])
          assert steps == 6
          m = ["S..#....", ".#.#.##.", ".#...#..", ".####.#.", "......#G"]
          assert astar(m)[0] == 15
          open_grid = ["S" + "." * 18 + "."] + ["." * 19] * 9 + ["." * 18 + "G"]
          big_steps, big_expanded = astar(open_grid)
          assert big_steps == 28 and big_expanded <= 250
    hints:
      - "f = g + h, with `h = abs(r - gr) + abs(c - gc)`. Keep a `best_g` dictionary; skip heap entries whose g is larger than `best_g`."
    solution: |
      import heapq


      def astar(grid):
          start = goal = None
          for r, row in enumerate(grid):
              for c, ch in enumerate(row):
                  if ch == "S":
                      start = (r, c)
                  elif ch == "G":
                      goal = (r, c)

          def h(p):
              return abs(p[0] - goal[0]) + abs(p[1] - goal[1])

          best = {start: 0}
          heap = [(h(start), 0, start[0], start[1])]
          expanded = 0
          while heap:
              f, g, r, c = heapq.heappop(heap)
              if g > best[(r, c)]:
                  continue
              expanded += 1
              if (r, c) == goal:
                  return g, expanded
              for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  nr, nc = r + dr, c + dc
                  if 0 <= nr < len(grid) and 0 <= nc < len(grid[nr]) and grid[nr][nc] != "#":
                      ng = g + 1
                      if ng < best.get((nr, nc), 10 ** 9):
                          best[(nr, nc)] = ng
                          heapq.heappush(heap, (ng + h((nr, nc)), ng, nr, nc))
          return -1, expanded
    explanation: "The heuristic steers the search toward the goal, so open grids expand a thin band of cells instead of a whole diamond."
  - id: water-jugs
    title: The water jug problem
    difficulty: 4
    prompt: |
      You have a jug of capacity `a` and one of capacity `b`, both empty. Each move is: fill a jug, empty a jug, or pour one into the other until the source is empty or the target is full. Write `jug_moves(a, b, target)` returning the **fewest moves** until one jug holds exactly `target`, or `-1` if impossible.
    starter: |
      from collections import deque

      def jug_moves(a, b, target):
          pass
    tests:
      - name: jugs
        code: |
          assert jug_moves(3, 5, 4) == 6
          assert jug_moves(2, 6, 5) == -1
          assert jug_moves(3, 5, 0) == 0
          assert jug_moves(4, 3, 2) == 4
          assert jug_moves(1, 1, 1) == 1
          assert jug_moves(5, 3, 6) == -1
    hints:
      - "A state is the pair `(x, y)` of litres in each jug; generate the six possible moves."
    solution: |
      from collections import deque


      def jug_moves(a, b, target):
          start = (0, 0)
          dist = {start: 0}
          q = deque([start])
          while q:
              x, y = q.popleft()
              if x == target or y == target:
                  return dist[(x, y)]
              pour_xy = min(x, b - y)
              pour_yx = min(y, a - x)
              for nxt in [(a, y), (x, b), (0, y), (x, 0), (x - pour_xy, y + pour_xy), (x + pour_yx, y - pour_yx)]:
                  if nxt not in dist:
                      dist[nxt] = dist[(x, y)] + 1
                      q.append(nxt)
          return -1
    explanation: "The famous puzzle from Die Hard is a state-space search with at most (a+1)(b+1) states."

commonMistakes:
  - title: "Not keeping an explored set"
    explanation: "Graph search without it can loop forever or repeat work exponentially."
  - title: "Using DFS and expecting the shortest path"
    explanation: "DFS finds a path, not necessarily the shortest. Use BFS (equal costs) or UCS/A* (varying costs)."
  - title: "A heuristic that overestimates"
    explanation: "A* is only guaranteed optimal when h never overestimates the true remaining cost."
  - title: "Testing the goal when generating a node instead of when expanding it in UCS and A*"
    explanation: "With varying costs the first time you generate the goal may not be the cheapest. Test when you pop it from the priority queue."
  - title: "Treating all steps as equal cost"
    explanation: "BFS minimises the number of steps, not the total cost. Use uniform-cost search when costs differ."

summary:
  - "An agent perceives and acts to maximise a performance measure; many AI problems become search in a state space."
  - "BFS finds fewest-step paths, UCS finds cheapest paths, DFS saves memory but is neither complete nor optimal in general."
  - "A* orders the frontier by f = g + h and is optimal with an admissible (and consistent) heuristic."
  - "Heuristics come from relaxed problems; stronger admissible heuristics expand fewer nodes."
  - "The same few algorithms solve mazes, puzzles, routes and planning once the problem is formulated well."
