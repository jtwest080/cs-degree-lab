id: u17-search
title: "Intelligent Agents and Search"
minutes: 60
objective: |
  Begin Unit 17 with the oldest idea in AI: solving problems by searching. You will learn what an intelligent agent is, how to describe a problem as a state space, and how breadth-first search, uniform-cost search, greedy search and A* find paths, using mazes, puzzles and a heuristic you design yourself.
outcomes:
  - Describe an agent in terms of percepts, actions, environment and goals
  - Formulate a problem with states, actions, transitions, step costs and a goal test
  - Implement breadth-first and uniform-cost search and explain when each is optimal
  - Design admissible heuristics and use them in A* search
  - Compare search strategies by nodes expanded, memory and solution quality

sections:
  - heading: What is artificial intelligence?
    body: |
      **Artificial intelligence (AI)** is the study of building machines that do things that would need intelligence if a person did them: perceiving, reasoning, planning, learning, understanding language, and acting. The field began in 1956 at a summer workshop at Dartmouth College, and its history is a cycle of optimism and disappointment. Early programs played checkers and proved theorems using **search** and **logic**. Later came **expert systems** (hand-written rules), then the statistical **machine learning** of the 1990s and 2000s, and since about 2012 **deep learning**, where large neural networks learn from huge data sets. Unit 17 follows that path from first principles, using nothing but plain Python.

      A helpful unifying idea is the **intelligent agent**: something that perceives its **environment** through **sensors** (percepts) and acts on it through **actuators** (actions) to achieve a **goal**. A thermostat is a very simple agent, a chess program is a more capable one, a self-driving car is a very complex one. We judge an agent with a **performance measure**: how well does it achieve its goals? A **rational agent** picks the action expected to maximise that measure, given what it knows. Environments differ in ways that matter: fully or partially observable, deterministic or random, one agent or many, static or changing, discrete or continuous.

  - heading: Problems as state spaces
    body: |
      Many tasks reduce to **search**. We describe a problem by: an **initial state**; the **actions** available in each state; a **transition model** (which state results from an action); a **goal test**; and a **path cost** (usually a sum of **step costs**). Together these form a **state space**, a graph (Unit 7) whose nodes are states and whose edges are actions. A **solution** is a path from the initial state to a goal state, and an **optimal** solution has the lowest cost.

      Search explores the graph from the start. It keeps a **frontier** of states discovered but not yet expanded, repeatedly picks one, checks the goal, and adds its neighbours. Different rules for picking from the frontier give different algorithms. We also keep an **explored set** so we never expand the same state twice, which stops infinite loops in graphs with cycles. We judge an algorithm on: **completeness** (does it find a solution if one exists?), **optimality** (is it the cheapest?), and its **time and space** use, measured in the number of nodes it generates. Two numbers describe the problem: the **branching factor** *b* (successors per state) and the **depth** *d* of the shallowest goal.

  - heading: Uninformed search
    body: |
      **Uninformed** (blind) strategies know nothing about how close a state is to the goal. **Breadth-first search (BFS)** expands the shallowest state first, using a queue (Unit 7). It finds the path with the **fewest steps**, so it is optimal when all steps cost the same, but it stores about *b^d* nodes, which explodes quickly. **Depth-first search (DFS)** uses a stack and dives deep first. It needs little memory but can wander forever in an infinite space and does not find shortest paths. **Uniform-cost search (UCS)** generalises BFS to step costs: it always expands the frontier node with the **lowest path cost so far** (g), using a priority queue (a heap, Unit 7). It is optimal with any non-negative costs. This is Dijkstra's algorithm (Unit 8) seen as a search.

      Mazes, route finding, solving a sliding-block puzzle, planning moves for a robot, and even the "word ladder" game (change one letter at a time) are all search problems, and the **same few functions** solve them once the problem is described as states, actions and goals. That is the power of the abstraction.

  - heading: Informed search and heuristics
    body: |
      **Informed** search uses a **heuristic** *h(n)*: an estimate of the remaining cost from state *n* to the goal. **Greedy best-first search** expands the node with the smallest *h*. It is fast but can be fooled and is not optimal. **A\*** (A-star) expands the node with the smallest **f(n) = g(n) + h(n)**: the cost so far plus the estimated cost to go. If *h* is **admissible**, meaning it never overestimates the true remaining cost, then A* with a tree search is optimal; with an explored set, you also need *h* to be **consistent** (h(n) is at most the step cost to a neighbour plus h(neighbour)), which is true for most natural heuristics. The better (larger, but still admissible) the heuristic, the fewer nodes A* expands.

      Good heuristics come from **relaxing** the problem: removing a rule so that the easier problem's exact cost is a lower bound. For a grid where you cannot go diagonally, ignoring the walls gives the **Manhattan distance** |dx| + |dy|. For the 8-puzzle, "tiles can jump anywhere" gives the **number of misplaced tiles**; "tiles slide through each other" gives the total Manhattan distance of tiles, which is larger and so prunes more. A* is the workhorse behind GPS route planning and game path-finding. With a heuristic of 0 it reduces to uniform-cost search; as the heuristic gets exact it expands only the optimal path.

examples:
  - title: Breadth-first search on a grid
    intro: "A maze as text. BFS returns the fewest steps from S to G, and the path itself by remembering each state's parent."
    code: |
      from collections import deque

      MAZE = [
          "S..#....",
          ".#.#.##.",
          ".#...#..",
          ".####.#.",
          "......#G",
      ]

      def find(ch):
          for r, row in enumerate(MAZE):
              if ch in row:
                  return (r, row.index(ch))

      def neighbours(pos):
          r, c = pos
          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
              nr, nc = r + dr, c + dc
              if 0 <= nr < len(MAZE) and 0 <= nc < len(MAZE[0]) and MAZE[nr][nc] != "#":
                  yield (nr, nc)

      def bfs(start, goal):
          frontier = deque([start])
          parent = {start: None}
          while frontier:
              cur = frontier.popleft()
              if cur == goal:
                  path = []
                  while cur is not None:
                      path.append(cur)
                      cur = parent[cur]
                  return path[::-1], len(parent)
              for nxt in neighbours(cur):
                  if nxt not in parent:
                      parent[nxt] = cur
                      frontier.append(nxt)
          return None, len(parent)

      path, seen = bfs(find("S"), find("G"))
      print("steps:", len(path) - 1, "states discovered:", seen)
      print(path[:5], "...")
    output: |
      steps: 15 states discovered: 27
      [(0, 0), (0, 1), (0, 2), (1, 2), (2, 2)] ...
    lines:
      - line: 24
        note: "The queue gives first-in, first-out order, so shallower states are expanded first."
      - line: 25
        note: "parent doubles as the explored set and as a way to rebuild the path."
      - line: 31
        note: "Walk back from the goal through the parents, then reverse."
  - title: Uniform-cost search with step costs
    intro: "Roads have different lengths. UCS expands the cheapest path so far; a heap keeps that order."
    code: |
      import heapq

      ROADS = {
          "A": {"B": 4, "C": 1},
          "B": {"D": 1},
          "C": {"B": 2, "D": 5},
          "D": {"E": 3},
          "E": {},
      }

      def ucs(start, goal):
          frontier = [(0, start, [start])]
          best = {}
          while frontier:
              cost, node, path = heapq.heappop(frontier)
              if node == goal:
                  return cost, path
              if node in best and best[node] <= cost:
                  continue
              best[node] = cost
              for nxt, step in ROADS[node].items():
                  heapq.heappush(frontier, (cost + step, nxt, path + [nxt]))
          return None

      print(ucs("A", "E"))
      print(ucs("A", "Z") if "Z" in ROADS else "Z is not on the map")
    output: |
      (7, ['A', 'C', 'B', 'D', 'E'])
      Z is not on the map
    lines:
      - line: 13
        note: "Entries are (cost so far, state, path). The heap pops the smallest cost."
      - line: 17
        note: "A state is only worth expanding the first time we reach it cheaply."
      - line: 25
        note: "The cheapest route is A to C to B to D to E, cost 7, not the fewest-stop route."
  - title: A* beats BFS by being guided
    intro: "Same grid, but A* uses the Manhattan distance to the goal to avoid exploring the wrong half of the map."
    code: |
      import heapq

      W, H = 20, 20
      WALLS = {(r, 10) for r in range(0, 15)}          # a wall with a gap at the bottom

      def neighbours(p):
          r, c = p
          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
              q = (r + dr, c + dc)
              if 0 <= q[0] < H and 0 <= q[1] < W and q not in WALLS:
                  yield q

      def manhattan(a, b):
          return abs(a[0] - b[0]) + abs(a[1] - b[1])

      def search(start, goal, use_heuristic):
          frontier = [(0, 0, start)]
          g = {start: 0}
          expanded = 0
          while frontier:
              _, cost, cur = heapq.heappop(frontier)
              if cost > g[cur]:
                  continue
              expanded += 1
              if cur == goal:
                  return cost, expanded
              for nxt in neighbours(cur):
                  new = cost + 1
                  if nxt not in g or new < g[nxt]:
                      g[nxt] = new
                      h = manhattan(nxt, goal) if use_heuristic else 0
                      heapq.heappush(frontier, (new + h, new, nxt))

      start, goal = (2, 2), (2, 18)
      print("uniform cost:", search(start, goal, False))
      print("A* manhattan:", search(start, goal, True))
    output: |
      uniform cost: (42, 378)
      A* manhattan: (42, 270)
    lines:
      - line: 17
        note: "Priority is f = g + h. With h = 0 this is plain uniform-cost search."
      - line: 40
        note: "Both find the same optimal cost, but A* expands fewer states because the heuristic steers it toward the goal."
  - title: The 8-puzzle with two heuristics
    intro: "Compare how many states A* expands with the misplaced-tiles heuristic and the stronger Manhattan-distance heuristic."
    code: |
      import heapq

      GOAL = (1, 2, 3, 4, 5, 6, 7, 8, 0)

      def moves(state):
          i = state.index(0)
          r, c = divmod(i, 3)
          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
              nr, nc = r + dr, c + dc
              if 0 <= nr < 3 and 0 <= nc < 3:
                  j = nr * 3 + nc
                  s = list(state)
                  s[i], s[j] = s[j], s[i]
                  yield tuple(s)

      def misplaced(s):
          return sum(1 for i, t in enumerate(s) if t and t != GOAL[i])

      def manhattan(s):
          total = 0
          for i, t in enumerate(s):
              if t:
                  g = t - 1
                  total += abs(i // 3 - g // 3) + abs(i % 3 - g % 3)
          return total

      def astar(start, h):
          frontier = [(h(start), 0, start)]
          g = {start: 0}
          expanded = 0
          while frontier:
              _, cost, cur = heapq.heappop(frontier)
              if cost > g[cur]:
                  continue
              expanded += 1
              if cur == GOAL:
                  return cost, expanded
              for nxt in moves(cur):
                  if nxt not in g or cost + 1 < g[nxt]:
                      g[nxt] = cost + 1
                      heapq.heappush(frontier, (cost + 1 + h(nxt), cost + 1, nxt))

      start = (8, 1, 3, 4, 0, 2, 7, 6, 5)
      print("h = 0         ", astar(start, lambda s: 0))
      print("misplaced     ", astar(start, misplaced))
      print("manhattan     ", astar(start, manhattan))
    output: |
      h = 0          (14, 4158)
      misplaced      (14, 302)
      manhattan      (14, 77)
    lines:
      - line: 17
        note: "Counting tiles out of place never overestimates, since each needs at least one move."
      - line: 20
        note: "Summing each tile's distance is still admissible and is always at least as large, so it prunes more."
      - line: 41
        note: "All three return the same optimal number of moves, but the better the heuristic, the fewer nodes are expanded."
  - title: Greedy search can be fooled
    intro: "Greedy best-first only looks at the estimate, so a dead end that looks close can trap it into a worse answer."
    code: |
      import heapq

      GRAPH = {
          "S": {"A": 1, "B": 5},
          "A": {"G": 20},
          "B": {"G": 3},
          "G": {},
      }
      H = {"S": 6, "A": 1, "B": 4, "G": 0}   # A looks close to the goal but the road from A is long

      def greedy(start, goal):
          frontier = [(H[start], 0, [start])]
          seen = set()
          while frontier:
              _, cost, path = heapq.heappop(frontier)
              node = path[-1]
              if node == goal:
                  return cost, path
              if node in seen:
                  continue
              seen.add(node)
              for nxt, step in GRAPH[node].items():
                  heapq.heappush(frontier, (H[nxt], cost + step, path + [nxt]))

      def astar(start, goal):
          frontier = [(H[start], 0, [start])]
          best = {}
          while frontier:
              _, cost, path = heapq.heappop(frontier)
              node = path[-1]
              if node == goal:
                  return cost, path
              if node in best and best[node] <= cost:
                  continue
              best[node] = cost
              for nxt, step in GRAPH[node].items():
                  heapq.heappush(frontier, (cost + step + H[nxt], cost + step, path + [nxt]))

      print("greedy:", greedy("S", "G"))
      print("A*    :", astar("S", "G"))
    output: |
      greedy: (21, ['S', 'A', 'G'])
      A*    : (8, ['S', 'B', 'G'])
    lines:
      - line: 8
        note: "The estimate at A is 1, but the real cost from A to G is 20. Greedy trusts the estimate and ignores the cost already paid."
      - line: 41
        note: "Greedy takes the tempting road via A (cost 21). A* adds the cost paid so far, so it finds S to B to G with cost 8."

