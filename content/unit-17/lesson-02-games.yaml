    options: ["Multiples of 4", "Odd numbers", "Multiples of 3", "Prime numbers"]
    answer: 0
    explanation: "Whatever you take, your opponent restores a multiple of 4."
  - type: code
    question: |
      Write `move_value(board_scores, maximizing)` where `board_scores` is a list of child values; return the maximum if `maximizing` else the minimum.
    starter: |
      def move_value(board_scores, maximizing):
          pass
    tests:
      - name: choice
        code: |
          assert move_value([3, -1, 7], True) == 7
          assert move_value([3, -1, 7], False) == -1
          assert move_value([5], True) == 5
    solution: |
      def move_value(board_scores, maximizing):
          return max(board_scores) if maximizing else min(board_scores)
