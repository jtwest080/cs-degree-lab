id: u17-games
title: "Game Playing: Minimax and Alpha-Beta"
minutes: 60
objective: |
  Learn how a program plays two-player games perfectly or well. You will model a game as a tree, write minimax, speed it up with alpha-beta pruning, memoise repeated positions, limit the depth with an evaluation function, and solve combinatorial games such as Nim.
outcomes:
  - Represent a two-player zero-sum game as a game tree with utilities
  - Implement minimax and explain optimal play
  - Use alpha-beta pruning to skip branches that cannot matter
  - Combine depth limits and evaluation functions for games too big to solve
  - Use memoisation and the win/lose state idea to solve simple combinatorial games

sections:
  - heading: Adversarial search
    body: |
      In Lesson 17.1 the world just sat there while we searched. In a game, an **opponent** acts against us. We study **two-player, turn-taking, zero-sum** games with **perfect information** (both players see everything): tic-tac-toe, chess, checkers, Go, Connect Four. Zero-sum means one player's gain is exactly the other's loss, so we can describe the result as a single number, the **utility** (for example +1 for a win by the player called MAX, 0 for a draw, -1 for a win by the other player, MIN). MAX wants the number big, MIN wants it small.

      A game is defined by: the initial state, a function saying **whose turn** it is, the legal **moves**, the **result** of a move, a **terminal test** (is the game over?) and the **utility** of terminal states. Unfolding all possible moves gives the **game tree**: the root is the current position, edges are moves, leaves are finished games. Tic-tac-toe has fewer than 550,000 distinct game sequences, which a computer explores instantly; chess has around 10^120, more than the number of atoms in the universe, so it can never be explored completely.

  - heading: Minimax
    body: |
      **Minimax** assumes both players play **optimally**. Every state gets a value: the utility MAX can force from there. At a terminal state it is the utility. At a state where MAX moves, the value is the **maximum** of the children's values (MAX picks their best); where MIN moves it is the **minimum** (MIN picks the move that is worst for MAX). The recursion unwinds from the leaves to the root, and the best move is the child with the best value. Minimax is a **depth-first** search, so it uses little memory (the depth of the tree), but its time is *O(b^m)* where *b* is the branching factor and *m* the maximum depth.

      For tic-tac-toe, minimax shows that with perfect play from both sides, the game is a **draw**. The value of the empty board is 0. Notice what minimax does *not* do: it does not try to trick a weak opponent. It plays the move that guarantees the best result against the best possible reply. Against a weaker opponent a different move might win more often, but it would risk more.

  - heading: Alpha-beta pruning
    body: |
      Minimax examines many positions that cannot affect the decision. **Alpha-beta pruning** returns exactly the same value but skips those branches. It carries two numbers down the tree: **alpha**, the best value MAX can already guarantee on the path so far (starts at -infinity), and **beta**, the best value MIN can already guarantee (starts at +infinity). If at some node alpha >= beta, the opponent would never allow the game to reach it, so the remaining children are **pruned** (not searched).

      The saving depends on **move ordering**: examining good moves first produces more cutoffs. With perfect ordering, alpha-beta searches about *O(b^(m/2))* nodes, so it can look **twice as deep** in the same time. Real programs order moves with heuristics (captures first in chess), and add an **iterative deepening** loop (search to depth 1, then 2, then 3...) that provides the best move so far when time runs out.

  - heading: Evaluation functions, transposition tables and beyond
    body: |
      For big games we cannot reach terminal states, so we stop at a **depth limit** and score the position with an **evaluation function** that estimates who is winning. In chess a simple one adds piece values (pawn 1, knight and bishop 3, rook 5, queen 9) plus a bonus for mobility and king safety; in Connect Four it can count open lines. A good evaluation function is cheap and correlates strongly with the real result. Many positions can be reached by different move orders (**transpositions**), so programs store computed values in a **transposition table** (a dictionary, Unit 7); this is the same memoisation idea as dynamic programming (Unit 8).

      Some games can be **solved** with clever structure rather than search. In **Nim-like** games where players alternately remove objects and a player who cannot move loses, every position is either a **winning position** (the player to move can force a win) or a **losing position**. A position is winning exactly when some move leads to a losing position. For games with chance (backgammon) minimax is extended to **expectiminimax**. **Monte Carlo tree search (MCTS)**, which plays thousands of random games from a position and favours moves that win more often, powered the programs that beat top Go players (AlphaGo combined it with neural networks, Lesson 17.7). Chess engines such as Stockfish still rely on alpha-beta with strong evaluation. In 2017 AlphaZero learned chess, shogi and Go from scratch by self-play.

examples:
  - title: A tiny game tree
    intro: "A tree of nested lists: numbers are utilities at the leaves. MAX moves at the root, MIN at the next level."
    code: |
      def minimax(node, maximizing):
          if isinstance(node, (int, float)):
              return node
          values = [minimax(child, not maximizing) for child in node]
          return max(values) if maximizing else min(values)

      tree = [[3, 12, 8], [2, 4, 6], [14, 5, 2]]
      print("value:", minimax(tree, True))
      print("MIN's choices under each root move:", [minimax(c, False) for c in tree])
    output: |
      value: 3
      MIN's choices under each root move: [3, 2, 2]
    lines:
      - line: 4
        note: "MIN's nodes take the minimum, MAX's take the maximum."
      - line: 8
        note: "MIN would answer 3, 2 and 2, so MAX picks the first move for a guaranteed 3."
  - title: Counting what alpha-beta skips
    intro: "The same tree, with counters showing how many leaves each method looks at."
    code: |
      calls = {"minimax": 0, "alphabeta": 0}

      def minimax(node, maximizing):
          if isinstance(node, (int, float)):
              calls["minimax"] += 1
              return node
          values = [minimax(c, not maximizing) for c in node]
          return max(values) if maximizing else min(values)

      def alphabeta(node, maximizing, alpha=float("-inf"), beta=float("inf")):
          if isinstance(node, (int, float)):
              calls["alphabeta"] += 1
              return node
          if maximizing:
              best = float("-inf")
              for c in node:
                  best = max(best, alphabeta(c, False, alpha, beta))
                  alpha = max(alpha, best)
                  if alpha >= beta:
                      break
              return best
          best = float("inf")
          for c in node:
              best = min(best, alphabeta(c, True, alpha, beta))
              beta = min(beta, best)
              if alpha >= beta:
                  break
          return best

      tree = [[3, 12, 8], [2, 4, 6], [14, 5, 2]]
      print(minimax(tree, True), alphabeta(tree, True))
      print(calls)
    output: |
      3 3
      {'minimax': 9, 'alphabeta': 7}
    lines:
      - line: 19
        note: "Once MIN finds a reply no better than what MAX already has (alpha >= beta), the other replies are not needed."
      - line: 33
        note: "Same answer, fewer leaves. In the second subtree, after seeing the 2, the 4 and 6 can be skipped."
  - title: Perfect tic-tac-toe
    intro: "Boards are 9-character strings. Minimax with a dictionary of already-solved positions plays perfectly."
    code: |
      LINES = [(0,1,2),(3,4,5),(6,7,8),(0,3,6),(1,4,7),(2,5,8),(0,4,8),(2,4,6)]

      def winner(b):
          for i, j, k in LINES:
              if b[i] != " " and b[i] == b[j] == b[k]:
                  return b[i]
          return None

      memo = {}

      def value(b, turn):
          # +1 if X wins, -1 if O wins, 0 for a draw, with best play
          key = (b, turn)
          if key in memo:
              return memo[key]
          w = winner(b)
          if w:
              result = 1 if w == "X" else -1
          elif " " not in b:
              result = 0
          else:
              nxt = "O" if turn == "X" else "X"
              vals = [value(b[:i] + turn + b[i + 1:], nxt) for i in range(9) if b[i] == " "]
              result = max(vals) if turn == "X" else min(vals)
          memo[key] = result
          return result

      print("empty board:", value(" " * 9, "X"))
      print("positions solved:", len(memo))
      print("X to move, O threatens:", value("XX OO    ", "X"))
    output: |
      empty board: 0
      positions solved: 5478
      X to move, O threatens: 1
    lines:
      - line: 10
        note: "A transposition table: the same board reached by different move orders is solved once."
      - line: 29
        note: "With perfect play tic-tac-toe is a draw (0)."
      - line: 31
        note: "X can complete the top row immediately, so this position is a forced win for X (+1)."
  - title: Choosing a move, not just a value
    intro: "Return the best move by looking at each move's value for the player to move."
    code: |
      LINES = [(0,1,2),(3,4,5),(6,7,8),(0,3,6),(1,4,7),(2,5,8),(0,4,8),(2,4,6)]
      def winner(b):
          for i, j, k in LINES:
              if b[i] != " " and b[i] == b[j] == b[k]:
                  return b[i]

      memo = {}
      def value(b, turn):
          key = (b, turn)
          if key not in memo:
              w = winner(b)
              if w:
                  memo[key] = 1 if w == "X" else -1
              elif " " not in b:
                  memo[key] = 0
              else:
                  nxt = "O" if turn == "X" else "X"
                  vals = [value(b[:i] + turn + b[i + 1:], nxt) for i in range(9) if b[i] == " "]
                  memo[key] = max(vals) if turn == "X" else min(vals)
          return memo[key]

      def best_move(b, turn):
          nxt = "O" if turn == "X" else "X"
          scored = [(value(b[:i] + turn + b[i + 1:], nxt), i) for i in range(9) if b[i] == " "]
          return max(scored)[1] if turn == "X" else min(scored)[1]

      board = "XX OO    "
      print("X plays square", best_move(board, "X"))
      board2 = "X   O    "
      print("O to move after X took a corner:", best_move("X        ", "O"))
    output: |
      X plays square 2
      O to move after X took a corner: 4
    lines:
      - line: 24
        note: "Pick the highest-valued move for X, the lowest for O. Ties go to the lowest-numbered square, since max/min of equal scores uses the square index."
      - line: 27
        note: "After a corner opening, the only non-losing reply is the centre (square 4)."
  - title: Solving a take-away game
    intro: "Players alternately take 1, 2 or 3 stones; whoever takes the last stone wins. A position is winning if some move reaches a losing one."
    code: |
      from functools import lru_cache

      @lru_cache(maxsize=None)
      def wins(n):
          # True if the player to move wins with n stones left
          return any(not wins(n - k) for k in (1, 2, 3) if k <= n)

      print([n for n in range(1, 21) if not wins(n)])
      print([wins(n) for n in range(0, 9)])
    output: |
      [4, 8, 12, 16, 20]
      [False, True, True, True, False, True, True, True, False]
    lines:
      - line: 6
        note: "Zero stones means the player to move has already lost (the opponent took the last one)."
      - line: 9
        note: "The losing positions are the multiples of 4: whatever you take, your opponent can restore a multiple of 4."

playground:
  prompt: |
    Make the Nim game take 1, 2 or 4 stones per move. Which positions become losing?
  code: |
    from functools import lru_cache
    @lru_cache(maxsize=None)
    def wins(n):
        return any(not wins(n - k) for k in (1, 2, 3) if k <= n)
    print([n for n in range(0, 13) if not wins(n)])

exercises:
  - id: ttt-winner
    title: Who has won?
    difficulty: 2
    prompt: |
      A tic-tac-toe board is a string of 9 characters (`"X"`, `"O"` or `" "`) read row by row. Write `winner(board)` returning `"X"` or `"O"` if that player has three in a row, otherwise `None`. Write `is_over(board)` returning `True` if someone has won or no empty squares are left.
    starter: |
      def winner(board):
          pass

      def is_over(board):
          pass
    tests:
      - name: winner
        code: |
          assert winner("XXXOO    ") == "X"
          assert winner("O  O  O  ") == "O"
          assert winner("X   X   X") == "X"
          assert winner("  O O O  ") == "O"
          assert winner("XOXOXOOXO") is None
          assert winner(" " * 9) is None
      - name: over
        code: |
          assert is_over("XXXOO    ") is True
          assert is_over("XOXOXOOXO") is True
          assert is_over("XO       ") is False
          assert is_over(" " * 9) is False
    hints:
      - "There are 8 winning lines. Store them as triples of indices."
    solution: |
      LINES = [(0, 1, 2), (3, 4, 5), (6, 7, 8), (0, 3, 6), (1, 4, 7), (2, 5, 8), (0, 4, 8), (2, 4, 6)]


      def winner(board):
          for i, j, k in LINES:
              if board[i] != " " and board[i] == board[j] == board[k]:
                  return board[i]
          return None


      def is_over(board):
          return winner(board) is not None or " " not in board
    explanation: "The terminal test and utility are the only game-specific parts that minimax needs, besides the moves."
  - id: minimax-tree
    title: Minimax on a tree
    difficulty: 3
    prompt: |
      A game tree is a nested list: a number is a leaf utility; a list is a node whose children are the items. Write `minimax(tree, maximizing=True)` returning the value, and `best_root_move(tree)` returning the **index** of the root child that MAX should pick (the first index if tied), assuming MIN moves at the next level.
    starter: |
      def minimax(tree, maximizing=True):
          pass

      def best_root_move(tree):
          pass
    tests:
      - name: values
        code: |
          t = [[3, 12, 8], [2, 4, 6], [14, 5, 2]]
          assert minimax(t) == 3
          assert minimax(t, False) == 6
          assert minimax(7) == 7
          assert minimax([[1, 2], [3, [4, 0]]]) == 3
          assert minimax([5, 9, 1]) == 9
      - name: best move
        code: |
          assert best_root_move([[3, 12, 8], [2, 4, 6], [14, 5, 2]]) == 0
          assert best_root_move([[1, 1], [4, 5], [2, 9]]) == 1
          assert best_root_move([[5], [5], [3]]) == 0
    hints:
      - "For the best root move, evaluate each child with `minimax(child, False)` and take the index of the largest."
    solution: |
      def minimax(tree, maximizing=True):
          if not isinstance(tree, list):
              return tree
          values = [minimax(c, not maximizing) for c in tree]
          return max(values) if maximizing else min(values)


      def best_root_move(tree):
          scores = [minimax(c, False) for c in tree]
          return scores.index(max(scores))
    explanation: "MAX's choice assumes MIN replies optimally at the next level."
  - id: alphabeta-count
    title: Alpha-beta with a counter
    difficulty: 4
    prompt: |
      Write `alphabeta(tree, maximizing=True)` that returns `(value, leaves_visited)`. It must give the same value as minimax, and must prune: stop examining a node's remaining children as soon as `alpha >= beta`. A leaf is a number; a node is a list. Count each leaf you actually evaluate.
    starter: |
      def alphabeta(tree, maximizing=True):
          pass
    tests:
      - name: counts
        code: |
          t = [[3, 12, 8], [2, 4, 6], [14, 5, 2]]
          assert alphabeta(t) == (3, 7)
          assert alphabeta([[1, 2], [3, 4]], True) == (3, 4)
          assert alphabeta([[3, 12], [2, 4]], True) == (3, 3)
          assert alphabeta(5) == (5, 1)
          assert alphabeta([4, 6, 2], True) == (6, 3)
      - name: same as minimax
        code: |
          import random
          def mm(n, mx):
              if not isinstance(n, list): return n
              v = [mm(c, not mx) for c in n]
              return max(v) if mx else min(v)
          random.seed(3)
          def make(d):
              return random.randint(-9, 9) if d == 0 else [make(d - 1) for _ in range(3)]
          for _ in range(40):
              tr = make(3)
              val, leaves = alphabeta(tr)
              assert val == mm(tr, True)
              assert 1 <= leaves <= 27
    hints:
      - "Write an inner function that takes `alpha` and `beta` and uses a list or `nonlocal` counter."
    solution: |
      def alphabeta(tree, maximizing=True):
          count = [0]

          def go(node, mx, alpha, beta):
              if not isinstance(node, list):
                  count[0] += 1
                  return node
              if mx:
                  best = float("-inf")
                  for c in node:
                      best = max(best, go(c, False, alpha, beta))
                      alpha = max(alpha, best)
                      if alpha >= beta:
                          break
                  return best
              best = float("inf")
              for c in node:
                  best = min(best, go(c, True, alpha, beta))
                  beta = min(beta, best)
                  if alpha >= beta:
                      break
              return best

          value = go(tree, maximizing, float("-inf"), float("inf"))
          return value, count[0]
    explanation: "Pruning never changes the answer; it only skips work. How much it skips depends on the order of the moves."
  - id: ttt-ai
    title: An unbeatable tic-tac-toe player
    difficulty: 4
    prompt: |
      Write `best_move(board, player)` returning the index (0-8) of the best move for `player` (`"X"` or `"O"`) using minimax over the whole game. Utilities: +1 if X wins, -1 if O wins, 0 for a draw; X maximises and O minimises. If several moves have equal value, return the **lowest index**. Boards are 9-character strings.
    starter: |
      def best_move(board, player):
          pass
    tests:
      - name: forced wins and blocks
        code: |
          assert best_move("XX OO    ", "X") == 2        # win now
          assert best_move("XX       ", "O") == 2        # must block
          assert best_move("OO       ", "X") == 2        # must block
      - name: openings
        code: |
          assert best_move("X        ", "O") == 4        # reply to a corner in the centre
          assert best_move(" " * 9, "X") == 0
      - name: never loses
        code: |
          import random
          LINES = [(0,1,2),(3,4,5),(6,7,8),(0,3,6),(1,4,7),(2,5,8),(0,4,8),(2,4,6)]
          def win(b, p):
              return any(all(b[i] == p for i in l) for l in LINES)
          random.seed(11)
          for game in range(15):
              b = " " * 9
              turn = "X"
              while " " in b and not win(b, "X") and not win(b, "O"):
                  if turn == "O":
                      move = best_move(b, "O")
                  else:
                      move = random.choice([i for i in range(9) if b[i] == " "])
                  b = b[:move] + turn + b[move + 1:]
                  turn = "O" if turn == "X" else "X"
              assert not win(b, "X"), b
    hints:
      - "Write a helper `value(board, turn)` with a dictionary for memoisation, then pick the best-scoring empty square."
    solution: |
      LINES = [(0, 1, 2), (3, 4, 5), (6, 7, 8), (0, 3, 6), (1, 4, 7), (2, 5, 8), (0, 4, 8), (2, 4, 6)]
      _memo = {}


      def _winner(b):
          for i, j, k in LINES:
              if b[i] != " " and b[i] == b[j] == b[k]:
                  return b[i]
          return None


      def _value(b, turn):
          key = (b, turn)
          if key in _memo:
              return _memo[key]
          w = _winner(b)
          if w:
              r = 1 if w == "X" else -1
          elif " " not in b:
              r = 0
          else:
              nxt = "O" if turn == "X" else "X"
              vals = [_value(b[:i] + turn + b[i + 1:], nxt) for i in range(9) if b[i] == " "]
              r = max(vals) if turn == "X" else min(vals)
          _memo[key] = r
          return r


      def best_move(board, player):
          nxt = "O" if player == "X" else "X"
          best_i, best_v = None, None
          for i in range(9):
              if board[i] != " ":
                  continue
              v = _value(board[:i] + player + board[i + 1:], nxt)
              better = best_v is None or (v > best_v if player == "X" else v < best_v)
              if better:
                  best_i, best_v = i, v
          return best_i
    explanation: "With only about 5,000 reachable positions and memoisation, perfect play is instant. The 'never loses' test plays the AI against random opponents."
  - id: nim-solver
    title: Solving Nim by working backwards
    difficulty: 4
    prompt: |
      Players alternately remove between 1 and `max_take` stones from a single pile; the player who takes the last stone **wins**. Write `losing_positions(max_take, limit)` returning the sorted list of pile sizes from 0 to `limit` inclusive where the player to move **loses** with perfect play. Then write `winning_move(n, max_take)` returning how many stones to take from a pile of `n` (the smallest winning number), or `None` if every move loses.
    starter: |
      def losing_positions(max_take, limit):
          pass

      def winning_move(n, max_take):
          pass
    tests:
      - name: losing
        code: |
          assert losing_positions(3, 20) == [0, 4, 8, 12, 16, 20]
          assert losing_positions(2, 12) == [0, 3, 6, 9, 12]
          assert losing_positions(1, 5) == [0, 2, 4]
          assert losing_positions(4, 15) == [0, 5, 10, 15]
      - name: moves
        code: |
          assert winning_move(7, 3) == 3
          assert winning_move(8, 3) is None
          assert winning_move(5, 4) is None
          assert winning_move(7, 4) == 2
          assert winning_move(1, 3) == 1
          assert winning_move(10, 2) == 1
    hints:
      - "Position `n` is winning if some `k` in `1..max_take` has `n - k` losing. Position 0 is losing."
    solution: |
      def losing_positions(max_take, limit):
          win = [False] * (limit + 1)
          for n in range(1, limit + 1):
              win[n] = any(not win[n - k] for k in range(1, min(max_take, n) + 1))
          return [n for n in range(limit + 1) if not win[n]]


      def winning_move(n, max_take):
          lose = set(losing_positions(max_take, n))
          for k in range(1, min(max_take, n) + 1):
              if n - k in lose:
                  return k
          return None
    explanation: "Working backwards from the end (retrograde analysis) labels every position, and the pattern - multiples of max_take + 1 lose - can be proven by induction (Unit 15's technique)."

commonMistakes:
  - title: "Forgetting that MIN also plays well"
    explanation: "Minimax assumes the opponent replies optimally; do not score a move by the best case."
  - title: "Mixing up who is maximising when you switch levels"
    explanation: "Flip the maximising flag (or the player) on every recursive call."
  - title: "Alpha-beta that changes the answer"
    explanation: "Pruning only skips work. If your values differ from minimax, there is a bug in the cutoff test."
  - title: "Searching without remembering positions"
    explanation: "The same board can be reached by many move orders; store solved positions in a dictionary."
  - title: "Using a slow, weak evaluation function with a deep search"
    explanation: "The evaluation is called at every leaf. It must be cheap and meaningful."

summary:
  - "Games are searched as trees where players alternate; utilities score the end of the game."
  - "Minimax picks the move with the best guaranteed value assuming optimal opposition; it is depth-first with cost O(b^m)."
  - "Alpha-beta pruning returns the same value but skips irrelevant branches, ideally halving the search depth exponent."
  - "Depth limits, evaluation functions and transposition tables make large games playable; MCTS and learning extend this."
  - "Simple combinatorial games can be solved by labelling each position winning or losing."
