id: u17-bayes
title: "Reasoning Under Uncertainty: Bayes and Probabilistic Models"
minutes: 60
objective: |
  Real-world agents never have perfect information. Learn how to reason with probabilities: conditional probability, Bayes' rule and the base-rate trap, a naive Bayes text classifier, updating beliefs about a coin, exact inference in a small Bayesian network, and Markov chains.
outcomes:
  - Use conditional probability, the law of total probability and Bayes' rule
  - Explain the base-rate fallacy with a medical-test example
  - Build and use a naive Bayes classifier with Laplace smoothing
  - Update a probability distribution as evidence arrives
  - Perform inference in a small Bayesian network and simulate a Markov chain

sections:
  - heading: Why probability?
    body: |
      A deterministic search (Lesson 17.1) assumes we know exactly where we are and what each action does. Real problems are different: sensors are noisy, a medical test can be wrong, an email might be spam, a robot is not sure where it is. **Probability** is the mathematics of uncertainty, and a probabilistic agent keeps a **belief**, a probability distribution over the possible states of the world, and updates it as evidence arrives. Unit 6 introduced the rules; we need three of them, and a fourth that grew out of them.

      The **conditional probability** of A given B is P(A | B) = P(A and B) / P(B): the chance of A once we know B happened. The **product rule** rearranges this to P(A and B) = P(A | B) P(B). Two events are **independent** if knowing one tells nothing about the other: P(A and B) = P(A) P(B). The **law of total probability** says that if B1, B2, ... partition the possibilities, then P(A) = sum of P(A | Bi) P(Bi): add up the ways A can happen.

  - heading: Bayes' rule
    body: |
      Since P(A and B) = P(A | B) P(B) = P(B | A) P(A), we get **Bayes' rule**:

      **P(H | E) = P(E | H) P(H) / P(E)**

      Read H as a **hypothesis** and E as **evidence**. P(H) is the **prior** (belief before the evidence), P(E | H) is the **likelihood** (how probable the evidence is if the hypothesis is true), P(E) is the **evidence** probability (often computed with total probability), and P(H | E) is the **posterior**, the updated belief. Bayes' rule turns the easy direction (how likely is a positive test if you are ill?) into the one we need (how likely are you ill if the test is positive?).

      The classic trap is the **base-rate fallacy**. A disease affects 1% of people. A test detects it 90% of the time (**sensitivity**) and gives a false alarm 5% of the time (so **specificity** is 95%). If you test positive, what is the chance you are ill? Most people say about 90%. The true answer is only about 15%, because the 5% false alarms among the 99% healthy people outnumber the true positives among the 1% ill. Ignoring the **prior** (the base rate) gives wildly wrong conclusions in medicine, law courts and security alerts (Lesson 16.9). In practice we compare hypotheses using **odds** or the **log** of the probabilities.

  - heading: Naive Bayes and learning from counts
    body: |
      Suppose we want to classify an email as **spam** or **ham** from the words it contains. Bayes gives P(spam | words) proportional to P(spam) × P(words | spam). Modelling the joint probability of all words is hopeless, so **naive Bayes** makes a simplifying assumption: given the class, words are **conditionally independent**, so P(words | spam) = product of P(word | spam). The assumption is false (words come in phrases) yet the classifier works surprisingly well, and it is the basis of early spam filters.

      Training is just **counting**: P(spam) is the share of training emails that are spam, and P(word | spam) is the count of the word in spam emails divided by all word counts in spam. A word never seen in spam would get probability 0 and wipe out the whole product, so we use **Laplace (add-one) smoothing**: add 1 to every count and add the vocabulary size to the denominator. Multiplying many small numbers underflows to zero, so we add **logarithms** instead. To classify, compute each class's log-score and choose the larger. The same recipe works for sentiment, topic labelling and language identification.

  - heading: Updating beliefs, networks and chains
    body: |
      Bayes' rule is a recipe for **learning from data**. Take a coin of unknown bias *p*. Start with a prior over many candidate values of *p* (say 0.0, 0.1, ..., 1.0, all equally likely). After each flip, multiply each candidate's weight by the likelihood of the flip (*p* for heads, 1 - *p* for tails) and renormalise so the weights sum to 1. After a few flips the distribution concentrates near the true bias. This **Bayesian updating** is how a robot refines where it is, and how some sciences quantify evidence.

      A **Bayesian network** represents a joint distribution compactly as a directed acyclic graph (Unit 7). Each node is a variable, with a table of its probability given its **parents**. The classic example has Burglary and Earthquake causing an Alarm, which makes John and Mary call. We answer queries by **inference**: P(Burglary | JohnCalls, MaryCalls) is found by summing the joint probability over the hidden variables (**enumeration**) and normalising. Exact enumeration is exponential in the number of variables, so real systems use smarter or approximate algorithms (sampling). A **Markov chain** models a state that changes randomly, where the next state depends only on the current one (the **Markov property**): weather, a web surfer following links (Google's PageRank), or the next word in text. Its **transition matrix** gives the probabilities, and repeated multiplication describes the state after *n* steps; many chains settle to a **stationary distribution**. A **hidden Markov model (HMM)** adds states that cannot be seen directly and observations that depend on them, and powered speech recognition for decades.

examples:
  - title: The base-rate trap
    intro: "A rare disease and a good-but-imperfect test. Compute the chance of being ill after a positive result."
    code: |
      def posterior(prior, sensitivity, specificity):
          p_pos_given_ill = sensitivity
          p_pos_given_well = 1 - specificity
          p_pos = p_pos_given_ill * prior + p_pos_given_well * (1 - prior)
          return p_pos_given_ill * prior / p_pos

      print(round(posterior(0.01, 0.90, 0.95), 4))
      print(round(posterior(0.10, 0.90, 0.95), 4))
      print(round(posterior(0.50, 0.90, 0.95), 4))

      # the same thing with counts out of 10,000 people
      people = 10_000
      ill = people * 0.01
      true_pos = ill * 0.90
      false_pos = (people - ill) * 0.05
      print(true_pos, false_pos, round(true_pos / (true_pos + false_pos), 4))
    output: |
      0.1538
      0.6667
      0.9474
      90.0 495.0 0.1538
    lines:
      - line: 4
        note: "Total probability of a positive result: from ill people plus from well people."
      - line: 8
        note: "Same test, different prior: the answer depends heavily on how common the disease is."
      - line: 17
        note: "Counting people makes it concrete: 90 true positives are swamped by 495 false alarms."
  - title: A naive Bayes spam filter
    intro: "Count words per class, smooth with +1, and compare log-probabilities."
    code: |
      import math
      from collections import Counter

      train = [
          ("win cash now", "spam"), ("cheap cash prize now", "spam"), ("win a prize", "spam"),
          ("meeting at noon", "ham"), ("lunch at noon today", "ham"), ("project meeting today", "ham"),
      ]

      class_counts = Counter(label for _, label in train)
      word_counts = {c: Counter() for c in class_counts}
      for text, label in train:
          word_counts[label].update(text.split())
      vocab = {w for c in word_counts.values() for w in c}

      def log_score(text, label):
          score = math.log(class_counts[label] / len(train))
          total = sum(word_counts[label].values())
          for w in text.split():
              score += math.log((word_counts[label][w] + 1) / (total + len(vocab)))
          return score

      def classify(text):
          return max(class_counts, key=lambda c: log_score(text, c))

      for msg in ["win cash", "meeting today", "prize meeting today", "cash"]:
          print(f"{msg!r:24} ->", classify(msg), {c: round(log_score(msg, c), 2) for c in sorted(class_counts)})
    output: |
      'win cash'               -> spam {'ham': -6.88, 'spam': -4.68}
      'meeting today'          -> ham {'ham': -4.68, 'spam': -6.88}
      'prize meeting today'    -> ham {'ham': -7.77, 'spam': -8.87}
      'cash'                   -> spam {'ham': -3.78, 'spam': -2.69}
    lines:
      - line: 18
        note: "Smoothing: +1 on every count, + vocabulary size on the total, so unseen words never give zero."
      - line: 25
        note: "Adding logs avoids multiplying tiny numbers together."
  - title: Updating beliefs about a coin
    intro: "Start with a flat prior over possible biases and update after each flip."
    code: |
      grid = [i / 10 for i in range(11)]
      belief = [1 / len(grid)] * len(grid)

      def update(belief, flip):
          new = [b * (p if flip == "H" else 1 - p) for b, p in zip(belief, grid)]
          total = sum(new)
          return [x / total for x in new]

      def mean(belief):
          return sum(b * p for b, p in zip(belief, grid))

      print("start mean:", round(mean(belief), 3))
      for i, flip in enumerate("HHTHHHTH", 1):
          belief = update(belief, flip)
          print(i, flip, "mean:", round(mean(belief), 3), "most likely p:", grid[belief.index(max(belief))])
    output: |
      start mean: 0.5
      1 H mean: 0.7 most likely p: 1.0
      2 H mean: 0.786 most likely p: 1.0
      3 T mean: 0.596 most likely p: 0.7
      4 H mean: 0.661 most likely p: 0.7
      5 H mean: 0.707 most likely p: 0.8
      6 H mean: 0.741 most likely p: 0.8
      7 T mean: 0.666 most likely p: 0.7
      8 H mean: 0.699 most likely p: 0.7
    lines:
      - line: 5
        note: "Multiply each candidate's weight by the likelihood of the flip."
      - line: 6
        note: "Divide by the total so the beliefs add up to 1 again (the denominator of Bayes' rule)."
  - title: Exact inference in a tiny Bayesian network
    intro: "Enumerate the hidden variables (Earthquake, Alarm) to find P(Burglary | John calls, Mary calls)."
    code: |
      from itertools import product

      P_B, P_E = 0.001, 0.002
      P_A = {(True, True): 0.95, (True, False): 0.94, (False, True): 0.29, (False, False): 0.001}
      P_J = {True: 0.90, False: 0.05}
      P_M = {True: 0.70, False: 0.01}

      def joint(b, e, a, j, m):
          p = (P_B if b else 1 - P_B) * (P_E if e else 1 - P_E)
          p *= P_A[(b, e)] if a else 1 - P_A[(b, e)]
          p *= P_J[a] if j else 1 - P_J[a]
          p *= P_M[a] if m else 1 - P_M[a]
          return p

      def query(j, m):
          num = {b: sum(joint(b, e, a, j, m) for e, a in product([True, False], repeat=2)) for b in (True, False)}
          return num[True] / (num[True] + num[False])

      print("P(burglary | John and Mary call):", round(query(True, True), 3))
      print("P(burglary | John calls only)   :", round(query(True, False), 3))
      print("P(burglary | nobody calls)      :", f"{query(False, False):.5f}")
    output: |
      P(burglary | John and Mary call): 0.284
      P(burglary | John calls only)   : 0.005
      P(burglary | nobody calls)      : 0.00009
    lines:
      - line: 9
        note: "The joint probability multiplies each variable's probability given its parents."
      - line: 16
        note: "Sum out the hidden variables for each value of Burglary, then normalise."
      - line: 20
        note: "Even with two calls, a burglary is still unlikely (about 28%) because burglaries are so rare a priori."
  - title: A weather Markov chain
    intro: "Each day's weather depends only on yesterday's. Repeated steps approach a stationary distribution."
    code: |
      P = {"sun": {"sun": 0.8, "rain": 0.2}, "rain": {"sun": 0.4, "rain": 0.6}}

      def step(dist):
          return {s2: sum(dist[s1] * P[s1][s2] for s1 in P) for s2 in P}

      dist = {"sun": 1.0, "rain": 0.0}
      for day in range(1, 8):
          dist = step(dist)
          print(day, {k: round(v, 3) for k, v in dist.items()})
      print("stationary should be sun 2/3, rain 1/3:", round(2 / 3, 3), round(1 / 3, 3))
    output: |
      1 {'sun': 0.8, 'rain': 0.2}
      2 {'sun': 0.72, 'rain': 0.28}
      3 {'sun': 0.688, 'rain': 0.312}
      4 {'sun': 0.675, 'rain': 0.325}
      5 {'sun': 0.67, 'rain': 0.33}
      6 {'sun': 0.668, 'rain': 0.332}
      7 {'sun': 0.667, 'rain': 0.333}
      stationary should be sun 2/3, rain 1/3: 0.667 0.333
    lines:
      - line: 4
        note: "The probability of tomorrow's state is a weighted sum over today's possible states."
      - line: 10
        note: "Whatever the starting weather, the chain forgets it and approaches the same long-run mix."

playground:
  prompt: |
    Change the sensitivity of the test to 0.99 and its specificity to 0.99. How much does the posterior for a 1% prior change? Which matters more, a better sensitivity or a better specificity?
  code: |
    prior, sens, spec = 0.01, 0.90, 0.95
    p_pos = sens * prior + (1 - spec) * (1 - prior)
    print(round(sens * prior / p_pos, 3))

exercises:
  - id: bayes-rule
    title: Bayes' rule
    difficulty: 2
    prompt: |
      Write `posterior(prior, p_e_given_h, p_e_given_not_h)` returning P(H | E) by Bayes' rule, where `p_e_given_h` is P(E | H) and `p_e_given_not_h` is P(E | not H). Write `odds_after(prior_odds, likelihood_ratio)` returning the posterior odds (prior odds times the likelihood ratio).
    starter: |
      def posterior(prior, p_e_given_h, p_e_given_not_h):
          pass

      def odds_after(prior_odds, likelihood_ratio):
          pass
    tests:
      - name: posterior
        code: |
          assert abs(posterior(0.01, 0.9, 0.05) - 0.15385) < 1e-4
          assert abs(posterior(0.5, 0.9, 0.05) - 0.947368) < 1e-5
          assert abs(posterior(0.3, 0.2, 0.2) - 0.3) < 1e-12
          assert posterior(0.0, 0.9, 0.1) == 0.0
          assert abs(posterior(1.0, 0.9, 0.1) - 1.0) < 1e-12
      - name: odds
        code: |
          assert odds_after(1 / 99, 18) == (1 / 99) * 18
          # same answer as the posterior: odds 18/99 -> probability 18/117
          o = odds_after(1 / 99, 18)
          assert abs(o / (1 + o) - 0.15385) < 1e-4
    hints:
      - "The denominator is `p_e_given_h * prior + p_e_given_not_h * (1 - prior)`."
    solution: |
      def posterior(prior, p_e_given_h, p_e_given_not_h):
          evidence = p_e_given_h * prior + p_e_given_not_h * (1 - prior)
          return p_e_given_h * prior / evidence


      def odds_after(prior_odds, likelihood_ratio):
          return prior_odds * likelihood_ratio
    explanation: "Odds form makes updating multiplicative: each independent piece of evidence multiplies the odds by its likelihood ratio."
  - id: naive-bayes
    title: A naive Bayes classifier
    difficulty: 5
    prompt: |
      Write `train(examples)` where `examples` is a list of `(text, label)` pairs, returning a model (any object you like). Write `predict(model, text)` returning the label with the highest log-score: `log(P(label)) + sum(log((count(word, label) + 1) / (total_words(label) + vocab_size)))` over the words of `text` (split on whitespace). Words outside the training vocabulary must be **ignored** (they add the same to every class). If two labels tie, return the one that comes first alphabetically.
    starter: |
      import math
      from collections import Counter

      def train(examples):
          pass

      def predict(model, text):
          pass
    tests:
      - name: spam
        code: |
          data = [("win cash now", "spam"), ("cheap cash prize now", "spam"), ("win a prize", "spam"),
                  ("meeting at noon", "ham"), ("lunch at noon today", "ham"), ("project meeting today", "ham")]
          m = train(data)
          assert predict(m, "win cash") == "spam"
          assert predict(m, "meeting today") == "ham"
          assert predict(m, "prize") == "spam"
          assert predict(m, "noon") == "ham"
      - name: unknown words and ties
        code: |
          data = [("a b", "x"), ("a b", "y")]
          m = train(data)
          assert predict(m, "zzz qqq") == "x"
          assert predict(m, "") == "x"
          m2 = train([("good great", "pos"), ("good fine", "pos"), ("bad awful", "neg"), ("bad poor", "neg"), ("bad bad", "neg")])
          assert predict(m2, "good") == "pos"
          assert predict(m2, "bad poor awful") == "neg"
          assert predict(m2, "good bad bad") == "neg"
    hints:
      - "Keep a `Counter` of labels and a dict of `Counter`s of words per label. The vocabulary is the set of all words seen."
      - "Pick the best with `max(sorted(labels), key=score)` so ties go to the alphabetically first label."
    solution: |
      import math
      from collections import Counter


      def train(examples):
          labels = Counter(label for _, label in examples)
          words = {l: Counter() for l in labels}
          for text, label in examples:
              words[label].update(text.split())
          vocab = {w for c in words.values() for w in c}
          return {"labels": labels, "words": words, "vocab": vocab, "n": len(examples)}


      def predict(model, text):
          def score(label):
              s = math.log(model["labels"][label] / model["n"])
              total = sum(model["words"][label].values())
              for w in text.split():
                  if w in model["vocab"]:
                      s += math.log((model["words"][label][w] + 1) / (total + len(model["vocab"])))
              return s
          return max(sorted(model["labels"]), key=score)
    explanation: "Training is counting and prediction is adding logs. That simplicity is why naive Bayes was the first practical spam filter."
  - id: coin-posterior
    title: Bayesian updating
    difficulty: 3
    prompt: |
      Write `update(belief, flip)` where `belief` is a list of probabilities for biases `i/10` (`i` from 0 to 10) and `flip` is `"H"` or `"T"`. Return the normalised updated belief. Write `posterior_mean(flips)` that starts from a uniform belief over the 11 biases, applies all `flips` (a string like `"HHT"`) and returns the mean bias.
    starter: |
      def update(belief, flip):
          pass

      def posterior_mean(flips):
          pass
    tests:
      - name: update
        code: |
          b = [1 / 11] * 11
          b2 = update(b, "H")
          assert abs(sum(b2) - 1) < 1e-12
          assert b2[0] == 0 and b2[10] > b2[5] > b2[1]
          b3 = update(b2, "T")
          assert abs(sum(b3) - 1) < 1e-12 and b3[0] == 0 and b3[10] == 0
          assert abs(b3[5] - max(b3)) < 1e-12
      - name: mean
        code: |
          assert abs(posterior_mean("") - 0.5) < 1e-12
          assert abs(posterior_mean("H") - 0.7) < 1e-9
          assert abs(posterior_mean("HT") - 0.5) < 1e-12
          assert posterior_mean("HHHHHHHHHH") > 0.8
          assert posterior_mean("TTTTTTTTTT") < 0.2
    hints:
      - "Likelihood of heads for bias `p` is `p`, for tails `1 - p`. Multiply, then divide by the sum."
    solution: |
      def update(belief, flip):
          new = [b * ((i / 10) if flip == "H" else 1 - i / 10) for i, b in enumerate(belief)]
          total = sum(new)
          return [x / total for x in new]


      def posterior_mean(flips):
          belief = [1 / 11] * 11
          for f in flips:
              belief = update(belief, f)
          return sum(b * i / 10 for i, b in enumerate(belief))
    explanation: "With a uniform prior over 11 biases, one head moves the mean from 0.5 to 0.7. A continuous prior would give Laplace's rule of succession, (heads + 1) / (flips + 2) = 2/3."
  - id: alarm-inference
    title: Inference by enumeration
    difficulty: 4
    prompt: |
      Use the burglary network from the example (`P_B = 0.001`, `P_E = 0.002`, the alarm table, `P_J` and `P_M` are given in the starter). Write `p_burglary(j, m)` returning P(Burglary = True | JohnCalls = j, MaryCalls = m) by summing the joint probability over Earthquake and Alarm. Write `p_alarm_given(b, e)` returning P(Alarm | Burglary = b, Earthquake = e) from the table.
    starter: |
      from itertools import product

      P_B, P_E = 0.001, 0.002
      P_A = {(True, True): 0.95, (True, False): 0.94, (False, True): 0.29, (False, False): 0.001}
      P_J = {True: 0.90, False: 0.05}
      P_M = {True: 0.70, False: 0.01}

      def p_alarm_given(b, e):
          pass

      def p_burglary(j, m):
          pass
    tests:
      - name: table
        code: |
          assert p_alarm_given(True, True) == 0.95
          assert p_alarm_given(False, False) == 0.001
      - name: queries
        code: |
          assert abs(p_burglary(True, True) - 0.2842) < 1e-3
          assert abs(p_burglary(True, False) - 0.0051) < 1e-3
          assert abs(p_burglary(False, True) - 0.0069) < 1e-3
          assert p_burglary(False, False) < 0.0001
          assert p_burglary(True, True) > p_burglary(True, False) > p_burglary(False, False)
    hints:
      - "For each value of Burglary, sum `joint(b, e, a, j, m)` over all four `(e, a)` pairs, then divide by the total over both values of `b`."
    solution: |
      from itertools import product

      P_B, P_E = 0.001, 0.002
      P_A = {(True, True): 0.95, (True, False): 0.94, (False, True): 0.29, (False, False): 0.001}
      P_J = {True: 0.90, False: 0.05}
      P_M = {True: 0.70, False: 0.01}


      def p_alarm_given(b, e):
          return P_A[(b, e)]


      def _joint(b, e, a, j, m):
          p = (P_B if b else 1 - P_B) * (P_E if e else 1 - P_E)
          p *= P_A[(b, e)] if a else 1 - P_A[(b, e)]
          p *= P_J[a] if j else 1 - P_J[a]
          p *= P_M[a] if m else 1 - P_M[a]
          return p


      def p_burglary(j, m):
          weight = {b: sum(_joint(b, e, a, j, m) for e, a in product([True, False], repeat=2)) for b in (True, False)}
          return weight[True] / (weight[True] + weight[False])
    explanation: "Enumeration is exact but exponential in the number of hidden variables. This 5-variable network has only 32 terms."
  - id: markov-chain
    title: Markov chain weather
    difficulty: 3
    prompt: |
      `P` is a dict of dicts of transition probabilities. Write `step(dist, P)` returning the distribution after one step, `after(dist, P, n)` returning it after `n` steps, and `stationary(P, tol=1e-9)` returning the long-run distribution by repeating `step` from a uniform start until no probability changes by more than `tol` (return a dict).
    starter: |
      def step(dist, P):
          pass

      def after(dist, P, n):
          pass

      def stationary(P, tol=1e-9):
          pass
    tests:
      - name: steps
        code: |
          P = {"sun": {"sun": 0.8, "rain": 0.2}, "rain": {"sun": 0.4, "rain": 0.6}}
          d = step({"sun": 1.0, "rain": 0.0}, P)
          assert abs(d["sun"] - 0.8) < 1e-12 and abs(d["rain"] - 0.2) < 1e-12
          d2 = after({"sun": 1.0, "rain": 0.0}, P, 2)
          assert abs(d2["sun"] - 0.72) < 1e-12 and abs(d2["rain"] - 0.28) < 1e-12
          assert after({"sun": 0.3, "rain": 0.7}, P, 0) == {"sun": 0.3, "rain": 0.7}
      - name: stationary
        code: |
          P = {"sun": {"sun": 0.8, "rain": 0.2}, "rain": {"sun": 0.4, "rain": 0.6}}
          s = stationary(P)
          assert abs(s["sun"] - 2 / 3) < 1e-6 and abs(s["rain"] - 1 / 3) < 1e-6
          Q = {"a": {"a": 0.5, "b": 0.5, "c": 0.0}, "b": {"a": 0.25, "b": 0.5, "c": 0.25}, "c": {"a": 0.0, "b": 0.5, "c": 0.5}}
          t = stationary(Q)
          assert abs(t["a"] - 0.25) < 1e-6 and abs(t["b"] - 0.5) < 1e-6 and abs(t["c"] - 0.25) < 1e-6
    hints:
      - "`new[s2] = sum(dist[s1] * P[s1][s2] for s1 in P)`."
    solution: |
      def step(dist, P):
          return {s2: sum(dist[s1] * P[s1][s2] for s1 in P) for s2 in P}


      def after(dist, P, n):
          for _ in range(n):
              dist = step(dist, P)
          return dist


      def stationary(P, tol=1e-9):
          dist = {s: 1 / len(P) for s in P}
          while True:
              new = step(dist, P)
              if max(abs(new[s] - dist[s]) for s in P) < tol:
                  return new
              dist = new
    explanation: "Google's original PageRank is the stationary distribution of a random surfer on the web graph."

commonMistakes:
  - title: "Confusing P(A | B) with P(B | A)"
    explanation: "A positive test given illness is not the same as illness given a positive test. Bayes' rule converts between them."
  - title: "Ignoring the base rate"
    explanation: "A rare condition with a imperfect test produces mostly false alarms."
  - title: "Probability zero from unseen words"
    explanation: "Smooth counts (add one) so a single missing word cannot zero the whole product."
  - title: "Multiplying many probabilities directly"
    explanation: "Numbers underflow. Add logs instead."
  - title: "Assuming independence without checking"
    explanation: "Naive Bayes can work despite wrong independence, but you should know it is an assumption."

summary:
  - "Probability lets an agent hold and update beliefs under uncertainty; Bayes' rule turns likelihoods and priors into posteriors."
  - "The base-rate fallacy: with rare events, even accurate tests give many false positives."
  - "Naive Bayes classifies by counting words and adding smoothed log-probabilities."
  - "Beliefs are updated by multiplying by the likelihood and renormalising; Bayesian networks factor a joint distribution and are queried by inference."
  - "Markov chains model state changes with the Markov property and often settle to a stationary distribution."
