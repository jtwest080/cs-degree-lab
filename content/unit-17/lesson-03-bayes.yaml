  - type: code
    question: |
      Write `p_total(p_a_given_b, p_b, p_a_given_not_b)` returning P(A) by the law of total probability (B and not B partition the space).
    starter: |
      def p_total(p_a_given_b, p_b, p_a_given_not_b):
          pass
    tests:
      - name: total
        code: |
          assert abs(p_total(0.9, 0.01, 0.05) - 0.0585) < 1e-12
          assert p_total(1.0, 0.5, 0.0) == 0.5
    solution: |
      def p_total(p_a_given_b, p_b, p_a_given_not_b):
          return p_a_given_b * p_b + p_a_given_not_b * (1 - p_b)
