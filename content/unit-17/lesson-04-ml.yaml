  - type: code
    question: |
      Write `accuracy(y_true, y_pred)` returning the fraction of positions where the two lists agree (return `0.0` for empty lists).
    starter: |
      def accuracy(y_true, y_pred):
          pass
    tests:
      - name: accuracy
        code: |
          assert accuracy([1, 0, 1, 1], [1, 0, 0, 1]) == 0.75
          assert accuracy([], []) == 0.0
          assert accuracy(["a"], ["a"]) == 1.0
    solution: |
      def accuracy(y_true, y_pred):
          if not y_true:
              return 0.0
          return sum(a == b for a, b in zip(y_true, y_pred)) / len(y_true)
