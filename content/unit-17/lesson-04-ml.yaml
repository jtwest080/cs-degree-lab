id: u17-ml
title: "Machine Learning Basics: Data, Models and Evaluation"
minutes: 60
objective: |
  Learn the core vocabulary and workflow of machine learning. You will see how learning from examples differs from writing rules, build a k-nearest-neighbours classifier from scratch, split data honestly, measure a model with accuracy, precision, recall and F1, understand overfitting, and use cross-validation and feature scaling correctly.
outcomes:
  - Distinguish supervised, unsupervised and reinforcement learning, and regression from classification
  - Implement k-nearest neighbours and choose k
  - Split data into training, validation and test sets and explain why
  - Compute a confusion matrix, accuracy, precision, recall and F1, and explain why accuracy can mislead
  - Recognise overfitting and data leakage, and apply cross-validation and feature scaling

sections:
  - heading: Learning from examples
    body: |
      Traditional programming turns **rules + data** into **answers**. **Machine learning (ML)** flips this: it takes **data + answers** and produces the **rules** (a **model**) that can then be applied to new data. It is the right tool when the rules are too complicated to write by hand (recognising a face, translating a sentence) but plenty of examples exist. Arthur Samuel defined it in 1959 as giving computers "the ability to learn without being explicitly programmed", and Tom Mitchell's version is: a program learns from experience E for a task T if its performance P on T improves with E.

      The vocabulary: each example is a row with **features** (the inputs, such as height and weight) and, in **supervised learning**, a **label** or **target** (the answer we want to predict). **Classification** predicts a category (spam or ham, digit 0-9). **Regression** predicts a number (a house price). In **unsupervised learning** there are no labels and we look for structure, for example grouping similar customers (**clustering**, Lesson 17.8). In **reinforcement learning** an agent learns by trial and error from rewards (also Lesson 17.8). Training adjusts the model's **parameters**; settings we choose beforehand, such as k in k-nearest neighbours, are **hyperparameters**.

  - heading: k-nearest neighbours
    body: |
      The simplest classifier stores all the training examples and, for a new point, finds the **k closest training points** and takes a **majority vote** of their labels. This is **k-nearest neighbours (k-NN)**. "Closest" needs a **distance**; the usual choice is the **Euclidean distance** sqrt(sum of squared differences of the features). The method is **non-parametric** (no formula is learned), "training" is just memorising, and prediction costs a pass over all stored examples. A very small k (k = 1) follows every quirk of the data, including mistakes; a very large k blurs the boundaries and drifts toward always predicting the commonest class. An odd k avoids ties in two-class problems.

      k-NN depends entirely on the distance, so **feature scales** matter. If one feature is in the thousands (income) and another between 0 and 1 (a ratio), the large one drowns out the small one. The standard cure is **standardisation**: replace each value x with (x - mean) / standard deviation, giving every feature mean 0 and spread 1. The mean and standard deviation must be computed on the **training data only** and then applied unchanged to the test data.

  - heading: Evaluating honestly
    body: |
      A model that memorises the training data scores perfectly on it, which tells us nothing. What we want is **generalisation**: good performance on **new** data. So we hold some data back. Split into a **training set** (to fit the model), a **validation set** (to choose hyperparameters and compare models) and a **test set**, touched once at the very end for an unbiased estimate. A typical split is 60/20/20 or 80/20 after shuffling. When data is scarce, **k-fold cross-validation** splits it into k parts, trains on k-1 and tests on the remaining one, rotates, and averages the k scores.

      **Overfitting** means fitting noise: training accuracy is high but test accuracy is much lower; the model is too flexible for the amount of data. **Underfitting** is the opposite: too simple to capture the pattern, poor on both sets. This is the **bias-variance trade-off**: simple models have high bias and low variance, complex ones the reverse, and the best model balances them. Remedies for overfitting include more data, simpler models, **regularisation** (Lesson 17.5) and early stopping. **Data leakage** is a subtle cheat: any information from the test set seeping into training (scaling with statistics from all the data, duplicates in both sets, a feature that secretly encodes the label) gives optimistic scores that vanish in production.

  - heading: Metrics beyond accuracy
    body: |
      **Accuracy**, the fraction of correct predictions, can be badly misleading. If only 1 in 100 transactions is fraudulent, a "model" that always says "not fraud" is 99% accurate and completely useless. For a two-class problem we count a **confusion matrix**: **true positives (TP)**, **false positives (FP)**, **true negatives (TN)** and **false negatives (FN)**. **Precision** = TP / (TP + FP): of the cases we flagged, how many were real? **Recall** (sensitivity) = TP / (TP + FN): of the real cases, how many did we find? Precision and recall pull against each other (flag everything and recall is perfect while precision collapses), and the **F1 score**, their harmonic mean 2PR/(P+R), summarises them in one number. Which matters more depends on the cost of each error: a cancer screen wants high recall, a spam filter that hides real mail wants high precision. The same arithmetic as the base-rate effect of Lesson 17.3 applies.

      A good **baseline** guards against self-deception: compare any model with a trivial one (always predict the most common class, or the average). And always **look at the data** first: plot it, check for missing values and mislabelled rows, and ask whether the training data represents the situation where the model will be used, a theme that returns when we discuss bias and fairness (Lesson 17.9).

examples:
  - title: k-nearest neighbours by hand
    intro: "Two clusters of points. Classify a new point by voting among its nearest neighbours."
    code: |
      import math
      from collections import Counter

      train = [((1.0, 1.0), "red"), ((1.5, 2.0), "red"), ((2.0, 1.0), "red"), ((1.0, 2.5), "red"),
               ((5.0, 5.0), "blue"), ((5.5, 4.0), "blue"), ((6.0, 5.5), "blue"), ((4.5, 6.0), "blue")]

      def dist(a, b):
          return math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b)))

      def knn(point, k=3):
          nearest = sorted(train, key=lambda t: dist(point, t[0]))[:k]
          votes = Counter(label for _, label in nearest)
          return votes.most_common(1)[0][0], [round(dist(point, p), 2) for p, _ in nearest]

      for p in [(1.2, 1.5), (5.2, 5.0), (3.2, 3.2)]:
          print(p, knn(p))
    output: |
      (1.2, 1.5) ('red', [0.54, 0.58, 0.94])
      (5.2, 5.0) ('blue', [0.2, 0.94, 1.04])
      (3.2, 3.2) ('red', [2.08, 2.31, 2.44])
    lines:
      - line: 7
        note: "Euclidean distance: the straight-line distance in feature space."
      - line: 10
        note: "Sort every training point by distance and keep the closest k."
      - line: 11
        note: "The majority label wins. The midpoint (3.2, 3.2) is genuinely ambiguous."
  - title: Overfitting with k = 1
    intro: "Noisy data from two overlapping groups. k = 1 memorises the noise, so it is perfect on training data but worse on new data."
    code: |
      import random, math
      from collections import Counter

      def make(n, seed):
          rng = random.Random(seed)
          data = []
          for _ in range(n):
              label = rng.choice([0, 1])
              centre = 0.0 if label == 0 else 1.5
              data.append(((rng.gauss(centre, 1.0), rng.gauss(centre, 1.0)), label))
          return data

      train, test = make(120, 1), make(400, 2)

      def knn_predict(train, x, k):
          near = sorted(train, key=lambda t: math.dist(x, t[0]))[:k]
          return Counter(l for _, l in near).most_common(1)[0][0]

      def accuracy(train, data, k):
          return sum(knn_predict(train, x, k) == y for x, y in data) / len(data)

      for k in (1, 5, 15, 41):
          print(f"k={k:<4} train acc {accuracy(train, train, k):.2f}   test acc {accuracy(train, test, k):.2f}")
    output: |
      k=1    train acc 1.00   test acc 0.80
      k=5    train acc 0.89   test acc 0.83
      k=15   train acc 0.88   test acc 0.83
      k=41   train acc 0.88   test acc 0.83
    lines:
      - line: 12
        note: "Different seeds make independent training and test sets drawn from the same distribution."
      - line: 25
        note: "With k = 1 each training point is its own nearest neighbour, so training accuracy is 1.00 but test accuracy is the lowest. A moderate k smooths out the noise and does better on new data."
  - title: Accuracy can lie
    intro: "99 non-fraud and 1 fraud transaction. A model that never raises an alarm looks great by accuracy."
    code: |
      y_true = [0] * 99 + [1]
      never = [0] * 100
      careful = [0] * 97 + [1, 1, 1]          # flags the real fraud and two innocent ones
      lazy_fraud = [1] * 100                  # flags everything

      def report(name, y, p):
          tp = sum(a == 1 and b == 1 for a, b in zip(y, p))
          fp = sum(a == 0 and b == 1 for a, b in zip(y, p))
          fn = sum(a == 1 and b == 0 for a, b in zip(y, p))
          tn = sum(a == 0 and b == 0 for a, b in zip(y, p))
          acc = (tp + tn) / len(y)
          prec = tp / (tp + fp) if tp + fp else 0.0
          rec = tp / (tp + fn) if tp + fn else 0.0
          f1 = 2 * prec * rec / (prec + rec) if prec + rec else 0.0
          print(f"{name:12} TP={tp} FP={fp} FN={fn} TN={tn}  acc={acc:.2f} precision={prec:.2f} recall={rec:.2f} F1={f1:.2f}")

      report("never alarm", y_true, never)
      report("careful", y_true, careful)
      report("flag all", y_true, lazy_fraud)
    output: |
      never alarm  TP=0 FP=0 FN=1 TN=99  acc=0.99 precision=0.00 recall=0.00 F1=0.00
      careful      TP=1 FP=2 FN=0 TN=97  acc=0.98 precision=0.33 recall=1.00 F1=0.50
      flag all     TP=1 FP=99 FN=0 TN=0  acc=0.01 precision=0.01 recall=1.00 F1=0.02
    lines:
      - line: 21
        note: "99% accurate, yet recall is 0: it misses every fraud."
      - line: 23
        note: "Flagging everything gets perfect recall but terrible precision. F1 balances the two."
  - title: Scaling matters, and use training statistics only
    intro: "Salary in dollars swamps age in years until both are standardised."
    code: |
      import math

      train = [(25, 30000), (30, 32000), (45, 90000), (50, 95000)]
      new = (28, 94000)

      def dist(a, b):
          return math.dist(a, b)

      raw = sorted(train, key=lambda p: dist(p, new))
      print("raw nearest:", raw[0])

      cols = list(zip(*train))
      mean = [sum(c) / len(c) for c in cols]
      std = [math.sqrt(sum((v - m) ** 2 for v in c) / len(c)) for c, m in zip(cols, mean)]

      def scale(p):
          return tuple((v - m) / s for v, m, s in zip(p, mean, std))

      scaled = sorted(train, key=lambda p: dist(scale(p), scale(new)))
      print("scaled nearest:", scaled[0])
      print("means from the TRAINING set:", mean)
    output: |
      raw nearest: (50, 95000)
      scaled nearest: (45, 90000)
      means from the TRAINING set: [37.5, 61750.0]
    lines:
      - line: 10
        note: "In raw units the 94000 salary dominates, so the 28-year-old looks closest to the 50-year-old."
      - line: 13
        note: "Statistics come from the training rows only. The new point is transformed with them but never used to compute them."
  - title: k-fold cross-validation
    intro: "Rotate which fold is held out, and average the scores for a more stable estimate than a single split."
    code: |
      import random, math
      from collections import Counter

      def make(n, seed):
          rng = random.Random(seed)
          out = []
          for _ in range(n):
              label = rng.choice([0, 1])
              c = 2.0 * label
              out.append(((rng.gauss(c, 1), rng.gauss(c, 1)), label))
          return out

      data = make(100, 5)

      def knn(train, x, k):
          near = sorted(train, key=lambda t: math.dist(x, t[0]))[:k]
          return Counter(l for _, l in near).most_common(1)[0][0]

      def cross_val(data, k_neighbours, folds=5):
          scores = []
          for f in range(folds):
              test = data[f::folds]
              train = [d for i, d in enumerate(data) if i % folds != f]
              scores.append(sum(knn(train, x, k_neighbours) == y for x, y in test) / len(test))
          return sum(scores) / folds, scores

      for k in (1, 3, 9, 25):
          mean, scores = cross_val(data, k)
          print(k, round(mean, 3), [round(s, 2) for s in scores])
    output: |
      1 0.88 [0.85, 0.9, 0.95, 0.75, 0.95]
      3 0.92 [0.85, 0.95, 0.95, 0.85, 1.0]
      9 0.91 [0.85, 0.95, 0.95, 0.85, 0.95]
      25 0.93 [0.9, 0.95, 0.95, 0.85, 1.0]
    lines:
      - line: 21
        note: "Every example is used for testing exactly once and never in the same round as its own training."
      - line: 27
        note: "The fold scores vary, which shows how much a single split can mislead. Pick k with the best mean."

