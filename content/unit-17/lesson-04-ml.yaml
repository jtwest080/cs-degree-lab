exercises:
  - id: knn-predict
    title: Write k-NN
    difficulty: 3
    prompt: |
      Write `distance(a, b)` (Euclidean) and `knn_predict(train, point, k)` where `train` is a list of `(features, label)` pairs. Return the majority label among the k nearest. If votes tie, return the label of the **nearest** neighbour among the tied labels.
    starter: |
      import math

      def distance(a, b):
          pass

      def knn_predict(train, point, k):
          pass
    tests:
      - name: distance
        code: |
          assert distance((0, 0), (3, 4)) == 5
          assert distance((1,), (4,)) == 3
          assert abs(distance((1, 2, 3), (2, 4, 5)) - 3.0) < 1e-12
      - name: voting
        code: |
          train = [((1, 1), "r"), ((1, 2), "r"), ((2, 1), "r"), ((6, 6), "b"), ((6, 7), "b"), ((7, 6), "b")]
          assert knn_predict(train, (1.5, 1.5), 3) == "r"
          assert knn_predict(train, (6.5, 6.5), 3) == "b"
          assert knn_predict(train, (3, 3), 1) == "r"
          assert knn_predict(train, (5, 5), 1) == "b"
          # tie broken by the nearest neighbour
          tie = [((0,), "a"), ((10,), "b")]
          assert knn_predict(tie, (3,), 2) == "a"
          assert knn_predict(tie, (7,), 2) == "b"
          assert knn_predict(train, (0, 0), 6) in ("r", "b")
    hints:
      - "Sort `train` by distance and slice `[:k]`. Count labels with a dict, and walk the sorted neighbours to find the first label that has the top count."
    solution: |
      import math


      def distance(a, b):
          return math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b)))


      def knn_predict(train, point, k):
          nearest = sorted(train, key=lambda t: distance(point, t[0]))[:k]
          counts = {}
          for _, label in nearest:
              counts[label] = counts.get(label, 0) + 1
          top = max(counts.values())
          for _, label in nearest:
              if counts[label] == top:
                  return label
    explanation: "The nearest-first order of the neighbours gives a natural tie-break."
  - id: split-data
    title: Train and test split
    difficulty: 3
    prompt: |
      Write `train_test_split(data, test_fraction, seed)` returning `(train, test)`. Shuffle a **copy** of `data` with `random.Random(seed)`, put the last `round(len(data) * test_fraction)` items in `test` and the rest in `train`. The original list must not change. The same seed must give the same split.
    starter: |
      import random

      def train_test_split(data, test_fraction, seed):
          pass
    tests:
      - name: split
        code: |
          d = list(range(20))
          train, test = train_test_split(d, 0.25, 7)
          assert len(test) == 5 and len(train) == 15
          assert sorted(train + test) == list(range(20))
          assert d == list(range(20))
          assert train_test_split(d, 0.25, 7) == (train, test)
          assert train_test_split(d, 0.25, 8) != (train, test)
          t2, s2 = train_test_split(d, 0.0, 1)
          assert len(t2) == 20 and s2 == []
          assert train_test_split([], 0.5, 1) == ([], [])
    hints:
      - "`items = list(data); random.Random(seed).shuffle(items)`, then slice at `len(items) - n_test`."
    solution: |
      import random


      def train_test_split(data, test_fraction, seed):
          items = list(data)
          random.Random(seed).shuffle(items)
          n_test = round(len(items) * test_fraction)
          cut = len(items) - n_test
          return items[:cut], items[cut:]
    explanation: "Always shuffle before splitting (data is often sorted by time or class) and fix the seed so experiments are repeatable."
  - id: metrics
    title: Confusion matrix and F1
    difficulty: 3
    prompt: |
      Write `confusion(y_true, y_pred)` returning a dict `{"tp":..., "fp":..., "fn":..., "tn":...}` for labels 0 and 1 (1 is positive). Write `precision(y_true, y_pred)`, `recall(y_true, y_pred)` and `f1(y_true, y_pred)`; if a denominator is zero return `0.0`.
    starter: |
      def confusion(y_true, y_pred):
          pass

      def precision(y_true, y_pred):
          pass

      def recall(y_true, y_pred):
          pass

      def f1(y_true, y_pred):
          pass
    tests:
      - name: counts
        code: |
          yt = [1, 1, 1, 0, 0, 0, 0, 1]
          yp = [1, 0, 1, 0, 1, 0, 0, 1]
          assert confusion(yt, yp) == {"tp": 3, "fp": 1, "fn": 1, "tn": 3}
      - name: scores
        code: |
          yt = [1, 1, 1, 0, 0, 0, 0, 1]
          yp = [1, 0, 1, 0, 1, 0, 0, 1]
          assert precision(yt, yp) == 0.75 and recall(yt, yp) == 0.75 and f1(yt, yp) == 0.75
          assert recall([1, 1, 0], [0, 0, 0]) == 0.0 and precision([1, 1, 0], [0, 0, 0]) == 0.0
          assert f1([1, 1, 0], [0, 0, 0]) == 0.0
          assert recall([1, 0], [1, 1]) == 1.0 and precision([1, 0], [1, 1]) == 0.5
          assert abs(f1([1, 0], [1, 1]) - 2 / 3) < 1e-12
    hints:
      - "Loop over `zip(y_true, y_pred)` once and count the four cases."
    solution: |
      def confusion(y_true, y_pred):
          c = {"tp": 0, "fp": 0, "fn": 0, "tn": 0}
          for t, p in zip(y_true, y_pred):
              if t == 1 and p == 1:
                  c["tp"] += 1
              elif t == 0 and p == 1:
                  c["fp"] += 1
              elif t == 1 and p == 0:
                  c["fn"] += 1
              else:
                  c["tn"] += 1
          return c


      def precision(y_true, y_pred):
          c = confusion(y_true, y_pred)
          return c["tp"] / (c["tp"] + c["fp"]) if c["tp"] + c["fp"] else 0.0


      def recall(y_true, y_pred):
          c = confusion(y_true, y_pred)
          return c["tp"] / (c["tp"] + c["fn"]) if c["tp"] + c["fn"] else 0.0


      def f1(y_true, y_pred):
          p, r = precision(y_true, y_pred), recall(y_true, y_pred)
          return 2 * p * r / (p + r) if p + r else 0.0
    explanation: "Choosing which error to avoid is a human decision about costs; the metrics just make the trade-off visible."
  - id: standardise
    title: Standardise features without leaking
    difficulty: 4
    prompt: |
      Write `fit_scaler(rows)` returning `(means, stds)`, the per-column mean and the **population** standard deviation of a list of equal-length numeric rows; use `1.0` for a standard deviation of 0 to avoid dividing by zero. Write `transform(rows, scaler)` returning new rows with `(value - mean) / std` for each column.
    starter: |
      import math

      def fit_scaler(rows):
          pass

      def transform(rows, scaler):
          pass
    tests:
      - name: fit
        code: |
          means, stds = fit_scaler([(1, 10), (3, 10), (5, 10)])
          assert means == [3.0, 10.0]
          assert abs(stds[0] - math.sqrt(8 / 3)) < 1e-12 and stds[1] == 1.0
      - name: transform
        code: |
          sc = fit_scaler([(0, 100), (10, 200)])
          assert transform([(0, 100), (10, 200)], sc) == [[-1.0, -1.0], [1.0, 1.0]]
          # new data is scaled with the TRAINING statistics
          assert transform([(5, 150), (20, 100)], sc) == [[0.0, 0.0], [3.0, -1.0]]
    hints:
      - "Use `zip(*rows)` to get columns. Population std divides by `n`."
    solution: |
      import math


      def fit_scaler(rows):
          cols = list(zip(*rows))
          means = [sum(c) / len(c) for c in cols]
          stds = []
          for c, m in zip(cols, means):
              s = math.sqrt(sum((v - m) ** 2 for v in c) / len(c))
              stds.append(s if s > 0 else 1.0)
          return means, stds


      def transform(rows, scaler):
          means, stds = scaler
          return [[(v - m) / s for v, m, s in zip(row, means, stds)] for row in rows]
    explanation: "Fit on training data, transform everything. Fitting on the test set would leak information about it into the model."
  - id: cross-val
    title: Cross-validation folds
    difficulty: 4
    prompt: |
      Write `kfold(n, folds)` returning a list of `(train_indices, test_indices)` pairs for `n` items. Fold `f` tests on indices `f, f + folds, f + 2*folds, ...` and trains on the rest (both lists in increasing order). Then write `cross_val_score(data, folds, fit_predict)` where `data` is a list of `(x, y)` and `fit_predict(train, xs)` returns predictions for the list `xs`; return the mean accuracy over the folds.
    starter: |
      def kfold(n, folds):
          pass

      def cross_val_score(data, folds, fit_predict):
          pass
    tests:
      - name: folds
        code: |
          f = kfold(7, 3)
          assert f[0] == ([1, 2, 4, 5], [0, 3, 6])
          assert f[1] == ([0, 2, 3, 5, 6], [1, 4])
          assert f[2] == ([0, 1, 3, 4, 6], [2, 5])
          for tr, te in kfold(20, 5):
              assert sorted(tr + te) == list(range(20)) and not set(tr) & set(te)
      - name: score
        code: |
          data = [(i, i % 2) for i in range(12)]
          perfect = lambda train, xs: [x % 2 for x in xs]
          always0 = lambda train, xs: [0 for _ in xs]
          assert cross_val_score(data, 4, perfect) == 1.0
          assert cross_val_score(data, 4, always0) == 0.5
          seen = []
          def spy(train, xs):
              seen.append((len(train), len(xs)))
              return [0] * len(xs)
          cross_val_score(data, 3, spy)
          assert seen == [(8, 4), (8, 4), (8, 4)]
    hints:
      - "A test index is `i % folds == f`. For accuracy, compare each prediction with the true label."
    solution: |
      def kfold(n, folds):
          out = []
          for f in range(folds):
              test = [i for i in range(n) if i % folds == f]
              train = [i for i in range(n) if i % folds != f]
              out.append((train, test))
          return out


      def cross_val_score(data, folds, fit_predict):
          scores = []
          for train_idx, test_idx in kfold(len(data), folds):
              train = [data[i] for i in train_idx]
              xs = [data[i][0] for i in test_idx]
              ys = [data[i][1] for i in test_idx]
              preds = fit_predict(train, xs)
              scores.append(sum(p == y for p, y in zip(preds, ys)) / len(ys))
          return sum(scores) / len(scores)
    explanation: "The function fit_predict is passed in, so the same evaluation code works for any model."

commonMistakes:
  - title: "Judging a model on its training data"
    explanation: "A model can memorise. Always evaluate on held-out data."
  - title: "Using accuracy alone on imbalanced classes"
    explanation: "Check precision, recall and a trivial baseline."
  - title: "Scaling with statistics from the whole data set"
    explanation: "Fit the scaler on training data only, or test information leaks into training."
  - title: "Tuning hyperparameters on the test set"
    explanation: "Use a validation set or cross-validation, and touch the test set once."
  - title: "Not shuffling before splitting"
    explanation: "Sorted data gives a test set that is not representative."

summary:
  - "ML learns rules from data; supervised learning uses labelled examples for classification and regression."
  - "k-NN predicts by voting among the nearest training points; scale features first and choose k by validation."
  - "Split into train, validation and test sets, or cross-validate; the test set is used once."
  - "Overfitting means great on training and poor on new data; underfitting means poor on both."
  - "Use precision, recall and F1 with a baseline, because accuracy can hide a useless model."
