id: u17-regression
title: "Regression and Gradient Descent"
minutes: 60
objective: |
  Learn the idea behind almost every modern learning algorithm: define a loss that measures how wrong a model is, then adjust its parameters downhill. You will fit a line with the closed-form least-squares solution and with gradient descent, handle several features, tune the learning rate, measure fit with R-squared, and see how regularisation tames overfitting.
outcomes:
  - Fit a straight line to data by least squares and by gradient descent
  - Compute mean squared error and R-squared
  - Explain what a gradient is and how the learning rate affects convergence
  - Extend linear regression to several features with a weight vector and bias
  - Describe regularisation and why it reduces overfitting

sections:
  - heading: Fitting a line
    body: |
      **Regression** predicts a number. The simplest model is a straight line, **linear regression**: ŷ = w·x + b, where *w* is the **slope** (weight) and *b* the **intercept** (bias), and ŷ ("y-hat") is the prediction. Given examples (x1, y1), ..., (xn, yn) which line is best? We need a **loss function** that scores how wrong a line is. The standard choice is the **mean squared error (MSE)**: the average of (ŷi - yi)². Squaring makes errors positive, punishes big mistakes more than small ones, and gives a smooth bowl-shaped function of w and b with one bottom. Fitting the model means choosing the parameters that **minimise the loss**: the **method of least squares** (Legendre and Gauss, around 1800).

      For one feature the minimum has a **closed-form** answer. With means x̄ and ȳ: **w = Σ(xi - x̄)(yi - ȳ) / Σ(xi - x̄)²** and **b = ȳ - w·x̄**. The numerator is the **covariance** of x and y, the denominator the variance of x. For many features there is also a matrix formula, the **normal equation**, but it costs a lot for big data, so we usually use a numerical method instead.

  - heading: Gradient descent
    body: |
      **Gradient descent** minimises any smooth loss by walking downhill. Imagine standing on a hilly landscape in fog: you feel which way the ground slopes and take a step downhill, then repeat. The **gradient** is the vector of **partial derivatives** (Unit 6 and calculus): it points in the direction of steepest increase, so we move the opposite way: **parameter ← parameter - η × gradient**, where **η** (eta) is the **learning rate**, the step size.

      For one feature with MSE loss L = (1/n) Σ (w xi + b - yi)², the gradients are **∂L/∂w = (2/n) Σ (ŷi - yi) xi** and **∂L/∂b = (2/n) Σ (ŷi - yi)**. Starting from w = b = 0 and repeating the update, the loss shrinks toward its minimum. The learning rate is a hyperparameter that needs care: **too small** and learning is painfully slow; **too large** and each step overshoots, the loss bounces around or **diverges** to infinity; a good value converges smoothly. Features on very different scales make the loss landscape a long narrow valley where gradient descent zig-zags, which is one more reason to **standardise** features (Lesson 17.4). On big data we use **stochastic gradient descent (SGD)**: update from one example (or a small **mini-batch**) at a time, noisy but much cheaper per step, and the engine of neural-network training (Lesson 17.7). In general, one number tells you if gradient descent has converged: the loss stops decreasing. On a **convex** loss like MSE there is a single minimum, so the method always finds it; neural-network losses are not convex but descent still works well in practice.

  - heading: Several features and judging fit
    body: |
      With **d features** the model is ŷ = w1 x1 + w2 x2 + ... + wd xd + b, written as a **dot product** of the weight vector with the feature vector plus a bias. Everything extends naturally: the gradient for weight wj is (2/n) Σ (ŷi - yi) xij, and the bias is updated like a weight whose feature is always 1. Linear models can capture curves too if we supply **nonlinear features**: add x², x³ (**polynomial regression**) or products of features, and the model is still linear in its parameters.

      To judge a fit, the loss on test data (the **test MSE**) is the honest number. The **coefficient of determination R²** = 1 - (sum of squared residuals) / (total sum of squares about the mean) tells what fraction of the variation in y the model explains: 1 is perfect, 0 is no better than always predicting the mean, and it can be negative on new data for a bad model. Always plot the **residuals** (errors): a pattern means the model is missing something. Beware that a correlation is not causation, and that a line fitted to a narrow range should not be **extrapolated** far outside it.

  - heading: Regularisation and overfitting
    body: |
      A flexible model (for example a degree-9 polynomial through 10 points) can pass exactly through every training point and swing wildly between them: overfitting (Lesson 17.4). **Regularisation** discourages complexity by adding a **penalty** on the size of the weights to the loss. **Ridge regression (L2)** adds λ Σ wj², which shrinks weights toward zero; for one centred feature the solution is simply w = Σ xi yi / (Σ xi² + λ), so a bigger λ gives a smaller slope. **Lasso (L1)** adds λ Σ |wj|, which drives some weights exactly to zero and so selects features. The strength λ is a hyperparameter chosen with a validation set or cross-validation. Regularisation reflects a belief that simpler explanations are more likely right, a form of **Occam's razor**, and is also a Bayesian prior on the weights (Lesson 17.3). Stopping gradient descent early has a similar effect.

      Regression extends in directions you will meet soon: **logistic regression** (Lesson 17.6) turns the output into a probability to classify, and a **neural network** (Lesson 17.7) stacks many such units with nonlinear functions between them.

examples:
  - title: Least squares in closed form
    intro: "Fit a line to noisy points that follow roughly y = 2x + 1 and compare the loss with a guess."
    code: |
      xs = [0, 1, 2, 3, 4, 5, 6, 7]
      ys = [1.2, 2.9, 5.1, 7.2, 8.8, 11.1, 13.0, 15.2]

      def fit_line(xs, ys):
          n = len(xs)
          mx, my = sum(xs) / n, sum(ys) / n
          w = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sum((x - mx) ** 2 for x in xs)
          return w, my - w * mx

      def mse(w, b, xs, ys):
          return sum((w * x + b - y) ** 2 for x, y in zip(xs, ys)) / len(xs)

      w, b = fit_line(xs, ys)
      print(f"w = {w:.3f}, b = {b:.3f}")
      print("MSE of fitted line :", round(mse(w, b, xs, ys), 4))
      print("MSE of guess y=3x  :", round(mse(3, 0, xs, ys), 4))
      print("prediction at x=10 :", round(w * 10 + b, 2))
    output: |
      w = 2.001, b = 1.058
      MSE of fitted line : 0.0198
      MSE of guess y=3x  : 11.1988
      prediction at x=10 : 21.07
    lines:
      - line: 7
        note: "Slope = covariance of x and y divided by the variance of x."
      - line: 8
        note: "The best line always passes through the point of means."
  - title: Gradient descent on the same data
    intro: "Start from w = b = 0 and repeatedly step against the gradient. The loss falls and the parameters approach the closed-form answer."
    code: |
      xs = [0, 1, 2, 3, 4, 5, 6, 7]
      ys = [1.2, 2.9, 5.1, 7.2, 8.8, 11.1, 13.0, 15.2]

      def gradient_descent(xs, ys, lr, steps):
          w = b = 0.0
          n = len(xs)
          for step in range(steps + 1):
              errs = [w * x + b - y for x, y in zip(xs, ys)]
              loss = sum(e * e for e in errs) / n
              if step in (0, 1, 10, 100, 1000, steps):
                  print(f"step {step:5}  loss {loss:9.4f}  w {w:7.4f}  b {b:7.4f}")
              gw = 2 * sum(e * x for e, x in zip(errs, xs)) / n
              gb = 2 * sum(errs) / n
              w -= lr * gw
              b -= lr * gb
          return w, b

      gradient_descent(xs, ys, lr=0.02, steps=5000)
    output: |
      step     0  loss   86.0487  w  0.0000  b  0.0000
      step     1  loss    6.4688  w  1.5490  b  0.3225
      step    10  loss    0.1130  w  2.1145  b  0.5013
      step   100  loss    0.0314  w  2.0411  b  0.8622
      step  1000  loss    0.0198  w  2.0012  b  1.0583
      step  5000  loss    0.0198  w  2.0012  b  1.0583
    lines:
      - line: 12
        note: "The gradient of the mean squared error with respect to the slope."
      - line: 15
        note: "Subtract the gradient times the learning rate: a step downhill."
  - title: Choosing the learning rate
    intro: "Same problem, three learning rates. Too small is slow, too large explodes."
    code: |
      xs = [0, 1, 2, 3, 4, 5, 6, 7]
      ys = [1.2, 2.9, 5.1, 7.2, 8.8, 11.1, 13.0, 15.2]

      def final_loss(lr, steps=60):
          w = b = 0.0
          n = len(xs)
          for _ in range(steps):
              errs = [w * x + b - y for x, y in zip(xs, ys)]
              w -= lr * 2 * sum(e * x for e, x in zip(errs, xs)) / n
              b -= lr * 2 * sum(errs) / n
          return sum((w * x + b - y) ** 2 for x, y in zip(xs, ys)) / n

      for lr in (0.0005, 0.02, 0.06, 0.1):
          loss = final_loss(lr)
          print(f"lr={lr:<7} loss after 60 steps: {loss:.4g}")
    output: |
      lr=0.0005  loss after 60 steps: 9.6
      lr=0.02    loss after 60 steps: 0.04904
      lr=0.06    loss after 60 steps: 6.283e+10
      lr=0.1     loss after 60 steps: 3.739e+52
    lines:
      - line: 15
        note: "0.0005 has barely moved, 0.02 is converging well, and above roughly 0.05 for this data every step overshoots more than the last, so the loss explodes."
  - title: Several features
    intro: "Predict a score from hours studied and hours slept using a weight vector, standardised features and a bias."
    code: |
      import math

      rows = [(2, 6, 52), (4, 7, 65), (5, 5, 62), (6, 8, 78), (8, 6, 80), (9, 7, 90), (3, 8, 63), (7, 5, 72)]
      X = [r[:2] for r in rows]
      y = [r[2] for r in rows]

      cols = list(zip(*X))
      mean = [sum(c) / len(c) for c in cols]
      std = [math.sqrt(sum((v - m) ** 2 for v in c) / len(c)) for c, m in zip(cols, mean)]
      Xs = [[(v - m) / s for v, m, s in zip(r, mean, std)] for r in X]

      w = [0.0, 0.0]
      b = 0.0
      lr, n = 0.1, len(y)
      for _ in range(500):
          errs = [sum(wj * xj for wj, xj in zip(w, row)) + b - t for row, t in zip(Xs, y)]
          w = [wj - lr * 2 * sum(e * row[j] for e, row in zip(errs, Xs)) / n for j, wj in enumerate(w)]
          b -= lr * 2 * sum(errs) / n

      def predict(hours_study, hours_sleep):
          x = [(hours_study - mean[0]) / std[0], (hours_sleep - mean[1]) / std[1]]
          return sum(wj * xj for wj, xj in zip(w, x)) + b

      print("weights (per standard deviation):", [round(v, 2) for v in w], "bias:", round(b, 1))
      print("predicted score for 6h study, 7h sleep:", round(predict(6, 7), 1))
    output: |
      weights (per standard deviation): [11.18, 4.1] bias: 70.2
      predicted score for 6h study, 7h sleep: 74.5
    lines:
      - line: 12
        note: "Standardising makes gradient descent converge quickly with one learning rate."
      - line: 20
        note: "Both weights are updated from the same list of errors."
      - line: 28
        note: "A new point must be scaled with the training mean and std before prediction."
  - title: Regularisation shrinks the slope
    intro: "For one centred feature, ridge regression has the formula w = Σxy / (Σx² + λ). Bigger λ means a smaller weight."
    code: |
      xs = [-3, -2, -1, 0, 1, 2, 3]
      ys = [-5.5, -3.2, -2.4, 0.5, 1.9, 4.2, 6.1]

      def ridge_slope(lam):
          return sum(x * y for x, y in zip(xs, ys)) / (sum(x * x for x in xs) + lam)

      for lam in (0, 1, 10, 100, 1000):
          print(f"lambda={lam:<5} slope={ridge_slope(lam):.3f}")
    output: |
      lambda=0     slope=1.925
      lambda=1     slope=1.859
      lambda=10    slope=1.418
      lambda=100   slope=0.421
      lambda=1000  slope=0.052
    lines:
      - line: 5
        note: "The penalty λ adds to the denominator, pulling the weight toward 0."

playground:
  prompt: |
    In the gradient-descent example, change the learning rate to 0.1 and watch what happens to the loss. Then try 0.005 and see how many steps you need.
  code: |
    xs = [1, 2, 3]
    ys = [2, 4, 6]
    w = 0.0
    for _ in range(50):
        grad = 2 * sum((w * x - y) * x for x, y in zip(xs, ys)) / len(xs)
        w -= 0.05 * grad
    print(round(w, 4))

exercises:
  - id: fit-line
    title: Least-squares line
    difficulty: 3
    prompt: |
      Write `fit_line(xs, ys)` returning `(slope, intercept)` of the least-squares line. Write `predict(model, x)` and `mse(model, xs, ys)` where `model` is the `(slope, intercept)` pair. Write `r_squared(model, xs, ys)` as `1 - SS_res / SS_tot` (return `1.0` if all `ys` are equal and the fit is perfect).
    starter: |
      def fit_line(xs, ys):
          pass

      def predict(model, x):
          pass

      def mse(model, xs, ys):
          pass

      def r_squared(model, xs, ys):
          pass
    tests:
      - name: exact line
        code: |
          m = fit_line([0, 1, 2, 3], [1, 3, 5, 7])
          assert abs(m[0] - 2) < 1e-12 and abs(m[1] - 1) < 1e-12
          assert predict(m, 10) == 21 or abs(predict(m, 10) - 21) < 1e-9
          assert mse(m, [0, 1, 2, 3], [1, 3, 5, 7]) < 1e-20
          assert abs(r_squared(m, [0, 1, 2, 3], [1, 3, 5, 7]) - 1) < 1e-12
      - name: noisy line
        code: |
          xs = [0, 1, 2, 3, 4, 5, 6, 7]
          ys = [1.2, 2.9, 5.1, 7.2, 8.8, 11.1, 13.0, 15.2]
          m = fit_line(xs, ys)
          assert abs(m[0] - 2.0 ) < 0.1 and abs(m[1] - 1.0) < 0.3
          assert 0.99 < r_squared(m, xs, ys) < 1.0
          assert mse(m, xs, ys) < mse((3, 0), xs, ys)
          flat = fit_line([1, 2, 3], [5, 5, 5])
          assert flat == (0.0, 5.0) or (abs(flat[0]) < 1e-12 and abs(flat[1] - 5) < 1e-12)
          assert r_squared(flat, [1, 2, 3], [5, 5, 5]) == 1.0
    hints:
      - "slope = sum((x-mx)*(y-my)) / sum((x-mx)**2); intercept = my - slope*mx."
      - "R squared: `ss_res = sum((y - predict)**2)`, `ss_tot = sum((y - my)**2)`."
    solution: |
      def fit_line(xs, ys):
          n = len(xs)
          mx, my = sum(xs) / n, sum(ys) / n
          w = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sum((x - mx) ** 2 for x in xs)
          return w, my - w * mx


      def predict(model, x):
          return model[0] * x + model[1]


      def mse(model, xs, ys):
          return sum((predict(model, x) - y) ** 2 for x, y in zip(xs, ys)) / len(xs)


      def r_squared(model, xs, ys):
          my = sum(ys) / len(ys)
          ss_res = sum((y - predict(model, x)) ** 2 for x, y in zip(xs, ys))
          ss_tot = sum((y - my) ** 2 for y in ys)
          if ss_tot == 0:
              return 1.0 if ss_res < 1e-12 else 0.0
          return 1 - ss_res / ss_tot
    explanation: "R-squared compares the model with the simplest baseline: always predicting the mean."
  - id: gd-line
    title: Fit a line by gradient descent
    difficulty: 4
    prompt: |
      Write `gd_fit(xs, ys, lr, steps)` that starts at `w = b = 0`, performs exactly `steps` updates using the MSE gradients, and returns `(w, b)`. It must give (nearly) the same line as the closed form after enough steps.
    starter: |
      def gd_fit(xs, ys, lr, steps):
          pass
    tests:
      - name: converges
        code: |
          xs = [0, 1, 2, 3, 4, 5, 6, 7]
          ys = [1.2, 2.9, 5.1, 7.2, 8.8, 11.1, 13.0, 15.2]
          n = len(xs); mx = sum(xs) / n; my = sum(ys) / n
          w0 = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sum((x - mx) ** 2 for x in xs)
          b0 = my - w0 * mx
          w, b = gd_fit(xs, ys, 0.02, 20000)
          assert abs(w - w0) < 1e-3 and abs(b - b0) < 1e-3
      - name: one step and zero steps
        code: |
          assert gd_fit([1, 2], [2, 4], 0.1, 0) == (0.0, 0.0)
          w, b = gd_fit([1, 2], [2, 4], 0.1, 1)
          assert abs(w - 1.0) < 1e-9 and abs(b - 0.6) < 1e-9
          w, b = gd_fit([1, 2, 3], [3, 5, 7], 0.05, 5000)
          assert abs(w - 2) < 1e-2 and abs(b - 1) < 1e-2
    hints:
      - "gradient wrt w is `2/n * sum(err * x)`; wrt b is `2/n * sum(err)` where `err = w*x + b - y`. Update both from the same errors."
    solution: |
      def gd_fit(xs, ys, lr, steps):
          w = b = 0.0
          n = len(xs)
          for _ in range(steps):
              errs = [w * x + b - y for x, y in zip(xs, ys)]
              gw = 2 * sum(e * x for e, x in zip(errs, xs)) / n
              gb = 2 * sum(errs) / n
              w -= lr * gw
              b -= lr * gb
          return w, b
    explanation: "Compute both gradients before changing either parameter, then update them together."
  - id: gd-multi
    title: Linear regression with many features
    difficulty: 4
    prompt: |
      Write `fit_linear(X, y, lr, steps)` for rows `X` (lists of d features) and targets `y`, using batch gradient descent on MSE starting from zeros. Return `(weights, bias)` with `weights` a list. Write `predict_row(model, row)`.
    starter: |
      def fit_linear(X, y, lr, steps):
          pass

      def predict_row(model, row):
          pass
    tests:
      - name: recovers weights
        code: |
          import random
          rng = random.Random(4)
          X = [[rng.uniform(-1, 1), rng.uniform(-1, 1), rng.uniform(-1, 1)] for _ in range(60)]
          y = [2 * a - 3 * b + 0.5 * c + 1 for a, b, c in X]
          w, b = fit_linear(X, y, 0.3, 3000)
          assert abs(w[0] - 2) < 0.02 and abs(w[1] + 3) < 0.02 and abs(w[2] - 0.5) < 0.02 and abs(b - 1) < 0.02
          assert abs(predict_row((w, b), [1, 1, 1]) - (2 - 3 + 0.5 + 1)) < 0.05
      - name: zero steps
        code: |
          w, b = fit_linear([[1, 2], [3, 4]], [1, 2], 0.1, 0)
          assert w == [0.0, 0.0] and b == 0.0
          assert predict_row(([2, 1], 0.5), [3, 4]) == 10.5
    hints:
      - "For each feature j: `grad_j = 2/n * sum(err_i * X[i][j])`. Build the new weights list from the old one."
    solution: |
      def fit_linear(X, y, lr, steps):
          n, d = len(X), len(X[0])
          w = [0.0] * d
          b = 0.0
          for _ in range(steps):
              errs = [sum(wj * xj for wj, xj in zip(w, row)) + b - t for row, t in zip(X, y)]
              grads = [2 * sum(e * row[j] for e, row in zip(errs, X)) / n for j in range(d)]
              w = [wj - lr * g for wj, g in zip(w, grads)]
              b -= lr * 2 * sum(errs) / n
          return w, b


      def predict_row(model, row):
          w, b = model
          return sum(wj * xj for wj, xj in zip(w, row)) + b
    explanation: "Exactly the same algorithm as one feature; the dot product replaces w times x."
  - id: descend
    title: Gradient descent on any function
    difficulty: 3
    prompt: |
      Write `numeric_gradient(f, x, h=1e-6)` returning the central-difference estimate `(f(x+h) - f(x-h)) / (2h)` for a one-variable function. Write `descend(f, x0, lr, steps)` returning the final `x` after repeatedly doing `x -= lr * numeric_gradient(f, x)`.
    starter: |
      def numeric_gradient(f, x, h=1e-6):
          pass

      def descend(f, x0, lr, steps):
          pass
    tests:
      - name: gradient
        code: |
          assert abs(numeric_gradient(lambda x: x * x, 3) - 6) < 1e-6
          assert abs(numeric_gradient(lambda x: 3 * x + 1, 10) - 3) < 1e-6
      - name: descend
        code: |
          assert abs(descend(lambda x: (x - 3) ** 2, 0.0, 0.1, 200) - 3) < 1e-4
          assert abs(descend(lambda x: x ** 4 - 3 * x ** 2 + x, 2.0, 0.01, 2000) - 1.1308) < 1e-2
          assert descend(lambda x: x * x, 5.0, 1.1, 40) > 1e3        # step too large: it diverges
          assert descend(lambda x: x * x, 5.0, 0.1, 0) == 5.0
    hints:
      - "Central differences are more accurate than one-sided ones."
    solution: |
      def numeric_gradient(f, x, h=1e-6):
          return (f(x + h) - f(x - h)) / (2 * h)


      def descend(f, x0, lr, steps):
          x = x0
          for _ in range(steps):
              x -= lr * numeric_gradient(f, x)
          return x
    explanation: "Frameworks compute gradients exactly (automatic differentiation), but this numerical version is a good check of them."
  - id: ridge
    title: Ridge regression
    difficulty: 4
    prompt: |
      For one feature, centre `xs` and `ys` by subtracting their means. Write `ridge_fit(xs, ys, lam)` returning `(slope, intercept)` where `slope = Σ xc·yc / (Σ xc² + lam)` computed on the centred values and `intercept = mean_y - slope * mean_x`. Write `predictions_variance(model, xs)` returning the variance of the predicted values (population variance) so that you can check that a larger `lam` shrinks them.
    starter: |
      def ridge_fit(xs, ys, lam):
          pass

      def predictions_variance(model, xs):
          pass
    tests:
      - name: ridge
        code: |
          xs = [0, 1, 2, 3, 4]
          ys = [1, 3, 5, 7, 9]
          w0, b0 = ridge_fit(xs, ys, 0)
          assert abs(w0 - 2) < 1e-12 and abs(b0 - 1) < 1e-12
          w1, b1 = ridge_fit(xs, ys, 10)
          assert abs(w1 - 20 / 20) < 1e-12 and abs(b1 - (5 - 1 * 2)) < 1e-12
          assert 0 < w1 < w0
          assert ridge_fit(xs, ys, 1e12)[0] < 1e-9
      - name: shrinks predictions
        code: |
          xs = [0, 1, 2, 3, 4]
          ys = [1, 3, 5, 7, 9]
          v = [predictions_variance(ridge_fit(xs, ys, lam), xs) for lam in (0, 1, 5, 50)]
          assert v == sorted(v, reverse=True) and v[0] > v[-1]
          assert abs(predictions_variance((2, 1), [0, 1, 2, 3, 4]) - 8.0) < 1e-12
    hints:
      - "Variance = mean of squared deviations of the predictions from their mean."
    solution: |
      def ridge_fit(xs, ys, lam):
          n = len(xs)
          mx, my = sum(xs) / n, sum(ys) / n
          num = sum((x - mx) * (y - my) for x, y in zip(xs, ys))
          den = sum((x - mx) ** 2 for x in xs) + lam
          w = num / den
          return w, my - w * mx


      def predictions_variance(model, xs):
          preds = [model[0] * x + model[1] for x in xs]
          m = sum(preds) / len(preds)
          return sum((p - m) ** 2 for p in preds) / len(preds)
    explanation: "The penalty trades a little training accuracy for stability. On noisy data the shrunk model often predicts new points better."

commonMistakes:
  - title: "Learning rate too large"
    explanation: "The loss rises or becomes inf/nan. Reduce the learning rate and standardise the features."
  - title: "Updating w and b one after the other with different errors"
    explanation: "Compute the gradients from the same predictions, then update both."
  - title: "Extrapolating far outside the training range"
    explanation: "A line fitted to ages 20 to 40 says little about age 90."
  - title: "Reading R-squared as proof of causation"
    explanation: "A high fit shows association, not cause."
  - title: "Forgetting to scale new inputs with the training mean and std"
    explanation: "The model expects inputs on the same scale as in training."

summary:
  - "Regression predicts numbers; linear regression minimises the mean squared error."
  - "One-feature least squares has a closed form; gradient descent works for any differentiable loss."
  - "The learning rate must be tuned: too small is slow, too large diverges; scaled features help."
  - "Several features use a weight vector and bias; R-squared and test error measure fit."
  - "Regularisation penalises large weights to reduce overfitting."
