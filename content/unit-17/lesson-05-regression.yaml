  - type: code
    question: |
      Write `mse(y_true, y_pred)` returning the mean squared error of two equal-length lists.
    starter: |
      def mse(y_true, y_pred):
          pass
    tests:
      - name: mse
        code: |
          assert mse([1, 2, 3], [1, 2, 3]) == 0
          assert mse([0, 0], [1, 3]) == 5.0
          assert mse([2], [5]) == 9
    solution: |
      def mse(y_true, y_pred):
          return sum((a - b) ** 2 for a, b in zip(y_true, y_pred)) / len(y_true)
