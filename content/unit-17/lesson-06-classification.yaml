      - "Split the rows and labels into left (`row[j] <= t`) and right lists, then recurse with `max_depth - 1`."
    solution: |
      from collections import Counter


      def gini(labels):
          n = len(labels)
          if n == 0:
              return 0.0
          return 1 - sum((labels.count(c) / n) ** 2 for c in set(labels))


      def best_split(rows, labels):
          best = None
          n = len(labels)
          for j in range(len(rows[0])):
              vals = sorted(set(r[j] for r in rows))
              for a, b in zip(vals, vals[1:]):
                  t = (a + b) / 2
                  left = [y for r, y in zip(rows, labels) if r[j] <= t]
                  right = [y for r, y in zip(rows, labels) if r[j] > t]
                  score = (len(left) * gini(left) + len(right) * gini(right)) / n
                  if best is None or score < best[2] - 1e-12:
                      best = (j, t, score)
          return best


      def _majority(labels):
          counts = Counter(labels)
          top = max(counts.values())
          return min(l for l, c in counts.items() if c == top)


      def build_tree(rows, labels, max_depth):
          if max_depth == 0 or len(set(labels)) == 1:
              return {"leaf": _majority(labels)}
          split = best_split(rows, labels)
          if split is None:
              return {"leaf": _majority(labels)}
          j, t, _ = split
          li = [i for i, r in enumerate(rows) if r[j] <= t]
          ri = [i for i, r in enumerate(rows) if r[j] > t]
          return {"feature": j, "threshold": t,
                  "left": build_tree([rows[i] for i in li], [labels[i] for i in li], max_depth - 1),
                  "right": build_tree([rows[i] for i in ri], [labels[i] for i in ri], max_depth - 1)}


      def predict_tree(tree, row):
          while "leaf" not in tree:
              tree = tree["left"] if row[tree["feature"]] <= tree["threshold"] else tree["right"]
          return tree["leaf"]


      def tree_depth(tree):
          if "leaf" in tree:
              return 0
          return 1 + max(tree_depth(tree["left"]), tree_depth(tree["right"]))
    explanation: "Recursion mirrors the structure of the tree: one split, then two smaller problems of the same kind."

commonMistakes:
  - title: "Expecting a perceptron to learn XOR"
    explanation: "It only draws a straight line. Use hidden layers or add features."
  - title: "Using 0.5 as the threshold without thinking"
    explanation: "Choose the threshold from the costs of false positives and false negatives."
  - title: "Letting a tree grow without limit"
    explanation: "It memorises noise. Limit the depth, require minimum leaf sizes or use an ensemble."
  - title: "Overflow in exp() when computing the sigmoid"
    explanation: "Use a stable form for large negative inputs."
  - title: "Interpreting a predicted probability as certain"
    explanation: "Check whether the probabilities are calibrated, that is, whether 80% predictions are right about 80% of the time."

summary:
  - "A linear classifier draws a hyperplane; the perceptron learns one from mistakes if the data are linearly separable (XOR is not)."
  - "Logistic regression passes the linear score through a sigmoid to output probabilities and is trained on log-loss by gradient descent."
  - "Decision trees pick splits that minimise weighted Gini impurity (or entropy) and predict the majority class in leaves."
  - "Unlimited trees overfit; limiting depth, pruning and ensembles (bagging, random forests) control variance."
  - "The decision threshold trades precision against recall."
