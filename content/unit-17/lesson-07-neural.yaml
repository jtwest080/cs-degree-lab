  - type: code
    question: |
      Write `neuron(x, w, b)` returning `max(0, w·x + b)` (a ReLU neuron) for list inputs.
    starter: |
      def neuron(x, w, b):
          pass
    tests:
      - name: neuron
        code: |
          assert neuron([1, 2], [3, 4], -5) == 6
          assert neuron([1, 2], [-3, -4], 1) == 0
          assert neuron([], [], 2) == 2
    solution: |
      def neuron(x, w, b):
          return max(0, sum(a * c for a, c in zip(x, w)) + b)
