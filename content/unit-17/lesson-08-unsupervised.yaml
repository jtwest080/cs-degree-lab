  - type: code
    question: |
      Write `assign(point, centroids)` returning the index of the centroid nearest to `point` (Euclidean distance, lowest index on ties).
    starter: |
      import math

      def assign(point, centroids):
          pass
    tests:
      - name: assign
        code: |
          assert assign((1, 1), [(0, 0), (5, 5)]) == 0
          assert assign((4, 4), [(0, 0), (5, 5)]) == 1
          assert assign((2.5, 2.5), [(0, 0), (5, 5)]) == 0
    solution: |
      import math


      def assign(point, centroids):
          return min(range(len(centroids)), key=lambda c: math.dist(point, centroids[c]))
