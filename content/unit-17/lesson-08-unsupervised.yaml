id: u17-unsupervised
title: "Clustering, Anomalies and Reinforcement Learning"
minutes: 65
objective: |
  Explore two ways of learning without a teacher who supplies the right answers. You will cluster unlabelled data with k-means, spot unusual points with simple statistics, and then study reinforcement learning: multi-armed bandits, Markov decision processes, value iteration and Q-learning, the ideas behind game-playing and robot-control programs.
outcomes:
  - Implement k-means clustering and explain its limits and the elbow method
  - Detect anomalies with z-scores and discuss when this is useful
  - Describe an agent, environment, reward, policy and the exploration/exploitation trade-off
  - Solve a small Markov decision process with value iteration
  - Train a Q-learning agent on a small environment

sections:
  - heading: Unsupervised learning and clustering
    body: |
      In **unsupervised learning** the data come without labels and the goal is to discover **structure**. The most common task is **clustering**: grouping similar items, such as customers with similar buying habits, genes with similar activity, or news stories about the same event. Related tasks are **dimensionality reduction** (compressing many features into a few that keep most of the information, for visualisation or speed), **density estimation**, and **anomaly detection**.

      **k-means** is the classic clustering algorithm. Choose the number of clusters k, then repeat two steps until nothing changes: (1) **assign** each point to its nearest **centroid**; (2) **update** each centroid to the **mean** of the points assigned to it. Each round never increases the **inertia**, the sum of squared distances from points to their centroids, so the algorithm always terminates, but only at a **local minimum**: different starting centroids can give different answers, so practical versions (k-means++) choose spread-out starts and run several times. The method assumes round, similar-sized clusters, is sensitive to feature scale (standardise first, Lesson 17.4) and to outliers, and needs k in advance. A common guide is the **elbow method**: plot inertia against k and look for the bend where adding clusters stops helping much. Other approaches include **hierarchical clustering** (repeatedly merging the two closest groups, producing a tree called a dendrogram), **DBSCAN** (grows clusters from dense regions and labels isolated points as noise) and **Gaussian mixture models**. **Principal component analysis (PCA)** finds the directions in which the data vary most and projects onto the first few.

      **Anomaly detection** looks for rare items that differ from the rest: fraud, failing machines, intrusions (Unit 16). A simple method flags a value whose **z-score** (how many standard deviations from the mean) is large, say beyond 3. Anomalies can also be found by distance to neighbours, by cluster membership, or by how poorly a model reconstructs them. Because anomalies are rare there are few examples to learn from, so these methods are usually unsupervised and need human review.

  - heading: Reinforcement learning
    body: |
      **Reinforcement learning (RL)** is learning by **trial and error**. An **agent** in an **environment** repeatedly observes a **state** s, chooses an **action** a, receives a numerical **reward** r and moves to a new state s'. There is no teacher giving correct actions, only the reward signal, which may be **delayed** (you learn you blundered in chess only at the end). The agent's behaviour is a **policy** π(s) that picks an action in each state, and its aim is to maximise the **return**: the total future reward, usually **discounted** by a factor γ (gamma, between 0 and 1) so that nearer rewards count more: G = r₁ + γ r₂ + γ² r₃ + ... RL trained game players (TD-Gammon, Atari agents, AlphaGo), controlled data-centre cooling, and fine-tunes language models from human feedback (Lesson 17.9).

      The first dilemma is **exploration versus exploitation**: use what you know works, or try something new that might be better? The **multi-armed bandit** isolates it: several slot machines ("arms") with unknown average payouts; to maximise winnings you must sample them to learn which is best but not waste pulls on bad ones. The **epsilon-greedy** strategy pulls the arm with the best estimated average most of the time, but with a small probability ε picks a random arm. The estimate is updated incrementally: **Q ← Q + (r - Q) / n**, an average without storing the history.

  - heading: Markov decision processes, value iteration and Q-learning
    body: |
      A **Markov decision process (MDP)** formalises sequential decisions: states, actions, a **transition model** P(s' | s, a), a reward function, and the **Markov property** (the future depends on the current state only, Lesson 17.3). The **value** V(s) of a state is the expected return from s when acting optimally. It satisfies the **Bellman equation**: **V(s) = max over a of Σ P(s' | s, a) [ r + γ V(s') ]**: the best action is the one with the highest expected immediate reward plus discounted value of where you land. If the model is known, **value iteration** solves it: start with V = 0 and apply the Bellman update to every state repeatedly until the values stop changing, then read off the **policy**: in each state choose the action that achieves the maximum.

      Often the model is **unknown**; the agent only experiences transitions. **Q-learning** (Watkins, 1989) learns the **action value** Q(s, a), the expected return of taking a in s and then acting optimally, directly from experience with no model: after each step, **Q(s, a) ← Q(s, a) + α [ r + γ max over a' of Q(s', a') - Q(s, a) ]**. The bracket is the **temporal-difference error**: the gap between what we predicted and what we got plus our estimate of the future. The learning rate α sets how fast we change. The agent acts ε-greedily so it keeps exploring, and as the Q-table converges, always choosing the action with the largest Q gives the optimal policy. A table is fine for hundreds of states; for huge ones (Atari screens, Go) **deep Q-networks** use a neural network (Lesson 17.7) to approximate Q, and **policy-gradient** methods learn the policy directly. RL needs a lot of trial and error, so it is often trained in simulation, and a badly specified reward can be **gamed**: an agent rewarded for score may loop forever collecting points instead of finishing the race. Designing the reward is a safety question, the subject of **AI alignment**.

examples:
  - title: k-means step by step
    intro: "Six points, two clusters, deterministic starting centroids. The centroids move until the assignment stops changing."
    code: |
      import math

      points = [(1, 1), (1.5, 2), (3, 4), (5, 7), (3.5, 5), (4.5, 5), (3.5, 4.5)]

      def kmeans(points, k, max_iter=20):
          centroids = [points[0], points[3]][:k]          # fixed starting choice for a repeatable demo
          assign = None
          for it in range(1, max_iter + 1):
              new = [min(range(k), key=lambda c: math.dist(p, centroids[c])) for p in points]
              if new == assign:
                  return centroids, assign, it - 1
              assign = new
              for c in range(k):
                  members = [p for p, a in zip(points, assign) if a == c]
                  if members:
                      centroids[c] = tuple(sum(v) / len(members) for v in zip(*members))
              print(f"iteration {it}: assign {assign} centroids {[tuple(round(v, 2) for v in c) for c in centroids]}")
          return centroids, assign, max_iter

      centroids, assign, rounds = kmeans(points, 2)
      inertia = sum(math.dist(p, centroids[a]) ** 2 for p, a in zip(points, assign))
      print("converged after", rounds, "rounds; inertia", round(inertia, 3))
    output: |
      iteration 1: assign [0, 0, 0, 1, 1, 1, 1] centroids [(1.83, 2.33), (4.12, 5.38)]
      iteration 2: assign [0, 0, 1, 1, 1, 1, 1] centroids [(1.25, 1.5), (3.9, 5.1)]
      converged after 2 rounds; inertia 8.525
    lines:
      - line: 9
        note: "Assignment step: each point joins its nearest centroid."
      - line: 15
        note: "Update step: each centroid moves to the mean of its members."
  - title: The elbow method
    intro: "Three obvious blobs. Inertia falls sharply up to k = 3 and then flattens."
    code: |
      import math, random

      rng = random.Random(4)
      centres = [(0, 0), (6, 0), (3, 5)]
      pts = [(cx + rng.gauss(0, 0.7), cy + rng.gauss(0, 0.7)) for cx, cy in centres for _ in range(30)]

      def kmeans(points, k, iters=30):
          # farthest-point start: a simple deterministic way to pick spread-out centroids
          cents = [points[0]]
          while len(cents) < k:
              cents.append(max(points, key=lambda p: min(math.dist(p, c) for c in cents)))
          for _ in range(iters):
              groups = [[] for _ in range(k)]
              for p in points:
                  groups[min(range(k), key=lambda c: math.dist(p, cents[c]))].append(p)
              cents = [tuple(sum(v) / len(g) for v in zip(*g)) if g else cents[i] for i, g in enumerate(groups)]
          return cents, sum(math.dist(p, min(cents, key=lambda c: math.dist(p, c))) ** 2 for p in points)

      for k in range(1, 7):
          print(k, round(kmeans(pts, k)[1], 1))
    output: |
      1 1121.4
      2 616.4
      3 78.6
      4 66.1
      5 53.2
      6 47.9
    lines:
      - line: 9
        note: "k-means++ style spreading: each new centroid is the point farthest from the ones already chosen."
      - line: 20
        note: "The big drop from 2 to 3, then little gain: the elbow suggests three clusters."
  - title: Spotting anomalies with z-scores
    intro: "Daily server response times in milliseconds. One day is very different."
    code: |
      import statistics

      times = [102, 98, 105, 99, 101, 97, 103, 100, 480, 104, 96, 102]
      mean = statistics.mean(times)
      sd = statistics.pstdev(times)
      print("mean", round(mean, 1), "std", round(sd, 1))
      for day, t in enumerate(times, 1):
          z = (t - mean) / sd
          if abs(z) > 2.5:
              print(f"day {day}: {t} ms, z = {z:.1f}  <- anomaly")

      # a robust version: the median and median absolute deviation are not dragged by the outlier
      med = statistics.median(times)
      mad = statistics.median(abs(t - med) for t in times)
      print("median", med, "MAD", mad)
      print([t for t in times if abs(t - med) / mad > 5])
    output: |
      mean 132.2 std 104.9
      day 9: 480 ms, z = 3.3  <- anomaly
      median 101.5 MAD 2.5
      [480]
    lines:
      - line: 10
        note: "The outlier itself inflates the standard deviation, which hides smaller anomalies."
      - line: 14
        note: "Median and MAD ignore extremes, so they are a more robust yardstick."
  - title: Epsilon-greedy bandit
    intro: "Three slot machines with unknown win rates. Mostly pull the best-looking arm, sometimes explore."
    code: |
      import random

      def run(epsilon, pulls=2000, seed=1):
          rng = random.Random(seed)
          true_p = [0.3, 0.5, 0.7]
          q = [0.0] * 3
          n = [0] * 3
          total = 0
          for _ in range(pulls):
              if rng.random() < epsilon:
                  arm = rng.randrange(3)
              else:
                  arm = max(range(3), key=lambda a: q[a])
              reward = 1 if rng.random() < true_p[arm] else 0
              n[arm] += 1
              q[arm] += (reward - q[arm]) / n[arm]
              total += reward
          return total / pulls, n, [round(v, 2) for v in q]

      for eps in (0.0, 0.1, 0.3):
          avg, counts, est = run(eps)
          print(f"epsilon={eps}: average reward {avg:.3f}, pulls {counts}, estimates {est}")
    output: |
      epsilon=0.0: average reward 0.309, pulls [2000, 0, 0], estimates [0.31, 0.0, 0.0]
      epsilon=0.1: average reward 0.678, pulls [105, 72, 1823], estimates [0.19, 0.51, 0.71]
      epsilon=0.3: average reward 0.635, pulls [200, 197, 1603], estimates [0.32, 0.51, 0.69]
    lines:
      - line: 13
        note: "Exploit: choose the arm with the highest estimated value so far."
      - line: 17
        note: "Incremental average: Q moves a fraction 1/n toward the new reward."
      - line: 25
        note: "With epsilon 0 the agent may lock onto a mediocre arm forever. A little exploration finds the best arm."
  - title: Value iteration on a gridworld corridor
    intro: "A corridor of five cells. The goal at the right pays +10, every step costs 1. Value iteration finds how good each cell is."
    code: |
      N = 5                      # states 0..4, state 4 is the goal
      gamma = 0.9

      def step(s, a):            # actions: -1 = left, +1 = right
          s2 = min(max(s + a, 0), N - 1)
          reward = 10 if s2 == N - 1 else -1
          return s2, reward

      V = [0.0] * N
      for sweep in range(1, 101):
          delta = 0.0
          for s in range(N - 1):
              best = max(r + gamma * V[s2] for s2, r in (step(s, a) for a in (-1, 1)))
              delta = max(delta, abs(best - V[s]))
              V[s] = best
          if delta < 1e-9:
              break
      print("sweeps:", sweep)
      print("values:", [round(v, 2) for v in V])
      policy = ["right" if step(s, 1)[1] + gamma * V[step(s, 1)[0]] >= step(s, -1)[1] + gamma * V[step(s, -1)[0]] else "left" for s in range(N - 1)]
      print("policy:", policy)
    output: |
      sweeps: 5
      values: [4.58, 6.2, 8.0, 10.0, 0.0]
      policy: ['right', 'right', 'right', 'right']
    lines:
      - line: 12
        note: "Bellman update: the best action's reward plus the discounted value of the next state."
      - line: 20
        note: "The policy follows the values: always walk toward the goal."
  - title: Q-learning
    intro: "The same corridor, but now the agent does not know the rules. It learns Q-values from experience with epsilon-greedy exploration."
    code: |
      import random

      N, gamma, alpha, epsilon = 6, 0.9, 0.5, 0.2
      rng = random.Random(0)
      Q = [[0.0, 0.0] for _ in range(N)]              # actions: 0 = left, 1 = right

      def env(s, a):
          s2 = min(max(s + (1 if a == 1 else -1), 0), N - 1)
          return s2, (10 if s2 == N - 1 else -1), s2 == N - 1

      for episode in range(300):
          s = 0
          for _ in range(200):
              a = rng.randrange(2) if rng.random() < epsilon else (0 if Q[s][0] > Q[s][1] else 1)
              s2, r, done = env(s, a)
              target = r if done else r + gamma * max(Q[s2])
              Q[s][a] += alpha * (target - Q[s][a])
              s = s2
              if done:
                  break

      for s in range(N - 1):
          print(f"state {s}: Q(left)={Q[s][0]:6.2f}  Q(right)={Q[s][1]:6.2f}  best: {'right' if Q[s][1] >= Q[s][0] else 'left'}")
    output: |
      state 0: Q(left)=  1.81  Q(right)=  3.12  best: right
      state 1: Q(left)=  1.81  Q(right)=  4.58  best: right
      state 2: Q(left)=  3.12  Q(right)=  6.20  best: right
      state 3: Q(left)=  4.58  Q(right)=  8.00  best: right
      state 4: Q(left)=  6.20  Q(right)= 10.00  best: right
    lines:
      - line: 14
        note: "Epsilon-greedy: explore a fifth of the time, otherwise take the best known action."
      - line: 16
        note: "Temporal-difference update toward reward plus discounted best future value."
      - line: 25
        note: "The learned Q-values agree with value iteration, but the agent never needed the model."

