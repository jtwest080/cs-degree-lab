exercises:
  - id: kmeans
    title: k-means
    difficulty: 4
    prompt: |
      Write `kmeans(points, k, max_iter=100)` where `points` is a list of tuples. Start with the **first k points** as centroids. Repeat: assign each point to the nearest centroid (ties go to the lower index), then move every centroid to the mean of its members (an empty cluster keeps its old centroid), stopping when the assignment does not change. Return `(centroids, assignment)` where `centroids` is a list of tuples and `assignment` a list of cluster indices. Write `inertia(points, centroids, assignment)`.
    starter: |
      import math

      def kmeans(points, k, max_iter=100):
          pass

      def inertia(points, centroids, assignment):
          pass
    tests:
      - name: two clusters
        code: |
          pts = [(1, 1), (1.5, 2), (3, 4), (5, 7), (3.5, 5), (4.5, 5), (3.5, 4.5)]
          cents, assign = kmeans(pts, 2)
          assert assign == [0, 0, 1, 1, 1, 1, 1]
          assert abs(cents[0][0] - 1.25) < 1e-9 and abs(cents[1][1] - 5.1) < 1e-9
          assert abs(inertia(pts, cents, assign) - 8.525) < 1e-9
      - name: edge cases
        code: |
          c, a = kmeans([(0, 0), (10, 10)], 2)
          assert c == [(0, 0), (10, 10)] and a == [0, 1]
          c, a = kmeans([(0,), (1,), (2,), (10,), (11,), (12,)], 2)
          assert a == [0, 0, 0, 1, 1, 1] and c == [(1.0,), (11.0,)]
          c, a = kmeans([(1, 1), (2, 2), (3, 3)], 1)
          assert a == [0, 0, 0] and c == [(2.0, 2.0)]
          assert inertia([(0,), (2,)], [(1,)], [0, 0]) == 2.0
    hints:
      - "`min(range(k), key=lambda c: math.dist(p, centroids[c]))` returns the lowest index on ties."
      - "Centroid of members: `tuple(sum(v) / len(members) for v in zip(*members))`."
    solution: |
      import math


      def kmeans(points, k, max_iter=100):
          centroids = [tuple(p) for p in points[:k]]
          assign = None
          for _ in range(max_iter):
              new = [min(range(k), key=lambda c: math.dist(p, centroids[c])) for p in points]
              if new == assign:
                  break
              assign = new
              for c in range(k):
                  members = [p for p, a in zip(points, assign) if a == c]
                  if members:
                      centroids[c] = tuple(sum(v) / len(members) for v in zip(*members))
          return centroids, assign


      def inertia(points, centroids, assignment):
          return sum(math.dist(p, centroids[a]) ** 2 for p, a in zip(points, assignment))
    explanation: "The result depends on the starting centroids; real implementations restart several times and keep the lowest inertia."
  - id: zscore
    title: Find anomalies
    difficulty: 3
    prompt: |
      Write `zscore_anomalies(values, threshold=3.0)` returning the **indices** of values whose absolute z-score (using the population standard deviation) is **greater than** `threshold`. If the standard deviation is 0, return an empty list. Write `mad_anomalies(values, threshold=5.0)` using the median and the median absolute deviation instead: return the indices where `abs(v - median) / MAD > threshold` (if the MAD is 0, return the indices of values that differ from the median).
    starter: |
      import statistics

      def zscore_anomalies(values, threshold=3.0):
          pass

      def mad_anomalies(values, threshold=5.0):
          pass
    tests:
      - name: zscore
        code: |
          base = [10, 11, 9, 10, 10, 12, 8, 10, 11, 9] * 3
          vals = base + [50]
          assert zscore_anomalies(vals) == [30]
          assert zscore_anomalies(base) == []
          assert zscore_anomalies([5, 5, 5, 5]) == []
          assert zscore_anomalies([1, 2, 3, 4, 100], threshold=1.5) == [4]
      - name: robust
        code: |
          times = [102, 98, 105, 99, 101, 97, 103, 100, 480, 104, 96, 102]
          assert mad_anomalies(times) == [8]
          assert mad_anomalies([5, 5, 5, 5, 9]) == [4]
          assert mad_anomalies([1, 1, 1]) == []
          # a masking example: two big outliers inflate the standard deviation
          data = [10, 11, 10, 9, 10, 11, 10, 9, 10, 11, 200, 200]
          assert zscore_anomalies(data) == []
          assert mad_anomalies(data) == [10, 11]
    hints:
      - "`statistics.pstdev` is the population standard deviation. MAD is the median of `abs(v - median)`."
    solution: |
      import statistics


      def zscore_anomalies(values, threshold=3.0):
          mean = statistics.mean(values)
          sd = statistics.pstdev(values)
          if sd == 0:
              return []
          return [i for i, v in enumerate(values) if abs(v - mean) / sd > threshold]


      def mad_anomalies(values, threshold=5.0):
          med = statistics.median(values)
          mad = statistics.median(abs(v - med) for v in values)
          if mad == 0:
              return [i for i, v in enumerate(values) if v != med]
          return [i for i, v in enumerate(values) if abs(v - med) / mad > threshold]
    explanation: "Outliers distort the mean and standard deviation that are used to find them (masking). Robust statistics avoid that."
  - id: bandit
    title: Epsilon-greedy bandit
    difficulty: 4
    prompt: |
      Write `run_bandit(true_p, epsilon, pulls, seed)` using `rng = random.Random(seed)`. Keep value estimates `q` and counts `n` (all 0). Each pull: with probability `epsilon` (`rng.random() < epsilon`) choose `rng.randrange(len(true_p))`, otherwise the arm with the highest `q` (ties go to the lowest index). The reward is `1 if rng.random() < true_p[arm] else 0`. Update `n[arm]` and `q[arm] += (reward - q[arm]) / n[arm]`. Return `(total_reward, counts, q)`.
    starter: |
      import random

      def run_bandit(true_p, epsilon, pulls, seed):
          pass
    tests:
      - name: bookkeeping
        code: |
          total, n, q = run_bandit([0.2, 0.8], 0.1, 500, 3)
          assert sum(n) == 500 and len(q) == 2
          assert 0 <= total <= 500
          assert run_bandit([0.2, 0.8], 0.1, 500, 3) == (total, n, q)
          assert n[1] > 3 * n[0]
          assert abs(q[1] - 0.8) < 0.1
      - name: exploration matters
        code: |
          # arm 0 is only slightly worse, so greedy without exploration can get stuck; with epsilon it finds the best arm
          best_counts = []
          for seed in range(10):
              t, n, q = run_bandit([0.4, 0.6, 0.8], 0.1, 1500, seed)
              best_counts.append(n[2])
          assert sum(c > 900 for c in best_counts) >= 8
          t0, n0, q0 = run_bandit([1.0, 0.0], 0.0, 100, 1)
          assert n0 == [100, 0] and t0 == 100
    hints:
      - "`max(range(k), key=lambda a: q[a])` returns the first maximum, which handles ties."
    solution: |
      import random


      def run_bandit(true_p, epsilon, pulls, seed):
          rng = random.Random(seed)
          k = len(true_p)
          q = [0.0] * k
          n = [0] * k
          total = 0
          for _ in range(pulls):
              if rng.random() < epsilon:
                  arm = rng.randrange(k)
              else:
                  arm = max(range(k), key=lambda a: q[a])
              reward = 1 if rng.random() < true_p[arm] else 0
              n[arm] += 1
              q[arm] += (reward - q[arm]) / n[arm]
              total += reward
          return total, n, q
    explanation: "Exploration has a cost now (pulling bad arms) and a payoff later (finding the best one)."
  - id: value-iteration
    title: Value iteration
    difficulty: 4
    prompt: |
      An MDP is a dict `P` mapping each non-terminal state to a dict of actions, each a list of `(probability, next_state, reward)` outcomes. States that do not appear as keys are terminal with value 0. Write `value_iteration(P, gamma, tol=1e-9)` returning `(V, policy)`: `V` maps every non-terminal state to its optimal value, and `policy` maps it to the best action (ties go to the action that sorts first). Update values in place, sweeping states in sorted order, until the largest change in a sweep is below `tol`.
    starter: |
      def value_iteration(P, gamma, tol=1e-9):
          pass
    tests:
      - name: corridor
        code: |
          P = {}
          for s in range(4):
              P[s] = {}
              for name, d in (("left", -1), ("right", 1)):
                  s2 = min(max(s + d, 0), 4)
                  P[s][name] = [(1.0, s2, 10 if s2 == 4 else -1)]
          V, pi = value_iteration(P, 0.9)
          assert [round(V[s], 3) for s in range(4)] == [4.58, 6.2, 8.0, 10.0]
          assert all(pi[s] == "right" for s in range(4))
      - name: stochastic
        code: |
          # 'safe' pays 1 for sure; 'risky' pays 10 with prob 0.3 or 0 otherwise. Both end the episode.
          P = {"start": {"safe": [(1.0, "end", 1)], "risky": [(0.3, "end", 10), (0.7, "end", 0)]}}
          V, pi = value_iteration(P, 0.9)
          assert abs(V["start"] - 3.0) < 1e-9 and pi["start"] == "risky"
          P["start"]["risky"] = [(0.05, "end", 10), (0.95, "end", 0)]
          V, pi = value_iteration(P, 0.9)
          assert abs(V["start"] - 1.0) < 1e-9 and pi["start"] == "safe"
    hints:
      - "Q(s, a) = sum(p * (r + gamma * V.get(s2, 0.0)) for p, s2, r in outcomes). V(s) = max over a."
    solution: |
      def value_iteration(P, gamma, tol=1e-9):
          V = {s: 0.0 for s in P}

          def q(s, a):
              return sum(p * (r + gamma * V.get(s2, 0.0)) for p, s2, r in P[s][a])

          while True:
              delta = 0.0
              for s in sorted(P):
                  best = max(q(s, a) for a in P[s])
                  delta = max(delta, abs(best - V[s]))
                  V[s] = best
              if delta < tol:
                  break
          policy = {}
          for s in P:
              scores = {a: q(s, a) for a in P[s]}
              top = max(scores.values())
              policy[s] = sorted(a for a, v in scores.items() if v >= top - 1e-12)[0]
          return V, policy
    explanation: "The Bellman update is a contraction: repeating it converges to the unique optimal values."
  - id: q-learning
    title: Q-learning
    difficulty: 5
    prompt: |
      Write `q_learning(n_states, episodes, alpha, gamma, epsilon, seed)` for a corridor: states `0..n_states-1`, start at 0, the last state is the goal (terminal). Actions are 0 (left) and 1 (right); moving into the goal gives reward +10 and ends the episode; every other move gives -1; moving left from state 0 stays at 0. Use `rng = random.Random(seed)`: explore if `rng.random() < epsilon` (then `rng.randrange(2)`), otherwise pick the larger Q (action 1 on ties). Limit each episode to 200 steps. Update `Q[s][a] += alpha * (target - Q[s][a])` with `target = r` at the goal else `r + gamma * max(Q[s2])`. Return the Q-table (list of `[q_left, q_right]`). Write `greedy_policy(Q)` returning for each non-goal state the best action (1 on ties).
    starter: |
      import random

      def q_learning(n_states, episodes, alpha, gamma, epsilon, seed):
          pass

      def greedy_policy(Q):
          pass
    tests:
      - name: learns to go right
        code: |
          Q = q_learning(6, 300, 0.5, 0.9, 0.2, 0)
          assert len(Q) == 6
          assert greedy_policy(Q) == [1, 1, 1, 1, 1]
          assert Q[4][1] > Q[4][0]
          assert abs(Q[4][1] - 10) < 0.5
          assert Q[3][1] < Q[4][1] and Q[0][1] < Q[3][1]
      - name: reproducible and shapes
        code: |
          a = q_learning(4, 50, 0.5, 0.9, 0.3, 5)
          b = q_learning(4, 50, 0.5, 0.9, 0.3, 5)
          assert a == b
          assert q_learning(3, 0, 0.5, 0.9, 0.1, 1) == [[0.0, 0.0]] * 3
          assert len(greedy_policy(a)) == 3
    hints:
      - "Done when `s2 == n_states - 1`. Terminal Q-values stay at 0 and are never used because the target is just `r` there."
    solution: |
      import random


      def q_learning(n_states, episodes, alpha, gamma, epsilon, seed):
          rng = random.Random(seed)
          goal = n_states - 1
          Q = [[0.0, 0.0] for _ in range(n_states)]
          for _ in range(episodes):
              s = 0
              for _ in range(200):
                  if rng.random() < epsilon:
                      a = rng.randrange(2)
                  else:
                      a = 0 if Q[s][0] > Q[s][1] else 1
                  s2 = min(max(s + (1 if a == 1 else -1), 0), goal)
                  done = s2 == goal
                  r = 10 if done else -1
                  target = r if done else r + gamma * max(Q[s2])
                  Q[s][a] += alpha * (target - Q[s][a])
                  s = s2
                  if done:
                      break
          return Q


      def greedy_policy(Q):
          return [0 if q[0] > q[1] else 1 for q in Q[:-1]]
    explanation: "No model of the world was given; the agent discovered the best policy by trying actions and bootstrapping from its own estimates."

commonMistakes:
  - title: "Choosing k without looking at the data"
    explanation: "Try several k and use the elbow, domain knowledge, or other measures."
  - title: "Clustering unscaled features"
    explanation: "A large-unit feature dominates distances. Standardise first."
  - title: "Treating a cluster as meaningful just because k-means found it"
    explanation: "k-means always returns k clusters, even for random data. Check stability and usefulness."
  - title: "Never exploring in RL"
    explanation: "A purely greedy agent can lock onto a poor early choice."
  - title: "A reward that rewards the wrong thing"
    explanation: "Agents maximise exactly the reward you wrote, which may not be what you meant."

summary:
  - "Unsupervised learning finds structure without labels: k-means alternates assignment and centroid updates and converges to a local minimum."
  - "Anomalies can be flagged with z-scores or robust statistics; both need human review."
  - "RL learns from rewards by trial and error and must balance exploration against exploitation."
  - "An MDP with a known model is solved by value iteration using the Bellman equation."
  - "Q-learning learns action values from experience without a model, and extends to deep Q-networks."
