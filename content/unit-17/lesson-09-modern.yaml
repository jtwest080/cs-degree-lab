exercises:
  - id: bigram-model
    title: A bigram model
    difficulty: 3
    prompt: |
      Write `train_bigram(words)` returning a dict that maps each word to a dict of next-word counts. Write `next_probs(model, word)` returning a dict of probabilities for the words following `word` (empty dict if `word` is unknown or never followed). Write `generate(model, start, n)` returning a list of `n` words after `start` using greedy decoding (most frequent next word; ties go to the alphabetically first), stopping early if there is no next word.
    starter: |
      def train_bigram(words):
          pass

      def next_probs(model, word):
          pass

      def generate(model, start, n):
          pass
    tests:
      - name: counts and probabilities
        code: |
          m = train_bigram("a b a c a b".split())
          assert m == {"a": {"b": 2, "c": 1}, "b": {"a": 1}, "c": {"a": 1}}
          p = next_probs(m, "a")
          assert abs(p["b"] - 2 / 3) < 1e-12 and abs(p["c"] - 1 / 3) < 1e-12
          assert next_probs(m, "zzz") == {}
          assert next_probs(train_bigram(["x"]), "x") == {}
      - name: generation
        code: |
          m = train_bigram("a b a c a b".split())
          assert generate(m, "a", 4) == ["b", "a", "b", "a"]
          assert generate(m, "c", 3) == ["a", "b", "a"]
          assert generate(train_bigram(["x", "y"]), "x", 5) == ["y"]
          assert generate(m, "nope", 3) == []
    hints:
      - "Greedy choice: `max(sorted(counts), key=lambda w: counts[w])`. `max` returns the first maximal item of the sorted list."
    solution: |
      def train_bigram(words):
          model = {}
          for a, b in zip(words, words[1:]):
              model.setdefault(a, {})
              model[a][b] = model[a].get(b, 0) + 1
          return model


      def next_probs(model, word):
          counts = model.get(word, {})
          total = sum(counts.values())
          return {w: c / total for w, c in counts.items()}


      def generate(model, start, n):
          out, word = [], start
          for _ in range(n):
              counts = model.get(word)
              if not counts:
                  break
              word = max(sorted(counts), key=lambda w: counts[w])
              out.append(word)
          return out
    explanation: "A large neural language model does the same job of predicting the next token, with far more context and a learned, smooth probability."
  - id: bpe
    title: Byte-pair encoding
    difficulty: 4
    prompt: |
      Write `learn_bpe(words, merges)` that starts with each word as a list of characters plus the end marker `"</w>"`, and performs up to `merges` merges: count adjacent symbol pairs over all words (each word occurrence counts once, in the order given), merge the most frequent pair (ties go to the lexicographically smallest pair), and stop early if no pair exists or every count is 1 and no pair repeats. Return the list of merged pairs as tuples. Write `encode(word, merge_list)` that applies the merges in order to a word and returns the list of symbols.
    starter: |
      from collections import Counter

      def learn_bpe(words, merges):
          pass

      def encode(word, merge_list):
          pass
    tests:
      - name: learning
        code: |
          words = ["low", "lower", "lowest", "newer", "newest", "wide", "wider", "widest"]
          ms = learn_bpe(words, 4)
          assert len(ms) == 4 and all(isinstance(m, tuple) and len(m) == 2 for m in ms)
          assert learn_bpe(["aaa", "aaa"], 1) == [("a", "a")]
          assert learn_bpe([], 5) == []
          assert learn_bpe(["ab"], 10) == []
      - name: encoding
        code: |
          ms = [("l", "o"), ("lo", "w")]
          assert encode("low", ms) == ["low", "</w>"]
          assert encode("lowest", ms) == ["low", "e", "s", "t", "</w>"]
          assert encode("xyz", ms) == ["x", "y", "z", "</w>"]
          ms2 = learn_bpe(["low", "low", "lower"], 3)
          assert ms2[0] == ("l", "o") and ms2[1] == ("lo", "w")
          assert encode("low", ms2) == ["low</w>"]
    hints:
      - "Choose the best pair with `max(sorted(counts), key=lambda p: counts[p])`. Stop when the best count is 1 (nothing repeats)."
    solution: |
      from collections import Counter


      def _apply(symbols, pair):
          out, i = [], 0
          while i < len(symbols):
              if i + 1 < len(symbols) and (symbols[i], symbols[i + 1]) == pair:
                  out.append(symbols[i] + symbols[i + 1])
                  i += 2
              else:
                  out.append(symbols[i])
                  i += 1
          return out


      def learn_bpe(words, merges):
          corpus = [list(w) + ["</w>"] for w in words]
          learned = []
          for _ in range(merges):
              counts = Counter()
              for word in corpus:
                  for pair in zip(word, word[1:]):
                      counts[pair] += 1
              if not counts:
                  break
              best = max(sorted(counts), key=lambda p: counts[p])
              if counts[best] < 2:
                  break
              learned.append(best)
              corpus = [_apply(w, best) for w in corpus]
          return learned


      def encode(word, merge_list):
          symbols = list(word) + ["</w>"]
          for pair in merge_list:
              symbols = _apply(symbols, pair)
          return symbols
    explanation: "BPE gives a compact vocabulary that can spell any word, which is why LLMs rarely meet an 'unknown' word."
  - id: cosine
    title: Embeddings and cosine similarity
    difficulty: 3
    prompt: |
      Write `cosine(a, b)` (return `0.0` if either vector has zero length), and `most_similar(query, embeddings, exclude=())` returning the word whose vector has the highest cosine with `query`, ignoring words in `exclude` (ties go to the alphabetically first). Write `analogy(emb, a, b, c)` returning the closest word to `emb[b] - emb[a] + emb[c]`, excluding `a`, `b` and `c` (so `analogy(emb, "man", "king", "woman")` should give `"queen"`).
    starter: |
      import math

      def cosine(a, b):
          pass

      def most_similar(query, embeddings, exclude=()):
          pass

      def analogy(emb, a, b, c):
          pass
    tests:
      - name: cosine
        code: |
          assert abs(cosine([1, 0], [0, 1])) < 1e-12
          assert abs(cosine([1, 2], [2, 4]) - 1) < 1e-12
          assert abs(cosine([1, 0], [-1, 0]) + 1) < 1e-12
          assert cosine([0, 0], [1, 1]) == 0.0
      - name: search
        code: |
          emb = {"king": [0.9, 0.9, 0.7], "queen": [0.9, 0.1, 0.7], "man": [0.1, 0.9, 0.6],
                 "woman": [0.1, 0.1, 0.6], "prince": [0.8, 0.9, 0.2], "apple": [0.0, 0.5, 0.0]}
          assert most_similar(emb["king"], emb, exclude=("king",)) == "prince"
          assert most_similar([0.0, 1.0, 0.0], emb) == "apple"
          assert analogy(emb, "man", "king", "woman") == "queen"
          assert most_similar([1, 1], {"b": [1, 1], "a": [2, 2]}) == "a"
    hints:
      - "Build the query vector with a list comprehension over `zip(emb[b], emb[a], emb[c])`."
    solution: |
      import math


      def cosine(a, b):
          na = math.sqrt(sum(x * x for x in a))
          nb = math.sqrt(sum(x * x for x in b))
          if na == 0 or nb == 0:
              return 0.0
          return sum(x * y for x, y in zip(a, b)) / (na * nb)


      def most_similar(query, embeddings, exclude=()):
          words = sorted(w for w in embeddings if w not in exclude)
          return max(words, key=lambda w: cosine(query, embeddings[w]))


      def analogy(emb, a, b, c):
          target = [y - x + z for x, y, z in zip(emb[a], emb[b], emb[c])]
          return most_similar(target, emb, exclude=(a, b, c))
    explanation: "Searching by meaning instead of by exact keywords is one of the most useful applications of embeddings."
