id: u17-modern
title: "Language Models, Attention and Responsible AI"
minutes: 70
objective: |
  Finish Unit 17 by looking at how today's AI systems work and how to use them responsibly. You will build a tiny language model, split text into tokens with byte-pair encoding, represent meaning with embedding vectors and cosine similarity, compute attention, and measure fairness. You will also consider the safety, privacy, security and social questions that come with powerful learning systems.
outcomes:
  - Build and sample from an n-gram language model and explain perplexity
  - Describe tokenisation, embeddings and how cosine similarity measures meaning
  - Compute scaled dot-product attention and explain its role in transformers
  - Describe how large language models are trained and what they can and cannot do
  - Measure fairness with simple metrics and discuss bias, privacy, security and safety in AI systems

sections:
  - heading: Language models
    body: |
      A **language model** assigns probabilities to text: given the words so far, how likely is each possible next word? Predictive text on your phone is one. The simplest is an **n-gram** model, counting how often each word follows the previous n - 1 words in a large body of text; a **bigram** (n = 2) model estimates P(next | previous) = count(previous, next) / count(previous). This is a Markov chain over words (Lesson 17.3). To **generate** text, repeatedly sample the next word from this distribution, or always take the most likely one (**greedy** decoding). The output is locally plausible but quickly loses the thread, because the model sees only one or two words of context.

      We judge a language model by **perplexity**: roughly, how many equally likely words the model is torn between at each step; formally, the exponential of the average negative log-probability of the real text, **exp(-(1/N) Σ log P(wᵢ | context))**. Lower is better. A model that spreads probability over 100 words evenly has perplexity 100. Words never seen after a given context get probability zero, which would make perplexity infinite, so we **smooth** (Lesson 17.3) or back off to shorter contexts. Neural language models replace counting with a network that reads a long context and can generalise to word combinations it has never seen.

  - heading: Tokens and embeddings
    body: |
      Models do not read letters or words directly but **tokens**, pieces of text drawn from a fixed vocabulary of tens of thousands of items. **Byte-pair encoding (BPE)** builds the vocabulary from data: start with single characters, then repeatedly find the most frequent adjacent pair of symbols and **merge** it into a new symbol. Common words become single tokens ("the"), common pieces become tokens ("ing", "un"), and rare words are spelled from smaller parts, so any text can be encoded. Tokens are then mapped to integers.

      Each token is turned into an **embedding**: a list of numbers (a vector, perhaps 768 or 12,000 long) learned during training so that tokens used in similar contexts get **similar vectors**. "Cat" and "dog" end up near each other, far from "algebra". Similarity is measured by the **cosine** of the angle between vectors: **cos(a, b) = a·b / (|a| |b|)**, which is 1 for the same direction, 0 for unrelated (perpendicular) and -1 for opposite. Embeddings capture regularities as directions: the famous example is that the vector for "king" minus "man" plus "woman" lands near "queen". The same idea embeds sentences, images and users, and powers **semantic search** (find documents whose embeddings are close to the query's) and recommendation.

  - heading: Attention, transformers and large language models
    body: |
      To use context well a model must decide which earlier words matter for the current one: in "The trophy didn't fit in the suitcase because **it** was too big", what does "it" refer to? **Attention** computes this. Each position produces a **query** vector q, a **key** vector k and a **value** vector v. A position compares its query with every key by dot product, divides by √d (d is the vector length, to keep numbers well behaved), turns the scores into weights with **softmax** (Lesson 17.7), and returns the **weighted average of the values**: **Attention(Q, K, V) = softmax(Q Kᵀ / √d) V**. High weight means "this word is relevant to me". The **transformer** (Vaswani et al., "Attention Is All You Need", 2017) stacks many layers of attention and ordinary feed-forward networks, runs several attention "heads" in parallel, and, unlike recurrent networks, processes all positions at once, which suits GPUs and allowed training at enormous scale.

      A **large language model (LLM)** is a transformer with billions of parameters trained on a huge part of the public text to **predict the next token**. This **pre-training** is **self-supervised**: the text supplies its own labels. The base model is then **fine-tuned** on examples of following instructions, and often refined with **reinforcement learning from human feedback (RLHF)**, where people rank answers, a reward model learns their preferences, and the LLM is trained (Lesson 17.8) to produce preferred answers. At use time the model generates one token at a time, sampling from its predicted distribution; a **temperature** setting controls randomness (low is more predictable, high is more varied). LLMs can write, summarise, translate and write code, but they have limits you must understand: they can **hallucinate** (state falsehoods fluently, because they model what text looks like, not what is true), reflect **biases** in their training text, have a fixed **context window**, may **leak or memorise** training data, and can be manipulated by **prompt injection** (hidden instructions in the text they read, an injection attack like those in Unit 16). Treat their output as a draft to verify, not as an authority.

  - heading: Responsible AI
    body: |
      Learning systems act on real people, so building them carries obligations. **Bias**: a model trained on historical data copies its patterns. Hiring tools trained on past hires have downgraded women, face recognition has been far less accurate on darker skin, and risk scores have flagged some groups more often. Bias enters through unrepresentative data, labels that encode human prejudice, proxy features (a postcode can stand in for race), and how the problem is framed. **Fairness** has several measurable meanings that cannot all hold at once: **demographic parity** (the same share of each group receives the positive outcome), **equal opportunity** (the same true-positive rate for each group among those who truly qualify), and **calibration** (a predicted 70% means 70% in every group). Choosing among them is a judgement about values, not just mathematics. We audit by computing metrics per group (Lesson 17.4) and by examining errors.

      Other concerns. **Privacy**: models can memorise and reveal personal data, and training sets scraped from the web raise consent and copyright questions; techniques such as **differential privacy** and **federated learning** help (Lesson 16.9). **Security**: **adversarial examples** are inputs altered by tiny, often invisible changes that flip a model's answer, **data poisoning** corrupts training data, and **model extraction** steals a model through queries. **Transparency and explainability**: for high-stakes decisions people deserve reasons, so use simple models or tools that show which features drove a prediction. **Accountability and human oversight**: keep a person responsible, test before deploying, monitor afterwards, and be honest about error rates. **Safety and alignment**: ensure systems pursue the goals we actually intend (Lesson 17.8). **Wider effects**: energy use, labour, misinformation and deepfakes, concentration of power, and laws such as the EU AI Act that regulate by level of risk. The professional codes mentioned in Lesson 16.9 apply: avoid harm, be honest, respect privacy, and think about who is affected before you build, not only after something goes wrong.

examples:
  - title: A bigram language model
    intro: "Count which word follows which. Then generate text and measure how well the model predicts held-out text."
    code: |
      import math
      from collections import Counter, defaultdict

      text = ("the cat sat on the mat . the dog sat on the log . "
              "the cat saw the dog . the dog saw the cat . the cat sat on the log .").split()

      follow = defaultdict(Counter)
      for a, b in zip(text, text[1:]):
          follow[a][b] += 1

      def prob(a, b):
          return follow[a][b] / sum(follow[a].values())

      print("P(sat | cat) =", round(prob("cat", "sat"), 3), " P(saw | cat) =", round(prob("cat", "saw"), 3))
      print("after 'the':", dict(follow["the"]))

      word, out = "the", ["the"]
      for _ in range(9):
          word = follow[word].most_common(1)[0][0]       # greedy decoding
          out.append(word)
      print("greedy:", " ".join(out))

      test = "the dog sat on the mat".split()
      logp = sum(math.log(prob(a, b)) for a, b in zip(test, test[1:]))
      print("perplexity of the test sentence:", round(math.exp(-logp / (len(test) - 1)), 2))
    output: |
      P(sat | cat) = 0.5  P(saw | cat) = 0.25
      after 'the': {'cat': 4, 'mat': 1, 'dog': 3, 'log': 2}
      greedy: the cat sat on the cat sat on the cat
      perplexity of the test sentence: 2.51
    lines:
      - line: 12
        note: "A conditional probability estimated from counts."
      - line: 20
        note: "Always taking the most likely word quickly falls into a loop. Real systems sample, with a temperature."
      - line: 26
        note: "Perplexity: lower means the model finds the text less surprising."
  - title: Byte-pair encoding
    intro: "Start from characters, merge the most frequent pair, repeat. Watch the vocabulary grow common pieces."
    code: |
      from collections import Counter

      words = ["low", "lower", "lowest", "newer", "newest", "wide", "wider", "widest"]
      corpus = [list(w) + ["</w>"] for w in words]

      def pair_counts(corpus):
          c = Counter()
          for word in corpus:
              for pair in zip(word, word[1:]):
                  c[pair] += 1
          return c

      def merge(corpus, pair):
          merged = pair[0] + pair[1]
          out = []
          for word in corpus:
              new, i = [], 0
              while i < len(word):
                  if i + 1 < len(word) and (word[i], word[i + 1]) == pair:
                      new.append(merged)
                      i += 2
                  else:
                      new.append(word[i])
                      i += 1
              out.append(new)
          return out

      for step in range(1, 8):
          counts = pair_counts(corpus)
          best = max(sorted(counts), key=lambda p: counts[p])
          corpus = merge(corpus, best)
          print(step, "merge", best, "x", counts[best])
      print([" ".join(w) for w in corpus])
    output: |
      1 merge ('w', 'e') x 4
      2 merge ('d', 'e') x 3
      3 merge ('i', 'de') x 3
      4 merge ('l', 'o') x 3
      5 merge ('r', '</w>') x 3
      6 merge ('s', 't') x 3
      7 merge ('st', '</w>') x 3
      ['lo w </w>', 'lo we r</w>', 'lo we st</w>', 'n e we r</w>', 'n e we st</w>', 'w ide </w>', 'w ide r</w>', 'w ide st</w>']
    lines:
      - line: 28
        note: "Pick the most frequent pair; sorting first makes ties deterministic."
      - line: 32
        note: "The most frequent pairs ('we', 'ide', 'lo', 'st</w>') merge first. With many more merges, whole common words and endings would become single tokens."
  - title: Embeddings and cosine similarity
    intro: "Hand-made three-dimensional vectors (royalty, gender, age-ish). Real embeddings are learned and have hundreds of dimensions."
    code: |
      import math

      emb = {
          "king":   [0.9, 0.9, 0.7],
          "queen":  [0.9, 0.1, 0.7],
          "man":    [0.1, 0.9, 0.6],
          "woman":  [0.1, 0.1, 0.6],
          "prince": [0.8, 0.9, 0.2],
          "apple":  [0.0, 0.5, 0.0],
      }

      def cos(a, b):
          dot = sum(x * y for x, y in zip(a, b))
          return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

      def nearest(vec, exclude=()):
          return max((w for w in emb if w not in exclude), key=lambda w: cos(vec, emb[w]))

      print("cos(king, queen)  =", round(cos(emb["king"], emb["queen"]), 3))
      print("cos(king, apple)  =", round(cos(emb["king"], emb["apple"]), 3))
      analogy = [k - m + w for k, m, w in zip(emb["king"], emb["man"], emb["woman"])]
      print("king - man + woman is closest to:", nearest(analogy, exclude=("king", "man", "woman")))
    output: |
      cos(king, queen)  = 0.836
      cos(king, apple)  = 0.62
      king - man + woman is closest to: queen
    lines:
      - line: 14
        note: "Cosine compares direction and ignores length."
      - line: 25
        note: "Vector arithmetic captures the relation: swapping the gender component of king gives queen."
  - title: Scaled dot-product attention
    intro: "Three tokens with 2-dimensional queries, keys and values. Each output is a weighted average of the values."
    code: |
      import math

      def softmax(scores):
          m = max(scores)
          e = [math.exp(s - m) for s in scores]
          t = sum(e)
          return [x / t for x in e]

      def attention(Q, K, V):
          d = len(K[0])
          outputs, weights = [], []
          for q in Q:
              scores = [sum(a * b for a, b in zip(q, k)) / math.sqrt(d) for k in K]
              w = softmax(scores)
              out = [sum(w[i] * V[i][j] for i in range(len(V))) for j in range(len(V[0]))]
              weights.append([round(x, 3) for x in w])
              outputs.append([round(x, 3) for x in out])
          return outputs, weights

      K = [[1, 0], [0, 1], [1, 1]]
      V = [[10, 0], [0, 10], [5, 5]]
      Q = [[3, 0], [0, 3], [1, 1]]
      outs, ws = attention(Q, K, V)
      for q, w, o in zip(Q, ws, outs):
          print("query", q, "weights", w, "-> output", o)
    output: |
      query [3, 0] weights [0.472, 0.057, 0.472] -> output [7.076, 2.924]
      query [0, 3] weights [0.057, 0.472, 0.472] -> output [2.924, 7.076]
      query [1, 1] weights [0.248, 0.248, 0.503] -> output [5.0, 5.0]
    lines:
      - line: 12
        note: "Dot product of the query with every key, divided by the square root of the dimension."
      - line: 14
        note: "The output is the weighted mix of the values."
      - line: 25
        note: "A query like [3, 0] matches the first key most, so its output is dominated by the first value."
  - title: Auditing a model for fairness
    intro: "Loan decisions for two groups. Compare the rate of approval and the true-positive rate per group."
    code: |
      # (group, truly_creditworthy, model_approved)
      people = ([("A", 1, 1)] * 40 + [("A", 1, 0)] * 10 + [("A", 0, 1)] * 10 + [("A", 0, 0)] * 40 +
                [("B", 1, 1)] * 24 + [("B", 1, 0)] * 26 + [("B", 0, 1)] * 6 + [("B", 0, 0)] * 44)

      def rates(group):
          rows = [(y, p) for g, y, p in people if g == group]
          approval = sum(p for _, p in rows) / len(rows)
          tpr = sum(p for y, p in rows if y == 1) / sum(y for y, _ in rows)
          fpr = sum(p for y, p in rows if y == 0) / sum(1 - y for y, _ in rows)
          return approval, tpr, fpr

      for g in "AB":
          a, t, f = rates(g)
          print(f"group {g}: approval rate {a:.2f}, true-positive rate {t:.2f}, false-positive rate {f:.2f}")
      print("demographic parity gap:", round(abs(rates("A")[0] - rates("B")[0]), 2))
      print("equal opportunity gap :", round(abs(rates("A")[1] - rates("B")[1]), 2))
    output: |
      group A: approval rate 0.50, true-positive rate 0.80, false-positive rate 0.20
      group B: approval rate 0.30, true-positive rate 0.48, false-positive rate 0.12
      demographic parity gap: 0.2
      equal opportunity gap : 0.32
    lines:
      - line: 7
        note: "Approval rate looks only at the decisions. The true-positive rate asks: of the people who deserved approval, how many got it?"
      - line: 15
        note: "Qualified applicants in group B are approved far less often (0.48 against 0.80): an equal-opportunity failure that a single overall accuracy number would hide."
  - title: An adversarial example
    intro: "A tiny, carefully directed change to the input flips a linear classifier's decision from negative to positive."
    code: |
      w = [2.0, -3.0, 1.0, 0.5, -1.0, 2.5, -2.0, 1.5]
      b = -0.5

      def score(x):
          return sum(wi * xi for wi, xi in zip(w, x)) + b

      x = [0.2, 0.1, 0.4, 0.3, 0.2, 0.1, 0.3, 0.2]
      print("original score:", round(score(x), 3), "->", "positive" if score(x) > 0 else "negative")

      eps = 0.1
      # move every feature by eps in the direction that raises the score: along the sign of its weight
      adv = [xi + eps * (1 if wi > 0 else -1) for wi, xi in zip(w, x)]
      print("max change to any feature:", round(max(abs(a - o) for a, o in zip(adv, x)), 3))
      print("adversarial score:", round(score(adv), 3), "->", "positive" if score(adv) > 0 else "negative")
    output: |
      original score: -0.1 -> negative
      max change to any feature: 0.1
      adversarial score: 1.25 -> positive
    lines:
      - line: 13
        note: "Every feature changes by only 0.1, but the changes all push the same way, so they add up."
      - line: 15
        note: "In high dimensions (thousands of pixels) tiny coordinated changes can flip a decision while the image looks unchanged to a person."

