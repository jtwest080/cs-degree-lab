  - type: code
    question: |
      Write `cos_sim(a, b)` returning the cosine similarity of two non-zero vectors given as lists.
    starter: |
      import math

      def cos_sim(a, b):
          pass
    tests:
      - name: cosine
        code: |
          assert abs(cos_sim([1, 0], [1, 1]) - 0.7071067811865475) < 1e-12
          assert abs(cos_sim([2, 0], [5, 0]) - 1) < 1e-12
    solution: |
      import math


      def cos_sim(a, b):
          return sum(x * y for x, y in zip(a, b)) / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))
