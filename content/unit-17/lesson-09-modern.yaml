          pass
    tests:
      - name: softmax
        code: |
          s = softmax([1, 2, 3])
          assert abs(sum(s) - 1) < 1e-12 and s[2] > s[1] > s[0]
          assert softmax([5]) == [1.0]
          assert abs(sum(softmax([1000, 1000])) - 1) < 1e-12
      - name: attention
        code: |
          K = [[1, 0], [0, 1], [1, 1]]
          V = [[10, 0], [0, 10], [5, 5]]
          outs, ws = attention([[3, 0], [0, 3], [1, 1]], K, V)
          assert all(abs(sum(w) - 1) < 1e-12 for w in ws)
          assert [round(x, 3) for x in ws[0]] == [0.539, 0.063, 0.397] or abs(ws[0][0] - max(ws[0])) < 1e-12
          assert outs[0][0] > outs[0][1] and outs[1][1] > outs[1][0]
          assert abs(outs[2][0] - outs[2][1]) < 1e-9
          o, w = attention([[0, 0]], K, V)
          assert all(abs(x - 1 / 3) < 1e-12 for x in w[0])
          assert abs(o[0][0] - 5.0) < 1e-9
    hints:
      - "Each output coordinate is `sum(w[i] * V[i][j] for i in range(len(V)))`."
    solution: |
      import math


      def softmax(scores):
          m = max(scores)
          e = [math.exp(s - m) for s in scores]
          t = sum(e)
          return [x / t for x in e]


      def attention(Q, K, V):
          d = len(K[0])
          outputs, weights = [], []
          for q in Q:
              scores = [sum(a * b for a, b in zip(q, k)) / math.sqrt(d) for k in K]
              w = softmax(scores)
              outputs.append([sum(w[i] * V[i][j] for i in range(len(V))) for j in range(len(V[0]))])
              weights.append(w)
          return outputs, weights
    explanation: "Transformers run this computation (with learned projections to make Q, K and V) in every layer, for every token, in parallel."
  - id: fairness
    title: Fairness metrics
    difficulty: 4
    prompt: |
      `records` is a list of `(group, y_true, y_pred)` with labels 0/1. Write `group_rates(records)` returning a dict mapping each group to `{"approval": ..., "tpr": ..., "fpr": ...}`: the share predicted 1, the true-positive rate (among `y_true == 1`) and the false-positive rate (among `y_true == 0`); use `0.0` if a denominator is 0. Write `parity_gap(rates)` (largest minus smallest approval rate) and `opportunity_gap(rates)` (largest minus smallest TPR).
    starter: |
      def group_rates(records):
          pass

      def parity_gap(rates):
          pass

      def opportunity_gap(rates):
          pass
    tests:
      - name: rates
        code: |
          recs = ([("A", 1, 1)] * 40 + [("A", 1, 0)] * 10 + [("A", 0, 1)] * 10 + [("A", 0, 0)] * 40 +
                  [("B", 1, 1)] * 24 + [("B", 1, 0)] * 26 + [("B", 0, 1)] * 6 + [("B", 0, 0)] * 44)
          r = group_rates(recs)
          assert r["A"] == {"approval": 0.5, "tpr": 0.8, "fpr": 0.2}
          assert abs(r["B"]["approval"] - 0.3) < 1e-12 and abs(r["B"]["tpr"] - 0.48) < 1e-12 and abs(r["B"]["fpr"] - 0.12) < 1e-12
      - name: gaps
        code: |
          rates = {"A": {"approval": 0.5, "tpr": 0.8, "fpr": 0.2}, "B": {"approval": 0.3, "tpr": 0.48, "fpr": 0.12}, "C": {"approval": 0.4, "tpr": 0.9, "fpr": 0.1}}
          assert abs(parity_gap(rates) - 0.2) < 1e-12
          assert abs(opportunity_gap(rates) - 0.42) < 1e-12
          assert group_rates([("X", 0, 0)]) == {"X": {"approval": 0.0, "tpr": 0.0, "fpr": 0.0}}
          assert parity_gap({"A": {"approval": 0.5, "tpr": 0, "fpr": 0}}) == 0
    hints:
      - "Collect per-group lists first, then compute each rate with a zero-denominator guard."
    solution: |
      def group_rates(records):
          groups = {}
          for g, y, p in records:
              groups.setdefault(g, []).append((y, p))
          out = {}
          for g, rows in groups.items():
              pos = [p for y, p in rows if y == 1]
              neg = [p for y, p in rows if y == 0]
              out[g] = {"approval": sum(p for _, p in rows) / len(rows),
                        "tpr": sum(pos) / len(pos) if pos else 0.0,
                        "fpr": sum(neg) / len(neg) if neg else 0.0}
          return out


      def parity_gap(rates):
          vals = [r["approval"] for r in rates.values()]
          return max(vals) - min(vals)


      def opportunity_gap(rates):
          vals = [r["tpr"] for r in rates.values()]
          return max(vals) - min(vals)
    explanation: "These gaps are diagnostics, not verdicts. Deciding which fairness definition applies, and how to fix a gap, takes people who understand the context."

commonMistakes:
  - title: "Trusting a language model's fluent answer"
    explanation: "LLMs can hallucinate. Verify facts and treat output as a draft."
  - title: "Reporting only overall accuracy"
    explanation: "Break results down by group and error type to find hidden unfairness."
  - title: "Assuming that removing the sensitive column removes bias"
    explanation: "Other features (postcode, school) can act as proxies."
  - title: "Putting private or confidential data into a public AI tool"
    explanation: "Inputs may be stored or used for training. Follow your organisation's rules."
  - title: "Comparing raw embedding dot products when vectors have different lengths"
    explanation: "Use cosine similarity, which compares direction only."

summary:
  - "A language model predicts the next token; n-gram models count, neural models learn, and perplexity measures prediction quality."
  - "Tokens come from schemes like BPE; embeddings place similar tokens close together, compared with cosine similarity."
  - "Attention mixes value vectors by query-key similarity; transformers stack attention layers and power LLMs trained on next-token prediction, instruction tuning and human feedback."
  - "LLMs can hallucinate, reflect bias and be manipulated, so outputs need verification."
  - "Responsible AI means auditing fairness, protecting privacy and security, explaining decisions, keeping humans accountable and considering wider effects."
