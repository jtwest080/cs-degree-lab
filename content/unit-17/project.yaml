title: Mini AI Toolkit
language: python
brief: |-
  You will build a small **AI toolkit**: one tool from each major idea in the unit, all in one file, using only the Python standard library.

  1. `shortest_path(grid)` solves a maze of `S`, `G`, `.` and `#` with **A\*** (Lesson 17.1), moving up, down, left and right at cost 1, with the Manhattan distance to `G` as the heuristic. Return `(steps, expanded)`: the shortest number of steps (or `-1` if the goal cannot be reached) and the number of states you took from the priority queue and expanded (skip stale entries). Order the heap by `(f, g, row, col)`.
  2. `best_move(board, player)` plays **tic-tac-toe** perfectly with minimax (Lesson 17.2). Boards are 9-character strings of `"X"`, `"O"` and `" "`. Return the index of the best move for `player` (X maximises, O minimises, with utility +1 for an X win, -1 for an O win and 0 for a draw); ties go to the lowest index. Memoise positions.
  3. `train_bayes(examples)` and `predict_bayes(model, text)` build a **naive Bayes** classifier (Lesson 17.3) from `(text, label)` pairs, using add-one smoothing and log-probabilities. Words outside the training vocabulary are ignored; ties go to the alphabetically first label.
  4. `fit_linear(X, y, lr, steps)` trains **linear regression** by batch gradient descent from zero weights (Lesson 17.5) and returns `(weights, bias)`; `predict_row(model, row)` applies it.
  5. `kmeans(points, k, max_iter=100)` clusters points (Lesson 17.8). Start from the first `k` points, assign each point to the nearest centroid (lowest index on ties), recompute centroids as means (an empty cluster keeps its centroid) and stop when assignments stop changing. Return `(centroids, assignment)`. `inertia(points, centroids, assignment)` is the sum of squared distances to the assigned centroids.
  6. `train_network(data, hidden=3, epochs=4000, lr=1.0, seed=1)` trains a **neural network** (Lesson 17.7) with two inputs, one hidden layer of sigmoid units and one sigmoid output using backpropagation and full-batch gradient descent on squared error. Initialise every weight with `random.Random(seed).uniform(-1, 1)` (biases start at 0). Return a function `predict(x)` that gives the output probability for a 2-tuple.
steps:
- title: A* is uniform-cost search plus a guess
  body: |-
    Keep a dictionary of the best known cost to each cell and a heap of `(f, g, row, col)`. When you pop an entry whose `g` is worse than the best known, it is stale: skip it without counting it. The heuristic never overestimates, so the first time you pop the goal its cost is optimal (Lesson 17.1).
- title: Minimax with a dictionary
  body: |-
    A helper `value(board, turn)` returns +1, 0 or -1 for perfect play. X takes the maximum over its moves, O the minimum. Cache by `(board, turn)`. To choose a move, evaluate each empty square and keep the best, using strictly-better comparisons so the lowest index wins ties (Lesson 17.2).
- title: Count, smooth, add logs
  body: |-
    Count labels and the words of each label, and collect the vocabulary. The log-score of a label is `log(P(label))` plus, for each known word, `log((count + 1) / (total_words_in_label + vocabulary_size))` (Lesson 17.3).
- title: Gradients from the same errors
  body: |-
    Compute all errors `prediction - target` first, then update every weight and the bias from them in one go (Lesson 17.5). Remember that zero steps must return zero weights.
- title: Two alternating steps
  body: |-
    Assign, then update, until the assignment list is unchanged. `min(range(k), key=...)` gives the lowest index on ties (Lesson 17.8).
- title: Backpropagation by hand
  body: |-
    For each example do a forward pass keeping the hidden activations, compute `d_out = 2*(p-y)*p*(1-p)`, then each hidden unit's `d_h = d_out * W2[j] * h[j] * (1-h[j])`. Add up gradients over the data, divide by the number of examples, and update (Lesson 17.7).
