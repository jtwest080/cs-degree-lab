solution: |
  import heapq, math, random
  from collections import Counter


  # ---------- 1. A* search ----------
  def shortest_path(grid):
      start = goal = None
      for r, row in enumerate(grid):
          for c, ch in enumerate(row):
              if ch == "S":
                  start = (r, c)
              elif ch == "G":
                  goal = (r, c)

      def h(p):
          return abs(p[0] - goal[0]) + abs(p[1] - goal[1])

      best = {start: 0}
      heap = [(h(start), 0, start[0], start[1])]
      expanded = 0
      while heap:
          f, g, r, c = heapq.heappop(heap)
          if g > best[(r, c)]:
              continue
          expanded += 1
          if (r, c) == goal:
              return g, expanded
          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
              nr, nc = r + dr, c + dc
              if 0 <= nr < len(grid) and 0 <= nc < len(grid[nr]) and grid[nr][nc] != "#":
                  ng = g + 1
                  if ng < best.get((nr, nc), 10 ** 9):
                      best[(nr, nc)] = ng
                      heapq.heappush(heap, (ng + h((nr, nc)), ng, nr, nc))
      return -1, expanded


  # ---------- 2. Game playing ----------
  LINES = [(0, 1, 2), (3, 4, 5), (6, 7, 8), (0, 3, 6), (1, 4, 7), (2, 5, 8), (0, 4, 8), (2, 4, 6)]
  _memo = {}


  def _winner(b):
      for i, j, k in LINES:
          if b[i] != " " and b[i] == b[j] == b[k]:
              return b[i]
      return None


  def _value(b, turn):
      key = (b, turn)
      if key in _memo:
          return _memo[key]
      w = _winner(b)
      if w:
          r = 1 if w == "X" else -1
      elif " " not in b:
          r = 0
      else:
          nxt = "O" if turn == "X" else "X"
          vals = [_value(b[:i] + turn + b[i + 1:], nxt) for i in range(9) if b[i] == " "]
          r = max(vals) if turn == "X" else min(vals)
      _memo[key] = r
      return r


  def best_move(board, player):
      nxt = "O" if player == "X" else "X"
      best_i, best_v = None, None
      for i in range(9):
          if board[i] != " ":
              continue
          v = _value(board[:i] + player + board[i + 1:], nxt)
          better = best_v is None or (v > best_v if player == "X" else v < best_v)
          if better:
              best_i, best_v = i, v
      return best_i


  # ---------- 3. Naive Bayes ----------
  def train_bayes(examples):
      labels = Counter(label for _, label in examples)
      words = {l: Counter() for l in labels}
      for text, label in examples:
          words[label].update(text.split())
      vocab = {w for c in words.values() for w in c}
      return {"labels": labels, "words": words, "vocab": vocab, "n": len(examples)}


  def predict_bayes(model, text):
      def score(label):
          s = math.log(model["labels"][label] / model["n"])
          total = sum(model["words"][label].values())
          for w in text.split():
              if w in model["vocab"]:
                  s += math.log((model["words"][label][w] + 1) / (total + len(model["vocab"])))
          return s
      return max(sorted(model["labels"]), key=score)


  # ---------- 4. Linear regression ----------
  def fit_linear(X, y, lr, steps):
      n, d = len(X), len(X[0])
      w = [0.0] * d
      b = 0.0
      for _ in range(steps):
          errs = [sum(wj * xj for wj, xj in zip(w, row)) + b - t for row, t in zip(X, y)]
          grads = [2 * sum(e * row[j] for e, row in zip(errs, X)) / n for j in range(d)]
          w = [wj - lr * g for wj, g in zip(w, grads)]
          b -= lr * 2 * sum(errs) / n
      return w, b


  def predict_row(model, row):
      w, b = model
      return sum(wj * xj for wj, xj in zip(w, row)) + b


  # ---------- 5. k-means ----------
  def kmeans(points, k, max_iter=100):
      centroids = [tuple(p) for p in points[:k]]
      assign = None
      for _ in range(max_iter):
          new = [min(range(k), key=lambda c: math.dist(p, centroids[c])) for p in points]
          if new == assign:
              break
          assign = new
          for c in range(k):
              members = [p for p, a in zip(points, assign) if a == c]
              if members:
                  centroids[c] = tuple(sum(v) / len(members) for v in zip(*members))
      return centroids, assign


  def inertia(points, centroids, assignment):
      return sum(math.dist(p, centroids[a]) ** 2 for p, a in zip(points, assignment))


  # ---------- 6. Neural network ----------

  def _sigmoid(z):
      return 1 / (1 + math.exp(-z))


  def train_network(data, hidden=3, epochs=4000, lr=1.0, seed=1):
      """data: list of ((x1, x2), label). Returns a function predict(x) giving a probability."""
      rng = random.Random(seed)
      H = hidden
      W1 = [[rng.uniform(-1, 1) for _ in range(2)] for _ in range(H)]
      b1 = [0.0] * H
      W2 = [rng.uniform(-1, 1) for _ in range(H)]
      b2 = 0.0

      def forward(x):
          h = [_sigmoid(sum(w * xi for w, xi in zip(W1[j], x)) + b1[j]) for j in range(H)]
          return h, _sigmoid(sum(W2[j] * h[j] for j in range(H)) + b2)

      n = len(data)
      for _ in range(epochs):
          gW1 = [[0.0, 0.0] for _ in range(H)]
          gb1 = [0.0] * H
          gW2 = [0.0] * H
          gb2 = 0.0
          for x, y in data:
              h, p = forward(x)
              d_out = 2 * (p - y) * p * (1 - p)
              gb2 += d_out
              for j in range(H):
                  gW2[j] += d_out * h[j]
                  d_h = d_out * W2[j] * h[j] * (1 - h[j])
                  gb1[j] += d_h
                  for i in range(2):
                      gW1[j][i] += d_h * x[i]
          for j in range(H):
              W2[j] -= lr * gW2[j] / n
              b1[j] -= lr * gb1[j] / n
              for i in range(2):
                  W1[j][i] -= lr * gW1[j][i] / n
          b2 -= lr * gb2 / n
      return lambda x: forward(x)[1]
stretch:
- Add alpha-beta pruning to `best_move` and count how many positions it saves (Lesson 17.2).
- Add `evaluate(model, data)` returning accuracy, precision, recall and F1 for any classifier, and use it with a train/test split and cross-validation (Lesson 17.4).
- Add k-nearest neighbours and a decision tree to the toolkit and compare all three on a data set you generate yourself (Lessons 17.4 and 17.6).
- Add an epsilon-greedy Q-learning agent for the corridor and plot (print) its learning curve (Lesson 17.8).
- Write a short note on one fairness or safety risk of using your classifier in a real product, and one test that would reveal it (Lesson 17.9).
