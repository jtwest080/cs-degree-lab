# Terms introduced in Unit 18 (Capstones). `lesson` is the id of the lesson that introduces the term.
terms:
  - term: "Capstone project"
    definition: "A larger project that combines ideas from many earlier topics."
    lesson: u18-planning
  - term: "Milestone"
    definition: "A checkpoint that marks a meaningful, finished piece of work."
    lesson: u18-planning
  - term: "PERT estimate"
    definition: "A three-point estimate (optimistic, most likely, pessimistic) combined as (o + 4m + p) / 6."
    lesson: u18-planning
  - term: "Priority queue backlog"
    definition: "A backlog kept in a heap so the most important item comes out first."
    lesson: u18-planning
  - term: "Conventional commit"
    definition: "A commit message with a type prefix such as feat or fix that tools can read."
    lesson: u18-planning
  - term: "Task dependency"
    definition: "A relationship saying one task cannot start until another has finished."
    lesson: u18-planning
  - term: "Risk register"
    definition: "A list of things that might go wrong with how likely and how serious each is."
    lesson: u18-planning
  - term: "Tokenizer"
    definition: "The part of a language tool that splits source text into tokens."
    lesson: u18-interpreter
  - term: "Parser"
    definition: "The part of a language tool that turns tokens into a structured tree."
    lesson: u18-interpreter
  - term: "Abstract syntax tree"
    definition: "A tree that represents the structure of a program without its punctuation."
    lesson: u18-interpreter
  - term: "Recursive descent"
    definition: "A parsing technique with one function for each grammar rule."
    lesson: u18-interpreter
  - term: "Grammar"
    definition: "A set of rules that says which sequences of tokens form a valid program."
    lesson: u18-interpreter
  - term: "Associativity"
    definition: "The rule for grouping operators of the same precedence, left to right or right to left."
    lesson: u18-interpreter
  - term: "Environment"
    definition: "A table that maps variable names to values while a program runs."
    lesson: u18-interpreter
  - term: "Lexical scope"
    definition: "The rule that a name refers to the variable visible where the code was written."
    lesson: u18-interpreter
  - term: "Domain-specific language"
    definition: "A small language designed for one kind of task."
    lesson: u18-interpreter
  - term: "Step limit"
    definition: "A cap on the number of operations an interpreter will run, to stop infinite loops."
    lesson: u18-interpreter
  - term: "Storage engine"
    definition: "The part of a database that stores, finds and changes data on disk."
    lesson: u18-storage
  - term: "Append-only"
    definition: "A way of writing in which data is only ever added to the end."
    lesson: u18-storage
  - term: "Log replay"
    definition: "Rebuilding state by applying the records of a log from the start."
    lesson: u18-storage
  - term: "Torn write"
    definition: "A write that was cut short by a crash and left a partial record."
    lesson: u18-storage
  - term: "Commit marker"
    definition: "A record that marks the end of a transaction and makes it count."
    lesson: u18-storage
  - term: "Log compaction"
    definition: "Rewriting a log to keep only the records still needed."
    lesson: u18-storage
  - term: "Garbage ratio"
    definition: "The share of a log taken up by records that are no longer needed."
    lesson: u18-storage
  - term: "Secondary index"
    definition: "An extra lookup table that finds records by a field other than the key."
    lesson: u18-storage
  - term: "Snapshot"
    definition: "A saved copy of the whole state used to speed up recovery."
    lesson: u18-storage
  - term: "Request"
    definition: "A message from a client asking a server to do something."
    lesson: u18-webservice
  - term: "Response"
    definition: "A message from a server answering a request."
    lesson: u18-webservice
  - term: "Web framework"
    definition: "A library that routes requests to handlers and handles the common chores of a web service."
    lesson: u18-webservice
  - term: "Path parameter"
    definition: "A variable part of a URL path, such as the id in /notes/42."
    lesson: u18-webservice
  - term: "Handler"
    definition: "A function that handles one kind of request and returns a result."
    lesson: u18-webservice
  - term: "Bearer token"
    definition: "A credential sent in a header that gives access to whoever holds it."
    lesson: u18-webservice
  - term: "Retry-After"
    definition: "A header telling a client how long to wait before trying again."
    lesson: u18-webservice
  - term: "Security headers"
    definition: "Response headers that tell browsers to apply extra protections."
    lesson: u18-webservice
  - term: "Preflight request"
    definition: "A browser's OPTIONS request that asks whether a cross-origin request is allowed."
    lesson: u18-webservice
  - term: "Game engine"
    definition: "The reusable code that holds a game's data and rules, apart from its drawing."
    lesson: u18-game
  - term: "Game state"
    definition: "All the data that describes a game at one moment."
    lesson: u18-game
  - term: "Pure function"
    definition: "A function whose result depends only on its inputs and which changes nothing else."
    lesson: u18-game
  - term: "Turn-based game"
    definition: "A game in which the world changes only when players take turns."
    lesson: u18-game
  - term: "Level data"
    definition: "A description of a game level, often as text or a file."
    lesson: u18-game
  - term: "Enemy AI"
    definition: "The code that decides what a computer-controlled opponent does."
    lesson: u18-game
  - term: "Save file"
    definition: "Data written to storage so a game or program can be resumed later."
    lesson: u18-game
  - term: "Untrusted input"
    definition: "Data that comes from outside the program and might be wrong or hostile."
    lesson: u18-game
  - term: "Procedural generation"
    definition: "Creating content such as levels with an algorithm instead of by hand."
    lesson: u18-game
  - term: "Seed"
    definition: "A starting value that makes a random generator repeat the same sequence."
    lesson: u18-game
  - term: "Determinism"
    definition: "The property that the same inputs always produce the same results."
    lesson: u18-game
  - term: "Solvability"
    definition: "Whether a puzzle or level has at least one solution."
    lesson: u18-game
  - term: "Construction guarantee"
    definition: "Ensuring a property holds by how something is built rather than by checking afterwards."
    lesson: u18-game
  - term: "Data pipeline"
    definition: "A sequence of steps that turns raw data into a form ready for use."
    lesson: u18-ml-pipeline
  - term: "Quoted field"
    definition: "A CSV value in double quotes that may contain commas, quotes or line breaks."
    lesson: u18-ml-pipeline
  - term: "Data cleaning"
    definition: "Fixing or removing wrong, missing or inconsistent values in data."
    lesson: u18-ml-pipeline
  - term: "Imputation"
    definition: "Filling in missing values with estimates such as the median."
    lesson: u18-ml-pipeline
  - term: "Median"
    definition: "The middle value of a sorted list."
    lesson: u18-ml-pipeline
  - term: "One-hot encoding"
    definition: "Representing a category as a list of 0/1 flags, one per possible value."
    lesson: u18-ml-pipeline
  - term: "Baseline model"
    definition: "A very simple model that a real model must beat to be worth using."
    lesson: u18-ml-pipeline
  - term: "Selection rate"
    definition: "The share of a group that a model gives the positive outcome."
    lesson: u18-ml-pipeline
  - term: "Equal opportunity gap"
    definition: "The difference between groups in the true positive rate."
    lesson: u18-ml-pipeline
  - term: "Proxy variable"
    definition: "A feature that is not sensitive itself but is correlated with a sensitive one."
    lesson: u18-ml-pipeline
  - term: "Historical bias"
    definition: "Unfairness in training data that reflects past decisions or society."
    lesson: u18-ml-pipeline
  - term: "Search engine"
    definition: "A system that finds and ranks documents that match a query."
    lesson: u18-search
  - term: "Inverted index"
    definition: "A map from each term to the documents that contain it."
    lesson: u18-search
  - term: "Postings list"
    definition: "The list of documents, and positions, in which a term occurs."
    lesson: u18-search
  - term: "Normalisation"
    definition: "Converting text into a standard form, such as lower case without accents."
    lesson: u18-search
  - term: "Stop word"
    definition: "A very common word, such as the or of, that is usually left out of an index."
    lesson: u18-search
  - term: "Stemming"
    definition: "Reducing a word to a base form by removing endings."
    lesson: u18-search
  - term: "Lemmatisation"
    definition: "Reducing a word to its dictionary form using knowledge of the language."
    lesson: u18-search
  - term: "Phrase query"
    definition: "A query that matches words appearing next to each other in order."
    lesson: u18-search
  - term: "Boolean query"
    definition: "A query that combines words with and, or and not."
    lesson: u18-search
  - term: "Term frequency"
    definition: "How often a term occurs in a document."
    lesson: u18-search
  - term: "Document frequency"
    definition: "The number of documents that contain a term."
    lesson: u18-search
  - term: "Inverse document frequency"
    definition: "A weight that is larger for terms found in fewer documents."
    lesson: u18-search
  - term: "TF-IDF"
    definition: "A score that rewards terms that are frequent in a document but rare overall."
    lesson: u18-search
  - term: "Ranking"
    definition: "Ordering results from most to least relevant."
    lesson: u18-search
  - term: "Autocomplete"
    definition: "Suggesting completions of what a user has typed so far."
    lesson: u18-search
  - term: "Relevance"
    definition: "How well a result answers what the searcher wanted."
    lesson: u18-search
  - term: "API documentation"
    definition: "A description of the public functions and classes a program offers."
    lesson: u18-showcase
  - term: "Doctest"
    definition: "A test taken from examples written in documentation."
    lesson: u18-showcase
  - term: "Changelog"
    definition: "A file that lists the notable changes of each version."
    lesson: u18-showcase
  - term: "Dependency"
    definition: "Software that a project needs in order to work."
    lesson: u18-showcase
  - term: "Software supply chain"
    definition: "All the code, tools and people that software depends on before it reaches users."
    lesson: u18-showcase
  - term: "Advisory"
    definition: "A published notice of a security problem in a version range of some software."
    lesson: u18-showcase
  - term: "Release gate"
    definition: "A set of conditions that must be met before a release goes ahead."
    lesson: u18-showcase
  - term: "Portfolio"
    definition: "A selection of your best work, presented for others to judge."
    lesson: u18-showcase
  - term: "Responsible computing"
    definition: "Building and using technology with attention to its effects on people and society."
    lesson: u18-showcase
