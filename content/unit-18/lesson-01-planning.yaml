id: u18-planning
title: "Planning a Capstone: Scope, Estimates and Workflow"
minutes: 60
objective: |
  Unit 18 is where you put everything together. Before you write a line of a large project you need to decide what you are building, in what order, and how you will know it works. This lesson gives you the planning toolkit: requirements and user stories, a minimum viable product, estimates with uncertainty, a prioritised backlog, task dependencies and the critical path, conventional commits and changelogs, and a README that explains your work.
outcomes:
  - Turn an idea into requirements, user stories and a minimum viable product
  - Estimate effort with three-point (PERT) estimates and combine uncertainty
  - Prioritise a backlog and plan an iteration within a capacity
  - Order tasks by their dependencies and find the critical path
  - Write conventional commit messages, generate a changelog and check a README

sections:
  - heading: From idea to plan
    body: |
      A capstone is a project big enough that you can fail at it by **building the wrong thing**, **building too much**, or **building things in the wrong order**. Professional teams guard against all three with a little planning, which Unit 14 introduced (process, git, testing, design, teams). This unit applies it for real, so we start by rehearsing it.

      Begin with the **problem and the user**: who will use this, and what do they need to be able to do? Capture needs as **requirements**. **Functional requirements** say what the system does ("a user can add a note"); **non-functional requirements** say how well ("responds within 100 ms", "rejects unauthorised access", "runs in a browser"). A handy format is the **user story**: "As a *role*, I want *goal*, so that *benefit*", with **acceptance criteria**: concrete checks that tell you the story is done ("given a note owned by Ana, when Bo requests it, then the response is 403"). Good acceptance criteria become automated tests, which means your project is defined by tests you can run, exactly as the exercises and projects in this course are.

      Then decide the **minimum viable product (MVP)**: the smallest thing that is still useful and demonstrates the idea. Everything else goes on a list for later. Beginners over-scope; a smaller project that works, is tested and is explained well is worth far more than a huge one that is half-finished. A useful rule: build **a thin working slice end-to-end first** (input to output, even if crude), then thicken it, instead of finishing one layer perfectly before the next exists.

  - heading: Estimating, prioritising and ordering
    body: |
      Estimates are always uncertain, and software estimates are famously optimistic. A better habit than a single number is a **three-point estimate**: an **optimistic** time *o*, a **most likely** time *m* and a **pessimistic** time *p*. The **PERT** formula gives an expected duration **(o + 4m + p) / 6** (a weighted mean that leans toward the most likely value) and a standard deviation **(p - o) / 6**. For several independent tasks, the expected times **add**, and the **variances add** (so the combined standard deviation is the square root of the sum of the squared ones). That is why the total of many uncertain tasks is relatively less uncertain than each one, but also why you should add a buffer.

      A **backlog** is the to-do list of features and fixes. Each item gets a **priority** (what matters most to users or to risk reduction) and a size estimate (often **story points**, a relative measure). A **priority queue** (Unit 7) always hands back the most important item. An **iteration** (sprint) takes the top items that fit within the **capacity** of the time you have, and you deliver working software at the end of each one. Tackle the **riskiest or most uncertain** things early: a surprise on day 2 is cheap, on the last day it is fatal.

      Tasks depend on one another: you cannot test a feature before you write it, or write it before the data model exists. These **dependencies** form a directed acyclic graph (Unit 7). A **topological order** lists tasks so that every task comes after the ones it needs, and a cycle means the plan is impossible. If tasks have durations, the longest chain of dependent tasks is the **critical path**: it fixes the minimum total time, and delaying any task on it delays the whole project, while tasks off it have **slack**. Parallel work on a team can overlap non-critical tasks.

  - heading: Workflow, commits and documentation
    body: |
      Keep the project under version control from the first day (Unit 14): commit small, working steps with clear messages, use a **branch** for each feature, and merge when the tests pass. A widely used convention for messages is **Conventional Commits**: `type(scope): description`, where `type` is `feat` (new feature), `fix`, `docs`, `test`, `refactor`, `perf` or `chore`, the optional `scope` names the part touched, and a `!` before the colon marks a **breaking change** (`feat(api)!: remove v1 routes`). The format makes history readable and lets tools **generate a changelog** and choose the next **semantic version** (Lesson 16.8): breaking change means a major bump, `feat` a minor one, `fix` a patch.

      Write the **README** early; it is both your plan and your documentation. A good one has: a title and one-sentence purpose, how to **install** it, how to **use** it with an example, how to **run the tests**, a short **design** note (what the main parts are and why), known limitations, and the **license**. Add **tests that are runnable by a stranger**, and a short **demo**: a few commands or a screenshot showing it work. Ask yourself, "Could a classmate pick this up in an afternoon?" Lesson 18.8 returns to presenting your work.

      The capstone lessons that follow are each a self-contained **project spec**: the problem, the design, a series of **milestones** that you implement and test one at a time, and extension ideas. Each milestone is an exercise whose tests define done. Work through them in order, run the tests, and then use the extensions to make the project your own.

examples:
  - title: Three-point estimates
    intro: "Each task has optimistic, most likely and pessimistic hours. Expected values add, and so do variances."
    code: |
      import math

      def pert(o, m, p):
          return (o + 4 * m + p) / 6, (p - o) / 6

      tasks = {
          "data model":  (2, 4, 10),
          "api routes":  (4, 8, 20),
          "auth":        (3, 6, 15),
          "tests":       (3, 5, 9),
          "docs":        (1, 2, 4),
      }

      total, var = 0.0, 0.0
      for name, (o, m, p) in tasks.items():
          mean, sd = pert(o, m, p)
          total += mean
          var += sd ** 2
          print(f"{name:11} expected {mean:5.2f} h   sd {sd:4.2f}")
      sd_total = math.sqrt(var)
      print(f"project: {total:.1f} h, sd {sd_total:.1f}; about 95% confident of finishing within {total + 2 * sd_total:.1f} h")
    output: |
      data model  expected  4.67 h   sd 1.33
      api routes  expected  9.33 h   sd 2.67
      auth        expected  7.00 h   sd 2.00
      tests       expected  5.33 h   sd 1.00
      docs        expected  2.17 h   sd 0.50
      project: 28.5 h, sd 3.8; about 95% confident of finishing within 36.0 h
    lines:
      - line: 3
        note: "The mean leans toward the most likely value; the spread is a sixth of the range."
      - line: 20
        note: "Two standard deviations above the mean covers roughly 95% of outcomes."
  - title: A prioritised backlog and sprint plan
    intro: "A heap returns the highest-priority item (lowest number). A sprint takes items in priority order while they fit."
    code: |
      import heapq

      backlog = []
      for i, (name, priority, points) in enumerate([
          ("user login", 1, 5), ("add note", 1, 3), ("edit note", 2, 3),
          ("search", 3, 5), ("export", 4, 2), ("dark mode", 5, 1), ("share note", 2, 8)]):
          heapq.heappush(backlog, (priority, i, name, points))     # i keeps insertion order for ties

      def plan(backlog, capacity):
          q, chosen, left, skipped = list(backlog), [], capacity, []
          heapq.heapify(q)
          while q:
              priority, _, name, points = heapq.heappop(q)
              if points <= left:
                  chosen.append(name)
                  left -= points
              else:
                  skipped.append(name)
          return chosen, left, skipped

      print(plan(backlog, 13))
    output: |
      (['user login', 'add note', 'edit note', 'export'], 0, ['share note', 'search', 'dark mode'])
    lines:
      - line: 7
        note: "The tuple compares by priority first, then by position, so equal priorities keep their order."
      - line: 16
        note: "Items that do not fit are skipped, but smaller later items may still fit."
  - title: Task order and the critical path
    intro: "Dependencies form a DAG. A topological order is a valid build order; the longest path is the minimum project length."
    code: |
      from functools import lru_cache

      deps = {                      # task: tasks it depends on
          "design": [], "model": ["design"], "api": ["model"], "auth": ["design"],
          "ui": ["api", "auth"], "tests": ["api", "auth"], "docs": ["ui"], "release": ["tests", "docs"],
      }
      days = {"design": 2, "model": 3, "api": 4, "auth": 3, "ui": 5, "tests": 4, "docs": 2, "release": 1}

      def topological(deps):
          order, state = [], {}
          def visit(t):
              if state.get(t) == 2:
                  return
              if state.get(t) == 1:
                  raise ValueError("cycle at " + t)
              state[t] = 1
              for d in sorted(deps[t]):
                  visit(d)
              state[t] = 2
              order.append(t)
          for t in sorted(deps):
              visit(t)
          return order

      @lru_cache(maxsize=None)
      def finish(t):
          return days[t] + max((finish(d) for d in deps[t]), default=0)

      print(topological(deps))
      path, t = [], max(deps, key=finish)
      while t:
          path.append(t)
          t = max(deps[t], key=finish, default=None)
      print("critical path:", path[::-1], "length", finish("release"), "days")
    output: |
      ['design', 'model', 'api', 'auth', 'ui', 'docs', 'tests', 'release']
      critical path: ['design', 'model', 'api', 'ui', 'docs', 'release'] length 17 days
    lines:
      - line: 11
        note: "Depth-first search with three states (unseen, in progress, done) both orders tasks and detects cycles."
      - line: 25
        note: "The earliest a task can finish is its own duration plus the latest finish among its prerequisites."
      - line: 30
        note: "Walk back from the last task through the slowest prerequisite to read off the critical path."
  - title: Conventional commits and a changelog
    intro: "Parse commit messages with a regular expression, group them by type, and choose the next version."
    code: |
      import re

      LOG = [
          "feat(api): add note search",
          "fix(auth): reject expired tokens",
          "docs: explain installation",
          "feat(ui)!: replace the sidebar",
          "chore: update dependencies",
          "fix: handle empty titles",
          "not a conventional message",
      ]
      RX = re.compile(r"^(\w+)(?:\(([\w-]+)\))?(!)?: (.+)$")

      groups = {}
      bump = "patch"
      for line in LOG:
          m = RX.match(line)
          if not m:
              print("skipped:", line)
              continue
          typ, scope, breaking, desc = m.groups()
          groups.setdefault(typ, []).append(f"{scope + ': ' if scope else ''}{desc}")
          if breaking:
              bump = "major"
          elif typ == "feat" and bump != "major":
              bump = "minor"

      for typ in ("feat", "fix", "docs", "chore"):
          for item in groups.get(typ, []):
              print(f"  [{typ}] {item}")
      print("next version bump:", bump)
    output: |
      skipped: not a conventional message
        [feat] api: add note search
        [feat] ui: replace the sidebar
        [fix] auth: reject expired tokens
        [fix] handle empty titles
        [docs] explain installation
        [chore] update dependencies
      next version bump: major
    lines:
      - line: 13
        note: "type, optional (scope), optional !, colon, description."
      - line: 28
        note: "A breaking change forces a major version, a feature a minor one, anything else a patch."
  - title: Checking a README
    intro: "A simple linter that looks for the sections a stranger needs."
    code: |
      REQUIRED = ["install", "usage", "tests", "license"]

      def check_readme(text):
          lines = text.splitlines()
          problems = []
          if not lines or not lines[0].startswith("# "):
              problems.append("missing title")
          headings = [l[3:].strip().lower() for l in lines if l.startswith("## ")]
          for need in REQUIRED:
              if not any(need in h for h in headings):
                  problems.append(f"missing section: {need}")
          return problems

      good = "# Notes\nA tiny notes app.\n## Install\npip install notes\n## Usage\nnotes add hi\n## Running the tests\npytest\n## License\nMIT\n"
      print(check_readme(good))
      print(check_readme("Notes app\n## Usage\nrun it\n"))
    output: |
      []
      ['missing title', 'missing section: install', 'missing section: tests', 'missing section: license']
    lines:
      - line: 9
        note: "Match on a keyword so 'Running the tests' still counts as the tests section."

playground:
  prompt: |
    Change the optimistic and pessimistic values of one task to be much wider and watch what happens to the project's standard deviation. Which task contributes most to the uncertainty?
  code: |
    import math
    print(round(math.sqrt(3 ** 2 + 4 ** 2), 2))

exercises:
  - id: pert
    title: Three-point estimates
    difficulty: 2
    prompt: |
      Write `pert(o, m, p)` returning `(expected, std_dev)` using `(o + 4m + p) / 6` and `(p - o) / 6`. Write `project_estimate(tasks)` where `tasks` is a list of `(o, m, p)` tuples; return `(total_expected, total_std_dev)` where expected times add and the standard deviation is the square root of the sum of the variances. An empty list gives `(0.0, 0.0)`.
    starter: |
      import math

      def pert(o, m, p):
          pass

      def project_estimate(tasks):
          pass
    tests:
      - name: single task
        code: |
          assert pert(2, 4, 10) == (28 / 6, 8 / 6)
          assert pert(3, 3, 3) == (3.0, 0.0)
      - name: project
        code: |
          total, sd = project_estimate([(2, 4, 10), (4, 8, 20), (3, 6, 15), (3, 5, 9), (1, 2, 4)])
          assert abs(total - 28.5) < 1e-9
          assert abs(sd - 3.7601) < 1e-3
          assert project_estimate([]) == (0.0, 0.0)
          t, s = project_estimate([(1, 2, 3), (1, 2, 3)])
          assert t == 4.0 and abs(s - (2 * (1 / 3) ** 2) ** 0.5) < 1e-12
    hints:
      - "Add up the variances `sd ** 2`, then take one square root at the end."
    solution: |
      import math


      def pert(o, m, p):
          return (o + 4 * m + p) / 6, (p - o) / 6


      def project_estimate(tasks):
          total, var = 0.0, 0.0
          for o, m, p in tasks:
              mean, sd = pert(o, m, p)
              total += mean
              var += sd ** 2
          return total, math.sqrt(var)
    explanation: "Uncertainties do not add directly: independent errors partly cancel, so the total is relatively tighter than the parts."
  - id: backlog
    title: A priority backlog
    difficulty: 3
    prompt: |
      Write a class `Backlog` with `add(name, priority, points)`, `next_item()` (remove and return the `(name, priority, points)` with the smallest priority number; ties go to the item added first; return `None` if empty) and `__len__`. Then write `plan_iteration(backlog_items, capacity)` that takes a list of `(name, priority, points)` tuples (in the order added), takes items in priority order (ties by order given), includes an item only if its points fit in the remaining capacity, and returns the list of chosen names in the order chosen.
    starter: |
      import heapq

      class Backlog:
          def __init__(self):
              pass

          def add(self, name, priority, points):
              pass

          def next_item(self):
              pass

          def __len__(self):
              pass

      def plan_iteration(backlog_items, capacity):
          pass
    tests:
      - name: backlog class
        code: |
          b = Backlog()
          assert b.next_item() is None and len(b) == 0
          b.add("search", 3, 5); b.add("login", 1, 5); b.add("add", 1, 3); b.add("export", 4, 2)
          assert len(b) == 4
          assert b.next_item() == ("login", 1, 5)
          assert b.next_item() == ("add", 1, 3)
          assert b.next_item() == ("search", 3, 5)
          assert len(b) == 1
      - name: iteration plan
        code: |
          items = [("user login", 1, 5), ("add note", 1, 3), ("edit note", 2, 3), ("search", 3, 5), ("export", 4, 2), ("dark mode", 5, 1), ("share note", 2, 8)]
          assert plan_iteration(items, 13) == ["user login", "add note", "edit note", "export"]
          assert plan_iteration(items, 0) == []
          assert plan_iteration(items, 100) == ["user login", "add note", "edit note", "share note", "search", "export", "dark mode"]
          assert plan_iteration([], 5) == []
    hints:
      - "Push `(priority, counter, name, points)` onto a heap so ties keep insertion order. Reuse `Backlog` inside `plan_iteration`."
    solution: |
      import heapq


      class Backlog:
          def __init__(self):
              self._heap = []
              self._count = 0

          def add(self, name, priority, points):
              heapq.heappush(self._heap, (priority, self._count, name, points))
              self._count += 1

          def next_item(self):
              if not self._heap:
                  return None
              priority, _, name, points = heapq.heappop(self._heap)
              return name, priority, points

          def __len__(self):
              return len(self._heap)


      def plan_iteration(backlog_items, capacity):
          b = Backlog()
          for name, priority, points in backlog_items:
              b.add(name, priority, points)
          chosen, left = [], capacity
          while len(b):
              name, priority, points = b.next_item()
              if points <= left:
                  chosen.append(name)
                  left -= points
          return chosen
    explanation: "A heap with an insertion counter gives a stable priority queue, and a greedy pass fills the iteration."
  - id: commits
    title: Conventional commits
    difficulty: 3
    prompt: |
      Write `parse_commit(message)` returning a dict `{"type", "scope", "breaking", "description"}` for messages of the form `type(scope)!: description` (the scope and `!` are optional; `scope` is `None` if absent, `breaking` is a bool), or `None` if the message does not match. Write `next_version(version, messages)` where `version` is `"MAJOR.MINOR.PATCH"`: if any parsed commit is breaking, bump major and reset minor and patch; else if any is `feat`, bump minor and reset patch; else if any parsed commit exists, bump patch; if no message parses, return the version unchanged.
    starter: |
      import re

      def parse_commit(message):
          pass

      def next_version(version, messages):
          pass
    tests:
      - name: parse
        code: |
          assert parse_commit("feat(api): add search") == {"type": "feat", "scope": "api", "breaking": False, "description": "add search"}
          assert parse_commit("fix: handle empty titles") == {"type": "fix", "scope": None, "breaking": False, "description": "handle empty titles"}
          assert parse_commit("feat(ui)!: replace the sidebar") == {"type": "feat", "scope": "ui", "breaking": True, "description": "replace the sidebar"}
          assert parse_commit("refactor!: new core") ["breaking"] is True
          for bad in ["", "added stuff", "feat add", "feat:", "feat:missing space"]:
              assert parse_commit(bad) is None, bad
      - name: versions
        code: |
          assert next_version("1.4.2", ["fix: a", "docs: b"]) == "1.4.3"
          assert next_version("1.4.2", ["fix: a", "feat: b"]) == "1.5.0"
          assert next_version("1.4.2", ["feat: b", "fix(x)!: c"]) == "2.0.0"
          assert next_version("1.4.2", ["junk", "also junk"]) == "1.4.2"
          assert next_version("0.9.9", []) == "0.9.9"
    hints:
      - "Regular expression: `^(\\w+)(?:\\(([\\w-]+)\\))?(!)?: (.+)$`."
    solution: |
      import re

      _RX = re.compile(r"^(\w+)(?:\(([\w-]+)\))?(!)?: (.+)$")


      def parse_commit(message):
          m = _RX.match(message)
          if not m:
              return None
          typ, scope, bang, desc = m.groups()
          return {"type": typ, "scope": scope, "breaking": bool(bang), "description": desc}


      def next_version(version, messages):
          parsed = [p for p in (parse_commit(m) for m in messages) if p]
          if not parsed:
              return version
          major, minor, patch = (int(x) for x in version.split("."))
          if any(p["breaking"] for p in parsed):
              return f"{major + 1}.0.0"
          if any(p["type"] == "feat" for p in parsed):
              return f"{major}.{minor + 1}.0"
          return f"{major}.{minor}.{patch + 1}"
    explanation: "Tools such as semantic-release do exactly this to publish versions automatically from commit history."
  - id: task-order
    title: Task order and critical path
    difficulty: 4
    prompt: |
      `deps` maps each task to the list of tasks it depends on (every task appears as a key). Write `task_order(deps)` returning a list in which every task comes after its dependencies; among tasks that could go next, choose the alphabetically smallest. Raise `ValueError` if there is a cycle. Write `critical_path(deps, days)` returning `(length, path)` where `length` is the minimum total duration with unlimited parallel workers and `path` is one longest chain from first to last task (if several are tied choose the alphabetically smaller prerequisite).
    starter: |
      def task_order(deps):
          pass

      def critical_path(deps, days):
          pass
    tests:
      - name: order
        code: |
          deps = {"design": [], "model": ["design"], "api": ["model"], "auth": ["design"], "ui": ["api", "auth"],
                  "tests": ["api", "auth"], "docs": ["ui"], "release": ["tests", "docs"]}
          assert task_order(deps) == ["design", "auth", "model", "api", "tests", "ui", "docs", "release"]
          assert task_order({}) == []
          assert task_order({"b": [], "a": []}) == ["a", "b"]
          try:
              task_order({"a": ["b"], "b": ["a"]})
              raise AssertionError("cycle accepted")
          except ValueError:
              pass
      - name: critical path
        code: |
          deps = {"design": [], "model": ["design"], "api": ["model"], "auth": ["design"], "ui": ["api", "auth"],
                  "tests": ["api", "auth"], "docs": ["ui"], "release": ["tests", "docs"]}
          days = {"design": 2, "model": 3, "api": 4, "auth": 3, "ui": 5, "tests": 4, "docs": 2, "release": 1}
          assert critical_path(deps, days) == (17, ["design", "model", "api", "ui", "docs", "release"])
          assert critical_path({"a": []}, {"a": 4}) == (4, ["a"])
          assert critical_path({"a": [], "b": []}, {"a": 4, "b": 4}) == (4, ["a"])
    hints:
      - "Kahn's algorithm with a sorted list of ready tasks gives the alphabetical tie-break. For the critical path, memoise `finish(t) = days[t] + max(finish(d) for d in deps[t])`."
    solution: |
      def task_order(deps):
          remaining = {t: set(d) for t, d in deps.items()}
          order = []
          while remaining:
              ready = sorted(t for t, d in remaining.items() if not d)
              if not ready:
                  raise ValueError("cycle in dependencies")
              t = ready[0]
              order.append(t)
              del remaining[t]
              for d in remaining.values():
                  d.discard(t)
          return order


      def critical_path(deps, days):
          finish = {}
          for t in task_order(deps):
              finish[t] = days[t] + max((finish[d] for d in deps[t]), default=0)
          last = max(sorted(deps), key=lambda t: finish[t])
          path = [last]
          while deps[path[-1]]:
              prereqs = sorted(deps[path[-1]])
              path.append(max(prereqs, key=lambda d: finish[d]))
          return finish[last], path[::-1]
    explanation: "Delaying any task on the critical path delays the whole project, which is why you protect those tasks first."
  - id: readme
    title: A README linter
    difficulty: 2
    prompt: |
      Write `check_readme(text)` returning a list of problem strings in this order: `"missing title"` if the first line does not start with `"# "`; then, for each of `install`, `usage`, `tests`, `license` in that order, `"missing section: NAME"` if no level-2 heading (a line starting with `"## "`) contains that word (case-insensitive); and `"too short"` if the text has fewer than 30 words. An empty list means a good README.
    starter: |
      def check_readme(text):
          pass
    tests:
      - name: readme
        code: |
          good = "# Notes\nA tiny notes app that stores short notes in a file and lets you search them quickly from the command line.\n## Install\npip install notes\n## Usage\nnotes add hello\n## Running the tests\npytest\n## License\nMIT\n"
          assert check_readme(good) == []
          assert check_readme("Notes\n## Usage\nrun") == ["missing title", "missing section: install", "missing section: tests", "missing section: license", "too short"]
          assert check_readme("") == ["missing title", "missing section: install", "missing section: usage", "missing section: tests", "missing section: license", "too short"]
          assert "missing section: install" in check_readme("# T\n### Install\nfoo")
    hints:
      - "Collect level-2 headings with `[l[3:].lower() for l in lines if l.startswith('## ')]`."
    solution: |
      def check_readme(text):
          lines = text.splitlines()
          problems = []
          if not lines or not lines[0].startswith("# "):
              problems.append("missing title")
          headings = [l[3:].strip().lower() for l in lines if l.startswith("## ")]
          for need in ("install", "usage", "tests", "license"):
              if not any(need in h for h in headings):
                  problems.append("missing section: " + need)
          if len(text.split()) < 30:
              problems.append("too short")
          return problems
    explanation: "Automated checks for documentation, like tests for code, keep standards from slipping."

commonMistakes:
  - title: "Starting with the biggest, most exciting feature"
    explanation: "Build a thin working slice first, then add features in priority order."
  - title: "Estimating with one optimistic number"
    explanation: "Use ranges and add a buffer; the pessimistic case is more common than you think."
  - title: "No acceptance criteria"
    explanation: "Without a testable definition of done you cannot tell when to stop."
  - title: "Giant commits with vague messages"
    explanation: "Commit small, working steps and say what changed and why."
  - title: "Leaving the README until the end"
    explanation: "Write it first as a plan, then keep it up to date."

summary:
  - "Plan with a clear problem, user stories with acceptance criteria and a small MVP, built as a thin slice end-to-end."
  - "Estimate with three points (PERT): expected times add, variances add."
  - "Prioritise a backlog with a priority queue, plan iterations within capacity and tackle risk early."
  - "Dependencies form a DAG: topologically order tasks and protect the critical path."
  - "Use conventional commits, semantic versions and a README so others can understand and run your project."
