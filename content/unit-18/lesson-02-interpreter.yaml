        left, pos = parse_sum(tokens, pos)
        while _is_sym(tokens, pos, COMPARE):
            op = tokens[pos][1]
            right, pos = parse_sum(tokens, pos + 1)
            left = ("bin", op, left, right)
        return left, pos


