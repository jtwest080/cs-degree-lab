                pos += 1
                continue
            if ch == "#":
                while pos < len(src) and src[pos] != "\n":
                    pos += 1
                continue
            m = _TOKEN.match(src, pos)
            if not m:
                raise LangError("unexpected character " + repr(ch))
            number, name, symbol = m.groups()
            if number is not None:
                tokens.append(("num", float(number) if "." in number else int(number)))
            elif name is not None:
                tokens.append(("kw" if name in KEYWORDS else "name", name))
            else:
                tokens.append(("sym", symbol))
            pos = m.end()
        return tokens


    COMPARE = ("==", "!=", "<", "<=", ">", ">=")


    def _is_sym(tokens, pos, options):
        return pos < len(tokens) and tokens[pos][0] == "sym" and tokens[pos][1] in options


    def parse_expr(tokens, pos=0):
