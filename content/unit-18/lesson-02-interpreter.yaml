  explanation: 'Writing programs in a language you made yourself is the best test of the design. Notice what was awkward: no `and`, no `for`, no lists. Adding those is a natural extension.'
commonMistakes:
- title: Parsing operators in the wrong order
  explanation: Precedence comes from which function calls which. The loosest operators belong in the outermost function.
- title: Making subtraction right-associative
  explanation: Use a loop that wraps the tree so far on the left, so 10 - 4 - 3 is (10 - 4) - 3.
- title: Forgetting to check that all tokens were consumed
  explanation: Otherwise `1 2` or `1 + 2 )` would be silently accepted.
- title: Sharing one scope for everything
  explanation: Blocks and calls need their own child scope, with the parent link for lookups.
- title: No limits on loops and recursion
  explanation: 'An interpreter must protect itself from runaway programs: count steps and depth.'
summary:
- 'An interpreter pipeline: tokenizer, parser (syntax tree), evaluator.'
- Recursive descent turns each grammar rule into a function; call order gives precedence and loops give left-associativity.
- Environments are chains of scopes; functions that remember their defining scope are closures.
- Return can be implemented with an exception; resource limits and clear errors make the interpreter safe.
- Writing programs in the language you built tests its design and shows what to add next.
