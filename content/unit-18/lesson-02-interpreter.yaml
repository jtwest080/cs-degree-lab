        while pos < len(src):
            ch = src[pos]
            if ch.isspace():
                pos += 1
                continue
            if ch == "#":
                while pos < len(src) and src[pos] != "\n":
                    pos += 1
                continue
            m = _TOKEN.match(src, pos)
