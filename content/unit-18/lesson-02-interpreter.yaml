        pass
  tests:
  - name: rpn
    code: |
      assert eval_postfix(["3", "4", "+", "2", "*"]) == 14
      assert eval_postfix(["5", "1", "2", "+", "4", "*", "+", "3", "-"]) == 14
      assert eval_postfix(["7"]) == 7
      assert eval_postfix(["1", "4", "/"]) == 0.25
  solution: |
    def eval_postfix(tokens):
        stack = []
        for t in tokens:
            if t in ("+", "-", "*", "/"):
                b, a = stack.pop(), stack.pop()
                if t == "+":
                    stack.append(a + b)
                elif t == "-":
                    stack.append(a - b)
                elif t == "*":
                    stack.append(a * b)
                else:
                    stack.append(a / b)
            else:
                stack.append(int(t))
        return stack[0]
