            name = tokens[pos + 1][1]
            pos = _expect(tokens, pos + 2, "sym", "=")
            expr, pos = parse_expr(tokens, pos)
            return ("let", name, expr), _expect(tokens, pos, "sym", ";")
        if kind == "kw" and value == "print":
            expr, pos = parse_expr(tokens, pos + 1)
            return ("print", expr), _expect(tokens, pos, "sym", ";")
        if kind == "kw" and value == "return":
            expr, pos = parse_expr(tokens, pos + 1)
            return ("return", expr), _expect(tokens, pos, "sym", ";")
        if kind == "kw" and value == "if":
            cond, pos = parse_expr(tokens, pos + 1)
            then, pos = parse_block(tokens, pos)
            other = None
            if pos < len(tokens) and tokens[pos] == ("kw", "else"):
                other, pos = parse_block(tokens, pos + 1)
            return ("if", cond, then, other), pos
        if kind == "kw" and value == "while":
            cond, pos = parse_expr(tokens, pos + 1)
            body, pos = parse_block(tokens, pos)
            return ("while", cond, body), pos
        if kind == "kw" and value == "fn":
            if pos + 1 >= len(tokens) or tokens[pos + 1][0] != "name":
                raise LangError("expected a function name")
            name = tokens[pos + 1][1]
            pos = _expect(tokens, pos + 2, "sym", "(")
            params = []
            while not _is_sym(tokens, pos, (")",)):
                if pos >= len(tokens) or tokens[pos][0] != "name":
                    raise LangError("expected a parameter name")
                params.append(tokens[pos][1])
                pos += 1
                if _is_sym(tokens, pos, (",",)):
                    pos += 1
            body, pos = parse_block(tokens, pos + 1)
            return ("fn", name, params, body), pos
        if kind == "name" and _is_sym(tokens, pos + 1, ("=",)):
            expr, pos = parse_expr(tokens, pos + 2)
            return ("assign", value, expr), _expect(tokens, pos, "sym", ";")
        expr, pos = parse_expr(tokens, pos)
        return ("expr", expr), _expect(tokens, pos, "sym", ";")


    def parse_program(tokens):
        stmts, pos = [], 0
        while pos < len(tokens):
            stmt, pos = parse_statement(tokens, pos)
            stmts.append(stmt)
        return stmts


    class Env:
        """A scope: a dictionary of variables plus a link to the enclosing scope."""

        def __init__(self, parent=None):
            self.vars, self.parent = {}, parent

        def __contains__(self, name):
            return name in self.vars or (self.parent is not None and name in self.parent)

        def __getitem__(self, name):
            if name in self.vars:
                return self.vars[name]
            if self.parent is not None:
                return self.parent[name]
            raise KeyError(name)

        def define(self, name, value):
            self.vars[name] = value

        def assign(self, name, value):
            scope = self
            while scope is not None:
                if name in scope.vars:
                    scope.vars[name] = value
                    return
                scope = scope.parent
            raise LangError("assignment to undefined variable " + name)


    class _Return(Exception):
        def __init__(self, value):
            self.value = value


    class Interpreter:
        MAX_STEPS = 20000
        MAX_DEPTH = 40

        def __init__(self):
            self.output, self.steps, self.depth = [], 0, 0
            self.globals = Env()

        def run(self, stmts):
            self.exec_block(stmts, self.globals)
            return self.output

        def exec_block(self, stmts, env):
            for stmt in stmts:
                self.exec_stmt(stmt, env)

        def exec_stmt(self, stmt, env):
            self.steps += 1
            if self.steps > self.MAX_STEPS:
                raise LangError("step limit exceeded")
            kind = stmt[0]
            if kind == "let":
                env.define(stmt[1], evaluate(stmt[2], env))
            elif kind == "assign":
                env.assign(stmt[1], evaluate(stmt[2], env))
            elif kind == "print":
                value = evaluate(stmt[1], env)
                self.output.append(str(value))
            elif kind == "expr":
                evaluate(stmt[1], env)
            elif kind == "if":
                if evaluate(stmt[1], env):
                    self.exec_block(stmt[2], Env(env))
                elif stmt[3] is not None:
                    self.exec_block(stmt[3], Env(env))
            elif kind == "while":
                while evaluate(stmt[1], env):
                    self.exec_block(stmt[2], Env(env))
                    self.steps += 1
                    if self.steps > self.MAX_STEPS:
                        raise LangError("step limit exceeded")
            elif kind == "fn":
                env.define(stmt[1], self.make_function(stmt[1], stmt[2], stmt[3], env))
            elif kind == "return":
                raise _Return(evaluate(stmt[1], env))
            else:
                raise LangError("unknown statement " + repr(kind))

        def make_function(self, name, params, body, closure_env):
            def call(*args):
                if len(args) != len(params):
                    raise LangError(f"{name} expects {len(params)} arguments, got {len(args)}")
                if self.depth >= self.MAX_DEPTH:
                    raise LangError("recursion too deep")
                local = Env(closure_env)
                for p, a in zip(params, args):
                    local.define(p, a)
                self.depth += 1
                try:
                    self.exec_block(body, local)
                except _Return as r:
                    return r.value
                finally:
                    self.depth -= 1
                return 0
            return call


    def run_source(src):
        """Run a MiniScript program. Returns (output_lines, error_message_or_None)."""
        interp = Interpreter()
        try:
            interp.run(parse_program(tokenize(src)))
        except LangError as e:
            return interp.output, str(e)
        return interp.output, None


