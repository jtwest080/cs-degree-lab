id: u18-interpreter
title: 'Capstone A: Build a Programming Language'
minutes: 90
objective: Build an interpreter for MiniScript, a small programming language with variables, arithmetic, comparisons, if/else, while loops and functions with recursion and closures. You will write a tokenizer, a recursive-descent parser, an expression evaluator, a statement interpreter with scopes, and finally write programs in your own language. This capstone ties together Units 4, 7, 9, 10, 15 and 16.
outcomes:
- Describe the pipeline from source text to tokens, syntax tree and evaluation
- Write a tokenizer and a recursive-descent parser that respects operator precedence
- Evaluate expression trees and execute statements with environments (scopes)
- Implement functions, recursion and closures
- Protect an interpreter with step and recursion limits and clear error messages
sections:
- heading: How a language is built
  body: |-
    Every programming language you have used was built by programs, and the first big idea of this capstone is that **an interpreter is just a program that reads a program**. The classic pipeline has four stages (Units 9 and 15 met each of them): **source text** is split into **tokens** by a **tokenizer** (or **lexer**): numbers, names, keywords and symbols; the tokens are arranged into a **syntax tree** (an **abstract syntax tree**, **AST**) by a **parser**, which also rejects ill-formed programs; and an **evaluator** walks the tree and carries out what it says. A **compiler** would instead translate the tree to another language or to bytecode (Unit 10's virtual machine); an **interpreter** just does the work directly.

    MiniScript is deliberately small. Programs are sequences of statements ending in `;`: `let x = 3 + 4;` creates a variable, `x = x * 2;` changes it, `print x;` shows it. Blocks are in braces: `if x > 5 { ... } else { ... }`, `while i < 10 { ... }`. Functions are `fn name(a, b) { return a + b; }`, and values are numbers (integers and decimals). Comparisons return 1 (true) or 0 (false), and any non-zero value counts as true in a condition. Comments start with `#`.

    Our plan has five **milestones**, one per exercise: (1) the tokenizer, (2) an expression parser and evaluator, (3) a statement parser, (4) an interpreter with scopes and functions, and (5) writing real programs in the language you have built.
- heading: Grammar and precedence
  body: |-
    A **grammar** (Unit 15) describes which token sequences are valid. For expressions, we write one rule per level of **precedence**, from the loosest-binding operator to the tightest:

    ```
    expression = sum  (("==" | "!=" | "<" | "<=" | ">" | ">=") sum)*
    sum        = term (("+" | "-") term)*
    term       = unary (("*" | "/" | "%") unary)*
    unary      = "-" unary | primary
    primary    = number | name | name "(" [expression ("," expression)*] ")" | "(" expression ")"
    ```

    In a **recursive-descent parser** each rule becomes a function that calls the function for the next-tighter rule. Because `term` is called from inside `sum`, multiplication binds tighter than addition, so `1 + 2 * 3` parses as `1 + (2 * 3)`. The loop `(... term)*` makes operators **left-associative**: `10 - 4 - 3` becomes `(10 - 4) - 3`. A parenthesised expression restarts at the top rule, which is how parentheses override precedence. Each parse function takes the token list and a **position** and returns the tree it built along with the position after it, so the caller can carry on. When the tokens do not fit the grammar, the parser raises a clear error rather than guessing.

    The result is a tree such as `("bin", "+", ("num", 1), ("bin", "*", ("num", 2), ("num", 3)))`. The evaluator is then a short recursive function with one case per node type, the same idea as the expression trees of Unit 7. Statements get their own grammar: `let name = expression ;`, `name = expression ;`, `print expression ;`, `if expression block [else block]`, `while expression block`, `fn name ( params ) block`, `return expression ;`, and an expression followed by `;`.
- heading: Scopes, functions and closures
  body: |-
    Variables need a home. An **environment** maps names to values. Blocks and function calls create a **new scope** whose **parent** is the scope around it, so a lookup that fails locally continues outward; this is the **scope chain** (Unit 4). `let` always creates a variable in the *current* scope, while assignment `x = ...` changes the nearest existing `x` and is an error if there is none.

    A **function** is a stored parameter list and body, plus the scope where it was **defined**. Calling it creates a fresh scope whose parent is that defining scope, binds the parameters to the argument values, and runs the body. Remembering the defining scope makes the function a **closure**: `fn make(n) { fn add(x) { return x + n; } return add; }` returns a function that still sees `n` after `make` has finished. We implement `return` with an **exception** that unwinds the Python stack back to the call (Unit 5), and functions are stored in the environment as ordinary callable values, which also lets us add built-in functions written in Python. Recursion works automatically because each call has its own scope.

    Finally, **safety** (Unit 16). An interpreter runs code you did not write, so it must defend itself. An accidental or malicious `while 1 { }` would loop forever, so we count executed statements and stop at a **step limit**; unbounded recursion would exhaust the Python stack, so we count the **call depth**; and every failure becomes a clean `LangError` with a message instead of a crash. These same limits are how online code runners (and this course's own browser runner) protect themselves.
examples:
- title: Tokenizing
  intro: The tokenizer splits text into (kind, value) pairs and throws away whitespace and comments.
  code: |
    import re

    KEYWORDS = {"let", "print", "if", "else", "while", "fn", "return"}
    _TOKEN = re.compile(r"(\d+\.\d+|\d+)|([A-Za-z_]\w*)|(==|!=|<=|>=|[-+*/%<>=(){},;])")


    class LangError(Exception):
        pass


    def tokenize(src):
        tokens = []
        pos = 0
        while pos < len(src):
            ch = src[pos]
            if ch.isspace():
                pos += 1
                continue
            if ch == "#":
                while pos < len(src) and src[pos] != "\n":
                    pos += 1
                continue
            m = _TOKEN.match(src, pos)
            if not m:
                raise LangError("unexpected character " + repr(ch))
            number, name, symbol = m.groups()
            if number is not None:
                tokens.append(("num", float(number) if "." in number else int(number)))
            elif name is not None:
                tokens.append(("kw" if name in KEYWORDS else "name", name))
            else:
                tokens.append(("sym", symbol))
            pos = m.end()
        return tokens


    print(tokenize("let total = (price + 2.5) * 3;  # cost"))
    print(tokenize("while x <= 10 { x = x + 1; }"))
    try:
        tokenize("let y = 4 @ 2;")
    except LangError as e:
        print("error:", e)
  output: |
    [('kw', 'let'), ('name', 'total'), ('sym', '='), ('sym', '('), ('name', 'price'), ('sym', '+'), ('num', 2.5), ('sym', ')'), ('sym', '*'), ('num', 3), ('sym', ';')]
    [('kw', 'while'), ('name', 'x'), ('sym', '<='), ('num', 10), ('sym', '{'), ('name', 'x'), ('sym', '='), ('name', 'x'), ('sym', '+'), ('num', 1), ('sym', ';'), ('sym', '}')]
    error: unexpected character '@'
  lines:
  - line: 16
    note: Whitespace is skipped. A comment runs to the end of the line.
  - line: 26
    note: Numbers with a dot become floats, others ints. Words become keywords or names.
- title: Parsing precedence
  intro: A tiny recursive-descent parser shows how rule order gives precedence and left-associativity.
  code: |
    def tokenize(src):
        import re
        return re.findall(r"\d+|[-+*/()]", src)

    def parse_sum(t, pos):
        left, pos = parse_term(t, pos)
        while pos < len(t) and t[pos] in "+-":
            op = t[pos]
            right, pos = parse_term(t, pos + 1)
            left = (op, left, right)
        return left, pos

    def parse_term(t, pos):
        left, pos = parse_atom(t, pos)
        while pos < len(t) and t[pos] in "*/":
            op = t[pos]
            right, pos = parse_atom(t, pos + 1)
            left = (op, left, right)
        return left, pos

    def parse_atom(t, pos):
        if t[pos] == "(":
            inner, pos = parse_sum(t, pos + 1)
            return inner, pos + 1
        return int(t[pos]), pos + 1

    for src in ["1 + 2 * 3", "(1 + 2) * 3", "10 - 4 - 3", "2 * 3 + 4 * 5"]:
        print(f"{src:14}", parse_sum(tokenize(src), 0)[0])
  output: |
    1 + 2 * 3      ('+', 1, ('*', 2, 3))
    (1 + 2) * 3    ('*', ('+', 1, 2), 3)
    10 - 4 - 3     ('-', ('-', 10, 4), 3)
    2 * 3 + 4 * 5  ('+', ('*', 2, 3), ('*', 4, 5))
  lines:
  - line: 5
    note: parse_sum handles the loosest operators and calls parse_term for the tighter ones.
  - line: 10
    note: 'Each new operator wraps the tree built so far on its left: that is left-associativity.'
  - line: 27
    note: 'The tree shape shows precedence: multiplication sits deeper, so it happens first.'
- title: Evaluating a tree
  intro: One function with a case per node type. The environment is a plain dictionary here.
  code: |
    import re

    KEYWORDS = {"let", "print", "if", "else", "while", "fn", "return"}
    _TOKEN = re.compile(r"(\d+\.\d+|\d+)|([A-Za-z_]\w*)|(==|!=|<=|>=|[-+*/%<>=(){},;])")


    class LangError(Exception):
        pass


    def tokenize(src):
        tokens = []
        pos = 0
        while pos < len(src):
            ch = src[pos]
            if ch.isspace():
                pos += 1
                continue
            if ch == "#":
                while pos < len(src) and src[pos] != "\n":
                    pos += 1
                continue
            m = _TOKEN.match(src, pos)
            if not m:
                raise LangError("unexpected character " + repr(ch))
            number, name, symbol = m.groups()
            if number is not None:
                tokens.append(("num", float(number) if "." in number else int(number)))
            elif name is not None:
                tokens.append(("kw" if name in KEYWORDS else "name", name))
            else:
                tokens.append(("sym", symbol))
            pos = m.end()
        return tokens


    COMPARE = ("==", "!=", "<", "<=", ">", ">=")


    def _is_sym(tokens, pos, options):
        return pos < len(tokens) and tokens[pos][0] == "sym" and tokens[pos][1] in options


    def parse_expr(tokens, pos=0):
        """Parse an expression starting at tokens[pos]. Returns (ast, next_pos)."""
        left, pos = parse_sum(tokens, pos)
        while _is_sym(tokens, pos, COMPARE):
            op = tokens[pos][1]
            right, pos = parse_sum(tokens, pos + 1)
            left = ("bin", op, left, right)
        return left, pos


    def parse_sum(tokens, pos):
        left, pos = parse_term(tokens, pos)
        while _is_sym(tokens, pos, ("+", "-")):
            op = tokens[pos][1]
            right, pos = parse_term(tokens, pos + 1)
            left = ("bin", op, left, right)
        return left, pos


    def parse_term(tokens, pos):
        left, pos = parse_unary(tokens, pos)
        while _is_sym(tokens, pos, ("*", "/", "%")):
            op = tokens[pos][1]
            right, pos = parse_unary(tokens, pos + 1)
            left = ("bin", op, left, right)
        return left, pos


    def parse_unary(tokens, pos):
        if _is_sym(tokens, pos, ("-",)):
            operand, pos = parse_unary(tokens, pos + 1)
            return ("neg", operand), pos
        return parse_primary(tokens, pos)


    def parse_primary(tokens, pos):
        if pos >= len(tokens):
            raise LangError("unexpected end of input")
        kind, value = tokens[pos]
        if kind == "num":
            return ("num", value), pos + 1
        if kind == "name":
            if _is_sym(tokens, pos + 1, ("(",)):
                args, pos = [], pos + 2
                if not _is_sym(tokens, pos, (")",)):
                    while True:
                        arg, pos = parse_expr(tokens, pos)
                        args.append(arg)
                        if _is_sym(tokens, pos, (",",)):
                            pos += 1
                        else:
                            break
                if not _is_sym(tokens, pos, (")",)):
                    raise LangError("expected )")
                return ("call", value, args), pos + 1
            return ("var", value), pos + 1
        if kind == "sym" and value == "(":
            inner, pos = parse_expr(tokens, pos + 1)
            if not _is_sym(tokens, pos, (")",)):
                raise LangError("expected )")
            return inner, pos + 1
        raise LangError("unexpected token " + repr(value))


    def parse(tokens):
        ast, pos = parse_expr(tokens, 0)
        if pos != len(tokens):
            raise LangError("unexpected token " + repr(tokens[pos][1]))
        return ast


    def evaluate(node, env):
        kind = node[0]
        if kind == "num":
            return node[1]
        if kind == "var":
            if node[1] not in env:
                raise LangError("undefined variable " + node[1])
            return env[node[1]]
        if kind == "neg":
            return -evaluate(node[1], env)
        if kind == "call":
            if node[1] not in env or not callable(env[node[1]]):
                raise LangError("undefined function " + node[1])
            return env[node[1]](*[evaluate(a, env) for a in node[2]])
        op, left, right = node[1], evaluate(node[2], env), evaluate(node[3], env)
        if op == "+":
            return left + right
        if op == "-":
            return left - right
        if op == "*":
            return left * right
        if op in ("/", "%"):
            if right == 0:
                raise LangError("division by zero")
            if op == "%":
                return left % right
            if isinstance(left, int) and isinstance(right, int) and left % right == 0:
                return left // right
            return left / right
        return int({"==": left == right, "!=": left != right, "<": left < right,
                    "<=": left <= right, ">": left > right, ">=": left >= right}[op])


    env = {"x": 6, "y": 7, "square": lambda n: n * n}
    for src in ["x * y", "square(x + 1) - 1", "10 / 4", "-x % 4", "x < y", "7 / 0"]:
        try:
            print(f"{src:18}", evaluate(parse(tokenize(src)), env))
        except LangError as e:
            print(f"{src:18} error: {e}")
  output: |
    x * y              42
    square(x + 1) - 1  48
    10 / 4             2.5
    -x % 4             2
    x < y              1
    7 / 0              error: division by zero
  lines:
  - line: 128
    note: Calls look up a callable in the environment, so built-ins and user functions work the same way.
  - line: 152
    note: Errors in the program become LangError messages, never Python crashes.
- title: A scope chain
  intro: Each block gets an Env whose parent is the enclosing scope. Lookups walk outward; let defines locally; assignment changes the nearest existing variable.
  code: |
    class LangError(Exception):
        pass

    class Env:
        """A scope: a dictionary of variables plus a link to the enclosing scope."""

        def __init__(self, parent=None):
            self.vars, self.parent = {}, parent

        def __contains__(self, name):
            return name in self.vars or (self.parent is not None and name in self.parent)

        def __getitem__(self, name):
            if name in self.vars:
                return self.vars[name]
            if self.parent is not None:
                return self.parent[name]
            raise KeyError(name)

        def define(self, name, value):
            self.vars[name] = value

        def assign(self, name, value):
            scope = self
            while scope is not None:
                if name in scope.vars:
                    scope.vars[name] = value
                    return
                scope = scope.parent
            raise LangError("assignment to undefined variable " + name)



    g = Env()
    g.define("x", 1)
    inner = Env(g)
    inner.define("y", 2)
    print("inner sees x and y:", inner["x"], inner["y"])
    inner.define("x", 100)                 # shadows the outer x
    print("inner x:", inner["x"], " outer x:", g["x"])
    g.define("z", 5)
    inner.assign("z", 6)                   # changes the existing outer z
    print("outer z:", g["z"])
    try:
        inner.assign("nope", 1)
    except LangError as e:
        print("error:", e)
    print("outer cannot see y:", "y" in g)
  output: |
    inner sees x and y: 1 2
    inner x: 100  outer x: 1
    outer z: 6
    error: assignment to undefined variable nope
    outer cannot see y: False
  lines:
  - line: 39
    note: 'let creates a new variable in this scope: it shadows, it does not change, the outer one.'
  - line: 42
    note: Assignment walks up the chain to the scope that already owns the name.
- title: A whole program
  intro: 'Putting the pipeline together: run MiniScript source and see recursion, a closure and an error.'
  code: |
    import re

    KEYWORDS = {"let", "print", "if", "else", "while", "fn", "return"}
    _TOKEN = re.compile(r"(\d+\.\d+|\d+)|([A-Za-z_]\w*)|(==|!=|<=|>=|[-+*/%<>=(){},;])")


    class LangError(Exception):
        pass


    def tokenize(src):
        tokens = []
        pos = 0
        while pos < len(src):
            ch = src[pos]
            if ch.isspace():
                pos += 1
                continue
            if ch == "#":
                while pos < len(src) and src[pos] != "\n":
                    pos += 1
                continue
            m = _TOKEN.match(src, pos)
            if not m:
                raise LangError("unexpected character " + repr(ch))
            number, name, symbol = m.groups()
            if number is not None:
                tokens.append(("num", float(number) if "." in number else int(number)))
            elif name is not None:
                tokens.append(("kw" if name in KEYWORDS else "name", name))
            else:
                tokens.append(("sym", symbol))
            pos = m.end()
        return tokens


    COMPARE = ("==", "!=", "<", "<=", ">", ">=")


    def _is_sym(tokens, pos, options):
        return pos < len(tokens) and tokens[pos][0] == "sym" and tokens[pos][1] in options


    def parse_expr(tokens, pos=0):
        """Parse an expression starting at tokens[pos]. Returns (ast, next_pos)."""
        left, pos = parse_sum(tokens, pos)
        while _is_sym(tokens, pos, COMPARE):
            op = tokens[pos][1]
            right, pos = parse_sum(tokens, pos + 1)
            left = ("bin", op, left, right)
        return left, pos


    def parse_sum(tokens, pos):
        left, pos = parse_term(tokens, pos)
        while _is_sym(tokens, pos, ("+", "-")):
            op = tokens[pos][1]
            right, pos = parse_term(tokens, pos + 1)
            left = ("bin", op, left, right)
        return left, pos


    def parse_term(tokens, pos):
        left, pos = parse_unary(tokens, pos)
        while _is_sym(tokens, pos, ("*", "/", "%")):
            op = tokens[pos][1]
            right, pos = parse_unary(tokens, pos + 1)
            left = ("bin", op, left, right)
        return left, pos


    def parse_unary(tokens, pos):
        if _is_sym(tokens, pos, ("-",)):
            operand, pos = parse_unary(tokens, pos + 1)
            return ("neg", operand), pos
        return parse_primary(tokens, pos)


    def parse_primary(tokens, pos):
        if pos >= len(tokens):
            raise LangError("unexpected end of input")
        kind, value = tokens[pos]
        if kind == "num":
            return ("num", value), pos + 1
        if kind == "name":
            if _is_sym(tokens, pos + 1, ("(",)):
                args, pos = [], pos + 2
                if not _is_sym(tokens, pos, (")",)):
                    while True:
                        arg, pos = parse_expr(tokens, pos)
                        args.append(arg)
                        if _is_sym(tokens, pos, (",",)):
                            pos += 1
                        else:
                            break
                if not _is_sym(tokens, pos, (")",)):
                    raise LangError("expected )")
                return ("call", value, args), pos + 1
            return ("var", value), pos + 1
        if kind == "sym" and value == "(":
            inner, pos = parse_expr(tokens, pos + 1)
            if not _is_sym(tokens, pos, (")",)):
                raise LangError("expected )")
            return inner, pos + 1
        raise LangError("unexpected token " + repr(value))


    def parse(tokens):
        ast, pos = parse_expr(tokens, 0)
        if pos != len(tokens):
            raise LangError("unexpected token " + repr(tokens[pos][1]))
        return ast


    def evaluate(node, env):
        kind = node[0]
        if kind == "num":
            return node[1]
        if kind == "var":
            if node[1] not in env:
                raise LangError("undefined variable " + node[1])
            return env[node[1]]
        if kind == "neg":
            return -evaluate(node[1], env)
        if kind == "call":
            if node[1] not in env or not callable(env[node[1]]):
                raise LangError("undefined function " + node[1])
            return env[node[1]](*[evaluate(a, env) for a in node[2]])
        op, left, right = node[1], evaluate(node[2], env), evaluate(node[3], env)
        if op == "+":
            return left + right
        if op == "-":
            return left - right
        if op == "*":
            return left * right
        if op in ("/", "%"):
            if right == 0:
                raise LangError("division by zero")
            if op == "%":
                return left % right
            if isinstance(left, int) and isinstance(right, int) and left % right == 0:
                return left // right
            return left / right
        return int({"==": left == right, "!=": left != right, "<": left < right,
                    "<=": left <= right, ">": left > right, ">=": left >= right}[op])


    def _expect(tokens, pos, kind, value):
        if pos >= len(tokens) or tokens[pos] != (kind, value):
            raise LangError("expected " + repr(value))
        return pos + 1


    def parse_block(tokens, pos):
        pos = _expect(tokens, pos, "sym", "{")
        stmts = []
        while not _is_sym(tokens, pos, ("}",)):
            if pos >= len(tokens):
                raise LangError("expected }")
            stmt, pos = parse_statement(tokens, pos)
            stmts.append(stmt)
        return stmts, pos + 1


    def parse_statement(tokens, pos):
        if pos >= len(tokens):
            raise LangError("unexpected end of input")
        kind, value = tokens[pos]
        if kind == "kw" and value == "let":
            if pos + 1 >= len(tokens) or tokens[pos + 1][0] != "name":
                raise LangError("expected a name after let")
            name = tokens[pos + 1][1]
            pos = _expect(tokens, pos + 2, "sym", "=")
            expr, pos = parse_expr(tokens, pos)
            return ("let", name, expr), _expect(tokens, pos, "sym", ";")
        if kind == "kw" and value == "print":
            expr, pos = parse_expr(tokens, pos + 1)
            return ("print", expr), _expect(tokens, pos, "sym", ";")
        if kind == "kw" and value == "return":
            expr, pos = parse_expr(tokens, pos + 1)
            return ("return", expr), _expect(tokens, pos, "sym", ";")
        if kind == "kw" and value == "if":
            cond, pos = parse_expr(tokens, pos + 1)
            then, pos = parse_block(tokens, pos)
            other = None
            if pos < len(tokens) and tokens[pos] == ("kw", "else"):
                other, pos = parse_block(tokens, pos + 1)
            return ("if", cond, then, other), pos
        if kind == "kw" and value == "while":
            cond, pos = parse_expr(tokens, pos + 1)
            body, pos = parse_block(tokens, pos)
            return ("while", cond, body), pos
        if kind == "kw" and value == "fn":
            if pos + 1 >= len(tokens) or tokens[pos + 1][0] != "name":
                raise LangError("expected a function name")
            name = tokens[pos + 1][1]
            pos = _expect(tokens, pos + 2, "sym", "(")
            params = []
            while not _is_sym(tokens, pos, (")",)):
                if pos >= len(tokens) or tokens[pos][0] != "name":
                    raise LangError("expected a parameter name")
                params.append(tokens[pos][1])
                pos += 1
                if _is_sym(tokens, pos, (",",)):
                    pos += 1
            body, pos = parse_block(tokens, pos + 1)
            return ("fn", name, params, body), pos
        if kind == "name" and _is_sym(tokens, pos + 1, ("=",)):
            expr, pos = parse_expr(tokens, pos + 2)
            return ("assign", value, expr), _expect(tokens, pos, "sym", ";")
        expr, pos = parse_expr(tokens, pos)
        return ("expr", expr), _expect(tokens, pos, "sym", ";")


    def parse_program(tokens):
        stmts, pos = [], 0
        while pos < len(tokens):
            stmt, pos = parse_statement(tokens, pos)
            stmts.append(stmt)
        return stmts


    class Env:
        """A scope: a dictionary of variables plus a link to the enclosing scope."""

        def __init__(self, parent=None):
            self.vars, self.parent = {}, parent

        def __contains__(self, name):
            return name in self.vars or (self.parent is not None and name in self.parent)

        def __getitem__(self, name):
            if name in self.vars:
                return self.vars[name]
            if self.parent is not None:
                return self.parent[name]
            raise KeyError(name)

        def define(self, name, value):
            self.vars[name] = value

        def assign(self, name, value):
            scope = self
            while scope is not None:
                if name in scope.vars:
                    scope.vars[name] = value
                    return
                scope = scope.parent
            raise LangError("assignment to undefined variable " + name)


    class _Return(Exception):
        def __init__(self, value):
            self.value = value


    class Interpreter:
        MAX_STEPS = 20000
        MAX_DEPTH = 40

        def __init__(self):
            self.output, self.steps, self.depth = [], 0, 0
            self.globals = Env()

        def run(self, stmts):
            self.exec_block(stmts, self.globals)
            return self.output

        def exec_block(self, stmts, env):
            for stmt in stmts:
                self.exec_stmt(stmt, env)

        def exec_stmt(self, stmt, env):
            self.steps += 1
            if self.steps > self.MAX_STEPS:
                raise LangError("step limit exceeded")
            kind = stmt[0]
            if kind == "let":
                env.define(stmt[1], evaluate(stmt[2], env))
            elif kind == "assign":
                env.assign(stmt[1], evaluate(stmt[2], env))
            elif kind == "print":
                value = evaluate(stmt[1], env)
                self.output.append(str(value))
            elif kind == "expr":
                evaluate(stmt[1], env)
            elif kind == "if":
                if evaluate(stmt[1], env):
                    self.exec_block(stmt[2], Env(env))
                elif stmt[3] is not None:
                    self.exec_block(stmt[3], Env(env))
            elif kind == "while":
                while evaluate(stmt[1], env):
                    self.exec_block(stmt[2], Env(env))
                    self.steps += 1
                    if self.steps > self.MAX_STEPS:
                        raise LangError("step limit exceeded")
            elif kind == "fn":
                env.define(stmt[1], self.make_function(stmt[1], stmt[2], stmt[3], env))
            elif kind == "return":
                raise _Return(evaluate(stmt[1], env))
            else:
                raise LangError("unknown statement " + repr(kind))

        def make_function(self, name, params, body, closure_env):
            def call(*args):
                if len(args) != len(params):
                    raise LangError(f"{name} expects {len(params)} arguments, got {len(args)}")
                if self.depth >= self.MAX_DEPTH:
                    raise LangError("recursion too deep")
                local = Env(closure_env)
                for p, a in zip(params, args):
                    local.define(p, a)
                self.depth += 1
                try:
                    self.exec_block(body, local)
                except _Return as r:
                    return r.value
                finally:
                    self.depth -= 1
                return 0
            return call


    def run_source(src):
        """Run a MiniScript program. Returns (output_lines, error_message_or_None)."""
        interp = Interpreter()
        try:
            interp.run(parse_program(tokenize(src)))
        except LangError as e:
            return interp.output, str(e)
        return interp.output, None


    program = """
    fn fib(n) {
        if n < 2 { return n; }
        return fib(n - 1) + fib(n - 2);
    }
    let i = 0;
    while i < 8 {
        print fib(i);
        i = i + 1;
    }
    fn counter(start) {
        fn next(step) { return start + step; }
        return next;
    }
    let from100 = counter(100);
    print from100(5);
    """
    print(run_source(program))
    print(run_source("print undefined_name;"))
    print(run_source("while 1 { }"))
