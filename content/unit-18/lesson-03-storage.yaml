    class KVStore:
        """A tiny log-structured key-value store: every change is appended to a log, and the log is replayed on start-up."""

        def __init__(self, log_text=""):
            self.data, self.log, self.discarded = replay(log_text)
            self.tx = None                       # None, or a list of buffered records inside a transaction

        def _write(self, rec):
            if self.tx is not None:
                self.tx.append(rec)
            else:
                self.log.append(encode_record(rec))
                apply_record(self.data, rec)

        def put(self, key, value):
            if not isinstance(key, str) or not key:
                raise ValueError("key must be a non-empty string")
            self._write({"op": "put", "key": key, "value": value})

        def get(self, key, default=None):
            if self.tx is not None:              # a transaction sees its own writes
                for rec in reversed(self.tx):
                    if rec["key"] == key:
                        return rec["value"] if rec["op"] == "put" else default
            return self.data.get(key, default)

        def delete(self, key):
            existed = key in self.keys()
            self._write({"op": "del", "key": key})
            return existed

        def keys(self):
            view = dict(self.data)
            for rec in (self.tx or []):
                apply_record(view, rec)
            return sorted(view)

        def scan(self, prefix=""):
            return [k for k in self.keys() if k.startswith(prefix)]

        def log_text(self):
            return "".join(line + "\n" for line in self.log)

        def begin(self):
            if self.tx is not None:
                raise RuntimeError("transaction already open")
            self.tx = []

        def commit(self):
            if self.tx is None:
                raise RuntimeError("no open transaction")
            records, self.tx = self.tx, None
            if records:
                self.log.append(encode_record({"op": "begin"}))
                for rec in records:
                    self.log.append(encode_record(rec))
                self.log.append(encode_record({"op": "commit"}))
                for rec in records:
                    apply_record(self.data, rec)

        def rollback(self):
            if self.tx is None:
                raise RuntimeError("no open transaction")
            self.tx = None


    class IndexedStore(KVStore):
        """Keeps a secondary index: field value -> set of keys, updated on every write."""

        def __init__(self, field, log_text=""):
            super().__init__(log_text)
            self.field = field
            self.index = {}
            for k in self.data:
                self._index_add(k, self.data[k])

        def _index_add(self, key, value):
            if isinstance(value, dict) and self.field in value:
                self.index.setdefault(value[self.field], set()).add(key)

        def _index_remove(self, key):
            old = self.data.get(key)
            if isinstance(old, dict) and self.field in old:
                self.index.get(old[self.field], set()).discard(key)

        def put(self, key, value):
            self._index_remove(key)
            super().put(key, value)
            self._index_add(key, value)

        def delete(self, key):
            self._index_remove(key)
            return super().delete(key)

        def find(self, value):
            return sorted(self.index.get(value, set()))

    s = IndexedStore("city")
    s.put("u1", {"name": "Ana", "city": "Oslo"})
    s.put("u2", {"name": "Bo", "city": "Rome"})
    s.put("u3", {"name": "Cy", "city": "Oslo"})
    print("Oslo:", s.find("Oslo"), " Rome:", s.find("Rome"))
    s.put("u1", {"name": "Ana", "city": "Rome"})
    s.delete("u2")
    print("Oslo:", s.find("Oslo"), " Rome:", s.find("Rome"))
    print("rebuilt from the log:", IndexedStore("city", s.log_text()).find("Rome"))
  output: |
    Oslo: ['u1', 'u3']  Rome: ['u2']
    Oslo: ['u3']  Rome: ['u1']
    rebuilt from the log: ['u1']
