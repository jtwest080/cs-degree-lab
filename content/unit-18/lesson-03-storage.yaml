    def compact_log(log_text):
        """Return a new log text holding one put record per live key (sorted by key)."""
        data, _, _ = replay(log_text)
        return "".join(encode_record({"op": "put", "key": k, "value": data[k]}) + "\n" for k in sorted(data))


    E = encode_record
    records = [{"op": "put", "key": f"counter{i % 3}", "value": i} for i in range(300)]
    log = "".join(E(r) + "\n" for r in records)
    small = compact_log(log)
    print("before:", log.count("\n"), "records,", len(log), "bytes")
    print("after: ", small.count("\n"), "records,", len(small), "bytes")
    print("same data:", replay(small)[0] == replay(log)[0], replay(small)[0])
