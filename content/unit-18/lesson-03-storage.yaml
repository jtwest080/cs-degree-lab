  - name: plain operations
    code: |
      log = "".join(encode_record(r) + "\n" for r in [
          {"op": "put", "key": "a", "value": 1}, {"op": "put", "key": "b", "value": 2},
          {"op": "put", "key": "a", "value": 10}, {"op": "del", "key": "b"}, {"op": "del", "key": "never"}])
