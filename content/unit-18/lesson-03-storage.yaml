commonMistakes:
- title: Changing the data before the log record is safe
  explanation: Write-ahead means the log comes first, so a crash can always be recovered.
- title: Applying a transaction's records before the commit marker
  explanation: Recovery would then apply half a transaction.
- title: Continuing to read after a damaged line
  explanation: After a torn write you cannot know what the rest means. Stop and discard.
- title: Ignoring key validation
  explanation: Reject bad keys at the door; stored data becomes tomorrow's input.
- title: Never compacting
  explanation: The log and the recovery time grow without limit.
summary:
- A write-ahead log makes changes durable by appending records first; the in-memory dictionary is a cache rebuilt by replay.
- Checksums detect corruption; recovery stops at the first damaged line.
- Transactions buffer writes and become atomic through a commit marker in the log.
- Compaction keeps one put per live key; the garbage ratio says when it is worthwhile.
- Secondary indexes speed queries at the cost of extra work on every write and on recovery.
