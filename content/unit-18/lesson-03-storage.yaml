- type: code
  question: 'Write `live_count(log_text)` that returns how many keys are live after replaying a log made of plain `put` and `del` lines (no checksums): each line is `put KEY VALUE` or `del KEY`, one per line. Ignore blank lines.'
  starter: |
    def live_count(log_text):
        pass
  tests:
  - name: live
    code: |
      assert live_count("put a 1\nput b 2\ndel a\nput c 3\n") == 2
      assert live_count("") == 0
      assert live_count("put a 1\nput a 2\n\ndel b\n") == 1
  solution: |
    def live_count(log_text):
        live = set()
        for line in log_text.splitlines():
            parts = line.split()
            if not parts:
                continue
            if parts[0] == "put":
                live.add(parts[1])
            elif parts[0] == "del":
                live.discard(parts[1])
        return len(live)
