  solution: |
    import hashlib
    import json


    class CorruptRecord(Exception):
        pass


    def checksum(text):
        return hashlib.sha256(text.encode()).hexdigest()[:8]


    def encode_record(record):
        """record is a dict such as {"op": "put", "key": "a", "value": 1}. Returns one line (no newline)."""
        body = json.dumps(record, sort_keys=True, separators=(",", ":"))
        return checksum(body) + " " + body


    def decode_record(line):
        """Parse a line made by encode_record. Raise CorruptRecord if it is damaged."""
        check, space, body = line.partition(" ")
        if not space or len(check) != 8 or checksum(body) != check:
            raise CorruptRecord("bad checksum")
        try:
            record = json.loads(body)
        except ValueError:
            raise CorruptRecord("bad json")
        if not isinstance(record, dict) or "op" not in record:
            raise CorruptRecord("not a record")
        return record


    def apply_record(data, rec):
        if rec["op"] == "put":
            data[rec["key"]] = rec["value"]
        elif rec["op"] == "del":
            data.pop(rec["key"], None)


    def replay(log_text):
        """Rebuild the data from a log. Returns (data, kept_lines, discarded_count).

        - Plain put/del records are applied as they are read.
        - A group written between a begin record and a commit record is applied only at the commit.
        - Reading stops at the first damaged line; everything after it is discarded.
        - A begin group with no commit at the end of the log (a crash) is discarded.
        """
        data, kept, pending = {}, [], None
        lines = [l for l in log_text.split("\n") if l.strip()]
        for i, line in enumerate(lines):
            try:
                rec = decode_record(line)
            except CorruptRecord:
                discarded = len(lines) - i
                break
            else:
                kept.append(line)
                if rec["op"] == "begin":
                    pending = []
                elif rec["op"] == "commit":
                    for r in pending or []:
                        apply_record(data, r)
                    pending = None
                elif pending is not None:
                    pending.append(rec)
                else:
                    apply_record(data, rec)
        else:
            discarded = 0
        if pending is not None:
            drop = len(pending) + 1
            kept = kept[:len(kept) - drop]
            discarded += drop
        return data, kept, discarded
  explanation: Replay is the single place where durability, integrity and atomicity meet. Every other feature builds on it.
