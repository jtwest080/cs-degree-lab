id: u18-storage
title: 'Capstone B: A Database Engine'
minutes: 90
objective: 'Build the heart of a database: a log-structured key-value store that survives crashes. You will design a checksummed record format, replay a write-ahead log to rebuild state, add atomic transactions with commit and rollback, detect and survive damaged logs, and compact the log to reclaim space. This capstone brings together Units 7, 10, 12, 14 and 16.'
outcomes:
- Explain durability, write-ahead logging and why appending is a good way to write
- Design a record format with checksums that detects corruption
- Rebuild a data store by replaying a log, including after a crash
- Implement atomic transactions with commit markers and rollback
- Compact a log and reason about space, speed and recovery trade-offs
sections:
- heading: What a storage engine must do
  body: |-
    A database is more than a dictionary. A Python `dict` lives in memory and vanishes when the program ends, so a real **storage engine** adds **durability** (data survives restarts and crashes), **integrity** (damage is detected, not silently used), and **atomicity** (a group of changes either happens completely or not at all). Units 10 and 12 met these ideas as the **ACID** properties (atomicity, consistency, isolation, durability) and as journalling in file systems. Here you build them yourself.

    The simplest design that survives crashes is a **write-ahead log (WAL)**: before changing anything, **append** a record describing the change to the end of a file; to rebuild the state after a restart, **replay** the log from the start. Appending is the cheapest write there is (no seeking, no overwriting existing data, so a half-finished write damages only the tail). Many real systems are built this way: databases keep a WAL for recovery, Kafka is a distributed log, and Git's object store and an LSM-tree database (LevelDB, RocksDB, Cassandra) are descendants of the idea. The state in memory is then just a **cache of the log**, a dictionary giving fast reads, and the log is the truth.

    Our `KVStore` keeps the "file" as a list of text lines so that it runs in the browser: `log_text()` is what would be written to disk, and `KVStore(text)` is what you would do when the program starts again. Each line is one **record**: `put` (set a key), `del` (delete a key), and the markers `begin` and `commit` that bracket a transaction.
- heading: Integrity, recovery and transactions
  body: |-
    Disks fail, power is lost halfway through a write, and files get edited by mistake or on purpose (Unit 16), so every record carries a **checksum**: the first 8 hex digits of the SHA-256 hash of its body. When we read a line back we recompute the hash; a mismatch means the line is damaged (or tampered with, though for tamper-proofing against an attacker you would use an HMAC with a secret key, Lesson 16.3). Records are written with `json.dumps(..., sort_keys=True)` so the same record always produces the same bytes, and any JSON-compatible value can be stored.

    **Recovery** replays the log line by line. Plain `put` and `del` records are applied immediately. Our policy for damage is conservative: **stop at the first damaged line and ignore everything after it**, because after a torn write you cannot trust what follows. This is how real WALs behave, since a crash only ever damages the end.

    **Transactions** make several changes atomic. Inside a transaction we do not touch the log or the data: writes go to a **buffer**, reads look in the buffer first (a transaction sees its own writes), and `rollback` simply throws the buffer away. On `commit` we append `begin`, then the records, then `commit`. During replay, records between `begin` and `commit` are held back and applied **only when the commit marker is reached**. If the log ends in the middle of a group, the power failed before the commit was written, so the whole group is **discarded**: this is how a money transfer ("subtract from Alice, add to Bob") can never be half applied. The **commit marker is the atomic moment**. Real systems add **isolation** (concurrent transactions not seeing each other's changes), usually with locks or versions, which is a natural extension.
- heading: Compaction and trade-offs
  body: |-
    An append-only log grows forever: a counter updated a million times leaves a million records for one live value. **Compaction** rewrites the log keeping only what is needed, one `put` per live key (in a real system it writes a new file and then atomically swaps it in, so a crash during compaction leaves the old log intact). The ratio of wasted records to live ones measures how worthwhile compaction is; databases run it in the background when the ratio gets high.

    Every design has trade-offs worth being able to state. **Writes** are fast (append only), but **reads** need the in-memory dictionary, which must fit in RAM, and **recovery time** grows with the log (hence **snapshots** and compaction). A **secondary index**, a second dictionary from a field's value to the keys that have it, makes queries like "all users in Oslo" fast but must be updated on every write and rebuilt on recovery. **Range scans** need sorted keys (we sort on demand; real engines keep sorted structures such as B-trees or sorted string tables). **Concurrency**, **replication** and **encryption at rest** are other layers you could add.

    Security notes for your own version: validate keys and values (we reject empty or non-string keys), never put secrets into logs in plain text, keep the log file's permissions tight, and treat a log from outside as untrusted input: our parser never evaluates it, it only parses JSON.
examples:
- title: Records and checksums
  intro: 'Each record is one line: a checksum, a space and canonical JSON. Changing a single character is detected.'
  code: |
    import hashlib
    import json


    class CorruptRecord(Exception):
        pass


    def checksum(text):
        return hashlib.sha256(text.encode()).hexdigest()[:8]


    def encode_record(record):
        """record is a dict such as {"op": "put", "key": "a", "value": 1}. Returns one line (no newline)."""
        body = json.dumps(record, sort_keys=True, separators=(",", ":"))
        return checksum(body) + " " + body


    def decode_record(line):
        """Parse a line made by encode_record. Raise CorruptRecord if it is damaged."""
        check, space, body = line.partition(" ")
        if not space or len(check) != 8 or checksum(body) != check:
            raise CorruptRecord("bad checksum")
        try:
            record = json.loads(body)
        except ValueError:
            raise CorruptRecord("bad json")
        if not isinstance(record, dict) or "op" not in record:
            raise CorruptRecord("not a record")
        return record


    line = encode_record({"op": "put", "key": "balance", "value": 100})
    print(line)
    tampered = line.replace("100", "999")
    for text in (line, tampered, line[:-4]):
        try:
            print("ok     ", decode_record(text)["value"])
        except CorruptRecord as e:
            print("REJECTED", e)
  output: |
    85d8e001 {"key":"balance","op":"put","value":100}
    ok      100
    REJECTED bad checksum
    REJECTED bad checksum
  lines:
  - line: 15
    note: sort_keys and compact separators make the encoding canonical.
  - line: 22
    note: Recomputing the hash catches the damaged line before its contents are used.
- title: Replaying a log
  intro: The state is rebuilt by applying records in order. A torn write stops the replay.
  code: |
    import hashlib
    import json


    class CorruptRecord(Exception):
        pass


    def checksum(text):
        return hashlib.sha256(text.encode()).hexdigest()[:8]


    def encode_record(record):
        """record is a dict such as {"op": "put", "key": "a", "value": 1}. Returns one line (no newline)."""
        body = json.dumps(record, sort_keys=True, separators=(",", ":"))
        return checksum(body) + " " + body


    def decode_record(line):
        """Parse a line made by encode_record. Raise CorruptRecord if it is damaged."""
        check, space, body = line.partition(" ")
        if not space or len(check) != 8 or checksum(body) != check:
            raise CorruptRecord("bad checksum")
        try:
            record = json.loads(body)
        except ValueError:
            raise CorruptRecord("bad json")
        if not isinstance(record, dict) or "op" not in record:
            raise CorruptRecord("not a record")
        return record


    def apply_record(data, rec):
        if rec["op"] == "put":
            data[rec["key"]] = rec["value"]
        elif rec["op"] == "del":
            data.pop(rec["key"], None)


    def replay(log_text):
        """Rebuild the data from a log. Returns (data, kept_lines, discarded_count).

        - Plain put/del records are applied as they are read.
        - A group written between a begin record and a commit record is applied only at the commit.
        - Reading stops at the first damaged line; everything after it is discarded.
        - A begin group with no commit at the end of the log (a crash) is discarded.
        """
        data, kept, pending = {}, [], None
        lines = [l for l in log_text.split("\n") if l.strip()]
        for i, line in enumerate(lines):
            try:
                rec = decode_record(line)
            except CorruptRecord:
                discarded = len(lines) - i
                break
            else:
                kept.append(line)
                if rec["op"] == "begin":
                    pending = []
                elif rec["op"] == "commit":
                    for r in pending or []:
                        apply_record(data, r)
                    pending = None
                elif pending is not None:
                    pending.append(rec)
                else:
                    apply_record(data, rec)
        else:
            discarded = 0
        if pending is not None:
            drop = len(pending) + 1
            kept = kept[:len(kept) - drop]
            discarded += drop
        return data, kept, discarded


    E = encode_record
    log = "".join(E(r) + "\n" for r in [
        {"op": "put", "key": "alice", "value": 100}, {"op": "put", "key": "bob", "value": 50},
        {"op": "put", "key": "alice", "value": 80}, {"op": "del", "key": "bob"}, {"op": "put", "key": "carol", "value": 7}])
    data, kept, discarded = replay(log)
    print(data, len(kept), "lines kept,", discarded, "discarded")

    damaged = log.split("\n")
    damaged[3] = damaged[3][:10]                     # simulate a torn write
    data, kept, discarded = replay("\n".join(damaged))
    print(data, len(kept), "lines kept,", discarded, "discarded")
  output: |
    {'alice': 80, 'carol': 7} 5 lines kept, 0 discarded
    {'alice': 80, 'bob': 50} 3 lines kept, 2 discarded
  lines:
  - line: 40
    note: The data dictionary is just the result of applying every record.
- title: Atomic transactions and crashes
  intro: A transfer between two accounts is written as one begin...commit group. Cut the log at any point and the transfer is either fully there or fully absent.
  code: |
    import hashlib
    import json


    class CorruptRecord(Exception):
        pass


    def checksum(text):
        return hashlib.sha256(text.encode()).hexdigest()[:8]


    def encode_record(record):
        """record is a dict such as {"op": "put", "key": "a", "value": 1}. Returns one line (no newline)."""
        body = json.dumps(record, sort_keys=True, separators=(",", ":"))
        return checksum(body) + " " + body


    def decode_record(line):
        """Parse a line made by encode_record. Raise CorruptRecord if it is damaged."""
        check, space, body = line.partition(" ")
        if not space or len(check) != 8 or checksum(body) != check:
            raise CorruptRecord("bad checksum")
        try:
            record = json.loads(body)
        except ValueError:
            raise CorruptRecord("bad json")
        if not isinstance(record, dict) or "op" not in record:
            raise CorruptRecord("not a record")
        return record


    def apply_record(data, rec):
        if rec["op"] == "put":
            data[rec["key"]] = rec["value"]
        elif rec["op"] == "del":
            data.pop(rec["key"], None)


    def replay(log_text):
        """Rebuild the data from a log. Returns (data, kept_lines, discarded_count).

        - Plain put/del records are applied as they are read.
        - A group written between a begin record and a commit record is applied only at the commit.
        - Reading stops at the first damaged line; everything after it is discarded.
        - A begin group with no commit at the end of the log (a crash) is discarded.
        """
        data, kept, pending = {}, [], None
        lines = [l for l in log_text.split("\n") if l.strip()]
        for i, line in enumerate(lines):
            try:
                rec = decode_record(line)
            except CorruptRecord:
                discarded = len(lines) - i
                break
            else:
                kept.append(line)
                if rec["op"] == "begin":
                    pending = []
                elif rec["op"] == "commit":
                    for r in pending or []:
                        apply_record(data, r)
                    pending = None
                elif pending is not None:
                    pending.append(rec)
                else:
                    apply_record(data, rec)
        else:
            discarded = 0
        if pending is not None:
            drop = len(pending) + 1
            kept = kept[:len(kept) - drop]
            discarded += drop
        return data, kept, discarded


    class KVStore:
        """A tiny log-structured key-value store: every change is appended to a log, and the log is replayed on start-up."""

        def __init__(self, log_text=""):
            self.data, self.log, self.discarded = replay(log_text)
            self.tx = None                       # None, or a list of buffered records inside a transaction

        def _write(self, rec):
            if self.tx is not None:
                self.tx.append(rec)
            else:
                self.log.append(encode_record(rec))
                apply_record(self.data, rec)

        def put(self, key, value):
            if not isinstance(key, str) or not key:
                raise ValueError("key must be a non-empty string")
            self._write({"op": "put", "key": key, "value": value})

        def get(self, key, default=None):
            if self.tx is not None:              # a transaction sees its own writes
                for rec in reversed(self.tx):
                    if rec["key"] == key:
                        return rec["value"] if rec["op"] == "put" else default
            return self.data.get(key, default)

        def delete(self, key):
            existed = key in self.keys()
            self._write({"op": "del", "key": key})
            return existed

        def keys(self):
            view = dict(self.data)
            for rec in (self.tx or []):
                apply_record(view, rec)
            return sorted(view)

        def scan(self, prefix=""):
            return [k for k in self.keys() if k.startswith(prefix)]

        def log_text(self):
            return "".join(line + "\n" for line in self.log)

        def begin(self):
            if self.tx is not None:
                raise RuntimeError("transaction already open")
            self.tx = []

        def commit(self):
            if self.tx is None:
                raise RuntimeError("no open transaction")
            records, self.tx = self.tx, None
            if records:
                self.log.append(encode_record({"op": "begin"}))
                for rec in records:
                    self.log.append(encode_record(rec))
                self.log.append(encode_record({"op": "commit"}))
                for rec in records:
                    apply_record(self.data, rec)

        def rollback(self):
            if self.tx is None:
                raise RuntimeError("no open transaction")
            self.tx = None


    s = KVStore()
    s.put("alice", 100); s.put("bob", 50)
    s.begin()
    s.put("alice", 70)
    s.put("bob", 80)
    s.commit()
    print("after transfer:", s.data)
    lines = s.log_text().strip().split("\n")
    print("log has", len(lines), "lines")
    for cut in range(2, len(lines) + 1):
        t = KVStore("\n".join(lines[:cut]) + "\n")
        print(f"crash after {cut} lines ->", t.data)
    s.begin()
    s.put("alice", 0)
    s.rollback()
    print("after rollback:", s.data)
  output: |
    after transfer: {'alice': 70, 'bob': 80}
    log has 6 lines
    crash after 2 lines -> {'alice': 100, 'bob': 50}
    crash after 3 lines -> {'alice': 100, 'bob': 50}
    crash after 4 lines -> {'alice': 100, 'bob': 50}
    crash after 5 lines -> {'alice': 100, 'bob': 50}
    crash after 6 lines -> {'alice': 70, 'bob': 80}
    after rollback: {'alice': 70, 'bob': 80}
  lines:
  - line: 148
    note: The commit writes begin, the buffered records and commit as one group.
  - line: 152
    note: 'Cut the log after any number of lines: only the complete six-line log contains the commit marker, so only then does the transfer appear.'
