- id: record-codec
  title: 'Milestone 1: Records with checksums'
  difficulty: 3
  prompt: Write `checksum(text)` (the first 8 hex digits of the SHA-256 of the UTF-8 text), `encode_record(record)` returning `checksum(body) + " " + body` where `body` is `json.dumps(record, sort_keys=True, separators=(",", ":"))`, and `decode_record(line)` that returns the record dict. `decode_record` must raise `CorruptRecord` if the line has no space, the checksum is not 8 characters or does not match, the body is not valid JSON, or the JSON is not a dict with an `"op"` key.
  starter: |
    import hashlib
    import json


    class CorruptRecord(Exception):
        pass


    def checksum(text):
        pass


    def encode_record(record):
        pass


    def decode_record(line):
        pass
  tests:
  - name: encode
    code: |
      import hashlib
      line = encode_record({"op": "put", "key": "a", "value": 1})
      check, space, body = line.partition(" ")
      assert space == " " and len(check) == 8
      assert body == '{"key":"a","op":"put","value":1}'
      assert check == hashlib.sha256(body.encode()).hexdigest()[:8]
      assert "\n" not in line
      assert encode_record({"value": 1, "op": "put", "key": "a"}) == line
      assert checksum("hello") == hashlib.sha256(b"hello").hexdigest()[:8]
  - name: round trip
    code: |
      for rec in [{"op": "put", "key": "a", "value": 1}, {"op": "del", "key": "b"}, {"op": "begin"},
                  {"op": "put", "key": "k y", "value": {"n": [1, 2, {"x": None}], "s": "héllo \"q\""}}]:
          assert decode_record(encode_record(rec)) == rec
  - name: damage is detected
    code: |
      good = encode_record({"op": "put", "key": "a", "value": 100})
      bad_lines = [good.replace("100", "900"), good[:-3], "", "nospaces", "zzzzzzzz {}", good[1:], " " + good]
      for bad in bad_lines:
          try:
              decode_record(bad)
          except CorruptRecord:
              continue
          raise AssertionError("accepted " + repr(bad))
      body = '[1,2]'
      try:
          decode_record(checksum(body) + " " + body)
          raise AssertionError("accepted a non-record")
      except CorruptRecord:
          pass
      body = '{"key":"a"}'
      try:
          decode_record(checksum(body) + " " + body)
          raise AssertionError("accepted a record without an op")
      except CorruptRecord:
          pass
  hints:
  - '`line.partition(" ")` splits at the first space into `(checksum, space, body)`.'
  - Catch `ValueError` from `json.loads` (its error class `JSONDecodeError` is a subclass).
  solution: |
    import hashlib
    import json


    class CorruptRecord(Exception):
        pass


    def checksum(text):
        return hashlib.sha256(text.encode()).hexdigest()[:8]


    def encode_record(record):
        """record is a dict such as {"op": "put", "key": "a", "value": 1}. Returns one line (no newline)."""
        body = json.dumps(record, sort_keys=True, separators=(",", ":"))
        return checksum(body) + " " + body


    def decode_record(line):
        """Parse a line made by encode_record. Raise CorruptRecord if it is damaged."""
        check, space, body = line.partition(" ")
        if not space or len(check) != 8 or checksum(body) != check:
            raise CorruptRecord("bad checksum")
        try:
            record = json.loads(body)
        except ValueError:
            raise CorruptRecord("bad json")
        if not isinstance(record, dict) or "op" not in record:
            raise CorruptRecord("not a record")
        return record
  explanation: Checksums turn silent corruption into a loud, handleable error.
- id: replay-log
  title: 'Milestone 2: Recovery by replay'
  difficulty: 4
  prompt: 'The starter has the record codec. Write `apply_record(data, rec)` (a `put` sets `data[key]`, a `del` removes it if present, anything else is ignored) and `replay(log_text)` returning `(data, kept_lines, discarded_count)`. Read the non-blank lines in order. Plain records are applied immediately; records between a `begin` and a `commit` are applied only when the `commit` is read. Stop at the first damaged line: count it and all later lines as discarded. If the log ends inside a `begin` group with no commit, drop that group''s lines (including the `begin`) from `kept_lines` and count them as discarded too.'
