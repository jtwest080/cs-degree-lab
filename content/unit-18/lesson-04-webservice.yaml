  solution: |+
    def validate(data, schema):
        """Check a JSON object against a schema. Returns a sorted list of error strings (empty if valid).

        schema maps field name -> {"type": "string"|"integer"|"boolean", "required": bool,
                                   "min": number, "max": number, "max_length": int, "choices": list}
        Unknown fields are errors. "min"/"max" apply to integers, "max_length" to strings.
        """
        if not isinstance(data, dict):
            return ["body must be an object"]
        errors = []
        for name in data:
            if name not in schema:
                errors.append(f"{name}: unknown field")
        for name, rule in schema.items():
            if name not in data:
                if rule.get("required"):
                    errors.append(f"{name}: required")
                continue
            value, kind = data[name], rule["type"]
            if kind == "string":
                ok = isinstance(value, str)
            elif kind == "integer":
                ok = isinstance(value, int) and not isinstance(value, bool)
            else:
                ok = isinstance(value, bool)
            if not ok:
                errors.append(f"{name}: must be a {kind}")
                continue
            if kind == "string" and "max_length" in rule and len(value) > rule["max_length"]:
                errors.append(f"{name}: too long (max {rule['max_length']})")
            if kind == "integer":
                if "min" in rule and value < rule["min"]:
                    errors.append(f"{name}: must be at least {rule['min']}")
                if "max" in rule and value > rule["max"]:
                    errors.append(f"{name}: must be at most {rule['max']}")
            if "choices" in rule and value not in rule["choices"]:
                errors.append(f"{name}: must be one of {sorted(rule['choices'])}")
        return sorted(errors)


    SECURITY_HEADERS = {
        "X-Content-Type-Options": "nosniff",
        "X-Frame-Options": "DENY",
        "Referrer-Policy": "no-referrer",
        "Content-Security-Policy": "default-src 'none'; frame-ancestors 'none'",
        "Cache-Control": "no-store",
    }


    def secure(response, request_origin, allowed_origins):
        """Return a copy of the response with security headers and, for an allowed origin, CORS headers."""
        headers = dict(response["headers"])
        for name, value in SECURITY_HEADERS.items():
            headers.setdefault(name, value)
        if request_origin is not None and request_origin in allowed_origins:
            headers["Access-Control-Allow-Origin"] = request_origin
            headers["Vary"] = "Origin"
        return {"status": response["status"], "headers": headers, "body": response["body"]}


  explanation: 'Validation is an allow-list: describe what is acceptable and refuse everything else. Never reflect untrusted origins back blindly.'
commonMistakes:
- title: Leaking exception text in a 500 response
  explanation: Stack traces and messages help attackers. Log them privately and return a generic message.
- title: Mixing up 401 and 403
  explanation: 401 means the client has not proved who it is; 403 means it is known and not allowed.
- title: Comparing MACs with ==
  explanation: Use hmac.compare_digest, which does not leak how many characters matched.
- title: Trusting a token's payload before verifying its MAC
  explanation: The payload is readable by anyone; only a valid signature makes it trustworthy.
- title: Allowing * as a CORS origin on an authenticated API
  explanation: Echo only origins from an allow-list.
- title: Forgetting that True is an int
  explanation: 'Validate booleans explicitly or {"priority": true} passes an integer check.'
summary:
- A web framework is a router, handlers and middleware around a request and response.
- Routes map (method, pattern) to a handler; mismatches give 404 or 405 with an Allow header.
- Handlers return data or raise HTTPError; unexpected errors become a generic 500.
- 'Middleware wraps handlers like an onion: authentication, rate limits, logging and headers.'
- Signed expiring tokens, validated input and strict headers are the web's basic defences.
