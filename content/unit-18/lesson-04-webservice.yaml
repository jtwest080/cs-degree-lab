      def forged(claims):
          p = base64.urlsafe_b64encode(json.dumps(claims, sort_keys=True).encode()).decode().rstrip("=")
          m = base64.urlsafe_b64encode(hmac.new(b"key", p.encode(), hashlib.sha256).digest()).decode().rstrip("=")
