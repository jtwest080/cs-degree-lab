- title: The middleware onion
  intro: 'The first middleware is the outermost: it enters first and leaves last.'
  code: |
    import json
    from urllib.parse import parse_qs, urlsplit


    class HTTPError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status, self.message = status, message


    def json_response(status, data=None, headers=None):
        h = {"Content-Type": "application/json"}
        h.update(headers or {})
        return {"status": status, "headers": h, "body": "" if data is None else json.dumps(data, sort_keys=True)}




    import base64
    import hashlib
    import hmac
    import json


    def build_chain(handler, middlewares):
        """A middleware is a function (request, next_handler) -> response. The first one added runs first (outermost)."""
        for mw in reversed(middlewares):
            handler = (lambda mw, nxt: lambda request: mw(request, nxt))(mw, handler)
        return handler




    def request_log(log):
        """Middleware: after the response comes back, append 'METHOD /path -> status' to the list `log`."""
        def middleware(request, nxt):
            response = nxt(request)
            log.append(f"{request['method']} {request['path']} -> {response['status']}")
            return response
        return middleware


    def timer(name):
        def middleware(request, nxt):
            print("enter", name)
            response = nxt(request)
            print("leave", name, "with", response["status"])
            return response
        return middleware

    def handler(request):
        print("handler runs")
        return json_response(200, {"ok": True})

    log = []
    chain = build_chain(handler, [timer("outer"), request_log(log), timer("inner")])
    chain({"method": "GET", "path": "/ping"})
    print(log)
  output: |
    enter outer
    enter inner
    handler runs
    leave inner with 200
    leave outer with 200
    ['GET /ping -> 200']
  lines:
  - line: 56
    note: The first middleware in the list is the outermost layer.
  - line: 58
    note: The logger saw the response after the inner layer returned it.
- title: Signed tokens
  intro: A token that is expired, forged or signed with another key is rejected. Missing or malformed credentials give 401.
  code: |
    import json
    from urllib.parse import parse_qs, urlsplit


    class HTTPError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status, self.message = status, message


    def json_response(status, data=None, headers=None):
        h = {"Content-Type": "application/json"}
        h.update(headers or {})
        return {"status": status, "headers": h, "body": "" if data is None else json.dumps(data, sort_keys=True)}




    import base64
    import hashlib
    import hmac
    import json


    def build_chain(handler, middlewares):
        """A middleware is a function (request, next_handler) -> response. The first one added runs first (outermost)."""
        for mw in reversed(middlewares):
            handler = (lambda mw, nxt: lambda request: mw(request, nxt))(mw, handler)
        return handler




    def _b64(data):
        return base64.urlsafe_b64encode(data).decode().rstrip("=")


    def sign_token(secret, user, expires):
        payload = _b64(json.dumps({"sub": user, "exp": expires}, sort_keys=True).encode())
        mac = _b64(hmac.new(secret, payload.encode(), hashlib.sha256).digest())
        return payload + "." + mac


    def verify_token(secret, token, now):
        """Return the user name if the token is genuine and unexpired, otherwise None."""
        payload, dot, mac = token.partition(".")
        if not dot:
            return None
        good = _b64(hmac.new(secret, payload.encode(), hashlib.sha256).digest())
        if not hmac.compare_digest(mac.encode(), good.encode()):
            return None
        try:
            claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
            if claims["exp"] <= now:
                return None
            return claims["sub"] if isinstance(claims["sub"], str) else None
        except (ValueError, KeyError, TypeError):
            return None


    def require_auth(secret, clock):
        """Middleware: demand 'Authorization: Bearer <token>'; put the user name in request['user']."""
        def middleware(request, nxt):
            header = request["headers"].get("authorization", "")
            scheme, _, token = header.partition(" ")
            user = verify_token(secret, token.strip(), clock()) if scheme == "Bearer" else None
            if user is None:
                return json_response(401, {"error": "unauthorized"}, {"WWW-Authenticate": "Bearer"})
            request["user"] = user
            return nxt(request)
        return middleware




    secret = b"change-me-and-keep-me-out-of-git"
    token = sign_token(secret, "ana", 1000)
    print("token:", token[:30] + "...")
    print("valid     :", verify_token(secret, token, 500))
    print("expired   :", verify_token(secret, token, 1000))
    print("wrong key :", verify_token(b"other", token, 500))
    payload, mac = token.split(".")
    print("tampered  :", verify_token(secret, payload[:-2] + "AA." + mac, 500))

    chain = build_chain(lambda req: json_response(200, {"hello": req["user"]}), [require_auth(secret, lambda: 500)])
    for header in ["Bearer " + token, "Bearer nonsense", None]:
        headers = {} if header is None else {"authorization": header}
        r = chain({"headers": headers})
        print(r["status"], r["body"])
  output: |
    token: eyJleHAiOiAxMDAwLCAic3ViIjogIm...
    valid     : ana
    expired   : None
    wrong key : None
    tampered  : None
    200 {"hello": "ana"}
    401 {"error": "unauthorized"}
    401 {"error": "unauthorized"}
  lines:
  - line: 38
    note: The secret never leaves the server; keep it in an environment variable, not in code.
  - line: 83
    note: Changing even two characters of the payload breaks the signature.
- title: Validation and CORS
  intro: Every problem is reported at once, and only allow-listed origins receive CORS headers.
  code: |
    def validate(data, schema):
        """Check a JSON object against a schema. Returns a sorted list of error strings (empty if valid).

        schema maps field name -> {"type": "string"|"integer"|"boolean", "required": bool,
                                   "min": number, "max": number, "max_length": int, "choices": list}
        Unknown fields are errors. "min"/"max" apply to integers, "max_length" to strings.
        """
        if not isinstance(data, dict):
            return ["body must be an object"]
        errors = []
        for name in data:
            if name not in schema:
                errors.append(f"{name}: unknown field")
        for name, rule in schema.items():
            if name not in data:
                if rule.get("required"):
                    errors.append(f"{name}: required")
                continue
            value, kind = data[name], rule["type"]
            if kind == "string":
                ok = isinstance(value, str)
            elif kind == "integer":
                ok = isinstance(value, int) and not isinstance(value, bool)
            else:
                ok = isinstance(value, bool)
            if not ok:
                errors.append(f"{name}: must be a {kind}")
                continue
            if kind == "string" and "max_length" in rule and len(value) > rule["max_length"]:
                errors.append(f"{name}: too long (max {rule['max_length']})")
            if kind == "integer":
                if "min" in rule and value < rule["min"]:
                    errors.append(f"{name}: must be at least {rule['min']}")
                if "max" in rule and value > rule["max"]:
                    errors.append(f"{name}: must be at most {rule['max']}")
            if "choices" in rule and value not in rule["choices"]:
                errors.append(f"{name}: must be one of {sorted(rule['choices'])}")
        return sorted(errors)


    SECURITY_HEADERS = {
        "X-Content-Type-Options": "nosniff",
        "X-Frame-Options": "DENY",
        "Referrer-Policy": "no-referrer",
        "Content-Security-Policy": "default-src 'none'; frame-ancestors 'none'",
        "Cache-Control": "no-store",
    }


    def secure(response, request_origin, allowed_origins):
        """Return a copy of the response with security headers and, for an allowed origin, CORS headers."""
        headers = dict(response["headers"])
        for name, value in SECURITY_HEADERS.items():
            headers.setdefault(name, value)
        if request_origin is not None and request_origin in allowed_origins:
            headers["Access-Control-Allow-Origin"] = request_origin
            headers["Vary"] = "Origin"
        return {"status": response["status"], "headers": headers, "body": response["body"]}


    def preflight(request_origin, requested_method, allowed_origins, allowed_methods):
        """Answer a CORS preflight (OPTIONS) request."""
        if request_origin not in allowed_origins or requested_method not in allowed_methods:
            return {"status": 403, "headers": {}, "body": ""}
        return {"status": 204, "headers": {"Access-Control-Allow-Origin": request_origin,
                                           "Access-Control-Allow-Methods": ", ".join(sorted(allowed_methods)),
                                           "Access-Control-Max-Age": "600", "Vary": "Origin"}, "body": ""}


    schema = {"title": {"type": "string", "required": True, "max_length": 20},
              "priority": {"type": "integer", "min": 1, "max": 3}}
    for body in [{"title": "Ship it", "priority": 2}, {"priority": 9, "colour": "red"}, ["not", "an", "object"]]:
        print(validate(body, schema))

    resp = {"status": 200, "headers": {"Content-Type": "application/json"}, "body": "{}"}
    allowed = {"https://notes.example"}
    for origin in ["https://notes.example", "https://evil.example", None]:
        print(origin, "->", secure(resp, origin, allowed)["headers"].get("Access-Control-Allow-Origin"))
    print(preflight("https://notes.example", "POST", allowed, {"GET", "POST"})["status"],
          preflight("https://evil.example", "POST", allowed, {"GET", "POST"})["status"])
  output: |
    []
    ['colour: unknown field', 'priority: must be at most 3', 'title: required']
    ['body must be an object']
    https://notes.example -> https://notes.example
    https://evil.example -> None
    None -> None
    204 403
  lines:
  - line: 70
    note: A schema is data, so it can be shared with documentation and tests.
  - line: 79
    note: Browsers send an OPTIONS preflight before cross-origin POSTs; only listed origins pass.
