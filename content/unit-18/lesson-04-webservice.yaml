id: u18-webservice
title: 'Capstone C: A Web Service Framework'
minutes: 90
objective: 'Build the core of a web framework from scratch: a router with path parameters, JSON handlers with correct status codes, a middleware chain, signed-token authentication, rate limiting, input validation and security headers. You will see exactly what frameworks such as Flask and Express do for you. This capstone brings together Units 9, 11, 14 and 16.'
outcomes:
- Explain the request/response cycle and choose correct HTTP status codes
- Route requests to handlers using patterns with typed path parameters
- Compose middleware so that cross-cutting concerns wrap every handler
- Authenticate requests with signed, expiring tokens and limit request rates
- Validate untrusted input and add security headers and CORS rules
sections:
- heading: What a web framework really does
  body: |-
    A web server receives a **request** (a method such as `GET` or `POST`, a path, headers and sometimes a body) and must send back a **response** (a status code, headers and a body). A **web framework** is the code that turns that raw exchange into something pleasant to program against. Inside, it is smaller than you might expect: a **router** decides which function handles a request, **handlers** are plain functions that return data, and **middleware** wraps every request with shared behaviour such as logging or authentication.

    Our framework is deliberately pure Python and runs entirely in the browser: `App.handle(raw)` takes a dictionary describing a request and returns a dictionary describing the response. Real servers do the same job after reading bytes from a network socket (Unit 11), so everything you build here carries over to Flask, FastAPI, Express or Spring.

    Good status codes are part of a good API: `200 OK`, `201 Created`, `204 No Content` (success with no body), `400 Bad Request` (the client sent something unreadable), `401 Unauthorized` (who are you?), `403 Forbidden` (I know who you are, and the answer is no), `404 Not Found`, `405 Method Not Allowed`, `422 Unprocessable Entity` (readable but invalid), `429 Too Many Requests` and `500 Internal Server Error`.
- heading: Routing, handlers and the middleware chain
  body: |-
    The **router** stores `(method, pattern, handler)` triples. A pattern such as `/notes/<id:int>` has **path parameters** in angle brackets; `<id:int>` only matches digits and hands the handler an `int`. Matching has three outcomes that map directly to status codes: a match (`200`), a path that exists but not for this method (`405`, with an `Allow` header listing what *is* allowed), and no path at all (`404`).

    **Handlers** stay simple: they receive the request and return data. A dictionary means `200`; a `(status, data)` tuple chooses the status; `None` means `204`. To fail on purpose a handler raises `HTTPError(status, message)`. The framework turns that into a JSON error, and it turns any *other* exception into a generic `500` that does **not** reveal the exception text, since error details help attackers (Unit 16).

    **Middleware** is a function `(request, next_handler) -> response`. It can act before calling `next_handler`, after it returns, or instead of it. `build_chain` nests them like the layers of an onion: the first middleware added is the outermost, so it sees the request first and the response last. Authentication, rate limiting, logging and security headers all fit this one shape, and because they wrap the *router itself*, they also apply to 404 responses.
- heading: Authentication, limits and defensive input handling
  body: |-
    **Tokens.** After login, the server gives the client a **bearer token** and the client sends it back in `Authorization: Bearer <token>`. Ours is `payload.mac`: the payload is base64url-encoded JSON `{"sub": user, "exp": expiry}`, and the MAC is an HMAC-SHA256 of the payload with a secret that only the server knows. Anyone can *read* the payload, but nobody can *change* it without the secret, so the server can trust what it verifies (this is the idea behind JWTs, which you saw in Unit 16). Always compare MACs with `hmac.compare_digest`, which takes the same time however many characters match, and always check the expiry.

    **Rate limiting** protects against brute-forcing and overload. Ours keeps the recent request times for each client and answers `429` with a `Retry-After` header when a client exceeds its budget in a sliding window. Rejected requests are not recorded, so waiting is always enough.

    **Validation.** Everything in a request body is untrusted. A **schema** states the allowed fields, their types, ranges, lengths and choices; `validate` returns a list of precise messages, and the handler turns a non-empty list into a `422`. Reject **unknown fields** (they hide mass-assignment bugs) and remember that in Python `True` is an `int`, so it needs an explicit check.

    **Headers.** Security headers tell browsers to be careful: `X-Content-Type-Options: nosniff`, `X-Frame-Options: DENY`, a strict `Content-Security-Policy`. **CORS** controls which other websites may call your API from a browser: echo back only origins on an allow-list, never `*` for an authenticated API, and add `Vary: Origin` so caches do not mix responses up.
examples:
- title: Routing
  intro: The router distinguishes a match, a wrong method (405) and an unknown path (404). Typed parameters only match what they should.
  code: |
    class Router:
        """Matches (method, path) to a handler. Patterns look like /notes/<id:int>."""

        def __init__(self):
            self.routes = []                       # (method, pattern_segments, handler)

        def add(self, method, pattern, handler):
            self.routes.append((method.upper(), pattern.strip("/").split("/") if pattern.strip("/") else [], handler))

        @staticmethod
        def _match_segments(pattern, parts):
            if len(pattern) != len(parts):
                return None
            params = {}
            for pat, part in zip(pattern, parts):
                if pat.startswith("<") and pat.endswith(">"):
                    name, _, kind = pat[1:-1].partition(":")
                    if kind == "int":
                        if not part.isdigit():
                            return None
                        params[name] = int(part)
                    elif part:
                        params[name] = part
                    else:
                        return None
                elif pat != part:
                    return None
            return params

        def match(self, method, path):
            """Return (200, handler, params), (404, None, None) or (405, None, allowed_methods)."""
            parts = path.strip("/").split("/") if path.strip("/") else []
            allowed = set()
            for m, pattern, handler in self.routes:
                params = self._match_segments(pattern, parts)
                if params is None:
                    continue
                if m == method.upper():
                    return 200, handler, params
                allowed.add(m)
            if allowed:
                return 405, None, sorted(allowed)
            return 404, None, None


    r = Router()
    r.add("GET", "/notes", "list notes")
    r.add("POST", "/notes", "create note")
    r.add("GET", "/notes/<id:int>", "show note")
    for method, path in [("GET", "/notes"), ("GET", "/notes/12"), ("GET", "/notes/abc"), ("DELETE", "/notes"), ("GET", "/other")]:
        print(method, path, "->", r.match(method, path))
  output: |
    GET /notes -> (200, 'list notes', {})
    GET /notes/12 -> (200, 'show note', {'id': 12})
    GET /notes/abc -> (404, None, None)
    DELETE /notes -> (405, None, ['GET', 'POST'])
    GET /other -> (404, None, None)
  lines:
  - line: 30
    note: match tries every route; the first that fits both path and method wins.
  - line: 51
    note: Each result is (status, handler, params). A 405 lists the allowed methods.
- title: A notes API
  intro: Handlers return plain data. Status codes come from what they return or raise.
  code: |
    import json
    from urllib.parse import parse_qs, urlsplit


    class HTTPError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status, self.message = status, message


    def json_response(status, data=None, headers=None):
        h = {"Content-Type": "application/json"}
        h.update(headers or {})
        return {"status": status, "headers": h, "body": "" if data is None else json.dumps(data, sort_keys=True)}




    class Router:
        """Matches (method, path) to a handler. Patterns look like /notes/<id:int>."""

        def __init__(self):
            self.routes = []                       # (method, pattern_segments, handler)

        def add(self, method, pattern, handler):
            self.routes.append((method.upper(), pattern.strip("/").split("/") if pattern.strip("/") else [], handler))

        @staticmethod
        def _match_segments(pattern, parts):
            if len(pattern) != len(parts):
                return None
            params = {}
            for pat, part in zip(pattern, parts):
                if pat.startswith("<") and pat.endswith(">"):
                    name, _, kind = pat[1:-1].partition(":")
                    if kind == "int":
                        if not part.isdigit():
                            return None
                        params[name] = int(part)
                    elif part:
                        params[name] = part
                    else:
                        return None
                elif pat != part:
                    return None
            return params

        def match(self, method, path):
            """Return (200, handler, params), (404, None, None) or (405, None, allowed_methods)."""
            parts = path.strip("/").split("/") if path.strip("/") else []
            allowed = set()
            for m, pattern, handler in self.routes:
                params = self._match_segments(pattern, parts)
                if params is None:
                    continue
                if m == method.upper():
                    return 200, handler, params
                allowed.add(m)
            if allowed:
                return 405, None, sorted(allowed)
            return 404, None, None


    import base64
    import hashlib
    import hmac
    import json


    def build_chain(handler, middlewares):
        """A middleware is a function (request, next_handler) -> response. The first one added runs first (outermost)."""
        for mw in reversed(middlewares):
            handler = (lambda mw, nxt: lambda request: mw(request, nxt))(mw, handler)
        return handler




    class App:
        def __init__(self):
            self.router = Router()
            self.middlewares = []

        def route(self, method, pattern):
            def decorator(fn):
                self.router.add(method, pattern, fn)
                return fn
            return decorator

        def use(self, middleware):
            self.middlewares.append(middleware)

        def _dispatch(self, request):
            status, handler, extra = self.router.match(request["method"], request["path"])
            if status == 404:
                return json_response(404, {"error": "not found"})
            if status == 405:
                return json_response(405, {"error": "method not allowed"}, {"Allow": ", ".join(extra)})
            try:
                result = handler(request, **extra)
            except HTTPError as e:
                return json_response(e.status, {"error": e.message})
            except Exception:
                return json_response(500, {"error": "internal server error"})
            if result is None:
                return json_response(204)
            if isinstance(result, tuple):
                return json_response(result[0], result[1])
            return json_response(200, result)

        def handle(self, raw):
            """raw: {"method", "path" (may include ?query), "headers", "body"}. Returns a response dict."""
            parts = urlsplit(raw.get("path", "/"))
            request = {"method": raw.get("method", "GET").upper(), "path": parts.path,
                       "query": {k: v[0] for k, v in parse_qs(parts.query).items()},
                       "headers": {k.lower(): v for k, v in (raw.get("headers") or {}).items()},
                       "client": raw.get("client", "unknown"), "json": None, "user": None}
            body = raw.get("body")
            if request["method"] in ("POST", "PUT", "PATCH") and body:
                try:
                    request["json"] = json.loads(body)
                except ValueError:
                    return json_response(400, {"error": "invalid JSON"})
            return build_chain(self._dispatch, self.middlewares)(request)


    app = App()
    notes = {1: "buy milk"}

    @app.route("GET", "/notes/<id:int>")
    def show(request, id):
        if id not in notes:
            raise HTTPError(404, "no such note")
        return {"id": id, "text": notes[id]}

    @app.route("POST", "/notes")
    def create(request):
        new_id = max(notes, default=0) + 1
        notes[new_id] = request["json"]["text"]
        return 201, {"id": new_id}

    def call(method, path, body=None):
        r = app.handle({"method": method, "path": path, "body": body})
        print(method, path, "->", r["status"], r["body"])

    call("GET", "/notes/1")
    call("GET", "/notes/9")
    call("POST", "/notes", '{"text": "write code"}')
    call("GET", "/notes/2")
    call("POST", "/notes", "{oops")
    call("PUT", "/notes/1")
  output: |
    GET /notes/1 -> 200 {"id": 1, "text": "buy milk"}
    GET /notes/9 -> 404 {"error": "no such note"}
    POST /notes -> 201 {"id": 2}
    GET /notes/2 -> 200 {"id": 2, "text": "write code"}
    POST /notes -> 400 {"error": "invalid JSON"}
    PUT /notes/1 -> 405 {"error": "method not allowed"}
