exercises:
- id: router
  title: 'Milestone 1: The router'
  difficulty: 4
  prompt: Implement `Router`. `add(method, pattern, handler)` stores the route (methods are case-insensitive; store them upper-case). Patterns are split on `/` after stripping leading and trailing slashes; `/` is the empty pattern. A segment like `<name>` matches any non-empty text and `<id:int>` matches only digits (give the handler an `int`). `match(method, path)` returns `(200, handler, params)` for the first route that fits the path and method, `(405, None, allowed)` where `allowed` is the sorted list of methods registered for paths that fit, or `(404, None, None)`. Path segment counts must be equal.
  starter: |
    class Router:
        """Matches (method, path) to a handler. Patterns look like /notes/<id:int> or /users/<name>."""

        def __init__(self):
            self.routes = []

        def add(self, method, pattern, handler):
            pass

        def match(self, method, path):
            """Return (200, handler, params), (404, None, None) or (405, None, sorted_allowed_methods)."""
            pass
  tests:
  - name: static routes and methods
    code: |
      r = Router()
      h1, h2, h3, h5 = (lambda: 1), (lambda: 2), (lambda: 3), (lambda: 5)
      r.add("GET", "/notes", h1); r.add("POST", "/notes", h3); r.add("GET", "/", h5)
      assert r.match("GET", "/notes") == (200, h1, {})
      assert r.match("GET", "/notes/") == (200, h1, {})
      assert r.match("get", "/notes") == (200, h1, {})
      assert r.match("POST", "/notes") == (200, h3, {})
      assert r.match("GET", "/") == (200, h5, {})
      assert r.match("GET", "/nope") == (404, None, None)
      assert r.match("GET", "/notes/extra") == (404, None, None)
  - name: path parameters
    code: |
      r = Router()
      h2, h4 = (lambda: 2), (lambda: 4)
      r.add("GET", "/notes/<id:int>", h2)
      r.add("GET", "/users/<name>/posts/<pid:int>", h4)
      assert r.match("GET", "/notes/42") == (200, h2, {"id": 42})
      assert r.match("GET", "/notes/07") == (200, h2, {"id": 7})
      assert r.match("GET", "/users/ana/posts/7") == (200, h4, {"name": "ana", "pid": 7})
      for bad in ["/notes/abc", "/notes/-1", "/notes/1.5", "/notes/", "/users/ana/posts/x", "/users//posts/1"]:
          assert r.match("GET", bad)[0] == 404, bad
  - name: 405 lists the allowed methods
    code: |
      r = Router()
      r.add("GET", "/notes", 1); r.add("POST", "/notes", 2); r.add("DELETE", "/notes/<id:int>", 3)
