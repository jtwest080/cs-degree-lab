      import base64, hashlib, hmac, json
      tok = sign_token(b"key", "ana", 100)
      payload, mac = tok.split(".")
      evil = base64.urlsafe_b64encode(json.dumps({"sub": "admin", "exp": 100}, sort_keys=True).encode()).decode().rstrip("=")
      for bad in [evil + "." + mac, payload + "." + mac[:-2] + "AA", payload, "", ".", "abc.def", payload + ".", "." + mac, payload + "." + "\u00e9" * 4]:
