    import json
    from urllib.parse import parse_qs, urlsplit


    class HTTPError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status, self.message = status, message


    def json_response(status, data=None, headers=None):
        h = {"Content-Type": "application/json"}
        h.update(headers or {})
        return {"status": status, "headers": h, "body": "" if data is None else json.dumps(data, sort_keys=True)}




    import base64
    import hashlib
    import hmac
    import json


    def build_chain(handler, middlewares):
        """A middleware is a function (request, next_handler) -> response. The first one added runs first (outermost)."""
        for mw in reversed(middlewares):
            handler = (lambda mw, nxt: lambda request: mw(request, nxt))(mw, handler)
        return handler




    def rate_limit(max_requests, window, clock):
        """Middleware: at most max_requests per client in any sliding window of `window` seconds."""
        seen = {}
        def middleware(request, nxt):
            now = clock()
            recent = [t for t in seen.get(request["client"], []) if now - t < window]
            if len(recent) >= max_requests:
                seen[request["client"]] = recent
                retry = max(1, int(window - (now - recent[0]) + 0.999))
                return json_response(429, {"error": "too many requests"}, {"Retry-After": str(retry)})
            recent.append(now)
            seen[request["client"]] = recent
            return nxt(request)
        return middleware


    def request_log(log):
        """Middleware: after the response comes back, append 'METHOD /path -> status' to the list `log`."""
        def middleware(request, nxt):
            response = nxt(request)
            log.append(f"{request['method']} {request['path']} -> {response['status']}")
            return response
        return middleware
  explanation: The onion shape makes cross-cutting behaviour composable. The late-binding trap of closures in loops (Unit 3) is the one subtle part.
