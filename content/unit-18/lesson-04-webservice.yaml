    import base64
    import hashlib
    import hmac
    import json


    def build_chain(handler, middlewares):
        """A middleware is a function (request, next_handler) -> response. The first one added runs first (outermost)."""
        for mw in reversed(middlewares):
            handler = (lambda mw, nxt: lambda request: mw(request, nxt))(mw, handler)
        return handler




    class App:
        def __init__(self):
            self.router = Router()
            self.middlewares = []

        def route(self, method, pattern):
            def decorator(fn):
                self.router.add(method, pattern, fn)
                return fn
            return decorator

        def use(self, middleware):
            self.middlewares.append(middleware)

        def _dispatch(self, request):
            status, handler, extra = self.router.match(request["method"], request["path"])
            if status == 404:
                return json_response(404, {"error": "not found"})
            if status == 405:
                return json_response(405, {"error": "method not allowed"}, {"Allow": ", ".join(extra)})
            try:
                result = handler(request, **extra)
            except HTTPError as e:
                return json_response(e.status, {"error": e.message})
            except Exception:
                return json_response(500, {"error": "internal server error"})
            if result is None:
                return json_response(204)
            if isinstance(result, tuple):
                return json_response(result[0], result[1])
            return json_response(200, result)

        def handle(self, raw):
            """raw: {"method", "path" (may include ?query), "headers", "body"}. Returns a response dict."""
            parts = urlsplit(raw.get("path", "/"))
            request = {"method": raw.get("method", "GET").upper(), "path": parts.path,
                       "query": {k: v[0] for k, v in parse_qs(parts.query).items()},
                       "headers": {k.lower(): v for k, v in (raw.get("headers") or {}).items()},
                       "client": raw.get("client", "unknown"), "json": None, "user": None}
            body = raw.get("body")
            if request["method"] in ("POST", "PUT", "PATCH") and body:
                try:
                    request["json"] = json.loads(body)
                except ValueError:
                    return json_response(400, {"error": "invalid JSON"})
            return build_chain(self._dispatch, self.middlewares)(request)
  explanation: 'A framework''s whole job is translation: raw request in, request object for handlers, and handler results back into proper responses.'
