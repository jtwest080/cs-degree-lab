      assert neighbours((0, 0), 3, 3) == [(0, 1), (1, 0)]
      assert neighbours((2, 2), 3, 3) == [(2, 1), (1, 2)]
      assert neighbours((0, 0), 1, 1) == []
  solution: |
    def neighbours(cell, w, h):
        x, y = cell
        result = []
        for dx, dy in [(0, -1), (0, 1), (-1, 0), (1, 0)]:
            nx, ny = x + dx, y + dy
            if 0 <= nx < w and 0 <= ny < h:
                result.append((nx, ny))
        return result
