        return "\n".join(rows)


    class SaveError(ValueError):
        """A save file that is damaged, edited or from the wrong version."""


    STATUSES = ("playing", "won", "lost")


    def _cell(value, level):
        if not isinstance(value, list) or len(value) != 2 or not all(type(v) is int for v in value):
            raise SaveError("a cell must be a list of two integers")
        cell = (value[0], value[1])
        if not in_bounds(level, cell) or cell in level["walls"]:
            raise SaveError(f"cell {cell} is not on the floor")
        return cell


    def save_state(state):
        return json.dumps({"version": 1, "map": level_to_text(state["level"]), "player": list(state["player"]),
                           "guards": [list(g) for g in state["guards"]], "coins": sorted(list(c) for c in state["coins"]),
                           "score": state["score"], "turns": state["turns"], "status": state["status"]}, sort_keys=True)


    def load_state(text):
        """Rebuild a state from save_state's text. Treat the text as untrusted: raise SaveError for anything odd."""
        try:
            data = json.loads(text)
        except ValueError:
            raise SaveError("not valid JSON")
        fields = {"version", "map", "player", "guards", "coins", "score", "turns", "status"}
        if not isinstance(data, dict) or set(data) != fields:
            raise SaveError("unexpected fields")
        if type(data["version"]) is not int or data["version"] != 1:
            raise SaveError("unsupported version")
        if not isinstance(data["map"], str):
            raise SaveError("bad map")
        try:
            level = parse_level(data["map"])
        except ValueError as e:
            raise SaveError(f"bad map: {e}")
        for key in ("score", "turns"):
            if type(data[key]) is not int or data[key] < 0:
                raise SaveError(f"bad {key}")
        if data["status"] not in STATUSES:
            raise SaveError("bad status")
        player = _cell(data["player"], level)
        if not isinstance(data["guards"], list) or len(data["guards"]) != len(level["guards"]):
            raise SaveError("wrong number of guards")
        guards = tuple(_cell(g, level) for g in data["guards"])
        if not isinstance(data["coins"], list):
            raise SaveError("bad coins")
        coins = frozenset(_cell(c, level) for c in data["coins"])
        if not coins <= level["coins"]:
            raise SaveError("coins that are not in the level")
        return {"level": level, "player": player, "guards": guards, "coins": coins,
                "score": data["score"], "turns": data["turns"], "status": data["status"]}
  explanation: Every field of an untrusted file needs a check. Raising one specific exception type lets the game say "this save is damaged" instead of crashing.
