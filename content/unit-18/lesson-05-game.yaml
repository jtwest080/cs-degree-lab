  solution: |
    import json
    import random
    from collections import deque

    DIRS = {"up": (0, -1), "down": (0, 1), "left": (-1, 0), "right": (1, 0), "wait": (0, 0)}
    ORDER = [(0, -1), (0, 1), (-1, 0), (1, 0)]          # up, down, left, right


    def in_bounds(level, cell):
        return 0 <= cell[0] < level["w"] and 0 <= cell[1] < level["h"]


    VALID = set("#.@X$g")


    def parse_level(text):
        """Turn ASCII art into a level dictionary. Raises ValueError for a badly formed level."""
        rows = [r.rstrip("\r") for r in text.strip("\n").split("\n")]
        if not rows[0]:
            raise ValueError("empty level")
        width = len(rows[0])
        walls, coins, guards, starts, exits = set(), set(), [], [], []
        for y, row in enumerate(rows):
            if len(row) != width:
                raise ValueError(f"row {y} has {len(row)} columns, expected {width}")
            for x, ch in enumerate(row):
                if ch not in VALID:
                    raise ValueError(f"unknown character {ch!r} at ({x}, {y})")
                if ch == "#":
                    walls.add((x, y))
                elif ch == "$":
                    coins.add((x, y))
                elif ch == "g":
                    guards.append((x, y))
                elif ch == "@":
                    starts.append((x, y))
                elif ch == "X":
                    exits.append((x, y))
        if len(starts) != 1:
            raise ValueError("a level needs exactly one @")
        if len(exits) != 1:
            raise ValueError("a level needs exactly one X")
        return {"w": width, "h": len(rows), "walls": frozenset(walls), "start": starts[0], "exit": exits[0],
                "coins": frozenset(coins), "guards": tuple(guards)}


    def bfs_path(level, start, goal):
        """Shortest path from start to goal (both included) as a list of cells, or None if there is none."""
        if start == goal:
            return [start]
        parent = {start: None}
        queue = deque([start])
        while queue:
            cell = queue.popleft()
            for dx, dy in ORDER:
                nxt = (cell[0] + dx, cell[1] + dy)
                if nxt in parent or not in_bounds(level, nxt) or nxt in level["walls"]:
                    continue
                parent[nxt] = cell
                if nxt == goal:
                    path = [nxt]
                    while parent[path[-1]] is not None:
                        path.append(parent[path[-1]])
                    return path[::-1]
                queue.append(nxt)
        return None


    def generate_level(w, h, seed, density=0.25, coins=3, guards=1):
        """Make a random but always solvable level as text. The same arguments always give the same level."""
        if w < 5 or h < 5:
            raise ValueError("levels must be at least 5 by 5")
        rng = random.Random(seed)
        grid = [["#" if x in (0, w - 1) or y in (0, h - 1) or rng.random() < density else "." for x in range(w)]
                for y in range(h)]
        x, y = 1, 1
        grid[y][x] = "."
        while (x, y) != (w - 2, h - 2):                 # carve a guaranteed route from start to exit
            options = []
            if x < w - 2:
                options.append((1, 0))
            if y < h - 2:
                options.append((0, 1))
            dx, dy = rng.choice(options)
            x, y = x + dx, y + dy
            grid[y][x] = "."
        free = [(cx, cy) for cy in range(h) for cx in range(w)
                if grid[cy][cx] == "." and (cx, cy) not in ((1, 1), (w - 2, h - 2))]
        chosen = rng.sample(free, min(coins, len(free)))
        for cx, cy in chosen:
            grid[cy][cx] = "$"
        far = [c for c in free if c not in chosen and abs(c[0] - 1) + abs(c[1] - 1) >= 4]
        for cx, cy in rng.sample(far, min(guards, len(far))):
            grid[cy][cx] = "g"
        grid[1][1] = "@"
        grid[h - 2][w - 2] = "X"
        return "\n".join("".join(row) for row in grid)
  explanation: Guaranteeing a property by construction beats generating randomly and hoping. The seed turns a random game into a reproducible one.
commonMistakes:
- title: Changing the old state inside step
  explanation: Return a new state; otherwise undo, replay and tests all break.
- title: Letting dictionary or set order decide the game
  explanation: Iterate in a fixed order so the same moves always give the same game.
- title: Checking the rules in the wrong order
  explanation: Win, loss and guard movement interact; write the order down and test every combination.
- title: Trusting a save file
  explanation: Validate types, ranges and relationships; True is also an int in Python.
- title: Using the global random generator
  explanation: Create random.Random(seed) so generation is reproducible and does not disturb other code.
- title: Hoping a random level is solvable
  explanation: Carve the guaranteed route first and add the randomness around it.
summary:
- Keep data, rules and drawing apart; the engine is pure logic that tests can drive.
- A pure step function returns a new state, which gives undo, replay and easy saving for free.
- Breadth-first search with a fixed neighbour order gives deterministic shortest-path guards.
- 'Save files are untrusted input: validate every field and raise one clear error type.'
- Seeded generators are reproducible; construct the guarantees you need instead of hoping.
