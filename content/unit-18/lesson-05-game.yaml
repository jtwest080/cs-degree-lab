- title: Breadth-first search
  intro: BFS finds a shortest route through a maze and returns None when the goal cannot be reached.
  code: |
    import json
    import random
    from collections import deque

    DIRS = {"up": (0, -1), "down": (0, 1), "left": (-1, 0), "right": (1, 0), "wait": (0, 0)}
    ORDER = [(0, -1), (0, 1), (-1, 0), (1, 0)]          # up, down, left, right


    def in_bounds(level, cell):
        return 0 <= cell[0] < level["w"] and 0 <= cell[1] < level["h"]


    VALID = set("#.@X$g")


    def parse_level(text):
        """Turn ASCII art into a level dictionary. Raises ValueError for a badly formed level."""
        rows = [r.rstrip("\r") for r in text.strip("\n").split("\n")]
        if not rows[0]:
            raise ValueError("empty level")
        width = len(rows[0])
        walls, coins, guards, starts, exits = set(), set(), [], [], []
        for y, row in enumerate(rows):
            if len(row) != width:
                raise ValueError(f"row {y} has {len(row)} columns, expected {width}")
            for x, ch in enumerate(row):
                if ch not in VALID:
                    raise ValueError(f"unknown character {ch!r} at ({x}, {y})")
                if ch == "#":
                    walls.add((x, y))
                elif ch == "$":
                    coins.add((x, y))
                elif ch == "g":
                    guards.append((x, y))
                elif ch == "@":
                    starts.append((x, y))
                elif ch == "X":
                    exits.append((x, y))
        if len(starts) != 1:
            raise ValueError("a level needs exactly one @")
        if len(exits) != 1:
            raise ValueError("a level needs exactly one X")
        return {"w": width, "h": len(rows), "walls": frozenset(walls), "start": starts[0], "exit": exits[0],
                "coins": frozenset(coins), "guards": tuple(guards)}


    def bfs_path(level, start, goal):
        """Shortest path from start to goal (both included) as a list of cells, or None if there is none."""
        if start == goal:
            return [start]
        parent = {start: None}
        queue = deque([start])
        while queue:
            cell = queue.popleft()
            for dx, dy in ORDER:
                nxt = (cell[0] + dx, cell[1] + dy)
                if nxt in parent or not in_bounds(level, nxt) or nxt in level["walls"]:
                    continue
                parent[nxt] = cell
                if nxt == goal:
                    path = [nxt]
                    while parent[path[-1]] is not None:
                        path.append(parent[path[-1]])
                    return path[::-1]
                queue.append(nxt)
        return None


    maze = parse_level("""
    @.#.....
    .##.###.
    ....#X..
    .####.#.
    ......#.
    """)
    path = bfs_path(maze, (0, 0), (5, 2))
    print("steps:", len(path) - 1)
    rows = [list("." * maze["w"]) for _ in range(maze["h"])]
    for (x, y) in maze["walls"]:
        rows[y][x] = "#"
    for (x, y) in path:
        rows[y][x] = "*"
    print("\n".join("".join(r) for r in rows))
    print(bfs_path(parse_level("@#X"), (0, 0), (2, 0)))
