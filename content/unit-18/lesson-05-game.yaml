- title: Safe save files
  intro: 'A save file is plain JSON. Impossible or damaged data is refused, but a plausible edit such as a higher score passes validation: stopping that needs a signature (Unit 16) or a server.'
  code: |
    import json
    import random
    from collections import deque

    DIRS = {"up": (0, -1), "down": (0, 1), "left": (-1, 0), "right": (1, 0), "wait": (0, 0)}
    ORDER = [(0, -1), (0, 1), (-1, 0), (1, 0)]          # up, down, left, right


    def in_bounds(level, cell):
        return 0 <= cell[0] < level["w"] and 0 <= cell[1] < level["h"]


    VALID = set("#.@X$g")


    def parse_level(text):
        """Turn ASCII art into a level dictionary. Raises ValueError for a badly formed level."""
        rows = [r.rstrip("\r") for r in text.strip("\n").split("\n")]
        if not rows[0]:
            raise ValueError("empty level")
        width = len(rows[0])
        walls, coins, guards, starts, exits = set(), set(), [], [], []
        for y, row in enumerate(rows):
            if len(row) != width:
                raise ValueError(f"row {y} has {len(row)} columns, expected {width}")
            for x, ch in enumerate(row):
                if ch not in VALID:
                    raise ValueError(f"unknown character {ch!r} at ({x}, {y})")
                if ch == "#":
                    walls.add((x, y))
                elif ch == "$":
                    coins.add((x, y))
                elif ch == "g":
                    guards.append((x, y))
                elif ch == "@":
                    starts.append((x, y))
                elif ch == "X":
                    exits.append((x, y))
        if len(starts) != 1:
            raise ValueError("a level needs exactly one @")
        if len(exits) != 1:
            raise ValueError("a level needs exactly one X")
        return {"w": width, "h": len(rows), "walls": frozenset(walls), "start": starts[0], "exit": exits[0],
                "coins": frozenset(coins), "guards": tuple(guards)}


    def bfs_path(level, start, goal):
        """Shortest path from start to goal (both included) as a list of cells, or None if there is none."""
        if start == goal:
            return [start]
        parent = {start: None}
        queue = deque([start])
        while queue:
            cell = queue.popleft()
            for dx, dy in ORDER:
                nxt = (cell[0] + dx, cell[1] + dy)
                if nxt in parent or not in_bounds(level, nxt) or nxt in level["walls"]:
                    continue
                parent[nxt] = cell
                if nxt == goal:
                    path = [nxt]
                    while parent[path[-1]] is not None:
                        path.append(parent[path[-1]])
                    return path[::-1]
                queue.append(nxt)
        return None


    def new_game(level):
        return {"level": level, "player": level["start"], "guards": level["guards"], "coins": level["coins"],
                "score": 0, "turns": 0, "status": "playing"}


    def step(state, action):
        """Return the next state after the player does `action`. The old state is never changed."""
        if action not in DIRS:
            raise ValueError(f"unknown action: {action}")
        if state["status"] != "playing":
            return state
        level = state["level"]
        old = state["player"]
        new = (old[0] + DIRS[action][0], old[1] + DIRS[action][1])
        if not in_bounds(level, new) or new in level["walls"]:
            new = old
        coins, score = state["coins"], state["score"]
        if new in coins:
            coins = coins - {new}
            score += 10
        result = dict(state, player=new, coins=coins, score=score, turns=state["turns"] + 1)
        if new in state["guards"]:
            return dict(result, status="lost")
        if new == level["exit"]:
            return dict(result, score=score + 100, status="won")
        guards = []
        for g in state["guards"]:
            path = bfs_path(level, g, new)
            guards.append(path[1] if path and len(path) > 1 else g)
        result["guards"] = tuple(guards)
        if new in result["guards"]:
            result["status"] = "lost"
        return result


    def level_to_text(level):
        rows = []
        for y in range(level["h"]):
            row = []
            for x in range(level["w"]):
                c = (x, y)
                if c in level["walls"]:
                    row.append("#")
                elif c == level["start"]:
                    row.append("@")
                elif c == level["exit"]:
                    row.append("X")
                elif c in level["coins"]:
                    row.append("$")
                elif c in level["guards"]:
                    row.append("g")
                else:
                    row.append(".")
            rows.append("".join(row))
        return "\n".join(rows)


    class SaveError(ValueError):
        """A save file that is damaged, edited or from the wrong version."""


    STATUSES = ("playing", "won", "lost")


    def _cell(value, level):
        if not isinstance(value, list) or len(value) != 2 or not all(type(v) is int for v in value):
            raise SaveError("a cell must be a list of two integers")
        cell = (value[0], value[1])
        if not in_bounds(level, cell) or cell in level["walls"]:
            raise SaveError(f"cell {cell} is not on the floor")
        return cell


    def save_state(state):
        return json.dumps({"version": 1, "map": level_to_text(state["level"]), "player": list(state["player"]),
                           "guards": [list(g) for g in state["guards"]], "coins": sorted(list(c) for c in state["coins"]),
                           "score": state["score"], "turns": state["turns"], "status": state["status"]}, sort_keys=True)


    def load_state(text):
        """Rebuild a state from save_state's text. Treat the text as untrusted: raise SaveError for anything odd."""
        try:
            data = json.loads(text)
        except ValueError:
            raise SaveError("not valid JSON")
        fields = {"version", "map", "player", "guards", "coins", "score", "turns", "status"}
        if not isinstance(data, dict) or set(data) != fields:
            raise SaveError("unexpected fields")
        if type(data["version"]) is not int or data["version"] != 1:
            raise SaveError("unsupported version")
        if not isinstance(data["map"], str):
            raise SaveError("bad map")
        try:
            level = parse_level(data["map"])
        except ValueError as e:
            raise SaveError(f"bad map: {e}")
        for key in ("score", "turns"):
            if type(data[key]) is not int or data[key] < 0:
                raise SaveError(f"bad {key}")
        if data["status"] not in STATUSES:
            raise SaveError("bad status")
        player = _cell(data["player"], level)
        if not isinstance(data["guards"], list) or len(data["guards"]) != len(level["guards"]):
            raise SaveError("wrong number of guards")
        guards = tuple(_cell(g, level) for g in data["guards"])
        if not isinstance(data["coins"], list):
            raise SaveError("bad coins")
        coins = frozenset(_cell(c, level) for c in data["coins"])
        if not coins <= level["coins"]:
            raise SaveError("coins that are not in the level")
        return {"level": level, "player": player, "guards": guards, "coins": coins,
                "score": data["score"], "turns": data["turns"], "status": data["status"]}


    def generate_level(w, h, seed, density=0.25, coins=3, guards=1):
        """Make a random but always solvable level as text. The same arguments always give the same level."""
        if w < 5 or h < 5:
            raise ValueError("levels must be at least 5 by 5")
        rng = random.Random(seed)
        grid = [["#" if x in (0, w - 1) or y in (0, h - 1) or rng.random() < density else "." for x in range(w)]
                for y in range(h)]
        x, y = 1, 1
        grid[y][x] = "."
        while (x, y) != (w - 2, h - 2):                 # carve a guaranteed route from start to exit
            options = []
            if x < w - 2:
                options.append((1, 0))
            if y < h - 2:
                options.append((0, 1))
            dx, dy = rng.choice(options)
            x, y = x + dx, y + dy
            grid[y][x] = "."
        free = [(cx, cy) for cy in range(h) for cx in range(w)
                if grid[cy][cx] == "." and (cx, cy) not in ((1, 1), (w - 2, h - 2))]
        chosen = rng.sample(free, min(coins, len(free)))
        for cx, cy in chosen:
            grid[cy][cx] = "$"
        far = [c for c in free if c not in chosen and abs(c[0] - 1) + abs(c[1] - 1) >= 4]
        for cx, cy in rng.sample(far, min(guards, len(far))):
            grid[cy][cx] = "g"
        grid[1][1] = "@"
        grid[h - 2][w - 2] = "X"
        return "\n".join("".join(row) for row in grid)


