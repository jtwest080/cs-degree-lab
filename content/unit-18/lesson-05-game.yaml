id: u18-game
title: 'Capstone D: A Game Engine'
minutes: 90
objective: 'Build a complete turn-based grid game: levels as data, shortest-path guards, a pure step function for the rules, safe save files and seeded random level generation that is guaranteed solvable. This capstone brings together Units 5, 6, 8, 12, 14 and 16.'
outcomes:
- Separate game data, rules and drawing so each can be tested on its own
- Parse and validate levels from text
- Use breadth-first search to give enemies a smart, deterministic chase
- Write a pure step function that returns a new state instead of changing the old one
- Treat save files as untrusted input and generate levels reproducibly from a seed
sections:
- heading: Data, rules and drawing
  body: |-
    Games feel like a pile of special cases, but good ones are built from three separate parts. **Data** says what exists: the map, where things are, the score. **Rules** say how the data changes when something happens: one move, one tick. **Presentation** turns data into something a player can see. In this lesson the whole engine is **pure logic with no drawing and no input**; the game shown in your browser or terminal is just `render(state)` printing characters.

    That separation is what makes the engine testable. Our central function is `step(state, action)`. It takes the current state and a player action and **returns a new state**, never changing the old one. Functions like this are called **pure** (Unit 6) and have wonderful properties: you can undo a move by keeping the previous state, replay a whole game from a list of moves, run thousands of random games to find bugs, and save a game by writing the state to a file.

    The state is a plain dictionary: `level` (the unchanging map), `player`, `guards`, the remaining `coins`, `score`, `turns` and `status` (`playing`, `won` or `lost`). The level is parsed once from ASCII art such as `#` for wall, `@` start, `X` exit, `$` coin and `g` guard, and any malformed level is refused with a clear `ValueError` at the door.
- heading: 'Artificial opponents: breadth-first search'
  body: |-
    Guards need to chase the player around walls. The classic tool is **breadth-first search (BFS)** (Unit 8): explore outward from the start one step at a time, remembering for every cell where you came from. The first time you reach the goal you have found a **shortest path**, and following the "came from" links backwards gives the route.

    Our BFS visits neighbours in a fixed order (up, down, left, right). That makes the game **deterministic**: the same moves always produce the same game. Determinism is a feature to protect, because it is what lets a bug report say "start a new game and make these ten moves" and lets tests assert exact positions.

    Each turn, after the player moves, every guard asks BFS for the shortest path to the player's *new* cell and takes the first step. A guard with no path simply waits (a sealed-off guard is harmless). Notice the careful rule order in `step`: moving onto a guard loses immediately, reaching the exit wins before the guards get to move, and only then do the guards move and possibly catch you. Game design is mostly choosing these small rules and writing them down precisely.
- heading: Saving games and generating levels
  body: |-
    A **save file** is data that outlives your program, so it is **untrusted input** (Unit 16). Players edit files, files get damaged, and old versions linger. `load_state` therefore checks everything: it parses JSON inside `try`, demands exactly the expected fields, checks types (remembering that `True` is an `int` in Python), re-parses the map, and verifies that every position is a legal floor cell, that coins are a subset of the level's coins and that the guard count matches. Anything wrong raises `SaveError` instead of producing a corrupt game. Validation catches *impossible* data, not *plausible* cheating: a player can still raise their own score. To detect that you would sign the file with an HMAC and a secret (Unit 16, and the token code in the web-service capstone) or keep scores on a server. A **version** field lets future versions of the game change the format safely.

    **Procedural generation** makes levels from an algorithm. We use `random.Random(seed)`, so the same seed always gives the same level: players can share seeds, tests can replay failures, and nothing needs storing. Random walls alone can seal the exit, so the generator first **carves a guaranteed route** from start to exit and only then scatters coins and guards on the remaining free cells (guards far from the start so that the first turn is fair). "Generate, then guarantee a property by construction" is more reliable than "generate, then test and retry".
examples:
- title: Levels as data
  intro: ASCII art becomes a level dictionary. Bad levels are refused with a message that says what is wrong.
  code: |
    import json
    import random
    from collections import deque

    DIRS = {"up": (0, -1), "down": (0, 1), "left": (-1, 0), "right": (1, 0), "wait": (0, 0)}
    ORDER = [(0, -1), (0, 1), (-1, 0), (1, 0)]          # up, down, left, right


    def in_bounds(level, cell):
        return 0 <= cell[0] < level["w"] and 0 <= cell[1] < level["h"]


    VALID = set("#.@X$g")


    def parse_level(text):
        """Turn ASCII art into a level dictionary. Raises ValueError for a badly formed level."""
        rows = [r.rstrip("\r") for r in text.strip("\n").split("\n")]
        if not rows[0]:
            raise ValueError("empty level")
        width = len(rows[0])
        walls, coins, guards, starts, exits = set(), set(), [], [], []
        for y, row in enumerate(rows):
            if len(row) != width:
                raise ValueError(f"row {y} has {len(row)} columns, expected {width}")
            for x, ch in enumerate(row):
                if ch not in VALID:
                    raise ValueError(f"unknown character {ch!r} at ({x}, {y})")
                if ch == "#":
                    walls.add((x, y))
                elif ch == "$":
                    coins.add((x, y))
                elif ch == "g":
                    guards.append((x, y))
                elif ch == "@":
                    starts.append((x, y))
                elif ch == "X":
                    exits.append((x, y))
        if len(starts) != 1:
            raise ValueError("a level needs exactly one @")
        if len(exits) != 1:
            raise ValueError("a level needs exactly one X")
        return {"w": width, "h": len(rows), "walls": frozenset(walls), "start": starts[0], "exit": exits[0],
                "coins": frozenset(coins), "guards": tuple(guards)}


    text = """
    #######
    #@..$.#
    #.##..#
    #..g.X#
    #######
    """
    level = parse_level(text)
    print("size:", level["w"], "x", level["h"])
    print("start:", level["start"], "exit:", level["exit"])
    print("coins:", sorted(level["coins"]), "guards:", level["guards"])
    print("walls:", len(level["walls"]))
    for bad in ["#@..#", "#@X?#", "#@X#\n#.#"]:
        try:
            parse_level(bad)
        except ValueError as e:
            print("refused:", e)
