id: u18-ml-pipeline
title: 'Capstone E: A Machine Learning Pipeline'
minutes: 100
objective: 'Build a complete, honest machine-learning pipeline from raw CSV text to a fairness report: a quote-aware CSV parser, cleaning with imputation, a reproducible train/test split, leak-free scaling and one-hot encoding, logistic regression trained from scratch, evaluation metrics and a per-group audit. This capstone brings together Units 4, 9, 13, 14, 16 and 17.'
outcomes:
- Parse real-world CSV, including quoted commas, quotes and line breaks
- Clean data reproducibly and report exactly what was changed
- Split data and fit scalers and encoders on training data only, to avoid leakage
- Train and evaluate a logistic regression classifier and read precision, recall and F1
- Audit a model for group differences and explain what such numbers can and cannot show
sections:
- heading: From raw text to a trustworthy dataset
  body: |-
    Most of a data project is not modelling. Real files are messy: numbers are blank or say `NA` or `n/a`, text has stray capitals and spaces, a field contains a comma inside quotes, and a few rows have no answer at all. A **pipeline** is a fixed sequence of steps that turns such raw text into something a model can learn from, written as ordinary functions so that every step can be tested and re-run.

    **CSV** looks trivial and is not: `"Smith, Ann"` is one field, `""` inside quotes means a literal quote, and a quoted field may contain a line break. A correct parser is a small **state machine** (Unit 12) that remembers whether it is inside quotes. Splitting on commas is the classic bug.

    **Cleaning** makes decisions, and every decision should be visible. We drop rows with no valid target (the answer we want to predict), replace missing numbers by the **median** (robust to outliers), mark missing categories as `unknown`, and return a **report** of how many rows were dropped and values imputed. Silent cleaning hides problems; a report lets you notice that 40% of one column was missing.
- heading: Honest evaluation and logistic regression
  body: |-
    A model must be judged on data it has never seen, so we **split** the cleaned rows into a **training set** (to learn from) and a **test set** (to grade on). The split uses `random.Random(seed)`, so it is shuffled but reproducible.

    The most common serious mistake is **data leakage**: letting information from the test set influence training. If you compute the mean and standard deviation for scaling from *all* rows, the test set has already shaped your features. So `fit_scaler` and `fit_encoder` run on the training rows only, and the same fitted scaler and encoder are then *applied* to the test rows. Categories seen only in the test set simply become all zeros.

    **Standardising** (subtracting the mean and dividing by the standard deviation) puts income in dollars and age in years on a common scale so gradient descent behaves. **One-hot encoding** turns a category into one 0/1 column per value. **Logistic regression** (Unit 17) multiplies features by weights, adds a bias and squeezes the result through the **sigmoid** to get a probability; training minimises **log loss** by gradient descent. Our `sigmoid` is written carefully so that a huge negative or positive input cannot overflow.

    Always compare with a **baseline**: a model that always predicts the majority class. If 95% of cases are negative, 95% accuracy means nothing. That is why we also read **precision** (of the ones we flagged, how many were right), **recall** (of the real positives, how many we found) and **F1** (their harmonic mean), all from the **confusion matrix** of true and false positives and negatives.
- heading: Fairness, limits and responsibility
  body: |-
    A model that approves loans, ranks job candidates or flags students affects real people, so accuracy is not enough. A **group report** computes the same statistics separately for each group: the **selection rate** (share of the group that the model says yes to) and the **true positive rate** (share of the group's genuinely qualified people who get a yes). The largest difference between groups is the **demographic parity gap** (for selection rate) or the **equal opportunity gap** (for true positive rate).

    Our synthetic data contains a *historical bias*: at the same income and debt, group `b` was approved less often. A model trained on those labels learns the pattern, and when it can see the group column its selection gap grows. **Removing the sensitive column does not make a model fair**: other columns can act as **proxies**, and here the gap stayed small without it only because this toy data has no strong proxy for the group. These numbers come from invented data and one random split; on a real project you would use far more data, check confidence intervals and ask whether the labels themselves are the problem.

    Different fairness definitions can contradict one another, so choosing one is a **human and legal decision**, not a computation. What engineers can do: measure, report honestly, keep a human in the loop for consequential decisions, document the data and its limits, and be willing to not ship a model (Unit 16's security mindset applies here as well: assume inputs and incentives are not all benign).
examples:
- title: Parsing messy CSV
  intro: Quoted commas, doubled quotes and line breaks inside fields are handled; broken files are refused with a clear error.
  code: |
    def parse_csv(text):
        """Parse CSV text into (header, rows) where rows is a list of dictionaries.

        Fields may be quoted: a quoted field can contain commas, line breaks and "" (an escaped quote).
        Blank lines are ignored. Raises ValueError for empty input, duplicate header names,
        an unterminated or misplaced quote, or a row whose field count differs from the header's.
        """
        records, record, field = [], [], ""
        in_quotes = closed = False          # closed: a quoted field has just ended
        i, n = 0, len(text)
        while i < n:
            ch = text[i]
            if in_quotes:
                if ch == '"':
                    if i + 1 < n and text[i + 1] == '"':
                        field += '"'
                        i += 1
                    else:
                        in_quotes, closed = False, True
                else:
                    field += ch
            elif ch == '"':
                if field != "" or closed:
                    raise ValueError("unexpected quote")
                in_quotes = True
            elif closed and ch not in ",\r\n":
                raise ValueError("text after a closing quote")
            elif ch == ",":
                record.append(field)
                field, closed = "", False
            elif ch in "\r\n":
                if ch == "\r" and i + 1 < n and text[i + 1] == "\n":
                    i += 1
                if record or field != "":
                    record.append(field)
                    records.append(record)
                record, field, closed = [], "", False
            else:
                field += ch
            i += 1
        if in_quotes:
            raise ValueError("unterminated quote")
        if record or field != "":
            record.append(field)
            records.append(record)
        if not records:
            raise ValueError("empty CSV")
        header = records[0]
        if len(set(header)) != len(header):
            raise ValueError("duplicate column names")
        rows = []
        for number, rec in enumerate(records[1:], start=2):
            if len(rec) != len(header):
                raise ValueError(f"line {number} has {len(rec)} fields, expected {len(header)}")
            rows.append(dict(zip(header, rec)))
        return header, rows


    tricky = 'name,note,score\n"Smith, Ann","said ""hi""",3\n"two\nlines",plain,\nBo,,7\n'
    header, rows = parse_csv(tricky)
    print(header)
    for r in rows:
        print(r)
    for bad in ['a,b\n1', 'a\n"open']:
        try:
            parse_csv(bad)
        except ValueError as e:
            print("refused:", e)
  output: |
    ['name', 'note', 'score']
    {'name': 'Smith, Ann', 'note': 'said "hi"', 'score': '3'}
    {'name': 'two\nlines', 'note': 'plain', 'score': ''}
    {'name': 'Bo', 'note': '', 'score': '7'}
    refused: line 2 has 1 fields, expected 2
    refused: unterminated quote
