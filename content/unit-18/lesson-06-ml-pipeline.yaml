        weights, bias = model
        return sigmoid(sum(w * v for w, v in zip(weights, x)) + bias)


    def train_logistic(X, y, lr=0.1, epochs=200, l2=0.0):
        """Batch gradient descent for logistic regression. Returns (weights, bias).

