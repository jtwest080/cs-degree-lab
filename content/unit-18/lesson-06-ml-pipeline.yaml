quiz:
- type: mcq
  question: What is data leakage?
  options:
  - Test-set information influencing training or feature fitting
  - Losing rows while parsing
  - A memory leak
  - A slow model
  answer: 0
  explanation: Evaluate only on data the pipeline never learned from.
- type: mcq
  question: Why impute missing numbers with the median rather than the mean?
  options:
  - The median is not distorted by extreme outliers
  - The median is faster to compute
  - Medians are always integers
  - Means cannot be computed
  answer: 0
  explanation: A few huge values can drag the mean far from typical values.
- type: mcq
  question: A dataset has 95 negatives and 5 positives. A model that always predicts negative has what accuracy and recall?
  options:
  - 95% accuracy, 0% recall
  - 5% accuracy, 100% recall
  - 100% accuracy, 100% recall
  - 50% accuracy, 50% recall
  answer: 0
  explanation: Accuracy hides the failure to find any positives.
- type: mcq
  question: What does precision measure?
  options:
  - Of the cases flagged positive, how many really are
  - Of the real positives, how many were found
  - The share of correct predictions overall
  - The model's speed
  answer: 0
  explanation: Precision is tp / (tp + fp).
- type: mcq
  question: Why is the sigmoid written differently for negative inputs?
  options:
  - To avoid overflow in exp for large values
  - To make it faster
  - Because the formula is different mathematically
  - To return integers
  answer: 0
  explanation: exp(1000) overflows; exp(-1000) is safely 0.
- type: mcq
  question: Which statement about fairness metrics is true?
  options:
  - Different definitions can conflict, so choosing one is a human decision
  - One formula is always correct
  - A gap of zero proves the model is fair in every sense
  - Removing a column always removes bias
  answer: 0
  explanation: Metrics inform the decision; they do not make it.
- type: code
  question: Write `f1(precision, recall)` returning the harmonic mean `2 * p * r / (p + r)`, or `0.0` if both are 0.
  starter: |
    def f1(precision, recall):
        pass
  tests:
  - name: f1
    code: |
      assert f1(0.5, 0.5) == 0.5
      assert f1(0.0, 0.0) == 0.0
      assert abs(f1(1.0, 0.5) - 2 / 3) < 1e-12
      assert f1(0.0, 1.0) == 0.0
  solution: |
    def f1(precision, recall):
        if precision + recall == 0:
            return 0.0
        return 2 * precision * recall / (precision + recall)
