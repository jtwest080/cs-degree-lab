    def train_test_split(rows, test_fraction, seed):
        """Shuffle the indices with random.Random(seed), use the first n_test as the test set. Does not change `rows`.

        n_test = round(len(rows) * test_fraction), but at least 1 and at most len(rows) - 1.
        Raises ValueError unless 0 < test_fraction < 1 and there are at least 2 rows.
        """
        if not 0 < test_fraction < 1 or len(rows) < 2:
            raise ValueError("need 0 < test_fraction < 1 and at least 2 rows")
        order = list(range(len(rows)))
        random.Random(seed).shuffle(order)
        n_test = min(max(1, round(len(rows) * test_fraction)), len(rows) - 1)
        return [rows[i] for i in order[n_test:]], [rows[i] for i in order[:n_test]]


    def fit_scaler(rows, cols):
        """For each numeric column: (mean, standard deviation), using the population formula. A standard deviation of 0 becomes 1.0."""
        if not rows:
            raise ValueError("cannot fit on no rows")
        scaler = {}
        for c in cols:
            values = [r[c] for r in rows]
            mean = sum(values) / len(values)
            std = (sum((v - mean) ** 2 for v in values) / len(values)) ** 0.5
            scaler[c] = (mean, std or 1.0)
        return scaler


    def fit_encoder(rows, cols):
        """For each categorical column: the sorted list of categories seen."""
        return {c: sorted({r[c] for r in rows}) for c in cols}


    def vectorize(rows, scaler, encoder):
        """One feature list per row: z-scores for the scaler's columns, then one-hot flags (1.0 or 0.0) for each category of each
        encoder column, in order. A category not seen during fitting gives all zeros for that column."""
        X = []
        for r in rows:
            x = [(r[c] - mean) / std for c, (mean, std) in scaler.items()]
            for c, categories in encoder.items():
                x.extend(1.0 if r[c] == cat else 0.0 for cat in categories)
            X.append(x)
        return X


    import math


    def sigmoid(z):
        if z >= 0:
            return 1 / (1 + math.exp(-z))
        e = math.exp(z)
        return e / (1 + e)


    def predict_proba(model, x):
        weights, bias = model
        return sigmoid(sum(w * v for w, v in zip(weights, x)) + bias)


    def train_logistic(X, y, lr=0.1, epochs=200, l2=0.0):
        """Batch gradient descent for logistic regression. Returns (weights, bias).

        Every epoch: gradient of the average log loss over all rows, plus l2 * weight for each weight (not the bias).
        Starts from all zeros, so training is deterministic.
        """
        n, d = len(X), len(X[0])
        weights, bias = [0.0] * d, 0.0
        for _ in range(epochs):
            grad_w, grad_b = [0.0] * d, 0.0
            for x, target in zip(X, y):
                error = predict_proba((weights, bias), x) - target
                for j in range(d):
                    grad_w[j] += error * x[j]
                grad_b += error
            for j in range(d):
                weights[j] -= lr * (grad_w[j] / n + l2 * weights[j])
            bias -= lr * grad_b / n
        return weights, bias


    def log_loss(model, X, y):
        total = 0.0
        for x, target in zip(X, y):
            p = min(max(predict_proba(model, x), 1e-12), 1 - 1e-12)
            total -= target * math.log(p) + (1 - target) * math.log(1 - p)
        return total / len(X)


    def predict(model, X, threshold=0.5):
        return [1 if predict_proba(model, x) >= threshold else 0 for x in X]


    def confusion(y_true, y_pred):
        pairs = list(zip(y_true, y_pred))
        return {"tp": sum(1 for t, p in pairs if t == 1 and p == 1), "fp": sum(1 for t, p in pairs if t == 0 and p == 1),
                "tn": sum(1 for t, p in pairs if t == 0 and p == 0), "fn": sum(1 for t, p in pairs if t == 1 and p == 0)}


    def metrics(y_true, y_pred):
        """accuracy, precision, recall and f1 (each 0.0 when its denominator is 0) and the confusion counts."""
        c = confusion(y_true, y_pred)
        total = len(y_true)
        accuracy = (c["tp"] + c["tn"]) / total if total else 0.0
        precision = c["tp"] / (c["tp"] + c["fp"]) if c["tp"] + c["fp"] else 0.0
        recall = c["tp"] / (c["tp"] + c["fn"]) if c["tp"] + c["fn"] else 0.0
        f1 = 2 * precision * recall / (precision + recall) if precision + recall else 0.0
        return {"accuracy": accuracy, "precision": precision, "recall": recall, "f1": f1, "confusion": c}


    def group_report(groups, y_true, y_pred):
        """Per group (keys in sorted order): size, selection_rate (share predicted 1), tpr (recall; None if the group has no
        actual positives) and accuracy."""
        report = {}
        for g in sorted(set(groups)):
            idx = [i for i, member in enumerate(groups) if member == g]
            yt, yp = [y_true[i] for i in idx], [y_pred[i] for i in idx]
            positives = sum(yt)
            report[g] = {"size": len(idx), "selection_rate": sum(yp) / len(idx),
                         "tpr": sum(1 for t, p in zip(yt, yp) if t == 1 and p == 1) / positives if positives else None,
                         "accuracy": sum(1 for t, p in zip(yt, yp) if t == p) / len(idx)}
        return report


    def disparity(report, key):
        """Largest minus smallest value of `key` across groups, ignoring None; 0.0 if fewer than two groups have a value."""
        values = [v[key] for v in report.values() if v[key] is not None]
        return max(values) - min(values) if len(values) >= 2 else 0.0


    def make_csv(n, seed):
        """Synthetic loan data with realistic mess: blanks, junk, a quoted comma, and a historical bias against group b."""
        rng = random.Random(seed)
        lines = ["id,age,income,debt,region,group,notes,approved"]
        for i in range(n):
            age = rng.randint(21, 65)
            income = round(rng.gauss(52000, 15000))
            debt = round(rng.uniform(0, 30000))
            region = rng.choice(["North", "South", "East", "West"])
            group = "a" if rng.random() < 0.6 else "b"
            score = (income - debt) / 12000 + rng.gauss(0, 0.8) - (0.9 if group == "b" else 0.0)
            approved = 1 if score > 2.6 else 0
            note = rng.choice(["", "", "first-time", '"moved, recently"', '"said ""urgent"""'])
            fields = [str(age), str(income), str(debt), region, group]
            if rng.random() < 0.05:
                fields[1] = ""
            if rng.random() < 0.04:
                fields[0] = "NA"
            if rng.random() < 0.03:
                fields[2] = "n/a"
            if rng.random() < 0.02:
                fields[3] = "abc"
            if rng.random() < 0.03:
                fields[4] = "  " + fields[4].upper() + " "
            label = "" if rng.random() < 0.02 else str(approved)
            lines.append(",".join([str(i + 1)] + fields[:-1] + [fields[-1], note, label]))
        return "\n".join(lines) + "\n"

    SCHEMA = {"age": "num", "income": "num", "debt": "num", "region": "cat", "group": "cat", "approved": "target"}


    header, raw = parse_csv(make_csv(1200, seed=7))
    rows, report = clean(raw, SCHEMA)
    for g in ("a", "b"):
        labels = [r["approved"] for r in rows if r["group"] == g]
        print(f"group {g}: {len(labels)} people, {sum(labels) / len(labels):.0%} approved in the data")

    train, test = train_test_split(rows, 0.25, seed=1)
    y_train, y_test = [r["approved"] for r in train], [r["approved"] for r in test]
    for features in (["region"], ["region", "group"]):
        scaler = fit_scaler(train, ["age", "income", "debt"])
        encoder = fit_encoder(train, features)
        model = train_logistic(vectorize(train, scaler, encoder), y_train, lr=0.5, epochs=300)
        pred = predict(model, vectorize(test, scaler, encoder))
        rep = group_report([r["group"] for r in test], y_test, pred)
        print()
        print("categorical features:", features, "accuracy:", round(metrics(y_test, pred)["accuracy"], 3))
        for g, stats in rep.items():
            print(f"  {g}: selected {stats['selection_rate']:.0%}, true positive rate {stats['tpr']:.0%}")
        print("  selection gap:", round(disparity(rep, "selection_rate"), 3), " opportunity gap:", round(disparity(rep, "tpr"), 3))
  output: |
