- title: An inverted index
  intro: Each term maps to the documents and positions where it occurs. Removing a document updates every term it used.
  code: |
    import math
    import re
    import unicodedata
    from bisect import bisect_left

    STOP_WORDS = {"a", "an", "and", "are", "as", "at", "be", "by", "for", "from", "how", "in", "is", "it", "of", "on", "or",
                  "that", "the", "to", "was", "with"}


    def _undouble(base):
        if len(base) >= 3 and base[-1] == base[-2] and base[-1] not in "aeioulsz":
            return base[:-1]
        return base


    def stem(word):
        """A tiny suffix stripper: searching, searches and searched all become search. Real stemmers (Porter) do more."""
        if len(word) <= 3:
            return word
        if word.endswith("ies") and len(word) > 4:
            word = word[:-3] + "y"
        elif word.endswith("ing") and len(word) > 5 and re.search("[aeiouy]", word[:-3]):
            word = _undouble(word[:-3])
        elif word.endswith("ed") and len(word) > 4 and re.search("[aeiouy]", word[:-2]):
            word = _undouble(word[:-2])
        elif word.endswith("es") and len(word) > 4:
            word = word[:-2]
        elif word.endswith("s") and not word.endswith(("ss", "us", "is")):
            word = word[:-1]
        if word.endswith("e") and len(word) > 3:
            word = word[:-1]
        return word


    def tokenize(text, stop_words=STOP_WORDS):
        """Normalise text into index terms.

        1. Remove accents (NFKD normalisation, then drop the combining marks) and lower-case the text.
        2. Take the runs of the letters a-z and digits 0-9 as words.
        3. Drop words of one character and words in stop_words (before stemming).
        4. Stem every remaining word with stem().
        """
        decomposed = unicodedata.normalize("NFKD", text)
        plain = "".join(ch for ch in decomposed if not unicodedata.combining(ch)).lower()
        words = re.findall(r"[a-z0-9]+", plain)
        return [stem(w) for w in words if len(w) > 1 and w not in stop_words]


    def term_frequencies(tokens):
        counts = {}
        for t in tokens:
            counts[t] = counts.get(t, 0) + 1
        return counts


    def new_index():
        return {"postings": {}, "lengths": {}, "docs": {}, "terms": {}}


    def add_document(index, doc_id, text):
        """Index a document (replacing an older version with the same id).

        postings[term][doc_id] is the list of positions of the term in the document's token list.
        lengths[doc_id] is the number of tokens, docs[doc_id] the original text and terms[doc_id] the set of its terms.
        """
        if doc_id in index["docs"]:
            remove_document(index, doc_id)
        tokens = tokenize(text)
        for position, term in enumerate(tokens):
            index["postings"].setdefault(term, {}).setdefault(doc_id, []).append(position)
        index["lengths"][doc_id] = len(tokens)
        index["docs"][doc_id] = text
        index["terms"][doc_id] = set(tokens)


    def remove_document(index, doc_id):
        """Forget a document. Terms that no document uses any more disappear. Returns False if the id is unknown."""
        if doc_id not in index["docs"]:
            return False
        for term in index["terms"].pop(doc_id):
            del index["postings"][term][doc_id]
            if not index["postings"][term]:
                del index["postings"][term]
        del index["lengths"][doc_id]
        del index["docs"][doc_id]
        return True


    def build_index(docs):
        index = new_index()
        for doc_id, text in docs.items():
            add_document(index, doc_id, text)
        return index


    def doc_frequency(index, term):
        return len(index["postings"].get(term, {}))


    def search_all(index, query):
        """Sorted ids of the documents that contain every term of the query ([] if the query has no terms)."""
        terms = tokenize(query)
        if not terms:
            return []
        return sorted(set.intersection(*(set(index["postings"].get(t, {})) for t in terms)))


    def search_any(index, query):
        """Sorted ids of the documents that contain at least one term of the query."""
        found = set()
        for t in tokenize(query):
            found |= set(index["postings"].get(t, {}))
        return sorted(found)


    def search_phrase(index, phrase):
        """Sorted ids of the documents in which the phrase's terms appear next to each other, in order."""
        terms = tokenize(phrase)
        if not terms:
            return []
        found = []
        for doc_id in search_all(index, phrase):
            positions = [set(index["postings"][t][doc_id]) for t in terms]
            if any(all(start + i in positions[i] for i in range(1, len(terms))) for start in positions[0]):
                found.append(doc_id)
        return found


    def search(index, query):
        """A tiny query language. Words must all appear; "quoted phrases" must appear as phrases; a leading minus
        (-word or -"a phrase") excludes documents. Parts that contain no terms are ignored.
        A query with no positive part finds nothing. Returns sorted document ids."""
        must, must_not = [], []
        for token in re.findall(r'-?"[^"]*"|-?\S+', query):
            negative = token.startswith("-")
            body = token[1:] if negative else token
            if body.startswith('"'):
                body = body.strip('"')
                if not tokenize(body):
                    continue
                found = set(search_phrase(index, body))
            else:
                if not tokenize(body):
                    continue
                found = set(search_all(index, body))
            (must_not if negative else must).append(found)
        if not must:
            return []
        result = set.intersection(*must)
        for excluded in must_not:
            result -= excluded
        return sorted(result)


    def idf(index, term):
        """Inverse document frequency: ln((N + 1) / (df + 1)) + 1, where N is the number of documents."""
        return math.log((len(index["lengths"]) + 1) / (doc_frequency(index, term) + 1)) + 1


    def score(index, doc_id, terms):
        """Sum over the distinct query terms that occur in the document of (1 + ln(tf)) * idf, divided by sqrt(document length).
        A document of length 0 scores 0.0."""
        length = index["lengths"].get(doc_id, 0)
        if length == 0:
            return 0.0
        total = 0.0
        for term in set(terms):
            tf = len(index["postings"].get(term, {}).get(doc_id, ()))
            if tf:
                total += (1 + math.log(tf)) * idf(index, term)
        return total / math.sqrt(length)


    def rank(index, query, k=10):
        """The k best documents containing at least one query term, as (doc_id, score), best first (ties by doc_id)."""
        terms = tokenize(query)
        candidates = set()
        for t in terms:
            candidates |= set(index["postings"].get(t, {}))
        scored = [(d, score(index, d, terms)) for d in candidates]
        scored.sort(key=lambda pair: (-pair[1], pair[0]))
        return scored[:max(k, 0)]


    def edit_distance(a, b):
        """Levenshtein distance: the fewest single-character insertions, deletions and substitutions turning a into b."""
        previous = list(range(len(b) + 1))
        for i, ca in enumerate(a, start=1):
            current = [i]
            for j, cb in enumerate(b, start=1):
                current.append(min(previous[j] + 1, current[j - 1] + 1, previous[j - 1] + (ca != cb)))
            previous = current
        return previous[-1]


    def complete(index, prefix, limit=5):
        """Index terms that start with the (lower-cased) prefix, most common first (by document frequency, then alphabetically)."""
        prefix = prefix.lower()
        terms = sorted(index["postings"])
        matches = []
        for i in range(bisect_left(terms, prefix), len(terms)):
            if not terms[i].startswith(prefix):
                break
            matches.append(terms[i])
        matches.sort(key=lambda t: (-doc_frequency(index, t), t))
        return matches[:max(limit, 0)]


    def did_you_mean(index, word, max_distance=2):
        """Suggest the index term nearest to a misspelt word, or None.

        The word is normalised with tokenize(); it must give exactly one term. If that term is already in the index,
        or no term is within max_distance edits, return None. Otherwise return the term with the smallest distance,
        then the highest document frequency, then the alphabetically first.
        """
        found = tokenize(word)
        if len(found) != 1 or found[0] in index["postings"]:
            return None
        target = found[0]
        best = None
        for term in index["postings"]:
            if abs(len(term) - len(target)) > max_distance:
                continue
            d = edit_distance(target, term)
            if d <= max_distance:
                key = (d, -doc_frequency(index, term), term)
                if best is None or key < best:
                    best = key
        return best[2] if best else None


    docs = {
        "arrays": "Arrays store items in contiguous memory, so reading item number i is fast.",
        "linked": "A linked list stores items in nodes; reading item number i means following links.",
        "hash": "Hash tables map keys to values and find items in constant time on average.",
        "sorting": "Sorting algorithms such as merge sort and quicksort put items in order.",
        "search": "Binary search finds an item in a sorted array by repeatedly halving the search range.",
        "graphs": "Graphs connect nodes with edges; breadth-first search finds shortest paths.",
        "index": "A search engine builds an inverted index that maps each word to the documents containing it.",
        "security": "Never trust input: escape output, hash passwords and validate every request.",
    }

    index = build_index(docs)
    print(len(index["docs"]), "documents,", len(index["postings"]), "distinct terms")
    for term in ["search", "item", "hash", "link"]:
        print(term, "->", index["postings"][term])
    print("document frequency of item:", doc_frequency(index, "item"))
    remove_document(index, "linked")
    print("after removing linked:", index["postings"]["item"])
  output: |
    8 documents, 59 distinct terms
    search -> {'search': [1, 8], 'graphs': [6], 'index': [0]}
    item -> {'arrays': [2, 7], 'linked': [3, 6], 'hash': [6], 'sorting': [7], 'search': [3]}
    hash -> {'hash': [0], 'security': [5]}
    link -> {'linked': [0, 10]}
    document frequency of item: 5
    after removing linked: {'arrays': [2, 7], 'hash': [6], 'sorting': [7], 'search': [3]}
