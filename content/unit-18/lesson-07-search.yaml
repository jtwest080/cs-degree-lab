        for position, term in enumerate(tokens):
            index["postings"].setdefault(term, {}).setdefault(doc_id, []).append(position)
        index["lengths"][doc_id] = len(tokens)
        index["docs"][doc_id] = text
        index["terms"][doc_id] = set(tokens)


    def remove_document(index, doc_id):
        """Forget a document. Terms that no document uses any more disappear. Returns False if the id is unknown."""
        if doc_id not in index["docs"]:
            return False
        for term in index["terms"].pop(doc_id):
            del index["postings"][term][doc_id]
            if not index["postings"][term]:
                del index["postings"][term]
        del index["lengths"][doc_id]
        del index["docs"][doc_id]
        return True


    def build_index(docs):
        index = new_index()
        for doc_id, text in docs.items():
            add_document(index, doc_id, text)
        return index


    def doc_frequency(index, term):
        return len(index["postings"].get(term, {}))


    def search_all(index, query):
        """Sorted ids of the documents that contain every term of the query ([] if the query has no terms)."""
        terms = tokenize(query)
        if not terms:
