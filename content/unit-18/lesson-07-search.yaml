id: u18-search
title: 'Capstone F: A Search Engine'
minutes: 90
objective: 'Build a miniature search engine: text normalisation and stemming, an inverted index you can update, boolean, phrase and exclusion queries, TF-IDF ranking, autocomplete and spelling suggestions, plus safe highlighting of results. This capstone brings together Units 5, 8, 9, 12, 14 and 16.'
outcomes:
- Normalise text into terms with case folding, accent removal, stop words and stemming
- Build and maintain an inverted index with positions
- Answer word, phrase and exclusion queries using set operations
- Rank results with TF-IDF and explain why rare words matter
- Offer autocomplete and spelling suggestions with binary search and edit distance
sections:
- heading: Why search needs an index
  body: |-
    The simplest search reads every document and checks whether it contains the word. That is **linear** in the size of the collection: fine for ten notes, hopeless for ten million web pages. Search engines do the work in advance: they build an **inverted index**, a dictionary from each **term** to a **postings list** of the documents (and positions) that contain it, just like the index at the back of a book. Answering a query becomes a few dictionary lookups and **set operations** (Unit 5) instead of a scan.

    Before indexing, text must be **normalised** so that `Searching`, `searches` and `SEARCH` meet at the same term. We lower-case, remove accents, split into words, drop **stop words** (very common words such as `the` and `of` that carry little meaning) and **stem** each word by stripping common endings. Our stemmer is tiny and approximate: its stems (`engin`, `whal`) need not be real words, as long as related words reduce to the same stem. Real systems use better stemmers (Porter, Snowball) or **lemmatisers** and language-specific rules.

    Each posting stores the **positions** of the term in the document. Positions cost memory, but they make **phrase queries** possible: `"search engine"` matches only where `engine` comes directly after `search`. (Because stop words are removed *before* positions are counted, `state of the art` and `state art` look alike. A real engine would keep stop-word positions.)
- heading: Queries and ranking
  body: |-
    Our tiny **query language** has three kinds of parts: plain words (all must appear: set **intersection**), `"quoted phrases"` (positions must be adjacent) and a leading minus such as `-linked` (exclude: set **difference**). `search_any` uses set **union** for "at least one of these words".

    Finding matches is not enough, because a search for `search` may match thousands of documents. **Ranking** puts the best first. **TF-IDF** combines two ideas. **Term frequency (TF)** says a document that uses a word more often is probably more about it, but with diminishing returns: we use `1 + ln(tf)`, so ten occurrences count about 3.3 times, not 10. **Inverse document frequency (IDF)** says a word that appears in few documents is more informative than one that appears everywhere: `ln((N + 1) / (df + 1)) + 1`. A document's score is the sum of `TF x IDF` over the query's words, divided by the square root of its length so that long documents do not win simply by having more words. This is a simplified cousin of the BM25 formula used by many production engines.

    Scores are only comparable *within one query*, and the ordering of ties must be deterministic (here: by document id), otherwise results flicker between runs.
- heading: Helping the searcher
  body: |-
    **Autocomplete** finds the index terms that start with what the user has typed. Keep the terms in a **sorted** list and use **binary search** (`bisect_left`, Unit 8) to jump to the first match, then walk forward while the prefix still fits. Offer the most common terms first.

    **Spelling suggestions** use **edit distance** (Levenshtein distance): the fewest single-character insertions, deletions and substitutions that turn one word into another. It is computed with **dynamic programming** (Unit 8), keeping only the previous row of the table. For `serch` the nearest term is `search` at distance 1. Comparing a typo with every term is slow for big vocabularies, so real engines first narrow the candidates (by length, by shared character n-grams, or with a trie), which is why our code skips terms whose length differs too much.

    Finally, **showing results safely**: highlighting a match means putting HTML around part of a document, and document text is untrusted. In `highlight` every piece of text goes through `html.escape` *before* the `<mark>` tags are added, so a document containing `<script>` shows up as harmless text instead of running (Unit 16: cross-site scripting).
examples:
- title: Normalising text
  intro: Case, accents, punctuation, stop words and word endings are all handled before indexing. A sentence made only of stop words disappears.
  code: |
    import math
    import re
    import unicodedata
    from bisect import bisect_left

    STOP_WORDS = {"a", "an", "and", "are", "as", "at", "be", "by", "for", "from", "how", "in", "is", "it", "of", "on", "or",
                  "that", "the", "to", "was", "with"}


    def _undouble(base):
        if len(base) >= 3 and base[-1] == base[-2] and base[-1] not in "aeioulsz":
            return base[:-1]
        return base


    def stem(word):
        """A tiny suffix stripper: searching, searches and searched all become search. Real stemmers (Porter) do more."""
        if len(word) <= 3:
            return word
        if word.endswith("ies") and len(word) > 4:
            word = word[:-3] + "y"
        elif word.endswith("ing") and len(word) > 5 and re.search("[aeiouy]", word[:-3]):
            word = _undouble(word[:-3])
        elif word.endswith("ed") and len(word) > 4 and re.search("[aeiouy]", word[:-2]):
            word = _undouble(word[:-2])
        elif word.endswith("es") and len(word) > 4:
            word = word[:-2]
        elif word.endswith("s") and not word.endswith(("ss", "us", "is")):
            word = word[:-1]
        if word.endswith("e") and len(word) > 3:
            word = word[:-1]
        return word


    def tokenize(text, stop_words=STOP_WORDS):
        """Normalise text into index terms.

        1. Remove accents (NFKD normalisation, then drop the combining marks) and lower-case the text.
        2. Take the runs of the letters a-z and digits 0-9 as words.
        3. Drop words of one character and words in stop_words (before stemming).
        4. Stem every remaining word with stem().
        """
        decomposed = unicodedata.normalize("NFKD", text)
        plain = "".join(ch for ch in decomposed if not unicodedata.combining(ch)).lower()
        words = re.findall(r"[a-z0-9]+", plain)
        return [stem(w) for w in words if len(w) > 1 and w not in stop_words]


    def term_frequencies(tokens):
        counts = {}
        for t in tokens:
            counts[t] = counts.get(t, 0) + 1
        return counts


    for text in ["The Quick brown foxes kept jumping!", "Café, naïve résumé: 3 SEARCHES", "Searching searched searches search"]:
        print(tokenize(text))
    print(tokenize("to be or not to be"))
    print(term_frequencies(tokenize("hash the hash, then hash again")))
  output: |
