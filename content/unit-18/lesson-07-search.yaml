- type: code
  question: Write `inverted(docs)` where `docs` maps ids to text. Return a dictionary mapping every lower-cased word (split on whitespace, no other cleaning) to the sorted list of ids of the documents that contain it.
  starter: |
    def inverted(docs):
        pass
  tests:
  - name: inverted
    code: |
      r = inverted({"b": "Big cat", "a": "cat nap", "c": "Cat CAT"})
      assert r == {"big": ["b"], "cat": ["a", "b", "c"], "nap": ["a"]}
      assert inverted({}) == {}
      assert inverted({"x": ""}) == {}
  solution: |
    def inverted(docs):
        result = {}
        for doc_id in sorted(docs):
            for word in set(docs[doc_id].lower().split()):
                result.setdefault(word, []).append(doc_id)
        return result
