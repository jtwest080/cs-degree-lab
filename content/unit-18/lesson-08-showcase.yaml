      assert parse_version("1.2.3") == (1, 2, 3) and parse_version("v2") == (2, 0, 0) and parse_version(" 1.10 ") == (1, 10, 0)
      assert parse_version("1.10.0") > parse_version("1.9.9")
      for bad in ["", "1.2.3.4", "1.x", "1..2", "1.0-beta", "latest", "v", "-1.0", "1.2.3 4"]:
