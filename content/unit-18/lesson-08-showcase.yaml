      card = render_card({"name": "Chess AI", "summary": "Plays well", "url": "https://example.com/chess", "tags": ["python", "ai"]})
      assert card == '<article class="card"><h3><a href="https://example.com/chess">Chess AI</a></h3><p>Plays well</p><ul class="tags"><li>python</li><li>ai</li></ul></article>'
