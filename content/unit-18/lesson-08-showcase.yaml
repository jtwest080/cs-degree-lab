- type: code
  question: 'Write `bump(version, part)` where `version` is a string like `"1.4.2"` and `part` is `"major"`, `"minor"` or `"patch"`. Return the new version string: a major bump resets minor and patch to 0, a minor bump resets patch to 0. Raise `ValueError` for another `part`.'
  starter: |
    def bump(version, part):
        pass
  tests:
  - name: bump
    code: |
      assert bump("1.4.2", "patch") == "1.4.3"
      assert bump("1.4.2", "minor") == "1.5.0"
      assert bump("1.4.2", "major") == "2.0.0"
      assert bump("0.0.9", "patch") == "0.0.10"
      try:
          bump("1.0.0", "huge")
          raise AssertionError("accepted a bad part")
      except ValueError:
          pass
  solution: |
    def bump(version, part):
        major, minor, patch = (int(x) for x in version.split("."))
        if part == "major":
            return f"{major + 1}.0.0"
        if part == "minor":
            return f"{major}.{minor + 1}.0"
        if part == "patch":
            return f"{major}.{minor}.{patch + 1}"
        raise ValueError(f"unknown part: {part}")
