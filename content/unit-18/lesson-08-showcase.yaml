      assert is_affected("1.2.2", "<1.2.3") and not is_affected("1.2.3", "<1.2.3") and is_affected("1.2.3", "<=1.2.3")
      assert is_affected("1.10.0", ">1.9.9") and is_affected("2.0", "==2.0.0") and is_affected("2.1", "!=2.0")
      assert is_affected("1.2.0", ">=1.0,<1.4") and not is_affected("1.4.0", ">=1.0,<1.4") and not is_affected("0.9", ">=1.0, <1.4")
      assert is_affected("1.0.0", " >= 1.0.0 ")
