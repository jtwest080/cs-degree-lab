exercises:
- id: api-docs
  title: 'Milestone 1: Documentation from source code'
  difficulty: 4
  prompt: 'Write `api_docs(source)` that returns Markdown for the public (not starting with `_`) top-level functions and classes in `source`. A function becomes ``### `name(parameters)` `` (parameters exactly as `ast.unparse(node.args)` prints them), a blank line, and a summary: the first paragraph of its docstring on one line (whitespace collapsed), or `_No documentation._`. A class becomes ``### class `Name` ``, a blank line and its summary, followed, when it has any, by a blank line and one bullet per method that is public or `__init__`: ``- `name(parameters)` `` plus `: ` and the first line of the method''s docstring when it has one (bullets separated by single newlines). Blocks are separated by a blank line and the whole text ends with one newline; if nothing is documented return `""`. Raise `ValueError("cannot parse: " + message)` for source with a syntax error. Use `ast.parse`, `ast.get_docstring` and `ast.unparse`.'
  starter: |
    import ast


    def api_docs(source):
        pass
  tests:
  - name: functions and classes
    code: |
      API_SRC = """
      def area(w, h=1, *rest, **kw):
          '''Compute an area.

          More details
          here.
          '''
      def _private(): pass
      def bare(x): return x
      class Box:
          '''A box.

          Holds things.'''
          def __init__(self, size): pass
          def open(self):
              '''Open it.
              Slowly.'''
          def _hidden(self): pass
          def close(self): pass
      class Empty: pass
      class _Hidden: pass
      VALUE = 3
      """

      expected = (
          "### `area(w, h=1, *rest, **kw)`\n\nCompute an area.\n\n"
          "### `bare(x)`\n\n_No documentation._\n\n"
          "### class `Box`\n\nA box.\n\n- `__init__(self, size)`\n- `open(self)`: Open it.\n- `close(self)`\n\n"
          "### class `Empty`\n\n_No documentation._\n"
      )
      assert api_docs(API_SRC) == expected
  - name: summaries use the first paragraph
    code: |
      src = 'def f():\n    """One line\n    continues here.\n\n    Second paragraph."""\n'
      assert api_docs(src) == "### `f()`\n\nOne line continues here.\n"
      src = "async def go(a, /, b, *, c=None):\n    'Run it.'\n"
      assert api_docs(src) == "### `go(a, /, b, *, c=None)`\n\nRun it.\n"
  - name: nothing to document
    code: |
      assert api_docs("") == ""
      assert api_docs("x = 1\n_y = 2\ndef _hidden(): pass\nclass _C: pass\n") == ""
      assert api_docs("def outer():\n    def inner(): pass\n") == "### `outer()`\n\n_No documentation._\n"
  - name: syntax errors
    code: |
      for bad in ["def broken(:\n", "class", "x = (1,"]:
          try:
              api_docs(bad)
          except ValueError as e:
              assert str(e).startswith("cannot parse: ")
              continue
          raise AssertionError("accepted " + repr(bad))
  hints:
  - '`for node in tree.body` visits the top-level statements; check `isinstance(node, ast.FunctionDef)` and `ast.ClassDef` (and `ast.AsyncFunctionDef`).'
  - '`" ".join(doc.split("\n\n")[0].split())` turns the first paragraph into one tidy line.'
  solution: |
    import ast


    def _summary(doc):
        if not doc:
            return "_No documentation._"
        return " ".join(doc.split("\n\n")[0].split())


    def _public(name):
        return not name.startswith("_")


    def api_docs(source):
        """Markdown reference for the public functions and classes at the top level of `source`.

        Function:  ### `name(parameters)`  + blank line + summary (the docstring's first paragraph on one line,
                   or _No documentation._).
        Class:     ### class `Name` + blank line + summary, then (if it has any) a blank line and one bullet per
                   method that is public or __init__: - `name(parameters)` plus ": " and the first line of its
                   docstring when it has one. Bullets are separated by single newlines.
        Blocks are separated by a blank line; the result ends with one newline ("" if there is nothing to document).
        Raises ValueError("cannot parse: ...") if the source has a syntax error.
        """
        try:
            tree = ast.parse(source)
        except SyntaxError as e:
            raise ValueError(f"cannot parse: {e.msg}")
        blocks = []
        for node in tree.body:
            if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and _public(node.name):
                blocks.append(f"### `{node.name}({ast.unparse(node.args)})`\n\n{_summary(ast.get_docstring(node))}")
            elif isinstance(node, ast.ClassDef) and _public(node.name):
                block = f"### class `{node.name}`\n\n{_summary(ast.get_docstring(node))}"
                bullets = []
                for item in node.body:
                    if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and (_public(item.name) or item.name == "__init__"):
                        line = f"- `{item.name}({ast.unparse(item.args)})`"
                        doc = ast.get_docstring(item)
                        if doc:
                            line += ": " + doc.splitlines()[0].strip()
                        bullets.append(line)
                if bullets:
                    block += "\n\n" + "\n".join(bullets)
                blocks.append(block)
        return "\n\n".join(blocks) + "\n" if blocks else ""
  explanation: Generated documentation can only describe what really exists. Reading code as data is what `ast` is for.
- id: doctest
  title: 'Milestone 2: Examples that test themselves'
  difficulty: 5
  prompt: 'Write `run_examples(text, namespace=None)`, a miniature doctest. Dedent `text` with `textwrap.dedent`. A line starting with `>>> ` begins an example (its code is the rest of the line); following lines starting with `... ` (or exactly `...`) continue the code, as long as no output lines have started. The lines after the code up to the next blank line or the next `>>> ` are the expected output. Run every example with `exec(compile(source, "<example>", "single"), env)` in one shared environment (a copy of `namespace`) while capturing printed text with `contextlib.redirect_stdout` into an `io.StringIO`; `"single"` mode prints the `repr` of expression results, like the interactive shell. If the code raises, the output is `"ExceptionName: message"`; if the expected output starts with `Traceback (most recent call last):`, compare using only its last line. Compare expected and actual output without trailing newlines and return a list of failures `{"line": number of the >>> line (the first line is 1), "source": code, "expected": text, "got": text}`, in order.'
  starter: |
    import contextlib
    import io
    import textwrap


    def run_examples(text, namespace=None):
        pass
  tests:
  - name: passing and failing examples
    code: |
      DOC = """Prose here.
      >>> 1 + 1
      2
      >>> x = 5
      >>> print("hi")
      hi
      >>> def f(a):
      ...     return a * 2
      ...
      >>> f(x)
      10
      >>> 1 / 0
      Traceback (most recent call last):
        File "<example>", line 1, in <module>
      ZeroDivisionError: division by zero
      >>> f(3)
      7
      >>> [1, 2]
      [1, 2]
      """

      fails = run_examples(DOC)
      assert fails == [{"line": 16, "source": "f(3)", "expected": "7", "got": "6"}], fails
      assert run_examples(DOC.replace("\n7\n", "\n6\n")) == []
  - name: a shared namespace
    code: |
      assert run_examples(">>> a = 2\n>>> b = a * 3\n>>> b\n6\n") == []
      ns = {"n": 10}
      assert run_examples(">>> n + 1\n11\n", ns) == []
      assert ns == {"n": 10}
      assert run_examples(">>> m = 1\n", ns) == [] and "m" not in ns
  - name: output, errors and no output
    code: |
      bad = run_examples(">>> print('x')\n>>> 5\n6\n")
      assert bad == [{"line": 1, "source": "print('x')", "expected": "", "got": "x"}, {"line": 2, "source": "5", "expected": "6", "got": "5"}]
      err = run_examples(">>> int('z')\n5\n")
      assert err[0]["got"] == "ValueError: invalid literal for int() with base 10: 'z'"
      assert run_examples(">>> int('z')\nTraceback (most recent call last):\n  ...\nValueError: invalid literal for int() with base 10: 'z'\n") == []
      assert run_examples(">>> x = 1\n") == [] and run_examples(">>> None\n") == []
      assert run_examples(">>> for i in range(3):\n...     print(i)\n...\n0\n1\n2\n") == []
  - name: layout details
    code: |
      assert run_examples("") == [] and run_examples("just prose\nand more prose\n") == []
      text = """
          Indented doctest:
          >>> 'a' + 'b'
          'ab'

          Another paragraph that is not output.
          >>> len("abc")
          3
      """
      assert run_examples(text) == []
      assert run_examples(">>> 1\n1\nstray line\n") == [{"line": 1, "source": "1", "expected": "1\nstray line", "got": "1"}]
      two = run_examples(">>> 2\n3\n\n>>> 4\n5\n")
      assert [f["line"] for f in two] == [1, 4]
  hints:
  - Parse first into a list of examples (line number, code lines, expected lines), then run them in a second loop.
  - A blank line ends the current example, and prose lines before any example are simply ignored.
  solution: |
    import contextlib
    import io
    import textwrap


    def run_examples(text, namespace=None):
        """A miniature doctest. Find examples in `text` and return the list of failures (empty if all pass).

        The text is dedented first. A line starting with ">>> " begins an example; lines starting with "... " (or exactly "...")
        continue it. The lines after it, up to the next blank line or the next ">>> ", are the expected output.
        All examples share one namespace (a copy of `namespace`). An example runs like in the interactive shell, so a bare
        expression prints its repr. If it raises, its output is "ExceptionName: message"; an expected output that starts with
        "Traceback (most recent call last):" is compared using only its last line.
        A failure is {"line": number of the >>> line (1 is the first line), "source": code, "expected": text, "got": text}.
        Expected and actual output are compared without trailing newlines.
        """
        lines = textwrap.dedent(text).split("\n")
        examples, current = [], None
        for number, line in enumerate(lines, start=1):
            if line.startswith(">>> "):
                current = {"line": number, "src": [line[4:]], "exp": [], "open": True}
                examples.append(current)
            elif current and current["open"] and (line.startswith("... ") or line == "...") and not current["exp"]:
                current["src"].append(line[4:])
            elif line.strip() == "":
                current = None
            elif current:
                current["open"] = False
                current["exp"].append(line)
        env = dict(namespace or {})
        failures = []
        for ex in examples:
            source = "\n".join(ex["src"]) + "\n"
            buffer = io.StringIO()
            try:
                with contextlib.redirect_stdout(buffer):
                    exec(compile(source, "<example>", "single"), env)
                got = buffer.getvalue()
            except Exception as e:
                got = f"{type(e).__name__}: {e}"
            got = got.rstrip("\n")
            expected = "\n".join(ex["exp"])
            if expected.startswith("Traceback (most recent call last):"):
                expected = ex["exp"][-1]
            if got != expected:
                failures.append({"line": ex["line"], "source": "\n".join(ex["src"]), "expected": expected, "got": got})
        return failures
  explanation: Documentation that is executed cannot silently rot. The example in the text becomes a test.
