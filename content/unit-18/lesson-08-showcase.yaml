id: u18-showcase
title: 'Capstone G: Shipping, Showing and Next Steps'
minutes: 80
objective: 'Finish like a professional: generate API documentation from code, keep documentation honest with runnable examples, publish a portfolio page safely, audit dependencies for known vulnerabilities and licences, and gate a release on objective checks. Then think about ethics, your portfolio and where to go next. This capstone brings together Units 1, 14, 15 and 16.'
outcomes:
- Generate readable API documentation from source code with the ast module
- Keep documentation correct by running the examples inside it
- Render a portfolio page that is safe against injected HTML and unsafe links
- Audit dependencies for known vulnerabilities, version problems and licence issues
- Define a release gate and reflect on ethics, portfolio and next steps
sections:
- heading: Work is finished when others can use it
  body: |-
    A project that only runs on your machine, with no explanation, is not finished. People who use or review your work judge it by what they can see in a few minutes: a **README** that says what it does and how to run it (you built a linter for one in the planning capstone), **documentation** of its public functions, **examples** that actually work and a **changelog** of what changed between versions.

    Documentation that is written by hand drifts away from the code. Two habits keep it honest. First, **generate** what you can: with the `ast` module (Unit 14) a program can read your source code, find every public function and class, and write the reference for you, so a renamed parameter shows up in the docs automatically. Second, **test the documentation itself**: examples in docs that start with `>>>` can be run and compared with the output they claim. Python's own `doctest` module works this way, and our `run_examples` is a miniature of it. An example that stops working fails the build, so the text cannot quietly become wrong.

    A good demo is rehearsed and short: say what problem it solves, show the core flow once with prepared data, then show one thing that can go wrong and how the program handles it. Prepared inputs and fixed random seeds (as in the game and search capstones) make demos repeatable.
- heading: Supply chain, safety and the release gate
  body: |-
    Modern programs are mostly other people's code. Every **dependency** brings its own bugs, its **licence** terms and its own dependencies. The **software supply chain** is a real attack surface: a vulnerable old version, a hijacked package or a package with a similar name can all end up inside your program (Unit 16). Good habits: pin versions, keep dependencies few, read the licence, and **audit** regularly. An audit compares each `name` and `version` with a list of **advisories** (published vulnerabilities such as CVEs) that say which versions are **affected**, and also checks that every licence is acceptable for your use. For that you need to compare versions properly: `1.10.0` is newer than `1.9.9`, which is true for tuples of numbers but false for the strings.

    Before shipping, teams use a **release gate**: a written, automated list of conditions that must hold, such as "no failing tests, coverage of at least 80%, no high or critical vulnerabilities, README, changelog and licence present". The gate removes argument and wishful thinking at the worst possible moment (a deadline). Our gate reports *every* reason it says no, not just the first, and treats missing information as a failure, because "we did not measure coverage" is not the same as "coverage is fine".

    When you publish a portfolio page you are putting your work in front of strangers' browsers, so the same rules apply as for any web page: **escape** every piece of text, and only create links for `http` and `https` addresses, because a `javascript:` URL in an `href` can run code when clicked.
- heading: Ethics, portfolio and next steps
  body: |-
    Software affects people, often people who never chose to use it. **Responsible computing** is not a separate subject, it is a set of habits in every project: collect only the data you need and protect it (Unit 16), say plainly what your system can and cannot do, test with people unlike yourself, make interfaces accessible (keyboard use, contrast, text alternatives), credit other people's work and respect licences, and measure whether your models treat groups differently (the machine-learning capstone). When asked to build something that you believe will cause harm, "I was told to" is not a defence, and professional bodies such as the ACM publish codes of ethics worth reading.

    For your **portfolio**, quality beats quantity. Choose three to five projects, such as the interpreter, the database, the web service, the game, the ML pipeline and the search engine you built here. For each, write: the problem, what you built, one hard decision you made and why, how you tested it, what you would improve, and a link to the code. Honest limitations ("the stemmer is approximate") read as maturity, not weakness. Keep the code runnable, the README accurate and the history of commits readable.

    Where next? This curriculum gives you a map of the whole field, but depth comes from building. Choose a direction that draws you (systems, web and mobile, data and AI, security, graphics and games, embedded) and **build something real in it**. Read code written by others, contribute a small fix to an open-source project, solve problems regularly, and write about what you learn. Classic books such as *Structure and Interpretation of Computer Programs*, *Introduction to Algorithms*, *Designing Data-Intensive Applications* and *Code Complete* reward patient reading once you have your own experience to connect them to. Be kind to your future self and to the next reader of your code, and keep going.
examples:
- title: Documentation from code
  intro: The ast module reads the source, so the reference can never name a parameter that does not exist. Private names are skipped.
  code: |
    import ast


    def _summary(doc):
        if not doc:
            return "_No documentation._"
        return " ".join(doc.split("\n\n")[0].split())


    def _public(name):
        return not name.startswith("_")


    def api_docs(source):
        """Markdown reference for the public functions and classes at the top level of `source`.

        Function:  ### `name(parameters)`  + blank line + summary (the docstring's first paragraph on one line,
                   or _No documentation._).
        Class:     ### class `Name` + blank line + summary, then (if it has any) a blank line and one bullet per
                   method that is public or __init__: - `name(parameters)` plus ": " and the first line of its
                   docstring when it has one. Bullets are separated by single newlines.
        Blocks are separated by a blank line; the result ends with one newline ("" if there is nothing to document).
        Raises ValueError("cannot parse: ...") if the source has a syntax error.
        """
        try:
            tree = ast.parse(source)
        except SyntaxError as e:
            raise ValueError(f"cannot parse: {e.msg}")
        blocks = []
        for node in tree.body:
            if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and _public(node.name):
                blocks.append(f"### `{node.name}({ast.unparse(node.args)})`\n\n{_summary(ast.get_docstring(node))}")
            elif isinstance(node, ast.ClassDef) and _public(node.name):
                block = f"### class `{node.name}`\n\n{_summary(ast.get_docstring(node))}"
                bullets = []
                for item in node.body:
                    if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and (_public(item.name) or item.name == "__init__"):
                        line = f"- `{item.name}({ast.unparse(item.args)})`"
                        doc = ast.get_docstring(item)
                        if doc:
                            line += ": " + doc.splitlines()[0].strip()
                        bullets.append(line)
                if bullets:
                    block += "\n\n" + "\n".join(bullets)
                blocks.append(block)
        return "\n\n".join(blocks) + "\n" if blocks else ""


    module = """
    def clamp(x, low=0, high=1):
        '''Limit x to the range from low to high.

        Returns low or high when x is outside it.
        '''
        return max(low, min(high, x))

    class Counter:
        '''Counts things.'''
        def __init__(self):
            self.n = 0
        def add(self, k=1):
            '''Add k to the count.'''
            self.n += k
        def _reset(self):
            self.n = 0

    def helper(): pass
    """
    print(api_docs(module))
  output: |
    ### `clamp(x, low=0, high=1)`

    Limit x to the range from low to high.

    ### class `Counter`

    Counts things.

    - `__init__(self)`
    - `add(self, k=1)`: Add k to the count.

    ### `helper()`

    _No documentation._
  lines:
  - line: 69
    note: Private names such as _reset are skipped, and a function without a docstring gets a placeholder.
- title: Examples that test themselves
  intro: A document contains runnable examples. One of them is deliberately wrong, and the checker finds it.
  code: |
    import contextlib
    import io
    import textwrap


    def run_examples(text, namespace=None):
        """A miniature doctest. Find examples in `text` and return the list of failures (empty if all pass).

        The text is dedented first. A line starting with ">>> " begins an example; lines starting with "... " (or exactly "...")
        continue it. The lines after it, up to the next blank line or the next ">>> ", are the expected output.
        All examples share one namespace (a copy of `namespace`). An example runs like in the interactive shell, so a bare
        expression prints its repr. If it raises, its output is "ExceptionName: message"; an expected output that starts with
        "Traceback (most recent call last):" is compared using only its last line.
        A failure is {"line": number of the >>> line (1 is the first line), "source": code, "expected": text, "got": text}.
        Expected and actual output are compared without trailing newlines.
        """
        lines = textwrap.dedent(text).split("\n")
        examples, current = [], None
        for number, line in enumerate(lines, start=1):
            if line.startswith(">>> "):
                current = {"line": number, "src": [line[4:]], "exp": [], "open": True}
                examples.append(current)
            elif current and current["open"] and (line.startswith("... ") or line == "...") and not current["exp"]:
                current["src"].append(line[4:])
            elif line.strip() == "":
                current = None
            elif current:
                current["open"] = False
                current["exp"].append(line)
        env = dict(namespace or {})
        failures = []
        for ex in examples:
            source = "\n".join(ex["src"]) + "\n"
            buffer = io.StringIO()
            try:
                with contextlib.redirect_stdout(buffer):
                    exec(compile(source, "<example>", "single"), env)
                got = buffer.getvalue()
            except Exception as e:
                got = f"{type(e).__name__}: {e}"
            got = got.rstrip("\n")
            expected = "\n".join(ex["exp"])
            if expected.startswith("Traceback (most recent call last):"):
                expected = ex["exp"][-1]
            if got != expected:
                failures.append({"line": ex["line"], "source": "\n".join(ex["src"]), "expected": expected, "got": got})
        return failures


    guide = """
    The clamp function limits a number:
    >>> def clamp(x, low=0, high=1):
    ...     return max(low, min(high, x))
    ...
    >>> clamp(5)
    1
    >>> clamp(-3, -1, 1)
    -1
    >>> clamp(0.5)
    0.4
    >>> clamp(-3)
    0
    """
    for failure in run_examples(guide):
        print(f"line {failure['line']}: {failure['source']}")
        print("   expected:", failure["expected"])
        print("   got     :", failure["got"])
    print("all other examples passed")
  output: |
    line 10: clamp(0.5)
       expected: 0.4
       got     : 0.5
    all other examples passed
  lines:
  - line: 64
    note: Each failure says where it is, what was expected and what really happened.
- title: A safe portfolio page
  intro: 'Angle brackets, ampersands and a javascript: link in the project data cannot break out of the page.'
  code: |
    import html
    from urllib.parse import urlsplit


    def render_card(project):
        """One project as HTML. Untrusted text is always escaped.

        <article class="card"><h3>NAME</h3><p>SUMMARY</p><ul class="tags"><li>TAG</li>...</ul></article>
        The name is wrapped in <a href="URL">...</a> only when the url's scheme is http or https. The <ul> is left out when there
        are no tags; duplicate tags are removed (first one kept). Missing "summary", "tags" and "url" mean "", [] and no link.
        Raises ValueError if the name is missing, not a string or blank.
        """
        name = project.get("name")
        if not isinstance(name, str) or not name.strip():
            raise ValueError("a project needs a name")
        title = html.escape(name)
        url = project.get("url") or ""
        if urlsplit(url).scheme in ("http", "https"):
            title = f'<a href="{html.escape(url)}">{title}</a>'
        tags = list(dict.fromkeys(project.get("tags") or []))
        tag_html = '<ul class="tags">' + "".join(f"<li>{html.escape(t)}</li>" for t in tags) + "</ul>" if tags else ""
        return f'<article class="card"><h3>{title}</h3><p>{html.escape(project.get("summary") or "")}</p>{tag_html}</article>'


    def render_portfolio(projects, title):
        """<section class="portfolio">, a newline, <h1>TITLE</h1>, then one card per line, then </section>.

        Projects are ordered by "year" descending (a missing year counts as 0), then by name."""
        ordered = sorted(projects, key=lambda p: (-(p.get("year") or 0), str(p.get("name"))))
        cards = [render_card(p) for p in ordered]
        return '<section class="portfolio">\n<h1>' + html.escape(title) + "</h1>\n" + "".join(c + "\n" for c in cards) + "</section>"


    projects = [
        {"name": "Chess <AI>", "summary": "Alpha-beta search & a simple evaluation.", "url": "https://example.com/chess", "tags": ["python", "ai", "python"], "year": 2026},
        {"name": "Notes service", "summary": "A tiny REST API", "url": "javascript:alert('pwned')", "tags": ["web"], "year": 2026},
        {"name": "Hello world", "summary": "My first program", "year": 2025},
    ]
    print(render_portfolio(projects, "Ana's portfolio"))
  output: |
    <section class="portfolio">
    <h1>Ana&#x27;s portfolio</h1>
    <article class="card"><h3><a href="https://example.com/chess">Chess &lt;AI&gt;</a></h3><p>Alpha-beta search &amp; a simple evaluation.</p><ul class="tags"><li>python</li><li>ai</li></ul></article>
    <article class="card"><h3>Notes service</h3><p>A tiny REST API</p><ul class="tags"><li>web</li></ul></article>
    <article class="card"><h3>Hello world</h3><p>My first program</p></article>
    </section>
  lines:
  - line: 39
    note: 'The script tag in a name or the javascript: link cannot break out of the page.'
- title: A dependency audit
  intro: An old version with a known advisory, a package without a licence and a clean package.
  code: |
    import operator
    import re

    OPS = {"<": operator.lt, "<=": operator.le, ">": operator.gt, ">=": operator.ge, "==": operator.eq, "!=": operator.ne}
    SEVERITY = {"critical": 4, "high": 3, "medium": 2, "low": 1}


    def parse_version(text):
        """"1.2.3" -> (1, 2, 3). A leading v is allowed and missing parts are 0 ("2" -> (2, 0, 0)).
        Raises ValueError for anything else (more than three parts, letters, empty parts)."""
        match = re.fullmatch(r"v?(\d+)(?:\.(\d+))?(?:\.(\d+))?", text.strip())
        if not match:
            raise ValueError(f"not a version: {text!r}")
        return tuple(int(g) if g else 0 for g in match.groups())


    def is_affected(version, spec):
        """Does `version` satisfy every condition of spec, e.g. "<1.2.3" or ">=1.0,<1.4" (comma means and)?"""
        v = parse_version(version)
        for part in spec.split(","):
            match = re.fullmatch(r"\s*(<=|>=|==|!=|<|>)\s*(\S+)\s*", part)
            if not match:
                raise ValueError(f"bad condition: {part!r}")
            if not OPS[match.group(1)](v, parse_version(match.group(2))):
                return False
        return True


    def audit(deps, advisories, allowed_licenses):
        """Findings for a list of dependencies {"name", "version", "license"}.

        advisories maps a package name to a list of {"id", "affected", "severity"}.
        - an advisory whose `affected` spec matches the version gives {"package", "version", "kind": "vulnerability", "id", "severity"}
        - a license that is not in allowed_licenses (None counts as "unknown") gives kind "license", id = the license, severity "medium"
        - an unparseable version gives kind "version", id "unparseable", severity "medium" (and its advisories are skipped)
        Sorted by severity (critical first), then package, then kind, then id.
        """
        findings = []
        for dep in deps:
            base = {"package": dep["name"], "version": dep["version"]}
            try:
                parse_version(dep["version"])
                for adv in advisories.get(dep["name"], []):
                    if is_affected(dep["version"], adv["affected"]):
                        findings.append(dict(base, kind="vulnerability", id=adv["id"], severity=adv["severity"]))
            except ValueError:
                findings.append(dict(base, kind="version", id="unparseable", severity="medium"))
            lic = dep.get("license") or "unknown"
            if lic not in allowed_licenses:
                findings.append(dict(base, kind="license", id=lic, severity="medium"))
        findings.sort(key=lambda f: (-SEVERITY[f["severity"]], f["package"], f["kind"], f["id"]))
        return findings


    deps = [
        {"name": "requests", "version": "2.19.0", "license": "Apache-2.0"},
        {"name": "tinyjson", "version": "0.9", "license": "MIT"},
        {"name": "mystery", "version": "1.0.0", "license": None},
    ]
    advisories = {"requests": [{"id": "CVE-2018-18074", "affected": "<2.20.0", "severity": "high"}]}
    for f in audit(deps, advisories, {"Apache-2.0", "MIT", "BSD-3-Clause"}):
        print(f"{f['severity']:<8} {f['package']} {f['version']}: {f['kind']} {f['id']}")
    print(is_affected("2.20.0", "<2.20.0"), is_affected("2.19.1", "<2.20.0"))
  output: |
    high     requests 2.19.0: vulnerability CVE-2018-18074
    medium   mystery 1.0.0: license unknown
    False True
  lines:
  - line: 60
    note: An advisory names the affected versions as a range.
  - line: 63
    note: 'The fixed version is not affected: the range stops just below it.'
- title: A release gate
  intro: The same project before and after fixing the problems the gate reported.
  code: |
    def release_gate(report, min_coverage=0.8):
        """Decide whether a release may go ahead. Returns {"ok": bool, "reasons": [str, ...]} (reasons in this order):

        - "N tests failing" if tests.failed > 0
        - "no tests ran" if tests.passed + tests.failed is 0 (or there is no "tests" entry)
        - "coverage missing" if there is no coverage, or "coverage 72% is below 80%" (whole percent, from the minimum)
        - "N high or critical security findings" counting findings of those severities
        - "missing readme", "missing changelog", "missing license" (in that order) for falsy or absent docs entries
        """
        reasons = []
        tests = report.get("tests") or {}
        passed, failed = tests.get("passed", 0), tests.get("failed", 0)
        if failed > 0:
            reasons.append(f"{failed} tests failing")
        if passed + failed == 0:
            reasons.append("no tests ran")
        coverage = report.get("coverage")
        if coverage is None:
            reasons.append("coverage missing")
        elif coverage < min_coverage:
            reasons.append(f"coverage {coverage:.0%} is below {min_coverage:.0%}")
        serious = [f for f in report.get("findings") or [] if f.get("severity") in ("high", "critical")]
        if serious:
            reasons.append(f"{len(serious)} high or critical security findings")
        docs = report.get("docs") or {}
        for key in ("readme", "changelog", "license"):
            if not docs.get(key):
                reasons.append(f"missing {key}")
        return {"ok": not reasons, "reasons": reasons}
    import operator
    import re

    OPS = {"<": operator.lt, "<=": operator.le, ">": operator.gt, ">=": operator.ge, "==": operator.eq, "!=": operator.ne}
    SEVERITY = {"critical": 4, "high": 3, "medium": 2, "low": 1}




    reports = {
        "first attempt": {"tests": {"passed": 41, "failed": 3}, "coverage": 0.74, "findings": [{"severity": "high"}], "docs": {"readme": True, "changelog": False, "license": True}},
        "after fixes": {"tests": {"passed": 44, "failed": 0}, "coverage": 0.86, "findings": [{"severity": "low"}], "docs": {"readme": True, "changelog": True, "license": True}},
    }
    for name, report in reports.items():
        result = release_gate(report)
        print(name, "->", "SHIP" if result["ok"] else "HOLD")
        for reason in result["reasons"]:
            print("   -", reason)
  output: |
    first attempt -> HOLD
       - 3 tests failing
       - coverage 74% is below 80%
       - 1 high or critical security findings
       - missing changelog
    after fixes -> SHIP
  lines:
  - line: 44
    note: The gate lists every reason, so one round of fixes can be enough.
