          try:
              render_card(bad)
          except ValueError:
              continue
          raise AssertionError("accepted " + repr(bad))
  - name: the whole page
    code: |
      page = render_portfolio([{"name": "Old", "year": 2023}, {"name": "B new", "year": 2026}, {"name": "A new", "year": 2026}, {"name": "No year"}], "My <work>")
      lines = page.split("\n")
      assert lines[0] == '<section class="portfolio">' and lines[1] == "<h1>My &lt;work&gt;</h1>" and lines[-1] == "</section>"
      assert [l[l.index("<h3>") + 4:l.index("</h3>")] for l in lines[2:-1]] == ["A new", "B new", "Old", "No year"]
      assert render_portfolio([], "Empty") == '<section class="portfolio">\n<h1>Empty</h1>\n</section>'
