                    "evil": [{"id": "CVE-2", "affected": ">=1.0,<2.5", "severity": "critical"}],
                    "x": [{"id": "CVE-3", "affected": "<9", "severity": "critical"}],
                    "safe": [{"id": "CVE-4", "affected": "<2", "severity": "critical"}]}
      found = audit(deps, advisories, {"MIT", "BSD"})
      assert found == [
          {"package": "evil", "version": "2", "kind": "vulnerability", "id": "CVE-2", "severity": "critical"},
          {"package": "left-pad", "version": "1.1.0", "kind": "vulnerability", "id": "CVE-1", "severity": "high"},
          {"package": "evil", "version": "2", "kind": "license", "id": "unknown", "severity": "medium"},
          {"package": "x", "version": "1.0-beta", "kind": "license", "id": "GPL", "severity": "medium"},
          {"package": "x", "version": "1.0-beta", "kind": "version", "id": "unparseable", "severity": "medium"},
      ]
      assert audit([], {}, set()) == []
      assert audit(deps[3:], advisories, {"BSD"}) == []
  - name: ordering
    code: |
      deps = [{"name": "b", "version": "1.0.0", "license": "MIT"}, {"name": "a", "version": "1.0.0", "license": "MIT"}]
      adv = {"a": [{"id": "Z", "affected": "<2", "severity": "low"}, {"id": "A", "affected": "<2", "severity": "low"}],
             "b": [{"id": "B", "affected": "<2", "severity": "high"}]}
      found = audit(deps, adv, {"MIT"})
      assert [(f["package"], f["id"]) for f in found] == [("b", "B"), ("a", "A"), ("a", "Z")]
  hints:
  - Tuples compare element by element, so `(1, 10, 0) > (1, 9, 9)` is true.
  - A sort key like `(-SEVERITY[f["severity"]], f["package"], f["kind"], f["id"])` does all the ordering at once.
  solution: |
    import operator
    import re

    OPS = {"<": operator.lt, "<=": operator.le, ">": operator.gt, ">=": operator.ge, "==": operator.eq, "!=": operator.ne}
    SEVERITY = {"critical": 4, "high": 3, "medium": 2, "low": 1}


    def parse_version(text):
        """"1.2.3" -> (1, 2, 3). A leading v is allowed and missing parts are 0 ("2" -> (2, 0, 0)).
        Raises ValueError for anything else (more than three parts, letters, empty parts)."""
        match = re.fullmatch(r"v?(\d+)(?:\.(\d+))?(?:\.(\d+))?", text.strip())
        if not match:
            raise ValueError(f"not a version: {text!r}")
        return tuple(int(g) if g else 0 for g in match.groups())


    def is_affected(version, spec):
        """Does `version` satisfy every condition of spec, e.g. "<1.2.3" or ">=1.0,<1.4" (comma means and)?"""
        v = parse_version(version)
        for part in spec.split(","):
            match = re.fullmatch(r"\s*(<=|>=|==|!=|<|>)\s*(\S+)\s*", part)
            if not match:
                raise ValueError(f"bad condition: {part!r}")
            if not OPS[match.group(1)](v, parse_version(match.group(2))):
                return False
        return True


    def audit(deps, advisories, allowed_licenses):
        """Findings for a list of dependencies {"name", "version", "license"}.

        advisories maps a package name to a list of {"id", "affected", "severity"}.
        - an advisory whose `affected` spec matches the version gives {"package", "version", "kind": "vulnerability", "id", "severity"}
        - a license that is not in allowed_licenses (None counts as "unknown") gives kind "license", id = the license, severity "medium"
        - an unparseable version gives kind "version", id "unparseable", severity "medium" (and its advisories are skipped)
        Sorted by severity (critical first), then package, then kind, then id.
        """
        findings = []
        for dep in deps:
            base = {"package": dep["name"], "version": dep["version"]}
            try:
                parse_version(dep["version"])
                for adv in advisories.get(dep["name"], []):
                    if is_affected(dep["version"], adv["affected"]):
                        findings.append(dict(base, kind="vulnerability", id=adv["id"], severity=adv["severity"]))
            except ValueError:
                findings.append(dict(base, kind="version", id="unparseable", severity="medium"))
            lic = dep.get("license") or "unknown"
            if lic not in allowed_licenses:
                findings.append(dict(base, kind="license", id=lic, severity="medium"))
        findings.sort(key=lambda f: (-SEVERITY[f["severity"]], f["package"], f["kind"], f["id"]))
        return findings
  explanation: Version strings are not numbers or text; turning them into tuples of integers makes comparison correct.
- id: release-gate
  title: 'Milestone 5: The release gate'
  difficulty: 3
  prompt: 'Write `release_gate(report, min_coverage=0.8)` returning `{"ok": bool, "reasons": [...]}`. `report` may have `tests` (`passed`, `failed`), `coverage` (0 to 1), `findings` (a list of dictionaries with a `severity`) and `docs` (`readme`, `changelog`, `license`). Add these reasons in this order: `"N tests failing"` when failed is above 0; `"no tests ran"` when passed and failed are both 0 or absent; `"coverage missing"` or `"coverage 72% is below 80%"` (whole percentages: use `f"{value:.0%}"` for the coverage and for the minimum); `"N high or critical security findings"` when N is above 0; then `"missing readme"`, `"missing changelog"` and `"missing license"` for each falsy or absent docs entry. `ok` is true exactly when there are no reasons. Treat absent or `None` sections as empty.'
  starter: |
    def release_gate(report, min_coverage=0.8):
        pass
  tests:
  - name: a release that is ready
    code: |
      good = {"tests": {"passed": 120, "failed": 0}, "coverage": 0.91, "findings": [{"severity": "low"}, {"severity": "medium"}],
              "docs": {"readme": True, "changelog": True, "license": True}}
      assert release_gate(good) == {"ok": True, "reasons": []}
      assert release_gate(dict(good, coverage=0.8))["ok"] is True
  - name: every reason is reported, in order
    code: |
      bad = {"tests": {"passed": 10, "failed": 2}, "coverage": 0.72, "findings": [{"severity": "high"}, {"severity": "critical"}, {"severity": "low"}],
             "docs": {"readme": True, "changelog": False}}
      assert release_gate(bad) == {"ok": False, "reasons": [
          "2 tests failing", "coverage 72% is below 80%", "2 high or critical security findings", "missing changelog", "missing license"]}
  - name: missing information counts against the release
    code: |
      assert release_gate({}) == {"ok": False, "reasons": ["no tests ran", "coverage missing", "missing readme", "missing changelog", "missing license"]}
      r = release_gate({"tests": {"passed": 0, "failed": 0}, "coverage": 1.0, "docs": {"readme": 1, "changelog": 1, "license": 1}})
      assert r == {"ok": False, "reasons": ["no tests ran"]}
      r = release_gate({"tests": {"passed": 3}, "coverage": 0.5, "findings": None, "docs": {"readme": 1, "changelog": 1, "license": "MIT"}}, min_coverage=0.45)
      assert r == {"ok": True, "reasons": []}
      r = release_gate({"tests": {"passed": 3}, "coverage": 0.5, "docs": {"readme": 1, "changelog": 1, "license": 1}}, min_coverage=0.9)
      assert r["reasons"] == ["coverage 50% is below 90%"]
  hints:
  - '`report.get("tests") or {}` copes with a missing or `None` section.'
  - Build the list of reasons first; `ok` is just `not reasons`.
  solution: |
    def release_gate(report, min_coverage=0.8):
        """Decide whether a release may go ahead. Returns {"ok": bool, "reasons": [str, ...]} (reasons in this order):

        - "N tests failing" if tests.failed > 0
        - "no tests ran" if tests.passed + tests.failed is 0 (or there is no "tests" entry)
        - "coverage missing" if there is no coverage, or "coverage 72% is below 80%" (whole percent, from the minimum)
        - "N high or critical security findings" counting findings of those severities
        - "missing readme", "missing changelog", "missing license" (in that order) for falsy or absent docs entries
        """
        reasons = []
        tests = report.get("tests") or {}
        passed, failed = tests.get("passed", 0), tests.get("failed", 0)
        if failed > 0:
            reasons.append(f"{failed} tests failing")
        if passed + failed == 0:
            reasons.append("no tests ran")
        coverage = report.get("coverage")
        if coverage is None:
            reasons.append("coverage missing")
        elif coverage < min_coverage:
            reasons.append(f"coverage {coverage:.0%} is below {min_coverage:.0%}")
        serious = [f for f in report.get("findings") or [] if f.get("severity") in ("high", "critical")]
        if serious:
            reasons.append(f"{len(serious)} high or critical security findings")
        docs = report.get("docs") or {}
        for key in ("readme", "changelog", "license"):
            if not docs.get(key):
                reasons.append(f"missing {key}")
        return {"ok": not reasons, "reasons": reasons}
  explanation: A gate written down and automated turns "are we ready?" from an opinion into a check.
commonMistakes:
- title: Hand-writing documentation that duplicates the code
  explanation: Generate what you can; the rest will drift.
- title: Examples in docs that nobody runs
  explanation: Run them in the test suite so they stay true.
- title: Linking to any URL the data contains
  explanation: 'Only http and https; a javascript: link can run code.'
- title: Comparing version strings as text
  explanation: '"1.10.0" < "1.9.9" as strings. Compare tuples of integers.'
- title: Treating a missing measurement as a pass
  explanation: No coverage number is not good coverage.
- title: Stopping at the first problem the gate finds
