- name: register validates and creates users
  code: |
    import json

    def make(log_text="", start=1000, origins=()):
        t = [start]
        return NotesService(b"s3cret-key", lambda: t[0], log_text, origins), t

    def call(svc, method, path, body=None, token=None, client="c1", headers=None):
        h = dict(headers or {})
        if token:
            h["Authorization"] = "Bearer " + token
        raw = {"method": method, "path": path, "headers": h, "client": client}
        if body is not None:
            raw["body"] = body if isinstance(body, str) else json.dumps(body)
        r = svc.handle(raw)
        return r["status"], (json.loads(r["body"]) if r["body"] else None), r["headers"]

    def signup(svc, name="ana", password="correct horse"):
        assert call(svc, "POST", "/register", {"username": name, "password": password}, client=name)[0] == 201
        status, body, _ = call(svc, "POST", "/login", {"username": name, "password": password}, client=name)
        assert status == 200, status
        return body["token"]

    svc, t = make()
    assert call(svc, "POST", "/register", {"username": "ana", "password": "correct horse"})[:2] == (201, {"username": "ana"})
    assert call(svc, "POST", "/register", {"username": "ana", "password": "another pass"})[0] == 409
    bad = [{"username": "ab", "password": "longenough"}, {"username": "A!", "password": "longenough"},
           {"username": "x" * 21, "password": "longenough"}, {"username": "bob", "password": "short"}, {"username": "bob"},
           {"username": "bob", "password": "longenough", "admin": True}, {"username": 5, "password": "longenough"}, [1, 2]]
    for i, body in enumerate(bad):
        assert call(svc, "POST", "/register", body, client="c%d" % i)[0] == 422, body
    assert call(svc, "POST", "/register", "{not json", client="z")[0] == 400
    assert call(svc, "GET", "/register", client="z")[0] == 405
    assert call(svc, "POST", "/login", {"username": "bob", "password": "longenough"}, client="z")[0] == 401
