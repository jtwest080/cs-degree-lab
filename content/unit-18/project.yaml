  import hashlib
  import json


  class CorruptRecord(Exception):
      pass


  def checksum(text):
      return hashlib.sha256(text.encode()).hexdigest()[:8]


  def encode_record(record):
      """record is a dict such as {"op": "put", "key": "a", "value": 1}. Returns one line (no newline)."""
      body = json.dumps(record, sort_keys=True, separators=(",", ":"))
      return checksum(body) + " " + body


  def decode_record(line):
      """Parse a line made by encode_record. Raise CorruptRecord if it is damaged."""
      check, space, body = line.partition(" ")
      if not space or len(check) != 8 or checksum(body) != check:
          raise CorruptRecord("bad checksum")
      try:
          record = json.loads(body)
      except ValueError:
          raise CorruptRecord("bad json")
      if not isinstance(record, dict) or "op" not in record:
          raise CorruptRecord("not a record")
      return record


  def apply_record(data, rec):
      if rec["op"] == "put":
          data[rec["key"]] = rec["value"]
      elif rec["op"] == "del":
          data.pop(rec["key"], None)


  def replay(log_text):
      """Rebuild the data from a log. Returns (data, kept_lines, discarded_count).

      - Plain put/del records are applied as they are read.
      - A group written between a begin record and a commit record is applied only at the commit.
      - Reading stops at the first damaged line; everything after it is discarded.
      - A begin group with no commit at the end of the log (a crash) is discarded.
      """
      data, kept, pending = {}, [], None
      lines = [l for l in log_text.split("\n") if l.strip()]
      for i, line in enumerate(lines):
          try:
              rec = decode_record(line)
          except CorruptRecord:
              discarded = len(lines) - i
              break
          else:
              kept.append(line)
              if rec["op"] == "begin":
                  pending = []
              elif rec["op"] == "commit":
                  for r in pending or []:
                      apply_record(data, r)
                  pending = None
              elif pending is not None:
                  pending.append(rec)
              else:
                  apply_record(data, rec)
      else:
          discarded = 0
      if pending is not None:
          drop = len(pending) + 1
          kept = kept[:len(kept) - drop]
          discarded += drop
      return data, kept, discarded


  class KVStore:
      """A tiny log-structured key-value store: every change is appended to a log, and the log is replayed on start-up."""

      def __init__(self, log_text=""):
          self.data, self.log, self.discarded = replay(log_text)
          self.tx = None                       # None, or a list of buffered records inside a transaction

      def _write(self, rec):
          if self.tx is not None:
              self.tx.append(rec)
          else:
              self.log.append(encode_record(rec))
              apply_record(self.data, rec)

      def put(self, key, value):
          if not isinstance(key, str) or not key:
              raise ValueError("key must be a non-empty string")
          self._write({"op": "put", "key": key, "value": value})

      def get(self, key, default=None):
          if self.tx is not None:              # a transaction sees its own writes
              for rec in reversed(self.tx):
                  if rec["key"] == key:
                      return rec["value"] if rec["op"] == "put" else default
          return self.data.get(key, default)

      def delete(self, key):
          existed = key in self.keys()
          self._write({"op": "del", "key": key})
          return existed

      def keys(self):
          view = dict(self.data)
          for rec in (self.tx or []):
              apply_record(view, rec)
          return sorted(view)

      def scan(self, prefix=""):
          return [k for k in self.keys() if k.startswith(prefix)]

      def log_text(self):
          return "".join(line + "\n" for line in self.log)

      def begin(self):
          if self.tx is not None:
              raise RuntimeError("transaction already open")
          self.tx = []

      def commit(self):
          if self.tx is None:
              raise RuntimeError("no open transaction")
          records, self.tx = self.tx, None
          if records:
              self.log.append(encode_record({"op": "begin"}))
              for rec in records:
                  self.log.append(encode_record(rec))
              self.log.append(encode_record({"op": "commit"}))
              for rec in records:
                  apply_record(self.data, rec)

      def rollback(self):
          if self.tx is None:
              raise RuntimeError("no open transaction")
          self.tx = None


  class Router:
      """Matches (method, path) to a handler. Patterns look like /notes/<id:int>."""

      def __init__(self):
          self.routes = []                       # (method, pattern_segments, handler)

      def add(self, method, pattern, handler):
          self.routes.append((method.upper(), pattern.strip("/").split("/") if pattern.strip("/") else [], handler))

      @staticmethod
      def _match_segments(pattern, parts):
          if len(pattern) != len(parts):
              return None
          params = {}
          for pat, part in zip(pattern, parts):
              if pat.startswith("<") and pat.endswith(">"):
                  name, _, kind = pat[1:-1].partition(":")
                  if kind == "int":
                      if not part.isdigit():
                          return None
                      params[name] = int(part)
                  elif part:
                      params[name] = part
                  else:
                      return None
              elif pat != part:
                  return None
          return params

      def match(self, method, path):
          """Return (200, handler, params), (404, None, None) or (405, None, allowed_methods)."""
          parts = path.strip("/").split("/") if path.strip("/") else []
          allowed = set()
          for m, pattern, handler in self.routes:
              params = self._match_segments(pattern, parts)
              if params is None:
                  continue
              if m == method.upper():
                  return 200, handler, params
              allowed.add(m)
          if allowed:
              return 405, None, sorted(allowed)
          return 404, None, None


  import json
  from urllib.parse import parse_qs, urlsplit


  class HTTPError(Exception):
      def __init__(self, status, message):
          super().__init__(message)
          self.status, self.message = status, message


  def json_response(status, data=None, headers=None):
      h = {"Content-Type": "application/json"}
      h.update(headers or {})
      return {"status": status, "headers": h, "body": "" if data is None else json.dumps(data, sort_keys=True)}


  class App:
      def __init__(self):
          self.router = Router()
          self.middlewares = []

      def route(self, method, pattern):
          def decorator(fn):
              self.router.add(method, pattern, fn)
              return fn
          return decorator

      def use(self, middleware):
          self.middlewares.append(middleware)

      def _dispatch(self, request):
          status, handler, extra = self.router.match(request["method"], request["path"])
          if status == 404:
              return json_response(404, {"error": "not found"})
          if status == 405:
              return json_response(405, {"error": "method not allowed"}, {"Allow": ", ".join(extra)})
          try:
              result = handler(request, **extra)
          except HTTPError as e:
              return json_response(e.status, {"error": e.message})
          except Exception:
              return json_response(500, {"error": "internal server error"})
          if result is None:
              return json_response(204)
          if isinstance(result, tuple):
              return json_response(result[0], result[1])
          return json_response(200, result)

      def handle(self, raw):
          """raw: {"method", "path" (may include ?query), "headers", "body"}. Returns a response dict."""
          parts = urlsplit(raw.get("path", "/"))
          request = {"method": raw.get("method", "GET").upper(), "path": parts.path,
                     "query": {k: v[0] for k, v in parse_qs(parts.query).items()},
                     "headers": {k.lower(): v for k, v in (raw.get("headers") or {}).items()},
                     "client": raw.get("client", "unknown"), "json": None, "user": None}
          body = raw.get("body")
          if request["method"] in ("POST", "PUT", "PATCH") and body:
              try:
                  request["json"] = json.loads(body)
              except ValueError:
                  return json_response(400, {"error": "invalid JSON"})
          return build_chain(self._dispatch, self.middlewares)(request)


  import base64
  import hashlib
  import hmac
  import json


  def build_chain(handler, middlewares):
      """A middleware is a function (request, next_handler) -> response. The first one added runs first (outermost)."""
      for mw in reversed(middlewares):
          handler = (lambda mw, nxt: lambda request: mw(request, nxt))(mw, handler)
      return handler


  def _b64(data):
      return base64.urlsafe_b64encode(data).decode().rstrip("=")


  def sign_token(secret, user, expires):
      payload = _b64(json.dumps({"sub": user, "exp": expires}, sort_keys=True).encode())
      mac = _b64(hmac.new(secret, payload.encode(), hashlib.sha256).digest())
      return payload + "." + mac


  def verify_token(secret, token, now):
      """Return the user name if the token is genuine and unexpired, otherwise None."""
      payload, dot, mac = token.partition(".")
      if not dot:
          return None
      good = _b64(hmac.new(secret, payload.encode(), hashlib.sha256).digest())
      if not hmac.compare_digest(mac.encode(), good.encode()):
          return None
      try:
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          if claims["exp"] <= now:
              return None
          return claims["sub"] if isinstance(claims["sub"], str) else None
      except (ValueError, KeyError, TypeError):
          return None


  def require_auth(secret, clock):
      """Middleware: demand 'Authorization: Bearer <token>'; put the user name in request['user']."""
      def middleware(request, nxt):
          header = request["headers"].get("authorization", "")
          scheme, _, token = header.partition(" ")
          user = verify_token(secret, token.strip(), clock()) if scheme == "Bearer" else None
          if user is None:
              return json_response(401, {"error": "unauthorized"}, {"WWW-Authenticate": "Bearer"})
          request["user"] = user
          return nxt(request)
      return middleware


  def rate_limit(max_requests, window, clock):
      """Middleware: at most max_requests per client in any sliding window of `window` seconds."""
      seen = {}
      def middleware(request, nxt):
          now = clock()
          recent = [t for t in seen.get(request["client"], []) if now - t < window]
          if len(recent) >= max_requests:
              seen[request["client"]] = recent
              retry = max(1, int(window - (now - recent[0]) + 0.999))
              return json_response(429, {"error": "too many requests"}, {"Retry-After": str(retry)})
          recent.append(now)
          seen[request["client"]] = recent
          return nxt(request)
      return middleware


  def validate(data, schema):
      """Check a JSON object against a schema. Returns a sorted list of error strings (empty if valid).

      schema maps field name -> {"type": "string"|"integer"|"boolean", "required": bool,
                                 "min": number, "max": number, "max_length": int, "choices": list}
      Unknown fields are errors. "min"/"max" apply to integers, "max_length" to strings.
      """
      if not isinstance(data, dict):
          return ["body must be an object"]
      errors = []
      for name in data:
          if name not in schema:
              errors.append(f"{name}: unknown field")
      for name, rule in schema.items():
          if name not in data:
              if rule.get("required"):
                  errors.append(f"{name}: required")
              continue
          value, kind = data[name], rule["type"]
          if kind == "string":
              ok = isinstance(value, str)
          elif kind == "integer":
              ok = isinstance(value, int) and not isinstance(value, bool)
          else:
              ok = isinstance(value, bool)
          if not ok:
              errors.append(f"{name}: must be a {kind}")
              continue
          if kind == "string" and "max_length" in rule and len(value) > rule["max_length"]:
              errors.append(f"{name}: too long (max {rule['max_length']})")
          if kind == "integer":
              if "min" in rule and value < rule["min"]:
                  errors.append(f"{name}: must be at least {rule['min']}")
              if "max" in rule and value > rule["max"]:
                  errors.append(f"{name}: must be at most {rule['max']}")
          if "choices" in rule and value not in rule["choices"]:
              errors.append(f"{name}: must be one of {sorted(rule['choices'])}")
      return sorted(errors)


  SECURITY_HEADERS = {
      "X-Content-Type-Options": "nosniff",
      "X-Frame-Options": "DENY",
      "Referrer-Policy": "no-referrer",
      "Content-Security-Policy": "default-src 'none'; frame-ancestors 'none'",
      "Cache-Control": "no-store",
  }


  def secure(response, request_origin, allowed_origins):
      """Return a copy of the response with security headers and, for an allowed origin, CORS headers."""
      headers = dict(response["headers"])
      for name, value in SECURITY_HEADERS.items():
          headers.setdefault(name, value)
      if request_origin is not None and request_origin in allowed_origins:
          headers["Access-Control-Allow-Origin"] = request_origin
          headers["Vary"] = "Origin"
      return {"status": response["status"], "headers": headers, "body": response["body"]}


  def preflight(request_origin, requested_method, allowed_origins, allowed_methods):
      """Answer a CORS preflight (OPTIONS) request."""
      if request_origin not in allowed_origins or requested_method not in allowed_methods:
          return {"status": 403, "headers": {}, "body": ""}
      return {"status": 204, "headers": {"Access-Control-Allow-Origin": request_origin,
                                         "Access-Control-Allow-Methods": ", ".join(sorted(allowed_methods)),
                                         "Access-Control-Max-Age": "600", "Vary": "Origin"}, "body": ""}


  import hashlib
  import hmac
  import re
  import secrets

  USER_SCHEMA = {"username": {"type": "string", "required": True, "max_length": 20},
                 "password": {"type": "string", "required": True, "max_length": 100}}
  NOTE_SCHEMA = {"title": {"type": "string", "required": True, "max_length": 50},
                 "body": {"type": "string", "max_length": 1000},
                 "tag": {"type": "string", "max_length": 20}}
  USERNAME = re.compile(r"[a-z0-9_]{3,20}")
  TOKEN_LIFETIME = 3600
  PBKDF2_ROUNDS = 1000


  def hash_password(password, salt_hex):
      """PBKDF2-HMAC-SHA256 of the password with the salt (given as hex text), as hex text."""
      return hashlib.pbkdf2_hmac("sha256", password.encode(), bytes.fromhex(salt_hex), PBKDF2_ROUNDS).hex()


  class NotesService:
      """A small notes API on top of the log-structured store. Users and notes live in the store:
      "user:<name>" -> {"salt", "hash"}, "note:<id>" -> note, "meta:next_id" -> next free note id."""

      def __init__(self, secret, clock, log_text="", allowed_origins=()):
          self.secret, self.clock = secret, clock
          self.store = KVStore(log_text)
          self.app = App()
          auth = require_auth(secret, clock)

          def headers_mw(request, nxt):
              return secure(nxt(request), request["headers"].get("origin"), set(allowed_origins))

          def guard(request, nxt):
              if request["path"] in ("/register", "/login"):
                  return nxt(request)
              return auth(request, nxt)

          self.app.use(headers_mw)
          self.app.use(rate_limit(30, 60, clock))
          self.app.use(guard)
          self.app.route("POST", "/register")(self._register)
          self.app.route("POST", "/login")(self._login)
          self.app.route("GET", "/notes")(self._list)
          self.app.route("POST", "/notes")(self._create)
          self.app.route("GET", "/notes/<id:int>")(self._get)
          self.app.route("PUT", "/notes/<id:int>")(self._update)
          self.app.route("DELETE", "/notes/<id:int>")(self._delete)

      def handle(self, raw):
          return self.app.handle(raw)

      def log_text(self):
          return self.store.log_text()

      # --- accounts ---
      def _credentials(self, request):
          errors = validate(request["json"], USER_SCHEMA)
          if errors:
              raise HTTPError(422, "; ".join(errors))
          return request["json"]["username"], request["json"]["password"]

      def _register(self, request):
          username, password = self._credentials(request)
          if not USERNAME.fullmatch(username):
              raise HTTPError(422, "username must be 3 to 20 characters: a-z, 0-9 or _")
          if len(password) < 8:
              raise HTTPError(422, "password must be at least 8 characters")
          if self.store.get("user:" + username) is not None:
              raise HTTPError(409, "username taken")
          salt = secrets.token_bytes(16).hex()
          self.store.put("user:" + username, {"salt": salt, "hash": hash_password(password, salt)})
          return 201, {"username": username}

      def _login(self, request):
          username, password = self._credentials(request)
          user = self.store.get("user:" + username) or {"salt": "00" * 16, "hash": ""}
          ok = hmac.compare_digest(hash_password(password, user["salt"]), user["hash"])
          if not ok:
              raise HTTPError(401, "invalid username or password")
          expires = self.clock() + TOKEN_LIFETIME
          return {"token": sign_token(self.secret, username, expires), "expires": expires}

      # --- notes ---
      def _notes_of(self, user):
          notes = [self.store.get(k) for k in self.store.scan("note:")]
          return sorted((n for n in notes if n["owner"] == user), key=lambda n: n["id"])

      def _owned(self, request, id):
          note = self.store.get(f"note:{id}")
          if note is None or note["owner"] != request["user"]:
              raise HTTPError(404, "no such note")
          return note

      def _fields(self, request):
          errors = validate(request["json"], NOTE_SCHEMA)
          if errors:
              raise HTTPError(422, "; ".join(errors))
          data = request["json"]
          return data["title"], data.get("body", ""), data.get("tag", "")

      def _list(self, request):
          notes = self._notes_of(request["user"])
          tag, q = request["query"].get("tag"), request["query"].get("q")
          if tag is not None:
              notes = [n for n in notes if n["tag"] == tag]
          if q:
              needle = q.lower()
              notes = [n for n in notes if needle in n["title"].lower() or needle in n["body"].lower()]
          return {"notes": notes}

      def _create(self, request):
          title, body, tag = self._fields(request)
          now = self.clock()
          self.store.begin()
          try:
              nid = self.store.get("meta:next_id", 1)
              note = {"id": nid, "owner": request["user"], "title": title, "body": body, "tag": tag,
                      "created": now, "updated": now}
              self.store.put(f"note:{nid}", note)
              self.store.put("meta:next_id", nid + 1)
              self.store.commit()
          except Exception:
              self.store.rollback()
              raise
          return 201, note

      def _get(self, request, id):
          return self._owned(request, id)

      def _update(self, request, id):
          note = self._owned(request, id)
          title, body, tag = self._fields(request)
          note = dict(note, title=title, body=body, tag=tag, updated=self.clock())
          self.store.put(f"note:{id}", note)
          return note

      def _delete(self, request, id):
          self._owned(request, id)
          self.store.delete(f"note:{id}")
          return None
