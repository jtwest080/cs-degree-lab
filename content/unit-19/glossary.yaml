# Terms introduced in Unit 19 (Linear Algebra). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Vector
  definition: A list of numbers that has both a size and a direction, like an arrow.
  lesson: u19-vectors
- term: Scalar
  definition: A single ordinary number, used to scale a vector.
  lesson: u19-vectors
- term: Dot product
  definition: Multiply matching entries of two vectors and add the results; it measures how much they point the same way.
  lesson: u19-vectors
- term: Norm
  definition: The length of a vector.
  lesson: u19-vectors
- term: Unit vector
  definition: A vector whose length is exactly 1.
  lesson: u19-vectors
- term: Orthogonal
  definition: Perpendicular; two vectors are orthogonal when their dot product is 0.
  lesson: u19-vectors
- term: Projection
  definition: The part of one vector that lies along another vector.
  lesson: u19-vectors
- term: Cross product
  definition: A 3D operation that produces a vector perpendicular to two given vectors.
  lesson: u19-vectors
- term: Linear combination
  definition: A sum of vectors that have each been multiplied by a number.
  lesson: u19-vectors
- term: Matrix
  definition: A rectangular grid of numbers arranged in rows and columns.
  lesson: u19-matrices
- term: Shape (of a matrix)
  definition: The number of rows by the number of columns.
  lesson: u19-matrices
- term: Transpose
  definition: A matrix flipped over its diagonal so rows become columns.
  lesson: u19-matrices
- term: Identity matrix
  definition: The square matrix with 1s on the diagonal and 0s elsewhere; multiplying by it changes nothing.
  lesson: u19-matrices
- term: Matrix multiplication
  definition: Combining two matrices so each entry is the dot product of a row and a column.
  lesson: u19-matrices
- term: Symmetric matrix
  definition: A matrix that equals its own transpose.
  lesson: u19-matrices
- term: Trace
  definition: The sum of a square matrix's diagonal entries.
  lesson: u19-matrices
- term: Rotation matrix
  definition: A matrix that turns every point around the origin by a fixed angle.
  lesson: u19-matrices
- term: System of linear equations
  definition: Several equations of the form a x + b y + ... = c that must all hold at once.
  lesson: u19-systems
- term: Gaussian elimination
  definition: Solving a system by using row operations to turn it into a triangular form.
  lesson: u19-systems
- term: Row operation
  definition: Swapping two rows, scaling a row, or adding a multiple of one row to another.
  lesson: u19-systems
- term: Partial pivoting
  definition: Choosing the largest available entry as pivot to keep rounding errors small.
  lesson: u19-systems
- term: Back substitution
  definition: Solving a triangular system from the last equation upward.
  lesson: u19-systems
- term: Augmented matrix
  definition: A coefficient matrix with the right-hand side attached as an extra column.
  lesson: u19-systems
- term: Reduced row echelon form
  definition: A form where every pivot is 1 and is the only non-zero entry in its column.
  lesson: u19-systems
- term: Singular matrix
  definition: A square matrix with no inverse.
  lesson: u19-systems
- term: Residual
  definition: The leftover error b minus A x for a proposed solution.
  lesson: u19-systems
- term: Determinant
  definition: A number that tells how a matrix scales areas and whether it can be undone.
  lesson: u19-inverses
- term: Cofactor expansion
  definition: Computing a determinant by expanding along a row using smaller determinants.
  lesson: u19-inverses
- term: Minor
  definition: The smaller matrix left after deleting one row and one column.
  lesson: u19-inverses
- term: Inverse matrix
  definition: 'The matrix that undoes another: A times its inverse is the identity.'
  lesson: u19-inverses
- term: Gauss-Jordan elimination
  definition: Row reducing [A | I] until the left side is I, leaving the inverse on the right.
  lesson: u19-inverses
- term: Invertible
  definition: Having an inverse; the same as having a non-zero determinant.
  lesson: u19-inverses
- term: Cramer's rule
  definition: A formula that solves a system using ratios of determinants.
  lesson: u19-inverses
- term: Hill cipher
  definition: A cipher that encrypts blocks of letters by multiplying by a key matrix modulo 26.
  lesson: u19-inverses
- term: Span
  definition: The set of all vectors you can make from combinations of some vectors.
  lesson: u19-spaces
- term: Linear independence
  definition: A set of vectors where none is a combination of the others.
  lesson: u19-spaces
- term: Basis
  definition: An independent set of vectors that spans a space.
  lesson: u19-spaces
- term: Dimension
  definition: The number of vectors in any basis of a space.
  lesson: u19-spaces
- term: Null space
  definition: All vectors x with A x = 0, the directions a matrix flattens.
  lesson: u19-spaces
- term: Free column
  definition: A column without a pivot; each one adds a direction to the null space.
  lesson: u19-spaces
- term: Rank-nullity theorem
  definition: Rank plus the dimension of the null space equals the number of columns.
  lesson: u19-spaces
- term: Coordinates
  definition: The numbers that describe a vector as a combination of basis vectors.
  lesson: u19-spaces
- term: Linear transformation
  definition: A function on vectors that keeps sums and scalings, so lines stay lines and the origin stays put.
  lesson: u19-transforms
- term: Shear
  definition: A transformation that slides points sideways in proportion to their height.
  lesson: u19-transforms
- term: Reflection
  definition: A transformation that flips space like a mirror.
  lesson: u19-transforms
- term: Composition (of transformations)
  definition: Applying one transformation after another, which equals multiplying their matrices.
  lesson: u19-transforms
- term: Shoelace formula
  definition: A way to compute a polygon's area from its corner coordinates.
  lesson: u19-transforms
- term: Overdetermined system
  definition: A system with more equations than unknowns, usually with no exact solution.
  lesson: u19-least-squares
- term: Normal equations
  definition: The system (A transpose A) x = A transpose b whose solution is the least-squares answer.
  lesson: u19-least-squares
- term: Gram-Schmidt process
  definition: A method that turns independent vectors into perpendicular ones spanning the same space.
  lesson: u19-least-squares
- term: R squared
  definition: A score from 0 to 1 showing how much of the data's variation a fit explains.
  lesson: u19-least-squares
- term: Polynomial fit
  definition: Finding the coefficients of a polynomial curve that best matches data.
  lesson: u19-least-squares
- term: Eigenvector
  definition: A non-zero vector that a matrix only stretches, never turns.
  lesson: u19-eigen
- term: Eigenvalue
  definition: The factor by which a matrix stretches its eigenvector.
  lesson: u19-eigen
- term: Characteristic equation
  definition: The equation det(A - lambda I) = 0 whose solutions are the eigenvalues.
  lesson: u19-eigen
- term: Power iteration
  definition: Repeatedly multiplying by a matrix and rescaling to find the dominant eigenvector.
  lesson: u19-eigen
- term: Dominant eigenvalue
  definition: The eigenvalue with the largest absolute value.
  lesson: u19-eigen
- term: PageRank
  definition: A ranking of web pages based on the dominant eigenvector of the link structure.
  lesson: u19-eigen
- term: Damping factor
  definition: The probability that a random surfer follows a link instead of jumping to a random page.
  lesson: u19-eigen
- term: Covariance matrix
  definition: A matrix showing how each pair of features varies together.
  lesson: u19-applications
- term: Variance
  definition: How spread out numbers are around their mean.
  lesson: u19-applications
- term: Mean centering
  definition: Subtracting each column's average so the data sits around zero.
  lesson: u19-applications
- term: Singular value decomposition
  definition: Writing a matrix as a sum of rank-one pieces ordered by importance.
  lesson: u19-applications
- term: Low-rank approximation
  definition: Replacing a matrix with a simpler one made from its largest pieces.
  lesson: u19-applications
- term: Recommender system
  definition: Software that suggests items based on similarity between users or items.
  lesson: u19-applications
