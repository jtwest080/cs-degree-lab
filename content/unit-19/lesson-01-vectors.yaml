    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def normalize(v):
        n = norm(v)
        if n == 0:
            raise ValueError("cannot normalize the zero vector")
        return scale(1 / n, v)


    def distance(u, v):
        return norm(sub(u, v))


    def project(u, onto):
        """The part of u that points along `onto`."""
        d = dot(onto, onto)
        if d == 0:
            raise ValueError("cannot project onto the zero vector")
        return scale(dot(u, onto) / d, onto)


    def reject(u, onto):
        """The part of u that is perpendicular to `onto`."""
        return sub(u, project(u, onto))
  explanation: Projection answers "how much of u points along w?". It is the seed of least squares.
