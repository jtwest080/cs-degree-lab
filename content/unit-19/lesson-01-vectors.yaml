  tests:
  - name: cosine similarity
    code: |
      assert abs(cosine_similarity([1, 0], [1, 0]) - 1) < 1e-12
      assert abs(cosine_similarity([1, 0], [0, 1])) < 1e-12
      assert abs(cosine_similarity([1, 0], [-2, 0]) + 1) < 1e-12
      assert abs(cosine_similarity([1, 1], [2, 2]) - 1) < 1e-12
      assert abs(cosine_similarity([3, 4], [4, 3]) - 24 / 25) < 1e-12
      for bad in ([0, 0], [1, 2]):
          try:
              cosine_similarity([0, 0], bad)
              raise AssertionError("accepted the zero vector")
          except ValueError:
              pass
  - name: angles in degrees
    code: |
      assert abs(angle_between([1, 0], [0, 1]) - 90) < 1e-9
      assert abs(angle_between([1, 0], [1, 1]) - 45) < 1e-9
      assert abs(angle_between([1, 0], [-1, 0]) - 180) < 1e-9
      assert abs(angle_between([2, 0, 0], [2, 0, 0])) < 1e-6
      assert abs(angle_between([1, 0, 0], [1, 1, 0]) - 45) < 1e-9
      assert abs(angle_between([1, 2, 3], [-1, -2, -3]) - 180) < 1e-6
  - name: orthogonality
