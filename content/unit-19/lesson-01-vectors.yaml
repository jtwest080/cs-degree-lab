exercises:
- id: vector-arithmetic
  title: Add, subtract, scale and dot
  difficulty: 2
  prompt: Write `add(u, v)`, `sub(u, v)`, `scale(c, v)` and `dot(u, v)` for vectors stored as lists. `add`, `sub` and `dot` must raise `ValueError` if the lengths differ. None of them may change their arguments.
  starter: |
    def add(u, v):
        pass


    def sub(u, v):
        pass


    def scale(c, v):
        pass


    def dot(u, v):
        pass
  tests:
  - name: adding and subtracting
    code: |
      assert add([1, 2, 3], [4, 5, 6]) == [5, 7, 9]
      assert sub([4, 5, 6], [1, 2, 3]) == [3, 3, 3]
      assert add([], []) == [] and add([0.5], [0.25]) == [0.75]
      a = [1, 2]; b = [3, 4]
      add(a, b); sub(a, b)
      assert a == [1, 2] and b == [3, 4]
  - name: scaling
    code: |
      assert scale(2, [1, -2, 3]) == [2, -4, 6]
      assert scale(0, [5, 6]) == [0, 0] and scale(-1, [1, 2]) == [-1, -2] and scale(3, []) == []
  - name: dot product
    code: |
      assert dot([1, 2, 3], [4, 5, 6]) == 32
      assert dot([1, 0], [0, 1]) == 0 and dot([], []) == 0
      assert dot([2, 3], [4, -1]) == 5
      assert dot([1, 2, 3], [4, 5, 6]) == dot([4, 5, 6], [1, 2, 3])
  - name: mismatched lengths are refused
    code: |
      for f in (add, sub, dot):
          try:
              f([1, 2], [1, 2, 3])
          except ValueError:
              continue
          raise AssertionError(f.__name__ + " accepted different lengths")
  hints:
  - '`zip(u, v)` pairs up the entries; a list comprehension builds the result.'
  - Check the lengths first, then compute.
  solution: |
    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))
  explanation: Vector operations are loops over matching entries. Checking lengths prevents silent errors.
