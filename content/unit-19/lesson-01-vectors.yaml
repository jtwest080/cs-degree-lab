      assert not is_orthogonal([1, 1], [1, 2])
      assert is_orthogonal([0, 0], [3, 4])
      assert is_orthogonal([1, 1], [1, -1 + 1e-12]) and not is_orthogonal([1, 1], [1, -0.9], tol=0.01)
