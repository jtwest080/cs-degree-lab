id: u19-vectors
title: Vectors and the Dot Product
minutes: 70
objective: 'Meet vectors as both arrows and lists of numbers, and learn the operations that all of linear algebra is built on: addition, scaling, the dot product, length, angles, projection and the cross product. Every operation is built from scratch in Python so you see exactly how libraries such as NumPy work inside.'
outcomes:
- Describe a vector as a list of numbers and as an arrow, and add and scale vectors
- Compute dot products, lengths and distances and say what they mean geometrically
- Find the angle between two vectors and use cosine similarity to compare data
- Split a vector into a part along another vector and a perpendicular part
- Use the cross product in three dimensions to find perpendicular directions and areas
sections:
- heading: What a vector is
  body: |-
    A **vector** is an ordered list of numbers, such as `[2, 1]` or `[3.5, -1, 4]`. It can be read in two ways, and a great deal of mathematics comes from switching between them. As an **arrow**, `[2, 1]` means "go 2 to the right and 1 up"; the list says how far to move along each axis. As a **point**, it names a position. As **data**, it can hold anything you measure: the height, weight and age of a person; the pixels of an image; how often each word appears in a document.

    Two operations are available for every vector. **Addition** works entry by entry: `[2, 1] + [1, 3] = [3, 4]`, and as arrows it means "do one trip, then the other". **Scaling** multiplies every entry by a number (a **scalar**): `3 * [2, 1] = [6, 3]` is an arrow three times as long, and a negative scalar flips the direction. Together these two operations obey the familiar rules of algebra (order does not matter for addition, scalars distribute over sums), and any set of objects that obeys them is called a **vector space**. That idea returns in lesson 6.

    In code a vector is just a Python list, and the number of entries is its **dimension**. Adding vectors of different dimensions is meaningless, so our functions raise `ValueError` instead of silently using `zip` to cut the longer one short; quiet truncation would hide a real bug.
- heading: The dot product, length and angle
  body: |-
    The **dot product** multiplies matching entries and adds them up: `[1, 2, 3] . [4, 5, 6] = 1*4 + 2*5 + 3*6 = 32`. It looks like bookkeeping, but it measures how much two vectors **point the same way**. The dot product of a vector with itself is the sum of its squared entries, so the **length** (or **norm**) of a vector is `sqrt(v . v)`. This is the Pythagorean theorem in any dimension: `[3, 4]` has length 5. The **distance** between two points is the length of their difference.

    The geometric formula is `u . v = |u| |v| cos(theta)`, where `theta` is the angle between the arrows. Solving for the angle gives `cos(theta) = u . v / (|u| |v|)`, called the **cosine similarity**. It is 1 for vectors pointing the same way, 0 for **perpendicular** (**orthogonal**) ones and -1 for opposite directions. Because it ignores length, it is a favourite way to compare documents, songs or shoppers: describe each by a vector of word counts or ratings and a high cosine similarity means "similar taste, whatever the size". Search engines (Unit 18) and recommendation systems rely on it.

    Floating-point arithmetic needs care. Rounding can make a cosine come out as `1.0000000000000002`, which makes `acos` fail, so we clamp the value to the range -1 to 1. Likewise, testing "perpendicular" with `== 0` will fail for harmless rounding errors, so we compare with a small **tolerance**.
- heading: Projection and the cross product
  body: |-
    Often we want to split a vector into a part **along** a direction and a part **across** it. A wind of `[3, 4]` over a road that runs east `[1, 0]` pushes the car along the road with `[3, 0]` and sideways with `[0, 4]`. The **projection** of `u` onto `w` is `(u . w / w . w) * w`: first measure how much of `u` points along `w`, then scale `w` by that amount. What is left over, `u - projection`, is the **rejection** and is always perpendicular to `w`. Projection is the key to the shortest distance from a point to a line, and in lesson 8 it will solve the least-squares problem behind every line of best fit.

    In **three dimensions** there is one more product. The **cross product** `u x v` is a new vector perpendicular to both `u` and `v`; its length is the area of the parallelogram they span, so half of it is the area of a triangle. Unlike the dot product it is **not commutative**: `v x u = -(u x v)`, which is the right-hand rule. Graphics programs use it to find which way a surface faces and to light it correctly.

    Finally, the **centroid** of a set of points is their average (add them as vectors, then scale by 1/n): the balance point of the shape. Notice that every tool in this lesson was assembled from the same few operations, which is how linear algebra works throughout.
examples:
- title: Adding and scaling
  intro: Vector arithmetic works entry by entry and follows the usual laws of algebra.
  code: |
    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))


    u, v = [2, 1], [1, 3]
    print("u + v =", add(u, v))
    print("u - v =", sub(u, v))
    print("3u    =", scale(3, u))
    print("u . v =", dot(u, v))
    print("order does not matter for +:", add(u, v) == add(v, u))
    print("2(u + v) == 2u + 2v:", scale(2, add(u, v)) == add(scale(2, u), scale(2, v)))
  output: |
    u + v = [3, 4]
    u - v = [1, -2]
    3u    = [6, 3]
    u . v = 5
    order does not matter for +: True
    2(u + v) == 2u + 2v: True
  lines:
  - line: 29
    note: 'Entry by entry: [2+1, 1+3].'
  - line: 34
    note: Scalars distribute over sums, one of the vector-space rules.
- title: Length and distance
  intro: The norm is the Pythagorean theorem in any dimension. The coordinates here are latitude and longitude, so these are rough distances in degrees, not kilometres.
  code: |
    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def normalize(v):
        n = norm(v)
        if n == 0:
            raise ValueError("cannot normalize the zero vector")
        return scale(1 / n, v)


    def distance(u, v):
        return norm(sub(u, v))


    v = [3, 4]
    print("length of", v, "is", norm(v))
    print("unit vector:", normalize(v), "with length", norm(normalize(v)))
    cities = {"Oslo": [59.9, 10.8], "Rome": [41.9, 12.5], "Paris": [48.9, 2.4]}
    for a in cities:
        for b in cities:
            if a < b:
                print(f"{a}-{b}: {distance(cities[a], cities[b]):.1f} degrees apart")
  output: |
    length of [3, 4] is 5.0
    unit vector: [0.6000000000000001, 0.8] with length 1.0
    Oslo-Rome: 18.1 degrees apart
    Oslo-Paris: 13.8 degrees apart
    Paris-Rome: 12.3 degrees apart
  lines:
  - line: 44
    note: 3-4-5 is the classic right triangle.
  - line: 50
    note: Distance is the norm of a difference.
- title: Angles and cosine similarity
  intro: 'Documents described by word counts: the query is most similar to the document it points nearest to.'
  code: |
    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def normalize(v):
        n = norm(v)
        if n == 0:
            raise ValueError("cannot normalize the zero vector")
        return scale(1 / n, v)


    def distance(u, v):
        return norm(sub(u, v))


    def cosine_similarity(u, v):
        nu, nv = norm(u), norm(v)
        if nu == 0 or nv == 0:
            raise ValueError("the zero vector has no direction")
        return max(-1.0, min(1.0, dot(u, v) / (nu * nv)))


    def angle_between(u, v):
        """Angle in degrees from 0 to 180."""
        return math.degrees(math.acos(cosine_similarity(u, v)))


    def is_orthogonal(u, v, tol=1e-9):
        return abs(dot(u, v)) <= tol


    docs = {"cats":  [4, 0, 1], "dogs":  [3, 1, 0], "stocks": [0, 5, 4]}
    query = [5, 1, 0]
    for name, vec in docs.items():
        print(f"{name:7} similarity {cosine_similarity(query, vec):.3f}  angle {angle_between(query, vec):5.1f} degrees")
    print("perpendicular?", is_orthogonal([1, 2], [-2, 1]), is_orthogonal([1, 2], [2, 1]))
  output: |
    cats    similarity 0.951  angle  18.0 degrees
    dogs    similarity 0.992  angle   7.1 degrees
    stocks  similarity 0.153  angle  81.2 degrees
    perpendicular? True False
  lines:
  - line: 60
    note: 'Counts of the words cats, stocks and dogs-like terms: only direction matters.'
  - line: 63
    note: A dot product of zero means a 90 degree angle.
- title: Splitting a vector with projection
  intro: The wind splits into a part along the road and a part across it. The two parts are perpendicular and add back to the original.
  code: |
    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def normalize(v):
        n = norm(v)
        if n == 0:
            raise ValueError("cannot normalize the zero vector")
        return scale(1 / n, v)


    def distance(u, v):
        return norm(sub(u, v))


    def project(u, onto):
        """The part of u that points along `onto`."""
        d = dot(onto, onto)
        if d == 0:
            raise ValueError("cannot project onto the zero vector")
        return scale(dot(u, onto) / d, onto)


    def reject(u, onto):
        """The part of u that is perpendicular to `onto`."""
        return sub(u, project(u, onto))


    wind = [3.0, 4.0]
    road = [1.0, 0.0]
    along = project(wind, road)
    across = reject(wind, road)
    print("wind along the road:", along)
    print("wind across the road:", across)
    print("they add back up:", add(along, across) == wind, " and are perpendicular:", dot(along, across) == 0)
    print("distance from (5, 1) to the x-axis:", norm(reject([5, 1], [1, 0])))
  output: |
    wind along the road: [3.0, 0.0]
    wind across the road: [0.0, 4.0]
    they add back up: True  and are perpendicular: True
    distance from (5, 1) to the x-axis: 1.0
  lines:
  - line: 58
    note: The component of the wind that helps or hinders the car.
  - line: 62
    note: Projection and rejection always rebuild the original vector.
- title: The cross product and areas
  intro: Swapping the order flips the direction. The length of the cross product gives areas.
  code: |
    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def normalize(v):
        n = norm(v)
        if n == 0:
            raise ValueError("cannot normalize the zero vector")
        return scale(1 / n, v)


    def distance(u, v):
        return norm(sub(u, v))


    def cross(u, v):
        if len(u) != 3 or len(v) != 3:
            raise ValueError("the cross product needs 3-dimensional vectors")
        return [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]


    def triangle_area(a, b, c):
        return norm(cross(sub(b, a), sub(c, a))) / 2


    def centroid(points):
        if not points:
            raise ValueError("no points")
        total = points[0]
        for p in points[1:]:
            total = add(total, p)
        return scale(1 / len(points), total)


    x, y = [1, 0, 0], [0, 1, 0]
    print("x cross y =", cross(x, y))
    print("y cross x =", cross(y, x))
    print("triangle area:", triangle_area([0, 0, 0], [4, 0, 0], [0, 3, 0]))
    print("centroid:", centroid([[0, 0], [6, 0], [0, 6]]))
  output: |
    x cross y = [0, 0, 1]
    y cross x = [0, 0, -1]
    triangle area: 6.0
    centroid: [2.0, 2.0]
  lines:
  - line: 64
    note: Swapping the inputs flips the sign.
  - line: 65
    note: Half the length of a cross product is a triangle's area.
