  tests:
  - name: length
    code: |
      assert norm([3, 4]) == 5.0 and norm([0, 0, 0]) == 0.0
      assert abs(norm([1, 1]) - 2 ** 0.5) < 1e-12 and abs(norm([1, 2, 2]) - 3) < 1e-12
      assert norm([-3, -4]) == 5.0
  - name: unit vectors
    code: |
      def close(a, b, tol=1e-9):
          return all(abs(x - y) <= tol for x, y in zip(a, b)) and len(a) == len(b)

      assert close(normalize([3, 4]), [0.6, 0.8])
      assert close(normalize([0, 0, -5]), [0, 0, -1])
      assert abs(norm(normalize([1, 2, 3, 4])) - 1) < 1e-12
      try:
          normalize([0, 0])
          raise AssertionError("accepted the zero vector")
      except ValueError:
          pass
  - name: distance
