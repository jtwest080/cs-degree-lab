  - Add the points as vectors and scale by `1 / len(points)`.
  solution: |
    import math


    def check_same_length(u, v):
        if len(u) != len(v):
            raise ValueError(f"vectors have different lengths: {len(u)} and {len(v)}")


    def add(u, v):
        check_same_length(u, v)
        return [a + b for a, b in zip(u, v)]


    def sub(u, v):
        check_same_length(u, v)
        return [a - b for a, b in zip(u, v)]


    def scale(c, v):
        return [c * a for a in v]


    def dot(u, v):
        check_same_length(u, v)
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def normalize(v):
        n = norm(v)
        if n == 0:
            raise ValueError("cannot normalize the zero vector")
        return scale(1 / n, v)


    def distance(u, v):
        return norm(sub(u, v))


    def cross(u, v):
        if len(u) != 3 or len(v) != 3:
            raise ValueError("the cross product needs 3-dimensional vectors")
        return [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]


    def triangle_area(a, b, c):
        return norm(cross(sub(b, a), sub(c, a))) / 2


    def centroid(points):
        if not points:
            raise ValueError("no points")
        total = points[0]
        for p in points[1:]:
            total = add(total, p)
        return scale(1 / len(points), total)
  explanation: The cross product encodes area and perpendicular direction in one expression.
commonMistakes:
- title: Adding vectors of different lengths
  explanation: zip quietly cuts the longer one short. Check the dimensions and raise an error.
- title: Dividing by a zero length
  explanation: The zero vector has no direction; normalising or taking its angle should fail loudly.
- title: Testing floating-point results with ==
  explanation: Use a small tolerance, and clamp cosines before acos.
- title: Mixing up the dot and cross products
  explanation: Dot gives a number and works in any dimension; cross gives a vector and needs 3D.
- title: Forgetting that the cross product is not commutative
  explanation: v x u = -(u x v).
summary:
- A vector is a list of numbers that can be seen as an arrow, a point or data.
- Addition and scaling work entry by entry; the dot product measures alignment.
- Length is sqrt(v . v) and the angle comes from cos(theta) = u . v / (|u| |v|).
- Projection splits a vector into a part along another vector and a perpendicular part.
- The cross product gives a perpendicular vector and areas, in three dimensions only.
