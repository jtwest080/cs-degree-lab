  difficulty: 2
  prompt: Write `shape(m)` returning `(rows, columns)` and raising `ValueError` for an empty matrix, a matrix whose first row is empty, or rows of different lengths; `transpose(m)` (rows become columns, the input is not changed); `identity(n)` (the n by n identity matrix as a fresh list of lists); `mat_add(a, b)` (entry-wise sum, `ValueError` if the shapes differ) and `mat_scale(c, m)`.
