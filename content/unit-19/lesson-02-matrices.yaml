      assert transpose([[1, 2]]) == [[1], [2]]
      m = [[1, 2], [3, 4]]
      assert transpose(transpose(m)) == m and m == [[1, 2], [3, 4]]
      try:
          shape([])
          raise AssertionError('accepted bad input: ' + 'shape([])')
      except ValueError:
          pass
      try:
          shape([[]])
          raise AssertionError('accepted bad input: ' + 'shape([[]])')
      except ValueError:
          pass
      try:
          shape([[1, 2], [3]])
          raise AssertionError('accepted bad input: ' + 'shape([[1, 2], [3]])')
      except ValueError:
          pass
      try:
          transpose([[1], [2, 3]])
          raise AssertionError('accepted bad input: ' + 'transpose([[1], [2, 3]])')
      except ValueError:
          pass
  - name: identity
    code: |
      assert identity(1) == [[1]] and identity(3) == [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      assert identity(2)[0] is not identity(2)[0]
  - name: adding and scaling
    code: |
      assert mat_add([[1, 2], [3, 4]], [[10, 20], [30, 40]]) == [[11, 22], [33, 44]]
      assert mat_scale(2, [[1, -1], [0, 5]]) == [[2, -2], [0, 10]]
      assert mat_scale(0, [[1, 2, 3]]) == [[0, 0, 0]]
      try:
          mat_add([[1, 2]], [[1], [2]])
          raise AssertionError('accepted bad input: ' + 'mat_add([[1, 2]], [[1], [2]])')
      except ValueError:
          pass
      try:
          mat_add([[1]], [[1, 2]])
          raise AssertionError('accepted bad input: ' + 'mat_add([[1]], [[1, 2]])')
      except ValueError:
          pass
  hints:
