            raise ValueError("matrices must have the same shape")
        return [[x + y for x, y in zip(ra, rb)] for ra, rb in zip(a, b)]


    def mat_scale(c, m):
        shape(m)
        return [[c * x for x in row] for row in m]


    def mat_vec(m, v):
        rows, cols = shape(m)
        if cols != len(v):
            raise ValueError(f"a {rows}x{cols} matrix cannot multiply a vector of length {len(v)}")
        return [sum(x * y for x, y in zip(row, v)) for row in m]


    def mat_mul(a, b):
        (ra, ca), (rb, cb) = shape(a), shape(b)
        if ca != rb:
            raise ValueError(f"cannot multiply {ra}x{ca} by {rb}x{cb}")
        cols_of_b = transpose(b)
        return [[sum(x * y for x, y in zip(row, col)) for col in cols_of_b] for row in a]


    def mat_pow(m, k):
        """m to the power k (a non-negative integer) using repeated squaring."""
        rows, cols = shape(m)
        if rows != cols:
            raise ValueError("only square matrices have powers")
        if k < 0:
            raise ValueError("the power must not be negative")
        result, base = identity(rows), m
        while k:
            if k & 1:
                result = mat_mul(result, base)
            base = mat_mul(base, base)
            k >>= 1
        return result




    def walks(adj, k):
        """Matrix whose entry [i][j] is the number of walks of exactly k steps from node i to node j."""
        return mat_pow(adj, k)


    def walk_count(adj, i, j, k):
        return walks(adj, k)[i][j]


    def markov_step(p, dist, steps=1):
        """Evolve a probability distribution: each step multiplies by the transpose of the transition matrix p."""
        rows, cols = shape(p)
        if rows != cols or len(dist) != rows:
            raise ValueError("shapes do not match")
        pt = transpose(p)
        for _ in range(steps):
            dist = mat_vec(pt, dist)
        return dist
  explanation: Matrix powers count paths and evolve probabilities. The same tool serves graphs and chance.
commonMistakes:
- title: Multiplying matrices entry by entry
  explanation: That is a different operation. Matrix multiplication is rows times columns.
- title: Assuming A B equals B A
  explanation: Order matters; swapping usually changes the result.
- title: Ignoring shapes
  explanation: The columns of the left matrix must equal the rows of the right one.
- title: Mixing up the order when composing transformations
  explanation: A B means B first, then A.
- title: Sharing rows between matrices
  explanation: '[[0] * n] * n repeats one row n times, so changing one entry changes all rows. Build each row separately.'
summary:
- A matrix is a rectangle of numbers; its shape is rows by columns.
- Matrix times vector is a set of dot products; matrix times matrix means "do the right one first".
- Multiplication is associative but not commutative, and shapes must match.
- Rotation and scaling matrices move shapes; multiplying them composes the steps.
- Powers of adjacency and transition matrices count walks and evolve probabilities.
