- title: Rotating and stretching a square
  intro: The same two steps in a different order give different shapes.
  code: |
    def shape(m):
        """(rows, columns). Raises ValueError for an empty matrix or rows of different lengths."""
        if not m or not m[0]:
            raise ValueError("a matrix needs at least one row and one column")
        if any(len(row) != len(m[0]) for row in m):
            raise ValueError("all rows must have the same length")
        return len(m), len(m[0])


    def transpose(m):
        shape(m)
        return [[m[i][j] for i in range(len(m))] for j in range(len(m[0]))]


    def identity(n):
        return [[1 if i == j else 0 for j in range(n)] for i in range(n)]


    def mat_add(a, b):
        if shape(a) != shape(b):
            raise ValueError("matrices must have the same shape")
        return [[x + y for x, y in zip(ra, rb)] for ra, rb in zip(a, b)]


    def mat_scale(c, m):
        shape(m)
        return [[c * x for x in row] for row in m]


    def mat_vec(m, v):
        rows, cols = shape(m)
        if cols != len(v):
            raise ValueError(f"a {rows}x{cols} matrix cannot multiply a vector of length {len(v)}")
        return [sum(x * y for x, y in zip(row, v)) for row in m]


    def mat_mul(a, b):
        (ra, ca), (rb, cb) = shape(a), shape(b)
        if ca != rb:
            raise ValueError(f"cannot multiply {ra}x{ca} by {rb}x{cb}")
        cols_of_b = transpose(b)
        return [[sum(x * y for x, y in zip(row, col)) for col in cols_of_b] for row in a]


    import math


    def rotation(degrees):
        c, s = math.cos(math.radians(degrees)), math.sin(math.radians(degrees))
        return [[c, -s], [s, c]]


    def scaling(sx, sy):
        return [[sx, 0], [0, sy]]


    def apply_to_points(m, points):
        return [mat_vec(m, p) for p in points]


    def compose(*matrices):
        """One matrix that does the LAST matrix first: compose(a, b) is a times b."""
        if not matrices:
            raise ValueError("nothing to compose")
        result = matrices[0]
        for m in matrices[1:]:
            result = mat_mul(result, m)
        return result


    square = [[0, 0], [1, 0], [1, 1], [0, 1]]
    def show(points):
        return [[round(x, 2) + 0.0, round(y, 2) + 0.0] for x, y in points]
    print("rotate 90:", show(apply_to_points(rotation(90), square)))
    print("stretch  :", show(apply_to_points(scaling(3, 1), square)))
    both = compose(rotation(90), scaling(3, 1))
    print("stretch, then rotate:", show(apply_to_points(both, square)))
    other = compose(scaling(3, 1), rotation(90))
    print("rotate, then stretch:", show(apply_to_points(other, square)))
  output: |
    rotate 90: [[0.0, 0.0], [0.0, 1.0], [-1.0, 1.0], [-1.0, 0.0]]
    stretch  : [[0.0, 0.0], [3.0, 0.0], [3.0, 1.0], [0.0, 1.0]]
    stretch, then rotate: [[0.0, 0.0], [0.0, 3.0], [-1.0, 3.0], [-1.0, 0.0]]
    rotate, then stretch: [[0.0, 0.0], [0.0, 1.0], [-3.0, 1.0], [-3.0, 0.0]]
