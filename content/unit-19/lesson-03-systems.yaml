  solution: |
    def eliminate(a, b):
        """Forward elimination with partial pivoting. Returns (u, c): an upper triangular system with the same solution."""
        n = len(a)
        if any(len(row) != n for row in a) or len(b) != n:
            raise ValueError("need a square matrix and a right-hand side of the same size")
        u = [[float(x) for x in row] for row in a]
        c = [float(x) for x in b]
        for col in range(n):
            pivot = max(range(col, n), key=lambda r: abs(u[r][col]))
            if abs(u[pivot][col]) < 1e-12:
                raise ValueError("the matrix is singular: no unique solution")
            u[col], u[pivot] = u[pivot], u[col]
            c[col], c[pivot] = c[pivot], c[col]
            for r in range(col + 1, n):
                factor = u[r][col] / u[col][col]
                u[r] = [x - factor * y for x, y in zip(u[r], u[col])]
                u[r][col] = 0.0
                c[r] -= factor * c[col]
        return u, c
  explanation: Pivoting makes the algorithm both safe (no division by zero) and accurate.
