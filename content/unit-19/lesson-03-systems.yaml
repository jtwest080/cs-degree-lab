exercises:
- id: row-operations
  title: The three row operations
  difficulty: 2
  prompt: Write `swap_rows(m, i, j)`, `scale_row(m, i, c)` and `add_multiple(m, target, source, c)` (add `c` times row `source` to row `target`). Each returns a **new** matrix and leaves `m` and its rows unchanged. `scale_row` raises `ValueError` for `c == 0`, and `add_multiple` raises `ValueError` if `target == source`.
  starter: |
    def swap_rows(m, i, j):
        pass


    def scale_row(m, i, c):
        pass


    def add_multiple(m, target, source, c):
        pass
  tests:
  - name: the three row operations
    code: |
      m = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
      assert swap_rows(m, 0, 2) == [[7, 8, 9], [4, 5, 6], [1, 2, 3]]
      assert scale_row(m, 1, 2) == [[1, 2, 3], [8, 10, 12], [7, 8, 9]]
      assert add_multiple(m, 1, 0, -4) == [[1, 2, 3], [0, -3, -6], [7, 8, 9]]
      assert swap_rows(m, 1, 1) == m
  - name: the original is never changed
    code: |
      m = [[1, 2], [3, 4]]
      a = swap_rows(m, 0, 1); b = scale_row(m, 0, 5); c = add_multiple(m, 0, 1, 2)
      assert m == [[1, 2], [3, 4]]
      a[0][0] = 99; b[1][1] = 99; c[1][0] = 99
      assert m == [[1, 2], [3, 4]]
  - name: forbidden operations
    code: |
      try:
          scale_row([[1, 2]], 0, 0)
          raise AssertionError('accepted bad input')
      except ValueError:
          pass
      try:
          add_multiple([[1, 2], [3, 4]], 1, 1, 2)
          raise AssertionError('accepted bad input')
      except ValueError:
          pass
  - name: operations keep the solution
    code: |
      # x + y = 3 and 2x - y = 0 have the solution x = 1, y = 2
      m = [[1, 1, 3], [2, -1, 0]]
      def holds(mat):
          return all(row[0] * 1 + row[1] * 2 == row[2] for row in mat)
      assert holds(m) and holds(swap_rows(m, 0, 1)) and holds(scale_row(m, 0, -3)) and holds(add_multiple(m, 1, 0, -2))
  hints:
  - Copy the matrix first with `[row[:] for row in m]`.
  - '`zip(out[target], out[source])` pairs up the entries of the two rows.'
  solution: |
    def swap_rows(m, i, j):
        """A new matrix with rows i and j exchanged."""
        out = [row[:] for row in m]
        out[i], out[j] = out[j], out[i]
        return out


    def scale_row(m, i, c):
        """A new matrix with row i multiplied by c (c must not be 0)."""
        if c == 0:
            raise ValueError("scaling a row by 0 destroys information")
        out = [row[:] for row in m]
        out[i] = [c * x for x in out[i]]
        return out


    def add_multiple(m, target, source, c):
        """A new matrix with c times row `source` added to row `target`."""
        if target == source:
            raise ValueError("target and source must be different rows")
        out = [row[:] for row in m]
        out[target] = [t + c * s for t, s in zip(out[target], out[source])]
        return out
  explanation: These three operations never change the set of solutions, which is why elimination is allowed to use them.
- id: back-substitution
  title: Back substitution
  difficulty: 3
  prompt: Write `back_substitute(u, b)` that solves `u x = b` for an upper triangular `u` (zeros below the diagonal) and returns the list `x`. Start from the last equation and work upward. Raise `ValueError` if a diagonal entry is smaller than `1e-12` in absolute value.
  starter: |
    def back_substitute(u, b):
        """Solve u x = b where u is upper triangular."""
        pass
  tests:
  - name: triangular systems
    code: |
      def vclose(a, b, tol=1e-9):
          return len(a) == len(b) and all(abs(x - y) <= tol for x, y in zip(a, b))

      assert vclose(back_substitute([[2, 1], [0, 4]], [5, 8]), [1.5, 2.0])
      assert vclose(back_substitute([[1, 2, 3], [0, 1, 4], [0, 0, 2]], [14, 11, 6]), [7, -1, 3])
      assert vclose(back_substitute([[5]], [10]), [2.0])
      assert vclose(back_substitute([[1, 0], [0, 1]], [7, -3]), [7, -3])
  - name: a zero on the diagonal
    code: |
      try:
          back_substitute([[1, 2], [0, 0]], [3, 4])
          raise AssertionError('accepted bad input')
      except ValueError:
          pass
      try:
          back_substitute([[0, 1], [0, 2]], [1, 2])
          raise AssertionError('accepted bad input')
      except ValueError:
          pass
  hints:
  - Loop `i` from `n - 1` down to `0`.
  - Subtract the already-known terms `u[i][j] * x[j]` for `j > i`, then divide by `u[i][i]`.
  solution: |
    def back_substitute(u, b):
        """Solve u x = b where u is upper triangular (zeros below the diagonal)."""
        n = len(u)
        x = [0.0] * n
        for i in range(n - 1, -1, -1):
            if abs(u[i][i]) < 1e-12:
                raise ValueError("zero on the diagonal: no unique solution")
            known = sum(u[i][j] * x[j] for j in range(i + 1, n))
            x[i] = (b[i] - known) / u[i][i]
        return x
  explanation: A triangular system is easy because each equation introduces only one new unknown.
- id: elimination
  title: Forward elimination with pivoting
  difficulty: 5
  prompt: Write `eliminate(a, b)` returning `(u, c)`, an upper triangular matrix and right-hand side with the same solution as `a x = b`, without changing `a` or `b`. Work on float copies. For each column, find the row at or below the diagonal with the largest absolute value in that column (partial pivoting), raise `ValueError` if that value is below `1e-12` (singular), swap it into the pivot position (in both `u` and `c`), and subtract multiples of the pivot row from every row below so their entries in that column become exactly `0.0`. Raise `ValueError` if `a` is not square or `b` has the wrong length.
  starter: |
    def eliminate(a, b):
        """Return (u, c): an upper triangular system with the same solution as a x = b."""
        pass
  tests:
  - name: the result is upper triangular
    code: |
      u, c = eliminate([[2, 1, -1], [-3, -1, 2], [-2, 1, 2]], [8, -11, -3])
      assert all(u[i][j] == 0 for i in range(3) for j in range(i))
      assert all(abs(u[i][i]) > 1e-12 for i in range(3))
      assert abs(u[0][0]) == 3.0
  - name: the solution is unchanged
    code: |
      a, b = [[2, 1, -1], [-3, -1, 2], [-2, 1, 2]], [8, -11, -3]
      u, c = eliminate(a, b)
      x = [2, 3, -1]
      for row, rhs in zip(u, c):
          assert abs(sum(p * q for p, q in zip(row, x)) - rhs) < 1e-9
      assert a == [[2, 1, -1], [-3, -1, 2], [-2, 1, 2]] and b == [8, -11, -3]
  - name: pivoting copes with a zero in the corner
    code: |
      u, c = eliminate([[0, 1], [1, 0]], [2, 3])
      assert u == [[1.0, 0.0], [0.0, 1.0]] and c == [3.0, 2.0]
      u, c = eliminate([[1e-20, 1], [1, 1]], [1, 2])
      assert abs(u[0][0]) == 1.0
  - name: singular and badly shaped systems
