id: u19-systems
title: Solving Systems of Equations
minutes: 80
objective: 'Learn Gaussian elimination, the most used algorithm in scientific computing: turn a system of linear equations into a matrix, simplify it with three row operations, and read off the answer. You will also see when a system has no solution or infinitely many, and why real solvers swap rows.'
outcomes:
- Write a system of linear equations as an augmented matrix
- Use the three row operations and explain why they keep the solutions unchanged
- Solve a system with forward elimination and back substitution
- Explain partial pivoting and why floating-point solvers need it
- Use reduced row echelon form to tell whether a system has one, no or infinitely many solutions
sections:
- heading: Equations as a matrix
  body: |-
    A **linear equation** is one like `2x + y = 5`: each unknown is multiplied by a number and the results are added, with no squares, products of unknowns or other curves. A **system** is several such equations that must all be true at once, for example

    `x + y = 3` and `2x - y = 0`.

    Each equation is a line in the plane, and solving the system means finding where the lines cross (here `x = 1`, `y = 2`). With three unknowns each equation is a plane in space; with a thousand unknowns nobody can draw it, but the algebra is the same. Systems like this appear everywhere: balancing chemical equations, electrical circuits, fitting curves to data, computer graphics, economics and the training of machine-learning models.

    We only need the numbers, so we store the system as a matrix. The **coefficient matrix** `A` holds the multipliers, the vector `b` holds the right-hand sides, and the system is the single equation `A x = b` (matrix times vector, lesson 2). Gluing `b` on as an extra column gives the **augmented matrix** `[[1, 1, 3], [2, -1, 0]]`, where every row is one equation.
- heading: Gaussian elimination
  body: |-
    Three **row operations** change the matrix without changing the solutions: **swap** two rows (the order of equations does not matter), **scale** a row by a non-zero number (multiply both sides of an equation), and **add a multiple** of one row to another (add equations together). Scaling by zero is forbidden because it would erase an equation.

    **Gaussian elimination** uses these operations with a plan. Work through the columns from left to right. In each column choose a **pivot** (a non-zero entry) and subtract multiples of its row from the rows below until everything under the pivot is zero. After this **forward elimination** the matrix is **upper triangular**: a staircase with zeros below the diagonal. The last equation then has only one unknown, so solve it, substitute the answer into the equation above, and continue upward. This is **back substitution**.

    For `n` equations the work grows like `n^3` (three nested loops), which is fine for thousands of unknowns and is the reason computers can solve problems no person ever could by hand.

    One practical detail matters a great deal. If the pivot is zero the method divides by zero, and if it is merely tiny, the floating-point rounding errors (Unit 1) are blown up enormously. **Partial pivoting** fixes both: before eliminating in a column, swap up the row whose entry in that column is largest in absolute value. Every serious solver does this. Afterwards, check your answer with the **residual**, the size of `A x - b`: a tiny residual means the computed `x` really satisfies the equations.
- heading: One solution, none, or infinitely many
  body: |-
    Two lines in the plane can cross once (**one solution**), be parallel (**no solution**) or be the same line (**infinitely many solutions**). Exactly these three cases, and no others, occur for every linear system of any size.

    To tell them apart, continue eliminating until each pivot is 1 and is the only non-zero entry in its column. This is the **reduced row echelon form (RREF)**, and it is unique: any sequence of row operations leads to the same RREF. To avoid rounding we compute it with Python's exact `Fraction` type.

    Read the result like this. A row that says `0 0 ... 0 | 1` claims `0 = 1`, so the system is **inconsistent**: no solution. Otherwise, if every unknown has a pivot, there is exactly one solution. If some column has no pivot, that unknown is a **free variable** which can take any value, giving infinitely many solutions.

    A square matrix that leads to a unique solution for every right-hand side is called **invertible** (or **non-singular**); one that does not is **singular**. Our floating-point `solve` raises `ValueError` for singular matrices, because no single answer exists. The next lesson studies invertible matrices and a single number, the determinant, that detects them.
examples:
- title: Row operations by hand
  intro: Three steps turn the augmented matrix into one that states the answer directly.
  code: |
    def swap_rows(m, i, j):
        """A new matrix with rows i and j exchanged."""
        out = [row[:] for row in m]
        out[i], out[j] = out[j], out[i]
        return out


    def scale_row(m, i, c):
        """A new matrix with row i multiplied by c (c must not be 0)."""
        if c == 0:
            raise ValueError("scaling a row by 0 destroys information")
        out = [row[:] for row in m]
        out[i] = [c * x for x in out[i]]
        return out


    def add_multiple(m, target, source, c):
        """A new matrix with c times row `source` added to row `target`."""
        if target == source:
            raise ValueError("target and source must be different rows")
        out = [row[:] for row in m]
        out[target] = [t + c * s for t, s in zip(out[target], out[source])]
        return out


    # x + y = 3
    # 2x - y = 0      written as an augmented matrix [coefficients | right-hand side]
    m = [[1, 1, 3], [2, -1, 0]]
    def tidy(matrix):
        return [[round(v, 3) + 0.0 for v in row] for row in matrix]

    step1 = add_multiple(m, 1, 0, -2)          # row 1 minus 2 times row 0
    print(tidy(step1))
    step2 = scale_row(step1, 1, -1 / 3)        # make the pivot 1
    print(tidy(step2))
    step3 = add_multiple(step2, 0, 1, -1)      # clear the entry above
    print(tidy(step3))
    print("so x =", round(step3[0][2], 6), "and y =", round(step3[1][2], 6))
  output: |
    [[1.0, 1.0, 3.0], [0.0, -3.0, -6.0]]
    [[1.0, 1.0, 3.0], [0.0, 1.0, 2.0]]
    [[1.0, 0.0, 1.0], [0.0, 1.0, 2.0]]
    so x = 1.0 and y = 2.0
  lines:
  - line: 32
    note: Removes x from the second equation.
  - line: 36
    note: Now each row names one unknown.
- title: Solving a 3 by 3 system
  intro: Prices of three fruits from the totals of three baskets. The printed staircase is the upper triangular system after elimination.
  code: |
    def back_substitute(u, b):
        """Solve u x = b where u is upper triangular (zeros below the diagonal)."""
        n = len(u)
        x = [0.0] * n
        for i in range(n - 1, -1, -1):
            if abs(u[i][i]) < 1e-12:
                raise ValueError("zero on the diagonal: no unique solution")
            known = sum(u[i][j] * x[j] for j in range(i + 1, n))
            x[i] = (b[i] - known) / u[i][i]
        return x


    def eliminate(a, b):
        """Forward elimination with partial pivoting. Returns (u, c): an upper triangular system with the same solution."""
        n = len(a)
        if any(len(row) != n for row in a) or len(b) != n:
            raise ValueError("need a square matrix and a right-hand side of the same size")
        u = [[float(x) for x in row] for row in a]
        c = [float(x) for x in b]
        for col in range(n):
            pivot = max(range(col, n), key=lambda r: abs(u[r][col]))
            if abs(u[pivot][col]) < 1e-12:
                raise ValueError("the matrix is singular: no unique solution")
            u[col], u[pivot] = u[pivot], u[col]
            c[col], c[pivot] = c[pivot], c[col]
            for r in range(col + 1, n):
                factor = u[r][col] / u[col][col]
                u[r] = [x - factor * y for x, y in zip(u[r], u[col])]
                u[r][col] = 0.0
                c[r] -= factor * c[col]
        return u, c


    def solve(a, b):
        """The unique solution x of a x = b, or ValueError if there is none or there are many."""
        u, c = eliminate(a, b)
        return back_substitute(u, c)


    def residual(a, x, b):
        """The largest absolute error of a x - b: how well x really solves the system."""
        return max(abs(sum(p * q for p, q in zip(row, x)) - target) for row, target in zip(a, b))


    # Three kinds of fruit, three baskets with known totals
    a = [[2, 1, 1], [1, 3, 2], [1, 0, 0]]
    b = [9, 15.5, 2]
    x = solve(a, b)
    print("apple, banana, cherry prices:", [round(v, 6) for v in x])
    print("largest error:", residual(a, x, b) < 1e-9)
    u, c = eliminate(a, b)
    for row, rhs in zip(u, c):
        print([round(v, 3) + 0.0 for v in row], "|", round(rhs, 3))
  output: |
    apple, banana, cherry prices: [2.0, 3.5, 1.5]
    largest error: True
    [2.0, 1.0, 1.0] | 9.0
    [0.0, 2.5, 1.5] | 11.0
    [0.0, 0.0, -0.2] | -0.3
  lines:
  - line: 48
    note: Elimination followed by back substitution.
  - line: 36
    note: The staircase of zeros is what makes back substitution possible.
- title: Why solvers swap rows
  intro: A tiny pivot destroys the answer unless the larger row is swapped up first.
  code: |
    def eliminate(a, b):
        """Forward elimination with partial pivoting. Returns (u, c): an upper triangular system with the same solution."""
        n = len(a)
        if any(len(row) != n for row in a) or len(b) != n:
            raise ValueError("need a square matrix and a right-hand side of the same size")
        u = [[float(x) for x in row] for row in a]
        c = [float(x) for x in b]
        for col in range(n):
            pivot = max(range(col, n), key=lambda r: abs(u[r][col]))
            if abs(u[pivot][col]) < 1e-12:
                raise ValueError("the matrix is singular: no unique solution")
            u[col], u[pivot] = u[pivot], u[col]
            c[col], c[pivot] = c[pivot], c[col]
            for r in range(col + 1, n):
                factor = u[r][col] / u[col][col]
                u[r] = [x - factor * y for x, y in zip(u[r], u[col])]
                u[r][col] = 0.0
                c[r] -= factor * c[col]
        return u, c


    def back_substitute(u, b):
        """Solve u x = b where u is upper triangular (zeros below the diagonal)."""
        n = len(u)
        x = [0.0] * n
        for i in range(n - 1, -1, -1):
            if abs(u[i][i]) < 1e-12:
                raise ValueError("zero on the diagonal: no unique solution")
            known = sum(u[i][j] * x[j] for j in range(i + 1, n))
            x[i] = (b[i] - known) / u[i][i]
        return x


    def naive_solve(a, b):
        """Elimination without row swaps: loses accuracy when a pivot is tiny."""
        n = len(a)
        u = [[float(x) for x in row] for row in a]
        c = [float(x) for x in b]
        for col in range(n):
            for r in range(col + 1, n):
                factor = u[r][col] / u[col][col]
                u[r] = [x - factor * y for x, y in zip(u[r], u[col])]
                c[r] -= factor * c[col]
        x = [0.0] * n
        for i in range(n - 1, -1, -1):
            x[i] = (c[i] - sum(u[i][j] * x[j] for j in range(i + 1, n))) / u[i][i]
        return x


    a, b = [[1e-20, 1.0], [1.0, 1.0]], [1.0, 2.0]        # the true answer is very close to x = 1, y = 1
    print("without pivoting:", naive_solve(a, b))
    u, c = eliminate(a, b)
    print("with pivoting   :", back_substitute(u, c))
  output: |
    without pivoting: [0.0, 1.0]
    with pivoting   : [1.0, 1.0]
  lines:
  - line: 15
    note: Dividing by 1e-20 creates enormous numbers that swamp everything else.
  - line: 52
    note: Pivoting swaps the larger entry up first, and the answer is right.
- title: Three kinds of systems
  intro: The reduced row echelon form shows whether there is one solution, infinitely many or none.
  code: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, pivot_columns)."""
        a = [[Fraction(x) for x in row] for row in m]
        rows, cols = len(a), len(a[0])
        pivots, r = [], 0
        for col in range(cols):
            if r == rows:
                break
            pivot = next((i for i in range(r, rows) if a[i][col] != 0), None)
            if pivot is None:
                continue
            a[r], a[pivot] = a[pivot], a[r]
            lead = a[r][col]
            a[r] = [x / lead for x in a[r]]
            for i in range(rows):
                if i != r and a[i][col] != 0:
                    factor = a[i][col]
                    a[i] = [x - factor * y for x, y in zip(a[i], a[r])]
            pivots.append(col)
            r += 1
        return a, pivots


    def classify(a, b):
        """"unique", "none" or "infinite": how many solutions a x = b has."""
        augmented = [list(row) + [rhs] for row, rhs in zip(a, b)]
        _, pivots = rref(augmented)
        unknowns = len(a[0])
        if unknowns in pivots:
            return "none"
        return "unique" if len(pivots) == unknowns else "infinite"


    systems = {
        "two lines that cross": ([[1, 1], [2, -1]], [3, 0]),
        "the same line twice": ([[1, 2], [2, 4]], [3, 6]),
        "parallel lines": ([[1, 2], [2, 4]], [3, 7]),
    }
    for name, (a, b) in systems.items():
        reduced, pivots = rref([row + [rhs] for row, rhs in zip(a, b)])
        print(f"{name}: {classify(a, b)}")
        print("   ", [[str(x) for x in row] for row in reduced], "pivot columns", pivots)
  output: |
    two lines that cross: unique
        [['1', '0', '1'], ['0', '1', '2']] pivot columns [0, 1]
    the same line twice: infinite
        [['1', '2', '3'], ['0', '0', '0']] pivot columns [0]
    parallel lines: none
        [['1', '2', '0'], ['0', '0', '1']] pivot columns [0, 2]
  lines:
  - line: 43
    note: The pivot columns tell the whole story.
  - line: 44
    note: One crossing point, a whole line of solutions, or no solution at all.
- title: Fitting a curve through points
  intro: Finding the parabola through three points is a linear system in its three coefficients.
  code: |
    def back_substitute(u, b):
        """Solve u x = b where u is upper triangular (zeros below the diagonal)."""
        n = len(u)
        x = [0.0] * n
        for i in range(n - 1, -1, -1):
            if abs(u[i][i]) < 1e-12:
                raise ValueError("zero on the diagonal: no unique solution")
            known = sum(u[i][j] * x[j] for j in range(i + 1, n))
            x[i] = (b[i] - known) / u[i][i]
        return x


    def eliminate(a, b):
        """Forward elimination with partial pivoting. Returns (u, c): an upper triangular system with the same solution."""
        n = len(a)
        if any(len(row) != n for row in a) or len(b) != n:
            raise ValueError("need a square matrix and a right-hand side of the same size")
        u = [[float(x) for x in row] for row in a]
        c = [float(x) for x in b]
        for col in range(n):
            pivot = max(range(col, n), key=lambda r: abs(u[r][col]))
            if abs(u[pivot][col]) < 1e-12:
                raise ValueError("the matrix is singular: no unique solution")
            u[col], u[pivot] = u[pivot], u[col]
            c[col], c[pivot] = c[pivot], c[col]
            for r in range(col + 1, n):
                factor = u[r][col] / u[col][col]
                u[r] = [x - factor * y for x, y in zip(u[r], u[col])]
                u[r][col] = 0.0
                c[r] -= factor * c[col]
        return u, c


    def solve(a, b):
        """The unique solution x of a x = b, or ValueError if there is none or there are many."""
        u, c = eliminate(a, b)
        return back_substitute(u, c)


    def residual(a, x, b):
        """The largest absolute error of a x - b: how well x really solves the system."""
        return max(abs(sum(p * q for p, q in zip(row, x)) - target) for row, target in zip(a, b))


    # Find the parabola y = a + b x + c x^2 through three points.
    points = [(1, 6), (2, 11), (3, 18)]
    matrix = [[1, x, x * x] for x, _ in points]
    rhs = [y for _, y in points]
    a, b, c = solve(matrix, rhs)
    print(f"y = {a:.1f} + {b:.1f}x + {c:.1f}x^2")
    print("check:", [round(a + b * x + c * x * x, 6) for x, _ in points])
  output: |
    y = 3.0 + 2.0x + 1.0x^2
    check: [6.0, 11.0, 18.0]
  lines:
  - line: 47
    note: Each point gives one equation in the unknown coefficients a, b and c.
  - line: 51
    note: The curve really passes through all three points.
