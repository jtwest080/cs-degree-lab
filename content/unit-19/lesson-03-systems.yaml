        pass
  tests:
  - name: solve2
    code: |
      assert solve2(1, 1, 2, -1, 3, 0) == (1.0, 2.0)
      assert solve2(2, 0, 0, 4, 6, 8) == (3.0, 2.0)
      try:
          solve2(1, 2, 2, 4, 3, 6)
          raise AssertionError("accepted a singular system")
      except ValueError:
          pass
  solution: |
    def solve2(a, b, c, d, e, f):
        det = a * d - b * c
        if det == 0:
            raise ValueError("no unique solution")
        return ((e * d - b * f) / det, (a * f - e * c) / det)
