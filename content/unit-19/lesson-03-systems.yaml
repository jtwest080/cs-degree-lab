  - If the augmented column (index `len(a[0])`) is a pivot, some row reads 0 = 1.
  solution: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, pivot_columns)."""
        a = [[Fraction(x) for x in row] for row in m]
        rows, cols = len(a), len(a[0])
        pivots, r = [], 0
        for col in range(cols):
            if r == rows:
                break
            pivot = next((i for i in range(r, rows) if a[i][col] != 0), None)
            if pivot is None:
                continue
            a[r], a[pivot] = a[pivot], a[r]
            lead = a[r][col]
            a[r] = [x / lead for x in a[r]]
            for i in range(rows):
                if i != r and a[i][col] != 0:
                    factor = a[i][col]
                    a[i] = [x - factor * y for x, y in zip(a[i], a[r])]
            pivots.append(col)
            r += 1
        return a, pivots


    def classify(a, b):
        """"unique", "none" or "infinite": how many solutions a x = b has."""
        augmented = [list(row) + [rhs] for row, rhs in zip(a, b)]
        _, pivots = rref(augmented)
        unknowns = len(a[0])
        if unknowns in pivots:
            return "none"
        return "unique" if len(pivots) == unknowns else "infinite"
  explanation: 'RREF is the complete answer to a linear system: it shows the solutions and how many there are.'
commonMistakes:
- title: Scaling a row by zero
  explanation: It erases an equation and changes the solutions.
- title: Dividing by a zero or tiny pivot
  explanation: Swap rows first (partial pivoting).
- title: Forgetting the right-hand side
  explanation: Every row operation must be applied to b as well, which is why we use an augmented matrix.
- title: Assuming every system has exactly one solution
  explanation: There may be none or infinitely many.
- title: Trusting an answer without checking
  explanation: Compute the residual A x - b.
summary:
- A linear system is A x = b; its augmented matrix has one row per equation.
- Swapping, scaling and adding multiples of rows never change the solutions.
- Forward elimination makes the system triangular; back substitution finishes it.
- Partial pivoting avoids zero and tiny pivots; the residual checks the answer.
- RREF shows whether a system has one solution, none or infinitely many.
