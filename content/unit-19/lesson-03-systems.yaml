- type: code
  question: Write `solve2(a, b, c, d, e, f)` that solves `a x + b y = e` and `c x + d y = f` and returns `(x, y)` using the formulas `x = (e d - b f) / (a d - b c)` and `y = (a f - e c) / (a d - b c)`. Raise `ValueError` if `a d - b c` is 0.
  starter: |
