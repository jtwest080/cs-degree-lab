id: u19-inverses
title: Determinants and Inverse Matrices
minutes: 80
objective: Learn the determinant, a single number that tells you how a matrix scales areas and whether it can be undone, and the inverse matrix that undoes it. You will compute both exactly with fractions, solve systems two more ways, and use matrix inverses to build and break a real cipher.
outcomes:
- Explain the determinant as a scale factor for areas and as a test for invertibility
- Compute determinants by cofactor expansion and by elimination
- Find the inverse of a matrix with Gauss-Jordan elimination, using exact fractions
- Solve a system using the inverse and using Cramer's rule, and say why elimination is usually better
- Use matrix inverses modulo 26 to encrypt and decrypt with the Hill cipher
sections:
- heading: The determinant
  body: |-
    Last lesson, some systems had exactly one solution and others did not. Is there a quick test for a square matrix? Yes: the **determinant**, written `det(A)`. For a 2x2 matrix `[[a, b], [c, d]]` it is `a*d - b*c`. For example `det([[1, 2], [3, 4]]) = 1*4 - 2*3 = -2`.

    What does the number mean? Think of the matrix as a machine that moves points (lesson 2). Feed it the unit square (area 1) and it produces a parallelogram. The **absolute value of the determinant is the area of that parallelogram**: stretch x by 2 and y by 3 (`[[2, 0], [0, 3]]`) and every area becomes 6 times bigger. In three dimensions it is a volume factor. A **negative** determinant means the machine also flips the picture like a mirror (swapping x and y has determinant -1). And a determinant of **0** means the machine squashes the plane flat onto a line, so information is lost and the action cannot be undone.

    That is the main fact of this lesson: **a square matrix is invertible exactly when its determinant is not 0.** Several other statements are equivalent to it: `A x = b` has exactly one solution for every `b`, the rows are independent, and the columns are independent.
- heading: Computing determinants
  body: |-
    For bigger matrices the **definition** is **cofactor expansion**: pick the first row, and for each entry multiply it by the determinant of the smaller matrix left after deleting its row and column (the **minor**), alternating the signs `+ - + - ...`. Each of those smaller determinants expands the same way, so the code is a short recursion. The cost is terrible: an `n x n` matrix needs about `n!` steps (for n = 20 that is more than a billion billion). It is wonderful for understanding and awful for computing.

    The fast way uses Gaussian elimination from lesson 3. Three facts make it work: adding a multiple of one row to another **does not change** the determinant, swapping two rows **flips its sign**, and the determinant of a triangular matrix is just the **product of its diagonal**. So eliminate, remember how many swaps you did, multiply the diagonal, and fix the sign. This needs about `n^3` steps. If a column has no pivot, the determinant is 0.

    The determinant also follows pleasant rules: `det(A B) = det(A) * det(B)` (scale factors multiply), `det(A^T) = det(A)`, and multiplying one row by `c` multiplies the determinant by `c`. We use Python's `Fraction` so the answers are exact integers or fractions, with no rounding.
- heading: Inverses, and what they are good for
  body: |-
    The **inverse** of `A`, written `A^-1`, is the matrix that undoes `A`: `A A^-1 = A^-1 A = I` (the identity). Like `1/5` for the number 5, it exists only when `A` is invertible (determinant not 0). To find it, write `A` next to the identity as `[A | I]` and apply the elimination of lesson 3 until the left half becomes `I`; the right half has become `A^-1` (**Gauss-Jordan elimination**). The same row operations that turn `A` into `I` turn `I` into `A^-1`.

    With the inverse, `A x = b` is solved by `x = A^-1 b`. A different formula is **Cramer's rule**: `x_j = det(A_j) / det(A)`, where `A_j` is `A` with column `j` replaced by `b`. Both are lovely on paper and **poor in practice**: forming an inverse costs more than solving the system directly, and Cramer's rule needs `n + 1` determinants. Numerical programmers solve `A x = b` with elimination and almost never compute inverses explicitly. The inverse is mostly a tool for thinking and for small matrices.

    One place where inverses are the whole point is **cryptography**. The **Hill cipher** (1929) turns letters into numbers 0 to 25, groups them in pairs, multiplies each pair by a secret key matrix and reduces the result **modulo 26** (Unit 6). To decrypt you need the inverse of the key matrix modulo 26, which exists only when `gcd(det, 26) = 1`. For a 2x2 key this is `det^-1 * [[d, -b], [-c, a]]`, with the inverse of the determinant taken modulo 26. The Hill cipher is **not secure** today (anyone who knows a little plaintext can solve for the key with linear algebra, which is exactly why this lesson belongs to the previous one), but it was the first cipher to use matrices and it shows the idea clearly.
examples:
- title: What the determinant measures
  intro: Area scaling, mirror flips and the test for dependent rows.
  code: |
    def check_square(m):
        n = len(m)
        if n == 0 or any(len(row) != n for row in m):
            raise ValueError("a square, non-empty matrix is needed")
        return n


    def det2(m):
        return m[0][0] * m[1][1] - m[0][1] * m[1][0]


    def minor(m, i, j):
        """The matrix with row i and column j removed."""
        return [row[:j] + row[j + 1:] for k, row in enumerate(m) if k != i]


    def det_cofactor(m):
        """Determinant by expansion along the first row (slow for big matrices, but it shows the definition)."""
        n = check_square(m)
        if n == 1:
            return m[0][0]
        if n == 2:
            return det2(m)
        return sum((-1) ** j * m[0][j] * det_cofactor(minor(m, 0, j)) for j in range(n))


    from fractions import Fraction


    def det(m):
        """Determinant by elimination with exact fractions: multiply the diagonal, and flip the sign for each row swap."""
        n = check_square(m)
        a = [[Fraction(x) for x in row] for row in m]
        sign = 1
        for col in range(n):
            pivot = next((r for r in range(col, n) if a[r][col] != 0), None)
            if pivot is None:
                return Fraction(0)
            if pivot != col:
                a[col], a[pivot] = a[pivot], a[col]
                sign = -sign
            for r in range(col + 1, n):
                factor = a[r][col] / a[col][col]
                a[r] = [x - factor * y for x, y in zip(a[r], a[col])]
        result = Fraction(sign)
        for i in range(n):
            result *= a[i][i]
        return result


    print("det [[1, 2], [3, 4]]:", det2([[1, 2], [3, 4]]))
    shape_check = [[2, 0], [0, 3]]
    print("stretching x by 2 and y by 3 scales areas by", det(shape_check))
    flip = [[0, 1], [1, 0]]
    print("swapping the axes has determinant", det(flip), "(a mirror image flips the sign)")
    rows = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
    print("determinant of", rows, "=", det(rows), "= det_cofactor:", det_cofactor(rows))
    print("so the three rows are dependent: row 3 = 2 * row 2 - row 1:", [2 * b - a for a, b in zip(rows[0], rows[1])] == rows[2])
  output: |
    det [[1, 2], [3, 4]]: -2
    stretching x by 2 and y by 3 scales areas by 6
    swapping the axes has determinant -1 (a mirror image flips the sign)
    determinant of [[1, 2, 3], [4, 5, 6], [7, 8, 9]] = 0 = det_cofactor: 0
    so the three rows are dependent: row 3 = 2 * row 2 - row 1: True
  lines:
  - line: 53
    note: Areas grow by the determinant.
  - line: 58
    note: A zero determinant means the rows depend on each other.
- title: Finding an inverse
  intro: Gauss-Jordan elimination with exact fractions. A matrix times its inverse is the identity, and singular matrices are refused.
  code: |
    def check_square(m):
        n = len(m)
        if n == 0 or any(len(row) != n for row in m):
            raise ValueError("a square, non-empty matrix is needed")
        return n


    from fractions import Fraction


    def det(m):
        """Determinant by elimination with exact fractions: multiply the diagonal, and flip the sign for each row swap."""
        n = check_square(m)
        a = [[Fraction(x) for x in row] for row in m]
        sign = 1
        for col in range(n):
            pivot = next((r for r in range(col, n) if a[r][col] != 0), None)
            if pivot is None:
                return Fraction(0)
            if pivot != col:
                a[col], a[pivot] = a[pivot], a[col]
                sign = -sign
            for r in range(col + 1, n):
                factor = a[r][col] / a[col][col]
                a[r] = [x - factor * y for x, y in zip(a[r], a[col])]
        result = Fraction(sign)
        for i in range(n):
            result *= a[i][i]
        return result


    def inverse(m):
        """The inverse of a square matrix as Fractions (Gauss-Jordan on [m | identity]). ValueError if it is singular."""
        n = check_square(m)
        a = [[Fraction(x) for x in row] + [Fraction(1 if i == j else 0) for j in range(n)] for i, row in enumerate(m)]
        for col in range(n):
            pivot = next((r for r in range(col, n) if a[r][col] != 0), None)
            if pivot is None:
                raise ValueError("the matrix is singular and has no inverse")
            a[col], a[pivot] = a[pivot], a[col]
            lead = a[col][col]
            a[col] = [x / lead for x in a[col]]
            for r in range(n):
                if r != col and a[r][col] != 0:
                    factor = a[r][col]
                    a[r] = [x - factor * y for x, y in zip(a[r], a[col])]
        return [row[n:] for row in a]


    m = [[2, 1], [5, 3]]
    inv = inverse(m)
    print("inverse:", [[str(x) for x in row] for row in inv])
    product = [[sum(p * q for p, q in zip(r, c)) for c in zip(*inv)] for r in m]
    print("m times its inverse:", [[int(x) for x in row] for row in product])
    for singular in ([[1, 2], [2, 4]], [[1, 1, 1], [1, 2, 3], [2, 3, 4]]):
        try:
            inverse(singular)
        except ValueError as e:
            print("refused:", e)
  output: |
    inverse: [['3', '-1'], ['-5', '2']]
    m times its inverse: [[1, 0], [0, 1]]
    refused: the matrix is singular and has no inverse
    refused: the matrix is singular and has no inverse
  lines:
  - line: 51
    note: 'Exact fractions: no rounding errors.'
  - line: 55
    note: No inverse exists when the determinant is 0.
- title: Two more ways to solve a system
  intro: The inverse and Cramer's rule give the same exact answer as elimination.
  code: |
    def check_square(m):
        n = len(m)
        if n == 0 or any(len(row) != n for row in m):
            raise ValueError("a square, non-empty matrix is needed")
        return n


    from fractions import Fraction


    def det(m):
        """Determinant by elimination with exact fractions: multiply the diagonal, and flip the sign for each row swap."""
        n = check_square(m)
        a = [[Fraction(x) for x in row] for row in m]
        sign = 1
        for col in range(n):
            pivot = next((r for r in range(col, n) if a[r][col] != 0), None)
            if pivot is None:
                return Fraction(0)
            if pivot != col:
                a[col], a[pivot] = a[pivot], a[col]
                sign = -sign
            for r in range(col + 1, n):
                factor = a[r][col] / a[col][col]
                a[r] = [x - factor * y for x, y in zip(a[r], a[col])]
        result = Fraction(sign)
        for i in range(n):
            result *= a[i][i]
        return result


    def inverse(m):
        """The inverse of a square matrix as Fractions (Gauss-Jordan on [m | identity]). ValueError if it is singular."""
        n = check_square(m)
        a = [[Fraction(x) for x in row] + [Fraction(1 if i == j else 0) for j in range(n)] for i, row in enumerate(m)]
        for col in range(n):
            pivot = next((r for r in range(col, n) if a[r][col] != 0), None)
            if pivot is None:
                raise ValueError("the matrix is singular and has no inverse")
            a[col], a[pivot] = a[pivot], a[col]
            lead = a[col][col]
            a[col] = [x / lead for x in a[col]]
            for r in range(n):
                if r != col and a[r][col] != 0:
                    factor = a[r][col]
                    a[r] = [x - factor * y for x, y in zip(a[r], a[col])]
        return [row[n:] for row in a]


    def mat_vec(m, v):
        return [sum(x * y for x, y in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def solve_with_inverse(a, b):
        return mat_vec(inverse(a), b)


    def cramer(a, b):
        """Solve a x = b with Cramer's rule: x_j = det(a with column j replaced by b) / det(a)."""
        d = det(a)
        if d == 0:
            raise ValueError("the matrix is singular")
        n = len(a)
        return [det([row[:j] + [b[i]] + row[j + 1:] for i, row in enumerate(a)]) / d for j in range(n)]


    a, b = [[2, 1, -1], [-3, -1, 2], [-2, 1, 2]], [8, -11, -3]
    print("inverse method:", [str(v) for v in solve_with_inverse(a, b)])
    print("Cramer's rule :", [str(v) for v in cramer(a, b)])
    print("det =", det(a), "(non-zero, so there is exactly one answer)")
  output: |
    inverse method: ['2', '3', '-1']
    Cramer's rule : ['2', '3', '-1']
    det = -1 (non-zero, so there is exactly one answer)
  lines:
  - line: 73
    note: Same answer as elimination in lesson 3.
  - line: 75
    note: A non-zero determinant guarantees exactly one solution.
- title: The Hill cipher
  intro: Encrypt pairs of letters with a key matrix, and decrypt with its inverse modulo 26. Keys whose determinant shares a factor with 26 are refused.
  code: |
    import math

    ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"


    def inverse_mod_2x2(key, modulus=26):
        """Inverse of a 2x2 integer matrix modulo `modulus`: (det^-1 mod m) * adjugate, entries reduced mod m.
        ValueError unless gcd(det, modulus) == 1."""
        (a, b), (c, d) = key
        det_value = (a * d - b * c) % modulus
        if math.gcd(det_value, modulus) != 1:
            raise ValueError("the key matrix is not invertible modulo " + str(modulus))
        inv = pow(det_value, -1, modulus)
        return [[(inv * d) % modulus, (-inv * b) % modulus], [(-inv * c) % modulus, (inv * a) % modulus]]


    def _blocks(text, key_size=2):
        letters = [ch for ch in text.upper() if ch in ALPHABET]
        while len(letters) % key_size:
            letters.append("X")
        return [[ALPHABET.index(ch) for ch in letters[i:i + key_size]] for i in range(0, len(letters), key_size)]


    def hill_apply(key, text, modulus=26):
        out = []
        for block in _blocks(text):
            for row in key:
                out.append(ALPHABET[sum(k * v for k, v in zip(row, block)) % modulus])
        return "".join(out)


    def hill_encrypt(key, text):
        inverse_mod_2x2(key)          # refuse keys that could never be decrypted
        return hill_apply(key, text)


    def hill_decrypt(key, ciphertext):
        return hill_apply(inverse_mod_2x2(key), ciphertext)


    key = [[3, 3], [2, 5]]
    secret = hill_encrypt(key, "Meet me at noon")
    print(secret)
    print("decrypt:", hill_decrypt(key, secret))
    print("inverse key:", inverse_mod_2x2(key))
    for bad in ([[2, 4], [1, 2]], [[2, 0], [0, 1]]):
        try:
            hill_encrypt(bad, "HI")
        except ValueError as e:
            print("refused:", e)
  output: |
    WSRZWSFRDSDP
    decrypt: MEETMEATNOON
    inverse key: [[15, 17], [20, 9]]
    refused: the key matrix is not invertible modulo 26
    refused: the key matrix is not invertible modulo 26
  lines:
  - line: 42
    note: Pairs of letters are multiplied by the key matrix modulo 26.
  - line: 45
    note: The inverse key modulo 26 decrypts.
