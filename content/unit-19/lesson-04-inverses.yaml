  solution: |
    import math

    ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"


    def inverse_mod_2x2(key, modulus=26):
        """Inverse of a 2x2 integer matrix modulo `modulus`: (det^-1 mod m) * adjugate, entries reduced mod m.
        ValueError unless gcd(det, modulus) == 1."""
        (a, b), (c, d) = key
        det_value = (a * d - b * c) % modulus
        if math.gcd(det_value, modulus) != 1:
            raise ValueError("the key matrix is not invertible modulo " + str(modulus))
        inv = pow(det_value, -1, modulus)
        return [[(inv * d) % modulus, (-inv * b) % modulus], [(-inv * c) % modulus, (inv * a) % modulus]]


    def _blocks(text, key_size=2):
        letters = [ch for ch in text.upper() if ch in ALPHABET]
        while len(letters) % key_size:
            letters.append("X")
        return [[ALPHABET.index(ch) for ch in letters[i:i + key_size]] for i in range(0, len(letters), key_size)]


    def hill_apply(key, text, modulus=26):
        out = []
        for block in _blocks(text):
            for row in key:
                out.append(ALPHABET[sum(k * v for k, v in zip(row, block)) % modulus])
        return "".join(out)


    def hill_encrypt(key, text):
        inverse_mod_2x2(key)          # refuse keys that could never be decrypted
        return hill_apply(key, text)


    def hill_decrypt(key, ciphertext):
        return hill_apply(inverse_mod_2x2(key), ciphertext)
  explanation: 'Linear algebra is also the algebra of ciphers: invertibility decides whether a message can be decrypted at all.'
commonMistakes:
- title: Computing the determinant by cofactors for large matrices
  explanation: It needs n! steps. Use elimination.
- title: Forgetting that row swaps change the sign
  explanation: Every swap multiplies the determinant by -1.
- title: Assuming det(A + B) = det(A) + det(B)
  explanation: 'It is false. Only products behave: det(A B) = det(A) det(B).'
- title: Trying to invert a singular matrix
  explanation: A determinant of 0 means no inverse exists.
- title: Computing an inverse just to solve one system
  explanation: Elimination is cheaper and more accurate.
- title: Using a Hill key whose determinant shares a factor with 26
  explanation: Then no inverse modulo 26 exists and decryption is impossible.
summary:
- The determinant is the area (or volume) scale factor of a matrix; its sign records a flip.
- A square matrix is invertible exactly when its determinant is not zero.
- Elimination computes determinants and inverses in about n cubed steps, cofactors need n factorial.
- Cramer's rule and the inverse solve systems on paper, elimination solves them in practice.
- Matrix inverses modulo 26 power the Hill cipher; invertibility decides decryptability.
