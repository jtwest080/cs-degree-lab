  - Row `i` of the reduced matrix belongs to the pivot column `pivots[i]`.
  solution: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, list of pivot columns)."""
        a = [[Fraction(x) for x in row] for row in m]
        rows, cols = len(a), len(a[0]) if a else 0
        pivots = []
        r = 0
        for c in range(cols):
            if r >= rows:
                break
            p = next((i for i in range(r, rows) if a[i][c] != 0), None)
            if p is None:
                continue
            a[r], a[p] = a[p], a[r]
            lead = a[r][c]
            a[r] = [x / lead for x in a[r]]
            for i in range(rows):
                if i != r and a[i][c] != 0:
                    f = a[i][c]
                    a[i] = [x - f * y for x, y in zip(a[i], a[r])]
            pivots.append(c)
            r += 1
        return a, pivots


    def null_space(m):
        """A basis (list of vectors) for every x with m x = 0, built from the free columns of the rref."""
        reduced, pivots = rref(m)
        cols = len(m[0])
        free = [c for c in range(cols) if c not in pivots]
        basis = []
        for f in free:
            x = [Fraction(0)] * cols
            x[f] = Fraction(1)
            for row, p in enumerate(pivots):
                x[p] = -reduced[row][f]
            basis.append(x)
        return basis
  explanation: Each free column contributes one direction that gets flattened to zero.
