    code: |
      import random
      rng = random.Random(3)
      for _ in range(20):
          r, c = rng.randint(1, 4), rng.randint(1, 4)
          m = [[rng.randint(-2, 2) for _ in range(c)] for _ in range(r)]
          t = [list(x) for x in zip(*m)]
          assert rank(m) == rank(t) <= min(r, c)
  - name: input unchanged
