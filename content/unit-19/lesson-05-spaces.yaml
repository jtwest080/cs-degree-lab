  tests:
  - name: null space
    code: |
      from fractions import Fraction
      def mv(m, x): return [sum(a * b for a, b in zip(r, x)) for r in m]
      m = [[1, 2, 3], [2, 4, 6]]
      ns = null_space(m)
      assert len(ns) == 2
      assert all(mv(m, x) == [0, 0] for x in ns)
      assert null_space([[1, 0], [0, 1]]) == []
      m2 = [[1, 2, 0, 1], [0, 0, 1, 2]]
      ns2 = null_space(m2)
      assert ns2 == [[-2, 1, 0, 0], [-1, 0, -2, 1]]
      assert all(mv(m2, x) == [0, 0] for x in ns2)
  - name: rank-nullity theorem
    code: |
      import random
      rng = random.Random(6)
      def mv(m, x): return [sum(a * b for a, b in zip(r, x)) for r in m]
      for _ in range(20):
          r, c = rng.randint(1, 4), rng.randint(1, 5)
          m = [[rng.randint(-2, 2) for _ in range(c)] for _ in range(r)]
