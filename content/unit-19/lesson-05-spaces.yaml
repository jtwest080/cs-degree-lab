id: u19-spaces
title: Span, Independence, Basis and Rank
minutes: 80
objective: Understand which vectors can be reached by combining others (span), when vectors carry new information (independence), the smallest complete set of directions (a basis), and how rank and the null space measure what a matrix keeps and what it destroys.
outcomes:
- Explain span and linear independence in plain words
- Compute rank with row reduction and read pivot columns
- Pick a basis for a set of vectors
- Find a basis for the null space and state the rank-nullity theorem
- Write a vector in coordinates relative to a basis
sections:
- heading: Combinations and span
  body: |-
    A **linear combination** of vectors is what you get by scaling them and adding: `3*(1, 0) + 2*(0, 1) = (3, 2)`. The **span** of some vectors is the set of every vector you can reach this way. One vector spans a line, two vectors that point in different directions span a flat plane, and three directions that do not lie in a plane span all of 3D space.

    The question "is `b` in the span of the columns of `A`?" is exactly the question "does `A x = b` have a solution?" from lesson 3. Linear algebra keeps reusing the same few ideas in different clothes.
- heading: Independence and basis
  body: |-
    Vectors are **linearly independent** if none of them is a combination of the others, so each adds a genuinely new direction. `(1, 0), (0, 1), (1, 1)` are **dependent** because the third is the sum of the first two: it adds nothing. A **basis** of a space is an independent set of vectors that spans it: enough to reach everything, with nothing wasted. Every basis of the same space has the same number of vectors, called the **dimension**. The plane has dimension 2, ordinary space 3.

    A basis gives each vector **coordinates**: the unique numbers `c` such that `c0*b0 + c1*b1 + ... = v`. The usual `(1,0), (0,1)` is just one basis; `(1, 1), (1, -1)` is another, and the same point has different coordinates in each. Choosing a good basis is one of the main tricks of the rest of this unit (eigenvectors, least squares, SVD).
- heading: Rank and the null space
  body: |-
    The **rank** of a matrix is the number of independent rows, which always equals the number of independent columns (a surprising and useful fact). Compute it by row reduction: it is the number of **pivots**. Columns that contain a pivot are the **pivot columns**; they form a basis for what the matrix can output.

    The **null space** of `A` is every `x` with `A x = 0`: the directions the matrix flattens to nothing. Find it by solving with the reduced matrix: each **free column** (one without a pivot) gives one basis vector. The **rank-nullity theorem** says `rank + dimension of null space = number of columns`. What the matrix keeps plus what it destroys equals what you started with. A matrix is invertible exactly when its rank is full and its null space is just the zero vector.
examples:
- title: Rank, independence and span
  intro: Row reduce, then ask whether vectors are independent or reachable.
  code: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, list of pivot columns)."""
        a = [[Fraction(x) for x in row] for row in m]
        rows, cols = len(a), len(a[0]) if a else 0
        pivots = []
        r = 0
        for c in range(cols):
            if r >= rows:
                break
            p = next((i for i in range(r, rows) if a[i][c] != 0), None)
            if p is None:
                continue
            a[r], a[p] = a[p], a[r]
            lead = a[r][c]
            a[r] = [x / lead for x in a[r]]
            for i in range(rows):
                if i != r and a[i][c] != 0:
                    f = a[i][c]
                    a[i] = [x - f * y for x, y in zip(a[i], a[r])]
            pivots.append(c)
            r += 1
        return a, pivots


    def rank(m):
        """The number of independent rows (equal to the number of independent columns)."""
        return len(rref(m)[1])
    def is_independent(vectors):
        """True when no vector is a combination of the others."""
        return rank(vectors) == len(vectors)


    def in_span(vectors, target):
        """True when target is a combination of vectors: adding it as a row does not raise the rank."""
        return rank(vectors + [target]) == rank(vectors)


    print(rref([[1, 2, 3], [2, 4, 7]]))
    a = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
    print("rank of", a, "=", rank(a))
    print("independent:", is_independent([[1, 0, 0], [0, 1, 0], [0, 0, 1]]), is_independent(a))
    print("(1, 2, 3) + (4, 5, 6) in span of row 1 and row 2?", in_span(a[:2], [5, 7, 9]))
    print("is (0, 0, 1) in that span?", in_span(a[:2], [0, 0, 1]))
  output: |
    ([[Fraction(1, 1), Fraction(2, 1), Fraction(0, 1)], [Fraction(0, 1), Fraction(0, 1), Fraction(1, 1)]], [0, 2])
    rank of [[1, 2, 3], [4, 5, 6], [7, 8, 9]] = 2
    independent: True False
    (1, 2, 3) + (4, 5, 6) in span of row 1 and row 2? True
    is (0, 0, 1) in that span? False
  lines:
  - line: 42
    note: The rows depend on each other.
  - line: 46
    note: 'Not reachable: it leaves the plane.'
- title: Pivots, null space and rank-nullity
  intro: Free columns give null space vectors, and rank plus nullity is the number of columns.
  code: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, list of pivot columns)."""
        a = [[Fraction(x) for x in row] for row in m]
        rows, cols = len(a), len(a[0]) if a else 0
        pivots = []
        r = 0
        for c in range(cols):
            if r >= rows:
                break
            p = next((i for i in range(r, rows) if a[i][c] != 0), None)
            if p is None:
                continue
            a[r], a[p] = a[p], a[r]
            lead = a[r][c]
            a[r] = [x / lead for x in a[r]]
            for i in range(rows):
                if i != r and a[i][c] != 0:
                    f = a[i][c]
                    a[i] = [x - f * y for x, y in zip(a[i], a[r])]
            pivots.append(c)
            r += 1
        return a, pivots


    def rank(m):
        """The number of independent rows (equal to the number of independent columns)."""
        return len(rref(m)[1])


    def is_independent(vectors):
        """True when no vector is a combination of the others: the matrix with these vectors as rows has full rank."""
        return rank(vectors) == len(vectors)


    def in_span(vectors, target):
        """True when target is a combination of vectors: adding it as a row does not raise the rank."""
        return rank(vectors + [target]) == rank(vectors)


    def pivot_columns(m):
        return rref(m)[1]


    def basis_of_span(vectors):
        """An independent subset of vectors with the same span: keep a vector only if it is not already in the span of those kept."""
        kept = []
        for v in vectors:
            if any(v) and (not kept or not in_span(kept, v)):
                kept.append(v)
        return kept


    def null_space(m):
        """A basis (list of vectors) for every x with m x = 0, built from the free columns of the rref."""
        reduced, pivots = rref(m)
        cols = len(m[0])
        free = [c for c in range(cols) if c not in pivots]
        basis = []
        for f in free:
            x = [Fraction(0)] * cols
            x[f] = Fraction(1)
            for row, p in enumerate(pivots):
                x[p] = -reduced[row][f]
            basis.append(x)
        return basis


    m = [[1, 2, 0, 1], [0, 0, 1, 2]]
    print("pivot columns:", pivot_columns(m))
    for x in null_space(m):
        print("null vector:", [str(v) for v in x], "->", [sum(a * b for a, b in zip(r, x)) for r in m])
    print("rank + nullity =", rank(m), "+", len(null_space(m)), "=", rank(m) + len(null_space(m)), "columns")
    print("basis:", basis_of_span([[1, 2, 3], [2, 4, 6], [0, 1, 1], [1, 3, 4]]))
  output: |
    pivot columns: [0, 2]
    null vector: ['-2', '1', '0', '0'] -> [Fraction(0, 1), Fraction(0, 1)]
    null vector: ['-1', '0', '-2', '1'] -> [Fraction(0, 1), Fraction(0, 1)]
    rank + nullity = 2 + 2 = 4 columns
    basis: [[1, 2, 3], [0, 1, 1]]
  lines:
  - line: 73
    note: Each free column gives one flattened direction.
  - line: 75
    note: 'Rank-nullity: 2 + 2 = 4 columns.'
- title: Coordinates in another basis
  intro: The same vector described with a different set of directions.
  code: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, list of pivot columns)."""
        a = [[Fraction(x) for x in row] for row in m]
        rows, cols = len(a), len(a[0]) if a else 0
        pivots = []
        r = 0
        for c in range(cols):
            if r >= rows:
                break
            p = next((i for i in range(r, rows) if a[i][c] != 0), None)
            if p is None:
                continue
            a[r], a[p] = a[p], a[r]
            lead = a[r][c]
            a[r] = [x / lead for x in a[r]]
            for i in range(rows):
                if i != r and a[i][c] != 0:
                    f = a[i][c]
                    a[i] = [x - f * y for x, y in zip(a[i], a[r])]
            pivots.append(c)
            r += 1
        return a, pivots


    def coordinates(basis, v):
        """The numbers c with c0*basis[0] + c1*basis[1] + ... = v, or None if v is not in the span.
        basis must be independent."""
        n = len(basis)
        # columns are the basis vectors, so build the augmented matrix [basis^T | v]
        aug = [[Fraction(basis[j][i]) for j in range(n)] + [Fraction(v[i])] for i in range(len(v))]
        reduced, pivots = rref(aug)
        if n in pivots:
            return None
        return [reduced[j][n] for j in range(n)]


    basis = [[1, 1], [1, -1]]
    print("coordinates of (5, 1):", [str(v) for v in coordinates(basis, [5, 1])])
    print("coordinates of (1, 0):", [str(v) for v in coordinates(basis, [1, 0])])
    print("flat basis:", coordinates([[1, 0, 0], [0, 1, 0]], [2, 3, 1]))
  output: |
    coordinates of (5, 1): ['3', '2']
    coordinates of (1, 0): ['1/2', '1/2']
    flat basis: None
  lines:
  - line: 40
    note: A different pair of directions for the same plane.
  - line: 43
    note: Not in the span, so no coordinates exist.
