  solution: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, list of pivot columns)."""
        a = [[Fraction(x) for x in row] for row in m]
        rows, cols = len(a), len(a[0]) if a else 0
        pivots = []
        r = 0
        for c in range(cols):
            if r >= rows:
                break
            p = next((i for i in range(r, rows) if a[i][c] != 0), None)
            if p is None:
                continue
            a[r], a[p] = a[p], a[r]
            lead = a[r][c]
            a[r] = [x / lead for x in a[r]]
            for i in range(rows):
                if i != r and a[i][c] != 0:
                    f = a[i][c]
                    a[i] = [x - f * y for x, y in zip(a[i], a[r])]
            pivots.append(c)
            r += 1
        return a, pivots


    def coordinates(basis, v):
        """The numbers c with c0*basis[0] + c1*basis[1] + ... = v, or None if v is not in the span.
        basis must be independent."""
        n = len(basis)
        # columns are the basis vectors, so build the augmented matrix [basis^T | v]
        aug = [[Fraction(basis[j][i]) for j in range(n)] + [Fraction(v[i])] for i in range(len(v))]
        reduced, pivots = rref(aug)
        if n in pivots:
            return None
        return [reduced[j][n] for j in range(n)]
  explanation: Finding coordinates is solving a linear system, with the basis as the matrix.
commonMistakes:
- title: Thinking more vectors means more span
  explanation: Dependent vectors add nothing; only independent ones raise the dimension.
- title: Mixing up rows and columns for rank
  explanation: Row rank and column rank are always equal.
- title: Forgetting the zero vector
  explanation: The zero vector is always in a span and never independent on its own.
- title: Reading the null space from the original matrix
  explanation: 'Use the reduced matrix: its pivots and free columns tell you the basis.'
summary:
- Span is everything you can reach with combinations.
- Independent vectors each add a new direction.
- A basis is independent and spans; its size is the dimension.
- Rank counts pivots; the null space counts what is flattened.
- Rank plus nullity equals the number of columns.
