- id: null-space
  title: The null space
  difficulty: 5
  prompt: 'The starter has `rref`. Write `null_space(m)`: find the pivot columns and free columns, and for each free column `f` build a vector with a 1 at position `f`, zeros at the other free positions, and `-reduced[row][f]` at each pivot position. Return a list of `Fraction` vectors (empty if there are no free columns).'
  starter: |
    from fractions import Fraction


    def rref(m):
        """Reduced row echelon form with exact fractions. Returns (matrix, list of pivot columns)."""
        a = [[Fraction(x) for x in row] for row in m]
