id: u19-transforms
title: Linear Transformations
minutes: 75
objective: 'See a matrix as a machine that moves every point in the plane or in space: stretch, rotate, shear, reflect, squash. Learn what makes a transformation linear, how to get its matrix from where it sends the basis vectors, and why composing transformations means multiplying matrices in a particular order.'
outcomes:
- Say what makes a function a linear transformation
- Build a matrix from what a transformation does to the basis vectors
- Describe rotations, shears, reflections, projections and scalings as matrices
- Compose transformations and explain why order matters
- Connect the determinant to how areas change
sections:
- heading: Functions that keep the grid straight
  body: |-
    A **transformation** is a function that takes a vector and returns a vector, like `f(x, y) = (2x, 3y)`. It is **linear** if it respects the two operations of linear algebra: `f(a + b) = f(a) + f(b)` and `f(c a) = c f(a)`. Picture the grid lines on graph paper: a linear transformation keeps them straight, parallel and evenly spaced, and keeps the origin fixed. Stretching, rotating, shearing (slanting like a deck of cards) and reflecting are linear. **Shifting** by `(1, 0)` is not (it moves the origin), and neither are squaring or absolute value (they bend lines).

    The deep fact is that **every linear transformation is a matrix multiplication**. To find the matrix, ask where the basis vectors go. If `f(1, 0) = (a, c)` and `f(0, 1) = (b, d)`, the matrix is `[[a, b], [c, d]]`, with those results as its **columns**. Why is that enough? Every vector is `x*(1, 0) + y*(0, 1)`, and linearity says `f` of that is `x*f(1, 0) + y*f(0, 1)`. Knowing two answers gives you all of them.
- heading: A zoo of 2x2 matrices
  body: |-
    A **scaling** `[[k, 0], [0, k]]` makes everything k times bigger. A **reflection** `[[1, 0], [0, -1]]` flips y, like a mirror along the x-axis. **Swapping** x and y `[[0, 1], [1, 0]]` mirrors across the diagonal. A **shear** `[[1, k], [0, 1]]` slides each point sideways in proportion to its height. A **projection** `[[1, 0], [0, 0]]` throws away y: every point lands on the x-axis, and information is lost, so it has no inverse (rank 1, determinant 0). A **rotation** by 90 degrees counter-clockwise is `[[0, -1], [1, 0]]`: the vector (1, 0) goes to (0, 1) and (0, 1) goes to (-1, 0), which are exactly its two columns.

    Computer graphics works this way. A 2D game, a photo editor and a 3D engine all store shapes as lists of corner points and move them by multiplying every corner by a matrix.
- heading: Composition and area
  body: |-
    Do a shear, then a rotation: multiply the points by the shear matrix, then by the rotation matrix. That equals multiplying once by the product `R S` (rotation on the **left**, because it is applied last). So **composing transformations is matrix multiplication, and order matters**: slide then turn is generally not turn then slide, which matches the fact that `A B` is usually not `B A` (lesson 2).

    Finally the determinant gets its meaning: the unit square has area 1 and its image under a matrix is a parallelogram of area `|det|`. This holds for **any** shape, not just the square, because every region is built from tiny squares that all scale by the same factor. A determinant of 0 means everything collapses to a line, so the area is zero and no inverse can bring it back.
examples:
- title: Testing for linearity and finding the matrix
  intro: Scaling passes, shifting fails, and the matrix comes from the basis vectors.
  code: |
    import random


    def is_linear(f, dim, trials=25, seed=1):
        """Test (not a proof) that f(a + b) == f(a) + f(b), f(c * a) == c * f(a) and f(0) == 0 for random integer vectors."""
        rng = random.Random(seed)
        zero = [0] * dim
        if list(f(zero)) != [0] * len(f(zero)):
            return False
        for _ in range(trials):
            a = [rng.randint(-9, 9) for _ in range(dim)]
            b = [rng.randint(-9, 9) for _ in range(dim)]
            c = rng.randint(-5, 5)
            fa, fb = f(a), f(b)
            if list(f([x + y for x, y in zip(a, b)])) != [x + y for x, y in zip(fa, fb)]:
                return False
            if list(f([c * x for x in a])) != [c * x for x in fa]:
                return False
        return True


    def matrix_of(f, dim):
        """The matrix whose columns are f applied to the standard basis vectors."""
        columns = []
        for i in range(dim):
            e = [1 if j == i else 0 for j in range(dim)]
            columns.append(list(f(e)))
        return [list(row) for row in zip(*columns)]


    def mat_vec(m, v):
        return [sum(a * b for a, b in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    double = lambda v: [2 * v[0], 3 * v[1]]
    shifted = lambda v: [v[0] + 1, v[1]]
    print("scaling is linear:", is_linear(double, 2), "| shifting is linear:", is_linear(shifted, 2))
    print("matrix of scaling:", matrix_of(double, 2))
    swap = lambda v: [v[1], v[0]]
    print("matrix of swap:", matrix_of(swap, 2))
    print("check:", mat_vec(matrix_of(swap, 2), [3, 8]), "==", swap([3, 8]))
  output: |
    scaling is linear: True | shifting is linear: False
    matrix of scaling: [[2, 0], [0, 3]]
    matrix of swap: [[0, 1], [1, 0]]
    check: [8, 3] == [8, 3]
  lines:
  - line: 43
    note: Columns come from the basis vectors.
  - line: 46
    note: The matrix gives the same answer as the function.
- title: The transformation zoo and composition
  intro: Five standard matrices acting on one point, then two compositions in both orders.
  code: |
    def mat_vec(m, v):
        return [sum(a * b for a, b in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def make_matrix(kind, k=0):
        """2x2 matrices for common transformations: 'shear_x' (x += k*y), 'reflect_x' (flip y), 'reflect_diagonal' (swap x and y),
        'project_x' (drop y), 'scale' (multiply everything by k), 'rotate90' (quarter turn counter-clockwise)."""
        table = {
            "shear_x": [[1, k], [0, 1]],
            "reflect_x": [[1, 0], [0, -1]],
            "reflect_diagonal": [[0, 1], [1, 0]],
            "project_x": [[1, 0], [0, 0]],
            "scale": [[k, 0], [0, k]],
            "rotate90": [[0, -1], [1, 0]],
        }
        if kind not in table:
            raise ValueError("unknown transformation: " + str(kind))
        return table[kind]


    def compose(matrices):
        """One matrix that does matrices[0] first, then matrices[1], and so on. (The last one applied is on the LEFT.)"""
        if not matrices:
            raise ValueError("nothing to compose")
        result = matrices[0]
        for m in matrices[1:]:
            result = mat_mul(m, result)
        return result


    def apply_all(m, points):
        return [mat_vec(m, p) for p in points]


    point = [2, 1]
    for kind in ("shear_x", "reflect_x", "reflect_diagonal", "project_x", "rotate90"):
        print(kind, "moves (2, 1) to", mat_vec(make_matrix(kind, 1), point))
    shear, turn = make_matrix("shear_x", 1), make_matrix("rotate90")
    print("shear then turn:", mat_vec(compose([shear, turn]), point))
    print("turn then shear:", mat_vec(compose([turn, shear]), point))
  output: |
    shear_x moves (2, 1) to [3, 1]
    reflect_x moves (2, 1) to [2, -1]
    reflect_diagonal moves (2, 1) to [1, 2]
    project_x moves (2, 1) to [2, 0]
    rotate90 moves (2, 1) to [-1, 2]
    shear then turn: [-1, 3]
    turn then shear: [1, 2]
  lines:
  - line: 41
    note: Five familiar transformations as matrices.
  - line: 45
    note: The order changes the answer.
- title: Area and the determinant
  intro: Transform a four-cornered shape and measure its area before and after.
  code: |
    def mat_vec(m, v):
        return [sum(a * b for a, b in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def apply_all(m, points):
        return [mat_vec(m, p) for p in points]


    def polygon_area(points):
        """Shoelace formula: the area of a polygon given its corners in order."""
        total = 0
        for i, (x1, y1) in enumerate(points):
            x2, y2 = points[(i + 1) % len(points)]
            total += x1 * y2 - x2 * y1
        return abs(total) / 2


    def det2(m):
        return m[0][0] * m[1][1] - m[0][1] * m[1][0]


    def area_after(points, m):
        """Area of the polygon after it is moved by the 2x2 matrix m (compute it from the transformed corners)."""
        return polygon_area(apply_all(m, points))


    def area_factor(points, m):
        """How much m multiplies this polygon's area. Compare with abs(det2(m))."""
        return area_after(points, m) / polygon_area(points)


    shape = [[0, 0], [3, 0], [4, 2], [1, 3]]
    print("original area:", polygon_area(shape))
    for name, m in [("double x, triple y", [[2, 0], [0, 3]]), ("shear", [[1, 2], [0, 1]]), ("flip", [[0, 1], [1, 0]]), ("squash", [[1, 2], [2, 4]])]:
        print(name + ": area factor", area_factor(shape, m), "| |det| =", abs(det2(m)))
  output: |
    original area: 8.0
    double x, triple y: area factor 6.0 | |det| = 6
    shear: area factor 1.0 | |det| = 1
    flip: area factor 1.0 | |det| = 1
    squash: area factor 0.0 | |det| = 0
  lines:
  - line: 39
    note: The area factor equals the absolute determinant.
  - line: 39
    note: A determinant of 0 flattens everything.
