exercises:
- id: is-linear
  title: Test a function for linearity
  difficulty: 3
  prompt: Write `is_linear(f, dim, trials=25, seed=1)`. Use `random.Random(seed)` to make integer vectors of length `dim` (entries from -9 to 9) and a multiplier from -5 to 5, and check `f(0) == 0`, `f(a + b) == f(a) + f(b)` and `f(c * a) == c * f(a)`. Return `False` at the first failure, otherwise `True`. (A test cannot prove linearity, but it can disprove it.) `f` returns a list.
  starter: |
    import random


    def is_linear(f, dim, trials=25, seed=1):
        pass
  tests:
  - name: linear maps
    code: |
      assert is_linear(lambda v: [2 * v[0], 3 * v[1]], 2) is True
      assert is_linear(lambda v: [v[0] + v[1], v[0] - v[1]], 2) is True
      assert is_linear(lambda v: [v[0], v[1], v[0] + v[1]], 2) is True
      assert is_linear(lambda v: [sum(v)], 3) is True
  - name: not linear
    code: |
      assert is_linear(lambda v: [v[0] + 1, v[1]], 2) is False
      assert is_linear(lambda v: [v[0] * v[1]], 2) is False
      assert is_linear(lambda v: [v[0] ** 2, v[1]], 2) is False
      assert is_linear(lambda v: [abs(v[0]), v[1]], 2) is False
  hints:
  - 'Compare as lists: `list(f(x)) == [...]`.'
  - The zero vector is `[0] * dim`.
  solution: |
    import random


    def is_linear(f, dim, trials=25, seed=1):
        """Test (not a proof) that f(a + b) == f(a) + f(b), f(c * a) == c * f(a) and f(0) == 0 for random integer vectors."""
        rng = random.Random(seed)
        zero = [0] * dim
        if list(f(zero)) != [0] * len(f(zero)):
            return False
        for _ in range(trials):
            a = [rng.randint(-9, 9) for _ in range(dim)]
            b = [rng.randint(-9, 9) for _ in range(dim)]
            c = rng.randint(-5, 5)
            fa, fb = f(a), f(b)
            if list(f([x + y for x, y in zip(a, b)])) != [x + y for x, y in zip(fa, fb)]:
                return False
            if list(f([c * x for x in a])) != [c * x for x in fa]:
                return False
        return True
  explanation: One counterexample is enough to prove a function is not linear.
- id: matrix-of
  title: The matrix of a transformation
  difficulty: 3
  prompt: 'Write `matrix_of(f, dim)`: apply `f` to each standard basis vector (a 1 in one place, zeros elsewhere) and use the results as the **columns** of the matrix. Return a list of rows.'
  starter: |
    def matrix_of(f, dim):
        pass
  tests:
  - name: matrix of a map
    code: |
      assert matrix_of(lambda v: [2 * v[0], 3 * v[1]], 2) == [[2, 0], [0, 3]]
      assert matrix_of(lambda v: [v[1], v[0]], 2) == [[0, 1], [1, 0]]
      assert matrix_of(lambda v: [v[0] + v[1], v[0] - v[1]], 2) == [[1, 1], [1, -1]]
      assert matrix_of(lambda v: [v[0], v[1], v[0] + v[1]], 2) == [[1, 0], [0, 1], [1, 1]]
      assert matrix_of(lambda v: [sum(v)], 3) == [[1, 1, 1]]
  - name: the matrix reproduces the function
    code: |
      f = lambda v: [3 * v[0] - v[1] + 2 * v[2], v[0] + 4 * v[2]]
      m = matrix_of(f, 3)
      for v in ([1, 2, 3], [-4, 0, 5], [7, 7, 7]):
          assert [sum(a * b for a, b in zip(r, v)) for r in m] == f(v)
  hints:
  - '`zip(*columns)` turns a list of columns into rows.'
  solution: |
    def matrix_of(f, dim):
        """The matrix whose columns are f applied to the standard basis vectors."""
        columns = []
        for i in range(dim):
            e = [1 if j == i else 0 for j in range(dim)]
            columns.append(list(f(e)))
        return [list(row) for row in zip(*columns)]
  explanation: Where the basis vectors go decides everything.
- id: zoo
  title: A zoo of matrices
  difficulty: 3
  prompt: 'Write `make_matrix(kind, k=0)` returning these 2x2 matrices: `''shear_x''` `[[1, k], [0, 1]]`, `''reflect_x''` `[[1, 0], [0, -1]]`, `''reflect_diagonal''` `[[0, 1], [1, 0]]`, `''project_x''` `[[1, 0], [0, 0]]`, `''scale''` `[[k, 0], [0, k]]` and `''rotate90''` `[[0, -1], [1, 0]]`. Raise `ValueError` for any other name.'
  starter: |
    def make_matrix(kind, k=0):
        pass
  tests:
  - name: matrices
    code: |
      assert make_matrix("shear_x", 2) == [[1, 2], [0, 1]]
      assert make_matrix("reflect_x") == [[1, 0], [0, -1]]
      assert make_matrix("reflect_diagonal") == [[0, 1], [1, 0]]
      assert make_matrix("project_x") == [[1, 0], [0, 0]]
      assert make_matrix("scale", 3) == [[3, 0], [0, 3]]
      assert make_matrix("rotate90") == [[0, -1], [1, 0]]
  - name: unknown
    code: |
      try:
          make_matrix("twist")
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: they do what they say
    code: |
      def go(m, p): return [sum(a * b for a, b in zip(r, p)) for r in m]
      assert go(make_matrix("shear_x", 2), [1, 1]) == [3, 1]
      assert go(make_matrix("reflect_x"), [2, 5]) == [2, -5]
      assert go(make_matrix("reflect_diagonal"), [2, 5]) == [5, 2]
      assert go(make_matrix("project_x"), [2, 5]) == [2, 0]
      assert go(make_matrix("rotate90"), [1, 0]) == [0, 1] and go(make_matrix("rotate90"), [0, 1]) == [-1, 0]
  hints:
  - A dictionary from names to matrices is the tidy way.
  solution: |
    def make_matrix(kind, k=0):
        """2x2 matrices for common transformations: 'shear_x' (x += k*y), 'reflect_x' (flip y), 'reflect_diagonal' (swap x and y),
        'project_x' (drop y), 'scale' (multiply everything by k), 'rotate90' (quarter turn counter-clockwise)."""
        table = {
            "shear_x": [[1, k], [0, 1]],
            "reflect_x": [[1, 0], [0, -1]],
            "reflect_diagonal": [[0, 1], [1, 0]],
            "project_x": [[1, 0], [0, 0]],
            "scale": [[k, 0], [0, k]],
            "rotate90": [[0, -1], [1, 0]],
        }
        if kind not in table:
            raise ValueError("unknown transformation: " + str(kind))
        return table[kind]
  explanation: Each of these is a picture you can see in your head.
- id: compose
  title: Composition
  difficulty: 4
  prompt: 'The starter has `mat_vec` and `mat_mul`. Write `compose(matrices)`: one matrix that applies `matrices[0]` first, then `matrices[1]`, and so on (so each later matrix multiplies on the **left**), raising `ValueError` for an empty list, and `apply_all(m, points)` that transforms each point.'
  starter: |
    def mat_vec(m, v):
        return [sum(a * b for a, b in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def compose(matrices):
        pass


    def apply_all(m, points):
        pass
  tests:
  - name: order matters
    code: |
      a = [[1, 1], [0, 1]]
      b = [[0, -1], [1, 0]]
      assert compose([a, b]) == mat_mul(b, a) == [[0, -1], [1, 1]]
      assert compose([b, a]) == mat_mul(a, b) == [[1, -1], [1, 0]]
      assert compose([a, b]) != compose([b, a])
      assert compose([a]) == a
  - name: four quarter turns make nothing
    code: |
      r = [[0, -1], [1, 0]]
      assert compose([r, r, r, r]) == [[1, 0], [0, 1]]
      assert compose([r, r]) == [[-1, 0], [0, -1]]
  - name: apply
    code: |
      sq = [[0, 0], [1, 0], [1, 1], [0, 1]]
      assert apply_all([[2, 0], [0, 2]], sq) == [[0, 0], [2, 0], [2, 2], [0, 2]]
      shear = [[1, 1], [0, 1]]
      rot = [[0, -1], [1, 0]]
      step = apply_all(rot, apply_all(shear, sq))
      assert step == apply_all(compose([shear, rot]), sq)
      try:
          compose([])
          raise AssertionError("accepted")
      except ValueError:
          pass
  hints:
  - '`result = mat_mul(m, result)` puts the new matrix on the left.'
  solution: |
    def mat_vec(m, v):
        return [sum(a * b for a, b in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def compose(matrices):
        """One matrix that does matrices[0] first, then matrices[1], and so on. (The last one applied is on the LEFT.)"""
        if not matrices:
            raise ValueError("nothing to compose")
        result = matrices[0]
        for m in matrices[1:]:
            result = mat_mul(m, result)
        return result


    def apply_all(m, points):
        return [mat_vec(m, p) for p in points]
  explanation: The last transformation applied is the leftmost matrix.
- id: area
  title: 'Capstone: areas and determinants'
  difficulty: 5
  prompt: The starter has `mat_vec`, `apply_all` and `det2`. Write `polygon_area(points)` with the shoelace formula (half the absolute value of the sum of `x1*y2 - x2*y1` over consecutive corners, wrapping around), `area_after(points, m)` (the area of the transformed corners) and `area_factor(points, m)` (the new area divided by the old). The factor should equal `abs(det2(m))`.
  starter: |
    def mat_vec(m, v):
        return [sum(a * b for a, b in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def apply_all(m, points):
        return [mat_vec(m, p) for p in points]


    def det2(m):
        return m[0][0] * m[1][1] - m[0][1] * m[1][0]


    def polygon_area(points):
        pass


    def area_after(points, m):
        pass


    def area_factor(points, m):
        pass
  tests:
  - name: areas
    code: |
      sq = [[0, 0], [1, 0], [1, 1], [0, 1]]
      assert polygon_area(sq) == 1 and polygon_area([[0, 0], [4, 0], [0, 3]]) == 6
      assert polygon_area([[0, 0], [0, 3], [4, 0]]) == 6
      assert polygon_area([[0, 0], [2, 0], [2, 2], [0, 2]]) == 4
  - name: the determinant is the area factor
    code: |
      shape = [[0, 0], [3, 0], [4, 2], [1, 3]]
      for m in ([[2, 0], [0, 3]], [[1, 2], [0, 1]], [[0, -1], [1, 0]], [[1, 2], [3, 4]], [[0, 1], [1, 0]]):
          assert area_after(shape, m) == polygon_area(shape) * abs(det2(m))
          assert area_factor(shape, m) == abs(det2(m))
      assert area_factor(shape, [[1, 2], [2, 4]]) == 0
  hints:
  - '`points[(i + 1) % len(points)]` wraps from the last corner back to the first.'
  solution: |
    def mat_vec(m, v):
        return [sum(a * b for a, b in zip(row, v)) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def apply_all(m, points):
        return [mat_vec(m, p) for p in points]


    def polygon_area(points):
        """Shoelace formula: the area of a polygon given its corners in order."""
        total = 0
        for i, (x1, y1) in enumerate(points):
            x2, y2 = points[(i + 1) % len(points)]
            total += x1 * y2 - x2 * y1
        return abs(total) / 2


    def det2(m):
        return m[0][0] * m[1][1] - m[0][1] * m[1][0]


    def area_after(points, m):
        """Area of the polygon after it is moved by the 2x2 matrix m (compute it from the transformed corners)."""
        return polygon_area(apply_all(m, points))


    def area_factor(points, m):
        """How much m multiplies this polygon's area. Compare with abs(det2(m))."""
        return area_after(points, m) / polygon_area(points)
  explanation: The determinant really is the area scale factor, for any shape.
commonMistakes:
- title: Calling a shift linear
  explanation: Adding a constant moves the origin. Linear maps always send 0 to 0.
- title: Writing the basis images as rows
  explanation: They are the columns of the matrix.
- title: Composing in the wrong order
  explanation: The transformation applied last goes on the left.
- title: Expecting a projection to be undoable
  explanation: It destroys information, so its determinant is 0.
summary:
- A linear transformation keeps lines straight and the origin fixed.
- Its matrix has the images of the basis vectors as columns.
- Rotations, shears, reflections, projections and scalings are all matrices.
- Composition is matrix multiplication, and order matters.
- The absolute determinant is the factor by which areas change.
