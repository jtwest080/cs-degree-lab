quiz:
- type: mcq
  question: Which is NOT a linear transformation?
  options:
  - f(x, y) = (x + 1, y)
  - f(x, y) = (2x, 3y)
  - f(x, y) = (y, x)
  - f(x, y) = (x + y, 0)
  answer: 0
  explanation: Adding 1 shifts the origin.
- type: mcq
  question: A transformation sends (1, 0) to (2, 1) and (0, 1) to (3, 4). What is its matrix?
  options:
  - '[[2, 3], [1, 4]]'
  - '[[2, 1], [3, 4]]'
  - '[[1, 0], [0, 1]]'
  - '[[3, 2], [4, 1]]'
  answer: 0
  explanation: The images are the columns.
- type: mcq
  question: What does [[1, 0], [0, 0]] do?
  options:
  - Projects onto the x-axis
  - Rotates 90 degrees
  - Doubles everything
  - Reflects over the diagonal
  answer: 0
