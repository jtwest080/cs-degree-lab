  - name: orthogonal vectors
    code: |
      r = gram_schmidt([[1, 1, 0], [1, 0, 1], [0, 1, 1]])
      assert len(r) == 3
      for i in range(3):
          for j in range(i):
              assert dot(r[i], r[j]) == 0
      assert r[0] == [1, 1, 0]
      assert gram_schmidt([[3, 4], [1, 0]]) == [[3, 4], [Fraction(16, 25), Fraction(-12, 25)]]
  - name: dependent vectors are dropped
    code: |
      r = gram_schmidt([[1, 2], [2, 4], [0, 1]])
      assert len(r) == 2 and dot(r[0], r[1]) == 0
      assert gram_schmidt([]) == []
      v = [[1, 0, 0], [1, 1, 0], [1, 1, 1]]
      r = gram_schmidt(v)
      assert r == [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
  hints:
