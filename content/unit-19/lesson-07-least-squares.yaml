id: u19-least-squares
title: Orthogonality and Least Squares
minutes: 85
objective: Learn what to do when a system has no exact solution, which is the normal situation with real, noisy data. You will use perpendicular vectors to find the closest possible answer, fit lines and curves through scattered points, and see why a perfect fit can be a bad one.
outcomes:
- Explain orthogonality and why perpendicular directions are convenient
- Orthogonalize a set of vectors with Gram-Schmidt
- Solve the normal equations to get a least-squares answer
- Fit a line and a polynomial to data and measure the fit with R squared
- Recognize overfitting
sections:
- heading: When there is no exact answer
  body: |-
    Real measurements are noisy. Suppose you measure a spring five times and get points that almost, but not exactly, lie on a line. The equations `a x = b` that say "every point is on my line" are **overdetermined**: more equations than unknowns, and no `x` satisfies all of them (in the language of lesson 5, `b` is not in the span of the columns of `a`). What now? Give up? No: pick the `x` that makes `a x` **as close as possible** to `b`. This is the **least-squares** solution, because "close" means the **sum of the squares** of the errors is as small as possible.

    Why squares? Squaring makes every error positive, punishes big misses more than small ones, and, best of all, gives a problem with a clean algebraic answer.
- heading: Perpendicular is the key
  body: |-
    Two vectors are **orthogonal** (perpendicular) when their dot product is 0 (lesson 1). The closest point to `b` in a space is where the leftover **residual** `b - a x` meets that space at a right angle, like dropping a plumb line from a ball to the floor. Writing that out, the residual must be orthogonal to every column of `a`: `a^T (b - a x) = 0`, which rearranges into the **normal equations** `(a^T a) x = a^T b`. That is a square system we already know how to solve exactly. One recipe handles every overdetermined system.

    Orthogonal vectors are easy to work with, so we want a way to **make** them. **Gram-Schmidt** takes vectors one at a time and subtracts from each its projection onto the ones already processed, leaving only the new, perpendicular part. The same idea underlies the QR factorization that professional libraries use instead of normal equations for accuracy.
- heading: Fitting lines and curves, and overfitting
  body: |-
    To fit the line `y = m x + c` to points `(x_i, y_i)`, put the `x` values in one column and 1s in another, and solve for `(m, c)`. To fit a parabola `y = c0 + c1 x + c2 x^2`, use columns `1, x, x^2`. The model is **linear in the unknowns** even when the curve is not a line, which is why linear algebra does curve fitting. This is the simplest form of **machine learning**: choose a model, then choose the numbers in it that minimize the error on the data.

    **R squared** measures the fit: 1 means all the variation is explained, 0 means you did no better than predicting the average. But beware: with `n` points, a polynomial of degree `n - 1` hits every point exactly and has zero error, yet it wiggles wildly between them and predicts new data badly. That is **overfitting**: memorizing the noise instead of learning the pattern. Lower error on the data you used is not the same as being right about the data you have not seen.
examples:
- title: A best-fit line and its residual
  intro: The residual is perpendicular to the columns, exactly as the theory says.
  code: |
    from fractions import Fraction


    def transpose(m):
        return [list(col) for col in zip(*m)]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def mat_vec(m, v):
        return [sum(x * y for x, y in zip(row, v)) for row in m]


    def dot(u, v):
        return sum(a * b for a, b in zip(u, v))


    def solve_exact(a, b):
        """Solve a square system with exact fractions (Gaussian elimination). ValueError if singular."""
        n = len(a)
        m = [[Fraction(x) for x in row] + [Fraction(rhs)] for row, rhs in zip(a, b)]
        for col in range(n):
            p = next((r for r in range(col, n) if m[r][col] != 0), None)
            if p is None:
                raise ValueError("the system has no single solution")
            m[col], m[p] = m[p], m[col]
            m[col] = [x / m[col][col] for x in m[col]]
            for r in range(n):
                if r != col and m[r][col] != 0:
                    f = m[r][col]
                    m[r] = [x - f * y for x, y in zip(m[r], m[col])]
        return [m[i][n] for i in range(n)]


    def gram_schmidt(vectors):
        """Turn independent vectors into mutually orthogonal ones spanning the same space (no normalizing, exact fractions)."""
        result = []
        for v in vectors:
            w = [Fraction(x) for x in v]
            for u in result:
                factor = dot(w, u) / dot(u, u)
                w = [x - factor * y for x, y in zip(w, u)]
            if any(w):
                result.append(w)
        return result


    def least_squares(a, b):
        """The x that makes a x as close as possible to b: solve the normal equations (a^T a) x = a^T b."""
        at = transpose(a)
        return solve_exact(mat_mul(at, a), mat_vec(at, b))


    def line_fit(xs, ys):
        """Best-fit line y = slope * x + intercept. Returns (slope, intercept)."""
        a = [[x, 1] for x in xs]
        slope, intercept = least_squares(a, ys)
        return slope, intercept


    def r_squared(xs, ys, slope, intercept):
        """1 minus (leftover error / total variation). 1 is a perfect fit, 0 is no better than the average."""
        mean = Fraction(sum(ys), len(ys))
        total = sum((y - mean) ** 2 for y in ys)
        left = sum((y - (slope * x + intercept)) ** 2 for x, y in zip(xs, ys))
        if total == 0:
            return Fraction(1)
        return 1 - left / total


    def poly_fit(xs, ys, degree):
        """Coefficients [c0, c1, ..., c_degree] of the best-fit polynomial c0 + c1 x + c2 x^2 + ..."""
        a = [[x ** k for k in range(degree + 1)] for x in xs]
        return least_squares(a, ys)


    def predict(coeffs, x):
        return sum(c * x ** k for k, c in enumerate(coeffs))


    ys = [1, 3, 2, 5, 4]
    xs = [0, 1, 2, 3, 4]
    slope, intercept = line_fit(xs, ys)
    print("best line: y =", slope, "* x +", intercept, "  (as decimals:", round(float(slope), 3), round(float(intercept), 3), ")")
    print("r squared:", round(float(r_squared(xs, ys, slope, intercept)), 3))
    a = [[1, x] for x in xs]
    x = least_squares(a, ys)
    residual = [y - p for y, p in zip(ys, mat_vec(a, x))]
    print("residual:", [str(r) for r in residual])
    print("residual dot each column:", [str(dot(c, residual)) for c in transpose(a)])
    print("quadratic:", [str(c) for c in poly_fit(xs, ys, 2)])
    print("orthogonalized:", [[str(v) for v in w] for w in gram_schmidt([[1, 1, 0], [1, 0, 1], [0, 1, 1]])])
  output: |
    best line: y = 4/5 * x + 7/5   (as decimals: 0.8 1.4 )
    r squared: 0.64
    residual: ['-2/5', '4/5', '-1', '6/5', '-3/5']
    residual dot each column: ['0', '0']
    quadratic: ['39/35', '48/35', '-1/7']
    orthogonalized: [['1', '1', '0'], ['1/2', '-1/2', '1'], ['-2/3', '2/3', '2/3']]
  lines:
  - line: 86
    note: Least squares through noisy points.
  - line: 93
    note: 'Zero: the residual is perpendicular to every column.'
- title: Overfitting
  intro: Higher degrees always reduce the error on the data, and eventually memorize it.
  code: |
    from fractions import Fraction


    def transpose(m):
        return [list(col) for col in zip(*m)]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def mat_vec(m, v):
        return [sum(x * y for x, y in zip(row, v)) for row in m]


    def dot(u, v):
        return sum(a * b for a, b in zip(u, v))


    def solve_exact(a, b):
        """Solve a square system with exact fractions (Gaussian elimination). ValueError if singular."""
        n = len(a)
        m = [[Fraction(x) for x in row] + [Fraction(rhs)] for row, rhs in zip(a, b)]
        for col in range(n):
            p = next((r for r in range(col, n) if m[r][col] != 0), None)
            if p is None:
                raise ValueError("the system has no single solution")
            m[col], m[p] = m[p], m[col]
            m[col] = [x / m[col][col] for x in m[col]]
            for r in range(n):
                if r != col and m[r][col] != 0:
                    f = m[r][col]
                    m[r] = [x - f * y for x, y in zip(m[r], m[col])]
        return [m[i][n] for i in range(n)]


    def least_squares(a, b):
        """The x that makes a x as close as possible to b: solve the normal equations (a^T a) x = a^T b."""
        at = transpose(a)
        return solve_exact(mat_mul(at, a), mat_vec(at, b))


    def poly_fit(xs, ys, degree):
        """Coefficients [c0, c1, ..., c_degree] of the best-fit polynomial c0 + c1 x + c2 x^2 + ..."""
        a = [[x ** k for k in range(degree + 1)] for x in xs]
        return least_squares(a, ys)


    def predict(coeffs, x):
        return sum(c * x ** k for k, c in enumerate(coeffs))


    def sse(xs, ys, coeffs):
        """Sum of squared errors of a polynomial on the data."""
        return sum((y - predict(coeffs, x)) ** 2 for x, y in zip(xs, ys))


    def compare_fits(xs, ys, max_degree):
        """A list of (degree, sse) for degrees 1..max_degree. Extra degrees can only lower the error."""
        return [(d, sse(xs, ys, poly_fit(xs, ys, d))) for d in range(1, max_degree + 1)]


    def residual_is_orthogonal(a, b, x):
        """True when b - a x is perpendicular to every column of a (the defining property of the least-squares answer)."""
        residual = [bi - yi for bi, yi in zip(b, mat_vec(a, x))]
        return all(dot(col, residual) == 0 for col in transpose(a))


    xs = [0, 1, 2, 3, 4, 5]
    ys = [1, 3, 2, 5, 4, 8]
    for d, e in compare_fits(xs, ys, 5):
        print("degree", d, "error", round(float(e), 4))
    print("degree 5 passes through all six points, but it is memorizing noise, not learning")
    c = poly_fit(xs, ys, 1)
    print("predict 6 with the line:", round(float(predict(c, 6)), 2))
    c5 = poly_fit(xs, ys, 5)
    print("predict 6 with degree 5:", round(float(predict(c5, 6)), 2))
  output: |
    degree 1 error 6.819
    degree 2 error 5.6286
    degree 3 error 4.2063
    degree 4 error 4.0635
    degree 5 error 0.0
    degree 5 passes through all six points, but it is memorizing noise, not learning
    predict 6 with the line: 7.93
    predict 6 with degree 5: 75.0
  lines:
  - line: 72
    note: Error only goes down as the degree rises.
  - line: 77
    note: Degree 5 hits all points, then extrapolates wildly.
