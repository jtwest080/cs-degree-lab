id: u19-eigen
title: Eigenvalues and Eigenvectors
minutes: 85
objective: Find the special directions that a matrix only stretches and never turns. These eigenvectors and their stretch factors, the eigenvalues, explain the long-run behavior of repeated processes and are the idea behind Google's original PageRank.
outcomes:
- Say what an eigenvector and an eigenvalue are in plain words
- Compute eigenvalues of a 2x2 matrix from its characteristic equation
- Find and check eigenvectors
- Use power iteration to find the dominant eigenvalue
- Compute PageRank for a small web of links
sections:
- heading: Directions that survive
  body: |-
    A matrix usually knocks vectors off their line: send `(1, 2)` through it and it comes out pointing somewhere new. But some special vectors stay on their own line and only get stretched or flipped. Such a vector is an **eigenvector** of the matrix (from the German *eigen*, "own" or "characteristic"), and the stretch factor is its **eigenvalue** `lambda`. The defining equation is `A v = lambda v`, with `v` not the zero vector.

    Example: `A = [[2, 1], [1, 2]]`. Then `A (1, 1) = (3, 3) = 3 (1, 1)`, so `(1, 1)` is an eigenvector with eigenvalue 3. And `A (1, -1) = (1, -1)`, eigenvalue 1. These two directions are the matrix's skeleton: along them it acts like simple multiplication by a number. Every other vector is a mix of the two, so once you know them you understand the whole matrix.
- heading: Finding them
  body: |-
    Rewrite `A v = lambda v` as `(A - lambda I) v = 0`. We want a **non-zero** `v` in the null space (lesson 5), which exists only when `A - lambda I` is singular, meaning its determinant is 0. For a 2x2 matrix this gives the **characteristic equation** `lambda^2 - trace * lambda + det = 0`, where the **trace** is the sum of the diagonal (lesson 2). It is a quadratic, so the quadratic formula solves it. Two handy checks: the eigenvalues **add up to the trace** and **multiply to the determinant**.

    Sometimes there are no real eigenvalues. A quarter turn `[[0, -1], [1, 0]]` points every vector in a new direction, so nothing stays on its line (its eigenvalues are the complex numbers `i` and `-i`). For each eigenvalue, the eigenvector is any vector in the null space of `A - lambda I`; for 2x2 that means any vector perpendicular to a non-zero row of it.
- heading: Repetition, power iteration and PageRank
  body: |-
    Why do eigenvalues matter? Apply a matrix again and again (a population, a weather chain, a web surfer clicking links). The component along the eigenvector with the **biggest** eigenvalue grows fastest and soon dominates: after many steps the result points almost exactly along it. That is **power iteration**: multiply, rescale to keep the numbers manageable, repeat. The Fibonacci matrix `[[1, 1], [1, 0]]` has dominant eigenvalue `(1 + sqrt(5)) / 2 = 1.618...`, the golden ratio, which is why Fibonacci numbers grow by that factor each step.

    **PageRank**, the idea that launched Google, imagines a person clicking random links forever (and, with probability 15 percent, jumping to a random page). The fraction of time spent on each page is that page's score, and it is the dominant eigenvector of the link matrix. Pages linked from important pages become important. Real search engines work with matrices billions of entries wide, but the method is power iteration, exactly as in this lesson.
examples:
- title: Eigenvalues and eigenvectors
  intro: Find them for a 2x2 matrix and check A v = lambda v. A rotation has none.
  code: |
    import math


    def eigenvalues_2x2(m):
        """Real eigenvalues (smallest first) of a 2x2 matrix, from lambda^2 - trace*lambda + det = 0.
        Returns [] when they are complex (the matrix rotates everything, so no direction stays on its line)."""
        trace = m[0][0] + m[1][1]
        det = m[0][0] * m[1][1] - m[0][1] * m[1][0]
        disc = trace * trace - 4 * det
        if disc < 0:
            return []
        root = math.sqrt(disc)
        return sorted({(trace - root) / 2, (trace + root) / 2})


    def is_eigenvector(m, v, lam):
        """True when v is not all zeros and m v == lam v exactly."""
        if not any(v):
            return False
        mv = [sum(a * b for a, b in zip(row, v)) for row in m]
        return mv == [lam * x for x in v]


    from fractions import Fraction


    def eigenvector_2x2(m, lam):
        """A non-zero vector v with m v = lam v: any vector perpendicular to a non-zero row of (m - lam*I)."""
        rows = [[m[0][0] - lam, m[0][1]], [m[1][0], m[1][1] - lam]]
        for p, q in rows:
            if p != 0 or q != 0:
                return [-q, p]
        return [1, 0]    # m - lam*I is all zeros, so every vector works


    m = [[2, 1], [1, 2]]
    print("eigenvalues:", eigenvalues_2x2(m))
    for lam in (1, 3):
        v = eigenvector_2x2(m, lam)
        print("eigenvalue", lam, "has eigenvector", v, "->", [sum(a * b for a, b in zip(r, v)) for r in m], "= lambda * v:", is_eigenvector(m, v, lam))
    turn = [[0, -1], [1, 0]]
    print("a quarter turn has real eigenvalues:", eigenvalues_2x2(turn))
  output: |
    eigenvalues: [1.0, 3.0]
    eigenvalue 1 has eigenvector [-1, 1] -> [-1, 1] = lambda * v: True
    eigenvalue 3 has eigenvector [-1, -1] -> [-3, -3] = lambda * v: True
    a quarter turn has real eigenvalues: []
  lines:
  - line: 36
    note: 'Two special directions: (1, 1) and (1, -1).'
  - line: 42
    note: A rotation keeps no direction on its line.
- title: Power iteration and the golden ratio
  intro: Multiplying again and again converges to the dominant eigenvalue.
  code: |
    import math


    def eigenvalues_2x2(m):
        """Real eigenvalues (smallest first) of a 2x2 matrix, from lambda^2 - trace*lambda + det = 0.
        Returns [] when they are complex (the matrix rotates everything, so no direction stays on its line)."""
        trace = m[0][0] + m[1][1]
        det = m[0][0] * m[1][1] - m[0][1] * m[1][0]
        disc = trace * trace - 4 * det
        if disc < 0:
            return []
        root = math.sqrt(disc)
        return sorted({(trace - root) / 2, (trace + root) / 2})


    def power_iteration(m, steps=200):
        """Repeatedly multiply by m and rescale. The vector turns toward the dominant eigenvector.
        Returns (eigenvalue, vector) where the vector's largest entry is 1."""
        n = len(m)
        v = [1.0 + 0.37 * i for i in range(n)]
        lam = 0.0
        for _ in range(steps):
            w = [sum(a * b for a, b in zip(row, v)) for row in m]
            lam = max(w, key=abs)
            if lam == 0:
                return 0.0, v
            v = [x / lam for x in w]
        return lam, v


    fib = [[1, 1], [1, 0]]
    lam, v = power_iteration(fib, 60)
    print("dominant eigenvalue of the Fibonacci matrix:", round(lam, 6))
    print("the golden ratio is (1 + sqrt(5)) / 2 =", round((1 + 5 ** 0.5) / 2, 6))
    a, b = 1, 1
    for _ in range(30):
        a, b = b, a + b
    print("ratio of consecutive Fibonacci numbers:", round(b / a, 6))
  output: |
    dominant eigenvalue of the Fibonacci matrix: 1.618034
    the golden ratio is (1 + sqrt(5)) / 2 = 1.618034
    ratio of consecutive Fibonacci numbers: 1.618034
  lines:
  - line: 32
    note: Converges to the dominant eigenvalue.
  - line: 36
    note: Fibonacci ratios approach the same number.
- title: PageRank
  intro: Rank five pages by the links between them.
  code: |
    def pagerank(links, damping=0.85, steps=100):
        """PageRank by power iteration. links maps each page to the list of pages it links to.
        A page with no outgoing links shares its score equally with everyone. Scores add up to 1."""
        pages = sorted(set(links) | {t for targets in links.values() for t in targets})
        n = len(pages)
        rank = {p: 1 / n for p in pages}
        for _ in range(steps):
            new = {p: (1 - damping) / n for p in pages}
            for p in pages:
                targets = links.get(p, [])
                if targets:
                    share = damping * rank[p] / len(targets)
                    for t in targets:
                        new[t] += share
                else:
                    for t in pages:
                        new[t] += damping * rank[p] / n
            rank = new
        return rank


    web = {"home": ["news", "shop", "about"], "news": ["home"], "shop": ["home", "news"], "about": ["home"], "blog": ["home", "news"]}
    scores = pagerank(web)
    for page in sorted(scores, key=scores.get, reverse=True):
        print(page, round(scores[page], 4))
    print("total:", round(sum(scores.values()), 6))
  output: |
    home 0.4337
    news 0.2306
    about 0.1529
    shop 0.1529
    blog 0.03
    total: 1.0
  lines:
  - line: 23
    note: Importance flows along links.
  - line: 26
    note: Scores always sum to 1.
playground:
  prompt: 'Change the web in the PageRank example: add a page that every other page links to, and see its score jump.'
  code: |
    print(1.618 ** 2)
