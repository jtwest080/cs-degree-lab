- type: code
  question: Write `trace(m)` returning the sum of the diagonal entries of a square matrix.
  starter: |
    def trace(m):
        pass
  tests:
  - name: trace
    code: |
      assert trace([[1, 2], [3, 4]]) == 5
      assert trace([[7]]) == 7
      assert trace([[1, 0, 0], [0, 2, 0], [0, 0, 3]]) == 6
  solution: |
    def trace(m):
        return sum(m[i][i] for i in range(len(m)))
