- id: power-iteration
  title: Power iteration
  difficulty: 4
  prompt: 'Write `power_iteration(m, steps=200)`: start with `v = [1.0 + 0.37 * i for i in range(n)]` (not all equal, so the start is never exactly perpendicular to the answer); repeat `steps` times: `w = m v`, `lam` = the entry of `w` with the largest absolute value, and `v = w / lam` (if `lam` is 0 return `(0.0, v)`). Return `(lam, v)`.'
  starter: |
    def power_iteration(m, steps=200):
        pass
  tests:
  - name: dominant eigenvalue
    code: |
      lam, v = power_iteration([[2, 1], [1, 2]])
      assert abs(lam - 3) < 1e-9 and abs(v[0] - 1) < 1e-9 and abs(v[1] - 1) < 1e-9
      lam, v = power_iteration([[4, 1], [2, 3]])
      assert abs(lam - 5) < 1e-9 and abs(v[0] - 1) < 1e-9 and abs(v[1] - 1) < 1e-9
      lam, v = power_iteration([[1, 1], [1, 0]], 100)
      assert abs(lam - (1 + 5 ** 0.5) / 2) < 1e-9
  - name: eigen equation holds
    code: |
      m = [[2, -1, 0], [-1, 2, -1], [0, -1, 2]]
      lam, v = power_iteration(m, 500)
      mv = [sum(a * b for a, b in zip(r, v)) for r in m]
      assert all(abs(x - lam * y) < 1e-6 for x, y in zip(mv, v))
      assert abs(lam - (2 + 2 ** 0.5)) < 1e-6 and max(abs(x) for x in v) == 1.0
  - name: zero matrix
    code: |
      assert power_iteration([[0, 0], [0, 0]])[0] == 0
  hints:
  - '`max(w, key=abs)` finds the entry with the largest size, keeping its sign.'
  solution: |
    def power_iteration(m, steps=200):
        """Repeatedly multiply by m and rescale. The vector turns toward the dominant eigenvector.
        Returns (eigenvalue, vector) where the vector's largest entry is 1."""
        n = len(m)
        v = [1.0 + 0.37 * i for i in range(n)]
        lam = 0.0
        for _ in range(steps):
            w = [sum(a * b for a, b in zip(row, v)) for row in m]
            lam = max(w, key=abs)
            if lam == 0:
                return 0.0, v
            v = [x / lam for x in w]
        return lam, v
  explanation: Rescaling by the largest entry stops the numbers from exploding.
- id: pagerank
  title: 'Capstone: PageRank'
  difficulty: 5
  prompt: 'Write `pagerank(links, damping=0.85, steps=100)`. `links` maps each page to a list of pages it links to. The pages are every key and every target, sorted. Start every page at `1/n`. Each step: every page begins with `(1 - damping) / n`; a page with outgoing links gives `damping * rank / number_of_links` to each target; a page with none (or missing from the dictionary) gives `damping * rank / n` to every page. Return the dictionary of scores after `steps` steps.'
  starter: |
    def pagerank(links, damping=0.85, steps=100):
        pass
  tests:
  - name: small web
    code: |
      links = {"a": ["b"], "b": ["a"]}
      r = pagerank(links)
      assert abs(r["a"] - 0.5) < 1e-9 and abs(r["b"] - 0.5) < 1e-9
      r = pagerank({"a": ["c"], "b": ["c"], "c": ["a"]})
      assert abs(sum(r.values()) - 1) < 1e-9
      assert r["c"] > r["a"] > r["b"]
  - name: dangling pages and unknown targets
    code: |
      r = pagerank({"a": ["b", "z"], "b": []})
      assert set(r) == {"a", "b", "z"} and abs(sum(r.values()) - 1) < 1e-9
      assert r["a"] < r["b"] and r["a"] < r["z"]
      r = pagerank({})
      assert r == {}
  - name: damping
    code: |
      links = {"a": ["b"], "b": ["c"], "c": ["a"]}
      r = pagerank(links, 0.5)
      assert all(abs(v - 1 / 3) < 1e-9 for v in r.values())
      star = {"hub": [], "x": ["hub"], "y": ["hub"], "z": ["hub"]}
      r = pagerank(star)
      assert max(r, key=r.get) == "hub"
  hints:
  - Build `new` from scratch every step, then replace `rank` with it.
  - The scores always add up to 1.
  solution: |
    def pagerank(links, damping=0.85, steps=100):
        """PageRank by power iteration. links maps each page to the list of pages it links to.
        A page with no outgoing links shares its score equally with everyone. Scores add up to 1."""
        pages = sorted(set(links) | {t for targets in links.values() for t in targets})
        n = len(pages)
        rank = {p: 1 / n for p in pages}
        for _ in range(steps):
            new = {p: (1 - damping) / n for p in pages}
            for p in pages:
                targets = links.get(p, [])
                if targets:
                    share = damping * rank[p] / len(targets)
                    for t in targets:
                        new[t] += share
                else:
                    for t in pages:
                        new[t] += damping * rank[p] / n
            rank = new
        return rank
  explanation: PageRank is power iteration on the web.
commonMistakes:
- title: Allowing the zero vector as an eigenvector
  explanation: It satisfies A v = lambda v for every lambda, so by definition it is excluded.
- title: Expecting real eigenvalues always
  explanation: Rotations have none; the discriminant is negative.
- title: Forgetting to rescale in power iteration
  explanation: The numbers grow (or shrink) without limit.
- title: Assuming power iteration finds every eigenvalue
  explanation: It only finds the dominant one.
summary:
- An eigenvector keeps its line; its eigenvalue is the stretch.
- The characteristic equation gives eigenvalues; they add to the trace and multiply to the determinant.
- Rotations may have no real eigenvectors.
- Power iteration finds the dominant eigenvector.
- PageRank is power iteration on a web of links.
