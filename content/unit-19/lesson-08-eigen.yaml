- id: eigenvalues-2x2
  title: Eigenvalues of a 2x2 matrix
  difficulty: 4
  prompt: 'The starter imports `math`. Write `eigenvalues_2x2(m)`: with `trace = a + d` and `det = a*d - b*c`, solve `lambda^2 - trace*lambda + det = 0`. If the discriminant `trace**2 - 4*det` is negative return `[]`; otherwise return the distinct roots as a sorted list (one number if both roots are equal).'
  starter: |
    import math


    def eigenvalues_2x2(m):
        pass
  tests:
  - name: real eigenvalues
    code: |
      assert eigenvalues_2x2([[2, 0], [0, 3]]) == [2, 3]
      assert eigenvalues_2x2([[2, 1], [1, 2]]) == [1, 3]
      assert eigenvalues_2x2([[4, 1], [2, 3]]) == [2, 5]
      assert eigenvalues_2x2([[3, 0], [0, 3]]) == [3]
      assert eigenvalues_2x2([[1, 1], [0, 1]]) == [1]
  - name: complex means none
    code: |
      assert eigenvalues_2x2([[0, -1], [1, 0]]) == []
      r = eigenvalues_2x2([[1, 1], [1, 0]])
      assert abs(r[0] - (1 - 5 ** 0.5) / 2) < 1e-9 and abs(r[1] - (1 + 5 ** 0.5) / 2) < 1e-9
  - name: sum and product
    code: |
      m = [[5, 2], [-1, 2]]
      a, b = eigenvalues_2x2(m)
      assert abs(a + b - 7) < 1e-9 and abs(a * b - 12) < 1e-9
  hints:
  - Use a set to merge equal roots, then `sorted`.
  solution: |
    import math


    def eigenvalues_2x2(m):
        """Real eigenvalues (smallest first) of a 2x2 matrix, from lambda^2 - trace*lambda + det = 0.
        Returns [] when they are complex (the matrix rotates everything, so no direction stays on its line)."""
        trace = m[0][0] + m[1][1]
        det = m[0][0] * m[1][1] - m[0][1] * m[1][0]
        disc = trace * trace - 4 * det
        if disc < 0:
            return []
        root = math.sqrt(disc)
        return sorted({(trace - root) / 2, (trace + root) / 2})
  explanation: A quadratic formula gives the stretch factors.
- id: is-eigenvector
  title: Check an eigenvector
  difficulty: 3
  prompt: 'Write `is_eigenvector(m, v, lam)`: `False` if `v` is all zeros, otherwise `True` exactly when `m v` equals `lam * v`, entry by entry.'
  starter: |
    def is_eigenvector(m, v, lam):
        pass
  tests:
  - name: checking eigenvectors
    code: |
      assert is_eigenvector([[2, 0], [0, 3]], [1, 0], 2) is True
      assert is_eigenvector([[2, 0], [0, 3]], [1, 0], 3) is False
      assert is_eigenvector([[2, 1], [1, 2]], [1, 1], 3) is True
      assert is_eigenvector([[2, 1], [1, 2]], [1, -1], 1) is True
      assert is_eigenvector([[2, 1], [1, 2]], [2, 2], 3) is True
      assert is_eigenvector([[2, 1], [1, 2]], [1, 2], 3) is False
  - name: zero is never an eigenvector
    code: |
      assert is_eigenvector([[2, 1], [1, 2]], [0, 0], 3) is False
      assert is_eigenvector([[0, -1], [1, 0]], [1, 0], 5) is False
      assert is_eigenvector([[1, 2, 0], [0, 3, 0], [0, 0, 5]], [0, 0, 1], 5) is True
  hints:
  - '`any(v)` is False for the zero vector.'
  solution: |
    def is_eigenvector(m, v, lam):
        """True when v is not all zeros and m v == lam v exactly."""
        if not any(v):
            return False
        mv = [sum(a * b for a, b in zip(row, v)) for row in m]
        return mv == [lam * x for x in v]
  explanation: Zero satisfies the equation for every lambda, which is why it is excluded.
