    import math


    def dot(u, v):
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def transpose(m):
        return [list(c) for c in zip(*m)]


    def mat_vec(m, v):
        return [dot(row, v) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[dot(row, col) for col in cols] for row in a]


    def power_iteration(m, steps=300):
        """Dominant eigenvalue and eigenvector (largest entry scaled to 1) by repeated multiplication."""
        v = [1.0 + 0.37 * i for i in range(len(m))]    # not all equal, so we never start exactly perpendicular to the answer
        lam = 0.0
        for _ in range(steps):
            w = mat_vec(m, v)
            lam = max(w, key=abs)
            if lam == 0:
                return 0.0, v
            v = [x / lam for x in w]
        return lam, v


    def unit(v):
        length = norm(v)
        return [x / length for x in v]


    def rank_one_approximation(m, steps=300):
        """The best rank-1 matrix close to m. Returns (sigma, u, v, approx) with approx = sigma * outer(u, v).
        v is the dominant eigenvector of m^T m, sigma = |m v|, u = m v / sigma."""
        mt = transpose(m)
        lam, v = power_iteration(mat_mul(mt, m), steps)
        v = unit(v)
        mv = mat_vec(m, v)
        sigma = norm(mv)
        u = [x / sigma for x in mv]
        approx = [[sigma * a * b for b in v] for a in u]
        return sigma, u, v, approx
  explanation: One direction pair and one number summarize the whole table as well as any rank-one matrix can.
