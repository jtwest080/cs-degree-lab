- title: Finding similar users
  intro: Cosine similarity and a similarity-weighted recommendation.
  code: |
    import math


    def dot(u, v):
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def transpose(m):
        return [list(c) for c in zip(*m)]


    def mat_vec(m, v):
        return [dot(row, v) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[dot(row, col) for col in cols] for row in a]


    def power_iteration(m, steps=300):
        """Dominant eigenvalue and eigenvector (largest entry scaled to 1) by repeated multiplication."""
        v = [1.0 + 0.37 * i for i in range(len(m))]    # not all equal, so we never start exactly perpendicular to the answer
        lam = 0.0
        for _ in range(steps):
            w = mat_vec(m, v)
            lam = max(w, key=abs)
            if lam == 0:
                return 0.0, v
            v = [x / lam for x in w]
        return lam, v


    def cosine(u, v):
        nu, nv = norm(u), norm(v)
        return 0.0 if nu == 0 or nv == 0 else dot(u, v) / (nu * nv)


    def most_similar(vectors, query, k=1):
        """Indices of the k vectors most similar (by cosine) to query, best first. Ties go to the lower index."""
        order = sorted(range(len(vectors)), key=lambda i: (-cosine(vectors[i], query), i))
        return order[:k]


    def recommend(ratings, user, k=1):
        """Pick the k unrated items (rating 0) with the highest score for `user`. The score of an item is the
        similarity-weighted average of the other users' ratings for it (only users who rated it count).
        ratings is a list of rows (one per user); returns item indices, best first, ties to the lower index."""
        me = ratings[user]
        sims = {i: cosine(me, row) for i, row in enumerate(ratings) if i != user}
        scores = {}
        for item, mine in enumerate(me):
            if mine != 0:
                continue
            num = sum(sims[i] * ratings[i][item] for i in sims if ratings[i][item] != 0)
            den = sum(abs(sims[i]) for i in sims if ratings[i][item] != 0)
            if den > 0:
                scores[item] = num / den
        return sorted(scores, key=lambda i: (-scores[i], i))[:k]


    ratings = [[5, 4, 0, 0], [5, 5, 4, 0], [1, 0, 2, 5], [4, 4, 0, 3]]
    print("users most like user 0:", most_similar(ratings[1:], ratings[0], 2), "(indices among the others)")
    print("recommend for user 0:", recommend(ratings, 0, 2), "(item numbers)")
    print("recommend for user 2:", recommend(ratings, 2, 1))
  output: |
    users most like user 0: [2, 0] (indices among the others)
    recommend for user 0: [2, 3] (item numbers)
    recommend for user 2: [1]
  lines:
  - line: 68
    note: Weighted by taste similarity.
