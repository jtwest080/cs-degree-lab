      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      data = [[1, 3], [2, 2], [3, 1], [4, 0]]
      d = principal_direction(data)
      p = project_1d(data, d)
      var = sum(x * x for x in p) / (len(p) - 1)
      total = sum(covariance_matrix(data)[i][i] for i in range(2))
