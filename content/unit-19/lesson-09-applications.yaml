id: u19-applications
title: 'Applications: PCA, Compression and Recommendations'
minutes: 85
objective: Put the whole unit to work. You will find the main direction in a cloud of data (PCA), summarize a table with a few numbers (the idea behind SVD and image compression) and recommend things to people with cosine similarity, the way streaming services do.
outcomes:
- Center data and compute a covariance matrix
- Use the dominant eigenvector of the covariance matrix as the principal direction (PCA)
- Approximate a matrix with a rank-one matrix
- Explain why compressing with the largest singular values works
- Recommend items with cosine similarity
sections:
- heading: Data as a cloud of points
  body: 'Suppose a table lists the height and weight of five people. Each row is a point in 2D; a table with 1,000 columns (a genome, a document''s word counts) is a point in 1,000-dimensional space. We cannot see that, but linear algebra works in any dimension. A first step is **centering**: subtract each column''s average so the cloud sits around the origin. Next the **covariance matrix** records how features move together: its diagonal holds each feature''s **variance** (spread), and an off-diagonal entry is positive when two features rise together (taller people weigh more) and negative when one rises as the other falls. Entry `(i, j)` is the sum of `centered_i * centered_j` divided by `n - 1`. This matrix is **symmetric**, and symmetric matrices have wonderfully well-behaved eigenvectors: real eigenvalues and mutually perpendicular eigenvectors.'
- heading: 'PCA: the direction of greatest spread'
  body: '**Principal component analysis (PCA)** asks: along which direction does the data vary the most? The answer is the **dominant eigenvector of the covariance matrix**, and its eigenvalue is the variance along that direction. Project every point onto it and you replace two numbers per person with one, losing as little information as possible. With 1,000 features you might keep the top 10 directions. That is **dimensionality reduction**, the first step in countless machine-learning pipelines and the way scientists draw pictures of high-dimensional data. We find the direction with power iteration from lesson 8.'
- heading: Low-rank approximation and recommendations
  body: |-
    Any matrix can be written as a sum of simple rank-one pieces `sigma * u v^T`, ordered from most to least important (the **singular value decomposition, SVD**). Keep only the largest piece or pieces and you have the best possible lower-rank summary of the table. For a picture, a few pieces carry almost all of the visible structure, so storing `u`, `v` and `sigma` (a few dozen numbers) instead of every pixel is **compression**. Here we compute the top piece: `v` is the dominant eigenvector of `A^T A`, `sigma = |A v|`, and `u = A v / sigma`.

    **Recommendations** use the dot product from lesson 1. Treat each user's ratings as a vector. **Cosine similarity** (the cosine of the angle between two vectors) says how alike two tastes are regardless of how generously each user rates. To predict whether you will like an item you have not tried, average the ratings of other users who did, weighting each by how similar they are to you. Real services use much more sophisticated versions of exactly this idea.
examples:
- title: Covariance and PCA
  intro: 'Heights and weights: the main direction, and five points reduced to five numbers.'
  code: |
    import math


    def dot(u, v):
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def transpose(m):
        return [list(c) for c in zip(*m)]


    def mat_vec(m, v):
        return [dot(row, v) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[dot(row, col) for col in cols] for row in a]


    def power_iteration(m, steps=300):
        """Dominant eigenvalue and eigenvector (largest entry scaled to 1) by repeated multiplication."""
        v = [1.0 + 0.37 * i for i in range(len(m))]    # not all equal, so we never start exactly perpendicular to the answer
        lam = 0.0
        for _ in range(steps):
            w = mat_vec(m, v)
            lam = max(w, key=abs)
            if lam == 0:
                return 0.0, v
            v = [x / lam for x in w]
        return lam, v


    def mean_center(data):
        """Subtract each column's mean from that column. data is a list of rows (points)."""
        n = len(data)
        means = [sum(col) / n for col in zip(*data)]
        return [[x - mu for x, mu in zip(row, means)] for row in data]


    def covariance_matrix(data):
        """Entry (i, j) = how features i and j vary together: sum(centered_i * centered_j) / (n - 1)."""
        centered = mean_center(data)
        n = len(centered)
        cols = transpose(centered)
        return [[dot(a, b) / (n - 1) for b in cols] for a in cols]


    def unit(v):
        length = norm(v)
        return [x / length for x in v]


    def principal_direction(data):
        """The direction of greatest spread: the dominant eigenvector of the covariance matrix, scaled to length 1,
        with the sign chosen so that its first non-negligible entry is positive."""
        lam, v = power_iteration(covariance_matrix(data))
        v = unit(v)
        first = next(x for x in v if abs(x) > 1e-9)
        if first < 0:
            v = [-x for x in v]
        return v


    def project_1d(data, direction):
        """Coordinates of each centered point along the direction."""
        return [dot(row, direction) for row in mean_center(data)]


    heights_weights = [[150, 50], [160, 58], [170, 66], [180, 77], [190, 84]]
    cov = covariance_matrix(heights_weights)
    print("covariance:", [[round(x, 2) for x in row] for row in cov])
    d = principal_direction(heights_weights)
    print("principal direction:", [round(x, 3) for x in d])
    print("1D coordinates:", [round(x, 2) for x in project_1d(heights_weights, d)])
    print("five points in 2D are now five numbers, keeping", round(100 * (sum(x * x for x in project_1d(heights_weights, d)) / 4) / (cov[0][0] + cov[1][1]), 2), "percent of the spread")
  output: |
    covariance: [[250.0, 217.5], [217.5, 190.0]]
    principal direction: [0.754, 0.657]
    1D coordinates: [-26.25, -13.45, -0.66, 14.11, 26.25]
    five points in 2D are now five numbers, keeping 99.9 percent of the spread
