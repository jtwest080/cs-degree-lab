  - name: var
    code: |
      assert variance([1, 2, 3]) == 1
      assert variance([2, 4, 4, 4, 5, 5, 7, 9]) == 32 / 7
      assert abs(variance([1.5, 2.5]) - 0.5) < 1e-12
  solution: |
    def variance(values):
        mean = sum(values) / len(values)
        return sum((v - mean) ** 2 for v in values) / (len(values) - 1)
