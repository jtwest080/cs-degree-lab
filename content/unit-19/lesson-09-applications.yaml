    import math


    def dot(u, v):
        return sum(a * b for a, b in zip(u, v))


    def norm(v):
        return math.sqrt(dot(v, v))


    def transpose(m):
        return [list(c) for c in zip(*m)]


    def mat_vec(m, v):
        return [dot(row, v) for row in m]


    def mat_mul(a, b):
        cols = list(zip(*b))
        return [[dot(row, col) for col in cols] for row in a]


    def power_iteration(m, steps=300):
        """Dominant eigenvalue and eigenvector (largest entry scaled to 1) by repeated multiplication."""
        v = [1.0 + 0.37 * i for i in range(len(m))]    # not all equal, so we never start exactly perpendicular to the answer
        lam = 0.0
        for _ in range(steps):
            w = mat_vec(m, v)
            lam = max(w, key=abs)
            if lam == 0:
                return 0.0, v
            v = [x / lam for x in w]
        return lam, v


    def mean_center(data):
        """Subtract each column's mean from that column. data is a list of rows (points)."""
        n = len(data)
        means = [sum(col) / n for col in zip(*data)]
        return [[x - mu for x, mu in zip(row, means)] for row in data]


    def covariance_matrix(data):
        """Entry (i, j) = how features i and j vary together: sum(centered_i * centered_j) / (n - 1)."""
        centered = mean_center(data)
        n = len(centered)
        cols = transpose(centered)
        return [[dot(a, b) / (n - 1) for b in cols] for a in cols]


    def unit(v):
        length = norm(v)
        return [x / length for x in v]


    def principal_direction(data):
        """The direction of greatest spread: the dominant eigenvector of the covariance matrix, scaled to length 1,
        with the sign chosen so that its first non-negligible entry is positive."""
        lam, v = power_iteration(covariance_matrix(data))
        v = unit(v)
        first = next(x for x in v if abs(x) > 1e-9)
        if first < 0:
            v = [-x for x in v]
        return v


    def project_1d(data, direction):
        """Coordinates of each centered point along the direction."""
        return [dot(row, direction) for row in mean_center(data)]
  explanation: 'Each point becomes one number: its position along the main axis.'
