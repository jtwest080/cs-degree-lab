title: 'Data Lab: A Linear Algebra Toolkit'
language: python
brief: Build a small toolkit that solves equations, fits lines to data, ranks web pages and compares vectors,
  using only the ideas from this unit. The same functions power spreadsheets, search engines and recommendation
  systems.
steps:
- title: Solve and measure
  body: Write `solve_system` with Gaussian elimination and exact fractions (it must refuse systems that
    do not have exactly one solution), then `rank` and `determinant` with the same row operations. Remember
    that each swap flips the determinant's sign.
- title: Fit the data
  body: 'Write `line_fit(points)` using the normal equations for a line: with `n` points, solve `[[sxx,
    sx], [sx, n]] * [slope, intercept] = [sxy, sy]`, where `sx` is the sum of x, `sxx` the sum of x squared,
    `sxy` the sum of x times y and `sy` the sum of y. Refuse fewer than two points or points that all
    share one x.'
- title: Find the dominant direction
  body: Write `dominant_eigen` with power iteration and use it again inside `pagerank`, which spreads
    importance along links with a damping factor of 0.85.
- title: Compare and move things
  body: Write `cosine_similarity` (0.0 when either vector has length 0) and `rotate_points`, which applies
    the quarter-turn matrix `[[0, -1], [1, 0]]` repeatedly. Negative turn counts should work too.
checklist:
- text: Solves a square system exactly
  test: solves a system exactly
- text: Refuses systems without a unique solution
  test: rejects systems without one solution
- text: Computes rank
  test: computes rank
- text: Computes determinants
  test: computes determinants
- text: Rejects non-square matrices
  test: determinant needs a square matrix
- text: Fits a perfect line
  test: fits a line exactly when the points are on one
- text: Fits a noisy line
  test: fits a line to noisy points
- text: Rejects bad data for a line
  test: line fit rejects bad data
- text: Finds the dominant eigenvalue
  test: finds the dominant eigenvalue
- text: Ranks pages
  test: ranks web pages
- text: Computes cosine similarity
  test: compares vectors by angle
- text: Rotates points
  test: rotates points
