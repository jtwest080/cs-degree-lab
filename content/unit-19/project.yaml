tests:
- name: solves a system exactly
  code: |
    assert solve_system([[2, 1, -1], [-3, -1, 2], [-2, 1, 2]], [8, -11, -3]) == [2, 3, -1]
    assert solve_system([[2, 0], [0, 4]], [1, 1]) == [Fraction(1, 2), Fraction(1, 4)]
- name: rejects systems without one solution
  code: |
    for a, b in ([[[1, 2], [2, 4]], [3, 6]], [[[0, 0], [0, 0]], [0, 0]]):
        try:
            solve_system(a, b)
            raise AssertionError("accepted")
        except ValueError:
            pass
- name: computes rank
  code: |
    assert rank([[1, 2], [2, 4]]) == 1 and rank([[1, 2], [3, 4]]) == 2 and rank([[0, 0]]) == 0
    assert rank([[1, 2, 3], [4, 5, 6], [7, 8, 9]]) == 2 and rank([[1, 0, 0], [0, 1, 0]]) == 2
- name: computes determinants
  code: |
    assert determinant([[1, 2], [3, 4]]) == -2 and determinant([[6, 1, 1], [4, -2, 5], [2, 8, 7]]) == -306
    assert determinant([[1, 2], [2, 4]]) == 0 and determinant([[5]]) == 5
- name: determinant needs a square matrix
  code: |
    for bad in ([], [[1, 2, 3], [4, 5, 6]]):
        try:
            determinant(bad)
            raise AssertionError("accepted")
        except ValueError:
            pass
- name: fits a line exactly when the points are on one
  code: |
    assert line_fit([(0, 1), (1, 3), (2, 5)]) == (2, 1)
    assert line_fit([(1, 2), (2, 4), (3, 6)]) == (2, 0)
- name: fits a line to noisy points
  code: |
    assert line_fit([(0, 1), (1, 3), (2, 2)]) == (Fraction(1, 2), Fraction(3, 2))
    slope, icept = line_fit([(0, 1), (1, 3), (2, 2), (3, 5), (4, 4)])
    assert (slope, icept) == (Fraction(4, 5), Fraction(7, 5))
- name: line fit rejects bad data
  code: |
    for pts in ([(1, 1)], [(2, 1), (2, 5)]):
        try:
            line_fit(pts)
            raise AssertionError("accepted")
        except ValueError:
            pass
- name: finds the dominant eigenvalue
  code: |
    lam, v = dominant_eigen([[2, 1], [1, 2]])
    assert abs(lam - 3) < 1e-9 and abs(v[0] - v[1]) < 1e-9 and max(abs(x) for x in v) == 1.0
    lam, v = dominant_eigen([[1, 1], [1, 0]])
    assert abs(lam - (1 + 5 ** 0.5) / 2) < 1e-9
    lam, v = dominant_eigen([[1, -1], [-1, 1]])
    assert abs(lam - 2) < 1e-9
- name: ranks web pages
  code: |
    r = pagerank({"a": ["c"], "b": ["c"], "c": ["a"]})
    assert abs(sum(r.values()) - 1) < 1e-9 and r["c"] > r["a"] > r["b"]
    r = pagerank({"hub": [], "x": ["hub"], "y": ["hub"]})
    assert max(r, key=r.get) == "hub"
    assert pagerank({}) == {}
- name: compares vectors by angle
  code: |
    assert abs(cosine_similarity([1, 0], [0, 1])) < 1e-12
    assert abs(cosine_similarity([1, 2, 3], [2, 4, 6]) - 1) < 1e-12
    assert abs(cosine_similarity([1, 0], [-1, 0]) + 1) < 1e-12
    assert cosine_similarity([0, 0], [1, 1]) == 0.0
- name: rotates points
  code: |
    assert rotate_points([(1, 0), (0, 2)], 1) == [(0, 1), (-2, 0)]
    assert rotate_points([(1, 0)], 4) == [(1, 0)] and rotate_points([(3, 4)], 2) == [(-3, -4)]
    assert rotate_points([(1, 0)], -1) == [(0, -1)] and rotate_points([], 3) == []
solution: |
  from fractions import Fraction
  import math


  def solve_system(a, b):
      """Solve a x = b exactly (list of Fractions). ValueError if there is not exactly one solution."""
      n = len(a)
      m = [[Fraction(x) for x in row] + [Fraction(rhs)] for row, rhs in zip(a, b)]
      for col in range(n):
          p = next((r for r in range(col, n) if m[r][col] != 0), None)
          if p is None:
              raise ValueError("the system does not have exactly one solution")
          m[col], m[p] = m[p], m[col]
          m[col] = [x / m[col][col] for x in m[col]]
          for r in range(n):
              if r != col and m[r][col] != 0:
                  f = m[r][col]
                  m[r] = [x - f * y for x, y in zip(m[r], m[col])]
      return [m[i][n] for i in range(n)]


  def rank(m):
      a = [[Fraction(x) for x in row] for row in m]
      r = 0
      for c in range(len(a[0]) if a else 0):
          p = next((i for i in range(r, len(a)) if a[i][c] != 0), None)
          if p is None:
              continue
          a[r], a[p] = a[p], a[r]
          for i in range(r + 1, len(a)):
              f = a[i][c] / a[r][c]
              a[i] = [x - f * y for x, y in zip(a[i], a[r])]
          r += 1
      return r


  def determinant(m):
      n = len(m)
      if n == 0 or any(len(row) != n for row in m):
          raise ValueError("a square matrix is needed")
      a = [[Fraction(x) for x in row] for row in m]
      sign = 1
      for c in range(n):
          p = next((i for i in range(c, n) if a[i][c] != 0), None)
          if p is None:
              return Fraction(0)
          if p != c:
              a[c], a[p] = a[p], a[c]
              sign = -sign
          for i in range(c + 1, n):
              f = a[i][c] / a[c][c]
              a[i] = [x - f * y for x, y in zip(a[i], a[c])]
      result = Fraction(sign)
      for i in range(n):
          result *= a[i][i]
      return result


  def line_fit(points):
      """Least-squares line through (x, y) points. Returns (slope, intercept) as Fractions.
      ValueError if fewer than two points or all x values are equal."""
      n = len(points)
      if n < 2:
          raise ValueError("need at least two points")
      sx = sum(x for x, y in points)
      sy = sum(y for x, y in points)
      sxx = sum(x * x for x, y in points)
      sxy = sum(x * y for x, y in points)
      if n * sxx - sx * sx == 0:
          raise ValueError("all x values are equal")
      slope, intercept = solve_system([[sxx, sx], [sx, n]], [sxy, sy])
      return slope, intercept


  def dominant_eigen(m, steps=300):
      """(eigenvalue, eigenvector with largest entry 1) by power iteration."""
      v = [1.0 + 0.37 * i for i in range(len(m))]
      lam = 0.0
      for _ in range(steps):
          w = [sum(a * b for a, b in zip(row, v)) for row in m]
          lam = max(w, key=abs)
          if lam == 0:
              return 0.0, v
          v = [x / lam for x in w]
      return lam, v


  def pagerank(links, damping=0.85, steps=100):
      pages = sorted(set(links) | {t for ts in links.values() for t in ts})
      n = len(pages)
      rank_ = {p: 1 / n for p in pages}
      for _ in range(steps):
          new = {p: (1 - damping) / n for p in pages}
          for p in pages:
              ts = links.get(p, [])
              if ts:
                  for t in ts:
                      new[t] += damping * rank_[p] / len(ts)
              else:
                  for t in pages:
                      new[t] += damping * rank_[p] / n
          rank_ = new
      return rank_


  def cosine_similarity(u, v):
      nu = math.sqrt(sum(x * x for x in u))
      nv = math.sqrt(sum(x * x for x in v))
      if nu == 0 or nv == 0:
          return 0.0
      return sum(a * b for a, b in zip(u, v)) / (nu * nv)


  def rotate_points(points, quarter_turns):
      """Rotate (x, y) points counter-clockwise about the origin by whole quarter turns, using the matrix [[0, -1], [1, 0]]."""
      result = []
      for x, y in points:
          for _ in range(quarter_turns % 4):
              x, y = -y, x
          result.append((x, y))
      return result
