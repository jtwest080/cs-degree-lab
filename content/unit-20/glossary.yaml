# Terms introduced in Unit 20 (Calculus). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Calculus
  definition: The mathematics of change and accumulation.
  lesson: u20-limits
- term: Average rate of change
  definition: The change in a function's output divided by the change in its input over an interval.
  lesson: u20-limits
- term: Instantaneous rate of change
  definition: How fast something is changing at one exact moment.
  lesson: u20-limits
- term: Continuous function
  definition: A function whose graph can be drawn without lifting the pencil.
  lesson: u20-limits
- term: Removable discontinuity
  definition: A single missing or misplaced point where the limit still exists.
  lesson: u20-limits
- term: Jump discontinuity
  definition: A point where the function approaches different values from the left and right.
  lesson: u20-limits
- term: Infinite discontinuity
  definition: A point where the function grows without bound.
  lesson: u20-limits
- term: Secant line
  definition: A straight line through two points on a curve.
  lesson: u20-limits
- term: Derivative
  definition: The instantaneous rate of change of a function, the slope of its tangent line.
  lesson: u20-derivatives
- term: Tangent line
  definition: The straight line that just touches a curve at one point and has the curve's slope there.
  lesson: u20-derivatives
- term: Power rule
  definition: The derivative of x to the n is n times x to the n minus 1.
  lesson: u20-derivatives
- term: Product rule
  definition: The derivative of f times g is f prime g plus f g prime.
  lesson: u20-derivatives
- term: Quotient rule
  definition: The derivative of f over g is (f prime g minus f g prime) over g squared.
  lesson: u20-derivatives
- term: Chain rule
  definition: The derivative of a function inside another is the outer derivative times the inner derivative.
  lesson: u20-derivatives
- term: Symbolic differentiation
  definition: Producing a formula for the derivative by applying the rules to a formula.
  lesson: u20-derivatives
- term: Automatic differentiation
  definition: Computing exact derivatives of a running program by applying the chain rule to each step.
  lesson: u20-derivatives
- term: Gradient checking
  definition: Comparing a derivative formula against numerical slopes to catch mistakes.
  lesson: u20-derivatives
- term: Root
  definition: An input where a function equals zero.
  lesson: u20-applications
- term: Bisection method
  definition: Finding a root by repeatedly halving an interval whose ends have opposite signs.
  lesson: u20-applications
- term: Newton's method
  definition: Finding a root by repeatedly sliding down the tangent line to where it crosses zero.
  lesson: u20-applications
- term: Critical point
  definition: A point where a function's derivative is zero.
  lesson: u20-applications
- term: Local minimum
  definition: A point lower than all the points near it.
  lesson: u20-applications
- term: Local maximum
  definition: A point higher than all the points near it.
  lesson: u20-applications
- term: Second derivative
  definition: The derivative of the derivative; it tells how the slope is changing.
  lesson: u20-applications
- term: Optimization
  definition: Finding the input that makes a quantity as large or as small as possible.
  lesson: u20-applications
- term: Integral
  definition: The accumulated total of a changing quantity, the signed area under its curve.
  lesson: u20-integrals
- term: Definite integral
  definition: The exact area under a curve between two given inputs.
  lesson: u20-integrals
- term: Riemann sum
  definition: An approximation of an area by adding up thin rectangles.
  lesson: u20-integrals
- term: Midpoint rule
  definition: A Riemann sum that measures each rectangle's height at the middle of its slice.
  lesson: u20-integrals
- term: Trapezoid rule
  definition: An area approximation using straight-sided trapezoids.
  lesson: u20-integrals
- term: Simpson's rule
  definition: An area approximation that fits a parabola through each pair of slices.
  lesson: u20-integrals
- term: Antiderivative
  definition: A function whose derivative is a given function.
  lesson: u20-integrals
- term: Fundamental Theorem of Calculus
  definition: The area under f from a to b equals F(b) minus F(a) where F is an antiderivative.
  lesson: u20-integrals
- term: Adaptive integration
  definition: Splitting intervals only where more accuracy is needed.
  lesson: u20-integrals
- term: Average value of a function
  definition: The area under the curve divided by the width of the interval.
  lesson: u20-integrals
- term: Differential equation
  definition: An equation that gives a quantity's rate of change in terms of its current value.
  lesson: u20-ode
- term: Initial condition
  definition: The starting value that picks one solution of a differential equation.
  lesson: u20-ode
- term: Euler's method
  definition: Solving a differential equation by taking many small steps along the current slope.
  lesson: u20-ode
- term: Runge-Kutta method
  definition: A family of accurate step-by-step solvers that average several slopes per step.
  lesson: u20-ode
- term: Newton's law of cooling
  definition: The rule that an object's temperature changes in proportion to its difference from the surroundings.
  lesson: u20-ode
- term: Logistic growth
  definition: Growth that is fast at first and levels off at a carrying capacity.
  lesson: u20-ode
- term: Carrying capacity
  definition: The largest population an environment can support.
  lesson: u20-ode
- term: SIR model
  definition: An epidemic model with susceptible, infected and recovered groups.
  lesson: u20-ode
- term: Basic reproduction number
  definition: The average number of people one infected person infects in a fully susceptible population.
  lesson: u20-ode
- term: Series
  definition: The sum of the terms of a sequence.
  lesson: u20-series
- term: Partial sum
  definition: The total of the first few terms of a series.
  lesson: u20-series
- term: Convergent series
  definition: A series whose partial sums approach a limit.
  lesson: u20-series
- term: Divergent series
  definition: A series whose partial sums do not settle on a number.
  lesson: u20-series
- term: Geometric series
  definition: A series in which each term is the previous one times a fixed ratio.
  lesson: u20-series
- term: Taylor series
  definition: A function written as an endless polynomial built from its derivatives at a point.
  lesson: u20-series
- term: Factorial
  definition: The product of the whole numbers from 1 up to n, written n!.
  lesson: u20-series
- term: Argument reduction
  definition: Shrinking an input to a small range before applying a series.
  lesson: u20-series
- term: Partial derivative
  definition: The derivative with respect to one input while the other inputs are held fixed.
  lesson: u20-gradients
- term: Directional derivative
  definition: The slope of a function when moving in a chosen direction.
  lesson: u20-gradients
- term: Contour line
  definition: A path along which a function's value stays constant.
  lesson: u20-gradients
- term: Backtracking line search
  definition: Choosing a step size by halving it until the step really lowers the function.
  lesson: u20-gradients
