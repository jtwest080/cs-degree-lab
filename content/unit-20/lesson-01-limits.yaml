quiz:
- type: mcq
  question: A car goes from mile 10 at 1:00 to mile 70 at 3:00. Its average speed is...
  options:
  - 30 mph
  - 60 mph
  - 35 mph
  - 120 mph
  answer: 0
  explanation: 60 miles in 2 hours.
- type: mcq
  question: Why can't we compute instant speed as distance over time directly?
  options:
  - At one instant the time and distance are both 0
  - Cars have no speed
  - Time is negative
  - Speed is constant
  answer: 0
  explanation: That is 0 / 0, which means nothing.
- type: mcq
  question: What is the limit of (x^2 - 1) / (x - 1) as x approaches 1?
  options:
  - '2'
  - '0'
  - '1'
  - It does not exist
  answer: 0
  explanation: For x not equal to 1 it simplifies to x + 1.
- type: mcq
  question: abs(x) / x near 0 has no limit because...
  options:
  - the two sides approach -1 and 1
  - it is zero
  - it is undefined everywhere
  - it equals x
  answer: 0
  explanation: A jump.
- type: mcq
  question: A function is continuous at a if...
  options:
  - the limit exists and equals f(a)
  - f(a) is defined
  - the graph has a corner
  - f(a) = 0
  answer: 0
  explanation: No lifting the pencil.
- type: mcq
  question: What does a negative average rate of change mean?
  options:
  - The output is going down
  - The input is going down
  - The function is broken
  - The slope is zero
  answer: 0
  explanation: The graph slopes downward.
- type: code
  question: Write `slope(p, q)` returning the slope of the line through points `p = (x1, y1)` and `q = (x2, y2)`.
  starter: |
    def slope(p, q):
        pass
  tests:
  - name: slope
    code: |
      assert slope((0, 0), (2, 4)) == 2
      assert slope((1, 5), (3, 1)) == -2
      assert slope((0, 3), (4, 3)) == 0
  solution: |
    def slope(p, q):
        return (q[1] - p[1]) / (q[0] - p[0])
