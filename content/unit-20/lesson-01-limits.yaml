id: u20-limits
title: Rates of Change and Limits
minutes: 75
objective: 'Start calculus from the very beginning: how to measure how fast something is changing, why ''at this exact instant'' needs a clever idea, and what a limit is. You need only high-school algebra and the ability to read the code.'
outcomes:
- Compute an average rate of change as rise over run
- Explain what a limit is as 'the number a function approaches'
- Estimate limits numerically from both sides
- Recognize when a limit does not exist
- Tell continuous points from removable, jump and infinite ones
sections:
- heading: How fast is it changing?
  body: |-
    **Calculus** is the mathematics of change. Two questions drive it. First: if I know how something changes, how fast is it changing right now? (That is **differentiation**, the next lesson.) Second: if I know how fast something is changing, how much has it changed in total? (That is **integration**, later in this unit.) Every physics simulation, every machine-learning training loop and every graphics engine leans on both.

    We start with a simple version of the first question. A car is at mile 0 at 1:00 and at mile 60 at 2:00. Its **average speed** is `(60 - 0) / (2 - 1) = 60` miles per hour: distance travelled divided by time taken. In general the **average rate of change** of a function `f` between `a` and `b` is `(f(b) - f(a)) / (b - a)`. It is "rise over run": the change in output divided by the change in input. Graphically it is the slope of the straight line joining the two points. For a straight-line function like `3x + 1` this is always 3. For a curve like `x * x` it depends on where you look: 1 between 0 and 1, but 3 between 1 and 2.
- heading: The problem with 'right now'
  body: |-
    Your speedometer shows a speed at one instant, not over a stretch of time. But "distance divided by time" needs a stretch: at a single instant no time passes and no distance is covered, which would give 0 / 0, a meaningless answer. This puzzle puzzled thinkers for two thousand years, and Newton and Leibniz resolved it in the 1600s.

    The trick: shrink the stretch. Drop a ball: its height after `t` seconds is `100 - 5 t^2` metres. The average speed from t = 0 to t = 2 is -10 m/s (negative: it is going down). From 1 to 2 it is -15. From 1.9 to 2 it is -19.5. From 1.99 to 2 it is -19.95. The numbers are **closing in on -20**. We say that -20 is the **limit** of the average speed as the stretch shrinks to nothing, and that -20 m/s is the speed at exactly t = 2. We never divide by zero; we see where the answers are heading.
- heading: Limits
  body: |-
    The **limit** of `f(x)` as `x` approaches `a` is the number that `f(x)` gets as close to as you like by taking `x` close enough to `a` (but not equal to it). We write it `lim f(x) as x -> a`. The limit cares about where `f` is **heading**, not about what `f(a)` actually is, and `f(a)` need not even exist. Example: `f(x) = (x^2 - 1) / (x - 1)` is undefined at `x = 1` (zero divided by zero), but for every other `x` it simplifies to `x + 1`, so near 1 it approaches 2. The limit is 2 even though `f(1)` does not exist.

    A limit **does not exist** in two common ways. A **jump**: `abs(x) / x` equals -1 just left of 0 and +1 just right of it, so the two sides disagree. **Blowing up**: `1 / x` grows enormously as `x` nears 0 and so heads for no number. To estimate a limit with code, look at the function a little to the left and a little to the right of the point, closer and closer; if both sides settle on the same number, that is the limit.

    A function is **continuous** at a point if you can draw through it without lifting your pencil: the limit exists and equals the value there. The ways to fail are the ones above, plus a **removable** gap, where the limit exists but the function is missing or misplaced at that single point.
examples:
- title: Shrinking the interval
  intro: The average speed of a falling ball closes in on its speed at one instant.
  code: |
    def average_rate(f, a, b):
        """How fast f changes on average between a and b: (f(b) - f(a)) / (b - a). ValueError if a == b."""
        if a == b:
            raise ValueError("a and b must be different")
        return (f(b) - f(a)) / (b - a)


    def central_difference(f, x, h=1e-5):
        """Estimate the slope of f at x by looking a tiny step to each side."""
        return (f(x + h) - f(x - h)) / (2 * h)


    height = lambda t: 100 - 5 * t * t      # metres above the ground, seconds after letting go
    for a, b in [(0, 2), (1, 2), (1.9, 2), (1.99, 2)]:
        print("average speed from t =", a, "to", b, ":", round(average_rate(height, a, b), 3))
    print("speed at exactly t = 2:", round(central_difference(height, 2), 3))
  output: |
    average speed from t = 0 to 2 : -10.0
    average speed from t = 1 to 2 : -15.0
    average speed from t = 1.9 to 2 : -19.5
    average speed from t = 1.99 to 2 : -19.95
    speed at exactly t = 2: -20.0
  lines:
  - line: 14
    note: Shorter and shorter intervals ending at t = 2.
  - line: 16
    note: The estimate sits right on -20.
- title: Estimating limits
  intro: A hole in the graph still has a limit; a jump and a blow-up do not.
  code: |
    def limit_estimate(f, x, steps=6):
        """Walk toward x from both sides with steps 0.1, 0.01, ... and report the number f approaches.
        Returns None when the two sides disagree, or when f grows without bound."""
        left = right = None
        for k in range(1, steps + 1):
            h = 10.0 ** -k
            left, right = f(x - h), f(x + h)
        if abs(left) > 1e5 or abs(right) > 1e5 or abs(left - right) > 1e-3:
            return None
        return round((left + right) / 2, 4)


    f = lambda x: (x * x - 1) / (x - 1)
    print("f(2) =", f(2), "and f(1.001) =", round(f(1.001), 4))
    print("f is not defined at 1, but approaches", limit_estimate(f, 1))
    print("abs(x) / x near 0:", limit_estimate(lambda x: abs(x) / x, 0), "(the two sides disagree)")
    print("1 / x near 0:", limit_estimate(lambda x: 1 / x, 0), "(it grows without bound)")
  output: |
    f(2) = 3.0 and f(1.001) = 2.001
    f is not defined at 1, but approaches 2.0
    abs(x) / x near 0: None (the two sides disagree)
    1 / x near 0: None (it grows without bound)
  lines:
  - line: 15
    note: A hole in the graph, but a clear limit.
  - line: 17
    note: Blows up, so no limit.
- title: Speeds from readings and kinds of points
  intro: Average speeds from a table of positions, and a classifier for continuity.
  code: |
    def average_rate(f, a, b):
        """How fast f changes on average between a and b: (f(b) - f(a)) / (b - a). ValueError if a == b."""
        if a == b:
            raise ValueError("a and b must be different")
        return (f(b) - f(a)) / (b - a)


    def central_difference(f, x, h=1e-5):
        """Estimate the slope of f at x by looking a tiny step to each side."""
        return (f(x + h) - f(x - h)) / (2 * h)


    def average_speeds(times, positions):
        """The average speed during each gap between consecutive readings."""
        if len(times) != len(positions) or len(times) < 2:
            raise ValueError("need matching lists with at least two readings")
        return [(positions[i + 1] - positions[i]) / (times[i + 1] - times[i]) for i in range(len(times) - 1)]


    def fastest_interval(times, positions):
        """(start_time, end_time, speed) of the gap with the largest absolute speed; the earliest wins a tie."""
        speeds = average_speeds(times, positions)
        best = max(range(len(speeds)), key=lambda i: (abs(speeds[i]), -i))
        return times[best], times[best + 1], speeds[best]


    def classify_point(f, x):
        """Describe f near x: 'continuous', 'removable' (a single missing or misplaced point),
        'jump' (the two sides approach different numbers) or 'infinite' (it blows up)."""
        try:
            value = f(x)
        except ZeroDivisionError:
            value = None
        h = 1e-6
        left, right = f(x - h), f(x + h)
        if abs(left) > 1e5 or abs(right) > 1e5:
            return "infinite"
        if abs(left - right) > 1e-3:
            return "jump"
        limit = (left + right) / 2
        if value is None or abs(value - limit) > 1e-3:
            return "removable"
        return "continuous"


    times = [0, 1, 2, 3, 4]
    miles = [0, 30, 60, 75, 75]
    print("speeds:", average_speeds(times, miles))
    print("fastest stretch:", fastest_interval(times, miles))
    print(classify_point(lambda x: x * x, 2), classify_point(lambda x: abs(x) / x if x else 0, 0), classify_point(lambda x: 1 / x if x else 0, 0))
  output: |
    speeds: [30.0, 30.0, 15.0, 0.0]
    fastest stretch: (0, 1, 30.0)
    continuous jump infinite
  lines:
  - line: 48
    note: Miles per hour in each hour.
  - line: 50
    note: Continuous, jump, infinite.
playground:
  prompt: Pick a function and a point and print the function at x = a plus or minus 0.1, 0.01 and 0.001 to see where it heads.
  code: |
    print(3 * 0.001 + 1)
exercises:
- id: average-rate
  title: Average rate of change
  difficulty: 2
  prompt: Write `average_rate(f, a, b)` returning `(f(b) - f(a)) / (b - a)`. Raise `ValueError` if `a` and `b` are equal.
  starter: |
    def average_rate(f, a, b):
        pass
  tests:
  - name: lines have a constant rate
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert average_rate(lambda x: 3 * x + 1, 0, 10) == 3
      assert average_rate(lambda x: 3 * x + 1, -5, 5) == 3
      assert average_rate(lambda x: 7, 0, 4) == 0
  - name: curves have changing rates
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      sq = lambda x: x * x
      assert average_rate(sq, 0, 1) == 1 and average_rate(sq, 1, 2) == 3 and average_rate(sq, 2, 3) == 5
      assert average_rate(sq, 3, 1) == 4
      assert average_rate(sq, -1, 1) == 0
  - name: a and b must differ
    code: |
      try:
          average_rate(lambda x: x, 2, 2)
          raise AssertionError("accepted")
      except ValueError:
          pass
  hints:
  - Rise over run.
  solution: |
    def average_rate(f, a, b):
        """How fast f changes on average between a and b: (f(b) - f(a)) / (b - a). ValueError if a == b."""
        if a == b:
            raise ValueError("a and b must be different")
        return (f(b) - f(a)) / (b - a)
  explanation: Average rate is the slope of the line through two points.
- id: slope-estimate
  title: Slope at a point
  difficulty: 3
  prompt: 'The starter has `average_rate`. Write `central_difference(f, x, h=1e-5)`: the average rate of change between `x - h` and `x + h`, which estimates the slope at `x`. (Do it directly with the formula.)'
  starter: |
    def average_rate(f, a, b):
        return (f(b) - f(a)) / (b - a)


    def central_difference(f, x, h=1e-5):
        pass
  tests:
  - name: slopes
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert close(central_difference(lambda x: x * x, 3), 6, 1e-6)
      assert close(central_difference(lambda x: x ** 3, 2), 12, 1e-4)
      assert close(central_difference(lambda x: 5 * x - 2, 100), 5, 1e-5)
      assert close(central_difference(lambda x: 9, 4), 0, 1e-9)
  - name: negative and curved
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert close(central_difference(lambda x: -x * x, 2), -4, 1e-6)
      assert close(central_difference(math.sin, 0), 1, 1e-6)
      assert close(central_difference(math.exp, 0), 1, 1e-6)
      assert close(central_difference(lambda x: x * x, 3, 0.1), 6, 1e-6)
  hints:
  - '`(f(x + h) - f(x - h)) / (2 * h)`.'
  solution: |
    def average_rate(f, a, b):
        return (f(b) - f(a)) / (b - a)


    def central_difference(f, x, h=1e-5):
        """Estimate the slope of f at x by looking a tiny step to each side."""
        return (f(x + h) - f(x - h)) / (2 * h)
  explanation: Looking on both sides of the point is more accurate than looking on one.
- id: limit-estimate
  title: Estimating a limit
  difficulty: 4
  prompt: 'Write `limit_estimate(f, x, steps=6)`: for `k` from 1 to `steps` let `h = 10.0 ** -k` and compute `left = f(x - h)` and `right = f(x + h)`. After the loop, return `None` if either side has absolute value above `1e5` or the two differ by more than `1e-3`; otherwise return `round((left + right) / 2, 4)`.'
  starter: |
    def limit_estimate(f, x, steps=6):
        pass
  tests:
  - name: limits that exist
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert limit_estimate(lambda x: x * x, 3) == 9
      assert limit_estimate(lambda x: (x * x - 1) / (x - 1), 1) == 2
      assert limit_estimate(lambda x: 2 * x + 1, 0) == 1
      import math
      assert limit_estimate(lambda x: math.sin(x) / x, 0) == 1
  - name: limits that do not exist
    code: |
      assert limit_estimate(lambda x: abs(x) / x, 0) is None
      assert limit_estimate(lambda x: 1 / x, 0) is None
      assert limit_estimate(lambda x: 1 / (x * x), 0) is None
      import math
      assert limit_estimate(lambda x: math.floor(x), 1) is None
  hints:
  - Only the final, closest values need to be kept.
  solution: |
    def limit_estimate(f, x, steps=6):
        """Walk toward x from both sides with steps 0.1, 0.01, ... and report the number f approaches.
        Returns None when the two sides disagree, or when f grows without bound."""
        left = right = None
        for k in range(1, steps + 1):
            h = 10.0 ** -k
            left, right = f(x - h), f(x + h)
        if abs(left) > 1e5 or abs(right) > 1e5 or abs(left - right) > 1e-3:
            return None
        return round((left + right) / 2, 4)
  explanation: If both sides settle on one number, that is the limit; otherwise there is none.
- id: speeds
  title: Speeds from readings
  difficulty: 3
  prompt: 'Write `average_speeds(times, positions)`: the speed during each gap between consecutive readings (raise `ValueError` if the lists have different lengths or fewer than two readings). Write `fastest_interval(times, positions)` returning `(start_time, end_time, speed)` for the gap with the largest **absolute** speed; the earliest gap wins a tie. The speed keeps its sign.'
  starter: |
    def average_speeds(times, positions):
        pass


    def fastest_interval(times, positions):
        pass
  tests:
  - name: average speeds
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert average_speeds([0, 1, 3], [0, 10, 14]) == [10, 2]
      assert average_speeds([0, 2], [5, 5]) == [0]
      assert average_speeds([0, 1, 2], [0, -3, -3]) == [-3, 0]
      for bad in (([0], [0]), ([0, 1], [0])):
          try:
              average_speeds(*bad)
              raise AssertionError("accepted")
          except ValueError:
              pass
  - name: fastest interval
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert fastest_interval([0, 1, 3, 4], [0, 10, 14, 30]) == (3, 4, 16)
      assert fastest_interval([0, 1, 2], [0, -9, -10]) == (0, 1, -9)
      assert fastest_interval([0, 1, 2], [0, 5, 10]) == (0, 1, 5)
  hints:
  - '`max(range(n), key=lambda i: (abs(speeds[i]), -i))` breaks ties toward the first.'
  solution: |
    def average_speeds(times, positions):
        """The average speed during each gap between consecutive readings."""
        if len(times) != len(positions) or len(times) < 2:
            raise ValueError("need matching lists with at least two readings")
        return [(positions[i + 1] - positions[i]) / (times[i + 1] - times[i]) for i in range(len(times) - 1)]


    def fastest_interval(times, positions):
        """(start_time, end_time, speed) of the gap with the largest absolute speed; the earliest wins a tie."""
        speeds = average_speeds(times, positions)
        best = max(range(len(speeds)), key=lambda i: (abs(speeds[i]), -i))
        return times[best], times[best + 1], speeds[best]
  explanation: A table of positions already contains average speeds.
- id: classify
  title: 'Capstone: continuity detector'
  difficulty: 5
  prompt: Write `classify_point(f, x)` returning one of four strings. Get `value = f(x)` (use `None` if it raises `ZeroDivisionError`) and compute `left = f(x - 1e-6)`, `right = f(x + 1e-6)`. If either side has absolute value above `1e5` return `'infinite'`; if they differ by more than `1e-3` return `'jump'`; let `limit = (left + right) / 2`; if `value` is `None` or differs from the limit by more than `1e-3` return `'removable'`; otherwise return `'continuous'`.
  starter: |
    def classify_point(f, x):
        pass
  tests:
  - name: kinds of points
    code: |
      assert classify_point(lambda x: x * x, 2) == "continuous"
      assert classify_point(lambda x: 2 * x + 1, 0) == "continuous"
      assert classify_point(lambda x: (x * x - 1) / (x - 1) if x != 1 else 5, 1) == "removable"
      assert classify_point(lambda x: (x * x - 1) / (x - 1) if x != 1 else 2, 1) == "continuous"
  - name: jumps and blow-ups
    code: |
      import math
      assert classify_point(lambda x: abs(x) / x if x != 0 else 0, 0) == "jump"
      assert classify_point(math.floor, 1) == "jump"
      assert classify_point(lambda x: 1 / x if x != 0 else 0, 0) == "infinite"
      assert classify_point(lambda x: 1 / (x * x) if x != 0 else 0, 0) == "infinite"
  hints:
  - Check the cases in that order.
  solution: |
    def classify_point(f, x):
        """Describe f near x: 'continuous', 'removable' (a single missing or misplaced point),
        'jump' (the two sides approach different numbers) or 'infinite' (it blows up)."""
        try:
            value = f(x)
        except ZeroDivisionError:
            value = None
        h = 1e-6
        left, right = f(x - h), f(x + h)
        if abs(left) > 1e5 or abs(right) > 1e5:
            return "infinite"
        if abs(left - right) > 1e-3:
            return "jump"
        limit = (left + right) / 2
        if value is None or abs(value - limit) > 1e-3:
            return "removable"
        return "continuous"
  explanation: Every way a function can be broken at a point is one of these three.
commonMistakes:
- title: Dividing by zero to get an instant speed
  explanation: You shrink the interval toward zero and watch where the average heads; you never reach it.
- title: Thinking the limit equals the value
  explanation: The limit is where f heads, which may differ from f(a) or exist when f(a) does not.
- title: Using only one side
  explanation: A limit needs both sides to agree.
- title: Using too tiny a step
  explanation: Computers round, so a step of 1e-15 can destroy accuracy; around 1e-5 works well for slopes.
summary:
- Average rate of change is rise over run.
- Instant rates come from shrinking the interval and watching where the average heads.
- A limit is the value a function approaches.
- Limits can fail by jumping or blowing up.
- Continuous means the limit exists and equals the value.
