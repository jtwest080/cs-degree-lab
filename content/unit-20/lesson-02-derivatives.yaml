id: u20-derivatives
title: Derivatives and the Rules of Differentiation
minutes: 80
objective: 'Turn the limit idea into the derivative, the exact instantaneous rate of change, and learn the handful of rules that let you differentiate almost any formula: the power rule, sum rule, product rule, quotient rule and chain rule. You will even build a program that differentiates formulas for you.'
outcomes:
- Define the derivative as a limit of average rates
- Use the power, sum, product, quotient and chain rules
- Read the derivative as the slope of the tangent line
- Check a derivative formula numerically
- Write a tiny symbolic differentiator
sections:
- heading: The derivative
  body: |-
    Last lesson we shrank an interval around a point and watched the average rate settle on a number. That number is the **derivative** of `f` at `x`, written `f'(x)` (say "f prime of x"): `f'(x) = limit of (f(x + h) - f(x)) / h as h approaches 0`. It is the exact instantaneous rate of change, and graphically the slope of the **tangent line**, the straight line that just touches the curve at that point.

    For `f(x) = x^2`: `(f(x + h) - f(x)) / h = ((x + h)^2 - x^2) / h = (2xh + h^2) / h = 2x + h`. As `h` shrinks to 0 this becomes `2x`. So the derivative of `x^2` is `2x`: the slope at x = 3 is 6, at x = -1 it is -2 (going downhill), and at x = 0 it is 0 (the flat bottom of the bowl). Doing this limit by hand for every function would be exhausting, which is why we have rules.
- heading: The rules
  body: |-
    Each of these can be proved from the limit definition; we use them freely. The **power rule**: the derivative of `x^n` is `n x^(n-1)` (so `x^3` becomes `3x^2`, and a constant becomes 0). The **constant multiple and sum rules**: `(c f)' = c f'` and `(f + g)' = f' + g'`. So a polynomial is differentiated term by term: `5 + 3x^2 + 2x^3` becomes `6x + 6x^2`.

    The **product rule**: `(f g)' = f' g + f g'`. It is **not** `f' g'`. Think of a rectangle with sides `f` and `g`: when both grow a little, the area grows by a strip along each side. The **quotient rule**: `(f / g)' = (f' g - f g') / g^2`. The **chain rule** is for a function inside a function: `(f(g(x)))' = f'(g(x)) * g'(x)`. Differentiate the outer function (leaving the inner one alone), then multiply by the derivative of the inner. For `sin(x^2)` that gives `cos(x^2) * 2x`.

    Three more facts to remember: `sin' = cos`, `cos' = -sin`, and `exp' = exp` (the number `e` is defined so that its exponential function is its own derivative). The natural logarithm `ln` has derivative `1 / x`.
- heading: Checking and automating
  body: |-
    Because we can estimate a slope numerically (lesson 1), we can **check** a derivative formula: compare it with `(f(x + h) - f(x - h)) / (2h)` at several points. Professional engineers do this ("gradient checking") when writing machine-learning code, where a wrong derivative silently ruins training.

    We can also teach the computer the rules. Represent a formula as a tree of tuples, like `("sin", ("pow", ("x",), 2))` for `sin(x^2)`, and write a function that rewrites such a tree into the tree of its derivative, one rule per kind of node. This is **symbolic differentiation**, the basic idea behind computer algebra systems. (A different approach, **automatic differentiation**, differentiates program code as it runs and is how deep-learning libraries work. They both rely on the chain rule.)
examples:
- title: Differentiating polynomials
  intro: The power rule and the product rule on coefficient lists.
  code: |
    def poly_eval(coeffs, x):
        """Value of c0 + c1*x + c2*x^2 + ... (coefficients listed from the constant term up)."""
        return sum(c * x ** k for k, c in enumerate(coeffs))


    def derivative_poly(coeffs):
        """Power rule: the term c*x^k becomes k*c*x^(k-1). The derivative of a constant is [0]."""
        if len(coeffs) <= 1:
            return [0]
        return [k * c for k, c in enumerate(coeffs)][1:]


    def poly_add(p, q):
        n = max(len(p), len(q))
        p = p + [0] * (n - len(p))
        q = q + [0] * (n - len(q))
        return [a + b for a, b in zip(p, q)]


    def poly_mul(p, q):
        result = [0] * (len(p) + len(q) - 1)
        for i, a in enumerate(p):
            for j, b in enumerate(q):
                result[i + j] += a * b
        return result


    def product_rule(p, q):
        """The derivative of p(x) * q(x) from the product rule: p' q + p q'."""
        result = poly_add(poly_mul(derivative_poly(p), q), poly_mul(p, derivative_poly(q)))
        while len(result) > 1 and result[-1] == 0:      # drop highest-power terms whose coefficient is 0
            result.pop()
        return result


    p = [5, 0, 3, 2]            # 5 + 3x^2 + 2x^3
    print("p'(x) coefficients:", derivative_poly(p))
    print("p(2) =", poly_eval(p, 2), "and the slope there is", poly_eval(derivative_poly(p), 2))
    a, b = [0, 1], [1, 1]       # x and x + 1
    print("(x)(x + 1) =", poly_mul(a, b))
    print("product rule gives", product_rule(a, b), "= derivative of the product", derivative_poly(poly_mul(a, b)))
  output: |
    p'(x) coefficients: [0, 6, 6]
    p(2) = 33 and the slope there is 36
    (x)(x + 1) = [0, 1, 1]
    product rule gives [1, 2] = derivative of the product [1, 2]
  lines:
  - line: 36
    note: Coefficients from the constant term up.
  - line: 41
    note: Two routes, one answer.
- title: Tangent lines and gradient checking
  intro: Compare a derivative formula with the numerical slope; a wrong formula is caught.
  code: |
    def central_difference(f, x, h=1e-5):
        return (f(x + h) - f(x - h)) / (2 * h)


    def tangent_line(f, x0):
        """The line that just touches f at x0: returns (slope, intercept) of y = slope*x + intercept."""
        slope = central_difference(f, x0)
        return slope, f(x0) - slope * x0


    def check_derivative(f, df, xs, tol=1e-4):
        """True when the claimed derivative df agrees with the numerical slope of f at every x in xs."""
        return all(abs(df(x) - central_difference(f, x)) <= tol for x in xs)


    f = lambda x: x ** 3 - 2 * x
    m, b = tangent_line(f, 2)
    print("tangent at x = 2: y =", round(m, 3), "* x +", round(b, 3))
    print("our formula 3x^2 - 2 is right:", check_derivative(f, lambda x: 3 * x * x - 2, [-2, -1, 0, 1, 2]))
    print("a wrong formula 3x^2 - 1 is right:", check_derivative(f, lambda x: 3 * x * x - 1, [-2, -1, 0, 1, 2]))
  output: |
    tangent at x = 2: y = 10.0 * x + -16.0
    our formula 3x^2 - 2 is right: True
    a wrong formula 3x^2 - 1 is right: False
  lines:
  - line: 17
    note: The line that touches the curve at x = 2.
  - line: 20
    note: A wrong formula fails the check.
- title: A symbolic differentiator
  intro: The chain rule turns sin(x^2) into cos(x^2) times 2x.
  code: |
    import math


    def eval_expr(e, x):
        kind = e[0]
        if kind == "x":
            return x
        if kind == "num":
            return e[1]
        if kind == "add":
            return eval_expr(e[1], x) + eval_expr(e[2], x)
        if kind == "mul":
            return eval_expr(e[1], x) * eval_expr(e[2], x)
        if kind == "div":
            return eval_expr(e[1], x) / eval_expr(e[2], x)
        if kind == "pow":
            return eval_expr(e[1], x) ** e[2]
        if kind == "sin":
            return math.sin(eval_expr(e[1], x))
        if kind == "cos":
            return math.cos(eval_expr(e[1], x))
        if kind == "exp":
            return math.exp(eval_expr(e[1], x))
        if kind == "ln":
            return math.log(eval_expr(e[1], x))
        raise ValueError("unknown expression: " + str(kind))


    def diff(e):
        """Derivative of any expression tree (x, num, add, mul, div, pow, sin, cos, exp, ln), using the chain rule."""
        kind = e[0]
        if kind == "x":
            return ("num", 1)
        if kind == "num":
            return ("num", 0)
        if kind == "add":
            return ("add", diff(e[1]), diff(e[2]))
        if kind == "mul":
            return ("add", ("mul", diff(e[1]), e[2]), ("mul", e[1], diff(e[2])))
        if kind == "div":
            top, bottom = e[1], e[2]
            numerator = ("add", ("mul", diff(top), bottom), ("mul", ("num", -1), ("mul", top, diff(bottom))))
            return ("div", numerator, ("pow", bottom, 2))
        if kind == "pow":
            n = e[2]
            return ("mul", ("mul", ("num", n), ("pow", e[1], n - 1)), diff(e[1]))
        if kind == "sin":
            return ("mul", ("cos", e[1]), diff(e[1]))
        if kind == "cos":
            return ("mul", ("mul", ("num", -1), ("sin", e[1])), diff(e[1]))
        if kind == "exp":
            return ("mul", ("exp", e[1]), diff(e[1]))
        if kind == "ln":
            return ("div", diff(e[1]), e[1])
        raise ValueError("unknown expression: " + str(kind))


    def show(e):
        kind = e[0]
        if kind == "x":
            return "x"
        if kind == "num":
            return str(e[1])
        if kind in ("add", "mul", "div"):
            sign = {"add": " + ", "mul": " * ", "div": " / "}[kind]
            return "(" + show(e[1]) + sign + show(e[2]) + ")"
        if kind == "pow":
            return show(e[1]) + "^" + str(e[2])
        return kind + "(" + show(e[1]) + ")"


    f = ("sin", ("pow", ("x",), 2))
    print("f(x) =", show(f))
    print("f'(x) =", show(diff(f)))
    print("f'(1) =", round(eval_expr(diff(f), 1), 6))
    print("slope check:", round((eval_expr(f, 1 + 1e-6) - eval_expr(f, 1 - 1e-6)) / 2e-6, 6))
  output: |
    f(x) = sin(x^2)
    f'(x) = (cos(x^2) * ((2 * x^1) * 1))
    f'(1) = 1.080605
    slope check: 1.080605
  lines:
  - line: 72
    note: The formula as a tree.
  - line: 74
    note: 'Chain rule: cos(x^2) times the derivative of x^2.'
