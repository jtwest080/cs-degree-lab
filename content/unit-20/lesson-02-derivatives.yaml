      assert derivative_at([1, 2, 3], 2) == 14
      assert derivative_at([5], 3) == 0
      assert derivative_at([0, 0, 0, 1], 2) == 12
  solution: |
    def derivative_at(coeffs, x):
        return sum(k * c * x ** (k - 1) for k, c in enumerate(coeffs) if k > 0)
