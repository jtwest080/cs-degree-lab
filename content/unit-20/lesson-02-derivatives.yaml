  starter: |
    import math


    def eval_expr(e, x):
        kind = e[0]
        if kind == "x":
            return x
        if kind == "num":
            return e[1]
        if kind == "add":
            return eval_expr(e[1], x) + eval_expr(e[2], x)
        if kind == "mul":
            return eval_expr(e[1], x) * eval_expr(e[2], x)
        if kind == "div":
            return eval_expr(e[1], x) / eval_expr(e[2], x)
        if kind == "pow":
            return eval_expr(e[1], x) ** e[2]
        if kind == "sin":
            return math.sin(eval_expr(e[1], x))
        if kind == "cos":
            return math.cos(eval_expr(e[1], x))
        if kind == "exp":
            return math.exp(eval_expr(e[1], x))
        if kind == "ln":
            return math.log(eval_expr(e[1], x))
        raise ValueError("unknown expression: " + str(kind))


    def diff_basic(e):
        pass
  tests:
  - name: rules
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      def num(e, x, h=1e-5):
          return (eval_expr(e, x + h) - eval_expr(e, x - h)) / (2 * h)
      X = ("x",)
      cases = [
          ("pow", X, 2),
          ("pow", X, 5),
          ("add", ("pow", X, 3), ("mul", ("num", 4), X)),
          ("mul", ("pow", X, 2), ("add", X, ("num", 1))),
          ("pow", ("add", ("mul", ("num", 2), X), ("num", 1)), 4),
          ("add", ("num", 9), ("pow", X, 1)),
          ("mul", ("add", X, ("num", 2)), ("add", X, ("num", -3))),
      ]
      for e in cases:
          d = diff_basic(e)
          for x in (-1.5, 0.5, 2):
              assert abs(eval_expr(d, x) - num(e, x)) < 1e-4 * max(1, abs(num(e, x))), (e, x)
      assert eval_expr(diff_basic(("pow", X, 2)), 3) == 6
      assert eval_expr(diff_basic(("num", 5)), 3) == 0
  - name: unknown
    code: |
      try:
          diff_basic(("sin", ("x",)))
          raise AssertionError("accepted")
      except ValueError:
          pass
  hints:
  - 'The result does not have to be simplified: `(''mul'', (''num'', 0), ...)` is fine.'
  solution: |
    import math


    def eval_expr(e, x):
        kind = e[0]
        if kind == "x":
            return x
        if kind == "num":
            return e[1]
        if kind == "add":
            return eval_expr(e[1], x) + eval_expr(e[2], x)
        if kind == "mul":
            return eval_expr(e[1], x) * eval_expr(e[2], x)
        if kind == "div":
            return eval_expr(e[1], x) / eval_expr(e[2], x)
        if kind == "pow":
            return eval_expr(e[1], x) ** e[2]
        if kind == "sin":
            return math.sin(eval_expr(e[1], x))
        if kind == "cos":
            return math.cos(eval_expr(e[1], x))
        if kind == "exp":
            return math.exp(eval_expr(e[1], x))
        if kind == "ln":
            return math.log(eval_expr(e[1], x))
        raise ValueError("unknown expression: " + str(kind))


    def diff_basic(e):
        """Derivative of an expression tree built from x, numbers, add, mul and pow (whole-number powers)."""
        kind = e[0]
        if kind == "x":
            return ("num", 1)
        if kind == "num":
            return ("num", 0)
        if kind == "add":
            return ("add", diff_basic(e[1]), diff_basic(e[2]))
        if kind == "mul":
            return ("add", ("mul", diff_basic(e[1]), e[2]), ("mul", e[1], diff_basic(e[2])))
        if kind == "pow":
            n = e[2]
            return ("mul", ("mul", ("num", n), ("pow", e[1], n - 1)), diff_basic(e[1]))
        raise ValueError("unknown expression: " + str(kind))
  explanation: Each rule is one line; the recursion does the rest.
- id: diff-full
  title: 'Capstone: differentiate anything'
  difficulty: 5
  prompt: 'The starter has `eval_expr`, which also understands `(''div'', a, b)`, `(''sin'', a)`, `(''cos'', a)`, `(''exp'', a)` and `(''ln'', a)`. Write `diff(e)` for all of these plus the earlier node kinds: quotient rule for `div`, and the chain rule for `sin` (`cos(a) * a''`), `cos` (`-sin(a) * a''`), `exp` (`exp(a) * a''`) and `ln` (`a'' / a`). Raise `ValueError` for an unknown node.'
  starter: |
    import math


    def eval_expr(e, x):
        kind = e[0]
        if kind == "x":
            return x
        if kind == "num":
            return e[1]
        if kind == "add":
            return eval_expr(e[1], x) + eval_expr(e[2], x)
        if kind == "mul":
            return eval_expr(e[1], x) * eval_expr(e[2], x)
        if kind == "div":
            return eval_expr(e[1], x) / eval_expr(e[2], x)
        if kind == "pow":
            return eval_expr(e[1], x) ** e[2]
