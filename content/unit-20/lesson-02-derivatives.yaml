      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      p = [2, -3, 0, 1, 5]
      d = derivative_poly(p)
      for x in (-2, -0.5, 0, 1, 3):
          h = 1e-5
          slope = (poly_eval(p, x + h) - poly_eval(p, x - h)) / (2 * h)
          assert abs(poly_eval(d, x) - slope) < 1e-4 * max(1, abs(slope))
  hints:
  - '`[k * c for k, c in enumerate(coeffs)]` multiplies every coefficient by its power; then drop the first entry.'
  solution: |
    def poly_eval(coeffs, x):
        """Value of c0 + c1*x + c2*x^2 + ... (coefficients listed from the constant term up)."""
        return sum(c * x ** k for k, c in enumerate(coeffs))


    def derivative_poly(coeffs):
        """Power rule: the term c*x^k becomes k*c*x^(k-1). The derivative of a constant is [0]."""
        if len(coeffs) <= 1:
            return [0]
