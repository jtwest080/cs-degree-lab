- id: product-rule
  title: Sums and the product rule
  difficulty: 4
  prompt: 'The starter has `derivative_poly`. Write `poly_add(p, q)` (add coefficients, padding the shorter list with zeros), `poly_mul(p, q)` (multiply two polynomials: the product of `a * x^i` and `b * x^j` contributes `a * b` to position `i + j`) and `product_rule(p, q)` returning `p'' q + p q''` with any zero coefficients at the end of the list removed (but keep at least one entry). It must equal the derivative of the product.'
  starter: |
    def derivative_poly(coeffs):
        if len(coeffs) <= 1:
            return [0]
        return [k * c for k, c in enumerate(coeffs)][1:]


    def poly_add(p, q):
        pass


    def poly_mul(p, q):
        pass


    def product_rule(p, q):
        pass
  tests:
  - name: adding and multiplying
    code: |
      assert poly_add([1, 2], [3, 4, 5]) == [4, 6, 5]
      assert poly_add([1], [1]) == [2]
      assert poly_mul([1, 1], [1, 1]) == [1, 2, 1]
      assert poly_mul([0, 1], [0, 1]) == [0, 0, 1]
      assert poly_mul([2], [3, 4]) == [6, 8]
      assert poly_mul([1, 1], [-1, 1]) == [-1, 0, 1]
  - name: product rule
    code: |
      assert product_rule([0, 1], [0, 1]) == [0, 2]
      assert product_rule([1, 1], [1, 1]) == [2, 2]
      p, q = [1, 2, 3], [0, 4, 0, 1]
      assert product_rule(p, q) == derivative_poly(poly_mul(p, q))
      assert product_rule([5], [0, 1]) == [5]
      import itertools
      for p, q in itertools.product([[1, 2], [3, 0, 1], [0, 1, 2, 3]], repeat=2):
          assert product_rule(p, q) == derivative_poly(poly_mul(p, q))
  hints:
  - The product has `len(p) + len(q) - 1` coefficients.
  solution: |
    def derivative_poly(coeffs):
        if len(coeffs) <= 1:
            return [0]
        return [k * c for k, c in enumerate(coeffs)][1:]


    def poly_add(p, q):
        n = max(len(p), len(q))
        p = p + [0] * (n - len(p))
        q = q + [0] * (n - len(q))
        return [a + b for a, b in zip(p, q)]


    def poly_mul(p, q):
        result = [0] * (len(p) + len(q) - 1)
        for i, a in enumerate(p):
            for j, b in enumerate(q):
                result[i + j] += a * b
        return result


    def product_rule(p, q):
        """The derivative of p(x) * q(x) from the product rule: p' q + p q'."""
        result = poly_add(poly_mul(derivative_poly(p), q), poly_mul(p, derivative_poly(q)))
        while len(result) > 1 and result[-1] == 0:      # drop highest-power terms whose coefficient is 0
            result.pop()
        return result
  explanation: Two ways to differentiate a product give the same answer, which is a nice check on the rule.
- id: tangent
  title: Tangent lines and gradient checks
  difficulty: 3
  prompt: 'The starter has `central_difference`. Write `tangent_line(f, x0)` returning `(slope, intercept)` of the line `y = slope * x + intercept` that touches `f` at `x0` (the intercept is `f(x0) - slope * x0`), and `check_derivative(f, df, xs, tol=1e-4)`: `True` when `df(x)` is within `tol` of the numerical slope of `f` at every `x` in `xs`.'
  starter: |
    def central_difference(f, x, h=1e-5):
        return (f(x + h) - f(x - h)) / (2 * h)


    def tangent_line(f, x0):
        pass


    def check_derivative(f, df, xs, tol=1e-4):
        pass
  tests:
  - name: tangent lines
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      m, b = tangent_line(lambda x: x * x, 3)
      assert close(m, 6, 1e-6) and close(b, -9, 1e-4)
      m, b = tangent_line(lambda x: 2 * x + 7, 10)
      assert close(m, 2, 1e-6) and close(b, 7, 1e-4)
      m, b = tangent_line(lambda x: x ** 3, 1)
      assert close(m, 3, 1e-4) and close(b, -2, 1e-4)
  - name: checking derivatives
    code: |
      import math
      assert check_derivative(lambda x: x ** 3, lambda x: 3 * x * x, [-2, 0, 1.5]) is True
      assert check_derivative(lambda x: x ** 3, lambda x: 2 * x, [-2, 0, 1.5]) is False
      assert check_derivative(math.sin, math.cos, [0, 1, 2, 3]) is True
      assert check_derivative(math.sin, lambda x: -math.cos(x), [0, 1]) is False
      assert check_derivative(math.exp, math.exp, [0, 1, -1]) is True
      assert check_derivative(lambda x: x, lambda x: 1, []) is True
  hints:
  - The tangent line passes through the point (x0, f(x0)) with the slope you found.
  solution: |
    def central_difference(f, x, h=1e-5):
        return (f(x + h) - f(x - h)) / (2 * h)


    def tangent_line(f, x0):
        """The line that just touches f at x0: returns (slope, intercept) of y = slope*x + intercept."""
        slope = central_difference(f, x0)
        return slope, f(x0) - slope * x0


    def check_derivative(f, df, xs, tol=1e-4):
        """True when the claimed derivative df agrees with the numerical slope of f at every x in xs."""
        return all(abs(df(x) - central_difference(f, x)) <= tol for x in xs)
  explanation: A wrong derivative formula is caught immediately by comparing with numerical slopes.
- id: diff-basic
