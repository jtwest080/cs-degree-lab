  solution: |
    import math


    def eval_expr(e, x):
        kind = e[0]
        if kind == "x":
            return x
        if kind == "num":
            return e[1]
        if kind == "add":
            return eval_expr(e[1], x) + eval_expr(e[2], x)
        if kind == "mul":
            return eval_expr(e[1], x) * eval_expr(e[2], x)
        if kind == "div":
            return eval_expr(e[1], x) / eval_expr(e[2], x)
        if kind == "pow":
            return eval_expr(e[1], x) ** e[2]
        if kind == "sin":
            return math.sin(eval_expr(e[1], x))
        if kind == "cos":
            return math.cos(eval_expr(e[1], x))
        if kind == "exp":
            return math.exp(eval_expr(e[1], x))
        if kind == "ln":
            return math.log(eval_expr(e[1], x))
        raise ValueError("unknown expression: " + str(kind))


    def diff(e):
        """Derivative of any expression tree (x, num, add, mul, div, pow, sin, cos, exp, ln), using the chain rule."""
        kind = e[0]
        if kind == "x":
            return ("num", 1)
        if kind == "num":
            return ("num", 0)
        if kind == "add":
            return ("add", diff(e[1]), diff(e[2]))
        if kind == "mul":
            return ("add", ("mul", diff(e[1]), e[2]), ("mul", e[1], diff(e[2])))
        if kind == "div":
            top, bottom = e[1], e[2]
            numerator = ("add", ("mul", diff(top), bottom), ("mul", ("num", -1), ("mul", top, diff(bottom))))
            return ("div", numerator, ("pow", bottom, 2))
        if kind == "pow":
            n = e[2]
            return ("mul", ("mul", ("num", n), ("pow", e[1], n - 1)), diff(e[1]))
        if kind == "sin":
            return ("mul", ("cos", e[1]), diff(e[1]))
        if kind == "cos":
            return ("mul", ("mul", ("num", -1), ("sin", e[1])), diff(e[1]))
        if kind == "exp":
            return ("mul", ("exp", e[1]), diff(e[1]))
        if kind == "ln":
            return ("div", diff(e[1]), e[1])
        raise ValueError("unknown expression: " + str(kind))
  explanation: This is a miniature computer algebra system.
commonMistakes:
- title: Using f' g' for the product rule
  explanation: The product rule is f' g + f g'.
- title: Forgetting the chain rule's inner derivative
  explanation: The derivative of sin(x^2) is cos(x^2) times 2x, not just cos(x^2).
- title: Differentiating x^n as n x^n
  explanation: 'Lower the exponent by one: n x^(n-1).'
- title: Thinking the derivative of a constant is the constant
  explanation: A constant never changes, so its derivative is 0.
summary:
- The derivative is the limit of average rates, the slope of the tangent line.
- Power, sum, product, quotient and chain rules cover almost every formula.
- sin' = cos, cos' = -sin, exp' = exp, ln' = 1/x.
- Always check a derivative against a numerical slope.
- Formulas can be differentiated by a program.
