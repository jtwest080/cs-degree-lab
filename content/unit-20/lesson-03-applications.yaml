            return lo
        if fhi == 0:
            return hi
        if flo * fhi > 0:
            raise ValueError("f must change sign between lo and hi")
        while hi - lo > tol:
            mid = (lo + hi) / 2
            fm = f(mid)
            if fm == 0:
                return mid
            if flo * fm < 0:
                hi = mid
            else:
                lo, flo = mid, fm
        return (lo + hi) / 2


    def critical_points(f, lo, hi, n=2000):
        """Places in (lo, hi) where the slope is 0, as a sorted list of (x, kind) with kind 'min' or 'max'.
        Scan the slope on a grid and, wherever it changes sign, find the zero with bisection."""
        step = (hi - lo) / n
        xs = [lo + (i + 0.5) * step for i in range(n)]
        result = []
        for a, b in zip(xs, xs[1:]):
            da, db = slope_at(f, a), slope_at(f, b)
            if da * db < 0:
                x = bisection(lambda t: slope_at(f, t), a, b)
                result.append((x, "min" if da < 0 else "max"))
        return result


    def maximize(f, lo, hi):
        """The (x, value) with the largest f on [lo, hi]: check both ends and every critical point."""
        candidates = [lo, hi] + [x for x, kind in critical_points(f, lo, hi)]
        best = max(candidates, key=f)
        return best, f(best)


    def box_volume(side, cut):
        """Cut squares of size `cut` from the corners of a square sheet and fold up the sides."""
        return cut * (side - 2 * cut) ** 2


    def best_box(side):
        """The corner cut (x, volume) that makes the open box hold the most. The cut can be anything from 0 to side/2."""
        return maximize(lambda c: box_volume(side, c), 0, side / 2)
  explanation: Optimization is checking every place the best answer could be hiding.
commonMistakes:
- title: Starting Newton's method where the slope is 0
  explanation: The tangent line is flat and never crosses the axis.
- title: Forgetting the endpoints when maximizing
  explanation: The best value on an interval may be at an end.
- title: Using a huge learning rate
  explanation: Steps overshoot the valley and the values explode.
- title: Assuming gradient descent finds the lowest valley
  explanation: It only finds a nearby one.
- title: Using bisection on an interval with no sign change
  explanation: It cannot know a root exists; check the signs first.
summary:
- Bisection halves an interval; Newton slides down tangent lines and converges far faster.
- Critical points are where the slope is 0; the sign change of the slope says min or max.
- Check critical points and the endpoints to find the best value on an interval.
- Optimization turns a real problem into a function to maximise.
- Gradient descent takes downhill steps; the learning rate matters.
