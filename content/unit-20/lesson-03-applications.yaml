exercises:
- id: bisection
  title: Bisection
  difficulty: 3
  prompt: 'Write `bisection(f, lo, hi, tol=1e-9)`. If `f(lo)` or `f(hi)` is 0 return that end. If they have the same sign raise `ValueError`. Otherwise keep halving: look at the midpoint and keep the half whose ends have opposite signs, until `hi - lo <= tol`; return the middle of what is left. (The ends may be given in either order.)'
  starter: |
    def bisection(f, lo, hi, tol=1e-9):
        pass
  tests:
  - name: roots
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert close(bisection(lambda x: x * x - 2, 0, 2), 2 ** 0.5, 1e-8)
      assert close(bisection(lambda x: x - 5, 0, 10), 5)
      assert close(bisection(math.cos, 0, 3), math.pi / 2, 1e-8)
      assert close(bisection(lambda x: x ** 3 - 8, 0, 5), 2, 1e-8)
      assert close(bisection(lambda x: 4 - x, 10, 0), 4, 1e-8)
  - name: endpoint roots and bad intervals
    code: |
      assert bisection(lambda x: x, 0, 3) == 0 and bisection(lambda x: x - 3, 0, 3) == 3
      for lo, hi in ((1, 2), (-3, -1)):
          try:
              bisection(lambda x: x * x + 1, lo, hi)
              raise AssertionError("accepted")
          except ValueError:
              pass
  hints:
  - Keep `lo` and `flo`; when the midpoint has the same sign as `lo` move `lo` up, else move `hi` down.
  - 'If `lo` is bigger than `hi` the loop never runs: swap them first.'
  solution: |
    def bisection(f, lo, hi, tol=1e-9):
        """Find x with f(x) = 0 by repeatedly halving an interval whose ends have opposite signs.
        ValueError if f(lo) and f(hi) have the same sign (there may be no root in between)."""
        if lo > hi:
            lo, hi = hi, lo
        flo, fhi = f(lo), f(hi)
        if flo == 0:
            return lo
        if fhi == 0:
            return hi
        if flo * fhi > 0:
            raise ValueError("f must change sign between lo and hi")
        while hi - lo > tol:
            mid = (lo + hi) / 2
            fm = f(mid)
            if fm == 0:
                return mid
            if flo * fm < 0:
                hi = mid
            else:
                lo, flo = mid, fm
        return (lo + hi) / 2
  explanation: Halve the interval, keep the half that straddles zero.
- id: newton
  title: Newton's method
  difficulty: 4
  prompt: 'Write `newton(f, df, x0, tol=1e-12, max_iter=50)`: repeat `step = f(x) / df(x)` and `x -= step`; stop and return `x` when `abs(step) < tol`. Raise `ValueError` if the slope `df(x)` is exactly 0 or if `max_iter` steps pass without converging.'
  starter: |
    def newton(f, df, x0, tol=1e-12, max_iter=50):
        pass
  tests:
  - name: square roots and more
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert close(newton(lambda x: x * x - 2, lambda x: 2 * x, 1), 2 ** 0.5, 1e-10)
      assert close(newton(lambda x: x * x - 9, lambda x: 2 * x, 10), 3, 1e-10)
      assert close(newton(lambda x: math.cos(x) - x, lambda x: -math.sin(x) - 1, 1), 0.7390851332, 1e-8)
      assert close(newton(lambda x: x ** 3 - x - 2, lambda x: 3 * x * x - 1, 1.5), 1.5213797068, 1e-8)
  - name: failure
    code: |
      try:
          newton(lambda x: x * x - 2, lambda x: 2 * x, 0)
          raise AssertionError("accepted a zero slope")
      except ValueError:
          pass
      try:
          newton(lambda x: x * x + 1, lambda x: 2 * x, 1, max_iter=20)
          raise AssertionError("accepted a function with no root")
      except ValueError:
          pass
  hints:
  - Check for a zero slope before dividing.
  solution: |
    def newton(f, df, x0, tol=1e-12, max_iter=50):
        """Newton's method: slide down the tangent line to where it crosses zero, x <- x - f(x)/f'(x), and repeat.
        ValueError if the slope becomes 0 or no answer is found within max_iter steps."""
        x = x0
        for _ in range(max_iter):
            slope = df(x)
            if slope == 0:
                raise ValueError("the slope is zero; the tangent never crosses the axis")
            step = f(x) / slope
            x -= step
            if abs(step) < tol:
                return x
        raise ValueError("did not converge")
  explanation: Each tangent-line crossing is a better guess.
- id: gradient-descent
  title: Gradient descent
  difficulty: 3
  prompt: 'Write `gradient_descent_1d(df, x0, rate=0.1, steps=100)`: start at `x0` and, `steps` times, replace `x` by `x - rate * df(x)`. Return the final `x`.'
  starter: |
    def gradient_descent_1d(df, x0, rate=0.1, steps=100):
        pass
  tests:
  - name: finds the bottom of a bowl
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert close(gradient_descent_1d(lambda x: 2 * (x - 3), 0), 3, 1e-6)
      assert close(gradient_descent_1d(lambda x: 2 * x, 10, 0.25, 50), 0, 1e-6)
      assert close(gradient_descent_1d(lambda x: 4 * x ** 3 - 4 * x, 2, 0.05, 500), 1, 1e-6)
      assert close(gradient_descent_1d(lambda x: 4 * x ** 3 - 4 * x, -2, 0.05, 500), -1, 1e-6)
  - name: too large a step diverges
    code: |
      x = gradient_descent_1d(lambda x: 2 * x, 1, 1.5, 20)
      assert abs(x) > 1e5
      assert gradient_descent_1d(lambda x: 2 * x, 7, 0.1, 0) == 7
  hints:
  - That is the whole algorithm.
  solution: |
    def gradient_descent_1d(df, x0, rate=0.1, steps=100):
        """Walk downhill: repeat x <- x - rate * f'(x). Returns the final x."""
        x = x0
        for _ in range(steps):
            x -= rate * df(x)
        return x
  explanation: Downhill steps, scaled by the learning rate.
