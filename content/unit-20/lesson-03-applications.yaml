id: u20-applications
title: 'Using Derivatives: Roots, Peaks and Optimization'
minutes: 80
objective: Put derivatives to work. You will find where equations equal zero with Newton's method, find the highest and lowest points of a curve, solve a real optimization problem, and meet gradient descent, the algorithm that trains neural networks.
outcomes:
- Find roots by bisection and by Newton's method
- Explain why Newton's method works using tangent lines
- Find and classify minima and maxima using slopes
- Solve a practical optimization problem
- Describe gradient descent and the danger of a step size that is too big
sections:
- heading: Finding roots
  body: |-
    A **root** of `f` is a number `x` where `f(x) = 0`. Equations like `x^2 = 2` can be rewritten that way (`x^2 - 2 = 0`), and many have no neat formula. The simple, reliable method is **bisection**: if `f` is continuous and `f(lo)` and `f(hi)` have opposite signs, then (as you would draw it) the curve must cross zero somewhere between them. Look at the middle: whichever half still has opposite signs at its ends contains a root. Halve again and again. Each halving gives one more binary digit of the answer, so 30 steps give nine decimal places.

    **Newton's method** is much faster, and it uses derivatives. Stand at a guess `x` and draw the tangent line there. Where does that line cross zero? That crossing is usually a better guess: `x_new = x - f(x) / f'(x)`. Repeat. For `x^2 - 2` starting at 1 the guesses are 1.5, 1.41667, 1.4142157, 1.41421356...: the number of correct digits roughly **doubles** every step. It can fail: if the slope is 0 the tangent never crosses the axis, and a bad starting point can send the guesses off elsewhere. Your calculator and every math library use this kind of method to compute square roots.
- heading: Peaks and valleys
  body: |-
    Where a smooth curve is at the top of a hill or the bottom of a valley, it is momentarily flat, so its slope is 0. A point where `f'(x) = 0` is a **critical point**. To tell what kind it is, look at how the slope changes: if it goes from negative to positive as you move right, you were going down and now go up, so it is a **minimum**; positive to negative is a **maximum**. (The **second derivative**, the derivative of the derivative, says the same thing: positive means the curve bends like a bowl.) Our code scans the slope along a grid, notices each sign change and then pins down the exact spot with bisection.

    To find the **largest value on an interval**, compare the critical points **and the two ends of the interval**. The best answer can sit at an end: `x^2` on `[-1, 3]` is biggest at 3, where the slope is not even 0.
- heading: Optimization and gradient descent
  body: |-
    **Optimization** means finding the best choice: the largest profit, the cheapest design, the strongest shape. Write what you want to maximise as a function of the thing you control, then find its critical points. Example: cut a square of side `x` from each corner of a 12-by-12 sheet of cardboard and fold up the sides to make an open box. Its volume is `x * (12 - 2x)^2`. The best cut is `x = 2`, giving a volume of 128.

    For huge, messy problems there is no tidy formula, so we use **gradient descent**: stand somewhere, look at the slope, and take a small step downhill: `x <- x - rate * f'(x)`. The `rate` (also called the **learning rate**) decides the step size. Too small and it takes forever; too big and it overshoots and bounces ever farther away. This tiny loop, repeated over millions of numbers at once, is how neural networks learn (Unit 17). A caveat: it only finds a nearby valley, not necessarily the deepest one. Start on the left side of a "W"-shaped curve and you reach the left bottom; start on the right and you reach the right.
examples:
- title: Bisection and Newton's method
  intro: Two ways to compute the square root of 2. Newton's digits double each step.
  code: |
    def bisection(f, lo, hi, tol=1e-9):
        """Find x with f(x) = 0 by repeatedly halving an interval whose ends have opposite signs.
        ValueError if f(lo) and f(hi) have the same sign (there may be no root in between)."""
        if lo > hi:
            lo, hi = hi, lo
        flo, fhi = f(lo), f(hi)
        if flo == 0:
            return lo
        if fhi == 0:
            return hi
        if flo * fhi > 0:
            raise ValueError("f must change sign between lo and hi")
        while hi - lo > tol:
            mid = (lo + hi) / 2
            fm = f(mid)
            if fm == 0:
                return mid
            if flo * fm < 0:
                hi = mid
            else:
                lo, flo = mid, fm
        return (lo + hi) / 2


    def newton(f, df, x0, tol=1e-12, max_iter=50):
        """Newton's method: slide down the tangent line to where it crosses zero, x <- x - f(x)/f'(x), and repeat.
        ValueError if the slope becomes 0 or no answer is found within max_iter steps."""
        x = x0
        for _ in range(max_iter):
            slope = df(x)
            if slope == 0:
                raise ValueError("the slope is zero; the tangent never crosses the axis")
            step = f(x) / slope
            x -= step
            if abs(step) < tol:
                return x
        raise ValueError("did not converge")


    f = lambda x: x * x - 2
    print("bisection:", round(bisection(f, 0, 2), 6))
    print("newton   :", round(newton(f, lambda x: 2 * x, 1), 6))
    print("sqrt(2)  :", round(2 ** 0.5, 6))
    x = 1.0
    for i in range(5):
        x = x - f(x) / (2 * x)
        print("Newton step", i + 1, "->", round(x, 10))
  output: |
    bisection: 1.414214
    newton   : 1.414214
    sqrt(2)  : 1.414214
    Newton step 1 -> 1.5
    Newton step 2 -> 1.4166666667
    Newton step 3 -> 1.4142156863
    Newton step 4 -> 1.4142135624
    Newton step 5 -> 1.4142135624
  lines:
  - line: 41
    note: 'Halving: slow but sure.'
  - line: 45
    note: The correct digits roughly double each step.
- title: Gradient descent
  intro: Different starting points reach different valleys; a step that is too large blows up.
  code: |
    def gradient_descent_1d(df, x0, rate=0.1, steps=100):
        """Walk downhill: repeat x <- x - rate * f'(x). Returns the final x."""
        x = x0
        for _ in range(steps):
            x -= rate * df(x)
        return x


    df = lambda x: 4 * x ** 3 - 4 * x       # slope of x^4 - 2x^2, a "W" shaped curve
    print("start at 2, slow steps :", round(gradient_descent_1d(df, 2, 0.05, 500), 6))
    print("start at -2, slow steps:", round(gradient_descent_1d(df, -2, 0.05, 500), 6))
    print("start at 0.01          :", round(gradient_descent_1d(df, 0.01, 0.05, 500), 6))
    print("steps too big blow up  :", gradient_descent_1d(lambda x: 2 * x, 1, 1.5, 5))
  output: |
    start at 2, slow steps : 1.0
    start at -2, slow steps: -1.0
    start at 0.01          : 1.0
    steps too big blow up  : -32.0
  lines:
  - line: 10
    note: Reaches the right valley of the W.
  - line: 13
    note: A big rate overshoots and diverges.
- title: Critical points and the best box
  intro: Find the peaks and valleys of a cubic and the most spacious cardboard box.
  code: |
    def slope_at(f, x, h=1e-5):
        return (f(x + h) - f(x - h)) / (2 * h)


    def bisection(f, lo, hi, tol=1e-9):
        """Find x with f(x) = 0 by repeatedly halving an interval whose ends have opposite signs.
        ValueError if f(lo) and f(hi) have the same sign (there may be no root in between)."""
        if lo > hi:
            lo, hi = hi, lo
        flo, fhi = f(lo), f(hi)
        if flo == 0:
            return lo
        if fhi == 0:
            return hi
        if flo * fhi > 0:
            raise ValueError("f must change sign between lo and hi")
        while hi - lo > tol:
            mid = (lo + hi) / 2
            fm = f(mid)
            if fm == 0:
                return mid
            if flo * fm < 0:
                hi = mid
            else:
                lo, flo = mid, fm
        return (lo + hi) / 2


    def critical_points(f, lo, hi, n=2000):
        """Places in (lo, hi) where the slope is 0, as a sorted list of (x, kind) with kind 'min' or 'max'.
        Scan the slope on a grid and, wherever it changes sign, find the zero with bisection."""
        step = (hi - lo) / n
        xs = [lo + (i + 0.5) * step for i in range(n)]
        result = []
        for a, b in zip(xs, xs[1:]):
            da, db = slope_at(f, a), slope_at(f, b)
            if da * db < 0:
                x = bisection(lambda t: slope_at(f, t), a, b)
                result.append((x, "min" if da < 0 else "max"))
        return result


    def maximize(f, lo, hi):
        """The (x, value) with the largest f on [lo, hi]: check both ends and every critical point."""
        candidates = [lo, hi] + [x for x, kind in critical_points(f, lo, hi)]
        best = max(candidates, key=f)
        return best, f(best)


    def box_volume(side, cut):
        """Cut squares of size `cut` from the corners of a square sheet and fold up the sides."""
        return cut * (side - 2 * cut) ** 2


    def best_box(side):
        """The corner cut (x, volume) that makes the open box hold the most. The cut can be anything from 0 to side/2."""
        return maximize(lambda c: box_volume(side, c), 0, side / 2)


    x, v = best_box(12)
    print("a 12 by 12 sheet: cut", round(x, 3), "to get volume", round(v, 3))
    print("critical points of x^3 - 3x:", [(round(a, 3), kind) for a, kind in critical_points(lambda x: x ** 3 - 3 * x, -3, 3)])
  output: |
    a 12 by 12 sheet: cut 2.0 to get volume 128.0
    critical points of x^3 - 3x: [(-1.0, 'max'), (1.0, 'min')]
  lines:
  - line: 60
    note: 'The calculus answer: cut 2 from each corner.'
  - line: 62
    note: A hill at -1 and a valley at 1.
