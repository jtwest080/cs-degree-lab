- type: code
  question: Write `newton_sqrt(n)` returning the square root of a positive number `n` using Newton's method on `x*x - n` starting from `x = n` (or 1 if n < 1), iterating 60 times.
  starter: |
    def newton_sqrt(n):
        pass
  tests:
  - name: sqrt
    code: |
      assert abs(newton_sqrt(2) - 2 ** 0.5) < 1e-12
      assert abs(newton_sqrt(144) - 12) < 1e-12
      assert abs(newton_sqrt(0.25) - 0.5) < 1e-12
  solution: |
    def newton_sqrt(n):
        x = n if n >= 1 else 1.0
        for _ in range(60):
            x = x - (x * x - n) / (2 * x)
        return x
