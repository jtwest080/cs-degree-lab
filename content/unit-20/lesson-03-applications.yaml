  tests:
  - name: min and max
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      cp = critical_points(lambda x: x ** 3 - 3 * x, -3, 3)
      assert len(cp) == 2
      assert close(cp[0][0], -1, 1e-4) and cp[0][1] == "max"
      assert close(cp[1][0], 1, 1e-4) and cp[1][1] == "min"
      cp = critical_points(math.sin, 0, 2 * math.pi)
      assert [k for x, k in cp] == ["max", "min"]
      assert close(cp[0][0], math.pi / 2, 1e-4) and close(cp[1][0], 3 * math.pi / 2, 1e-4)
  - name: bowls, hills and slopes
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      cp = critical_points(lambda x: x * x, -1, 1)
      assert len(cp) == 1 and close(cp[0][0], 0, 1e-4) and cp[0][1] == "min"
      cp = critical_points(lambda x: -(x - 2) ** 2, 0, 5)
      assert len(cp) == 1 and close(cp[0][0], 2, 1e-4) and cp[0][1] == "max"
      assert critical_points(lambda x: 3 * x + 1, -5, 5) == []
      assert len(critical_points(lambda x: x ** 4 - 2 * x ** 2, -2, 2)) == 3
  hints:
  - The half-step offset keeps the grid off exact symmetric points like 0.
  solution: |
    def slope_at(f, x, h=1e-5):
        return (f(x + h) - f(x - h)) / (2 * h)


    def bisection(f, lo, hi, tol=1e-9):
        """Find x with f(x) = 0 by repeatedly halving an interval whose ends have opposite signs.
        ValueError if f(lo) and f(hi) have the same sign (there may be no root in between)."""
        if lo > hi:
            lo, hi = hi, lo
        flo, fhi = f(lo), f(hi)
        if flo == 0:
            return lo
        if fhi == 0:
            return hi
        if flo * fhi > 0:
            raise ValueError("f must change sign between lo and hi")
        while hi - lo > tol:
            mid = (lo + hi) / 2
            fm = f(mid)
            if fm == 0:
                return mid
            if flo * fm < 0:
                hi = mid
            else:
                lo, flo = mid, fm
        return (lo + hi) / 2


    def critical_points(f, lo, hi, n=2000):
        """Places in (lo, hi) where the slope is 0, as a sorted list of (x, kind) with kind 'min' or 'max'.
        Scan the slope on a grid and, wherever it changes sign, find the zero with bisection."""
        step = (hi - lo) / n
        xs = [lo + (i + 0.5) * step for i in range(n)]
        result = []
        for a, b in zip(xs, xs[1:]):
            da, db = slope_at(f, a), slope_at(f, b)
            if da * db < 0:
                x = bisection(lambda t: slope_at(f, t), a, b)
                result.append((x, "min" if da < 0 else "max"))
        return result
  explanation: A sign change in the slope marks a flat spot; which way it changes says what kind.
