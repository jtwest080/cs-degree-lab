- type: code
  question: Write `rectangle_area(f, a, b, n)` returning the midpoint Riemann sum of `f` on `[a, b]` with `n` rectangles.
  starter: |
    def rectangle_area(f, a, b, n):
        pass
  tests:
  - name: mid
    code: |
      assert abs(rectangle_area(lambda x: x, 0, 1, 4) - 0.5) < 1e-12
      assert abs(rectangle_area(lambda x: 3, 0, 2, 5) - 6) < 1e-12
      assert abs(rectangle_area(lambda x: x * x, 0, 3, 1000) - 9) < 1e-5
  solution: |
    def rectangle_area(f, a, b, n):
        width = (b - a) / n
        return sum(f(a + (i + 0.5) * width) for i in range(n)) * width
