exercises:
- id: riemann
  title: Riemann sums
  difficulty: 3
  prompt: 'Write `riemann_sum(f, a, b, n, method=''left'')`: make `n` slices of width `(b - a) / n`; the height of slice `i` is `f` at `a + (i + offset) * width` with offset 0 for `''left''`, 1 for `''right''` and 0.5 for `''mid''`. Return the sum of heights times the width. Raise `ValueError` for `n < 1` or an unknown method.'
  starter: |
    def riemann_sum(f, a, b, n, method="left"):
        pass
  tests:
  - name: rectangles
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert riemann_sum(lambda x: 2, 0, 5, 10) == 10
      assert riemann_sum(lambda x: x, 0, 1, 4, "left") == 0.375
      assert riemann_sum(lambda x: x, 0, 1, 4, "right") == 0.625
      assert close(riemann_sum(lambda x: x, 0, 1, 4, "mid"), 0.5)
      assert close(riemann_sum(lambda x: x * x, 0, 3, 3000, "mid"), 9, 1e-5)
  - name: more rectangles are better
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      f = lambda x: x * x
      errs = [abs(riemann_sum(f, 0, 3, n) - 9) for n in (10, 100, 1000)]
      assert errs[0] > errs[1] > errs[2]
      assert close(riemann_sum(lambda x: -1, 0, 4, 8, "right"), -4)
      assert close(riemann_sum(lambda x: x, 2, 0, 4, "mid"), -2)
  - name: bad input
    code: |
      for args in ((0, 1, 0), (0, 1, -3)):
          try:
              riemann_sum(lambda x: x, *args)
              raise AssertionError("accepted")
          except ValueError:
              pass
      try:
          riemann_sum(lambda x: x, 0, 1, 4, "top")
          raise AssertionError("accepted")
      except ValueError:
          pass
  hints:
  - A dictionary can map each method name to its offset.
  solution: |
    def riemann_sum(f, a, b, n, method="left"):
        """Approximate the area under f from a to b with n thin rectangles.
        method: 'left' (height at the left edge), 'right', or 'mid' (middle). ValueError for n < 1 or an unknown method."""
        if n < 1:
            raise ValueError("n must be at least 1")
        if method not in ("left", "right", "mid"):
            raise ValueError("unknown method: " + str(method))
        width = (b - a) / n
        offset = {"left": 0.0, "right": 1.0, "mid": 0.5}[method]
        return sum(f(a + (i + offset) * width) for i in range(n)) * width
  explanation: Rectangles approximate any area.
- id: trapezoid-simpson
  title: Trapezoids and Simpson's rule
  difficulty: 4
  prompt: Write `trapezoid(f, a, b, n)` (total `= (f(a) + f(b)) / 2 + sum of f at the n - 1 inner points`, times the width) and `simpson(f, a, b, n)` (`f(a) + f(b)` plus `4 * f` at odd-numbered inner points and `2 * f` at even-numbered ones, times `width / 3`). Both raise `ValueError` for bad `n`; Simpson needs an even `n` of at least 2.
  starter: |
    def trapezoid(f, a, b, n):
        pass


    def simpson(f, a, b, n):
        pass
  tests:
  - name: trapezoids
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert trapezoid(lambda x: x, 0, 4, 1) == 8
      assert close(trapezoid(lambda x: x, 0, 4, 7), 8)
      assert close(trapezoid(lambda x: x * x, 0, 3, 1000), 9, 1e-5)
      import math
      assert close(trapezoid(math.sin, 0, math.pi, 1000), 2, 1e-5)
  - name: simpson is very accurate
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert close(simpson(lambda x: x ** 3, 0, 2, 2), 4, 1e-12)
      assert close(simpson(lambda x: x * x, 0, 3, 2), 9, 1e-12)
      assert close(simpson(math.sin, 0, math.pi, 10), 2, 2e-4)
      assert abs(simpson(math.sin, 0, math.pi, 10) - 2) < abs(trapezoid(math.sin, 0, math.pi, 10) - 2)
      assert close(simpson(math.exp, 0, 1, 20), math.e - 1, 1e-6)
  - name: n must be sensible
    code: |
      for n in (0, 1, 3):
          try:
              simpson(lambda x: x, 0, 1, n)
              raise AssertionError("accepted")
          except ValueError:
              pass
      try:
          trapezoid(lambda x: x, 0, 1, 0)
          raise AssertionError("accepted")
      except ValueError:
          pass
  hints:
  - Inner points are `a + i * width` for `i` from 1 to `n - 1`.
  solution: |
    def trapezoid(f, a, b, n):
        """Use n trapezoids instead of rectangles: average the heights at both edges of each slice."""
        if n < 1:
            raise ValueError("n must be at least 1")
        width = (b - a) / n
        total = (f(a) + f(b)) / 2
        for i in range(1, n):
            total += f(a + i * width)
        return total * width


    def simpson(f, a, b, n):
        """Simpson's rule: fit a parabola through each pair of slices. n must be even.
        Weights 1, 4, 2, 4, ..., 4, 1 times width / 3."""
        if n < 2 or n % 2:
            raise ValueError("n must be even and at least 2")
        width = (b - a) / n
        total = f(a) + f(b)
        for i in range(1, n):
            total += (4 if i % 2 else 2) * f(a + i * width)
        return total * width / 3
  explanation: Better shapes give better areas.
- id: fundamental-theorem
  title: The Fundamental Theorem
  difficulty: 4
  prompt: 'Polynomials are coefficient lists as in lesson 2. Write `antiderivative_poly(coeffs)`: `c * x^k` becomes `c / (k + 1) * x^(k + 1)` (use `Fraction`s; the new constant term is `Fraction(0)`). Write `definite_integral_poly(coeffs, a, b)` returning `F(b) - F(a)` as a `Fraction`.'
  starter: |
    from fractions import Fraction


    def antiderivative_poly(coeffs):
        pass


    def definite_integral_poly(coeffs, a, b):
        pass
  tests:
  - name: antiderivatives
    code: |
      from fractions import Fraction
      assert antiderivative_poly([0, 2]) == [0, 0, 1]
      assert antiderivative_poly([3]) == [0, 3]
      assert antiderivative_poly([1, 2, 3]) == [0, 1, 1, 1]
      assert antiderivative_poly([0, 0, 1]) == [0, 0, 0, Fraction(1, 3)]
      assert antiderivative_poly([]) == [0]
  - name: exact areas
    code: |
      from fractions import Fraction
      assert definite_integral_poly([0, 0, 1], 0, 3) == 9
      assert definite_integral_poly([1], 2, 7) == 5
      assert definite_integral_poly([0, 1], 0, 4) == 8
      assert definite_integral_poly([0, 0, 1], 0, 1) == Fraction(1, 3)
      assert definite_integral_poly([0, 0, 1], 3, 0) == -9
      assert definite_integral_poly([1, 2, 3], 1, 2) == 11
      assert definite_integral_poly([1, 2, 3], 0, 2) == 2 + 4 + 8
  hints:
  - The antiderivative list is `[0] + [c / (k + 1) ...]`.
  solution: |
    from fractions import Fraction


    def antiderivative_poly(coeffs):
        """Reverse the power rule: c*x^k becomes c/(k+1) * x^(k+1). The constant of integration is taken to be 0."""
        return [Fraction(0)] + [Fraction(c) / (k + 1) for k, c in enumerate(coeffs)]


    def definite_integral_poly(coeffs, a, b):
        """Exact area under a polynomial from a to b: F(b) - F(a), where F is an antiderivative."""
        anti = antiderivative_poly(coeffs)
        value = lambda x: sum(c * Fraction(x) ** k for k, c in enumerate(anti))
        return value(b) - value(a)
  explanation: Evaluate the antiderivative at both ends and subtract.
