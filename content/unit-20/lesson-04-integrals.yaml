- id: adaptive
  title: 'Capstone: adaptive Simpson'
  difficulty: 5
  prompt: Write `adaptive_simpson(f, a, b, tol=1e-9)`. Define `simpson1(lo, hi) = (hi - lo) / 6 * (f(lo) + 4 f(mid) + f(hi))`. A recursive helper takes an interval, its Simpson estimate `whole`, a tolerance and a depth (start with 40). It computes the estimates `left` and `right` of the two halves; if the depth is 0 or `abs(left + right - whole) <= 15 * tolerance` it returns `left + right + (left + right - whole) / 15`; otherwise it returns the sum of the helper on each half with `left`/`right` as their `whole`, half the tolerance and one less depth.
  starter: |
    def adaptive_simpson(f, a, b, tol=1e-9):
        pass
  tests:
  - name: accuracy
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert close(adaptive_simpson(math.sin, 0, math.pi), 2, 1e-9)
      assert close(adaptive_simpson(math.exp, 0, 1), math.e - 1, 1e-9)
      assert close(adaptive_simpson(lambda x: 1 / x, 1, math.e), 1, 1e-9)
      assert close(adaptive_simpson(lambda x: x ** 3 - x, -1, 2), 2.25, 1e-9)
      assert close(adaptive_simpson(lambda x: math.sqrt(x), 0, 1), 2 / 3, 1e-6)
  - name: saves work where the curve is calm
    code: |
      import math
      calls = [0]
      def counted(x):
          calls[0] += 1
          return math.exp(-x * x)
      v = adaptive_simpson(counted, -5, 5, 1e-9)
      assert abs(v - math.sqrt(math.pi)) < 1e-8
      assert calls[0] < 5000
      calls[0] = 0
      adaptive_simpson(lambda x: (calls.__setitem__(0, calls[0] + 1), 3 * x)[1], 0, 10)
      assert calls[0] < 20
  hints:
  - The division by 15 is a correction (Richardson extrapolation) that makes the answer better still.
  solution: |
    def adaptive_simpson(f, a, b, tol=1e-9):
        """Integrate with Simpson's rule, splitting an interval in two only where the answer is not yet accurate enough."""
        def simpson1(lo, hi):
            mid = (lo + hi) / 2
            return (hi - lo) / 6 * (f(lo) + 4 * f(mid) + f(hi))

        def go(lo, hi, whole, tolerance, depth):
            mid = (lo + hi) / 2
            left, right = simpson1(lo, mid), simpson1(mid, hi)
            if depth == 0 or abs(left + right - whole) <= 15 * tolerance:
                return left + right + (left + right - whole) / 15
            return go(lo, mid, left, tolerance / 2, depth - 1) + go(mid, hi, right, tolerance / 2, depth - 1)

        return go(a, b, simpson1(a, b), tol, 40)
  explanation: Spend effort only where the curve is difficult.
commonMistakes:
- title: Forgetting the width of each rectangle
  explanation: Area is height times width, so multiply the sum of heights by (b - a) / n.
- title: Odd n in Simpson's rule
  explanation: It pairs up slices, so n must be even.
- title: Forgetting the antiderivative's constant cancels
  explanation: F(b) - F(a) removes any constant, so you may use 0.
- title: Treating area below the axis as positive
  explanation: Integrals count it as negative.
summary:
- An integral is the area under a curve, a total built from tiny pieces.
- Rectangles, trapezoids and Simpson's rule approximate it with growing accuracy.
- 'The Fundamental Theorem: the area under f is F(b) - F(a) for any antiderivative F.'
- Integrals of speed give distance; area divided by width gives average value.
- Adaptive methods concentrate effort where needed.
