id: u20-integrals
title: 'Integrals: Adding Up Tiny Pieces'
minutes: 80
objective: 'Learn the second great idea of calculus: finding the total amount of something that is changing, as the area under a curve. You will approximate areas with rectangles, trapezoids and Simpson''s rule, discover that integration is the reverse of differentiation (the Fundamental Theorem), and build an adaptive integrator.'
outcomes:
- Explain an integral as area under a curve and as an accumulated total
- Approximate integrals with Riemann sums, trapezoids and Simpson's rule
- State the Fundamental Theorem of Calculus
- Compute exact integrals of polynomials
- Use integrals for distance from speed and for average values
sections:
- heading: Area and accumulation
  body: |-
    A car drives at a steady 60 miles per hour for 2 hours. How far? `60 * 2 = 120` miles, which is the **area of a rectangle** on a graph of speed against time (height 60, width 2). But what if the speed keeps changing? Then the graph is a curve, and the distance is still **the area under the curve**. That is the central idea of **integration**: a total built by adding up lots of tiny pieces. The **definite integral** of `f` from `a` to `b` is the exact area between the curve and the x-axis from `a` to `b`, written with the long S sign (for "sum"): `integral of f(x) dx from a to b`. Area below the axis counts as negative.

    Integrals compute far more than areas: total rainfall from a rate of rainfall, energy used from power, total money from a rate of earnings, probability from a density curve (Unit 21).
- heading: Approximating with rectangles, trapezoids and Simpson
  body: |-
    Curved areas are hard, but rectangles are easy. Cut `[a, b]` into `n` slices of width `(b - a) / n`, make a rectangle in each slice whose height is the curve's height at the left edge (or the right, or the middle), and add them up. That is a **Riemann sum**. More slices means a closer fit; with the **midpoint** heights the errors on either side of the curve largely cancel, so it is more accurate than left or right.

    Better: use a straight-sided **trapezoid** in each slice (average the heights at both edges), or **Simpson's rule**, which fits a parabola through each pair of slices and uses the weights `1, 4, 2, 4, ..., 4, 1` times `width / 3`. Simpson's rule is exact for any polynomial up to degree 3, and for smooth curves it gets extraordinary accuracy from a handful of slices. Our `x^2` example on `[0, 3]` is exact with just 2 slices.

    Notice the pattern we saw with limits: the approximation approaches the true answer as `n` grows, and the exact integral is the limit.
- heading: The Fundamental Theorem of Calculus
  body: |-
    Here is the miracle. Suppose `F` is a function whose derivative is `f` (so `F' = f`; we call `F` an **antiderivative** of `f`). Then **the area under `f` from `a` to `b` is `F(b) - F(a)`**. Differentiation and integration are inverse operations, like multiplication and division. Check: the antiderivative of `x^2` is `x^3 / 3` (differentiate it and you get `x^2` back), so the area under `x^2` from 0 to 3 is `27/3 - 0 = 9`, exactly what the rectangles were approaching.

    The **power rule in reverse** is: the antiderivative of `x^k` is `x^(k+1) / (k + 1)`. Any constant can be added to `F` without changing `F'`, but it cancels in `F(b) - F(a)`. Many functions have no antiderivative you can write down (the bell curve `exp(-x^2)` is a famous one), but numerical integration works on every continuous function, which is why both skills matter.

    Finally, **adaptive** integration spends effort only where it is needed: try Simpson's rule on an interval, compare with two half-size applications, and split further only where they disagree. Flat regions are done after a few evaluations; wiggly regions get many more.
examples:
- title: Rectangles, trapezoids and Simpson's rule
  intro: All approach the exact area 9 under x squared; Simpson gets it with two slices.
  code: |
    def riemann_sum(f, a, b, n, method="left"):
        """Approximate the area under f from a to b with n thin rectangles.
        method: 'left' (height at the left edge), 'right', or 'mid' (middle). ValueError for n < 1 or an unknown method."""
        if n < 1:
            raise ValueError("n must be at least 1")
        if method not in ("left", "right", "mid"):
            raise ValueError("unknown method: " + str(method))
        width = (b - a) / n
        offset = {"left": 0.0, "right": 1.0, "mid": 0.5}[method]
        return sum(f(a + (i + offset) * width) for i in range(n)) * width


    def trapezoid(f, a, b, n):
        """Use n trapezoids instead of rectangles: average the heights at both edges of each slice."""
        if n < 1:
            raise ValueError("n must be at least 1")
        width = (b - a) / n
        total = (f(a) + f(b)) / 2
        for i in range(1, n):
            total += f(a + i * width)
        return total * width


    def simpson(f, a, b, n):
        """Simpson's rule: fit a parabola through each pair of slices. n must be even.
        Weights 1, 4, 2, 4, ..., 4, 1 times width / 3."""
        if n < 2 or n % 2:
            raise ValueError("n must be even and at least 2")
        width = (b - a) / n
        total = f(a) + f(b)
        for i in range(1, n):
            total += (4 if i % 2 else 2) * f(a + i * width)
        return total * width / 3


    f = lambda x: x * x         # the area under x^2 from 0 to 3 is exactly 9
    for n in (3, 30, 300):
        print("n =", n, "left", round(riemann_sum(f, 0, 3, n), 4), "mid", round(riemann_sum(f, 0, 3, n, "mid"), 4), "trapezoid", round(trapezoid(f, 0, 3, n), 4))
    print("Simpson with only 2 slices:", round(simpson(f, 0, 3, 2), 10))
  output: |
    n = 3 left 5.0 mid 8.75 trapezoid 9.5
    n = 30 left 8.555 mid 8.9975 trapezoid 9.005
    n = 300 left 8.955 mid 9.0 trapezoid 9.0001
    Simpson with only 2 slices: 9.0
  lines:
  - line: 37
    note: The approximations close in on 9.
  - line: 39
    note: Exact for polynomials up to degree 3.
- title: The Fundamental Theorem in action
  intro: Exact areas of polynomials by reversing the power rule.
  code: |
    from fractions import Fraction


    def antiderivative_poly(coeffs):
        """Reverse the power rule: c*x^k becomes c/(k+1) * x^(k+1). The constant of integration is taken to be 0."""
        return [Fraction(0)] + [Fraction(c) / (k + 1) for k, c in enumerate(coeffs)]


    def definite_integral_poly(coeffs, a, b):
        """Exact area under a polynomial from a to b: F(b) - F(a), where F is an antiderivative."""
        anti = antiderivative_poly(coeffs)
        value = lambda x: sum(c * Fraction(x) ** k for k, c in enumerate(anti))
        return value(b) - value(a)


    print("antiderivative of 3x^2 + 2x:", [str(c) for c in antiderivative_poly([0, 2, 3])])
    print("area under x^2 from 0 to 3:", definite_integral_poly([0, 0, 1], 0, 3))
    print("area under x^2 from 0 to 1:", definite_integral_poly([0, 0, 1], 0, 1))
    print("area under 3x^2 + 2x from 1 to 2:", definite_integral_poly([0, 2, 3], 1, 2))
  output: |
    antiderivative of 3x^2 + 2x: ['0', '0', '1', '1']
    area under x^2 from 0 to 3: 9
    area under x^2 from 0 to 1: 1/3
    area under 3x^2 + 2x from 1 to 2: 10
  lines:
  - line: 17
    note: x^3/3 evaluated at 3 minus at 0 is exactly 9.
- title: Distance, averages and adaptive integration
  intro: Distance from a speedometer log, the average value of sin, and the area under the bell curve.
  code: |
    def trapezoid(f, a, b, n):
        """Use n trapezoids instead of rectangles: average the heights at both edges of each slice."""
        if n < 1:
            raise ValueError("n must be at least 1")
        width = (b - a) / n
        total = (f(a) + f(b)) / 2
        for i in range(1, n):
            total += f(a + i * width)
        return total * width


    def simpson(f, a, b, n):
        """Simpson's rule: fit a parabola through each pair of slices. n must be even.
        Weights 1, 4, 2, 4, ..., 4, 1 times width / 3."""
        if n < 2 or n % 2:
            raise ValueError("n must be even and at least 2")
        width = (b - a) / n
        total = f(a) + f(b)
        for i in range(1, n):
            total += (4 if i % 2 else 2) * f(a + i * width)
        return total * width / 3


    def distance_travelled(times, speeds):
        """Total distance from speed readings: add the trapezoid under the speed-time graph between readings.
        ValueError unless the lists have equal length of at least two."""
        if len(times) != len(speeds) or len(times) < 2:
            raise ValueError("need matching lists with at least two readings")
        return sum((speeds[i] + speeds[i + 1]) / 2 * (times[i + 1] - times[i]) for i in range(len(times) - 1))


    def average_value(f, a, b, n=1000):
        """The average height of f on [a, b]: the area under it divided by the width. Use Simpson's rule (n even)."""
        if a == b:
            raise ValueError("a and b must be different")
        return simpson(f, a, b, n) / (b - a)


    def adaptive_simpson(f, a, b, tol=1e-9):
        """Integrate with Simpson's rule, splitting an interval in two only where the answer is not yet accurate enough."""
        def simpson1(lo, hi):
            mid = (lo + hi) / 2
            return (hi - lo) / 6 * (f(lo) + 4 * f(mid) + f(hi))

        def go(lo, hi, whole, tolerance, depth):
            mid = (lo + hi) / 2
            left, right = simpson1(lo, mid), simpson1(mid, hi)
            if depth == 0 or abs(left + right - whole) <= 15 * tolerance:
                return left + right + (left + right - whole) / 15
            return go(lo, mid, left, tolerance / 2, depth - 1) + go(mid, hi, right, tolerance / 2, depth - 1)

        return go(a, b, simpson1(a, b), tol, 40)


    import math
    times = [0, 1, 2, 3, 4, 5]
    speeds = [0, 12, 20, 22, 15, 0]        # metres per second
    print("distance travelled:", distance_travelled(times, speeds), "metres")
    print("average of sin on [0, pi]:", round(average_value(math.sin, 0, math.pi), 6), "= 2 / pi =", round(2 / math.pi, 6))
    print("adaptive area under exp(-x^2):", round(adaptive_simpson(lambda x: math.exp(-x * x), -5, 5), 8), "vs sqrt(pi):", round(math.sqrt(math.pi), 8))
  output: |
    distance travelled: 69.0 metres
    average of sin on [0, pi]: 0.63662 = 2 / pi = 0.63662
    adaptive area under exp(-x^2): 1.77245385 vs sqrt(pi): 1.77245385
  lines:
  - line: 58
    note: Area under the speed-time graph.
  - line: 60
    note: The bell curve has no formula for its antiderivative.
