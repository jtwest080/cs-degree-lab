    def simpson(f, a, b, n):
        width = (b - a) / n
        total = f(a) + f(b)
        for i in range(1, n):
            total += (4 if i % 2 else 2) * f(a + i * width)
        return total * width / 3


    def distance_travelled(times, speeds):
        """Total distance from speed readings: add the trapezoid under the speed-time graph between readings.
        ValueError unless the lists have equal length of at least two."""
        if len(times) != len(speeds) or len(times) < 2:
            raise ValueError("need matching lists with at least two readings")
        return sum((speeds[i] + speeds[i + 1]) / 2 * (times[i + 1] - times[i]) for i in range(len(times) - 1))


