  solution: |
    def rk4_system(f, state, t0, t1, n):
        """RK4 for several quantities at once. f(t, state) returns the list of rates. Returns the final state (a list)."""
        h = (t1 - t0) / n
        t = t0
        state = list(state)
        for _ in range(n):
            k1 = f(t, state)
            k2 = f(t + h / 2, [s + h / 2 * k for s, k in zip(state, k1)])
            k3 = f(t + h / 2, [s + h / 2 * k for s, k in zip(state, k2)])
            k4 = f(t + h, [s + h * k for s, k in zip(state, k3)])
            state = [s + h / 6 * (a + 2 * b + 2 * c + d) for s, a, b, c, d in zip(state, k1, k2, k3, k4)]
            t += h
        return state


    def sir(s0, i0, r0, beta, gamma, days, steps_per_day=20):
        """Epidemic model. S (susceptible) become I (infected) at rate beta * S * I / N; I recover to R at rate gamma * I.
        Returns the list [(day, S, I, R)] for day = 0, 1, ..., days."""
        total = s0 + i0 + r0

        def rates(t, state):
            s, i, r = state
            new = beta * s * i / total
            return [-new, new - gamma * i, gamma * i]

        state = [float(s0), float(i0), float(r0)]
        result = [(0, *state)]
        for day in range(1, days + 1):
            state = rk4_system(rates, state, day - 1, day, steps_per_day)
            result.append((day, *state))
        return result


    def peak_infected(history):
        """(day, infected) at the day with the most infected people; the earliest day wins a tie."""
        best = max(history, key=lambda row: (row[2], -row[0]))
        return best[0], best[2]
  explanation: Three coupled equations, one loop.
commonMistakes:
- title: Using one giant step
  explanation: Euler with a big step can be wildly wrong. Halve the step and see if the answer changes.
- title: Forgetting the starting value
  explanation: Without y(0) there are infinitely many solutions.
- title: Updating t before y
  explanation: The slope should use the old values.
- title: Believing a simulation is the truth
  explanation: 'A model is only as good as its assumptions: SIR ignores age, travel and vaccines.'
summary:
- A differential equation gives the rate of change in terms of the current state.
- Euler's method follows the slope in small steps.
- RK4 averages four slopes per step and is far more accurate.
- Systems of equations update lists of values together.
- Cooling, logistic growth and SIR are classic models.
