id: u20-ode
title: Differential Equations
minutes: 80
objective: 'Learn the language in which scientists describe how the world changes: an equation that says how fast something is changing in terms of what it is right now. You will solve such equations step by step with Euler''s method and the far more accurate Runge-Kutta method, then simulate cooling coffee, a growing population and an epidemic.'
outcomes:
- Say what a differential equation is
- Solve one numerically with Euler's method
- Explain why smaller steps and better methods give better answers
- Use RK4 for a single quantity and for several at once
- Model cooling, logistic growth and an epidemic
sections:
- heading: Describing change
  body: |-
    Most of the laws of nature describe **rates of change**, not values. A cup of coffee cools faster when it is much hotter than the room. A population grows faster the more individuals there are. A spring pulls harder the farther it is stretched. Each of these says: "the rate of change of `y` depends on `y` (and maybe on time `t`)". Written in symbols, `dy/dt = f(t, y)`, with `dy/dt` just another way of writing the derivative `y'`. An equation like that is a **differential equation**, and solving it means finding the function `y(t)`, given a **starting value** `y(0)`.

    Example: `y' = y` says "the rate of growth equals the current amount", and with `y(0) = 1` the solution is the exponential function `e^t`. Cooling: `T' = -k (T - ambient)`, the temperature approaches the room temperature, fast at first and slower later. Only a few differential equations have neat formulas for their solutions; the rest we solve with a computer, which is why this is a programming topic.
- heading: Euler's method
  body: |-
    The idea is the one you already know: the derivative is the slope, and a slope tells you how to move. Stand at `(t, y)`. The equation gives the slope `f(t, y)`. Take one small step `h` in time along that slope: `y_new = y + h * f(t, y)`, then `t_new = t + h`. Repeat. This is **Euler's method** (say "oiler"), the numerical cousin of the tangent line. You trace out an approximate curve as a chain of short straight segments.

    With 1 step on `y' = y` from 0 to 1 we get 2; with 10 steps 2.594; with 1,000 steps 2.7169; the true answer is 2.71828. The error shrinks in proportion to the step size, but slowly: ten times more steps gives ten times less error. For serious work we want a method that is much better for the same effort.
- heading: Runge-Kutta, systems and models
  body: |-
    The **fourth-order Runge-Kutta method (RK4)** looks at the slope at four places in each step (the start, twice in the middle, and a trial at the end) and takes a weighted average: `y += h/6 * (k1 + 2 k2 + 2 k3 + k4)`. For the same ten steps on `y' = y`, RK4 gets within five digits of `e`, where Euler is off in the first digit. Cutting the step in half cuts RK4's error by sixteen. Nearly all scientific simulation software uses a method in this family.

    Often several quantities change together. In the **SIR epidemic model** the population splits into **S**usceptible, **I**nfected and **R**ecovered people. Susceptible people get infected at a rate proportional to how many susceptible and infected people there are to meet, and infected people recover at rate `gamma`: `S' = -beta S I / N`, `I' = beta S I / N - gamma I`, `R' = gamma I`. The same RK4 steps work for lists of numbers. The total never changes, and whether the disease spreads depends on whether `beta / gamma` is above 1: the famous basic reproduction number.

    The **logistic equation** `p' = r p (1 - p / K)` models a population that grows at rate `r` when small but levels off at the carrying capacity `K`: an S-shaped curve that you will see everywhere.
examples:
- title: Euler versus RK4
  intro: The same equation solved with more and more steps, and with the better method.
  code: |
    def euler(df, y0, t0, t1, n):
        """Euler's method: from (t0, y0) take n small steps to t1, each time moving along the current slope.
        df(t, y) gives the slope. Returns the final y. ValueError if n < 1."""
        if n < 1:
            raise ValueError("n must be at least 1")
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            y += h * df(t, y)
            t += h
        return y


    def euler_path(df, y0, t0, t1, n):
        """Like euler, but returns the list of (t, y) points, n + 1 of them, starting with (t0, y0)."""
        h = (t1 - t0) / n
        points = [(t0, y0)]
        t, y = t0, y0
        for i in range(n):
            y += h * df(t, y)
            t = t0 + (i + 1) * h
            points.append((t, y))
        return points


    def rk4(df, y0, t0, t1, n):
        """The fourth-order Runge-Kutta method: each step averages four slopes (start, two in the middle, end). Returns the final y."""
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            k1 = df(t, y)
            k2 = df(t + h / 2, y + h / 2 * k1)
            k3 = df(t + h / 2, y + h / 2 * k2)
            k4 = df(t + h, y + h * k3)
            y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)
            t += h
        return y


    import math
    print("growth y' = y, y(0) = 1; the true value at t = 1 is e =", round(math.e, 6))
    for n in (1, 10, 100, 1000):
        print("Euler with", n, "steps:", round(euler(lambda t, y: y, 1, 0, 1, n), 6))
    print("RK4 with 10 steps:", round(rk4(lambda t, y: y, 1, 0, 1, 10), 6))
    print("first path points:", [(round(t, 2), round(y, 4)) for t, y in euler_path(lambda t, y: y, 1, 0, 1, 4)])
  output: |
    growth y' = y, y(0) = 1; the true value at t = 1 is e = 2.718282
    Euler with 1 steps: 2.0
    Euler with 10 steps: 2.593742
    Euler with 100 steps: 2.704814
    Euler with 1000 steps: 2.716924
    RK4 with 10 steps: 2.71828
    first path points: [(0, 1), (0.25, 1.25), (0.5, 1.5625), (0.75, 1.9531), (1.0, 2.4414)]
  lines:
  - line: 42
    note: Better and better as the steps shrink.
  - line: 44
    note: Ten RK4 steps beat a thousand Euler steps.
- title: Cooling coffee and growing populations
  intro: Newton's law of cooling and the S-shaped logistic curve.
  code: |
    def rk4(df, y0, t0, t1, n):
        """The fourth-order Runge-Kutta method: each step averages four slopes (start, two in the middle, end). Returns the final y."""
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            k1 = df(t, y)
            k2 = df(t + h / 2, y + h / 2 * k1)
            k3 = df(t + h / 2, y + h / 2 * k2)
            k4 = df(t + h, y + h * k3)
            y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)
            t += h
        return y


    def newton_cooling(temp0, ambient, k, minutes, steps=1000):
        """Temperature after `minutes` if it changes at the rate -k * (temp - ambient). Use rk4."""
        return rk4(lambda t, temp: -k * (temp - ambient), temp0, 0, minutes, steps)


    def time_to_cool(temp0, ambient, k, target, dt=0.01):
        """Minutes until the object first reaches `target` (take steps of dt with Euler's method).
        ValueError if the target can never be reached (not between the start and ambient temperature)."""
        if temp0 == target:
            return 0.0
        if not (min(temp0, ambient) < target < max(temp0, ambient)):
            raise ValueError("the target is never reached")
        t, temp = 0.0, temp0
        going_down = temp0 > ambient
        while (temp > target) if going_down else (temp < target):
            temp += dt * (-k * (temp - ambient))
            t += dt
        return t


    def logistic(p0, r, capacity, t, n=1000):
        """Population growing at rate r * p * (1 - p / capacity). Returns the population at time t (use rk4)."""
        return rk4(lambda time, p: r * p * (1 - p / capacity), p0, 0, t, n)


    print("coffee at 90 C in a 20 C room after 10 minutes:", round(newton_cooling(90, 20, 0.1, 10), 3))
    print("minutes to reach 55 C:", round(time_to_cool(90, 20, 0.1, 55), 1))
    for t in (0, 5, 10, 15, 20):
        print("population at t =", t, ":", round(logistic(1, 1, 1000, t), 1))
  output: |
    coffee at 90 C in a 20 C room after 10 minutes: 45.752
    minutes to reach 55 C: 6.9
    population at t = 0 : 1.0
    population at t = 5 : 129.3
    population at t = 10 : 956.6
    population at t = 15 : 999.7
    population at t = 20 : 1000.0
  lines:
  - line: 40
    note: Newton's law of cooling.
  - line: 42
    note: An S-shaped curve.
- title: An epidemic
  intro: Susceptible, infected and recovered people over 100 days.
  code: |
    def rk4_system(f, state, t0, t1, n):
        """RK4 for several quantities at once. f(t, state) returns the list of rates. Returns the final state (a list)."""
        h = (t1 - t0) / n
        t = t0
        state = list(state)
        for _ in range(n):
            k1 = f(t, state)
            k2 = f(t + h / 2, [s + h / 2 * k for s, k in zip(state, k1)])
            k3 = f(t + h / 2, [s + h / 2 * k for s, k in zip(state, k2)])
            k4 = f(t + h, [s + h * k for s, k in zip(state, k3)])
            state = [s + h / 6 * (a + 2 * b + 2 * c + d) for s, a, b, c, d in zip(state, k1, k2, k3, k4)]
            t += h
        return state


    def sir(s0, i0, r0, beta, gamma, days, steps_per_day=20):
        """Epidemic model. S (susceptible) become I (infected) at rate beta * S * I / N; I recover to R at rate gamma * I.
        Returns the list [(day, S, I, R)] for day = 0, 1, ..., days."""
        total = s0 + i0 + r0

        def rates(t, state):
            s, i, r = state
            new = beta * s * i / total
            return [-new, new - gamma * i, gamma * i]

        state = [float(s0), float(i0), float(r0)]
        result = [(0, *state)]
        for day in range(1, days + 1):
            state = rk4_system(rates, state, day - 1, day, steps_per_day)
            result.append((day, *state))
        return result


    def peak_infected(history):
        """(day, infected) at the day with the most infected people; the earliest day wins a tie."""
        best = max(history, key=lambda row: (row[2], -row[0]))
        return best[0], best[2]


    history = sir(990, 10, 0, 0.4, 0.1, 100)
    for day in (0, 10, 20, 30, 50, 100):
        d, s, i, r = history[day]
        print("day", d, "susceptible", round(s), "infected", round(i), "recovered", round(r))
    print("peak:", tuple(round(x, 1) for x in peak_infected(history)))
  output: |
    day 0 susceptible 990 infected 10 recovered 0
    day 10 susceptible 794 infected 151 recovered 55
    day 20 susceptible 226 infected 405 recovered 369
    day 30 susceptible 60 infected 239 recovered 701
    day 50 susceptible 24 infected 43 recovered 934
    day 100 susceptible 20 infected 0 recovered 980
    peak: (19, 405.5)
  lines:
  - line: 40
    note: S falls, I rises then falls, R grows.
  - line: 44
    note: The busiest day.
