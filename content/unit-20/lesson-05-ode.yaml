- id: euler
  title: Euler's method
  difficulty: 3
  prompt: 'Write `euler(df, y0, t0, t1, n)`: set `h = (t1 - t0) / n`, then `n` times do `y += h * df(t, y)` and `t += h`, starting from `t0, y0`. Return `y`. Raise `ValueError` if `n < 1`. (`df` takes `t` and `y`.)'
  starter: |
    def euler(df, y0, t0, t1, n):
        pass
  tests:
  - name: growth
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert euler(lambda t, y: 0, 5, 0, 10, 10) == 5
      assert close(euler(lambda t, y: 2, 1, 0, 3, 3), 7)
      assert close(euler(lambda t, y: y, 1, 0, 1, 1), 2)
      assert abs(euler(lambda t, y: y, 1, 0, 1, 1000) - math.e) < 2e-3
      assert abs(euler(lambda t, y: y, 1, 0, 1, 100000) - math.e) < 2e-4
  - name: error shrinks with the step
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      e = [abs(euler(lambda t, y: -y, 1, 0, 2, n) - math.exp(-2)) for n in (10, 100, 1000)]
      assert e[0] > e[1] > e[2]
      assert abs(euler(lambda t, y: t, 0, 0, 4, 4000) - 8) < 1e-2
      try:
          euler(lambda t, y: y, 1, 0, 1, 0)
          raise AssertionError("accepted")
      except ValueError:
          pass
  hints:
  - Update `y` using the old `t` before moving `t`.
  solution: |
    def euler(df, y0, t0, t1, n):
        """Euler's method: from (t0, y0) take n small steps to t1, each time moving along the current slope.
        df(t, y) gives the slope. Returns the final y. ValueError if n < 1."""
        if n < 1:
            raise ValueError("n must be at least 1")
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            y += h * df(t, y)
            t += h
        return y
  explanation: Each step follows the current slope for a short time.
- id: euler-rk4
  title: The whole path, and RK4
  difficulty: 4
  prompt: 'The starter has `euler`. Write `euler_path(df, y0, t0, t1, n)` returning the `n + 1` points `(t, y)` starting with `(t0, y0)` (compute each `t` as `t0 + (i + 1) * h` to avoid drifting), and `rk4(df, y0, t0, t1, n)`: every step compute `k1 = df(t, y)`, `k2 = df(t + h/2, y + h/2 * k1)`, `k3 = df(t + h/2, y + h/2 * k2)`, `k4 = df(t + h, y + h * k3)` and set `y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)`; return the final `y`.'
  starter: |
    def euler(df, y0, t0, t1, n):
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            y += h * df(t, y)
            t += h
        return y


    def euler_path(df, y0, t0, t1, n):
        pass


    def rk4(df, y0, t0, t1, n):
        pass
  tests:
  - name: path
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      p = euler_path(lambda t, y: 2, 1, 0, 3, 3)
      assert p == [(0, 1), (1.0, 3.0), (2.0, 5.0), (3.0, 7.0)]
      p = euler_path(lambda t, y: y, 1, 0, 1, 4)
      assert len(p) == 5 and p[0] == (0, 1) and close(p[-1][0], 1)
      assert close(p[1][1], 1.25) and close(p[4][1], 1.25 ** 4)
  - name: rk4 is far more accurate
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert abs(rk4(lambda t, y: y, 1, 0, 1, 10) - math.e) < 1e-5
      assert abs(rk4(lambda t, y: -2 * y, 1, 0, 2, 20) - math.exp(-4)) < 1e-5
      e1 = abs(euler(lambda t, y: y, 1, 0, 1, 10) - math.e)
      e2 = abs(rk4(lambda t, y: y, 1, 0, 1, 10) - math.e)
      assert e2 < e1 / 1000
      assert close(rk4(lambda t, y: t * t, 0, 0, 3, 6), 9, 1e-9)
  hints:
  - Think of RK4 as a better guess for the average slope over the step.
  solution: |
    def euler(df, y0, t0, t1, n):
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            y += h * df(t, y)
            t += h
        return y


    def euler_path(df, y0, t0, t1, n):
