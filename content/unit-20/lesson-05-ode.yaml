    def rk4(df, y0, t0, t1, n):
        """The fourth-order Runge-Kutta method: each step averages four slopes (start, two in the middle, end). Returns the final y."""
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            k1 = df(t, y)
            k2 = df(t + h / 2, y + h / 2 * k1)
            k3 = df(t + h / 2, y + h / 2 * k2)
            k4 = df(t + h, y + h * k3)
            y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)
            t += h
        return y


    def newton_cooling(temp0, ambient, k, minutes, steps=1000):
        """Temperature after `minutes` if it changes at the rate -k * (temp - ambient). Use rk4."""
        return rk4(lambda t, temp: -k * (temp - ambient), temp0, 0, minutes, steps)


    def time_to_cool(temp0, ambient, k, target, dt=0.01):
        """Minutes until the object first reaches `target` (take steps of dt with Euler's method).
        ValueError if the target can never be reached (not between the start and ambient temperature)."""
        if temp0 == target:
            return 0.0
        if not (min(temp0, ambient) < target < max(temp0, ambient)):
            raise ValueError("the target is never reached")
        t, temp = 0.0, temp0
        going_down = temp0 > ambient
        while (temp > target) if going_down else (temp < target):
            temp += dt * (-k * (temp - ambient))
            t += dt
        return t
  explanation: The temperature approaches the room temperature but never reaches it.
- id: logistic
  title: Logistic growth
  difficulty: 4
  prompt: 'The starter has `rk4`. Write `logistic(p0, r, capacity, t, n=1000)`: the population at time `t` for `p'' = r * p * (1 - p / capacity)` starting from `p0` at time 0, using `rk4`.'
  starter: |
    def rk4(df, y0, t0, t1, n):
        """The fourth-order Runge-Kutta method: each step averages four slopes (start, two in the middle, end). Returns the final y."""
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            k1 = df(t, y)
            k2 = df(t + h / 2, y + h / 2 * k1)
            k3 = df(t + h / 2, y + h / 2 * k2)
            k4 = df(t + h, y + h * k3)
            y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)
            t += h
        return y


    def logistic(p0, r, capacity, t, n=1000):
        pass
  tests:
  - name: S-shaped growth
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      assert abs(logistic(1, 1, 1000, 0) - 1) < 1e-12
      exact = lambda t: 1000 / (1 + 999 * math.exp(-t))
      for t in (1, 5, 10, 20):
          assert abs(logistic(1, 1, 1000, t) - exact(t)) < 1e-4 * max(1, exact(t)), t
      assert abs(logistic(1, 1, 1000, 100) - 1000) < 1e-6
  - name: carrying capacity
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      assert abs(logistic(1500, 0.8, 1000, 40) - 1000) < 1e-6
      assert abs(logistic(0, 1, 100, 10)) < 1e-12
      assert abs(logistic(100, 0.5, 100, 10) - 100) < 1e-9
      early = logistic(1, 0.5, 10 ** 6, 3)
      import math
      assert abs(early - math.exp(1.5)) / early < 1e-2
  hints:
  - 'The slope function is `lambda time, p: r * p * (1 - p / capacity)`.'
  solution: |
    def rk4(df, y0, t0, t1, n):
        """The fourth-order Runge-Kutta method: each step averages four slopes (start, two in the middle, end). Returns the final y."""
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            k1 = df(t, y)
            k2 = df(t + h / 2, y + h / 2 * k1)
            k3 = df(t + h / 2, y + h / 2 * k2)
            k4 = df(t + h, y + h * k3)
            y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)
            t += h
        return y


    def logistic(p0, r, capacity, t, n=1000):
        """Population growing at rate r * p * (1 - p / capacity). Returns the population at time t (use rk4)."""
        return rk4(lambda time, p: r * p * (1 - p / capacity), p0, 0, t, n)
