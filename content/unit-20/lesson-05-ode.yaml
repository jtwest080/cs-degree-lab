  tests:
  - name: decay
    code: |
      import math
      assert euler_decay(1, 0, 5, 10) == 1
      assert abs(euler_decay(1, 1, 1, 100000) - math.exp(-1)) < 1e-4
      assert abs(euler_decay(100, 2, 0, 10) - 100) < 1e-12
  solution: |
    def euler_decay(y0, k, t, n):
        h = t / n
        y = y0
        for _ in range(n):
            y += h * (-k * y)
        return y
