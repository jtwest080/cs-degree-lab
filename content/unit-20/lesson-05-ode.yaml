        h = (t1 - t0) / n
        points = [(t0, y0)]
        t, y = t0, y0
        for i in range(n):
            y += h * df(t, y)
            t = t0 + (i + 1) * h
            points.append((t, y))
        return points


    def rk4(df, y0, t0, t1, n):
        """The fourth-order Runge-Kutta method: each step averages four slopes (start, two in the middle, end). Returns the final y."""
        h = (t1 - t0) / n
        t, y = t0, y0
        for _ in range(n):
            k1 = df(t, y)
            k2 = df(t + h / 2, y + h / 2 * k1)
            k3 = df(t + h / 2, y + h / 2 * k2)
            k4 = df(t + h, y + h * k3)
            y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)
            t += h
        return y
  explanation: RK4 gets a lot more accuracy for four slope evaluations.
