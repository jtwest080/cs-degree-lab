  solution: |
    def exp_series(x, terms=30):
        """e^x = 1 + x + x^2/2! + x^3/3! + ... Each term is the previous one times x / k."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= x / (k + 1)
        return total


    def sin_series(x, terms=15):
        """sin x = x - x^3/3! + x^5/5! - ..."""
        total, term = 0.0, float(x)
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 2) * (2 * k + 3))
        return total


    def cos_series(x, terms=15):
        """cos x = 1 - x^2/2! + x^4/4! - ..."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 1) * (2 * k + 2))
        return total


    def terms_needed(series, x, true_value, tol=1e-9, max_terms=200):
        """The smallest number of terms (1, 2, 3, ...) for which series(x, terms) is within tol of true_value.
        ValueError if max_terms is not enough."""
        for n in range(1, max_terms + 1):
            if abs(series(x, n) - true_value) <= tol:
                return n
        raise ValueError("not accurate enough within max_terms terms")
  explanation: Measuring how fast an approximation improves is a basic numerical skill.
- id: pi
  title: Computing pi
  difficulty: 4
  prompt: Write `arctan_series(x, terms=50)` (the sum of `(-1)^k x^(2k+1) / (2k+1)`; `ValueError` if `abs(x) > 1`), `pi_leibniz(terms)` (`4 * arctan_series(1, terms)`) and `pi_machin(terms=10)` (`4 * (4 * arctan_series(1/5, terms) - arctan_series(1/239, terms))`).
  starter: |
    def arctan_series(x, terms=50):
        pass


    def pi_leibniz(terms):
        pass


    def pi_machin(terms=10):
        pass
  tests:
  - name: arctan and pi
    code: |
      def close(a, b, tol=1e-9):
          return abs(a - b) < tol

      import math
      assert close(arctan_series(1, 5000), math.pi / 4, 1e-3)
      assert close(arctan_series(0.5, 40), math.atan(0.5), 1e-12)
      assert close(arctan_series(-0.2, 20), math.atan(-0.2), 1e-12)
      for bad in (1.5, -2):
          try:
              arctan_series(bad)
              raise AssertionError("accepted")
          except ValueError:
              pass
  - name: two ways to compute pi
    code: |
      def close(a, b, tol=1e-9):
          return abs(a - b) < tol

      import math
      assert abs(pi_leibniz(1000) - math.pi) < 2e-3
      assert abs(pi_leibniz(1000) - math.pi) > 1e-4
      assert pi_leibniz(1) == 4.0
      assert close(pi_machin(), math.pi, 1e-14)
      assert close(pi_machin(3), math.pi, 1e-4)
      assert abs(pi_machin(5) - math.pi) < abs(pi_leibniz(10) - math.pi) / 1000
  hints:
  - 'Same series, different arguments: smaller arguments converge much faster.'
  solution: |
    def arctan_series(x, terms=50):
        """arctan x = x - x^3/3 + x^5/5 - ... (only valid for |x| <= 1; ValueError otherwise)."""
        if abs(x) > 1:
            raise ValueError("the series needs |x| <= 1")
        return sum((-1) ** k * x ** (2 * k + 1) / (2 * k + 1) for k in range(terms))


    def pi_leibniz(terms):
        """Pi from 4 * (1 - 1/3 + 1/5 - ...). Converges, but very slowly."""
        return 4 * arctan_series(1, terms)


    def pi_machin(terms=10):
        """Machin's formula: pi = 4 * (4 * arctan(1/5) - arctan(1/239)). Converges very fast."""
        return 4 * (4 * arctan_series(1 / 5, terms) - arctan_series(1 / 239, terms))
  explanation: The same series with a smaller input is millions of times faster.
