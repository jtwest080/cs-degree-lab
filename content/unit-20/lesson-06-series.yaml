exercises:
- id: geometric
  title: Partial sums and geometric series
  difficulty: 3
  prompt: The starter imports `Fraction`. Write `partial_sums(term, n)` (a list of the running totals of `term(0)`, `term(1)`, ..., `n` of them), `geometric_sum(a, r, n)` (the first `n` terms by the formula `a * (1 - r^n) / (1 - r)`, using `Fraction`s; `a * n` if `r == 1`; `ValueError` for negative `n`) and `geometric_limit(a, r)` (`a / (1 - r)` as a `Fraction` when `abs(r) < 1`, otherwise `None`).
  starter: |
    from fractions import Fraction


    def partial_sums(term, n):
        pass


    def geometric_sum(a, r, n):
        pass


    def geometric_limit(a, r):
        pass
  tests:
  - name: sums
    code: |
      from fractions import Fraction
      assert partial_sums(lambda k: k + 1, 5) == [1, 3, 6, 10, 15]
      assert partial_sums(lambda k: 1 / 2 ** (k + 1), 3) == [0.5, 0.75, 0.875]
      assert partial_sums(lambda k: 1, 0) == []
      assert geometric_sum(1, 2, 5) == 31 and geometric_sum(3, 1, 4) == 12 and geometric_sum(5, 3, 0) == 0
      assert geometric_sum(1, Fraction(1, 2), 3) == Fraction(7, 4)
      assert geometric_sum(2, -1, 3) == 2
      try:
          geometric_sum(1, 2, -1)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: infinite geometric series
    code: |
      from fractions import Fraction
      assert geometric_limit(1, Fraction(1, 2)) == 2
      assert geometric_limit(3, Fraction(1, 3)) == Fraction(9, 2)
      assert geometric_limit(1, Fraction(-1, 2)) == Fraction(2, 3)
      assert geometric_limit(1, 1) is None and geometric_limit(1, -1) is None and geometric_limit(5, 3) is None
      assert geometric_limit(0, Fraction(1, 2)) == 0
      assert float(geometric_limit(1, Fraction(9, 10))) == 10.0
  hints:
  - For `r == 1` every term equals `a`.
  solution: |
    from fractions import Fraction


    def partial_sums(term, n):
        """The running totals term(0), term(0)+term(1), ... for the first n terms (a list of length n)."""
        sums, total = [], 0
        for k in range(n):
            total += term(k)
            sums.append(total)
        return sums


    def geometric_sum(a, r, n):
        """a + a*r + a*r^2 + ... with n terms, by the closed form a * (1 - r^n) / (1 - r) (n * a when r is 1)."""
        if n < 0:
            raise ValueError("n cannot be negative")
        if r == 1:
            return a * n
        return Fraction(a) * (1 - Fraction(r) ** n) / (1 - Fraction(r))


    def geometric_limit(a, r):
        """The sum of the infinite series a + a*r + a*r^2 + ..., which is a / (1 - r) when |r| < 1; otherwise None (it does not settle)."""
        if abs(r) >= 1:
            return None
        return Fraction(a) / (1 - Fraction(r))
  explanation: Closed forms turn infinite sums into one division.
- id: taylor
  title: Taylor series
  difficulty: 4
  prompt: 'Write `exp_series(x, terms=30)`, `sin_series(x, terms=15)` and `cos_series(x, terms=15)`, each adding up `terms` terms of its series as floats. Build every term from the previous one: for the exponential, `term *= x / (k + 1)` (starting at 1.0); for sine, start at `x` and use `term *= -x * x / ((2k + 2)(2k + 3))`; for cosine, start at 1.0 and use `term *= -x * x / ((2k + 1)(2k + 2))`, where `k` counts from 0.'
  starter: |
    def exp_series(x, terms=30):
        pass


    def sin_series(x, terms=15):
        pass


    def cos_series(x, terms=15):
        pass
  tests:
  - name: e to the x
    code: |
      def close(a, b, tol=1e-9):
          return abs(a - b) < tol

      import math
      assert exp_series(0) == 1
      for x in (1, -1, 2.5, -3, 0.1):
          assert close(exp_series(x), math.exp(x), 1e-9 * max(1, math.exp(x)))
      assert exp_series(1, 1) == 1 and exp_series(1, 2) == 2 and exp_series(1, 3) == 2.5
  - name: sine and cosine
    code: |
      def close(a, b, tol=1e-9):
          return abs(a - b) < tol

      import math
      assert sin_series(0) == 0 and cos_series(0) == 1
      for x in (0.5, 1, -1, 2, math.pi / 2, 3):
          assert close(sin_series(x), math.sin(x))
          assert close(cos_series(x), math.cos(x))
      assert sin_series(1.0, 1) == 1.0 and close(sin_series(1.0, 2), 1 - 1 / 6)
      assert cos_series(1.0, 1) == 1.0 and close(cos_series(1.0, 2), 0.5)
  hints:
  - Add the current term first, then compute the next one.
  solution: |
    def exp_series(x, terms=30):
        """e^x = 1 + x + x^2/2! + x^3/3! + ... Each term is the previous one times x / k."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= x / (k + 1)
        return total


    def sin_series(x, terms=15):
        """sin x = x - x^3/3! + x^5/5! - ..."""
        total, term = 0.0, float(x)
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 2) * (2 * k + 3))
        return total


    def cos_series(x, terms=15):
        """cos x = 1 - x^2/2! + x^4/4! - ..."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 1) * (2 * k + 2))
        return total
  explanation: A loop that multiplies by one small factor per step avoids huge factorials.
