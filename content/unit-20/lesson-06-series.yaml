id: u20-series
title: Infinite Series and Taylor Series
minutes: 80
objective: Discover how adding infinitely many numbers can give a finite answer, and how almost any smooth function (sin, cos, e to the x) can be turned into an endless polynomial that a computer can add up. You will learn how calculators compute these functions and compute pi to many digits.
outcomes:
- Add up a geometric series and say when it converges
- Explain a Taylor series as a polynomial that matches a function's derivatives
- Compute e^x, sin and cos from their series
- Measure how many terms an approximation needs
- Use argument reduction to make series accurate for any input
sections:
- heading: Adding forever
  body: |-
    What is `1/2 + 1/4 + 1/8 + 1/16 + ...`, with no end? Every term is half the last. After one term you have 0.5, then 0.75, 0.875, 0.9375: each total gets closer to 1 without ever passing it. The **partial sums** (the running totals) converge to **1**, so we say the infinite series **converges** to 1. It is the limit idea of lesson 1, applied to a list of sums.

    This is a **geometric series**: each term is the previous one times a fixed number `r`, the **ratio**. If `|r| < 1` the series converges to `a / (1 - r)`, where `a` is the first term: with a = 1/2 and r = 1/2 that is 1. If `|r| >= 1` the terms do not shrink and the sum **diverges** (it does not settle). Doubling forever, `1 + 2 + 4 + ...`, just explodes. The famous `0.999... = 9/10 + 9/100 + ...` is geometric with a = 9/10 and r = 1/10, so it equals `(9/10) / (9/10) = 1` exactly. Not "almost": exactly.
- heading: 'Taylor series: functions as endless polynomials'
  body: |-
    Polynomials are easy: you can evaluate them with only multiplication and addition, which is all a computer chip really does. Can we turn *other* functions into polynomials? Yes! Near a point, a smooth function is matched by a polynomial that has the same value, the same slope, the same bend (second derivative) and so on. That **Taylor series** (around 0) has the form `f(0) + f'(0) x + f''(0) x^2 / 2! + (third derivative at 0) x^3 / 3! + ...`, where `n!` ("n factorial") is `1 * 2 * ... * n`.

    For the exponential function every derivative is `e^x`, which is 1 at 0, so `e^x = 1 + x + x^2/2! + x^3/3! + ...`. For sine the derivatives cycle through cos, -sin, -cos, sin, so only odd powers survive and the signs alternate: `sin x = x - x^3/3! + x^5/5! - ...`. Cosine uses the even powers. Each term is the previous one times a simple factor (`x / k` for the exponential), so a loop produces them without ever computing a huge factorial.

    How good is it? Four terms of `sin(1)` give 0.84147 (true: 0.841471). The trouble: near the point you are fine, but for large `x` you need many terms and, worse, the huge terms cancel each other and rounding spoils the answer. That brings us to **argument reduction**.
- heading: Making it work for any input
  body: |-
    Real math libraries combine series with a trick: first shrink the input into a range where the series is excellent. Sine repeats every `2 pi`, so `sin(100)` equals the sine of `100` minus a whole number of turns, a small number near zero. For the exponential, `e^x = (e^(x/2))^2`, so keep halving `x` until it is small, apply the series, and square the answer back up. A few terms then give full double-precision accuracy for any input. (Real libraries use cleverer polynomials and tables, but the idea is the same one.)

    Series also give us numbers like **pi**. `arctan(x) = x - x^3/3 + x^5/5 - ...` for `|x| <= 1`, and `arctan(1) = pi / 4`, which gives the **Leibniz series** `pi = 4 (1 - 1/3 + 1/5 - ...)`. It is beautiful and hopelessly slow: 1,000 terms yield only about three correct digits. **Machin's formula** `pi = 4 (4 arctan(1/5) - arctan(1/239))` uses tiny arguments so the powers shrink very fast: ten terms are exact to double precision. Choosing the right series matters as much as having one.
examples:
- title: Geometric series
  intro: Partial sums close in on the limit; 0.999... equals 1; doubling has no limit.
  code: |
    from fractions import Fraction


    def partial_sums(term, n):
        """The running totals term(0), term(0)+term(1), ... for the first n terms (a list of length n)."""
        sums, total = [], 0
        for k in range(n):
            total += term(k)
            sums.append(total)
        return sums


    def geometric_sum(a, r, n):
        """a + a*r + a*r^2 + ... with n terms, by the closed form a * (1 - r^n) / (1 - r) (n * a when r is 1)."""
        if n < 0:
            raise ValueError("n cannot be negative")
        if r == 1:
            return a * n
        return Fraction(a) * (1 - Fraction(r) ** n) / (1 - Fraction(r))


    def geometric_limit(a, r):
        """The sum of the infinite series a + a*r + a*r^2 + ..., which is a / (1 - r) when |r| < 1; otherwise None (it does not settle)."""
        if abs(r) >= 1:
            return None
        return Fraction(a) / (1 - Fraction(r))


    print("partial sums of 1/2 + 1/4 + 1/8 + ...:", [float(s) for s in partial_sums(lambda k: Fraction(1, 2 ** (k + 1)), 6)])
    print("limit:", geometric_limit(Fraction(1, 2), Fraction(1, 2)))
    print("0.999... as a series 9/10 + 9/100 + ...:", geometric_limit(Fraction(9, 10), Fraction(1, 10)))
    print("doubling forever has a limit?", geometric_limit(1, 2))
  output: |
    partial sums of 1/2 + 1/4 + 1/8 + ...: [0.5, 0.75, 0.875, 0.9375, 0.96875, 0.984375]
    limit: 1
    0.999... as a series 9/10 + 9/100 + ...: 1
    doubling forever has a limit? None
  lines:
  - line: 29
    note: Closing in on 1.
  - line: 31
    note: Exactly 1.
- title: Taylor series
  intro: Compare e to the x, sin and cos from their series to the true values and count the terms needed.
  code: |
    def exp_series(x, terms=30):
        """e^x = 1 + x + x^2/2! + x^3/3! + ... Each term is the previous one times x / k."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= x / (k + 1)
        return total


    def sin_series(x, terms=15):
        """sin x = x - x^3/3! + x^5/5! - ..."""
        total, term = 0.0, float(x)
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 2) * (2 * k + 3))
        return total


    def cos_series(x, terms=15):
        """cos x = 1 - x^2/2! + x^4/4! - ..."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 1) * (2 * k + 2))
        return total


    def terms_needed(series, x, true_value, tol=1e-9, max_terms=200):
        """The smallest number of terms (1, 2, 3, ...) for which series(x, terms) is within tol of true_value.
        ValueError if max_terms is not enough."""
        for n in range(1, max_terms + 1):
            if abs(series(x, n) - true_value) <= tol:
                return n
        raise ValueError("not accurate enough within max_terms terms")


    import math
    for x in (1, 2, -1):
        print("e^" + str(x), "series:", round(exp_series(x), 9), "true:", round(math.exp(x), 9))
    print("sin(1) with 1, 2, 3, 4 terms:", [round(sin_series(1, n), 8) for n in (1, 2, 3, 4)], "true", round(math.sin(1), 8))
    print("terms needed for e to 9 places:", terms_needed(exp_series, 1, math.e, 1e-9))
    print("terms needed for sin(3) to 6 places:", terms_needed(sin_series, 3, math.sin(3), 1e-6))
  output: |
    e^1 series: 2.718281828 true: 2.718281828
    e^2 series: 7.389056099 true: 7.389056099
    e^-1 series: 0.367879441 true: 0.367879441
    sin(1) with 1, 2, 3, 4 terms: [1.0, 0.83333333, 0.84166667, 0.84146825] true 0.84147098
    terms needed for e to 9 places: 13
    terms needed for sin(3) to 6 places: 8
  lines:
  - line: 38
    note: The series match the true values.
  - line: 42
    note: Further from 0 needs more terms.
- title: Computing pi
  intro: Leibniz is slow; Machin is very fast.
  code: |
    def arctan_series(x, terms=50):
        """arctan x = x - x^3/3 + x^5/5 - ... (only valid for |x| <= 1; ValueError otherwise)."""
        if abs(x) > 1:
            raise ValueError("the series needs |x| <= 1")
        return sum((-1) ** k * x ** (2 * k + 1) / (2 * k + 1) for k in range(terms))


    def pi_leibniz(terms):
        """Pi from 4 * (1 - 1/3 + 1/5 - ...). Converges, but very slowly."""
        return 4 * arctan_series(1, terms)


    def pi_machin(terms=10):
        """Machin's formula: pi = 4 * (4 * arctan(1/5) - arctan(1/239)). Converges very fast."""
        return 4 * (4 * arctan_series(1 / 5, terms) - arctan_series(1 / 239, terms))


    import math
    print("Leibniz, 10 terms   :", round(pi_leibniz(10), 6))
    print("Leibniz, 1000 terms :", round(pi_leibniz(1000), 6))
    print("Machin, 3 terms     :", round(pi_machin(3), 10))
    print("Machin, 10 terms    :", round(pi_machin(10), 10))
    print("math.pi             :", round(math.pi, 10))
  output: |
    Leibniz, 10 terms   : 3.04184
    Leibniz, 1000 terms : 3.140593
    Machin, 3 terms     : 3.1416210293
    Machin, 10 terms    : 3.1415926536
    math.pi             : 3.1415926536
  lines:
  - line: 20
    note: Slow.
  - line: 21
    note: Fast.
- title: A mini math library
  intro: Argument reduction makes the series accurate for large inputs.
  code: |
    import math


    def exp_series(x, terms=30):
        """e^x = 1 + x + x^2/2! + x^3/3! + ... Each term is the previous one times x / k."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= x / (k + 1)
        return total


    def sin_series(x, terms=15):
        """sin x = x - x^3/3! + x^5/5! - ..."""
        total, term = 0.0, float(x)
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 2) * (2 * k + 3))
        return total


    def cos_series(x, terms=15):
        """cos x = 1 - x^2/2! + x^4/4! - ..."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 1) * (2 * k + 2))
        return total


    def my_exp(x):
        """e^x accurate for large |x|: halve x until it is small, use the series, then square the result back up."""
        halvings = 0
        while abs(x) > 0.5:
            x /= 2
            halvings += 1
        result = exp_series(x, 20)
        for _ in range(halvings):
            result *= result
        return result


    def my_sin(x):
        """sin x for any x: first shift x into [-pi, pi] by subtracting a whole number of turns, then use the series."""
        turns = round(x / (2 * math.pi))
        return sin_series(x - 2 * math.pi * turns, 20)


    def my_cos(x):
        turns = round(x / (2 * math.pi))
        return cos_series(x - 2 * math.pi * turns, 20)


    for x in (30, -7.5, 100):
        print("x =", x, "my_sin:", round(my_sin(x), 9), "math.sin:", round(math.sin(x), 9))
    print("my_exp(10):", round(my_exp(10), 6), "math.exp(10):", round(math.exp(10), 6))
  output: |
    x = 30 my_sin: -0.988031624 math.sin: -0.988031624
    x = -7.5 my_sin: -0.937999977 math.sin: -0.937999977
    x = 100 my_sin: -0.506365641 math.sin: -0.506365641
    my_exp(10): 22026.465795 math.exp(10): 22026.465795
  lines:
  - line: 54
    note: Reduction keeps big inputs accurate.
