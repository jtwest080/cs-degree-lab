  solution: |
    import math


    def exp_series(x, terms=30):
        """e^x = 1 + x + x^2/2! + x^3/3! + ... Each term is the previous one times x / k."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= x / (k + 1)
        return total


    def sin_series(x, terms=15):
        """sin x = x - x^3/3! + x^5/5! - ..."""
        total, term = 0.0, float(x)
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 2) * (2 * k + 3))
        return total


    def cos_series(x, terms=15):
        """cos x = 1 - x^2/2! + x^4/4! - ..."""
        total, term = 0.0, 1.0
        for k in range(terms):
            total += term
            term *= -x * x / ((2 * k + 1) * (2 * k + 2))
        return total


    def my_exp(x):
        """e^x accurate for large |x|: halve x until it is small, use the series, then square the result back up."""
        halvings = 0
        while abs(x) > 0.5:
            x /= 2
            halvings += 1
        result = exp_series(x, 20)
        for _ in range(halvings):
            result *= result
        return result


    def my_sin(x):
        """sin x for any x: first shift x into [-pi, pi] by subtracting a whole number of turns, then use the series."""
        turns = round(x / (2 * math.pi))
        return sin_series(x - 2 * math.pi * turns, 20)


    def my_cos(x):
        turns = round(x / (2 * math.pi))
        return cos_series(x - 2 * math.pi * turns, 20)
  explanation: Series plus a little reduction rivals the real library.
commonMistakes:
- title: Thinking an infinite sum must be infinite
  explanation: If the terms shrink fast enough the total is a finite number.
- title: Using a series far from its centre
  explanation: Reduce the input first or you need many terms and lose accuracy.
- title: Computing factorials directly
  explanation: They overflow quickly; build each term from the previous.
- title: Assuming 0.999... is just under 1
  explanation: It equals 1 exactly.
summary:
- A convergent series has partial sums that approach a limit.
- A geometric series converges to a / (1 - r) when |r| < 1.
- Taylor series write smooth functions as endless polynomials.
- Each term comes from the previous one with a small factor.
- Argument reduction and a good series make a fast accurate library.
