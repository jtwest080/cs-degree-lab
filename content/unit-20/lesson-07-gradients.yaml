    import math


    def partial(f, x, i, h=1e-6):
        """How fast f changes when only input number i moves: the slope along axis i."""
        up = list(x)
        down = list(x)
        up[i] += h
        down[i] -= h
        return (f(up) - f(down)) / (2 * h)


    def gradient(f, x, h=1e-6):
        """The list of all partial derivatives of f at the point x."""
        return [partial(f, x, i, h) for i in range(len(x))]


    def norm(v):
        return math.sqrt(sum(a * a for a in v))


    def gradient_descent(f, x0, rate=0.1, tol=1e-8, max_steps=10000):
        """Repeat x <- x - rate * gradient until the gradient is shorter than tol. Returns (point, steps_used).
        If max_steps run out, return the current point with steps_used equal to max_steps."""
        x = list(x0)
        for step in range(max_steps):
            g = gradient(f, x)
            if norm(g) < tol:
                return x, step
