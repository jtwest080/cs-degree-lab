exercises:
- id: partials
  title: Partial derivatives and the gradient
  difficulty: 3
  prompt: 'The starter imports `math`. Write `partial(f, x, i, h=1e-6)`: copy the point `x` twice, add `h` to entry `i` of one and subtract it from the other, and return `(f(up) - f(down)) / (2 * h)`. Write `gradient(f, x, h=1e-6)`: the list of all partials. `f` takes a list. Do not change `x`.'
  starter: |
    import math


    def partial(f, x, i, h=1e-6):
        pass


    def gradient(f, x, h=1e-6):
        pass
  tests:
  - name: partial derivatives
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      f = lambda p: p[0] ** 2 * p[1] + 3 * p[1]
      assert close(partial(f, [2, 5], 0), 20, 1e-5)      # d/dx = 2xy
      assert close(partial(f, [2, 5], 1), 7, 1e-5)       # d/dy = x^2 + 3
      assert close(partial(lambda p: p[0] + 2 * p[1] + 3 * p[2], [1, 1, 1], 2), 3, 1e-6)
      assert close(partial(lambda p: 5, [1, 2], 0), 0, 1e-9)
  - name: the gradient
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      import math
      g = gradient(lambda p: p[0] ** 2 + p[1] ** 2, [3, -4])
      assert len(g) == 2 and close(g[0], 6, 1e-5) and close(g[1], -8, 1e-5)
      g = gradient(lambda p: math.sin(p[0]) * math.cos(p[1]), [0.5, 0.25])
      assert close(g[0], math.cos(0.5) * math.cos(0.25), 1e-6) and close(g[1], -math.sin(0.5) * math.sin(0.25), 1e-6)
      g = gradient(lambda p: p[0] * p[1] * p[2], [2, 3, 4])
      assert all(close(a, b, 1e-4) for a, b in zip(g, [12, 8, 6]))
      p = [1.0, 2.0]
      gradient(lambda q: q[0] + q[1], p)
      assert p == [1.0, 2.0]
  hints:
  - '`list(x)` makes a copy.'
  solution: |
    import math


    def partial(f, x, i, h=1e-6):
        """How fast f changes when only input number i moves: the slope along axis i."""
        up = list(x)
        down = list(x)
        up[i] += h
        down[i] -= h
        return (f(up) - f(down)) / (2 * h)


    def gradient(f, x, h=1e-6):
        """The list of all partial derivatives of f at the point x."""
        return [partial(f, x, i, h) for i in range(len(x))]
  explanation: Nudge one input at a time.
