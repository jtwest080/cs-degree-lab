- id: fit-line
  title: Training a line
  difficulty: 4
  prompt: Write `fit_line_gd(xs, ys, rate=0.01, epochs=5000)`. Raise `ValueError` for unequal lengths or empty data. Start with `m = b = 0.0`. Each epoch compute `errors = m * x + b - y` for every point, then `grad_m = 2 * mean(x * error)` and `grad_b = 2 * mean(error)` and update `m -= rate * grad_m`, `b -= rate * grad_b`. Return `(m, b)`.
  starter: |
    def fit_line_gd(xs, ys, rate=0.01, epochs=5000):
        pass
  tests:
  - name: fitting lines by descent
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      m, b = fit_line_gd([0, 1, 2, 3], [1, 3, 5, 7], 0.05, 5000)
      assert close(m, 2, 1e-3) and close(b, 1, 1e-3)
      m, b = fit_line_gd([1, 2, 3, 4, 5], [2, 4, 6, 8, 10], 0.02, 5000)
      assert close(m, 2, 1e-3) and close(b, 0, 1e-2)
      m, b = fit_line_gd([0, 1, 2, 3, 4], [1, 3, 2, 5, 4], 0.05, 8000)
      assert close(m, 0.8, 1e-3) and close(b, 1.4, 1e-3)
  - name: bad data and no training
    code: |
      assert fit_line_gd([1, 2], [3, 4], 0.1, 0) == (0.0, 0.0)
      for xs, ys in (([1, 2], [1]), ([], [])):
          try:
              fit_line_gd(xs, ys)
              raise AssertionError("accepted")
          except ValueError:
              pass
  hints:
  - The mean is the sum divided by `n`.
  solution: |
    def fit_line_gd(xs, ys, rate=0.01, epochs=5000):
        """Fit y = m x + b by gradient descent on the mean squared error. The gradient of
        mean((m x + b - y)^2) is [2 * mean(x * err), 2 * mean(err)]. Start at m = b = 0. Returns (m, b)."""
        if len(xs) != len(ys) or not xs:
            raise ValueError("need equal-length, non-empty data")
        n = len(xs)
        m = b = 0.0
        for _ in range(epochs):
            errors = [m * x + b - y for x, y in zip(xs, ys)]
            grad_m = 2 * sum(x * e for x, e in zip(xs, errors)) / n
            grad_b = 2 * sum(errors) / n
            m -= rate * grad_m
            b -= rate * grad_b
        return m, b
  explanation: Training a model means running this loop.
- id: backtracking
  title: 'Capstone: choosing its own step size'
  difficulty: 5
  prompt: 'The starter has `gradient` and `norm`. Write `backtracking_descent(f, x0, tol=1e-8, max_iter=10000)`: in each iteration compute the gradient (stop if its length is below `tol`), then try `step = 1.0` and halve it until `f` at `x - step * gradient` is lower than `f(x)` (give up and return the current point if `step` falls below `1e-12`); move there. Return the final point as a list.'
  starter: |
    import math


    def partial(f, x, i, h=1e-6):
        """How fast f changes when only input number i moves: the slope along axis i."""
        up = list(x)
        down = list(x)
        up[i] += h
        down[i] -= h
        return (f(up) - f(down)) / (2 * h)


    def gradient(f, x, h=1e-6):
        """The list of all partial derivatives of f at the point x."""
        return [partial(f, x, i, h) for i in range(len(x))]


    def norm(v):
        return math.sqrt(sum(a * a for a in v))


    def backtracking_descent(f, x0, tol=1e-8, max_iter=10000):
        pass
  tests:
  - name: picks its own step size
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      x = backtracking_descent(lambda p: (p[0] - 3) ** 2 + 100 * (p[1] + 1) ** 2, [0, 0])
      assert close(x[0], 3, 1e-4) and close(x[1], -1, 1e-4)
      x = backtracking_descent(lambda p: p[0] ** 2 + p[0] * p[1] + p[1] ** 2 - 3 * p[0], [5, 5])
      assert close(x[0], 2, 1e-4) and close(x[1], -1, 1e-4)
      x = backtracking_descent(lambda p: (p[0] - 1) ** 2 + (p[1] - 1) ** 2 + (p[2] - 1) ** 2, [9, -9, 4])
      assert all(close(v, 1, 1e-4) for v in x)
  - name: already at the bottom, and not changing the input
    code: |
      x = backtracking_descent(lambda p: p[0] ** 2 + p[1] ** 2, [0.0, 0.0])
      assert x == [0.0, 0.0]
      start = [3.0, 3.0]
      backtracking_descent(lambda p: p[0] ** 2 + p[1] ** 2, start)
      assert start == [3.0, 3.0]
  hints:
  - A `while ... else` or a flag tells you whether a good step was found.
  solution: |
    import math


    def partial(f, x, i, h=1e-6):
        """How fast f changes when only input number i moves: the slope along axis i."""
        up = list(x)
        down = list(x)
        up[i] += h
        down[i] -= h
        return (f(up) - f(down)) / (2 * h)


    def gradient(f, x, h=1e-6):
        """The list of all partial derivatives of f at the point x."""
        return [partial(f, x, i, h) for i in range(len(x))]


    def norm(v):
        return math.sqrt(sum(a * a for a in v))


    def backtracking_descent(f, x0, tol=1e-8, max_iter=10000):
        """Gradient descent that picks its own step size: start each iteration with step 1 and halve it until
        the step really lowers f. Stop when the gradient is shorter than tol. Returns the final point."""
        x = list(x0)
        for _ in range(max_iter):
            g = gradient(f, x)
            if norm(g) < tol:
                break
            step = 1.0
            fx = f(x)
            while step > 1e-12:
                candidate = [xi - step * gi for xi, gi in zip(x, g)]
                if f(candidate) < fx:
                    break
                step /= 2
            else:
                break
            x = candidate
        return x
  explanation: 'No learning rate to tune: the algorithm finds one that works.'
commonMistakes:
- title: Forgetting to freeze the other variables
  explanation: A partial derivative changes only one input.
- title: Moving with the gradient instead of against it
  explanation: That climbs the hill. Subtract to descend.
- title: A learning rate that is too large
  explanation: The steps overshoot and the values grow without bound.
- title: Comparing directions that are not unit vectors
  explanation: Scale to length 1 before using a dot product as a slope.
summary:
- A partial derivative changes one input at a time; the gradient collects them all.
- The gradient points straight uphill; its length is the steepness.
- Slope in a direction is the dot product with a unit vector.
- Gradient descent steps against the gradient until it is tiny.
- Learning rates need care; backtracking chooses one automatically.
