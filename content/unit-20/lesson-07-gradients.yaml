  tests:
  - name: finds the bottom of a bowl
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      x, steps = gradient_descent(lambda p: (p[0] - 1) ** 2 + 4 * (p[1] + 2) ** 2, [5, 5])
      assert close(x[0], 1, 1e-5) and close(x[1], -2, 1e-5)
      assert 0 < steps < 10000
      x, steps = gradient_descent(lambda p: p[0] ** 2, [3.0], 0.25)
      assert close(x[0], 0, 1e-6) and steps < 100
      x, steps = gradient_descent(lambda p: p[0] ** 2, [0.0])
      assert x == [0.0] and steps == 0
  - name: limits and bad rates
    code: |
      x, steps = gradient_descent(lambda p: p[0] ** 2, [1.0], 0.001, 1e-8, 20)
      assert steps == 20 and 0 < x[0] < 1
      x, steps = gradient_descent(lambda p: p[0] ** 2, [1.0], 1.5, 1e-8, 20)
      assert abs(x[0]) > 1000
      start = [4.0, 4.0]
      gradient_descent(lambda p: p[0] ** 2 + p[1] ** 2, start)
