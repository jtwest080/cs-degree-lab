  - name: slope in a direction
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      f = lambda p: p[0] ** 2 + p[1] ** 2
      assert close(directional_derivative(f, [3, 4], [1, 0]), 6, 1e-5)
      assert close(directional_derivative(f, [3, 4], [0, 2]), 8, 1e-5)
      assert close(directional_derivative(f, [3, 4], [3, 4]), 10, 1e-4)
      assert close(directional_derivative(f, [3, 4], [-3, -4]), -10, 1e-4)
      assert close(directional_derivative(f, [3, 4], [4, -3]), 0, 1e-5)
      try:
          directional_derivative(f, [1, 1], [0, 0])
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: steepest ascent
    code: |
      def close(a, b, tol=1e-6):
          return abs(a - b) < tol

      f = lambda p: p[0] ** 2 + p[1] ** 2
      u = steepest_ascent(f, [3, 4])
      assert close(u[0], 0.6, 1e-5) and close(u[1], 0.8, 1e-5)
      u = steepest_ascent(lambda p: -2 * p[0] + p[1], [7, 7])
      assert close(u[0], -2 / 5 ** 0.5, 1e-6) and close(u[1], 1 / 5 ** 0.5, 1e-6)
      assert steepest_ascent(f, [0, 0]) is None
      assert steepest_ascent(lambda p: 4, [1, 2]) is None
  hints:
  - Dividing a vector by its norm gives a unit vector.
  solution: |
    import math


    def partial(f, x, i, h=1e-6):
        """How fast f changes when only input number i moves: the slope along axis i."""
        up = list(x)
        down = list(x)
        up[i] += h
        down[i] -= h
        return (f(up) - f(down)) / (2 * h)


    def gradient(f, x, h=1e-6):
        """The list of all partial derivatives of f at the point x."""
        return [partial(f, x, i, h) for i in range(len(x))]


    def norm(v):
        return math.sqrt(sum(a * a for a in v))


    def directional_derivative(f, x, direction, h=1e-6):
        """The slope of f at x when walking along `direction` (scaled to length 1): the dot product of the gradient and the unit direction.
        ValueError for the zero vector."""
        length = norm(direction)
        if length == 0:
            raise ValueError("direction cannot be the zero vector")
        unit = [d / length for d in direction]
        return sum(g * u for g, u in zip(gradient(f, x, h), unit))


    def steepest_ascent(f, x, h=1e-6):
        """The unit vector pointing straight uphill, or None where the ground is flat (gradient length below 1e-9)."""
        g = gradient(f, x, h)
        length = norm(g)
        if length < 1e-9:
            return None
        return [a / length for a in g]
  explanation: The gradient points uphill; sideways is level.
