id: u20-gradients
title: 'Several Variables: Gradients and Gradient Descent'
minutes: 80
objective: Extend calculus from one input to many. You will meet partial derivatives and the gradient, the arrow that points straight uphill, and use them to build the optimizer behind almost all of modern machine learning, then train a model to fit data.
outcomes:
- Compute partial derivatives and the gradient numerically
- Explain why the gradient points toward the steepest increase
- Find the slope in any direction
- Minimize a function of several variables by gradient descent
- Train a line fit by gradient descent and compare with the exact answer
sections:
- heading: More than one input
  body: |-
    Real quantities depend on many inputs. The height of a hill depends on your east-west **and** north-south position: `h(x, y)`. The cost of a delivery depends on distance, weight and speed. A neural network's error depends on millions of numbers. Calculus handles this with one clever step: change **one input at a time**.

    The **partial derivative** of `f` with respect to `x` is the ordinary derivative when you freeze all the other inputs. For `f(x, y) = x^2 y + 3y` the partial with respect to `x` is `2xy` (treat `y` as just a number), and the partial with respect to `y` is `x^2 + 3`. In code we do just what we did in lesson 1: nudge one input a tiny bit each way and divide the change in output by the change in input.

    Collect all the partial derivatives into a list and you have the **gradient**, written with an upside-down triangle (`nabla f`). For `f(x, y) = x^2 + y^2` at the point `(3, 4)` the gradient is `(6, 8)`.
- heading: The gradient points uphill
  body: |-
    Stand on a hillside. In which direction does the ground rise fastest? The gradient. It has two jobs: its **direction** points straight uphill, and its **length** says how steep that climb is. The slope in any other direction is the dot product of the gradient with that direction (as a unit vector, length 1), the **directional derivative**. This is biggest when the direction matches the gradient (cosine of 0 is 1), zero when you walk **perpendicular** to it (along a contour line of constant height, like a hiking trail that stays level), and most negative when you walk exactly opposite: straight downhill. At the very top or bottom, or on flat ground, the gradient is the zero vector.

    That connects to the dot product and cosines from the linear algebra unit, which is why these two subjects always travel together.
- heading: Gradient descent and learning
  body: |-
    To find a minimum, walk downhill: from `x`, step opposite the gradient, `x <- x - rate * gradient`, and repeat until the gradient is tiny. You met the one-variable version in lesson 3. With many variables nothing changes except that `x` and the gradient are lists. This is the algorithm that trains neural networks, where a "point" is the list of all the network's adjustable numbers and `f` is its error on the training data.

    The **learning rate** matters. Too small: progress is glacial. Too big: you overshoot, bouncing from wall to wall of a valley and flying out the top. A bowl that is steeper in one direction than another (like `x^2 + 4 y^2`) forces a compromise, because the steep direction limits the rate you may use. **Backtracking** avoids guesswork: try a big step, and keep halving it until the step actually lowers `f`.

    A practical example is fitting a line to data, which you did exactly with linear algebra in Unit 19. With gradient descent we do not solve anything: we start with `m = b = 0` and repeatedly nudge them downhill on the mean squared error. It lands on the same answer. The difference is that gradient descent also works for models where no exact formula exists, which includes nearly everything interesting.
examples:
- title: Gradient and directional derivatives
  intro: The gradient is the steepest direction; walking perpendicular to it stays level.
  code: |
    import math


    def partial(f, x, i, h=1e-6):
        """How fast f changes when only input number i moves: the slope along axis i."""
        up = list(x)
        down = list(x)
        up[i] += h
        down[i] -= h
        return (f(up) - f(down)) / (2 * h)


    def gradient(f, x, h=1e-6):
        """The list of all partial derivatives of f at the point x."""
        return [partial(f, x, i, h) for i in range(len(x))]


    def norm(v):
        return math.sqrt(sum(a * a for a in v))


    def directional_derivative(f, x, direction, h=1e-6):
        """The slope of f at x when walking along `direction` (scaled to length 1): the dot product of the gradient and the unit direction.
        ValueError for the zero vector."""
        length = norm(direction)
        if length == 0:
            raise ValueError("direction cannot be the zero vector")
        unit = [d / length for d in direction]
        return sum(g * u for g, u in zip(gradient(f, x, h), unit))


    def steepest_ascent(f, x, h=1e-6):
        """The unit vector pointing straight uphill, or None where the ground is flat (gradient length below 1e-9)."""
        g = gradient(f, x, h)
        length = norm(g)
        if length < 1e-9:
            return None
        return [a / length for a in g]


    f = lambda p: p[0] ** 2 + 3 * p[1] ** 2       # a bowl, steeper in the y direction
    print("gradient at (1, 1):", [round(g, 4) for g in gradient(f, [1, 1])])
    print("uphill direction:", [round(u, 4) for u in steepest_ascent(f, [1, 1])])
    print("slope going along x:", round(directional_derivative(f, [1, 1], [1, 0]), 4))
    print("slope going along the gradient:", round(directional_derivative(f, [1, 1], gradient(f, [1, 1])), 4), "(the steepest of all)")
    print("slope going around the hill (perpendicular):", round(directional_derivative(f, [1, 1], [-6, 2]), 4) + 0.0)
    print("at the bottom (0, 0):", steepest_ascent(f, [0, 0]))
  output: |
    gradient at (1, 1): [2.0, 6.0]
    uphill direction: [0.3162, 0.9487]
    slope going along x: 2.0
    slope going along the gradient: 6.3246 (the steepest of all)
    slope going around the hill (perpendicular): 0.0
    at the bottom (0, 0): None
  lines:
  - line: 43
    note: The steepest way up.
  - line: 46
    note: 'Perpendicular to the gradient: level ground.'
- title: Gradient descent and the learning rate
  intro: Different rates reach the same minimum at different speeds; a rate that is too large explodes.
  code: |
    import math


    def partial(f, x, i, h=1e-6):
        """How fast f changes when only input number i moves: the slope along axis i."""
        up = list(x)
        down = list(x)
        up[i] += h
        down[i] -= h
        return (f(up) - f(down)) / (2 * h)


    def gradient(f, x, h=1e-6):
        """The list of all partial derivatives of f at the point x."""
        return [partial(f, x, i, h) for i in range(len(x))]


    def norm(v):
        return math.sqrt(sum(a * a for a in v))


    def gradient_descent(f, x0, rate=0.1, tol=1e-8, max_steps=10000):
        """Repeat x <- x - rate * gradient until the gradient is shorter than tol. Returns (point, steps_used).
        If max_steps run out, return the current point with steps_used equal to max_steps."""
        x = list(x0)
        for step in range(max_steps):
            g = gradient(f, x)
            if norm(g) < tol:
                return x, step
            x = [xi - rate * gi for xi, gi in zip(x, g)]
        return x, max_steps


    f = lambda p: (p[0] - 1) ** 2 + 4 * (p[1] + 2) ** 2
    for rate in (0.05, 0.1, 0.2):
        x, steps = gradient_descent(f, [5, 5], rate)
        print("rate", rate, "->", [round(v, 4) for v in x], "after", steps, "steps")
    x, steps = gradient_descent(f, [5, 5], 0.3, max_steps=30)
    print("rate 0.3 is too big:", [round(v, 1) for v in x])
  output: |
    rate 0.05 -> [1.0, -2.0] after 195 steps
    rate 0.1 -> [1.0, -2.0] after 92 steps
    rate 0.2 -> [1.0, -2.0] after 44 steps
    rate 0.3 is too big: [1.0, 169404.8]
  lines:
  - line: 35
    note: Different rates, same destination.
  - line: 38
    note: Too large a rate blows up.
- title: Training a line
  intro: Gradient descent finds the same line that linear algebra's least squares did.
  code: |
    def fit_line_gd(xs, ys, rate=0.01, epochs=5000):
        """Fit y = m x + b by gradient descent on the mean squared error. The gradient of
        mean((m x + b - y)^2) is [2 * mean(x * err), 2 * mean(err)]. Start at m = b = 0. Returns (m, b)."""
        if len(xs) != len(ys) or not xs:
            raise ValueError("need equal-length, non-empty data")
        n = len(xs)
        m = b = 0.0
        for _ in range(epochs):
            errors = [m * x + b - y for x, y in zip(xs, ys)]
            grad_m = 2 * sum(x * e for x, e in zip(xs, errors)) / n
            grad_b = 2 * sum(errors) / n
            m -= rate * grad_m
            b -= rate * grad_b
        return m, b


    xs = [0, 1, 2, 3, 4]
    ys = [1, 3, 2, 5, 4]
    m, b = fit_line_gd(xs, ys, 0.05, 8000)
    print("slope", round(m, 4), "intercept", round(b, 4), "(least squares from lesson 19.7 gave 4/5 and 7/5 =", 4 / 5, 7 / 5, ")")
  output: |
    slope 0.8 intercept 1.4 (least squares from lesson 19.7 gave 4/5 and 7/5 = 0.8 1.4 )
  lines:
  - line: 19
    note: No formula solved, only repeated downhill steps.
playground:
  prompt: Try the gradient of x*x + y*y at a few points and see that it always points away from the origin.
