title: Calculus Toolkit
language: python
brief: 'Build a small numerical-calculus library: slopes, areas, roots, differential equations, sine from
  a series, gradients and an optimizer that finds the bottom of a bowl. These are the same building blocks
  used in physics engines, financial models and machine learning.'
steps:
- title: Measure change and accumulation
  body: Write `derivative` (a step to each side) and `integrate` (Simpson's rule, with an even slice count;
    refuse bad counts). Use `integrate` to build `area_between`.
- title: Solve equations
  body: Write `find_root` (bisection, which must refuse an interval without a sign change) and `newton`
    (tangent lines, which must refuse a flat slope).
- title: Simulate and approximate
  body: Write `solve_ode` with the Runge-Kutta method and `my_sin` with a Taylor series after subtracting
    whole turns.
- title: Optimize
  body: Write `gradient` (a partial derivative for every input) and `minimize`, which steps against the
    gradient, halving the step until `f` goes down.
checklist:
- text: Estimates slopes
  test: estimates slopes
- text: Integrates with Simpson's rule
  test: integrates
- text: Rejects bad slice counts
  test: rejects a bad slice count
- text: Finds the area between curves
  test: area between curves
- text: Finds roots by bisection
  test: finds roots by bisection
- text: Finds roots with Newton's method
  test: finds roots with Newton's method
- text: Solves differential equations
  test: solves a differential equation
- text: Models logistic growth
  test: logistic growth
- text: Computes sine from a series
  test: sine from a series
- text: Computes gradients
  test: gradients
- text: Minimizes a bowl
  test: minimizes a bowl
- text: Leaves inputs untouched
  test: does not change its input
