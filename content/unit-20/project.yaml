- name: gradients
  code: |
    def close(a, b, tol=1e-6):
        return abs(a - b) < tol

    g = gradient(lambda p: p[0] ** 2 + 3 * p[1], [2, 5])
    assert close(g[0], 4, 1e-5) and close(g[1], 3, 1e-5)
    g = gradient(lambda p: p[0] * p[1] * p[2], [2, 3, 4])
    assert all(close(a, b, 1e-4) for a, b in zip(g, [12, 8, 6]))
- name: minimizes a bowl
  code: |
    def close(a, b, tol=1e-6):
        return abs(a - b) < tol

    x = minimize(lambda p: (p[0] - 3) ** 2 + 10 * (p[1] + 1) ** 2, [0, 0])
    assert close(x[0], 3, 1e-4) and close(x[1], -1, 1e-4)
    x = minimize(lambda p: p[0] ** 2 + p[0] * p[1] + p[1] ** 2 - 3 * p[0], [5, 5])
    assert close(x[0], 2, 1e-4) and close(x[1], -1, 1e-4)
- name: does not change its input
  code: |
    start = [3.0, 3.0]
    minimize(lambda p: p[0] ** 2 + p[1] ** 2, start)
    assert start == [3.0, 3.0]
    assert minimize(lambda p: p[0] ** 2, [0.0]) == [0.0]
    p = [1.0, 2.0]
    gradient(lambda q: q[0] + q[1], p)
    assert p == [1.0, 2.0]
solution: |
  import math


  def derivative(f, x, h=1e-5):
      """Slope of f at x using a step on each side."""
      return (f(x + h) - f(x - h)) / (2 * h)


  def integrate(f, a, b, n=1000):
      """Area under f from a to b by Simpson's rule (n must be even and at least 2)."""
      if n < 2 or n % 2:
          raise ValueError("n must be even and at least 2")
      width = (b - a) / n
      total = f(a) + f(b)
      for i in range(1, n):
          total += (4 if i % 2 else 2) * f(a + i * width)
      return total * width / 3


  def area_between(f, g, a, b):
      """Area between two curves from a to b: the integral of the absolute gap |f - g| (use 2000 slices)."""
      return integrate(lambda x: abs(f(x) - g(x)), a, b, 2000)


  def find_root(f, lo, hi, tol=1e-10):
      """A zero of f between lo and hi by bisection. ValueError if f has the same sign at both ends."""
      if lo > hi:
          lo, hi = hi, lo
      flo, fhi = f(lo), f(hi)
      if flo == 0:
          return lo
      if fhi == 0:
          return hi
      if flo * fhi > 0:
          raise ValueError("f must change sign between lo and hi")
      while hi - lo > tol:
          mid = (lo + hi) / 2
          fm = f(mid)
          if fm == 0:
              return mid
          if flo * fm < 0:
              hi = mid
          else:
              lo, flo = mid, fm
      return (lo + hi) / 2


  def newton(f, df, x0, tol=1e-12, max_iter=50):
      """A zero of f from a starting guess using the tangent line. ValueError if the slope is 0 or it does not converge."""
      x = x0
      for _ in range(max_iter):
          slope = df(x)
          if slope == 0:
              raise ValueError("zero slope")
          step = f(x) / slope
          x -= step
          if abs(step) < tol:
              return x
      raise ValueError("did not converge")


  def solve_ode(df, y0, t0, t1, n=100):
      """Solve y' = df(t, y) from t0 to t1 with n steps of the Runge-Kutta 4 method. Returns the final y."""
      h = (t1 - t0) / n
      t, y = t0, y0
      for _ in range(n):
          k1 = df(t, y)
          k2 = df(t + h / 2, y + h / 2 * k1)
          k3 = df(t + h / 2, y + h / 2 * k2)
          k4 = df(t + h, y + h * k3)
          y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)
          t += h
      return y


  def my_sin(x):
      """sin x from its Taylor series after subtracting whole turns."""
      turns = round(x / (2 * math.pi))
      x = x - 2 * math.pi * turns
      total, term = 0.0, x
      for k in range(20):
          total += term
          term *= -x * x / ((2 * k + 2) * (2 * k + 3))
      return total


  def gradient(f, x, h=1e-6):
      """List of partial derivatives of f (which takes a list) at the point x."""
      result = []
      for i in range(len(x)):
          up, down = list(x), list(x)
          up[i] += h
          down[i] -= h
          result.append((f(up) - f(down)) / (2 * h))
      return result


  def minimize(f, x0, tol=1e-8, max_iter=10000):
      """Walk downhill from x0 using the gradient, halving the step until it lowers f. Returns the final point (a list)."""
      x = list(x0)
      for _ in range(max_iter):
          g = gradient(f, x)
          if math.sqrt(sum(v * v for v in g)) < tol:
              break
          step, fx = 1.0, f(x)
          while step > 1e-12:
              candidate = [xi - step * gi for xi, gi in zip(x, g)]
              if f(candidate) < fx:
                  break
              step /= 2
          else:
              break
          x = candidate
      return x
