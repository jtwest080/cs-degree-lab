    def close(a, b, tol=1e-6):
        return abs(a - b) < tol

    assert close(derivative(lambda x: x * x, 3), 6, 1e-6)
    assert close(derivative(math.sin, 0), 1, 1e-6)
    assert close(derivative(lambda x: 4, 10), 0, 1e-9)
