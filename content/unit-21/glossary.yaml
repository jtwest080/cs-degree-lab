# Terms introduced in Unit 21 (Probability and Statistics). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Probability
  definition: A number from 0 to 1 measuring how likely an event is.
  lesson: u21-probability
- term: Experiment
  definition: Any process with an uncertain outcome, such as rolling a die.
  lesson: u21-probability
- term: Outcome
  definition: One possible result of an experiment.
  lesson: u21-probability
- term: Equally likely outcomes
  definition: Outcomes with the same chance, so probability is favourable outcomes divided by total outcomes.
  lesson: u21-probability
- term: Complement
  definition: The event that something does not happen; its probability is one minus the original.
  lesson: u21-probability
- term: Birthday problem
  definition: The surprising fact that in a group of 23 people two likely share a birthday.
  lesson: u21-probability
- term: Monte Carlo method
  definition: Estimating an answer by running many random simulations and counting results.
  lesson: u21-probability
- term: Monty Hall problem
  definition: A puzzle where switching doors after a reveal wins two thirds of the time.
  lesson: u21-probability
- term: Prior probability
  definition: What you believe about something before seeing new evidence.
  lesson: u21-conditional
- term: Posterior probability
  definition: Your updated belief after seeing evidence.
  lesson: u21-conditional
- term: False positive rate
  definition: The chance a test is positive when the condition is absent.
  lesson: u21-conditional
- term: Base rate fallacy
  definition: Ignoring how rare something is when judging a test result.
  lesson: u21-conditional
- term: Rejection sampling
  definition: Simulating many trials and keeping only those that match the given information.
  lesson: u21-conditional
- term: Probability distribution
  definition: A description of how likely each value of a random variable is.
  lesson: u21-distributions
- term: Standard deviation
  definition: The square root of the variance, in the data's own units.
  lesson: u21-distributions
- term: Binomial distribution
  definition: The number of successes in a fixed number of independent yes-or-no trials.
  lesson: u21-distributions
- term: Geometric distribution
  definition: The number of trials until the first success.
  lesson: u21-distributions
- term: Poisson distribution
  definition: The number of events in a fixed period when events happen at a steady average rate.
  lesson: u21-distributions
- term: Coupon collector problem
  definition: Finding how many random draws are needed to collect every type of item.
  lesson: u21-distributions
- term: Normal distribution
  definition: The bell-shaped distribution described by a mean and a standard deviation.
  lesson: u21-normal
- term: Probability density function
  definition: A curve whose area over a range gives the probability of landing in that range.
  lesson: u21-normal
- term: Cumulative distribution function
  definition: The probability that a value is at or below a given point.
  lesson: u21-normal
- term: Empirical rule
  definition: About 68, 95 and 99.7 percent of normal values lie within 1, 2 and 3 standard deviations.
  lesson: u21-normal
- term: Central limit theorem
  definition: Averages of many independent values form an approximately normal distribution.
  lesson: u21-normal
- term: Percentile
  definition: The value below which a given percent of the data falls.
  lesson: u21-normal
- term: Box-Muller transform
  definition: A method for turning uniform random numbers into normal ones.
  lesson: u21-normal
- term: Descriptive statistics
  definition: Numbers that summarize a dataset.
  lesson: u21-descriptive
- term: Mean
  definition: The sum of the values divided by how many there are.
  lesson: u21-descriptive
- term: Mode
  definition: The most frequently occurring value.
  lesson: u21-descriptive
- term: Robust statistic
  definition: A summary that is hardly affected by extreme values.
  lesson: u21-descriptive
- term: Range
  definition: The largest value minus the smallest.
  lesson: u21-descriptive
- term: Sample variance
  definition: Variance estimated from a sample by dividing by n minus 1.
  lesson: u21-descriptive
- term: Bessel's correction
  definition: Dividing by n minus 1 so a sample's variance does not underestimate the population's.
  lesson: u21-descriptive
- term: Quantile
  definition: A value below which a given fraction of the data falls.
  lesson: u21-descriptive
- term: Quartile
  definition: One of the three values that split sorted data into four equal parts.
  lesson: u21-descriptive
- term: Interquartile range
  definition: The third quartile minus the first, the spread of the middle half.
  lesson: u21-descriptive
- term: Five-number summary
  definition: The minimum, first quartile, median, third quartile and maximum.
  lesson: u21-descriptive
- term: Outlier
  definition: A value unusually far from the rest of the data.
  lesson: u21-descriptive
- term: Covariance
  definition: A measure of how two variables vary together.
  lesson: u21-descriptive
- term: Correlation coefficient
  definition: A number from -1 to 1 measuring straight-line association between two variables.
  lesson: u21-descriptive
- term: Correlation is not causation
  definition: The warning that two things moving together does not mean one causes the other.
  lesson: u21-descriptive
- term: Histogram
  definition: A bar chart of how many values fall into each range.
  lesson: u21-descriptive
- term: Moving average
  definition: The average of each run of neighbouring values, used to smooth noise.
  lesson: u21-descriptive
- term: Simpson's paradox
  definition: A trend in every subgroup that reverses when the groups are combined.
  lesson: u21-descriptive
- term: Population
  definition: The whole group you want to know about.
  lesson: u21-sampling
- term: Sample
  definition: A smaller group drawn from a population and measured.
  lesson: u21-sampling
- term: Statistic
  definition: A number computed from a sample.
  lesson: u21-sampling
- term: Inference
  definition: Drawing conclusions about a population from a sample.
  lesson: u21-sampling
- term: Simple random sample
  definition: A sample where every group of the chosen size is equally likely.
  lesson: u21-sampling
- term: Sampling bias
  definition: A flaw in how a sample is chosen that makes it unrepresentative.
  lesson: u21-sampling
- term: Sampling distribution
  definition: The distribution of a statistic over many repeated samples.
  lesson: u21-sampling
- term: Standard error
  definition: The standard deviation of a statistic such as the sample mean.
  lesson: u21-sampling
- term: Confidence interval
  definition: A range computed by a method that captures the true value a stated share of the time.
  lesson: u21-sampling
- term: Margin of error
  definition: The distance from the estimate to either end of a confidence interval.
  lesson: u21-sampling
- term: Critical value
  definition: The multiplier, such as 1.96 for 95 percent, used to build an interval.
  lesson: u21-sampling
- term: Bootstrap
  definition: Estimating uncertainty by resampling your own data with replacement.
  lesson: u21-sampling
- term: Resampling with replacement
  definition: Drawing values from the data one at a time, putting each back before the next draw.
  lesson: u21-sampling
- term: Hypothesis test
  definition: A procedure for deciding whether data is consistent with a default claim.
  lesson: u21-hypothesis
- term: Null hypothesis
  definition: The default, no-effect claim that a test tries to find evidence against.
  lesson: u21-hypothesis
- term: Alternative hypothesis
  definition: The claim that something is going on, such as a real difference.
  lesson: u21-hypothesis
- term: P-value
  definition: The chance of data at least this extreme if the null hypothesis were true.
  lesson: u21-hypothesis
- term: Significance level
  definition: The p-value threshold, often 0.05, below which we reject the null.
  lesson: u21-hypothesis
- term: Statistically significant
  definition: A result whose p-value is below the chosen significance level.
  lesson: u21-hypothesis
- term: Z-test
  definition: A test that compares an estimate to a claim using the normal curve.
  lesson: u21-hypothesis
- term: T statistic
  definition: A difference divided by its standard error.
  lesson: u21-hypothesis
- term: A/B test
  definition: A randomized comparison of two versions to see which performs better.
  lesson: u21-hypothesis
- term: Permutation test
  definition: A test that shuffles group labels many times to see what chance alone produces.
  lesson: u21-hypothesis
- term: Type I error
  definition: Rejecting a null hypothesis that is true, a false positive.
  lesson: u21-hypothesis
- term: Type II error
  definition: Failing to reject a null hypothesis that is false, a false negative.
  lesson: u21-hypothesis
- term: Statistical power
  definition: The chance a test detects a real effect.
  lesson: u21-hypothesis
- term: Effect size
  definition: How large a difference or relationship actually is.
  lesson: u21-hypothesis
- term: Multiple comparisons problem
  definition: Running many tests makes some false positives almost certain.
  lesson: u21-hypothesis
- term: P-hacking
  definition: Trying many analyses until one gives a significant result.
  lesson: u21-hypothesis
- term: Bonferroni correction
  definition: Dividing the significance level by the number of tests.
  lesson: u21-hypothesis
- term: Response variable
  definition: The quantity a regression tries to predict.
  lesson: u21-regression
- term: Predictor variable
  definition: An input used to predict the response.
  lesson: u21-regression
- term: Root mean squared error
  definition: The typical size of a prediction miss, in the response's units.
  lesson: u21-regression
- term: Anscombe's quartet
  definition: Four datasets with identical summary statistics but very different shapes.
  lesson: u21-regression
