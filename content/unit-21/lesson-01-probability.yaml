- id: equally-likely
  title: Counting outcomes
  difficulty: 3
  prompt: 'The starter imports `Fraction` and `product`. Write `probability(outcomes, event)`: the number of outcomes for which `event(outcome)` is true divided by the number of outcomes, as a `Fraction` (raise `ValueError` for an empty list). Write `dice_outcomes(num_dice, sides=6)`: a list of all results as tuples, using `product(range(1, sides + 1), repeat=num_dice)`. Write `sum_distribution(num_dice, sides=6)`: a dictionary from each possible total to its `Fraction` probability, with the totals in increasing order.'
  starter: |
    from fractions import Fraction
    from itertools import product


    def probability(outcomes, event):
        pass


    def dice_outcomes(num_dice, sides=6):
        pass


    def sum_distribution(num_dice, sides=6):
        pass
  tests:
  - name: equally likely outcomes
    code: |
      from fractions import Fraction
      coin = ["H", "T"]
      assert probability(coin, lambda o: o == "H") == Fraction(1, 2)
      die = list(range(1, 7))
      assert probability(die, lambda o: o % 2 == 0) == Fraction(1, 2)
      assert probability(die, lambda o: o > 4) == Fraction(1, 3)
      assert probability(die, lambda o: True) == 1 and probability(die, lambda o: False) == 0
      try:
          probability([], lambda o: True)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: rolling dice
    code: |
      from fractions import Fraction
      assert len(dice_outcomes(1)) == 6 and len(dice_outcomes(2)) == 36 and len(dice_outcomes(3)) == 216
      assert dice_outcomes(2)[:3] == [(1, 1), (1, 2), (1, 3)]
      assert len(dice_outcomes(2, 4)) == 16 and dice_outcomes(0) == [()]
      d = sum_distribution(2)
      assert d[7] == Fraction(1, 6) and d[2] == Fraction(1, 36) and d[12] == Fraction(1, 36)
      assert sum(d.values()) == 1 and list(d) == list(range(2, 13))
      assert sum_distribution(1) == {i: Fraction(1, 6) for i in range(1, 7)}
      assert sum_distribution(3)[10] == Fraction(27, 216)
  hints:
  - Count how many outcomes give each total, then divide by the number of outcomes.
  solution: |
    from fractions import Fraction
    from itertools import product


    def probability(outcomes, event):
        """Chance of an event when every outcome in the list is equally likely: (outcomes where event is true) / (all outcomes).
        Returns a Fraction. ValueError if there are no outcomes."""
        if not outcomes:
            raise ValueError("there must be at least one outcome")
        return Fraction(sum(1 for o in outcomes if event(o)), len(outcomes))


    def dice_outcomes(num_dice, sides=6):
        """Every possible result of rolling num_dice dice, as tuples (6 ** num_dice of them for six-sided dice)."""
        return list(product(range(1, sides + 1), repeat=num_dice))


    def sum_distribution(num_dice, sides=6):
        """A dictionary from each possible total to its probability (a Fraction)."""
        outcomes = dice_outcomes(num_dice, sides)
        totals = {}
        for o in outcomes:
            totals[sum(o)] = totals.get(sum(o), 0) + 1
