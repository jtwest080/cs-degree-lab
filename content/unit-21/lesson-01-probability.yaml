- id: rules
  title: Combining chances
  difficulty: 3
  prompt: 'Write `p_all(probs)` (multiply independent chances; 1 for an empty list), `p_at_least_one(probs)` (1 minus the chance that none happen, computed with `p_all`), `p_either(p_a, p_b, p_both)` (`P(A) + P(B) - P(A and B)`) and `birthday_collision(people, days=365)`: 1 minus the chance that all birthdays differ, where person number `k` (from 0) avoids the earlier ones with chance `(days - k) / days`; if `people > days` the answer is `1.0`.'
  starter: |
    def p_all(probs):
        pass


    def p_at_least_one(probs):
        pass


    def p_either(p_a, p_b, p_both):
        pass


    def birthday_collision(people, days=365):
        pass
  tests:
  - name: combining independent events
    code: |
      from fractions import Fraction
      assert p_all([]) == 1 and p_all([Fraction(1, 2)] * 3) == Fraction(1, 8)
      assert p_all([0.5, 0.5]) == 0.25
      assert p_at_least_one([Fraction(1, 2), Fraction(1, 2)]) == Fraction(3, 4)
      assert p_at_least_one([Fraction(1, 6)] * 4) == Fraction(671, 1296)
      assert p_at_least_one([]) == 0
      assert p_at_least_one([1, 0.3]) == 1
  - name: either, or both
    code: |
      from fractions import Fraction
      assert p_either(Fraction(1, 2), Fraction(1, 3), Fraction(1, 6)) == Fraction(2, 3)
      assert p_either(0.5, 0.5, 0.5) == 0.5
      assert p_either(0.2, 0.3, 0) == 0.5
  - name: the birthday problem
    code: |
      assert birthday_collision(0) == 0 and birthday_collision(1) == 0
      assert abs(birthday_collision(23) - 0.5072972) < 1e-6
      assert abs(birthday_collision(2) - 1 / 365) < 1e-12
      assert abs(birthday_collision(70) - 0.99916) < 1e-4
      assert birthday_collision(366) == 1.0 and birthday_collision(3, 2) == 1.0
      assert abs(birthday_collision(2, 6) - 1 / 6) < 1e-12
  hints:
  - Multiplying `(days - k) / days` for each person gives the chance of no match.
  solution: |
    def p_not(p):
        return 1 - p


    def p_all(probs):
        """Chance that every one of several independent events happens: multiply the chances."""
        result = 1
        for p in probs:
            result *= p
        return result


    def p_at_least_one(probs):
        """Chance that at least one of several independent events happens: 1 minus the chance that none do."""
        return 1 - p_all([1 - p for p in probs])


    def p_either(p_a, p_b, p_both):
        """Chance of A or B (or both), for any two events: P(A) + P(B) - P(A and B)."""
        return p_a + p_b - p_both


    def birthday_collision(people, days=365):
        """Chance that at least two of `people` share a birthday: 1 minus the chance that all are different.
        The k-th person (counting from 0) avoids the k earlier birthdays with chance (days - k) / days."""
        if people > days:
            return 1.0
        none_shared = 1.0
        for k in range(people):
            none_shared *= (days - k) / days
        return 1 - none_shared
  explanation: The complement trick turns 'at least one' into 'none'.
- id: monte-carlo
  title: Monte Carlo estimation
  difficulty: 3
  prompt: 'The starter imports `random`. Write `estimate(trial, runs, seed=1)`: make `rng = random.Random(seed)` once, call `trial(rng)` `runs` times and return the fraction that were true (raise `ValueError` if `runs < 1`). Write `estimate_pi(runs, seed=1)`: use `estimate` with a trial that draws `x = rng.random()` and `y = rng.random()` and checks `x*x + y*y < 1`; return `4` times the result.'
  starter: |
    import random


    def estimate(trial, runs, seed=1):
        pass


    def estimate_pi(runs, seed=1):
        pass
  tests:
  - name: estimating a probability
    code: |
      p = estimate(lambda rng: rng.random() < 0.3, 20000, 7)
      assert abs(p - 0.3) < 0.02
      assert estimate(lambda rng: True, 50) == 1.0 and estimate(lambda rng: False, 50) == 0.0
      assert estimate(lambda rng: rng.random() < 0.5, 100, 3) == estimate(lambda rng: rng.random() < 0.5, 100, 3)
      for bad in (0, -5):
          try:
              estimate(lambda rng: True, bad)
              raise AssertionError("accepted")
          except ValueError:
              pass
  - name: estimating pi
    code: |
      assert abs(estimate_pi(50000, 2) - 3.14159) < 0.05
      assert estimate_pi(1000, 5) == estimate_pi(1000, 5)
      a, b = estimate_pi(100, 1), estimate_pi(100, 2)
      assert a != b
  hints:
  - Draw both numbers with two separate calls to `rng.random()`.
  solution: |
    import random


    def estimate(trial, runs, seed=1):
        """Monte Carlo: run trial(rng) many times and return the fraction of runs that gave True.
        rng is random.Random(seed), shared by all runs. ValueError if runs < 1."""
        if runs < 1:
            raise ValueError("runs must be at least 1")
        rng = random.Random(seed)
        return sum(1 for _ in range(runs) if trial(rng)) / runs


    def estimate_pi(runs, seed=1):
        """Throw random points into the unit square; the fraction landing inside the quarter circle x^2 + y^2 < 1 is pi / 4."""
        inside = estimate(lambda rng: rng.random() ** 2 + rng.random() ** 2 < 1, runs, seed)
        return 4 * inside
  explanation: Counting hits in a random experiment estimates areas and probabilities.
- id: monty-hall
  title: The Monty Hall puzzle
  difficulty: 4
  prompt: 'The starter imports `random`. Write `monty_hall(runs, switch, seed=1)`: with `rng = random.Random(seed)`, each run picks `prize = int(rng.random() * 3)` and then `pick = int(rng.random() * 3)`; the host opens `opened`, the first door that is neither your pick nor the prize; if `switch` is true your pick becomes the one door that is neither your pick nor `opened`. Count a win when `pick == prize`. Return wins divided by runs.'
  starter: |
    import random


    def monty_hall(runs, switch, seed=1):
        pass
  tests:
  - name: the Monty Hall puzzle
    code: |
      stay = monty_hall(20000, False, 4)
      swap = monty_hall(20000, True, 4)
      assert abs(stay - 1 / 3) < 0.02
      assert abs(swap - 2 / 3) < 0.02
      assert swap > stay + 0.2
      assert monty_hall(100, True, 9) == monty_hall(100, True, 9)
  - name: reproducibility
    code: |
      assert 0 <= monty_hall(10, True, 1) <= 1
      r = monty_hall(1, True, 3)
      assert r in (0.0, 1.0)
  hints:
  - '`next(d for d in range(3) if d != a and d != b)` finds the remaining door.'
  solution: |
    import random


    def monty_hall(runs, switch, seed=1):
        """The game show puzzle. The prize is behind one of 3 doors, you pick one, the host (who knows where the prize is)
        opens a different door with no prize, and you either stay or switch to the remaining closed door.
        Returns the fraction of runs you win. Use int(rng.random() * 3) to pick doors."""
        rng = random.Random(seed)
        wins = 0
        for _ in range(runs):
            prize = int(rng.random() * 3)
            pick = int(rng.random() * 3)
            opened = next(d for d in range(3) if d != pick and d != prize)
            if switch:
                pick = next(d for d in range(3) if d != pick and d != opened)
            wins += pick == prize
        return wins / runs
  explanation: Simulation settles arguments that intuition cannot.
- id: craps
  title: 'Capstone: the odds in craps'
  difficulty: 5
  prompt: 'The starter has `probability`, `dice_outcomes` and `sum_distribution`. Write `craps_win_probability()` returning the exact `Fraction` chance of winning the pass-line bet: roll two dice; a total of 7 or 11 wins at once; 2, 3 or 12 loses at once; any other total becomes the ''point'', and then you roll until the point (you win) or a 7 (you lose) appears. The chance that the point `p` comes up before a 7 is `P(p) / (P(p) + P(7))`. Add up the immediate wins and, for each possible point, `P(point) * P(point before 7)`.'
  starter: |
    from fractions import Fraction
    from itertools import product


    def probability(outcomes, event):
        """Chance of an event when every outcome in the list is equally likely: (outcomes where event is true) / (all outcomes).
        Returns a Fraction. ValueError if there are no outcomes."""
        if not outcomes:
            raise ValueError("there must be at least one outcome")
        return Fraction(sum(1 for o in outcomes if event(o)), len(outcomes))


    def dice_outcomes(num_dice, sides=6):
        """Every possible result of rolling num_dice dice, as tuples (6 ** num_dice of them for six-sided dice)."""
        return list(product(range(1, sides + 1), repeat=num_dice))


    def sum_distribution(num_dice, sides=6):
        """A dictionary from each possible total to its probability (a Fraction)."""
        outcomes = dice_outcomes(num_dice, sides)
        totals = {}
        for o in outcomes:
            totals[sum(o)] = totals.get(sum(o), 0) + 1
        return {t: Fraction(c, len(outcomes)) for t, c in sorted(totals.items())}


    def craps_win_probability():
        pass
  tests:
  - name: craps
    code: |
      from fractions import Fraction
      assert craps_win_probability() == Fraction(244, 495)
      assert float(craps_win_probability()) < 0.5
      assert abs(float(craps_win_probability()) - 0.49293) < 1e-5
  hints:
  - The possible points are 4, 5, 6, 8, 9 and 10.
  solution: |
    from fractions import Fraction
    from itertools import product


    def probability(outcomes, event):
        """Chance of an event when every outcome in the list is equally likely: (outcomes where event is true) / (all outcomes).
        Returns a Fraction. ValueError if there are no outcomes."""
        if not outcomes:
            raise ValueError("there must be at least one outcome")
        return Fraction(sum(1 for o in outcomes if event(o)), len(outcomes))


    def dice_outcomes(num_dice, sides=6):
        """Every possible result of rolling num_dice dice, as tuples (6 ** num_dice of them for six-sided dice)."""
        return list(product(range(1, sides + 1), repeat=num_dice))


    def sum_distribution(num_dice, sides=6):
        """A dictionary from each possible total to its probability (a Fraction)."""
        outcomes = dice_outcomes(num_dice, sides)
        totals = {}
        for o in outcomes:
            totals[sum(o)] = totals.get(sum(o), 0) + 1
        return {t: Fraction(c, len(outcomes)) for t, c in sorted(totals.items())}


    def craps_win_probability():
        """Exact chance of winning the 'pass line' bet in craps (a Fraction).
        Roll two dice. A total of 7 or 11 wins at once; 2, 3 or 12 loses at once. Any other total becomes the 'point':
        keep rolling, and you win if the point comes up again before a 7."""
        dist = sum_distribution(2)
        win = dist[7] + dist[11]
        for point in (4, 5, 6, 8, 9, 10):
            win += dist[point] * dist[point] / (dist[point] + dist[7])
        return win
  explanation: 'A casino game with a small house edge: 244/495 is just under one half.'
commonMistakes:
- title: Treating (1, 2) and (2, 1) as one outcome
  explanation: For two dice there are 36 equally likely ordered outcomes, not 21.
- title: Adding chances of overlapping events
  explanation: Subtract the overlap, or you count it twice.
- title: The gambler's fallacy
  explanation: 'After five heads in a row a fair coin is still 50 percent heads: the coin has no memory.'
- title: Multiplying chances of events that are not independent
  explanation: The product rule only works for independent events.
- title: Trusting a simulation with too few runs
  explanation: Small samples are noisy; use thousands of runs and a fixed seed.
summary:
- Probability is between 0 and 1; for equally likely outcomes it is favorable over total.
- P(not A) = 1 - P(A); independent events multiply.
- P(A or B) = P(A) + P(B) - P(A and B).
- Enumeration gives exact answers, simulation gives estimates.
- 'Intuition about chance is unreliable: birthday and Monty Hall.'
