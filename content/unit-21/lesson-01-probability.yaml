      assert p_both_heads(1) == Fraction(1, 2)
      assert p_both_heads(3) == Fraction(1, 8)
      assert p_both_heads(0) == 1
  solution: |
    from fractions import Fraction


    def p_both_heads(n):
        return Fraction(1, 2) ** n
