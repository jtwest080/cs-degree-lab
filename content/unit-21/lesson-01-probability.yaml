id: u21-probability
title: Probability from the Ground Up
minutes: 80
objective: Learn to measure uncertainty. You will start with coins and dice, work out the chance of events by counting equally likely outcomes, learn the basic rules for combining chances, and then use simulation to check your answers, including the famous Monty Hall puzzle and the birthday problem.
outcomes:
- Define probability as favorable outcomes over all equally likely outcomes
- Use complements, independence and the inclusion-exclusion rule
- Compute chances by enumerating dice outcomes
- Estimate a probability with a seeded Monte Carlo simulation
- Explain why probability puzzles can trick intuition
sections:
- heading: What probability means
  body: |-
    **Probability** is a number between 0 and 1 that says how likely something is: 0 means impossible, 1 means certain, and 0.5 means as likely as not. You can also say it as a percentage, so 0.25 is a 25 percent chance. A **trial** is one act of chance (flip a coin, roll a die), an **outcome** is one possible result, and an **event** is any set of outcomes we care about ("the die shows an even number" is the event `{2, 4, 6}`). The set of all outcomes is the **sample space**.

    When all outcomes are **equally likely**, probability is just counting: `P(event) = (number of outcomes in the event) / (total number of outcomes)`. A die has 6 outcomes, three of them even, so `P(even) = 3/6 = 1/2`. With two dice there are `6 * 6 = 36` equally likely ordered outcomes (a red die and a blue die, so `(1, 2)` and `(2, 1)` are different), and 6 of them total 7, so `P(7) = 6/36 = 1/6`. This is why 7 is the commonest total, and why the board game Catan has players rooting for 6s and 8s. We keep our answers as exact **fractions**, so that `1/6` stays `1/6` and not `0.1666...`.
- heading: The rules for combining chances
  body: |-
    The **complement** of an event is "it does not happen", and `P(not A) = 1 - P(A)`. This is the single most useful trick, because "at least one" is hard to count directly but its complement, "none", is easy: the chance of at least one six in four rolls is `1 - (5/6)^4 = 0.518`, slightly better than even (a bet made famous by a seventeenth-century gambler, which led to the first mathematical study of probability).

    Two events are **independent** when one tells you nothing about the other (two different coin flips). For independent events, **both happen with chance equal to the product**: `P(A and B) = P(A) * P(B)`. Two heads in a row is `1/2 * 1/2 = 1/4`. For any two events, the chance that **at least one** happens is `P(A) + P(B) - P(A and B)`: if you just add the chances you count the overlap twice, so subtract it once (**inclusion-exclusion**).

    Our intuition about chance is poor, so work it out. The **birthday problem** asks how many people must be in a room before two probably share a birthday. Most people guess about 180; the answer is **23** (a 50.7 percent chance). With 70 people it is 99.9 percent. The reason: with 23 people there are 253 pairs, and any pair could match.
- heading: 'Simulation: ask the computer'
  body: |-
    When counting gets hard, we can **simulate**: run the random experiment many times on the computer and see how often the event happens. This is the **Monte Carlo method**, named after the casino. The **law of large numbers** promises that the fraction of successes settles toward the true probability as the number of runs grows. Our simulations use a **seeded** random generator, `random.Random(seed)`, which makes the "random" numbers repeatable, so tests and debugging are possible.

    A pretty example: throw random points at a square with a quarter circle drawn in it. The fraction that lands inside the circle estimates `pi / 4`, because that is the ratio of the areas. A famous puzzle: **Monty Hall**. There are three doors and one prize. You pick door 1; the host, who knows where the prize is, opens a different door showing nothing. Should you switch to the other closed door? Almost everyone says it makes no difference. It does: staying wins 1/3 of the time, switching wins **2/3**, because your first pick was right only 1 time in 3 and the host's move reveals the answer in the other 2. If that still feels wrong, the simulation will convince you more than any argument.
examples:
- title: Counting equally likely outcomes
  intro: Exact chances for coins and dice, and the full distribution of two dice.
  code: |
    from fractions import Fraction
    from itertools import product


    def probability(outcomes, event):
        """Chance of an event when every outcome in the list is equally likely: (outcomes where event is true) / (all outcomes).
        Returns a Fraction. ValueError if there are no outcomes."""
        if not outcomes:
            raise ValueError("there must be at least one outcome")
        return Fraction(sum(1 for o in outcomes if event(o)), len(outcomes))


    def dice_outcomes(num_dice, sides=6):
        """Every possible result of rolling num_dice dice, as tuples (6 ** num_dice of them for six-sided dice)."""
        return list(product(range(1, sides + 1), repeat=num_dice))


    def sum_distribution(num_dice, sides=6):
        """A dictionary from each possible total to its probability (a Fraction)."""
        outcomes = dice_outcomes(num_dice, sides)
        totals = {}
        for o in outcomes:
            totals[sum(o)] = totals.get(sum(o), 0) + 1
        return {t: Fraction(c, len(outcomes)) for t, c in sorted(totals.items())}


    die = [1, 2, 3, 4, 5, 6]
    print("chance of an even number:", probability(die, lambda o: o % 2 == 0))
    print("chance of two sixes with two dice:", probability(dice_outcomes(2), lambda o: o == (6, 6)))
    print("chance the two dice total 7:", probability(dice_outcomes(2), lambda o: sum(o) == 7))
    print("chance of at least one six in 2 rolls:", probability(dice_outcomes(2), lambda o: 6 in o))
    for total, p in sum_distribution(2).items():
        print(total, str(p).rjust(5), "#" * round(float(p) * 72))
  output: |
    chance of an even number: 1/2
    chance of two sixes with two dice: 1/36
    chance the two dice total 7: 1/6
    chance of at least one six in 2 rolls: 11/36
    2  1/36 ##
    3  1/18 ####
    4  1/12 ######
    5   1/9 ########
    6  5/36 ##########
    7   1/6 ############
    8  5/36 ##########
    9   1/9 ########
    10  1/12 ######
    11  1/18 ####
    12  1/36 ##
  lines:
  - line: 30
    note: Six of the 36 outcomes.
  - line: 32
    note: 'A bar chart in text: 7 is the commonest total.'
- title: Rules and the birthday problem
  intro: 'Complements and independence: at least one six, a double six, and shared birthdays.'
  code: |
    def p_not(p):
        return 1 - p


    def p_all(probs):
        """Chance that every one of several independent events happens: multiply the chances."""
        result = 1
        for p in probs:
            result *= p
        return result


    def p_at_least_one(probs):
        """Chance that at least one of several independent events happens: 1 minus the chance that none do."""
        return 1 - p_all([1 - p for p in probs])


    def p_either(p_a, p_b, p_both):
        """Chance of A or B (or both), for any two events: P(A) + P(B) - P(A and B)."""
        return p_a + p_b - p_both


    def birthday_collision(people, days=365):
        """Chance that at least two of `people` share a birthday: 1 minus the chance that all are different.
        The k-th person (counting from 0) avoids the k earlier birthdays with chance (days - k) / days."""
        if people > days:
            return 1.0
        none_shared = 1.0
        for k in range(people):
            none_shared *= (days - k) / days
        return 1 - none_shared


    print("four rolls, at least one six:", p_at_least_one([1 / 6] * 4), "~", round(p_at_least_one([1 / 6] * 4), 4))
    print("24 rolls of a pair, at least one double six:", round(p_at_least_one([1 / 36] * 24), 4))
    for n in (10, 23, 40, 70):
        print(n, "people share a birthday:", round(birthday_collision(n), 4))
  output: |
    four rolls, at least one six: 0.5177469135802468 ~ 0.5177
    24 rolls of a pair, at least one double six: 0.4914
    10 people share a birthday: 0.1169
    23 people share a birthday: 0.5073
    40 people share a birthday: 0.8912
    70 people share a birthday: 0.9992
  lines:
  - line: 34
    note: A bit better than even.
  - line: 36
    note: Only 23 people for a 50 percent chance.
- title: Monte Carlo simulation
  intro: Estimating a coin, pi and the Monty Hall game by running many trials.
  code: |
    import random


    def estimate(trial, runs, seed=1):
        """Monte Carlo: run trial(rng) many times and return the fraction of runs that gave True.
        rng is random.Random(seed), shared by all runs. ValueError if runs < 1."""
        if runs < 1:
            raise ValueError("runs must be at least 1")
        rng = random.Random(seed)
        return sum(1 for _ in range(runs) if trial(rng)) / runs


    def estimate_pi(runs, seed=1):
        """Throw random points into the unit square; the fraction landing inside the quarter circle x^2 + y^2 < 1 is pi / 4."""
        inside = estimate(lambda rng: rng.random() ** 2 + rng.random() ** 2 < 1, runs, seed)
        return 4 * inside


    def monty_hall(runs, switch, seed=1):
        """The game show puzzle. The prize is behind one of 3 doors, you pick one, the host (who knows where the prize is)
        opens a different door with no prize, and you either stay or switch to the remaining closed door.
        Returns the fraction of runs you win. Use int(rng.random() * 3) to pick doors."""
        rng = random.Random(seed)
        wins = 0
        for _ in range(runs):
            prize = int(rng.random() * 3)
            pick = int(rng.random() * 3)
            opened = next(d for d in range(3) if d != pick and d != prize)
            if switch:
                pick = next(d for d in range(3) if d != pick and d != opened)
            wins += pick == prize
        return wins / runs


    print("heads on a fair coin (10000 flips):", estimate(lambda rng: rng.random() < 0.5, 10000, 1))
    print("pi estimate:", estimate_pi(100000, 1))
    print("Monty Hall, stay  :", monty_hall(30000, False, 1))
    print("Monty Hall, switch:", monty_hall(30000, True, 1))
  output: |
    heads on a fair coin (10000 flips): 0.5023
    pi estimate: 3.13784
    Monty Hall, stay  : 0.33386666666666664
    Monty Hall, switch: 0.6661333333333334
  lines:
  - line: 36
    note: Random points estimate pi.
  - line: 38
    note: Switching wins about two thirds of the time.
playground:
  prompt: Roll two dice 1000 times with random.Random(1) and count how often the total is 7.
  code: |
