- type: code
  question: Write `bayes_two(prior, like_if_true, like_if_false)` returning `P(H | E)` as a float for a hypothesis with prior chance `prior`, where `like_if_true = P(E | H)` and `like_if_false = P(E | not H)`.
  starter: |
    def bayes_two(prior, like_if_true, like_if_false):
        pass
  tests:
  - name: bayes
    code: |
      assert abs(bayes_two(0.01, 0.9, 0.05) - 2 / 13) < 1e-12
      assert abs(bayes_two(0.5, 0.5, 0.5) - 0.5) < 1e-12
      assert bayes_two(1.0, 0.3, 0.9) == 1.0
  solution: |
    def bayes_two(prior, like_if_true, like_if_false):
        yes = prior * like_if_true
        no = (1 - prior) * like_if_false
        return yes / (yes + no)
