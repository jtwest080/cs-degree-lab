exercises:
- id: conditional
  title: Conditional probability by counting
  difficulty: 3
  prompt: 'The starter has `probability`. Write `conditional(outcomes, event, given)`: keep the outcomes for which `given(outcome)` is true (raise `ValueError` if there are none) and return the fraction of those for which `event(outcome)` is also true, as a `Fraction`. Write `are_independent(outcomes, a, b)`: `True` when `P(A and B) == P(A) * P(B)` exactly.'
  starter: |
    from fractions import Fraction


    def probability(outcomes, event):
        if not outcomes:
            raise ValueError("there must be at least one outcome")
        return Fraction(sum(1 for o in outcomes if event(o)), len(outcomes))


    def conditional(outcomes, event, given):
        pass


    def are_independent(outcomes, a, b):
        pass
  tests:
  - name: conditional probability
    code: |
      from fractions import Fraction
      two_dice = [(a, b) for a in range(1, 7) for b in range(1, 7)]
      assert conditional(two_dice, lambda o: o[0] == 6, lambda o: sum(o) >= 10) == Fraction(3, 6)
      assert conditional(two_dice, lambda o: sum(o) == 7, lambda o: o[0] == 3) == Fraction(1, 6)
      assert conditional(two_dice, lambda o: o[0] == o[1], lambda o: sum(o) == 8) == Fraction(1, 5)
      kids = [("B", "B"), ("B", "G"), ("G", "B"), ("G", "G")]
      assert conditional(kids, lambda k: k == ("B", "B"), lambda k: "B" in k) == Fraction(1, 3)
      assert conditional(kids, lambda k: k == ("B", "B"), lambda k: k[0] == "B") == Fraction(1, 2)
      try:
          conditional(kids, lambda k: True, lambda k: False)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: independence
    code: |
      two_dice = [(a, b) for a in range(1, 7) for b in range(1, 7)]
      assert are_independent(two_dice, lambda o: o[0] == 6, lambda o: o[1] % 2 == 0) is True
      assert are_independent(two_dice, lambda o: o[0] == 6, lambda o: sum(o) == 12) is False
      assert are_independent(two_dice, lambda o: sum(o) == 7, lambda o: o[0] == 2) is True
      assert are_independent(two_dice, lambda o: sum(o) == 8, lambda o: o[0] == 2) is False
      assert are_independent([1, 2, 3, 4], lambda o: o > 2, lambda o: o > 2) is False
      assert are_independent([1, 2, 3, 4], lambda o: False, lambda o: o > 2) is True
  hints:
  - Reuse `probability` for the independence test.
  solution: |
    from fractions import Fraction


    def probability(outcomes, event):
        if not outcomes:
            raise ValueError("there must be at least one outcome")
        return Fraction(sum(1 for o in outcomes if event(o)), len(outcomes))


    def conditional(outcomes, event, given):
        """P(event | given): among the outcomes where `given` is true, the fraction where `event` is also true.
        ValueError if `given` never happens."""
        possible = [o for o in outcomes if given(o)]
        if not possible:
            raise ValueError("the given condition never happens")
        return Fraction(sum(1 for o in possible if event(o)), len(possible))


    def are_independent(outcomes, a, b):
        """True when P(A and B) equals P(A) * P(B) exactly."""
        both = probability(outcomes, lambda o: a(o) and b(o))
        return both == probability(outcomes, a) * probability(outcomes, b)
  explanation: Restrict to what you know, then count.
- id: bayes
  title: Bayes' rule
  difficulty: 4
  prompt: 'The starter imports `Fraction`. Write `bayes_update(priors, likelihoods)`: both are dictionaries keyed by hypothesis; multiply each prior by its likelihood (as `Fraction`s), divide by the total and return the new dictionary (raise `ValueError` if the total is 0). Write `positive_test(prior, sensitivity, false_positive)`: the chance of having the condition after one positive test, using `bayes_update` with hypotheses `''yes''` and `''no''` (the prior of `''no''` is `1 - prior`).'
  starter: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        pass


    def positive_test(prior, sensitivity, false_positive):
        pass
  tests:
  - name: Bayes' rule
    code: |
      from fractions import Fraction
      post = bayes_update({"a": Fraction(1, 2), "b": Fraction(1, 2)}, {"a": Fraction(1, 4), "b": Fraction(3, 4)})
      assert post == {"a": Fraction(1, 4), "b": Fraction(3, 4)}
      assert sum(post.values()) == 1
      post = bayes_update({"x": Fraction(1, 3), "y": Fraction(1, 3), "z": Fraction(1, 3)}, {"x": 1, "y": 0, "z": 1})
      assert post == {"x": Fraction(1, 2), "y": 0, "z": Fraction(1, 2)}
      try:
          bayes_update({"a": 1, "b": 0}, {"a": 0, "b": 1})
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: the medical test
    code: |
      from fractions import Fraction
      assert positive_test(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20)) == Fraction(2, 13)
      assert abs(float(positive_test(Fraction(1, 1000), Fraction(99, 100), Fraction(1, 100))) - 0.0902) < 1e-3
      assert positive_test(Fraction(1, 2), 1, 0) == 1
      assert positive_test(Fraction(1, 4), Fraction(1, 2), Fraction(1, 2)) == Fraction(1, 4)
      assert positive_test(0, Fraction(9, 10), Fraction(1, 10)) == 0
  hints:
  - The likelihood for 'yes' is the sensitivity; for 'no' it is the false positive rate.
  solution: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        """Bayes' rule for any number of hypotheses.
        priors: {hypothesis: chance before the evidence}; likelihoods: {hypothesis: chance of the evidence if that hypothesis is true}.
        Returns {hypothesis: chance after the evidence} (Fractions that add up to 1).
        ValueError if the evidence is impossible under every hypothesis."""
        weights = {h: Fraction(priors[h]) * Fraction(likelihoods[h]) for h in priors}
        total = sum(weights.values())
        if total == 0:
            raise ValueError("the evidence is impossible")
        return {h: w / total for h, w in weights.items()}


    def positive_test(prior, sensitivity, false_positive):
        """Chance of having the condition after one positive test.
        sensitivity = P(positive | condition); false_positive = P(positive | no condition)."""
        post = bayes_update({"yes": prior, "no": 1 - Fraction(prior)}, {"yes": sensitivity, "no": false_positive})
        return post["yes"]
  explanation: Multiply what you believed by how well each idea predicted the evidence, then rescale.
- id: repeated-tests
  title: Repeated evidence
  difficulty: 4
  prompt: 'The starter has `bayes_update`. Write `posterior_after_tests(prior, sensitivity, false_positive, results)`: start with `belief = Fraction(prior)` and, for each result (`True` positive, `False` negative) in turn, update with `bayes_update`. For a positive the likelihoods are `sensitivity` (yes) and `false_positive` (no); for a negative they are `1 - sensitivity` and `1 - false_positive`. Return the final belief.'
  starter: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        """Bayes' rule for any number of hypotheses.
        priors: {hypothesis: chance before the evidence}; likelihoods: {hypothesis: chance of the evidence if that hypothesis is true}.
        Returns {hypothesis: chance after the evidence} (Fractions that add up to 1).
        ValueError if the evidence is impossible under every hypothesis."""
        weights = {h: Fraction(priors[h]) * Fraction(likelihoods[h]) for h in priors}
        total = sum(weights.values())
        if total == 0:
            raise ValueError("the evidence is impossible")
        return {h: w / total for h, w in weights.items()}


    def posterior_after_tests(prior, sensitivity, false_positive, results):
        pass
  tests:
  - name: repeated tests
    code: |
      from fractions import Fraction
      one = posterior_after_tests(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20), [True])
      assert one == Fraction(2, 13)
      two = posterior_after_tests(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20), [True, True])
      assert two > one and float(two) > 0.7
      assert posterior_after_tests(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20), []) == Fraction(1, 100)
      neg = posterior_after_tests(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20), [False])
      assert neg < Fraction(1, 100)
      back = posterior_after_tests(Fraction(1, 10), Fraction(4, 5), Fraction(1, 5), [True, False])
      assert back == Fraction(1, 10)
  - name: order does not matter
    code: |
      from fractions import Fraction
      a = posterior_after_tests(Fraction(1, 5), Fraction(7, 10), Fraction(2, 10), [True, False, True])
      b = posterior_after_tests(Fraction(1, 5), Fraction(7, 10), Fraction(2, 10), [True, True, False])
      assert a == b
  hints:
  - The posterior from one test is the prior for the next.
  solution: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        """Bayes' rule for any number of hypotheses.
        priors: {hypothesis: chance before the evidence}; likelihoods: {hypothesis: chance of the evidence if that hypothesis is true}.
        Returns {hypothesis: chance after the evidence} (Fractions that add up to 1).
        ValueError if the evidence is impossible under every hypothesis."""
        weights = {h: Fraction(priors[h]) * Fraction(likelihoods[h]) for h in priors}
        total = sum(weights.values())
        if total == 0:
            raise ValueError("the evidence is impossible")
        return {h: w / total for h, w in weights.items()}


    def posterior_after_tests(prior, sensitivity, false_positive, results):
        """Update the chance of the condition after a list of test results (True = positive), one after the other.
        The posterior after each test becomes the prior for the next. specificity = 1 - false_positive."""
        belief = Fraction(prior)
        for positive in results:
            like_yes = Fraction(sensitivity) if positive else 1 - Fraction(sensitivity)
            like_no = Fraction(false_positive) if positive else 1 - Fraction(false_positive)
            belief = bayes_update({"yes": belief, "no": 1 - belief}, {"yes": like_yes, "no": like_no})["yes"]
        return belief
  explanation: Evidence accumulates, and the order does not matter.
- id: rejection
  title: Rejection sampling
  difficulty: 4
  prompt: 'The starter imports `random`. Write `rejection_estimate(sample, event, given, runs, seed=1)`: create `rng = random.Random(seed)`, draw `runs` outcomes with `sample(rng)`, keep those where `given(outcome)` is true and count how many of the kept ones satisfy `event`. Return the count divided by the number kept, or `None` if none were kept.'
  starter: |
    import random


    def rejection_estimate(sample, event, given, runs, seed=1):
        pass
  tests:
  - name: two children
    code: |
      def two_children(rng):
          return (rng.random() < 0.5, rng.random() < 0.5)      # True = boy
      p1 = rejection_estimate(two_children, lambda k: k[0] and k[1], lambda k: k[0] or k[1], 40000, 3)
      assert abs(p1 - 1 / 3) < 0.02
      p2 = rejection_estimate(two_children, lambda k: k[0] and k[1], lambda k: k[0], 40000, 3)
      assert abs(p2 - 1 / 2) < 0.02
  - name: impossible conditions and repeatability
    code: |
      assert rejection_estimate(lambda rng: rng.random(), lambda x: True, lambda x: x > 2, 100) is None
      f = lambda rng: rng.random()
      assert rejection_estimate(f, lambda x: x < 0.2, lambda x: x < 0.5, 2000, 9) == rejection_estimate(f, lambda x: x < 0.2, lambda x: x < 0.5, 2000, 9)
      assert abs(rejection_estimate(f, lambda x: x < 0.2, lambda x: x < 0.5, 40000, 1) - 0.4) < 0.02
  hints:
  - Count `kept` and `hits` in one loop.
  solution: |
    import random


    def rejection_estimate(sample, event, given, runs, seed=1):
        """Estimate P(event | given) by simulation: draw outcomes with sample(rng), throw away those where `given` is false,
        and report the fraction of the rest where `event` is true. Returns None if no draw satisfied `given`."""
        rng = random.Random(seed)
        kept = hits = 0
        for _ in range(runs):
            outcome = sample(rng)
            if given(outcome):
                kept += 1
                hits += bool(event(outcome))
        return hits / kept if kept else None
  explanation: Simulation can answer a conditional question without any algebra.
- id: monty-bayes
  title: 'Capstone: Monty Hall with Bayes'
  difficulty: 5
  prompt: 'The starter has `bayes_update`. Write `monty_posterior(picked, opened)` returning a dictionary from each door 0, 1, 2 to the chance the prize is there, given that you picked `picked` and the host opened `opened` (raise `ValueError` if they are equal). The prior is 1/3 each. The likelihood that the host opens `opened`: 0 if the prize is behind `opened`; 1/2 if the prize is behind `picked`; 1 otherwise.'
  starter: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        """Bayes' rule for any number of hypotheses.
        priors: {hypothesis: chance before the evidence}; likelihoods: {hypothesis: chance of the evidence if that hypothesis is true}.
        Returns {hypothesis: chance after the evidence} (Fractions that add up to 1).
        ValueError if the evidence is impossible under every hypothesis."""
        weights = {h: Fraction(priors[h]) * Fraction(likelihoods[h]) for h in priors}
        total = sum(weights.values())
        if total == 0:
            raise ValueError("the evidence is impossible")
        return {h: w / total for h, w in weights.items()}


    def monty_posterior(picked, opened):
        pass
  tests:
  - name: Monty Hall by Bayes' rule
    code: |
      from fractions import Fraction
      post = monty_posterior(0, 1)
      assert post == {0: Fraction(1, 3), 1: 0, 2: Fraction(2, 3)}
      assert monty_posterior(2, 0) == {0: 0, 1: Fraction(2, 3), 2: Fraction(1, 3)}
      assert sum(monty_posterior(1, 2).values()) == 1
      try:
          monty_posterior(1, 1)
          raise AssertionError("accepted")
      except ValueError:
          pass
  hints:
  - Use `Fraction(1, 2)` for the 1/2.
  solution: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        """Bayes' rule for any number of hypotheses.
        priors: {hypothesis: chance before the evidence}; likelihoods: {hypothesis: chance of the evidence if that hypothesis is true}.
        Returns {hypothesis: chance after the evidence} (Fractions that add up to 1).
        ValueError if the evidence is impossible under every hypothesis."""
        weights = {h: Fraction(priors[h]) * Fraction(likelihoods[h]) for h in priors}
        total = sum(weights.values())
        if total == 0:
            raise ValueError("the evidence is impossible")
        return {h: w / total for h, w in weights.items()}


    def monty_posterior(picked, opened):
        """Chance that the prize is behind each of the 3 doors (0, 1, 2) after you pick `picked` and the host opens `opened`.
        The host never opens your door or the prize door, and chooses at random when he has two choices.
        Returns {door: Fraction}. ValueError if opened == picked."""
        if opened == picked:
            raise ValueError("the host cannot open your door")
        priors = {d: Fraction(1, 3) for d in range(3)}
        likelihoods = {}
        for prize in range(3):
            if prize == opened:
                likelihoods[prize] = 0
            elif prize == picked:
                likelihoods[prize] = Fraction(1, 2)
            else:
                likelihoods[prize] = 1
        return bayes_update(priors, likelihoods)
  explanation: The classic puzzle, solved by the classic rule.
commonMistakes:
- title: Confusing P(A | B) with P(B | A)
  explanation: 'They can be wildly different: the chance a positive test means disease is not the chance a sick person tests positive.'
- title: Ignoring the base rate
  explanation: A rare condition stays unlikely after one imperfect test.
- title: Updating twice with the same evidence
  explanation: Use each piece of evidence once.
- title: Assuming events are independent
  explanation: Check with P(A and B) = P(A) P(B); the product rule needs it.
summary:
- P(A | B) restricts attention to the cases where B happened.
- Independent events do not change each other's chances.
- 'Bayes'' rule: posterior = prior x likelihood, rescaled.'
- 'Base rates matter: rare conditions stay unlikely after one test.'
- Evidence can be added step by step.
