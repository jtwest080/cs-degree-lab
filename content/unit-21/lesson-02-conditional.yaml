id: u21-conditional
title: Conditional Probability and Bayes' Rule
minutes: 85
objective: Learn how to update what you believe when you get new information. You will meet conditional probability, discover why a positive test for a rare disease usually means you are probably fine, and use Bayes' rule, the idea at the heart of spam filters, medical diagnosis and modern machine learning.
outcomes:
- Compute a conditional probability by restricting to the cases that are given
- Test whether two events are independent
- Apply Bayes' rule to update a belief
- Explain why the base rate matters
- Re-solve Monty Hall exactly with Bayes' rule
sections:
- heading: Chance, given what we know
  body: |-
    New information changes chances. The probability that it rains today may be 20 percent; given that the sky is full of dark clouds it might be 70 percent. We write the **conditional probability** of `A` given `B` as `P(A | B)`, read "the probability of A given B". To compute it, throw away every outcome where `B` did not happen and ask how often `A` happens among those that remain: `P(A | B) = P(A and B) / P(B)`.

    Example: roll two dice. `P(doubles)` is 6/36 = 1/6. Now you learn the total is 8. The ways to total 8 are `(2,6) (3,5) (4,4) (5,3) (6,2)`: five outcomes, one of which is doubles, so `P(doubles | total 8) = 1/5`. The information changed the answer.

    Events are **independent** exactly when knowing one tells you nothing about the other: `P(A | B) = P(A)`, or equivalently `P(A and B) = P(A) * P(B)`. The first die being a 6 and the second die being even are independent. The first die being a 6 and the total being 12 are not: the 6 makes a 12 far more likely.

    Careful with the **two-children puzzle**. A family has two children. Given that the *first* is a boy, the chance both are boys is 1/2. But given only that *at least one* is a boy, it is 1/3, because the equally likely families are `BB, BG, GB` and only one has two boys. The wording of what you know matters.
- heading: Bayes' rule
  body: |-
    Conditional probabilities do not run both ways: the chance that a person who is a stage-four smoker has a cough is very different from the chance that someone with a cough is a stage-four smoker. **Bayes' rule** converts one to the other: `P(H | E) = P(E | H) * P(H) / P(E)`. Here `H` is a **hypothesis** (what we want to know about, like "I have the disease"), `E` is the **evidence** (a positive test), `P(H)` is the **prior**, our belief before the evidence, `P(E | H)` is the **likelihood**, and `P(H | E)` is the **posterior**, our belief after it. The denominator `P(E)` is just the total chance of seeing the evidence under all the hypotheses, which makes the posteriors add up to 1.

    The famous example. A disease affects 1 person in 100. A test catches 90 percent of cases (**sensitivity**) but also gives a false alarm to 5 percent of healthy people. You test positive. How worried should you be? Picture 10,000 people: 100 are sick and 90 of them test positive; 9,900 are healthy and 495 of them test positive. Of the 585 positive results only 90 are really sick: **about 15 percent**. Most doctors, asked this, say about 90. The test is accurate, but the disease is rare, so false alarms from the large healthy group outnumber true detections from the small sick group. The prior, also called the **base rate**, matters enormously.

    A second positive test is not the same as the first: you use the posterior as the new prior. Two positives lift the chance to about 77 percent, three to 98 percent.
- heading: Bayes everywhere, and simulation
  body: |-
    Bayes' rule is the logic of learning from evidence, so it is everywhere. A **spam filter** asks for the chance an email is spam given the words in it (Unit 17's naive Bayes). A self-driving car combines noisy sensor readings with what it already believes. A scientist asks how much an experiment should change her mind. **Bayesian** thinking means starting with a prior, collecting evidence and always updating, rather than treating each result in isolation.

    We can also compute conditional probabilities by **rejection sampling**: simulate many random outcomes, throw away the ones where the given condition is false, and count the rest. It is a way to check any answer you derive.

    Finally, the earlier **Monty Hall** puzzle is just Bayes' rule. Before the host opens a door each door has prior 1/3. You pick door 0 and the host opens door 1. If the prize were behind door 0 he could have opened door 1 or door 2 (chance 1/2 each); if it were behind door 2 he *had* to open door 1 (chance 1); if behind door 1 he could not have opened it (chance 0). Multiply priors by likelihoods: `1/3 * 1/2 : 0 : 1/3 * 1 = 1/6 : 0 : 1/3`. Normalised, that is `1/3 : 0 : 2/3`. Switch.
examples:
- title: Conditional probability by counting
  intro: Doubles given a total of 8, and the two-children puzzle where the wording changes the answer.
  code: |
    from fractions import Fraction


    def probability(outcomes, event):
        if not outcomes:
            raise ValueError("there must be at least one outcome")
        return Fraction(sum(1 for o in outcomes if event(o)), len(outcomes))


    def conditional(outcomes, event, given):
        """P(event | given): among the outcomes where `given` is true, the fraction where `event` is also true.
        ValueError if `given` never happens."""
        possible = [o for o in outcomes if given(o)]
        if not possible:
            raise ValueError("the given condition never happens")
        return Fraction(sum(1 for o in possible if event(o)), len(possible))


    def are_independent(outcomes, a, b):
        """True when P(A and B) equals P(A) * P(B) exactly."""
        both = probability(outcomes, lambda o: a(o) and b(o))
        return both == probability(outcomes, a) * probability(outcomes, b)


    two_dice = [(a, b) for a in range(1, 7) for b in range(1, 7)]
    print("P(total 8) =", probability(two_dice, lambda o: sum(o) == 8))
    print("P(doubles | total 8) =", conditional(two_dice, lambda o: o[0] == o[1], lambda o: sum(o) == 8))
    kids = [("B", "B"), ("B", "G"), ("G", "B"), ("G", "G")]
    print("two boys, given the first is a boy:", conditional(kids, lambda k: k == ("B", "B"), lambda k: k[0] == "B"))
    print("two boys, given at least one is a boy:", conditional(kids, lambda k: k == ("B", "B"), lambda k: "B" in k))
    print("independent?", are_independent(two_dice, lambda o: o[0] == 6, lambda o: o[1] % 2 == 0), are_independent(two_dice, lambda o: o[0] == 6, lambda o: sum(o) == 12))
  output: |
    P(total 8) = 5/36
    P(doubles | total 8) = 1/5
    two boys, given the first is a boy: 1/2
    two boys, given at least one is a boy: 1/3
    independent? True False
  lines:
  - line: 27
    note: Knowing the total changes the chance.
  - line: 30
    note: The wording of what you know matters.
- title: The rare disease
  intro: Why a positive test from a 90 percent accurate test might only mean a 15 percent chance, and how a second and third test change that.
  code: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        """Bayes' rule for any number of hypotheses.
        priors: {hypothesis: chance before the evidence}; likelihoods: {hypothesis: chance of the evidence if that hypothesis is true}.
        Returns {hypothesis: chance after the evidence} (Fractions that add up to 1).
        ValueError if the evidence is impossible under every hypothesis."""
        weights = {h: Fraction(priors[h]) * Fraction(likelihoods[h]) for h in priors}
        total = sum(weights.values())
        if total == 0:
            raise ValueError("the evidence is impossible")
        return {h: w / total for h, w in weights.items()}


    def positive_test(prior, sensitivity, false_positive):
        """Chance of having the condition after one positive test.
        sensitivity = P(positive | condition); false_positive = P(positive | no condition)."""
        post = bayes_update({"yes": prior, "no": 1 - Fraction(prior)}, {"yes": sensitivity, "no": false_positive})
        return post["yes"]


    def posterior_after_tests(prior, sensitivity, false_positive, results):
        """Update the chance of the condition after a list of test results (True = positive), one after the other.
        The posterior after each test becomes the prior for the next. specificity = 1 - false_positive."""
        belief = Fraction(prior)
        for positive in results:
            like_yes = Fraction(sensitivity) if positive else 1 - Fraction(sensitivity)
            like_no = Fraction(false_positive) if positive else 1 - Fraction(false_positive)
            belief = bayes_update({"yes": belief, "no": 1 - belief}, {"yes": like_yes, "no": like_no})["yes"]
        return belief


    print("1% have the disease; test finds 90% of cases, 5% false alarms")
    p = positive_test(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20))
    print("chance of disease after one positive test:", p, "=", round(float(p), 3))
    p2 = posterior_after_tests(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20), [True, True])
    print("after two positives:", round(float(p2), 3))
    p3 = posterior_after_tests(Fraction(1, 100), Fraction(9, 10), Fraction(1, 20), [True, True, True])
    print("after three positives:", round(float(p3), 3))
  output: |
    1% have the disease; test finds 90% of cases, 5% false alarms
    chance of disease after one positive test: 2/13 = 0.154
    after two positives: 0.766
    after three positives: 0.983
  lines:
  - line: 35
    note: About 15 percent, not 90.
  - line: 39
    note: More evidence, more certainty.
- title: Monty Hall with Bayes' rule
  intro: The exact posterior over the three doors.
  code: |
    from fractions import Fraction


    def bayes_update(priors, likelihoods):
        """Bayes' rule for any number of hypotheses.
        priors: {hypothesis: chance before the evidence}; likelihoods: {hypothesis: chance of the evidence if that hypothesis is true}.
        Returns {hypothesis: chance after the evidence} (Fractions that add up to 1).
        ValueError if the evidence is impossible under every hypothesis."""
        weights = {h: Fraction(priors[h]) * Fraction(likelihoods[h]) for h in priors}
        total = sum(weights.values())
        if total == 0:
            raise ValueError("the evidence is impossible")
        return {h: w / total for h, w in weights.items()}


    def monty_posterior(picked, opened):
        """Chance that the prize is behind each of the 3 doors (0, 1, 2) after you pick `picked` and the host opens `opened`.
        The host never opens your door or the prize door, and chooses at random when he has two choices.
        Returns {door: Fraction}. ValueError if opened == picked."""
        if opened == picked:
            raise ValueError("the host cannot open your door")
        priors = {d: Fraction(1, 3) for d in range(3)}
        likelihoods = {}
        for prize in range(3):
            if prize == opened:
                likelihoods[prize] = 0
            elif prize == picked:
                likelihoods[prize] = Fraction(1, 2)
            else:
                likelihoods[prize] = 1
        return bayes_update(priors, likelihoods)


    post = monty_posterior(0, 1)
    print("you picked door 0, the host opened door 1:", {d: str(p) for d, p in post.items()})
    print("so switching to door 2 wins with chance", post[2])
  output: |
    you picked door 0, the host opened door 1: {0: '1/3', 1: '0', 2: '2/3'}
    so switching to door 2 wins with chance 2/3
  lines:
  - line: 34
    note: 'Exact: 1/3 for staying, 2/3 for switching.'
