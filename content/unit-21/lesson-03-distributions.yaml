- title: Sampling and the coupon collector
  intro: Simulation agrees with the exact answer.
  code: |
    import random
    from fractions import Fraction


    def sample_from(dist, rng):
        """Draw one value from a distribution {value: chance} using one call to rng.random()."""
        r = rng.random()
        total = 0.0
        last = None
        for value, p in dist.items():
            total += p
            last = value
            if r < total:
                return value
        return last


    def simulate_dist(dist, runs, seed=1):
        """Draw `runs` values and return {value: fraction of draws}, with every value of dist present (even with 0)."""
        rng = random.Random(seed)
        counts = {v: 0 for v in dist}
        for _ in range(runs):
            counts[sample_from(dist, rng)] += 1
        return {v: c / runs for v, c in counts.items()}


    def coupon_collector_expected(n):
        """Expected number of purchases to collect all n different coupons (each purchase is a uniformly random one): n * (1 + 1/2 + ... + 1/n).
        Returns a Fraction."""
        if n < 1:
            raise ValueError("n must be at least 1")
        return n * sum(Fraction(1, k) for k in range(1, n + 1))


    def coupon_collector_simulation(n, runs, seed=1):
        """Average number of purchases over `runs` simulated collections. Use int(rng.random() * n) for each purchase."""
        rng = random.Random(seed)
        total = 0
        for _ in range(runs):
            seen = set()
            buys = 0
            while len(seen) < n:
                seen.add(int(rng.random() * n))
                buys += 1
            total += buys
        return total / runs


    dist = {"win": 0.2, "draw": 0.3, "lose": 0.5}
    print(simulate_dist(dist, 10000, 1))
    print("expected purchases to collect all 6 coupons:", coupon_collector_expected(6), "=", float(coupon_collector_expected(6)))
    print("simulated average over 20000 collections:", coupon_collector_simulation(6, 20000, 1))
  output: |
    {'win': 0.2058, 'draw': 0.2965, 'lose': 0.4977}
    expected purchases to collect all 6 coupons: 147/10 = 14.7
    simulated average over 20000 collections: 14.66495
  lines:
  - line: 50
    note: Draws match the chances.
  - line: 52
    note: Simulation agrees with 14.7.
