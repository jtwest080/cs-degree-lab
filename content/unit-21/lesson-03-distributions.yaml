id: u21-distributions
title: Random Variables and Distributions
minutes: 85
objective: 'Turn chance into numbers you can calculate with. You will learn what a random variable is, how to summarize it with its average and its spread, and meet the three distributions that describe most counting problems: the binomial, the geometric and the Poisson.'
outcomes:
- Define a random variable and its probability distribution
- Compute expected value, variance and standard deviation
- Use the binomial distribution for counts of successes
- Use the geometric distribution for waiting times and the Poisson distribution for rare events
- Sample from a distribution and check it by simulation
sections:
- heading: Random variables and expected value
  body: |-
    A **random variable** is a number that depends on chance: the total of two dice, the number of heads in ten flips, the number of customers who arrive this hour. Its **probability distribution** says how likely each possible value is. We can store a distribution in a dictionary from value to chance, with the chances adding up to 1.

    The **expected value** (or **mean**) is the probability-weighted average of the values: `E[X] = sum of value * chance`. For a fair die it is `(1 + 2 + ... + 6) / 6 = 3.5`. You will never roll 3.5; it is the long-run average, the balance point of the distribution. The expected value is how casinos stay rich and how you decide whether a bet is worth taking: a one dollar lottery ticket with a 1 percent chance of paying 100 dollars has expected profit `0.99 * (-1) + 0.01 * 99 = 0`, so on average you break even (real lotteries are worse).

    A surprising and very useful fact is **linearity of expectation**: the expected value of a sum is the sum of the expected values, *always*, even when the pieces are not independent. So two dice have expected total `3.5 + 3.5 = 7`.
- heading: 'Spread: variance and standard deviation'
  body: |-
    Two random variables can have the same mean and very different behavior: a steady 50 dollars a day versus a coin flip between 0 and 100. The **variance** measures spread: the expected squared distance from the mean, `Var(X) = E[(X - mean)^2]`. Squaring makes every deviation positive and punishes big ones. Its square root is the **standard deviation**, which is in the same units as the data, so it is the number people quote. The fair die has variance `35/12 = 2.92` and standard deviation `1.71`.

    For independent random variables the **variances add** (but the standard deviations do not). This is why averages of many measurements become more reliable: the spread of an average of `n` independent measurements is the single measurement's spread divided by the square root of `n`.
- heading: Three workhorse distributions
  body: |-
    **Binomial.** Do `n` independent trials, each succeeding with chance `p`. The number of successes has the **binomial distribution**: the chance of exactly `k` is `(n choose k) * p^k * (1 - p)^(n - k)`. The `(n choose k)` counts the ways to choose which trials succeed (Unit 6). Its mean is `n p` and its variance is `n p (1 - p)`. Ten fair coin flips give exactly 5 heads about 24.6 percent of the time; 5 heads or more, 62.3 percent.

    **Geometric.** How long do you wait for the first success? The chance that it arrives on trial `k` is `(1 - p)^(k - 1) * p`: `k - 1` failures, then a success. The average wait is `1 / p` trials: on average 6 rolls to see a six.

    **Poisson.** Events that happen at random times at some average **rate** (calls to a help line, typos on a page, meteors in a night) are counted by the **Poisson distribution**: the chance of exactly `k` events when the average is `rate` is `e^(-rate) * rate^k / k!`. It is the limit of a binomial with many trials and a tiny success chance each (so 1,000 trials at 0.2 percent behave like a Poisson with rate 2).

    To use any distribution in a program we **sample** from it: draw a random number `r` between 0 and 1 and walk along the values adding up their chances until the total passes `r`. Sampling lets you check a formula by simulation, and compute expectations that have no formula, like the average number of purchases needed to collect all the cards in a set of 6 (the **coupon collector problem**), which turns out to be `6 * (1 + 1/2 + ... + 1/6) = 14.7`.
examples:
- title: Expected value and spread
  intro: A die, a lottery ticket, and the linearity of expectation with two dice.
  code: |
    import math


    def check_distribution(dist):
        """ValueError unless every chance is between 0 and 1 and they add up to 1 (within 1e-9)."""
        if not dist or any(p < 0 or p > 1 for p in dist.values()) or abs(sum(dist.values()) - 1) > 1e-9:
            raise ValueError("not a probability distribution")


    def expected_value(dist):
        """The long-run average of a random variable: sum of value * probability."""
        check_distribution(dist)
        return sum(v * p for v, p in dist.items())


    def variance(dist):
        """How spread out it is: the expected squared distance from the mean."""
        mean = expected_value(dist)
        return sum((v - mean) ** 2 * p for v, p in dist.items())


    def std_dev(dist):
        return math.sqrt(variance(dist))


    from fractions import Fraction
    die = {i: Fraction(1, 6) for i in range(1, 7)}
    print("fair die: mean", expected_value(die), "variance", variance(die), "std dev", round(std_dev(die), 4))
    lottery = {-1: Fraction(99, 100), 99: Fraction(1, 100)}
    print("a one dollar ticket with a 1 percent chance of paying 100: expected profit", expected_value(lottery))
    two_dice = {}
    for a in range(1, 7):
        for b in range(1, 7):
            two_dice[a + b] = two_dice.get(a + b, 0) + Fraction(1, 36)
    print("two dice total: mean", expected_value(two_dice), "(twice one die: linearity of expectation)")
  output: |
    fair die: mean 7/2 variance 35/12 std dev 1.7078
    a one dollar ticket with a 1 percent chance of paying 100: expected profit 0
    two dice total: mean 7 (twice one die: linearity of expectation)
  lines:
  - line: 28
    note: Mean 7/2, standard deviation about 1.71.
  - line: 35
    note: 'Linearity: the means simply add.'
- title: Binomial, geometric and Poisson
  intro: Ten coin flips, waiting for a six, and events per hour.
  code: |
    import math


    def binomial_pmf(n, k, p):
        """Chance of exactly k successes in n independent trials, each succeeding with chance p:
        (n choose k) * p^k * (1 - p)^(n - k). Zero when k is outside 0..n. ValueError if p is outside 0..1 or n < 0."""
        if n < 0 or not 0 <= p <= 1:
            raise ValueError("bad parameters")
        if k < 0 or k > n:
            return 0
        return math.comb(n, k) * p ** k * (1 - p) ** (n - k)


    def binomial_dist(n, p):
        """The whole distribution as a dictionary {k: chance} for k = 0..n."""
        return {k: binomial_pmf(n, k, p) for k in range(n + 1)}


    def geometric_pmf(k, p):
        """Chance that the first success comes on trial number k (k = 1, 2, 3, ...): (1 - p)^(k - 1) * p."""
        if not 0 < p <= 1:
            raise ValueError("p must be in (0, 1]")
        if k < 1:
            return 0
        return (1 - p) ** (k - 1) * p


    def geometric_cdf(k, p):
        """Chance that the first success comes by trial k: 1 - (1 - p)^k."""
        if not 0 < p <= 1:
            raise ValueError("p must be in (0, 1]")
        if k < 1:
            return 0
        return 1 - (1 - p) ** k


    def poisson_pmf(k, rate):
        """Chance of exactly k events when they happen at an average of `rate` per interval: e^-rate * rate^k / k!."""
        if rate < 0:
            raise ValueError("rate cannot be negative")
        if k < 0:
            return 0
        return math.exp(-rate) * rate ** k / math.factorial(k)


    d = binomial_dist(10, 0.5)
    for k in range(11):
        print((str(k) + " " + str(round(d[k], 4)) + " " + "#" * round(d[k] * 120)).rstrip())
    print("5 heads or more:", round(sum(p for k, p in d.items() if k >= 5), 4))
    print("first six on roll 1..5:", [round(geometric_pmf(k, 1 / 6), 4) for k in range(1, 6)])
    print("six by the 10th roll:", round(geometric_cdf(10, 1 / 6), 4))
    print("Poisson, 2 events per hour, chance of exactly 0, 1, 2, 3:", [round(poisson_pmf(k, 2), 4) for k in range(4)])
  output: |
    0 0.001
    1 0.0098 #
    2 0.0439 #####
    3 0.1172 ##############
    4 0.2051 #########################
    5 0.2461 ##############################
    6 0.2051 #########################
    7 0.1172 ##############
    8 0.0439 #####
    9 0.0098 #
    10 0.001
    5 heads or more: 0.623
    first six on roll 1..5: [0.1667, 0.1389, 0.1157, 0.0965, 0.0804]
    six by the 10th roll: 0.8385
    Poisson, 2 events per hour, chance of exactly 0, 1, 2, 3: [0.1353, 0.2707, 0.2707, 0.1804]
