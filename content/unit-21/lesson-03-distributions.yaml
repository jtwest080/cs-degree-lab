  difficulty: 3
  prompt: 'The starter imports `math`. Write `binomial_pmf(n, k, p)`: `math.comb(n, k) * p**k * (1 - p)**(n - k)`; return 0 when `k` is below 0 or above `n`; raise `ValueError` if `n < 0` or `p` is outside 0 to 1. Write `binomial_dist(n, p)`: the dictionary `{k: chance}` for `k` from 0 to `n`.'
  starter: |
    import math


    def binomial_pmf(n, k, p):
        pass


    def binomial_dist(n, p):
        pass
  tests:
  - name: binomial chances
    code: |
      from fractions import Fraction
      assert binomial_pmf(1, 1, 0.3) == 0.3 and binomial_pmf(1, 0, 0.3) == 0.7
      assert binomial_pmf(3, 2, Fraction(1, 2)) == Fraction(3, 8)
      assert abs(binomial_pmf(10, 5, 0.5) - 0.24609375) < 1e-12
      assert abs(binomial_pmf(5, 0, 0.1) - 0.59049) < 1e-12
      assert binomial_pmf(4, 5, 0.5) == 0 and binomial_pmf(4, -1, 0.5) == 0
      assert binomial_pmf(5, 5, 1) == 1 and binomial_pmf(5, 4, 1) == 0
      for bad in ((-1, 0, 0.5), (3, 1, 1.5), (3, 1, -0.1)):
          try:
              binomial_pmf(*bad)
              raise AssertionError("accepted")
          except ValueError:
              pass
  - name: the whole distribution
    code: |
      d = binomial_dist(10, 0.3)
      assert len(d) == 11 and abs(sum(d.values()) - 1) < 1e-12
      assert max(d, key=d.get) == 3
      mean = sum(k * p for k, p in d.items())
      var = sum((k - mean) ** 2 * p for k, p in d.items())
      assert abs(mean - 3.0) < 1e-12 and abs(var - 2.1) < 1e-12
      assert binomial_dist(0, 0.5) == {0: 1}
  hints:
  - '`math.comb(n, k)` is the number of ways to choose k from n.'
  solution: |
    import math


    def binomial_pmf(n, k, p):
        """Chance of exactly k successes in n independent trials, each succeeding with chance p:
        (n choose k) * p^k * (1 - p)^(n - k). Zero when k is outside 0..n. ValueError if p is outside 0..1 or n < 0."""
        if n < 0 or not 0 <= p <= 1:
            raise ValueError("bad parameters")
        if k < 0 or k > n:
            return 0
        return math.comb(n, k) * p ** k * (1 - p) ** (n - k)


    def binomial_dist(n, p):
        """The whole distribution as a dictionary {k: chance} for k = 0..n."""
        return {k: binomial_pmf(n, k, p) for k in range(n + 1)}
  explanation: Counts of successes in independent trials.
