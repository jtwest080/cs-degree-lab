  solution: |
    import math


    def geometric_pmf(k, p):
        """Chance that the first success comes on trial number k (k = 1, 2, 3, ...): (1 - p)^(k - 1) * p."""
        if not 0 < p <= 1:
            raise ValueError("p must be in (0, 1]")
        if k < 1:
            return 0
        return (1 - p) ** (k - 1) * p


    def geometric_cdf(k, p):
        """Chance that the first success comes by trial k: 1 - (1 - p)^k."""
        if not 0 < p <= 1:
            raise ValueError("p must be in (0, 1]")
        if k < 1:
            return 0
        return 1 - (1 - p) ** k


    def poisson_pmf(k, rate):
        """Chance of exactly k events when they happen at an average of `rate` per interval: e^-rate * rate^k / k!."""
        if rate < 0:
            raise ValueError("rate cannot be negative")
        if k < 0:
            return 0
        return math.exp(-rate) * rate ** k / math.factorial(k)
  explanation: Three formulas that describe a huge range of real counts and waits.
- id: sampling
  title: Sampling from a distribution
  difficulty: 4
  prompt: 'The starter imports `random`. Write `sample_from(dist, rng)`: draw `r = rng.random()`, then go through the values adding up their chances and return the first value whose running total exceeds `r` (return the last value if rounding leaves a gap). Write `simulate_dist(dist, runs, seed=1)`: with `rng = random.Random(seed)`, draw `runs` values and return `{value: fraction of draws}` with every value of `dist` present.'
  starter: |
    import random


    def sample_from(dist, rng):
        pass


    def simulate_dist(dist, runs, seed=1):
        pass
  tests:
  - name: sampling a distribution
    code: |
      import random
      rng = random.Random(5)
      dist = {"a": 0.5, "b": 0.3, "c": 0.2}
      draws = [sample_from(dist, rng) for _ in range(20000)]
      for key, p in dist.items():
          assert abs(draws.count(key) / 20000 - p) < 0.02
      assert sample_from({"only": 1.0}, random.Random(1)) == "only"
      r1 = random.Random(3); r2 = random.Random(3)
      assert [sample_from(dist, r1) for _ in range(20)] == [sample_from(dist, r2) for _ in range(20)]
  - name: empirical distribution
    code: |
      d = {0: 0.25, 1: 0.5, 2: 0.25}
      e = simulate_dist(d, 40000, 2)
      assert set(e) == {0, 1, 2} and abs(sum(e.values()) - 1) < 1e-9
      assert all(abs(e[k] - d[k]) < 0.02 for k in d)
      assert simulate_dist({0: 1.0, 1: 0.0}, 100) == {0: 1.0, 1: 0.0}
      assert simulate_dist(d, 500, 4) == simulate_dist(d, 500, 4)
  hints:
  - Keep a count for each value, starting at 0.
  solution: |
    import random


    def sample_from(dist, rng):
        """Draw one value from a distribution {value: chance} using one call to rng.random()."""
        r = rng.random()
        total = 0.0
        last = None
        for value, p in dist.items():
            total += p
            last = value
            if r < total:
                return value
        return last


    def simulate_dist(dist, runs, seed=1):
        """Draw `runs` values and return {value: fraction of draws}, with every value of dist present (even with 0)."""
        rng = random.Random(seed)
        counts = {v: 0 for v in dist}
        for _ in range(runs):
            counts[sample_from(dist, rng)] += 1
        return {v: c / runs for v, c in counts.items()}
  explanation: Sampling turns a distribution into data.
- id: coupon
  title: 'Capstone: the coupon collector'
  difficulty: 5
  prompt: 'The starter imports `random` and `Fraction`. Write `coupon_collector_expected(n)`: the exact expected number of purchases to collect all `n` coupons, `n * (1 + 1/2 + ... + 1/n)` as a `Fraction` (raise `ValueError` for `n < 1`). Write `coupon_collector_simulation(n, runs, seed=1)`: with `rng = random.Random(seed)`, each run buys coupons `int(rng.random() * n)` until all `n` kinds have been seen; return the average number of purchases.'
  starter: |
    import random
    from fractions import Fraction


    def coupon_collector_expected(n):
        pass


    def coupon_collector_simulation(n, runs, seed=1):
        pass
  tests:
  - name: coupon collector, exactly
    code: |
      from fractions import Fraction
      assert coupon_collector_expected(1) == 1
      assert coupon_collector_expected(2) == 3
      assert coupon_collector_expected(3) == Fraction(11, 2)
      assert coupon_collector_expected(6) == Fraction(147, 10)
      assert abs(float(coupon_collector_expected(50)) - 224.96) < 0.01
      try:
          coupon_collector_expected(0)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: coupon collector, by simulation
    code: |
      est = coupon_collector_simulation(6, 20000, 3)
      assert abs(est - 14.7) < 0.3
      assert coupon_collector_simulation(1, 10) == 1.0
      assert abs(coupon_collector_simulation(3, 20000, 8) - 5.5) < 0.15
      assert coupon_collector_simulation(4, 50, 2) == coupon_collector_simulation(4, 50, 2)
  hints:
  - Use a set to remember which kinds you have.
  solution: |
    import random
    from fractions import Fraction


    def coupon_collector_expected(n):
        """Expected number of purchases to collect all n different coupons (each purchase is a uniformly random one): n * (1 + 1/2 + ... + 1/n).
        Returns a Fraction."""
        if n < 1:
            raise ValueError("n must be at least 1")
        return n * sum(Fraction(1, k) for k in range(1, n + 1))


    def coupon_collector_simulation(n, runs, seed=1):
        """Average number of purchases over `runs` simulated collections. Use int(rng.random() * n) for each purchase."""
        rng = random.Random(seed)
        total = 0
        for _ in range(runs):
            seen = set()
            buys = 0
            while len(seen) < n:
                seen.add(int(rng.random() * n))
                buys += 1
            total += buys
        return total / runs
  explanation: Exact mathematics and simulation, side by side.
commonMistakes:
- title: Thinking the expected value is the most likely value
  explanation: A fair die's mean is 3.5, a value it can never show.
- title: Adding standard deviations of independent variables
  explanation: Variances add; the standard deviation is the square root of the total.
- title: Forgetting the (n choose k) in the binomial
  explanation: It counts the different orders in which the successes can occur.
- title: Starting the geometric count at 0
  explanation: The first trial is trial number 1.
summary:
- A random variable is a number depending on chance; its distribution gives each value's probability.
- Expected value is the probability-weighted average; it is linear.
- Variance and standard deviation measure spread.
- Binomial counts successes, geometric measures waiting, Poisson counts rare events.
- Sampling lets us check formulas and answer questions that have no formula.
