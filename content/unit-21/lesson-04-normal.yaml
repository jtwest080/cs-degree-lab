id: u21-normal
title: The Normal Distribution and the Central Limit Theorem
minutes: 85
objective: 'Meet the most important curve in statistics, the bell-shaped normal distribution. You will learn what a continuous distribution is, how to read probabilities as areas, how to measure how unusual a value is, and why averages of almost anything end up bell-shaped: the central limit theorem.'
outcomes:
- Explain continuous distributions and probability as area under a density curve
- Compute normal probabilities with the cdf and the error function
- Use z-scores, percentiles and the 68-95-99.7 rule
- Invert the cdf to find cut-off values
- Demonstrate the central limit theorem by simulation
sections:
- heading: Continuous distributions
  body: |-
    Dice and coins give a few separate outcomes. But a person's height, the time a web page takes to load or the error in a measurement can be **any** number in a range. The chance of being *exactly* 170.000... centimetres tall is zero, so we ask about **ranges**: what is the chance of being between 165 and 175?

    We describe such a variable with a **density curve** (or **probability density function**, pdf). The curve is never negative, the total area under it is 1, and **the probability of a range is the area under the curve over that range**. This is the integral of Unit 20 at work. The curve's height is not a probability; it just tells you where values are concentrated. The area up to a point `x` is the **cumulative distribution function** (cdf): the chance of a value at or below `x`. The chance of a range is a difference of cdf values: `P(a < X < b) = cdf(b) - cdf(a)`.
- heading: The bell curve
  body: |-
    The **normal distribution** (or **Gaussian**) has the famous symmetrical bell shape, centred on its **mean** `mu`, with its width set by its **standard deviation** `sigma`. Its density is `exp(-z^2 / 2) / (sigma * sqrt(2 pi))`, where `z = (x - mu) / sigma`. That `z` is the **z-score**: how many standard deviations a value is from the mean. Heights, test scores, measurement errors and many natural quantities are close to normal.

    All normal curves are the same curve, stretched and shifted, so once you convert to z-scores you need only one table. Three results are worth memorizing, the **empirical rule**: about **68 percent** of values lie within one standard deviation of the mean, **95 percent** within two and **99.7 percent** within three. IQ tests have mean 100 and standard deviation 15, so an IQ of 130 is `z = 2`: higher than about 97.7 percent of people. A value more than three standard deviations from the mean is quite rare (1 in 370), which is why "six sigma" became a symbol of near-perfect quality control.

    The area under the normal curve has no neat formula, but it can be written using the **error function** `erf`, which Python provides as `math.erf`: `cdf(x) = 0.5 * (1 + erf((x - mu) / (sigma * sqrt(2))))`. To go the other way, from a probability to a cut-off value (the 90th percentile, say), we invert the cdf, which we do by bisection (Unit 20).
- heading: The central limit theorem
  body: |-
    Why is the bell curve everywhere? The **central limit theorem** (CLT) says: take the **average** of many independent random values from almost any distribution, and the average is approximately normally distributed, no matter what the original shape was. The averages are centred on the original mean, and their spread, the **standard error**, is `sigma / sqrt(n)`: more values, steadier average.

    You can watch it happen. Draw values from a very lopsided distribution (the cube of a random number between 0 and 1: most are near 0). A histogram of single draws is a steep ramp. A histogram of averages of 40 draws is a bell. This is why so many measurements, which are really sums or averages of many small effects, look normal, and why polls of a thousand people can estimate the opinion of a whole country. The next lessons use it to measure how sure we can be about an estimate.

    To generate normal random numbers for a simulation, the **Box-Muller** method transforms two uniform random numbers into two independent standard normal ones using a logarithm and a cosine and sine, a lovely use of the trigonometry and logarithms you already know.
examples:
- title: Normal probabilities
  intro: The pdf, the cdf, z-scores, the 68-95-99.7 rule and an inverse lookup.
  code: |
    import math


    def normal_pdf(x, mu=0.0, sigma=1.0):
        """The height of the bell curve at x: exp(-((x - mu) / sigma)^2 / 2) / (sigma * sqrt(2 pi)). ValueError if sigma <= 0."""
        if sigma <= 0:
            raise ValueError("sigma must be positive")
        z = (x - mu) / sigma
        return math.exp(-z * z / 2) / (sigma * math.sqrt(2 * math.pi))


    def normal_cdf(x, mu=0.0, sigma=1.0):
        """The chance of a value at or below x: the area under the curve to the left of x.
        Uses the error function: 0.5 * (1 + erf((x - mu) / (sigma * sqrt(2))))."""
        if sigma <= 0:
            raise ValueError("sigma must be positive")
        return 0.5 * (1 + math.erf((x - mu) / (sigma * math.sqrt(2))))


    def prob_between(lo, hi, mu=0.0, sigma=1.0):
        """Chance of a value between lo and hi (0 if lo >= hi)."""
        if hi <= lo:
            return 0.0
        return normal_cdf(hi, mu, sigma) - normal_cdf(lo, mu, sigma)


    def z_score(x, mu, sigma):
        """How many standard deviations x is above (positive) or below (negative) the mean."""
        if sigma <= 0:
            raise ValueError("sigma must be positive")
        return (x - mu) / sigma


    def percentile_of(x, mu, sigma):
        """The percentage (0 to 100) of the population at or below x."""
        return 100 * normal_cdf(x, mu, sigma)


    def empirical_rule(mu=0.0, sigma=1.0):
        """The chance of landing within 1, 2 and 3 standard deviations of the mean, as a tuple of three numbers."""
        return tuple(prob_between(mu - k * sigma, mu + k * sigma, mu, sigma) for k in (1, 2, 3))


    def normal_ppf(p, mu=0.0, sigma=1.0):
        """The inverse of the cdf: the value x with normal_cdf(x) = p, found by bisection between mu - 10 sigma and mu + 10 sigma
        until the interval is narrower than 1e-12. ValueError unless 0 < p < 1."""
        if not 0 < p < 1:
            raise ValueError("p must be strictly between 0 and 1")
        lo, hi = mu - 10 * sigma, mu + 10 * sigma
        while hi - lo > 1e-12:
            mid = (lo + hi) / 2
            if normal_cdf(mid, mu, sigma) < p:
                lo = mid
            else:
                hi = mid
        return (lo + hi) / 2


    print("pdf at the middle:", round(normal_pdf(0), 4))
    print("within one sd:", round(prob_between(-1, 1), 4), " within 1.96 sd:", round(prob_between(-1.96, 1.96), 4))
    print("IQ 130 (mean 100, sd 15): z =", z_score(130, 100, 15), "percentile", round(percentile_of(130, 100, 15), 2))
    print("rule:", [round(p, 4) for p in empirical_rule()])
    print("the score that beats 90% of people:", round(normal_ppf(0.9, 100, 15), 2))
  output: |
    pdf at the middle: 0.3989
    within one sd: 0.6827  within 1.96 sd: 0.95
    IQ 130 (mean 100, sd 15): z = 2.0 percentile 97.72
    rule: [0.6827, 0.9545, 0.9973]
    the score that beats 90% of people: 119.22
  lines:
  - line: 60
    note: About 68% and 95%.
  - line: 61
    note: Two standard deviations above the mean.
  - line: 63
    note: The inverse cdf.
- title: The central limit theorem
  intro: A lopsided distribution becomes bell-shaped when you average 40 values, and Box-Muller samples obey the empirical rule.
  code: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        """Population standard deviation."""
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / len(values))


    def sample_means(draw, n, trials, seed=1):
        """Take `trials` samples of size n, where each value comes from draw(rng), and return the list of the samples' averages.
        One shared random.Random(seed)."""
        rng = random.Random(seed)
        return [mean([draw(rng) for _ in range(n)]) for _ in range(trials)]


    def normal_samples(count, mu=0.0, sigma=1.0, seed=1):
        """`count` random values from a normal distribution by the Box-Muller method: from two uniform numbers u1, u2
        (use u1 = 1 - rng.random(), u2 = rng.random()) make z0 = sqrt(-2 ln u1) cos(2 pi u2) and z1 = sqrt(-2 ln u1) sin(2 pi u2),
        both standard normal. Use z0 then z1 for each pair; the value is mu + sigma * z. Stop at exactly `count` values."""
        rng = random.Random(seed)
        values = []
        while len(values) < count:
            u1, u2 = 1 - rng.random(), rng.random()
            radius = math.sqrt(-2 * math.log(u1))
            values.append(mu + sigma * radius * math.cos(2 * math.pi * u2))
            values.append(mu + sigma * radius * math.sin(2 * math.pi * u2))
        return values[:count]


    def fraction_within(values, mu, sigma, k):
        """The fraction of values within k standard deviations of mu (distance at most k * sigma)."""
        return sum(1 for v in values if abs(v - mu) <= k * sigma) / len(values)


    one = sample_means(lambda rng: rng.random() ** 3, 1, 5000, 1)       # a very lopsided distribution
    avg = sample_means(lambda rng: rng.random() ** 3, 40, 5000, 1)
    def tally(values, lo, hi, bins):
        counts = [0] * bins
        for v in values:
            counts[min(bins - 1, int((v - lo) / (hi - lo) * bins))] += 1
        return counts
    print("single values (10 bins from 0 to 1):", tally(one, 0, 1, 10))
    print("averages of 40 values (10 bins from 0.15 to 0.35):", tally(avg, 0.15, 0.35, 10))
    print("fraction of 40000 normal samples within 1, 2, 3 sd:", [round(fraction_within(normal_samples(40000, 0, 1, 7), 0, 1, k), 3) for k in (1, 2, 3)])
  output: |
    single values (10 bins from 0 to 1): [2334, 583, 422, 313, 259, 282, 225, 221, 176, 185]
    averages of 40 values (10 bins from 0.15 to 0.35): [165, 262, 531, 676, 852, 848, 701, 485, 256, 224]
    fraction of 40000 normal samples within 1, 2, 3 sd: [0.683, 0.955, 0.997]
