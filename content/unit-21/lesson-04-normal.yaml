      import math
      v = normal_samples(40000, 10, 2, 5)
      assert len(v) == 40000
      assert abs((sum(v) / len(v)) - 10) < 0.05 and abs(math.sqrt(sum((x - sum(v) / len(v)) ** 2 for x in v) / len(v)) - 2) < 0.05
      assert len(normal_samples(7, 0, 1, 1)) == 7 and normal_samples(0) == []
      assert normal_samples(10, 0, 1, 4) == normal_samples(10, 0, 1, 4)
      assert normal_samples(10, 0, 1, 4) != normal_samples(10, 0, 1, 5)
  - name: the empirical rule holds
    code: |
      v = normal_samples(40000, 100, 15, 2)
      assert abs(fraction_within(v, 100, 15, 1) - 0.6827) < 0.01
      assert abs(fraction_within(v, 100, 15, 2) - 0.9545) < 0.01
      assert abs(fraction_within(v, 100, 15, 3) - 0.9973) < 0.005
      assert fraction_within([1, 2, 3], 2, 1, 1) == 1.0 and fraction_within([0, 5], 2, 1, 1) == 0.0
  hints:
  - Each pair of uniform numbers gives two normal values.
  solution: |
    import math
    import random


    def normal_samples(count, mu=0.0, sigma=1.0, seed=1):
        """`count` random values from a normal distribution by the Box-Muller method: from two uniform numbers u1, u2
        (use u1 = 1 - rng.random(), u2 = rng.random()) make z0 = sqrt(-2 ln u1) cos(2 pi u2) and z1 = sqrt(-2 ln u1) sin(2 pi u2),
        both standard normal. Use z0 then z1 for each pair; the value is mu + sigma * z. Stop at exactly `count` values."""
        rng = random.Random(seed)
        values = []
        while len(values) < count:
            u1, u2 = 1 - rng.random(), rng.random()
            radius = math.sqrt(-2 * math.log(u1))
            values.append(mu + sigma * radius * math.cos(2 * math.pi * u2))
            values.append(mu + sigma * radius * math.sin(2 * math.pi * u2))
        return values[:count]


    def fraction_within(values, mu, sigma, k):
        """The fraction of values within k standard deviations of mu (distance at most k * sigma)."""
        return sum(1 for v in values if abs(v - mu) <= k * sigma) / len(values)
  explanation: A little trigonometry turns flat randomness into a bell.
commonMistakes:
- title: Thinking the pdf height is a probability
  explanation: For a continuous variable only areas are probabilities; the height can exceed 1.
- title: Asking for the chance of an exact value
  explanation: For a continuous variable it is zero; ask about a range.
- title: Assuming everything is normal
  explanation: Incomes, city sizes and website traffic are heavily skewed. Check before assuming.
- title: Forgetting standard error
  explanation: The spread of an average is sigma divided by the square root of n, not sigma.
summary:
- Continuous variables use density curves; probability is area.
- The normal curve is set by its mean and standard deviation.
- z-scores measure distance from the mean; 68-95-99.7 is the empirical rule.
- Invert the cdf to find percentiles and cut-offs.
- Averages are approximately normal (central limit theorem) with spread sigma / sqrt(n).
