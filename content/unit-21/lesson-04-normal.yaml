    import math


    def normal_pdf(x, mu=0.0, sigma=1.0):
        """The height of the bell curve at x: exp(-((x - mu) / sigma)^2 / 2) / (sigma * sqrt(2 pi)). ValueError if sigma <= 0."""
        if sigma <= 0:
            raise ValueError("sigma must be positive")
        z = (x - mu) / sigma
        return math.exp(-z * z / 2) / (sigma * math.sqrt(2 * math.pi))


    def normal_cdf(x, mu=0.0, sigma=1.0):
        """The chance of a value at or below x: the area under the curve to the left of x.
        Uses the error function: 0.5 * (1 + erf((x - mu) / (sigma * sqrt(2))))."""
        if sigma <= 0:
            raise ValueError("sigma must be positive")
        return 0.5 * (1 + math.erf((x - mu) / (sigma * math.sqrt(2))))


    def normal_ppf(p, mu=0.0, sigma=1.0):
        """The inverse of the cdf: the value x with normal_cdf(x) = p, found by bisection between mu - 10 sigma and mu + 10 sigma
        until the interval is narrower than 1e-12. ValueError unless 0 < p < 1."""
        if not 0 < p < 1:
            raise ValueError("p must be strictly between 0 and 1")
        lo, hi = mu - 10 * sigma, mu + 10 * sigma
        while hi - lo > 1e-12:
            mid = (lo + hi) / 2
            if normal_cdf(mid, mu, sigma) < p:
                lo = mid
            else:
                hi = mid
        return (lo + hi) / 2
  explanation: Bisection inverts any increasing function.
- id: clt
  title: The central limit theorem
  difficulty: 4
  prompt: 'The starter has `mean`, `std` (population standard deviation) and imports `math` and `random`. Write `sample_means(draw, n, trials, seed=1)`: with one `rng = random.Random(seed)`, make `trials` samples, each made of `n` values `draw(rng)`, and return the list of their averages.'
  starter: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        """Population standard deviation."""
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / len(values))


    def sample_means(draw, n, trials, seed=1):
        pass
  tests:
  - name: averages are steadier than single values
    code: |
      means = sample_means(lambda rng: rng.random(), 30, 4000, 3)
      assert len(means) == 4000
      assert abs(mean(means) - 0.5) < 0.01
      single = [random_value for random_value in sample_means(lambda rng: rng.random(), 1, 4000, 3)]
      assert std(means) < std(single) / 4
  - name: the standard error
    code: |
      import math
      sigma = math.sqrt(1 / 12)      # standard deviation of one uniform(0, 1) value
      for n in (4, 16, 64):
          means = sample_means(lambda rng: rng.random(), n, 5000, n)
          assert abs(std(means) - sigma / math.sqrt(n)) < 0.01 * (1 + 4 / math.sqrt(n)), n
      assert sample_means(lambda rng: rng.random(), 5, 10, 2) == sample_means(lambda rng: rng.random(), 5, 10, 2)
      assert sample_means(lambda rng: 4, 3, 2) == [4.0, 4.0]
  hints:
  - Use a list comprehension inside a list comprehension.
  solution: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        """Population standard deviation."""
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / len(values))


    def sample_means(draw, n, trials, seed=1):
        """Take `trials` samples of size n, where each value comes from draw(rng), and return the list of the samples' averages.
        One shared random.Random(seed)."""
        rng = random.Random(seed)
        return [mean([draw(rng) for _ in range(n)]) for _ in range(trials)]
  explanation: 'Averages of many values behave: centred on the mean, narrower by the square root of n.'
- id: box-muller
  title: 'Capstone: generating normal samples'
  difficulty: 5
  prompt: 'The starter imports `math` and `random`. Write `normal_samples(count, mu=0.0, sigma=1.0, seed=1)` with the Box-Muller method: with `rng = random.Random(seed)`, repeat `u1 = 1 - rng.random()`, `u2 = rng.random()`, `radius = math.sqrt(-2 * math.log(u1))` and append `mu + sigma * radius * cos(2 pi u2)` then `mu + sigma * radius * sin(2 pi u2)`; stop when there are `count` values (cut off any extra). Write `fraction_within(values, mu, sigma, k)`: the fraction of values at most `k * sigma` from `mu`.'
  starter: |
    import math
    import random


    def normal_samples(count, mu=0.0, sigma=1.0, seed=1):
