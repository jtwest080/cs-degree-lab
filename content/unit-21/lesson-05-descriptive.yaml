  solution: |
    import math


    def mean(values):
        """The average. ValueError for an empty list."""
        if not values:
            raise ValueError("no data")
        return sum(values) / len(values)


    def median(values):
        """The middle value of the sorted data (the average of the two middle ones when the count is even)."""
        if not values:
            raise ValueError("no data")
        ordered = sorted(values)
        n = len(ordered)
        mid = n // 2
        if n % 2:
            return ordered[mid]
        return (ordered[mid - 1] + ordered[mid]) / 2


    def modes(values):
        """Every value that occurs most often, as a sorted list."""
        if not values:
            raise ValueError("no data")
        counts = {}
        for v in values:
            counts[v] = counts.get(v, 0) + 1
        best = max(counts.values())
        return sorted(v for v, c in counts.items() if c == best)


    def data_range(values):
        """The largest value minus the smallest."""
        if not values:
            raise ValueError("no data")
        return max(values) - min(values)


    def variance(values, sample=True):
        """The average squared distance from the mean. With sample=True (the default) divide by n - 1, for estimating the spread of a
        bigger population from a sample; with sample=False divide by n. ValueError if there are too few values (n - 1 would be 0)."""
        n = len(values)
        if n == 0 or (sample and n < 2):
            raise ValueError("not enough data")
        m = mean(values)
        return sum((v - m) ** 2 for v in values) / (n - 1 if sample else n)


    def std(values, sample=True):
        return math.sqrt(variance(values, sample))


    def quantile(values, q):
        """The value below which a fraction q (0 to 1) of the data falls, with straight-line interpolation between neighbours:
        sort the data, let position = (n - 1) * q, and blend the values on either side of it. ValueError for no data or q outside 0..1."""
        if not values or not 0 <= q <= 1:
            raise ValueError("bad input")
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        fraction = position - low
        return ordered[low] + (ordered[high] - ordered[low]) * fraction


    def iqr(values):
        """The interquartile range: the spread of the middle half of the data."""
        return quantile(values, 0.75) - quantile(values, 0.25)


    def outliers(values):
        """Values more than 1.5 * IQR below the first quartile or above the third quartile, in their original order."""
        q1, q3 = quantile(values, 0.25), quantile(values, 0.75)
        spread = q3 - q1
        low, high = q1 - 1.5 * spread, q3 + 1.5 * spread
        return [v for v in values if v < low or v > high]


    def describe(values):
        """A dictionary summarizing the data: n, mean, median, std (sample), min, q1, q3, max and outliers (a list)."""
        return {
            "n": len(values),
            "mean": mean(values),
            "median": median(values),
            "std": std(values),
            "min": min(values),
            "q1": quantile(values, 0.25),
            "q3": quantile(values, 0.75),
            "max": max(values),
            "outliers": outliers(values),
        }


    def group_means(rows, group_key, value_key):
        """The average of value_key for each distinct group_key, as a dictionary. rows is a list of dictionaries."""
        groups = {}
        for row in rows:
            groups.setdefault(row[group_key], []).append(row[value_key])
        return {g: mean(v) for g, v in groups.items()}


    def success_rates(rows, group_key, success_key):
        """For each group the fraction of rows where success_key is true."""
        groups = {}
        for row in rows:
            groups.setdefault(row[group_key], []).append(bool(row[success_key]))
        return {g: sum(v) / len(v) for g, v in groups.items()}
  explanation: Grouped rates can tell the opposite story from the overall rate.
commonMistakes:
- title: Reporting only the mean
  explanation: Give the spread too; and check the median if the data is skewed.
- title: Using n instead of n - 1 for a sample
  explanation: Dividing by n underestimates the population's spread.
- title: Reading correlation as causation
  explanation: Two things can move together because of a third.
- title: Deleting outliers silently
  explanation: They can be errors or discoveries; investigate first.
- title: Ignoring hidden groups
  explanation: 'Simpson''s paradox: the combined trend can reverse the trend within groups.'
summary:
- Mean, median and mode summarize the centre; the median resists outliers.
- Variance, standard deviation, quantiles and IQR measure spread.
- The 1.5 IQR rule flags outliers.
- Correlation measures straight-line association between -1 and 1; it is not causation.
- Always check for hidden groups (Simpson's paradox).
