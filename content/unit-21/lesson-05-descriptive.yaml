- type: code
  question: Write `skew_hint(values)` returning `'right'` if the mean is greater than the median, `'left'` if it is smaller and `'symmetric'` if they are equal.
  starter: |
    def skew_hint(values):
        pass
  tests:
  - name: skew
    code: |
      assert skew_hint([1, 2, 3, 100]) == "right"
      assert skew_hint([-100, 1, 2, 3]) == "left"
      assert skew_hint([1, 2, 3]) == "symmetric"
  solution: |
    def skew_hint(values):
        ordered = sorted(values)
        n = len(ordered)
        med = ordered[n // 2] if n % 2 else (ordered[n // 2 - 1] + ordered[n // 2]) / 2
        avg = sum(values) / n
        if avg > med:
            return 'right'
        if avg < med:
            return 'left'
        return 'symmetric'
