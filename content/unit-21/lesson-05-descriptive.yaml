    def quantile(values, q):
        """The value below which a fraction q (0 to 1) of the data falls, with straight-line interpolation between neighbours:
        sort the data, let position = (n - 1) * q, and blend the values on either side of it. ValueError for no data or q outside 0..1."""
        if not values or not 0 <= q <= 1:
            raise ValueError("bad input")
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        fraction = position - low
        return ordered[low] + (ordered[high] - ordered[low]) * fraction


    def iqr(values):
        """The interquartile range: the spread of the middle half of the data."""
        return quantile(values, 0.75) - quantile(values, 0.25)


    def outliers(values):
        """Values more than 1.5 * IQR below the first quartile or above the third quartile, in their original order."""
        q1, q3 = quantile(values, 0.25), quantile(values, 0.75)
        spread = q3 - q1
        low, high = q1 - 1.5 * spread, q3 + 1.5 * spread
        return [v for v in values if v < low or v > high]
  explanation: Spread measures how much to trust an average.
