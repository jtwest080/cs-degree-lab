    import math


    def mean(values):
        if not values:
            raise ValueError("no data")
        return sum(values) / len(values)



    def variance(values, sample=True):
        """The average squared distance from the mean. With sample=True (the default) divide by n - 1, for estimating the spread of a
        bigger population from a sample; with sample=False divide by n. ValueError if there are too few values (n - 1 would be 0)."""
        n = len(values)
        if n == 0 or (sample and n < 2):
