      d = describe([1, 2, 3, 4, 5, 100])
      assert d["n"] == 6 and d["min"] == 1 and d["max"] == 100
      assert d["median"] == 3.5 and d["outliers"] == [100]
      assert abs(d["mean"] - 115 / 6) < 1e-12
      assert d["q1"] == 2.25 and d["q3"] == 4.75
      assert abs(d["std"] - std([1, 2, 3, 4, 5, 100])) < 1e-12
      assert set(d) == {"n", "mean", "median", "std", "min", "q1", "q3", "max", "outliers"}
  - name: groups and Simpson's paradox
    code: |
      rows = []
      for kind, treatment, good, total in (("small", "A", 81, 87), ("small", "B", 234, 270), ("large", "A", 192, 263), ("large", "B", 55, 80)):
          rows += [{"stone": kind, "treatment": treatment, "ok": i < good} for i in range(total)]
      by_group = success_rates(rows, "treatment", "ok")
      assert by_group["A"] > 0.7 and by_group["B"] > 0.8 and by_group["B"] > by_group["A"]
      for kind in ("small", "large"):
          part = [r for r in rows if r["stone"] == kind]
          inner = success_rates(part, "treatment", "ok")
          assert inner["A"] > inner["B"], kind
      assert group_means([{"g": "x", "v": 1}, {"g": "x", "v": 3}, {"g": "y", "v": 10}], "g", "v") == {"x": 2.0, "y": 10.0}
      assert success_rates([{"g": 1, "s": True}, {"g": 1, "s": False}], "g", "s") == {1: 0.5}
