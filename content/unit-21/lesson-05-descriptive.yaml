id: u21-descriptive
title: Describing Data
minutes: 80
objective: 'Learn to summarize a pile of numbers honestly: what the typical value is, how spread out the data is, which values are unusual, and how two variables move together. You will also meet the traps, like averages hiding the truth and Simpson''s paradox.'
outcomes:
- Compute and compare mean, median and mode
- Measure spread with variance, standard deviation, quantiles and the IQR
- Find outliers with the 1.5 IQR rule
- Compute covariance and correlation and say what they do and do not show
- Recognize Simpson's paradox
sections:
- heading: 'The centre: mean, median and mode'
  body: |-
    **Descriptive statistics** compress a long list of numbers into a few that you can reason about. The most common summary is the **mean**: add everything up and divide by how many there are. It is the balance point of the data, and it uses every value, which is its strength and weakness. The **median** is the middle value after sorting (the average of the two middle ones if there is an even count). Half the data is below it and half above. The **mode** is the most common value, the only one of the three that works for categories like favourite colour.

    Which is better? Ten salaries: 32, 35, 36, 38, 40, 41, 45, 48, 52 thousand dollars, and the boss at 400. The mean is 76.7 thousand, higher than nine of the ten people. The median is 40.5, much closer to what a typical person earns. One extreme value drags the mean but barely moves the median, so the median is **robust**. When people say "the average salary" and give the mean, ask for the median.
- heading: Spread and unusual values
  body: |-
    Averages say nothing about **spread**. The **range** (maximum minus minimum) is easy but depends on only two values. The **variance** is the average squared distance from the mean, and the **standard deviation** is its square root (back in the data's own units). A subtle point: when your data is a **sample** from a bigger population and you want to estimate the population's spread, divide by `n - 1` instead of `n`. A sample's values sit closer to the sample's own mean than to the true mean, so dividing by `n` would underestimate; `n - 1` corrects it (this is called **Bessel's correction**).

    **Quantiles** describe a distribution by position. The **median** is the 50 percent point; the **quartiles** are the 25 and 75 percent points (`Q1` and `Q3`) and the **interquartile range** `IQR = Q3 - Q1` is the spread of the middle half. The **five-number summary** is minimum, `Q1`, median, `Q3`, maximum: the numbers behind a box plot. By a common convention, a value more than `1.5 * IQR` below `Q1` or above `Q3` is called an **outlier**. An outlier might be a typo, a faulty sensor or the most interesting data point; never delete it without asking why it is there.
- heading: Two variables, and the traps
  body: |-
    How do two measurements move together? The **covariance** averages the products `(x - mean x) * (y - mean y)`: positive when they rise together, negative when one rises as the other falls. Its size depends on the units, so we divide by both standard deviations to get the **correlation coefficient** `r`, a number between -1 and 1: +1 means a perfect rising straight line, -1 a perfect falling one, and 0 means no *straight-line* relationship. Hours studied and exam score might have `r = 0.99`.

    Three warnings. **Correlation is not causation**: ice cream sales and drownings both rise in summer, because of the heat, not because ice cream drowns people. **Correlation only sees straight lines**: `y = x squared` for x from -2 to 2 has `r = 0` though y is perfectly determined by x. And **outliers** can create or destroy a correlation.

    The last trap is **Simpson's paradox**: a trend that holds in every subgroup can reverse when the groups are combined. In a famous study of kidney-stone treatments, treatment A had the higher success rate for small stones *and* for large stones, yet treatment B had the higher rate overall, because doctors gave the harder large-stone cases mostly to A. The lesson: always ask what groups are hiding in your average. The capstone exercise reproduces this.
examples:
- title: Centre, spread and outliers
  intro: 'A set of salaries with one huge value: the mean is dragged, the median is not.'
  code: |
    import math


    def mean(values):
        """The average. ValueError for an empty list."""
        if not values:
            raise ValueError("no data")
        return sum(values) / len(values)


    def median(values):
        """The middle value of the sorted data (the average of the two middle ones when the count is even)."""
        if not values:
            raise ValueError("no data")
        ordered = sorted(values)
        n = len(ordered)
        mid = n // 2
        if n % 2:
            return ordered[mid]
        return (ordered[mid - 1] + ordered[mid]) / 2


    def modes(values):
        """Every value that occurs most often, as a sorted list."""
        if not values:
            raise ValueError("no data")
        counts = {}
        for v in values:
            counts[v] = counts.get(v, 0) + 1
        best = max(counts.values())
        return sorted(v for v, c in counts.items() if c == best)


    def data_range(values):
        """The largest value minus the smallest."""
        if not values:
            raise ValueError("no data")
        return max(values) - min(values)


    def variance(values, sample=True):
        """The average squared distance from the mean. With sample=True (the default) divide by n - 1, for estimating the spread of a
        bigger population from a sample; with sample=False divide by n. ValueError if there are too few values (n - 1 would be 0)."""
        n = len(values)
        if n == 0 or (sample and n < 2):
            raise ValueError("not enough data")
        m = mean(values)
        return sum((v - m) ** 2 for v in values) / (n - 1 if sample else n)


    def std(values, sample=True):
        return math.sqrt(variance(values, sample))


    def quantile(values, q):
        """The value below which a fraction q (0 to 1) of the data falls, with straight-line interpolation between neighbours:
        sort the data, let position = (n - 1) * q, and blend the values on either side of it. ValueError for no data or q outside 0..1."""
        if not values or not 0 <= q <= 1:
            raise ValueError("bad input")
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        fraction = position - low
        return ordered[low] + (ordered[high] - ordered[low]) * fraction


    def iqr(values):
        """The interquartile range: the spread of the middle half of the data."""
        return quantile(values, 0.75) - quantile(values, 0.25)


    def outliers(values):
        """Values more than 1.5 * IQR below the first quartile or above the third quartile, in their original order."""
        q1, q3 = quantile(values, 0.25), quantile(values, 0.75)
        spread = q3 - q1
        low, high = q1 - 1.5 * spread, q3 + 1.5 * spread
        return [v for v in values if v < low or v > high]


    salaries = [32, 35, 36, 38, 40, 41, 45, 48, 52, 400]       # thousands of dollars
    print("mean:", mean(salaries), " median:", median(salaries), "(one very large salary drags the mean up)")
    print("std (sample):", round(std(salaries), 2), " IQR:", iqr(salaries))
    print("quartiles:", quantile(salaries, 0.25), quantile(salaries, 0.5), quantile(salaries, 0.75))
    print("outliers:", outliers(salaries))
    print("modes:", modes([1, 2, 2, 3, 3]))
  output: |
    mean: 76.7  median: 40.5 (one very large salary drags the mean up)
    std (sample): 113.76  IQR: 10.75
    quartiles: 36.5 40.5 47.25
    outliers: [400]
    modes: [2, 3]
  lines:
  - line: 82
    note: One huge salary drags the mean up.
  - line: 85
    note: The 1.5 IQR rule flags it.
- title: Correlation, histograms and smoothing
  intro: Study hours versus score, a histogram of scores and a moving average.
  code: |
    import math


    def mean(values):
        if not values:
            raise ValueError("no data")
        return sum(values) / len(values)



    def variance(values, sample=True):
        n = len(values)
        if n == 0 or (sample and n < 2):
            raise ValueError("not enough data")
        m = mean(values)
        return sum((v - m) ** 2 for v in values) / (n - 1 if sample else n)


    def std(values, sample=True):
        return math.sqrt(variance(values, sample))



    def covariance(xs, ys):
        """How two lists vary together: the sum of (x - mean x)(y - mean y), divided by n - 1. ValueError unless the lists have equal length of at least 2."""
        if len(xs) != len(ys) or len(xs) < 2:
            raise ValueError("need two lists of equal length, at least 2")
        mx, my = mean(xs), mean(ys)
        return sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / (len(xs) - 1)


    def correlation(xs, ys):
        """Pearson's r: covariance divided by both standard deviations. Always between -1 and 1.
        ValueError if either list has no spread (every value equal)."""
        sx, sy = std(xs), std(ys)
        if sx == 0 or sy == 0:
            raise ValueError("correlation needs both lists to vary")
        return covariance(xs, ys) / (sx * sy)


    def histogram(values, bins, lo=None, hi=None):
        """Count how many values fall into each of `bins` equal-width bins between lo and hi (default: the data's minimum and maximum).
        A value equal to hi goes in the last bin; values outside lo..hi are ignored. ValueError for bins < 1 or lo >= hi."""
        if bins < 1:
            raise ValueError("need at least one bin")
        lo = min(values) if lo is None else lo
        hi = max(values) if hi is None else hi
        if lo >= hi:
            raise ValueError("lo must be less than hi")
        counts = [0] * bins
        width = (hi - lo) / bins
        for v in values:
            if lo <= v <= hi:
                counts[min(bins - 1, int((v - lo) / width))] += 1
        return counts


    def moving_average(values, window):
        """The average of each run of `window` neighbouring values (len(values) - window + 1 numbers). ValueError if window < 1 or too large."""
        if window < 1 or window > len(values):
            raise ValueError("bad window")
        return [sum(values[i:i + window]) / window for i in range(len(values) - window + 1)]


    hours = [1, 2, 3, 4, 5, 6, 7, 8]
    score = [52, 55, 61, 64, 70, 71, 79, 85]
    print("correlation of study hours and score:", round(correlation(hours, score), 4))
    print("covariance:", round(covariance(hours, score), 3))
    print("score in a reversed list:", round(correlation(hours, score[::-1]), 4))
    print("histogram of scores in 4 bins:", histogram(score, 4))
    print("3-point moving average:", [round(v, 1) for v in moving_average(score, 3)])
  output: |
    correlation of study hours and score: 0.9915
    covariance: 27.643
    score in a reversed list: -0.9915
    histogram of scores in 4 bins: [2, 2, 2, 2]
    3-point moving average: [56.0, 60.0, 65.0, 68.3, 73.3, 78.3]
  lines:
  - line: 67
    note: 'Nearly 1: a strong rising line.'
  - line: 71
    note: Smoothing reveals the trend.
