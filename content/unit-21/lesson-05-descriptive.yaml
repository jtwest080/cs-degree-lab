      assert moving_average([1, 2, 3, 4, 5], 5) == [3.0]
      assert moving_average([4, 4, 4], 1) == [4.0, 4.0, 4.0]
      assert moving_average([10, 0, 10, 0, 10, 0], 2) == [5.0] * 5
