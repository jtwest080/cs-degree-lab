  - The bin number is `int((v - lo) / width)`, limited to `bins - 1`.
  solution: |
    def histogram(values, bins, lo=None, hi=None):
        """Count how many values fall into each of `bins` equal-width bins between lo and hi (default: the data's minimum and maximum).
        A value equal to hi goes in the last bin; values outside lo..hi are ignored. ValueError for bins < 1 or lo >= hi."""
        if bins < 1:
            raise ValueError("need at least one bin")
        lo = min(values) if lo is None else lo
        hi = max(values) if hi is None else hi
        if lo >= hi:
            raise ValueError("lo must be less than hi")
        counts = [0] * bins
        width = (hi - lo) / bins
        for v in values:
            if lo <= v <= hi:
                counts[min(bins - 1, int((v - lo) / width))] += 1
        return counts


    def moving_average(values, window):
        """The average of each run of `window` neighbouring values (len(values) - window + 1 numbers). ValueError if window < 1 or too large."""
        if window < 1 or window > len(values):
            raise ValueError("bad window")
        return [sum(values[i:i + window]) / window for i in range(len(values) - window + 1)]
  explanation: A histogram shows the shape; a moving average smooths noise.
- id: summary
  title: 'Capstone: a data summary and Simpson''s paradox'
  difficulty: 5
  prompt: 'The starter has all the functions so far. Write `describe(values)` returning a dictionary with the keys `n`, `mean`, `median`, `std` (sample), `min`, `q1`, `q3`, `max` and `outliers` (a list). Write `group_means(rows, group_key, value_key)`: `rows` is a list of dictionaries; return `{group: average of value_key}`. Write `success_rates(rows, group_key, success_key)`: for each group the fraction of rows where `success_key` is true.'
  starter: |
    import math


    def mean(values):
        """The average. ValueError for an empty list."""
        if not values:
            raise ValueError("no data")
        return sum(values) / len(values)


    def median(values):
        """The middle value of the sorted data (the average of the two middle ones when the count is even)."""
        if not values:
            raise ValueError("no data")
        ordered = sorted(values)
        n = len(ordered)
        mid = n // 2
        if n % 2:
            return ordered[mid]
        return (ordered[mid - 1] + ordered[mid]) / 2


    def modes(values):
        """Every value that occurs most often, as a sorted list."""
        if not values:
            raise ValueError("no data")
        counts = {}
        for v in values:
            counts[v] = counts.get(v, 0) + 1
        best = max(counts.values())
        return sorted(v for v, c in counts.items() if c == best)


    def data_range(values):
        """The largest value minus the smallest."""
        if not values:
            raise ValueError("no data")
        return max(values) - min(values)


    def variance(values, sample=True):
        """The average squared distance from the mean. With sample=True (the default) divide by n - 1, for estimating the spread of a
        bigger population from a sample; with sample=False divide by n. ValueError if there are too few values (n - 1 would be 0)."""
        n = len(values)
        if n == 0 or (sample and n < 2):
            raise ValueError("not enough data")
        m = mean(values)
        return sum((v - m) ** 2 for v in values) / (n - 1 if sample else n)


    def std(values, sample=True):
        return math.sqrt(variance(values, sample))


    def quantile(values, q):
        """The value below which a fraction q (0 to 1) of the data falls, with straight-line interpolation between neighbours:
        sort the data, let position = (n - 1) * q, and blend the values on either side of it. ValueError for no data or q outside 0..1."""
        if not values or not 0 <= q <= 1:
            raise ValueError("bad input")
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        fraction = position - low
        return ordered[low] + (ordered[high] - ordered[low]) * fraction


    def iqr(values):
        """The interquartile range: the spread of the middle half of the data."""
        return quantile(values, 0.75) - quantile(values, 0.25)


    def outliers(values):
        """Values more than 1.5 * IQR below the first quartile or above the third quartile, in their original order."""
        q1, q3 = quantile(values, 0.25), quantile(values, 0.75)
        spread = q3 - q1
        low, high = q1 - 1.5 * spread, q3 + 1.5 * spread
        return [v for v in values if v < low or v > high]


    def describe(values):
        pass


    def group_means(rows, group_key, value_key):
        pass


    def success_rates(rows, group_key, success_key):
        pass
