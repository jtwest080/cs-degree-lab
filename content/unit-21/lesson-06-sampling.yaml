  - name: interval for a mean
    code: |
      lo, hi = confidence_interval([1, 2, 3, 4, 5, 6, 7, 8, 9])
      assert abs(lo - (5 - 1.96 * 0.912870929175277)) < 1e-9 and abs(hi - (5 + 1.96 * 0.912870929175277)) < 1e-9
      lo2, hi2 = confidence_interval([1, 2, 3, 4, 5, 6, 7, 8, 9], z=2.576)
      assert lo2 < lo < hi < hi2
      assert confidence_interval([4, 4, 4]) == (4.0, 4.0)
      assert (lo + hi) / 2 == 5
      try:
          confidence_interval([3])
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: interval for a proportion
    code: |
      lo, hi = proportion_ci(50, 100)
      assert abs(lo - 0.402) < 1e-9 and abs(hi - 0.598) < 1e-9
      assert proportion_ci(0, 20) == (0.0, 0.0)
      lo, hi = proportion_ci(20, 20)
      assert hi == 1.0 and lo == 1.0
      lo, hi = proportion_ci(1, 10)
      assert lo >= 0 and hi <= 1 and lo < 0.1 < hi
      big = proportion_ci(500, 1000)
      assert big[1] - big[0] < 0.07
      for args in ((1, 0), (5, 4), (-1, 4)):
          try:
              proportion_ci(*args)
              raise AssertionError("accepted")
          except ValueError:
              pass
