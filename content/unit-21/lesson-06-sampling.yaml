  tests:
  - name: a sample
    code: |
      pop = list(range(100))
      s = simple_random_sample(pop, 10, 1)
      assert len(s) == 10 and len(set(s)) == 10 and all(x in pop for x in s)
      assert simple_random_sample(pop, 10, 1) == s
      assert simple_random_sample(pop, 10, 2) != s
      assert pop == list(range(100))
      assert sorted(simple_random_sample([5, 6, 7], 3, 0)) == [5, 6, 7]
      assert simple_random_sample([5, 6, 7], 0) == []
      for k in (-1, 4):
          try:
              simple_random_sample([5, 6, 7], k)
              raise AssertionError("accepted")
          except ValueError:
              pass
  - name: sample means cluster
    code: |
      pop = list(range(1000))
      means = sample_means(pop, 50, 300, 7)
      assert len(means) == 300
      assert abs(mean(means) - 499.5) < 10
      assert std(means) < std(pop) / 4
      assert std(means) > 10
      bigger = sample_means(pop, 200, 300, 7)
      assert std(bigger) < std(means)
  hints:
  - 'Partial shuffle: after step i, `items[:i + 1]` is a fair random choice.'
