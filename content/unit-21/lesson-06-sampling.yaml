- id: bootstrap
  title: The bootstrap
  difficulty: 4
  prompt: 'The starter has the helpers. Write `bootstrap_stats(values, stat=mean, resamples=1000, seed=0)`: using `rng = random.Random(seed)`, build each resample as `[values[rng.randrange(n)] for _ in range(n)]` (draw with replacement, same size) and return the list of `stat(resample)` values (`ValueError` for no data). Write `bootstrap_ci(values, stat=mean, level=0.95, resamples=1000, seed=0)`: with `tail = (1 - level) / 2` return `(quantile(stats, tail), quantile(stats, 1 - tail))`.'
  starter: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


    def quantile(values, q):
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        return ordered[low] + (ordered[high] - ordered[low]) * (position - low)


    def bootstrap_stats(values, stat=mean, resamples=1000, seed=0):
        pass


    def bootstrap_ci(values, stat=mean, level=0.95, resamples=1000, seed=0):
        pass
  tests:
  - name: bootstrap
    code: |
      data = [3, 5, 7, 9, 11, 13, 15, 17]
      stats = bootstrap_stats(data, resamples=500, seed=3)
      assert len(stats) == 500
      assert abs(mean(stats) - mean(data)) < 0.5
      assert min(stats) >= 3 and max(stats) <= 17
      assert bootstrap_stats(data, resamples=500, seed=3) == stats
      assert bootstrap_stats(data, resamples=500, seed=4) != stats
      assert bootstrap_stats([5, 5, 5], resamples=10) == [5.0] * 10
      try:
          bootstrap_stats([])
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: bootstrap interval
    code: |
      data = [3, 5, 7, 9, 11, 13, 15, 17]
      lo, hi = bootstrap_ci(data, resamples=1000, seed=1)
      assert lo < mean(data) < hi
      assert 5 < lo < 9 and 11 < hi < 15
      assert bootstrap_ci(data, resamples=1000, seed=1) == (lo, hi)
      lo90, hi90 = bootstrap_ci(data, level=0.9, resamples=1000, seed=1)
      assert lo <= lo90 and hi90 <= hi and hi90 - lo90 < hi - lo
      mlo, mhi = bootstrap_ci([1, 2, 3, 4, 100], stat=lambda v: sorted(v)[len(v) // 2], resamples=500, seed=2)
      assert 1 <= mlo <= mhi <= 100
      assert bootstrap_ci([8, 8, 8], resamples=50) == (8.0, 8.0)
  hints:
  - Each draw puts the value back, so values may repeat within a resample.
  solution: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


    def quantile(values, q):
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        return ordered[low] + (ordered[high] - ordered[low]) * (position - low)


    def bootstrap_stats(values, stat=mean, resamples=1000, seed=0):
        """Resample the data WITH replacement (same size as the original) `resamples` times, and return stat() of each resample."""
        if not values:
            raise ValueError("no data")
        rng = random.Random(seed)
        n = len(values)
        return [stat([values[rng.randrange(n)] for _ in range(n)]) for _ in range(resamples)]


    def bootstrap_ci(values, stat=mean, level=0.95, resamples=1000, seed=0):
        """A percentile bootstrap interval: the middle `level` of the resampled statistics, as (low, high).
        For level 0.95 that is the 2.5 percent and 97.5 percent quantiles."""
        stats = bootstrap_stats(values, stat, resamples, seed)
        tail = (1 - level) / 2
        return (quantile(stats, tail), quantile(stats, 1 - tail))
  explanation: Resampling your own data simulates collecting new data.
