id: u21-sampling
title: Sampling and Confidence Intervals
minutes: 85
objective: Learn how a small random sample can tell you about a huge population, how sure you can be, and how to say it honestly with a confidence interval. You will build the machinery from scratch, including the bootstrap, a clever way to measure uncertainty by resampling your own data.
outcomes:
- Explain populations, samples and why random sampling matters
- Describe the sampling distribution of the mean and the standard error
- Compute and correctly interpret a 95 percent confidence interval
- Build a bootstrap confidence interval
- Choose a sample size for a desired margin of error
sections:
- heading: From a sample to a population
  body: |-
    Almost every real question is about a **population** too big to measure completely: every voter, every user, every manufactured chip. So we measure a **sample**, a small subset, and use it to estimate a **parameter** (a true property of the population, like its mean). The number computed from a sample is a **statistic**. The whole game of **inference** is going from statistic to parameter, and saying how far off we might be.

    For that to work the sample must be **random**: every member equally likely to be chosen. A **simple random sample** of size k picks k distinct members, any group of k equally likely. A non-random sample is **biased**: in 1936 a magazine polled two million people, mostly from phone and car-owner lists (wealthy in the Depression), and predicted the wrong winner, while a random poll of a few thousand got it right. Size cannot fix bias; only randomness can.
- heading: 'Why averages wobble: the standard error'
  body: |-
    Draw a random sample, compute its mean, and you get a number close to, but not exactly, the true mean. Draw another and you get a slightly different one. If you could repeat this thousands of times, the sample means would form their own distribution, the **sampling distribution of the mean**. Two facts, both of which you saw in the normal lesson's central limit theorem, make statistics work: it is centred on the true mean, and its spread, called the **standard error** (SE), is `sigma / sqrt(n)`, where sigma is the population standard deviation and n the sample size. Since sigma is unknown we estimate it with the sample's standard deviation.

    Look at the square root. To halve the error you need *four times* the data; to cut it by ten, a hundred times the data. Collecting more yields diminishing returns, which is why polls stop at about a thousand people.
- heading: Confidence intervals
  body: |-
    A single estimate says nothing about its reliability. A **confidence interval** gives a range. About 95 percent of normally distributed sample means fall within 1.96 standard errors of the true mean, so the interval `mean +/- 1.96 * SE` is called a **95 percent confidence interval**; `1.96` is the **critical value** `z`. The part after the plus-minus is the **margin of error**.

    The interpretation is subtle and commonly botched. It does **not** mean there is a 95 percent chance that the true mean is in this particular interval (the true mean is a fixed number; it is either in or out). It means that the *method* is right 95 percent of the time: if you repeated the whole experiment many times, about 95 percent of the intervals would contain the truth. The capstone exercise checks this by simulation. For a **proportion** (like a poll, 212 of 400 say yes) the standard error is `sqrt(p * (1 - p) / n)`, and a poll of 1000 has a margin of about 3 percentage points, the famous number in the news. You can also run it backwards: `n = (z * sigma / margin)^2` tells you how many people to ask for a given margin.
- heading: The bootstrap
  body: 'The formula assumed a nice bell curve and a simple statistic like the mean. What about the *median*, or a ratio, or a weird machine-learning score? The **bootstrap** gives an answer for almost anything using only a computer. The idea: your sample is your best picture of the population, so pretend it *is* the population and sample from it. **Resample with replacement**, meaning you draw one value, write it down, put it back, and draw again, until you have as many values as the original. Compute your statistic on that resample, and repeat a thousand times. The spread of those thousand statistics estimates the spread you would get from truly new samples. The **percentile bootstrap interval** just takes the middle 95 percent of them: the 2.5 percent and 97.5 percent quantiles. It needs no formulas, which is why it is so widely used in modern data science. Remember that it cannot invent information: with a tiny or biased sample it is still tiny or biased.'
examples:
- title: The sampling distribution
  intro: 'Many samples of 40 from a population: the means cluster tightly around the truth, with spread near sigma over root n.'
  code: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


    def quantile(values, q):
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        return ordered[low] + (ordered[high] - ordered[low]) * (position - low)


    def simple_random_sample(population, k, seed=0):
        """Pick k distinct items at random (each item equally likely), without changing the population.
        A shuffle-style method: copy the list, then for i in 0..k-1 swap item i with a random item at or after i, and keep the first k.
        ValueError unless 0 <= k <= len(population)."""
        if not 0 <= k <= len(population):
            raise ValueError("bad sample size")
        rng = random.Random(seed)
        items = list(population)
        for i in range(k):
            j = i + rng.randrange(len(items) - i)
            items[i], items[j] = items[j], items[i]
        return items[:k]


    def sample_means(population, k, trials, seed=0):
        """Draw `trials` samples of size k and return each sample's mean (a list of `trials` numbers)."""
        return [mean(simple_random_sample(population, k, seed * 100003 + t)) for t in range(trials)]


    population = list(range(1, 1001))                 # 1000 "people" aged 1..1000, so the true mean is 500.5
    means = sample_means(population, 40, 500, seed=3)
    print("true mean:", mean(population))
    print("average of 500 sample means:", round(mean(means), 1))
    print("spread of the population:", round(std(population), 1))
    print("spread of the sample means (the standard error):", round(std(means), 1))
    print("theory says sigma / sqrt(n) =", round(std(population) / 40 ** 0.5, 1))
  output: |
    true mean: 500.5
    average of 500 sample means: 500.5
    spread of the population: 288.8
    spread of the sample means (the standard error): 43.8
    theory says sigma / sqrt(n) = 45.7
  lines:
  - line: 44
    note: The mean of the means lands on the truth.
  - line: 46
    note: Much smaller than the population spread.
- title: Intervals, bootstrap and coverage
  intro: A formula interval, a bootstrap interval, a poll, a sample size and a simulation checking the 95 percent claim.
  code: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


    def quantile(values, q):
        ordered = sorted(values)
        position = (len(ordered) - 1) * q
        low = int(math.floor(position))
        high = min(low + 1, len(ordered) - 1)
        return ordered[low] + (ordered[high] - ordered[low]) * (position - low)


    def standard_error(values):
        """How much a sample mean typically wobbles: the sample standard deviation divided by the square root of n."""
        return std(values) / math.sqrt(len(values))


    def required_sample_size(sigma, margin, z=1.96):
        """The smallest whole sample size n so that z * sigma / sqrt(n) <= margin. ValueError unless sigma >= 0 and margin > 0."""
        if sigma < 0 or margin <= 0:
            raise ValueError("bad input")
        return int(math.ceil((z * sigma / margin) ** 2))


    def confidence_interval(values, z=1.96):
        """A confidence interval for the true mean: (mean - z * SE, mean + z * SE), as a tuple. z = 1.96 gives about 95 percent.
        ValueError for fewer than 2 values."""
        if len(values) < 2:
            raise ValueError("need at least 2 values")
        m = mean(values)
        margin = z * standard_error(values)
        return (m - margin, m + margin)


    def proportion_ci(successes, n, z=1.96):
        """A confidence interval for a true proportion from `successes` out of n: p +/- z * sqrt(p * (1 - p) / n) with p = successes / n,
        clipped to stay between 0 and 1. ValueError unless n > 0 and 0 <= successes <= n."""
        if n <= 0 or not 0 <= successes <= n:
            raise ValueError("bad counts")
        p = successes / n
        margin = z * math.sqrt(p * (1 - p) / n)
        return (max(0.0, p - margin), min(1.0, p + margin))


    def bootstrap_stats(values, stat=mean, resamples=1000, seed=0):
        """Resample the data WITH replacement (same size as the original) `resamples` times, and return stat() of each resample."""
        if not values:
            raise ValueError("no data")
        rng = random.Random(seed)
        n = len(values)
        return [stat([values[rng.randrange(n)] for _ in range(n)]) for _ in range(resamples)]


    def bootstrap_ci(values, stat=mean, level=0.95, resamples=1000, seed=0):
        """A percentile bootstrap interval: the middle `level` of the resampled statistics, as (low, high).
        For level 0.95 that is the 2.5 percent and 97.5 percent quantiles."""
        stats = bootstrap_stats(values, stat, resamples, seed)
        tail = (1 - level) / 2
        return (quantile(stats, tail), quantile(stats, 1 - tail))


    def normal_samples(mu, sigma, n, rng):
        """n values from a normal distribution using the Box-Muller method (rng is a random.Random)."""
        out = []
        for _ in range(n):
            u1, u2 = 1 - rng.random(), rng.random()
            out.append(mu + sigma * math.sqrt(-2 * math.log(u1)) * math.cos(2 * math.pi * u2))
        return out


    def coverage(true_mu, sigma, n, trials, seed=0, z=1.96):
        """Repeat `trials` times: draw n normal values, build confidence_interval(values, z), and check whether it contains true_mu.
        Return the fraction of trials where it did."""
        rng = random.Random(seed)
        hits = 0
        for _ in range(trials):
            low, high = confidence_interval(normal_samples(true_mu, sigma, n, rng), z)
            if low <= true_mu <= high:
                hits += 1
        return hits / trials



    rng = random.Random(11)
    data = normal_samples(70, 8, 25, rng)
    print("sample mean:", round(mean(data), 2))
    low, high = confidence_interval(data)
    print("95 percent interval:", round(low, 2), "to", round(high, 2))
    blow, bhigh = bootstrap_ci(data, resamples=2000, seed=2)
    print("bootstrap interval:", round(blow, 2), "to", round(bhigh, 2))
    print("poll of 400 with 212 yes:", [round(v, 3) for v in proportion_ci(212, 400)])
    print("sample size for +/-1 when sigma is 8:", required_sample_size(8, 1))
    print("coverage of the 95 percent interval over 1000 repeats:", coverage(70, 8, 25, 1000, seed=6))
  output: |
    sample mean: 70.52
    95 percent interval: 66.44 to 74.6
    bootstrap interval: 66.64 to 74.74
    poll of 400 with 212 yes: [0.481, 0.579]
    sample size for +/-1 when sigma is 8: 246
    coverage of the 95 percent interval over 1000 repeats: 0.937
