id: u21-hypothesis
title: Hypothesis Tests and p-values
minutes: 85
objective: 'Learn how to decide whether an observed difference is real or just luck: the logic of hypothesis testing, what a p-value actually means, how A/B tests work, and the traps that fill the scientific literature with false discoveries.'
outcomes:
- State null and alternative hypotheses
- Compute z-tests for one and two proportions and a permutation test
- Interpret a p-value correctly
- Explain false positives, power and the multiple-comparisons problem
- Run and judge an A/B test
sections:
- heading: The logic of a test
  body: |-
    You flip a coin 100 times and get 60 heads. Is the coin biased? Even a fair coin gives 60 heads sometimes. A **hypothesis test** is a disciplined way to decide. First state the **null hypothesis**, written `H0`: the boring explanation, here "the coin is fair". The **alternative hypothesis** is what you suspect: "the coin is not fair". Then ask: *if the null hypothesis were true, how surprising would my data be?* The **p-value** is that surprise, the probability of getting a result at least as extreme as the one observed, assuming the null is true. For 60 heads the two-sided p-value is about 0.045: a fair coin would do this (or more extreme in either direction) about 4.5 percent of the time.

    If the p-value is below a threshold chosen in advance, the **significance level** (often `alpha = 0.05`), we **reject the null** and call the result **statistically significant**. Otherwise we **fail to reject**, which is not the same as proving the null true. Absence of evidence is not evidence of absence, especially with small samples.
- heading: Computing p-values three ways
  body: '**Exact**: for coins, add up binomial probabilities. The chance of 60 or more heads from a fair coin is 0.0284 (one side). **Normal approximation, the z-test**: for a proportion, the **z statistic** is `(p_hat - p0) / sqrt(p0 * (1 - p0) / n)`, the number of standard errors the observed rate is from the claimed one; then look it up on the normal curve. For comparing two groups, as in an **A/B test** (where users are randomly split between version A and version B of a page), pool both groups under the null and compare the two rates. **Permutation test**: no formulas. If group labels did not matter, shuffling them would produce differences like the one observed. So shuffle the labels thousands of times, and count how often a shuffled difference is at least as large as the real one. That fraction is the p-value. Like the bootstrap, it works for almost any statistic. For means there is also the **t statistic**, the difference divided by its standard error, compared with a critical value near 2 for moderately large samples.'
- heading: What can go wrong
  body: |-
    A p-value is **not** the probability that the null is true, nor the probability the result is a fluke. It is the probability of data this extreme *given* the null. A tiny p-value does not mean a big or important effect either: with a million users a trivial 0.01 percent change can be "significant". Always report the effect size and a confidence interval, not just the p-value.

    Two kinds of error exist. A **false positive** (Type I error) rejects a true null; with threshold `alpha` it happens `alpha` of the time when nothing is going on. A **false negative** (Type II error) misses a real effect. The chance of catching a real effect is the test's **power**; power grows with sample size and effect size, which is why you should plan sample sizes before running an experiment.

    Finally, **multiple comparisons**: test 20 unrelated ideas at `alpha = 0.05` and the chance of at least one false positive is `1 - 0.95^20`, about 64 percent. This is **p-hacking** when done by trying many analyses until one works. The **Bonferroni correction** divides alpha by the number of tests. Decide your hypotheses and your sample size *before* looking at the data.
examples:
- title: Four ways to test a difference
  intro: A coin, an A/B test and two small groups, tested with a z-test, an exact calculation and a permutation test.
  code: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


    def normal_cdf(x):
        """The chance a standard normal value is at or below x."""
        return 0.5 * (1 + math.erf(x / math.sqrt(2)))


    def proportion_z_test(successes, n, p0=0.5):
        """Test whether the true proportion differs from p0. Return (z, p_value) with z = (p_hat - p0) / sqrt(p0 * (1 - p0) / n)
        and a two-sided p-value 2 * (1 - normal_cdf(abs(z))). ValueError unless n > 0, 0 <= successes <= n and 0 < p0 < 1."""
        if n <= 0 or not 0 <= successes <= n or not 0 < p0 < 1:
            raise ValueError("bad input")
        z = (successes / n - p0) / math.sqrt(p0 * (1 - p0) / n)
        return z, 2 * (1 - normal_cdf(abs(z)))


    def exact_binomial_upper(k, n, p0=0.5):
        """The exact chance of k or more successes in n trials if the true chance is p0: the sum of C(n, i) p0^i (1-p0)^(n-i) for i = k..n."""
        return sum(math.comb(n, i) * p0 ** i * (1 - p0) ** (n - i) for i in range(max(k, 0), n + 1))


    def two_proportion_z_test(s1, n1, s2, n2):
        """Compare two groups' success rates. With p1 = s1 / n1, p2 = s2 / n2 and the pooled rate p = (s1 + s2) / (n1 + n2):
        z = (p1 - p2) / sqrt(p * (1 - p) * (1 / n1 + 1 / n2)). Return (z, two-sided p_value). ValueError if either n is 0 or the pooled rate is 0 or 1."""
        if n1 <= 0 or n2 <= 0:
            raise ValueError("empty group")
        pooled = (s1 + s2) / (n1 + n2)
        if pooled in (0, 1):
            raise ValueError("no variation")
        se = math.sqrt(pooled * (1 - pooled) * (1 / n1 + 1 / n2))
        z = (s1 / n1 - s2 / n2) / se
        return z, 2 * (1 - normal_cdf(abs(z)))


    def welch_t(a, b):
        """The t statistic for a difference in means: (mean a - mean b) / sqrt(var a / n_a + var b / n_b), with sample variances."""
        se = math.sqrt(std(a) ** 2 / len(a) + std(b) ** 2 / len(b))
        return (mean(a) - mean(b)) / se


    def permutation_test(a, b, resamples=2000, seed=0):
        """Is the difference in means bigger than shuffling labels would produce? Compute observed = |mean(a) - mean(b)|.
        Then `resamples` times: shuffle the pooled values (a Fisher-Yates shuffle using rng.randrange), split into groups of the original
        sizes and compute the same difference. Return (count of differences >= observed, plus 1) / (resamples + 1)."""
        if not a or not b:
            raise ValueError("empty group")
        rng = random.Random(seed)
        observed = abs(mean(a) - mean(b))
        pool = list(a) + list(b)
        na = len(a)
        count = 0
        for _ in range(resamples):
            for i in range(len(pool) - 1, 0, -1):
                j = rng.randrange(i + 1)
                pool[i], pool[j] = pool[j], pool[i]
            if abs(mean(pool[:na]) - mean(pool[na:])) >= observed - 1e-12:
                count += 1
        return (count + 1) / (resamples + 1)


    z, p = proportion_z_test(60, 100)
    print("60 heads in 100 flips: z =", round(z, 3), " p-value =", round(p, 4))
    print("exact chance of 60 or more heads from a fair coin:", round(exact_binomial_upper(60, 100), 4))
    z, p = two_proportion_z_test(120, 1000, 150, 1000)
    print("A/B test 12% vs 15%: z =", round(z, 3), " p-value =", round(p, 4))
    group_a = [12, 14, 15, 16, 18, 19, 20, 22]
    group_b = [5, 6, 8, 9, 10, 11, 12, 13]
    print("permutation p-value for two groups:", permutation_test(group_a, group_b, 2000, seed=1))
    print("Welch t statistic:", round(welch_t(group_a, group_b), 2))
  output: |
    60 heads in 100 flips: z = 2.0  p-value = 0.0455
    exact chance of 60 or more heads from a fair coin: 0.0284
    A/B test 12% vs 15%: z = -1.963  p-value = 0.0496
    permutation p-value for two groups: 0.0009995002498750624
    Welch t statistic: 5.02
  lines:
  - line: 73
    note: 'About 0.0455: just under 0.05.'
  - line: 74
    note: One-sided exact value.
  - line: 79
    note: Shuffled labels rarely match the real gap.
- title: False alarms and power
  intro: Simulate experiments to see how often a test cries wolf and how often it catches a real effect.
  code: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


    def normal_cdf(x):
        """The chance a standard normal value is at or below x."""
        return 0.5 * (1 + math.erf(x / math.sqrt(2)))


    def proportion_z_test(successes, n, p0=0.5):
        """Test whether the true proportion differs from p0. Return (z, p_value) with z = (p_hat - p0) / sqrt(p0 * (1 - p0) / n)
        and a two-sided p-value 2 * (1 - normal_cdf(abs(z))). ValueError unless n > 0, 0 <= successes <= n and 0 < p0 < 1."""
        if n <= 0 or not 0 <= successes <= n or not 0 < p0 < 1:
            raise ValueError("bad input")
        z = (successes / n - p0) / math.sqrt(p0 * (1 - p0) / n)
        return z, 2 * (1 - normal_cdf(abs(z)))


    def false_positive_rate(n, trials, seed=0, alpha=0.05):
        """Simulate `trials` experiments with a FAIR coin flipped n times, test each against p0 = 0.5, and return the fraction
        with p_value < alpha. (Draw each flip as rng.random() < 0.5.)"""
        rng = random.Random(seed)
        hits = 0
        for _ in range(trials):
            heads = sum(1 for _ in range(n) if rng.random() < 0.5)
            if proportion_z_test(heads, n)[1] < alpha:
                hits += 1
        return hits / trials


    def power(true_p, n, trials, seed=0, alpha=0.05):
        """The fraction of simulated experiments (n flips of a coin with chance true_p) where the test against p0 = 0.5 gives p_value < alpha."""
        rng = random.Random(seed)
        hits = 0
        for _ in range(trials):
            heads = sum(1 for _ in range(n) if rng.random() < true_p)
            if proportion_z_test(heads, n)[1] < alpha:
                hits += 1
        return hits / trials


    def family_wise_error(alpha, m):
        return 1 - (1 - alpha) ** m


    print("false positive rate when nothing is going on:", false_positive_rate(100, 2000, seed=4))
    print("power to detect a 0.55 coin with 100 flips:", power(0.55, 100, 1000, seed=6))
    print("power to detect a 0.55 coin with 1000 flips:", power(0.55, 1000, 1000, seed=6))
    print("chance of a false alarm in 20 independent tests:", round(family_wise_error(0.05, 20), 3))
  output: |
    false positive rate when nothing is going on: 0.063
    power to detect a 0.55 coin with 100 flips: 0.171
    power to detect a 0.55 coin with 1000 flips: 0.879
    chance of a false alarm in 20 independent tests: 0.642
  lines:
  - line: 55
    note: Near alpha even though nothing is going on.
  - line: 58
    note: Many tests make false alarms likely.
