  tests:
  - name: z test
    code: |
      z, p = proportion_z_test(60, 100)
      assert abs(z - 2.0) < 1e-12 and abs(p - 0.04550026389635842) < 1e-9
      z, p = proportion_z_test(50, 100)
      assert z == 0 and abs(p - 1.0) < 1e-12
      z, p = proportion_z_test(40, 100)
      assert abs(z + 2.0) < 1e-12 and abs(p - 0.04550026389635842) < 1e-9
      z, p = proportion_z_test(30, 100, 0.2)
      assert abs(z - 2.5) < 1e-12 and abs(p - 0.012419330651552318) < 1e-9
      for args in ((1, 0), (5, 4), (3, 10, 0), (3, 10, 1)):
          try:
              proportion_z_test(*args)
              raise AssertionError("accepted")
          except ValueError:
              pass
  - name: exact
    code: |
      assert abs(exact_binomial_upper(60, 100) - 0.028443966820490395) < 1e-12
      assert exact_binomial_upper(0, 10) == 1.0 or abs(exact_binomial_upper(0, 10) - 1) < 1e-12
      assert abs(exact_binomial_upper(10, 10) - 1 / 1024) < 1e-15
      assert abs(exact_binomial_upper(8, 10, 0.5) - 56 / 1024) < 1e-12
      assert exact_binomial_upper(11, 10) == 0
      assert abs(exact_binomial_upper(3, 3, 0.9) - 0.729) < 1e-12
  hints:
  - '`math.comb(n, i)` is the binomial coefficient.'
  solution: |
