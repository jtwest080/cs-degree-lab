  solution: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def std(values):
        m = mean(values)
        return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


    def normal_cdf(x):
        """The chance a standard normal value is at or below x."""
        return 0.5 * (1 + math.erf(x / math.sqrt(2)))


    def two_proportion_z_test(s1, n1, s2, n2):
        """Compare two groups' success rates. With p1 = s1 / n1, p2 = s2 / n2 and the pooled rate p = (s1 + s2) / (n1 + n2):
        z = (p1 - p2) / sqrt(p * (1 - p) * (1 / n1 + 1 / n2)). Return (z, two-sided p_value). ValueError if either n is 0 or the pooled rate is 0 or 1."""
        if n1 <= 0 or n2 <= 0:
            raise ValueError("empty group")
        pooled = (s1 + s2) / (n1 + n2)
        if pooled in (0, 1):
            raise ValueError("no variation")
        se = math.sqrt(pooled * (1 - pooled) * (1 / n1 + 1 / n2))
        z = (s1 / n1 - s2 / n2) / se
        return z, 2 * (1 - normal_cdf(abs(z)))


    def welch_t(a, b):
        """The t statistic for a difference in means: (mean a - mean b) / sqrt(var a / n_a + var b / n_b), with sample variances."""
        se = math.sqrt(std(a) ** 2 / len(a) + std(b) ** 2 / len(b))
        return (mean(a) - mean(b)) / se


    def ab_test(visitors_a, conversions_a, visitors_b, conversions_b, alpha=0.05):
        """Summarize an A/B test as a dictionary: rate_a, rate_b, lift (rate_b - rate_a), z and p_value (from two_proportion_z_test) and
        significant (True when p_value < alpha)."""
        z, p = two_proportion_z_test(conversions_a, visitors_a, conversions_b, visitors_b)
        ra, rb = conversions_a / visitors_a, conversions_b / visitors_b
        return {"rate_a": ra, "rate_b": rb, "lift": rb - ra, "z": z, "p_value": p, "significant": p < alpha}


    def family_wise_error(alpha, m):
        """The chance of at least one false positive among m independent tests that each use threshold alpha: 1 - (1 - alpha)^m."""
        return 1 - (1 - alpha) ** m


    def bonferroni(p_values, alpha=0.05):
        """The indexes of the p-values that stay significant after the Bonferroni correction: those below alpha / (number of tests)."""
        cutoff = alpha / len(p_values)
        return [i for i, p in enumerate(p_values) if p < cutoff]
  explanation: Testing many ideas guarantees false discoveries unless you correct for it.
commonMistakes:
- title: Reading the p-value as the chance the null is true
  explanation: It is the chance of data this extreme if the null were true.
- title: Treating 'not significant' as 'no effect'
  explanation: A small sample may simply lack power.
- title: Ignoring effect size
  explanation: With enough data any tiny difference is significant; ask if it matters.
- title: Peeking and stopping early
  explanation: Checking an A/B test repeatedly and stopping when p dips below 0.05 inflates false positives.
- title: Testing many things, reporting the winner
  explanation: Twenty tests will usually produce one 'significant' result by chance.
summary:
- A hypothesis test asks how surprising the data would be if the null were true.
- The p-value is that probability; it is not the probability the null is true.
- z-tests, exact tests and permutation tests are three ways to compute it.
- False positives happen at rate alpha; power is the chance of catching a real effect.
- Many tests need a correction such as Bonferroni.
