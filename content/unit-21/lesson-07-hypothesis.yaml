  tests:
  - name: different groups
    code: |
      a = [12, 14, 15, 16, 18, 19, 20, 22]
      b = [5, 6, 8, 9, 10, 11, 12, 13]
      p = permutation_test(a, b, 2000, 1)
      assert 0 < p < 0.01
      assert p == permutation_test(a, b, 2000, 1)
  - name: same groups
    code: |
      a = [5, 6, 7, 8, 9, 10]
      b = [5.5, 6.5, 7.5, 8.5, 9.5, 10.5]
      p = permutation_test(a, b, 2000, 2)
      assert 0.5 < p <= 1
      assert permutation_test([1, 2, 3], [1, 2, 3], 100, 0) == 1.0
      assert permutation_test([1, 1], [9, 9], 99, 0) <= 0.6
      q = permutation_test([3, 4, 5, 6], [4, 5, 6, 7], 1000, 3)
      assert 0.2 < q <= 1
      for args in (([], [1]), ([1], [])):
          try:
              permutation_test(*args)
              raise AssertionError("accepted")
          except ValueError:
              pass
  hints:
  - The +1 on top and bottom counts the real arrangement as one of the possibilities.
