    import random


    def mean(values):
        return sum(values) / len(values)


    def fit_line(xs, ys):
        pass


    def predict(model, x):
        pass


    def residuals(xs, ys, model):
        pass
  tests:
  - name: fit
    code: |
      slope, intercept = fit_line([1, 2, 3, 4], [3, 5, 7, 9])
      assert abs(slope - 2) < 1e-12 and abs(intercept - 1) < 1e-12
      slope, intercept = fit_line([0, 1, 2], [1, 3, 2])
      assert abs(slope - 0.5) < 1e-12 and abs(intercept - 1.5) < 1e-12
      assert fit_line([1, 2, 3], [5, 5, 5]) == (0.0, 5.0)
      m = fit_line([1, 2, 3, 4], [3, 5, 7, 9])
      assert abs(predict(m, 10) - 21) < 1e-12 and abs(predict((0.5, 1.5), 4) - 3.5) < 1e-12
      for args in (([1], [1]), ([1, 2], [1]), ([2, 2, 2], [1, 2, 3])):
          try:
              fit_line(*args)
              raise AssertionError("accepted")
          except ValueError:
              pass
  - name: residuals
    code: |
      m = fit_line([0, 1, 2], [1, 3, 2])
      r = residuals([0, 1, 2], [1, 3, 2], m)
      assert [round(e, 12) for e in r] == [-0.5, 1.0, -0.5]
      assert abs(sum(r)) < 1e-12
      assert all(abs(e) < 1e-12 for e in residuals([1, 2, 3], [2, 4, 6], fit_line([1, 2, 3], [2, 4, 6])))
      assert residuals([1, 2], [5, 7], (1, 0)) == [4, 5]
  hints:
  - A single x value everywhere makes the denominator zero.
  solution: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def fit_line(xs, ys):
        """The least-squares line y = slope * x + intercept, as (slope, intercept).
        slope = sum((x - mean x)(y - mean y)) / sum((x - mean x)^2); intercept = mean y - slope * mean x.
        ValueError unless the lists have equal length of at least 2, or if all the x values are equal."""
        if len(xs) != len(ys) or len(xs) < 2:
            raise ValueError("need two lists of equal length, at least 2")
