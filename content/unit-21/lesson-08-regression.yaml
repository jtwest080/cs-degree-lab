- id: slope-uncertainty
  title: How sure is the slope?
  difficulty: 4
  prompt: 'The starter has the earlier functions. Write `slope_standard_error(xs, ys)`: `sqrt(SSE / (n - 2)) / sqrt(sum((x - mx) ** 2))` for the fitted line (`ValueError` for fewer than 3 points). Write `slope_ci(xs, ys, z=1.96)` returning `(slope - z * SE, slope + z * SE)`. Write `slope_p_value(xs, ys)`: `t = slope / SE`, and return `2 * (1 - 0.5 * (1 + math.erf(abs(t) / math.sqrt(2))))`.'
