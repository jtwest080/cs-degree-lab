  explanation: Summary numbers can hide a bad model; residual patterns reveal it.
commonMistakes:
- title: Judging a model on its training data
  explanation: It always looks better than it will on new data.
- title: Trusting R squared alone
  explanation: Anscombe's four datasets all have R squared 0.67 but only one is a good straight-line fit.
- title: Extrapolating far outside the data
  explanation: The line may not hold beyond the range you observed.
- title: Reading slope as cause
  explanation: A slope shows association; it does not show that x causes y.
- title: Ignoring residuals
  explanation: Patterns in residuals mean the model is missing structure.
summary:
- Least squares fits the line minimizing squared residuals.
- R squared and RMSE measure the fit; the standard error measures the slope's uncertainty.
- Train/test splits and cross-validation estimate error on new data.
- Overfitting means memorizing noise.
- Always check residuals; identical summaries can hide very different data.
