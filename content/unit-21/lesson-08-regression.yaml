  tests:
  - name: slope uncertainty
    code: |
      xs = [10, 8, 13, 9, 11, 14, 6, 4, 12, 7, 5]
      ys = [8.04, 6.95, 7.58, 8.81, 8.33, 9.96, 7.24, 4.26, 10.84, 4.82, 5.68]
      assert abs(slope_standard_error(xs, ys) - 0.11790550059563408) < 1e-9
      lo, hi = slope_ci(xs, ys)
      assert lo < 0.5000909090909091 < hi and abs((lo + hi) / 2 - 0.5000909090909091) < 1e-9
      assert abs(hi - lo - 2 * 1.96 * 0.11790550059563408) < 1e-9
      assert slope_p_value(xs, ys) < 0.001
      try:
          slope_standard_error([1, 2], [1, 2])
          raise AssertionError("accepted")
      except ValueError:
