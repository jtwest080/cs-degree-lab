  solution: |
    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def fit_line(xs, ys):
        """The least-squares line y = slope * x + intercept, as (slope, intercept).
        slope = sum((x - mean x)(y - mean y)) / sum((x - mean x)^2); intercept = mean y - slope * mean x.
        ValueError unless the lists have equal length of at least 2, or if all the x values are equal."""
        if len(xs) != len(ys) or len(xs) < 2:
            raise ValueError("need two lists of equal length, at least 2")
        mx, my = mean(xs), mean(ys)
        sxx = sum((x - mx) ** 2 for x in xs)
        if sxx == 0:
            raise ValueError("x values do not vary")
        slope = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sxx
        return slope, my - slope * mx


    def predict(model, x):
        slope, intercept = model
        return slope * x + intercept


    def residuals(xs, ys, model):
        """actual minus predicted for every point."""
        return [y - predict(model, x) for x, y in zip(xs, ys)]


    def r_squared(xs, ys, model):
        """The share of the variation in y that the line explains: 1 - (sum of squared residuals) / (sum of squared distances of y from its mean).
        ValueError if every y is the same."""
        my = mean(ys)
        total = sum((y - my) ** 2 for y in ys)
        if total == 0:
            raise ValueError("y does not vary")
        return 1 - sum(e * e for e in residuals(xs, ys, model)) / total


    def rmse(xs, ys, model):
        """Root mean squared error: the typical size of a miss, in the units of y."""
        errors = residuals(xs, ys, model)
        return math.sqrt(sum(e * e for e in errors) / len(errors))


    def train_test_split(xs, ys, test_fraction=0.25, seed=0):
        """Shuffle the point indexes (Fisher-Yates with random.Random(seed).randrange), put the first round(n * test_fraction) in the
        test set and the rest in the training set. Return (train_x, train_y, test_x, test_y). ValueError unless 0 < test_fraction < 1."""
        if not 0 < test_fraction < 1:
            raise ValueError("test_fraction must be between 0 and 1")
        rng = random.Random(seed)
        order = list(range(len(xs)))
        for i in range(len(order) - 1, 0, -1):
            j = rng.randrange(i + 1)
            order[i], order[j] = order[j], order[i]
        cut = round(len(xs) * test_fraction)
        test, train = order[:cut], order[cut:]
        return ([xs[i] for i in train], [ys[i] for i in train], [xs[i] for i in test], [ys[i] for i in test])


    def cross_val_rmse(xs, ys, k=5):
        """k-fold cross-validation: for each fold f in 0..k-1, the test points are those at positions i where i % k == f and the rest train.
        Fit a line on the training points and measure its rmse on the test points. Return the average over the folds.
        ValueError unless 2 <= k <= len(xs)."""
        if not 2 <= k <= len(xs):
            raise ValueError("bad k")
        scores = []
        for f in range(k):
            tx = [x for i, x in enumerate(xs) if i % k != f]
            ty = [y for i, y in enumerate(ys) if i % k != f]
            vx = [x for i, x in enumerate(xs) if i % k == f]
            vy = [y for i, y in enumerate(ys) if i % k == f]
            scores.append(rmse(vx, vy, fit_line(tx, ty)))
        return sum(scores) / k
  explanation: Error on unseen data is the honest measure.
