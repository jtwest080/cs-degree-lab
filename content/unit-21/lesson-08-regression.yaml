    import math
    import random


    def mean(values):
        return sum(values) / len(values)


    def fit_line(xs, ys):
        """The least-squares line y = slope * x + intercept, as (slope, intercept).
        slope = sum((x - mean x)(y - mean y)) / sum((x - mean x)^2); intercept = mean y - slope * mean x.
        ValueError unless the lists have equal length of at least 2, or if all the x values are equal."""
        if len(xs) != len(ys) or len(xs) < 2:
            raise ValueError("need two lists of equal length, at least 2")
        mx, my = mean(xs), mean(ys)
        sxx = sum((x - mx) ** 2 for x in xs)
        if sxx == 0:
            raise ValueError("x values do not vary")
        slope = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sxx
        return slope, my - slope * mx


    def predict(model, x):
        slope, intercept = model
        return slope * x + intercept


    def residuals(xs, ys, model):
        """actual minus predicted for every point."""
        return [y - predict(model, x) for x, y in zip(xs, ys)]


    def r_squared(xs, ys, model):
        """The share of the variation in y that the line explains: 1 - (sum of squared residuals) / (sum of squared distances of y from its mean).
        ValueError if every y is the same."""
        my = mean(ys)
        total = sum((y - my) ** 2 for y in ys)
        if total == 0:
            raise ValueError("y does not vary")
        return 1 - sum(e * e for e in residuals(xs, ys, model)) / total


    def rmse(xs, ys, model):
        """Root mean squared error: the typical size of a miss, in the units of y."""
        errors = residuals(xs, ys, model)
        return math.sqrt(sum(e * e for e in errors) / len(errors))


    def slope_standard_error(xs, ys):
        """How uncertain the slope is: sqrt(SSE / (n - 2)) / sqrt(sum((x - mean x)^2)), where SSE is the sum of squared residuals.
        ValueError for fewer than 3 points."""
        if len(xs) < 3:
            raise ValueError("need at least 3 points")
        model = fit_line(xs, ys)
        sse = sum(e * e for e in residuals(xs, ys, model))
        mx = mean(xs)
        sxx = sum((x - mx) ** 2 for x in xs)
        return math.sqrt(sse / (len(xs) - 2)) / math.sqrt(sxx)


    def slope_ci(xs, ys, z=1.96):
        """A confidence interval for the true slope: slope +/- z * its standard error, as (low, high)."""
        slope, _ = fit_line(xs, ys)
        margin = z * slope_standard_error(xs, ys)
        return (slope - margin, slope + margin)


    def slope_p_value(xs, ys):
        """A rough two-sided p-value for 'the true slope is 0': t = slope / SE, then 2 * (1 - normal_cdf(|t|)). (Fine for large samples.)"""
        t = fit_line(xs, ys)[0] / slope_standard_error(xs, ys)
        return 2 * (1 - 0.5 * (1 + math.erf(abs(t) / math.sqrt(2))))


    def correlation(a, b):
        ma, mb = mean(a), mean(b)
        top = sum((p - ma) * (q - mb) for p, q in zip(a, b))
        return top / math.sqrt(sum((p - ma) ** 2 for p in a) * sum((q - mb) ** 2 for q in b))


    def looks_curved(xs, ys):
        """True when the residuals still follow a pattern a straight line missed: the absolute correlation between the residuals
        and (x - mean x)^2 is above 0.7. A perfectly fitting line (all residuals zero) is not curved."""
        errors = residuals(xs, ys, fit_line(xs, ys))
        if max(abs(e) for e in errors) < 1e-9:
            return False
        mx = mean(xs)
        return abs(correlation(errors, [(x - mx) ** 2 for x in xs])) > 0.7


    def regression_report(xs, ys):
        """A dictionary: n, slope, intercept, r_squared, slope_se, slope_ci (a tuple) and curved (True or False from looks_curved)."""
        model = fit_line(xs, ys)
        return {"n": len(xs), "slope": model[0], "intercept": model[1], "r_squared": r_squared(xs, ys, model),
