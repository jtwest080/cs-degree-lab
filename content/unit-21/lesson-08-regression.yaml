exercises:
- id: fit
  title: Fit a line
  difficulty: 3
  prompt: 'The starter has `mean`. Write `fit_line(xs, ys)` returning `(slope, intercept)`: `slope = sum((x - mx) * (y - my)) / sum((x - mx) ** 2)` and `intercept = my - slope * mx` (`ValueError` unless the lists have equal length of at least 2, or if all x values are equal). Write `predict(model, x)` (`model` is the pair `(slope, intercept)`) and `residuals(xs, ys, model)`: actual minus predicted for each point.'
  starter: |
