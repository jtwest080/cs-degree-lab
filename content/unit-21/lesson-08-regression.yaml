    code: |
      xs, ys = [0, 1, 2], [1, 3, 2]
      m = fit_line(xs, ys)
      assert abs(r_squared(xs, ys, m) - 0.25) < 1e-12
      assert abs(r_squared([1, 2, 3], [2, 4, 6], fit_line([1, 2, 3], [2, 4, 6])) - 1) < 1e-12
      assert abs(r_squared([1, 2, 3], [1, 3, 2], (0, 2))) < 1e-12
      assert r_squared([1, 2, 3], [1, 3, 2], (-5, 0)) < 0
      try:
          r_squared([1, 2, 3], [4, 4, 4], (0, 4))
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: rmse
