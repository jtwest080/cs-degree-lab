solution: |
  import math
  import random


  def mean(values):
      """The average. ValueError for an empty list."""
      if not values:
          raise ValueError("no data")
      return sum(values) / len(values)


  def std_dev(values):
      """The sample standard deviation (divide by n - 1). ValueError for fewer than 2 values."""
      if len(values) < 2:
          raise ValueError("need at least 2 values")
      m = mean(values)
      return math.sqrt(sum((v - m) ** 2 for v in values) / (len(values) - 1))


  def quantile(values, q):
      """The value below which a fraction q of the data falls, interpolating between neighbours (position = (n - 1) * q)."""
      if not values or not 0 <= q <= 1:
          raise ValueError("bad input")
      ordered = sorted(values)
      position = (len(ordered) - 1) * q
      low = int(math.floor(position))
      high = min(low + 1, len(ordered) - 1)
      return ordered[low] + (ordered[high] - ordered[low]) * (position - low)


  def normal_cdf(x, mu=0.0, sigma=1.0):
      """The chance a normal value is at or below x."""
      if sigma <= 0:
          raise ValueError("sigma must be positive")
      return 0.5 * (1 + math.erf((x - mu) / (sigma * math.sqrt(2))))


  def bayes_posterior(prior, sensitivity, false_positive_rate):
      """The chance of having the condition after one positive test, by Bayes' rule."""
      positive = prior * sensitivity + (1 - prior) * false_positive_rate
      if positive == 0:
          raise ValueError("a positive result is impossible")
      return prior * sensitivity / positive


  def confidence_interval(values, z=1.96):
      """(mean - z * SE, mean + z * SE) where SE = std_dev / sqrt(n)."""
      margin = z * std_dev(values) / math.sqrt(len(values))
      m = mean(values)
      return (m - margin, m + margin)


  def bootstrap_ci(values, stat=mean, level=0.95, resamples=1000, seed=0):
      """Resample with replacement (same size) `resamples` times using random.Random(seed).randrange, apply stat to each
      resample, and return the middle `level` of the results as (low, high) using quantile."""
      if not values:
          raise ValueError("no data")
      rng = random.Random(seed)
      n = len(values)
      stats = [stat([values[rng.randrange(n)] for _ in range(n)]) for _ in range(resamples)]
      tail = (1 - level) / 2
      return (quantile(stats, tail), quantile(stats, 1 - tail))


  def permutation_test(a, b, resamples=2000, seed=0):
      """Shuffle the pooled values (Fisher-Yates using random.Random(seed).randrange), split into the original sizes, and return
      (count of differences in means at least as big as the real one, plus 1) / (resamples + 1)."""
      if not a or not b:
          raise ValueError("empty group")
      rng = random.Random(seed)
      observed = abs(mean(a) - mean(b))
      pool = list(a) + list(b)
      na = len(a)
      count = 0
      for _ in range(resamples):
          for i in range(len(pool) - 1, 0, -1):
              j = rng.randrange(i + 1)
              pool[i], pool[j] = pool[j], pool[i]
          if abs(mean(pool[:na]) - mean(pool[na:])) >= observed - 1e-12:
              count += 1
      return (count + 1) / (resamples + 1)


  def ab_test(visitors_a, conversions_a, visitors_b, conversions_b, alpha=0.05):
      """Compare two conversion rates with a pooled two-proportion z-test. Return a dictionary with rate_a, rate_b, lift,
      z, p_value (two-sided) and significant (p_value < alpha)."""
      pooled = (conversions_a + conversions_b) / (visitors_a + visitors_b)
      if pooled in (0, 1):
          raise ValueError("no variation")
      ra, rb = conversions_a / visitors_a, conversions_b / visitors_b
      se = math.sqrt(pooled * (1 - pooled) * (1 / visitors_a + 1 / visitors_b))
      z = (ra - rb) / se
      p = 2 * (1 - normal_cdf(abs(z)))
      return {"rate_a": ra, "rate_b": rb, "lift": rb - ra, "z": z, "p_value": p, "significant": p < alpha}


  def fit_line(xs, ys):
      """The least-squares line as (slope, intercept). ValueError for unequal or too-short lists or no spread in x."""
      if len(xs) != len(ys) or len(xs) < 2:
          raise ValueError("need two lists of equal length, at least 2")
      mx, my = mean(xs), mean(ys)
      sxx = sum((x - mx) ** 2 for x in xs)
      if sxx == 0:
          raise ValueError("x values do not vary")
      slope = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sxx
      return slope, my - slope * mx


  def r_squared(xs, ys):
      """The share of the variation in y explained by the fitted line."""
      slope, intercept = fit_line(xs, ys)
      my = mean(ys)
      total = sum((y - my) ** 2 for y in ys)
      if total == 0:
          raise ValueError("y does not vary")
      return 1 - sum((y - (slope * x + intercept)) ** 2 for x, y in zip(xs, ys)) / total
