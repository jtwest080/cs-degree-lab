title: Statistics Toolkit
language: python
brief: 'Build a small statistics library from scratch: averages, quantiles, the normal curve, Bayes''
  rule, confidence intervals, a bootstrap, a permutation test, an A/B test and linear regression. These
  are the tools data scientists, product teams and researchers use to decide whether a result is real.'
steps:
- title: Summarize data
  body: Write `mean`, `std_dev` (divide by n - 1) and `quantile` (interpolate between neighbours). Refuse
    empty or too-short input.
- title: Probability tools
  body: Write `normal_cdf` with the error function and `bayes_posterior` for a positive test.
- title: Quantify uncertainty
  body: Write `confidence_interval` from the standard error and `bootstrap_ci`, which resamples with replacement
    and takes the middle of the results.
- title: Test differences
  body: Write `permutation_test` (shuffle the pooled values) and `ab_test` (a pooled two-proportion z-test).
- title: Fit a line
  body: Write `fit_line` (least squares) and `r_squared`. Refuse input where x never varies.
checklist:
- text: Computes averages and spread
  test: averages and spread
- text: Computes quantiles
  test: quantiles
- text: Evaluates the normal curve
  test: the normal curve
- text: Applies Bayes' rule
  test: Bayes' rule
- text: Builds confidence intervals
  test: confidence interval
- text: Bootstraps an interval
  test: bootstrap interval
- text: Runs a permutation test
  test: permutation test
- text: Runs an A/B test
  test: A/B test
- text: Fits a line
  test: fits a line
- text: Computes R squared
  test: R squared
- text: Rejects bad regression input
  test: rejects bad regression input
- text: Leaves inputs untouched
  test: does not change its input
