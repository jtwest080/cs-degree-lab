# Terms introduced in Unit 22 (Advanced Algorithms). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Flow network
  definition: A directed graph whose edges have capacities, used to model how much can move from a source to a sink.
  lesson: u22-flow
- term: Source
  definition: The node where flow starts.
  lesson: u22-flow
- term: Sink
  definition: The node where flow ends.
  lesson: u22-flow
- term: Flow
  definition: An assignment of amounts to edges that respects capacities and conserves flow at middle nodes.
  lesson: u22-flow
- term: Conservation of flow
  definition: The rule that at every middle node the amount flowing in equals the amount flowing out.
  lesson: u22-flow
- term: Maximum flow
  definition: The largest total flow that can get from the source to the sink.
  lesson: u22-flow
- term: Residual graph
  definition: A graph showing the remaining capacity of every edge plus reverse edges that let flow be undone.
  lesson: u22-flow
- term: Augmenting path
  definition: A path from source to sink in the residual graph that still has spare capacity.
  lesson: u22-flow
- term: Bottleneck
  definition: The smallest remaining capacity along a path.
  lesson: u22-flow
- term: Ford-Fulkerson method
  definition: Repeatedly pushing flow along augmenting paths until none remain.
  lesson: u22-flow
- term: Edmonds-Karp algorithm
  definition: Ford-Fulkerson using shortest augmenting paths found by breadth-first search.
  lesson: u22-flow
- term: Cut
  definition: A split of the nodes into a source side and a sink side.
  lesson: u22-flow
- term: Max-flow min-cut theorem
  definition: The maximum flow equals the capacity of the smallest cut.
  lesson: u22-flow
- term: Bipartite matching
  definition: Pairing items from two groups using allowed pairs so that nobody is used twice.
  lesson: u22-flow
- term: Edge-disjoint paths
  definition: Paths between two nodes that share no edge.
  lesson: u22-flow
- term: Strongly connected component
  definition: A maximal group of nodes in a directed graph that can all reach each other.
  lesson: u22-scc
- term: Condensation
  definition: The graph obtained by shrinking each strongly connected component to one node; it has no cycles.
  lesson: u22-scc
- term: Finish time
  definition: The moment a depth-first search has completely explored a node.
  lesson: u22-scc
- term: Transpose graph
  definition: A directed graph with every edge reversed.
  lesson: u22-scc
- term: Kosaraju's algorithm
  definition: A two-pass depth-first search algorithm that finds strongly connected components in linear time.
  lesson: u22-scc
- term: Bridge
  definition: An edge whose removal disconnects a graph.
  lesson: u22-scc
- term: Articulation point
  definition: A node whose removal disconnects a graph, also called a cut vertex.
  lesson: u22-scc
- term: Discovery time
  definition: The order in which a depth-first search first reaches each node.
  lesson: u22-scc
- term: Low value
  definition: The earliest discovery time reachable from a node's subtree using at most one back edge.
  lesson: u22-scc
- term: Back edge
  definition: An edge from a node to one of its ancestors in a depth-first search tree.
  lesson: u22-scc
- term: 2-SAT
  definition: The problem of satisfying a formula whose clauses each have two literals, solvable in linear time.
  lesson: u22-scc
- term: Implication graph
  definition: A graph with an edge for each if-then consequence of the clauses of a 2-SAT formula.
  lesson: u22-scc
- term: Pattern matching
  definition: Finding where a short string occurs inside a longer text.
  lesson: u22-strings
- term: Proper prefix
  definition: A beginning part of a string that is shorter than the whole string.
  lesson: u22-strings
- term: Suffix
  definition: An ending part of a string, from some position to the end.
  lesson: u22-strings
- term: Prefix function
  definition: For each position, the length of the longest proper prefix of the string so far that is also its suffix.
  lesson: u22-strings
- term: Knuth-Morris-Pratt algorithm
  definition: A pattern search that never moves backwards in the text, using the prefix function.
  lesson: u22-strings
- term: Z-function
  definition: For each position, how many characters starting there match the beginning of the string.
  lesson: u22-strings
- term: Rolling hash
  definition: A hash of a sliding window that is updated in constant time as the window moves.
  lesson: u22-strings
- term: Rabin-Karp algorithm
  definition: A pattern search that compares hashes of windows and confirms matches directly.
  lesson: u22-strings
- term: Hash collision
  definition: Two different values that produce the same hash.
  lesson: u22-strings
- term: Trie
  definition: A tree storing words letter by letter so that prefix questions are fast.
  lesson: u22-strings
- term: Suffix array
  definition: The starting positions of all suffixes of a string, ordered alphabetically by suffix.
  lesson: u22-strings
- term: LCP array
  definition: The lengths of the longest common prefixes between neighbouring suffixes in a suffix array.
  lesson: u22-strings
- term: Computational geometry
  definition: The study of algorithms for shapes made of points, lines and polygons.
  lesson: u22-geometry
- term: Collinear
  definition: Lying on the same straight line.
  lesson: u22-geometry
- term: Counterclockwise
  definition: Turning to the left, the positive direction in geometry.
  lesson: u22-geometry
- term: Polygon
  definition: A closed shape made of straight sides.
  lesson: u22-geometry
- term: Ray casting
  definition: Deciding if a point is inside a polygon by counting how many edges a ray from it crosses.
  lesson: u22-geometry
- term: Convex shape
  definition: A shape where the segment between any two of its points stays inside it.
  lesson: u22-geometry
- term: Convex hull
  definition: The smallest convex shape containing a set of points.
  lesson: u22-geometry
- term: Monotone chain
  definition: Andrew's algorithm that builds a convex hull from the sorted points.
  lesson: u22-geometry
- term: Closest pair of points
  definition: The two points of a set with the smallest distance between them.
  lesson: u22-geometry
- term: Sweep line
  definition: An algorithm style that processes sorted events as an imaginary line moves across the data.
  lesson: u22-geometry
- term: Satisfiability problem
  definition: The problem of deciding whether a logical formula can be made true by choosing values for its variables.
  lesson: u22-np
- term: Complement graph
  definition: A graph with an edge exactly where the original has none.
  lesson: u22-np
- term: Travelling salesman problem
  definition: Finding the shortest tour that visits every city once and returns home.
  lesson: u22-np
- term: Held-Karp algorithm
  definition: An exact dynamic programming solution to the travelling salesman problem over subsets of cities.
  lesson: u22-np
- term: 2-opt
  definition: Improving a tour by reversing a stretch of it whenever that makes it shorter.
  lesson: u22-np
- term: Randomized algorithm
  definition: An algorithm that makes random choices as it runs.
  lesson: u22-randomized
- term: Expected running time
  definition: The average running time over the algorithm's own random choices.
  lesson: u22-randomized
- term: Las Vegas algorithm
  definition: A randomized algorithm that is always correct but whose running time varies.
  lesson: u22-randomized
- term: Fisher-Yates shuffle
  definition: A shuffle that gives every ordering equal probability.
  lesson: u22-randomized
- term: Data stream
  definition: A sequence of items seen once, often too large to store.
  lesson: u22-randomized
- term: Reservoir sampling
  definition: Choosing a fair random sample of k items from a stream of unknown length.
  lesson: u22-randomized
- term: Misra-Gries algorithm
  definition: A streaming method that finds frequent items using only a few counters.
  lesson: u22-randomized
- term: Count-min sketch
  definition: A small table of counters that estimates how often each item occurred.
  lesson: u22-randomized
- term: Bloom filter
  definition: A bit array that tests membership with no false negatives and occasional false positives.
  lesson: u22-randomized
- term: False positive
  definition: A wrong yes answer, such as saying an item is present when it is not.
  lesson: u22-randomized
- term: Jaccard similarity
  definition: The size of the overlap of two sets divided by the size of their union.
  lesson: u22-randomized
- term: Shingle
  definition: A short run of consecutive letters or words from a document.
  lesson: u22-randomized
- term: MinHash
  definition: A short signature of a set whose agreement with another signature estimates Jaccard similarity.
  lesson: u22-randomized
- term: Range query
  definition: A question about all the values between two positions.
  lesson: u22-advanced-ds
- term: Prefix sum
  definition: The total of the first i values, used to get any range sum by subtraction.
  lesson: u22-advanced-ds
- term: Difference array
  definition: A helper array that lets a whole range be changed with two updates.
  lesson: u22-advanced-ds
- term: Fenwick tree
  definition: A compact structure for prefix sums and point updates in logarithmic time, also called a binary indexed tree.
  lesson: u22-advanced-ds
- term: Lowest set bit
  definition: The rightmost 1 in a binary number, found with n and minus n.
  lesson: u22-advanced-ds
- term: Segment tree
  definition: A tree storing the answer for every segment so that range queries and updates are logarithmic.
  lesson: u22-advanced-ds
- term: Associative operation
  definition: An operation where grouping does not change the result.
  lesson: u22-advanced-ds
- term: Identity element
  definition: A neutral value that leaves any value unchanged under an operation, such as 0 for addition.
  lesson: u22-advanced-ds
- term: Sparse table
  definition: A precomputed table that answers range-minimum queries in constant time for unchanging data.
  lesson: u22-advanced-ds
- term: Amortized analysis
  definition: Measuring the average cost of an operation over a whole sequence of operations.
  lesson: u22-advanced-ds
- term: Potential method
  definition: An amortized analysis technique that treats cheap operations as saving credit for expensive ones.
  lesson: u22-advanced-ds
