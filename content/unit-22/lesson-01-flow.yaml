id: u22-flow
title: Maximum Flow and Matching
minutes: 95
objective: Learn to answer 'how much can get through?' for any network of pipes, roads or data links, and discover that the same idea solves matching problems like assigning workers to jobs. You will build the Edmonds-Karp algorithm and see the beautiful max-flow min-cut theorem.
outcomes:
- Model a problem as a flow network with capacities
- Explain residual graphs and augmenting paths
- Implement Edmonds-Karp maximum flow
- Find a minimum cut and state the max-flow min-cut theorem
- Turn bipartite matching and disjoint paths into flow problems
sections:
- heading: Pipes, capacities and flow
  body: |-
    Imagine a city's water system. Water enters at a **source**, leaves at a **sink**, and flows through pipes, each of which can carry only so much per minute. How much water can reach the sink? That question appears everywhere: data through a network, cars through roads, goods through a supply chain. We model it as a **flow network**: a directed graph (arrows with a direction) where each edge has a **capacity**, the most it can carry.

    A **flow** assigns each edge an amount of stuff that obeys two rules. First, **capacity**: no edge carries more than its capacity (and no negative amounts). Second, **conservation**: at every node except the source and sink, whatever flows in must flow out, because nothing is stored or created in the middle. The **value** of a flow is the amount leaving the source. The **maximum flow** problem asks for the largest possible value.

    A natural idea is greedy: find a path with spare capacity, push as much as fits, and repeat. It works almost, but a bad early choice can block a better solution. For example, two sources of traffic might both want the same road. We need a way to *undo* choices, and that is the idea of the residual graph.
- heading: Residual graphs and Edmonds-Karp
  body: |-
    The **residual graph** records how much more each edge could carry (**residual capacity** = capacity minus current flow), and also lets flow be *cancelled*: for every edge `u -> v`, we add a **reverse edge** `v -> u` whose residual capacity equals the flow currently on `u -> v`. Sending flow along the reverse edge means "take back some of what we sent forward". Initially all reverse edges have capacity 0.

    An **augmenting path** is a path from source to sink in the residual graph using only edges with remaining capacity. Its **bottleneck** is its smallest residual capacity. The **Ford-Fulkerson method** is: while an augmenting path exists, push its bottleneck amount along it (lowering forward edges, raising reverse edges). When no augmenting path remains, the flow is maximum. The **Edmonds-Karp algorithm** is Ford-Fulkerson with one rule: always choose the augmenting path with the *fewest edges*, found by breadth-first search. That rule guarantees it finishes in `O(V * E^2)` time no matter what the capacities are. Plain Ford-Fulkerson with unlucky path choices can take far longer on large capacities.

    Each augmentation raises the flow by at least 1 (with whole-number capacities), and the flow can never exceed the total capacity leaving the source, so the loop must end.
- heading: Min cut and matching
  body: |-
    A **cut** splits the nodes into two groups, one containing the source and one containing the sink. Its capacity is the sum of the capacities of edges going from the source side to the sink side. Any flow must cross every cut, so no flow can exceed any cut's capacity. The **max-flow min-cut theorem** says something stronger: the maximum flow *equals* the capacity of the smallest cut. When Edmonds-Karp stops, the nodes still reachable from the source form the source side of a minimum cut, so the algorithm hands you the real bottleneck for free. The cut edges are exactly where you would spend money to improve the network.

    Flow solves problems that do not look like flow. In **bipartite matching** you have two groups (workers and jobs) and a list of allowed pairs; you want as many pairs as possible with nobody used twice. Build a network: a source connected to every worker with capacity 1, each allowed worker-job pair as an edge of capacity 1, and every job connected to the sink with capacity 1. A flow of value k is a matching of k pairs, and augmenting paths automatically reshuffle earlier choices. Likewise **edge-disjoint paths** (how many routes share no road?) is max flow with every capacity set to 1. Many problems become easier once you recognize them as flow: this is called a **reduction**, and you will meet the idea again in the NP-completeness lesson.
examples:
- title: A flow network
  intro: 'The classic textbook network: maximum flow, the minimum cut and the bottleneck edges.'
  code: |
    from collections import deque


    def residual_graph(capacity):
        """Copy the network {u: {v: capacity}} and add a reverse edge with capacity 0 for every edge, so flow can be undone later.
        Every node (even one that only appears as a destination) must appear as a key of the result."""
        res = {}
        for u in capacity:
            res.setdefault(u, {})
            for v, c in capacity[u].items():
                res.setdefault(v, {})
                res[u][v] = res[u].get(v, 0) + c
                res[v].setdefault(u, 0)
        return res


    def find_augmenting_path(residual, source, sink):
        """Breadth-first search using only edges with remaining capacity above 0. Return the shortest such path as a list of nodes
        from source to sink, or None if the sink cannot be reached."""
        parent = {source: None}
        queue = deque([source])
        while queue:
            u = queue.popleft()
            if u == sink:
                break
            for v, c in residual[u].items():
                if c > 0 and v not in parent:
                    parent[v] = u
                    queue.append(v)
        if sink not in parent:
            return None
        path = []
        node = sink
        while node is not None:
            path.append(node)
            node = parent[node]
        return path[::-1]


    def bottleneck(residual, path):
        """The smallest remaining capacity along the path."""
        return min(residual[a][b] for a, b in zip(path, path[1:]))


    def augment(residual, path, amount):
        """Push `amount` units along the path: lower each forward edge by amount and raise each reverse edge by amount."""
        for a, b in zip(path, path[1:]):
            residual[a][b] -= amount
            residual[b][a] += amount


    def run_flow(capacity, source, sink):
        """Edmonds-Karp: keep finding shortest augmenting paths and pushing their bottleneck until none remain.
        Return (total flow, final residual graph). ValueError if source or sink is not in the network or they are the same node."""
        residual = residual_graph(capacity)
        if source not in residual or sink not in residual or source == sink:
            raise ValueError("bad source or sink")
        total = 0
        while True:
            path = find_augmenting_path(residual, source, sink)
            if path is None:
                return total, residual
            amount = bottleneck(residual, path)
            augment(residual, path, amount)
            total += amount


    def max_flow(capacity, source, sink):
        """The value of the maximum flow."""
        return run_flow(capacity, source, sink)[0]


    def min_cut(capacity, source, sink):
        """Return (value, side): the cut capacity and the set of nodes reachable from the source in the final residual graph.
        By the max-flow min-cut theorem the value equals the maximum flow."""
        value, residual = run_flow(capacity, source, sink)
        side = {source}
        stack = [source]
        while stack:
            u = stack.pop()
            for v, c in residual[u].items():
                if c > 0 and v not in side:
                    side.add(v)
                    stack.append(v)
        return value, side


    def cut_edges(capacity, side):
        """The original edges (u, v) that leave `side` (u inside, v outside), as a sorted list of pairs."""
        return sorted((u, v) for u in capacity if u in side for v in capacity[u] if v not in side and capacity[u][v] > 0)

    NETWORK = {
        "s": {"a": 16, "b": 13},
        "a": {"c": 12},
        "b": {"a": 4, "d": 14},
        "c": {"b": 9, "t": 20},
        "d": {"c": 7, "t": 4},
        "t": {},
    }

    print("maximum flow:", max_flow(NETWORK, "s", "t"))
    value, side = min_cut(NETWORK, "s", "t")
    print("cut value:", value, " source side:", sorted(side))
    print("bottleneck edges:", cut_edges(NETWORK, side))
    total, residual = run_flow(NETWORK, "s", "t")
    print("route used by the first augmentation:", find_augmenting_path(residual_graph(NETWORK), "s", "t"))
  output: |
    maximum flow: 23
    cut value: 23  source side: ['a', 'b', 'd', 's']
    bottleneck edges: [('a', 'c'), ('d', 'c'), ('d', 't')]
    route used by the first augmentation: ['s', 'a', 'c', 't']
  lines:
  - line: 101
    note: Twenty-three units get through.
  - line: 103
    note: The minimum cut has the same value.
  - line: 104
    note: These edges are the real limit.
- title: Matching and disjoint paths
  intro: Assign people to jobs and count independent routes, both with the same flow engine.
  code: |
    from collections import deque


    def residual_graph(capacity):
        """Copy the network {u: {v: capacity}} and add a reverse edge with capacity 0 for every edge, so flow can be undone later.
        Every node (even one that only appears as a destination) must appear as a key of the result."""
        res = {}
        for u in capacity:
            res.setdefault(u, {})
            for v, c in capacity[u].items():
                res.setdefault(v, {})
                res[u][v] = res[u].get(v, 0) + c
                res[v].setdefault(u, 0)
        return res


    def find_augmenting_path(residual, source, sink):
        """Breadth-first search using only edges with remaining capacity above 0. Return the shortest such path as a list of nodes
        from source to sink, or None if the sink cannot be reached."""
        parent = {source: None}
        queue = deque([source])
        while queue:
            u = queue.popleft()
            if u == sink:
                break
            for v, c in residual[u].items():
                if c > 0 and v not in parent:
                    parent[v] = u
                    queue.append(v)
        if sink not in parent:
            return None
        path = []
        node = sink
        while node is not None:
            path.append(node)
            node = parent[node]
        return path[::-1]


    def bottleneck(residual, path):
        """The smallest remaining capacity along the path."""
        return min(residual[a][b] for a, b in zip(path, path[1:]))


    def augment(residual, path, amount):
        """Push `amount` units along the path: lower each forward edge by amount and raise each reverse edge by amount."""
        for a, b in zip(path, path[1:]):
            residual[a][b] -= amount
            residual[b][a] += amount


    def run_flow(capacity, source, sink):
        """Edmonds-Karp: keep finding shortest augmenting paths and pushing their bottleneck until none remain.
        Return (total flow, final residual graph). ValueError if source or sink is not in the network or they are the same node."""
        residual = residual_graph(capacity)
        if source not in residual or sink not in residual or source == sink:
            raise ValueError("bad source or sink")
        total = 0
        while True:
            path = find_augmenting_path(residual, source, sink)
            if path is None:
                return total, residual
            amount = bottleneck(residual, path)
            augment(residual, path, amount)
            total += amount


    def max_flow(capacity, source, sink):
        """The value of the maximum flow."""
        return run_flow(capacity, source, sink)[0]


    def max_matching(left, right, edges):
        """Pair up left items with right items using only the allowed (l, r) pairs in `edges`, each item used at most once, as many pairs
        as possible. Build a flow network (source -> every left item -> allowed right items -> sink, all capacities 1), run the flow,
        and read the pairs from the saturated middle edges. Return the pairs as a sorted list of (l, r)."""
        capacity = {"S": {("L", l): 1 for l in left}}
        for l in left:
            capacity[("L", l)] = {}
        for l, r in edges:
            if l in left and r in right:
                capacity[("L", l)][("R", r)] = 1
        for r in right:
            capacity[("R", r)] = {"T": 1}
        capacity["T"] = {}
        value, residual = run_flow(capacity, "S", "T")
        pairs = [(l, r) for l, r in edges if l in left and r in right and residual[("R", r)].get(("L", l), 0) == 1]
        return sorted(set(pairs))


    def edge_disjoint_paths(edges, source, sink):
        """How many paths from source to sink can be found that share no edge? Give every directed edge in `edges` (pairs) capacity 1
        and return the maximum flow. Duplicate edges count separately. 0 if the sink is unreachable."""
        capacity = {}
        for u, v in edges:
            capacity.setdefault(u, {})
            capacity.setdefault(v, {})
            capacity[u][v] = capacity[u].get(v, 0) + 1
        if source not in capacity or sink not in capacity:
            return 0
        return max_flow(capacity, source, sink)


    def flow_from_residual(capacity, residual):
        """The flow on each original edge as {(u, v): units}, keeping only edges that carry something: capacity minus what is left, never below 0."""
        flow = {}
        for u in capacity:
            for v, c in capacity[u].items():
                used = c - residual[u][v]
                if used > 0:
                    flow[(u, v)] = used
        return flow


    def is_valid_flow(capacity, flow, source, sink):
        """True when the flow {(u, v): units} (1) never exceeds an edge's capacity or goes negative, uses only real edges, and
        (2) conserves flow: at every node except source and sink, units in equal units out."""
        balance = {}
        for (u, v), f in flow.items():
            if f < 0 or v not in capacity.get(u, {}) or f > capacity[u][v]:
                return False
            balance[u] = balance.get(u, 0) - f
            balance[v] = balance.get(v, 0) + f
        return all(b == 0 for n, b in balance.items() if n not in (source, sink))

    people = ["Ava", "Ben", "Cy", "Dee"]
    jobs = ["design", "code", "test"]
    can_do = [("Ava", "design"), ("Ava", "code"), ("Ben", "code"), ("Cy", "code"), ("Cy", "test"), ("Dee", "test")]
    print("assignment:", max_matching(people, jobs, can_do))
    roads = [("home", "a"), ("home", "b"), ("a", "work"), ("b", "work"), ("a", "b")]
    print("roads that share nothing from home to work:", edge_disjoint_paths(roads, "home", "work"))
    print("is a bad flow valid?", is_valid_flow({"s": {"t": 2}, "t": {}}, {("s", "t"): 5}, "s", "t"))
  output: |
    assignment: [('Ava', 'design'), ('Ben', 'code'), ('Cy', 'test')]
    roads that share nothing from home to work: 2
    is a bad flow valid? False
