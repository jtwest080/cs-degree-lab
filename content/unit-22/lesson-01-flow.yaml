- type: code
  question: 'Write `cut_capacity(capacity, side)` returning the total capacity of the edges `(u, v)` with `u` in the set `side` and `v` not in it. `capacity` is `{u: {v: c}}`.'
  starter: |
    def cut_capacity(capacity, side):
