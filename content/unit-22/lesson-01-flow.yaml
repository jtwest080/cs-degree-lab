  tests:
  - name: residual graph
    code: |
      cap = {"s": {"a": 3, "b": 2}, "a": {"t": 2}, "b": {"t": 4}}
      before = {u: dict(v) for u, v in cap.items()}
      res = residual_graph(cap)
      assert cap == before
      assert res["s"] == {"a": 3, "b": 2} and res["a"] == {"t": 2, "s": 0} and res["t"] == {"a": 0, "b": 0}
      assert set(res) == {"s", "a", "b", "t"}
      r2 = residual_graph({"x": {"y": 5}, "y": {"x": 2}})
