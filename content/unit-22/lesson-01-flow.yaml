  tests:
  - name: cut capacity
    code: |
      cap = {"s": {"a": 3, "b": 2}, "a": {"t": 4}, "b": {"t": 1}, "t": {}}
      assert cut_capacity(cap, {"s"}) == 5
      assert cut_capacity(cap, {"s", "a", "b"}) == 5
      assert cut_capacity(cap, {"s", "a"}) == 2 + 4
      assert cut_capacity(cap, {"t"}) == 0
  solution: |
    def cut_capacity(capacity, side):
        return sum(c for u in capacity if u in side for v, c in capacity[u].items() if v not in side)
