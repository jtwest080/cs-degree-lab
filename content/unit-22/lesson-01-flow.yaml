  - name: shortest augmenting path
    code: |
      res = residual_graph({"s": {"a": 3, "b": 2}, "a": {"t": 2, "b": 1}, "b": {"t": 4}, "t": {}})
      p = find_augmenting_path(res, "s", "t")
      assert p in (["s", "a", "t"], ["s", "b", "t"]) and p[0] == "s" and p[-1] == "t" and len(p) == 3
      res["a"]["t"] = 0
      res["b"]["t"] = 0
      assert find_augmenting_path(res, "s", "t") is None
      res2 = residual_graph({"s": {"a": 1}, "a": {"b": 1}, "b": {"t": 1}, "t": {}})
      assert find_augmenting_path(res2, "s", "t") == ["s", "a", "b", "t"]
      res2["a"]["b"] = 0
      assert find_augmenting_path(res2, "s", "t") is None
  - name: bottleneck
    code: |
      res = residual_graph({"s": {"a": 5}, "a": {"b": 3}, "b": {"t": 9}, "t": {}})
      assert bottleneck(res, ["s", "a", "b", "t"]) == 3
      assert bottleneck(res, ["s", "a"]) == 5
      res["b"]["t"] = 1
      assert bottleneck(res, ["s", "a", "b", "t"]) == 1
