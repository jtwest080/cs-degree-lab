  - name: finishing order
    code: |
      assert finish_order({"a": ["b", "c"], "b": ["c"], "c": []}) == ["c", "b", "a"]
      assert finish_order({"a": ["b"], "b": ["a"]}) == ["b", "a"]
      assert finish_order({"b": [], "a": []}) == ["a", "b"]
      assert finish_order({}) == []
      g = {1: [2], 2: [3], 3: [1], 4: [3]}
      assert finish_order(g) == [3, 2, 1, 4]
