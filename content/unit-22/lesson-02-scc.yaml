- title: Weak points and a logic puzzle
  intro: Single points of failure in an office network, and a 2-SAT scheduling puzzle.
  code: |
    def find_bridges(graph):
        """Bridges of an undirected graph (each edge listed in both directions): edges whose removal disconnects part of the graph.
        Use depth-first search with discovery times `disc` and `low` (the earliest discovery time reachable from a node's subtree using at
        most one back edge). A tree edge u-v is a bridge when low[v] > disc[u]. Return sorted pairs (smaller, larger)."""
        disc, low = {}, {}
        bridges = []
        timer = [0]

        def dfs(u, parent):
            disc[u] = low[u] = timer[0]
            timer[0] += 1
            for v in sorted(graph[u]):
                if v == parent:
                    continue
                if v in disc:
                    low[u] = min(low[u], disc[v])
                else:
                    dfs(v, u)
                    low[u] = min(low[u], low[v])
                    if low[v] > disc[u]:
                        bridges.append((min(u, v), max(u, v)))

        for u in sorted(graph):
            if u not in disc:
                dfs(u, None)
        return sorted(bridges)


    def articulation_points(graph):
        """Nodes whose removal disconnects their part of the graph (cut vertices), as a sorted list. A non-root node u is one when some child
        v has low[v] >= disc[u]; the root is one when it has more than one DFS child."""
        disc, low = {}, {}
        points = set()
        timer = [0]

        def dfs(u, parent):
            disc[u] = low[u] = timer[0]
            timer[0] += 1
            children = 0
            for v in sorted(graph[u]):
                if v == parent:
                    continue
                if v in disc:
                    low[u] = min(low[u], disc[v])
                else:
                    children += 1
                    dfs(v, u)
                    low[u] = min(low[u], low[v])
                    if parent is not None and low[v] >= disc[u]:
                        points.add(u)
            if parent is None and children > 1:
                points.add(u)

        for u in sorted(graph):
            if u not in disc:
                dfs(u, None)
        return sorted(points)


    def all_nodes(graph):
        """Every node that appears as a key or as a neighbour, sorted."""
        nodes = set(graph)
        for u in graph:
            nodes.update(graph[u])
        return sorted(nodes)


    def transpose(graph):
        """The graph with every edge reversed. Every node of the input must be a key of the result."""
        rev = {u: [] for u in all_nodes(graph)}
        for u in graph:
            for v in graph[u]:
                rev[v].append(u)
        return rev


    def finish_order(graph):
        """Depth-first search from every unvisited node (trying nodes in sorted order and neighbours in sorted order).
        Return the nodes in the order they FINISH, meaning when all their neighbours have been fully explored."""
        seen = set()
        order = []

        def visit(u):
            seen.add(u)
            for v in sorted(graph.get(u, [])):
                if v not in seen:
                    visit(v)
            order.append(u)

        for u in all_nodes(graph):
            if u not in seen:
                visit(u)
        return order


    def scc_ids(graph):
        """Kosaraju's algorithm. Walk the nodes in REVERSE finish order; from each unlabelled node, flood through the TRANSPOSED graph
        (neighbours in sorted order) giving every node it reaches the same component number, then move to the next number (0, 1, 2, ...).
        Return {node: component number}. Numbers come out in topological order of the components."""
        rev = transpose(graph)
        ids = {}
        count = 0

        def collect(u):
            ids[u] = count
            for v in sorted(rev[u]):
                if v not in ids:
                    collect(v)

        for u in reversed(finish_order(graph)):
            if u not in ids:
                collect(u)
                count += 1
        return ids


    def strongly_connected_components(graph):
        """The groups of nodes that can all reach each other: a list of sorted lists, ordered by each group's smallest node."""
        groups = {}
        for node, cid in scc_ids(graph).items():
            groups.setdefault(cid, []).append(node)
        return sorted(sorted(g) for g in groups.values())


    import itertools


    def satisfies(clauses, assignment):
        """True if every clause (a, b) has at least one true literal. A literal k > 0 means variable k is True; -k means it is False.
        `assignment` is {variable: bool}."""
        def value(lit):
            return assignment[abs(lit)] if lit > 0 else not assignment[abs(lit)]
        return all(value(a) or value(b) for a, b in clauses)


    def two_sat(num_vars, clauses):
        """Solve 'every clause has two literals, (a or b)' problems. Build the implication graph (a clause (a or b) means: if not a then b,
        and if not b then a: add edges -a -> b and -b -> a; every literal from -n to n except 0 is a node). Use scc_ids. If some variable
        shares a component with its negation return None; otherwise set variable x to True exactly when ids[x] > ids[-x].
        Return {variable: bool} for variables 1..num_vars. A one-literal clause is written (a, a)."""
        graph = {}
        for x in range(1, num_vars + 1):
            graph[x] = []
            graph[-x] = []
        for a, b in clauses:
            graph[-a].append(b)
            graph[-b].append(a)
        ids = scc_ids(graph)
        for x in range(1, num_vars + 1):
            if ids[x] == ids[-x]:
                return None
        return {x: ids[x] > ids[-x] for x in range(1, num_vars + 1)}


    def brute_force_sat(num_vars, clauses):
        """Try every assignment (itertools.product) and return the first that satisfies all clauses, or None."""
        for values in itertools.product([False, True], repeat=num_vars):
            assignment = {i + 1: v for i, v in enumerate(values)}
            if satisfies(clauses, assignment):
                return assignment
        return None

    office = {"gate": ["lobby"], "lobby": ["gate", "lab", "cafe"], "lab": ["lobby", "cafe"], "cafe": ["lobby", "lab", "dock"], "dock": ["cafe"]}
    print("cables whose failure splits the office:", find_bridges(office))
    print("rooms that are single points of failure:", articulation_points(office))
    # Three friends: 1 = Ann comes, 2 = Ben comes, 3 = Cat comes.
    rules = [(1, 2), (-1, -2), (-2, 3), (-3, 1)]   # Ann or Ben; not both; if Ben then Cat; if Cat then Ann
    plan = two_sat(3, rules)
    print("a seating plan that obeys every rule:", plan)
    print("it really works:", satisfies(rules, plan))
    print("impossible rules:", two_sat(1, [(1, 1), (-1, -1)]))
  output: |
