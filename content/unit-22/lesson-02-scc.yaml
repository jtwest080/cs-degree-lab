id: u22-scc
title: Strongly Connected Components and Fragile Networks
minutes: 90
objective: Learn to find the tightly knit clusters in a directed graph, the single links and nodes whose failure splits a network, and how these ideas solve a family of logic puzzles called 2-SAT in linear time.
outcomes:
- Define strongly connected components and the condensation graph
- Run Kosaraju's two-pass algorithm
- Find bridges and articulation points with discovery and low times
- Reduce 2-SAT to strongly connected components
- Explain why these algorithms run in O(V + E)
sections:
- heading: Who can reach whom?
  body: |-
    In a directed graph, edges have a direction, so reaching B from A does not mean reaching A from B. A **strongly connected component** (SCC) is a maximal group of nodes in which *every node can reach every other* by following arrows. Think of a web of pages: a set of pages that all link, directly or indirectly, to each other and back forms a tight cluster; a page that only points outward is its own component of size one. Every node belongs to exactly one component.

    Here is the neat trick: shrink each component into a single node and keep the edges between components. The result, called the **condensation**, never contains a cycle (if it did, those components would have merged). It is a **DAG**, a directed acyclic graph, so you can order it from "upstream" to "downstream" with a topological order. This turns a messy tangled graph into a clean picture of layers. For example, in a program's dependency graph, an SCC of size above one is a group of modules that depend on each other circularly, a sign of design trouble.

    A useful question: what is the smallest set of nodes from which everything is reachable? Answer: one node from each component that has no edges coming in from other components.
- heading: Kosaraju's algorithm
  body: |-
    How do we find the components fast? **Kosaraju's algorithm** uses depth-first search twice. First, run DFS over the whole graph, noting each node's **finish time** (when DFS has completely explored it, in the order nodes are *completed*). The node that finishes last lies in a component that has no incoming edges from the others: it is a "source" component. Second, build the **transpose** (the same graph with every arrow reversed). Take the nodes in *reverse* finish order, and from each node not yet assigned, run a DFS on the transposed graph. Everything it reaches is one component. Why does it work? In the reversed graph, arrows between components point backwards, so a search starting in a source component of the original cannot escape into other components, and sweeps up exactly its own. Each search finishes one component, and the numbers assigned come out in topological order.

    Both passes visit every node and edge once, so the total time is `O(V + E)`, as fast as just reading the graph. (Tarjan's algorithm achieves the same with one pass using a stack and the `low` idea you are about to meet.)
- heading: Fragile points, and 2-SAT
  body: |-
    For *undirected* graphs the question is different: which single edge or node, if it fails, splits the network? A **bridge** is an edge whose removal disconnects the graph (a lone cable); an **articulation point** (or **cut vertex**) is a node whose removal does (a single router). These are a network's single points of failure. To find them, run a DFS and give each node a **discovery time** `disc` (the order in which DFS first reaches it) and a **low value** `low`: the earliest discovery time you can reach from that node's subtree using tree edges plus at most one **back edge** (an edge to an already-visited ancestor). If a child's `low` is still greater than the parent's discovery time, nothing in the child's subtree can bypass the parent edge, so that edge is a bridge. The same comparison with `>=` identifies articulation points, with a special rule for the DFS root. Again `O(V + E)`.

    Finally, a surprise: **2-SAT**. You have yes/no variables and rules of the form "A or B" (a **clause**), such as "Ann comes or Ben comes" and "not both Ann and Ben come". Can all rules hold at once? Each clause "A or B" means: if A is false then B must be true, and if B is false then A must be true. Draw an edge for each such **implication**, one node per variable and one per its negation. The rules are contradictory exactly when some variable and its negation lie in the *same* strongly connected component (each forces the other). Otherwise a valid answer exists and the component order tells you how to choose. So 2-SAT is solved in linear time, while the similar-looking 3-SAT (clauses with three options) is NP-complete, which you will study soon.
examples:
- title: Components of a graph
  intro: 'A small web graph: its strongly connected components, the condensed graph and the smallest set of starting nodes.'
  code: |
    def all_nodes(graph):
        """Every node that appears as a key or as a neighbour, sorted."""
        nodes = set(graph)
        for u in graph:
            nodes.update(graph[u])
        return sorted(nodes)


    def transpose(graph):
        """The graph with every edge reversed. Every node of the input must be a key of the result."""
        rev = {u: [] for u in all_nodes(graph)}
        for u in graph:
            for v in graph[u]:
                rev[v].append(u)
        return rev


    def finish_order(graph):
        """Depth-first search from every unvisited node (trying nodes in sorted order and neighbours in sorted order).
        Return the nodes in the order they FINISH, meaning when all their neighbours have been fully explored."""
        seen = set()
        order = []

        def visit(u):
            seen.add(u)
            for v in sorted(graph.get(u, [])):
                if v not in seen:
                    visit(v)
            order.append(u)

        for u in all_nodes(graph):
            if u not in seen:
                visit(u)
        return order


    def scc_ids(graph):
        """Kosaraju's algorithm. Walk the nodes in REVERSE finish order; from each unlabelled node, flood through the TRANSPOSED graph
        (neighbours in sorted order) giving every node it reaches the same component number, then move to the next number (0, 1, 2, ...).
        Return {node: component number}. Numbers come out in topological order of the components."""
        rev = transpose(graph)
        ids = {}
        count = 0

        def collect(u):
            ids[u] = count
            for v in sorted(rev[u]):
                if v not in ids:
                    collect(v)

        for u in reversed(finish_order(graph)):
            if u not in ids:
                collect(u)
                count += 1
        return ids


    def strongly_connected_components(graph):
        """The groups of nodes that can all reach each other: a list of sorted lists, ordered by each group's smallest node."""
        groups = {}
        for node, cid in scc_ids(graph).items():
            groups.setdefault(cid, []).append(node)
        return sorted(sorted(g) for g in groups.values())


    def condensation(graph):
        """Shrink every strongly connected component to one node. Return (ids, edges): ids as from scc_ids, and edges as a sorted list of
        pairs (a, b) of DIFFERENT component numbers where some original edge goes from component a to component b (no duplicates)."""
        ids = scc_ids(graph)
        edges = sorted({(ids[u], ids[v]) for u in graph for v in graph[u] if ids[u] != ids[v]})
        return ids, edges


    def min_start_nodes(graph):
        """The fewest nodes from which everything can be reached: one node from every component that has no edge coming in from another
        component. Choose the smallest node of each such component. Return them as a sorted list."""
        ids, edges = condensation(graph)
        has_incoming = {b for a, b in edges}
        best = {}
        for node, cid in ids.items():
            if cid not in has_incoming and (cid not in best or node < best[cid]):
                best[cid] = node
        return sorted(best.values())
    web = {"a": ["b"], "b": ["c", "e", "f"], "c": ["d", "g"], "d": ["c", "h"], "e": ["a", "f"], "f": ["g"], "g": ["f", "h"], "h": ["h"]}

    print("components:", strongly_connected_components(web))
    ids, edges = condensation(web)
    print("edges between components:", edges)
    print("fewest places to start so everything can be reached:", min_start_nodes(web))
  output: |
    components: [['a', 'b', 'e'], ['c', 'd'], ['f', 'g'], ['h']]
    edges between components: [(0, 1), (0, 2), (1, 2), (1, 3), (2, 3)]
    fewest places to start so everything can be reached: ['a']
