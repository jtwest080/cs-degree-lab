    import itertools


    def satisfies(clauses, assignment):
        """True if every clause (a, b) has at least one true literal. A literal k > 0 means variable k is True; -k means it is False.
        `assignment` is {variable: bool}."""
        def value(lit):
            return assignment[abs(lit)] if lit > 0 else not assignment[abs(lit)]
        return all(value(a) or value(b) for a, b in clauses)


    def two_sat(num_vars, clauses):
        """Solve 'every clause has two literals, (a or b)' problems. Build the implication graph (a clause (a or b) means: if not a then b,
        and if not b then a: add edges -a -> b and -b -> a; every literal from -n to n except 0 is a node). Use scc_ids. If some variable
        shares a component with its negation return None; otherwise set variable x to True exactly when ids[x] > ids[-x].
        Return {variable: bool} for variables 1..num_vars. A one-literal clause is written (a, a)."""
        graph = {}
        for x in range(1, num_vars + 1):
            graph[x] = []
            graph[-x] = []
        for a, b in clauses:
            graph[-a].append(b)
            graph[-b].append(a)
        ids = scc_ids(graph)
        for x in range(1, num_vars + 1):
            if ids[x] == ids[-x]:
                return None
        return {x: ids[x] > ids[-x] for x in range(1, num_vars + 1)}


    def brute_force_sat(num_vars, clauses):
        """Try every assignment (itertools.product) and return the first that satisfies all clauses, or None."""
        for values in itertools.product([False, True], repeat=num_vars):
            assignment = {i + 1: v for i, v in enumerate(values)}
            if satisfies(clauses, assignment):
                return assignment
        return None
  explanation: 2-SAT is solved in linear time by strongly connected components, even though 3-SAT is believed to be hard.
commonMistakes:
- title: Using Kosaraju on the graph instead of its transpose in the second pass
  explanation: Searching the original graph would leak into other components.
- title: Processing nodes in finish order instead of reverse finish order
  explanation: The last node to finish must be processed first.
- title: Treating undirected edges as one direction
  explanation: List each undirected edge in both directions.
- title: Counting the parent edge as a back edge
  explanation: Skip the edge back to the parent when computing low values.
- title: Forgetting the root rule for articulation points
  explanation: The DFS root is a cut vertex only if it has two or more DFS children.
summary:
- A strongly connected component is a maximal set of mutually reachable nodes.
- Shrinking components gives an acyclic condensation graph.
- 'Kosaraju''s algorithm: DFS finish order, then DFS on the transpose in reverse order, in O(V + E).'
- Bridges and articulation points come from discovery and low times.
- 2-SAT is solved by checking whether a variable and its negation share a component.
