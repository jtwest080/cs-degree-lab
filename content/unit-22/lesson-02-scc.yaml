    def find_bridges(graph):
        """Bridges of an undirected graph (each edge listed in both directions): edges whose removal disconnects part of the graph.
        Use depth-first search with discovery times `disc` and `low` (the earliest discovery time reachable from a node's subtree using at
        most one back edge). A tree edge u-v is a bridge when low[v] > disc[u]. Return sorted pairs (smaller, larger)."""
        disc, low = {}, {}
        bridges = []
        timer = [0]

        def dfs(u, parent):
            disc[u] = low[u] = timer[0]
            timer[0] += 1
            for v in sorted(graph[u]):
                if v == parent:
                    continue
                if v in disc:
                    low[u] = min(low[u], disc[v])
                else:
                    dfs(v, u)
                    low[u] = min(low[u], low[v])
                    if low[v] > disc[u]:
                        bridges.append((min(u, v), max(u, v)))

        for u in sorted(graph):
            if u not in disc:
                dfs(u, None)
        return sorted(bridges)


    def articulation_points(graph):
        """Nodes whose removal disconnects their part of the graph (cut vertices), as a sorted list. A non-root node u is one when some child
        v has low[v] >= disc[u]; the root is one when it has more than one DFS child."""
        disc, low = {}, {}
        points = set()
        timer = [0]

        def dfs(u, parent):
            disc[u] = low[u] = timer[0]
            timer[0] += 1
            children = 0
            for v in sorted(graph[u]):
                if v == parent:
                    continue
                if v in disc:
                    low[u] = min(low[u], disc[v])
                else:
                    children += 1
                    dfs(v, u)
                    low[u] = min(low[u], low[v])
                    if parent is not None and low[v] >= disc[u]:
                        points.add(u)
            if parent is None and children > 1:
                points.add(u)

        for u in sorted(graph):
            if u not in disc:
                dfs(u, None)
        return sorted(points)
  explanation: Bridges and cut vertices show the single points of failure of a network.
