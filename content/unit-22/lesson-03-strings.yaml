id: u22-strings
title: String Algorithms
minutes: 90
objective: 'Learn how search engines, text editors and DNA analysers find patterns in huge texts: faster-than-naive matching with the prefix function and Z-function, hashing a sliding window, tries for autocomplete, and suffix arrays for answering substring questions.'
outcomes:
- Explain why naive matching can be slow
- Compute the prefix function and use it for KMP matching
- Compute the Z-function
- Use rolling hashes and handle collisions
- Build a trie and a suffix array
sections:
- heading: Finding a pattern quickly
  body: |-
    Searching for a **pattern** (a short string) inside a **text** (a long one) is one of the most common jobs in computing: Find in a browser, grep in a terminal, spell checkers, DNA analysis. The naive method tries each starting position and compares characters one by one. It is fine usually, but in the worst case (text `aaaa...a`, pattern `aaaa...ab`) it does about `n * m` comparisons (`n` text length, `m` pattern length), too slow for a genome with billions of letters.

    The key observation: when a comparison fails after matching several characters, we have *learned* something about the text, and the naive method throws that away. The **Knuth-Morris-Pratt (KMP)** algorithm keeps it. It first studies the pattern alone, computing the **prefix function**: for every position `i`, the length of the longest **proper prefix** of `pattern[:i+1]` that is also a **suffix** of it (a proper prefix is shorter than the whole string; a suffix is an ending piece). For `ABABCABAB` that is `0 0 1 2 0 1 2 3 4`. When a mismatch happens after matching `k` characters, we need not start over: we know the last `pi[k-1]` matched characters are also the *beginning* of the pattern, so we slide the pattern forward and continue from there. The text pointer never moves backwards, so the whole search is `O(n + m)`.

    The **Z-function** is a close cousin: `z[i]` is the length of the longest string that starts at position `i` and also matches the *start* of the string. It can search too (compute it for `pattern + separator + text`) and answers questions like the shortest repeating block of a string.
- heading: Hashing and tries
  body: |-
    Another approach is **Rabin-Karp**: compute a number (a **hash**) from each window of the text and compare it with the pattern's hash; only compare real letters when the numbers match. The trick is the **rolling hash**: treat a window as a number in base 256 (each letter's code is a digit), kept small by taking the remainder mod a large prime. To slide the window by one letter, subtract the outgoing letter's contribution, shift everything by multiplying by the base and add the incoming letter, all in constant time. Hashes of different strings can accidentally be equal (a **collision**), so a match must always be confirmed by direct comparison. The method really shines when searching for many patterns at once, or for repeated blocks (plagiarism detection, duplicate files).

    A **trie** (say "try", from re*trie*val) stores a *set of words* so prefix questions are fast. It is a tree where each edge is a letter; walking from the root spells a prefix, and a marker says "a word ends here". Looking up a word of length `L` takes `O(L)` no matter how many words are stored, and *autocomplete* is just: walk to the node for the prefix, then list everything beneath it. Search suggestions, phone keyboards and IP routing tables all use tries.
- heading: Suffix arrays
  body: |-
    A **suffix** is the end of a string from some position onward; `banana` has the suffixes `banana`, `anana`, `nana`, `ana`, `na` and `a`. The **suffix array** is the list of their starting positions, ordered by the alphabetical order of the suffixes themselves: `5 3 1 0 4 2` for `banana` (`a`, `ana`, `anana`, `banana`, `na`, `nana`). Why is this order so useful? Every substring is a *prefix of some suffix*, and in sorted order the suffixes that start with the same text sit next to each other. To find a pattern, binary search the array.

    Add the **LCP array** (longest common prefix of each pair of neighbouring suffixes). Then the longest substring that occurs twice is just the largest LCP value, and the number of different substrings is `n(n+1)/2` minus the sum of the LCP values, because the LCP counts exactly the repeats. **Kasai's algorithm** builds the LCP array in linear time using the fact that when you move from suffix `i` to suffix `i + 1`, the matching length drops by at most one. (Real libraries build the suffix array itself in `O(n log n)` or linear time rather than sorting slices as we do for clarity.) Suffix arrays power genome indexing and are the idea behind the Burrows-Wheeler transform in compression.
examples:
- title: Matching without going backwards
  intro: The prefix function, KMP search, the Z-function and repeating blocks.
  code: |
    def prefix_function(s):
        """pi[i] = the length of the longest proper prefix of s[:i + 1] that is also a suffix of it ('proper' means shorter than the whole thing).
        Computed in O(n): keep a running length k and, on a mismatch, fall back with k = pi[k - 1]."""
        pi = [0] * len(s)
        k = 0
        for i in range(1, len(s)):
            while k > 0 and s[i] != s[k]:
                k = pi[k - 1]
            if s[i] == s[k]:
                k += 1
            pi[i] = k
        return pi


    def kmp_search(text, pattern):
        """The start index of every occurrence of pattern in text (overlapping ones included), in O(len(text) + len(pattern)).
        Run the same fall-back idea over the text. ValueError for an empty pattern."""
        if not pattern:
            raise ValueError("empty pattern")
        pi = prefix_function(pattern)
        found = []
        k = 0
        for i, ch in enumerate(text):
            while k > 0 and (k == len(pattern) or ch != pattern[k]):
                k = pi[k - 1]
            if ch == pattern[k]:
                k += 1
            if k == len(pattern):
                found.append(i - k + 1)
        return found


    def z_function(s):
        """z[i] = how many characters from position i match the start of s (z[0] is len(s)). Keep the rightmost matching window [l, r)
        and reuse earlier answers inside it so the whole thing is O(n)."""
        n = len(s)
        z = [0] * n
        if n:
            z[0] = n
        l = r = 0
        for i in range(1, n):
            if i < r:
                z[i] = min(r - i, z[i - l])
            while i + z[i] < n and s[z[i]] == s[i + z[i]]:
                z[i] += 1
            if i + z[i] > r:
                l, r = i, i + z[i]
        return z


    def count_occurrences(text, pattern):
        """How many times pattern occurs in text (overlaps allowed): compute the Z-function of pattern + a separator character
        that appears in neither (use chr(0)) + text, and count positions after the separator whose value equals len(pattern).
        ValueError for an empty pattern."""
        if not pattern:
            raise ValueError("empty pattern")
        z = z_function(pattern + chr(0) + text)
        return sum(1 for v in z[len(pattern) + 1:] if v == len(pattern))


    def smallest_period(s):
        """The length of the shortest block that, repeated, builds s exactly (s itself if there is none). Use the prefix function:
        p = len(s) - pi[-1]; the answer is p if p divides len(s), otherwise len(s). Empty string: 0."""
        n = len(s)
        if n == 0:
            return 0
        p = n - prefix_function(s)[-1]
        return p if n % p == 0 else n

    dna = "GATTACAGATTACA"
    print("prefix function of ABABCABAB:", prefix_function("ABABCABAB"))
    print("GATTACA found at:", kmp_search(dna, "GATTACA"))
    print("overlapping 'ana' in banana:", kmp_search("banana", "ana"))
    print("Z-function of aabxaab:", z_function("aabxaab"))
    print("smallest repeating block of abcabcabc:", smallest_period("abcabcabc"))
  output: |
    prefix function of ABABCABAB: [0, 0, 1, 2, 0, 1, 2, 3, 4]
    GATTACA found at: [0, 7]
    overlapping 'ana' in banana: [1, 3]
    Z-function of aabxaab: [7, 1, 0, 0, 3, 1, 0]
    smallest repeating block of abcabcabc: 3
  lines:
  - line: 71
    note: Overlap lengths of the pattern with itself.
  - line: 73
    note: Both occurrences are found, even overlapping.
- title: Tries and suffix arrays
  intro: Autocomplete from a trie, and substring facts about 'mississippi' from its suffix array.
  code: |
    END = "$"


    def trie_insert(root, word):
        """Add word to the trie: a nested dictionary where each key is a letter and the special key "$" marks the end of a word."""
        node = root
        for ch in word:
            node = node.setdefault(ch, {})
        node[END] = True


    def trie_find(root, prefix):
        """The node reached by following prefix, or None if some letter is missing."""
        node = root
        for ch in prefix:
            if ch not in node:
                return None
            node = node[ch]
        return node


    def trie_contains(root, word):
        """True only if word itself was inserted (not just a longer word that starts with it)."""
        node = trie_find(root, word)
        return node is not None and END in node


    def trie_words(root, prefix="", limit=None):
        """All inserted words that start with prefix, in alphabetical order; at most `limit` of them when limit is not None."""
        start = trie_find(root, prefix)
        if start is None:
            return []
        found = []

        def walk(node, so_far):
            if limit is not None and len(found) >= limit:
                return
            if END in node:
                found.append(so_far)
            for ch in sorted(k for k in node if k != END):
                walk(node[ch], so_far + ch)

        walk(start, prefix)
        return found[:limit] if limit is not None else found


    def autocomplete(words, prefix, limit=5):
        """Build a trie from words and return up to `limit` words that start with prefix, alphabetically."""
        root = {}
        for w in words:
            trie_insert(root, w)
        return trie_words(root, prefix, limit)


    def suffix_array(s):
        """The starting positions of all suffixes of s, sorted so that the suffixes themselves are in alphabetical order."""
        return sorted(range(len(s)), key=lambda i: s[i:])


    def lcp_array(s, sa):
        """Kasai's algorithm. lcp[k] = the length of the longest common prefix of the suffixes starting at sa[k] and sa[k + 1]
        (so the list has len(s) - 1 entries, or none for a string shorter than 2). Build rank[i] = position of suffix i in sa, then visit
        suffixes in text order, keeping a running match length h that drops by at most 1 each step, which makes it O(n)."""
        n = len(s)
        rank = [0] * n
        for position, start in enumerate(sa):
            rank[start] = position
        lcp = [0] * max(n - 1, 0)
        h = 0
        for i in range(n):
            if rank[i] > 0:
                j = sa[rank[i] - 1]
                while i + h < n and j + h < n and s[i + h] == s[j + h]:
                    h += 1
                lcp[rank[i] - 1] = h
                if h > 0:
                    h -= 1
            else:
                h = 0
        return lcp


    def longest_repeated_substring(s):
        """The longest substring that occurs at least twice (overlaps allowed), taken at the first largest lcp value in suffix order;
        empty string if nothing repeats."""
        sa = suffix_array(s)
        lcp = lcp_array(s, sa)
        if not lcp or max(lcp) == 0:
            return ""
        k = lcp.index(max(lcp))
        return s[sa[k]:sa[k] + lcp[k]]


    def count_distinct_substrings(s):
        """The number of different non-empty substrings: all n(n + 1) / 2 substrings minus the repeats counted by the lcp array."""
        n = len(s)
        return n * (n + 1) // 2 - sum(lcp_array(s, suffix_array(s)))

    dictionary = ["tea", "ted", "ten", "to", "inn", "in", "i", "teapot"]
    print("words starting with te:", autocomplete(dictionary, "te", 10))
    print("first two starting with t:", autocomplete(dictionary, "t", 2))
    text = "mississippi"
    sa = suffix_array(text)
    print("suffix array of mississippi:", sa)
    print("sorted suffixes:", [text[i:] for i in sa][:4], "...")
    print("longest repeated part:", longest_repeated_substring(text))
    print("different substrings:", count_distinct_substrings(text))
  output: |
    words starting with te: ['tea', 'teapot', 'ted', 'ten']
    first two starting with t: ['tea', 'teapot']
    suffix array of mississippi: [10, 7, 4, 1, 0, 9, 8, 6, 3, 5, 2]
    sorted suffixes: ['i', 'ippi', 'issippi', 'ississippi'] ...
    longest repeated part: issi
    different substrings: 53
  lines:
  - line: 100
    note: The trie lists them alphabetically.
  - line: 104
    note: Positions of the sorted suffixes.
  - line: 107
    note: Counted from the LCP array.
