  explanation: KMP never moves backwards in the text.
- id: z
  title: The Z-function
  difficulty: 4
  prompt: 'The starter has `prefix_function`. Write `z_function(s)`: `z[i]` is how many characters starting at position `i` match the beginning of `s` (`z[0]` is `len(s)`; use `[]` for an empty string). Keep the rightmost matching window `[l, r)`; for each `i`, if `i < r` start with `min(r - i, z[i - l])`, then extend by comparing characters, and update the window. Write `count_occurrences(text, pattern)` using `z_function(pattern + chr(0) + text)` and counting the positions after the separator whose value equals `len(pattern)` (`ValueError` for an empty pattern). Write `smallest_period(s)`: with `p = len(s) - pi[-1]`, the answer is `p` if `p` divides `len(s)` and `len(s)` otherwise (0 for the empty string).'
