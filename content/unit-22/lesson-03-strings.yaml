      assert suffix_array("") == [] and lcp_array("", []) == []
      assert suffix_array("a") == [0] and lcp_array("a", [0]) == []
      assert longest_repeated_substring("abcd") == ""
      assert longest_repeated_substring("") == ""
      assert longest_repeated_substring("aaaa") == "aaa"
      assert count_distinct_substrings("aaa") == 3
      assert count_distinct_substrings("abc") == 6
      assert count_distinct_substrings("") == 0
  - name: agrees with brute force
    code: |
      import random
      rng = random.Random(8)
      for _ in range(150):
          s = "".join(rng.choice("abc") for _ in range(rng.randrange(0, 15)))
          subs = {s[i:j] for i in range(len(s)) for j in range(i + 1, len(s) + 1)}
          assert count_distinct_substrings(s) == len(subs), s
          best = max((len(t) for t in subs if sum(1 for i in range(len(s) - len(t) + 1) if s[i:i + len(t)] == t) > 1), default=0)
          assert len(longest_repeated_substring(s)) == best, s
