        that appears in neither (use chr(0)) + text, and count positions after the separator whose value equals len(pattern).
        ValueError for an empty pattern."""
        pass


    def smallest_period(s):
        """The length of the shortest block that, repeated, builds s exactly (s itself if there is none). Use the prefix function:
        p = len(s) - pi[-1]; the answer is p if p divides len(s), otherwise len(s). Empty string: 0."""
        pass
  tests:
  - name: z values
    code: |
      assert z_function("aabxaab") == [7, 1, 0, 0, 3, 1, 0]
      assert z_function("aaaa") == [4, 3, 2, 1]
      assert z_function("abc") == [3, 0, 0]
      assert z_function("") == []
      assert z_function("a") == [1]
  - name: counting
    code: |
      assert count_occurrences("abracadabra", "abra") == 2
      assert count_occurrences("aaaaa", "aa") == 4
      assert count_occurrences("hello", "z") == 0
      assert count_occurrences("", "a") == 0
      try:
          count_occurrences("abc", "")
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: repeating blocks
    code: |
      assert smallest_period("abcabcabc") == 3
      assert smallest_period("aaaa") == 1
      assert smallest_period("abcab") == 5
      assert smallest_period("abab") == 2
      assert smallest_period("x") == 1
      assert smallest_period("") == 0
  hints:
  - The same helper trick works with a separator character that cannot appear in the text.
  solution: |
    def prefix_function(s):
        """pi[i] = the length of the longest proper prefix of s[:i + 1] that is also a suffix of it ('proper' means shorter than the whole thing).
        Computed in O(n): keep a running length k and, on a mismatch, fall back with k = pi[k - 1]."""
        pi = [0] * len(s)
        k = 0
        for i in range(1, len(s)):
            while k > 0 and s[i] != s[k]:
                k = pi[k - 1]
            if s[i] == s[k]:
                k += 1
            pi[i] = k
        return pi


    def kmp_search(text, pattern):
        """The start index of every occurrence of pattern in text (overlapping ones included), in O(len(text) + len(pattern)).
        Run the same fall-back idea over the text. ValueError for an empty pattern."""
        if not pattern:
            raise ValueError("empty pattern")
        pi = prefix_function(pattern)
        found = []
        k = 0
        for i, ch in enumerate(text):
            while k > 0 and (k == len(pattern) or ch != pattern[k]):
                k = pi[k - 1]
            if ch == pattern[k]:
                k += 1
            if k == len(pattern):
                found.append(i - k + 1)
        return found


    def z_function(s):
        """z[i] = how many characters from position i match the start of s (z[0] is len(s)). Keep the rightmost matching window [l, r)
        and reuse earlier answers inside it so the whole thing is O(n)."""
        n = len(s)
        z = [0] * n
        if n:
            z[0] = n
        l = r = 0
        for i in range(1, n):
            if i < r:
                z[i] = min(r - i, z[i - l])
            while i + z[i] < n and s[z[i]] == s[i + z[i]]:
                z[i] += 1
            if i + z[i] > r:
                l, r = i, i + z[i]
        return z


    def count_occurrences(text, pattern):
        """How many times pattern occurs in text (overlaps allowed): compute the Z-function of pattern + a separator character
        that appears in neither (use chr(0)) + text, and count positions after the separator whose value equals len(pattern).
        ValueError for an empty pattern."""
        if not pattern:
            raise ValueError("empty pattern")
        z = z_function(pattern + chr(0) + text)
        return sum(1 for v in z[len(pattern) + 1:] if v == len(pattern))


    def smallest_period(s):
        """The length of the shortest block that, repeated, builds s exactly (s itself if there is none). Use the prefix function:
        p = len(s) - pi[-1]; the answer is p if p divides len(s), otherwise len(s). Empty string: 0."""
        n = len(s)
        if n == 0:
            return 0
        p = n - prefix_function(s)[-1]
        return p if n % p == 0 else n
  explanation: Both the prefix function and the Z-function describe how a string overlaps itself.
- id: rabin-karp
  title: Rolling hashes and Rabin-Karp
  difficulty: 4
  prompt: 'Write `rolling_hashes(s, k, base=256, mod=1_000_000_007)`: the hash of every window of `k` characters, in order, in one pass. The hash of a window is `((c0 * base + c1) * base + c2) ...` (using `ord` for each character) modulo `mod`. Slide it with `h = ((h - ord(old) * top) * base + ord(new)) % mod` where `top = pow(base, k - 1, mod)`. Return `[]` if `k < 1` or `k > len(s)`. Write `rabin_karp(text, pattern)`: compare the pattern''s hash with every window''s hash and confirm each hash match with a real string comparison; return all start indexes (`ValueError` for an empty pattern).'
  starter: |-
    def rolling_hashes(s, k, base=256, mod=1_000_000_007):
        """The hash of every window of k characters, in order, in O(len(s)) total: hash = (sum of ord(c) * base^position) written as
        ((c0 * base + c1) * base + c2) ... mod `mod`. Slide by removing the oldest character's contribution and adding the new one.
        An empty list if k < 1 or k > len(s)."""
        pass


    def rabin_karp(text, pattern):
        """Every start index where pattern occurs: compare the pattern's hash with each window's hash, and only when they match
        confirm with a real string comparison (hashes can collide). ValueError for an empty pattern."""
        pass
  tests:
  - name: hashes
    code: |
      def direct(s, k, base=256, mod=1_000_000_007):
          out = []
          for i in range(len(s) - k + 1):
              h = 0
              for ch in s[i:i + k]:
                  h = (h * base + ord(ch)) % mod
              out.append(h)
          return out
      for s, k in (("abcdefgh", 3), ("zzzzzz", 2), ("hello world", 5), ("ab", 2)):
          assert rolling_hashes(s, k) == direct(s, k)
      assert rolling_hashes("abc", 0) == [] and rolling_hashes("abc", 4) == []
      a = rolling_hashes("xabcx", 3)
      assert a[1] == rolling_hashes("abc", 3)[0]
      assert rolling_hashes("abab", 2)[0] == rolling_hashes("abab", 2)[2]
  - name: search
    code: |
      assert rabin_karp("abracadabra", "abra") == [0, 7]
      assert rabin_karp("aaaaa", "aa") == [0, 1, 2, 3]
      assert rabin_karp("abc", "abcd") == []
      assert rabin_karp("", "a") == []
      big = ("ab" * 500) + "c"
      assert rabin_karp(big, "bac") == [] and rabin_karp(big, "abc") == [998]
      try:
          rabin_karp("abc", "")
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: a collision is caught
    code: |
      text = "abcdef"
      assert rabin_karp(text, "cde") == [2]
      assert rabin_karp(text, "cdf") == []
      small = rolling_hashes("abcdefghij", 2, 256, 7)
      assert len(small) == 9 and len(set(small)) < 9
      assert rabin_karp("ab" * 3, "ba") == [1, 3]
  hints:
  - Subtract the old character's contribution before shifting and adding the new one.
  solution: |
    def rolling_hashes(s, k, base=256, mod=1_000_000_007):
        """The hash of every window of k characters, in order, in O(len(s)) total: hash = (sum of ord(c) * base^position) written as
        ((c0 * base + c1) * base + c2) ... mod `mod`. Slide by removing the oldest character's contribution and adding the new one.
        An empty list if k < 1 or k > len(s)."""
        if k < 1 or k > len(s):
            return []
        h = 0
        for ch in s[:k]:
            h = (h * base + ord(ch)) % mod
        hashes = [h]
        top = pow(base, k - 1, mod)
        for i in range(k, len(s)):
            h = ((h - ord(s[i - k]) * top) * base + ord(s[i])) % mod
            hashes.append(h)
        return hashes


    def rabin_karp(text, pattern):
        """Every start index where pattern occurs: compare the pattern's hash with each window's hash, and only when they match
        confirm with a real string comparison (hashes can collide). ValueError for an empty pattern."""
        if not pattern:
            raise ValueError("empty pattern")
        k = len(pattern)
        target = rolling_hashes(pattern, k)[0]
        return [i for i, h in enumerate(rolling_hashes(text, k)) if h == target and text[i:i + k] == pattern]
  explanation: Rolling hashes let you compare a window in O(1); real comparison guards against collisions.
