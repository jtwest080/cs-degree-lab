                k += 1
            pi[i] = k
        return pi


    def kmp_search(text, pattern):
        """The start index of every occurrence of pattern in text (overlapping ones included), in O(len(text) + len(pattern)).
        Run the same fall-back idea over the text. ValueError for an empty pattern."""
