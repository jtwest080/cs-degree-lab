          trie_insert(root, w)
      assert trie_words(root, "ca") == ["cab", "car", "card", "care", "cat"]
      assert trie_words(root, "car") == ["car", "card", "care"]
      assert trie_words(root, "ca", 2) == ["cab", "car"]
      assert trie_words(root, "z") == []
      assert trie_words(root) == ["cab", "car", "card", "care", "cat", "dog"]
