    print(text.count('aa'), text.find('aaab'))
exercises:
- id: kmp
  title: Prefix function and KMP search
  difficulty: 4
  prompt: 'Write `prefix_function(s)`: `pi[i]` is the length of the longest **proper** prefix of `s[:i + 1]` that is also a suffix of it. Use a running length `k`; for each `i` from 1, while `k > 0` and `s[i] != s[k]` set `k = pi[k - 1]`; if `s[i] == s[k]` add 1 to `k`; store `pi[i] = k`. Write `kmp_search(text, pattern)`: the start index of **every** occurrence (overlaps included), using the same fall-back loop over the text (also fall back when `k == len(pattern)` after a full match). `ValueError` for an empty pattern.'
  starter: |-
    def prefix_function(s):
        """pi[i] = the length of the longest proper prefix of s[:i + 1] that is also a suffix of it ('proper' means shorter than the whole thing).
        Computed in O(n): keep a running length k and, on a mismatch, fall back with k = pi[k - 1]."""
        pass


    def kmp_search(text, pattern):
        """The start index of every occurrence of pattern in text (overlapping ones included), in O(len(text) + len(pattern)).
        Run the same fall-back idea over the text. ValueError for an empty pattern."""
        pass
  tests:
  - name: prefix function
    code: |
      assert prefix_function("abcabcd") == [0, 0, 0, 1, 2, 3, 0]
      assert prefix_function("aaaa") == [0, 1, 2, 3]
      assert prefix_function("abab") == [0, 0, 1, 2]
      assert prefix_function("a") == [0]
      assert prefix_function("") == []
      assert prefix_function("aabaaab") == [0, 1, 0, 1, 2, 2, 3]
  - name: search
    code: |
      assert kmp_search("abracadabra", "abra") == [0, 7]
      assert kmp_search("aaaaa", "aa") == [0, 1, 2, 3]
      assert kmp_search("hello world", "xyz") == []
      assert kmp_search("abc", "abcd") == []
      assert kmp_search("abc", "abc") == [0]
      assert kmp_search("", "a") == []
      assert kmp_search("ababababab", "abab") == [0, 2, 4, 6]
      try:
          kmp_search("abc", "")
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: agrees with the simple method
    code: |
      import random
      rng = random.Random(3)
      for _ in range(200):
          text = "".join(rng.choice("ab") for _ in range(rng.randrange(0, 25)))
          pat = "".join(rng.choice("ab") for _ in range(rng.randrange(1, 5)))
          naive = [i for i in range(len(text) - len(pat) + 1) if text[i:i + len(pat)] == pat]
          assert kmp_search(text, pat) == naive, (text, pat)
  hints:
  - When you fall back, you reuse what you already know about the pattern's own prefixes.
  solution: |
