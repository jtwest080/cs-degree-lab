- title: Rechecking characters after a mismatch
  explanation: That is the naive method; KMP uses the prefix function to skip ahead.
- title: Trusting a hash match without checking
  explanation: Different strings can share a hash; confirm with a real comparison.
- title: Marking word ends incorrectly in a trie
  explanation: Without an end marker 'car' would look present just because 'card' was inserted.
- title: Forgetting overlapping matches
  explanation: In 'aaaa' the pattern 'aa' occurs three times.
- title: Confusing prefix and suffix
  explanation: A prefix starts at the beginning; a suffix ends at the end.
summary:
- Naive matching can take n times m steps; KMP takes n plus m.
- The prefix function and the Z-function measure how a string overlaps itself.
- Rolling hashes compare windows in constant time; confirm matches to avoid collisions.
- A trie answers prefix questions in time proportional to the prefix length.
- Suffix arrays with LCP values answer many substring questions.
