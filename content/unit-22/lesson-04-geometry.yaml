  solution: |
    def max_overlap(intervals):
        """The largest number of half-open intervals [start, end) that cover one moment. Sweep: make an event (time, +1) for every start and
        (time, -1) for every end, sort (so at equal times an end comes before a start), and track the running total."""
        events = []
        for start, end in intervals:
            events.append((start, 1))
            events.append((end, -1))
        events.sort()
        best = current = 0
        for _, change in events:
            current += change
            best = max(best, current)
        return best


    def union_length(intervals):
        """The total length covered by at least one interval [start, end]: sort, then merge overlapping or touching ones."""
        total = 0
        last_end = None
        for start, end in sorted(intervals):
            if last_end is None or start > last_end:
                total += end - start
                last_end = end
            elif end > last_end:
                total += end - last_end
                last_end = end
        return total


    def rectangle_union_area(rects):
        """The area covered by at least one axis-aligned rectangle (x1, y1, x2, y2) with x1 < x2 and y1 < y2. Sort the distinct x
        coordinates; for each vertical strip between neighbours, take the rectangles that span it and add width * union_length of their y ranges."""
        xs = sorted({x for r in rects for x in (r[0], r[2])})
        area = 0
        for left, right in zip(xs, xs[1:]):
            active = [(r[1], r[3]) for r in rects if r[0] <= left and r[2] >= right]
            area += (right - left) * union_length(active)
        return area
  explanation: Sweeping turns two-dimensional questions into sorted one-dimensional ones.
commonMistakes:
- title: Using slopes and division
  explanation: Vertical lines break slopes and division causes rounding; use cross products.
- title: Ignoring collinear cases
  explanation: Points on a line, touching segments and ties need explicit handling.
- title: Keeping collinear points on the hull
  explanation: Use a strict left turn (greater than 0) so such points are dropped.
- title: Checking every pair in the strip
  explanation: Stop as soon as the y gap is at least the current best distance.
- title: Treating end and start at the same time as overlap
  explanation: For half-open intervals process ends before starts.
summary:
- The cross product gives left, right or straight turns and signed areas using only arithmetic.
- Segment intersection and point-in-polygon reduce to orientation tests and ray casting.
- The convex hull is built in O(n log n) with the monotone chain.
- The closest pair takes O(n log n) by divide and conquer with a strip.
- Sweep lines turn geometric questions into sorted event processing.
