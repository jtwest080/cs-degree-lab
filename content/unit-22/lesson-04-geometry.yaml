- title: Closest pair and sweeps
  intro: The closest two points, meeting-room counting and the area of overlapping posters.
  code: |
    import math


    def cross(o, a, b):
        """The cross product of the arrows o->a and o->b: (a.x - o.x)(b.y - o.y) - (a.y - o.y)(b.x - o.x).
        Positive when o, a, b make a left (counterclockwise) turn, negative for a right turn, 0 when they are on one line."""
        return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])


    def orientation(a, b, c):
        """1 for a left turn (counterclockwise), -1 for a right turn (clockwise), 0 if the three points are collinear."""
        value = cross(a, b, c)
        return (value > 0) - (value < 0)


    def polygon_area(points):
        """The area of a simple polygon given its corners in order, by the shoelace formula:
        half of the absolute value of the sum of x_i * y_(i+1) - x_(i+1) * y_i, wrapping around at the end. ValueError for fewer than 3 points."""
        if len(points) < 3:
            raise ValueError("a polygon needs at least 3 points")
        total = 0
        for i, (x1, y1) in enumerate(points):
            x2, y2 = points[(i + 1) % len(points)]
            total += x1 * y2 - x2 * y1
        return abs(total) / 2


    import math


    def closest_pair(points):
        """Divide and conquer in O(n log n). Return (distance, (p, q)) for the two closest points. Sort by x; solve each half;
        keep the smaller distance d; then look only at the points within d of the dividing line, sorted by y, comparing each with the
        next few points whose y differs by less than d. ValueError for fewer than 2 points."""
        if len(points) < 2:
            raise ValueError("need at least 2 points")

        def brute(a):
            best = (math.inf, None)
            for i in range(len(a)):
                for j in range(i + 1, len(a)):
                    d = math.dist(a[i], a[j])
                    if d < best[0]:
                        best = (d, (a[i], a[j]))
            return best

        def solve(a):
            if len(a) <= 3:
                return brute(a)
            mid = len(a) // 2
            mid_x = a[mid][0]
            best = min(solve(a[:mid]), solve(a[mid:]), key=lambda t: t[0])
            strip = sorted((p for p in a if abs(p[0] - mid_x) < best[0]), key=lambda p: p[1])
            for i in range(len(strip)):
                for j in range(i + 1, len(strip)):
                    if strip[j][1] - strip[i][1] >= best[0]:
                        break
                    d = math.dist(strip[i], strip[j])
                    if d < best[0]:
                        best = (d, (strip[i], strip[j]))
            return best

        return solve(sorted(points))


    def max_overlap(intervals):
        """The largest number of half-open intervals [start, end) that cover one moment. Sweep: make an event (time, +1) for every start and
        (time, -1) for every end, sort (so at equal times an end comes before a start), and track the running total."""
        events = []
        for start, end in intervals:
            events.append((start, 1))
            events.append((end, -1))
        events.sort()
        best = current = 0
        for _, change in events:
            current += change
            best = max(best, current)
        return best


    def union_length(intervals):
        """The total length covered by at least one interval [start, end]: sort, then merge overlapping or touching ones."""
        total = 0
        last_end = None
        for start, end in sorted(intervals):
            if last_end is None or start > last_end:
                total += end - start
                last_end = end
            elif end > last_end:
                total += end - last_end
                last_end = end
        return total


    def rectangle_union_area(rects):
        """The area covered by at least one axis-aligned rectangle (x1, y1, x2, y2) with x1 < x2 and y1 < y2. Sort the distinct x
        coordinates; for each vertical strip between neighbours, take the rectangles that span it and add width * union_length of their y ranges."""
        xs = sorted({x for r in rects for x in (r[0], r[2])})
        area = 0
        for left, right in zip(xs, xs[1:]):
            active = [(r[1], r[3]) for r in rects if r[0] <= left and r[2] >= right]
            area += (right - left) * union_length(active)
        return area

    points = [(2, 3), (12, 30), (40, 50), (5, 1), (12, 10), (3, 4)]
    distance, pair = closest_pair(points)
    print("closest pair:", pair, "at distance", round(distance, 3))
    meetings = [(9, 10), (9, 11), (10, 12), (13, 14), (13, 15), (13, 16)]
    print("rooms needed for the meetings:", max_overlap(meetings))
    print("time covered by at least one meeting:", union_length(meetings), "hours")
    posters = [(0, 0, 4, 4), (2, 2, 6, 6), (5, 0, 8, 3)]
    print("wall covered by three posters:", rectangle_union_area(posters), "square units")
    print("sum of the three areas:", sum((x2 - x1) * (y2 - y1) for x1, y1, x2, y2 in posters), "(overlaps counted twice)")
  output: |
    closest pair: ((2, 3), (3, 4)) at distance 1.414
    rooms needed for the meetings: 3
    time covered by at least one meeting: 6 hours
    wall covered by three posters: 36 square units
    sum of the three areas: 41 (overlaps counted twice)
