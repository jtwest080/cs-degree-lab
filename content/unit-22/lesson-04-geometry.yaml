id: u22-geometry
title: Computational Geometry
minutes: 90
objective: 'Learn how programs reason about points, lines and shapes: deciding which way three points turn, whether segments cross, where a point lies, the smallest convex shape around a cloud of points, the closest two points, and how a sweep line solves scheduling and area problems.'
outcomes:
- Use the cross product to find turns and areas
- Test segment intersection and point-in-polygon
- Build a convex hull with the monotone chain
- Find the closest pair in O(n log n)
- Apply sweep-line ideas to intervals and rectangles
sections:
- heading: 'One tool: the cross product'
  body: |-
    Computational geometry is geometry for computers: shapes are lists of points, and the answers must be exact and fast. The remarkable thing is that almost everything rests on one small calculation. Take three points `o`, `a` and `b`. Walk from `o` to `a`, then ask: to reach `b` do you turn left, turn right or go straight on? The **cross product** `(a.x - o.x)(b.y - o.y) - (a.y - o.y)(b.x - o.x)` answers it: positive means a left (**counterclockwise**) turn, negative a right (**clockwise**) turn, and zero means the three points are on one line (**collinear**). Its size also equals twice the area of the triangle they form.

    With only multiplication and subtraction, no division, no angles and no square roots, the test is *exact* for whole-number coordinates. That matters because floating-point errors cause real bugs in geometry code (a point that is "almost" on a line). Programmers deliberately avoid slopes, angles and `atan2` for this reason.

    Add up the signed triangle areas around a **polygon** (a closed shape with straight sides) and you get the **shoelace formula** for the polygon's area: half the absolute value of the sum of `x_i * y_(i+1) - x_(i+1) * y_i`. Orientation tests also tell you whether two **segments** (finite pieces of line) cross: they do if the endpoints of each lie on opposite sides of the other, with special care for collinear touching cases.
- heading: Inside, outside and the convex hull
  body: |-
    Is a point inside a polygon? The **ray casting** method shoots an imaginary ray from the point to the right and counts how many polygon edges it crosses. An odd number means inside (each crossing flips inside and outside), an even number means outside. Check separately whether the point lies exactly on an edge. Map software uses exactly this to tell which country, park or delivery zone a coordinate belongs to.

    A shape is **convex** if the segment between any two of its points stays inside it (no dents). The **convex hull** of a set of points is the smallest convex shape containing them all; imagine stretching a rubber band around nails in a board and releasing it: the band touches only the outer nails, and those are the hull's corners. **Andrew's monotone chain algorithm** finds it in `O(n log n)`: sort the points by x, then sweep left to right building the bottom boundary, and right to left building the top. Whenever the newest point would make a non-left turn with the last two, drop the last point, because it is not a corner. Hulls are used for collision detection in games, for the outline of a cluster of data points, and for measuring the widest distance across a shape: the two farthest points are always hull corners.
- heading: Closest pair and sweep lines
  body: |-
    Given a million points, which two are closest? Comparing all pairs costs `O(n squared)`. **Divide and conquer** does it in `O(n log n)`. Sort by x, split the points into a left half and a right half, and solve each half. Let `d` be the smaller of the two answers. The only way a closer pair can exist is one point on each side, and both must lie within `d` of the dividing line. Sort that narrow **strip** by y; a geometric argument shows each point needs comparing with only a handful of neighbours (at most a few points can fit in a `d` by `2d` box without being closer than `d`). So the merge step is linear and the recurrence is `T(n) = 2T(n/2) + O(n)`, the same as merge sort.

    The **sweep line** technique imagines a vertical line moving across the plane; only *events* matter (a shape starting, a shape ending), so you sort the events and process them in order, keeping a small data structure of what is "active". It solves, in one dimension, *how many meeting rooms do I need?* (largest number of overlapping intervals), *how much time is covered?* (union of intervals), and in two dimensions the **area of a union of rectangles**: between consecutive x coordinates the active rectangles form a strip, and the covered height of each strip is just the union of their y intervals. The same idea finds intersecting segments, skylines and the points in range queries in graphics and mapping.
examples:
- title: Turns, segments and a hull
  intro: The basic tests and the convex hull of a point cloud.
  code: |
    import math


    def cross(o, a, b):
        """The cross product of the arrows o->a and o->b: (a.x - o.x)(b.y - o.y) - (a.y - o.y)(b.x - o.x).
        Positive when o, a, b make a left (counterclockwise) turn, negative for a right turn, 0 when they are on one line."""
        return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])


    def orientation(a, b, c):
        """1 for a left turn (counterclockwise), -1 for a right turn (clockwise), 0 if the three points are collinear."""
        value = cross(a, b, c)
        return (value > 0) - (value < 0)


    def polygon_area(points):
        """The area of a simple polygon given its corners in order, by the shoelace formula:
        half of the absolute value of the sum of x_i * y_(i+1) - x_(i+1) * y_i, wrapping around at the end. ValueError for fewer than 3 points."""
        if len(points) < 3:
            raise ValueError("a polygon needs at least 3 points")
        total = 0
        for i, (x1, y1) in enumerate(points):
            x2, y2 = points[(i + 1) % len(points)]
            total += x1 * y2 - x2 * y1
        return abs(total) / 2


    def point_on_segment(p, a, b):
        """True if point p lies on the segment from a to b (endpoints included): collinear with them and inside their bounding box."""
        return (cross(a, b, p) == 0 and min(a[0], b[0]) <= p[0] <= max(a[0], b[0])
                and min(a[1], b[1]) <= p[1] <= max(a[1], b[1]))


    def segments_intersect(a, b, c, d):
        """True if segment a-b and segment c-d share at least one point (touching counts). Compare the orientations of c and d
        relative to a-b with those of a and b relative to c-d; handle the collinear cases with point_on_segment."""
        o1, o2 = orientation(a, b, c), orientation(a, b, d)
        o3, o4 = orientation(c, d, a), orientation(c, d, b)
        if o1 != o2 and o3 != o4:
            return True
        return (point_on_segment(c, a, b) or point_on_segment(d, a, b)
                or point_on_segment(a, c, d) or point_on_segment(b, c, d))


    def point_in_polygon(p, polygon):
        """'boundary' if p lies on an edge, otherwise 'inside' or 'outside'. Ray casting: count the edges that a horizontal ray from p
        to the right crosses; an odd count means inside. An edge (a, b) is crossed when (a.y > p.y) != (b.y > p.y) and p.x is left of the
        point where the edge meets that height."""
        inside = False
        n = len(polygon)
        for i in range(n):
            a, b = polygon[i], polygon[(i + 1) % n]
            if point_on_segment(p, a, b):
                return "boundary"
            if (a[1] > p[1]) != (b[1] > p[1]):
                x_at = a[0] + (p[1] - a[1]) * (b[0] - a[0]) / (b[1] - a[1])
                if p[0] < x_at:
                    inside = not inside
        return "inside" if inside else "outside"


    def convex_hull(points):
        """The corners of the smallest convex shape containing all the points, counterclockwise starting from the lowest-left point,
        with no collinear points on the edges. Andrew's monotone chain: sort the unique points, build the lower chain left to right and
        the upper chain right to left, dropping the last point while the last two points and the new one do not make a strict left turn."""
        pts = sorted(set(points))
        if len(pts) <= 2:
            return pts
        lower = []
        for p in pts:
            while len(lower) >= 2 and cross(lower[-2], lower[-1], p) <= 0:
                lower.pop()
            lower.append(p)
        upper = []
        for p in reversed(pts):
            while len(upper) >= 2 and cross(upper[-2], upper[-1], p) <= 0:
                upper.pop()
            upper.append(p)
        return lower[:-1] + upper[:-1]


    def hull_perimeter(hull):
        """The length of the closed boundary through the hull's corners (0 for fewer than 2 points; a 2-point hull is there and back)."""
        n = len(hull)
        if n < 2:
            return 0.0
        return sum(math.dist(hull[i], hull[(i + 1) % n]) for i in range(n))


    def farthest_pair_distance(points):
        """The largest distance between two of the points: it is always between two hull corners, so check only those pairs.
        ValueError for fewer than 2 points."""
        if len(points) < 2:
            raise ValueError("need at least 2 points")
        hull = convex_hull(points)
        return max(math.dist(p, q) for i, p in enumerate(hull) for q in hull[i:])

    print("turn from (0,0) to (4,0) to (4,3):", orientation((0, 0), (4, 0), (4, 3)))
    print("area of a 4 by 3 rectangle:", polygon_area([(0, 0), (4, 0), (4, 3), (0, 3)]))
    print("do the diagonals of a square cross?", segments_intersect((0, 0), (4, 4), (0, 4), (4, 0)))
    square = [(0, 0), (4, 0), (4, 4), (0, 4)]
    print("where is (2, 2), (5, 2) and (4, 2)?", point_in_polygon((2, 2), square), point_in_polygon((5, 2), square), point_in_polygon((4, 2), square))
    cloud = [(0, 0), (4, 0), (4, 4), (0, 4), (2, 2), (1, 3), (3, 1), (2, 0)]
    hull = convex_hull(cloud)
    print("hull corners:", hull)
    print("hull perimeter:", hull_perimeter(hull), " widest distance:", round(farthest_pair_distance(cloud), 3))
  output: |
    turn from (0,0) to (4,0) to (4,3): 1
    area of a 4 by 3 rectangle: 12.0
    do the diagonals of a square cross? True
    where is (2, 2), (5, 2) and (4, 2)? inside outside boundary
    hull corners: [(0, 0), (4, 0), (4, 4), (0, 4)]
    hull perimeter: 16.0  widest distance: 5.657
