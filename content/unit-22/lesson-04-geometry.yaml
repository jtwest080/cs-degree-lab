  solution: |
    import math


    def cross(o, a, b):
        """The cross product of the arrows o->a and o->b: (a.x - o.x)(b.y - o.y) - (a.y - o.y)(b.x - o.x).
        Positive when o, a, b make a left (counterclockwise) turn, negative for a right turn, 0 when they are on one line."""
        return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])


    def orientation(a, b, c):
        """1 for a left turn (counterclockwise), -1 for a right turn (clockwise), 0 if the three points are collinear."""
        value = cross(a, b, c)
        return (value > 0) - (value < 0)


    def polygon_area(points):
        """The area of a simple polygon given its corners in order, by the shoelace formula:
        half of the absolute value of the sum of x_i * y_(i+1) - x_(i+1) * y_i, wrapping around at the end. ValueError for fewer than 3 points."""
        if len(points) < 3:
            raise ValueError("a polygon needs at least 3 points")
        total = 0
        for i, (x1, y1) in enumerate(points):
            x2, y2 = points[(i + 1) % len(points)]
            total += x1 * y2 - x2 * y1
        return abs(total) / 2


    def convex_hull(points):
        """The corners of the smallest convex shape containing all the points, counterclockwise starting from the lowest-left point,
        with no collinear points on the edges. Andrew's monotone chain: sort the unique points, build the lower chain left to right and
        the upper chain right to left, dropping the last point while the last two points and the new one do not make a strict left turn."""
        pts = sorted(set(points))
        if len(pts) <= 2:
            return pts
        lower = []
        for p in pts:
            while len(lower) >= 2 and cross(lower[-2], lower[-1], p) <= 0:
                lower.pop()
            lower.append(p)
        upper = []
        for p in reversed(pts):
            while len(upper) >= 2 and cross(upper[-2], upper[-1], p) <= 0:
                upper.pop()
            upper.append(p)
        return lower[:-1] + upper[:-1]


    def hull_perimeter(hull):
        """The length of the closed boundary through the hull's corners (0 for fewer than 2 points; a 2-point hull is there and back)."""
        n = len(hull)
        if n < 2:
            return 0.0
        return sum(math.dist(hull[i], hull[(i + 1) % n]) for i in range(n))


    def farthest_pair_distance(points):
        """The largest distance between two of the points: it is always between two hull corners, so check only those pairs.
        ValueError for fewer than 2 points."""
        if len(points) < 2:
            raise ValueError("need at least 2 points")
        hull = convex_hull(points)
        return max(math.dist(p, q) for i, p in enumerate(hull) for q in hull[i:])
  explanation: Wrapping a rubber band around the points leaves only the convex corners.
