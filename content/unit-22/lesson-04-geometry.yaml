- id: segments
  title: Segments and points in polygons
  difficulty: 4
  prompt: 'The starter has `cross` and `orientation`. Write `point_on_segment(p, a, b)` (collinear with `a` and `b` and inside their bounding box). Write `segments_intersect(a, b, c, d)`: True if segment `a-b` and segment `c-d` share any point (touching counts): they cross if `orientation(a, b, c) != orientation(a, b, d)` and `orientation(c, d, a) != orientation(c, d, b)`; otherwise they intersect only if an endpoint lies on the other segment. Write `point_in_polygon(p, polygon)` returning `"boundary"`, `"inside"` or `"outside"`: return `"boundary"` if `p` is on an edge; otherwise cast a ray to the right and toggle for each edge `(a, b)` where `(a.y > p.y) != (b.y > p.y)` and `p.x` is less than `a.x + (p.y - a.y) * (b.x - a.x) / (b.y - a.y)`.'
