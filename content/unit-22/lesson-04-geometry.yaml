  tests:
  - name: cross product and turns
    code: |
      assert cross((0, 0), (1, 0), (0, 1)) == 1
      assert cross((0, 0), (0, 1), (1, 0)) == -1
      assert cross((0, 0), (1, 1), (2, 2)) == 0
      assert orientation((0, 0), (4, 0), (4, 3)) == 1
      assert orientation((0, 0), (4, 0), (4, -3)) == -1
      assert orientation((0, 0), (2, 2), (-1, -1)) == 0
      assert cross((1, 1), (3, 1), (3, 4)) == 6
  - name: polygon area
    code: |
      assert polygon_area([(0, 0), (4, 0), (4, 3), (0, 3)]) == 12
      assert polygon_area([(0, 0), (4, 0), (0, 3)]) == 6
      assert polygon_area([(0, 3), (4, 3), (4, 0), (0, 0)]) == 12
      assert polygon_area([(0, 0), (2, 0), (2, 1), (1, 1), (1, 2), (0, 2)]) == 3
      assert polygon_area([(0, 0), (1, 0), (2, 0)]) == 0
      for pts in ([], [(0, 0), (1, 1)]):
          try:
              polygon_area(pts)
              raise AssertionError("accepted")
          except ValueError:
              pass
  hints:
  - The sign of the cross product tells you which way you turn.
