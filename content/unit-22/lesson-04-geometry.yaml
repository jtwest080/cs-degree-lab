  prompt: 'Points are `(x, y)` pairs. Write `cross(o, a, b)`: `(a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x)` (positive for a left turn, negative for a right turn, 0 when collinear). Write `orientation(a, b, c)`: 1, -1 or 0 from the sign of `cross(a, b, c)`. Write `polygon_area(points)` with the shoelace formula: half the absolute value of the sum of `x_i * y_(i+1) - x_(i+1) * y_i` over the corners in order, wrapping around at the end (`ValueError` for fewer than 3 points).'
  starter: |-
    import math


