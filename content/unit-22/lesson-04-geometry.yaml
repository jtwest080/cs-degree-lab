  tests:
  - name: on a segment
    code: |
      assert point_on_segment((1, 1), (0, 0), (2, 2))
      assert point_on_segment((0, 0), (0, 0), (2, 2)) and point_on_segment((2, 2), (0, 0), (2, 2))
      assert not point_on_segment((3, 3), (0, 0), (2, 2))
      assert not point_on_segment((1, 2), (0, 0), (2, 2))
      assert point_on_segment((5, 0), (10, 0), (0, 0))
  - name: intersections
    code: |
      assert segments_intersect((0, 0), (4, 4), (0, 4), (4, 0))
      assert not segments_intersect((0, 0), (1, 1), (2, 2), (3, 3))
      assert segments_intersect((0, 0), (2, 2), (2, 2), (4, 0))
      assert segments_intersect((0, 0), (4, 0), (1, 0), (3, 0))
      assert not segments_intersect((0, 0), (1, 0), (2, 0), (3, 0))
      assert not segments_intersect((0, 0), (4, 0), (0, 1), (4, 1))
      assert not segments_intersect((0, 0), (1, 1), (2, 0), (3, 5))
      assert segments_intersect((0, 0), (4, 0), (2, 0), (2, 5))
  - name: points in polygons
    code: |
      square = [(0, 0), (4, 0), (4, 4), (0, 4)]
      assert point_in_polygon((2, 2), square) == "inside"
      assert point_in_polygon((5, 2), square) == "outside"
      assert point_in_polygon((4, 2), square) == "boundary"
      assert point_in_polygon((0, 0), square) == "boundary"
      l_shape = [(0, 0), (4, 0), (4, 2), (2, 2), (2, 4), (0, 4)]
      assert point_in_polygon((1, 3), l_shape) == "inside"
      assert point_in_polygon((3, 3), l_shape) == "outside"
      assert point_in_polygon((3, 1), l_shape) == "inside"
      assert point_in_polygon((2, 3), l_shape) == "boundary"
      assert point_in_polygon((-1, 2), square) == "outside"
  hints:
  - A horizontal ray from the point crosses the boundary an odd number of times when the point is inside.
