exercises:
- id: verify
  title: Checking answers is easy
  difficulty: 3
  prompt: 'Problems in the class **NP** have answers that are easy to *check*, even if they are hard to *find*. Write four verifiers. `verify_clique(edges, nodes)`: True if every two different nodes in `nodes` are joined by an edge (`edges` is a list of pairs; edges are undirected, so `(1, 2)` also joins 2 and 1). `verify_vertex_cover(edges, cover)`: True if every edge has at least one endpoint in `cover`. `verify_subset_sum(numbers, target, indices)`: True if `indices` are distinct valid positions in `numbers` and the chosen values add up to exactly `target`. `verify_sat(clauses, assignment)`: `clauses` is a list of lists of nonzero integers (`k` means variable `k` is True, `-k` means it is False); True if every clause has a true literal under `assignment`, a dictionary `{variable: bool}` where a missing variable counts as False.'
  starter: |-
    def verify_clique(edges, nodes):
        """True if every two different nodes in `nodes` are joined by an edge (a clique). `edges` is a list of pairs, undirected."""
        pass


    def verify_vertex_cover(edges, cover):
        """True if every edge has at least one endpoint in `cover`."""
        pass


    def verify_subset_sum(numbers, target, indices):
        """True if `indices` are distinct valid positions in `numbers` whose values add up to exactly `target`."""
        pass


    def verify_sat(clauses, assignment):
        """True if every clause (a list of nonzero integers; k means variable k is True, -k means False) has at least one true literal.
        `assignment` is {variable: bool}; a missing variable counts as False."""
        pass
  tests:
  - name: cliques and covers
    code: |
      edges = [(1, 2), (2, 3), (1, 3), (3, 4)]
      assert verify_clique(edges, [1, 2, 3]) and verify_clique(edges, [3, 4]) and verify_clique(edges, [2]) and verify_clique(edges, [])
      assert not verify_clique(edges, [1, 2, 3, 4]) and not verify_clique(edges, [1, 4])
      assert verify_vertex_cover(edges, [3, 1]) and verify_vertex_cover(edges, {1, 2, 3})
      assert not verify_vertex_cover(edges, [1, 4]) and not verify_vertex_cover(edges, [])
      assert verify_vertex_cover([], [])
  - name: subset sum
    code: |
      nums = [3, 34, 4, 12, 5, 2]
      assert verify_subset_sum(nums, 9, [2, 4]) and verify_subset_sum(nums, 0, [])
      assert not verify_subset_sum(nums, 9, [0, 1]) and not verify_subset_sum(nums, 6, [0, 0])
      assert not verify_subset_sum(nums, 3, [9]) and not verify_subset_sum(nums, 3, [-1])
      assert verify_subset_sum(nums, 3, [0])
  - name: satisfiability
    code: |
      clauses = [[1, -2], [2, 3], [-1, -3]]
      assert verify_sat(clauses, {1: True, 2: True, 3: False})
      assert not verify_sat(clauses, {1: True, 2: False, 3: True})
      assert verify_sat([], {})
      assert not verify_sat([[]], {1: True})
      assert verify_sat([[-1]], {})
      assert verify_sat([[1, 2, 3, -4]], {4: False})
  hints:
  - Verifying means checking a proposed answer, never searching for one.
  solution: |
    def verify_clique(edges, nodes):
        """True if every two different nodes in `nodes` are joined by an edge (a clique). `edges` is a list of pairs, undirected."""
        present = {frozenset(e) for e in edges}
        nodes = list(nodes)
        return all(frozenset((nodes[i], nodes[j])) in present for i in range(len(nodes)) for j in range(i + 1, len(nodes)))


    def verify_vertex_cover(edges, cover):
        """True if every edge has at least one endpoint in `cover`."""
        chosen = set(cover)
        return all(a in chosen or b in chosen for a, b in edges)


    def verify_subset_sum(numbers, target, indices):
        """True if `indices` are distinct valid positions in `numbers` whose values add up to exactly `target`."""
        if len(set(indices)) != len(indices) or any(not 0 <= i < len(numbers) for i in indices):
            return False
        return sum(numbers[i] for i in indices) == target


    def verify_sat(clauses, assignment):
        """True if every clause (a list of nonzero integers; k means variable k is True, -k means False) has at least one true literal.
        `assignment` is {variable: bool}; a missing variable counts as False."""
        def value(lit):
            v = assignment.get(abs(lit), False)
            return v if lit > 0 else not v
        return all(any(value(lit) for lit in clause) for clause in clauses)
  explanation: A verifier runs in polynomial time even when finding the answer seems to need exponential time.
- id: reduce
  title: Reductions
  difficulty: 4
  prompt: 'If you can solve problem A, and a conversion shows B is just A in disguise, then B is solved too. Write `complement_graph(nodes, edges)` (every pair `(a, b)` of different nodes with `a < b` that is **not** an edge, in either order, as a sorted list), `min_vertex_cover(nodes, edges)` (brute force: try subsets of the sorted nodes by increasing size with `itertools.combinations` and return the first that touches every edge, as a sorted list), `max_independent_set(nodes, edges)` (a largest set with no edge between two of its nodes: the nodes **not** in a minimum vertex cover, sorted) and `max_clique(nodes, edges)` (a maximum independent set of the complement graph).'
  starter: |-
    from itertools import combinations


    def complement_graph(nodes, edges):
        """The edges that are NOT present: every pair (a, b) of different nodes with a < b that is not in `edges` (in either order),
        as a sorted list."""
        pass


    def min_vertex_cover(nodes, edges):
        """A smallest set of nodes touching every edge, found by brute force: try subset sizes 0, 1, 2, ... (itertools.combinations on the
        sorted nodes) and return the first that covers every edge, as a sorted list."""
        pass


    def max_independent_set(nodes, edges):
        """A largest set of nodes with no edge between any two. Reduction: the nodes NOT in a minimum vertex cover, as a sorted list."""
        pass


    def max_clique(nodes, edges):
        """A largest set of nodes that are all joined to each other. Reduction: a maximum independent set of the complement graph."""
        pass
  tests:
  - name: complement
    code: |
      assert complement_graph([1, 2, 3], [(1, 2)]) == [(1, 3), (2, 3)]
      assert complement_graph([1, 2, 3], [(1, 2), (2, 3), (3, 1)]) == []
      assert complement_graph([1, 2, 3], []) == [(1, 2), (1, 3), (2, 3)]
      assert complement_graph([], []) == []
      assert complement_graph([1, 2], [(2, 1)]) == []
  - name: covers and independent sets
    code: |
      nodes = [1, 2, 3, 4, 5]
      edges = [(1, 2), (2, 3), (3, 4), (4, 5)]
      cover = min_vertex_cover(nodes, edges)
      assert len(cover) == 2 and all(a in cover or b in cover for a, b in edges)
      iset = max_independent_set(nodes, edges)
      assert len(iset) == 3 and all(not (a in iset and b in iset) for a, b in edges)
      assert len(cover) + len(iset) == len(nodes)
      assert min_vertex_cover([1, 2], []) == []
      assert max_independent_set([1, 2, 3], []) == [1, 2, 3]
      assert len(min_vertex_cover([1, 2, 3], [(1, 2), (2, 3), (1, 3)])) == 2
  - name: cliques
    code: |
      nodes = [1, 2, 3, 4, 5]
      edges = [(1, 2), (2, 3), (1, 3), (3, 4), (4, 5)]
      clique = max_clique(nodes, edges)
      assert sorted(clique) == [1, 2, 3]
      assert len(max_clique([1, 2, 3], [])) == 1
      assert sorted(max_clique([1, 2, 3], [(1, 2), (2, 3), (1, 3)])) == [1, 2, 3]
  hints:
  - Nodes outside a vertex cover cannot be adjacent to each other, because every edge would then be uncovered.
  solution: |
    from itertools import combinations


    def complement_graph(nodes, edges):
        """The edges that are NOT present: every pair (a, b) of different nodes with a < b that is not in `edges` (in either order),
        as a sorted list."""
        present = {frozenset(e) for e in edges}
        return sorted((a, b) for a, b in combinations(sorted(nodes), 2) if frozenset((a, b)) not in present)


    def min_vertex_cover(nodes, edges):
        """A smallest set of nodes touching every edge, found by brute force: try subset sizes 0, 1, 2, ... (itertools.combinations on the
        sorted nodes) and return the first that covers every edge, as a sorted list."""
        nodes = sorted(nodes)
        for size in range(len(nodes) + 1):
            for subset in combinations(nodes, size):
                chosen = set(subset)
                if all(a in chosen or b in chosen for a, b in edges):
                    return list(subset)


    def max_independent_set(nodes, edges):
        """A largest set of nodes with no edge between any two. Reduction: the nodes NOT in a minimum vertex cover, as a sorted list."""
        cover = set(min_vertex_cover(nodes, edges))
        return sorted(n for n in nodes if n not in cover)


    def max_clique(nodes, edges):
        """A largest set of nodes that are all joined to each other. Reduction: a maximum independent set of the complement graph."""
        return max_independent_set(nodes, complement_graph(nodes, edges))
  explanation: Vertex cover, independent set and clique are one problem wearing different clothes.
- id: dpll
  title: Backtracking SAT solver
  difficulty: 5
  prompt: 'The starter has `simplify(clauses, lit)` (makes `lit` true: drops clauses containing it and removes `-lit` from the others). Write `dpll(num_vars, clauses)` for clauses of any length: inside it write a recursive `solve(cls, assignment)`. First loop: if any clause is empty return `None`; if some clause has exactly one literal, that literal must be true, so record it in a copy of the assignment and simplify, then repeat. When no unit clauses remain: if there are no clauses left, return the assignment; otherwise take the first literal of the first clause and try it true, then (if that fails) false, by recursing on the simplified clauses. At the end return `{v: assigned or False}` for every variable `1..num_vars`, or `None` if unsatisfiable.'
  starter: |-
    def simplify(clauses, lit):
        """Make literal `lit` true: drop every clause containing it and delete -lit from the other clauses (a clause that becomes empty
        stays in the list as an empty list: a contradiction)."""
        out = []
        for clause in clauses:
            if lit in clause:
                continue
            out.append([x for x in clause if x != -lit])
        return out

    def dpll(num_vars, clauses):
        """Solve SAT (clauses of any length) by backtracking with unit propagation. First, while some clause has exactly one literal,
        that literal must be true: set it and simplify. If a clause is empty return None; if no clauses are left, success. Otherwise
        pick the first literal of the first clause and try it true, then false. Return {variable: bool} for variables 1..num_vars
        (variables not decided default to False) or None if unsatisfiable."""
        pass
  tests:
  - name: easy puzzles
    code: |
      def ok(clauses, a):
          return all(any((a[abs(l)] if l > 0 else not a[abs(l)]) for l in c) for c in clauses)
      cl = [[1, 2], [-1, 3], [-2, -3]]
      assert ok(cl, dpll(3, cl))
      assert dpll(1, [[1], [-1]]) is None
      assert dpll(2, []) == {1: False, 2: False}
      assert dpll(1, [[]]) is None
      cl2 = [[1], [-1, 2], [-2, 3], [-3, 4]]
