id: u22-np
title: NP-Completeness and Coping with Hard Problems
minutes: 95
objective: 'Learn the most famous open question in computer science and what it means in practice: why some problems seem to need exponential time, how to recognize them through reductions, and what programmers do about them: backtracking, approximation algorithms and heuristics.'
outcomes:
- Explain P, NP, NP-complete and NP-hard in plain terms
- Write verifiers that check a certificate in polynomial time
- Use reductions to compare problems
- Solve SAT by backtracking with unit propagation
- Apply approximation algorithms and heuristics to TSP and vertex cover
sections:
- heading: Easy to check, hard to find
  body: |-
    Some problems we solve quickly: sorting a million numbers, finding a shortest path. Others seem to need trying a huge number of possibilities: scheduling exams with no clashes, packing a truck perfectly, finding the shortest tour through 60 cities. For these, nobody has found a fast algorithm, and nobody has proven that none exists. Complexity theory sorts problems into classes, and here are the four that matter.

    **P** is the set of **decision problems** (questions with a yes/no answer) that a computer can *solve* in **polynomial time**, meaning time like `n`, `n squared` or `n cubed`, as opposed to exponential time like `2 to the n`. **NP** is the set of decision problems where a proposed solution can be *checked* in polynomial time. The proposed solution is called a **certificate** (or witness). For example, "does this graph contain a group of 5 people who all know each other (a **clique** of size 5)?" is hard to answer by search, but if someone hands you 5 names you can verify it in a moment. Every problem in P is also in NP (if you can solve it, you can certainly check it), so the famous question **P versus NP** asks whether the reverse is true: whenever a solution is easy to check, is it also easy to find? Almost everyone believes the answer is no, but it is unproven, and a proof is worth a million-dollar prize.

    Be careful: "NP" does *not* mean "not polynomial". It stands for **nondeterministic polynomial time**.
- heading: Reductions and NP-completeness
  body: |-
    To compare problems we use a **reduction**: a way of converting any instance of problem A into an instance of problem B, in polynomial time, so that the answers match. If you can solve B quickly, you can then solve A quickly. A reduction says "A is no harder than B". You have already used one: bipartite matching turned into maximum flow. A classic example: a graph has a **vertex cover** of size k (k nodes touching every edge) exactly when it has an **independent set** (nodes with no edges between them) of size `n - k`, because the nodes outside a cover cannot have an edge between them. And an independent set in a graph is a **clique** in its **complement** (the graph with edges where there were none). Three problems, one difficulty.

    A problem is **NP-hard** if every problem in NP reduces to it, so it is at least as hard as anything in NP. If it is also in NP itself it is **NP-complete**: the hardest problems in NP. In 1971 Stephen Cook proved that **SAT** (given a logical formula built from variables and OR, AND, NOT, can you make it true?) is NP-complete; Richard Karp then showed 21 more, including 3-SAT, clique, vertex cover, subset sum and the travelling salesman. Today thousands are known. They are all equally hard: a fast algorithm for any one would give a fast algorithm for all of them and prove P = NP. So when you meet a new problem, a reduction *from* a known NP-complete problem is strong evidence you should not search for a perfect fast algorithm.
- heading: What to do when the problem is hard
  body: |-
    Real problems do not disappear because they are NP-complete. You have several options. First, **small inputs**: exponential algorithms are fine for 20 items. The **Held-Karp** algorithm solves the travelling salesman problem exactly in `O(n^2 * 2^n)`, far better than trying all `n!` tours, using dynamic programming over subsets of cities. Second, **smart search**: **backtracking** builds a solution step by step and abandons a branch the moment it must fail. The **DPLL** algorithm for SAT picks a variable, tries both values, and uses **unit propagation** (a clause with one remaining literal forces that literal) to cut huge parts of the search; modern SAT solvers extend it and routinely handle millions of variables in industry, for hardware verification and planning. The worst case is still exponential, but real instances are often friendly.

    Third, **approximation algorithms** give an answer that is *provably* within a factor of optimal. The vertex cover trick: scan the edges, and whenever an edge is uncovered take *both* endpoints. The edges you picked form a **matching** (no two share a node), so any cover needs at least one node per picked edge, while you used two, so you are at most twice optimal: a **2-approximation**. Greedy set cover (always take the set that covers the most new elements) is within about `ln n` of optimal. Fourth, **heuristics** give good answers with no guarantee: nearest neighbour for travelling salesman, improved by **2-opt**, which repeatedly reverses a stretch of the tour whenever that shortens it. Knowing which of these tools to reach for is what separates engineers who burn weeks on an impossible exact algorithm from those who ship something useful.
examples:
- title: Verifiers and reductions
  intro: Checking certificates is fast; the same graph yields covers, independent sets and cliques.
  code: |
    def verify_clique(edges, nodes):
        """True if every two different nodes in `nodes` are joined by an edge (a clique). `edges` is a list of pairs, undirected."""
        present = {frozenset(e) for e in edges}
        nodes = list(nodes)
        return all(frozenset((nodes[i], nodes[j])) in present for i in range(len(nodes)) for j in range(i + 1, len(nodes)))


    def verify_vertex_cover(edges, cover):
        """True if every edge has at least one endpoint in `cover`."""
        chosen = set(cover)
        return all(a in chosen or b in chosen for a, b in edges)


    def verify_subset_sum(numbers, target, indices):
        """True if `indices` are distinct valid positions in `numbers` whose values add up to exactly `target`."""
        if len(set(indices)) != len(indices) or any(not 0 <= i < len(numbers) for i in indices):
            return False
        return sum(numbers[i] for i in indices) == target


    def verify_sat(clauses, assignment):
        """True if every clause (a list of nonzero integers; k means variable k is True, -k means False) has at least one true literal.
        `assignment` is {variable: bool}; a missing variable counts as False."""
        def value(lit):
            v = assignment.get(abs(lit), False)
            return v if lit > 0 else not v
        return all(any(value(lit) for lit in clause) for clause in clauses)


    from itertools import combinations


    def complement_graph(nodes, edges):
        """The edges that are NOT present: every pair (a, b) of different nodes with a < b that is not in `edges` (in either order),
        as a sorted list."""
        present = {frozenset(e) for e in edges}
        return sorted((a, b) for a, b in combinations(sorted(nodes), 2) if frozenset((a, b)) not in present)


    def min_vertex_cover(nodes, edges):
        """A smallest set of nodes touching every edge, found by brute force: try subset sizes 0, 1, 2, ... (itertools.combinations on the
        sorted nodes) and return the first that covers every edge, as a sorted list."""
        nodes = sorted(nodes)
        for size in range(len(nodes) + 1):
            for subset in combinations(nodes, size):
                chosen = set(subset)
                if all(a in chosen or b in chosen for a, b in edges):
                    return list(subset)


    def max_independent_set(nodes, edges):
        """A largest set of nodes with no edge between any two. Reduction: the nodes NOT in a minimum vertex cover, as a sorted list."""
        cover = set(min_vertex_cover(nodes, edges))
        return sorted(n for n in nodes if n not in cover)


    def max_clique(nodes, edges):
        """A largest set of nodes that are all joined to each other. Reduction: a maximum independent set of the complement graph."""
        return max_independent_set(nodes, complement_graph(nodes, edges))


    def vertex_cover_2approx(edges):
        """A vertex cover at most twice the minimum size: go through the edges; whenever neither endpoint is chosen yet, choose BOTH.
        Return the chosen nodes as a sorted list."""
        chosen = set()
        for a, b in edges:
            if a not in chosen and b not in chosen:
                chosen.add(a)
                chosen.add(b)
        return sorted(chosen)


    def greedy_set_cover(universe, sets):
        """Choose sets until every element of `universe` is covered. Greedy rule: repeatedly take the set (a dictionary value, a Python set,
        keyed by name) that covers the most still-uncovered elements, breaking ties by the smaller name. Return the chosen names in order.
        ValueError if the sets together cannot cover the universe."""
        remaining = set(universe)
        chosen = []
        while remaining:
            name = min(sets, key=lambda n: (-len(sets[n] & remaining), n)) if sets else None
            if name is None or not sets[name] & remaining:
                raise ValueError("cannot cover the universe")
            chosen.append(name)
            remaining -= sets[name]
        return chosen

    edges = [(1, 2), (2, 3), (1, 3), (3, 4), (4, 5)]
    nodes = [1, 2, 3, 4, 5]
    print("is [1, 2, 3] a clique?", verify_clique(edges, [1, 2, 3]))
    print("is [3, 4] a vertex cover?", verify_vertex_cover(edges, [3, 4]))
    print("smallest vertex cover:", min_vertex_cover(nodes, edges))
    print("largest independent set:", max_independent_set(nodes, edges))
    print("largest clique:", max_clique(nodes, edges))
    print("2-approximate cover:", vertex_cover_2approx(edges))
    print("subset of [3, 34, 4, 12, 5, 2] that makes 9:", verify_subset_sum([3, 34, 4, 12, 5, 2], 9, [2, 4]))
  output: |
    is [1, 2, 3] a clique? True
    is [3, 4] a vertex cover? False
    smallest vertex cover: [1, 2, 4]
    largest independent set: [3, 5]
    largest clique: [1, 2, 3]
    2-approximate cover: [1, 2, 3, 4]
    subset of [3, 34, 4, 12, 5, 2] that makes 9: True
  lines:
  - line: 91
    note: Brute force finds the minimum cover.
  - line: 92
    note: The nodes outside the cover.
  - line: 94
    note: Fast, and at most twice the optimum.
- title: SAT and travelling salesman
  intro: A backtracking SAT solver and three ways to tackle the salesman problem.
  code: |
    def simplify(clauses, lit):
        """Make literal `lit` true: drop every clause containing it and delete -lit from the other clauses (a clause that becomes empty
        stays in the list as an empty list: a contradiction)."""
        out = []
        for clause in clauses:
            if lit in clause:
                continue
            out.append([x for x in clause if x != -lit])
        return out


    def dpll(num_vars, clauses):
        """Solve SAT (clauses of any length) by backtracking with unit propagation. First, while some clause has exactly one literal,
        that literal must be true: set it and simplify. If a clause is empty return None; if no clauses are left, success. Otherwise
        pick the first literal of the first clause and try it true, then false. Return {variable: bool} for variables 1..num_vars
        (variables not decided default to False) or None if unsatisfiable."""
        def solve(cls, assignment):
            while True:
                if any(len(c) == 0 for c in cls):
                    return None
                unit = next((c[0] for c in cls if len(c) == 1), None)
                if unit is None:
                    break
                assignment = dict(assignment)
                assignment[abs(unit)] = unit > 0
                cls = simplify(cls, unit)
            if not cls:
                return assignment
            lit = cls[0][0]
            for choice in (lit, -lit):
                result = solve(simplify(cls, choice), {**assignment, abs(choice): choice > 0})
                if result is not None:
                    return result
            return None

        result = solve([list(c) for c in clauses], {})
        if result is None:
            return None
        return {v: result.get(v, False) for v in range(1, num_vars + 1)}


    def tour_length(dist, tour):
        """The length of the closed tour that visits the cities in this order and returns to the first. `dist` is a square table."""
        return sum(dist[tour[i]][tour[(i + 1) % len(tour)]] for i in range(len(tour))) if len(tour) > 1 else 0


    def nearest_neighbour(dist, start=0):
        """A quick tour: from the current city always go to the closest unvisited city (the smaller index wins ties)."""
        n = len(dist)
        tour = [start]
        unvisited = set(range(n)) - {start}
        while unvisited:
            here = tour[-1]
            nxt = min(unvisited, key=lambda c: (dist[here][c], c))
            tour.append(nxt)
            unvisited.remove(nxt)
        return tour


    def two_opt(dist, tour):
        """Improve a tour: repeatedly try reversing a stretch tour[i..j] (i from 1, so the first city stays put) and keep the change if the
        tour gets shorter, until no reversal helps. Return the improved tour as a new list."""
        best = list(tour)
        improved = True
        while improved:
            improved = False
            for i in range(1, len(best) - 1):
                for j in range(i + 1, len(best)):
                    candidate = best[:i] + best[i:j + 1][::-1] + best[j + 1:]
                    if tour_length(dist, candidate) < tour_length(dist, best) - 1e-12:
                        best = candidate
                        improved = True
        return best


    def held_karp(dist):
        """The exact length of the shortest tour in O(n^2 * 2^n) time. dp[mask][last] = the shortest path that starts at city 0, visits
        exactly the cities in the bit mask and ends at `last`. Finish by returning to city 0. 0 for fewer than 2 cities."""
        n = len(dist)
        if n < 2:
            return 0
        inf = float("inf")
        dp = [[inf] * n for _ in range(1 << n)]
        dp[1][0] = 0
        for mask in range(1 << n):
            if not mask & 1:
                continue
            for last in range(n):
                if dp[mask][last] == inf or not (mask >> last) & 1:
                    continue
                for nxt in range(n):
                    if (mask >> nxt) & 1:
                        continue
                    new = mask | (1 << nxt)
                    cost = dp[mask][last] + dist[last][nxt]
                    if cost < dp[new][nxt]:
                        dp[new][nxt] = cost
        full = (1 << n) - 1
        return min(dp[full][last] + dist[last][0] for last in range(1, n))

    formula = [[1, 2], [-1, 3], [-2, -3], [2, 3]]
    print("SAT solver:", dpll(3, formula))
    print("impossible formula:", dpll(1, [[1], [-1]]))
    cities = [(0, 6), (6, 9), (0, 7), (4, 3), (9, 1), (5, 0)]
    dist = [[((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2) ** 0.5 for b in cities] for a in cities]
    greedy = nearest_neighbour(dist)
    better = two_opt(dist, greedy)
    print("nearest neighbour tour:", greedy, round(tour_length(dist, greedy), 2))
    print("after 2-opt:", better, round(tour_length(dist, better), 2))
    print("best possible:", round(held_karp(dist), 2))
  output: |
    SAT solver: {1: True, 2: False, 3: True}
    impossible formula: None
    nearest neighbour tour: [0, 2, 3, 5, 4, 1] 29.19
    after 2-opt: [0, 2, 1, 4, 5, 3] 28.15
    best possible: 28.15
  lines:
  - line: 102
    note: One satisfying assignment.
  - line: 109
    note: Reversing stretches shortens the tour.
  - line: 110
    note: Held-Karp gives the exact optimum.
