  prompt: 'A salesperson must visit every city once and return home by the shortest route. `dist` is a square table of distances. Write `tour_length(dist, tour)` (the closed length: visit in order and return to the first city; 0 for a tour of fewer than 2 cities), `nearest_neighbour(dist, start=0)` (always go to the closest unvisited city, smaller index wins ties; return the tour as a list), `two_opt(dist, tour)` (repeatedly try reversing the stretch `tour[i..j]` for `i` from 1 and `j > i`, keeping a change only if the tour gets strictly shorter by more than 1e-12; repeat until a full pass changes nothing; return a new list) and `held_karp(dist)`: the exact shortest length with dynamic programming where `dp[mask][last]` is the shortest path starting at city 0, visiting exactly the cities in the bit mask and ending at `last` (0 for fewer than 2 cities).'
