      assert tour_length(d, [0]) == 0 and tour_length(d, []) == 0
      assert nearest_neighbour(d) == [0, 1, 2, 3]
      assert nearest_neighbour(d, 2) == [2, 3, 0, 1]
  - name: improving and exact
