  solution: |
    def tour_length(dist, tour):
        """The length of the closed tour that visits the cities in this order and returns to the first. `dist` is a square table."""
        return sum(dist[tour[i]][tour[(i + 1) % len(tour)]] for i in range(len(tour))) if len(tour) > 1 else 0


    def nearest_neighbour(dist, start=0):
        """A quick tour: from the current city always go to the closest unvisited city (the smaller index wins ties)."""
        n = len(dist)
        tour = [start]
        unvisited = set(range(n)) - {start}
        while unvisited:
            here = tour[-1]
            nxt = min(unvisited, key=lambda c: (dist[here][c], c))
            tour.append(nxt)
            unvisited.remove(nxt)
        return tour


    def two_opt(dist, tour):
        """Improve a tour: repeatedly try reversing a stretch tour[i..j] (i from 1, so the first city stays put) and keep the change if the
        tour gets shorter, until no reversal helps. Return the improved tour as a new list."""
        best = list(tour)
        improved = True
        while improved:
            improved = False
            for i in range(1, len(best) - 1):
                for j in range(i + 1, len(best)):
                    candidate = best[:i] + best[i:j + 1][::-1] + best[j + 1:]
                    if tour_length(dist, candidate) < tour_length(dist, best) - 1e-12:
                        best = candidate
                        improved = True
        return best


    def held_karp(dist):
        """The exact length of the shortest tour in O(n^2 * 2^n) time. dp[mask][last] = the shortest path that starts at city 0, visits
        exactly the cities in the bit mask and ends at `last`. Finish by returning to city 0. 0 for fewer than 2 cities."""
        n = len(dist)
        if n < 2:
            return 0
        inf = float("inf")
        dp = [[inf] * n for _ in range(1 << n)]
        dp[1][0] = 0
        for mask in range(1 << n):
            if not mask & 1:
                continue
            for last in range(n):
                if dp[mask][last] == inf or not (mask >> last) & 1:
                    continue
                for nxt in range(n):
                    if (mask >> nxt) & 1:
                        continue
                    new = mask | (1 << nxt)
                    cost = dp[mask][last] + dist[last][nxt]
                    if cost < dp[new][nxt]:
                        dp[new][nxt] = cost
        full = (1 << n) - 1
        return min(dp[full][last] + dist[last][0] for last in range(1, n))
  explanation: Exact solutions take exponential time; heuristics are fast and usually close.
commonMistakes:
- title: Reading NP as 'not polynomial'
  explanation: 'It means non-deterministic polynomial time: solutions can be checked quickly.'
- title: Assuming NP-complete means unsolvable
  explanation: It means no fast exact algorithm is known; small cases, heuristics and approximations all work.
- title: Reducing in the wrong direction
  explanation: To show B is hard, reduce a known hard problem A to B, not the other way around.
- title: Forgetting that verification must be fast
  explanation: A certificate that takes exponential time to check does not put a problem in NP.
- title: Using brute force without checking the input size
  explanation: Trying all tours of 20 cities takes longer than the age of the universe; use dynamic programming or a heuristic.
summary:
- P problems are solved in polynomial time; NP problems have answers checkable in polynomial time.
- A reduction converts one problem into another; it shows the first is no harder.
- NP-complete problems are the hardest in NP; a fast algorithm for one would solve them all.
- Backtracking, unit propagation and dynamic programming handle many hard instances.
- Approximation algorithms and heuristics give good answers when exact ones are out of reach.
