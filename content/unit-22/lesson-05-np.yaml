      import random, itertools
      def best(nodes, es):
          for k in range(len(nodes) + 1):
              for s in itertools.combinations(nodes, k):
                  if all(a in s or b in s for a, b in es):
                      return k
      rng = random.Random(2)
      for _ in range(60):
          n = rng.randrange(2, 8)
          es = [(a, b) for a in range(n) for b in range(a + 1, n) if rng.random() < 0.4]
          c = vertex_cover_2approx(es)
          assert all(a in c or b in c for a, b in es)
          assert len(c) <= 2 * best(range(n), es)
  - name: set cover
