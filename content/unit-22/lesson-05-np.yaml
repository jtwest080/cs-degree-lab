  solution: |
    def simplify(clauses, lit):
        """Make literal `lit` true: drop every clause containing it and delete -lit from the other clauses (a clause that becomes empty
        stays in the list as an empty list: a contradiction)."""
        out = []
        for clause in clauses:
            if lit in clause:
                continue
            out.append([x for x in clause if x != -lit])
        return out

    def dpll(num_vars, clauses):
        """Solve SAT (clauses of any length) by backtracking with unit propagation. First, while some clause has exactly one literal,
        that literal must be true: set it and simplify. If a clause is empty return None; if no clauses are left, success. Otherwise
        pick the first literal of the first clause and try it true, then false. Return {variable: bool} for variables 1..num_vars
        (variables not decided default to False) or None if unsatisfiable."""
        def solve(cls, assignment):
            while True:
                if any(len(c) == 0 for c in cls):
                    return None
                unit = next((c[0] for c in cls if len(c) == 1), None)
                if unit is None:
                    break
                assignment = dict(assignment)
                assignment[abs(unit)] = unit > 0
                cls = simplify(cls, unit)
            if not cls:
                return assignment
            lit = cls[0][0]
            for choice in (lit, -lit):
                result = solve(simplify(cls, choice), {**assignment, abs(choice): choice > 0})
                if result is not None:
                    return result
            return None

        result = solve([list(c) for c in clauses], {})
        if result is None:
            return None
        return {v: result.get(v, False) for v in range(1, num_vars + 1)}
  explanation: Backtracking with propagation solves many SAT instances quickly, though some are still exponentially hard.
- id: approx
  title: Approximation algorithms
  difficulty: 4
  prompt: 'When exact answers are too expensive, settle for provably good ones. Write `vertex_cover_2approx(edges)`: go through the edges in order; whenever neither endpoint is chosen yet, choose **both**; return the chosen nodes as a sorted list (it is never more than twice the best possible). Write `greedy_set_cover(universe, sets)`: `sets` is a dictionary `{name: Python set}`; repeatedly take the set covering the most still-uncovered elements (ties go to the smaller name), and return the chosen names in order; raise `ValueError` if the sets cannot cover the universe.'
  starter: |-
    def vertex_cover_2approx(edges):
