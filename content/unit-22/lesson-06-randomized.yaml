        pass


    def shingles(text, k):
        """The set of all substrings of length k (k-shingles). ValueError if k < 1; empty set if the text is shorter than k."""
        pass


    def minhash_signature(items, num_hashes, seed=0):
        """A short fingerprint of a set. With P = 2**61 - 1 and rng = random.Random(seed), make num_hashes pairs (a, b) with
        a = rng.randrange(1, P) and b = rng.randrange(0, P). Position i of the signature is the minimum over the items of
        (a * stable_hash(item) + b) % P. ValueError for an empty collection."""
        pass


    def estimate_jaccard(sig_a, sig_b):
        """The fraction of positions where two signatures agree: an estimate of the Jaccard similarity. ValueError if lengths differ or are 0."""
        pass
  tests:
  - name: exact similarity
    code: |
      assert jaccard({1, 2, 3}, {2, 3, 4}) == 0.5
      assert jaccard([1, 1, 2], [2, 2]) == 0.5
      assert jaccard([], []) == 1.0 and jaccard([1], []) == 0.0
      assert shingles("abcd", 2) == {"ab", "bc", "cd"}
      assert shingles("ab", 3) == set() and shingles("aaaa", 2) == {"aa"}
      try:
          shingles("abc", 0)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: signatures
    code: |
      s = minhash_signature({"a", "b", "c"}, 50, 1)
      assert len(s) == 50 and minhash_signature({"c", "b", "a"}, 50, 1) == s
      assert estimate_jaccard(s, s) == 1.0
      assert minhash_signature({"a", "b"}, 50, 1) != s
      assert minhash_signature({"a", "b", "c"}, 50, 2) != s
      for a, b in (([1], [1, 2]), ([], [])):
          try:
              estimate_jaccard(a, b)
              raise AssertionError("accepted")
          except ValueError:
              pass
      try:
          minhash_signature([], 10)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: estimates are close
    code: |
      a = shingles("the quick brown fox jumps over the lazy dog", 3)
      b = shingles("the quick brown fox leaps over the lazy cat", 3)
      exact = jaccard(a, b)
      est = estimate_jaccard(minhash_signature(a, 400, 5), minhash_signature(b, 400, 5))
      assert abs(est - exact) < 0.1, (est, exact)
      unrelated = estimate_jaccard(minhash_signature(a, 400, 5), minhash_signature(shingles("zzzzzzzzzzzzzzzzzzzzzz", 3), 400, 5))
      assert unrelated < 0.05
      half = list(range(100))
      other = list(range(50, 150))
      est2 = estimate_jaccard(minhash_signature(half, 500, 3), minhash_signature(other, 500, 3))
      assert abs(est2 - 1 / 3) < 0.08, est2
