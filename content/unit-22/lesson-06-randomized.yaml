  - The chance that two sets have the same minimum hash equals their Jaccard similarity.
  solution: |
    import random


    def stable_hash(item, seed=0):
        h = (2166136261 ^ (seed * 2654435761)) % 2 ** 32
        for ch in str(item):
            h = ((h ^ ord(ch)) * 16777619) % 2 ** 32
        h ^= h >> 16
        h = (h * 2246822507) % 2 ** 32
        h ^= h >> 13
        h = (h * 3266489909) % 2 ** 32
        h ^= h >> 16
        return h

    def jaccard(a, b):
        """The exact similarity of two collections treated as sets: size of the overlap divided by size of the union (1.0 if both are empty)."""
        a, b = set(a), set(b)
        union = a | b
        return len(a & b) / len(union) if union else 1.0


    def shingles(text, k):
        """The set of all substrings of length k (k-shingles). ValueError if k < 1; empty set if the text is shorter than k."""
        if k < 1:
            raise ValueError("k must be at least 1")
        return {text[i:i + k] for i in range(len(text) - k + 1)}


    def minhash_signature(items, num_hashes, seed=0):
        """A short fingerprint of a set. With P = 2**61 - 1 and rng = random.Random(seed), make num_hashes pairs (a, b) with
        a = rng.randrange(1, P) and b = rng.randrange(0, P). Position i of the signature is the minimum over the items of
        (a * stable_hash(item) + b) % P. ValueError for an empty collection."""
        items = set(items)
        if not items:
            raise ValueError("empty set")
        P = 2 ** 61 - 1
        rng = random.Random(seed)
        params = [(rng.randrange(1, P), rng.randrange(0, P)) for _ in range(num_hashes)]
        hashed = [stable_hash(x) for x in items]
        return [min((a * h + b) % P for h in hashed) for a, b in params]


    def estimate_jaccard(sig_a, sig_b):
        """The fraction of positions where two signatures agree: an estimate of the Jaccard similarity. ValueError if lengths differ or are 0."""
        if len(sig_a) != len(sig_b) or not sig_a:
            raise ValueError("signatures must have the same non-zero length")
        return sum(1 for x, y in zip(sig_a, sig_b) if x == y) / len(sig_a)
  explanation: A tiny signature stands in for a whole document when you are hunting for near-duplicates.
commonMistakes:
- title: Biased shuffles
  explanation: Swap position i only with positions from 0 to i (Fisher-Yates). Swapping with any position makes some orders more likely.
- title: Using Python's built-in hash for sketches
  explanation: String hashing is randomised per run; use your own stable hash so results are repeatable.
- title: Expecting a Bloom filter to delete
  explanation: Clearing a bit might remove other items; standard filters only add.
- title: Treating a Bloom 'yes' as certain
  explanation: Yes means probably; only 'no' is certain.
- title: Forgetting to seed in tests
  explanation: Unseeded randomness makes failures impossible to reproduce.
summary:
- Random choices give good expected time on every input (quicksort, quickselect).
- Fisher-Yates shuffles uniformly; reservoir sampling draws a fair sample from a stream.
- Bloom filters give fast membership tests with no false negatives and a tunable false positive rate.
- Count-min sketches and Misra-Gries summarize frequencies in tiny memory.
- MinHash estimates set similarity from short signatures.
