exercises:
- id: random-pivot
  title: 'Random pivots: quicksort and quickselect'
  difficulty: 4
  prompt: 'Write `random_quicksort(values, seed=0)`: use `rng = random.Random(seed)`; sort recursively by picking `pivot = items[rng.randrange(len(items))]` and splitting into `smaller`, `equal` and `larger` lists; every call on a list with more than 1 item adds `len(items)` to a comparison counter. Return `(sorted_list, comparisons)` and do not change the input. Write `quickselect(values, k, seed=0)`: the k-th smallest value (`k = 0` is the smallest) by choosing a random pivot, splitting the same way and continuing in the part that contains position `k` (`ValueError` unless `0 <= k < len(values)`).'
  starter: |-
    import random


    def random_quicksort(values, seed=0):
        """Sort with quicksort using a RANDOM pivot (rng = random.Random(seed); pivot = values[rng.randrange(len(values))]).
        Split into smaller, equal and larger lists, sort smaller and larger recursively. Return (sorted list, comparisons) where every call
        on a list with more than 1 item adds len(that list) to the comparison count. The input list is not changed."""
        pass


    def quickselect(values, k, seed=0):
        """The k-th smallest value (k = 0 is the smallest) in expected O(n) time: choose a random pivot, split into smaller / equal / larger,
        and continue in whichever part contains position k. ValueError unless 0 <= k < len(values)."""
        pass
  tests:
  - name: sorting
    code: |
      import random
      rng = random.Random(1)
      data = [rng.randrange(0, 100) for _ in range(300)]
      copy = list(data)
      result, count = random_quicksort(data, 5)
      assert result == sorted(data) and data == copy
      assert random_quicksort([], 0) == ([], 0) and random_quicksort([7], 0) == ([7], 0)
      assert random_quicksort([3, 3, 3, 3], 0)[0] == [3, 3, 3, 3]
      assert random_quicksort([2, 1], 3)[0] == [1, 2]
  - name: random pivots beat bad inputs
    code: |
      n = 1000
      ordered = list(range(n))
      _, c1 = random_quicksort(ordered, 1)
      _, c2 = random_quicksort(ordered[::-1], 2)
      assert c1 < 25 * n and c2 < 25 * n
      assert random_quicksort(ordered, 1) == random_quicksort(ordered, 1)
      assert all(random_quicksort(list(range(200)), s)[1] < 8000 for s in range(10))
      same = random_quicksort([5] * 500, 0)[1]
      assert same == 500
  - name: quickselect
    code: |
      import random
      rng = random.Random(4)
      data = [rng.randrange(0, 50) for _ in range(101)]
      ordered = sorted(data)
      before = list(data)
      for k in (0, 1, 50, 99, 100):
          assert quickselect(data, k, 7) == ordered[k]
      assert quickselect([9], 0) == 9
      assert quickselect([4, 4, 4], 2) == 4
      for k in (-1, 3):
          try:
              quickselect([1, 2, 3], k)
              raise AssertionError("accepted")
          except ValueError:
              pass
      assert data == before
  hints:
  - The pivot is chosen at random so no particular input is always bad.
  solution: |
    import random


    def random_quicksort(values, seed=0):
        """Sort with quicksort using a RANDOM pivot (rng = random.Random(seed); pivot = values[rng.randrange(len(values))]).
        Split into smaller, equal and larger lists, sort smaller and larger recursively. Return (sorted list, comparisons) where every call
        on a list with more than 1 item adds len(that list) to the comparison count. The input list is not changed."""
        rng = random.Random(seed)
        count = 0

        def sort(items):
            nonlocal count
            if len(items) <= 1:
                return items
            count += len(items)
            pivot = items[rng.randrange(len(items))]
            smaller = [x for x in items if x < pivot]
            equal = [x for x in items if x == pivot]
            larger = [x for x in items if x > pivot]
            return sort(smaller) + equal + sort(larger)

        return sort(list(values)), count


    def quickselect(values, k, seed=0):
        """The k-th smallest value (k = 0 is the smallest) in expected O(n) time: choose a random pivot, split into smaller / equal / larger,
        and continue in whichever part contains position k. ValueError unless 0 <= k < len(values)."""
        if not 0 <= k < len(values):
            raise ValueError("k out of range")
        rng = random.Random(seed)
        items = list(values)
        while True:
            pivot = items[rng.randrange(len(items))]
            smaller = [x for x in items if x < pivot]
            equal = [x for x in items if x == pivot]
            if k < len(smaller):
                items = smaller
            elif k < len(smaller) + len(equal):
                return pivot
            else:
                k -= len(smaller) + len(equal)
                items = [x for x in items if x > pivot]
  explanation: Randomness gives good expected time on every input, not just on lucky ones.
- id: sampling
  title: Shuffles and reservoir sampling
  difficulty: 4
  prompt: 'Write `fisher_yates(items, seed=0)`: copy the list, use `rng = random.Random(seed)`, and for `i` from the last index down to 1 swap `out[i]` with `out[j]` where `j = rng.randrange(i + 1)`; return the new list. Write `reservoir_sample(stream, k, seed=0)`: choose `k` items uniformly at random from a stream of unknown length while storing only `k` items: keep the first `k`; for the item with index `i >= k` draw `j = rng.randrange(i + 1)` and, if `j < k`, put the item in `reservoir[j]`. `ValueError` if `k < 0`; if the stream has fewer than `k` items return them all.'
  starter: |-
    import random


    def fisher_yates(items, seed=0):
        """A uniformly random shuffle (rng = random.Random(seed)): for i from the last index down to 1 swap items[i] with items[j],
        where j = rng.randrange(i + 1). Return a new list; do not change the input."""
        pass


    def reservoir_sample(stream, k, seed=0):
        """Choose k items uniformly at random from a stream of unknown length, seeing each item once and storing only k. Keep the first k;
        for the item with index i >= k, draw j = rng.randrange(i + 1) and if j < k replace reservoir[j] with the item.
        ValueError if k < 0. If the stream has fewer than k items return them all."""
        pass
  tests:
  - name: shuffle
    code: |
      data = list(range(20))
      s = fisher_yates(data, 3)
      assert sorted(s) == data and s != data and data == list(range(20))
      assert fisher_yates(data, 3) == s and fisher_yates(data, 4) != s
      assert fisher_yates([], 0) == [] and fisher_yates([1], 0) == [1]
  - name: fair shuffle
    code: |
      from collections import Counter
      counts = Counter()
      for seed in range(3000):
          counts[tuple(fisher_yates([1, 2, 3], seed))] += 1
      assert len(counts) == 6
      assert all(400 < c < 600 for c in counts.values()), counts
  - name: reservoir
    code: |
      assert reservoir_sample(range(3), 5) == [0, 1, 2]
      assert reservoir_sample(range(100), 0) == []
      r = reservoir_sample(range(1000), 10, 1)
      assert len(r) == 10 and len(set(r)) == 10 and all(0 <= x < 1000 for x in r)
      assert reservoir_sample(range(1000), 10, 1) == r
      try:
          reservoir_sample([1], -1)
          raise AssertionError("accepted")
      except ValueError:
          pass
      from collections import Counter
      hits = Counter()
      for seed in range(2000):
          for x in reservoir_sample(range(10), 3, seed):
              hits[x] += 1
      assert all(520 < hits[x] < 680 for x in range(10)), hits
  hints:
  - Item i replaces a stored item with probability k / (i + 1), which keeps every item equally likely.
  solution: |
    import random


    def fisher_yates(items, seed=0):
        """A uniformly random shuffle (rng = random.Random(seed)): for i from the last index down to 1 swap items[i] with items[j],
        where j = rng.randrange(i + 1). Return a new list; do not change the input."""
        rng = random.Random(seed)
        out = list(items)
        for i in range(len(out) - 1, 0, -1):
            j = rng.randrange(i + 1)
            out[i], out[j] = out[j], out[i]
        return out


    def reservoir_sample(stream, k, seed=0):
        """Choose k items uniformly at random from a stream of unknown length, seeing each item once and storing only k. Keep the first k;
        for the item with index i >= k, draw j = rng.randrange(i + 1) and if j < k replace reservoir[j] with the item.
        ValueError if k < 0. If the stream has fewer than k items return them all."""
        if k < 0:
            raise ValueError("k must not be negative")
        rng = random.Random(seed)
        reservoir = []
        for i, item in enumerate(stream):
            if i < k:
                reservoir.append(item)
            else:
                j = rng.randrange(i + 1)
                if j < k:
                    reservoir[j] = item
        return reservoir
  explanation: A random sample of a huge stream needs memory for only k items.
- id: bloom
  title: Bloom filters
  difficulty: 4
  prompt: 'A **Bloom filter** answers ''have I seen this?'' using very little memory, with occasional false ''yes'' answers and never a false ''no''. The starter has `stable_hash(item, seed)` (a hash that is the same on every run). Write `bloom_new(m)` (a list of `m` zeros; `ValueError` if `m < 1`), `bloom_add(bits, item, k)` (set `k` bits at positions `stable_hash(item, i) % len(bits)` for `i` in `range(k)`), `bloom_contains(bits, item, k)` (True only if all `k` of those bits are set), `expected_false_positive_rate(m, n, k)` (the theory: `(1 - e**(-k * n / m)) ** k`) and `best_hash_count(m, n)` (`round(m / n * ln 2)`, at least 1).'
