        """False means DEFINITELY not added; True means PROBABLY added (all k bits are set)."""
        pass


    def expected_false_positive_rate(m, n, k):
        """The theoretical chance that an item never added tests as present, after n items were added to m bits using k hashes:
        (1 - e^(-k * n / m)) ^ k."""
        pass


    def best_hash_count(m, n):
        """The number of hash functions that minimises the false positive rate: round((m / n) * ln 2), at least 1."""
        pass
  tests:
  - name: no false negatives
    code: |
      bits = bloom_new(500)
      words = ["apple", "banana", "cherry", "date", "elderberry", "fig", "grape"]
      for w in words:
          bloom_add(bits, w, 4)
      assert all(bloom_contains(bits, w, 4) for w in words)
      assert not bloom_contains(bloom_new(100), "anything", 3)
      try:
          bloom_new(0)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: false positives match the theory
    code: |
      m, n, k = 1000, 100, 7
      bits = bloom_new(m)
      for i in range(n):
          bloom_add(bits, "member-%d" % i, k)
      assert all(bloom_contains(bits, "member-%d" % i, k) for i in range(n))
      false = sum(bloom_contains(bits, "stranger-%d" % i, k) for i in range(4000))
      rate = false / 4000
      assert abs(rate - expected_false_positive_rate(m, n, k)) < 0.01, rate
      assert rate < 0.03
  - name: theory
    code: |
      assert abs(expected_false_positive_rate(1000, 100, 7) - 0.00819) < 0.0005
      assert expected_false_positive_rate(1000, 0, 5) == 0
      assert best_hash_count(1000, 100) == 7
      assert best_hash_count(8, 100) == 1
      assert expected_false_positive_rate(1000, 100, 7) < expected_false_positive_rate(1000, 100, 1)
  hints:
  - Never-set bits prove an item is absent; all-set bits only suggest it is present.
  solution: |
    import math


    def stable_hash(item, seed=0):
        """A hash that is the same on every run (Python's built-in hash for strings is randomised): FNV-1a over str(item) with a seed mixed in, then a few shifts and multiplications so that the bits are well scrambled."""
        h = (2166136261 ^ (seed * 2654435761)) % 2 ** 32
        for ch in str(item):
            h = ((h ^ ord(ch)) * 16777619) % 2 ** 32
        h ^= h >> 16
        h = (h * 2246822507) % 2 ** 32
        h ^= h >> 13
        h = (h * 3266489909) % 2 ** 32
        h ^= h >> 16
        return h

    def bloom_new(m):
        """A Bloom filter: a list of m bits, all 0. ValueError if m < 1."""
        if m < 1:
            raise ValueError("need at least one bit")
        return [0] * m


    def bloom_add(bits, item, k):
        """Set k bits: for i in range(k), position stable_hash(item, i) % len(bits)."""
        for i in range(k):
            bits[stable_hash(item, i) % len(bits)] = 1


    def bloom_contains(bits, item, k):
        """False means DEFINITELY not added; True means PROBABLY added (all k bits are set)."""
        return all(bits[stable_hash(item, i) % len(bits)] for i in range(k))


    def expected_false_positive_rate(m, n, k):
        """The theoretical chance that an item never added tests as present, after n items were added to m bits using k hashes:
        (1 - e^(-k * n / m)) ^ k."""
        return (1 - math.exp(-k * n / m)) ** k


    def best_hash_count(m, n):
        """The number of hash functions that minimises the false positive rate: round((m / n) * ln 2), at least 1."""
        return max(1, round(m / n * math.log(2)))
  explanation: A few bits per item buy a fast membership test with a small, tunable error.
- id: sketches
  title: Count-min sketch and heavy hitters
  difficulty: 5
  prompt: 'The starter has `stable_hash`. Write `cm_new(width, depth)` (`depth` rows of `width` zero counters), `cm_add(table, item, count=1)` (for every row `r` add `count` to column `stable_hash(item, r) % width`) and `cm_estimate(table, item)` (the minimum of the item''s counters: it can only overestimate, never underestimate). Write `misra_gries(stream, k)` (`ValueError` if `k < 2`): keep at most `k - 1` counters; for each item `x`, if `x` has a counter add 1; else if fewer than `k - 1` counters exist start `x` at 1; otherwise subtract 1 from every counter and delete the ones that reach 0. Return the counter dictionary. Every item occurring more than `len(stream) / k` times is guaranteed to survive.'
  starter: |-
    import math


    def stable_hash(item, seed=0):
        h = (2166136261 ^ (seed * 2654435761)) % 2 ** 32
        for ch in str(item):
            h = ((h ^ ord(ch)) * 16777619) % 2 ** 32
        h ^= h >> 16
        h = (h * 2246822507) % 2 ** 32
        h ^= h >> 13
        h = (h * 3266489909) % 2 ** 32
        h ^= h >> 16
        return h

    def cm_new(width, depth):
        """A count-min sketch: `depth` rows of `width` counters, all 0."""
        pass


    def cm_add(table, item, count=1):
        """Add `count` to one counter per row: row r, column stable_hash(item, r) % width."""
        pass


    def cm_estimate(table, item):
        """The smallest of the item's counters. It never underestimates (other items only add), so the minimum is closest."""
        pass


    def misra_gries(stream, k):
        """Find the frequent items of a stream with at most k - 1 counters. For each item x: if x has a counter, add 1; else if fewer than
        k - 1 counters exist, start x at 1; otherwise subtract 1 from every counter and delete those that reach 0. Return the counter
        dictionary. Every item that occurs more than len(stream) / k times is guaranteed to be in it. ValueError if k < 2."""
        pass
  tests:
  - name: count-min sketch
    code: |
      import random
      rng = random.Random(3)
      stream = [rng.choice("aaaabbbcc") + str(rng.randrange(3)) for _ in range(500)] + ["hot"] * 120
      table = cm_new(50, 4)
      truth = {}
      for x in stream:
          cm_add(table, x)
          truth[x] = truth.get(x, 0) + 1
      for x, c in truth.items():
          assert cm_estimate(table, x) >= c
      assert cm_estimate(table, "hot") >= 120
      assert cm_estimate(table, "hot") < 120 + 60
      assert cm_estimate(cm_new(10, 3), "unseen") == 0
      t = cm_new(20, 3)
      cm_add(t, "x", 5)
      assert cm_estimate(t, "x") == 5
  - name: heavy hitters
    code: |
      stream = ["a"] * 60 + ["b"] * 25 + list("cdefghijklmnopqrstuvwxyz")[:15]
      import random
      random.Random(1).shuffle(stream)
      found = misra_gries(stream, 4)
      assert "a" in found and len(found) <= 3
      found2 = misra_gries(["x", "y", "x", "z", "x", "w", "x"], 2)
      assert "x" in found2 and len(found2) <= 1
      assert misra_gries([], 3) == {}
      assert misra_gries([1, 1, 1], 2) == {1: 3}
      try:
          misra_gries([1], 1)
          raise AssertionError("accepted")
      except ValueError:
          pass
  - name: guarantee on random streams
    code: |
      import random
      rng = random.Random(7)
      for _ in range(50):
          stream = [rng.choice([1, 1, 1, 2, 3, 4, 5, 6]) for _ in range(rng.randrange(20, 80))]
          for k in (2, 3, 5):
              found = misra_gries(stream, k)
              assert len(found) <= k - 1
              for item in set(stream):
                  if stream.count(item) > len(stream) / k:
                      assert item in found
  hints:
  - Subtracting 1 from every counter throws away k distinct items at once, which can only happen n / k times.
  solution: |
    import math


    def stable_hash(item, seed=0):
        h = (2166136261 ^ (seed * 2654435761)) % 2 ** 32
        for ch in str(item):
            h = ((h ^ ord(ch)) * 16777619) % 2 ** 32
        h ^= h >> 16
        h = (h * 2246822507) % 2 ** 32
        h ^= h >> 13
        h = (h * 3266489909) % 2 ** 32
        h ^= h >> 16
        return h

    def cm_new(width, depth):
        """A count-min sketch: `depth` rows of `width` counters, all 0."""
        return [[0] * width for _ in range(depth)]


    def cm_add(table, item, count=1):
        """Add `count` to one counter per row: row r, column stable_hash(item, r) % width."""
        width = len(table[0])
        for r, row in enumerate(table):
            row[stable_hash(item, r) % width] += count


    def cm_estimate(table, item):
        """The smallest of the item's counters. It never underestimates (other items only add), so the minimum is closest."""
        width = len(table[0])
        return min(row[stable_hash(item, r) % width] for r, row in enumerate(table))


    def misra_gries(stream, k):
        """Find the frequent items of a stream with at most k - 1 counters. For each item x: if x has a counter, add 1; else if fewer than
        k - 1 counters exist, start x at 1; otherwise subtract 1 from every counter and delete those that reach 0. Return the counter
        dictionary. Every item that occurs more than len(stream) / k times is guaranteed to be in it. ValueError if k < 2."""
        if k < 2:
            raise ValueError("k must be at least 2")
        counters = {}
        for x in stream:
            if x in counters:
                counters[x] += 1
            elif len(counters) < k - 1:
                counters[x] = 1
            else:
                for key in list(counters):
                    counters[key] -= 1
                    if counters[key] == 0:
                        del counters[key]
        return counters
  explanation: Sketches summarize enormous streams in tiny, fixed memory with a known error.
