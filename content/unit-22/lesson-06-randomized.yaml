id: u22-randomized
title: Randomized and Streaming Algorithms
minutes: 90
objective: 'Learn how a little randomness makes algorithms faster, simpler and able to work on data too big to store: random pivots, fair shuffles and sampling, Bloom filters, count-min sketches, and MinHash for finding near-duplicate documents. This builds directly on the probability you studied.'
outcomes:
- Explain expected-time guarantees of randomized algorithms
- Implement a fair shuffle and reservoir sampling
- Build a Bloom filter and predict its false positive rate
- Count and find frequent items in a stream with small memory
- Estimate set similarity with MinHash
sections:
- heading: Randomness as a tool
  body: |-
    Why would a deterministic, logical machine want to flip coins? Because a random choice can defeat a hostile or unlucky input. Quicksort picks a **pivot** (a value to split the list around). If you always take the first element, an already sorted list is the worst case and takes `n squared` steps. If you choose the pivot at *random*, no input is systematically bad: the **expected** running time (the average over the algorithm's own random choices, not over inputs) is `O(n log n)` for *every* input. We call it a **Las Vegas algorithm** when the answer is always correct and only the running time is random. **Quickselect** uses the same idea to find the k-th smallest value, such as the median, in expected `O(n)` time, without sorting everything.

    Randomness also gives fairness. A **shuffle** must make every ordering equally likely. The **Fisher-Yates shuffle** does it: go from the end of the list downwards, swapping each position with a random position at or before it. A common wrong version, swapping each item with a random position anywhere in the list, produces uneven results; this subtle bug has appeared in real card games. With `n` items there are `n!` orderings, and Fisher-Yates reaches each with probability exactly `1/n!`. Be sure to seed random generators when you need *reproducible* results, as in the tests.
- heading: Streams and sampling
  body: |-
    Sometimes data arrives as a **stream**: too large to keep, such as every search on a website today, or sensor readings that never stop. You see each item once, and you have only a little memory. **Reservoir sampling** picks `k` items uniformly at random from a stream whose length you do not know in advance. Keep the first `k` items. The item at position `i` (counting from 0) then replaces a random stored item with probability `k/(i+1)`. A short calculation shows that at every moment each item seen so far is in the sample with equal probability, and you only ever store `k` items.

    **Streaming algorithms** extend this idea: answer questions about huge data with memory far smaller than the data. The **Misra-Gries** algorithm finds frequently occurring items using only `k - 1` counters. It keeps a counter for each candidate, and when a new item arrives with no free counter it lowers *every* counter by one (this cancels `k` different items at once, which can happen at most `n/k` times), so any item occurring more than `n/k` times must survive. A **count-min sketch** estimates how many times any item occurred, using a small table: several rows, each with its own hash function, and `item` adds 1 to one cell per row. Collisions can only add extra counts, so the estimate (the *minimum* over the rows) never underestimates and is usually close.
- heading: Bloom filters and MinHash
  body: |-
    A **Bloom filter** answers "have I seen this item?" with very little memory. It is just an array of bits (0 or 1) and several hash functions. To **add** an item, set the bits at the positions given by its hashes. To **ask**, look at those same positions: if any bit is 0 the item was *definitely never added* (no false negatives); if all are 1 it was *probably* added, but other items might have set those bits by coincidence (a **false positive**). The false positive rate is about `(1 - e^(-kn/m))^k` for `m` bits, `n` items and `k` hash functions, so you can choose `m` to hit a target such as 1 percent. Browsers use Bloom filters to check URLs against lists of dangerous sites, and databases use them to skip disk reads for keys that are not there.

    Finally, **MinHash** finds near-duplicate documents. Cut a document into overlapping pieces called **shingles** (every run of `k` letters or words), giving a set. The **Jaccard similarity** of two sets, overlap divided by union, measures how alike they are. Comparing every pair of a million documents is impossible, but here is the trick: hash every element of a set with a random hash function and keep the *minimum* hash. For two sets, the chance their minimums are equal is exactly their Jaccard similarity. Repeat with 100 hash functions to build a short **signature**, and the fraction of matching positions estimates the similarity, from a 100-number summary instead of the whole document. Search engines use this to detect duplicate web pages.
examples:
- title: Random pivots and fair samples
  intro: Sorting a sorted list safely, selecting the smallest items, shuffling and sampling a stream.
  code: |
    import random


    def random_quicksort(values, seed=0):
        """Sort with quicksort using a RANDOM pivot (rng = random.Random(seed); pivot = values[rng.randrange(len(values))]).
        Split into smaller, equal and larger lists, sort smaller and larger recursively. Return (sorted list, comparisons) where every call
        on a list with more than 1 item adds len(that list) to the comparison count. The input list is not changed."""
        rng = random.Random(seed)
        count = 0

        def sort(items):
            nonlocal count
            if len(items) <= 1:
                return items
            count += len(items)
            pivot = items[rng.randrange(len(items))]
            smaller = [x for x in items if x < pivot]
            equal = [x for x in items if x == pivot]
            larger = [x for x in items if x > pivot]
            return sort(smaller) + equal + sort(larger)

        return sort(list(values)), count


    def quickselect(values, k, seed=0):
        """The k-th smallest value (k = 0 is the smallest) in expected O(n) time: choose a random pivot, split into smaller / equal / larger,
        and continue in whichever part contains position k. ValueError unless 0 <= k < len(values)."""
        if not 0 <= k < len(values):
            raise ValueError("k out of range")
        rng = random.Random(seed)
        items = list(values)
        while True:
            pivot = items[rng.randrange(len(items))]
            smaller = [x for x in items if x < pivot]
            equal = [x for x in items if x == pivot]
            if k < len(smaller):
                items = smaller
            elif k < len(smaller) + len(equal):
                return pivot
            else:
                k -= len(smaller) + len(equal)
                items = [x for x in items if x > pivot]


    def fisher_yates(items, seed=0):
        """A uniformly random shuffle (rng = random.Random(seed)): for i from the last index down to 1 swap items[i] with items[j],
        where j = rng.randrange(i + 1). Return a new list; do not change the input."""
        rng = random.Random(seed)
        out = list(items)
        for i in range(len(out) - 1, 0, -1):
            j = rng.randrange(i + 1)
            out[i], out[j] = out[j], out[i]
        return out


    def reservoir_sample(stream, k, seed=0):
        """Choose k items uniformly at random from a stream of unknown length, seeing each item once and storing only k. Keep the first k;
        for the item with index i >= k, draw j = rng.randrange(i + 1) and if j < k replace reservoir[j] with the item.
        ValueError if k < 0. If the stream has fewer than k items return them all."""
        if k < 0:
            raise ValueError("k must not be negative")
        rng = random.Random(seed)
        reservoir = []
        for i, item in enumerate(stream):
            if i < k:
                reservoir.append(item)
            else:
                j = rng.randrange(i + 1)
                if j < k:
                    reservoir[j] = item
        return reservoir

    data = list(range(2000))
    _, steps = random_quicksort(data, seed=1)
    print("sorting an already sorted list of 2000 used", steps, "comparisons (a naive pivot would use about 2,000,000)")
    print("the 3 smallest of a shuffled list:", [quickselect(fisher_yates(data, 5), k, 9) for k in range(3)])
    print("random sample of 5 from a stream of a million:", reservoir_sample(range(1_000_000), 5, seed=2))
    print("shuffled deck of 8:", fisher_yates(list(range(8)), seed=4))
  output: |
    sorting an already sorted list of 2000 used 24423 comparisons (a naive pivot would use about 2,000,000)
    the 3 smallest of a shuffled list: [0, 1, 2]
    random sample of 5 from a stream of a million: [436442, 967572, 724012, 190270, 806412]
    shuffled deck of 8: [1, 6, 5, 4, 7, 0, 2, 3]
  lines:
  - line: 75
    note: Random pivots avoid the worst case.
  - line: 77
    note: Fair sample from a million items using five slots.
- title: Filters, sketches and MinHash
  intro: A Bloom filter's false alarms match the theory; count words in a tiny table; estimate document similarity.
  code: |
    import random


    import math


    def stable_hash(item, seed=0):
        """A hash that is the same on every run (Python's built-in hash for strings is randomised): FNV-1a over str(item) with a seed mixed in, then a few shifts and multiplications so that the bits are well scrambled."""
        h = (2166136261 ^ (seed * 2654435761)) % 2 ** 32
        for ch in str(item):
            h = ((h ^ ord(ch)) * 16777619) % 2 ** 32
        h ^= h >> 16
        h = (h * 2246822507) % 2 ** 32
        h ^= h >> 13
        h = (h * 3266489909) % 2 ** 32
        h ^= h >> 16
        return h


    def bloom_new(m):
        """A Bloom filter: a list of m bits, all 0. ValueError if m < 1."""
        if m < 1:
            raise ValueError("need at least one bit")
        return [0] * m


    def bloom_add(bits, item, k):
        """Set k bits: for i in range(k), position stable_hash(item, i) % len(bits)."""
        for i in range(k):
            bits[stable_hash(item, i) % len(bits)] = 1


    def bloom_contains(bits, item, k):
        """False means DEFINITELY not added; True means PROBABLY added (all k bits are set)."""
        return all(bits[stable_hash(item, i) % len(bits)] for i in range(k))


    def expected_false_positive_rate(m, n, k):
        """The theoretical chance that an item never added tests as present, after n items were added to m bits using k hashes:
        (1 - e^(-k * n / m)) ^ k."""
        return (1 - math.exp(-k * n / m)) ** k


    def best_hash_count(m, n):
        """The number of hash functions that minimises the false positive rate: round((m / n) * ln 2), at least 1."""
        return max(1, round(m / n * math.log(2)))


    def cm_new(width, depth):
        """A count-min sketch: `depth` rows of `width` counters, all 0."""
        return [[0] * width for _ in range(depth)]


    def cm_add(table, item, count=1):
        """Add `count` to one counter per row: row r, column stable_hash(item, r) % width."""
        width = len(table[0])
        for r, row in enumerate(table):
            row[stable_hash(item, r) % width] += count


    def cm_estimate(table, item):
        """The smallest of the item's counters. It never underestimates (other items only add), so the minimum is closest."""
        width = len(table[0])
        return min(row[stable_hash(item, r) % width] for r, row in enumerate(table))


    def misra_gries(stream, k):
        """Find the frequent items of a stream with at most k - 1 counters. For each item x: if x has a counter, add 1; else if fewer than
        k - 1 counters exist, start x at 1; otherwise subtract 1 from every counter and delete those that reach 0. Return the counter
        dictionary. Every item that occurs more than len(stream) / k times is guaranteed to be in it. ValueError if k < 2."""
        if k < 2:
            raise ValueError("k must be at least 2")
        counters = {}
        for x in stream:
            if x in counters:
                counters[x] += 1
            elif len(counters) < k - 1:
                counters[x] = 1
            else:
                for key in list(counters):
                    counters[key] -= 1
                    if counters[key] == 0:
                        del counters[key]
        return counters


    def jaccard(a, b):
        """The exact similarity of two collections treated as sets: size of the overlap divided by size of the union (1.0 if both are empty)."""
        a, b = set(a), set(b)
        union = a | b
        return len(a & b) / len(union) if union else 1.0


    def shingles(text, k):
        """The set of all substrings of length k (k-shingles). ValueError if k < 1; empty set if the text is shorter than k."""
        if k < 1:
            raise ValueError("k must be at least 1")
        return {text[i:i + k] for i in range(len(text) - k + 1)}


    def minhash_signature(items, num_hashes, seed=0):
        """A short fingerprint of a set. With P = 2**61 - 1 and rng = random.Random(seed), make num_hashes pairs (a, b) with
        a = rng.randrange(1, P) and b = rng.randrange(0, P). Position i of the signature is the minimum over the items of
        (a * stable_hash(item) + b) % P. ValueError for an empty collection."""
        items = set(items)
        if not items:
            raise ValueError("empty set")
        P = 2 ** 61 - 1
        rng = random.Random(seed)
        params = [(rng.randrange(1, P), rng.randrange(0, P)) for _ in range(num_hashes)]
        hashed = [stable_hash(x) for x in items]
        return [min((a * h + b) % P for h in hashed) for a, b in params]


    def estimate_jaccard(sig_a, sig_b):
        """The fraction of positions where two signatures agree: an estimate of the Jaccard similarity. ValueError if lengths differ or are 0."""
        if len(sig_a) != len(sig_b) or not sig_a:
            raise ValueError("signatures must have the same non-zero length")
        return sum(1 for x, y in zip(sig_a, sig_b) if x == y) / len(sig_a)

    bits = bloom_new(2000)
    seen = ["user%d" % i for i in range(200)]
    for name in seen:
        bloom_add(bits, name, 6)
    print("known user found:", bloom_contains(bits, "user7", 6))
    wrong = sum(bloom_contains(bits, "other%d" % i, 6) for i in range(1000))
    print("false alarms among 1000 strangers:", wrong, " theory predicts about", round(1000 * expected_false_positive_rate(2000, 200, 6)))
    words = "the cat sat on the mat and the cat sat on the hat".split()
    table = cm_new(40, 4)
    for w in words:
        cm_add(table, w)
    print("estimated count of 'the':", cm_estimate(table, "the"), " 'cat':", cm_estimate(table, "cat"))
    print("candidates for frequent words (anything above 13/4 uses must be here):", misra_gries(words, 4))
    a = shingles("data structures and algorithms", 3)
    b = shingles("data structure and algorithm", 3)
    print("exact similarity:", round(jaccard(a, b), 3))
    print("estimated from 200 numbers:", round(estimate_jaccard(minhash_signature(a, 200, 1), minhash_signature(b, 200, 1)), 3))
  output: |
    known user found: True
    false alarms among 1000 strangers: 9  theory predicts about 8
    estimated count of 'the': 4  'cat': 2
    candidates for frequent words (anything above 13/4 uses must be here): {'the': 1}
    exact similarity: 0.8
    estimated from 200 numbers: 0.79
