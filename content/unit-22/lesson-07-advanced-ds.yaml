- id: segment
  title: Segment trees
  difficulty: 5
  prompt: 'A **segment tree** answers range questions (sum, minimum, maximum, gcd) and supports updates, each in `O(log n)`. Write `seg_build(values, combine, identity)`: a list of `2n` slots where the leaves sit at positions `n .. 2n - 1` and inner node `i` holds `combine(tree[2*i], tree[2*i + 1])` (`identity` is the neutral value, such as 0 for sums and infinity for minimums; `combine` is associative and commutative). Write `seg_update(tree, i, value, combine)` (set leaf `i + n`, then recompute the parents up to the root; `ValueError` if `i` is outside `0 <= i < n`) and `seg_query(tree, lo, hi, combine, identity)`: the combination of positions `lo` up to but not including `hi`: with `l = lo + n` and `r = hi + n`, while `l < r`: if `l` is odd use `tree[l]` and add 1 to `l`; if `r` is odd subtract 1 from `r` and use `tree[r]`; then halve both. An empty range returns `identity`; `ValueError` unless `0 <= lo <= hi <= n`.'
