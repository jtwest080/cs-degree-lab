    code: |
      vals = [3, 2, -1, 6, 5, 4, -3, 3, 7, 2]
      t = fenwick_build(vals)
      for c in range(len(vals) + 1):
          assert fenwick_prefix(t, c) == sum(vals[:c])
      assert fenwick_range(t, 2, 7) == sum(vals[2:7]) and fenwick_range(t, 4, 4) == 0
      assert fenwick_build([]) == [0] and fenwick_prefix(fenwick_build([]), 0) == 0
  - name: updates
    code: |
