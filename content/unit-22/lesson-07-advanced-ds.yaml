    def sparse_build(values):
        """A sparse table for range-minimum queries. table[j][i] = the minimum of the 2**j values starting at i. Level 0 is the values;
        level j is built from level j - 1 as min(prev[i], prev[i + 2**(j-1)]), for every i where the block fits."""
        n = len(values)
        table = [list(values)]
        j = 1
        while (1 << j) <= n:
            prev = table[-1]
            half = 1 << (j - 1)
            table.append([min(prev[i], prev[i + half]) for i in range(n - (1 << j) + 1)])
            j += 1
        return table


    def sparse_query(table, lo, hi):
        """The minimum of values[lo..hi] (both included) in O(1): with k = floor(log2(hi - lo + 1)), the answer is
        min(table[k][lo], table[k][hi - 2**k + 1]); the two blocks may overlap, which is fine for a minimum.
        ValueError unless 0 <= lo <= hi < n."""
        if not table or not 0 <= lo <= hi < len(table[0]):
            raise ValueError("bad range")
        k = (hi - lo + 1).bit_length() - 1
        return min(table[k][lo], table[k][hi - (1 << k) + 1])
  explanation: Pay once to precompute, then answer each minimum in a single step.
