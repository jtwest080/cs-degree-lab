- title: Fixed data and clever applications
  intro: Sparse table, 2D prefix sums, difference arrays, sliding minimum, increasing subsequence and inversions.
  code: |
    def sparse_build(values):
        """A sparse table for range-minimum queries. table[j][i] = the minimum of the 2**j values starting at i. Level 0 is the values;
        level j is built from level j - 1 as min(prev[i], prev[i + 2**(j-1)]), for every i where the block fits."""
        n = len(values)
        table = [list(values)]
        j = 1
        while (1 << j) <= n:
            prev = table[-1]
            half = 1 << (j - 1)
            table.append([min(prev[i], prev[i + half]) for i in range(n - (1 << j) + 1)])
            j += 1
        return table


    def sparse_query(table, lo, hi):
        """The minimum of values[lo..hi] (both included) in O(1): with k = floor(log2(hi - lo + 1)), the answer is
        min(table[k][lo], table[k][hi - 2**k + 1]); the two blocks may overlap, which is fine for a minimum.
        ValueError unless 0 <= lo <= hi < n."""
        if not table or not 0 <= lo <= hi < len(table[0]):
            raise ValueError("bad range")
        k = (hi - lo + 1).bit_length() - 1
        return min(table[k][lo], table[k][hi - (1 << k) + 1])


    def prefix_sums_2d(grid):
        """A table P with one extra row and column of zeros, where P[r][c] is the sum of all grid cells above row r and left of column c
        (rows 0..r-1 and columns 0..c-1). Build with P[r + 1][c + 1] = grid[r][c] + P[r][c + 1] + P[r + 1][c] - P[r][c]."""
        rows = len(grid)
        cols = len(grid[0]) if rows else 0
        P = [[0] * (cols + 1) for _ in range(rows + 1)]
        for r in range(rows):
            for c in range(cols):
                P[r + 1][c + 1] = grid[r][c] + P[r][c + 1] + P[r + 1][c] - P[r][c]
        return P


    def rect_sum(P, r1, c1, r2, c2):
        """The sum of the grid cells in rows r1..r2 and columns c1..c2 (both ends included), from four table lookups."""
        return P[r2 + 1][c2 + 1] - P[r1][c2 + 1] - P[r2 + 1][c1] + P[r1][c1]


    def apply_range_adds(n, updates):
        """Start with n zeros. Each update (lo, hi, amount) adds amount to every position lo..hi (both included). Use a difference array:
        add amount at diff[lo] and subtract it at diff[hi + 1]; finally a running total gives the values. All updates cost O(1) each."""
        diff = [0] * (n + 1)
        for lo, hi, amount in updates:
            diff[lo] += amount
            diff[hi + 1] -= amount
        out = []
        running = 0
        for i in range(n):
            running += diff[i]
            out.append(running)
        return out


    def fenwick_build(values):
        """A Fenwick tree (binary indexed tree) over the values, as a list with one unused slot at index 0. Build in O(n): put each
        value at tree[i] (positions start at 1), then add tree[i] into its parent tree[i + (i & -i)] when that position exists."""
        n = len(values)
        tree = [0] * (n + 1)
        for i, v in enumerate(values, 1):
            tree[i] += v
            parent = i + (i & -i)
            if parent <= n:
                tree[parent] += tree[i]
        return tree


    def fenwick_update(tree, i, delta):
        """Add delta to the value at position i (counting from 0): starting at i + 1, add to tree[j] and move to j + (j & -j) while j is
        inside the tree. ValueError unless 0 <= i < len(tree) - 1."""
        if not 0 <= i < len(tree) - 1:
            raise ValueError("index out of range")
        j = i + 1
        while j < len(tree):
            tree[j] += delta
            j += j & -j


    def fenwick_prefix(tree, count):
        """The sum of the first `count` values: add tree[j] and move to j - (j & -j) until j reaches 0. ValueError unless 0 <= count <= len(tree) - 1."""
        if not 0 <= count <= len(tree) - 1:
            raise ValueError("count out of range")
        total = 0
        j = count
        while j > 0:
            total += tree[j]
            j -= j & -j
        return total


    def fenwick_range(tree, lo, hi):
        """The sum of values[lo:hi] (lo included, hi excluded)."""
        return fenwick_prefix(tree, hi) - fenwick_prefix(tree, lo)


    from bisect import bisect_left
    from collections import deque


    def count_inversions(values):
        """How many pairs i < j have values[i] > values[j]? Replace each value by its rank (1 for the smallest distinct value), then go from the
        right: for each value, add the number of already-seen values with a smaller rank (a Fenwick prefix sum) and then record this value."""
        ranks = {v: i + 1 for i, v in enumerate(sorted(set(values)))}
        tree = fenwick_build([0] * len(ranks))
        total = 0
        for v in reversed(values):
            total += fenwick_prefix(tree, ranks[v] - 1)
            fenwick_update(tree, ranks[v] - 1, 1)
        return total


    def lis_length(values):
        """The length of the longest strictly increasing subsequence in O(n log n): keep `tails`, where tails[k] is the smallest possible last
        value of an increasing subsequence of length k + 1; for each value use bisect_left to find its place, replace or append."""
        tails = []
        for v in values:
            k = bisect_left(tails, v)
            if k == len(tails):
                tails.append(v)
            else:
                tails[k] = v
        return len(tails)


    def sliding_window_min(values, k):
        """The minimum of every window of k neighbouring values, in O(n): keep a deque of indexes whose values increase from front to
        back; drop indexes that left the window from the front and larger values from the back. ValueError if k < 1; [] if k > len(values)."""
        if k < 1:
            raise ValueError("k must be at least 1")
        window = deque()
        out = []
        for i, v in enumerate(values):
            while window and values[window[-1]] >= v:
                window.pop()
            window.append(i)
            if window[0] <= i - k:
                window.popleft()
            if i >= k - 1:
                out.append(values[window[0]])
        return out

    temps = [14, 11, 13, 9, 12, 8, 10, 7]
    table = sparse_build(temps)
    print("coldest between positions 1 and 4:", sparse_query(table, 1, 4))
    grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
    P = prefix_sums_2d(grid)
    print("sum of the lower right 2 by 2 square:", rect_sum(P, 1, 1, 2, 2))
    print("range additions:", apply_range_adds(6, [(1, 3, 5), (2, 5, 2)]))
    print("sliding minimum, window 3:", sliding_window_min(temps, 3))
    print("longest increasing subsequence length:", lis_length(temps))
    print("inversions in [3, 1, 2]:", count_inversions([3, 1, 2]))
  output: |
    coldest between positions 1 and 4: 9
    sum of the lower right 2 by 2 square: 28
    range additions: [0, 5, 7, 7, 2, 2]
    sliding minimum, window 3: [11, 9, 9, 8, 8, 7]
    longest increasing subsequence length: 2
    inversions in [3, 1, 2]: 2
