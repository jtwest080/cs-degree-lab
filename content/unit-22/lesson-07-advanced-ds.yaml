      t = fenwick_build(vals)
      fenwick_update(t, 2, 10)
      vals[2] += 10
      fenwick_update(t, 5, -7)
      vals[5] -= 7
      for lo in range(len(vals) + 1):
          for hi in range(lo, len(vals) + 1):
              assert fenwick_range(t, lo, hi) == sum(vals[lo:hi])
