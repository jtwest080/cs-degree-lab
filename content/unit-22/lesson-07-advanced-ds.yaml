id: u22-advanced-ds
title: Advanced Data Structures
minutes: 90
objective: 'Learn the structures that make range questions fast: Fenwick trees and segment trees for changing data, sparse tables and prefix sums for fixed data, and the clever uses of them in counting inversions, longest increasing subsequences and sliding windows. You will also learn how to analyse operations whose cost varies, called amortized analysis.'
outcomes:
- Use prefix sums and difference arrays
- Build and query a Fenwick tree
- Build a segment tree for any associative operation
- Choose between a segment tree and a sparse table
- Explain amortized analysis
sections:
- heading: Range questions and prefix sums
  body: |-
    Many programs ask **range queries**: "what is the total sales between day 40 and day 90?", "what is the lowest temperature in this window?". The naive answer loops over the range every time, costing `O(n)` per query, far too slow when there are a million queries. Data structures trade a little preparation for much faster queries.

    The simplest trick is the **prefix sum**: precompute `prefix[i]` = the sum of the first `i` values. Then the sum of any range is `prefix[hi] - prefix[lo]`, a single subtraction. In two dimensions the same idea gives the sum of any rectangle of a grid (an image, a map) from four lookups, using subtraction and then adding back the corner that was subtracted twice (this is the **inclusion-exclusion** principle from the counting unit). The mirror image is the **difference array**: to add a number to every position in a range, change just two entries (add at the start, subtract just after the end) and compute running totals at the end. Prefix sums are perfect when the data does not change. When values change between queries, we need something smarter.
- heading: Fenwick and segment trees
  body: |-
    A **Fenwick tree** (also called a **binary indexed tree**) supports both "change one value" and "sum of a prefix" in `O(log n)`. It stores, at position `j`, the total of a block of values whose size is the lowest set bit of `j` (written `j & -j`; in binary, the lowest 1). For example position 12 (binary `1100`) holds the sum of 4 values, and position 8 holds 8 values. To sum a prefix, add the blocks you hit while repeatedly removing the lowest set bit: at most `log n` of them. To update, move *up* by repeatedly *adding* the lowest set bit. It needs only a single list and about ten lines of code, which is why contestants love it.

    A **segment tree** is more general: it answers range sum, minimum, maximum, gcd or any **associative** operation (grouping does not matter: `(a op b) op c = a op (b op c)`). Imagine a tree where each node stores the answer for a segment of the array and its two children store the answer for the left and right halves. A query on any range needs only `O(log n)` nodes whose segments exactly tile the range; an update changes a leaf and recomputes its ancestors. The compact version stores the whole tree in a list of size `2n`: the leaves are at the end, and node `i` has children `2i` and `2i + 1`, exactly like a heap.
- heading: Sparse tables, amortization and applications
  body: |-
    If the data never changes and the question is "minimum of a range", a **sparse table** is faster still: after `O(n log n)` preparation each query takes constant time. It stores the minimum of every block of length 1, 2, 4, 8, ... starting at every position. Any range is covered by two overlapping blocks of the same power-of-two length, and overlap does not matter for a minimum (it would for a sum, which is why sums use prefix sums instead).

    Not every operation costs the same each time. **Amortized analysis** looks at the *average cost per operation over a whole sequence*, even if single operations are sometimes expensive. The dynamic array you built in the data structures unit is the standard example: appending is usually one step but occasionally copies everything, yet doubling the capacity makes the average cost per append constant. Another way to see it is as a bank account: cheap operations deposit "credits" that later pay for the rare expensive ones (the **potential method**). Union-find with path compression, the monotonic deque below, and splay trees are all analysed this way.

    These tools combine into powerful tricks. To **count inversions** (pairs of values in the wrong order, a measure of how unsorted a list is), replace values by their rank and use a Fenwick tree to count, for each element, how many smaller elements lie to its right. The **longest increasing subsequence** can be found in `O(n log n)` by keeping only the smallest possible tail for each length and using binary search. The **sliding window minimum** uses a deque of candidates that discards any value that can never be the minimum again, giving `O(n)` overall.
examples:
- title: Changing data
  intro: A Fenwick tree and a segment tree answering sums and minimums while values change.
  code: |
    def fenwick_build(values):
        """A Fenwick tree (binary indexed tree) over the values, as a list with one unused slot at index 0. Build in O(n): put each
        value at tree[i] (positions start at 1), then add tree[i] into its parent tree[i + (i & -i)] when that position exists."""
        n = len(values)
        tree = [0] * (n + 1)
        for i, v in enumerate(values, 1):
            tree[i] += v
            parent = i + (i & -i)
            if parent <= n:
                tree[parent] += tree[i]
        return tree


    def fenwick_update(tree, i, delta):
        """Add delta to the value at position i (counting from 0): starting at i + 1, add to tree[j] and move to j + (j & -j) while j is
        inside the tree. ValueError unless 0 <= i < len(tree) - 1."""
        if not 0 <= i < len(tree) - 1:
            raise ValueError("index out of range")
        j = i + 1
        while j < len(tree):
            tree[j] += delta
            j += j & -j


    def fenwick_prefix(tree, count):
        """The sum of the first `count` values: add tree[j] and move to j - (j & -j) until j reaches 0. ValueError unless 0 <= count <= len(tree) - 1."""
        if not 0 <= count <= len(tree) - 1:
            raise ValueError("count out of range")
        total = 0
        j = count
        while j > 0:
            total += tree[j]
            j -= j & -j
        return total


    def fenwick_range(tree, lo, hi):
        """The sum of values[lo:hi] (lo included, hi excluded)."""
        return fenwick_prefix(tree, hi) - fenwick_prefix(tree, lo)


    def seg_build(values, combine, identity):
        """An iterative segment tree: a list of 2n slots where the leaves (the values) sit at positions n .. 2n - 1 and every inner node i
        holds combine(tree[2i], tree[2i + 1]). `combine` must be associative and commutative (sum, min, max, gcd ...) and `identity` is its
        neutral element (0 for sum, infinity for min)."""
        n = len(values)
        tree = [identity] * n + list(values)
        for i in range(n - 1, 0, -1):
            tree[i] = combine(tree[2 * i], tree[2 * i + 1])
        return tree


    def seg_update(tree, i, value, combine):
        """Set position i to value and recompute the nodes above it. ValueError unless 0 <= i < n."""
        n = len(tree) // 2
        if not 0 <= i < n:
            raise ValueError("index out of range")
        i += n
        tree[i] = value
        while i > 1:
            i //= 2
            tree[i] = combine(tree[2 * i], tree[2 * i + 1])


    def seg_query(tree, lo, hi, combine, identity):
        """combine() of the values in positions lo up to but not including hi, in O(log n): start with l = lo + n and r = hi + n;
        while l < r: if l is odd use tree[l] and move l up by one; if r is odd step r down by one and use tree[r]; then halve both.
        An empty range gives identity. ValueError unless 0 <= lo <= hi <= n."""
        n = len(tree) // 2
        if not 0 <= lo <= hi <= n:
            raise ValueError("bad range")
        result = identity
        l, r = lo + n, hi + n
        while l < r:
            if l & 1:
                result = combine(result, tree[l])
                l += 1
            if r & 1:
                r -= 1
                result = combine(result, tree[r])
            l //= 2
            r //= 2
        return result

    sales = [5, 3, 7, 9, 6, 4, 1, 8]
    bit = fenwick_build(sales)
    print("total of the first 5 days:", fenwick_prefix(bit, 5))
    fenwick_update(bit, 2, 10)
    print("after a correction on day 3 (+10):", fenwick_range(bit, 1, 6), "for days 2 to 6")
    inf = float("inf")
    tree = seg_build(sales, min, inf)
    print("lowest sales in days 2 to 6:", seg_query(tree, 1, 6, min, inf))
    seg_update(tree, 4, 0, min)
    print("after a zero on day 5:", seg_query(tree, 1, 6, min, inf))
    print("a segment tree over", len(sales), "values uses", len(tree), "slots")
  output: |
