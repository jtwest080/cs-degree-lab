      for f in (lambda: fenwick_update(t, 3, 1), lambda: fenwick_update(t, -1, 1), lambda: fenwick_prefix(t, 4), lambda: fenwick_prefix(t, -1)):
          try:
              f()
              raise AssertionError("accepted")
          except ValueError:
              pass
      assert fenwick_prefix(t, 3) == 6
