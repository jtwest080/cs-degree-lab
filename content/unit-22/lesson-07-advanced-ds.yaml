  solution: |
    def seg_build(values, combine, identity):
        """An iterative segment tree: a list of 2n slots where the leaves (the values) sit at positions n .. 2n - 1 and every inner node i
        holds combine(tree[2i], tree[2i + 1]). `combine` must be associative and commutative (sum, min, max, gcd ...) and `identity` is its
        neutral element (0 for sum, infinity for min)."""
        n = len(values)
        tree = [identity] * n + list(values)
        for i in range(n - 1, 0, -1):
            tree[i] = combine(tree[2 * i], tree[2 * i + 1])
        return tree


    def seg_update(tree, i, value, combine):
        """Set position i to value and recompute the nodes above it. ValueError unless 0 <= i < n."""
        n = len(tree) // 2
        if not 0 <= i < n:
            raise ValueError("index out of range")
        i += n
        tree[i] = value
        while i > 1:
            i //= 2
            tree[i] = combine(tree[2 * i], tree[2 * i + 1])


    def seg_query(tree, lo, hi, combine, identity):
        """combine() of the values in positions lo up to but not including hi, in O(log n): start with l = lo + n and r = hi + n;
        while l < r: if l is odd use tree[l] and move l up by one; if r is odd step r down by one and use tree[r]; then halve both.
        An empty range gives identity. ValueError unless 0 <= lo <= hi <= n."""
        n = len(tree) // 2
        if not 0 <= lo <= hi <= n:
            raise ValueError("bad range")
        result = identity
        l, r = lo + n, hi + n
        while l < r:
            if l & 1:
                result = combine(result, tree[l])
                l += 1
            if r & 1:
                r -= 1
                result = combine(result, tree[r])
            l //= 2
            r //= 2
        return result
  explanation: One structure handles any associative operation by changing the combine function.
