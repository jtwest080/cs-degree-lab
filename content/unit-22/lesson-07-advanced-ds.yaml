  solution: |
    def fenwick_build(values):
        """A Fenwick tree (binary indexed tree) over the values, as a list with one unused slot at index 0. Build in O(n): put each
        value at tree[i] (positions start at 1), then add tree[i] into its parent tree[i + (i & -i)] when that position exists."""
        n = len(values)
        tree = [0] * (n + 1)
        for i, v in enumerate(values, 1):
            tree[i] += v
            parent = i + (i & -i)
            if parent <= n:
                tree[parent] += tree[i]
        return tree


    def fenwick_update(tree, i, delta):
        """Add delta to the value at position i (counting from 0): starting at i + 1, add to tree[j] and move to j + (j & -j) while j is
        inside the tree. ValueError unless 0 <= i < len(tree) - 1."""
        if not 0 <= i < len(tree) - 1:
            raise ValueError("index out of range")
        j = i + 1
        while j < len(tree):
            tree[j] += delta
            j += j & -j


    def fenwick_prefix(tree, count):
        """The sum of the first `count` values: add tree[j] and move to j - (j & -j) until j reaches 0. ValueError unless 0 <= count <= len(tree) - 1."""
        if not 0 <= count <= len(tree) - 1:
            raise ValueError("count out of range")
        total = 0
        j = count
        while j > 0:
            total += tree[j]
            j -= j & -j
        return total


    def fenwick_range(tree, lo, hi):
        """The sum of values[lo:hi] (lo included, hi excluded)."""
        return fenwick_prefix(tree, hi) - fenwick_prefix(tree, lo)


    from bisect import bisect_left
    from collections import deque


    def count_inversions(values):
        """How many pairs i < j have values[i] > values[j]? Replace each value by its rank (1 for the smallest distinct value), then go from the
        right: for each value, add the number of already-seen values with a smaller rank (a Fenwick prefix sum) and then record this value."""
        ranks = {v: i + 1 for i, v in enumerate(sorted(set(values)))}
        tree = fenwick_build([0] * len(ranks))
        total = 0
        for v in reversed(values):
            total += fenwick_prefix(tree, ranks[v] - 1)
            fenwick_update(tree, ranks[v] - 1, 1)
        return total


    def lis_length(values):
        """The length of the longest strictly increasing subsequence in O(n log n): keep `tails`, where tails[k] is the smallest possible last
        value of an increasing subsequence of length k + 1; for each value use bisect_left to find its place, replace or append."""
        tails = []
        for v in values:
            k = bisect_left(tails, v)
            if k == len(tails):
                tails.append(v)
            else:
                tails[k] = v
        return len(tails)


    def sliding_window_min(values, k):
        """The minimum of every window of k neighbouring values, in O(n): keep a deque of indexes whose values increase from front to
        back; drop indexes that left the window from the front and larger values from the back. ValueError if k < 1; [] if k > len(values)."""
        if k < 1:
            raise ValueError("k must be at least 1")
        window = deque()
        out = []
        for i, v in enumerate(values):
            while window and values[window[-1]] >= v:
                window.pop()
            window.append(i)
            if window[0] <= i - k:
                window.popleft()
            if i >= k - 1:
                out.append(values[window[0]])
        return out
  explanation: Data structures turn nested loops into logarithmic steps.
commonMistakes:
- title: Off-by-one errors with half-open ranges
  explanation: Decide whether hi is included; a half-open range [lo, hi) removes many bugs.
- title: Using a segment tree with a non-associative operation
  explanation: The grouping of combine must not matter.
- title: Rebuilding the structure on every update
  explanation: Updating one leaf and its ancestors is O(log n); rebuilding is O(n).
- title: Using a sparse table when the data changes
  explanation: It is built once; use a segment tree if values change.
- title: Forgetting the identity value
  explanation: Empty ranges and odd sizes need a neutral element such as 0 for sums and infinity for minimums.
summary:
- Prefix sums and difference arrays give O(1) range sums and range adds for static data.
- A Fenwick tree does updates and prefix sums in O(log n) using the lowest set bit.
- A segment tree handles any associative operation with O(log n) queries and updates.
- A sparse table answers range-minimum queries in O(1) after O(n log n) preparation.
- Amortized analysis averages the cost over a sequence of operations.
