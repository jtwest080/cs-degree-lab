    def fenwick_build(values):
        """A Fenwick tree (binary indexed tree) over the values, as a list with one unused slot at index 0. Build in O(n): put each
        value at tree[i] (positions start at 1), then add tree[i] into its parent tree[i + (i & -i)] when that position exists."""
        n = len(values)
        tree = [0] * (n + 1)
        for i, v in enumerate(values, 1):
            tree[i] += v
            parent = i + (i & -i)
            if parent <= n:
