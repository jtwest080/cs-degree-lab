    def prefix_sums_2d(grid):
        """A table P with one extra row and column of zeros, where P[r][c] is the sum of all grid cells above row r and left of column c
        (rows 0..r-1 and columns 0..c-1). Build with P[r + 1][c + 1] = grid[r][c] + P[r][c + 1] + P[r + 1][c] - P[r][c]."""
        rows = len(grid)
        cols = len(grid[0]) if rows else 0
        P = [[0] * (cols + 1) for _ in range(rows + 1)]
        for r in range(rows):
            for c in range(cols):
                P[r + 1][c + 1] = grid[r][c] + P[r][c + 1] + P[r + 1][c] - P[r][c]
        return P


    def rect_sum(P, r1, c1, r2, c2):
        """The sum of the grid cells in rows r1..r2 and columns c1..c2 (both ends included), from four table lookups."""
        return P[r2 + 1][c2 + 1] - P[r1][c2 + 1] - P[r2 + 1][c1] + P[r1][c1]


    def apply_range_adds(n, updates):
        """Start with n zeros. Each update (lo, hi, amount) adds amount to every position lo..hi (both included). Use a difference array:
        add amount at diff[lo] and subtract it at diff[hi + 1]; finally a running total gives the values. All updates cost O(1) each."""
        diff = [0] * (n + 1)
        for lo, hi, amount in updates:
            diff[lo] += amount
            diff[hi + 1] -= amount
        out = []
        running = 0
        for i in range(n):
            running += diff[i]
            out.append(running)
        return out
  explanation: Precomputation turns repeated rectangle and range questions into constant time.
