      inf = float("inf")
      vals = [5, 3, 8, 6, 2, 7, 4]
      t = seg_build(vals, min, inf)
      assert seg_query(t, 0, 7, min, inf) == 2 and seg_query(t, 0, 4, min, inf) == 3
      seg_update(t, 4, 9, min)
      vals[4] = 9
      for lo in range(len(vals)):
          for hi in range(lo + 1, len(vals) + 1):
              assert seg_query(t, lo, hi, min, inf) == min(vals[lo:hi])
      assert seg_query(t, 3, 3, min, inf) == inf
  - name: other operations and errors
    code: |
      from math import gcd
      vals = [12, 18, 24, 36, 5]
      t = seg_build(vals, gcd, 0)
      assert seg_query(t, 0, 4, gcd, 0) == 6 and seg_query(t, 0, 5, gcd, 0) == 1
      one = seg_build([4], max, -1)
      assert seg_query(one, 0, 1, max, -1) == 4
      for f in (lambda: seg_update(t, 5, 1, gcd), lambda: seg_query(t, 3, 2, gcd, 0), lambda: seg_query(t, 0, 6, gcd, 0)):
          try:
              f()
              raise AssertionError("accepted")
          except ValueError:
