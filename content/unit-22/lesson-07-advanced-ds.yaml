        return tree


    def fenwick_update(tree, i, delta):
        """Add delta to the value at position i (counting from 0): starting at i + 1, add to tree[j] and move to j + (j & -j) while j is
        inside the tree. ValueError unless 0 <= i < len(tree) - 1."""
        if not 0 <= i < len(tree) - 1:
            raise ValueError("index out of range")
        j = i + 1
        while j < len(tree):
            tree[j] += delta
            j += j & -j


    def fenwick_prefix(tree, count):
