  import math
  from collections import deque


  def max_flow(capacity, source, sink):
      """The maximum flow through a network {u: {v: capacity}} using shortest augmenting paths (Edmonds-Karp). Build a residual graph
      that also holds a 0-capacity reverse edge for every edge. ValueError if source or sink is missing or they are the same."""
      pass


  def strongly_connected_components(graph):
      """The groups of nodes that can all reach each other, as a list of sorted lists ordered by smallest node (Kosaraju: DFS finish
      order, then DFS on the reversed graph in reverse finish order). graph is {node: [neighbours]}."""
      pass


  def kmp_search(text, pattern):
      """Every start index where pattern occurs in text (overlaps included) in O(len(text) + len(pattern)), using the prefix function.
      ValueError for an empty pattern."""
      pass


  def convex_hull(points):
      """The corners of the convex hull, counterclockwise from the lowest-left point, with no collinear points on the edges
      (Andrew's monotone chain). Fewer than 3 distinct points are returned sorted as they are."""
      pass


  def dpll(num_vars, clauses):
      """Solve SAT (each clause a list of nonzero integers; k means variable k is True, -k means False) by backtracking with unit
      propagation. Return {variable: bool} for variables 1..num_vars, or None if there is no solution."""
      pass


  def vertex_cover_2approx(edges):
      """A vertex cover at most twice the minimum size: whenever an edge has neither endpoint chosen, choose both. Sorted list."""
      pass


  def held_karp(dist):
      """The exact length of the shortest closed tour through all cities (dynamic programming over subsets, O(n^2 * 2^n)).
      dist is a square table. 0 for fewer than 2 cities."""
      pass


  def reservoir_sample(stream, k, seed=0):
      """k items chosen uniformly from a stream of unknown length, storing only k. Keep the first k; for item i >= k draw
      j = rng.randrange(i + 1) with rng = random.Random(seed) and replace reservoir[j] when j < k. ValueError if k < 0."""
      pass


  def segment_tree_ops(values):
      """Build a range-sum structure and return a pair (query, update): query(lo, hi) is the sum of values[lo:hi], update(i, value)
      sets position i. Both must be O(log n) (an iterative segment tree with 2n slots)."""
      pass


  def count_inversions(values):
      """The number of pairs i < j with values[i] > values[j], in O(n log n) (merge sort style counting or a Fenwick tree)."""
