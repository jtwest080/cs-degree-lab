title: Algorithm Lab
language: python
brief: 'Build a portfolio of advanced algorithms in one library: maximum flow, strongly connected components,
  fast string search, convex hulls, a SAT solver, an approximate vertex cover, an exact travelling-salesman
  solver, reservoir sampling, a segment tree and inversion counting. Each one solves a real problem that
  appears in networks, compilers, maps, scheduling and data analysis.'
steps:
- title: Graphs and flow
  body: Write `max_flow` (shortest augmenting paths with reverse edges, refusing a bad source or sink)
    and `strongly_connected_components` (two depth-first passes, the second on the reversed graph).
- title: Strings and geometry
  body: Write `kmp_search` with the prefix function and `convex_hull` with the monotone chain, dropping
    collinear points.
- title: Hard problems
  body: Write `dpll` (backtracking with unit propagation), `vertex_cover_2approx` (take both ends of every
    uncovered edge) and `held_karp` (dynamic programming over subsets).
- title: Randomness and range data structures
  body: Write `reservoir_sample`, `segment_tree_ops` (a pair of functions sharing one tree) and `count_inversions`
    (in O(n log n)).
checklist:
- text: Finds maximum flow
  test: maximum flow
- text: Finds strongly connected components
  test: strongly connected components
- text: Searches for patterns in linear time
  test: pattern search
- text: Builds convex hulls
  test: convex hull
- text: Solves satisfiability
  test: satisfiability
- text: Approximates vertex cover
  test: approximate vertex cover
- text: Solves travelling salesman exactly
  test: travelling salesman, exactly
- text: Samples streams fairly
  test: reservoir sampling
- text: Answers range sums with updates
  test: range sums with updates
- text: Counts inversions quickly
  test: counting inversions
- text: Leaves inputs untouched
  test: does not change its input
