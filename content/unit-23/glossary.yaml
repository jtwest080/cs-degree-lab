# Terms introduced in Unit 23 (Compilers). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Lexer
  definition: The part of a compiler that turns a stream of characters into tokens, also called a scanner or tokenizer.
  lesson: u23-lexing
- term: Lexeme
  definition: The actual text that a token stands for.
  lesson: u23-lexing
- term: Maximal munch
  definition: The rule that a lexer takes the longest piece of text that forms a valid token.
  lesson: u23-lexing
- term: Transition
  definition: A move from one state to another when a certain symbol is read.
  lesson: u23-lexing
- term: DFA minimization
  definition: Merging states of a DFA that behave identically to get the smallest equivalent machine.
  lesson: u23-lexing
- term: Production
  definition: One grammar rule that says what a symbol can be replaced by.
  lesson: u23-parsing
- term: Nonterminal
  definition: A symbol of a grammar that stands for a structure and is defined by productions.
  lesson: u23-parsing
- term: Start symbol
  definition: The nonterminal from which every valid sentence of a grammar is derived.
  lesson: u23-parsing
- term: Nullable
  definition: Able to produce the empty string.
  lesson: u23-parsing
- term: FIRST set
  definition: The set of terminals that can begin a string derived from a symbol.
  lesson: u23-parsing
- term: FOLLOW set
  definition: The set of terminals that can appear right after a nonterminal in some derivation.
  lesson: u23-parsing
- term: LL(1) grammar
  definition: A grammar that a parser can handle by reading left to right with one token of lookahead and no guessing.
  lesson: u23-parsing
- term: Predictive parsing
  definition: Parsing by choosing the rule to use from the next token using a table.
  lesson: u23-parsing
- term: Parse table
  definition: A table that tells a predictive parser which rule to use for each nonterminal and next token.
  lesson: u23-parsing
- term: Left recursion
  definition: A rule whose right side begins with the symbol being defined, which makes a top-down parser loop forever.
  lesson: u23-parsing
- term: Lookahead
  definition: The next unread token or tokens, examined to decide what to do.
  lesson: u23-parsing
- term: Pratt parsing
  definition: An expression parsing method that gives each operator a binding power and handles all levels with one loop.
  lesson: u23-pratt
- term: Precedence
  definition: How tightly an operator binds to its operands compared with other operators.
  lesson: u23-pratt
- term: Prefix operator
  definition: An operator written before its operand, such as unary minus.
  lesson: u23-pratt
- term: Reverse Polish notation
  definition: A way of writing expressions with operands first and the operator after, needing no parentheses.
  lesson: u23-pratt
- term: Code as data
  definition: The idea that a program can be stored and processed as an ordinary data structure.
  lesson: u23-pratt
- term: Semantic analysis
  definition: The compiler phase that checks the meaning of a program, such as declarations and types.
  lesson: u23-semantics
- term: Symbol table
  definition: A table that records the names in a program and facts about them such as their types.
  lesson: u23-semantics
- term: Shadowing
  definition: Declaring a name in an inner scope that hides a name of the same spelling in an outer scope.
  lesson: u23-semantics
- term: Redeclaration
  definition: Declaring the same name twice in the same scope, usually an error.
  lesson: u23-semantics
- term: Type inference
  definition: Working out the types of variables from how they are used instead of being told.
  lesson: u23-semantics
- term: Widening
  definition: Converting a value to a type that can hold it without losing information, such as an integer to a decimal number.
  lesson: u23-semantics
- term: Call graph
  definition: A graph showing which functions call which other functions.
  lesson: u23-semantics
- term: Intermediate representation
  definition: A simple form of a program used inside a compiler between the source and the machine code.
  lesson: u23-optimize
- term: Three-address code
  definition: An intermediate form in which each instruction does one operation on at most two inputs and stores one result.
  lesson: u23-optimize
- term: Temporary
  definition: A compiler-made variable that holds an intermediate result.
  lesson: u23-optimize
- term: Basic block
  definition: A run of instructions entered only at the top and left only at the bottom.
  lesson: u23-optimize
- term: Control-flow graph
  definition: A graph whose nodes are basic blocks and whose edges show where control can go next.
  lesson: u23-optimize
- term: Unreachable code
  definition: Code that no path from the start of the program can ever run.
  lesson: u23-optimize
- term: Constant folding
  definition: Computing at compile time an operation whose inputs are already known.
  lesson: u23-optimize
- term: Copy propagation
  definition: Using the original variable instead of a copy of it.
  lesson: u23-optimize
- term: Common subexpression elimination
  definition: Reusing the result of a computation that is repeated with the same inputs.
  lesson: u23-optimize
- term: Dead code
  definition: Code whose result is never used.
  lesson: u23-optimize
- term: Liveness
  definition: Whether a variable will be read later before it is written again.
  lesson: u23-optimize
- term: Dataflow analysis
  definition: A way of finding facts about a program by repeatedly passing information along the control-flow graph.
  lesson: u23-optimize
- term: Fixed point
  definition: A state in which repeating a step no longer changes anything.
  lesson: u23-optimize
- term: Code generation
  definition: The compiler phase that produces instructions for the target machine.
  lesson: u23-codegen
- term: Stack machine
  definition: A machine that keeps temporary values on a stack instead of in named registers.
  lesson: u23-codegen
- term: Peephole optimization
  definition: Replacing wasteful patterns in a small window of instructions with better ones.
  lesson: u23-codegen
- term: Interference graph
  definition: A graph that joins variables that are live at the same time and so cannot share a register.
  lesson: u23-codegen
- term: Register allocation
  definition: Deciding which variable lives in which register.
  lesson: u23-codegen
- term: Graph coloring
  definition: Giving each vertex a color so that connected vertices differ.
  lesson: u23-codegen
- term: Register pressure
  definition: The largest number of variables that are live at the same time.
  lesson: u23-codegen
- term: Spill
  definition: Keeping a variable in memory because no register was free.
  lesson: u23-codegen
- term: Instruction selection
  definition: Choosing which machine instructions to use for each operation.
  lesson: u23-codegen
- term: Heap
  definition: Memory for data that outlives the function that made it and must be released by some policy.
  lesson: u23-memory
- term: Garbage collection
  definition: Automatic reclaiming of memory that a program can no longer reach.
  lesson: u23-memory
- term: Reachable
  definition: Able to be found by following references from the roots.
  lesson: u23-memory
- term: Mark and sweep
  definition: A collector that marks every reachable object and then frees the rest.
  lesson: u23-memory
- term: Stop-the-world pause
  definition: A moment when the program is halted so that the collector can work.
  lesson: u23-memory
- term: Reference counting
  definition: Keeping a count of references to each object and freeing it when the count reaches zero.
  lesson: u23-memory
- term: Reference cycle
  definition: Objects that refer to each other so that their counts never reach zero.
  lesson: u23-memory
- term: Weak reference
  definition: A reference that does not keep its target alive.
  lesson: u23-memory
- term: Allocator
  definition: The part of a system that finds space for new objects.
  lesson: u23-memory
- term: Fragmentation
  definition: Free memory broken into pieces too small to be useful.
  lesson: u23-memory
- term: Copying collector
  definition: A collector that copies live objects into a fresh area, leaving the garbage behind.
  lesson: u23-memory
- term: Cheney's algorithm
  definition: A copying collection that uses the copied objects themselves as a queue of work.
  lesson: u23-memory
- term: Generational collection
  definition: Collecting recently created objects often and older objects rarely, because most objects die young.
  lesson: u23-memory
