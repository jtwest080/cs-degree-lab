      assert kind_of("if") == "KEYWORD" and kind_of("while") == "KEYWORD" and kind_of("return") == "KEYWORD"
      assert kind_of("iffy") == "IDENT" and kind_of("x") == "IDENT" and kind_of("") == "IDENT"
  solution: |
    def kind_of(word):
        return 'KEYWORD' if word in ('if', 'while', 'return') else 'IDENT'
