id: u23-lexing
title: 'Lexical Analysis: From Text to Tokens'
minutes: 95
objective: 'Learn the first stage of every compiler and interpreter: turning raw source text into tokens. You will see why ''longest match'' decides between == and =, and build the machinery behind it: regular expressions, nondeterministic and deterministic automata, the subset construction and DFA minimization, finishing with a working scanner generator.'
outcomes:
- Explain what a compiler does and its main phases
- Write a tokenizer using maximal munch
- Convert a regular expression to an NFA and simulate it
- Convert an NFA to a DFA and minimize it
- Build a scanner from automata
sections:
- heading: What a compiler does
  body: |-
    A **compiler** translates a program from one language (the **source**, such as C or Rust) into another (the **target**, usually machine code the processor runs). An **interpreter** instead runs the source directly. Real systems mix them: Python compiles to **bytecode** and then interprets it. You met this picture in the first unit; now we open the box. A compiler is a **pipeline**, a chain of stages each doing one job and handing the result to the next:

    1. **Lexical analysis** (the **lexer** or **scanner**) turns the characters of the source into **tokens**.
    2. **Syntax analysis** (the **parser**) arranges the tokens into a tree following the grammar of the language.
    3. **Semantic analysis** checks meaning: are variables declared, do the types fit?
    4. **Intermediate code and optimization** rewrites the program into a simple form and makes it faster.
    5. **Code generation** produces the target instructions.

    Splitting the work like this keeps each part simple and lets you reuse parts: one optimizer can serve many languages. This unit builds each stage in turn, and the project assembles a tiny complete compiler.
- heading: Tokens, lexemes and maximal munch
  body: |-
    Source code arrives as one long string of characters. The lexer groups them into **tokens**: the smallest meaningful units, such as keywords (`if`), identifiers (`count`), numbers (`3.14`), operators (`==`) and punctuation (`;`). The exact text of a token, like `count`, is its **lexeme**; its category, `IDENT`, is its **kind** or **type**. Whitespace and comments are usually thrown away. Each token also remembers its **position** so error messages can say "line 3, column 8".

    How does the lexer decide where one token ends? By the rule of **maximal munch**: always take the *longest* possible match. In `a == b`, after `a` the next characters are `==`. The rule for `=` matches one character, the rule for `==` matches two, so the longer wins. Likewise `iffy` could start with the keyword `if`, but the identifier rule matches all four letters, so it wins, and `iffy` is correctly one identifier. When two rules match equally long text (the word `if` matches both the keyword rule and the identifier rule), the rule listed *first* wins, which is why keyword rules come before the identifier rule.

    Each token's shape is described with a **regular expression**: `[0-9]+` means "one or more digits", `[a-z]+` means one or more lowercase letters. Regular expressions are the right tool because they are simple, and, as we shall see, can be turned into a very fast machine.
- heading: 'Automata: the machine behind a regular expression'
  body: |-
    A **finite automaton** is a tiny machine with a set of **states**, a start state, some **accepting states** and transitions labelled with characters. It reads text one character at a time, following transitions; if it ends in an accepting state, the text matches. In a **DFA** (deterministic finite automaton) each state has at most one move per character, so running it is just a table lookup per character: very fast. An **NFA** (nondeterministic finite automaton) may have several moves for a character, and **epsilon edges** (free moves that consume no input). NFAs are easy to build from regular expressions: **Thompson's construction** builds a small NFA for each piece (a character, a choice `a|b`, repetition `a*`) and wires pieces together with epsilon edges.

    To run an NFA, keep the *set* of all states you might be in. The **epsilon closure** of a set is everything reachable using only free moves. For each character, move every state in the set along matching edges, then take the closure again. The **subset construction** does this calculation ahead of time: each DFA state *is* a set of NFA states, and its transitions are precomputed. A DFA may need up to `2^n` states for an `n`-state NFA, but usually far fewer. Finally **DFA minimization** merges states that no input can distinguish: split states into groups by whether they accept, then keep splitting groups whenever two members lead to different groups on some character, until nothing changes. A **scanner generator** such as `lex` or `flex` does exactly this: it compiles all the token rules into one fast DFA.
examples:
- title: A tokenizer and a scanner
  intro: Maximal munch with Python's re module, then the same tokens from scratch with automata.
  code: |
    import re

    RULES = [
        ("NUMBER", r"[0-9]+(\.[0-9]+)?"),
        ("IF", r"if"),
        ("WHILE", r"while"),
        ("IDENT", r"[A-Za-z_][A-Za-z_0-9]*"),
        ("EQ", r"=="),
        ("ASSIGN", r"="),
        ("PLUS", r"\+"),
        ("STAR", r"\*"),
        ("LPAREN", r"\("),
        ("RPAREN", r"\)"),
        ("SEMI", r";"),
        ("WS", r"[ \t\n]+"),
    ]


    def tokenize(source, rules=RULES):
        """Turn source text into a list of (kind, text, position) tokens. At each position try EVERY rule with re.match and take the LONGEST
        match; if two rules match equally long, the rule listed first wins (so 'if' is a keyword but 'iffy' is an identifier).
        Tokens of kind WS (whitespace) are discarded. If nothing matches, raise ValueError with a message that contains the position."""
        tokens = []
        pos = 0
        while pos < len(source):
            best = None
            for kind, pattern in rules:
                m = re.compile(pattern).match(source, pos)
                if m and m.end() > pos and (best is None or m.end() - pos > len(best[1])):
                    best = (kind, m.group(), pos)
            if best is None:
                raise ValueError("unexpected character %r at position %d" % (source[pos], pos))
            if best[0] != "WS":
                tokens.append(best)
            pos += len(best[1])
        return tokens


    def regex_to_nfa(pattern):
        """Thompson's construction (given to you; study it). Supports literal characters, '.' (any character), [abc] and [a-z] classes,
        backslash escapes, grouping with ( ), alternation |, and the postfix operators * + ?. Returns
        {"start": s, "accept": a, "edges": {state: [(symbol or None, next_state), ...]}} where None marks an epsilon edge (a free move)."""
        edges = {}
        pos = [0]

        def new_state():
            edges[len(edges)] = []
            return len(edges) - 1

        def peek():
            return pattern[pos[0]] if pos[0] < len(pattern) else None

        def expr():
            s, a = term()
            while peek() == "|":
                pos[0] += 1
                s2, a2 = term()
                ns, na = new_state(), new_state()
                edges[ns] += [(None, s), (None, s2)]
                edges[a].append((None, na))
                edges[a2].append((None, na))
                s, a = ns, na
            return s, a

        def term():
            s = new_state()
            a = s
            while peek() not in (None, "|", ")"):
                s2, a2 = factor()
                edges[a].append((None, s2))
                a = a2
            return s, a

        def factor():
            s, a = atom()
            while peek() in ("*", "+", "?"):
                op = pattern[pos[0]]
                pos[0] += 1
                ns, na = new_state(), new_state()
                edges[ns].append((None, s))
                edges[a].append((None, na))
                if op in "*?":
                    edges[ns].append((None, na))
                if op in "*+":
                    edges[a].append((None, s))
                s, a = ns, na
            return s, a

        def atom():
            c = peek()
            if c == "(":
                pos[0] += 1
                frag = expr()
                if peek() != ")":
                    raise ValueError("missing )")
                pos[0] += 1
                return frag
            if c is None or c in "*+?)|":
                raise ValueError("unexpected %r" % c)
            s, a = new_state(), new_state()
            if c == "[":
                pos[0] += 1
                chars = []
                while peek() not in (None, "]"):
                    ch = pattern[pos[0]]
                    if pos[0] + 2 < len(pattern) and pattern[pos[0] + 1] == "-" and pattern[pos[0] + 2] != "]":
                        chars += [chr(x) for x in range(ord(ch), ord(pattern[pos[0] + 2]) + 1)]
                        pos[0] += 3
                    else:
                        chars.append(ch)
                        pos[0] += 1
                if peek() != "]":
                    raise ValueError("missing ]")
                pos[0] += 1
                for ch in chars:
                    edges[s].append((ch, a))
                return s, a
            if c == "\\":
                pos[0] += 1
                c = peek()
                if c is None:
                    raise ValueError("dangling backslash")
                symbol = "\\" + c
            else:
                symbol = c
            pos[0] += 1
            edges[s].append((symbol, a))
            return s, a

        start, accept = expr()
        if pos[0] != len(pattern):
            raise ValueError("unmatched )")
        return {"start": start, "accept": accept, "edges": edges}


    def matches_symbol(symbol, ch):
        """Does an edge labelled `symbol` accept the character ch? '.' accepts anything; a two-character label like backslash-plus accepts that literal character."""
        if symbol == ".":
            return True
        if len(symbol) == 2 and symbol[0] == "\\":
            return symbol[1] == ch
        return symbol == ch


    def epsilon_closure(nfa, states):
        """Every state reachable from `states` using only epsilon (None) edges, including the starting states themselves, as a set.
        Use a stack: pop a state, push each epsilon-neighbour you have not seen."""
        seen = set(states)
        stack = list(states)
        while stack:
            s = stack.pop()
            for symbol, target in nfa["edges"][s]:
                if symbol is None and target not in seen:
                    seen.add(target)
                    stack.append(target)
        return seen


    def step(nfa, states, ch):
        """The set of states reachable from `states` by reading the single character ch (using matches_symbol) and then following any epsilon edges."""
        moved = set()
        for s in states:
            for symbol, target in nfa["edges"][s]:
                if symbol is not None and matches_symbol(symbol, ch):
                    moved.add(target)
        return epsilon_closure(nfa, moved)


    def nfa_accepts(nfa, text):
        """True if the NFA can finish in its accept state after reading ALL of text. Keep the SET of states you could be in:
        start with the closure of {start}, replace it by step(...) for each character, and at the end look for the accept state."""
        states = epsilon_closure(nfa, {nfa["start"]})
        for ch in text:
            states = step(nfa, states, ch)
            if not states:
                return False
        return nfa["accept"] in states


    def regex_matches(pattern, text):
        """True if the WHOLE text matches the pattern."""
        return nfa_accepts(regex_to_nfa(pattern), text)


    def nfa_to_dfa(nfa, alphabet):
        """The subset construction. Each DFA state stands for a SET of NFA states. Start with epsilon_closure({start}) as state 0. Using a
        queue (first in, first out) and iterating `sorted(alphabet)` in order, compute step(nfa, S, ch) for each set S; skip empty results
        (a missing move means reject); number new sets 1, 2, 3 ... in the order they are discovered. A DFA state accepts when its set
        contains the NFA's accept state. Return {"start": 0, "accepts": set of ints, "delta": {(state, char): state}}."""
        alphabet = sorted(alphabet)
        start = frozenset(epsilon_closure(nfa, {nfa["start"]}))
        ids = {start: 0}
        queue = [start]
        delta = {}
        accepts = set()
        while queue:
            current = queue.pop(0)
            if nfa["accept"] in current:
                accepts.add(ids[current])
            for ch in alphabet:
                target = frozenset(step(nfa, current, ch))
                if not target:
                    continue
                if target not in ids:
                    ids[target] = len(ids)
                    queue.append(target)
                delta[(ids[current], ch)] = ids[target]
        return {"start": 0, "accepts": accepts, "delta": delta}


    def dfa_accepts(dfa, text):
        """Run the DFA: follow one move per character (a missing move means reject at once) and report whether the final state accepts."""
        state = dfa["start"]
        for ch in text:
            state = dfa["delta"].get((state, ch))
            if state is None:
                return False
        return state in dfa["accepts"]


    def minimize_dfa(dfa, alphabet):
        """Merge states that behave identically (Moore's partition refinement). Steps: find the states reachable from the start; add one
        extra DEAD state (-1) that every missing move goes to; split the states into groups, first accepting versus not accepting; then
        repeatedly give each state the signature (its current group, the groups its moves lead to in sorted alphabet order) and regroup by
        signature, until the number of groups stops growing. Finally build the new DFA from the groups reachable from the start group,
        numbering groups 0, 1, 2 ... in breadth-first discovery order (alphabet in sorted order), and OMIT the group that contains DEAD
        (and every move into it). If the start group is the dead group return {"start": 0, "accepts": set(), "delta": {}}."""
        alphabet = sorted(alphabet)
        delta = dfa["delta"]
        accepts = set(dfa["accepts"])
        DEAD = -1
        states = {dfa["start"]}
        stack = [dfa["start"]]
        while stack:
            s = stack.pop()
            for ch in alphabet:
                t = delta.get((s, ch))
                if t is not None and t not in states:
                    states.add(t)
                    stack.append(t)
        states.add(DEAD)

        def go(s, ch):
            return DEAD if s == DEAD else delta.get((s, ch), DEAD)

        group = {s: int(s in accepts) for s in states}
        count = len(set(group.values()))
        while True:
            signature = {s: (group[s], tuple(group[go(s, ch)] for ch in alphabet)) for s in states}
            ids = {}
            group = {s: ids.setdefault(signature[s], len(ids)) for s in sorted(states)}
            if len(ids) == count:
                break
            count = len(ids)
        dead_group = group[DEAD]
        start_group = group[dfa["start"]]
        if start_group == dead_group:
            return {"start": 0, "accepts": set(), "delta": {}}
        representative = {}
        for s in sorted(states):
            representative.setdefault(group[s], s)
        order = {start_group: 0}
        queue = [start_group]
        new_delta = {}
        new_accepts = set()
        while queue:
            g = queue.pop(0)
            r = representative[g]
            if r in accepts:
                new_accepts.add(order[g])
            for ch in alphabet:
                target = group[go(r, ch)]
                if target == dead_group:
                    continue
                if target not in order:
                    order[target] = len(order)
                    queue.append(target)
                new_delta[(order[g], ch)] = order[target]
        return {"start": 0, "accepts": new_accepts, "delta": new_delta}


    def regex_dfa(pattern, alphabet):
        """The smallest DFA for a pattern: build the NFA, convert it with nfa_to_dfa, minimise it."""
        return minimize_dfa(nfa_to_dfa(regex_to_nfa(pattern), alphabet), alphabet)


    def longest_match(dfa, text, start):
        """The end position (exclusive) of the LONGEST prefix of text[start:] that the DFA accepts, or -1 if no prefix (not even the empty one)
        is accepted. Walk forward from `start`, remembering the last position where the DFA was in an accepting state; stop at a missing move."""
        state = dfa["start"]
        best = start if state in dfa["accepts"] else -1
        for i in range(start, len(text)):
            state = dfa["delta"].get((state, text[i]))
            if state is None:
                break
            if state in dfa["accepts"]:
                best = i + 1
        return best


    def lex(rules, text):
        """A scanner built from scratch. `rules` is a list of (name, pattern) using this lesson's regex syntax. Build one minimal DFA per
        rule with the alphabet set(text). At each position take the rule with the longest non-empty match (the earlier rule wins ties),
        emit (name, lexeme, position) and move on. Tokens named WS are discarded. Raise ValueError mentioning the position if nothing matches."""
        alphabet = set(text)
        dfas = [(name, regex_dfa(pattern, alphabet)) for name, pattern in rules]
        tokens = []
        pos = 0
        while pos < len(text):
            best_name, best_end = None, pos
            for name, dfa in dfas:
                end = longest_match(dfa, text, pos)
                if end > best_end:
                    best_name, best_end = name, end
            if best_name is None:
                raise ValueError("unexpected character %r at position %d" % (text[pos], pos))
            if best_name != "WS":
                tokens.append((best_name, text[pos:best_end], pos))
            pos = best_end
        return tokens

    print(tokenize("while (count == 10) iffy = iffy + 2.5;"))
    rules = [("NUM", "[0-9]+"), ("IF", "if"), ("ID", "[a-z]+"), ("EQ", "=="), ("ASSIGN", "="), ("WS", "[ ]+")]
    print(lex(rules, "if x == 42"))
    print(lex(rules, "iffy = 7"))
