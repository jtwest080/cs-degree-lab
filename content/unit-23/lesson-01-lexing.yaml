  solution: |
    import re

    RULES = [
        ("NUMBER", r"[0-9]+(\.[0-9]+)?"),
        ("IF", r"if"),
        ("WHILE", r"while"),
        ("IDENT", r"[A-Za-z_][A-Za-z_0-9]*"),
        ("EQ", r"=="),
        ("ASSIGN", r"="),
        ("PLUS", r"\+"),
        ("STAR", r"\*"),
        ("LPAREN", r"\("),
        ("RPAREN", r"\)"),
        ("SEMI", r";"),
        ("WS", r"[ \t\n]+"),
    ]


    def tokenize(source, rules=RULES):
        """Turn source text into a list of (kind, text, position) tokens. At each position try EVERY rule with re.match and take the LONGEST
        match; if two rules match equally long, the rule listed first wins (so 'if' is a keyword but 'iffy' is an identifier).
        Tokens of kind WS (whitespace) are discarded. If nothing matches, raise ValueError with a message that contains the position."""
        tokens = []
        pos = 0
        while pos < len(source):
            best = None
            for kind, pattern in rules:
                m = re.compile(pattern).match(source, pos)
                if m and m.end() > pos and (best is None or m.end() - pos > len(best[1])):
                    best = (kind, m.group(), pos)
            if best is None:
                raise ValueError("unexpected character %r at position %d" % (source[pos], pos))
            if best[0] != "WS":
                tokens.append(best)
            pos += len(best[1])
        return tokens
  explanation: Maximal munch means a scanner always takes the longest token it can.
