    def regex_to_nfa(pattern):
        """Thompson's construction (given to you; study it). Supports literal characters, '.' (any character), [abc] and [a-z] classes,
        backslash escapes, grouping with ( ), alternation |, and the postfix operators * + ?. Returns
        {"start": s, "accept": a, "edges": {state: [(symbol or None, next_state), ...]}} where None marks an epsilon edge (a free move)."""
        edges = {}
        pos = [0]

        def new_state():
            edges[len(edges)] = []
            return len(edges) - 1

        def peek():
            return pattern[pos[0]] if pos[0] < len(pattern) else None

        def expr():
            s, a = term()
            while peek() == "|":
                pos[0] += 1
                s2, a2 = term()
                ns, na = new_state(), new_state()
                edges[ns] += [(None, s), (None, s2)]
                edges[a].append((None, na))
                edges[a2].append((None, na))
                s, a = ns, na
            return s, a

        def term():
            s = new_state()
            a = s
            while peek() not in (None, "|", ")"):
                s2, a2 = factor()
                edges[a].append((None, s2))
                a = a2
            return s, a

        def factor():
            s, a = atom()
            while peek() in ("*", "+", "?"):
                op = pattern[pos[0]]
                pos[0] += 1
                ns, na = new_state(), new_state()
                edges[ns].append((None, s))
                edges[a].append((None, na))
                if op in "*?":
                    edges[ns].append((None, na))
                if op in "*+":
                    edges[a].append((None, s))
                s, a = ns, na
            return s, a

        def atom():
            c = peek()
            if c == "(":
                pos[0] += 1
                frag = expr()
                if peek() != ")":
                    raise ValueError("missing )")
                pos[0] += 1
                return frag
            if c is None or c in "*+?)|":
                raise ValueError("unexpected %r" % c)
            s, a = new_state(), new_state()
            if c == "[":
                pos[0] += 1
                chars = []
                while peek() not in (None, "]"):
                    ch = pattern[pos[0]]
                    if pos[0] + 2 < len(pattern) and pattern[pos[0] + 1] == "-" and pattern[pos[0] + 2] != "]":
                        chars += [chr(x) for x in range(ord(ch), ord(pattern[pos[0] + 2]) + 1)]
                        pos[0] += 3
                    else:
                        chars.append(ch)
                        pos[0] += 1
                if peek() != "]":
                    raise ValueError("missing ]")
                pos[0] += 1
                for ch in chars:
                    edges[s].append((ch, a))
                return s, a
            if c == "\\":
                pos[0] += 1
                c = peek()
                if c is None:
                    raise ValueError("dangling backslash")
                symbol = "\\" + c
            else:
                symbol = c
            pos[0] += 1
            edges[s].append((symbol, a))
            return s, a

        start, accept = expr()
        if pos[0] != len(pattern):
            raise ValueError("unmatched )")
        return {"start": start, "accept": accept, "edges": edges}


    def matches_symbol(symbol, ch):
        """Does an edge labelled `symbol` accept the character ch? '.' accepts anything; a two-character label like backslash-plus accepts that literal character."""
        if symbol == ".":
            return True
        if len(symbol) == 2 and symbol[0] == "\\":
            return symbol[1] == ch
        return symbol == ch


    def epsilon_closure(nfa, states):
        """Every state reachable from `states` using only epsilon (None) edges, including the starting states themselves, as a set.
        Use a stack: pop a state, push each epsilon-neighbour you have not seen."""
        seen = set(states)
        stack = list(states)
        while stack:
            s = stack.pop()
            for symbol, target in nfa["edges"][s]:
                if symbol is None and target not in seen:
                    seen.add(target)
                    stack.append(target)
        return seen


    def step(nfa, states, ch):
        """The set of states reachable from `states` by reading the single character ch (using matches_symbol) and then following any epsilon edges."""
        moved = set()
        for s in states:
            for symbol, target in nfa["edges"][s]:
                if symbol is not None and matches_symbol(symbol, ch):
                    moved.add(target)
        return epsilon_closure(nfa, moved)


    def nfa_accepts(nfa, text):
        """True if the NFA can finish in its accept state after reading ALL of text. Keep the SET of states you could be in:
        start with the closure of {start}, replace it by step(...) for each character, and at the end look for the accept state."""
        states = epsilon_closure(nfa, {nfa["start"]})
        for ch in text:
            states = step(nfa, states, ch)
            if not states:
                return False
        return nfa["accept"] in states


    def regex_matches(pattern, text):
        """True if the WHOLE text matches the pattern."""
        return nfa_accepts(regex_to_nfa(pattern), text)


    def nfa_to_dfa(nfa, alphabet):
        """The subset construction. Each DFA state stands for a SET of NFA states. Start with epsilon_closure({start}) as state 0. Using a
        queue (first in, first out) and iterating `sorted(alphabet)` in order, compute step(nfa, S, ch) for each set S; skip empty results
        (a missing move means reject); number new sets 1, 2, 3 ... in the order they are discovered. A DFA state accepts when its set
        contains the NFA's accept state. Return {"start": 0, "accepts": set of ints, "delta": {(state, char): state}}."""
        alphabet = sorted(alphabet)
        start = frozenset(epsilon_closure(nfa, {nfa["start"]}))
        ids = {start: 0}
        queue = [start]
        delta = {}
        accepts = set()
        while queue:
            current = queue.pop(0)
            if nfa["accept"] in current:
                accepts.add(ids[current])
            for ch in alphabet:
                target = frozenset(step(nfa, current, ch))
                if not target:
                    continue
                if target not in ids:
                    ids[target] = len(ids)
                    queue.append(target)
                delta[(ids[current], ch)] = ids[target]
        return {"start": 0, "accepts": accepts, "delta": delta}


    def dfa_accepts(dfa, text):
        """Run the DFA: follow one move per character (a missing move means reject at once) and report whether the final state accepts."""
        state = dfa["start"]
        for ch in text:
            state = dfa["delta"].get((state, ch))
            if state is None:
                return False
        return state in dfa["accepts"]
