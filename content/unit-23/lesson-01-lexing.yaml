        while pos < len(text):
            best_name, best_end = None, pos
            for name, dfa in dfas:
                end = longest_match(dfa, text, pos)
                if end > best_end:
                    best_name, best_end = name, end
            if best_name is None:
                raise ValueError("unexpected character %r at position %d" % (text[pos], pos))
            if best_name != "WS":
                tokens.append((best_name, text[pos:best_end], pos))
            pos = best_end
        return tokens
  explanation: 'This is how real scanner generators such as lex and flex work: regular expressions compiled to automata.'
commonMistakes:
- title: Taking the first match instead of the longest
  explanation: Then `==` becomes two `=` tokens.
- title: Putting the identifier rule before keywords
  explanation: With equal lengths the earlier rule wins, so keywords would never be recognised.
- title: Forgetting epsilon closure after each step
  explanation: Free moves must be followed or valid input will be rejected.
- title: Tracking only one state of an NFA
  explanation: Keep the whole set of possible states.
- title: Using regular expressions for nested structures
  explanation: Balanced parentheses are beyond finite automata; that is the parser's job.
summary:
- 'A compiler is a pipeline: lexer, parser, semantic analysis, optimization, code generation.'
- The lexer turns characters into tokens using the longest-match rule.
- Regular expressions become NFAs by Thompson's construction.
- The subset construction converts an NFA to a DFA, and minimization merges equivalent states.
- Scanner generators compile token rules into a DFA.
