        pass
  tests:
  - name: balanced
    code: |
      assert is_balanced("") and is_balanced("([]{})") and is_balanced("a(b)c[d]")
      assert not is_balanced("(") and not is_balanced(")(") and not is_balanced("([)]") and not is_balanced("{[}")
      assert is_balanced("((()))()") and not is_balanced("(()")
  solution: |
    def is_balanced(text):
        pairs = {')': '(', ']': '[', '}': '{'}
        stack = []
        for ch in text:
            if ch in '([{':
                stack.append(ch)
            elif ch in pairs:
                if not stack or stack.pop() != pairs[ch]:
                    return False
        return not stack
