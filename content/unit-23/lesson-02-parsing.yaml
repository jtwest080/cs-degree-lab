    def nullable_set(grammar):
        """The nonterminals that can produce the empty string. Repeat until nothing changes: a nonterminal is nullable if one of its
        alternatives is empty or consists only of nullable nonterminals."""
        nullable = set()
        changed = True
        while changed:
            changed = False
            for nt, alts in grammar.items():
                if nt not in nullable and any(all(s in nullable for s in alt) for alt in alts):
                    nullable.add(nt)
                    changed = True
        return nullable


    def first_of_sequence(symbols, first, nullable):
        """FIRST of a list of symbols: the set of terminals that can begin it, and a flag saying whether the whole list can vanish.
        Go through the symbols; a terminal adds itself and stops; a nonterminal adds first[nt] and continues only if it is nullable.
        `first` maps each nonterminal to its set; a symbol that is not a key of `first` is a terminal. Return (set, can_vanish)."""
        result = set()
        for s in symbols:
            if s not in first:
                result.add(s)
                return result, False
            result |= first[s]
            if s not in nullable:
                return result, False
        return result, True


    def first_sets(grammar):
        """FIRST(A) for every nonterminal A: the terminals that can appear first in a string derived from A (the empty string is not included;
        use nullable_set for that). Repeat over all productions until nothing changes."""
        nullable = nullable_set(grammar)
        first = {nt: set() for nt in grammar}
        changed = True
        while changed:
            changed = False
            for nt, alts in grammar.items():
                for alt in alts:
                    new, _ = first_of_sequence(alt, first, nullable)
                    if not new <= first[nt]:
                        first[nt] |= new
                        changed = True
        return first


    def follow_sets(grammar, start):
        """FOLLOW(A): the terminals that can appear right after A in some derivation; the end-of-input marker '$' follows the start symbol.
        For each production X -> ... B beta: add FIRST(beta) to FOLLOW(B); if beta can vanish (or is empty) add FOLLOW(X) too. Repeat until stable."""
        nullable = nullable_set(grammar)
        first = first_sets(grammar)
        follow = {nt: set() for nt in grammar}
        follow[start].add("$")
        changed = True
        while changed:
            changed = False
            for nt, alts in grammar.items():
                for alt in alts:
                    for i, sym in enumerate(alt):
                        if sym not in grammar:
                            continue
                        f, vanishes = first_of_sequence(alt[i + 1:], first, nullable)
                        new = set(f)
                        if vanishes:
                            new |= follow[nt]
                        if not new <= follow[sym]:
                            follow[sym] |= new
                            changed = True
        return follow


    def ll1_table(grammar, start):
        """The predictive parsing table {(nonterminal, next terminal): alternative number}. For each production A -> alpha numbered i: put i under
        every terminal in FIRST(alpha); if alpha can vanish also under every terminal in FOLLOW(A). If a cell would get two different alternatives
        the grammar is not LL(1): raise ValueError naming the nonterminal and the terminal."""
        nullable = nullable_set(grammar)
        first = first_sets(grammar)
        follow = follow_sets(grammar, start)
        table = {}
        for nt, alts in grammar.items():
            for i, alt in enumerate(alts):
                f, vanishes = first_of_sequence(alt, first, nullable)
                for terminal in (f | follow[nt]) if vanishes else f:
                    if (nt, terminal) in table and table[(nt, terminal)] != i:
                        raise ValueError("conflict for %s on %s" % (nt, terminal))
                    table[(nt, terminal)] = i
        return table


    def generate_words(grammar, start, max_len):
        """All strings of at most max_len terminals the grammar can produce (as tuples), found by expanding the leftmost nonterminal. For testing."""
        words = set()
        seen = set()
        stack = [(start,)]
        while stack:
            form = stack.pop()
            if form in seen or len(form) > 2 * max_len + 4:
                continue
            seen.add(form)
            if sum(1 for s in form if s not in grammar) > max_len:
                continue
            i = next((k for k, s in enumerate(form) if s in grammar), None)
            if i is None:
                words.add(form)
                continue
            for alt in grammar[form[i]]:
                stack.append(form[:i] + tuple(alt) + form[i + 1:])
        return words


    def eliminate_left_recursion(grammar):
        """Remove IMMEDIATE left recursion. For a nonterminal A with alternatives A -> A alpha1 | ... | beta1 | ... (the alphas follow a leading A,
        the betas do not start with A), rewrite as A -> beta1 A' | ... and A' -> alpha1 A' | ... | eps where A' is the name A + "'". Nonterminals
        without left recursion are copied unchanged. Keep the order of the nonterminals, putting A' right after A. Return a new grammar;
        ValueError if every alternative of some A starts with A (nothing can ever stop the recursion)."""
        result = {}
        for nt, alts in grammar.items():
            recursive = [alt[1:] for alt in alts if alt and alt[0] == nt]
            others = [alt for alt in alts if not (alt and alt[0] == nt)]
            if not recursive:
                result[nt] = [list(a) for a in alts]
                continue
            if not others:
                raise ValueError("%s can never stop recursing" % nt)
            new = nt + "'"
            result[nt] = [alt + [new] for alt in others]
            result[new] = [alt + [new] for alt in recursive] + [[]]
        return result


    def is_ll1(grammar, start):
        """True if a predictive parser can parse the grammar with one token of lookahead (the table has no conflicts)."""
        try:
            ll1_table(grammar, start)
            return True
        except ValueError:
            return False
  explanation: Rewriting a grammar can make it parseable without changing the language.
commonMistakes:
- title: Using a regular expression for nested structure
  explanation: Balanced brackets need a grammar and a stack.
- title: Forgetting that FIRST can include FOLLOW for nullable rules
  explanation: An empty alternative is chosen when the next token can follow the nonterminal.
- title: Leaving left recursion in a top-down grammar
  explanation: The parser loops forever.
- title: Writing an ambiguous grammar
  explanation: Layer the rules so every sentence has one parse tree.
- title: Treating FIRST sets as including epsilon
  explanation: Track nullability separately so the sets only hold real tokens.
summary:
- Context-free grammars describe nested structure that regular expressions cannot.
- A parse tree records which rules built a sentence; ambiguity means two trees.
- FIRST, FOLLOW and nullable sets let a parser choose a rule from one token of lookahead.
- An LL(1) table and a recursive procedure give a predictive parser.
- Left recursion must be removed for top-down parsing.
