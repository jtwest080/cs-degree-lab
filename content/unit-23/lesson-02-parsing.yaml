id: u23-parsing
title: Grammars and Parsing
minutes: 95
objective: Learn how a compiler discovers the structure of a program. You will meet context-free grammars, derivations and parse trees, and build a predictive top-down parser from FIRST and FOLLOW sets, including how to rewrite a grammar so that such a parser can handle it.
outcomes:
- Read and write a context-free grammar
- Replay a leftmost derivation
- Compute nullable, FIRST and FOLLOW sets
- Build an LL(1) table and a predictive parser
- Eliminate immediate left recursion
sections:
- heading: Why regular expressions are not enough
  body: |-
    After the lexer, the compiler has a flat list of tokens: `id + id * id`. It still has no idea that the multiplication happens before the addition, or that parentheses must come in matching pairs. Regular expressions and finite automata cannot even express "balanced parentheses", because a finite machine has no way to count arbitrarily deep nesting. We need something stronger: a **context-free grammar** (CFG).

    A grammar is a set of **production rules**. The symbols on the left are **nonterminals**: names for kinds of phrases, such as `Expr` or `Statement`. The symbols that actually appear in the program (the tokens) are **terminals**. A rule says "this phrase can be built from these parts": `Expr -> Expr + Term` means an expression can be an expression, a plus sign, then a term. The `|` symbol separates alternatives, and **eps** (ε, epsilon) stands for the **empty production**: nothing at all. One nonterminal is the **start symbol**. A **derivation** starts with the start symbol and repeatedly replaces a nonterminal by the right side of one of its rules until only terminals remain; the result is a **sentence** of the language. In a **leftmost derivation** you always replace the leftmost nonterminal. The grammar `S -> a S b | eps` generates `ab`, `aabb`, `aaabbb`: exactly the balanced strings regular expressions cannot describe.
- heading: Parse trees, ambiguity and structure
  body: |-
    Recording which rule was used at each step produces a **parse tree**: the start symbol at the root, each nonterminal node having the symbols of its rule as children, and the tokens as leaves read left to right. The tree *is* the structure of the program: for `1 + 2 * 3` the grammar should put `2 * 3` below `+` so multiplication binds tighter. Grammars encode precedence by layering: `Expr` handles `+`, which uses `Term`, which handles `*`, which uses `Factor` (a number or a parenthesised `Expr`). Deeper layers bind tighter.

    A grammar is **ambiguous** if some sentence has two different parse trees. `E -> E + E | E * E | id` is ambiguous: `id + id * id` can be grouped either way, and a program could then mean two different things. Fixing ambiguity (by layering, as above) is part of designing a language. Another design question is **associativity**: does `a - b - c` mean `(a - b) - c`? Left recursive rules like `E -> E - T` give left associativity naturally. The trouble is that the simplest parsers, the *top-down* ones, cannot handle left recursion, as you will see below.
- heading: Predictive parsing with FIRST and FOLLOW
  body: |-
    A **top-down parser** starts from the start symbol and tries to match the input, expanding nonterminals as it goes. The danger is choosing the wrong alternative and having to backtrack. A **predictive parser** never guesses: it chooses the alternative by peeking at the **next token** (the lookahead). Grammars that allow this with a single token of lookahead are called **LL(1)**: read input Left to right, build a Leftmost derivation, 1 token of lookahead.

    To decide, we compute three things. A nonterminal is **nullable** if it can produce the empty string. **FIRST(X)** is the set of terminals that can begin a string derived from `X`. **FOLLOW(A)** is the set of terminals that can appear right after `A` somewhere in the language (the special marker `$` marks end of input). Then the **parsing table** says: to expand `A` when the next token is `t`, use alternative `i` if `t` is in FIRST of alternative `i`, or, if alternative `i` can vanish, if `t` is in FOLLOW(A). If a table cell gets two alternatives, the grammar is not LL(1). The parser itself is a simple recursive procedure: to parse a terminal, check it matches the next token; to parse a nonterminal, look up the table and parse its chosen alternative's symbols in order. It builds the parse tree as it goes, and when the table has no entry it reports a **syntax error** at that token's position.

    **Left recursion** breaks this: `E -> E + T | T` has `E` in the first position of its own rule, so FIRST sets of both alternatives overlap and the parser would expand `E` forever. The fix: rewrite `E -> T E'` and `E' -> + T E' | eps`. The language is unchanged but the grammar is now LL(1). (Parser generators for other techniques, such as LR parsers used by yacc and bison, handle left recursion directly.)
examples:
- title: A predictive parser at work
  intro: 'The classic expression grammar: FIRST and FOLLOW sets, the table, a parse tree and a syntax error.'
  code: |
    def parse_grammar(text):
        """Read a grammar written one rule per line, like  E -> T Ep  or  Ep -> + T Ep | eps  (symbols are separated by spaces, '|'
        separates alternatives, and the word eps means the empty production). Return (start_symbol, grammar) where the start symbol is the
        left side of the first rule and grammar is {nonterminal: [[symbol, ...], ...]} (an empty list is the empty production). A rule whose
        left side appears twice adds more alternatives. ValueError for a line without '->' or with an empty alternative."""
        start = None
        grammar = {}
        for line in text.strip().splitlines():
            line = line.strip()
            if not line:
                continue
            if "->" not in line:
                raise ValueError("missing -> in %r" % line)
            left, right = line.split("->", 1)
            left = left.strip()
            if start is None:
                start = left
            for alternative in right.split("|"):
                symbols = alternative.split()
                if not symbols:
                    raise ValueError("empty alternative in %r" % line)
                grammar.setdefault(left, []).append([] if symbols == ["eps"] else symbols)
        return start, grammar


    def terminals_of(grammar):
        """The set of symbols that appear on right sides but are not nonterminals (not keys of the grammar)."""
        return {s for alts in grammar.values() for alt in alts for s in alt if s not in grammar}


    def derive(grammar, start, choices):
        """Replay a LEFTMOST derivation. Begin with the tuple (start,). For each number i in choices, replace the leftmost nonterminal of the
        current form with the i-th alternative of its rule. Return the list of all forms (tuples), starting with (start,).
        ValueError if there is no nonterminal left to replace or an alternative number does not exist."""
        forms = [(start,)]
        for i in choices:
            form = forms[-1]
            spot = next((k for k, s in enumerate(form) if s in grammar), None)
            if spot is None:
                raise ValueError("nothing left to replace")
            alternatives = grammar[form[spot]]
            if not 0 <= i < len(alternatives):
                raise ValueError("no alternative %d for %s" % (i, form[spot]))
            forms.append(form[:spot] + tuple(alternatives[i]) + form[spot + 1:])
        return forms


    def nullable_set(grammar):
        """The nonterminals that can produce the empty string. Repeat until nothing changes: a nonterminal is nullable if one of its
        alternatives is empty or consists only of nullable nonterminals."""
        nullable = set()
        changed = True
        while changed:
            changed = False
            for nt, alts in grammar.items():
                if nt not in nullable and any(all(s in nullable for s in alt) for alt in alts):
                    nullable.add(nt)
                    changed = True
        return nullable


    def first_of_sequence(symbols, first, nullable):
        """FIRST of a list of symbols: the set of terminals that can begin it, and a flag saying whether the whole list can vanish.
        Go through the symbols; a terminal adds itself and stops; a nonterminal adds first[nt] and continues only if it is nullable.
        `first` maps each nonterminal to its set; a symbol that is not a key of `first` is a terminal. Return (set, can_vanish)."""
        result = set()
        for s in symbols:
            if s not in first:
                result.add(s)
                return result, False
            result |= first[s]
            if s not in nullable:
                return result, False
        return result, True


    def first_sets(grammar):
        """FIRST(A) for every nonterminal A: the terminals that can appear first in a string derived from A (the empty string is not included;
        use nullable_set for that). Repeat over all productions until nothing changes."""
        nullable = nullable_set(grammar)
        first = {nt: set() for nt in grammar}
        changed = True
        while changed:
            changed = False
            for nt, alts in grammar.items():
                for alt in alts:
                    new, _ = first_of_sequence(alt, first, nullable)
                    if not new <= first[nt]:
                        first[nt] |= new
                        changed = True
        return first


    def follow_sets(grammar, start):
        """FOLLOW(A): the terminals that can appear right after A in some derivation; the end-of-input marker '$' follows the start symbol.
        For each production X -> ... B beta: add FIRST(beta) to FOLLOW(B); if beta can vanish (or is empty) add FOLLOW(X) too. Repeat until stable."""
        nullable = nullable_set(grammar)
        first = first_sets(grammar)
        follow = {nt: set() for nt in grammar}
        follow[start].add("$")
        changed = True
        while changed:
            changed = False
            for nt, alts in grammar.items():
                for alt in alts:
                    for i, sym in enumerate(alt):
                        if sym not in grammar:
                            continue
                        f, vanishes = first_of_sequence(alt[i + 1:], first, nullable)
                        new = set(f)
                        if vanishes:
                            new |= follow[nt]
                        if not new <= follow[sym]:
                            follow[sym] |= new
                            changed = True
        return follow


    def ll1_table(grammar, start):
        """The predictive parsing table {(nonterminal, next terminal): alternative number}. For each production A -> alpha numbered i: put i under
        every terminal in FIRST(alpha); if alpha can vanish also under every terminal in FOLLOW(A). If a cell would get two different alternatives
        the grammar is not LL(1): raise ValueError naming the nonterminal and the terminal."""
        nullable = nullable_set(grammar)
        first = first_sets(grammar)
        follow = follow_sets(grammar, start)
        table = {}
        for nt, alts in grammar.items():
            for i, alt in enumerate(alts):
                f, vanishes = first_of_sequence(alt, first, nullable)
                for terminal in (f | follow[nt]) if vanishes else f:
                    if (nt, terminal) in table and table[(nt, terminal)] != i:
                        raise ValueError("conflict for %s on %s" % (nt, terminal))
                    table[(nt, terminal)] = i
        return table


    def parse(grammar, start, table, tokens):
        """A predictive (top-down) parser. Parse the list of terminal tokens with the table and return the parse tree as nested pairs
        (symbol, children): a terminal is (token, []) and a nonterminal is (name, [child trees]). To expand a nonterminal look at the NEXT token
        (or '$' after the last one), look up table[(nonterminal, token)] to choose the alternative, and parse its symbols in order.
        ValueError whose message contains the token position when a terminal does not match, the table has no entry, or tokens are left over."""
        tokens = list(tokens) + ["$"]
        pos = 0

        def build(symbol):
            nonlocal pos
            if symbol not in grammar:
                if tokens[pos] != symbol:
                    raise ValueError("expected %s but found %s at position %d" % (symbol, tokens[pos], pos))
                pos += 1
                return (symbol, [])
            key = (symbol, tokens[pos])
            if key not in table:
                raise ValueError("unexpected %s at position %d" % (tokens[pos], pos))
            return (symbol, [build(s) for s in grammar[symbol][table[key]]])

        tree = build(start)
        if tokens[pos] != "$":
            raise ValueError("extra input %s at position %d" % (tokens[pos], pos))
        return tree


    def leaves(tree, grammar):
        """The terminals of a parse tree from left to right (the original tokens). A node whose symbol is not a nonterminal of `grammar` is a
        terminal; a nonterminal with no children came from an empty production and contributes nothing."""
        symbol, children = tree
        if symbol not in grammar:
            return [symbol]
        return [leaf for child in children for leaf in leaves(child, grammar)]

    start, grammar = parse_grammar("""
    E -> T Ep
    Ep -> + T Ep | eps
    T -> F Tp
    Tp -> * F Tp | eps
    F -> ( E ) | id
    """)
    print("terminals:", sorted(terminals_of(grammar)))
    print("FIRST(E):", sorted(first_sets(grammar)["E"]), " FOLLOW(Ep):", sorted(follow_sets(grammar, start)["Ep"]))
    table = ll1_table(grammar, start)
    print("table entries:", len(table))
    tree = parse(grammar, start, table, ["id", "+", "id", "*", "id"])
    print("parsed tokens:", leaves(tree, grammar))
    print("first rule used:", tree[0], "->", [child[0] for child in tree[1]])
    try:
        parse(grammar, start, table, ["id", "+", "+"])
    except ValueError as error:
        print("error:", error)
  output: |
    terminals: ['(', ')', '*', '+', 'id']
    FIRST(E): ['(', 'id']  FOLLOW(Ep): ['$', ')']
    table entries: 13
    parsed tokens: ['id', '+', 'id', '*', 'id']
    first rule used: E -> ['T', 'Ep']
    error: unexpected + at position 2
