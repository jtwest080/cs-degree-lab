- type: code
  question: Write `is_balanced(text)` returning True if the brackets `(`, `[` and `{` in `text` are properly nested and closed (ignore every other character). A grammar would say `S -> ( S ) S | [ S ] S | { S } S | eps`; use a stack.
  starter: |
