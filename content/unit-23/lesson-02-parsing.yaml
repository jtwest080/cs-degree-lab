    def parse_grammar(text):
        """Read a grammar written one rule per line, like  E -> T Ep  or  Ep -> + T Ep | eps  (symbols are separated by spaces, '|'
        separates alternatives, and the word eps means the empty production). Return (start_symbol, grammar) where the start symbol is the
        left side of the first rule and grammar is {nonterminal: [[symbol, ...], ...]} (an empty list is the empty production). A rule whose
        left side appears twice adds more alternatives. ValueError for a line without '->' or with an empty alternative."""
        start = None
        grammar = {}
        for line in text.strip().splitlines():
            line = line.strip()
            if not line:
                continue
            if "->" not in line:
                raise ValueError("missing -> in %r" % line)
            left, right = line.split("->", 1)
            left = left.strip()
            if start is None:
                start = left
