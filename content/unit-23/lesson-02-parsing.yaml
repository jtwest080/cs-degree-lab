    code: |
      start, g = parse_grammar("E -> T Ep\nEp -> + T Ep | eps\nT -> id")
      assert start == "E"
      assert g == {"E": [["T", "Ep"]], "Ep": [["+", "T", "Ep"], []], "T": [["id"]]}
      assert terminals_of(g) == {"+", "id"}
      s2, g2 = parse_grammar("\n  S -> a S b | eps  \n\nS -> c\n")
      assert s2 == "S" and g2 == {"S": [["a", "S", "b"], [], ["c"]]}
      for bad in ("S a b", "S -> a | ", "S ->"):
          try:
              parse_grammar(bad)
              raise AssertionError("accepted " + bad)
          except ValueError:
              pass
  - name: derivations
    code: |
      start, g = parse_grammar("S -> a S b | eps")
      forms = derive(g, start, [0, 0, 1])
      assert forms == [("S",), ("a", "S", "b"), ("a", "a", "S", "b", "b"), ("a", "a", "b", "b")]
      assert derive(g, start, []) == [("S",)]
      for bad in ([1, 0], [2], [-1]):
          try:
              derive(g, start, bad)
              raise AssertionError("accepted")
          except ValueError:
              pass
      start, e = parse_grammar("E -> E + T | T\nT -> id")
      assert derive(e, start, [0, 1, 0, 0])[-1] == ("id", "+", "id")
