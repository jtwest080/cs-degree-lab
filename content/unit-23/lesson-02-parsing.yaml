                        raise ValueError("conflict for %s on %s" % (nt, terminal))
                    table[(nt, terminal)] = i
        return table


    def parse(grammar, start, table, tokens):
        """A predictive (top-down) parser. Parse the list of terminal tokens with the table and return the parse tree as nested pairs
        (symbol, children): a terminal is (token, []) and a nonterminal is (name, [child trees]). To expand a nonterminal look at the NEXT token
        (or '$' after the last one), look up table[(nonterminal, token)] to choose the alternative, and parse its symbols in order.
        ValueError whose message contains the token position when a terminal does not match, the table has no entry, or tokens are left over."""
        tokens = list(tokens) + ["$"]
        pos = 0

        def build(symbol):
            nonlocal pos
            if symbol not in grammar:
                if tokens[pos] != symbol:
                    raise ValueError("expected %s but found %s at position %d" % (symbol, tokens[pos], pos))
                pos += 1
                return (symbol, [])
            key = (symbol, tokens[pos])
            if key not in table:
                raise ValueError("unexpected %s at position %d" % (tokens[pos], pos))
            return (symbol, [build(s) for s in grammar[symbol][table[key]]])

        tree = build(start)
        if tokens[pos] != "$":
            raise ValueError("extra input %s at position %d" % (tokens[pos], pos))
        return tree


    def leaves(tree, grammar):
        """The terminals of a parse tree from left to right (the original tokens). A node whose symbol is not a nonterminal of `grammar` is a
        terminal; a nonterminal with no children came from an empty production and contributes nothing."""
        symbol, children = tree
        if symbol not in grammar:
            return [symbol]
        return [leaf for child in children for leaf in leaves(child, grammar)]
