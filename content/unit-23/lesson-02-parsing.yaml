        for i in choices:
            form = forms[-1]
            spot = next((k for k, s in enumerate(form) if s in grammar), None)
            if spot is None:
                raise ValueError("nothing left to replace")
            alternatives = grammar[form[spot]]
            if not 0 <= i < len(alternatives):
                raise ValueError("no alternative %d for %s" % (i, form[spot]))
            forms.append(form[:spot] + tuple(alternatives[i]) + form[spot + 1:])
        return forms


    def nullable_set(grammar):
        """The nonterminals that can produce the empty string. Repeat until nothing changes: a nonterminal is nullable if one of its
        alternatives is empty or consists only of nullable nonterminals."""
