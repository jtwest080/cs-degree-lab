                i += 1
            elif ch.isdigit():
                j = i
                while j < len(text) and text[j].isdigit():
                    j += 1
                if j + 1 < len(text) and text[j] == "." and text[j + 1].isdigit():
                    j += 1
                    while j < len(text) and text[j].isdigit():
                        j += 1
                tokens.append(("NUM", text[i:j], i))
                i = j
            elif ch.isalpha() or ch == "_":
                j = i
                while j < len(text) and (text[j].isalnum() or text[j] == "_"):
                    j += 1
                tokens.append(("ID", text[i:j], i))
                i = j
            elif ch in "+-*/^":
                tokens.append(("OP", ch, i))
                i += 1
            elif ch in "(),":
                tokens.append(({"(": "LPAREN", ")": "RPAREN", ",": "COMMA"}[ch], ch, i))
                i += 1
            else:
                raise ValueError("unexpected character %r at position %d" % (ch, i))
        return tokens


    def parse(text):
        """Pratt (precedence climbing) parser. Return an abstract syntax tree (AST) made of tuples:
        ("num", value) with int or float value, ("var", name), ("unary", "-", operand), ("binop", op, left, right) and ("call", name, [args]).
        Rules: + and - bind weakest (10) and group left to right; * and / (20) also left to right; ^ (30) groups RIGHT to left; unary minus (25) binds
        tighter than * but looser than ^, so -2^2 means -(2^2). Parentheses group. A name followed by ( is a call with comma-separated arguments.
        Use the table BINARY. Core idea: parse_expr(min_prec) parses a prefix item, then keeps taking operators whose precedence is at least
        min_prec; the right side is parsed with prec + 1 for left-associative operators and prec for right-associative ones.
        ValueError with 'at position N' (N is len(text) at the end of input) for any syntax error, including leftover tokens."""
        tokens = tokenize_expr(text)
        pos = 0

        def peek():
            return tokens[pos] if pos < len(tokens) else None

        def take():
            nonlocal pos
            token = peek()
            pos += 1
            return token

        def where(token):
            return token[2] if token else len(text)

        def parse_expr(min_prec):
            left = parse_prefix()
            while True:
                token = peek()
                if token is None or token[0] != "OP" or token[1] not in BINARY:
                    return left
                prec, assoc = BINARY[token[1]]
                if prec < min_prec:
                    return left
                take()
                right = parse_expr(prec + 1 if assoc == "left" else prec)
                left = ("binop", token[1], left, right)

        def parse_prefix():
            token = take()
            if token is None:
                raise ValueError("unexpected end of input at position %d" % len(text))
            kind, value, p = token
            if kind == "NUM":
                return ("num", float(value) if "." in value else int(value))
            if kind == "ID":
                nxt = peek()
                if nxt is None or nxt[0] != "LPAREN":
                    return ("var", value)
                take()
                args = []
                if peek() is not None and peek()[0] == "RPAREN":
