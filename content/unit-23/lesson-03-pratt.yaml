- title: Compiling a tree
  intro: The same expression run by walking the tree and by a compiled closure, and substitution.
  code: |
    import math

    BINARY = {"+": (10, "left"), "-": (10, "left"), "*": (20, "left"), "/": (20, "left"), "^": (30, "right")}
    UNARY_PRECEDENCE = 25
    FUNCTIONS = {"sqrt": math.sqrt, "abs": abs, "max": max, "min": min, "sin": math.sin, "cos": math.cos, "exp": math.exp, "ln": math.log}


    def tokenize_expr(text):
        """Split an expression into (kind, text, position) tokens: NUM (digits, optionally with one decimal point), ID (letters, digits and
        underscores, not starting with a digit), OP (one of + - * / ^), LPAREN, RPAREN and COMMA. Spaces are skipped.
        ValueError containing the position for any other character."""
        tokens = []
        i = 0
        while i < len(text):
            ch = text[i]
            if ch.isspace():
                i += 1
            elif ch.isdigit():
                j = i
                while j < len(text) and text[j].isdigit():
                    j += 1
                if j + 1 < len(text) and text[j] == "." and text[j + 1].isdigit():
                    j += 1
                    while j < len(text) and text[j].isdigit():
                        j += 1
                tokens.append(("NUM", text[i:j], i))
                i = j
            elif ch.isalpha() or ch == "_":
                j = i
                while j < len(text) and (text[j].isalnum() or text[j] == "_"):
                    j += 1
                tokens.append(("ID", text[i:j], i))
                i = j
            elif ch in "+-*/^":
                tokens.append(("OP", ch, i))
                i += 1
            elif ch in "(),":
                tokens.append(({"(": "LPAREN", ")": "RPAREN", ",": "COMMA"}[ch], ch, i))
                i += 1
            else:
                raise ValueError("unexpected character %r at position %d" % (ch, i))
        return tokens


    def parse(text):
        """Pratt (precedence climbing) parser. Return an abstract syntax tree (AST) made of tuples:
        ("num", value) with int or float value, ("var", name), ("unary", "-", operand), ("binop", op, left, right) and ("call", name, [args]).
        Rules: + and - bind weakest (10) and group left to right; * and / (20) also left to right; ^ (30) groups RIGHT to left; unary minus (25) binds
        tighter than * but looser than ^, so -2^2 means -(2^2). Parentheses group. A name followed by ( is a call with comma-separated arguments.
        Use the table BINARY. Core idea: parse_expr(min_prec) parses a prefix item, then keeps taking operators whose precedence is at least
        min_prec; the right side is parsed with prec + 1 for left-associative operators and prec for right-associative ones.
        ValueError with 'at position N' (N is len(text) at the end of input) for any syntax error, including leftover tokens."""
        tokens = tokenize_expr(text)
        pos = 0

        def peek():
            return tokens[pos] if pos < len(tokens) else None

        def take():
            nonlocal pos
            token = peek()
            pos += 1
            return token

        def where(token):
            return token[2] if token else len(text)

        def parse_expr(min_prec):
            left = parse_prefix()
            while True:
                token = peek()
                if token is None or token[0] != "OP" or token[1] not in BINARY:
                    return left
                prec, assoc = BINARY[token[1]]
                if prec < min_prec:
                    return left
                take()
                right = parse_expr(prec + 1 if assoc == "left" else prec)
                left = ("binop", token[1], left, right)

        def parse_prefix():
            token = take()
            if token is None:
                raise ValueError("unexpected end of input at position %d" % len(text))
            kind, value, p = token
            if kind == "NUM":
                return ("num", float(value) if "." in value else int(value))
            if kind == "ID":
                nxt = peek()
                if nxt is None or nxt[0] != "LPAREN":
                    return ("var", value)
                take()
                args = []
                if peek() is not None and peek()[0] == "RPAREN":
                    take()
                    return ("call", value, args)
                while True:
                    args.append(parse_expr(0))
                    closer = take()
                    if closer is not None and closer[0] == "RPAREN":
                        return ("call", value, args)
                    if closer is None or closer[0] != "COMMA":
                        raise ValueError("expected , or ) at position %d" % where(closer))
            if kind == "LPAREN":
                inner = parse_expr(0)
                closer = take()
                if closer is None or closer[0] != "RPAREN":
                    raise ValueError("expected ) at position %d" % where(closer))
                return inner
            if kind == "OP" and value == "-":
                return ("unary", "-", parse_expr(UNARY_PRECEDENCE))
            raise ValueError("unexpected %s at position %d" % (value, p))

        tree = parse_expr(0)
        if pos < len(tokens):
            raise ValueError("unexpected %s at position %d" % (tokens[pos][1], tokens[pos][2]))
        return tree


    def evaluate(ast, env=None):
        """Compute the value of an AST. `env` maps variable names to numbers. `/` is true division. ValueError for an undefined variable
        ('undefined variable NAME'), division by zero, an unknown function, a call with the wrong number of arguments or an argument outside
        a function's domain (such as sqrt of a negative number), and a power that would not be a real number."""
        env = env or {}
        kind = ast[0]
        if kind == "num":
            return ast[1]
        if kind == "var":
            if ast[1] not in env:
                raise ValueError("undefined variable %s" % ast[1])
            return env[ast[1]]
        if kind == "unary":
            return -evaluate(ast[2], env)
        if kind == "binop":
            op = ast[1]
            a = evaluate(ast[2], env)
            b = evaluate(ast[3], env)
            if op == "+":
                return a + b
            if op == "-":
                return a - b
            if op == "*":
                return a * b
            if op == "/":
                if b == 0:
                    raise ValueError("division by zero")
                return a / b
            try:
                result = a ** b
            except ZeroDivisionError:
                raise ValueError("division by zero")
            if isinstance(result, complex):
                raise ValueError("power is not a real number")
            return result
        if kind == "call":
            name, args = ast[1], [evaluate(a, env) for a in ast[2]]
            if name not in FUNCTIONS:
                raise ValueError("unknown function %s" % name)
            try:
                return FUNCTIONS[name](*args)
            except (TypeError, ValueError) as error:
                raise ValueError("bad call to %s: %s" % (name, error))
        raise ValueError("unknown node %r" % (kind,))


    def free_variables(ast):
        """The sorted list of distinct variable names used in the AST (function names are not variables)."""
        kind = ast[0]
        if kind == "var":
            return [ast[1]]
        if kind == "num":
            return []
        names = set()
        children = ast[2:] if kind in ("unary", "binop") else ast[2]
        for child in children:
            names.update(free_variables(child))
        return sorted(names)




    def substitute(ast, name, replacement):
        """A new AST in which every occurrence of the variable `name` is replaced by the AST `replacement`."""
        kind = ast[0]
        if kind == "var":
            return replacement if ast[1] == name else ast
        if kind == "num":
            return ast
        if kind == "unary":
            return ("unary", "-", substitute(ast[2], name, replacement))
        if kind == "binop":
            return ("binop", ast[1], substitute(ast[2], name, replacement), substitute(ast[3], name, replacement))
        return ("call", ast[1], [substitute(a, name, replacement) for a in ast[2]])


    def tree_depth(ast):
        """The number of levels in the tree: a number or variable has depth 1; an operator or call has one more than its deepest child
        (a call with no arguments has depth 1)."""
        kind = ast[0]
        if kind in ("num", "var"):
            return 1
        children = ast[2:] if kind in ("unary", "binop") else ast[2]
        return 1 + max((tree_depth(c) for c in children), default=0)


    def compile_ast(ast):
        """Turn the AST into a Python function f(env) that computes the same value as evaluate(ast, env), by building nested closures ONCE
        instead of walking the tree on every call (the idea behind a compiler). Errors must behave like evaluate: raise ValueError when the function
        is CALLED (undefined variable, division by zero, unknown function...), not when it is built. You may reuse evaluate for the rare error cases."""
        kind = ast[0]
        if kind == "num":
            value = ast[1]
            return lambda env: value
        if kind == "var":
            name = ast[1]

            def lookup(env):
                if name not in env:
                    raise ValueError("undefined variable %s" % name)
                return env[name]
            return lookup
        if kind == "unary":
            inner = compile_ast(ast[2])
            return lambda env: -inner(env)
        if kind == "binop":
            op = ast[1]
            left, right = compile_ast(ast[2]), compile_ast(ast[3])
            if op == "+":
                return lambda env: left(env) + right(env)
            if op == "-":
                return lambda env: left(env) - right(env)
            if op == "*":
                return lambda env: left(env) * right(env)
            return lambda env: evaluate(("binop", op, ("num", left(env)), ("num", right(env))))
        args = [compile_ast(a) for a in ast[2]]
        name = ast[1]
        return lambda env: evaluate(("call", name, [("num", f(env)) for f in args]))

    import time
    tree = parse("x * x + 3 * x - 7 / (x + 1)")
    slow = lambda env: evaluate(tree, env)
    fast = compile_ast(tree)
    print("same answer:", slow({"x": 4}) == fast({"x": 4}), round(fast({"x": 4}), 3))
    start = time.perf_counter()
    for i in range(20000):
        slow({"x": i})
    t_slow = time.perf_counter() - start
    start = time.perf_counter()
    for i in range(20000):
        fast({"x": i})
    t_fast = time.perf_counter() - start
    print("compiled version at least as fast:", t_fast <= t_slow * 1.5)
    print("substituting x = y + 1 gives depth", tree_depth(substitute(tree, "x", parse("y + 1"))), "instead of", tree_depth(tree))
