    def evaluate(ast, env=None):
        """Compute the value of an AST. `env` maps variable names to numbers. `/` is true division. ValueError for an undefined variable
        ('undefined variable NAME'), division by zero, an unknown function, a call with the wrong number of arguments or an argument outside
        a function's domain (such as sqrt of a negative number), and a power that would not be a real number."""
        env = env or {}
        kind = ast[0]
        if kind == "num":
            return ast[1]
        if kind == "var":
            if ast[1] not in env:
                raise ValueError("undefined variable %s" % ast[1])
            return env[ast[1]]
        if kind == "unary":
            return -evaluate(ast[2], env)
        if kind == "binop":
            op = ast[1]
            a = evaluate(ast[2], env)
            b = evaluate(ast[3], env)
            if op == "+":
                return a + b
            if op == "-":
                return a - b
            if op == "*":
                return a * b
            if op == "/":
                if b == 0:
                    raise ValueError("division by zero")
                return a / b
            try:
                result = a ** b
            except ZeroDivisionError:
                raise ValueError("division by zero")
            if isinstance(result, complex):
                raise ValueError("power is not a real number")
            return result
        if kind == "call":
            name, args = ast[1], [evaluate(a, env) for a in ast[2]]
            if name not in FUNCTIONS:
                raise ValueError("unknown function %s" % name)
            try:
                return FUNCTIONS[name](*args)
            except (TypeError, ValueError) as error:
                raise ValueError("bad call to %s: %s" % (name, error))
        raise ValueError("unknown node %r" % (kind,))


    def precedence_of(ast):
        """How tightly a node binds: 10, 20 or 30 for binary operators, 25 for unary minus, 100 for everything else (numbers, names, calls)."""
        if ast[0] == "binop":
            return BINARY[ast[1]][0]
        if ast[0] == "unary":
            return UNARY_PRECEDENCE
        return 100


    def to_string(ast):
        """Write the AST back as text with the FEWEST parentheses that still parse to the same tree. Binary operators are written with a space
        on each side ('a + b'); calls as 'f(a, b)'; unary minus as '-x'. A left operand needs parentheses if it binds looser than the operator, or equally
        tight for a right-associative operator (^), or is a unary minus under ^ (since -x^2 means -(x^2)). A right operand needs them if it binds looser,
        or equally tight for a left-associative operator. A unary minus needs them around an operand that binds looser than 25 or is itself a unary minus."""
        kind = ast[0]
        if kind == "num":
            return str(ast[1])
        if kind == "var":
            return ast[1]
        if kind == "call":
            return "%s(%s)" % (ast[1], ", ".join(to_string(a) for a in ast[2]))
        if kind == "unary":
            inner = to_string(ast[2])
            if precedence_of(ast[2]) < UNARY_PRECEDENCE or ast[2][0] == "unary":
                inner = "(" + inner + ")"
            return "-" + inner
        op, left, right = ast[1], ast[2], ast[3]
        prec, assoc = BINARY[op]
        ls, rs = to_string(left), to_string(right)
        lp, rp = precedence_of(left), precedence_of(right)
        if lp < prec or (lp == prec and assoc == "right") or (left[0] == "unary" and op == "^"):
            ls = "(" + ls + ")"
        if rp < prec or (rp == prec and assoc == "left"):
            rs = "(" + rs + ")"
        return "%s %s %s" % (ls, op, rs)


    def to_rpn(ast):
        """The expression in reverse Polish (postfix) order as a list of strings: operands first, then the operator. Numbers and names are written as
        text, binary operators as themselves, unary minus as 'neg', and a call as 'name/argument-count' after its arguments. '1 + 2 * 3' gives
        ['1', '2', '3', '*', '+']."""
        kind = ast[0]
        if kind == "num":
            return [str(ast[1])]
        if kind == "var":
            return [ast[1]]
        if kind == "unary":
            return to_rpn(ast[2]) + ["neg"]
        if kind == "binop":
            return to_rpn(ast[2]) + to_rpn(ast[3]) + [ast[1]]
        out = []
        for a in ast[2]:
            out += to_rpn(a)
        return out + ["%s/%d" % (ast[1], len(ast[2]))]
