        kind = ast[0]
        if kind == "num":
            return ast[1]
        if kind == "var":
            if ast[1] not in env:
                raise ValueError("undefined variable %s" % ast[1])
            return env[ast[1]]
        if kind == "unary":
            return -evaluate(ast[2], env)
