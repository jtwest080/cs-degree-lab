        """One bottom-up pass of simplification: first simplify the children, then apply to the node: fold an operation on two numbers (except
        division by zero or a power that is not a real number, which stay as they are); x + 0, 0 + x, x - 0, x * 1, 1 * x, x / 1, x ^ 1 become x;
        x * 0 and 0 * x become 0; x ^ 0 becomes 1; unary minus of a number becomes a negative number, and minus minus x becomes x."""
