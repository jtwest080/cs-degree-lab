- type: code
  question: 'Write `count_ops(ast)` that returns how many `"binop"` and `"unary"` nodes the AST contains. Nodes are tuples: `("num", v)`, `("var", name)`, `("unary", "-", operand)`, `("binop", op, left, right)`, and `("call", name, [args])`.'
  starter: |
    def count_ops(ast):
        pass
  tests:
  - name: count
    code: |
      n = ("num", 1)
      x = ("var", "x")
      assert count_ops(n) == 0 and count_ops(x) == 0
      assert count_ops(("binop", "+", n, x)) == 1
      assert count_ops(("unary", "-", ("binop", "*", n, x))) == 2
      assert count_ops(("call", "f", [("binop", "+", n, n), ("unary", "-", x)])) == 2
      assert count_ops(("call", "f", [])) == 0
  solution: |
    def count_ops(ast):
        kind = ast[0]
        if kind == 'binop':
            return 1 + count_ops(ast[2]) + count_ops(ast[3])
        if kind == 'unary':
            return 1 + count_ops(ast[2])
        if kind == 'call':
            return sum(count_ops(a) for a in ast[2])
        return 0
