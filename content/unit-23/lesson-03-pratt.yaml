id: u23-pratt
title: Syntax Trees and Expression Parsing
minutes: 95
objective: 'Learn the most useful data structure in compilers: the abstract syntax tree. You will write a compact and powerful parser for arithmetic with correct precedence and associativity, evaluate and print trees, simplify and differentiate them symbolically, and compile a tree into a fast function.'
outcomes:
- Explain what an abstract syntax tree is
- Write a Pratt (precedence climbing) parser
- Evaluate, print and convert trees to postfix
- Simplify and differentiate expressions symbolically
- Explain interpreting versus compiling
sections:
- heading: Abstract syntax trees
  body: |-
    A parse tree from the grammar lesson records every rule used, including boring intermediate ones such as `Term -> Factor`. Compilers usually throw that detail away and build an **abstract syntax tree** (AST): a tree with only the meaningful structure. For `1 + 2 * 3` the AST has a `+` node whose children are `1` and a `*` node, which in turn has children `2` and `3`. Parentheses vanish, because the *shape* of the tree already says what groups with what. In our code each node is a tuple that starts with a tag: `("num", 3)`, `("var", "x")`, `("binop", "+", left, right)`.

    Why trees? Because almost everything a compiler does is a **recursive walk** over the tree: evaluate it, print it, check its types, simplify it, translate it into machine code. A program is data, and once it is a tree you can process it with ordinary code. This idea, **code as data**, is the heart of languages such as Lisp, and of every tool that analyses or transforms programs: formatters, linters, refactoring tools, even your editor's syntax highlighting.
- heading: Precedence climbing (Pratt parsing)
  body: |-
    The grammar-based parser from the last lesson needs a separate rule for every precedence level, which gets long. **Pratt parsing**, also called **precedence climbing**, gives each operator a number (its **binding power** or **precedence**) and parses any expression with one short loop. The function `parse_expr(min_prec)` reads a **prefix item** (a number, a name, a parenthesised expression or a unary minus), and then loops: look at the next operator; if its precedence is lower than `min_prec`, stop and return what we have; otherwise consume it, parse its right-hand side with a suitable `min_prec`, and combine.

    The magic is in that suitable minimum. For a **left-associative** operator such as `-`, ask for operators strictly *tighter* (`prec + 1`) on the right, so `8 - 3 - 2` becomes `(8 - 3) - 2`: the second minus is not absorbed on the right. For a **right-associative** operator such as `^` use `prec` itself, so `2 ^ 3 ^ 2` becomes `2 ^ (3 ^ 2)`. **Unary minus** is a prefix item whose operand is parsed with its own precedence (25): tighter than `*` (so `-a * b` is `(-a) * b`) but looser than `^` (so `-2 ^ 2` is `-(2 ^ 2)`, which mathematicians agree is -4). A name followed by `(` is a **function call** whose arguments are separated by commas. The whole parser is about 40 lines, and adding a new operator means adding one line to a table. Production parsers for JavaScript, Rust and many other languages use this technique for expressions.
- heading: 'Working with trees: print, simplify, differentiate, compile'
  body: |-
    With an AST in hand, each job is a recursive function with one case per node kind. **Evaluating** walks the tree, evaluating children and then combining them. **Pretty printing** goes the other way, and the interesting part is adding *only the necessary parentheses*: put them around a child if it binds looser than its parent, with special care for equal precedence, where associativity decides which side needs them. A good test of both the printer and the parser is the **round trip**: parse the printed text and you should get the same tree back. **Postfix** (reverse Polish) notation lists operands before operators and needs no parentheses at all: `(1 + 2) * 3` becomes `1 2 + 3 *`. Stack machines, which you will meet shortly, execute it directly.

    Trees can also be *rewritten*. **Simplification** applies algebra rules bottom-up (anything times 1 is itself, anything times 0 is 0, two numbers fold into one) repeatedly until nothing changes. **Symbolic differentiation** applies the rules from calculus (sum, product, quotient and chain rules) node by node, producing a tree for the derivative; simplification then tidies it. The numerical derivatives of the calculus unit approximate; this one is exact.

    Finally, **interpreting** means walking the tree afresh every time you evaluate it. **Compiling** means doing the walk *once*, producing something faster to run. The simplest form turns each node into a Python **closure** (a function that remembers the closures built for its children), so later calls just call functions instead of inspecting tuples. Real compilers go much further, producing machine instructions, but the principle is the same: pay for the analysis once and run many times.
examples:
- title: Parse, evaluate, print, differentiate
  intro: The whole toolkit on a few expressions, including a syntax error.
  code: |
    import math

    BINARY = {"+": (10, "left"), "-": (10, "left"), "*": (20, "left"), "/": (20, "left"), "^": (30, "right")}
    UNARY_PRECEDENCE = 25
    FUNCTIONS = {"sqrt": math.sqrt, "abs": abs, "max": max, "min": min, "sin": math.sin, "cos": math.cos, "exp": math.exp, "ln": math.log}


    def tokenize_expr(text):
        """Split an expression into (kind, text, position) tokens: NUM (digits, optionally with one decimal point), ID (letters, digits and
        underscores, not starting with a digit), OP (one of + - * / ^), LPAREN, RPAREN and COMMA. Spaces are skipped.
        ValueError containing the position for any other character."""
        tokens = []
        i = 0
        while i < len(text):
            ch = text[i]
            if ch.isspace():
                i += 1
            elif ch.isdigit():
                j = i
                while j < len(text) and text[j].isdigit():
                    j += 1
                if j + 1 < len(text) and text[j] == "." and text[j + 1].isdigit():
                    j += 1
                    while j < len(text) and text[j].isdigit():
                        j += 1
                tokens.append(("NUM", text[i:j], i))
                i = j
            elif ch.isalpha() or ch == "_":
                j = i
                while j < len(text) and (text[j].isalnum() or text[j] == "_"):
                    j += 1
                tokens.append(("ID", text[i:j], i))
                i = j
            elif ch in "+-*/^":
                tokens.append(("OP", ch, i))
                i += 1
            elif ch in "(),":
                tokens.append(({"(": "LPAREN", ")": "RPAREN", ",": "COMMA"}[ch], ch, i))
                i += 1
            else:
                raise ValueError("unexpected character %r at position %d" % (ch, i))
        return tokens


    def parse(text):
        """Pratt (precedence climbing) parser. Return an abstract syntax tree (AST) made of tuples:
        ("num", value) with int or float value, ("var", name), ("unary", "-", operand), ("binop", op, left, right) and ("call", name, [args]).
        Rules: + and - bind weakest (10) and group left to right; * and / (20) also left to right; ^ (30) groups RIGHT to left; unary minus (25) binds
        tighter than * but looser than ^, so -2^2 means -(2^2). Parentheses group. A name followed by ( is a call with comma-separated arguments.
        Use the table BINARY. Core idea: parse_expr(min_prec) parses a prefix item, then keeps taking operators whose precedence is at least
        min_prec; the right side is parsed with prec + 1 for left-associative operators and prec for right-associative ones.
        ValueError with 'at position N' (N is len(text) at the end of input) for any syntax error, including leftover tokens."""
        tokens = tokenize_expr(text)
        pos = 0

        def peek():
            return tokens[pos] if pos < len(tokens) else None

        def take():
            nonlocal pos
            token = peek()
            pos += 1
            return token

        def where(token):
            return token[2] if token else len(text)

        def parse_expr(min_prec):
            left = parse_prefix()
            while True:
                token = peek()
                if token is None or token[0] != "OP" or token[1] not in BINARY:
                    return left
                prec, assoc = BINARY[token[1]]
                if prec < min_prec:
                    return left
                take()
                right = parse_expr(prec + 1 if assoc == "left" else prec)
                left = ("binop", token[1], left, right)

        def parse_prefix():
            token = take()
            if token is None:
                raise ValueError("unexpected end of input at position %d" % len(text))
            kind, value, p = token
            if kind == "NUM":
                return ("num", float(value) if "." in value else int(value))
            if kind == "ID":
                nxt = peek()
                if nxt is None or nxt[0] != "LPAREN":
                    return ("var", value)
                take()
                args = []
                if peek() is not None and peek()[0] == "RPAREN":
                    take()
                    return ("call", value, args)
                while True:
                    args.append(parse_expr(0))
                    closer = take()
                    if closer is not None and closer[0] == "RPAREN":
                        return ("call", value, args)
                    if closer is None or closer[0] != "COMMA":
                        raise ValueError("expected , or ) at position %d" % where(closer))
            if kind == "LPAREN":
                inner = parse_expr(0)
                closer = take()
                if closer is None or closer[0] != "RPAREN":
                    raise ValueError("expected ) at position %d" % where(closer))
                return inner
            if kind == "OP" and value == "-":
                return ("unary", "-", parse_expr(UNARY_PRECEDENCE))
            raise ValueError("unexpected %s at position %d" % (value, p))

        tree = parse_expr(0)
        if pos < len(tokens):
            raise ValueError("unexpected %s at position %d" % (tokens[pos][1], tokens[pos][2]))
        return tree


    def evaluate(ast, env=None):
        """Compute the value of an AST. `env` maps variable names to numbers. `/` is true division. ValueError for an undefined variable
        ('undefined variable NAME'), division by zero, an unknown function, a call with the wrong number of arguments or an argument outside
        a function's domain (such as sqrt of a negative number), and a power that would not be a real number."""
        env = env or {}
        kind = ast[0]
        if kind == "num":
            return ast[1]
        if kind == "var":
            if ast[1] not in env:
                raise ValueError("undefined variable %s" % ast[1])
            return env[ast[1]]
        if kind == "unary":
            return -evaluate(ast[2], env)
        if kind == "binop":
            op = ast[1]
            a = evaluate(ast[2], env)
            b = evaluate(ast[3], env)
            if op == "+":
                return a + b
            if op == "-":
                return a - b
            if op == "*":
                return a * b
            if op == "/":
                if b == 0:
                    raise ValueError("division by zero")
                return a / b
            try:
                result = a ** b
            except ZeroDivisionError:
                raise ValueError("division by zero")
            if isinstance(result, complex):
                raise ValueError("power is not a real number")
            return result
        if kind == "call":
            name, args = ast[1], [evaluate(a, env) for a in ast[2]]
            if name not in FUNCTIONS:
                raise ValueError("unknown function %s" % name)
            try:
                return FUNCTIONS[name](*args)
            except (TypeError, ValueError) as error:
                raise ValueError("bad call to %s: %s" % (name, error))
        raise ValueError("unknown node %r" % (kind,))


    def precedence_of(ast):
        """How tightly a node binds: 10, 20 or 30 for binary operators, 25 for unary minus, 100 for everything else (numbers, names, calls)."""
        if ast[0] == "binop":
            return BINARY[ast[1]][0]
        if ast[0] == "unary":
            return UNARY_PRECEDENCE
        return 100


    def to_string(ast):
        """Write the AST back as text with the FEWEST parentheses that still parse to the same tree. Binary operators are written with a space
        on each side ('a + b'); calls as 'f(a, b)'; unary minus as '-x'. A left operand needs parentheses if it binds looser than the operator, or equally
        tight for a right-associative operator (^), or is a unary minus under ^ (since -x^2 means -(x^2)). A right operand needs them if it binds looser,
        or equally tight for a left-associative operator. A unary minus needs them around an operand that binds looser than 25 or is itself a unary minus."""
        kind = ast[0]
        if kind == "num":
            return str(ast[1])
        if kind == "var":
            return ast[1]
        if kind == "call":
            return "%s(%s)" % (ast[1], ", ".join(to_string(a) for a in ast[2]))
        if kind == "unary":
            inner = to_string(ast[2])
            if precedence_of(ast[2]) < UNARY_PRECEDENCE or ast[2][0] == "unary":
                inner = "(" + inner + ")"
            return "-" + inner
        op, left, right = ast[1], ast[2], ast[3]
        prec, assoc = BINARY[op]
        ls, rs = to_string(left), to_string(right)
        lp, rp = precedence_of(left), precedence_of(right)
        if lp < prec or (lp == prec and assoc == "right") or (left[0] == "unary" and op == "^"):
            ls = "(" + ls + ")"
        if rp < prec or (rp == prec and assoc == "left"):
            rs = "(" + rs + ")"
        return "%s %s %s" % (ls, op, rs)


    def to_rpn(ast):
        """The expression in reverse Polish (postfix) order as a list of strings: operands first, then the operator. Numbers and names are written as
        text, binary operators as themselves, unary minus as 'neg', and a call as 'name/argument-count' after its arguments. '1 + 2 * 3' gives
        ['1', '2', '3', '*', '+']."""
        kind = ast[0]
        if kind == "num":
            return [str(ast[1])]
        if kind == "var":
            return [ast[1]]
        if kind == "unary":
            return to_rpn(ast[2]) + ["neg"]
        if kind == "binop":
            return to_rpn(ast[2]) + to_rpn(ast[3]) + [ast[1]]
        out = []
        for a in ast[2]:
            out += to_rpn(a)
        return out + ["%s/%d" % (ast[1], len(ast[2]))]


    def free_variables(ast):
        """The sorted list of distinct variable names used in the AST (function names are not variables)."""
        kind = ast[0]
        if kind == "var":
            return [ast[1]]
        if kind == "num":
            return []
        names = set()
        children = ast[2:] if kind in ("unary", "binop") else ast[2]
        for child in children:
            names.update(free_variables(child))
        return sorted(names)


    def simplify_once(ast):
        """One bottom-up pass of simplification: first simplify the children, then apply to the node: fold an operation on two numbers (except
        division by zero or a power that is not a real number, which stay as they are); x + 0, 0 + x, x - 0, x * 1, 1 * x, x / 1, x ^ 1 become x;
        x * 0 and 0 * x become 0; x ^ 0 becomes 1; unary minus of a number becomes a negative number, and minus minus x becomes x."""
        kind = ast[0]
        if kind in ("num", "var"):
            return ast
        if kind == "call":
            return ("call", ast[1], [simplify_once(a) for a in ast[2]])
        if kind == "unary":
            inner = simplify_once(ast[2])
            if inner[0] == "num":
                return ("num", -inner[1])
            if inner[0] == "unary":
                return inner[2]
            return ("unary", "-", inner)
        op = ast[1]
        a, b = simplify_once(ast[2]), simplify_once(ast[3])
        if a[0] == "num" and b[0] == "num":
            try:
                return ("num", evaluate(("binop", op, a, b)))
            except ValueError:
                return ("binop", op, a, b)
        zero = lambda n: n[0] == "num" and n[1] == 0
        one = lambda n: n[0] == "num" and n[1] == 1
        if op == "+" and zero(a):
            return b
        if op in "+-" and zero(b):
            return a
        if op == "*" and (zero(a) or zero(b)):
            return ("num", 0)
        if op == "*" and one(a):
            return b
        if op in "*/" and one(b):
            return a
        if op == "^" and one(b):
            return a
        if op == "^" and zero(b):
            return ("num", 1)
        return ("binop", op, a, b)


    def simplify(ast):
        """Apply simplify_once repeatedly until the tree stops changing."""
        while True:
            new = simplify_once(ast)
            if new == ast:
                return ast
            ast = new


    def differentiate(ast, var):
        """The symbolic derivative of the AST with respect to the variable `var`, as an AST (not simplified): constants give 0; the variable
        gives 1 and other variables 0; sums, differences and unary minus act term by term; products use the product rule (u v)' = u' v + u v';
        quotients (u / v)' = (u' v - u v') / v ^ 2; a power u ^ n with n free of var gives n * u ^ (n - 1) * u'; a power a ^ v with the base free of var
        gives a ^ v * ln(a) * v'; a general u ^ v gives u ^ v * (v' * ln(u) + v * u' / u); and calls sin, cos, exp, ln and sqrt use the chain rule
        (sin u)' = cos(u) u', (cos u)' = -sin(u) u', (exp u)' = exp(u) u', (ln u)' = u' / u, (sqrt u)' = u' / (2 * sqrt(u)). ValueError for other functions."""
        kind = ast[0]
        num = lambda v: ("num", v)
        if kind == "num":
            return num(0)
        if kind == "var":
            return num(1 if ast[1] == var else 0)
        if kind == "unary":
            return ("unary", "-", differentiate(ast[2], var))
        if kind == "call":
            name, args = ast[1], ast[2]
            if len(args) != 1 or name not in ("sin", "cos", "exp", "ln", "sqrt"):
                raise ValueError("cannot differentiate %s" % name)
            u = args[0]
            du = differentiate(u, var)
            if name == "sin":
                return ("binop", "*", ("call", "cos", [u]), du)
            if name == "cos":
                return ("binop", "*", ("unary", "-", ("call", "sin", [u])), du)
            if name == "exp":
                return ("binop", "*", ("call", "exp", [u]), du)
            if name == "ln":
                return ("binop", "/", du, u)
            return ("binop", "/", du, ("binop", "*", num(2), ("call", "sqrt", [u])))
        op, u, v = ast[1], ast[2], ast[3]
        du, dv = differentiate(u, var), differentiate(v, var)
        if op in "+-":
            return ("binop", op, du, dv)
        if op == "*":
            return ("binop", "+", ("binop", "*", du, v), ("binop", "*", u, dv))
        if op == "/":
            top = ("binop", "-", ("binop", "*", du, v), ("binop", "*", u, dv))
            return ("binop", "/", top, ("binop", "^", v, num(2)))
        if var not in free_variables(v):
            power = ("binop", "^", u, ("binop", "-", v, num(1)))
            return ("binop", "*", ("binop", "*", v, power), du)
        if var not in free_variables(u):
            return ("binop", "*", ("binop", "*", ast, ("call", "ln", [u])), dv)
        inner = ("binop", "+", ("binop", "*", dv, ("call", "ln", [u])), ("binop", "/", ("binop", "*", v, du), u))
        return ("binop", "*", ast, inner)


    def derivative_text(text, var):
        """Parse the expression, differentiate it with respect to var, simplify, and write it back with to_string."""
        return to_string(simplify(differentiate(parse(text), var)))

    ast = parse("1 + 2 * 3 ^ 2")
    print("tree:", ast)
    print("value:", evaluate(ast))
    print("written back:", to_string(parse("(a + b) * (c - (d - e))")))
    print("postfix:", to_rpn(parse("(1 + 2) * 3")))
    print("-2 ^ 2 =", evaluate(parse("-2 ^ 2")), " (the unary minus binds looser than ^)")
    print("d/dx of x ^ 3 + 2 * x:", derivative_text("x ^ 3 + 2 * x", "x"))
    print("d/dx of sin(x) * x:", derivative_text("sin(x) * x", "x"))
    try:
        parse("(1 + 2")
    except ValueError as error:
        print("error:", error)
