  prompt: 'The starter has everything so far. Write `free_variables(ast)` (the sorted distinct variable names; function names are not variables). Write `simplify_once(ast)`: a bottom-up pass that first simplifies the children and then at the node: folds an operation on two numbers (use `evaluate`; leave division by zero or a non-real power unchanged); `x + 0`, `0 + x`, `x - 0`, `x * 1`, `1 * x`, `x / 1` and `x ^ 1` become `x`; `x * 0` and `0 * x` become `0`; `x ^ 0` becomes `1`; unary minus of a number becomes a negative number; and `-(-x)` becomes `x`. Write `simplify(ast)`: repeat `simplify_once` until nothing changes. Write `differentiate(ast, var)`, the **symbolic derivative** you met in calculus: constants give 0; the variable gives 1 (other variables 0); sums, differences and unary minus act term by term; products `(u v)'' = u'' v + u v''`; quotients `(u / v)'' = (u'' v - u v'') / v^2`; `u ^ n` with `n` free of `var` gives `n * u^(n - 1) * u''`; `a ^ v` with the base free of `var` gives `a^v * ln(a) * v''`; general `u ^ v` gives `u^v * (v'' * ln(u) + v * u'' / u)`; calls use the chain rule: `sin u` gives `cos(u) * u''`, `cos u` gives `-sin(u) * u''`, `exp u` gives `exp(u) * u''`, `ln u` gives `u'' / u`, `sqrt u` gives `u'' / (2 * sqrt(u))`; any other function is a `ValueError`. Finally `derivative_text(text, var)`: parse, differentiate, simplify and write back with `to_string`.'
