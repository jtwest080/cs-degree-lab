id: u23-semantics
title: 'Semantic Analysis: Scopes and Types'
minutes: 95
objective: 'Learn what a compiler checks after the syntax is right: that every name refers to something, that every operation is applied to the right kind of data, and that functions return properly. You will build a symbol table, a type checker, a call graph and a linter.'
outcomes:
- Explain what semantic analysis checks that the grammar cannot
- Build a symbol table with nested scopes
- Write a type checker that reports several errors
- Detect missing returns and recursion with a call graph
- Write a simple linter
sections:
- heading: Syntax is not enough
  body: |-
    A program can be perfectly shaped and still be nonsense. `let x = y + 1` has valid syntax even if `y` was never declared, and `"hello" * true` follows the grammar even though multiplying text by a truth value means nothing. The grammar cannot catch these problems because they depend on **meaning**, and checking meaning is the job of **semantic analysis**, the compiler phase after parsing. It works on the abstract syntax tree and asks questions such as: is this name declared? Does this expression have the right type? Does this function return on every path?

    Semantic analysis is where most of the error messages you see come from. Python skips most of it until the code runs; compiled languages such as Rust and Java check it all in advance, which is why a program that compiles often works. Catching mistakes early is cheap: a message that points to the line is far better than a crash an hour later.
- heading: Scopes and symbol tables
  body: |-
    A **scope** is the region of a program where a name is visible. In most languages, a block between braces opens a new scope, so a variable declared inside a loop is not visible after it. Scopes **nest**: an inner scope can see its parents' names, and it can declare its own name that **shadows**, or hides, an outer one of the same name. Declaring the same name twice in the *same* scope is an error called **redeclaration**.

    The compiler keeps this information in a **symbol table**: a dictionary from names to facts about them, such as their type. Nested scopes become a chain of tables, each pointing to its parent. To **declare** a name, add it to the current table (failing if it is already there). To **look up** a name, search the current table, then its parent, and so on outward until it is found or the chain ends, in which case the name is **undeclared**. The `scope_distance` of a name, the number of steps outward to the scope that declares it, is what some compilers use to locate the variable at run time.

    One detail matters: in `let x = x + 1` the right-hand side is resolved *before* the new `x` exists, so it refers to an outer `x`. The order of operations in the checker matches the order in which the program's meaning is defined.
- heading: Types and checking
  body: |-
    A **type** is a set of values together with the operations allowed on them. A **type checker** assigns a type to every expression, and reports an error whenever an operation receives the wrong types. For our small language the rules are short: adding two `int` values gives an `int`; adding an `int` and a `float` gives a `float` (the integer is **widened**, which is safe because no information is lost); dividing always gives a `float`; adding two strings joins them; comparing numbers gives a `bool`; `and`, `or` and `not` need `bool` values. Storing a `float` in an `int` variable is rejected, because it would lose the fractional part.

    A type checker is really an **evaluator that computes types instead of values**: the same recursive walk, with a rule per node kind. Because it never runs the program, it is also *conservative*: it may reject a program that would have worked, and the rules are chosen so it never accepts one that would crash on a type error.

    Good checkers report **many errors in one run**. To avoid a cascade of nonsense errors after the first mistake, a variable whose declaration failed is recorded with the special type `unknown`, which silently propagates: any expression using it is also `unknown`, with no new complaint. Checking **statements** adds a few more rules: conditions in `if` and `while` must be `bool`, assignments must store a compatible type, and every block opens a scope.

    For functions, the checker also verifies that the number and types of arguments match the declaration, and that the function **returns on every path**. A `while` loop never guarantees a return, because its body might run zero times. A **call graph** (which function calls which) reveals recursion, which is a function reaching itself through the graph, and dead code, which no entry point can reach. Finally, a **linter** is a gentler cousin of a type checker that warns about suspicious but legal code: variables never read, or names that shadow others.
examples:
- title: Finding name errors
  intro: Resolving names in a small program with deliberate mistakes.
  code: |
    def new_scope(parent=None):
        """A scope is a dict {"names": {...}, "parent": enclosing scope or None}."""
        return {"names": {}, "parent": parent}


    def declare(scope, name, info):
        """Record name -> info in THIS scope. ValueError('redeclared NAME') if this very scope already has the name (an outer scope's name may be shadowed)."""
        if name in scope["names"]:
            raise ValueError("redeclared " + name)
        scope["names"][name] = info


    def lookup(scope, name):
        """Find the info for a name, searching this scope, then its parent, and so on. ValueError('undeclared NAME') when no scope has it."""
        s = scope
        while s is not None:
            if name in s["names"]:
                return s["names"][name]
            s = s["parent"]
        raise ValueError("undeclared " + name)


    def scope_distance(scope, name):
        """How many steps up the chain the declaring scope is: 0 means this scope, 1 its parent, and so on. ValueError('undeclared NAME') if absent."""
        s = scope
        hops = 0
        while s is not None:
            if name in s["names"]:
                return hops
            s = s["parent"]
            hops += 1
        raise ValueError("undeclared " + name)


    def resolve_names(program):
        """Walk a list of statements and return the list of error strings, in source order: 'undeclared x' for a variable that is read or assigned
        without a declaration in scope, and 'redeclared x' for a let of a name already declared in the SAME scope (the later let is ignored).
        Statements: ("let", name, annotation, expr), ("assign", name, expr), ("print", expr), ("if", cond, then_list, else_list), ("while", cond, body_list), ("block", stmts).
        Expressions: ("num", v), ("bool", v), ("str", s), ("var", name), ("unary", op, e), ("binop", op, l, r). The expression of a let is resolved BEFORE the name is
        declared, so 'let x = x' reads an outer x. Each block, if-branch and while body gets a new scope. Keep going after an error."""
        errors = []

        def expr(e, scope):
            if e[0] == "var":
                try:
                    lookup(scope, e[1])
                except ValueError as error:
                    errors.append(str(error))
            elif e[0] == "unary":
                expr(e[2], scope)
            elif e[0] == "binop":
                expr(e[2], scope)
                expr(e[3], scope)

        def stmts(items, scope):
            for s in items:
                kind = s[0]
                if kind == "let":
                    expr(s[3], scope)
                    try:
                        declare(scope, s[1], True)
                    except ValueError as error:
                        errors.append(str(error))
                elif kind == "assign":
                    try:
                        lookup(scope, s[1])
                    except ValueError as error:
                        errors.append(str(error))
                    expr(s[2], scope)
                elif kind == "print":
                    expr(s[1], scope)
                elif kind == "if":
                    expr(s[1], scope)
                    stmts(s[2], new_scope(scope))
                    stmts(s[3], new_scope(scope))
                elif kind == "while":
                    expr(s[1], scope)
                    stmts(s[2], new_scope(scope))
                elif kind == "block":
                    stmts(s[1], new_scope(scope))

        stmts(program, new_scope())
        return errors

    program = [
        ("let", "total", None, ("num", 0)),
        ("let", "total", None, ("num", 1)),
        ("print", ("var", "count")),
        ("block", [("let", "total", None, ("binop", "+", ("var", "total"), ("num", 1))), ("print", ("var", "total"))]),
        ("assign", "missing", ("num", 5)),
    ]
    for error in resolve_names(program):
        print(error)
    inner = new_scope(new_scope())
    declare(inner["parent"], "x", "int")
    print("distance to x:", scope_distance(inner, "x"))
  output: |
    redeclared total
    undeclared count
    undeclared missing
    distance to x: 1
  lines:
  - line: 92
    note: One error string per problem, in source order.
  - line: 96
    note: The scope that declares x is one step up.
- title: A small type checker
  intro: Type-checking a program with a string plus an integer, a lossy store and a non-boolean condition.
  code: |
    def new_scope(parent=None):
        """A scope is a dict {"names": {...}, "parent": enclosing scope or None}."""
        return {"names": {}, "parent": parent}


    def declare(scope, name, info):
        """Record name -> info in THIS scope. ValueError('redeclared NAME') if this very scope already has the name (an outer scope's name may be shadowed)."""
        if name in scope["names"]:
            raise ValueError("redeclared " + name)
        scope["names"][name] = info


    def lookup(scope, name):
        """Find the info for a name, searching this scope, then its parent, and so on. ValueError('undeclared NAME') when no scope has it."""
        s = scope
        while s is not None:
            if name in s["names"]:
                return s["names"][name]
            s = s["parent"]
        raise ValueError("undeclared " + name)


    def scope_distance(scope, name):
        """How many steps up the chain the declaring scope is: 0 means this scope, 1 its parent, and so on. ValueError('undeclared NAME') if absent."""
        s = scope
        hops = 0
        while s is not None:
            if name in s["names"]:
                return hops
            s = s["parent"]
            hops += 1
        raise ValueError("undeclared " + name)




    NUMERIC = ("int", "float")


    def can_assign(target, value):
        """May a value of type `value` be stored in a variable of type `target`? Same type, or int into float (widening). 'unknown' on either side is accepted."""
        if "unknown" in (target, value):
            return True
        return target == value or (target == "float" and value == "int")


    def type_of(expr, env):
        """The type ('int', 'float', 'bool' or 'str') of an expression; env maps variable names to types. Raise ValueError('undeclared x') for a variable
        not in env, or ValueError('type error: ...') for a wrongly typed operation. Rules: ("num", v) is int or float; ("bool", v) bool; ("str", s) str; + - * on two
        numbers give int if both are int, else float; / on numbers always gives float; + on two strs gives str (the only str operator); < > <= >= on two numbers give bool;
        == != on two numbers, or two operands of the same type, give bool; 'and' 'or' need two bools; unary 'not' needs a bool; unary '-' needs a number and keeps its type.
        A variable whose type is 'unknown' (left over from an earlier error) makes any expression using it 'unknown' without a new error."""
        kind = expr[0]
        if kind == "num":
            return "float" if isinstance(expr[1], float) else "int"
        if kind == "bool":
            return "bool"
        if kind == "str":
            return "str"
        if kind == "var":
            if expr[1] not in env:
                raise ValueError("undeclared " + expr[1])
            return env[expr[1]]
        if kind == "unary":
            t = type_of(expr[2], env)
            if t == "unknown":
                return t
            if expr[1] == "not":
                if t != "bool":
                    raise ValueError("type error: not needs bool, got " + t)
                return "bool"
            if t not in NUMERIC:
                raise ValueError("type error: - needs a number, got " + t)
            return t
        op = expr[1]
        a, b = type_of(expr[2], env), type_of(expr[3], env)
        if "unknown" in (a, b):
            return "unknown"
        both_num = a in NUMERIC and b in NUMERIC
        if op in ("+", "-", "*", "/"):
            if op == "+" and a == b == "str":
                return "str"
            if not both_num:
                raise ValueError("type error: %s needs numbers, got %s and %s" % (op, a, b))
            if op == "/":
                return "float"
            return "int" if a == b == "int" else "float"
        if op in ("<", ">", "<=", ">="):
            if not both_num:
                raise ValueError("type error: %s needs numbers, got %s and %s" % (op, a, b))
            return "bool"
        if op in ("==", "!="):
            if not (both_num or a == b):
                raise ValueError("type error: cannot compare %s with %s" % (a, b))
            return "bool"
        if op in ("and", "or"):
            if a != "bool" or b != "bool":
                raise ValueError("type error: %s needs bools, got %s and %s" % (op, a, b))
            return "bool"
        raise ValueError("type error: unknown operator " + op)


    def visible(scope):
        """Flatten a scope chain into one dict name -> type (inner names win)."""
        chain = []
        s = scope
        while s is not None:
            chain.append(s["names"])
            s = s["parent"]
        env = {}
        for names in reversed(chain):
            env.update(names)
        return env


    def check_program(program):
        """Type-check a list of statements (the same forms as resolve_names, where a let's annotation is None or a type name) and return the list of error
        strings in source order, at most ONE error per statement or condition. The scope info is the variable's type. Rules: a let declares its name with the annotation if
        there is one, otherwise with the type of its expression; if the expression is wrong, record the error and declare the name as the annotation or 'unknown'.
        A let whose expression type cannot be assigned to its annotation gives 'type error: cannot store T in x'. A repeated let in the same scope gives 'redeclared x'.
        An assign needs a declared variable ('undeclared x') and a type assignable to it (same 'type error: cannot store T in x'). if and while conditions must be bool, else
        'type error: condition must be bool, got T' (an 'unknown' condition is accepted). print checks its expression. Blocks, if-branches and while bodies each get a new scope."""
        errors = []

        def typed(e, scope):
            try:
                return type_of(e, visible(scope))
            except ValueError as error:
                errors.append(str(error))
                return None

        def condition(e, scope):
            t = typed(e, scope)
            if t is not None and t not in ("bool", "unknown"):
                errors.append("type error: condition must be bool, got " + t)

        def stmts(items, scope):
            for s in items:
                kind = s[0]
                if kind == "let":
                    t = typed(s[3], scope)
                    declared = s[2]
                    if t is not None and declared is not None and not can_assign(declared, t):
                        errors.append("type error: cannot store %s in %s" % (t, s[1]))
                    final = declared or t or "unknown"
                    try:
                        declare(scope, s[1], final)
                    except ValueError as error:
                        errors.append(str(error))
                elif kind == "assign":
                    t = typed(s[2], scope)
                    try:
                        target = lookup(scope, s[1])
                    except ValueError as error:
                        errors.append(str(error))
                        continue
                    if t is not None and not can_assign(target, t):
                        errors.append("type error: cannot store %s in %s" % (t, s[1]))
                elif kind == "print":
                    typed(s[1], scope)
                elif kind == "if":
                    condition(s[1], scope)
                    stmts(s[2], new_scope(scope))
                    stmts(s[3], new_scope(scope))
                elif kind == "while":
                    condition(s[1], scope)
                    stmts(s[2], new_scope(scope))
                elif kind == "block":
                    stmts(s[1], new_scope(scope))

        stmts(program, new_scope())
        return errors

    program = [
        ("let", "age", "int", ("num", 30)),
        ("let", "name", None, ("str", "Ada")),
        ("let", "ratio", None, ("binop", "/", ("var", "age"), ("num", 4))),
        ("let", "bad", None, ("binop", "+", ("var", "name"), ("var", "age"))),
        ("assign", "age", ("num", 31.5)),
        ("if", ("var", "age"), [("print", ("var", "ratio"))], []),
    ]
    print("ratio has type", type_of(("var", "ratio"), {"ratio": "float"}))
    for error in check_program(program):
        print(error)
    print("1 + 2 * 3.0 has type", type_of(("binop", "+", ("num", 1), ("binop", "*", ("num", 2), ("num", 3.0))), {}))
  output: |
    ratio has type float
    type error: + needs numbers, got str and int
    type error: cannot store float in age
    type error: condition must be bool, got int
    1 + 2 * 3.0 has type float
  lines:
  - line: 183
    note: Errors are collected, not raised.
  - line: 185
    note: int times float widens to float, so the sum is float.
