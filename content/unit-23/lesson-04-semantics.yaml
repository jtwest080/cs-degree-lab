  - Give every declaration its own id so reads can mark exactly the variable they refer to.
  solution: |
    def new_scope(parent=None):
        """A scope is a dict {"names": {...}, "parent": enclosing scope or None}."""
        return {"names": {}, "parent": parent}


    def declare(scope, name, info):
        """Record name -> info in THIS scope. ValueError('redeclared NAME') if this very scope already has the name (an outer scope's name may be shadowed)."""
        if name in scope["names"]:
            raise ValueError("redeclared " + name)
        scope["names"][name] = info


    def lookup(scope, name):
        """Find the info for a name, searching this scope, then its parent, and so on. ValueError('undeclared NAME') when no scope has it."""
        s = scope
        while s is not None:
            if name in s["names"]:
                return s["names"][name]
            s = s["parent"]
        raise ValueError("undeclared " + name)


    def scope_distance(scope, name):
        """How many steps up the chain the declaring scope is: 0 means this scope, 1 its parent, and so on. ValueError('undeclared NAME') if absent."""
        s = scope
        hops = 0
        while s is not None:
            if name in s["names"]:
                return hops
            s = s["parent"]
            hops += 1
        raise ValueError("undeclared " + name)




    def reads_in_expr(e):
        """All variable names read by an expression, in order (with repeats)."""
        if e[0] == "var":
            return [e[1]]
        if e[0] == "unary":
            return reads_in_expr(e[2])
        if e[0] == "binop":
            return reads_in_expr(e[2]) + reads_in_expr(e[3])
        return []


    def lint(program):
        """Return (unused, shadowing), two sorted lists of distinct variable names. `unused`: names with at least one `let` whose variable is never READ afterwards
        (assigning to it does not count as reading it). `shadowing`: names declared by a let while a variable of the same name is visible in an ENCLOSING scope (a repeat in the
        same scope is a redeclaration, not shadowing; ignore it). Statements: let, assign, print, if, while, block as in resolve_names. Reads are resolved to the nearest
        enclosing declaration, and reads of undeclared names are ignored. The let's expression is evaluated before the new name exists."""
        declared = []
        used = set()
        shadowing = set()

        def read(e, scope):
            for name in reads_in_expr(e):
                s = scope
                while s is not None:
                    if name in s["names"]:
                        used.add(s["names"][name])
                        break
                    s = s["parent"]

        def visible_somewhere(scope, name):
            s = scope
            while s is not None:
                if name in s["names"]:
                    return True
                s = s["parent"]
            return False

        def stmts(items, scope):
            for s in items:
                k = s[0]
                if k == "let":
                    read(s[3], scope)
                    if s[1] in scope["names"]:
                        continue
                    if visible_somewhere(scope["parent"], s[1]):
                        shadowing.add(s[1])
                    ident = len(declared)
                    declared.append(s[1])
                    scope["names"][s[1]] = ident
                elif k == "assign":
                    read(s[2], scope)
                elif k == "print":
                    read(s[1], scope)
                elif k == "if":
                    read(s[1], scope)
                    stmts(s[2], new_scope(scope))
                    stmts(s[3], new_scope(scope))
                elif k == "while":
                    read(s[1], scope)
                    stmts(s[2], new_scope(scope))
                elif k == "block":
                    stmts(s[1], new_scope(scope))

        stmts(program, new_scope())
        unused = sorted({declared[i] for i in range(len(declared)) if i not in used})
        return unused, sorted(shadowing)
  explanation: Linters are small analyses over the tree plus a scope chain.
commonMistakes:
- title: Declaring a let's name before resolving its expression
  explanation: let x = x + 1 would then read the variable it is creating.
- title: Treating shadowing as redeclaration
  explanation: Only a repeat in the same scope is an error; an inner scope may hide an outer name.
- title: Letting one error cause many
  explanation: Mark failed names unknown so later uses do not repeat the complaint.
- title: Counting a while loop as always returning
  explanation: The body may never run.
- title: Counting an assignment as reading a variable
  explanation: A variable that is only written is still unused.
summary:
- Semantic analysis checks meaning that the grammar cannot.
- A symbol table is a chain of dictionaries, one per scope.
- Shadowing is legal; redeclaration in the same scope is not.
- A type checker evaluates types instead of values.
- Unknown types stop errors from cascading.
- Call graphs and linters are more analyses over the same tree.
