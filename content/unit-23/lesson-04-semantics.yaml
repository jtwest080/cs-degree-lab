      c = lambda name, *args: ("call", name, list(args))
      f = lambda name, *calls: ("func", name, [], "int", [("print", c(x)) for x in calls] + [("return", ("num", 0))])
      assert recursive_functions([f("a", "a")]) == ["a"]
      assert recursive_functions([f("a", "b"), f("b", "a"), f("c", "a"), f("d")]) == ["a", "b"]
      assert recursive_functions([f("a", "b"), f("b", "c"), f("c", "d"), f("d", "b")]) == ["b", "c", "d"]
