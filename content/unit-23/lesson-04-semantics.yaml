  solution: |
    NUMERIC = ("int", "float")


    def can_assign(target, value):
        """May a value of type `value` be stored in a variable of type `target`? Same type, or int into float (widening). 'unknown' on either side is accepted."""
        if "unknown" in (target, value):
            return True
        return target == value or (target == "float" and value == "int")


    def type_of(expr, env):
        """The type ('int', 'float', 'bool' or 'str') of an expression; env maps variable names to types. Raise ValueError('undeclared x') for a variable
        not in env, or ValueError('type error: ...') for a wrongly typed operation. Rules: ("num", v) is int or float; ("bool", v) bool; ("str", s) str; + - * on two
        numbers give int if both are int, else float; / on numbers always gives float; + on two strs gives str (the only str operator); < > <= >= on two numbers give bool;
        == != on two numbers, or two operands of the same type, give bool; 'and' 'or' need two bools; unary 'not' needs a bool; unary '-' needs a number and keeps its type.
        A variable whose type is 'unknown' (left over from an earlier error) makes any expression using it 'unknown' without a new error."""
        kind = expr[0]
        if kind == "num":
            return "float" if isinstance(expr[1], float) else "int"
        if kind == "bool":
            return "bool"
        if kind == "str":
            return "str"
        if kind == "var":
            if expr[1] not in env:
                raise ValueError("undeclared " + expr[1])
            return env[expr[1]]
        if kind == "unary":
            t = type_of(expr[2], env)
            if t == "unknown":
                return t
            if expr[1] == "not":
                if t != "bool":
                    raise ValueError("type error: not needs bool, got " + t)
                return "bool"
            if t not in NUMERIC:
                raise ValueError("type error: - needs a number, got " + t)
            return t
        op = expr[1]
        a, b = type_of(expr[2], env), type_of(expr[3], env)
        if "unknown" in (a, b):
            return "unknown"
        both_num = a in NUMERIC and b in NUMERIC
        if op in ("+", "-", "*", "/"):
            if op == "+" and a == b == "str":
                return "str"
            if not both_num:
                raise ValueError("type error: %s needs numbers, got %s and %s" % (op, a, b))
            if op == "/":
                return "float"
            return "int" if a == b == "int" else "float"
        if op in ("<", ">", "<=", ">="):
            if not both_num:
                raise ValueError("type error: %s needs numbers, got %s and %s" % (op, a, b))
            return "bool"
        if op in ("==", "!="):
            if not (both_num or a == b):
                raise ValueError("type error: cannot compare %s with %s" % (a, b))
            return "bool"
        if op in ("and", "or"):
            if a != "bool" or b != "bool":
                raise ValueError("type error: %s needs bools, got %s and %s" % (op, a, b))
            return "bool"
        raise ValueError("type error: unknown operator " + op)
  explanation: A type checker is an evaluator that computes types instead of values.
