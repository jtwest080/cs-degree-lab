  tests:
  - name: the symbol table
    code: |
      g = new_scope()
      declare(g, "x", "int")
      inner = new_scope(g)
      declare(inner, "y", "str")
      assert lookup(inner, "x") == "int" and lookup(inner, "y") == "str"
      assert scope_distance(inner, "y") == 0 and scope_distance(inner, "x") == 1
      declare(inner, "x", "bool")
      assert lookup(inner, "x") == "bool" and lookup(g, "x") == "int"
      assert scope_distance(inner, "x") == 0
      for bad in (lambda: lookup(g, "y"), lambda: scope_distance(g, "q")):
          try:
              bad()
              raise AssertionError("accepted")
          except ValueError as e:
              assert str(e).startswith("undeclared ")
      try:
          declare(g, "x", "float")
          raise AssertionError("accepted")
      except ValueError as e:
          assert str(e) == "redeclared x"
      assert g["parent"] is None and inner["parent"] is g
