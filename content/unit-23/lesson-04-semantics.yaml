  - 'Reachability: from each function, follow call edges and see whether you can return to the start.'
  solution: |
    def returns_on_all_paths(stmts):
        """True if running this statement list always ends in a ("return", expr). A list qualifies if some statement in it always returns: a return itself, an
        ("if", cond, then, else) whose then AND else lists both always return, or a ("block", stmts) that does. A while loop never counts (it might run zero times)."""
        for s in stmts:
            if s[0] == "return":
                return True
            if s[0] == "if" and returns_on_all_paths(s[2]) and returns_on_all_paths(s[3]):
                return True
            if s[0] == "block" and returns_on_all_paths(s[1]):
                return True
        return False


    def calls_in_expr(e):
        """Names of functions called anywhere in an expression, in order of appearance, with repeats. Calls look like ("call", name, [args]);
        other nodes are num, bool, str, var, ("unary", op, e), ("binop", op, l, r)."""
        if e[0] == "call":
            found = [e[1]]
            for a in e[2]:
                found += calls_in_expr(a)
            return found
        if e[0] == "unary":
            return calls_in_expr(e[2])
        if e[0] == "binop":
            return calls_in_expr(e[2]) + calls_in_expr(e[3])
        return []


    def calls_in_stmts(stmts):
        found = []
        for s in stmts:
            k = s[0]
            if k == "let":
                found += calls_in_expr(s[3])
            elif k in ("assign",):
                found += calls_in_expr(s[2])
            elif k in ("print", "return"):
                found += calls_in_expr(s[1])
            elif k == "if":
                found += calls_in_expr(s[1]) + calls_in_stmts(s[2]) + calls_in_stmts(s[3])
            elif k == "while":
                found += calls_in_expr(s[1]) + calls_in_stmts(s[2])
            elif k == "block":
                found += calls_in_stmts(s[1])
        return found


    def call_graph(program):
        """For a list of top-level ("func", name, params, return_type, body) statements, a dict mapping each function name to the sorted list of DISTINCT names it calls
        anywhere in its body (including names that are not defined as functions here)."""
        return {s[1]: sorted(set(calls_in_stmts(s[4]))) for s in program if s[0] == "func"}


    def recursive_functions(program):
        """Sorted names of functions that can reach themselves through calls to functions defined in the program: directly (f calls f) or indirectly
        (f calls g and g calls f). Calls to undefined names are ignored."""
        graph = call_graph(program)
        result = []
        for name in graph:
            seen = set()
            stack = [c for c in graph[name] if c in graph]
            while stack:
                current = stack.pop()
                if current == name:
                    result.append(name)
                    break
                if current in seen:
                    continue
                seen.add(current)
                stack += [c for c in graph[current] if c in graph]
        return sorted(result)
  explanation: Control flow and call graphs are the raw material for later compiler analyses.
- id: lint
  title: 'Capstone: a linter'
  difficulty: 5
  prompt: 'The starter has the scope helpers. Write `reads_in_expr(e)` (all variable names an expression reads, with repeats) and `lint(program)`, returning a pair `(unused, shadowing)` of sorted lists of distinct variable names. `unused` holds names with at least one `let` whose variable is never **read** afterwards; assigning to it does not count as a read. `shadowing` holds names declared by a `let` while a variable of the same name is visible in an **enclosing** scope; a repeat in the **same** scope is a redeclaration, so ignore it (it does not declare a new variable). Statements: `let`, `assign`, `print`, `if`, `while` and `block` as before. Reads are resolved to the nearest enclosing declaration, reads of undeclared names are ignored, and the `let`''s expression is evaluated before the new name exists. Hint: store a unique id for each declaration in the scope instead of a type.'
  starter: |-
    def new_scope(parent=None):
        """A scope is a dict {"names": {...}, "parent": enclosing scope or None}."""
        return {"names": {}, "parent": parent}


    def declare(scope, name, info):
        """Record name -> info in THIS scope. ValueError('redeclared NAME') if this very scope already has the name (an outer scope's name may be shadowed)."""
        if name in scope["names"]:
            raise ValueError("redeclared " + name)
        scope["names"][name] = info


    def lookup(scope, name):
        """Find the info for a name, searching this scope, then its parent, and so on. ValueError('undeclared NAME') when no scope has it."""
        s = scope
        while s is not None:
            if name in s["names"]:
                return s["names"][name]
            s = s["parent"]
        raise ValueError("undeclared " + name)


    def scope_distance(scope, name):
        """How many steps up the chain the declaring scope is: 0 means this scope, 1 its parent, and so on. ValueError('undeclared NAME') if absent."""
        s = scope
        hops = 0
        while s is not None:
            if name in s["names"]:
                return hops
            s = s["parent"]
            hops += 1
        raise ValueError("undeclared " + name)




    def reads_in_expr(e):
        """All variable names read by an expression, in order (with repeats)."""
        pass


    def lint(program):
        """Return (unused, shadowing), two sorted lists of distinct variable names. `unused`: names with at least one `let` whose variable is never READ afterwards
        (assigning to it does not count as reading it). `shadowing`: names declared by a let while a variable of the same name is visible in an ENCLOSING scope (a repeat in the
        same scope is a redeclaration, not shadowing; ignore it). Statements: let, assign, print, if, while, block as in resolve_names. Reads are resolved to the nearest
        enclosing declaration, and reads of undeclared names are ignored. The let's expression is evaluated before the new name exists."""
        pass
  tests:
  - name: unused variables
    code: |
      L = lambda name, e: ("let", name, None, e)
      prog = [L("a", ("num", 1)), L("b", ("num", 2)), L("c", ("var", "a")), ("print", ("var", "c"))]
      assert lint(prog) == (["b"], [])
      prog = [L("x", ("num", 1)), ("assign", "x", ("num", 2))]
      assert lint(prog) == (["x"], [])
      prog = [L("x", ("num", 1)), ("assign", "x", ("binop", "+", ("var", "x"), ("num", 1)))]
      assert lint(prog) == ([], [])
      assert lint([]) == ([], [])
      assert reads_in_expr(("binop", "+", ("var", "a"), ("unary", "-", ("binop", "*", ("var", "b"), ("var", "a"))))) == ["a", "b", "a"]
      assert reads_in_expr(("num", 3)) == [] and reads_in_expr(("str", "x")) == []
  - name: shadowing
    code: |
      L = lambda name, e: ("let", name, None, e)
      prog = [L("x", ("num", 1)), ("block", [L("x", ("num", 2)), ("print", ("var", "x"))]), ("print", ("var", "x"))]
      assert lint(prog) == ([], ["x"])
      prog = [L("y", ("num", 1)), L("y", ("num", 2)), ("print", ("var", "y"))]
      assert lint(prog) == ([], [])
      prog = [L("v", ("num", 1)), ("if", ("bool", True), [("while", ("bool", False), [L("v", ("num", 2))])], [])]
      assert lint(prog) == (["v"], ["v"])
  - name: reads bind to the nearest declaration
    code: |
      L = lambda name, e: ("let", name, None, e)
      prog = [L("x", ("num", 1)), ("block", [L("x", ("var", "x")), ("print", ("var", "x"))])]
      assert lint(prog) == ([], ["x"])
      prog = [L("x", ("num", 1)), ("block", [L("x", ("num", 2))]), ("print", ("var", "x"))]
      assert lint(prog) == (["x"], ["x"])
      prog = [("print", ("var", "ghost")), L("a", ("num", 1))]
      assert lint(prog) == (["a"], [])
      prog = [("if", ("bool", True), [L("t", ("num", 1))], [L("t", ("num", 2)), ("print", ("var", "t"))])]
      assert lint(prog) == (["t"], [])
