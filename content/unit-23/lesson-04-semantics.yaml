  prompt: 'Write `can_assign(target, value)` (the same type, or an `int` stored into a `float`; the special type `"unknown"` on either side is accepted) and `type_of(expr, env)`, where `env` maps variable names to type names. It returns `"int"`, `"float"`, `"bool"` or `"str"`. Raise `ValueError("undeclared x")` for a variable not in `env`, or a `ValueError` whose message starts `type error` for a wrongly typed operation. Rules: `+ - *` on two numbers give `int` if both are `int`, else `float`; `/` on numbers always gives `float`; `+` on two `str` gives `str` (the only string operator); `< > <= >=` on two numbers give `bool`; `==` and `!=` on two numbers, or on two operands of the same type, give `bool`; `and`, `or` need two `bool`s; unary `not` needs a `bool`; unary `-` needs a number and keeps its type. A variable whose type is `"unknown"` (left over from an earlier error) makes any expression using it `"unknown"` without a new error. Expressions: `("num", v)` (a Python `float` means `float`), `("bool", v)`, `("str", s)`, `("var", name)`, `("unary", op, e)`, `("binop", op, l, r)`.'
