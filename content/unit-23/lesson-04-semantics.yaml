              ("block", [("let", "w", None, ("num", 0))]), ("print", ("var", "w")), ("let", "n", None, ("var", "n"))]
      assert resolve_names(prog) == ["undeclared a", "redeclared x", "undeclared q", "undeclared w", "undeclared n"]
      prog2 = [("while", ("var", "go"), [("assign", "k", ("binop", "+", ("var", "k"), ("var", "j")))]), ("if", ("bool", True), [("let", "t", None, ("num", 1))], [("print", ("var", "t"))])]
      assert resolve_names(prog2) == ["undeclared go", "undeclared k", "undeclared k", "undeclared j", "undeclared t"]
