- type: code
  question: 'Write `max_depth(scope)` that returns how many scopes are in the chain starting at `scope` (a scope with no parent has depth 1). Scopes are dicts `{"names": {...}, "parent": scope or None}`.'
  starter: |
    def max_depth(scope):
        pass
  tests:
  - name: depth
    code: |
      a = {"names": {}, "parent": None}
      b = {"names": {}, "parent": a}
      c = {"names": {"x": 1}, "parent": b}
      assert max_depth(a) == 1 and max_depth(b) == 2 and max_depth(c) == 3
  solution: |
    def max_depth(scope):
        depth = 0
        while scope is not None:
            depth += 1
            scope = scope['parent']
        return depth
