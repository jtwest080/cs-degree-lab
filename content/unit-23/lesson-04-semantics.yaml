  - Walk the statements with a current scope; make a child scope for each block, branch and loop body.
  solution: |
    def new_scope(parent=None):
        """A scope is a dict {"names": {...}, "parent": enclosing scope or None}."""
        return {"names": {}, "parent": parent}


    def declare(scope, name, info):
        """Record name -> info in THIS scope. ValueError('redeclared NAME') if this very scope already has the name (an outer scope's name may be shadowed)."""
        if name in scope["names"]:
            raise ValueError("redeclared " + name)
        scope["names"][name] = info


    def lookup(scope, name):
        """Find the info for a name, searching this scope, then its parent, and so on. ValueError('undeclared NAME') when no scope has it."""
        s = scope
        while s is not None:
            if name in s["names"]:
                return s["names"][name]
            s = s["parent"]
        raise ValueError("undeclared " + name)


    def scope_distance(scope, name):
        """How many steps up the chain the declaring scope is: 0 means this scope, 1 its parent, and so on. ValueError('undeclared NAME') if absent."""
        s = scope
        hops = 0
        while s is not None:
            if name in s["names"]:
                return hops
            s = s["parent"]
            hops += 1
        raise ValueError("undeclared " + name)


    def resolve_names(program):
        """Walk a list of statements and return the list of error strings, in source order: 'undeclared x' for a variable that is read or assigned
        without a declaration in scope, and 'redeclared x' for a let of a name already declared in the SAME scope (the later let is ignored).
        Statements: ("let", name, annotation, expr), ("assign", name, expr), ("print", expr), ("if", cond, then_list, else_list), ("while", cond, body_list), ("block", stmts).
        Expressions: ("num", v), ("bool", v), ("str", s), ("var", name), ("unary", op, e), ("binop", op, l, r). The expression of a let is resolved BEFORE the name is
        declared, so 'let x = x' reads an outer x. Each block, if-branch and while body gets a new scope. Keep going after an error."""
        errors = []

        def expr(e, scope):
            if e[0] == "var":
                try:
                    lookup(scope, e[1])
                except ValueError as error:
                    errors.append(str(error))
            elif e[0] == "unary":
                expr(e[2], scope)
            elif e[0] == "binop":
                expr(e[2], scope)
                expr(e[3], scope)

        def stmts(items, scope):
            for s in items:
                kind = s[0]
                if kind == "let":
                    expr(s[3], scope)
                    try:
                        declare(scope, s[1], True)
                    except ValueError as error:
                        errors.append(str(error))
                elif kind == "assign":
                    try:
                        lookup(scope, s[1])
                    except ValueError as error:
                        errors.append(str(error))
                    expr(s[2], scope)
                elif kind == "print":
                    expr(s[1], scope)
                elif kind == "if":
                    expr(s[1], scope)
                    stmts(s[2], new_scope(scope))
                    stmts(s[3], new_scope(scope))
                elif kind == "while":
                    expr(s[1], scope)
                    stmts(s[2], new_scope(scope))
                elif kind == "block":
                    stmts(s[1], new_scope(scope))

        stmts(program, new_scope())
        return errors
  explanation: A scope chain is a linked list of dictionaries searched from the inside out.
