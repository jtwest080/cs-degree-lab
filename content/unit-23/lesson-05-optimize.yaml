- title: Optimizing a program
  intro: Blocks, constant folding and dead code removal on a short program.
  code: |
    def lower(ast):
        """Lower an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to three-address code. Return (code, result_name).
        Every operation gets a fresh temporary t1, t2, ... (numbered from 1 in the order they are created, operands before the operation, left before right).
        Instructions: ("const", dest, value), ("neg", dest, a), ("bin", dest, op, a, b). A variable needs no instruction: its own name is the result."""
        code = []
        counter = [0]

        def fresh():
            counter[0] += 1
            return "t%d" % counter[0]

        def walk(e):
            if e[0] == "num":
                t = fresh()
                code.append(("const", t, e[1]))
                return t
            if e[0] == "var":
                return e[1]
            if e[0] == "unary":
                a = walk(e[2])
                t = fresh()
                code.append(("neg", t, a))
                return t
            a = walk(e[2])
            b = walk(e[3])
            t = fresh()
            code.append(("bin", t, e[1], a, b))
            return t

        result = walk(ast)
        return code, result


    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def run_tac(code, env=None, limit=10000):
        """Execute a list of instructions. Besides const, neg and bin there are ("copy", dest, src), ("label", name), ("jump", name), ("jumpz", cond, name)
        (jump if the variable is 0), ("print", a) and ("ret", a), which stops. Return {"env": variables, "output": printed values in order, "returned": the ret value or None}.
        Start from a copy of env. ValueError('undefined NAME') for reading a variable that has no value, ValueError('too many steps') after `limit` executed instructions."""
        env = dict(env or {})
        labels = {ins[1]: i for i, ins in enumerate(code) if ins[0] == "label"}
        output = []
        pc = 0
        steps = 0

        def get(name):
            if name not in env:
                raise ValueError("undefined " + name)
            return env[name]

        while pc < len(code):
            steps += 1
            if steps > limit:
                raise ValueError("too many steps")
            ins = code[pc]
            kind = ins[0]
            pc += 1
            if kind == "const":
                env[ins[1]] = ins[2]
            elif kind == "copy":
                env[ins[1]] = get(ins[2])
            elif kind == "neg":
                env[ins[1]] = -get(ins[2])
            elif kind == "bin":
                env[ins[1]] = apply_op(ins[2], get(ins[3]), get(ins[4]))
            elif kind == "print":
                output.append(get(ins[1]))
            elif kind == "ret":
                return {"env": env, "output": output, "returned": get(ins[1])}
            elif kind == "jump":
                pc = labels[ins[1]]
            elif kind == "jumpz":
                if get(ins[1]) == 0:
                    pc = labels[ins[2]]
        return {"env": env, "output": output, "returned": None}


    def lower_program(stmts):
        """Lower statements to flat three-address code with labels L1, L2, ... and temporaries t1, t2, ... Statements: ("assign", name, expr), ("print", expr),
        ("return", expr), ("if", cond, then_list, else_list), ("while", cond, body_list). A while loop is: label top; evaluate cond; jumpz cond end; body; jump top; label end.
        An if is: evaluate cond; jumpz cond else; then; jump end; label else; else-part; label end."""
        code = []
        counters = {"t": 0, "L": 0}

        def tmp():
            counters["t"] += 1
            return "t%d" % counters["t"]

        def label():
            counters["L"] += 1
            return "L%d" % counters["L"]

        def expr(e):
            if e[0] == "num":
                t = tmp()
                code.append(("const", t, e[1]))
                return t
            if e[0] == "var":
                return e[1]
            if e[0] == "unary":
                a = expr(e[2])
                t = tmp()
                code.append(("neg", t, a))
                return t
            a = expr(e[2])
            b = expr(e[3])
            t = tmp()
            code.append(("bin", t, e[1], a, b))
            return t

        def stmt(s):
            if s[0] == "assign":
                code.append(("copy", s[1], expr(s[2])))
            elif s[0] == "print":
                code.append(("print", expr(s[1])))
            elif s[0] == "return":
                code.append(("ret", expr(s[1])))
            elif s[0] == "while":
                top, end = label(), label()
                code.append(("label", top))
                c = expr(s[1])
                code.append(("jumpz", c, end))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", top))
                code.append(("label", end))
            else:
                other, end = label(), label()
                c = expr(s[1])
                code.append(("jumpz", c, other))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", end))
                code.append(("label", other))
                for x in s[3]:
                    stmt(x)
                code.append(("label", end))

        for s in stmts:
            stmt(s)
        return code


    def basic_blocks(code):
        """Split instructions into basic blocks: straight-line runs entered only at the top and left only at the bottom. A new block starts at the first instruction,
        at every ("label", ...), and right after every jump, jumpz or ret. Return a list of lists of instructions (empty code gives an empty list)."""
        blocks = []
        for i, ins in enumerate(code):
            starts = i == 0 or ins[0] == "label" or code[i - 1][0] in ("jump", "jumpz", "ret")
            if starts:
                blocks.append([])
            blocks[-1].append(ins)
        return blocks


    def build_cfg(blocks):
        """The control flow graph: a dict from block index to the sorted list of successor block indexes. Look at the LAST instruction: a jump goes to the block that
        starts with that label; a jumpz goes to that block or falls through to the next block; ret has no successors; anything else falls through to the next block (if any)."""
        where = {}
        for i, block in enumerate(blocks):
            if block[0][0] == "label":
                where[block[0][1]] = i
        cfg = {}
        for i, block in enumerate(blocks):
            last = block[-1]
            out = set()
            if last[0] == "jump":
                out.add(where[last[1]])
            elif last[0] == "jumpz":
                out.add(where[last[2]])
                if i + 1 < len(blocks):
                    out.add(i + 1)
            elif last[0] != "ret" and i + 1 < len(blocks):
                out.add(i + 1)
            cfg[i] = sorted(out)
        return cfg


    def reachable_blocks(cfg):
        """Sorted list of block indexes reachable from block 0 by following the graph (an empty graph gives [])."""
        if not cfg:
            return []
        seen = {0}
        stack = [0]
        while stack:
            for nxt in cfg[stack.pop()]:
                if nxt not in seen:
                    seen.add(nxt)
                    stack.append(nxt)
        return sorted(seen)


    def remove_unreachable(code):
        """Return the instruction list with every unreachable basic block deleted (the others keep their order)."""
        blocks = basic_blocks(code)
        keep = reachable_blocks(build_cfg(blocks))
        return [ins for i in keep for ins in blocks[i]]


    def optimize_block(block):
        """One forward pass over a basic block doing constant folding and copy propagation. Track `consts` (variable -> known number) and `copies` (variable -> the
        variable it currently equals). For each instruction: first replace each operand that is a copy with its source; then fold a bin or neg whose operands are all known constants into
        ("const", dest, value) (use apply_op, but leave the bin alone if apply_op raises ValueError, e.g. division by zero); turn ("copy", d, s) into ("const", d, value) when s is a known constant. After
        defining dest, forget every fact that involved dest (its old constant, copies from it or to it) and then record the new fact about it (const or copy; a copy of itself records nothing).
        Labels and jumps pass through (jumpz and print and ret get their operands rewritten). Return the new block; the input is not modified."""
        consts = {}
        copies = {}
        out = []

        def forget(name):
            consts.pop(name, None)
            copies.pop(name, None)
            for k in [k for k, v in copies.items() if v == name]:
                del copies[k]

        def src(name):
            return copies.get(name, name)

        for ins in block:
            kind = ins[0]
            if kind == "const":
                forget(ins[1])
                consts[ins[1]] = ins[2]
                out.append(ins)
            elif kind == "copy":
                s = src(ins[2])
                d = ins[1]
                forget(d)
                if s in consts:
                    consts[d] = consts[s]
                    out.append(("const", d, consts[s]))
                else:
                    if s != d:
                        copies[d] = s
                    out.append(("copy", d, s))
            elif kind == "neg":
                a = src(ins[2])
                d = ins[1]
                forget(d)
                if a in consts:
                    consts[d] = -consts[a]
                    out.append(("const", d, -consts[a]))
                else:
                    out.append(("neg", d, a))
            elif kind == "bin":
                a, b = src(ins[3]), src(ins[4])
                d = ins[1]
                folded = None
                if a in consts and b in consts:
                    try:
                        folded = apply_op(ins[2], consts[a], consts[b])
                    except ValueError:
                        folded = None
                forget(d)
                if folded is not None:
                    consts[d] = folded
                    out.append(("const", d, folded))
                else:
                    out.append(("bin", d, ins[2], a, b))
            elif kind == "jumpz":
                out.append(("jumpz", src(ins[1]), ins[2]))
            elif kind in ("print", "ret"):
                out.append((kind, src(ins[1])))
            else:
                out.append(ins)
        return out


    def defs_uses(ins):
        """Return (defined_name_or_None, list_of_used_names) for one instruction: const defines only; copy and neg use one name; bin uses two; jumpz, print and ret use
        one name and define nothing; label and jump neither define nor use."""
        kind = ins[0]
        if kind == "const":
            return ins[1], []
        if kind == "copy" or kind == "neg":
            return ins[1], [ins[2]]
        if kind == "bin":
            return ins[1], [ins[3], ins[4]]
        if kind == "jumpz":
            return None, [ins[1]]
        if kind in ("print", "ret"):
            return None, [ins[1]]
        return None, []


    COMMUTATIVE = ("+", "*", "==", "!=")


    def common_subexpressions(block):
        """Local common subexpression elimination. Remember, for each computation seen so far, the variable that holds its value: a key ("bin", op, a, b) (for the
        commutative operators + * == != sort the two operands first) or ("neg", a). When the same computation appears again and its holder still has that value, replace the
        instruction with ("copy", dest, holder). Whenever a variable is redefined, forget every remembered computation that uses it as an operand or holds its value. A computation whose
        dest is also one of its own operands (x = x + 1) is never remembered. Return the new block."""
        seen = {}
        out = []
        for ins in block:
            key = None
            if ins[0] == "bin":
                a, b = ins[3], ins[4]
                if ins[2] in COMMUTATIVE and b < a:
                    a, b = b, a
                key = ("bin", ins[2], a, b)
            elif ins[0] == "neg":
                key = ("neg", ins[2])
            if key is not None and key in seen:
                new = ("copy", ins[1], seen[key])
            else:
                new = ins
            out.append(new)
            d, _ = defs_uses(new)
            if d is not None:
                for k in [k for k, holder in seen.items() if holder == d or d in k[2:]]:
                    del seen[k]
                if key is not None and new is ins and d not in key[2:]:
                    seen[key] = d
        return out


    def eliminate_dead_code(block, live_out):
        """Backward pass: walk the block from the end with a set of live variables that starts as `live_out`. An instruction that defines a variable which is not live
        (const, copy, neg or bin) is deleted; otherwise its defined variable leaves the live set and its used variables join it. print, ret, jumpz, label and jump are always kept (the ones with
        operands add them to the live set). Return the new block in the original order."""
        live = set(live_out)
        kept = []
        for ins in reversed(block):
            d, uses = defs_uses(ins)
            if d is not None and d not in live:
                continue
            if d is not None:
                live.discard(d)
            live.update(uses)
            kept.append(ins)
        kept.reverse()
        return kept


    def liveness(blocks, cfg):
        """Global liveness analysis by iteration. A variable is LIVE at a point if some path from there reads it before writing it. For each block compute
        use (variables read before any write in the block) and defs (variables written). Then repeat until nothing changes: live_out[b] = union of live_in[s] for successors s, and
        live_in[b] = use[b] union (live_out[b] minus defs[b]). Return (live_in, live_out), each a list indexed by block holding a SORTED list of names."""
        use, defs = [], []
        for block in blocks:
            u, d = set(), set()
            for ins in block:
                defined, used = defs_uses(ins)
                u.update(v for v in used if v not in d)
                if defined is not None:
                    d.add(defined)
            use.append(u)
            defs.append(d)
        live_in = [set() for _ in blocks]
        live_out = [set() for _ in blocks]
        changed = True
        while changed:
            changed = False
            for b in reversed(range(len(blocks))):
                out = set()
                for s in cfg[b]:
                    out |= live_in[s]
                new_in = use[b] | (out - defs[b])
                if out != live_out[b] or new_in != live_in[b]:
                    live_out[b], live_in[b] = out, new_in
                    changed = True
        return [sorted(s) for s in live_in], [sorted(s) for s in live_out]


    def dead_code_elimination(code):
        """Remove every assignment whose value is never used, across the whole program: repeat { split into blocks, build the cfg, run liveness, apply eliminate_dead_code to each block with
        its live_out, join the blocks } until the code stops changing (removing one assignment can make another dead). Return the new instruction list."""
        while True:
            blocks = basic_blocks(code)
            if not blocks:
                return []
            cfg = build_cfg(blocks)
            _, live_out = liveness(blocks, cfg)
            new = []
            for i, block in enumerate(blocks):
                new += eliminate_dead_code(block, live_out[i])
            if new == code:
                return code
            code = new

    program = [("assign", "a", ("num", 2)), ("assign", "b", ("binop", "*", ("var", "a"), ("num", 8))), ("assign", "c", ("binop", "+", ("var", "a"), ("var", "b"))),
               ("assign", "unused", ("binop", "*", ("var", "c"), ("var", "c"))), ("print", ("var", "c"))]
    code = lower_program(program)
    blocks = basic_blocks(code)
    print("blocks:", len(blocks), " cfg:", build_cfg(blocks))
    folded = optimize_block(blocks[0])
    print("before:", len(code), "instructions")
    print("after folding:", len(folded), "instructions")
    final = dead_code_elimination(folded)
    print("after dead code removal:", len(final), "instructions")
    print("same output:", run_tac(code)["output"] == run_tac(final)["output"], run_tac(final)["output"])
    print("remaining:", [ins[0] + " " + str(ins[1]) for ins in final])
