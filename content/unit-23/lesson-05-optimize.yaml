    def lower(ast):
        """Lower an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to three-address code. Return (code, result_name).
        Every operation gets a fresh temporary t1, t2, ... (numbered from 1 in the order they are created, operands before the operation, left before right).
        Instructions: ("const", dest, value), ("neg", dest, a), ("bin", dest, op, a, b). A variable needs no instruction: its own name is the result."""
        code = []
        counter = [0]

        def fresh():
            counter[0] += 1
            return "t%d" % counter[0]

        def walk(e):
            if e[0] == "num":
                t = fresh()
                code.append(("const", t, e[1]))
                return t
            if e[0] == "var":
                return e[1]
            if e[0] == "unary":
                a = walk(e[2])
                t = fresh()
                code.append(("neg", t, a))
                return t
            a = walk(e[2])
            b = walk(e[3])
            t = fresh()
            code.append(("bin", t, e[1], a, b))
            return t

        result = walk(ast)
        return code, result


    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def run_tac(code, env=None, limit=10000):
        """Execute a list of instructions. Besides const, neg and bin there are ("copy", dest, src), ("label", name), ("jump", name), ("jumpz", cond, name)
        (jump if the variable is 0), ("print", a) and ("ret", a), which stops. Return {"env": variables, "output": printed values in order, "returned": the ret value or None}.
        Start from a copy of env. ValueError('undefined NAME') for reading a variable that has no value, ValueError('too many steps') after `limit` executed instructions."""
        env = dict(env or {})
        labels = {ins[1]: i for i, ins in enumerate(code) if ins[0] == "label"}
        output = []
        pc = 0
        steps = 0

        def get(name):
            if name not in env:
                raise ValueError("undefined " + name)
            return env[name]

        while pc < len(code):
            steps += 1
            if steps > limit:
                raise ValueError("too many steps")
            ins = code[pc]
            kind = ins[0]
            pc += 1
            if kind == "const":
                env[ins[1]] = ins[2]
            elif kind == "copy":
                env[ins[1]] = get(ins[2])
            elif kind == "neg":
                env[ins[1]] = -get(ins[2])
            elif kind == "bin":
                env[ins[1]] = apply_op(ins[2], get(ins[3]), get(ins[4]))
            elif kind == "print":
                output.append(get(ins[1]))
            elif kind == "ret":
                return {"env": env, "output": output, "returned": get(ins[1])}
            elif kind == "jump":
                pc = labels[ins[1]]
            elif kind == "jumpz":
                if get(ins[1]) == 0:
                    pc = labels[ins[2]]
        return {"env": env, "output": output, "returned": None}


    def defs_uses(ins):
        """Return (defined_name_or_None, list_of_used_names) for one instruction: const defines only; copy and neg use one name; bin uses two; jumpz, print and ret use
        one name and define nothing; label and jump neither define nor use."""
        kind = ins[0]
        if kind == "const":
            return ins[1], []
        if kind == "copy" or kind == "neg":
            return ins[1], [ins[2]]
        if kind == "bin":
            return ins[1], [ins[3], ins[4]]
        if kind == "jumpz":
            return None, [ins[1]]
        if kind in ("print", "ret"):
            return None, [ins[1]]
        return None, []


    COMMUTATIVE = ("+", "*", "==", "!=")


    def common_subexpressions(block):
        """Local common subexpression elimination. Remember, for each computation seen so far, the variable that holds its value: a key ("bin", op, a, b) (for the
        commutative operators + * == != sort the two operands first) or ("neg", a). When the same computation appears again and its holder still has that value, replace the
        instruction with ("copy", dest, holder). Whenever a variable is redefined, forget every remembered computation that uses it as an operand or holds its value. A computation whose
        dest is also one of its own operands (x = x + 1) is never remembered. Return the new block."""
        seen = {}
        out = []
        for ins in block:
            key = None
            if ins[0] == "bin":
                a, b = ins[3], ins[4]
                if ins[2] in COMMUTATIVE and b < a:
                    a, b = b, a
                key = ("bin", ins[2], a, b)
            elif ins[0] == "neg":
                key = ("neg", ins[2])
            if key is not None and key in seen:
                new = ("copy", ins[1], seen[key])
            else:
                new = ins
            out.append(new)
            d, _ = defs_uses(new)
            if d is not None:
                for k in [k for k, holder in seen.items() if holder == d or d in k[2:]]:
                    del seen[k]
                if key is not None and new is ins and d not in key[2:]:
                    seen[key] = d
        return out


    def eliminate_dead_code(block, live_out):
        """Backward pass: walk the block from the end with a set of live variables that starts as `live_out`. An instruction that defines a variable which is not live
        (const, copy, neg or bin) is deleted; otherwise its defined variable leaves the live set and its used variables join it. print, ret, jumpz, label and jump are always kept (the ones with
        operands add them to the live set). Return the new block in the original order."""
        live = set(live_out)
        kept = []
        for ins in reversed(block):
            d, uses = defs_uses(ins)
            if d is not None and d not in live:
                continue
            if d is not None:
                live.discard(d)
            live.update(uses)
            kept.append(ins)
        kept.reverse()
        return kept
