id: u23-optimize
title: Intermediate Code and Optimization
minutes: 100
objective: Learn how a compiler turns a tree into a flat, simple, machine-independent language, splits it into basic blocks and a control-flow graph, and then makes the program faster with constant folding, copy propagation, common subexpression elimination and dead code elimination, using the dataflow idea of liveness.
outcomes:
- Lower an AST to three-address code
- Split code into basic blocks and build a control-flow graph
- Apply constant folding and copy propagation
- Remove common subexpressions and dead code
- Explain liveness and fixed-point iteration
sections:
- heading: Intermediate representations
  body: |-
    A real compiler does not go straight from the tree to machine code. It first translates the tree into an **intermediate representation** (IR): a simple language that is closer to the machine than the source, yet independent of any particular machine. One benefit is reuse: a compiler for many source languages and many processors needs only one IR in the middle, so you write each front end and each back end once instead of every pair. The other benefit is that the IR is a good place to **optimize**.

    A popular IR is **three-address code**. Each instruction does at most one operation and names at most three variables: `t3 = a + b`, `t4 = -t3`, `x = t4`. A big expression becomes a sequence of small steps, each result stored in a fresh **temporary** variable. Control flow turns into **labels**, **jumps** and **conditional jumps**, the same ingredients as assembly language: a `while` loop becomes a label at the top, a test that jumps out if false, the body, a jump back to the top, and a label at the end. There are no trees and no nested scopes any more, just a flat list. That flatness is what makes the program easy to analyse and to run: our little interpreter `run_tac` is a loop with a program counter.
- heading: Basic blocks and the control-flow graph
  body: |-
    Optimizers reason about code that runs in a straight line, so the first step is to cut the instruction list into **basic blocks**: maximal runs with one entrance (the top) and one exit (the bottom). A block starts at the first instruction, at every label (someone may jump here), and right after every jump (the previous block ended). Inside a block nothing can jump in or out, so the compiler can reason about it without worrying about surprises.

    Then connect the blocks into a **control-flow graph** (CFG): there is an edge from block A to block B if control may pass from A to B. The last instruction of a block says where: a `jump` has one successor, a conditional jump has two (the target and the next block), a `ret` has none, and anything else falls through to the next block. A `while` loop shows up as a **cycle** in the graph, and an `if` as a diamond. The CFG also reveals **unreachable code**: blocks that no path from the entry reaches can be deleted outright.
- heading: Optimizations
  body: |-
    **Constant folding** evaluates at compile time anything whose inputs are already known: if `a = 2` and `b = 3`, then `c = a + b` becomes `c = 5`. Be careful with operations that can fail: `1 / 0` must stay in the program, so that the error still happens when (and if) it would have. **Copy propagation** replaces a use of `b` by the original when `b = a`; this makes the copy itself useless. The two work together: after propagating, new constants appear, which enables more folding. The pass must **forget** facts when a variable is overwritten, otherwise it would apply stale knowledge and change the program's meaning. Every optimization has this rule: it must preserve **observable behaviour** (what the program prints and returns).

    **Common subexpression elimination** (CSE) notices that `a + b` is computed twice and reuses the first result. Because addition is commutative, `a + b` and `b + a` are the same computation, and sorting the operands lets us notice it. The saved result is only valid until `a`, `b` or the variable holding the result changes.

    **Dead code elimination** removes instructions whose results are never used. To know what is used, compilers compute **liveness**: a variable is **live** at a point if some path from there *reads* it before *writing* it. Liveness flows **backward**, so it is computed from the end: a block's `live_in` is what it reads before writing, plus whatever remains live afterwards and is not overwritten. With loops, one pass is not enough, so we **iterate to a fixed point**: repeat until no set changes. This pattern, called **dataflow analysis**, underlies many optimizations. Plain liveness is conservative: a variable that is only used to update itself inside a loop (like a counter nobody reads afterwards) counts as live, because the loop does read it; removing such code needs a stronger analysis that starts from the observable instructions and keeps only what they depend on. Dead code removal is often iterated with the others, because every pass creates opportunities for the next: after folding makes a temporary unused, removing it can make *its* inputs unused too.

    You will notice that every optimization here preserves a *contract*: the program prints the same output. A trustworthy compiler tests exactly that, by running the code before and after. Our exercises do too.
