    code: |
      code = [("const", "a", 1), ("bin", "b", "+", "a", "a"), ("bin", "c", "*", "b", "b"), ("print", "c")]
      assert count_instructions(code, "bin") == 2 and count_instructions(code, "const") == 1 and count_instructions(code, "jump") == 0
      assert count_instructions([], "bin") == 0
  solution: |
    def count_instructions(code, kind):
        return sum(1 for ins in code if ins[0] == kind)
