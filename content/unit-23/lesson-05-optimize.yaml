      code = [("const", "a", 1), ("const", "b", 2), ("jumpz", "a", "other"), ("print", "a"), ("jump", "end"), ("label", "other"), ("print", "b"), ("label", "end"), ("ret", "a")]
      blocks = basic_blocks(code)
      cfg = build_cfg(blocks)
      live_in, live_out = liveness(blocks, cfg)
      assert len(blocks) == 4
      assert live_in == [[], ["a"], ["a", "b"], ["a"]]
      assert live_out == [["a", "b"], ["a"], ["a"], []]
      single = liveness([[("const", "k", 1), ("print", "k")]], {0: []})
      assert single == ([[]], [[]])
  - name: removing dead assignments globally
    code: |
      prog = [("assign", "x", ("num", 5)), ("assign", "y", ("binop", "*", ("var", "x"), ("num", 2))), ("assign", "z", ("num", 7)),
              ("if", ("binop", "<", ("var", "x"), ("num", 3)), [("print", ("var", "y"))], [("print", ("var", "x"))])]
      code = lower_program(prog)
      better = dead_code_elimination(code)
      assert len(better) < len(code)
      assert ("copy", "z", "t4") not in better and all(ins[1] != "z" for ins in better if ins[0] == "copy")
      assert run_tac(better)["output"] == run_tac(code)["output"] == [5]
      assert dead_code_elimination([]) == []
      assert dead_code_elimination(better) == better
  - name: chains and loops
