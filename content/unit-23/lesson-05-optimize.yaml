      code = [("const", "a", 1), ("copy", "b", "a"), ("copy", "c", "b"), ("const", "r", 9), ("ret", "r")]
      assert dead_code_elimination(code) == [("const", "r", 9), ("ret", "r")]
      prog = [("assign", "i", ("num", 0)), ("assign", "s", ("num", 0)), ("assign", "waste", ("num", 1)),
              ("while", ("binop", "<", ("var", "i"), ("num", 4)), [("assign", "s", ("binop", "+", ("var", "s"), ("var", "i"))), ("assign", "waste", ("binop", "*", ("var", "waste"), ("num", 2))), ("assign", "i", ("binop", "+", ("var", "i"), ("num", 1)))]),
              ("print", ("var", "s"))]
      code = lower_program(prog)
      better = dead_code_elimination(code)
      assert run_tac(better)["output"] == run_tac(code)["output"] == [6]
      assert any(ins[0] == "copy" and ins[1] == "waste" for ins in better)
      assert any(ins[0] == "copy" and ins[1] == "s" for ins in better) and any(ins[0] == "copy" and ins[1] == "i" for ins in better)
  hints:
  - 'Liveness flows backwards: a variable is live-in if the block reads it, or it is live-out and the block does not overwrite it.'
  solution: |
    def lower(ast):
        """Lower an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to three-address code. Return (code, result_name).
        Every operation gets a fresh temporary t1, t2, ... (numbered from 1 in the order they are created, operands before the operation, left before right).
        Instructions: ("const", dest, value), ("neg", dest, a), ("bin", dest, op, a, b). A variable needs no instruction: its own name is the result."""
        code = []
        counter = [0]

        def fresh():
            counter[0] += 1
            return "t%d" % counter[0]

        def walk(e):
            if e[0] == "num":
                t = fresh()
                code.append(("const", t, e[1]))
                return t
            if e[0] == "var":
                return e[1]
            if e[0] == "unary":
                a = walk(e[2])
                t = fresh()
                code.append(("neg", t, a))
                return t
            a = walk(e[2])
            b = walk(e[3])
            t = fresh()
            code.append(("bin", t, e[1], a, b))
            return t

        result = walk(ast)
        return code, result


    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def run_tac(code, env=None, limit=10000):
        """Execute a list of instructions. Besides const, neg and bin there are ("copy", dest, src), ("label", name), ("jump", name), ("jumpz", cond, name)
        (jump if the variable is 0), ("print", a) and ("ret", a), which stops. Return {"env": variables, "output": printed values in order, "returned": the ret value or None}.
        Start from a copy of env. ValueError('undefined NAME') for reading a variable that has no value, ValueError('too many steps') after `limit` executed instructions."""
        env = dict(env or {})
        labels = {ins[1]: i for i, ins in enumerate(code) if ins[0] == "label"}
        output = []
        pc = 0
        steps = 0

        def get(name):
            if name not in env:
                raise ValueError("undefined " + name)
            return env[name]

        while pc < len(code):
            steps += 1
            if steps > limit:
                raise ValueError("too many steps")
            ins = code[pc]
            kind = ins[0]
            pc += 1
            if kind == "const":
                env[ins[1]] = ins[2]
            elif kind == "copy":
                env[ins[1]] = get(ins[2])
            elif kind == "neg":
                env[ins[1]] = -get(ins[2])
            elif kind == "bin":
                env[ins[1]] = apply_op(ins[2], get(ins[3]), get(ins[4]))
            elif kind == "print":
                output.append(get(ins[1]))
            elif kind == "ret":
                return {"env": env, "output": output, "returned": get(ins[1])}
            elif kind == "jump":
                pc = labels[ins[1]]
            elif kind == "jumpz":
                if get(ins[1]) == 0:
                    pc = labels[ins[2]]
        return {"env": env, "output": output, "returned": None}


    def lower_program(stmts):
        """Lower statements to flat three-address code with labels L1, L2, ... and temporaries t1, t2, ... Statements: ("assign", name, expr), ("print", expr),
        ("return", expr), ("if", cond, then_list, else_list), ("while", cond, body_list). A while loop is: label top; evaluate cond; jumpz cond end; body; jump top; label end.
        An if is: evaluate cond; jumpz cond else; then; jump end; label else; else-part; label end."""
        code = []
        counters = {"t": 0, "L": 0}

        def tmp():
            counters["t"] += 1
            return "t%d" % counters["t"]

        def label():
            counters["L"] += 1
            return "L%d" % counters["L"]

        def expr(e):
            if e[0] == "num":
                t = tmp()
                code.append(("const", t, e[1]))
                return t
            if e[0] == "var":
                return e[1]
            if e[0] == "unary":
                a = expr(e[2])
                t = tmp()
                code.append(("neg", t, a))
                return t
            a = expr(e[2])
            b = expr(e[3])
            t = tmp()
            code.append(("bin", t, e[1], a, b))
            return t

        def stmt(s):
            if s[0] == "assign":
                code.append(("copy", s[1], expr(s[2])))
            elif s[0] == "print":
                code.append(("print", expr(s[1])))
            elif s[0] == "return":
                code.append(("ret", expr(s[1])))
            elif s[0] == "while":
                top, end = label(), label()
                code.append(("label", top))
                c = expr(s[1])
                code.append(("jumpz", c, end))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", top))
                code.append(("label", end))
            else:
                other, end = label(), label()
                c = expr(s[1])
                code.append(("jumpz", c, other))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", end))
                code.append(("label", other))
                for x in s[3]:
                    stmt(x)
                code.append(("label", end))

        for s in stmts:
            stmt(s)
        return code


    def basic_blocks(code):
        """Split instructions into basic blocks: straight-line runs entered only at the top and left only at the bottom. A new block starts at the first instruction,
        at every ("label", ...), and right after every jump, jumpz or ret. Return a list of lists of instructions (empty code gives an empty list)."""
        blocks = []
        for i, ins in enumerate(code):
            starts = i == 0 or ins[0] == "label" or code[i - 1][0] in ("jump", "jumpz", "ret")
            if starts:
                blocks.append([])
            blocks[-1].append(ins)
        return blocks


    def build_cfg(blocks):
        """The control flow graph: a dict from block index to the sorted list of successor block indexes. Look at the LAST instruction: a jump goes to the block that
        starts with that label; a jumpz goes to that block or falls through to the next block; ret has no successors; anything else falls through to the next block (if any)."""
        where = {}
        for i, block in enumerate(blocks):
            if block[0][0] == "label":
                where[block[0][1]] = i
        cfg = {}
        for i, block in enumerate(blocks):
            last = block[-1]
            out = set()
            if last[0] == "jump":
                out.add(where[last[1]])
            elif last[0] == "jumpz":
                out.add(where[last[2]])
                if i + 1 < len(blocks):
                    out.add(i + 1)
            elif last[0] != "ret" and i + 1 < len(blocks):
                out.add(i + 1)
            cfg[i] = sorted(out)
        return cfg




    def defs_uses(ins):
        """Return (defined_name_or_None, list_of_used_names) for one instruction: const defines only; copy and neg use one name; bin uses two; jumpz, print and ret use
        one name and define nothing; label and jump neither define nor use."""
        kind = ins[0]
        if kind == "const":
            return ins[1], []
        if kind == "copy" or kind == "neg":
            return ins[1], [ins[2]]
        if kind == "bin":
            return ins[1], [ins[3], ins[4]]
        if kind == "jumpz":
            return None, [ins[1]]
        if kind in ("print", "ret"):
            return None, [ins[1]]
        return None, []




    def eliminate_dead_code(block, live_out):
        live = set(live_out)
        kept = []
        for ins in reversed(block):
            d, uses = defs_uses(ins)
            if d is not None and d not in live:
                continue
            if d is not None:
                live.discard(d)
            live.update(uses)
            kept.append(ins)
        kept.reverse()
        return kept


    def liveness(blocks, cfg):
        """Global liveness analysis by iteration. A variable is LIVE at a point if some path from there reads it before writing it. For each block compute
        use (variables read before any write in the block) and defs (variables written). Then repeat until nothing changes: live_out[b] = union of live_in[s] for successors s, and
        live_in[b] = use[b] union (live_out[b] minus defs[b]). Return (live_in, live_out), each a list indexed by block holding a SORTED list of names."""
        use, defs = [], []
        for block in blocks:
            u, d = set(), set()
            for ins in block:
                defined, used = defs_uses(ins)
                u.update(v for v in used if v not in d)
                if defined is not None:
                    d.add(defined)
            use.append(u)
            defs.append(d)
        live_in = [set() for _ in blocks]
        live_out = [set() for _ in blocks]
        changed = True
        while changed:
            changed = False
            for b in reversed(range(len(blocks))):
                out = set()
                for s in cfg[b]:
                    out |= live_in[s]
                new_in = use[b] | (out - defs[b])
                if out != live_out[b] or new_in != live_in[b]:
                    live_out[b], live_in[b] = out, new_in
                    changed = True
        return [sorted(s) for s in live_in], [sorted(s) for s in live_out]


    def dead_code_elimination(code):
        """Remove every assignment whose value is never used, across the whole program: repeat { split into blocks, build the cfg, run liveness, apply eliminate_dead_code to each block with
        its live_out, join the blocks } until the code stops changing (removing one assignment can make another dead). Return the new instruction list."""
        while True:
            blocks = basic_blocks(code)
            if not blocks:
                return []
            cfg = build_cfg(blocks)
            _, live_out = liveness(blocks, cfg)
            new = []
            for i, block in enumerate(blocks):
                new += eliminate_dead_code(block, live_out[i])
            if new == code:
                return code
            code = new
  explanation: 'Dataflow analysis is the engine behind most compiler optimizations: iterate simple facts to a fixed point.'
commonMistakes:
- title: Folding a division by zero
  explanation: The error must still happen when the program runs.
- title: Forgetting to invalidate facts after an assignment
  explanation: A copy or constant that referred to the old value is no longer true.
- title: Treating b - a as the same as a - b
  explanation: Only commutative operators may have their operands sorted.
- title: Dead code removal that looks only inside one block
  explanation: A variable may be used in a later block; liveness must cross the graph.
- title: Computing liveness forwards
  explanation: What is live depends on the future, so walk backwards.
summary:
- Three-address code is a flat, simple intermediate language with labels and jumps.
- Basic blocks and the control-flow graph show the shape of a program.
- Constant folding and copy propagation use what is already known.
- CSE reuses a computed value while its inputs are unchanged.
- Liveness is a backward dataflow analysis, iterated to a fixed point.
- Every optimization must preserve observable behaviour.
