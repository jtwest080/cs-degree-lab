    def lower(ast):
        """Lower an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to three-address code. Return (code, result_name).
        Every operation gets a fresh temporary t1, t2, ... (numbered from 1 in the order they are created, operands before the operation, left before right).
        Instructions: ("const", dest, value), ("neg", dest, a), ("bin", dest, op, a, b). A variable needs no instruction: its own name is the result."""
        code = []
        counter = [0]

        def fresh():
            counter[0] += 1
            return "t%d" % counter[0]

        def walk(e):
            if e[0] == "num":
                t = fresh()
                code.append(("const", t, e[1]))
                return t
            if e[0] == "var":
                return e[1]
            if e[0] == "unary":
                a = walk(e[2])
                t = fresh()
                code.append(("neg", t, a))
                return t
            a = walk(e[2])
            b = walk(e[3])
            t = fresh()
            code.append(("bin", t, e[1], a, b))
            return t

        result = walk(ast)
        return code, result


    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def run_tac(code, env=None, limit=10000):
        """Execute a list of instructions. Besides const, neg and bin there are ("copy", dest, src), ("label", name), ("jump", name), ("jumpz", cond, name)
        (jump if the variable is 0), ("print", a) and ("ret", a), which stops. Return {"env": variables, "output": printed values in order, "returned": the ret value or None}.
        Start from a copy of env. ValueError('undefined NAME') for reading a variable that has no value, ValueError('too many steps') after `limit` executed instructions."""
        env = dict(env or {})
        labels = {ins[1]: i for i, ins in enumerate(code) if ins[0] == "label"}
        output = []
        pc = 0
        steps = 0

        def get(name):
            if name not in env:
                raise ValueError("undefined " + name)
            return env[name]

        while pc < len(code):
            steps += 1
            if steps > limit:
                raise ValueError("too many steps")
            ins = code[pc]
            kind = ins[0]
            pc += 1
            if kind == "const":
                env[ins[1]] = ins[2]
            elif kind == "copy":
                env[ins[1]] = get(ins[2])
            elif kind == "neg":
                env[ins[1]] = -get(ins[2])
            elif kind == "bin":
                env[ins[1]] = apply_op(ins[2], get(ins[3]), get(ins[4]))
            elif kind == "print":
                output.append(get(ins[1]))
            elif kind == "ret":
                return {"env": env, "output": output, "returned": get(ins[1])}
            elif kind == "jump":
                pc = labels[ins[1]]
            elif kind == "jumpz":
                if get(ins[1]) == 0:
                    pc = labels[ins[2]]
        return {"env": env, "output": output, "returned": None}


    def defs_uses(ins):
        """Return (defined_name_or_None, list_of_used_names) for one instruction: const defines only; copy and neg use one name; bin uses two; jumpz, print and ret use
        one name and define nothing; label and jump neither define nor use."""
        kind = ins[0]
        if kind == "const":
            return ins[1], []
        if kind == "copy" or kind == "neg":
            return ins[1], [ins[2]]
        if kind == "bin":
            return ins[1], [ins[3], ins[4]]
        if kind == "jumpz":
            return None, [ins[1]]
        if kind in ("print", "ret"):
            return None, [ins[1]]
        return None, []

    def live_after(code, live_out=()):
        """For STRAIGHT-LINE three-address code (no labels or jumps), a list whose element i is the sorted list of variables live immediately AFTER instruction i, given that the
        variables in `live_out` are live at the end. Walk backwards keeping a live set; after processing instruction i going down, the set for i is what it was before you removed i's own
        definition and added its uses. Use defs_uses."""
        live = set(live_out)
        result = [None] * len(code)
        for i in range(len(code) - 1, -1, -1):
            result[i] = sorted(live)
            defined, used = defs_uses(code[i])
            if defined is not None:
                live.discard(defined)
            live.update(used)
        return result


    def live_at_entry(code, live_out=()):
        """Sorted list of variables live before the first instruction (the inputs the code reads before writing, plus live_out variables never written)."""
        live = set(live_out)
        for ins in reversed(code):
            defined, used = defs_uses(ins)
            if defined is not None:
                live.discard(defined)
            live.update(used)
        return sorted(live)


    def interference_graph(code, live_out=()):
        """Build the interference graph: a dict from every variable mentioned in the code to the sorted list of variables it interferes with (cannot share a register with).
        Two variables interfere if one is DEFINED while the other is live just after that instruction: add an edge between the defined variable and each other variable in live_after,
        EXCEPT that a copy ("copy", d, s) does not make d interfere with s (they hold the same value). Also, all variables live at entry interfere with each other. Variables with no
        conflicts still appear, with an empty list."""
        names = set(live_out)
        for ins in code:
            defined, used = defs_uses(ins)
            if defined is not None:
                names.add(defined)
            names.update(used)
        edges = {n: set() for n in names}
        after = live_after(code, live_out)
        for i, ins in enumerate(code):
            defined, _ = defs_uses(ins)
            if defined is None:
                continue
            for other in after[i]:
                if other == defined:
                    continue
                if ins[0] == "copy" and other == ins[2]:
                    continue
                edges[defined].add(other)
                edges[other].add(defined)
        entry = live_at_entry(code, live_out)
        for a in entry:
            for b in entry:
                if a != b:
                    edges[a].add(b)
        return {n: sorted(v) for n, v in edges.items()}


    def register_pressure(code, live_out=()):
        """The most variables that are live at the same time: the maximum over the size of live_at_entry and of every live_after set. It is a lower bound on the registers needed."""
        sizes = [len(live_at_entry(code, live_out))] + [len(s) for s in live_after(code, live_out)]
        return max(sizes)


    def color_graph(graph, k):
        """Chaitin-style graph coloring with k colors (0..k-1). SIMPLIFY: repeatedly pick a vertex to remove and push on a stack. If some remaining vertex has fewer than k
        remaining neighbours, take the one with the smallest name; otherwise take the vertex with the most remaining neighbours (ties: smallest name) as a POTENTIAL SPILL.
        SELECT: pop the stack in reverse order; give each vertex the lowest color not used by its already-colored neighbours in the ORIGINAL graph; if no color is free it is spilled.
        Return (colors dict, sorted list of spilled vertices). An empty graph gives ({}, [])."""
        remaining = {v: set(ns) for v, ns in graph.items()}
        stack = []
        while remaining:
            low = sorted(v for v in remaining if len(remaining[v]) < k)
            if low:
                pick = low[0]
            else:
                pick = sorted(remaining, key=lambda v: (-len(remaining[v]), v))[0]
            stack.append(pick)
            for n in remaining.pop(pick):
                remaining[n].discard(pick)
        colors = {}
        spilled = []
        for v in reversed(stack):
            used = {colors[n] for n in graph[v] if n in colors}
            free = [c for c in range(k) if c not in used]
            if free:
                colors[v] = free[0]
            else:
                spilled.append(v)
        return colors, sorted(spilled)


    def allocate(code, k, live_out=()):
        """Register allocation for straight-line code: build the interference graph, color it with k colors and return (assignment, spilled): assignment maps EVERY variable to a
        name: "R0".."R(k-1)" for the color it got, or "mem_" plus its own name if it was spilled to memory; spilled is the sorted list of spilled variables."""
        colors, spilled = color_graph(interference_graph(code, live_out), k)
        assignment = {v: "R%d" % c for v, c in colors.items()}
        for v in spilled:
            assignment[v] = "mem_" + v
        return assignment, spilled


    def rewrite(code, assignment):
        """Rename every variable in the instructions by the assignment (names that are not in it stay). Constants, operators and labels are not variables."""
        m = lambda n: assignment.get(n, n)
        out = []
        for ins in code:
            k = ins[0]
            if k == "const":
                out.append(("const", m(ins[1]), ins[2]))
            elif k in ("copy", "neg"):
                out.append((k, m(ins[1]), m(ins[2])))
            elif k == "bin":
                out.append(("bin", m(ins[1]), ins[2], m(ins[3]), m(ins[4])))
            elif k in ("print", "ret", "jumpz"):
                out.append((k, m(ins[1])) + tuple(ins[2:]))
            else:
                out.append(ins)
        return out
  explanation: 'Graph coloring turns register allocation into a classic problem: the compiler spills to memory only when it must.'
commonMistakes:
- title: Compiling the right operand before the left
  explanation: For a - b the machine pops b first, so a must be pushed first.
- title: Reusing a label name
  explanation: Every while and if needs its own labels; use a counter.
- title: Making a copy's two sides interfere
  explanation: They hold the same value and may share a register.
- title: Coloring in the wrong order
  explanation: Color in the reverse of the simplify order, or the low-degree guarantee is lost.
- title: Assuming spilling only costs space
  explanation: It also costs a memory access at each use and definition.
summary:
- Stack machines are simple targets; register machines are fast targets.
- An assembler turns labels into addresses; a VM is a loop with a program counter.
- Peephole optimization removes waste in small windows.
- Interference graphs record which variables are live together.
- Register allocation is graph coloring; spilling is the fallback.
