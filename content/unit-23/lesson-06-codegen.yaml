      v = lambda n: ("var", n)
      add = lambda a, b: ("binop", "+", a, b)
      assert max_stack_depth([]) == 0
      assert max_stack_depth(compile_expr(v("a"))) == 1
      assert max_stack_depth(compile_expr(add(add(add(v("a"), v("b")), v("c")), v("d")))) == 2
      assert max_stack_depth(compile_expr(add(v("a"), add(v("b"), add(v("c"), v("d")))))) == 4
      assert max_stack_depth(compile_expr(("binop", "*", add(v("a"), v("b")), add(v("c"), v("d"))))) == 3
