- id: stack
  title: Compiling to a stack machine
  difficulty: 4
  prompt: 'The starter has `apply_op`. A **stack machine** keeps temporary values on a stack instead of in named registers; Java bytecode and Python bytecode work this way. Write `compile_expr(ast)` for an expression AST (`num`, `var`, `("unary", "-", e)`, `("binop", op, l, r)`), producing a list of instructions `("push", value)`, `("load", name)`, `("neg",)` and `("op", operator)`. Use post-order: operands first, then the operator, so its operands are on top of the stack when it runs. Write `run_expr_vm(code, env=None)`, which runs such code and returns the single value left: `push` puts a value on the stack, `load` pushes a variable, `neg` replaces the top with its negative, and `("op", o)` pops `b`, then `a`, and pushes `apply_op(o, a, b)`. Raise `ValueError("stack underflow")` when an instruction needs more values than the stack has, `ValueError("undefined NAME")` for an unknown variable, and `ValueError("bad program")` if the final stack does not hold exactly one value. Write `max_stack_depth(code)`: the largest number of values on the stack at any moment (0 for empty code).'
  starter: |-
    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def compile_expr(ast):
        """Compile an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to STACK MACHINE code: a list of instructions
        ("push", value), ("load", name), ("neg",) and ("op", operator). Post-order: operands first, then the operator, so that at run time its operands are on top of the stack."""
        pass


    def run_expr_vm(code, env=None):
        """Run expression bytecode on a stack and return the single value left. push puts a value on the stack; load pushes a variable; neg replaces the top with its
        negative; ("op", o) pops b, then a, and pushes apply_op(o, a, b). ValueError('stack underflow') when an instruction needs more values than the stack has,
        ValueError('undefined NAME') for an unknown variable, and ValueError('bad program') if the final stack does not hold exactly one value."""
        pass


    def max_stack_depth(code):
        """The largest number of values the stack holds at any moment while running expression bytecode (0 for empty code). push and load add one, op removes one net (pops two, pushes
        one), neg changes nothing."""
        pass
  tests:
  - name: compiling
    code: |
      assert compile_expr(("binop", "+", ("num", 1), ("binop", "*", ("num", 2), ("num", 3)))) == [("push", 1), ("push", 2), ("push", 3), ("op", "*"), ("op", "+")]
      assert compile_expr(("var", "x")) == [("load", "x")]
      assert compile_expr(("unary", "-", ("var", "a"))) == [("load", "a"), ("neg",)]
      assert compile_expr(("binop", "-", ("binop", "-", ("var", "a"), ("var", "b")), ("var", "c"))) == [("load", "a"), ("load", "b"), ("op", "-"), ("load", "c"), ("op", "-")]
