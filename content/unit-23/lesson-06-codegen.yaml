    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def compile_expr(ast):
        """Compile an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to STACK MACHINE code: a list of instructions
        ("push", value), ("load", name), ("neg",) and ("op", operator). Post-order: operands first, then the operator, so that at run time its operands are on top of the stack."""
        kind = ast[0]
        if kind == "num":
            return [("push", ast[1])]
        if kind == "var":
            return [("load", ast[1])]
        if kind == "unary":
            return compile_expr(ast[2]) + [("neg",)]
        return compile_expr(ast[2]) + compile_expr(ast[3]) + [("op", ast[1])]




    def assemble(code):
        """Resolve labels: remove every ("label", name) pseudo-instruction and replace the name in each jump and jumpz by the integer index of the instruction that follows
        the label in the new list. A label at the very end points one past the last instruction. ValueError('duplicate label NAME'), ValueError('unknown label NAME')."""
        where = {}
        count = 0
        for ins in code:
            if ins[0] == "label":
                if ins[1] in where:
                    raise ValueError("duplicate label " + ins[1])
                where[ins[1]] = count
            else:
                count += 1
        out = []
        for ins in code:
            if ins[0] == "label":
                continue
            if ins[0] in ("jump", "jumpz"):
                if ins[1] not in where:
                    raise ValueError("unknown label " + str(ins[1]))
                out.append((ins[0], where[ins[1]]))
            else:
                out.append(ins)
        return out


    def run_vm(code, env=None, limit=10000):
        """Run ASSEMBLED bytecode with a program counter and a value stack. Instructions: ("push", v); ("load", name); ("store", name) pops a value into a variable; ("neg",);
        ("op", o); ("print",) pops and records a value; ("ret",) pops a value and stops with it; ("jump", index); ("jumpz", index) pops and jumps if the value is 0; ("pop",) discards the top.
        Running off the end stops. Return {"env": variables, "output": printed values, "returned": value or None, "stack": what is left on the stack}.
        Start from a copy of env. ValueError('stack underflow'), ValueError('undefined NAME'), ValueError('too many steps') after `limit` executed instructions."""
        env = dict(env or {})
        stack, output = [], []
        pc = steps = 0

        def pop():
            if not stack:
                raise ValueError("stack underflow")
            return stack.pop()

        while pc < len(code):
            steps += 1
            if steps > limit:
                raise ValueError("too many steps")
            ins = code[pc]
            pc += 1
            kind = ins[0]
            if kind == "push":
                stack.append(ins[1])
            elif kind == "load":
                if ins[1] not in env:
                    raise ValueError("undefined " + ins[1])
                stack.append(env[ins[1]])
            elif kind == "store":
                env[ins[1]] = pop()
            elif kind == "neg":
                stack.append(-pop())
            elif kind == "op":
                b = pop()
                a = pop()
                stack.append(apply_op(ins[1], a, b))
            elif kind == "print":
                output.append(pop())
            elif kind == "pop":
                pop()
            elif kind == "ret":
                return {"env": env, "output": output, "returned": pop(), "stack": stack}
            elif kind == "jump":
                pc = ins[1]
            elif kind == "jumpz":
                if pop() == 0:
                    pc = ins[1]
        return {"env": env, "output": output, "returned": None, "stack": stack}


    def compile_program(stmts):
        """Compile statements to bytecode WITH labels (not yet assembled). Statements: ("assign", name, expr) -> expression code then ("store", name); ("print", expr) -> expression then
        ("print",); ("return", expr) -> expression then ("ret",); ("while", cond, body): label top, cond, ("jumpz", end), body, ("jump", top), label end; ("if", cond, then, else): cond,
        ("jumpz", other), then, ("jump", end), label other, else, label end. Labels are named L1, L2, ... in the order they are created (for a while: top is L1, end L2; for an if: other is L1,
        end L2; nested constructs continue the numbering). Use compile_expr for expressions."""
        code = []
        counter = [0]

        def label():
            counter[0] += 1
            return "L%d" % counter[0]

        def stmt(s):
            if s[0] == "assign":
                code.extend(compile_expr(s[2]))
                code.append(("store", s[1]))
            elif s[0] == "print":
                code.extend(compile_expr(s[1]))
                code.append(("print",))
            elif s[0] == "return":
                code.extend(compile_expr(s[1]))
                code.append(("ret",))
            elif s[0] == "while":
                top, end = label(), label()
                code.append(("label", top))
                code.extend(compile_expr(s[1]))
                code.append(("jumpz", end))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", top))
                code.append(("label", end))
            else:
                other, end = label(), label()
                code.extend(compile_expr(s[1]))
                code.append(("jumpz", other))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", end))
                code.append(("label", other))
                for x in s[3]:
                    stmt(x)
                code.append(("label", end))

        for s in stmts:
            stmt(s)
        return code


    def peephole(code):
        """Peephole optimization: slide a small window over the code and rewrite wasteful patterns, repeating until nothing changes. Patterns: ("push", a), ("push", b), ("op", o) becomes
        ("push", apply_op(o, a, b)) (unless apply_op raises ValueError); ("push", v), ("neg",) becomes ("push", -v); a ("jump", L) immediately followed by ("label", L) loses the jump. Return the new list."""
        code = list(code)
        changed = True
        while changed:
            changed = False
            out = []
            i = 0
            while i < len(code):
                if i + 2 < len(code) and code[i][0] == "push" and code[i + 1][0] == "push" and code[i + 2][0] == "op":
                    try:
                        value = apply_op(code[i + 2][1], code[i][1], code[i + 1][1])
                    except ValueError:
                        value = None
                    if value is not None:
                        out.append(("push", value))
                        i += 3
                        changed = True
                        continue
                if i + 1 < len(code) and code[i][0] == "push" and code[i + 1][0] == "neg":
                    out.append(("push", -code[i][1]))
                    i += 2
                    changed = True
                    continue
                if i + 1 < len(code) and code[i][0] == "jump" and code[i + 1] == ("label", code[i][1]):
                    i += 1
                    changed = True
                    continue
                out.append(code[i])
                i += 1
            code = out
        return code
  explanation: Code generation is a systematic translation, and a peephole pass cleans up the obvious waste it leaves behind.
