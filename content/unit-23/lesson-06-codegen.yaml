  - Compile the left operand, then the right operand, then the operator.
  solution: |
    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def compile_expr(ast):
        """Compile an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to STACK MACHINE code: a list of instructions
        ("push", value), ("load", name), ("neg",) and ("op", operator). Post-order: operands first, then the operator, so that at run time its operands are on top of the stack."""
        kind = ast[0]
        if kind == "num":
            return [("push", ast[1])]
        if kind == "var":
            return [("load", ast[1])]
        if kind == "unary":
            return compile_expr(ast[2]) + [("neg",)]
        return compile_expr(ast[2]) + compile_expr(ast[3]) + [("op", ast[1])]


    def run_expr_vm(code, env=None):
        """Run expression bytecode on a stack and return the single value left. push puts a value on the stack; load pushes a variable; neg replaces the top with its
        negative; ("op", o) pops b, then a, and pushes apply_op(o, a, b). ValueError('stack underflow') when an instruction needs more values than the stack has,
        ValueError('undefined NAME') for an unknown variable, and ValueError('bad program') if the final stack does not hold exactly one value."""
        env = env or {}
        stack = []
        for ins in code:
            if ins[0] == "push":
                stack.append(ins[1])
            elif ins[0] == "load":
                if ins[1] not in env:
                    raise ValueError("undefined " + ins[1])
                stack.append(env[ins[1]])
            elif ins[0] == "neg":
                if not stack:
                    raise ValueError("stack underflow")
                stack.append(-stack.pop())
            else:
                if len(stack) < 2:
                    raise ValueError("stack underflow")
                b = stack.pop()
                a = stack.pop()
                stack.append(apply_op(ins[1], a, b))
        if len(stack) != 1:
            raise ValueError("bad program")
        return stack[0]


    def max_stack_depth(code):
        """The largest number of values the stack holds at any moment while running expression bytecode (0 for empty code). push and load add one, op removes one net (pops two, pushes
        one), neg changes nothing."""
        depth = best = 0
        for ins in code:
            if ins[0] in ("push", "load"):
                depth += 1
            elif ins[0] == "op":
                depth -= 1
            best = max(best, depth)
        return best
  explanation: 'A stack machine needs no register names: the order of instructions encodes the structure of the tree.'
