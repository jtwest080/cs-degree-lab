id: u23-codegen
title: Code Generation and Registers
minutes: 100
objective: 'Learn how a compiler produces something a machine can run: bytecode for a stack machine, an assembler that resolves jump targets, a virtual machine that executes it, peephole clean-up, and register allocation by graph coloring.'
outcomes:
- Compile expressions and statements to stack-machine bytecode
- Explain assemblers, labels and jump targets
- Write a virtual machine
- Compute liveness and an interference graph
- Allocate registers by graph coloring and explain spilling
sections:
- heading: 'Targets: stack machines and register machines'
  body: |-
    The last phase of a compiler, **code generation**, produces instructions for a **target machine**. Two designs dominate. A **stack machine** keeps temporary values on a stack: to compute `a + b * 2` it pushes `a`, pushes `b`, pushes `2`, multiplies (which pops two values and pushes the product) and adds. There are no register names to choose, so compiling to it is easy: walk the tree in post-order and every operator finds its operands waiting on top of the stack. Java bytecode, the `.NET` instruction set and CPython's own bytecode are stack machines, which is also why they are easy to interpret.

    A **register machine**, such as the processor in your computer, has a small set of fast storage slots called **registers** and instructions that name them: `add r1, r2, r3`. Programs run much faster because values do not travel through memory, but the compiler must now decide which value lives in which register. Typical processors have between 8 and 32 general registers, far fewer than the variables and temporaries in a real program, so choosing well matters.
- heading: Assemblers, jumps and virtual machines
  body: |-
    Control flow in bytecode is built from **jumps**. A jump says "continue at instruction number 17". Humans and compilers prefer **labels**, names for positions; an **assembler** is the small program that replaces labels with real addresses (here, list indexes) in two passes: first find where each label lands, then rewrite every jump. (The compiler also must pick unique label names; a counter does it.) A `while` loop compiles to: a label at the top, the test, a conditional jump to the end label when it fails, the body, an unconditional jump back to the top, and the end label. An `if` compiles to a conditional jump over the "then" part, with a jump over the "else" part at its end.

    A **virtual machine** (VM) runs bytecode in software: a loop with a **program counter** (the index of the next instruction), a stack, a table of variables, and a big case analysis on the instruction. A jump just assigns the program counter. Our `run_vm` is a complete little VM, and a real one such as Python's differs mainly in speed and in having more instructions. Because the VM is code you control, it is also a safe place to add limits such as our step counter that stops infinite loops.

    After generating code, a **peephole optimizer** looks through a small window of instructions and replaces wasteful patterns by better ones: folding `push 2, push 3, add` into `push 5`, or deleting a jump to the very next instruction. Each rewrite can create the opportunity for the next, so the pass repeats until nothing changes.
- heading: Register allocation by graph coloring
  body: |-
    Back to registers. Two variables may share a register only if they never hold needed values at the same time. A variable is **live** at a point if its current value will be read later (the idea from the optimization lesson). Walk the code backwards keeping a set of live variables; whenever an instruction **defines** a variable while others are live, that variable **interferes** with them: it must not be placed in the same register. Draw each variable as a vertex and each interference as an edge, and you have an **interference graph**. (A copy `y = x` is the exception: both hold the same value, so they may share a register, which lets the compiler delete the copy altogether.)

    Now assigning registers is exactly **graph coloring**: give each vertex a color (a register) so that connected vertices differ, using at most `k` colors for `k` registers. Finding the minimum number of colors is NP-hard (the same family of problems as the earlier algorithms unit), but a simple heuristic works very well in practice, and is the core of the classic **Chaitin** allocator. **Simplify:** a vertex with fewer than `k` neighbours can always be colored later, whatever its neighbours get, so remove it and put it on a stack; repeat. If every remaining vertex has `k` or more neighbours, pick one as a **potential spill** and remove it anyway, hoping its neighbours will share colors. **Select:** pop the stack and color each vertex with a free color. If a potential spill finds none, it becomes an **actual spill**: the variable lives in memory, with a load before each use and a store after each definition. Spilling costs time, so compilers choose spill candidates carefully, usually favouring variables used rarely, outside loops.

    The size of the largest live set is the **register pressure**, a lower bound on the registers required. This is a real-world payoff from the graph theory in the earlier units. Real back ends add much more: choosing among machine instructions (**instruction selection**), obeying **calling conventions** (which registers a function may overwrite), and scheduling instructions to keep the processor busy. But the pipeline you have now built, from characters to tokens to trees to checked trees to three-address code to optimized code to registers, is the same one inside every compiler.
examples:
- title: Bytecode and a virtual machine
  intro: Compiling an expression and a loop to stack code, assembling it and running it.
  code: |
    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def compile_expr(ast):
        """Compile an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to STACK MACHINE code: a list of instructions
        ("push", value), ("load", name), ("neg",) and ("op", operator). Post-order: operands first, then the operator, so that at run time its operands are on top of the stack."""
        kind = ast[0]
        if kind == "num":
            return [("push", ast[1])]
        if kind == "var":
            return [("load", ast[1])]
        if kind == "unary":
            return compile_expr(ast[2]) + [("neg",)]
        return compile_expr(ast[2]) + compile_expr(ast[3]) + [("op", ast[1])]


    def run_expr_vm(code, env=None):
        """Run expression bytecode on a stack and return the single value left. push puts a value on the stack; load pushes a variable; neg replaces the top with its
        negative; ("op", o) pops b, then a, and pushes apply_op(o, a, b). ValueError('stack underflow') when an instruction needs more values than the stack has,
        ValueError('undefined NAME') for an unknown variable, and ValueError('bad program') if the final stack does not hold exactly one value."""
        env = env or {}
        stack = []
        for ins in code:
            if ins[0] == "push":
                stack.append(ins[1])
            elif ins[0] == "load":
                if ins[1] not in env:
                    raise ValueError("undefined " + ins[1])
                stack.append(env[ins[1]])
            elif ins[0] == "neg":
                if not stack:
                    raise ValueError("stack underflow")
                stack.append(-stack.pop())
            else:
                if len(stack) < 2:
                    raise ValueError("stack underflow")
                b = stack.pop()
                a = stack.pop()
                stack.append(apply_op(ins[1], a, b))
        if len(stack) != 1:
            raise ValueError("bad program")
        return stack[0]


    def max_stack_depth(code):
        """The largest number of values the stack holds at any moment while running expression bytecode (0 for empty code). push and load add one, op removes one net (pops two, pushes
        one), neg changes nothing."""
        depth = best = 0
        for ins in code:
            if ins[0] in ("push", "load"):
                depth += 1
            elif ins[0] == "op":
                depth -= 1
            best = max(best, depth)
        return best


    def assemble(code):
        """Resolve labels: remove every ("label", name) pseudo-instruction and replace the name in each jump and jumpz by the integer index of the instruction that follows
        the label in the new list. A label at the very end points one past the last instruction. ValueError('duplicate label NAME'), ValueError('unknown label NAME')."""
        where = {}
        count = 0
        for ins in code:
            if ins[0] == "label":
                if ins[1] in where:
                    raise ValueError("duplicate label " + ins[1])
                where[ins[1]] = count
            else:
                count += 1
        out = []
        for ins in code:
            if ins[0] == "label":
                continue
            if ins[0] in ("jump", "jumpz"):
                if ins[1] not in where:
                    raise ValueError("unknown label " + str(ins[1]))
                out.append((ins[0], where[ins[1]]))
            else:
                out.append(ins)
        return out


    def run_vm(code, env=None, limit=10000):
        """Run ASSEMBLED bytecode with a program counter and a value stack. Instructions: ("push", v); ("load", name); ("store", name) pops a value into a variable; ("neg",);
        ("op", o); ("print",) pops and records a value; ("ret",) pops a value and stops with it; ("jump", index); ("jumpz", index) pops and jumps if the value is 0; ("pop",) discards the top.
        Running off the end stops. Return {"env": variables, "output": printed values, "returned": value or None, "stack": what is left on the stack}.
        Start from a copy of env. ValueError('stack underflow'), ValueError('undefined NAME'), ValueError('too many steps') after `limit` executed instructions."""
        env = dict(env or {})
        stack, output = [], []
        pc = steps = 0

        def pop():
            if not stack:
                raise ValueError("stack underflow")
            return stack.pop()

        while pc < len(code):
            steps += 1
            if steps > limit:
                raise ValueError("too many steps")
            ins = code[pc]
            pc += 1
            kind = ins[0]
            if kind == "push":
                stack.append(ins[1])
            elif kind == "load":
                if ins[1] not in env:
                    raise ValueError("undefined " + ins[1])
                stack.append(env[ins[1]])
            elif kind == "store":
                env[ins[1]] = pop()
            elif kind == "neg":
                stack.append(-pop())
            elif kind == "op":
                b = pop()
                a = pop()
                stack.append(apply_op(ins[1], a, b))
            elif kind == "print":
                output.append(pop())
            elif kind == "pop":
                pop()
            elif kind == "ret":
                return {"env": env, "output": output, "returned": pop(), "stack": stack}
            elif kind == "jump":
                pc = ins[1]
            elif kind == "jumpz":
                if pop() == 0:
                    pc = ins[1]
        return {"env": env, "output": output, "returned": None, "stack": stack}


    def compile_program(stmts):
        """Compile statements to bytecode WITH labels (not yet assembled). Statements: ("assign", name, expr) -> expression code then ("store", name); ("print", expr) -> expression then
        ("print",); ("return", expr) -> expression then ("ret",); ("while", cond, body): label top, cond, ("jumpz", end), body, ("jump", top), label end; ("if", cond, then, else): cond,
        ("jumpz", other), then, ("jump", end), label other, else, label end. Labels are named L1, L2, ... in the order they are created (for a while: top is L1, end L2; for an if: other is L1,
        end L2; nested constructs continue the numbering). Use compile_expr for expressions."""
        code = []
        counter = [0]

        def label():
            counter[0] += 1
            return "L%d" % counter[0]

        def stmt(s):
            if s[0] == "assign":
                code.extend(compile_expr(s[2]))
                code.append(("store", s[1]))
            elif s[0] == "print":
                code.extend(compile_expr(s[1]))
                code.append(("print",))
            elif s[0] == "return":
                code.extend(compile_expr(s[1]))
                code.append(("ret",))
            elif s[0] == "while":
                top, end = label(), label()
                code.append(("label", top))
                code.extend(compile_expr(s[1]))
                code.append(("jumpz", end))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", top))
                code.append(("label", end))
            else:
                other, end = label(), label()
                code.extend(compile_expr(s[1]))
                code.append(("jumpz", other))
                for x in s[2]:
                    stmt(x)
                code.append(("jump", end))
                code.append(("label", other))
                for x in s[3]:
                    stmt(x)
                code.append(("label", end))

        for s in stmts:
            stmt(s)
        return code


    def peephole(code):
        """Peephole optimization: slide a small window over the code and rewrite wasteful patterns, repeating until nothing changes. Patterns: ("push", a), ("push", b), ("op", o) becomes
        ("push", apply_op(o, a, b)) (unless apply_op raises ValueError); ("push", v), ("neg",) becomes ("push", -v); a ("jump", L) immediately followed by ("label", L) loses the jump. Return the new list."""
        code = list(code)
        changed = True
        while changed:
            changed = False
            out = []
            i = 0
            while i < len(code):
                if i + 2 < len(code) and code[i][0] == "push" and code[i + 1][0] == "push" and code[i + 2][0] == "op":
                    try:
                        value = apply_op(code[i + 2][1], code[i][1], code[i + 1][1])
                    except ValueError:
                        value = None
                    if value is not None:
                        out.append(("push", value))
                        i += 3
                        changed = True
                        continue
                if i + 1 < len(code) and code[i][0] == "push" and code[i + 1][0] == "neg":
                    out.append(("push", -code[i][1]))
                    i += 2
                    changed = True
                    continue
                if i + 1 < len(code) and code[i][0] == "jump" and code[i + 1] == ("label", code[i][1]):
                    i += 1
                    changed = True
                    continue
                out.append(code[i])
                i += 1
            code = out
        return code

    expr = ("binop", "*", ("binop", "+", ("var", "a"), ("num", 2)), ("unary", "-", ("var", "b")))
    code = compile_expr(expr)
    print("bytecode:", code)
    print("value:", run_expr_vm(code, {"a": 3, "b": 4}), "stack depth:", max_stack_depth(code))
    program = [("assign", "n", ("num", 4)), ("assign", "f", ("num", 1)),
               ("while", ("binop", ">", ("var", "n"), ("num", 1)), [("assign", "f", ("binop", "*", ("var", "f"), ("var", "n"))), ("assign", "n", ("binop", "-", ("var", "n"), ("num", 1)))]),
               ("print", ("var", "f"))]
    raw = compile_program(program)
    assembled = assemble(raw)
    print("instructions:", len(assembled), " first jump goes to index", [ins[1] for ins in assembled if ins[0] == "jumpz"][0])
    print("output:", run_vm(assembled)["output"])
    print("peephole:", peephole([("push", 2), ("push", 3), ("op", "*"), ("push", 4), ("op", "+")]))
  output: |
    bytecode: [('load', 'a'), ('push', 2), ('op', '+'), ('load', 'b'), ('neg',), ('op', '*')]
    value: -20 stack depth: 2
    instructions: 19  first jump goes to index 17
    output: [24]
    peephole: [('push', 10)]
  lines:
  - line: 231
    note: Operands first, then the operator.
  - line: 238
    note: Labels become indexes.
  - line: 240
    note: The VM runs the loop.
  - line: 241
    note: Constant arithmetic is folded away.
- title: Allocating registers
  intro: Building an interference graph for an expression and coloring it with six and then three registers.
  code: |
    def lower(ast):
        """Lower an expression AST (("num", v), ("var", name), ("unary", "-", e), ("binop", op, l, r)) to three-address code. Return (code, result_name).
        Every operation gets a fresh temporary t1, t2, ... (numbered from 1 in the order they are created, operands before the operation, left before right).
        Instructions: ("const", dest, value), ("neg", dest, a), ("bin", dest, op, a, b). A variable needs no instruction: its own name is the result."""
        code = []
        counter = [0]

        def fresh():
            counter[0] += 1
            return "t%d" % counter[0]

        def walk(e):
            if e[0] == "num":
                t = fresh()
                code.append(("const", t, e[1]))
                return t
            if e[0] == "var":
                return e[1]
            if e[0] == "unary":
                a = walk(e[2])
                t = fresh()
                code.append(("neg", t, a))
                return t
            a = walk(e[2])
            b = walk(e[3])
            t = fresh()
            code.append(("bin", t, e[1], a, b))
            return t

        result = walk(ast)
        return code, result


    def apply_op(op, a, b):
        """Apply a binary operator to two numbers: + - * (as usual), / (true division), % (remainder); the comparisons < <= > >= == != give 1 or 0.
        ValueError('division by zero') for / or % with b == 0, and ValueError('unknown operator OP') for anything else."""
        if op == "+":
            return a + b
        if op == "-":
            return a - b
        if op == "*":
            return a * b
        if op in ("/", "%"):
            if b == 0:
                raise ValueError("division by zero")
            return a / b if op == "/" else a % b
        table = {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b, "==": a == b, "!=": a != b}
        if op in table:
            return 1 if table[op] else 0
        raise ValueError("unknown operator " + str(op))


    def run_tac(code, env=None, limit=10000):
        """Execute a list of instructions. Besides const, neg and bin there are ("copy", dest, src), ("label", name), ("jump", name), ("jumpz", cond, name)
        (jump if the variable is 0), ("print", a) and ("ret", a), which stops. Return {"env": variables, "output": printed values in order, "returned": the ret value or None}.
        Start from a copy of env. ValueError('undefined NAME') for reading a variable that has no value, ValueError('too many steps') after `limit` executed instructions."""
        env = dict(env or {})
        labels = {ins[1]: i for i, ins in enumerate(code) if ins[0] == "label"}
        output = []
        pc = 0
        steps = 0

        def get(name):
            if name not in env:
                raise ValueError("undefined " + name)
            return env[name]

        while pc < len(code):
            steps += 1
            if steps > limit:
                raise ValueError("too many steps")
            ins = code[pc]
            kind = ins[0]
            pc += 1
            if kind == "const":
                env[ins[1]] = ins[2]
            elif kind == "copy":
                env[ins[1]] = get(ins[2])
            elif kind == "neg":
                env[ins[1]] = -get(ins[2])
            elif kind == "bin":
                env[ins[1]] = apply_op(ins[2], get(ins[3]), get(ins[4]))
            elif kind == "print":
                output.append(get(ins[1]))
            elif kind == "ret":
                return {"env": env, "output": output, "returned": get(ins[1])}
            elif kind == "jump":
                pc = labels[ins[1]]
            elif kind == "jumpz":
                if get(ins[1]) == 0:
                    pc = labels[ins[2]]
        return {"env": env, "output": output, "returned": None}


    def defs_uses(ins):
        """Return (defined_name_or_None, list_of_used_names) for one instruction: const defines only; copy and neg use one name; bin uses two; jumpz, print and ret use
        one name and define nothing; label and jump neither define nor use."""
        kind = ins[0]
        if kind == "const":
            return ins[1], []
        if kind == "copy" or kind == "neg":
            return ins[1], [ins[2]]
        if kind == "bin":
            return ins[1], [ins[3], ins[4]]
        if kind == "jumpz":
            return None, [ins[1]]
        if kind in ("print", "ret"):
            return None, [ins[1]]
        return None, []

    def live_after(code, live_out=()):
        """For STRAIGHT-LINE three-address code (no labels or jumps), a list whose element i is the sorted list of variables live immediately AFTER instruction i, given that the
        variables in `live_out` are live at the end. Walk backwards keeping a live set; after processing instruction i going down, the set for i is what it was before you removed i's own
        definition and added its uses. Use defs_uses."""
        live = set(live_out)
        result = [None] * len(code)
        for i in range(len(code) - 1, -1, -1):
            result[i] = sorted(live)
            defined, used = defs_uses(code[i])
            if defined is not None:
                live.discard(defined)
            live.update(used)
        return result


    def live_at_entry(code, live_out=()):
        """Sorted list of variables live before the first instruction (the inputs the code reads before writing, plus live_out variables never written)."""
        live = set(live_out)
        for ins in reversed(code):
            defined, used = defs_uses(ins)
            if defined is not None:
                live.discard(defined)
            live.update(used)
        return sorted(live)


    def interference_graph(code, live_out=()):
        """Build the interference graph: a dict from every variable mentioned in the code to the sorted list of variables it interferes with (cannot share a register with).
        Two variables interfere if one is DEFINED while the other is live just after that instruction: add an edge between the defined variable and each other variable in live_after,
        EXCEPT that a copy ("copy", d, s) does not make d interfere with s (they hold the same value). Also, all variables live at entry interfere with each other. Variables with no
        conflicts still appear, with an empty list."""
        names = set(live_out)
        for ins in code:
            defined, used = defs_uses(ins)
            if defined is not None:
                names.add(defined)
            names.update(used)
        edges = {n: set() for n in names}
        after = live_after(code, live_out)
        for i, ins in enumerate(code):
            defined, _ = defs_uses(ins)
            if defined is None:
                continue
            for other in after[i]:
                if other == defined:
                    continue
                if ins[0] == "copy" and other == ins[2]:
                    continue
                edges[defined].add(other)
                edges[other].add(defined)
        entry = live_at_entry(code, live_out)
        for a in entry:
            for b in entry:
                if a != b:
                    edges[a].add(b)
        return {n: sorted(v) for n, v in edges.items()}


    def register_pressure(code, live_out=()):
        """The most variables that are live at the same time: the maximum over the size of live_at_entry and of every live_after set. It is a lower bound on the registers needed."""
        sizes = [len(live_at_entry(code, live_out))] + [len(s) for s in live_after(code, live_out)]
        return max(sizes)

    def color_graph(graph, k):
        """Chaitin-style graph coloring with k colors (0..k-1). SIMPLIFY: repeatedly pick a vertex to remove and push on a stack. If some remaining vertex has fewer than k
        remaining neighbours, take the one with the smallest name; otherwise take the vertex with the most remaining neighbours (ties: smallest name) as a POTENTIAL SPILL.
        SELECT: pop the stack in reverse order; give each vertex the lowest color not used by its already-colored neighbours in the ORIGINAL graph; if no color is free it is spilled.
        Return (colors dict, sorted list of spilled vertices). An empty graph gives ({}, [])."""
        remaining = {v: set(ns) for v, ns in graph.items()}
        stack = []
        while remaining:
            low = sorted(v for v in remaining if len(remaining[v]) < k)
            if low:
                pick = low[0]
            else:
                pick = sorted(remaining, key=lambda v: (-len(remaining[v]), v))[0]
            stack.append(pick)
            for n in remaining.pop(pick):
                remaining[n].discard(pick)
        colors = {}
        spilled = []
        for v in reversed(stack):
            used = {colors[n] for n in graph[v] if n in colors}
            free = [c for c in range(k) if c not in used]
            if free:
                colors[v] = free[0]
            else:
                spilled.append(v)
        return colors, sorted(spilled)


    def allocate(code, k, live_out=()):
        """Register allocation for straight-line code: build the interference graph, color it with k colors and return (assignment, spilled): assignment maps EVERY variable to a
        name: "R0".."R(k-1)" for the color it got, or "mem_" plus its own name if it was spilled to memory; spilled is the sorted list of spilled variables."""
        colors, spilled = color_graph(interference_graph(code, live_out), k)
        assignment = {v: "R%d" % c for v, c in colors.items()}
        for v in spilled:
            assignment[v] = "mem_" + v
        return assignment, spilled


    def rewrite(code, assignment):
        """Rename every variable in the instructions by the assignment (names that are not in it stay). Constants, operators and labels are not variables."""
        m = lambda n: assignment.get(n, n)
        out = []
        for ins in code:
            k = ins[0]
            if k == "const":
                out.append(("const", m(ins[1]), ins[2]))
            elif k in ("copy", "neg"):
                out.append((k, m(ins[1]), m(ins[2])))
            elif k == "bin":
                out.append(("bin", m(ins[1]), ins[2], m(ins[3]), m(ins[4])))
            elif k in ("print", "ret", "jumpz"):
                out.append((k, m(ins[1])) + tuple(ins[2:]))
            else:
                out.append(ins)
        return out

    a, b, c, d = ("var", "a"), ("var", "b"), ("var", "c"), ("var", "d")
    expr = ("binop", "+", ("binop", "*", ("binop", "+", a, b), ("binop", "+", c, d)), ("binop", "*", ("binop", "-", a, b), ("binop", "-", c, d)))
    code, result = lower(expr)
    print("instructions:", len(code), " register pressure:", register_pressure(code, [result]))
    graph = interference_graph(code, [result])
    for name in sorted(graph):
        print(name, "conflicts with", graph[name])
    for k in (6, 3):
        assign, spilled = allocate(code, k, [result])
        env = {"a": 7, "b": 3, "c": 5, "d": 2}
        new = rewrite(code, assign)
        value = run_tac(new, {assign[n]: v for n, v in env.items()})["env"][assign[result]]
        print("k =", k, "spilled:", spilled, "result:", value)
