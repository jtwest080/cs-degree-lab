    code: |
      cyc = {0: [1], 1: [0], 2: []}
      new, freed = ref_count_collect(cyc, [])
      assert freed == [2] and new == {0: [1], 1: [0]}
      assert leaked_by_refcount(cyc, []) == [0, 1]
      assert leaked_by_refcount(cyc, [0]) == []
      assert leaked_by_refcount({0: [0]}, []) == [0]
      assert leaked_by_refcount({0: [1], 1: []}, []) == []
