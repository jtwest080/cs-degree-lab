  solution: |
    def copy_collect(heap, roots):
        """Cheney's copying collector. Copy the reachable objects into a fresh 'to-space' numbered 0, 1, 2, ... in the order they are copied: first copy each root's object in order of
        `roots` (an object already copied is not copied again), then SCAN the copied objects in order of their new id: for each reference in a scanned object, copy the target if it has not been copied
        yet (in the order the references appear), and rewrite the reference to the new id. Return (new_heap, new_roots, forwarding): new_heap maps each new id to its list of new ids, new_roots is the
        root list in new ids (same order and repeats as `roots`), and forwarding maps old ids to new ids. ValueError('dangling reference ID') for an id not in the heap."""
        forwarding = {}
        order = []

        def copy(old):
            if old not in heap:
                raise ValueError("dangling reference %s" % (old,))
            if old not in forwarding:
                forwarding[old] = len(order)
                order.append(old)
            return forwarding[old]

        new_roots = [copy(r) for r in roots]
        new_heap = {}
        scan = 0
        while scan < len(order):
            new_heap[scan] = [copy(child) for child in heap[order[scan]]]
            scan += 1
        return new_heap, new_roots, forwarding


    def cheney_order(heap, roots):
        """The list of OLD ids in the order Cheney's algorithm copies them (the same order used for the new ids)."""
        _, _, forwarding = copy_collect(heap, roots)
        return sorted(forwarding, key=lambda old: forwarding[old])
  explanation: Copying collection costs time proportional to the live data only, and leaves memory perfectly compact.
- id: simulate
  title: 'Capstone: comparing collectors'
  difficulty: 5
  prompt: 'The starter has `mark_sweep`, `garbage`, `refcounts` and `ref_count_collect`. Write `run_ops(ops, mode)`, a simulation of a tiny program under a garbage-collection `mode`. The state is a heap (id to reference list), variables (name to object id) and a counter that gives new objects the ids `0, 1, 2, ...` in order. Operations: `("new", var)` allocates an object and stores it in `var` (rebinding `var` drops the old object from the variables); `("link", a, b)` appends a reference from the object in `a` to the object in `b`; `("unlink", a, b)` removes **one** reference (the first) from `a`''s object to `b`''s object; `("drop", var)` deletes the variable; `("collect",)` runs `mark_sweep` from the variables'' objects. Raise `ValueError("unknown variable X")` for a missing variable and `ValueError("no such link")` when `unlink` finds no reference. Mode `"tracing"`: objects are freed only by `("collect",)`. Mode `"refcount"`: after every operation **except** `collect` run `ref_count_collect` (a cascade) and ignore `("collect",)`. The roots given to the collectors are the variables'' object ids sorted by variable name. Return `{"live": sorted ids still in the heap, "freed": sorted ids freed so far, "garbage": sorted ids in the heap unreachable from the variables, "peak": the largest heap size seen after any operation (before the refcount cleanup of that operation)}`.'
  starter: |-
    def reachable(heap, roots):
        """The heap is a dict from object id to the list of object ids it points to; roots is a list of ids held by variables (it may repeat ids). Return the sorted list of ids
        reachable from the roots by following references (cycles are fine). ValueError('dangling reference ID') if a root or a reference names an id that is not a key of the heap."""
        seen = set()
        stack = list(roots)
        while stack:
            obj = stack.pop()
            if obj not in heap:
                raise ValueError("dangling reference %s" % (obj,))
            if obj in seen:
                continue
            seen.add(obj)
            stack.extend(heap[obj])
        return sorted(seen)


    def garbage(heap, roots):
        """Sorted ids that are in the heap but not reachable from the roots."""
        live = set(reachable(heap, roots))
        return sorted(o for o in heap if o not in live)


    def mark_sweep(heap, roots):
        """Mark-and-sweep collection. MARK everything reachable from the roots, then SWEEP away the rest. Return (new_heap, freed): new_heap is a NEW dict holding only the surviving objects
        (same ids, same reference lists), freed is the sorted list of removed ids. The input is not changed."""
        live = set(reachable(heap, roots))
        new_heap = {o: list(refs) for o, refs in heap.items() if o in live}
        freed = sorted(o for o in heap if o not in live)
        return new_heap, freed


    def heap_stats(heap, roots):
        """A dict {"objects": total, "live": reachable count, "garbage": the rest, "garbage_percent": 100 * garbage / objects rounded to 1 decimal (0.0 for an empty heap)}."""
        total = len(heap)
        live = len(reachable(heap, roots))
        g = total - live
        return {"objects": total, "live": live, "garbage": g, "garbage_percent": round(100 * g / total, 1) if total else 0.0}


    def refcounts(heap, roots):
        """A dict for EVERY object id in the heap giving its reference count: how many times it appears in other objects' reference lists (every entry counts, including duplicates
        and an object pointing to itself) plus how many times it appears in `roots`."""
        counts = {o: 0 for o in heap}
        for refs in heap.values():
            for r in refs:
                counts[r] += 1
        for r in roots:
            counts[r] += 1
        return counts


    def ref_count_collect(heap, roots):
        """Reference-counting collection: free every object whose count is 0; freeing an object removes its outgoing references, which lowers its children's counts and may free
        them too (a cascade). Return (new_heap, freed): the surviving objects as a new dict (same reference lists) and the sorted list of freed ids. Input is unchanged."""
        counts = refcounts(heap, roots)
        queue = sorted(o for o, c in counts.items() if c == 0)
        freed = set()
        while queue:
            obj = queue.pop()
            if obj in freed:
                continue
            freed.add(obj)
            for child in heap[obj]:
                counts[child] -= 1
                if counts[child] == 0:
                    queue.append(child)
        new_heap = {o: list(refs) for o, refs in heap.items() if o not in freed}
        return new_heap, sorted(freed)




    def run_ops(ops, mode):
        """Simulate a tiny program that allocates objects and keeps them in named variables, under a garbage-collection `mode`. The state: heap (id -> reference list), variables
        (name -> object id) and a counter that gives new objects the ids 0, 1, 2, ... in order. Operations: ("new", var) allocate an object and store it in var (rebinding var drops its old object from
        the variables); ("link", a, b) append a reference from the object in a to the object in b; ("unlink", a, b) remove ONE reference (the first) from a's object to b's object; ("drop", var) delete
        the variable; ("collect",) run mark_sweep from the variables' objects. ValueError('unknown variable X') for a variable that does not exist, ValueError('no such link') when unlink finds no reference.
        mode 'tracing': objects are only freed by ("collect",). mode 'refcount': after every operation EXCEPT collect run ref_count_collect (which cascades) and ignore ("collect",). The roots passed to
        the collectors are the variables' object ids sorted by variable name (repeats allowed). Return {"live": sorted ids still in the heap, "freed": sorted ids freed so far,
        "garbage": sorted ids in the heap that are unreachable from the variables, "peak": the largest heap size seen after any operation}."""
        pass
  tests:
  - name: simple programs
    code: |
      ops = [("new", "a"), ("new", "b"), ("link", "a", "b"), ("drop", "b"), ("drop", "a")]
      res = run_ops(ops, "tracing")
      assert res == {"live": [0, 1], "freed": [], "garbage": [0, 1], "peak": 2}
      res = run_ops(ops + [("collect",)], "tracing")
      assert res == {"live": [], "freed": [0, 1], "garbage": [], "peak": 2}
      res = run_ops(ops, "refcount")
      assert res == {"live": [], "freed": [0, 1], "garbage": [], "peak": 2}
      assert run_ops([], "tracing") == {"live": [], "freed": [], "garbage": [], "peak": 0}
      res = run_ops([("new", "a"), ("new", "a")], "refcount")
      assert res["freed"] == [0] and res["live"] == [1]
      res = run_ops([("new", "a"), ("new", "a")], "tracing")
      assert res["live"] == [0, 1] and res["garbage"] == [0]
  - name: cycles
    code: |
      ops = [("new", "a"), ("new", "b"), ("link", "a", "b"), ("link", "b", "a"), ("drop", "a"), ("drop", "b")]
      res = run_ops(ops, "refcount")
