exercises:
- id: marksweep
  title: Mark and sweep
  difficulty: 4
  prompt: 'A **heap** here is a dict from object id to the list of ids that object points to; `roots` is a list of ids held directly by variables (it may repeat). Write `reachable(heap, roots)`, the sorted list of ids reachable from the roots by following references (cycles are fine; raise `ValueError("dangling reference ID")` if a root or reference names an id that is not in the heap). Write `garbage(heap, roots)` (sorted ids in the heap that are not reachable). Write `mark_sweep(heap, roots)`: **mark** everything reachable, **sweep** away the rest, returning `(new_heap, freed)` where `new_heap` is a **new** dict of the survivors (same ids, same reference lists) and `freed` is the sorted list of removed ids; the input is not changed. Write `heap_stats(heap, roots)`: a dict `{"objects": total, "live": reachable count, "garbage": the rest, "garbage_percent": 100 * garbage / objects rounded to 1 decimal (0.0 for an empty heap)}`.'
  starter: |-
    def reachable(heap, roots):
        """The heap is a dict from object id to the list of object ids it points to; roots is a list of ids held by variables (it may repeat ids). Return the sorted list of ids
        reachable from the roots by following references (cycles are fine). ValueError('dangling reference ID') if a root or a reference names an id that is not a key of the heap."""
        pass


    def garbage(heap, roots):
        """Sorted ids that are in the heap but not reachable from the roots."""
        pass


    def mark_sweep(heap, roots):
        """Mark-and-sweep collection. MARK everything reachable from the roots, then SWEEP away the rest. Return (new_heap, freed): new_heap is a NEW dict holding only the surviving objects
        (same ids, same reference lists), freed is the sorted list of removed ids. The input is not changed."""
        pass


    def heap_stats(heap, roots):
        """A dict {"objects": total, "live": reachable count, "garbage": the rest, "garbage_percent": 100 * garbage / objects rounded to 1 decimal (0.0 for an empty heap)}."""
        pass
  tests:
  - name: reachability
    code: |
      heap = {0: [1, 2], 1: [3], 2: [], 3: [1], 4: [5], 5: [4], 6: []}
      assert reachable(heap, [0]) == [0, 1, 2, 3]
      assert reachable(heap, [4]) == [4, 5]
      assert reachable(heap, [0, 6, 0]) == [0, 1, 2, 3, 6]
      assert reachable(heap, []) == []
      assert garbage(heap, [0]) == [4, 5, 6]
      assert garbage(heap, [0, 4, 6]) == []
      assert reachable({0: [0]}, [0]) == [0]
      for bad_heap, bad_roots in (({0: [9]}, [0]), ({0: []}, [3])):
          try:
              reachable(bad_heap, bad_roots)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "dangling reference" in str(e)
  - name: sweeping
    code: |
      heap = {0: [1, 2], 1: [3], 2: [], 3: [1], 4: [5], 5: [4], 6: []}
      new, freed = mark_sweep(heap, [0])
      assert new == {0: [1, 2], 1: [3], 2: [], 3: [1]} and freed == [4, 5, 6]
      assert len(heap) == 7
      new["0"] = 1
      assert "0" not in heap
      new, freed = mark_sweep(heap, [])
      assert new == {} and freed == [0, 1, 2, 3, 4, 5, 6]
      new, freed = mark_sweep({}, [])
      assert new == {} and freed == []
      new, freed = mark_sweep({0: [1], 1: []}, [0])
      assert freed == [] and new == {0: [1], 1: []}
      copy_of = {0: [1], 1: []}
      new, _ = mark_sweep(copy_of, [0])
      new[0].append(7)
      assert copy_of[0] == [1]
  - name: statistics
    code: |
      heap = {0: [1, 2], 1: [3], 2: [], 3: [1], 4: [5], 5: [4], 6: []}
      assert heap_stats(heap, [0]) == {"objects": 7, "live": 4, "garbage": 3, "garbage_percent": 42.9}
      assert heap_stats(heap, [0, 4, 6]) == {"objects": 7, "live": 7, "garbage": 0, "garbage_percent": 0.0}
      assert heap_stats({}, []) == {"objects": 0, "live": 0, "garbage": 0, "garbage_percent": 0.0}
      assert heap_stats({0: []}, []) == {"objects": 1, "live": 0, "garbage": 1, "garbage_percent": 100.0}
  hints:
  - Follow references from the roots with a stack; remember the ones you have already seen so cycles end.
  solution: |
    def reachable(heap, roots):
        """The heap is a dict from object id to the list of object ids it points to; roots is a list of ids held by variables (it may repeat ids). Return the sorted list of ids
        reachable from the roots by following references (cycles are fine). ValueError('dangling reference ID') if a root or a reference names an id that is not a key of the heap."""
        seen = set()
        stack = list(roots)
        while stack:
            obj = stack.pop()
            if obj not in heap:
                raise ValueError("dangling reference %s" % (obj,))
            if obj in seen:
                continue
            seen.add(obj)
            stack.extend(heap[obj])
        return sorted(seen)


    def garbage(heap, roots):
        """Sorted ids that are in the heap but not reachable from the roots."""
        live = set(reachable(heap, roots))
        return sorted(o for o in heap if o not in live)


    def mark_sweep(heap, roots):
        """Mark-and-sweep collection. MARK everything reachable from the roots, then SWEEP away the rest. Return (new_heap, freed): new_heap is a NEW dict holding only the surviving objects
        (same ids, same reference lists), freed is the sorted list of removed ids. The input is not changed."""
        live = set(reachable(heap, roots))
        new_heap = {o: list(refs) for o, refs in heap.items() if o in live}
        freed = sorted(o for o in heap if o not in live)
        return new_heap, freed


    def heap_stats(heap, roots):
        """A dict {"objects": total, "live": reachable count, "garbage": the rest, "garbage_percent": 100 * garbage / objects rounded to 1 decimal (0.0 for an empty heap)}."""
        total = len(heap)
        live = len(reachable(heap, roots))
        g = total - live
        return {"objects": total, "live": live, "garbage": g, "garbage_percent": round(100 * g / total, 1) if total else 0.0}
  explanation: Mark-and-sweep treats memory as a graph and keeps whatever the program can still reach.
- id: refcount
  title: Reference counting and its blind spot
  difficulty: 5
  prompt: 'The starter has the tracing tools from the last exercise. **Reference counting** frees an object as soon as nothing refers to it. Write `refcounts(heap, roots)`, a dict for **every** object giving how many times it appears in other objects'' reference lists (every entry counts, including duplicates and an object pointing to itself) plus how many times it appears in `roots`. Write `ref_count_collect(heap, roots)`: free every object whose count is 0; freeing an object removes its outgoing references, which lowers its children''s counts and may free them too (a **cascade**). Return `(new_heap, freed)`: the surviving objects as a new dict (same reference lists) and the sorted list of freed ids; the input is unchanged. Write `leaked_by_refcount(heap, roots)`: sorted ids that are garbage (unreachable from the roots) but are **not** freed by reference counting, objects kept alive only by cycles.'
