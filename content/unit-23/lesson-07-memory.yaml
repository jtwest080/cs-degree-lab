id: u23-memory
title: Memory Management and Garbage Collection
minutes: 95
objective: Learn how programs get and give back memory. You will build a heap-as-graph model, then write a mark-and-sweep collector, reference counting (and see why cycles defeat it), a memory allocator with fragmentation, and Cheney's copying collector.
outcomes:
- Explain the stack, the heap and why memory must be reclaimed
- Write a mark-and-sweep collector
- Explain reference counting and its cycle problem
- Write an allocator with first-fit, best-fit and coalescing
- Explain copying and generational collection
sections:
- heading: The stack, the heap and manual memory
  body: |-
    Programs keep data in two places. The **stack** holds the local variables of each running function; memory is claimed when a function is called and released automatically when it returns, so it is fast and tidy, but a value cannot outlive the function that made it. The **heap** holds data whose lifetime is not tied to one function: lists that grow, objects handed from place to place. Someone must decide when heap memory is no longer needed and can be reused.

    In languages such as C that someone is **you**: you call `malloc` to get memory and `free` to give it back. It is fast and gives total control, and it is also the source of some of the most famous bugs and security holes in history. Forget to free and you have a **memory leak**: the program slowly eats all the memory. Free too early and you have a **dangling pointer**: code that still uses memory which now belongs to something else. Free twice and the allocator's records are corrupted. Languages such as Python, Java and JavaScript remove this burden with **automatic memory management**, also called **garbage collection** (GC). (Rust takes a third route: its compiler checks ownership rules so that memory is freed at the right moment without a collector running.)
- heading: 'Finding garbage: reachability and reference counting'
  body: |-
    How can a collector know that an object will never be used again? It cannot read the future, so it uses a safe approximation: an object is garbage if **no code can ever reach it**. Picture memory as a **graph**: each object is a node, each reference is an edge. The **roots** are the references held directly by running code (local variables, globals). An object is **live** if it is reachable from a root, and every unreachable object is garbage. This definition ignores whether the program *would* actually use a live object; that is undecidable, a cousin of the halting problem.

    **Tracing** collectors compute reachability directly. **Mark-and-sweep** has two phases: **mark** follows references from the roots (a graph search, with a visited set so cycles end) and flags everything it reaches; **sweep** walks the whole heap and frees whatever is not flagged. It handles cycles perfectly, but it typically must pause the program while it runs (a **stop-the-world** pause) and its sweep touches all memory, live or dead.

    **Reference counting** takes the opposite approach. Each object stores a count of the references pointing at it. When the count drops to zero, the object is freed immediately, which in turn lowers the counts of the objects it pointed to, possibly freeing them too (a **cascade**). It is simple, predictable, and reclaims memory right away, and CPython uses it. Its weakness is **cycles**: if A points to B and B points to A, each keeps the other's count at one forever, even if the rest of the program has long forgotten both. Such objects **leak**. Real systems add a backup tracing collector for cycles (CPython has one, in the `gc` module) or offer **weak references**, which do not count.
- heading: Allocation, fragmentation and copying
  body: |-
    Whoever frees memory also needs an **allocator** that finds space for new requests. A simple one keeps a list of free blocks. **First fit** takes the first block that is big enough; **best fit** takes the smallest sufficient one, hoping to preserve large blocks. A request usually leaves a remainder, which becomes a new free block; and when a block is freed it is **coalesced** (merged) with free neighbours, so free space does not shatter into useless crumbs. Even so, after many allocations and frees the free space is scattered in small pieces: this is **fragmentation**. A request for 50 cells can fail even though 70 are free, because no single piece is large enough.

    A **copying collector** attacks fragmentation and cost together. Memory is split into two halves. Allocation just bumps a pointer forward in the active half (very fast). When it fills, the collector copies every **live** object into the empty half, packed together, then swaps the halves. **Cheney's algorithm** does this with a queue and no recursion: copy the roots, then scan the copied objects in order; whenever a scanned object points to something not yet copied, copy that too and update the pointer. A **forwarding** table (or a marker left in the old copy) ensures each object is moved once. The result is perfectly compact memory, and the time spent is proportional to the *live* data, not the garbage. The price is that half the memory is idle at any moment.

    Finally, observation shows that **most objects die young**: temporary values vanish quickly, while a few survive for a long time. **Generational** collectors exploit this: new objects go in a small "young" area that is collected often and cheaply with a copying collector, and the survivors are promoted to an "old" area collected rarely. Java's and JavaScript's collectors work this way. Garbage collection is therefore not one algorithm but a family, a nice meeting of graphs (reachability), data structures (free lists) and engineering trade-offs (pauses, throughput, memory overhead).
examples:
- title: Tracing versus counting
  intro: A heap with garbage, including a cycle, collected by two strategies.
  code: |
    def reachable(heap, roots):
        """The heap is a dict from object id to the list of object ids it points to; roots is a list of ids held by variables (it may repeat ids). Return the sorted list of ids
        reachable from the roots by following references (cycles are fine). ValueError('dangling reference ID') if a root or a reference names an id that is not a key of the heap."""
        seen = set()
        stack = list(roots)
        while stack:
            obj = stack.pop()
            if obj not in heap:
                raise ValueError("dangling reference %s" % (obj,))
            if obj in seen:
                continue
            seen.add(obj)
            stack.extend(heap[obj])
        return sorted(seen)


    def garbage(heap, roots):
        """Sorted ids that are in the heap but not reachable from the roots."""
        live = set(reachable(heap, roots))
        return sorted(o for o in heap if o not in live)


    def mark_sweep(heap, roots):
        """Mark-and-sweep collection. MARK everything reachable from the roots, then SWEEP away the rest. Return (new_heap, freed): new_heap is a NEW dict holding only the surviving objects
        (same ids, same reference lists), freed is the sorted list of removed ids. The input is not changed."""
        live = set(reachable(heap, roots))
        new_heap = {o: list(refs) for o, refs in heap.items() if o in live}
        freed = sorted(o for o in heap if o not in live)
        return new_heap, freed


    def heap_stats(heap, roots):
        """A dict {"objects": total, "live": reachable count, "garbage": the rest, "garbage_percent": 100 * garbage / objects rounded to 1 decimal (0.0 for an empty heap)}."""
        total = len(heap)
        live = len(reachable(heap, roots))
        g = total - live
        return {"objects": total, "live": live, "garbage": g, "garbage_percent": round(100 * g / total, 1) if total else 0.0}


    def refcounts(heap, roots):
        """A dict for EVERY object id in the heap giving its reference count: how many times it appears in other objects' reference lists (every entry counts, including duplicates
        and an object pointing to itself) plus how many times it appears in `roots`."""
        counts = {o: 0 for o in heap}
        for refs in heap.values():
            for r in refs:
                counts[r] += 1
        for r in roots:
            counts[r] += 1
        return counts


    def ref_count_collect(heap, roots):
        """Reference-counting collection: free every object whose count is 0; freeing an object removes its outgoing references, which lowers its children's counts and may free
        them too (a cascade). Return (new_heap, freed): the surviving objects as a new dict (same reference lists) and the sorted list of freed ids. Input is unchanged."""
        counts = refcounts(heap, roots)
        queue = sorted(o for o, c in counts.items() if c == 0)
        freed = set()
        while queue:
            obj = queue.pop()
            if obj in freed:
                continue
            freed.add(obj)
            for child in heap[obj]:
                counts[child] -= 1
                if counts[child] == 0:
                    queue.append(child)
        new_heap = {o: list(refs) for o, refs in heap.items() if o not in freed}
        return new_heap, sorted(freed)


    def leaked_by_refcount(heap, roots):
        """Sorted ids that are garbage (unreachable from the roots) but are NOT freed by reference counting: objects kept alive only by cycles."""
        _, freed = ref_count_collect(heap, roots)
        return sorted(set(garbage(heap, roots)) - set(freed))

    heap = {0: [1, 2], 1: [3], 2: [], 3: [1], 4: [5], 5: [4], 6: [7], 7: []}
    roots = [0]
    print("stats:", heap_stats(heap, roots))
    print("reachable:", reachable(heap, roots))
    new_heap, freed = mark_sweep(heap, roots)
    print("mark-sweep frees:", freed)
    rc_heap, rc_freed = ref_count_collect(heap, roots)
    print("reference counting frees:", rc_freed)
    print("leaked by reference counting:", leaked_by_refcount(heap, roots))
  output: |
    stats: {'objects': 8, 'live': 4, 'garbage': 4, 'garbage_percent': 50.0}
    reachable: [0, 1, 2, 3]
    mark-sweep frees: [4, 5, 6, 7]
    reference counting frees: [6, 7]
    leaked by reference counting: [4, 5]
  lines:
  - line: 78
    note: Half of the eight objects are unreachable.
  - line: 84
    note: Reference counting cannot free a cycle.
- title: Fragmentation and copying
  intro: A first-fit and best-fit allocator that runs out of room, and Cheney copying.
  code: |
    def new_memory(size):
        """A memory of `size` cells: {"size": size, "blocks": [(start, length, name or None), ...]} where None marks a free block. It starts as one free block."""
        return {"size": size, "blocks": [(0, size, None)]}


    def malloc(mem, name, length, strategy="first"):
        """Allocate `length` cells for `name` and return the start address. Choose a free block that is large enough: strategy "first" takes the lowest-address one; "best" takes the
        smallest sufficient one (ties: lowest address). The allocation goes at the START of the chosen block and any remainder stays as a free block right after it. ValueError('bad size')
        if length <= 0, ValueError('duplicate name NAME') if the name is already allocated, ValueError('out of memory') if no free block fits. Modifies `mem`."""
        if length <= 0:
            raise ValueError("bad size")
        if any(b[2] == name for b in mem["blocks"]):
            raise ValueError("duplicate name " + name)
        candidates = [i for i, b in enumerate(mem["blocks"]) if b[2] is None and b[1] >= length]
        if not candidates:
            raise ValueError("out of memory")
        if strategy == "best":
            pick = min(candidates, key=lambda i: (mem["blocks"][i][1], mem["blocks"][i][0]))
        else:
            pick = candidates[0]
        start, size, _ = mem["blocks"][pick]
        pieces = [(start, length, name)]
        if size > length:
            pieces.append((start + length, size - length, None))
        mem["blocks"][pick:pick + 1] = pieces
        return start


    def free(mem, name):
        """Release the block owned by `name` and COALESCE: merge it with a free block just before it and/or just after it so the free space stays in as few pieces as possible.
        ValueError('unknown name NAME') if nothing is allocated under that name. Modifies `mem`."""
        blocks = mem["blocks"]
        index = next((i for i, b in enumerate(blocks) if b[2] == name), None)
        if index is None:
            raise ValueError("unknown name " + name)
        start, size, _ = blocks[index]
        blocks[index] = (start, size, None)
        if index + 1 < len(blocks) and blocks[index + 1][2] is None:
            nxt = blocks.pop(index + 1)
            blocks[index] = (start, size + nxt[1], None)
        if index > 0 and blocks[index - 1][2] is None:
            prev = blocks[index - 1]
            cur = blocks.pop(index)
            blocks[index - 1] = (prev[0], prev[1] + cur[1], None)


    def fragmentation(mem):
        """How scattered the free space is: 1 - (largest free block / total free cells), rounded to 3 decimals; 0.0 when there is no free space or only one free block."""
        free_sizes = [b[1] for b in mem["blocks"] if b[2] is None]
        if not free_sizes:
            return 0.0
        return round(1 - max(free_sizes) / sum(free_sizes), 3)


    def copy_collect(heap, roots):
        """Cheney's copying collector. Copy the reachable objects into a fresh 'to-space' numbered 0, 1, 2, ... in the order they are copied: first copy each root's object in order of
        `roots` (an object already copied is not copied again), then SCAN the copied objects in order of their new id: for each reference in a scanned object, copy the target if it has not been copied
        yet (in the order the references appear), and rewrite the reference to the new id. Return (new_heap, new_roots, forwarding): new_heap maps each new id to its list of new ids, new_roots is the
        root list in new ids (same order and repeats as `roots`), and forwarding maps old ids to new ids. ValueError('dangling reference ID') for an id not in the heap."""
        forwarding = {}
        order = []

        def copy(old):
            if old not in heap:
                raise ValueError("dangling reference %s" % (old,))
            if old not in forwarding:
                forwarding[old] = len(order)
                order.append(old)
            return forwarding[old]

        new_roots = [copy(r) for r in roots]
        new_heap = {}
        scan = 0
        while scan < len(order):
            new_heap[scan] = [copy(child) for child in heap[order[scan]]]
            scan += 1
        return new_heap, new_roots, forwarding


    def cheney_order(heap, roots):
        """The list of OLD ids in the order Cheney's algorithm copies them (the same order used for the new ids)."""
        _, _, forwarding = copy_collect(heap, roots)
        return sorted(forwarding, key=lambda old: forwarding[old])

    mem = new_memory(100)
    for name, size in (("A", 10), ("B", 20), ("C", 10), ("D", 8), ("E", 10)):
        malloc(mem, name, size)
    free(mem, "B")
    free(mem, "D")
    print("free blocks:", [(b[0], b[1]) for b in mem["blocks"] if b[2] is None])
    print("fragmentation:", fragmentation(mem))
    def copy_of(m):
        return {"size": m["size"], "blocks": list(m["blocks"])}
    print("first fit places a 6-cell request at", malloc(copy_of(mem), "F", 6))
    print("best fit places it at", malloc(copy_of(mem), "F", 6, "best"))
    print("a 50-cell request:", end=" ")
    try:
        malloc(mem, "big", 50)
    except ValueError as error:
        print(error, "(despite", sum(b[1] for b in mem["blocks"] if b[2] is None), "free cells)")
    heap = {10: [20, 30], 20: [10], 30: [], 40: [10], 50: [60], 60: []}
    new_heap, new_roots, forwarding = copy_collect(heap, [10])
    print("copied:", new_heap, "from old ids", cheney_order(heap, [10]))
  output: |
    free blocks: [(10, 20), (40, 8), (58, 42)]
    fragmentation: 0.4
    first fit places a 6-cell request at 10
    best fit places it at 40
    a 50-cell request: out of memory (despite 70 free cells)
    copied: {0: [1, 2], 1: [0], 2: []} from old ids [10, 20, 30]
  lines:
  - line: 91
    note: Scattered free space.
  - line: 94
    note: First fit takes the first big-enough hole.
  - line: 95
    note: Best fit takes the smallest big-enough hole.
  - line: 103
    note: Live objects end up in 0, 1, 2 with no gaps.
