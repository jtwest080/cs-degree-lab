  - Count references first, then free zero-count objects and repeat as children's counts drop.
  solution: |
    def reachable(heap, roots):
        """The heap is a dict from object id to the list of object ids it points to; roots is a list of ids held by variables (it may repeat ids). Return the sorted list of ids
        reachable from the roots by following references (cycles are fine). ValueError('dangling reference ID') if a root or a reference names an id that is not a key of the heap."""
        seen = set()
        stack = list(roots)
        while stack:
            obj = stack.pop()
            if obj not in heap:
                raise ValueError("dangling reference %s" % (obj,))
            if obj in seen:
                continue
            seen.add(obj)
            stack.extend(heap[obj])
        return sorted(seen)


    def garbage(heap, roots):
        """Sorted ids that are in the heap but not reachable from the roots."""
        live = set(reachable(heap, roots))
        return sorted(o for o in heap if o not in live)


    def mark_sweep(heap, roots):
        """Mark-and-sweep collection. MARK everything reachable from the roots, then SWEEP away the rest. Return (new_heap, freed): new_heap is a NEW dict holding only the surviving objects
        (same ids, same reference lists), freed is the sorted list of removed ids. The input is not changed."""
        live = set(reachable(heap, roots))
        new_heap = {o: list(refs) for o, refs in heap.items() if o in live}
        freed = sorted(o for o in heap if o not in live)
        return new_heap, freed


    def heap_stats(heap, roots):
        """A dict {"objects": total, "live": reachable count, "garbage": the rest, "garbage_percent": 100 * garbage / objects rounded to 1 decimal (0.0 for an empty heap)}."""
        total = len(heap)
        live = len(reachable(heap, roots))
        g = total - live
        return {"objects": total, "live": live, "garbage": g, "garbage_percent": round(100 * g / total, 1) if total else 0.0}


    def refcounts(heap, roots):
        """A dict for EVERY object id in the heap giving its reference count: how many times it appears in other objects' reference lists (every entry counts, including duplicates
        and an object pointing to itself) plus how many times it appears in `roots`."""
        counts = {o: 0 for o in heap}
        for refs in heap.values():
            for r in refs:
                counts[r] += 1
        for r in roots:
            counts[r] += 1
        return counts


    def ref_count_collect(heap, roots):
        """Reference-counting collection: free every object whose count is 0; freeing an object removes its outgoing references, which lowers its children's counts and may free
        them too (a cascade). Return (new_heap, freed): the surviving objects as a new dict (same reference lists) and the sorted list of freed ids. Input is unchanged."""
        counts = refcounts(heap, roots)
        queue = sorted(o for o, c in counts.items() if c == 0)
        freed = set()
        while queue:
            obj = queue.pop()
            if obj in freed:
                continue
            freed.add(obj)
            for child in heap[obj]:
                counts[child] -= 1
                if counts[child] == 0:
                    queue.append(child)
        new_heap = {o: list(refs) for o, refs in heap.items() if o not in freed}
        return new_heap, sorted(freed)


    def leaked_by_refcount(heap, roots):
        """Sorted ids that are garbage (unreachable from the roots) but are NOT freed by reference counting: objects kept alive only by cycles."""
        _, freed = ref_count_collect(heap, roots)
        return sorted(set(garbage(heap, roots)) - set(freed))
  explanation: Reference counting is simple and immediate, but cycles keep each other alive forever.
