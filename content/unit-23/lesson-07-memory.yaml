  tests:
  - name: counting
    code: |
      heap = {0: [1, 2], 1: [3], 2: [3], 3: []}
      assert refcounts(heap, []) == {0: 0, 1: 1, 2: 1, 3: 2}
      assert refcounts(heap, [0, 0]) == {0: 2, 1: 1, 2: 1, 3: 2}
      assert refcounts({0: [1, 1], 1: []}, []) == {0: 0, 1: 2}
      assert refcounts({0: [0]}, []) == {0: 1}
      assert refcounts({}, []) == {}
  - name: cascading frees
    code: |
      chain = {0: [1], 1: [2], 2: []}
      new, freed = ref_count_collect(chain, [])
      assert new == {} and freed == [0, 1, 2]
      new, freed = ref_count_collect(chain, [0])
      assert new == chain and freed == []
      new, freed = ref_count_collect(chain, [1])
      assert new == {1: [2], 2: []} and freed == [0]
      diamond = {0: [1, 2], 1: [3], 2: [3], 3: []}
      new, freed = ref_count_collect(diamond, [])
      assert freed == [0, 1, 2, 3] and new == {}
