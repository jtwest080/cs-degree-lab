      heap = {0: [1, 2], 1: [0], 2: [], 3: [3]}
      assert count_live(heap, [0]) == 3 and count_live(heap, [3]) == 1 and count_live(heap, []) == 0 and count_live(heap, [0, 3]) == 4
  solution: |
    def count_live(heap, roots):
        seen = set()
        stack = list(roots)
        while stack:
            obj = stack.pop()
            if obj not in seen:
                seen.add(obj)
                stack.extend(heap[obj])
        return len(seen)
