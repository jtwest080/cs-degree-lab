# Terms introduced in Unit 24 (Distributed Systems). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Distributed system
  definition: Many computers that work together by sending messages and appear to the user as one system.
  lesson: u24-time
- term: Network partition
  definition: A failure that splits a cluster into groups that cannot reach each other.
  lesson: u24-time
- term: Clock skew
  definition: The difference between the times shown by two clocks.
  lesson: u24-time
- term: Clock drift
  definition: The slow tendency of a clock to run faster or slower than true time.
  lesson: u24-time
- term: NTP
  definition: The Network Time Protocol, which keeps computer clocks close to the correct time.
  lesson: u24-time
- term: Happened-before
  definition: The ordering in which one event could have influenced another because of local order or a message.
  lesson: u24-time
- term: Concurrent events
  definition: Events where neither could have influenced the other.
  lesson: u24-time
- term: Logical clock
  definition: A counter that orders events without using real time.
  lesson: u24-time
- term: Lamport clock
  definition: A logical clock where each node increments a counter and takes the maximum of any counter it receives.
  lesson: u24-time
- term: Vector clock
  definition: A list of counters, one per node, that can tell whether two events are ordered or concurrent.
  lesson: u24-time
- term: Causal delivery
  definition: Delivering a message only after every message that could have caused it.
  lesson: u24-time
- term: Consistent cut
  definition: A snapshot of a distributed system that never contains a message receipt without its send.
  lesson: u24-time
- term: Partitioning
  definition: Splitting data across several machines so that each holds a part.
  lesson: u24-partitioning
- term: Sharding
  definition: Another word for partitioning data across machines.
  lesson: u24-partitioning
- term: Consistent hashing
  definition: A way of placing keys on machines so that adding or removing a machine moves only a small fraction of the keys.
  lesson: u24-partitioning
- term: Hash ring
  definition: A circle of hash values on which both keys and nodes are placed.
  lesson: u24-partitioning
- term: Virtual node
  definition: One of several positions on the ring that a single machine owns, which evens out the load.
  lesson: u24-partitioning
- term: Rendezvous hashing
  definition: A placement method where each key goes to the node with the highest score for that key.
  lesson: u24-partitioning
- term: Hot spot
  definition: A machine or key that receives far more traffic than others.
  lesson: u24-partitioning
- term: Rebalancing
  definition: Moving data between nodes after the cluster changes.
  lesson: u24-partitioning
- term: Replication
  definition: Keeping copies of the same data on several machines.
  lesson: u24-replication
- term: Replica
  definition: One copy of replicated data.
  lesson: u24-replication
- term: Quorum
  definition: The minimum number of replicas that must take part in an operation.
  lesson: u24-replication
- term: Read repair
  definition: Fixing stale replicas when a read discovers that they disagree.
  lesson: u24-replication
- term: Eventual consistency
  definition: A guarantee that if no new writes happen, all replicas will end up with the same value.
  lesson: u24-replication
- term: Last writer wins
  definition: A conflict rule that keeps the value with the latest timestamp and discards the others.
  lesson: u24-replication
- term: Conflict
  definition: Two updates to the same data that were made without knowing about each other.
  lesson: u24-replication
- term: CRDT
  definition: A data type designed so that replicas can be merged in any order and always agree.
  lesson: u24-replication
- term: G-counter
  definition: A counter that only grows, built from one count per node, merged by taking the maximum of each.
  lesson: u24-replication
- term: PN-counter
  definition: A counter that can go up and down, made of two grow-only counters.
  lesson: u24-replication
- term: Observed-remove set
  definition: A replicated set where removing an element only removes the additions that the remover had seen.
  lesson: u24-replication
- term: Replicated log
  definition: An ordered list of commands that every replica applies in the same order.
  lesson: u24-replication
- term: Commit index
  definition: The position in a log up to which entries are safely replicated.
  lesson: u24-replication
- term: Consensus
  definition: Getting several machines to agree on a single value even when some fail.
  lesson: u24-consensus
- term: Failure detector
  definition: A component that guesses which nodes have crashed.
  lesson: u24-consensus
- term: Heartbeat
  definition: A small regular message that says a node is still alive.
  lesson: u24-consensus
- term: Leader election
  definition: Choosing one node to coordinate the others.
  lesson: u24-consensus
- term: Bully algorithm
  definition: An election in which the highest-numbered live node becomes the leader.
  lesson: u24-consensus
- term: Paxos
  definition: A family of consensus protocols that uses numbered proposals and majorities.
  lesson: u24-consensus
- term: Proposer
  definition: A Paxos role that suggests a value.
  lesson: u24-consensus
- term: Acceptor
  definition: A Paxos role that votes on proposals and remembers its promises.
  lesson: u24-consensus
- term: Raft
  definition: A consensus protocol designed to be easy to understand, based on leaders, terms and a replicated log.
  lesson: u24-consensus
- term: Term
  definition: A numbered period of Raft during which at most one leader exists.
  lesson: u24-consensus
- term: Majority
  definition: More than half of the nodes.
  lesson: u24-consensus
- term: Split brain
  definition: A failure in which two parts of a cluster both believe they are in charge.
  lesson: u24-consensus
- term: Crash recovery
  definition: Restoring a consistent state after a machine fails.
  lesson: u24-transactions
- term: Checkpoint
  definition: A saved snapshot that lets a log be shortened.
  lesson: u24-transactions
- term: Atomic commit
  definition: Making a change across several machines happen on all of them or on none.
  lesson: u24-transactions
- term: Two-phase commit
  definition: A protocol where a coordinator asks all participants to prepare and then tells them all to commit or all to
    abort.
  lesson: u24-transactions
- term: Coordinator
  definition: The node that drives a distributed protocol such as a commit.
  lesson: u24-transactions
- term: Participant
  definition: A node that takes part in a protocol run by a coordinator.
  lesson: u24-transactions
- term: Saga
  definition: A long transaction made of local steps, each with a compensating action to undo it.
  lesson: u24-transactions
- term: Compensating action
  definition: A step that undoes the effect of an earlier step.
  lesson: u24-transactions
- term: Gossip protocol
  definition: A protocol in which nodes repeatedly share what they know with a few random peers.
  lesson: u24-gossip
- term: Fanout
  definition: The number of peers a node contacts in each gossip round.
  lesson: u24-gossip
- term: Epidemic protocol
  definition: Another name for gossip, because information spreads like an infection.
  lesson: u24-gossip
- term: Anti-entropy
  definition: Periodically comparing replicas and repairing any differences.
  lesson: u24-gossip
- term: Digest
  definition: A small summary of data, used to find out what differs.
  lesson: u24-gossip
- term: Merkle tree
  definition: A tree of hashes in which each parent hashes its children, so a root hash summarises all the data.
  lesson: u24-gossip
- term: Heartbeat counter
  definition: A number a node keeps increasing to show it is alive.
  lesson: u24-gossip
- term: Membership
  definition: The list of nodes currently in the cluster.
  lesson: u24-gossip
- term: SWIM
  definition: A membership protocol that uses random pings and indirect pings to detect failures.
  lesson: u24-gossip
- term: Retry
  definition: Sending a request again after a failure.
  lesson: u24-reliability
- term: Retry storm
  definition: A flood of retries that overloads a struggling service.
  lesson: u24-reliability
- term: Rate limiter
  definition: A mechanism that limits how many requests are accepted in a period.
  lesson: u24-reliability
- term: Burst
  definition: A short spike of requests.
  lesson: u24-reliability
- term: Cascading failure
  definition: A failure that spreads from one component to others that depend on it.
  lesson: u24-reliability
- term: Load balancer
  definition: A component that spreads requests across several servers.
  lesson: u24-reliability
- term: Least connections
  definition: Sending each request to the server with the fewest active requests.
  lesson: u24-reliability
- term: Power of two choices
  definition: Picking two random servers and using the less loaded one.
  lesson: u24-reliability
- term: CAP theorem
  definition: The rule that during a network partition a system must choose between consistency and availability.
  lesson: u24-reliability
- term: PACELC
  definition: An extension of CAP that adds a trade-off between latency and consistency when there is no partition.
  lesson: u24-reliability
