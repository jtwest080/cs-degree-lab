        must also be included. Processes missing from `cut` count as 0. ValueError('bad cut') if a count is negative or larger than the process has events."""
        pass


    def consistent_cuts(processes):
        """Every consistent cut, as a sorted list of tuples of counts in sorted process-name order (try every combination of counts)."""
        pass
  tests:
  - name: checking cuts
    code: |
      system = {"A": [("send", "m1"), ("local", "x")], "B": [("recv", "m1")]}
      assert is_consistent_cut(system, {"A": 1, "B": 1})
      assert is_consistent_cut(system, {"A": 0, "B": 0}) and is_consistent_cut(system, {"A": 2, "B": 1})
      assert not is_consistent_cut(system, {"A": 0, "B": 1})
      assert is_consistent_cut(system, {"A": 1}) and is_consistent_cut(system, {})
      for bad in ({"A": 3}, {"B": -1}):
          try:
              is_consistent_cut(system, bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad cut" in str(e)
  - name: all consistent cuts
    code: |
      system = {"A": [("send", "m1"), ("local", "x")], "B": [("recv", "m1")]}
      assert consistent_cuts(system) == [(0, 0), (1, 0), (1, 1), (2, 0), (2, 1)]
      assert consistent_cuts({"A": [("local", 1), ("local", 2)]}) == [(0,), (1,), (2,)]
      assert consistent_cuts({}) == [()]
      independent = {"A": [("local", 1)], "B": [("local", 1)]}
      assert len(consistent_cuts(independent)) == 4
  - name: two-way conversation
    code: |
      chat = {"A": [("send", "q"), ("recv", "r")], "B": [("recv", "q"), ("send", "r")]}
      cuts = consistent_cuts(chat)
      assert cuts == [(0, 0), (1, 0), (1, 1), (1, 2), (2, 2)]
      assert (2, 1) not in cuts and (0, 1) not in cuts and (0, 2) not in cuts
      assert is_consistent_cut(chat, {"A": 2, "B": 2}) and not is_consistent_cut(chat, {"A": 2, "B": 1})
  hints:
  - Index the sends first; then every received message in the cut needs its sender's event inside the cut.
  solution: |
    def is_consistent_cut(processes, cut):
        """A cut says how many events of each process are included: {process: count}. It is CONSISTENT if no message is received inside the cut but sent outside it: for every included recv, the matching send
        must also be included. Processes missing from `cut` count as 0. ValueError('bad cut') if a count is negative or larger than the process has events."""
        send_at = {}
        for p, events in processes.items():
            for i, ev in enumerate(events):
                if ev[0] == "send":
                    send_at[ev[1]] = (p, i)
        for p, events in processes.items():
            if not 0 <= cut.get(p, 0) <= len(events):
                raise ValueError("bad cut")
        for p, events in processes.items():
            for i in range(cut.get(p, 0)):
                ev = events[i]
                if ev[0] == "recv":
                    q, j = send_at[ev[1]]
                    if j >= cut.get(q, 0):
                        return False
        return True


    def consistent_cuts(processes):
        """Every consistent cut, as a sorted list of tuples of counts in sorted process-name order (try every combination of counts)."""
        names = sorted(processes)
        result = []

        def build(k, current):
            if k == len(names):
                if is_consistent_cut(processes, dict(zip(names, current))):
                    result.append(tuple(current))
                return
            for c in range(len(processes[names[k]]) + 1):
                build(k + 1, current + [c])

        build(0, [])
        return sorted(result)
  explanation: Consistent snapshots are how a distributed database can back itself up without freezing.
commonMistakes:
- title: Believing a smaller Lamport stamp means 'happened first'
  explanation: It only means it could have; concurrent events may have any stamps.
- title: Forgetting to add one after taking the maximum on a receive
  explanation: The receive itself is an event and must advance the clock.
- title: Trusting wall-clock time to order events across machines
  explanation: Clocks drift and are only approximately synchronized.
- title: Delivering a message as soon as it arrives
  explanation: It may depend on a message that has not arrived yet.
- title: Allowing a cut that contains a receive but not its send
  explanation: It shows an effect without its cause.
summary:
- A distributed system has delayed, lost or reordered messages, independent failures and no shared clock.
- Happened-before is the order given by cause and effect; other events are concurrent.
- Lamport clocks give a consistent total order but cannot detect concurrency.
- Vector clocks capture happened-before exactly.
- Causal delivery holds messages back until their dependencies arrive.
- Consistent cuts never include an effect without its cause.
