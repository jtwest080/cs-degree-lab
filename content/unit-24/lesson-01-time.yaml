    def schedule(processes):
        """`processes` maps a process name to its list of events: ("local", label), ("send", msg_id) or ("recv", msg_id). Return ONE valid order in which the whole system could have run,
        as a list of (process, index, event). Go in passes: in each pass visit the processes in sorted name order and run at most ONE event of each (its next one); a recv can only run
        after its message has been sent (by an earlier step). ValueError('duplicate message id X') if two sends use the same id, and ValueError('deadlock') if events remain but none can run (for example a recv
        whose message is never sent). Receiving the same message in several processes is allowed."""
        seen = set()
        for events in processes.values():
            for ev in events:
                if ev[0] == "send":
                    if ev[1] in seen:
                        raise ValueError("duplicate message id %s" % (ev[1],))
                    seen.add(ev[1])
        pos = {p: 0 for p in processes}
        sent = set()
        order = []
        remaining = sum(len(e) for e in processes.values())
        while remaining:
            progressed = False
            for p in sorted(processes):
                i = pos[p]
                if i >= len(processes[p]):
                    continue
                ev = processes[p][i]
                if ev[0] == "recv" and ev[1] not in sent:
                    continue
                if ev[0] == "send":
                    sent.add(ev[1])
                order.append((p, i, ev))
                pos[p] += 1
                remaining -= 1
                progressed = True
            if not progressed:
                raise ValueError("deadlock")
        return order


    def lamport_clocks(processes):
        """Run the system and give every event a Lamport timestamp. Each process starts at 0. A local event or a send adds 1 to the process's clock (a send stamps the message with the new value);
        a recv sets the clock to max(own clock, the message's stamp) + 1. Return {process: [timestamp of each event, in order]}."""
        clock = {p: 0 for p in processes}
        stamp = {}
        result = {p: [None] * len(events) for p, events in processes.items()}
        for p, i, ev in schedule(processes):
            if ev[0] == "recv":
                clock[p] = max(clock[p], stamp[ev[1]]) + 1
            else:
                clock[p] += 1
            if ev[0] == "send":
                stamp[ev[1]] = clock[p]
            result[p][i] = clock[p]
        return result


    def total_order(processes):
        """All events as a list of (timestamp, process, index), sorted by timestamp and then by process name, which breaks ties between concurrent events and gives every observer the
        same total order."""
        stamps = lamport_clocks(processes)
        return sorted((t, p, i) for p, ts in stamps.items() for i, t in enumerate(ts))


    def vector_clocks(processes):
        """Give every event a vector clock: a list with one counter per process, in sorted process-name order. Each process starts at all zeros. A local event or a send adds 1 to the
        process's OWN entry (a send stamps the message with a copy of the new vector); a recv first takes the entrywise maximum of its own vector and the message's vector, then adds 1 to its own entry.
        Return {process: [vector of each event, in order]} (lists of ints; do not share list objects between events). Use schedule."""
        names = sorted(processes)
        where = {p: k for k, p in enumerate(names)}
        clock = {p: [0] * len(names) for p in names}
        stamp = {}
        result = {p: [None] * len(events) for p, events in processes.items()}
        for p, i, ev in schedule(processes):
            v = clock[p]
            if ev[0] == "recv":
                v = [max(a, b) for a, b in zip(v, stamp[ev[1]])]
            v = list(v)
            v[where[p]] += 1
            clock[p] = v
            if ev[0] == "send":
                stamp[ev[1]] = list(v)
            result[p][i] = list(v)
        return result


    def compare(a, b):
        """Compare two vectors of the same length: 'equal' if they are identical, 'before' if every entry of a is <= the entry of b (and they differ), 'after' for the reverse, otherwise 'concurrent'."""
        if a == b:
            return "equal"
        if all(x <= y for x, y in zip(a, b)):
            return "before"
        if all(x >= y for x, y in zip(a, b)):
            return "after"
        return "concurrent"


    def happened_before(processes, a, b):
        """True if event a causally happened before event b; a and b are (process, index) pairs. (An event does not happen before itself.)"""
        vc = vector_clocks(processes)
        return compare(vc[a[0]][a[1]], vc[b[0]][b[1]]) == "before"


    def concurrent_pairs(processes):
        """Every pair of events that are concurrent (neither happened before the other), as a sorted list of ((p, i), (q, j)) with (p, i) < (q, j)."""
        vc = vector_clocks(processes)
        events = sorted((p, i) for p in processes for i in range(len(processes[p])))
        out = []
        for x in range(len(events)):
            for y in range(x + 1, len(events)):
                (p, i), (q, j) = events[x], events[y]
                if compare(vc[p][i], vc[q][j]) == "concurrent":
                    out.append(((p, i), (q, j)))
        return out
  explanation: Vector clocks capture exactly the happened-before relation, so they can tell concurrent events apart.
- id: sync
  title: Synchronizing physical clocks
  difficulty: 4
  prompt: 'Real clocks drift apart, so systems also **synchronize** them. Write `ntp_offset(t0, t1, t2, t3)` for one request and reply exchange in the style of Cristian''s algorithm and NTP: `t0` is the client clock when it sent the request, `t1` the server clock when it received it, `t2` the server clock when it replied, `t3` the client clock when the reply arrived. Return `(offset, delay)` where `offset = ((t1 - t0) + (t2 - t3)) / 2` is how far the **client** clock is behind the server, and `delay = (t3 - t0) - (t2 - t1)` is the time spent on the network. Write `best_offset(samples)` for a list of `(t0, t1, t2, t3)` tuples: return the `(offset, delay)` of the sample with the **smallest delay** (the first of equals), because the least delayed exchange is the most trustworthy; `ValueError("no samples")` for an empty list. Write `berkeley_adjust(clocks, master, max_diff)`, the **Berkeley algorithm**: `clocks` maps node names to readings (the master included). Compute each node''s difference from the master''s reading; ignore, for the average only, any node whose absolute difference exceeds `max_diff` (a faulty clock). The average difference is taken over the remaining nodes, the master (difference 0) among them. Return a dict giving **every** node the adjustment `average - its own difference`, rounded to 3 decimals, so that adding it to each clock makes them all equal.'
  starter: |-
    def ntp_offset(t0, t1, t2, t3):
        """Estimate a client's clock error from one request/response exchange (Cristian/NTP style). t0: client clock when it sent the request; t1: server clock when it received it;
        t2: server clock when it replied; t3: client clock when the reply arrived. Return (offset, delay): offset = ((t1 - t0) + (t2 - t3)) / 2 is how far the CLIENT clock is behind the server,
        and delay = (t3 - t0) - (t2 - t1) is the time spent on the network."""
        pass


    def best_offset(samples):
        """`samples` is a list of (t0, t1, t2, t3) tuples. Return the (offset, delay) of the sample with the SMALLEST delay (the first of equals): the least delayed exchange is the most trustworthy.
        ValueError('no samples') for an empty list."""
        pass


    def berkeley_adjust(clocks, master, max_diff):
        """Berkeley algorithm. `clocks` maps node names to their current clock readings (the master included). Compute each node's difference from the master's reading; ignore (for the average only) any node
        whose absolute difference is more than max_diff (a faulty clock). The average difference is taken over the remaining nodes, the master (difference 0) among them. Return a dict giving EVERY node
        the adjustment (average - its own difference) rounded to 3 decimals, so that adding it to the node's clock makes all the clocks equal."""
        pass
  tests:
  - name: one exchange
    code: |
      assert ntp_offset(100, 150, 152, 110) == (46.0, 8)
      assert ntp_offset(0, 5, 5, 10) == (0.0, 10)
      offset, delay = ntp_offset(1000, 990, 991, 1004)
      assert offset == -11.5 and delay == 3
  - name: choosing the best sample
    code: |
      samples = [(100, 150, 152, 110), (200, 251, 252, 203), (300, 352, 353, 330)]
      assert best_offset(samples) == (ntp_offset(200, 251, 252, 203))
      assert best_offset(samples)[1] == 2
      assert best_offset([(0, 1, 1, 2), (10, 11, 11, 12)]) == (0.0, 2) or best_offset([(0, 1, 1, 2), (10, 11, 11, 12)])[1] == 2
      assert best_offset([(0, 5, 6, 10)]) == ntp_offset(0, 5, 6, 10)
      try:
          best_offset([])
          raise AssertionError("accepted")
      except ValueError as e:
          assert "no samples" in str(e)
  - name: Berkeley algorithm
    code: |
      adj = berkeley_adjust({"m": 100, "a": 104, "b": 96, "c": 200}, "m", 10)
      assert adj == {"m": 0.0, "a": -4.0, "b": 4.0, "c": -100.0}
      adj = berkeley_adjust({"m": 100, "a": 106, "b": 100}, "m", 10)
      assert adj == {"m": 2.0, "a": -4.0, "b": 2.0}
      clocks = {"m": 100, "a": 106, "b": 100}
      fixed = {n: clocks[n] + adj[n] for n in clocks}
      assert len(set(fixed.values())) == 1 and fixed["m"] == 102
      assert berkeley_adjust({"solo": 50}, "solo", 5) == {"solo": 0.0}
      adj = berkeley_adjust({"m": 10, "a": 11, "b": 12, "c": 13}, "m", 5)
      assert adj == {"m": 1.5, "a": 0.5, "b": -0.5, "c": -1.5}
  hints:
  - Offset is half the sum of the two one-way differences.
  solution: |
    def ntp_offset(t0, t1, t2, t3):
        """Estimate a client's clock error from one request/response exchange (Cristian/NTP style). t0: client clock when it sent the request; t1: server clock when it received it;
        t2: server clock when it replied; t3: client clock when the reply arrived. Return (offset, delay): offset = ((t1 - t0) + (t2 - t3)) / 2 is how far the CLIENT clock is behind the server,
        and delay = (t3 - t0) - (t2 - t1) is the time spent on the network."""
        return ((t1 - t0) + (t2 - t3)) / 2, (t3 - t0) - (t2 - t1)


    def best_offset(samples):
        """`samples` is a list of (t0, t1, t2, t3) tuples. Return the (offset, delay) of the sample with the SMALLEST delay (the first of equals): the least delayed exchange is the most trustworthy.
        ValueError('no samples') for an empty list."""
        if not samples:
            raise ValueError("no samples")
        results = [ntp_offset(*s) for s in samples]
        return min(results, key=lambda r: r[1])


    def berkeley_adjust(clocks, master, max_diff):
        """Berkeley algorithm. `clocks` maps node names to their current clock readings (the master included). Compute each node's difference from the master's reading; ignore (for the average only) any node
        whose absolute difference is more than max_diff (a faulty clock). The average difference is taken over the remaining nodes, the master (difference 0) among them. Return a dict giving EVERY node
        the adjustment (average - its own difference) rounded to 3 decimals, so that adding it to the node's clock makes all the clocks equal."""
        diffs = {n: c - clocks[master] for n, c in clocks.items()}
        good = [d for n, d in diffs.items() if abs(d) <= max_diff]
        avg = sum(good) / len(good)
        return {n: round(avg - d, 3) for n, d in diffs.items()}
  explanation: Synchronizing physical clocks is always an estimate, limited by the unknown network delay.
- id: causal
  title: Causal delivery
  difficulty: 5
  prompt: Messages can arrive out of order, so a reply may reach a process before the message it answers. **Causal broadcast** fixes that with vector clocks and a **hold-back queue**. Write `causal_deliver(names, arrivals)` for ONE receiving process. `names` is the sorted list of process names; each arrival is `(sender, vector, payload)`, in the order messages reached us, where `vector` is the sender's vector clock when it sent. Keep a delivered vector `D`, all zeros at first. A message from sender `j` with vector `V` can be **delivered** when `V[j] == D[j] + 1` (it is the next message from `j`) **and** `V[k] <= D[k]` for every other `k` (everything it depends on was already delivered); delivering sets `D[j] = V[j]`. A message that cannot be delivered yet waits in the queue. After each arrival, repeatedly deliver any waiting message (scanning the queue in arrival order, restarting the scan after each delivery) until none can. Return `(delivered payloads in delivery order, payloads still waiting in arrival order)`.
  starter: |-
    def causal_deliver(names, arrivals):
        """Causal broadcast delivery at ONE process. `names` is the sorted list of process names; each arrival is (sender, vector, payload) in the order messages reached us, where the vector is the sender's
        vector clock at the time of sending. Keep a delivered vector D, all zeros at first. A message from sender j with vector V can be DELIVERED when V[j] == D[j] + 1 (it is the next message from j)
        and V[k] <= D[k] for every other k (we have already delivered everything it depends on); delivering sets D[j] = V[j]. A message that cannot be delivered yet waits in a hold-back queue.
        After each arrival, repeatedly deliver any waiting message (scanning the queue in arrival order) until none can be delivered. Return (delivered payloads in delivery order, payloads still waiting in arrival order)."""
        pass
  tests:
  - name: out of order arrival
    code: |
      names = ["A", "B", "C"]
      arrivals = [("B", [1, 1, 0], "reply"), ("A", [1, 0, 0], "question")]
      assert causal_deliver(names, arrivals) == (["question", "reply"], [])
      assert causal_deliver(names, []) == ([], [])
      assert causal_deliver(names, [("A", [1, 0, 0], "x")]) == (["x"], [])
  - name: missing messages
    code: |
      names = ["A", "B", "C"]
      arrivals = [("A", [3, 0, 0], "third"), ("A", [1, 0, 0], "first")]
      assert causal_deliver(names, arrivals) == (["first"], ["third"])
      arrivals = [("A", [3, 0, 0], "third"), ("A", [1, 0, 0], "first"), ("A", [2, 0, 0], "second")]
      assert causal_deliver(names, arrivals) == (["first", "second", "third"], [])
      arrivals = [("B", [2, 1, 0], "b1"), ("A", [1, 0, 0], "a1")]
      assert causal_deliver(names, arrivals) == (["a1"], ["b1"])
  - name: chains of dependencies
    code: |
      names = ["A", "B", "C"]
      arrivals = [("C", [1, 1, 1], "c1"), ("B", [1, 1, 0], "b1"), ("A", [1, 0, 0], "a1")]
      assert causal_deliver(names, arrivals) == (["a1", "b1", "c1"], [])
      arrivals = [("A", [1, 0, 0], "a1"), ("C", [0, 0, 1], "c1"), ("B", [0, 1, 0], "b1")]
      assert causal_deliver(names, arrivals) == (["a1", "c1", "b1"], [])
      arrivals = [("B", [0, 1, 0], "b1"), ("A", [2, 0, 0], "a2"), ("C", [1, 1, 1], "c1"), ("A", [1, 0, 0], "a1")]
      assert causal_deliver(names, arrivals) == (["b1", "a1", "a2", "c1"], [])
  - name: input is not changed
    code: |
      names = ["A", "B"]
      arrivals = [("B", [1, 1], "r"), ("A", [1, 0], "q")]
      copy = [(s, list(v), p) for s, v, p in arrivals]
      causal_deliver(names, arrivals)
      assert arrivals == copy
  hints:
  - Compare the message's vector with what you have delivered so far; keep waiting messages in a list and rescan it.
  solution: |
    def causal_deliver(names, arrivals):
        """Causal broadcast delivery at ONE process. `names` is the sorted list of process names; each arrival is (sender, vector, payload) in the order messages reached us, where the vector is the sender's
        vector clock at the time of sending. Keep a delivered vector D, all zeros at first. A message from sender j with vector V can be DELIVERED when V[j] == D[j] + 1 (it is the next message from j)
        and V[k] <= D[k] for every other k (we have already delivered everything it depends on); delivering sets D[j] = V[j]. A message that cannot be delivered yet waits in a hold-back queue.
        After each arrival, repeatedly deliver any waiting message (scanning the queue in arrival order) until none can be delivered. Return (delivered payloads in delivery order, payloads still waiting in arrival order)."""
        index = {n: k for k, n in enumerate(names)}
        delivered_vector = [0] * len(names)
        waiting = []
        delivered = []

        def ready(sender, vector):
            j = index[sender]
            if vector[j] != delivered_vector[j] + 1:
                return False
            return all(vector[k] <= delivered_vector[k] for k in range(len(names)) if k != j)

        for message in arrivals:
            waiting.append(message)
            progress = True
            while progress:
                progress = False
                for m in list(waiting):
                    if ready(m[0], m[1]):
                        waiting.remove(m)
                        delivered_vector[index[m[0]]] = m[1][index[m[0]]]
                        delivered.append(m[2])
                        progress = True
                        break
        return delivered, [m[2] for m in waiting]
  explanation: A hold-back queue lets a network that reorders messages still deliver them in causal order.
- id: cuts
  title: Consistent cuts and snapshots
  difficulty: 5
  prompt: 'A **snapshot** of a distributed system records every process at one moment of its own, and must be **consistent**. A **cut** says how many events of each process are included: `{process: count}` (processes missing count as 0). It is **consistent** if no message is received inside the cut but sent outside it: for every included `recv`, the matching `send` must also be included. Write `is_consistent_cut(processes, cut)` (`ValueError("bad cut")` if a count is negative or larger than the process''s number of events) and `consistent_cuts(processes)`, every consistent cut as a **sorted** list of tuples of counts in sorted process-name order (try every combination). Events use the same forms as before: `("local", label)`, `("send", msg_id)`, `("recv", msg_id)`. Every message id is sent exactly once.'
