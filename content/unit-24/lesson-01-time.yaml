    print("one exchange:", ntp_offset(100, 150, 152, 110))
    samples = [(100, 150, 152, 110), (200, 251, 252, 203), (300, 352, 353, 330)]
    print("best of three:", best_offset(samples))
    adjust = berkeley_adjust({"m": 100, "a": 106, "b": 100, "faulty": 190}, "m", 10)
    print("berkeley:", adjust)
    arrivals = [("B", [1, 1, 0], "reply"), ("A", [1, 0, 0], "question")]
