  tests:
  - name: scheduling
    code: |
      system = {"A": [("local", "a1"), ("send", "m1"), ("recv", "m2")], "B": [("recv", "m1"), ("send", "m2")]}
      order = schedule(system)
      assert [(p, i) for p, i, e in order] == [("A", 0), ("B", 0)] or len(order) == 5
      assert len(order) == 5
      assert [(p, i) for p, i, e in order] == [("A", 0), ("A", 1), ("B", 0), ("B", 1), ("A", 2)] or [(p, i) for p, i, e in order].index(("B", 0)) > [(p, i) for p, i, e in order].index(("A", 1))
      pos = {(p, i): k for k, (p, i, e) in enumerate(order)}
      assert pos[("A", 1)] < pos[("B", 0)] < pos[("B", 1)] < pos[("A", 2)]
      assert order[0] == ("A", 0, ("local", "a1"))
      assert schedule({}) == []
      for bad, msg in (({"A": [("recv", "x")]}, "deadlock"), ({"A": [("send", "m")], "B": [("send", "m")]}, "duplicate message id m"),
                       ({"A": [("recv", "b")], "B": [("recv", "a")]}, "deadlock")):
          try:
              schedule(bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
      assert len(schedule({"A": [("send", "m")], "B": [("recv", "m")], "C": [("recv", "m")]})) == 3
  - name: lamport timestamps
    code: |
      system = {"A": [("local", "a1"), ("send", "m1"), ("recv", "m2")], "B": [("recv", "m1"), ("send", "m2")]}
      assert lamport_clocks(system) == {"A": [1, 2, 5], "B": [3, 4]}
      assert lamport_clocks({"A": [("local", "x"), ("local", "y")], "B": [("local", "z")]}) == {"A": [1, 2], "B": [1]}
      assert lamport_clocks({}) == {}
      busy = {"A": [("local", 1), ("local", 2), ("local", 3), ("send", "m")], "B": [("local", 1), ("recv", "m")]}
      assert lamport_clocks(busy) == {"A": [1, 2, 3, 4], "B": [1, 5]}
      for sys_ in (system, busy):
          ts = lamport_clocks(sys_)
          for p, events in sys_.items():
              assert all(a < b for a, b in zip(ts[p], ts[p][1:]))
  - name: sends come before receives
    code: |
      system = {"A": [("send", "x"), ("recv", "y"), ("send", "z")], "B": [("recv", "x"), ("send", "y"), ("recv", "z")], "C": [("recv", "x"), ("recv", "z")]}
      ts = lamport_clocks(system)
      assert ts["A"] == [1, 4, 5] and ts["B"] == [2, 3, 6] and ts["C"] == [2, 6]
      assert ts["A"][0] < ts["B"][0] and ts["B"][1] < ts["A"][1] and ts["A"][2] < ts["B"][2] and ts["A"][0] < ts["C"][0]
  - name: a total order
    code: |
      system = {"A": [("local", "a1"), ("send", "m1"), ("recv", "m2")], "B": [("recv", "m1"), ("send", "m2")], "C": [("local", "c1")]}
      assert total_order(system) == [(1, "A", 0), (1, "C", 0), (2, "A", 1), (3, "B", 0), (4, "B", 1), (5, "A", 2)]
      assert total_order({}) == []
      order = total_order({"X": [("local", 1)], "Y": [("local", 1)], "Z": [("local", 1)]})
      assert [p for t, p, i in order] == ["X", "Y", "Z"]
  hints:
  - A recv takes the larger of its own clock and the message's stamp, then adds one.
  solution: |
    def schedule(processes):
        """`processes` maps a process name to its list of events: ("local", label), ("send", msg_id) or ("recv", msg_id). Return ONE valid order in which the whole system could have run,
        as a list of (process, index, event). Go in passes: in each pass visit the processes in sorted name order and run at most ONE event of each (its next one); a recv can only run
        after its message has been sent (by an earlier step). ValueError('duplicate message id X') if two sends use the same id, and ValueError('deadlock') if events remain but none can run (for example a recv
        whose message is never sent). Receiving the same message in several processes is allowed."""
        seen = set()
        for events in processes.values():
            for ev in events:
                if ev[0] == "send":
                    if ev[1] in seen:
                        raise ValueError("duplicate message id %s" % (ev[1],))
                    seen.add(ev[1])
        pos = {p: 0 for p in processes}
        sent = set()
        order = []
        remaining = sum(len(e) for e in processes.values())
        while remaining:
            progressed = False
            for p in sorted(processes):
                i = pos[p]
                if i >= len(processes[p]):
                    continue
                ev = processes[p][i]
                if ev[0] == "recv" and ev[1] not in sent:
                    continue
                if ev[0] == "send":
                    sent.add(ev[1])
                order.append((p, i, ev))
                pos[p] += 1
                remaining -= 1
                progressed = True
            if not progressed:
                raise ValueError("deadlock")
        return order


    def lamport_clocks(processes):
        """Run the system and give every event a Lamport timestamp. Each process starts at 0. A local event or a send adds 1 to the process's clock (a send stamps the message with the new value);
        a recv sets the clock to max(own clock, the message's stamp) + 1. Return {process: [timestamp of each event, in order]}."""
        clock = {p: 0 for p in processes}
        stamp = {}
        result = {p: [None] * len(events) for p, events in processes.items()}
        for p, i, ev in schedule(processes):
            if ev[0] == "recv":
                clock[p] = max(clock[p], stamp[ev[1]]) + 1
            else:
                clock[p] += 1
            if ev[0] == "send":
                stamp[ev[1]] = clock[p]
            result[p][i] = clock[p]
        return result


    def total_order(processes):
        """All events as a list of (timestamp, process, index), sorted by timestamp and then by process name, which breaks ties between concurrent events and gives every observer the
        same total order."""
        stamps = lamport_clocks(processes)
        return sorted((t, p, i) for p, ts in stamps.items() for i, t in enumerate(ts))
  explanation: Lamport clocks give every event a number consistent with cause and effect, although a bigger number does not prove an event happened later.
