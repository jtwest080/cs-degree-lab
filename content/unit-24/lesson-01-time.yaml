id: u24-time
title: Time, Clocks and Ordering
minutes: 95
objective: 'Learn the first big idea of distributed systems: there is no shared clock, so order must come from cause and effect. You will build Lamport clocks, vector clocks, clock synchronization, causal message delivery and consistent snapshots.'
outcomes:
- Explain why distributed systems cannot rely on a single clock
- Define the happened-before relation
- Implement Lamport and vector clocks
- Detect concurrent events
- Explain clock synchronization and consistent cuts
sections:
- heading: Why distributed systems are hard
  body: |-
    A **distributed system** is a group of computers that cooperate by sending messages to each other. Almost everything you use online is one: a search engine, a bank, a game server. They exist for good reasons. One machine can only hold so much data and handle so many users, and any single machine can break. A group of machines can be bigger and can keep working when some of them fail.

    But a group of machines is not just a bigger machine. Three facts change everything. First, machines talk through a **network**, which delivers messages **late, out of order, duplicated or not at all**. Second, **parts fail independently**: one machine can crash while the others carry on, and often you cannot tell a crashed machine from a slow one. Third, **there is no shared clock**. Every machine has its own clock, and they drift apart by tiny amounts that add up. So when two machines disagree about which of two things happened first, there is no single watch to settle it. This whole unit is about living with those three facts.
- heading: Happened-before and Lamport clocks
  body: |-
    If we cannot trust clock readings, what can we trust? **Cause and effect.** Leslie Lamport defined the **happened-before** relation, written A → B: it holds if A and B are in the same process and A came first, or A is the sending of a message and B is its receiving, or there is a chain of such steps (A → C and C → B). If neither A → B nor B → A, the events are **concurrent**: they could not have influenced each other, so there is no meaningful "first".

    A **Lamport clock** is a counter in every process that respects this relation. The rules: add one for every local event and every send, and stamp the message with the new value; when you **receive** a message, set your counter to the larger of your own value and the message's stamp, then add one. The guarantee is: **if A → B then the stamp of A is smaller than the stamp of B.** The opposite does not hold: a smaller stamp does not prove cause. Break ties between equal stamps by process name, and you get a **total order** that every machine computes identically, which is useful for things such as ordering requests in a shared queue.
- heading: Vector clocks, causal delivery and snapshots
  body: |-
    To detect concurrency exactly, give every process a **vector clock**: a list with one counter per process. A process increments its own entry for each event; when it receives a message it first takes the **entrywise maximum** with the message's vector, then increments its own entry. Compare two vectors entry by entry: if every entry of one is less than or equal to the other's, the first event happened **before** the second; if some entries go each way, the events are **concurrent**. This is precisely the happened-before relation. The price is a vector as long as the number of processes.

    Vectors let us repair the network's disorder. In **causal broadcast**, a process holds back each arriving message until it has delivered everything the message depends on: the next message from that sender, and every message the sender had seen. Held-back messages wait in a **hold-back queue**, so an answer is never shown before its question, which is exactly what a chat or comment system wants.

    A **snapshot** records the state of the whole system. A **cut** chooses a prefix of each process's events. A cut is **consistent** if it never includes a message's receipt without its send, because such a snapshot would show an effect without a cause. (The famous Chandy-Lamport algorithm builds a consistent snapshot of a running system without stopping it.)

    Physical clocks still matter for timeouts and logs, so they are **synchronized**. **Cristian's algorithm** and **NTP** ask a time server and estimate the clock's error: of the round trip, half is assumed to be spent each way, so the offset is estimated as the average of the two one-way differences, and the exchange with the smallest delay is the most trustworthy. The **Berkeley algorithm** has no accurate server; a master collects everyone's clock, ignores wild outliers, averages the rest and tells each machine how much to adjust. Even so, clocks are only synchronized to within some error, which is why careful systems prefer logical clocks for ordering.
examples:
- title: Logical clocks
  intro: Lamport and vector clocks on three processes that exchange two messages.
  code: |
    def schedule(processes):
        """`processes` maps a process name to its list of events: ("local", label), ("send", msg_id) or ("recv", msg_id). Return ONE valid order in which the whole system could have run,
        as a list of (process, index, event). Go in passes: in each pass visit the processes in sorted name order and run at most ONE event of each (its next one); a recv can only run
        after its message has been sent (by an earlier step). ValueError('duplicate message id X') if two sends use the same id, and ValueError('deadlock') if events remain but none can run (for example a recv
        whose message is never sent). Receiving the same message in several processes is allowed."""
        seen = set()
        for events in processes.values():
            for ev in events:
                if ev[0] == "send":
                    if ev[1] in seen:
                        raise ValueError("duplicate message id %s" % (ev[1],))
                    seen.add(ev[1])
        pos = {p: 0 for p in processes}
        sent = set()
        order = []
        remaining = sum(len(e) for e in processes.values())
        while remaining:
            progressed = False
            for p in sorted(processes):
                i = pos[p]
                if i >= len(processes[p]):
                    continue
                ev = processes[p][i]
                if ev[0] == "recv" and ev[1] not in sent:
                    continue
                if ev[0] == "send":
                    sent.add(ev[1])
                order.append((p, i, ev))
                pos[p] += 1
                remaining -= 1
                progressed = True
            if not progressed:
                raise ValueError("deadlock")
        return order


    def lamport_clocks(processes):
        """Run the system and give every event a Lamport timestamp. Each process starts at 0. A local event or a send adds 1 to the process's clock (a send stamps the message with the new value);
        a recv sets the clock to max(own clock, the message's stamp) + 1. Return {process: [timestamp of each event, in order]}."""
        clock = {p: 0 for p in processes}
        stamp = {}
        result = {p: [None] * len(events) for p, events in processes.items()}
        for p, i, ev in schedule(processes):
            if ev[0] == "recv":
                clock[p] = max(clock[p], stamp[ev[1]]) + 1
            else:
                clock[p] += 1
            if ev[0] == "send":
                stamp[ev[1]] = clock[p]
            result[p][i] = clock[p]
        return result


    def total_order(processes):
        """All events as a list of (timestamp, process, index), sorted by timestamp and then by process name, which breaks ties between concurrent events and gives every observer the
        same total order."""
        stamps = lamport_clocks(processes)
        return sorted((t, p, i) for p, ts in stamps.items() for i, t in enumerate(ts))


    def vector_clocks(processes):
        """Give every event a vector clock: a list with one counter per process, in sorted process-name order. Each process starts at all zeros. A local event or a send adds 1 to the
        process's OWN entry (a send stamps the message with a copy of the new vector); a recv first takes the entrywise maximum of its own vector and the message's vector, then adds 1 to its own entry.
        Return {process: [vector of each event, in order]} (lists of ints; do not share list objects between events). Use schedule."""
        names = sorted(processes)
        where = {p: k for k, p in enumerate(names)}
        clock = {p: [0] * len(names) for p in names}
        stamp = {}
        result = {p: [None] * len(events) for p, events in processes.items()}
        for p, i, ev in schedule(processes):
            v = clock[p]
            if ev[0] == "recv":
                v = [max(a, b) for a, b in zip(v, stamp[ev[1]])]
            v = list(v)
            v[where[p]] += 1
            clock[p] = v
            if ev[0] == "send":
                stamp[ev[1]] = list(v)
            result[p][i] = list(v)
        return result


    def compare(a, b):
        """Compare two vectors of the same length: 'equal' if they are identical, 'before' if every entry of a is <= the entry of b (and they differ), 'after' for the reverse, otherwise 'concurrent'."""
        if a == b:
            return "equal"
        if all(x <= y for x, y in zip(a, b)):
            return "before"
        if all(x >= y for x, y in zip(a, b)):
            return "after"
        return "concurrent"


    def happened_before(processes, a, b):
        """True if event a causally happened before event b; a and b are (process, index) pairs. (An event does not happen before itself.)"""
        vc = vector_clocks(processes)
        return compare(vc[a[0]][a[1]], vc[b[0]][b[1]]) == "before"


    def concurrent_pairs(processes):
        """Every pair of events that are concurrent (neither happened before the other), as a sorted list of ((p, i), (q, j)) with (p, i) < (q, j)."""
        vc = vector_clocks(processes)
        events = sorted((p, i) for p in processes for i in range(len(processes[p])))
        out = []
        for x in range(len(events)):
            for y in range(x + 1, len(events)):
                (p, i), (q, j) = events[x], events[y]
                if compare(vc[p][i], vc[q][j]) == "concurrent":
                    out.append(((p, i), (q, j)))
        return out


    def ntp_offset(t0, t1, t2, t3):
        """Estimate a client's clock error from one request/response exchange (Cristian/NTP style). t0: client clock when it sent the request; t1: server clock when it received it;
        t2: server clock when it replied; t3: client clock when the reply arrived. Return (offset, delay): offset = ((t1 - t0) + (t2 - t3)) / 2 is how far the CLIENT clock is behind the server,
        and delay = (t3 - t0) - (t2 - t1) is the time spent on the network."""
        return ((t1 - t0) + (t2 - t3)) / 2, (t3 - t0) - (t2 - t1)


    def best_offset(samples):
        """`samples` is a list of (t0, t1, t2, t3) tuples. Return the (offset, delay) of the sample with the SMALLEST delay (the first of equals): the least delayed exchange is the most trustworthy.
        ValueError('no samples') for an empty list."""
        if not samples:
            raise ValueError("no samples")
        results = [ntp_offset(*s) for s in samples]
        return min(results, key=lambda r: r[1])


    def berkeley_adjust(clocks, master, max_diff):
        """Berkeley algorithm. `clocks` maps node names to their current clock readings (the master included). Compute each node's difference from the master's reading; ignore (for the average only) any node
        whose absolute difference is more than max_diff (a faulty clock). The average difference is taken over the remaining nodes, the master (difference 0) among them. Return a dict giving EVERY node
        the adjustment (average - its own difference) rounded to 3 decimals, so that adding it to the node's clock makes all the clocks equal."""
        diffs = {n: c - clocks[master] for n, c in clocks.items()}
        good = [d for n, d in diffs.items() if abs(d) <= max_diff]
        avg = sum(good) / len(good)
        return {n: round(avg - d, 3) for n, d in diffs.items()}


    def causal_deliver(names, arrivals):
        """Causal broadcast delivery at ONE process. `names` is the sorted list of process names; each arrival is (sender, vector, payload) in the order messages reached us, where the vector is the sender's
        vector clock at the time of sending. Keep a delivered vector D, all zeros at first. A message from sender j with vector V can be DELIVERED when V[j] == D[j] + 1 (it is the next message from j)
        and V[k] <= D[k] for every other k (we have already delivered everything it depends on); delivering sets D[j] = V[j]. A message that cannot be delivered yet waits in a hold-back queue.
        After each arrival, repeatedly deliver any waiting message (scanning the queue in arrival order) until none can be delivered. Return (delivered payloads in delivery order, payloads still waiting in arrival order)."""
        index = {n: k for k, n in enumerate(names)}
        delivered_vector = [0] * len(names)
        waiting = []
        delivered = []

        def ready(sender, vector):
            j = index[sender]
            if vector[j] != delivered_vector[j] + 1:
                return False
            return all(vector[k] <= delivered_vector[k] for k in range(len(names)) if k != j)

        for message in arrivals:
            waiting.append(message)
            progress = True
            while progress:
                progress = False
                for m in list(waiting):
                    if ready(m[0], m[1]):
                        waiting.remove(m)
                        delivered_vector[index[m[0]]] = m[1][index[m[0]]]
                        delivered.append(m[2])
                        progress = True
                        break
        return delivered, [m[2] for m in waiting]


    def is_consistent_cut(processes, cut):
        """A cut says how many events of each process are included: {process: count}. It is CONSISTENT if no message is received inside the cut but sent outside it: for every included recv, the matching send
        must also be included. Processes missing from `cut` count as 0. ValueError('bad cut') if a count is negative or larger than the process has events."""
        send_at = {}
        for p, events in processes.items():
            for i, ev in enumerate(events):
                if ev[0] == "send":
                    send_at[ev[1]] = (p, i)
        for p, events in processes.items():
            if not 0 <= cut.get(p, 0) <= len(events):
                raise ValueError("bad cut")
        for p, events in processes.items():
            for i in range(cut.get(p, 0)):
                ev = events[i]
                if ev[0] == "recv":
                    q, j = send_at[ev[1]]
                    if j >= cut.get(q, 0):
                        return False
        return True


    def consistent_cuts(processes):
        """Every consistent cut, as a sorted list of tuples of counts in sorted process-name order (try every combination of counts)."""
        names = sorted(processes)
        result = []

        def build(k, current):
            if k == len(names):
                if is_consistent_cut(processes, dict(zip(names, current))):
                    result.append(tuple(current))
                return
            for c in range(len(processes[names[k]]) + 1):
                build(k + 1, current + [c])

        build(0, [])
        return sorted(result)

    system = {"A": [("local", "a1"), ("send", "m1"), ("recv", "m2")], "B": [("recv", "m1"), ("send", "m2")], "C": [("local", "c1")]}
    print("lamport:", lamport_clocks(system))
    vc = vector_clocks(system)
    print("vectors:", vc)
    print("A's send happened before B's reply:", happened_before(system, ("A", 1), ("B", 1)))
    print("concurrent with C's event:", [pair[0] for pair in concurrent_pairs(system)])
    print("consistent snapshots:", len(consistent_cuts(system)))
  output: |
    lamport: {'A': [1, 2, 5], 'B': [3, 4], 'C': [1]}
    vectors: {'A': [[1, 0, 0], [2, 0, 0], [3, 2, 0]], 'B': [[2, 1, 0], [2, 2, 0]], 'C': [[0, 0, 1]]}
    A's send happened before B's reply: True
    concurrent with C's event: [('A', 0), ('A', 1), ('A', 2), ('B', 0), ('B', 1)]
    consistent snapshots: 12
  lines:
  - line: 208
    note: Stamps rise along every chain of cause and effect.
  - line: 210
    note: One counter per process.
  - line: 212
    note: C never talked to anyone, so its event is concurrent with all of theirs.
