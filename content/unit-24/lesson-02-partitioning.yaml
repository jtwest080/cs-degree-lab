    def stable_hash(text):
        """A hash of a string that is the same on every run and every machine (Python's own hash is randomized): FNV-1a over the UTF-8 bytes, followed by a finishing mix. Returns an int in [0, 2**32)."""
        h = 2166136261
        for b in text.encode():
            h ^= b
            h = (h * 16777619) & 0xFFFFFFFF
        h ^= h >> 16
        h = (h * 0x85ebca6b) & 0xFFFFFFFF
        h ^= h >> 13
        h = (h * 0xc2b2ae35) & 0xFFFFFFFF
        h ^= h >> 16
        return h


    import bisect


    def build_ring(nodes, vnodes):
        """A consistent-hashing ring: a sorted list of (hash, node) points. Every node gets `vnodes` virtual nodes, the points stable_hash('NODE#I') for I = 0 .. vnodes - 1."""
        ring = [(stable_hash("%s#%d" % (n, i)), n) for n in nodes for i in range(vnodes)]
        ring.sort()
        return ring


    def lookup_hash(ring, h):
        """The node owning hash position h: the first ring point whose hash is >= h, wrapping around to the first point if h is beyond the last. ValueError('empty ring') for an empty ring."""
        if not ring:
            raise ValueError("empty ring")
        i = bisect.bisect_left(ring, (h, ""))
        return ring[i % len(ring)][1]


    def lookup(ring, key):
        """The node that owns a key: lookup_hash of stable_hash(key)."""
        return lookup_hash(ring, stable_hash(key))


    def assign(ring, keys):
        """A dict from EVERY node on the ring (even one that gets nothing) to the sorted list of keys it owns."""
        result = {n: [] for _, n in ring}
        for key in keys:
            result[lookup(ring, key)].append(key)
        return {n: sorted(ks) for n, ks in result.items()}


    def mod_assign(keys, nodes):
        """The naive scheme: a dict key -> the node at position stable_hash(key) % len(nodes) in the SORTED list of nodes."""
        ordered = sorted(nodes)
        return {k: ordered[stable_hash(k) % len(ordered)] for k in keys}


    def moved_keys(keys, before, after):
        """The sorted keys whose owner differs between two rings (use lookup)."""
        return sorted(k for k in keys if lookup(before, k) != lookup(after, k))


    def rebalance_plan(before, after, keys):
        """What must be copied when the ring changes: a dict {(old_owner, new_owner): sorted list of keys} covering only keys whose owner changes."""
        plan = {}
        for k in keys:
            old, new = lookup(before, k), lookup(after, k)
            if old != new:
                plan.setdefault((old, new), []).append(k)
        return {pair: sorted(ks) for pair, ks in plan.items()}
  explanation: Consistent hashing was invented precisely so that adding a cache server did not wipe the cache.
