  tests:
  - name: the naive scheme
    code: |
      keys = ["key%d" % i for i in range(200)]
      four = mod_assign(keys, ["d", "c", "b", "a"])
      assert set(four.values()) == {"a", "b", "c", "d"} and len(four) == 200
      assert four["key7"] == ["a", "b", "c", "d"][stable_hash("key7") % 4]
      five = mod_assign(keys, ["a", "b", "c", "d", "e"])
      changed = sum(four[k] != five[k] for k in keys)
      assert changed > 120
      assert mod_assign([], ["a"]) == {}
  - name: the ring moves far fewer
    code: |
      keys = ["key%d" % i for i in range(200)]
      before = build_ring(["a", "b", "c", "d"], 200)
      after = build_ring(["a", "b", "c", "d", "e"], 200)
