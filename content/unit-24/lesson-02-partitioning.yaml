    def stable_hash(text):
        h = 2166136261
        for b in text.encode():
            h ^= b
            h = (h * 16777619) & 0xFFFFFFFF
        return h


    def shard_for(key, shards):
        ordered = sorted(shards)
        return ordered[stable_hash(key) % len(ordered)]
