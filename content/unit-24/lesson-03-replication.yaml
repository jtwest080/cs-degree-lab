id: u24-replication
title: Replication and Consistency
minutes: 100
objective: Learn how copies of data are kept in step. You will build quorum reads and writes with read repair, resolve conflicts with last-write-wins and version siblings, write counters and sets that merge without coordination (CRDTs), and replicate a log from a leader.
outcomes:
- Explain why data is replicated and what can go wrong
- Choose quorum sizes and explain R + W > N
- Compare last-write-wins with versioned siblings
- 'Build CRDTs: grow-only counters, PN counters and OR-sets'
- Explain leader-based log replication
sections:
- heading: Why copy data, and what goes wrong
  body: |-
    Copying data to several machines, called **replication**, gives two things: **availability** (the data is still there if a machine fails) and **speed** (a copy can be placed near each user). The price is the hardest problem in the field: keeping the copies *consistent*. If you change one copy, another may not hear about it yet, and for a while different readers see different answers. A system's **consistency model** is the promise it makes about this. **Strong consistency** says every reader sees the latest write, as if there were one copy. **Eventual consistency** says that if writes stop, all copies will *eventually* agree, but a read may be stale in the meantime. Strong is easier to reason about; eventual is faster and keeps working when machines cannot reach each other.

    This trade-off is captured by the **CAP theorem**: when the network **partitions** (some machines cannot talk to others), a system must choose between **consistency** (refuse some requests so that no one sees stale or conflicting data) and **availability** (answer every request, accepting that the answers may disagree). Partitions happen, so the real choice is between C and A *when they do*. A bank ledger usually picks consistency; a shopping cart or a "like" counter often picks availability.
- heading: Quorums and conflicts
  body: |-
    A flexible middle path is the **quorum**. Keep `n` replicas; require a write to be acknowledged by `w` of them and a read to consult `r` of them. If **r + w > n**, every read set must overlap every write set in at least one replica, so a read is guaranteed to see at least one copy of the latest completed write; the reader simply takes the copy with the highest **version number**. Choosing `r` and `w` tunes the system: `w = n, r = 1` makes reads fast and writes fragile; `r = w = 2` of 3 tolerates one failed machine for both. Replicas that missed a write catch up through **read repair** (a read that notices an old copy writes the newer value back to it) and background synchronization. A failed write may still have reached *some* replicas, which is why a write that reports failure can nevertheless appear later.

    When replicas accept writes independently, they can produce **conflicts**. The simplest policy is **last-write-wins** (LWW): keep the write with the latest timestamp. It is easy and always converges, but because clocks disagree (lesson 1) and one of two concurrent updates is silently thrown away, it can lose data. The alternative is to use **vector clocks** (lesson 1) as **version vectors**: if one version's vector is below another's it is obsolete and can be dropped; if they are *concurrent* both are kept as **siblings**, and the application, or the user, merges them later (Amazon's original Dynamo did this with shopping carts).
- heading: CRDTs and replicated logs
  body: |-
    A neater way to avoid conflicts is to design data whose merges *cannot* conflict. A **CRDT** (conflict-free replicated data type) is a data structure with a **merge** operation that is **commutative** (order of arguments does not matter), **associative** (grouping does not matter) and **idempotent** (merging the same thing twice changes nothing). Replicas can then change independently, exchange states in any order, with duplicates and delays, and still all converge to the same value. A **grow-only counter** stores one count per node and merges by taking the maximum for each node; its value is the sum. Putting two together gives a **PN counter** that can also decrease. A **set** is trickier: the **observed-remove set** tags every add with a unique id, and a remove deletes only the tags it has seen, so an add that happens concurrently with a remove wins, and nothing the remover did not know about is lost. Collaborative editors and many databases use CRDTs.

    The other great tool is **state machine replication**. Give every replica the same deterministic program and the same *ordered log of commands*, and they will all end in the same state. A **leader** accepts commands, appends them to its log and sends them to **followers**. Each message says "after position `p`, whose term was `t`, append these entries"; a follower that does not agree about position `p` refuses, and the leader backs up one step at a time until they match, then overwrites the follower's disagreeing entries. A command is **committed** once a majority of the cluster has stored it, at which point it can never be lost, because any future leader must have come from a majority that overlaps. Raft, which you will meet in the next lesson, is built on exactly this log.
examples:
- title: Quorums and read repair
  intro: A write that reaches two of three replicas, a stale read, and a repair.
  code: |
    def compare(a, b):
        """Compare two equal-length vector clocks: 'equal', 'before', 'after' or 'concurrent'."""
        if a == b:
            return "equal"
        if all(x <= y for x, y in zip(a, b)):
            return "before"
        if all(x >= y for x, y in zip(a, b)):
            return "after"
        return "concurrent"


    def quorum_overlaps(n, r, w):
        """With n replicas, a read that asks r of them and a write that must reach w of them are GUARANTEED to share at least one replica exactly when r + w > n. Return that as a bool.
        ValueError('bad quorum') unless 1 <= r <= n and 1 <= w <= n."""
        if not (1 <= r <= n and 1 <= w <= n):
            raise ValueError("bad quorum")
        return r + w > n


    def tolerated_failures(n, r, w):
        """How many replicas can be down while reads and writes still succeed: {"read": n - r, "write": n - w}. Same ValueError('bad quorum') check."""
        if not (1 <= r <= n and 1 <= w <= n):
            raise ValueError("bad quorum")
        return {"read": n - r, "write": n - w}


    def write_quorum(replicas, up, version, value, w):
        """`replicas` maps each replica name to its stored (version, value). `up` is the list of replica names that are reachable. Send (version, value) to every reachable replica: a replica stores it only if
        `version` is higher than the version it holds, but it acknowledges either way. Count the acknowledgements (the names in `up` that are replicas). The stores are APPLIED even if too few replicas
        answer. Return the number of acknowledgements, or raise ValueError('write failed') if it is less than w (the partial writes remain)."""
        acks = 0
        for name in sorted(set(up) & set(replicas)):
            if version > replicas[name][0]:
                replicas[name] = (version, value)
            acks += 1
        if acks < w:
            raise ValueError("write failed")
        return acks


    def read_quorum(replicas, up, r):
        """Contact the first r reachable replicas in sorted name order and return the (version, value) with the highest version among them. ValueError('read failed') if fewer than r replicas are reachable."""
        reachable = sorted(set(up) & set(replicas))
        if len(reachable) < r:
            raise ValueError("read failed")
        return max((replicas[name] for name in reachable[:r]), key=lambda vv: vv[0])


    def read_repair(replicas, up, r):
        """Like read_quorum, but afterwards bring every CONTACTED replica that held an older version up to the newest (version, value). Return ((version, value), sorted list of the names that were repaired)."""
        reachable = sorted(set(up) & set(replicas))
        if len(reachable) < r:
            raise ValueError("read failed")
        contacted = reachable[:r]
        newest = max((replicas[name] for name in contacted), key=lambda vv: vv[0])
        repaired = []
        for name in contacted:
            if replicas[name][0] < newest[0]:
                replicas[name] = newest
                repaired.append(name)
        return newest, sorted(repaired)

    replicas = {"a": (0, None), "b": (0, None), "c": (0, None)}
    write_quorum(replicas, ["a", "b"], 1, "red", 2)
    print("replicas after a write that reached a and b:", replicas)
    print("read from b and c (r=2):", read_quorum(replicas, ["b", "c"], 2))
    print("read from c alone (r=1):", read_quorum(replicas, ["c"], 1), "<- stale!")
    print("read repair:", read_repair(replicas, ["a", "b", "c"], 3))
    print("replicas now:", replicas)
    print("n=3, r=2, w=2 always overlap:", quorum_overlaps(3, 2, 2), "| n=3, r=1, w=1:", quorum_overlaps(3, 1, 1))
  output: |
    replicas after a write that reached a and b: {'a': (1, 'red'), 'b': (1, 'red'), 'c': (0, None)}
    read from b and c (r=2): (1, 'red')
    read from c alone (r=1): (0, None) <- stale!
    read repair: ((1, 'red'), ['c'])
    replicas now: {'a': (1, 'red'), 'b': (1, 'red'), 'c': (1, 'red')}
    n=3, r=2, w=2 always overlap: True | n=3, r=1, w=1: False
  lines:
  - line: 67
    note: With r=1 the read missed the replicas that hold the new value.
  - line: 68
    note: The old copies are brought up to date.
- title: Conflicts and CRDTs
  intro: Last-write-wins against siblings, a counter and a shopping cart that merge.
  code: |
    def compare(a, b):
        """Compare two equal-length vector clocks: 'equal', 'before', 'after' or 'concurrent'."""
        if a == b:
            return "equal"
        if all(x <= y for x, y in zip(a, b)):
            return "before"
        if all(x >= y for x, y in zip(a, b)):
            return "after"
        return "concurrent"


    def lww_merge(a, b):
        """Last-write-wins. Each write is (timestamp, node, value). Return the write with the higher timestamp; on a tie the one with the larger node name."""
        return max(a, b, key=lambda w: (w[0], w[1]))


    def lww_lost(writes):
        """The writes that last-write-wins silently throws away: given a list of (timestamp, node, value) writes, return all but the winner, as a list sorted by (timestamp, node) ascending (empty list for no writes)."""
        ordered = sorted(writes, key=lambda w: (w[0], w[1]))
        return ordered[:-1]


    def resolve_versions(versions):
        """Keep only the versions that no other version dominates. `versions` is a list of (vector_clock, value) pairs. A version is dominated if another vector is 'after' it (all entries >=, and different).
        Surviving concurrent versions are called SIBLINGS. Remove exact duplicates and return the survivors sorted by (vector, value)."""
        unique = []
        for v in versions:
            if v not in unique:
                unique.append(v)
        keep = [v for v in unique if not any(compare(v[0], o[0]) == "before" for o in unique)]
        return sorted(keep, key=lambda v: (v[0], repr(v[1])))


    def merge_versions(a, b):
        """The siblings left after combining two replicas' version lists: resolve_versions of the two lists joined."""
        return resolve_versions(list(a) + list(b))


    def gcounter_inc(counter, node, by=1):
        """A grow-only counter is a dict node -> count. Return a NEW dict with `by` added to the node's entry. ValueError('negative increment') if by < 0."""
        if by < 0:
            raise ValueError("negative increment")
        new = dict(counter)
        new[node] = new.get(node, 0) + by
        return new


    def gcounter_value(counter):
        """The counter's value: the sum of all entries."""
        return sum(counter.values())


    def gcounter_merge(a, b):
        """Merge two grow-only counters: a new dict with, for every node, the LARGER of the two entries."""
        return {n: max(a.get(n, 0), b.get(n, 0)) for n in set(a) | set(b)}


    def pn_new():
        """A counter that can also go down is a pair {"p": grow-only counter of increments, "n": grow-only counter of decrements}. Return the empty one."""
        return {"p": {}, "n": {}}


    def pn_inc(counter, node, by=1):
        """A new PN counter with `by` added to the node's increments."""
        return {"p": gcounter_inc(counter["p"], node, by), "n": dict(counter["n"])}


    def pn_dec(counter, node, by=1):
        """A new PN counter with `by` added to the node's decrements."""
        return {"p": dict(counter["p"]), "n": gcounter_inc(counter["n"], node, by)}


    def pn_value(counter):
        """Increments minus decrements."""
        return gcounter_value(counter["p"]) - gcounter_value(counter["n"])


    def pn_merge(a, b):
        """Merge each half with gcounter_merge."""
        return {"p": gcounter_merge(a["p"], b["p"]), "n": gcounter_merge(a["n"], b["n"])}


    def orset_new():
        """An observed-remove set is {"adds": set of (element, tag), "removes": set of tags}. Return the empty one."""
        return {"adds": set(), "removes": set()}


    def orset_add(s, element, tag):
        """A NEW set with the pair (element, tag) added. The tag is unique to this add operation."""
        return {"adds": s["adds"] | {(element, tag)}, "removes": set(s["removes"])}


    def orset_remove(s, element):
        """A NEW set in which every tag currently attached to the element (and not already removed) is recorded as removed. Removing an absent element changes nothing."""
        tags = {t for e, t in s["adds"] if e == element}
        return {"adds": set(s["adds"]), "removes": s["removes"] | tags}


    def orset_elements(s):
        """The sorted list of elements that have at least one add whose tag is not in the removed tags."""
        return sorted({e for e, t in s["adds"] if t not in s["removes"]})


    def orset_merge(a, b):
        """The union of both adds and both removes, as a new set."""
        return {"adds": a["adds"] | b["adds"], "removes": a["removes"] | b["removes"]}

    print("last write wins:", lww_merge((10, "phone", "blue"), (12, "laptop", "green")))
    print("it threw away:", lww_lost([(10, "phone", "blue"), (12, "laptop", "green")]))
    print("siblings kept:", merge_versions([([1, 1, 0], "blue")], [([1, 0, 1], "green")]))
    likes = gcounter_merge(gcounter_inc({}, "us", 3), gcounter_inc({}, "eu", 5))
    print("likes:", gcounter_value(likes))
    cart = orset_merge(orset_remove(orset_add(orset_new(), "pen", "a"), "pen"), orset_add(orset_add(orset_new(), "pen", "a"), "pen", "b"))
    print("cart after concurrent add and remove:", orset_elements(cart))
  output: |
    last write wins: (12, 'laptop', 'green')
    it threw away: [(10, 'phone', 'blue')]
    siblings kept: [([1, 0, 1], 'green'), ([1, 1, 0], 'blue')]
    likes: 8
    cart after concurrent add and remove: ['pen']
  lines:
  - line: 108
    note: The later timestamp wins.
  - line: 110
    note: Both concurrent versions survive.
  - line: 114
    note: The concurrent add survives the remove.
- title: Replicating a log
  intro: A follower with bad entries is repaired by the leader.
  code: |
    def append_entries(log, prev_index, prev_term, entries):
        """The follower side of log replication (as in Raft). A log is a list of (term, command); entry number i (counting from 1) is log[i - 1]. The leader sends the entries that follow position
        prev_index, whose term is prev_term (prev_index 0 means 'from the start'). If prev_index > 0 and the follower has no entry there, or the entry's term differs from prev_term, REFUSE: return (False, a copy of the
        log). Otherwise accept: walk through `entries`; if the follower already has an entry at that position with a DIFFERENT term, delete it and everything after it, then append; if the terms match keep the existing entry;
        positions beyond the end are appended. Return (True, new log). Never change the input list."""
        if prev_index > 0 and (len(log) < prev_index or log[prev_index - 1][0] != prev_term):
            return False, list(log)
        new = list(log)
        for offset, entry in enumerate(entries):
            position = prev_index + offset + 1
            if len(new) >= position:
                if new[position - 1][0] != entry[0]:
                    new = new[:position - 1]
                    new.append(entry)
            else:
                new.append(entry)
        return True, new


    def catch_up(leader_log, follower_log):
        """How a leader repairs a follower. Start by assuming the follower is up to date (prev_index = len(leader_log)); send append_entries with prev_index, the term of the leader's entry there (0 if prev_index is 0), and the
        leader's entries after prev_index. If the follower refuses, step prev_index back by one and try again, until it accepts. Return the follower's resulting log."""
        log = list(follower_log)
        prev = len(leader_log)
        while True:
            prev_term = leader_log[prev - 1][0] if prev > 0 else 0
            ok, log2 = append_entries(log, prev, prev_term, leader_log[prev:])
            if ok:
                return log2
            prev -= 1


    def commit_index(match_index, leader_log, current_term):
        """How far the log is committed. `match_index` lists, for each FOLLOWER, the highest log position known to be stored there. The cluster is the followers plus the leader (who has all of leader_log). Return the largest N (up to
        len(leader_log)) such that a MAJORITY of the cluster has at least N entries and the entry at N is from current_term (Raft only counts replicas to commit entries of the current term); 0 if there is none."""
        total = len(match_index) + 1
        best = 0
        for n in range(1, len(leader_log) + 1):
            have = 1 + sum(1 for m in match_index if m >= n)
            if have * 2 > total and leader_log[n - 1][0] == current_term:
                best = n
        return best

    leader = [(1, "set x"), (1, "set y"), (2, "set z"), (2, "set w")]
    stale = [(1, "set x"), (1, "set y"), (1, "bad"), (1, "worse")]
    print("follower refuses a wrong position:", append_entries(stale, 3, 2, [(2, "set w")])[0])
    print("after catch-up:", catch_up(leader, stale) == leader)
    print("committed up to:", commit_index([4, 2], leader, 2))
  output: |
    follower refuses a wrong position: False
    after catch-up: True
    committed up to: 4
  lines:
  - line: 46
    note: The follower's entry at position 3 has the wrong term.
  - line: 47
    note: The leader overwrote the bad entries.
  - line: 48
    note: A majority holds entries up to 4.
