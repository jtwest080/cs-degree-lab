          gcounter_inc({}, "a", -1)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "negative increment" in str(e)
  - name: merging replicas
    code: |
      r1 = gcounter_inc(gcounter_inc({}, "r1", 3), "r2", 1)
      r2 = gcounter_inc(gcounter_inc({}, "r2", 4), "r3", 2)
      merged = gcounter_merge(r1, r2)
      assert merged == {"r1": 3, "r2": 4, "r3": 2} and gcounter_value(merged) == 9
      assert gcounter_merge(r1, r2) == gcounter_merge(r2, r1)
      assert gcounter_merge(r1, r1) == r1
      r3 = {"r1": 7}
      assert gcounter_merge(gcounter_merge(r1, r2), r3) == gcounter_merge(r1, gcounter_merge(r2, r3))
      assert gcounter_merge({}, {}) == {}
      assert r1 == {"r1": 3, "r2": 1}
  - name: counters that go down
    code: |
      c = pn_new()
      assert c == {"p": {}, "n": {}} and pn_value(c) == 0
      c = pn_inc(c, "a", 10)
      c = pn_dec(c, "a", 3)
      c = pn_dec(c, "b")
      assert pn_value(c) == 6 and c == {"p": {"a": 10}, "n": {"a": 3, "b": 1}}
      base = pn_new()
      changed = pn_inc(base, "a")
      assert base == {"p": {}, "n": {}} and changed["p"] == {"a": 1}
  - name: convergence
    code: |
      base = pn_new()
      x = pn_dec(pn_inc(base, "x", 5), "x", 1)
      y = pn_inc(pn_dec(base, "y", 2), "y", 7)
      z = pn_dec(base, "z", 4)
      m1 = pn_merge(pn_merge(x, y), z)
      m2 = pn_merge(z, pn_merge(y, x))
      assert m1 == m2 and pn_value(m1) == (5 - 1) + (7 - 2) - 4 == 5
      assert pn_merge(x, x) == x and pn_merge(x, y) == pn_merge(y, x)
      after = pn_inc(x, "x", 1)
      assert pn_value(pn_merge(x, after)) == pn_value(after)
  hints:
  - Merging takes the larger entry per node; that is why it does not matter how often or in what order merges happen.
  solution: |
    def gcounter_inc(counter, node, by=1):
        """A grow-only counter is a dict node -> count. Return a NEW dict with `by` added to the node's entry. ValueError('negative increment') if by < 0."""
        if by < 0:
            raise ValueError("negative increment")
        new = dict(counter)
        new[node] = new.get(node, 0) + by
        return new


    def gcounter_value(counter):
        """The counter's value: the sum of all entries."""
        return sum(counter.values())


    def gcounter_merge(a, b):
        """Merge two grow-only counters: a new dict with, for every node, the LARGER of the two entries."""
        return {n: max(a.get(n, 0), b.get(n, 0)) for n in set(a) | set(b)}


    def pn_new():
        """A counter that can also go down is a pair {"p": grow-only counter of increments, "n": grow-only counter of decrements}. Return the empty one."""
        return {"p": {}, "n": {}}


    def pn_inc(counter, node, by=1):
        """A new PN counter with `by` added to the node's increments."""
        return {"p": gcounter_inc(counter["p"], node, by), "n": dict(counter["n"])}


    def pn_dec(counter, node, by=1):
        """A new PN counter with `by` added to the node's decrements."""
        return {"p": dict(counter["p"]), "n": gcounter_inc(counter["n"], node, by)}


    def pn_value(counter):
        """Increments minus decrements."""
        return gcounter_value(counter["p"]) - gcounter_value(counter["n"])


    def pn_merge(a, b):
        """Merge each half with gcounter_merge."""
        return {"p": gcounter_merge(a["p"], b["p"]), "n": gcounter_merge(a["n"], b["n"])}
  explanation: CRDTs get consistency without coordination by making every merge commutative, associative and idempotent.
- id: orset
  title: A set where adds beat removes
  difficulty: 5
  prompt: 'Sets are harder: if one replica adds an element while another removes it, what should the merged set say? An **observed-remove set** (OR-set) gives each add a unique **tag**, and a remove only deletes the adds it has **seen**, so a concurrent add survives. The state is `{"adds": set of (element, tag), "removes": set of tags}`. Write `orset_new()` (empty), `orset_add(s, element, tag)` (a **new** set with `(element, tag)` added), `orset_remove(s, element)` (a **new** set in which every tag currently attached to the element is recorded as removed; removing an absent element changes nothing), `orset_elements(s)` (the sorted list of elements with at least one add whose tag is not in `removes`) and `orset_merge(a, b)` (the union of the adds and the union of the removes, as a new set). Never change the inputs.'
  starter: |-
    def orset_new():
        """An observed-remove set is {"adds": set of (element, tag), "removes": set of tags}. Return the empty one."""
        pass


    def orset_add(s, element, tag):
        """A NEW set with the pair (element, tag) added. The tag is unique to this add operation."""
        pass


    def orset_remove(s, element):
        """A NEW set in which every tag currently attached to the element (and not already removed) is recorded as removed. Removing an absent element changes nothing."""
        pass


    def orset_elements(s):
        """The sorted list of elements that have at least one add whose tag is not in the removed tags."""
        pass


    def orset_merge(a, b):
        """The union of both adds and both removes, as a new set."""
        pass
  tests:
  - name: adding and removing
    code: |
      s = orset_new()
      assert orset_elements(s) == []
      s = orset_add(s, "x", "t1")
      s = orset_add(s, "y", "t2")
      assert orset_elements(s) == ["x", "y"]
      s2 = orset_remove(s, "x")
      assert orset_elements(s2) == ["y"] and orset_elements(s) == ["x", "y"]
      assert orset_elements(orset_remove(orset_new(), "nope")) == []
      s3 = orset_add(s2, "x", "t3")
      assert orset_elements(s3) == ["x", "y"]
      twice = orset_add(orset_add(orset_new(), "x", "a"), "x", "b")
      assert orset_elements(twice) == ["x"] and orset_elements(orset_remove(twice, "x")) == []
  - name: add wins over a concurrent remove
    code: |
      base = orset_add(orset_new(), "x", "t1")
      alice = orset_remove(base, "x")
      bob = orset_add(base, "x", "t2")
      merged = orset_merge(alice, bob)
      assert orset_elements(alice) == [] and orset_elements(bob) == ["x"]
      assert orset_elements(merged) == ["x"]
      assert orset_merge(alice, bob) == orset_merge(bob, alice)
      assert merged["removes"] == {"t1"} and ("x", "t2") in merged["adds"]
      later = orset_remove(merged, "x")
      assert orset_elements(later) == []
  - name: merge laws
    code: |
      a = orset_add(orset_add(orset_new(), "p", "1"), "q", "2")
      b = orset_remove(orset_add(orset_new(), "q", "2"), "q")
      c = orset_add(orset_new(), "r", "3")
      assert orset_merge(a, a) == a
      assert orset_merge(a, b) == orset_merge(b, a)
      assert orset_merge(orset_merge(a, b), c) == orset_merge(a, orset_merge(b, c))
      assert orset_elements(orset_merge(orset_merge(a, b), c)) == ["p", "r"]
      assert orset_elements(orset_merge(orset_new(), orset_new())) == []
      x = orset_add(orset_new(), "k", "t")
      y = orset_merge(x, orset_new())
      y["adds"].add(("zzz", "tt"))
      assert ("zzz", "tt") not in x["adds"]
  - name: replicas converge
    code: |
      r1 = orset_new()
      r2 = orset_new()
      r1 = orset_add(r1, "milk", "r1-1")
      r2 = orset_add(r2, "eggs", "r2-1")
      r1 = orset_add(r1, "bread", "r1-2")
      r2 = orset_merge(r2, r1)
      r2 = orset_remove(r2, "milk")
      r1 = orset_add(r1, "milk", "r1-3")
      r1 = orset_merge(r1, r2)
      r2 = orset_merge(r2, r1)
      assert orset_elements(r1) == orset_elements(r2) == ["bread", "eggs", "milk"]
  hints:
  - Tag every add uniquely; a remove records only the tags it can see.
  solution: |
    def orset_new():
        """An observed-remove set is {"adds": set of (element, tag), "removes": set of tags}. Return the empty one."""
        return {"adds": set(), "removes": set()}


    def orset_add(s, element, tag):
        """A NEW set with the pair (element, tag) added. The tag is unique to this add operation."""
        return {"adds": s["adds"] | {(element, tag)}, "removes": set(s["removes"])}


    def orset_remove(s, element):
        """A NEW set in which every tag currently attached to the element (and not already removed) is recorded as removed. Removing an absent element changes nothing."""
        tags = {t for e, t in s["adds"] if e == element}
        return {"adds": set(s["adds"]), "removes": s["removes"] | tags}


    def orset_elements(s):
        """The sorted list of elements that have at least one add whose tag is not in the removed tags."""
        return sorted({e for e, t in s["adds"] if t not in s["removes"]})


    def orset_merge(a, b):
        """The union of both adds and both removes, as a new set."""
        return {"adds": a["adds"] | b["adds"], "removes": a["removes"] | b["removes"]}
  explanation: The OR-set decides a concurrent add and remove in favour of the add, so no item is lost.
- id: log
  title: Log replication catch-up
  difficulty: 5
  prompt: 'Many systems keep replicas identical by replicating an ordered **log** of commands, with a **leader** sending entries to **followers** (this is the heart of Raft). A log is a list of `(term, command)`; the entry at position `i` (counting from 1) is `log[i - 1]`. Write `append_entries(log, prev_index, prev_term, entries)`, the follower''s rule. The leader sends the entries that follow position `prev_index`, whose term was `prev_term` (`prev_index` 0 means "from the start"). If `prev_index > 0` and the follower has no entry there, or its term differs from `prev_term`, **refuse**: return `(False, a copy of the log)`. Otherwise accept: walk through `entries`; if the follower already has an entry at that position with a **different term**, delete it and everything after it and append; if the terms match, keep the existing entry; positions beyond the end are appended. Return `(True, new log)` and never change the input. Write `catch_up(leader_log, follower_log)`: start with `prev_index = len(leader_log)` and send `append_entries` with that index, the leader''s term at that position (0 if the index is 0) and the leader''s entries after it; if the follower refuses, step `prev_index` back by one and try again until it accepts. Return the follower''s resulting log. Write `commit_index(match_index, leader_log, current_term)`: `match_index` lists, for each **follower**, the highest position known to be stored there; the cluster is the followers plus the leader. Return the largest `N` (up to `len(leader_log)`) such that a **majority** of the cluster holds at least `N` entries **and** the entry at `N` has term `current_term` (Raft only commits entries of the current term by counting replicas); `0` if there is none.'
  starter: |-
    def append_entries(log, prev_index, prev_term, entries):
        """The follower side of log replication (as in Raft). A log is a list of (term, command); entry number i (counting from 1) is log[i - 1]. The leader sends the entries that follow position
        prev_index, whose term is prev_term (prev_index 0 means 'from the start'). If prev_index > 0 and the follower has no entry there, or the entry's term differs from prev_term, REFUSE: return (False, a copy of the
        log). Otherwise accept: walk through `entries`; if the follower already has an entry at that position with a DIFFERENT term, delete it and everything after it, then append; if the terms match keep the existing entry;
        positions beyond the end are appended. Return (True, new log). Never change the input list."""
        pass


    def catch_up(leader_log, follower_log):
        """How a leader repairs a follower. Start by assuming the follower is up to date (prev_index = len(leader_log)); send append_entries with prev_index, the term of the leader's entry there (0 if prev_index is 0), and the
        leader's entries after prev_index. If the follower refuses, step prev_index back by one and try again, until it accepts. Return the follower's resulting log."""
        pass


    def commit_index(match_index, leader_log, current_term):
        """How far the log is committed. `match_index` lists, for each FOLLOWER, the highest log position known to be stored there. The cluster is the followers plus the leader (who has all of leader_log). Return the largest N (up to
        len(leader_log)) such that a MAJORITY of the cluster has at least N entries and the entry at N is from current_term (Raft only counts replicas to commit entries of the current term); 0 if there is none."""
        pass
  tests:
  - name: the follower's rule
    code: |
      log = [(1, "a"), (1, "b")]
      assert append_entries(log, 2, 1, [(2, "c")]) == (True, [(1, "a"), (1, "b"), (2, "c")])
      assert append_entries(log, 0, 0, [(1, "a"), (1, "b"), (1, "z")]) == (True, [(1, "a"), (1, "b"), (1, "z")])
      assert append_entries(log, 3, 1, [(1, "d")]) == (False, log)
      assert append_entries(log, 2, 2, [(2, "c")]) == (False, log)
      assert append_entries([], 0, 0, [(1, "x")]) == (True, [(1, "x")])
      assert append_entries(log, 1, 1, []) == (True, log) and append_entries(log, 1, 1, [])[1] is not log
      assert log == [(1, "a"), (1, "b")]
  - name: conflicting entries are overwritten
    code: |
      follower = [(1, "a"), (1, "b"), (1, "x"), (1, "y")]
      ok, new = append_entries(follower, 2, 1, [(2, "c")])
      assert ok and new == [(1, "a"), (1, "b"), (2, "c")]
      ok, new = append_entries(follower, 2, 1, [(1, "x")])
      assert ok and new == follower
      ok, new = append_entries(follower, 1, 1, [(1, "b"), (3, "q"), (3, "r")])
      assert ok and new == [(1, "a"), (1, "b"), (3, "q"), (3, "r")]
      assert follower == [(1, "a"), (1, "b"), (1, "x"), (1, "y")]
  - name: catching up
    code: |
      leader = [(1, "a"), (1, "b"), (2, "c"), (2, "d")]
      assert catch_up(leader, []) == leader
      assert catch_up(leader, [(1, "a")]) == leader
      assert catch_up(leader, leader) == leader
      assert catch_up(leader, [(1, "a"), (1, "b"), (1, "x"), (1, "y"), (1, "z")]) == leader or catch_up(leader, [(1, "a"), (1, "b"), (1, "x"), (1, "y"), (1, "z")])[:4] == leader
      assert catch_up(leader, [(1, "a"), (1, "b"), (1, "x")]) == leader
      assert catch_up(leader, [(5, "w")]) == leader
      assert catch_up([], [(1, "stale")]) == [(1, "stale")]
  - name: what is committed
    code: |
      log = [(1, "a"), (1, "b"), (2, "c"), (2, "d")]
      assert commit_index([4, 2], log, 2) == 4
      assert commit_index([2, 2], log, 2) == 0
      assert commit_index([3, 3], log, 2) == 3
      assert commit_index([4, 4], log, 3) == 0
      assert commit_index([4, 4], log, 2) == 4
      assert commit_index([], log, 2) == 4
      assert commit_index([4, 3, 0, 0], log, 2) == 3 or commit_index([4, 3, 0, 0], log, 2) == 0
      assert commit_index([3, 3, 0, 0], log, 2) == 3
      assert commit_index([2, 0], [(1, "a"), (1, "b")], 1) == 2 or commit_index([2, 0], [(1, "a"), (1, "b")], 1) == 2
      assert commit_index([0, 0], [(1, "a")], 1) == 0
  hints:
  - Walk back from the end of the leader's log until the follower's log agrees, then send everything after that point.
  solution: |
    def append_entries(log, prev_index, prev_term, entries):
        """The follower side of log replication (as in Raft). A log is a list of (term, command); entry number i (counting from 1) is log[i - 1]. The leader sends the entries that follow position
        prev_index, whose term is prev_term (prev_index 0 means 'from the start'). If prev_index > 0 and the follower has no entry there, or the entry's term differs from prev_term, REFUSE: return (False, a copy of the
        log). Otherwise accept: walk through `entries`; if the follower already has an entry at that position with a DIFFERENT term, delete it and everything after it, then append; if the terms match keep the existing entry;
        positions beyond the end are appended. Return (True, new log). Never change the input list."""
        if prev_index > 0 and (len(log) < prev_index or log[prev_index - 1][0] != prev_term):
            return False, list(log)
        new = list(log)
        for offset, entry in enumerate(entries):
            position = prev_index + offset + 1
            if len(new) >= position:
                if new[position - 1][0] != entry[0]:
                    new = new[:position - 1]
                    new.append(entry)
            else:
                new.append(entry)
        return True, new


    def catch_up(leader_log, follower_log):
        """How a leader repairs a follower. Start by assuming the follower is up to date (prev_index = len(leader_log)); send append_entries with prev_index, the term of the leader's entry there (0 if prev_index is 0), and the
        leader's entries after prev_index. If the follower refuses, step prev_index back by one and try again, until it accepts. Return the follower's resulting log."""
        log = list(follower_log)
        prev = len(leader_log)
        while True:
            prev_term = leader_log[prev - 1][0] if prev > 0 else 0
            ok, log2 = append_entries(log, prev, prev_term, leader_log[prev:])
            if ok:
                return log2
            prev -= 1


    def commit_index(match_index, leader_log, current_term):
        """How far the log is committed. `match_index` lists, for each FOLLOWER, the highest log position known to be stored there. The cluster is the followers plus the leader (who has all of leader_log). Return the largest N (up to
        len(leader_log)) such that a MAJORITY of the cluster has at least N entries and the entry at N is from current_term (Raft only counts replicas to commit entries of the current term); 0 if there is none."""
        total = len(match_index) + 1
        best = 0
        for n in range(1, len(leader_log) + 1):
            have = 1 + sum(1 for m in match_index if m >= n)
            if have * 2 > total and leader_log[n - 1][0] == current_term:
                best = n
        return best
  explanation: A replicated log makes the order of commands the same on every machine, so every machine reaches the same state.
commonMistakes:
- title: Choosing r + w <= n and expecting fresh reads
  explanation: The read set may miss every replica that has the new value.
- title: Treating a failed write as if nothing happened
  explanation: Some replicas may have stored it.
- title: Trusting last-write-wins with unsynchronized clocks
  explanation: A skewed clock can make an old write win.
- title: Merging a counter by adding instead of taking the maximum
  explanation: Merging the same state twice would double-count.
- title: Letting a remove delete tags it has not seen
  explanation: It would erase a concurrent add.
summary:
- Replication buys availability and speed at the price of consistency.
- 'CAP: during a partition choose consistency or availability.'
- Quorums with r + w > n guarantee reads overlap writes.
- Last-write-wins is simple but loses concurrent updates; siblings keep them.
- CRDTs merge commutatively, associatively and idempotently, so replicas converge.
- A leader replicates an ordered log; a majority makes an entry committed.
