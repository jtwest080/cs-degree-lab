        pass


    def pn_inc(counter, node, by=1):
        """A new PN counter with `by` added to the node's increments."""
        pass


    def pn_dec(counter, node, by=1):
        """A new PN counter with `by` added to the node's decrements."""
        pass


    def pn_value(counter):
        """Increments minus decrements."""
        pass


    def pn_merge(a, b):
        """Merge each half with gcounter_merge."""
        pass
  tests:
  - name: grow-only counter
    code: |
      c = {}
      c = gcounter_inc(c, "a")
      c = gcounter_inc(c, "a", 4)
      c = gcounter_inc(c, "b", 2)
      assert c == {"a": 5, "b": 2} and gcounter_value(c) == 7 and gcounter_value({}) == 0
      original = {"x": 1}
      new = gcounter_inc(original, "x")
      assert original == {"x": 1} and new == {"x": 2}
      assert gcounter_inc({}, "z", 0) == {"z": 0}
