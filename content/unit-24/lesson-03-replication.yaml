  tests:
  - name: the arithmetic
    code: |
      assert quorum_overlaps(3, 2, 2) and quorum_overlaps(5, 3, 3) and quorum_overlaps(3, 1, 3) and quorum_overlaps(3, 3, 1)
      assert not quorum_overlaps(3, 1, 1) and not quorum_overlaps(5, 2, 3) and not quorum_overlaps(4, 2, 2)
      assert tolerated_failures(5, 3, 3) == {"read": 2, "write": 2}
      assert tolerated_failures(3, 1, 3) == {"read": 2, "write": 0}
      for bad in ((3, 0, 1), (3, 1, 4), (3, 4, 1)):
          for f in (quorum_overlaps, tolerated_failures):
              try:
                  f(*bad)
                  raise AssertionError("accepted")
              except ValueError as e:
                  assert "bad quorum" in str(e)
  - name: writing
    code: |
      rep = {"a": (0, None), "b": (0, None), "c": (0, None)}
      assert write_quorum(rep, ["a", "b", "c"], 1, "x", 2) == 3
      assert rep == {"a": (1, "x"), "b": (1, "x"), "c": (1, "x")}
      assert write_quorum(rep, ["a", "b"], 2, "y", 2) == 2
      assert rep == {"a": (2, "y"), "b": (2, "y"), "c": (1, "x")}
      try:
          write_quorum(rep, ["c"], 3, "z", 2)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "write failed" in str(e)
      assert rep["c"] == (3, "z")
      assert write_quorum(rep, ["a"], 1, "old", 1) == 1 and rep["a"] == (2, "y")
      assert write_quorum(rep, ["zzz", "a"], 4, "w", 1) == 1 and rep["a"] == (4, "w")
  - name: reading
    code: |
      rep = {"a": (2, "new"), "b": (1, "old"), "c": (1, "old")}
      assert read_quorum(rep, ["a", "b", "c"], 2) == (2, "new")
      assert read_quorum(rep, ["b", "c"], 2) == (1, "old")
      assert read_quorum(rep, ["b", "c"], 1) == (1, "old")
      assert read_quorum(rep, ["c", "a"], 2) == (2, "new")
      assert read_quorum(rep, ["a"], 1) == (2, "new")
      try:
          read_quorum(rep, ["a"], 2)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "read failed" in str(e)
  - name: overlapping quorums never read stale data
    code: |
      import itertools
      names = ["a", "b", "c", "d", "e"]
      for r, w in ((3, 3), (2, 4), (4, 2), (1, 5), (5, 1)):
          for wset in itertools.combinations(names, w):
              for rset in itertools.combinations(names, r):
                  rep = {n: (1, "old") for n in names}
                  write_quorum(rep, list(wset), 2, "new", w)
                  assert read_quorum(rep, list(rset), r) == (2, "new"), (r, w, wset, rset)
      rep = {n: (1, "old") for n in names}
      write_quorum(rep, ["a"], 2, "new", 1)
      assert read_quorum(rep, ["b", "c"], 2) == (1, "old")
  - name: read repair
    code: |
      rep = {"a": (3, "v3"), "b": (1, "v1"), "c": (2, "v2")}
      assert read_repair(rep, ["a", "b", "c"], 2) == ((3, "v3"), ["b"])
      assert rep == {"a": (3, "v3"), "b": (3, "v3"), "c": (2, "v2")}
      assert read_repair(rep, ["a", "b", "c"], 3) == ((3, "v3"), ["c"])
      assert rep == {n: (3, "v3") for n in "abc"}
      assert read_repair(rep, ["a", "b", "c"], 3) == ((3, "v3"), [])
      rep = {"a": (1, "x"), "b": (0, None)}
      assert read_repair(rep, ["b"], 1) == ((0, None), [])
      try:
          read_repair(rep, [], 1)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "read failed" in str(e)
