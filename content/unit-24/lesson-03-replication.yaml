      writes = [(3, "c", "cc"), (1, "a", "aa"), (3, "b", "bb"), (2, "a", "a2")]
      assert lww_lost(writes) == [(1, "a", "aa"), (2, "a", "a2"), (3, "b", "bb")]
      assert lww_lost([(1, "a", "x")]) == [] and lww_lost([]) == []
      assert writes[0] == (3, "c", "cc")
