      assert lww_merge((5, "a", "x"), (7, "b", "y")) == (7, "b", "y")
      assert lww_merge((7, "b", "y"), (5, "a", "x")) == (7, "b", "y")
      assert lww_merge((5, "a", "x"), (5, "b", "y")) == (5, "b", "y")
      assert lww_merge((5, "b", "y"), (5, "a", "x")) == (5, "b", "y")
      assert lww_merge((1, "n", 1), (1, "n", 1)) == (1, "n", 1)
