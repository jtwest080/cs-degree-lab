      assert resolve_versions([([1], "a"), ([1], "a")]) == [([1], "a")]
      assert resolve_versions([([2, 0], "x"), ([0, 2], "y")]) == [([0, 2], "y"), ([2, 0], "x")]
      assert resolve_versions([([1, 0], "old"), ([2, 0], "new")]) == [([2, 0], "new")]
      assert resolve_versions([]) == []
      assert resolve_versions([([1, 1], "a"), ([1, 1], "b")]) == [([1, 1], "a"), ([1, 1], "b")]
      before = [([1, 0], "a"), ([1, 1], "b")]
      resolve_versions(before)
      assert before == [([1, 0], "a"), ([1, 1], "b")]
  - name: merging replicas
    code: |
      left = [([2, 1, 0], "left")]
      right = [([2, 0, 1], "right")]
      assert merge_versions(left, right) == [([2, 0, 1], "right"), ([2, 1, 0], "left")]
      assert merge_versions(left, [([3, 1, 0], "newer")]) == [([3, 1, 0], "newer")]
      assert merge_versions(left, left) == left
      assert merge_versions([], []) == []
      a, b, c = [([1, 0], "p")], [([0, 1], "q")], [([1, 1], "r")]
      assert merge_versions(merge_versions(a, b), c) == merge_versions(a, merge_versions(b, c)) == [([1, 1], "r")]
  hints:
  - A version is discarded only when another vector is strictly after it.
  solution: |
    def compare(a, b):
        """Compare two equal-length vector clocks: 'equal', 'before', 'after' or 'concurrent'."""
        if a == b:
            return "equal"
        if all(x <= y for x, y in zip(a, b)):
            return "before"
        if all(x >= y for x, y in zip(a, b)):
            return "after"
        return "concurrent"


    def lww_merge(a, b):
        """Last-write-wins. Each write is (timestamp, node, value). Return the write with the higher timestamp; on a tie the one with the larger node name."""
        return max(a, b, key=lambda w: (w[0], w[1]))


    def lww_lost(writes):
        """The writes that last-write-wins silently throws away: given a list of (timestamp, node, value) writes, return all but the winner, as a list sorted by (timestamp, node) ascending (empty list for no writes)."""
        ordered = sorted(writes, key=lambda w: (w[0], w[1]))
        return ordered[:-1]


    def resolve_versions(versions):
        """Keep only the versions that no other version dominates. `versions` is a list of (vector_clock, value) pairs. A version is dominated if another vector is 'after' it (all entries >=, and different).
        Surviving concurrent versions are called SIBLINGS. Remove exact duplicates and return the survivors sorted by (vector, value)."""
        unique = []
        for v in versions:
            if v not in unique:
                unique.append(v)
        keep = [v for v in unique if not any(compare(v[0], o[0]) == "before" for o in unique)]
        return sorted(keep, key=lambda v: (v[0], repr(v[1])))


    def merge_versions(a, b):
        """The siblings left after combining two replicas' version lists: resolve_versions of the two lists joined."""
        return resolve_versions(list(a) + list(b))
  explanation: Last-write-wins is simple but silently loses data; siblings keep every concurrent update for the application to merge.
- id: counters
  title: Counters that merge without conflicts
  difficulty: 5
  prompt: 'A **CRDT** (conflict-free replicated data type) is a data structure whose copies can be changed independently and then merged in any order, always converging to the same value. Write a **grow-only counter** as a dict `node -> count`: `gcounter_inc(counter, node, by=1)` returns a **new** dict with `by` added to that node''s entry (`ValueError("negative increment")` if `by < 0`); `gcounter_value(counter)` sums the entries; `gcounter_merge(a, b)` takes, for every node, the **larger** of the two entries. Then a counter that can go down, a **PN counter**, as a pair `{"p": increments, "n": decrements}` of grow-only counters: `pn_new()` returns an empty one; `pn_inc(counter, node, by=1)` and `pn_dec(counter, node, by=1)` return **new** counters with the amount added to the `p` or `n` half; `pn_value(counter)` is increments minus decrements; `pn_merge(a, b)` merges each half.'
  starter: |-
    def gcounter_inc(counter, node, by=1):
        """A grow-only counter is a dict node -> count. Return a NEW dict with `by` added to the node's entry. ValueError('negative increment') if by < 0."""
        pass


    def gcounter_value(counter):
        """The counter's value: the sum of all entries."""
        pass


