    code: |
      rep = {"a": (3, "x"), "b": (1, "y"), "c": (2, "z")}
      assert needs_repair(rep, 3) == ["b", "c"] and needs_repair(rep, 1) == [] and needs_repair(rep, 9) == ["a", "b", "c"] and needs_repair({}, 1) == []
  solution: |
    def needs_repair(replicas, version):
        return sorted(n for n, (v, _) in replicas.items() if v < version)
