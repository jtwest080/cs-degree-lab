        outcomes = []
        for candidate, term, reachable in attempts:
            won, granted, state = run_election(state, candidate, term, reachable)
            outcomes.append((candidate, term, won, tuple(granted)))
        return outcomes


    def leaders_by_term(outcomes):
        """Raft's election safety: at most ONE leader per term. From a list of outcomes (candidate, term, won, votes) return {term: the winning candidate} for terms that had a winner; ValueError('two leaders in term T') if two different winners exist for the same term T."""
        leaders = {}
        for candidate, term, won, votes in outcomes:
            if won:
                if term in leaders and leaders[term] != candidate:
                    raise ValueError("two leaders in term %d" % term)
                leaders[term] = candidate
        return leaders
  explanation: Election safety is why a Raft cluster never has two leaders accepting conflicting writes in the same term.
commonMistakes:
- title: Treating a timeout as proof of a crash
  explanation: It is only a suspicion; the machine may come back.
- title: A Paxos proposer ignoring earlier accepted values
  explanation: It must adopt the highest-numbered one or safety is lost.
- title: Counting a majority of the machines that answered
  explanation: A majority is of all members, not of the reachable ones.
- title: Letting a voter vote twice in a term
  explanation: Two candidates could both win.
- title: Electing a candidate with an older log
  explanation: It could overwrite committed entries.
summary:
- A crashed machine and a slow one look the same; detectors only suspect.
- Timeouts trade false alarms against slow detection; adaptive ones learn the normal gaps.
- The bully algorithm elects the highest live node but is message-hungry and can split the brain.
- Consensus needs majorities, because any two majorities overlap.
- Paxos is safe because proposers adopt the highest-numbered accepted value.
- Raft elects a leader per term with one vote each and an up-to-date-log rule.
