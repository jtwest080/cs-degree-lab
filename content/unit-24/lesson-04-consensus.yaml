id: u24-consensus
title: Failure Detection and Consensus
minutes: 100
objective: Learn how a group of machines that can fail agrees on one thing. You will build a heartbeat failure detector, the bully election algorithm, single-decree Paxos and the voting rules of Raft, and check that two leaders can never be elected in one term.
outcomes:
- Explain why failure detection is only a guess
- Run the bully election
- Explain Paxos's two phases and its safety rule
- Apply Raft's voting rules
- Explain election safety and majorities
sections:
- heading: Is it dead, or just slow?
  body: |-
    When a machine stops answering, a distributed system faces a puzzle: did it **crash**, or is the network slow, or is it simply busy? From the outside these look identical, and there is no way to be sure. (A famous result, the **FLP impossibility theorem**, shows that in a purely asynchronous network no algorithm can *guarantee* agreement if even one machine may crash. Real systems get around it by using timeouts, which makes them work almost always, and never claiming certainty.)

    The standard tool is the **heartbeat**: every machine regularly sends a small "I am alive" message. A **failure detector** records when it last heard from each machine and **suspects** any whose last heartbeat is older than a **timeout**. Choosing the timeout is a trade-off: too short, and a slow moment triggers a **false suspicion** and needless work; too long, and a real crash goes unnoticed. Good detectors, such as the **phi accrual** detector used in Cassandra, learn what is normal. They measure the *typical gap and its spread* between a machine's heartbeats and set the timeout to the mean plus a few standard deviations, as our `adaptive_timeout` does. The detector's answer is always a *suspicion*, never a fact.
- heading: Electing a leader
  body: |-
    Many designs are simpler if exactly one machine, the **leader**, makes the decisions and the others follow. When the leader is suspected, the rest hold an **election**. The **bully algorithm** gives every machine a number and lets the highest *live* number win: a machine that notices the loss sends ELECTION to every higher machine; any live one answers OK ("I am bigger, stand down") and starts its own election; the highest live machine finds nobody higher, declares itself leader and sends COORDINATOR to everyone. It is easy to understand, but with a false suspicion two machines can each believe they are leader, and it floods the network. That danger, called **split brain**, is why serious systems use a proper consensus protocol instead.

    **Consensus** is the problem of getting a group to agree on a single value so that: only a value that was proposed can be chosen; only one value is chosen; and once chosen, it never changes. Consensus underlies electing a leader, committing a transaction and ordering a log. The key tool is the **majority** (or **quorum**): if every decision needs more than half the machines, any two decisions share a machine, so two conflicting decisions cannot both happen.
- heading: Paxos and Raft
  body: |-
    **Paxos**, by Lamport, is the classic protocol. A **proposer** numbers each attempt with a unique, increasing **proposal number**. In **phase 1** it asks the **acceptors** to *promise* not to accept anything numbered lower, and each promise also reports the highest-numbered proposal that acceptor has already accepted. If a majority promise, the proposer must be careful: if any promise reported an accepted value, it **must propose the one with the highest number** instead of its own. That single rule is what makes Paxos safe, because a value that was chosen by some majority will be seen by any later majority, and so gets carried forward. In **phase 2** it asks the acceptors to accept the value, and if a majority do, the value is **chosen**. Competing proposers may keep interrupting each other, which is why practical systems elect a leader to propose.

    **Raft** solves the same problem in a way designed to be understandable, and is used in etcd, Consul and many databases. Time is cut into numbered **terms**. A server that suspects there is no leader becomes a **candidate**, increments its term and asks the others for votes. Each server votes **at most once per term** and only for a candidate whose log is **at least as up to date** as its own (compared by the term and index of the last entry); a candidate with a **majority** becomes the leader for that term. The one-vote rule plus majorities means two leaders can never be elected in the same term, a property called **election safety**, and the log rule means a new leader always already holds every entry that was committed. Once elected, the leader replicates its log to the others as in the last lesson. Raft makes a replicated, fault-tolerant service possible out of a handful of ordinary machines, and with 2f + 1 machines it keeps working through f failures.
examples:
- title: Heartbeats
  intro: A failure detector suspects the node that went quiet, and an adaptive timeout.
  code: |
    import statistics


    def last_heartbeats(events):
        """`events` is a list of (time, node) heartbeat arrivals in any order. Return {node: the latest time that node was heard from}."""
        last = {}
        for t, node in events:
            if node not in last or t > last[node]:
                last[node] = t
        return last


    def suspected(last_seen, now, timeout):
        """The sorted list of nodes whose last heartbeat is MORE than `timeout` old: now - last_seen[node] > timeout."""
        return sorted(n for n, t in last_seen.items() if now - t > timeout)


    def detect(events, nodes, now, timeout):
        """A heartbeat failure detector. Consider only heartbeats with time <= now. Return {node: 'alive' or 'suspected'} for every node in `nodes`: a node is suspected if it has never been heard from, or its latest heartbeat is more than `timeout` old."""
        last = last_heartbeats([(t, n) for t, n in events if t <= now])
        return {n: ("suspected" if n not in last or now - last[n] > timeout else "alive") for n in nodes}


    def adaptive_timeout(arrivals, k):
        """Pick a timeout that fits how regular a node's heartbeats really are. `arrivals` is the list of times one node's heartbeats arrived (sort it first). The intervals between consecutive arrivals have a mean
        and a population standard deviation (statistics.pstdev); return mean + k * deviation rounded to 3 decimals. ValueError('too few heartbeats') if there are fewer than 3 arrivals."""
        if len(arrivals) < 3:
            raise ValueError("too few heartbeats")
        ordered = sorted(arrivals)
        gaps = [b - a for a, b in zip(ordered, ordered[1:])]
        return round(statistics.mean(gaps) + k * statistics.pstdev(gaps), 3)

    beats = [(0, "a"), (0, "b"), (0, "c"), (5, "a"), (5, "b"), (10, "a"), (10, "b"), (15, "a")]
    print("at t=16 with timeout 8:", detect(beats, ["a", "b", "c"], 16, 8))
    print("who is suspected:", suspected(last_heartbeats(beats), 16, 8))
    print("adaptive timeout for steady beats:", adaptive_timeout([0, 5, 10, 15], 3), " for jittery beats:", adaptive_timeout([0, 4, 11, 15, 24], 3))
  output: |
    at t=16 with timeout 8: {'a': 'alive', 'b': 'alive', 'c': 'suspected'}
    who is suspected: ['c']
    adaptive timeout for steady beats: 5.0  for jittery beats: 12.364
  lines:
  - line: 34
    note: c never sent another heartbeat after time 0.
  - line: 36
    note: Jittery beats need a larger timeout than steady ones.
- title: Bully and Paxos
  intro: An election with the top node down, then two competing Paxos proposers.
  code: |
    def bully_election(all_nodes, alive, starter):
        """The bully algorithm: the highest-numbered live node becomes leader. Simulate it and COUNT messages. A node that runs an election sends an ELECTION message to EVERY node with a higher id (alive or not: it cannot tell) and counts 1 per message sent; each ALIVE higher node
        replies OK (count 1 per reply) and then runs its own election, unless it already has. A node with no alive higher node wins, and sends a COORDINATOR message to every other ALIVE node (count 1 each). The starter begins the first election.
        Return (leader, total_messages). ValueError('starter is down') if the starter is not alive."""
        if starter not in alive:
            raise ValueError("starter is down")
        messages = 0
        ran = set()
        pending = [starter]
        leader = None
        while pending:
            node = pending.pop(0)
            if node in ran:
                continue
            ran.add(node)
            higher = [n for n in all_nodes if n > node]
            messages += len(higher)
            higher_alive = [n for n in higher if n in alive]
            messages += len(higher_alive)
            if higher_alive:
                pending.extend(higher_alive)
            else:
                leader = node
                messages += len([n for n in alive if n != node])
        return leader, messages


    def new_acceptor():
        """An acceptor remembers the highest proposal number it has PROMISED and the proposal (number, value) it has ACCEPTED: {"promised": 0, "accepted": None}."""
        return {"promised": 0, "accepted": None}


    def prepare(acceptor, n):
        """Phase 1b. If n is higher than anything promised so far, promise it: set promised = n and return (True, the accepted proposal or None). Otherwise return (False, None)."""
        if n > acceptor["promised"]:
            acceptor["promised"] = n
            return True, acceptor["accepted"]
        return False, None


    def accept(acceptor, n, value):
        """Phase 2b. Accept the proposal if n is at least the promised number: set promised = n and accepted = (n, value) and return True. Otherwise return False."""
        if n >= acceptor["promised"]:
            acceptor["promised"] = n
            acceptor["accepted"] = (n, value)
            return True
        return False


    def propose(acceptors, up, n, value):
        """Single-decree Paxos from one proposer. `acceptors` maps names to acceptor dicts; `up` lists the reachable names (sorted order when contacting). A MAJORITY is len(acceptors) // 2 + 1. Phase 1: send prepare(n) to every reachable acceptor; if fewer than a majority promise, return None.
        Choose the value: if any promise reported an accepted proposal, use the value of the one with the HIGHEST number; otherwise use `value`. Phase 2: send accept(n, chosen) to every reachable acceptor; if a majority accept, return the chosen value, else None."""
        majority = len(acceptors) // 2 + 1
        reachable = sorted(set(up) & set(acceptors))
        promises = []
        for name in reachable:
            ok, accepted = prepare(acceptors[name], n)
            if ok:
                promises.append(accepted)
        if len(promises) < majority:
            return None
        reported = [a for a in promises if a is not None]
        chosen = max(reported, key=lambda a: a[0])[1] if reported else value
        acks = sum(1 for name in reachable if accept(acceptors[name], n, chosen))
        return chosen if acks >= majority else None

    print("bully with 5 nodes, node 5 failed, node 2 notices:", bully_election([1, 2, 3, 4, 5], [1, 2, 3, 4], 2))
    acceptors = {n: new_acceptor() for n in "abc"}
    print("proposer 1:", propose(acceptors, ["a", "b", "c"], 1, "red"))
    print("proposer 2 (wants blue):", propose(acceptors, ["b", "c"], 2, "blue"))
    print("acceptors hold:", {n: a["accepted"] for n, a in acceptors.items()})
  output: |
    bully with 5 nodes, node 5 failed, node 2 notices: (4, 12)
    proposer 1: red
    proposer 2 (wants blue): red
    acceptors hold: {'a': (1, 'red'), 'b': (2, 'red'), 'c': (2, 'red')}
  lines:
  - line: 67
    note: Node 4 is the highest live node, so it wins.
  - line: 70
    note: The second proposer must keep the first value.
  - line: 71
    note: Every reachable acceptor holds red.
- title: Raft elections
  intro: A partitioned minority fails to elect a leader; the majority succeeds.
  code: |
    def last_log_info(log):
        """(term of the last entry, number of entries) of a log, which is a list of (term, command); (0, 0) for an empty log."""
        return (log[-1][0] if log else 0, len(log))


    def request_vote(voter, term, candidate, last_log_term, last_log_index):
        """A Raft voter decides whether to vote. The voter is {"term": t, "voted_for": name or None, "log": [...]}. Return (granted, new_voter) where new_voter is a COPY (never change the input). Rules: if the request's term is lower than the voter's term, DENY. If it is higher, the
        voter first moves to that term and forgets its vote (voted_for = None). It GRANTS (and sets voted_for to the candidate) only if it has not voted in this term for a different candidate AND the candidate's log is at least as up to date as its own: compare (last_log_term, last_log_index) with the
        voter's own last_log_info as tuples, and the candidate's must be >=. A denial caused by a stale term leaves the voter unchanged; other denials keep the (possibly updated) term."""
        new = {"term": voter["term"], "voted_for": voter["voted_for"], "log": list(voter["log"])}
        if term < new["term"]:
            return False, new
        if term > new["term"]:
            new["term"] = term
            new["voted_for"] = None
        up_to_date = (last_log_term, last_log_index) >= last_log_info(new["log"])
        if new["voted_for"] in (None, candidate) and up_to_date:
            new["voted_for"] = candidate
            return True, new
        return False, new


    def run_election(voters, candidate, term, reachable):
        """The candidate asks every reachable voter (in sorted name order, ITSELF included if reachable) with request_vote, using its own log's last_log_info. Return (won, sorted list of voters that granted, new voters dict). A candidate not in `reachable`
        gets no votes. WON means the votes are a majority of ALL voters (len(voters) // 2 + 1). Voters that were not asked, and the input dict, are not changed (voters is {name: voter dict})."""
        new = {n: {"term": v["term"], "voted_for": v["voted_for"], "log": list(v["log"])} for n, v in voters.items()}
        granted = []
        if candidate in reachable:
            info = last_log_info(voters[candidate]["log"])
            for name in sorted(set(reachable) & set(voters)):
                ok, new[name] = request_vote(new[name], term, candidate, info[0], info[1])
                if ok:
                    granted.append(name)
        return len(granted) >= len(voters) // 2 + 1, sorted(granted), new

    def run_elections(voters, attempts):
        """Run a sequence of election attempts, each (candidate, term, reachable), one after another, with voter state carried from each to the next (use run_election). Return a list of outcomes (candidate, term, won, tuple of granting voters)."""
        state = voters
        outcomes = []
        for candidate, term, reachable in attempts:
            won, granted, state = run_election(state, candidate, term, reachable)
            outcomes.append((candidate, term, won, tuple(granted)))
        return outcomes


    def leaders_by_term(outcomes):
        """Raft's election safety: at most ONE leader per term. From a list of outcomes (candidate, term, won, votes) return {term: the winning candidate} for terms that had a winner; ValueError('two leaders in term T') if two different winners exist for the same term T."""
        leaders = {}
        for candidate, term, won, votes in outcomes:
            if won:
                if term in leaders and leaders[term] != candidate:
                    raise ValueError("two leaders in term %d" % term)
                leaders[term] = candidate
        return leaders

    voters = {n: {"term": 0, "voted_for": None, "log": []} for n in "abcde"}
    attempts = [("a", 1, ["a", "b"]), ("c", 2, ["c", "d", "e"]), ("a", 3, ["a", "b", "c", "d", "e"])]
    for candidate, term, won, votes in run_elections(voters, attempts):
        print("term", term, "candidate", candidate, "won" if won else "lost", "with votes from", list(votes))
  output: |
    term 1 candidate a lost with votes from ['a', 'b']
    term 2 candidate c won with votes from ['c', 'd', 'e']
    term 3 candidate a won with votes from ['a', 'b', 'c', 'd', 'e']
  lines:
  - line: 40
    note: Two of five servers cannot win; three of five can.
