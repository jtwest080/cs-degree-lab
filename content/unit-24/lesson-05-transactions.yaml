  title: Two-phase commit and blocking
  difficulty: 5
  prompt: 'What if one transaction must change data on several machines, all or none? **Two-phase commit** (2PC) uses a coordinator. **Phase 1:** each participant votes `"yes"` (it has prepared and can commit) or `"no"`, or does not reply (`None`). **Phase 2:** if everyone voted yes the coordinator tells all to commit, otherwise to abort. Write `decide(votes)` for `{participant: "yes" | "no" | None}`: `"commit"` only if **every** participant voted yes, otherwise `"abort"`; `ValueError("no participants")` for an empty dict. Write `run_2pc(votes, crash=None)`. A participant that did **not** vote yes aborts at once (state `"aborted"`). A yes-voter waits in state `"uncertain"` until it hears the decision. With `crash=None`, every yes-voter receives the decision and ends `"committed"` or `"aborted"`. With `crash="before_decision"` the coordinator dies after collecting the votes but before telling anyone: the decision is `None` and every yes-voter stays `"uncertain"`. With `crash="after_decision"` the coordinator dies after deciding but delivers the decision only to the **first** yes-voter in sorted order; the other yes-voters stay `"uncertain"`. Return `{"decision": the decision or None, "states": {participant: state}}`. Write `cooperative_termination(states)`: uncertain participants ask each other. If **any** participant is `"committed"`, every uncertain one becomes `"committed"`; otherwise if any is `"aborted"`, every uncertain one becomes `"aborted"`; otherwise nothing is learned. Return `(new_states, blocked)` where `blocked` is true if some participant is still uncertain. Do not change the input.'
  starter: |-
    def decide(votes):
        """The coordinator's decision from the votes {participant: 'yes' | 'no' | None} (None means no reply): 'commit' only if EVERY participant voted 'yes', otherwise 'abort'. ValueError('no participants') for an empty dict."""
        pass


    def run_2pc(votes, crash=None):
        """Two-phase commit. Phase 1: every participant has voted (or not replied). A participant that did NOT vote 'yes' aborts at once (state 'aborted'). Phase 2: the coordinator sends its decision. `crash` says what goes wrong:
        None: every 'yes' voter receives the decision and ends 'committed' or 'aborted' accordingly. 'before_decision': the coordinator dies after collecting the votes but before telling anyone: decision None and every 'yes' voter is stuck in 'uncertain'.
        'after_decision': the coordinator dies after the decision is made but delivers it only to the FIRST 'yes' voter in sorted order; the other 'yes' voters stay 'uncertain'. Return {'decision': the decision or None, 'states': {participant: state}}."""
        pass


    def cooperative_termination(states):
        """Uncertain participants ask each other. If ANY participant is 'committed', every 'uncertain' one becomes 'committed'; otherwise, if any is 'aborted', every 'uncertain' one becomes 'aborted'; otherwise nothing can be learned. Return (new_states, blocked) where blocked is True if
        some participant is still 'uncertain' afterwards (it must wait for the coordinator to come back). The input is not changed."""
        pass
  tests:
  - name: the decision
    code: |
      assert decide({"a": "yes", "b": "yes"}) == "commit"
      assert decide({"a": "yes", "b": "no"}) == "abort"
      assert decide({"a": "yes", "b": None}) == "abort"
      assert decide({"a": "yes"}) == "commit" and decide({"a": "no"}) == "abort"
      try:
          decide({})
          raise AssertionError("accepted")
      except ValueError as e:
          assert "no participants" in str(e)
  - name: a normal run
    code: |
      assert run_2pc({"a": "yes", "b": "yes", "c": "yes"}) == {"decision": "commit", "states": {"a": "committed", "b": "committed", "c": "committed"}}
      assert run_2pc({"a": "yes", "b": "no", "c": "yes"}) == {"decision": "abort", "states": {"a": "aborted", "b": "aborted", "c": "aborted"}}
      assert run_2pc({"a": "yes", "b": None}) == {"decision": "abort", "states": {"a": "aborted", "b": "aborted"}}
  - name: the coordinator crashes
    code: |
      r = run_2pc({"a": "yes", "b": "yes", "c": "no"}, "before_decision")
      assert r == {"decision": None, "states": {"a": "uncertain", "b": "uncertain", "c": "aborted"}}
      r = run_2pc({"a": "yes", "b": "yes", "c": "yes"}, "after_decision")
      assert r == {"decision": "commit", "states": {"a": "committed", "b": "uncertain", "c": "uncertain"}}
      r = run_2pc({"a": "yes", "b": "no", "c": "yes"}, "after_decision")
      assert r == {"decision": "abort", "states": {"a": "aborted", "b": "aborted", "c": "uncertain"}}
      r = run_2pc({"a": "no", "b": "no"}, "after_decision")
      assert r["states"] == {"a": "aborted", "b": "aborted"}
      assert run_2pc({"x": "yes"}, "before_decision")["states"] == {"x": "uncertain"}
  - name: participants help each other
    code: |
      states = {"a": "committed", "b": "uncertain", "c": "uncertain"}
      assert cooperative_termination(states) == ({"a": "committed", "b": "committed", "c": "committed"}, False)
      assert states == {"a": "committed", "b": "uncertain", "c": "uncertain"}
      assert cooperative_termination({"a": "aborted", "b": "uncertain"}) == ({"a": "aborted", "b": "aborted"}, False)
      assert cooperative_termination({"a": "uncertain", "b": "uncertain"}) == ({"a": "uncertain", "b": "uncertain"}, True)
      assert cooperative_termination({}) == ({}, False)
      r = run_2pc({"a": "yes", "b": "yes", "c": "no"}, "before_decision")
      assert cooperative_termination(r["states"]) == ({"a": "aborted", "b": "aborted", "c": "aborted"}, False)
      r = run_2pc({"a": "yes", "b": "yes"}, "before_decision")
      assert cooperative_termination(r["states"])[1] is True
  hints:
  - A participant that voted yes has promised to commit if told to, so it cannot decide alone.
  solution: |
    def decide(votes):
        """The coordinator's decision from the votes {participant: 'yes' | 'no' | None} (None means no reply): 'commit' only if EVERY participant voted 'yes', otherwise 'abort'. ValueError('no participants') for an empty dict."""
        if not votes:
            raise ValueError("no participants")
        return "commit" if all(v == "yes" for v in votes.values()) else "abort"


    def run_2pc(votes, crash=None):
        """Two-phase commit. Phase 1: every participant has voted (or not replied). A participant that did NOT vote 'yes' aborts at once (state 'aborted'). Phase 2: the coordinator sends its decision. `crash` says what goes wrong:
        None: every 'yes' voter receives the decision and ends 'committed' or 'aborted' accordingly. 'before_decision': the coordinator dies after collecting the votes but before telling anyone: decision None and every 'yes' voter is stuck in 'uncertain'.
        'after_decision': the coordinator dies after the decision is made but delivers it only to the FIRST 'yes' voter in sorted order; the other 'yes' voters stay 'uncertain'. Return {'decision': the decision or None, 'states': {participant: state}}."""
        states = {p: ("uncertain" if v == "yes" else "aborted") for p, v in votes.items()}
        if crash == "before_decision":
            return {"decision": None, "states": states}
        decision = decide(votes)
        outcome = "committed" if decision == "commit" else "aborted"
        yes = sorted(p for p, v in votes.items() if v == "yes")
        told = yes[:1] if crash == "after_decision" else yes
        for p in told:
            states[p] = outcome
        return {"decision": decision, "states": states}


    def cooperative_termination(states):
        """Uncertain participants ask each other. If ANY participant is 'committed', every 'uncertain' one becomes 'committed'; otherwise, if any is 'aborted', every 'uncertain' one becomes 'aborted'; otherwise nothing can be learned. Return (new_states, blocked) where blocked is True if
        some participant is still 'uncertain' afterwards (it must wait for the coordinator to come back). The input is not changed."""
        new = dict(states)
        for outcome in ("committed", "aborted"):
            if outcome in states.values():
                for p, s in states.items():
                    if s == "uncertain":
                        new[p] = outcome
                break
        return new, "uncertain" in new.values()
  explanation: 'Two-phase commit is simple and safe but can block: uncertain participants must wait for the coordinator.'
- id: saga
  title: Sagas and compensation
  difficulty: 5
  prompt: 'Locking many machines for a whole business transaction is slow, so long-running work is often a **saga**: a sequence of local steps, each with a **compensating action** that undoes it if a later step fails. Write `saga_events(steps, fail_at)`: `steps` is a list of step names run in order; return the list of events `("do", name)` for each step that runs; if the step at index `fail_at` fails (`fail_at` is `None` for no failure), record `("fail", name)` and then `("undo", name)` for every step that had completed, in **reverse** order, and stop. Raise `ValueError("bad index")` if `fail_at` is not `None` and not a valid step index. Write `transfer_saga(accounts, ops)`: `accounts` maps names to balances (not changed); `ops` is a list of `("debit", account, amount)` or `("credit", account, amount)`. A debit fails if the account does not exist or has less than the amount; a credit fails if the account does not exist. Run the operations in order on a copy; if one fails, undo the completed ones in reverse (a debit is undone by crediting the same amount, a credit by debiting it). Return `(success, final accounts, log)`, where the log lists `("do", op)` for each operation that succeeded, then `("fail", op)` for the failing one and `("undo", op)` for each compensation, in the order they happened.'
  starter: |-
    def saga_events(steps, fail_at):
        """A saga is a list of step names run in order, each with a compensating action. Return the list of events: ('do', name) for each step that runs; if the step at index `fail_at` fails (fail_at is None for no failure) record ('fail', name) and then ('undo', name) for every
        step that had completed, in REVERSE order, and stop. ValueError('bad index') if fail_at is not None and not a valid step index."""
        pass


    def transfer_saga(accounts, ops):
        """Run money operations as a saga. `accounts` maps account names to balances (not changed); ops is a list of ('debit', account, amount) or ('credit', account, amount). A debit fails if the account does not exist or has less than the amount; a credit fails if the account does not
        exist. Run the operations in order on a copy. If one fails, undo the completed ones in reverse order (a debit is undone by crediting the same amount, a credit by debiting it). Return (success, final accounts, log) where log lists ('do', op) for each operation that
        succeeded, then ('fail', op) for the failing one and ('undo', op) for each compensation, in the order they happened."""
        pass
  tests:
  - name: events of a saga
    code: |
      steps = ["reserve seat", "charge card", "send ticket"]
      assert saga_events(steps, None) == [("do", "reserve seat"), ("do", "charge card"), ("do", "send ticket")]
      assert saga_events(steps, 2) == [("do", "reserve seat"), ("do", "charge card"), ("fail", "send ticket"), ("undo", "charge card"), ("undo", "reserve seat")]
      assert saga_events(steps, 0) == [("fail", "reserve seat")]
      assert saga_events([], None) == []
      for bad in (3, -1):
          try:
              saga_events(steps, bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad index" in str(e)
  - name: a transfer that works
    code: |
      acc = {"a": 100, "b": 5}
      ok, final, log = transfer_saga(acc, [("debit", "a", 40), ("credit", "b", 40)])
      assert ok and final == {"a": 60, "b": 45}
      assert log == [("do", ("debit", "a", 40)), ("do", ("credit", "b", 40))]
      assert acc == {"a": 100, "b": 5}
      assert transfer_saga(acc, []) == (True, acc, [])
  - name: a transfer that is undone
    code: |
      acc = {"a": 100, "b": 5}
      ok, final, log = transfer_saga(acc, [("debit", "a", 40), ("credit", "zzz", 40)])
      assert not ok and final == acc
      assert log == [("do", ("debit", "a", 40)), ("fail", ("credit", "zzz", 40)), ("undo", ("debit", "a", 40))]
      ok, final, log = transfer_saga(acc, [("debit", "a", 500)])
      assert not ok and final == acc and log == [("fail", ("debit", "a", 500))]
      ok, final, log = transfer_saga(acc, [("debit", "a", 10), ("credit", "b", 10), ("debit", "b", 1000)])
      assert not ok and final == acc
      assert log[-2:] == [("undo", ("credit", "b", 10)), ("undo", ("debit", "a", 10))]
      assert acc == {"a": 100, "b": 5}
  - name: money is never created or lost
    code: |
      import random
      rng = random.Random(4)
      names = ["a", "b", "c", "ghost"]
      for trial in range(100):
          acc = {"a": rng.randrange(0, 50), "b": rng.randrange(0, 50), "c": rng.randrange(0, 50)}
          ops = []
          for _ in range(rng.randrange(1, 6)):
              ops.append((rng.choice(["debit", "credit"]), names[rng.randrange(4)], rng.randrange(1, 40)))
          ok, final, log = transfer_saga(acc, ops)
          if not ok:
              assert final == acc
          else:
              credits = sum(o[2] for o in ops if o[0] == "credit")
              debits = sum(o[2] for o in ops if o[0] == "debit")
              assert sum(final.values()) == sum(acc.values()) + credits - debits
  hints:
  - Undo only the steps that completed, newest first.
  solution: |
    def saga_events(steps, fail_at):
        """A saga is a list of step names run in order, each with a compensating action. Return the list of events: ('do', name) for each step that runs; if the step at index `fail_at` fails (fail_at is None for no failure) record ('fail', name) and then ('undo', name) for every
        step that had completed, in REVERSE order, and stop. ValueError('bad index') if fail_at is not None and not a valid step index."""
        if fail_at is not None and not 0 <= fail_at < len(steps):
            raise ValueError("bad index")
        events = []
        for i, name in enumerate(steps):
            if i == fail_at:
                events.append(("fail", name))
                events.extend(("undo", s) for s in reversed(steps[:i]))
                return events
            events.append(("do", name))
        return events


    def transfer_saga(accounts, ops):
        """Run money operations as a saga. `accounts` maps account names to balances (not changed); ops is a list of ('debit', account, amount) or ('credit', account, amount). A debit fails if the account does not exist or has less than the amount; a credit fails if the account does not
        exist. Run the operations in order on a copy. If one fails, undo the completed ones in reverse order (a debit is undone by crediting the same amount, a credit by debiting it). Return (success, final accounts, log) where log lists ('do', op) for each operation that
        succeeded, then ('fail', op) for the failing one and ('undo', op) for each compensation, in the order they happened."""
        balances = dict(accounts)
        log = []
        done = []
        for op in ops:
            kind, acct, amount = op
            ok = acct in balances and (kind == "credit" or balances[acct] >= amount)
            if not ok:
                log.append(("fail", op))
                for prev in reversed(done):
                    pk, pa, pam = prev
                    balances[pa] += pam if pk == "debit" else -pam
                    log.append(("undo", prev))
                return False, balances, log
            balances[acct] += amount if kind == "credit" else -amount
            done.append(op)
            log.append(("do", op))
        return True, balances, log
  explanation: A saga gives up isolation, since others can see the half-done state, in exchange for never holding locks across machines.
- id: idempotent
  title: Exactly-once effects with idempotency
  difficulty: 4
  prompt: 'A network that retries gives you **at-least-once** delivery: the same request may arrive twice. To make the **effect** happen exactly once, make the operation **idempotent**: doing it twice equals doing it once. Write `idempotency_key(*parts)`: the first 16 hexadecimal characters of the SHA-256 (`hashlib`) of the parts converted with `str` and joined with `"|"`. Write `apply_once(state, request_id, amount)`: `state` is `{"balance": number, "seen": set of request ids}`; if the id has not been seen add the amount and remember the id; if it has, change nothing. Return `(new_state, applied)` where `new_state` is a **new** dict with a **new** set (the input is not changed) and `applied` says whether the amount was added. Write `apply_all(requests)`: process a list of `(request_id, amount)` pairs in order, from a balance of 0 and no ids seen, using `apply_once`, and return the final balance. Write `apply_with_window(requests, window)`: like `apply_all`, but remember only the **most recent** `window` distinct ids that were applied (bounded memory). A duplicate whose id was already forgotten is applied again. Remembering an id puts it at the newest end; when more than `window` ids are remembered, forget the oldest.'
  starter: |-
    import hashlib


    def idempotency_key(*parts):
        """A deterministic key for a request: the first 16 hexadecimal characters of the SHA-256 of the parts joined with '|' (each converted with str)."""
        pass


    def apply_once(state, request_id, amount):
        """Idempotent processing. `state` is {'balance': number, 'seen': set of request ids}. If the request id has not been seen, add the amount and remember the id; if it has, change nothing. Return (new_state, applied) where new_state is a NEW dict with a NEW set
        (the input is not changed) and applied says whether the amount was added."""
        pass


    def apply_all(requests):
        """Process a list of (request_id, amount) pairs, in order, starting from a balance of 0 and no ids seen, using apply_once, and return the final balance. Duplicate ids (from retries) count once."""
        pass


    def apply_with_window(requests, window):
        """Like apply_all, but remember only the MOST RECENT `window` distinct request ids that were applied (bounded memory). A duplicate whose id has already been forgotten is applied again. Remembering an id puts it at the newest end; when more than `window` ids are
        remembered, forget the oldest. Return the final balance."""
        pass
  tests:
  - name: keys
    code: |
      k = idempotency_key("alice", "pay", 25)
      assert len(k) == 16 and all(c in "0123456789abcdef" for c in k)
      assert k == idempotency_key("alice", "pay", 25) and k != idempotency_key("alice", "pay", 26)
      import hashlib
      assert idempotency_key("a", 1) == hashlib.sha256(b"a|1").hexdigest()[:16]
      assert idempotency_key("only") == hashlib.sha256(b"only").hexdigest()[:16]
  - name: applying once
    code: |
      state = {"balance": 10, "seen": set()}
      s1, applied = apply_once(state, "r1", 5)
      assert applied and s1 == {"balance": 15, "seen": {"r1"}}
      s2, applied = apply_once(s1, "r1", 5)
      assert not applied and s2 == s1
      s3, applied = apply_once(s2, "r2", -3)
      assert applied and s3["balance"] == 12 and s3["seen"] == {"r1", "r2"}
      assert state == {"balance": 10, "seen": set()} and s1["seen"] == {"r1"}
      assert s2["seen"] is not s1["seen"]
  - name: duplicates from retries
    code: |
      requests = [("a", 10), ("b", 5), ("a", 10), ("c", -2), ("b", 5), ("a", 10)]
      assert apply_all(requests) == 13
      assert apply_all([]) == 0
      assert apply_all([("x", 1)] * 5) == 1
      assert apply_all([("p", 100), ("q", 100), ("p", 100), ("q", 100)]) == 200
  - name: a bounded memory
    code: |
      requests = [("a", 10), ("b", 5), ("c", 1), ("a", 10), ("b", 5)]
      assert apply_with_window(requests, 10) == apply_all(requests) == 16
      assert apply_with_window(requests, 2) == 10 + 5 + 1 + 10 + 5 + 0 or apply_with_window(requests, 2) == 31
      assert apply_with_window(requests, 3) == 16 + 10 or apply_with_window(requests, 3) == 16
      assert apply_with_window([("a", 1), ("a", 1)], 1) == 1
      assert apply_with_window([("a", 1), ("b", 1), ("a", 1)], 1) == 3
      assert apply_with_window([], 5) == 0
  hints:
  - Keep a set of request ids that you have already applied.
  solution: |
    import hashlib


    def idempotency_key(*parts):
        """A deterministic key for a request: the first 16 hexadecimal characters of the SHA-256 of the parts joined with '|' (each converted with str)."""
        return hashlib.sha256("|".join(str(p) for p in parts).encode()).hexdigest()[:16]


    def apply_once(state, request_id, amount):
        """Idempotent processing. `state` is {'balance': number, 'seen': set of request ids}. If the request id has not been seen, add the amount and remember the id; if it has, change nothing. Return (new_state, applied) where new_state is a NEW dict with a NEW set
        (the input is not changed) and applied says whether the amount was added."""
        seen = set(state["seen"])
        if request_id in seen:
            return {"balance": state["balance"], "seen": seen}, False
        seen.add(request_id)
        return {"balance": state["balance"] + amount, "seen": seen}, True


    def apply_all(requests):
        """Process a list of (request_id, amount) pairs, in order, starting from a balance of 0 and no ids seen, using apply_once, and return the final balance. Duplicate ids (from retries) count once."""
        state = {"balance": 0, "seen": set()}
        for rid, amount in requests:
            state, _ = apply_once(state, rid, amount)
        return state["balance"]


    def apply_with_window(requests, window):
        """Like apply_all, but remember only the MOST RECENT `window` distinct request ids that were applied (bounded memory). A duplicate whose id has already been forgotten is applied again. Remembering an id puts it at the newest end; when more than `window` ids are
        remembered, forget the oldest. Return the final balance."""
        recent = []
        balance = 0
        for rid, amount in requests:
            if rid in recent:
                continue
            balance += amount
            recent.append(rid)
            if len(recent) > window:
                recent.pop(0)
        return balance
  explanation: Retries plus idempotency give exactly-once effects, the practical alternative to exactly-once delivery.
- id: txn
  title: 'Capstone: transactions across shards'
  difficulty: 5
  prompt: 'Combine locking and two-phase commit. A shard is `{"data": {}, "locks": {key: transaction holding it}, "pending": {tx: {key: value}}}`. Write `new_shard()`. Write `prepare(shard, tx, writes)`, **phase 1** on one shard: if any key in `writes` is locked by a **different** transaction, vote no, return `False` and change nothing. Otherwise lock every key for `tx`, store a **copy** of `writes` as pending for `tx` and return `True`. Write `commit(shard, tx)`: apply `tx`''s pending writes to the data, release its locks and forget it; `ValueError("not prepared")` if `tx` has nothing pending. Write `abort(shard, tx)`: drop `tx`''s pending writes and release its locks (harmless if `tx` is unknown). Write `transact(shards, tx, plan)`: `shards` maps names to shards; `plan` maps shard names to `{key: value}` writes. Phase 1: prepare each shard in **sorted name order**; if any votes no, abort every shard that had already prepared and return `"aborted"`. If all vote yes, commit all of them in sorted name order and return `"committed"`. Raise `ValueError("unknown shard")` **before touching anything** if the plan names a shard that does not exist.'
  starter: |-
    def new_shard():
        """A shard that takes part in transactions: {"data": {}, "locks": {key: tx holding the lock}, "pending": {tx: {key: value}}}."""
        pass


    def prepare(shard, tx, writes):
        """Phase 1 on one shard. If any key in `writes` is locked by a DIFFERENT transaction, vote no: return False and change nothing. Otherwise lock every key for tx, remember writes as pending for tx (a copy) and return True."""
        pass


    def commit(shard, tx):
        """Phase 2: apply tx's pending writes to the data, release its locks and forget it. ValueError('not prepared') if tx has nothing pending."""
        pass


    def abort(shard, tx):
        """Phase 2 (other branch): drop tx's pending writes and release its locks. Harmless if tx is unknown."""
        pass


    def transact(shards, tx, plan):
        """Two-phase commit across shards. `shards` maps names to shards; `plan` maps shard names to {key: value} writes. Phase 1: prepare each shard in SORTED name order; if any votes no, abort every shard that had already prepared and return 'aborted'. If all vote yes, commit all of them (in sorted name order) and
        return 'committed'. ValueError('unknown shard') (before touching anything) if the plan names a shard that does not exist."""
        pass
  tests:
  - name: one shard
    code: |
      s = new_shard()
      assert s == {"data": {}, "locks": {}, "pending": {}}
      w = {"x": 1, "y": 2}
      assert prepare(s, "t1", w) is True
      assert s["locks"] == {"x": "t1", "y": "t1"} and s["pending"] == {"t1": {"x": 1, "y": 2}} and s["data"] == {}
      w["x"] = 99
      assert s["pending"]["t1"]["x"] == 1
      assert prepare(s, "t2", {"y": 5, "z": 6}) is False
      assert s["locks"] == {"x": "t1", "y": "t1"} and "t2" not in s["pending"]
      assert prepare(s, "t2", {"z": 6}) is True
      commit(s, "t1")
      assert s["data"] == {"x": 1, "y": 2} and s["locks"] == {"z": "t2"} and "t1" not in s["pending"]
      abort(s, "t2")
      assert s["locks"] == {} and s["pending"] == {}
      abort(s, "nobody")
      try:
          commit(s, "t9")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "not prepared" in str(e)
  - name: a transaction across shards
    code: |
      shards = {"east": new_shard(), "west": new_shard()}
      assert transact(shards, "t1", {"east": {"alice": 50}, "west": {"bob": 70}}) == "committed"
      assert shards["east"]["data"] == {"alice": 50} and shards["west"]["data"] == {"bob": 70}
      assert all(s["locks"] == {} and s["pending"] == {} for s in shards.values())
      assert transact(shards, "t2", {"east": {"alice": 40}}) == "committed" and shards["east"]["data"] == {"alice": 40}
      try:
          transact(shards, "t3", {"east": {"q": 1}, "mars": {"q": 1}})
          raise AssertionError("accepted")
      except ValueError as e:
          assert "unknown shard" in str(e)
      assert shards["east"]["locks"] == {} and "q" not in shards["east"]["data"]
  - name: conflicts abort everything
    code: |
      shards = {"a": new_shard(), "b": new_shard(), "c": new_shard()}
      assert prepare(shards["b"], "blocker", {"k": 0}) is True
      result = transact(shards, "t1", {"a": {"x": 1}, "b": {"k": 5}, "c": {"y": 2}})
      assert result == "aborted"
      assert shards["a"]["data"] == {} and shards["c"]["data"] == {}
      assert shards["a"]["locks"] == {} and shards["a"]["pending"] == {} and shards["c"]["locks"] == {} and "t1" not in shards["b"]["pending"]
      assert shards["b"]["locks"] == {"k": "blocker"}
      commit(shards["b"], "blocker")
      assert transact(shards, "t2", {"a": {"x": 1}, "b": {"k": 5}, "c": {"y": 2}}) == "committed"
      assert shards["b"]["data"] == {"k": 5} and shards["a"]["data"] == {"x": 1} and shards["c"]["data"] == {"y": 2}
  - name: all or nothing
    code: |
      import random
      rng = random.Random(11)
      shards = {n: new_shard() for n in "abcd"}
      held = {}
      for i in range(60):
          tx = "t%d" % i
          plan = {n: {"k%d" % rng.randrange(3): i} for n in "abcd" if rng.random() < 0.6}
          if not plan:
              continue
          if rng.random() < 0.3:
              victim = sorted(plan)[rng.randrange(len(plan))]
              key = sorted(plan[victim])[0]
              blocker = "blocker%d" % i
              assert prepare(shards[victim], blocker, {key: -1}) is True
              held[blocker] = victim
          before = {n: dict(shards[n]["data"]) for n in plan}
          result = transact(shards, tx, plan)
          for n in plan:
              if result == "committed":
                  for key, value in plan[n].items():
                      assert shards[n]["data"][key] == value
              else:
                  assert shards[n]["data"] == before[n]
          assert all(tx not in s["pending"] and tx not in s["locks"].values() for s in shards.values())
          for blocker, victim in list(held.items()):
              abort(shards[victim], blocker)
              del held[blocker]
  hints:
  - Prepare every shard first; only if all vote yes does anything change.
  solution: |
    def new_shard():
        """A shard that takes part in transactions: {"data": {}, "locks": {key: tx holding the lock}, "pending": {tx: {key: value}}}."""
        return {"data": {}, "locks": {}, "pending": {}}


    def prepare(shard, tx, writes):
        """Phase 1 on one shard. If any key in `writes` is locked by a DIFFERENT transaction, vote no: return False and change nothing. Otherwise lock every key for tx, remember writes as pending for tx (a copy) and return True."""
        if any(shard["locks"].get(k, tx) != tx for k in writes):
            return False
        for k in writes:
            shard["locks"][k] = tx
        shard["pending"][tx] = dict(writes)
        return True


    def commit(shard, tx):
        """Phase 2: apply tx's pending writes to the data, release its locks and forget it. ValueError('not prepared') if tx has nothing pending."""
        if tx not in shard["pending"]:
            raise ValueError("not prepared")
        shard["data"].update(shard["pending"].pop(tx))
        for k in [k for k, holder in shard["locks"].items() if holder == tx]:
            del shard["locks"][k]


    def abort(shard, tx):
        """Phase 2 (other branch): drop tx's pending writes and release its locks. Harmless if tx is unknown."""
        shard["pending"].pop(tx, None)
        for k in [k for k, holder in shard["locks"].items() if holder == tx]:
            del shard["locks"][k]


    def transact(shards, tx, plan):
        """Two-phase commit across shards. `shards` maps names to shards; `plan` maps shard names to {key: value} writes. Phase 1: prepare each shard in SORTED name order; if any votes no, abort every shard that had already prepared and return 'aborted'. If all vote yes, commit all of them (in sorted name order) and
        return 'committed'. ValueError('unknown shard') (before touching anything) if the plan names a shard that does not exist."""
        for name in plan:
            if name not in shards:
                raise ValueError("unknown shard")
        prepared = []
        for name in sorted(plan):
            if prepare(shards[name], tx, plan[name]):
                prepared.append(name)
            else:
                for p in prepared:
                    abort(shards[p], tx)
                return "aborted"
        for name in prepared:
            commit(shards[name], tx)
        return "committed"
  explanation: Two-phase commit with locks is how a distributed database makes a multi-shard change atomic.
commonMistakes:
- title: Changing data before writing the log
  explanation: A crash in between loses the information needed to recover.
- title: Committing a participant that never voted yes
  explanation: A commit decision requires every vote to be yes.
- title: Undoing a saga's steps in forward order
  explanation: Compensations run in reverse, like unwinding a stack.
- title: Retrying a non-idempotent operation
  explanation: A retried payment without a key can be charged twice.
- title: Forgetting to release locks on abort
  explanation: Other transactions would wait forever.
summary:
- ACID transactions are atomic, consistent, isolated and durable.
- A write-ahead log lets a machine recover all-or-nothing after a crash.
- Two-phase commit makes a multi-machine change atomic, but can block when the coordinator fails.
- Sagas use compensating actions instead of distributed locks.
- Idempotency keys turn at-least-once delivery into exactly-once effects.
- Sharded databases combine locks with two-phase commit.
