- id: wal
  title: Write-ahead logging and recovery
  difficulty: 5
  prompt: 'A single machine must also survive crashes without losing or half-applying a change. The classic tool is the **write-ahead log** (WAL): record an intention in a log on disk **before** changing the data. Write `recover(log, db=None)`, crash recovery. Log entries are `("begin", tx)`, `("write", tx, key, value)`, `("delete", tx, key)`, `("commit", tx)` and `("abort", tx)`. Start from a **copy** of `db` (empty if `None`) and **redo**, in log order, the writes and deletes of every transaction that **committed**; ignore transactions that aborted or were still running at the crash. Raise `ValueError("bad log")` for a malformed log: a `begin` for a transaction already begun; a write, delete, commit or abort for a transaction that has not begun or has already finished; or an unknown entry kind. Write `in_flight(log)`: the sorted list of transactions that began but neither committed nor aborted (same checks). Write `compact(log, db=None)`, a **checkpoint**: return `(snapshot, remaining_log)` where the snapshot is `recover(log, db)` and the remaining log keeps, in order, only the entries of transactions that are still in flight.'
  starter: |-
    def _check_log(log):
        pass


    def recover(log, db=None):
        """Crash recovery from a write-ahead log. Entries: ("begin", tx), ("write", tx, key, value), ("delete", tx, key), ("commit", tx), ("abort", tx). Start from a COPY of `db` (empty if None) and REDO, in log order, the writes and deletes of
        every transaction that COMMITTED; ignore transactions that aborted or were still running when the crash happened. ValueError('bad log') for a malformed log: a begin for a transaction already begun, a write, delete, commit or abort for a transaction that has not begun or has already finished,
        or an unknown entry kind. Return the new dict."""
        pass


    def in_flight(log):
        """The sorted list of transactions that began but neither committed nor aborted (same ValueError('bad log') checks)."""
        pass


    def compact(log, db=None):
        """Checkpointing: return (snapshot, remaining_log). The snapshot is recover(log, db); the remaining log keeps, in order, only the entries (begin, write, delete) of transactions that are still in flight."""
        pass
  tests:
  - name: redo committed work
    code: |
      log = [("begin", "t1"), ("write", "t1", "x", 1), ("begin", "t2"), ("write", "t2", "y", 2), ("commit", "t1"), ("write", "t2", "y", 3)]
      assert recover(log) == {"x": 1}
      assert recover(log, {"z": 9}) == {"x": 1, "z": 9}
      assert recover([]) == {} and recover([], {"a": 1}) == {"a": 1}
      log2 = [("begin", "a"), ("write", "a", "k", 1), ("commit", "a"), ("begin", "b"), ("write", "b", "k", 2), ("commit", "b")]
      assert recover(log2) == {"k": 2}
      db = {"x": 0}
      recover(log, db)
      assert db == {"x": 0}
  - name: deletes and aborts
    code: |
      log = [("begin", "t1"), ("delete", "t1", "x"), ("commit", "t1"), ("begin", "t2"), ("write", "t2", "q", 5), ("abort", "t2")]
      assert recover(log, {"x": 9, "y": 1}) == {"y": 1}
      assert recover([("begin", "t"), ("delete", "t", "nothing"), ("commit", "t")], {"a": 1}) == {"a": 1}
      assert in_flight(log) == []
  - name: what was still running
    code: |
      log = [("begin", "t3"), ("begin", "t1"), ("write", "t1", "a", 1), ("begin", "t2"), ("commit", "t1"), ("write", "t3", "b", 2)]
      assert in_flight(log) == ["t2", "t3"]
      assert in_flight([]) == []
      assert recover(log) == {"a": 1}
  - name: malformed logs
    code: |
      bad_logs = [[("write", "t", "k", 1)], [("begin", "t"), ("begin", "t")], [("begin", "t"), ("commit", "t"), ("write", "t", "k", 1)],
                  [("begin", "t"), ("commit", "t"), ("commit", "t")], [("commit", "ghost")], [("begin", "t"), ("explode", "t")], [("begin", "t"), ("abort", "t"), ("abort", "t")]]
      for bad in bad_logs:
          for f in (recover, in_flight):
              try:
                  f(bad)
                  raise AssertionError("accepted %r" % (bad,))
              except ValueError as e:
                  assert "bad log" in str(e)
  - name: checkpointing
    code: |
      log = [("begin", "t1"), ("write", "t1", "x", 1), ("begin", "t2"), ("write", "t2", "y", 2), ("commit", "t1"), ("write", "t2", "y", 3)]
      snapshot, rest = compact(log)
      assert snapshot == {"x": 1}
      assert rest == [("begin", "t2"), ("write", "t2", "y", 2), ("write", "t2", "y", 3)]
      snapshot2, rest2 = compact(rest, snapshot)
      assert snapshot2 == {"x": 1} and rest2 == rest
      assert compact([]) == ({}, [])
      done = [("begin", "a"), ("write", "a", "k", 1), ("commit", "a")]
      assert compact(done, {"z": 0}) == ({"k": 1, "z": 0}, [])
  hints:
  - Check the log first, then apply only what committed transactions wrote.
  solution: |
    def _check_log(log):
        state = {}
        for entry in log:
            kind, tx = entry[0], entry[1]
            if kind == "begin":
                if tx in state:
                    raise ValueError("bad log")
                state[tx] = "active"
            elif kind in ("write", "delete"):
                if state.get(tx) != "active":
                    raise ValueError("bad log")
            elif kind in ("commit", "abort"):
                if state.get(tx) != "active":
                    raise ValueError("bad log")
                state[tx] = "committed" if kind == "commit" else "aborted"
            else:
                raise ValueError("bad log")
        return state


    def recover(log, db=None):
        """Crash recovery from a write-ahead log. Entries: ("begin", tx), ("write", tx, key, value), ("delete", tx, key), ("commit", tx), ("abort", tx). Start from a COPY of `db` (empty if None) and REDO, in log order, the writes and deletes of
        every transaction that COMMITTED; ignore transactions that aborted or were still running when the crash happened. ValueError('bad log') for a malformed log: a begin for a transaction already begun, a write, delete, commit or abort for a transaction that has not begun or has already finished,
        or an unknown entry kind. Return the new dict."""
        state = _check_log(log)
        result = dict(db or {})
        for entry in log:
            if entry[0] == "write" and state[entry[1]] == "committed":
                result[entry[2]] = entry[3]
            elif entry[0] == "delete" and state[entry[1]] == "committed":
                result.pop(entry[2], None)
        return result


    def in_flight(log):
        """The sorted list of transactions that began but neither committed nor aborted (same ValueError('bad log') checks)."""
        state = _check_log(log)
        return sorted(tx for tx, s in state.items() if s == "active")


    def compact(log, db=None):
        """Checkpointing: return (snapshot, remaining_log). The snapshot is recover(log, db); the remaining log keeps, in order, only the entries (begin, write, delete) of transactions that are still in flight."""
        live = set(in_flight(log))
        return recover(log, db), [e for e in log if e[1] in live]
  explanation: A write-ahead log makes a change all-or-nothing even if the power fails halfway.
