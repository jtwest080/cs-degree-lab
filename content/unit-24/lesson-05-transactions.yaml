- type: code
  question: Write `writes_of(log, tx)` returning the dict of the last value written to each key by transaction `tx`, in a log of entries like `("write", tx, key, value)` (ignore other entries).
  starter: |
    def writes_of(log, tx):
        pass
  tests:
  - name: writes
    code: |
      log = [("begin", "a"), ("write", "a", "x", 1), ("write", "b", "x", 9), ("write", "a", "y", 2), ("write", "a", "x", 3), ("commit", "a")]
      assert writes_of(log, "a") == {"x": 3, "y": 2} and writes_of(log, "b") == {"x": 9} and writes_of(log, "zz") == {} and writes_of([], "a") == {}
  solution: |
    def writes_of(log, tx):
        result = {}
        for entry in log:
            if entry[0] == 'write' and entry[1] == tx:
                result[entry[2]] = entry[3]
        return result
