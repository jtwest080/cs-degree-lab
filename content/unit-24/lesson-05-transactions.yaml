- title: Sagas, retries and shards
  intro: Compensating a failed trip, counting retried payments once, and a transaction blocked by a lock.
  code: |
    def saga_events(steps, fail_at):
        """A saga is a list of step names run in order, each with a compensating action. Return the list of events: ('do', name) for each step that runs; if the step at index `fail_at` fails (fail_at is None for no failure) record ('fail', name) and then ('undo', name) for every
        step that had completed, in REVERSE order, and stop. ValueError('bad index') if fail_at is not None and not a valid step index."""
        if fail_at is not None and not 0 <= fail_at < len(steps):
            raise ValueError("bad index")
        events = []
        for i, name in enumerate(steps):
            if i == fail_at:
                events.append(("fail", name))
                events.extend(("undo", s) for s in reversed(steps[:i]))
                return events
            events.append(("do", name))
        return events


    def transfer_saga(accounts, ops):
        """Run money operations as a saga. `accounts` maps account names to balances (not changed); ops is a list of ('debit', account, amount) or ('credit', account, amount). A debit fails if the account does not exist or has less than the amount; a credit fails if the account does not
        exist. Run the operations in order on a copy. If one fails, undo the completed ones in reverse order (a debit is undone by crediting the same amount, a credit by debiting it). Return (success, final accounts, log) where log lists ('do', op) for each operation that
        succeeded, then ('fail', op) for the failing one and ('undo', op) for each compensation, in the order they happened."""
        balances = dict(accounts)
        log = []
        done = []
        for op in ops:
            kind, acct, amount = op
            ok = acct in balances and (kind == "credit" or balances[acct] >= amount)
            if not ok:
                log.append(("fail", op))
                for prev in reversed(done):
                    pk, pa, pam = prev
                    balances[pa] += pam if pk == "debit" else -pam
                    log.append(("undo", prev))
                return False, balances, log
            balances[acct] += amount if kind == "credit" else -amount
            done.append(op)
            log.append(("do", op))
        return True, balances, log


    import hashlib


    def idempotency_key(*parts):
        """A deterministic key for a request: the first 16 hexadecimal characters of the SHA-256 of the parts joined with '|' (each converted with str)."""
        return hashlib.sha256("|".join(str(p) for p in parts).encode()).hexdigest()[:16]


    def apply_once(state, request_id, amount):
        """Idempotent processing. `state` is {'balance': number, 'seen': set of request ids}. If the request id has not been seen, add the amount and remember the id; if it has, change nothing. Return (new_state, applied) where new_state is a NEW dict with a NEW set
        (the input is not changed) and applied says whether the amount was added."""
        seen = set(state["seen"])
        if request_id in seen:
            return {"balance": state["balance"], "seen": seen}, False
        seen.add(request_id)
        return {"balance": state["balance"] + amount, "seen": seen}, True


    def apply_all(requests):
        """Process a list of (request_id, amount) pairs, in order, starting from a balance of 0 and no ids seen, using apply_once, and return the final balance. Duplicate ids (from retries) count once."""
        state = {"balance": 0, "seen": set()}
        for rid, amount in requests:
            state, _ = apply_once(state, rid, amount)
        return state["balance"]


    def apply_with_window(requests, window):
        """Like apply_all, but remember only the MOST RECENT `window` distinct request ids that were applied (bounded memory). A duplicate whose id has already been forgotten is applied again. Remembering an id puts it at the newest end; when more than `window` ids are
        remembered, forget the oldest. Return the final balance."""
        recent = []
        balance = 0
        for rid, amount in requests:
            if rid in recent:
                continue
            balance += amount
            recent.append(rid)
            if len(recent) > window:
                recent.pop(0)
        return balance


    def new_shard():
        """A shard that takes part in transactions: {"data": {}, "locks": {key: tx holding the lock}, "pending": {tx: {key: value}}}."""
        return {"data": {}, "locks": {}, "pending": {}}


    def prepare(shard, tx, writes):
        """Phase 1 on one shard. If any key in `writes` is locked by a DIFFERENT transaction, vote no: return False and change nothing. Otherwise lock every key for tx, remember writes as pending for tx (a copy) and return True."""
        if any(shard["locks"].get(k, tx) != tx for k in writes):
            return False
        for k in writes:
            shard["locks"][k] = tx
        shard["pending"][tx] = dict(writes)
        return True


    def commit(shard, tx):
        """Phase 2: apply tx's pending writes to the data, release its locks and forget it. ValueError('not prepared') if tx has nothing pending."""
        if tx not in shard["pending"]:
            raise ValueError("not prepared")
        shard["data"].update(shard["pending"].pop(tx))
        for k in [k for k, holder in shard["locks"].items() if holder == tx]:
            del shard["locks"][k]


    def abort(shard, tx):
        """Phase 2 (other branch): drop tx's pending writes and release its locks. Harmless if tx is unknown."""
        shard["pending"].pop(tx, None)
        for k in [k for k, holder in shard["locks"].items() if holder == tx]:
            del shard["locks"][k]


    def transact(shards, tx, plan):
        """Two-phase commit across shards. `shards` maps names to shards; `plan` maps shard names to {key: value} writes. Phase 1: prepare each shard in SORTED name order; if any votes no, abort every shard that had already prepared and return 'aborted'. If all vote yes, commit all of them (in sorted name order) and
        return 'committed'. ValueError('unknown shard') (before touching anything) if the plan names a shard that does not exist."""
        for name in plan:
            if name not in shards:
                raise ValueError("unknown shard")
        prepared = []
        for name in sorted(plan):
            if prepare(shards[name], tx, plan[name]):
                prepared.append(name)
            else:
                for p in prepared:
                    abort(shards[p], tx)
                return "aborted"
        for name in prepared:
            commit(shards[name], tx)
        return "committed"

    print(saga_events(["book flight", "book hotel", "book car"], 2))
    ok, final, log = transfer_saga({"ann": 50, "bob": 10}, [("debit", "ann", 30), ("credit", "bob", 30), ("debit", "bob", 100)])
    print("saga ok:", ok, "balances:", final)
    print("retried requests counted once:", apply_all([("pay1", 20), ("pay2", 5), ("pay1", 20), ("pay1", 20)]))
    shards = {"east": new_shard(), "west": new_shard()}
    prepare(shards["west"], "other", {"seat": "taken"})
    print("conflicting transaction:", transact(shards, "t1", {"east": {"seat": "mine"}, "west": {"seat": "mine"}}))
    commit(shards["west"], "other")
    print("after the other one finishes:", transact(shards, "t2", {"east": {"seat": "mine"}, "west": {"seat": "mine"}}))
  output: |
    [('do', 'book flight'), ('do', 'book hotel'), ('fail', 'book car'), ('undo', 'book hotel'), ('undo', 'book flight')]
    saga ok: False balances: {'ann': 50, 'bob': 10}
    retried requests counted once: 25
    conflicting transaction: aborted
    after the other one finishes: committed
