id: u24-transactions
title: Distributed Transactions
minutes: 100
objective: 'Learn how several machines make a change together: all or nothing. You will write crash recovery from a write-ahead log, two-phase commit and its blocking problem, sagas with compensation, idempotent retries, and a sharded transaction manager with locks.'
outcomes:
- Explain atomicity and the write-ahead log
- Run two-phase commit and explain how it can block
- Design a saga with compensations
- Make retried operations idempotent
- Coordinate a transaction over several shards
sections:
- heading: Atomic changes and the write-ahead log
  body: |-
    A **transaction** groups several changes into one unit that follows four promises, remembered as **ACID**. **Atomicity**: all the changes happen or none do. **Consistency**: the data's rules still hold afterwards. **Isolation**: concurrent transactions do not see each other's half-finished work. **Durability**: once the system says "committed", the change survives a crash. Transferring 100 pounds between two accounts is the classic example: subtracting from one account and then crashing before adding to the other must never leave the money gone.

    How does one machine give atomicity and durability? With a **write-ahead log** (WAL). Before changing the data, the system appends a description of the change to a log on disk, and writes a `commit` record at the end. If the machine crashes, the **recovery** procedure reads the log: transactions with a `commit` record are **redone**, and those without are ignored or undone, as if they had never started. Disk writes to the data can then be done lazily, because the log is the truth. To keep the log from growing forever, the system occasionally takes a **checkpoint**: a snapshot of the state, after which the old log entries can be thrown away, apart from transactions still in flight. Almost every database, file system and message queue uses a WAL.
- heading: Two-phase commit and its weakness
  body: |-
    When a transaction touches **several machines**, each machine may succeed or fail on its own, yet the outcome must be the same everywhere. **Two-phase commit** (2PC) achieves it with one **coordinator** and several **participants**. In **phase 1**, the coordinator asks each participant to *prepare*: do everything needed to be able to commit (write the change to its log, take the locks) and then vote **yes** or **no**. A yes is a **promise**: the participant can no longer change its mind. In **phase 2**, if *all* voted yes the coordinator records the decision `commit` and tells everyone; if any voted no or did not answer, it decides `abort`. Participants then commit or abort and release their locks. The coordinator writes its decision to its own log before telling anyone, so it can resend after a crash.

    2PC is safe, but it can **block**. If the coordinator crashes after participants voted yes and before they hear the decision, those participants are **uncertain**: committing might contradict an abort decision and the other way round. They must hold their locks and wait for the coordinator to come back, and other transactions queue up behind those locks. Participants can ask each other (*cooperative termination*): if any knows the decision, everyone learns it; but if all are uncertain, nobody can proceed. A theoretical fix is **three-phase commit**, and the practical one is to make the coordinator itself fault-tolerant, for example by running it on a Raft or Paxos group, which is how Google Spanner works.
- heading: Sagas, idempotency and the real world
  body: |-
    Two-phase commit holds locks across machines while waiting for the slowest one, which is too costly for long business processes such as booking a flight, a hotel and a car from three companies who will never share a transaction manager. A **saga** replaces one big transaction with a sequence of small local ones, each paired with a **compensating action** that semantically undoes it (cancel the booking, refund the payment). If step three fails, run the compensations for steps two and one, in reverse. The price is that a saga is not isolated: other users can see the half-finished state, and a compensation is not always a perfect undo (an email already sent stays sent).

    All of these protocols retry messages, because networks lose them, so the same request may be received twice. Delivery guarantees come in three flavours. **At-most-once** (send and forget) may lose messages. **At-least-once** (retry until acknowledged) never loses a message but may duplicate it. True **exactly-once delivery** is impossible in general, but **exactly-once effect** is achievable by making the receiver **idempotent**: attach a unique **idempotency key** to each request, remember which keys were already processed, and ignore repeats. Payment systems such as Stripe's API ask clients to send such a key so that a retried charge is never charged twice. Remembering every key forever costs memory, so real systems keep keys for a limited window and accept a tiny risk beyond it. Taken together, WALs, two-phase commit, sagas and idempotency are the toolbox behind every system that moves money or inventory between machines.
examples:
- title: Crashes and two-phase commit
  intro: Recovery from a log, a normal commit, and what happens when the coordinator dies.
  code: |
    def _check_log(log):
        state = {}
        for entry in log:
            kind, tx = entry[0], entry[1]
            if kind == "begin":
                if tx in state:
                    raise ValueError("bad log")
                state[tx] = "active"
            elif kind in ("write", "delete"):
                if state.get(tx) != "active":
                    raise ValueError("bad log")
            elif kind in ("commit", "abort"):
                if state.get(tx) != "active":
                    raise ValueError("bad log")
                state[tx] = "committed" if kind == "commit" else "aborted"
            else:
                raise ValueError("bad log")
        return state


    def recover(log, db=None):
        """Crash recovery from a write-ahead log. Entries: ("begin", tx), ("write", tx, key, value), ("delete", tx, key), ("commit", tx), ("abort", tx). Start from a COPY of `db` (empty if None) and REDO, in log order, the writes and deletes of
        every transaction that COMMITTED; ignore transactions that aborted or were still running when the crash happened. ValueError('bad log') for a malformed log: a begin for a transaction already begun, a write, delete, commit or abort for a transaction that has not begun or has already finished,
        or an unknown entry kind. Return the new dict."""
        state = _check_log(log)
        result = dict(db or {})
        for entry in log:
            if entry[0] == "write" and state[entry[1]] == "committed":
                result[entry[2]] = entry[3]
            elif entry[0] == "delete" and state[entry[1]] == "committed":
                result.pop(entry[2], None)
        return result


    def in_flight(log):
        """The sorted list of transactions that began but neither committed nor aborted (same ValueError('bad log') checks)."""
        state = _check_log(log)
        return sorted(tx for tx, s in state.items() if s == "active")


    def compact(log, db=None):
        """Checkpointing: return (snapshot, remaining_log). The snapshot is recover(log, db); the remaining log keeps, in order, only the entries (begin, write, delete) of transactions that are still in flight."""
        live = set(in_flight(log))
        return recover(log, db), [e for e in log if e[1] in live]


    def decide(votes):
        """The coordinator's decision from the votes {participant: 'yes' | 'no' | None} (None means no reply): 'commit' only if EVERY participant voted 'yes', otherwise 'abort'. ValueError('no participants') for an empty dict."""
        if not votes:
            raise ValueError("no participants")
        return "commit" if all(v == "yes" for v in votes.values()) else "abort"


    def run_2pc(votes, crash=None):
        """Two-phase commit. Phase 1: every participant has voted (or not replied). A participant that did NOT vote 'yes' aborts at once (state 'aborted'). Phase 2: the coordinator sends its decision. `crash` says what goes wrong:
        None: every 'yes' voter receives the decision and ends 'committed' or 'aborted' accordingly. 'before_decision': the coordinator dies after collecting the votes but before telling anyone: decision None and every 'yes' voter is stuck in 'uncertain'.
        'after_decision': the coordinator dies after the decision is made but delivers it only to the FIRST 'yes' voter in sorted order; the other 'yes' voters stay 'uncertain'. Return {'decision': the decision or None, 'states': {participant: state}}."""
        states = {p: ("uncertain" if v == "yes" else "aborted") for p, v in votes.items()}
        if crash == "before_decision":
            return {"decision": None, "states": states}
        decision = decide(votes)
        outcome = "committed" if decision == "commit" else "aborted"
        yes = sorted(p for p, v in votes.items() if v == "yes")
        told = yes[:1] if crash == "after_decision" else yes
        for p in told:
            states[p] = outcome
        return {"decision": decision, "states": states}


    def cooperative_termination(states):
        """Uncertain participants ask each other. If ANY participant is 'committed', every 'uncertain' one becomes 'committed'; otherwise, if any is 'aborted', every 'uncertain' one becomes 'aborted'; otherwise nothing can be learned. Return (new_states, blocked) where blocked is True if
        some participant is still 'uncertain' afterwards (it must wait for the coordinator to come back). The input is not changed."""
        new = dict(states)
        for outcome in ("committed", "aborted"):
            if outcome in states.values():
                for p, s in states.items():
                    if s == "uncertain":
                        new[p] = outcome
                break
        return new, "uncertain" in new.values()

    log = [("begin", "t1"), ("write", "t1", "balance", 90), ("commit", "t1"), ("begin", "t2"), ("write", "t2", "balance", 0)]
    print("after a crash, recovered:", recover(log, {"balance": 100}))
    print("still running at the crash:", in_flight(log))
    print("all vote yes:", run_2pc({"bank": "yes", "shop": "yes"}))
    print("coordinator dies:", run_2pc({"bank": "yes", "shop": "yes", "mail": "yes"}, "after_decision"))
    states = run_2pc({"bank": "yes", "shop": "yes", "mail": "yes"}, "after_decision")["states"]
    print("they ask each other:", cooperative_termination(states))
    print("nobody knows:", cooperative_termination(run_2pc({"bank": "yes", "shop": "yes"}, "before_decision")["states"]))
  output: |
    after a crash, recovered: {'balance': 90}
    still running at the crash: ['t2']
    all vote yes: {'decision': 'commit', 'states': {'bank': 'committed', 'shop': 'committed'}}
    coordinator dies: {'decision': 'commit', 'states': {'bank': 'committed', 'shop': 'uncertain', 'mail': 'uncertain'}}
    they ask each other: ({'bank': 'committed', 'shop': 'committed', 'mail': 'committed'}, False)
    nobody knows: ({'bank': 'uncertain', 'shop': 'uncertain'}, True)
