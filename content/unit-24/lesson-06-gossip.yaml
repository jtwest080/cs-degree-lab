      import random
      rng = random.Random(2)
      stores = [dict() for _ in range(6)]
      for step in range(40):
          s = stores[rng.randrange(6)]
          key = "key%d" % rng.randrange(8)
          s[key] = (step + 1, "v%d" % step)
      for _ in range(6):
          for i in range(6):
              j = (i + 1) % 6
              stores[i], stores[j], _ = reconcile(stores[i], stores[j])
      for _ in range(6):
