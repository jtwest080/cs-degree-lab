id: u24-gossip
title: Gossip and Anti-Entropy
minutes: 90
objective: Learn how huge clusters stay in sync without a central coordinator. You will simulate gossip, exchange only what is missing between replicas, find differing data with Merkle trees, and detect crashed machines by gossiping heartbeat counters.
outcomes:
- Explain epidemic (gossip) dissemination and why it takes about log n rounds
- Perform anti-entropy using digests
- Build and compare Merkle trees
- Detect failures with gossiped heartbeat counters
- Explain the trade-offs of gossip protocols
sections:
- heading: Spreading news like a rumour
  body: |-
    A cluster of thousands of machines cannot have one machine tell all the others everything: that machine would be overwhelmed and a single point of failure. **Gossip** (also called **epidemic** protocols) copies how rumours and diseases spread. Every so often, each machine picks a few other machines **at random** and shares what it knows. A machine that has heard the news starts repeating it. The number of informed machines roughly doubles every round at first, so news reaches all `n` machines in about **log₂ n** rounds, 10 rounds for a thousand machines, 20 for a million. Because the targets are random, there is no special machine whose failure stops the news, and a lost message hardly matters because the news will arrive some other way.

    The **fanout** (how many peers each machine contacts per round) tunes the speed against the traffic. Gossip comes in several styles: **push** (tell others what you know), **pull** (ask others what they know) and **push-pull** (do both in one exchange, which is fastest). The guarantee is **probabilistic**: with very high probability everyone learns the news quickly, rather than with certainty by a fixed time. That trade is what lets gossip scale to enormous clusters, and it is how Cassandra, Consul, Amazon S3 and many others spread membership and state.
- heading: Anti-entropy and Merkle trees
  body: |-
    Replicas drift apart, because messages are lost or machines were down. The cure is **anti-entropy**: periodically two replicas compare their data and repair differences. Comparing every record would cost as much as copying everything, so they first exchange a small **digest**, for example the version number of each key. From the digests each side works out which keys it is missing or holds in an older version, and only those entries are transferred. If one replica has version 5 of a key and the other version 3, the newer wins, using the version rules from the replication lesson.

    Even a digest with one entry per key is large for a billion keys. A **Merkle tree** shrinks it to one hash. The leaves are hashes of individual records. Each parent is a hash of its two children, and so on up to a single **root hash** which depends on *every* record. If two replicas have the same root they are identical, and one comparison proves it. If the roots differ, compare the children: the subtree whose hash matches is identical and can be skipped entirely, and the search continues only below hashes that differ. To find one changed record among a million you compare about 40 hashes (two per level, 20 levels) instead of a million. Cassandra and Dynamo use Merkle trees exactly this way, and so do Git and Bitcoin to verify their data.
- heading: Membership and failure detection by gossip
  body: |-
    The same idea can discover which machines are alive. Every node keeps a **view**: a table that holds, for every member, a **heartbeat counter** and the *local time* at which that counter last increased. Each round a node increases its **own** counter, then sends its table to a random peer. A receiving node merges: for each member, whichever counter is higher is newer, and when a counter has *grown*, the receiver records the current local time against it. If a member's counter has not grown for longer than a **failure timeout** `t_fail`, it is **suspected**. A crashed node stops incrementing its counter, so the news "node 3 is at counter 17" stops changing everywhere, and after `t_fail` every node independently concludes that it has failed. No machine needs a global clock, because each node only compares its *own* local times.

    The timeout must be long enough that gossip reliably carries the live nodes' counters to everybody (several times log n rounds), or live nodes will be suspected by mistake. The **SWIM** protocol, used by HashiCorp Serf and Consul, improves on this: a node pings a random peer and, if there is no reply, asks a few other nodes to ping it too before declaring it suspect, which greatly reduces false alarms from one bad network link. These protocols are the quiet machinery that lets a large cluster notice a failure and react within seconds.
examples:
- title: Rumours, repair and Merkle
  intro: How fast a rumour spreads, what two replicas exchange, and how few hashes find one changed key.
  code: |
    import random


    def gossip_rounds(n, fanout, seed, max_rounds=100):
        """Simulate PUSH gossip among nodes 0 .. n-1. Node 0 starts with a rumour. In each round, every node that already knows it picks `fanout` DIFFERENT other nodes at random and tells them (all choices in a round use the state at the start of the round).
        Use rng = random.Random(seed), going through the informed nodes in sorted order, and pick each target with rng.randrange(n), retrying when it is the node itself or already chosen by this node. Return the list of how many nodes know the rumour: [1, after round 1, after round 2, ...],
        stopping when everyone knows it or after max_rounds rounds. ValueError('bad parameters') if n < 1 or fanout < 1, or if n > 1 and fanout > n - 1. For n = 1 return [1]."""
        if n < 1 or fanout < 1:
            raise ValueError("bad parameters")
        if n == 1:
            return [1]
        if fanout > n - 1:
            raise ValueError("bad parameters")
        rng = random.Random(seed)
        informed = {0}
        counts = [1]
        while len(informed) < n and len(counts) <= max_rounds:
            new = set(informed)
            for node in sorted(informed):
                chosen = []
                while len(chosen) < fanout:
                    p = rng.randrange(n)
                    if p != node and p not in chosen:
                        chosen.append(p)
                new.update(chosen)
            informed = new
            counts.append(len(informed))
        return counts


    def rounds_to_cover(counts, n):
        """The number of rounds after which everyone knows (the first index where the count equals n), or None if that never happens."""
        for i, c in enumerate(counts):
            if c == n:
                return i
        return None


    def average_rounds(n, fanout, seeds):
        """The mean number of rounds gossip needs to reach all n nodes, over a list of seeds, rounded to 2 decimals. ValueError('did not finish') if some run never reaches everyone, ValueError('no seeds') for an empty list."""
        if not seeds:
            raise ValueError("no seeds")
        totals = []
        for s in seeds:
            r = rounds_to_cover(gossip_rounds(n, fanout, s), n)
            if r is None:
                raise ValueError("did not finish")
            totals.append(r)
        return round(sum(totals) / len(totals), 2)


    def merge_stores(a, b):
        """Merge two replicas of a versioned map {key: (version, value)} into a NEW dict: for each key take the entry with the higher version; on equal versions keep a's entry; keys present on only one side are kept."""
        merged = dict(b)
        for k, entry in a.items():
            if k not in merged or entry[0] >= merged[k][0]:
                merged[k] = entry
        return merged


    def digest(store):
        """A compact summary of a replica: {key: version}."""
        return {k: entry[0] for k, entry in store.items()}


    def needs(mine, theirs):
        """Compare two digests. Return (pull, push): `pull` is the sorted list of keys I must fetch from them (they have it and I do not, or their version is higher); `push` is the sorted list of keys they must fetch from me (I have it and they do not, or my version is higher). Equal versions need nothing."""
        pull = sorted(k for k, v in theirs.items() if k not in mine or v > mine[k])
        push = sorted(k for k, v in mine.items() if k not in theirs or v > theirs[k])
        return pull, push


    def reconcile(a, b):
        """Anti-entropy between two replicas: compare their digests, then transfer ONLY the entries that are needed. Return (new_a, new_b, transferred) with copies of both maps and the number of entries moved in either direction (len(pull) + len(push) from a's point of view)."""
        pull, push = needs(digest(a), digest(b))
        new_a, new_b = dict(a), dict(b)
        for k in pull:
            new_a[k] = b[k]
        for k in push:
            new_b[k] = a[k]
        return new_a, new_b, len(pull) + len(push)


    import hashlib


    def h(text):
        """The first 8 hexadecimal characters of the SHA-256 of the text."""
        return hashlib.sha256(text.encode()).hexdigest()[:8]


    def build_merkle(items):
        """Build a Merkle tree over a list of (key, value) pairs. Sort the items by key. A LEAF hash is h('KEY=VALUE'). Each level above pairs up neighbours: parent = h(left + right); if a level has an odd length the last node is paired with ITSELF. Return the list of levels,
        from the leaves up to the single root: [[leaf hashes], [next level], ..., [root]]. For no items return [[]]."""
        level = [h("%s=%s" % (k, v)) for k, v in sorted(items)]
        levels = [level]
        while len(level) > 1:
            level = [h(level[i] + (level[i + 1] if i + 1 < len(level) else level[i])) for i in range(0, len(level), 2)]
            levels.append(level)
        return levels


    def merkle_root(items):
        """The root hash of the Merkle tree of the items, or '' for no items."""
        levels = build_merkle(items)
        return levels[-1][0] if levels[-1] else ""


    def merkle_diff(a, b):
        """Find which leaves differ between two trees (as returned by build_merkle) of the SAME shape (ValueError('different shapes') otherwise: the same number of levels and the same length at each level), comparing as few hashes as possible. Start by comparing the two roots (that is 1 comparison). If equal,
        return ([], 1). Otherwise go down: for every differing node, compare its (one or two) children, counting each comparison, and keep following only the ones that differ. Return (sorted list of differing leaf indexes, total number of hash comparisons)."""
        if [len(x) for x in a] != [len(x) for x in b]:
            raise ValueError("different shapes")
        top = len(a) - 1
        if not a[top]:
            return [], 0
        comparisons = 1
        if a[top][0] == b[top][0]:
            return [], 1
        frontier = [0]
        for level in range(top, 0, -1):
            nxt = []
            for i in frontier:
                for child in (2 * i, 2 * i + 1):
                    if child < len(a[level - 1]):
                        comparisons += 1
                        if a[level - 1][child] != b[level - 1][child]:
                            nxt.append(child)
            frontier = nxt
        return sorted(frontier), comparisons

    counts = gossip_rounds(64, 2, 1)
    print("nodes that know the rumour after each round:", counts)
    print("average rounds for 64 nodes, fanout 1 / 2 / 3:", average_rounds(64, 1, range(20)), average_rounds(64, 2, range(20)), average_rounds(64, 3, range(20)))
    a = {"cart": (3, "apple"), "name": (1, "ada")}
    b = {"cart": (2, "pear"), "email": (4, "a@x")}
    na, nb, moved = reconcile(a, b)
    print("anti-entropy moved", moved, "entries; replicas equal:", na == nb)
    items = [("key%04d" % i, i) for i in range(1000)]
    changed = list(items)
    changed[321] = ("key0321", "edited")
    diff, comparisons = merkle_diff(build_merkle(items), build_merkle(changed))
    print("1000 keys, 1 changed: found", diff, "with", comparisons, "hash comparisons")
  output: |
    nodes that know the rumour after each round: [1, 3, 9, 22, 46, 61, 62, 64]
    average rounds for 64 nodes, fanout 1 / 2 / 3: 12.0 6.95 5.35
    anti-entropy moved 3 entries; replicas equal: True
    1000 keys, 1 changed: found [321] with 21 hash comparisons
  lines:
  - line: 133
    note: The count roughly doubles each round at first.
  - line: 134
    note: More fanout means fewer rounds.
  - line: 138
    note: Only the differing entries are moved.
  - line: 143
    note: About 2 log n comparisons instead of 1000.
- title: A crash noticed by gossip
  intro: Eight nodes gossip heartbeats; when node 3 crashes everyone eventually suspects it and only it.
  code: |
    import random


    def beat(view, node, now):
        """A node's heartbeat. A VIEW maps node -> {"hb": heartbeat counter, "seen": the local time that counter last increased}. Return a NEW view (the input is not changed) in which `node`'s counter is one higher and its seen time is `now`; a node that is not in the view gets {"hb": 1, "seen": now}."""
        new = {k: dict(v) for k, v in view.items()}
        if node in new:
            new[node]["hb"] += 1
            new[node]["seen"] = now
        else:
            new[node] = {"hb": 1, "seen": now}
        return new


    def merge_view(mine, received, now):
        """Merge a view received from a peer into mine, returning a NEW view. A node I have not heard of is added with the received counter and seen = now. For a node I know, if the received counter is HIGHER than mine, take it and set seen = now (news!); otherwise keep my entry."""
        new = {k: dict(v) for k, v in mine.items()}
        for node, entry in received.items():
            if node not in new or entry["hb"] > new[node]["hb"]:
                new[node] = {"hb": entry["hb"], "seen": now}
        return new


    def failed_nodes(view, now, t_fail):
        """The sorted list of nodes whose counter has not increased for MORE than t_fail time units (now - seen > t_fail)."""
        return sorted(n for n, e in view.items() if now - e["seen"] > t_fail)


    def simulate_membership(n, rounds, crashed, crash_round, seed, t_fail):
        """Gossip-style failure detection among nodes 0 .. n-1. Every node starts with a view of all nodes with {"hb": 0, "seen": 0}. Rounds are numbered 1 .. rounds. In round r a node in `crashed` is DEAD if r >= crash_round (it does nothing). Each live node (1) beats (use beat with now = r), then
        (2) in sorted order each live node picks one random OTHER node with rng.randrange(n) (retrying on itself; rng = random.Random(seed)) and sends it a copy of its view as it stood after step (1) of this round; a message to a dead node is lost; the receiver merges it with merge_view (now = r), processing the messages in sorted sender order. At the end
        return {live node: failed_nodes(its view, rounds, t_fail)} for every node that never crashed."""
        rng = random.Random(seed)
        views = {i: {j: {"hb": 0, "seen": 0} for j in range(n)} for i in range(n)}
        for r in range(1, rounds + 1):
            alive = [i for i in range(n) if not (i in crashed and r >= crash_round)]
            for i in alive:
                views[i] = beat(views[i], i, r)
            snap = {i: {k: dict(v) for k, v in views[i].items()} for i in alive}
            for i in alive:
                while True:
                    p = rng.randrange(n)
                    if p != i:
                        break
                if p in alive:
                    views[p] = merge_view(views[p], snap[i], r)
        return {i: failed_nodes(views[i], rounds, t_fail) for i in range(n) if i not in crashed}

    healthy = simulate_membership(8, 40, set(), 1, 3, 12)
    print("no crash, suspicions:", sum(len(v) for v in healthy.values()))
    crash = simulate_membership(8, 40, {3}, 10, 3, 12)
    print("node 3 crashed at round 10, what each live node suspects at round 40:")
    for node in sorted(crash):
        print(" node", node, "suspects", crash[node])
  output: |
    no crash, suspicions: 0
    node 3 crashed at round 10, what each live node suspects at round 40:
     node 0 suspects [3]
     node 1 suspects [3]
     node 2 suspects [3]
     node 4 suspects [3]
     node 5 suspects [3]
     node 6 suspects [3]
     node 7 suspects [3]
  lines:
  - line: 50
    note: With a long enough timeout nobody is wrongly suspected.
  - line: 18
    note: Every live node suspects exactly node 3.
