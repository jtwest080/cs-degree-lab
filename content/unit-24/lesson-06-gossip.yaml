      assert missing_keys({"a": 1}, {"a": 2, "b": 3, "c": 4}) == ["b", "c"] and missing_keys({}, {}) == [] and missing_keys({"x": 1}, {}) == []
  solution: |
    def missing_keys(mine, theirs):
        return sorted(k for k in theirs if k not in mine)
