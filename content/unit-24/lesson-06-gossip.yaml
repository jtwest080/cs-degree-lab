  - Take a snapshot of every live view after the beats, then deliver the snapshots, so the order of delivery does not matter.
  solution: |
    import random


    def beat(view, node, now):
        """A node's heartbeat. A VIEW maps node -> {"hb": heartbeat counter, "seen": the local time that counter last increased}. Return a NEW view (the input is not changed) in which `node`'s counter is one higher and its seen time is `now`; a node that is not in the view gets {"hb": 1, "seen": now}."""
        new = {k: dict(v) for k, v in view.items()}
        if node in new:
            new[node]["hb"] += 1
            new[node]["seen"] = now
        else:
            new[node] = {"hb": 1, "seen": now}
        return new


    def merge_view(mine, received, now):
        """Merge a view received from a peer into mine, returning a NEW view. A node I have not heard of is added with the received counter and seen = now. For a node I know, if the received counter is HIGHER than mine, take it and set seen = now (news!); otherwise keep my entry."""
        new = {k: dict(v) for k, v in mine.items()}
        for node, entry in received.items():
            if node not in new or entry["hb"] > new[node]["hb"]:
                new[node] = {"hb": entry["hb"], "seen": now}
        return new


    def failed_nodes(view, now, t_fail):
        """The sorted list of nodes whose counter has not increased for MORE than t_fail time units (now - seen > t_fail)."""
        return sorted(n for n, e in view.items() if now - e["seen"] > t_fail)


    def simulate_membership(n, rounds, crashed, crash_round, seed, t_fail):
        """Gossip-style failure detection among nodes 0 .. n-1. Every node starts with a view of all nodes with {"hb": 0, "seen": 0}. Rounds are numbered 1 .. rounds. In round r a node in `crashed` is DEAD if r >= crash_round (it does nothing). Each live node (1) beats (use beat with now = r), then
        (2) in sorted order each live node picks one random OTHER node with rng.randrange(n) (retrying on itself; rng = random.Random(seed)) and sends it a copy of its view as it stood after step (1) of this round; a message to a dead node is lost; the receiver merges it with merge_view (now = r), processing the messages in sorted sender order. At the end
        return {live node: failed_nodes(its view, rounds, t_fail)} for every node that never crashed."""
        rng = random.Random(seed)
        views = {i: {j: {"hb": 0, "seen": 0} for j in range(n)} for i in range(n)}
        for r in range(1, rounds + 1):
            alive = [i for i in range(n) if not (i in crashed and r >= crash_round)]
            for i in alive:
                views[i] = beat(views[i], i, r)
            snap = {i: {k: dict(v) for k, v in views[i].items()} for i in alive}
            for i in alive:
                while True:
                    p = rng.randrange(n)
                    if p != i:
                        break
                if p in alive:
                    views[p] = merge_view(views[p], snap[i], r)
        return {i: failed_nodes(views[i], rounds, t_fail) for i in range(n) if i not in crashed}
  explanation: Gossip-based failure detection scales to thousands of nodes, because each node only talks to one peer per round.
commonMistakes:
- title: Letting every machine talk to every other machine
  explanation: That is n squared messages; gossip uses a small fanout.
- title: Setting the failure timeout shorter than the gossip delay
  explanation: Live nodes would be suspected before news of them arrives.
- title: Comparing whole data sets in anti-entropy
  explanation: Compare digests or Merkle roots first.
- title: Using a global clock in a gossip failure detector
  explanation: Each node uses its own local times only.
- title: Following every branch of a Merkle tree
  explanation: Only subtrees whose hashes differ can contain differences.
summary:
- Gossip spreads information to n machines in about log n rounds with no central node.
- Anti-entropy exchanges digests and transfers only missing or newer entries.
- A Merkle tree finds differences by comparing a handful of hashes.
- Gossiped heartbeat counters detect crashes without a global clock.
- Gossip is probabilistic, which is the price of scale and resilience.
