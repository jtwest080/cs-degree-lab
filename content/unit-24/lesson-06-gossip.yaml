  - Compare only version numbers; send full values for the keys that differ.
  solution: |
    def merge_stores(a, b):
        """Merge two replicas of a versioned map {key: (version, value)} into a NEW dict: for each key take the entry with the higher version; on equal versions keep a's entry; keys present on only one side are kept."""
        merged = dict(b)
        for k, entry in a.items():
            if k not in merged or entry[0] >= merged[k][0]:
                merged[k] = entry
        return merged


    def digest(store):
        """A compact summary of a replica: {key: version}."""
        return {k: entry[0] for k, entry in store.items()}


    def needs(mine, theirs):
        """Compare two digests. Return (pull, push): `pull` is the sorted list of keys I must fetch from them (they have it and I do not, or their version is higher); `push` is the sorted list of keys they must fetch from me (I have it and they do not, or my version is higher). Equal versions need nothing."""
        pull = sorted(k for k, v in theirs.items() if k not in mine or v > mine[k])
        push = sorted(k for k, v in mine.items() if k not in theirs or v > theirs[k])
        return pull, push


    def reconcile(a, b):
        """Anti-entropy between two replicas: compare their digests, then transfer ONLY the entries that are needed. Return (new_a, new_b, transferred) with copies of both maps and the number of entries moved in either direction (len(pull) + len(push) from a's point of view)."""
        pull, push = needs(digest(a), digest(b))
        new_a, new_b = dict(a), dict(b)
        for k in pull:
            new_a[k] = b[k]
        for k in push:
            new_b[k] = a[k]
        return new_a, new_b, len(pull) + len(push)
  explanation: Anti-entropy bounds how stale a replica can stay, at the cost of a little background traffic.
- id: merkle
  title: Merkle trees
  difficulty: 5
  prompt: 'Comparing two big replicas key by key is expensive. A **Merkle tree** summarises a data set so that two copies can find their differences by comparing a few hashes. Write `h(text)` (the first 8 hex characters of the SHA-256 of the text, using `hashlib`) and `build_merkle(items)` for a list of `(key, value)` pairs. Sort the items by key. A **leaf** hash is `h("KEY=VALUE")`. Each level above pairs up neighbours: `parent = h(left + right)`; if a level has an odd length the last node is paired with **itself**. Return the list of levels from the leaves up to the single root: `[[leaf hashes], [next level], ..., [root]]`; for no items return `[[]]`. Write `merkle_root(items)` (the root hash, or `""` for no items). Write `merkle_diff(a, b)` for two trees of the **same shape** (`ValueError("different shapes")` if the number of levels or the length of any level differs): find which leaves differ while comparing as few hashes as possible. Start by comparing the roots (that is **1** comparison). If equal return `([], 1)`. Otherwise go down: for every differing node, compare its (one or two) children, counting each comparison, and keep following only the children that differ. Return `(sorted list of differing leaf indexes, total number of hash comparisons)`. For two empty trees return `([], 0)`.'
  starter: |-
    import hashlib


    def h(text):
        """The first 8 hexadecimal characters of the SHA-256 of the text."""
        pass


    def build_merkle(items):
        """Build a Merkle tree over a list of (key, value) pairs. Sort the items by key. A LEAF hash is h('KEY=VALUE'). Each level above pairs up neighbours: parent = h(left + right); if a level has an odd length the last node is paired with ITSELF. Return the list of levels,
        from the leaves up to the single root: [[leaf hashes], [next level], ..., [root]]. For no items return [[]]."""
        pass


    def merkle_root(items):
        """The root hash of the Merkle tree of the items, or '' for no items."""
        pass


    def merkle_diff(a, b):
        """Find which leaves differ between two trees (as returned by build_merkle) of the SAME shape (ValueError('different shapes') otherwise: the same number of levels and the same length at each level), comparing as few hashes as possible. Start by comparing the two roots (that is 1 comparison). If equal,
        return ([], 1). Otherwise go down: for every differing node, compare its (one or two) children, counting each comparison, and keep following only the ones that differ. Return (sorted list of differing leaf indexes, total number of hash comparisons)."""
        pass
  tests:
  - name: hashing and building
    code: |
      import hashlib
      assert h("a") == hashlib.sha256(b"a").hexdigest()[:8] and len(h("anything")) == 8
      levels = build_merkle([("b", 2), ("a", 1)])
      assert levels[0] == [h("a=1"), h("b=2")]
      assert levels[1] == [h(h("a=1") + h("b=2"))] and len(levels) == 2
      three = build_merkle([("a", 1), ("b", 2), ("c", 3)])
      assert [len(l) for l in three] == [3, 2, 1]
      assert three[1][1] == h(h("c=3") + h("c=3"))
      assert build_merkle([]) == [[]] and merkle_root([]) == ""
      assert build_merkle([("k", "v")]) == [[h("k=v")]] and merkle_root([("k", "v")]) == h("k=v")
      assert merkle_root([("b", 2), ("a", 1)]) == merkle_root([("a", 1), ("b", 2)])
      assert merkle_root([("a", 1), ("b", 2)]) != merkle_root([("a", 1), ("b", 3)])
  - name: finding the difference
    code: |
      items = [("k%02d" % i, i) for i in range(16)]
      other = list(items)
      other[5] = ("k05", "changed")
      ta, tb = build_merkle(items), build_merkle(other)
      diff, comparisons = merkle_diff(ta, tb)
      assert diff == [5] and comparisons == 1 + 2 * 4
      assert merkle_diff(ta, ta) == ([], 1)
      other[12] = ("k12", "also")
      diff, comparisons = merkle_diff(ta, build_merkle(other))
      assert diff == [5, 12] and comparisons < 16 + 1
  - name: it scales
    code: |
      items = [("key%04d" % i, i) for i in range(1000)]
      changed = list(items)
      changed[777] = ("key0777", -1)
      diff, comparisons = merkle_diff(build_merkle(items), build_merkle(changed))
      assert diff == [777] and comparisons <= 1 + 2 * 10
      big = build_merkle(items)
      assert len(big) == 11 and len(big[-1]) == 1
  - name: odd sizes and errors
    code: |
      a = [("a", 1), ("b", 2), ("c", 3)]
      b = [("a", 1), ("b", 2), ("c", 4)]
      assert merkle_diff(build_merkle(a), build_merkle(b)) == ([2], 1 + 2 + 1)
      b2 = [("a", 9), ("b", 2), ("c", 3)]
      assert merkle_diff(build_merkle(a), build_merkle(b2))[0] == [0]
      try:
          merkle_diff(build_merkle(a), build_merkle(a + [("d", 4)]))
          raise AssertionError("accepted")
      except ValueError as e:
          assert "different shapes" in str(e)
      assert merkle_diff(build_merkle([]), build_merkle([])) == ([], 0)
  hints:
  - Compare the roots first; descend only below the nodes whose hashes differ.
  solution: |
    import hashlib


    def h(text):
        """The first 8 hexadecimal characters of the SHA-256 of the text."""
        return hashlib.sha256(text.encode()).hexdigest()[:8]


    def build_merkle(items):
        """Build a Merkle tree over a list of (key, value) pairs. Sort the items by key. A LEAF hash is h('KEY=VALUE'). Each level above pairs up neighbours: parent = h(left + right); if a level has an odd length the last node is paired with ITSELF. Return the list of levels,
        from the leaves up to the single root: [[leaf hashes], [next level], ..., [root]]. For no items return [[]]."""
        level = [h("%s=%s" % (k, v)) for k, v in sorted(items)]
        levels = [level]
        while len(level) > 1:
            level = [h(level[i] + (level[i + 1] if i + 1 < len(level) else level[i])) for i in range(0, len(level), 2)]
            levels.append(level)
        return levels


    def merkle_root(items):
        """The root hash of the Merkle tree of the items, or '' for no items."""
        levels = build_merkle(items)
        return levels[-1][0] if levels[-1] else ""


    def merkle_diff(a, b):
        """Find which leaves differ between two trees (as returned by build_merkle) of the SAME shape (ValueError('different shapes') otherwise: the same number of levels and the same length at each level), comparing as few hashes as possible. Start by comparing the two roots (that is 1 comparison). If equal,
        return ([], 1). Otherwise go down: for every differing node, compare its (one or two) children, counting each comparison, and keep following only the ones that differ. Return (sorted list of differing leaf indexes, total number of hash comparisons)."""
        if [len(x) for x in a] != [len(x) for x in b]:
            raise ValueError("different shapes")
        top = len(a) - 1
        if not a[top]:
            return [], 0
        comparisons = 1
        if a[top][0] == b[top][0]:
            return [], 1
        frontier = [0]
        for level in range(top, 0, -1):
            nxt = []
            for i in frontier:
                for child in (2 * i, 2 * i + 1):
                    if child < len(a[level - 1]):
                        comparisons += 1
                        if a[level - 1][child] != b[level - 1][child]:
                            nxt.append(child)
            frontier = nxt
        return sorted(frontier), comparisons
  explanation: Merkle trees let replicas of a terabyte of data find a single changed record by comparing a few dozen hashes.
- id: view
