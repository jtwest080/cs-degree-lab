      v = {"a": {"hb": 3, "seen": 5}}
      nv = beat(v, "a", 9)
      assert nv == {"a": {"hb": 4, "seen": 9}} and v == {"a": {"hb": 3, "seen": 5}}
      assert beat(v, "b", 9) == {"a": {"hb": 3, "seen": 5}, "b": {"hb": 1, "seen": 9}}
      assert beat({}, "x", 1) == {"x": {"hb": 1, "seen": 1}}
