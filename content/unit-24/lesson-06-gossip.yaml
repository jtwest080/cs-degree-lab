      merged = merge_view(mine, theirs, 10)
      assert merged == {"a": {"hb": 4, "seen": 10}, "b": {"hb": 7, "seen": 6}, "c": {"hb": 2, "seen": 10}}
      assert mine == {"a": {"hb": 3, "seen": 5}, "b": {"hb": 7, "seen": 6}}
      assert merge_view(mine, {"a": {"hb": 1, "seen": 0}}, 10) == mine
      assert merge_view({}, {}, 1) == {}
      merged["a"]["hb"] = 0
      assert theirs["a"]["hb"] == 4
  - name: who has failed
    code: |
      view = {"a": {"hb": 9, "seen": 20}, "b": {"hb": 4, "seen": 10}, "c": {"hb": 1, "seen": 0}}
      assert failed_nodes(view, 20, 10) == ["c"]
      assert failed_nodes(view, 21, 10) == ["b", "c"]
      assert failed_nodes(view, 31, 10) == ["a", "b", "c"]
      assert failed_nodes(view, 5, 10) == []
      assert failed_nodes({}, 5, 1) == []
