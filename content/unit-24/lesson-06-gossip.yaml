exercises:
- id: gossip
  title: Spreading a rumour
  difficulty: 4
  prompt: 'In a **gossip** protocol each machine regularly tells a few random others what it knows, like a rumour spreading. Write `gossip_rounds(n, fanout, seed, max_rounds=100)`, a **push** simulation among nodes `0 .. n-1`. Node 0 starts with the rumour. In each round, every node that already knows it picks `fanout` **different** other nodes at random and tells them (all choices in a round use the state at the **start** of the round). Use `rng = random.Random(seed)`, go through the informed nodes in **sorted order**, and pick each target with `rng.randrange(n)`, retrying when it is the node itself or already chosen by this node. Return the list of how many nodes know the rumour: `[1, after round 1, after round 2, ...]`, stopping when everyone knows or after `max_rounds` rounds. Raise `ValueError("bad parameters")` if `n < 1` or `fanout < 1`, or if `n > 1` and `fanout > n - 1`; for `n = 1` return `[1]`. Write `rounds_to_cover(counts, n)`: the first index where the count equals `n`, or `None`. Write `average_rounds(n, fanout, seeds)`: the mean number of rounds to reach everyone over a list of seeds, rounded to 2 decimals (`ValueError("did not finish")` if some run never reaches everyone, `ValueError("no seeds")` for an empty list).'
  starter: |-
    import random


    def gossip_rounds(n, fanout, seed, max_rounds=100):
        """Simulate PUSH gossip among nodes 0 .. n-1. Node 0 starts with a rumour. In each round, every node that already knows it picks `fanout` DIFFERENT other nodes at random and tells them (all choices in a round use the state at the start of the round).
        Use rng = random.Random(seed), going through the informed nodes in sorted order, and pick each target with rng.randrange(n), retrying when it is the node itself or already chosen by this node. Return the list of how many nodes know the rumour: [1, after round 1, after round 2, ...],
        stopping when everyone knows it or after max_rounds rounds. ValueError('bad parameters') if n < 1 or fanout < 1, or if n > 1 and fanout > n - 1. For n = 1 return [1]."""
        pass


    def rounds_to_cover(counts, n):
        """The number of rounds after which everyone knows (the first index where the count equals n), or None if that never happens."""
        pass


    def average_rounds(n, fanout, seeds):
        """The mean number of rounds gossip needs to reach all n nodes, over a list of seeds, rounded to 2 decimals. ValueError('did not finish') if some run never reaches everyone, ValueError('no seeds') for an empty list."""
        pass
  tests:
  - name: one run
    code: |
      counts = gossip_rounds(64, 2, 5)
      assert counts[0] == 1 and counts[-1] == 64
      assert all(a <= b for a, b in zip(counts, counts[1:]))
      assert all(counts[i + 1] <= counts[i] * 3 for i in range(len(counts) - 1))
      assert counts == gossip_rounds(64, 2, 5) and counts != gossip_rounds(64, 2, 6) or len(counts) > 2
      assert gossip_rounds(1, 1, 0) == [1]
      assert gossip_rounds(2, 1, 3) == [1, 2]
      assert len(gossip_rounds(1000, 1, 1, max_rounds=3)) == 4
  - name: counting rounds
    code: |
      assert rounds_to_cover([1, 3, 8, 8], 8) == 2
      assert rounds_to_cover([1, 2, 3], 8) is None
      assert rounds_to_cover([1], 1) == 0
      counts = gossip_rounds(16, 2, 1)
      assert rounds_to_cover(counts, 16) == len(counts) - 1
  - name: bad parameters
    code: |
      for bad in ((0, 1), (5, 0), (5, 5), (3, 3)):
          try:
              gossip_rounds(bad[0], bad[1], 0)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad parameters" in str(e)
      assert gossip_rounds(3, 2, 0) == [1, 3]
  - name: rumours spread in about log n rounds
    code: |
      avg = average_rounds(64, 2, list(range(20)))
      assert 5 <= avg <= 9
      assert average_rounds(64, 1, list(range(20))) > avg > average_rounds(64, 3, list(range(20)))
      assert average_rounds(256, 2, list(range(10))) < average_rounds(64, 2, list(range(10))) + 4
      assert average_rounds(2, 1, [1, 2, 3]) == 1.0
      for bad, msg in ((lambda: average_rounds(8, 2, []), "no seeds"),):
          try:
              bad()
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
  hints:
  - Process the informed nodes in sorted order and collect the new ones separately, so the whole round uses the state from its start.
  solution: |
    import random


    def gossip_rounds(n, fanout, seed, max_rounds=100):
        """Simulate PUSH gossip among nodes 0 .. n-1. Node 0 starts with a rumour. In each round, every node that already knows it picks `fanout` DIFFERENT other nodes at random and tells them (all choices in a round use the state at the start of the round).
        Use rng = random.Random(seed), going through the informed nodes in sorted order, and pick each target with rng.randrange(n), retrying when it is the node itself or already chosen by this node. Return the list of how many nodes know the rumour: [1, after round 1, after round 2, ...],
        stopping when everyone knows it or after max_rounds rounds. ValueError('bad parameters') if n < 1 or fanout < 1, or if n > 1 and fanout > n - 1. For n = 1 return [1]."""
        if n < 1 or fanout < 1:
            raise ValueError("bad parameters")
        if n == 1:
            return [1]
        if fanout > n - 1:
            raise ValueError("bad parameters")
        rng = random.Random(seed)
        informed = {0}
        counts = [1]
        while len(informed) < n and len(counts) <= max_rounds:
            new = set(informed)
            for node in sorted(informed):
                chosen = []
                while len(chosen) < fanout:
                    p = rng.randrange(n)
                    if p != node and p not in chosen:
                        chosen.append(p)
                new.update(chosen)
            informed = new
            counts.append(len(informed))
        return counts


    def rounds_to_cover(counts, n):
        """The number of rounds after which everyone knows (the first index where the count equals n), or None if that never happens."""
        for i, c in enumerate(counts):
            if c == n:
                return i
        return None


    def average_rounds(n, fanout, seeds):
        """The mean number of rounds gossip needs to reach all n nodes, over a list of seeds, rounded to 2 decimals. ValueError('did not finish') if some run never reaches everyone, ValueError('no seeds') for an empty list."""
        if not seeds:
            raise ValueError("no seeds")
        totals = []
        for s in seeds:
            r = rounds_to_cover(gossip_rounds(n, fanout, s), n)
            if r is None:
                raise ValueError("did not finish")
            totals.append(r)
        return round(sum(totals) / len(totals), 2)
  explanation: A rumour that each informed machine repeats to a few others reaches everybody in about log n rounds.
- id: antientropy
  title: Anti-entropy between replicas
  difficulty: 4
  prompt: 'Replicas that fall behind catch up by **anti-entropy**: occasionally two of them compare notes and exchange what the other is missing. A replica is a versioned map `{key: (version, value)}`. Write `merge_stores(a, b)`: a **new** dict taking, for each key, the entry with the **higher** version; on equal versions keep `a`''s entry; keys present on only one side are kept. Write `digest(store)`: the compact summary `{key: version}`. Write `needs(mine, theirs)` for two digests: return `(pull, push)` where `pull` is the sorted list of keys I must fetch from them (they have it and I do not, or their version is higher) and `push` the sorted list of keys they must fetch from me (I have it and they do not, or my version is higher); equal versions need nothing. Write `reconcile(a, b)`: compare digests and then transfer **only** the needed entries; return `(new_a, new_b, transferred)` with copies of both maps and the number of entries moved in either direction, `len(pull) + len(push)`.'
  starter: |-
    def merge_stores(a, b):
        """Merge two replicas of a versioned map {key: (version, value)} into a NEW dict: for each key take the entry with the higher version; on equal versions keep a's entry; keys present on only one side are kept."""
        pass


    def digest(store):
        """A compact summary of a replica: {key: version}."""
        pass


    def needs(mine, theirs):
        """Compare two digests. Return (pull, push): `pull` is the sorted list of keys I must fetch from them (they have it and I do not, or their version is higher); `push` is the sorted list of keys they must fetch from me (I have it and they do not, or my version is higher). Equal versions need nothing."""
        pass


    def reconcile(a, b):
        """Anti-entropy between two replicas: compare their digests, then transfer ONLY the entries that are needed. Return (new_a, new_b, transferred) with copies of both maps and the number of entries moved in either direction (len(pull) + len(push) from a's point of view)."""
        pass
  tests:
  - name: merging
    code: |
      a = {"x": (2, "new"), "y": (1, "ay")}
      b = {"x": (1, "old"), "z": (5, "bz")}
      assert merge_stores(a, b) == {"x": (2, "new"), "y": (1, "ay"), "z": (5, "bz")}
      assert merge_stores(b, a) == merge_stores(a, b)
      assert merge_stores({"k": (1, "a")}, {"k": (1, "b")}) == {"k": (1, "a")}
      assert merge_stores({}, {}) == {} and a == {"x": (2, "new"), "y": (1, "ay")}
  - name: digests and needs
    code: |
      a = {"x": (2, "new"), "y": (1, "ay")}
      b = {"x": (1, "old"), "z": (5, "bz")}
      assert digest(a) == {"x": 2, "y": 1} and digest({}) == {}
      assert needs(digest(a), digest(b)) == (["z"], ["x", "y"])
      assert needs(digest(b), digest(a)) == (["x", "y"], ["z"])
      assert needs({"k": 3}, {"k": 3}) == ([], [])
      assert needs({}, {}) == ([], [])
  - name: reconciling
    code: |
      a = {"x": (2, "new"), "y": (1, "ay")}
      b = {"x": (1, "old"), "z": (5, "bz")}
      na, nb, moved = reconcile(a, b)
      assert na == nb == {"x": (2, "new"), "y": (1, "ay"), "z": (5, "bz")} and moved == 3
      assert a == {"x": (2, "new"), "y": (1, "ay")} and b == {"x": (1, "old"), "z": (5, "bz")}
      na, nb, moved = reconcile(na, nb)
      assert moved == 0 and na == nb
      x = {"k%d" % i: (1, i) for i in range(100)}
      y = dict(x)
      y["k7"] = (2, "changed")
      na, nb, moved = reconcile(x, y)
      assert moved == 1 and na["k7"] == (2, "changed") and na == nb
  - name: many replicas converge
