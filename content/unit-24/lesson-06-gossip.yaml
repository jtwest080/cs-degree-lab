  - 'The seen time is local to each node: it records when THIS node learned the counter had grown.'
  solution: |
    def beat(view, node, now):
        """A node's heartbeat. A VIEW maps node -> {"hb": heartbeat counter, "seen": the local time that counter last increased}. Return a NEW view (the input is not changed) in which `node`'s counter is one higher and its seen time is `now`; a node that is not in the view gets {"hb": 1, "seen": now}."""
        new = {k: dict(v) for k, v in view.items()}
        if node in new:
            new[node]["hb"] += 1
            new[node]["seen"] = now
        else:
            new[node] = {"hb": 1, "seen": now}
        return new


    def merge_view(mine, received, now):
        """Merge a view received from a peer into mine, returning a NEW view. A node I have not heard of is added with the received counter and seen = now. For a node I know, if the received counter is HIGHER than mine, take it and set seen = now (news!); otherwise keep my entry."""
        new = {k: dict(v) for k, v in mine.items()}
        for node, entry in received.items():
            if node not in new or entry["hb"] > new[node]["hb"]:
                new[node] = {"hb": entry["hb"], "seen": now}
        return new


    def failed_nodes(view, now, t_fail):
        """The sorted list of nodes whose counter has not increased for MORE than t_fail time units (now - seen > t_fail)."""
        return sorted(n for n, e in view.items() if now - e["seen"] > t_fail)
  explanation: 'Gossip membership needs no central server: each node judges others by whether news of them keeps arriving.'
- id: membership
  title: 'Capstone: gossip failure detection'
  difficulty: 5
  prompt: 'The starter has `beat`, `merge_view` and `failed_nodes`. Write `simulate_membership(n, rounds, crashed, crash_round, seed, t_fail)` for nodes `0 .. n-1`. Every node starts with a view of **all** nodes, each `{"hb": 0, "seen": 0}`. Rounds are numbered `1 .. rounds`. In round `r`, a node in `crashed` is **dead** if `r >= crash_round` (it does nothing). Each live node (1) beats (`beat` with `now = r`); then (2) in sorted order each live node picks one random **other** node with `rng.randrange(n)` (retry if it picks itself; `rng = random.Random(seed)`, one generator for the whole simulation) and sends it a copy of its view **as it stood after step 1 of this round**; a message to a dead node is lost; receivers merge with `merge_view` (`now = r`), processing the messages in sorted sender order. At the end return `{node: failed_nodes(its view, rounds, t_fail)}` for every node that never crashed.'
