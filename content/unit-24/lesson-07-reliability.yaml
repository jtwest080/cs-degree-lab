  tests:
  - name: the bucket
    code: |
      b = new_bucket(3, 1)
      assert b == {"capacity": 3, "rate": 1, "tokens": 3, "last": 0}
      assert [allow(b, 0) for _ in range(4)] == [True, True, True, False]
      assert allow(b, 1) is True and allow(b, 1) is False
      assert allow(b, 10) is True and b["tokens"] == 2
      for bad in ((0, 1), (3, 0)):
          try:
              new_bucket(*bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad bucket" in str(e)
  - name: cost and time
    code: |
      b = new_bucket(10, 2, 5)
      assert allow(b, 5, cost=10) is True and allow(b, 5) is False
      assert allow(b, 6, cost=3) is False and b["tokens"] == 2
      assert allow(b, 7, cost=3) is True and b["tokens"] == 1
      try:
          allow(b, 6)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "backwards" in str(e)
  - name: a log
    code: |
      assert rate_limit_log([0, 0, 0, 0, 1, 1, 2], 2, 1) == [True, True, False, False, True, False, True]
      assert rate_limit_log([], 2, 1) == []
      steady = rate_limit_log(list(range(100)), 1, 1)
      assert all(steady)
      burst = rate_limit_log([0] * 50, 5, 1)
      assert sum(burst) == 5
      long_run = rate_limit_log([t // 2 for t in range(400)], 4, 1)
      assert 195 <= sum(long_run) <= 205
  hints:
  - Refill from the elapsed time before you decide; never add tokens above the capacity.
  solution: |
    def new_bucket(capacity, rate, now=0):
        """A TOKEN BUCKET rate limiter: it holds up to `capacity` tokens and gains `rate` tokens per time unit. Return a dict {"capacity", "rate", "tokens": capacity (starts full), "last": now}. ValueError('bad bucket') if capacity < 1 or rate <= 0."""
        if capacity < 1 or rate <= 0:
            raise ValueError("bad bucket")
        return {"capacity": capacity, "rate": rate, "tokens": capacity, "last": now}


    def allow(bucket, now, cost=1):
        """First refill: tokens = min(capacity, tokens + (now - last) * rate) and last = now. Then if tokens >= cost, subtract the cost and return True; otherwise leave the tokens and return False. The bucket dict is changed in place. ValueError('time went backwards') if now < last."""
        if now < bucket["last"]:
            raise ValueError("time went backwards")
        bucket["tokens"] = min(bucket["capacity"], bucket["tokens"] + (now - bucket["last"]) * bucket["rate"])
        bucket["last"] = now
        if bucket["tokens"] >= cost:
            bucket["tokens"] -= cost
            return True
        return False


    def rate_limit_log(times, capacity, rate):
        """Run a fresh bucket (created at time 0) over a list of request times (non-decreasing, one token each) and return the list of True/False answers."""
        bucket = new_bucket(capacity, rate)
        return [allow(bucket, t) for t in times]
  explanation: Token buckets give a service a steady limit while tolerating the bursts real traffic has.
- id: breaker
  title: Circuit breaker
  difficulty: 4
  prompt: 'When a service is failing, further calls only waste time. A **circuit breaker** has three states: **closed** (calls flow), **open** (calls are rejected immediately) and **half_open** (one trial call is allowed). Write `new_breaker(threshold, cooldown)` returning `{"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}` (`ValueError("bad breaker")` if `threshold < 1` or `cooldown < 1`). Write `breaker_allow(b, now)`: closed or half_open means `True`; open means `False`, **unless** `now - opened >= cooldown`, in which case the state becomes `"half_open"` and it returns `True`. Write `record(b, ok, now)` for the result of a call that was made: success sets the state to `"closed"` and `fails` to 0; a failure when the state is `"half_open"` sets the state to `"open"` with `opened = now`; any other failure adds 1 to `fails`, and when `fails >= threshold` the state becomes `"open"` with `opened = now`. All three change the dict in place.'
  starter: |-
    def new_breaker(threshold, cooldown):
        """A CIRCUIT BREAKER stops calling a failing service. Return {"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}. ValueError('bad breaker') if threshold < 1 or cooldown < 1."""
        pass


    def breaker_allow(b, now):
        """May a call go through right now? Closed or half_open: True. Open: if now - opened >= cooldown, change the state to "half_open" and return True (one trial call); otherwise return False."""
        pass


    def record(b, ok, now):
        """Report the result of a call that was made. Success: state = "closed" and fails = 0. Failure: if the state is "half_open" the trial failed, so the state becomes "open" with opened = now; otherwise fails += 1 and when fails >= threshold the state becomes "open" with opened = now."""
        pass
  tests:
  - name: tripping
    code: |
      b = new_breaker(3, 10)
      assert b["state"] == "closed" and breaker_allow(b, 0)
      record(b, False, 1); record(b, False, 2)
      assert b["state"] == "closed" and b["fails"] == 2
      record(b, True, 3)
      assert b["fails"] == 0
      for t in (4, 5, 6):
          record(b, False, t)
      assert b["state"] == "open" and b["opened"] == 6
      for bad in ((0, 1), (1, 0)):
          try:
              new_breaker(*bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad breaker" in str(e)
  - name: cooldown and trial
    code: |
      b = new_breaker(1, 5)
      record(b, False, 2)
      assert b["state"] == "open"
      assert breaker_allow(b, 3) is False and breaker_allow(b, 6) is False
      assert b["state"] == "open"
      assert breaker_allow(b, 7) is True and b["state"] == "half_open"
      record(b, False, 8)
      assert b["state"] == "open" and b["opened"] == 8
      assert breaker_allow(b, 12) is False and breaker_allow(b, 13) is True
      record(b, True, 14)
      assert b["state"] == "closed" and b["fails"] == 0 and breaker_allow(b, 14)
  - name: independent breakers
    code: |
      a, c = new_breaker(1, 3), new_breaker(2, 3)
      record(a, False, 1)
      assert a["state"] == "open" and c["state"] == "closed"
      assert breaker_allow(c, 1) and not breaker_allow(a, 2)
  hints:
  - Only the open state rejects calls, and only after the cooldown does it let one trial through.
  solution: |
    def new_breaker(threshold, cooldown):
        """A CIRCUIT BREAKER stops calling a failing service. Return {"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}. ValueError('bad breaker') if threshold < 1 or cooldown < 1."""
        if threshold < 1 or cooldown < 1:
            raise ValueError("bad breaker")
        return {"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}


    def breaker_allow(b, now):
        """May a call go through right now? Closed or half_open: True. Open: if now - opened >= cooldown, change the state to "half_open" and return True (one trial call); otherwise return False."""
        if b["state"] == "open":
            if now - b["opened"] >= b["cooldown"]:
                b["state"] = "half_open"
                return True
            return False
        return True


    def record(b, ok, now):
        """Report the result of a call that was made. Success: state = "closed" and fails = 0. Failure: if the state is "half_open" the trial failed, so the state becomes "open" with opened = now; otherwise fails += 1 and when fails >= threshold the state becomes "open" with opened = now."""
        if ok:
            b["state"] = "closed"
            b["fails"] = 0
        elif b["state"] == "half_open":
            b["state"] = "open"
            b["opened"] = now
        else:
            b["fails"] += 1
            if b["fails"] >= b["threshold"]:
                b["state"] = "open"
                b["opened"] = now
  explanation: A breaker lets a failing dependency recover, and lets callers fail fast instead of piling up.
- id: balance
  title: Load balancing
  difficulty: 4
  prompt: 'A **load balancer** spreads requests over servers. Write `round_robin(servers, n)`: the first `n` assignments cycling through the list in order (`ValueError("no servers")` if empty). Write `pick_least(loads)` for **least connections**: from `{server: current load}` return the server with the smallest load, ties going to the alphabetically first (`ValueError("no servers")` if empty). Write `power_of_two(servers, requests, seed)` for **power of two choices**: every server starts at load 0; for each request pick **two different** random servers (`rng = random.Random(seed)`; sort the servers first; draw `a = rng.randrange(len)` then `b = rng.randrange(len)`, redrawing **both** until `a != b`) and give the request to the one with the smaller load (on a tie, the first, `a`). Return the final loads dict (`ValueError("need two servers")` if fewer than two). Write `imbalance(loads)`: busiest minus idlest.'
  starter: |-
    import random


    def round_robin(servers, n):
        """The first n assignments of ROUND ROBIN over the list of servers, in order, cycling. ValueError('no servers') for an empty list."""
        pass


    def pick_least(loads):
        """LEAST CONNECTIONS: from a dict {server: current load} return the server with the smallest load; ties go to the alphabetically first name. ValueError('no servers') if empty."""
        pass


    def power_of_two(servers, requests, seed):
        """POWER OF TWO CHOICES: every server starts with load 0. For each request pick TWO DIFFERENT random servers (rng = random.Random(seed); servers sorted first; draw a = rng.randrange(len) then b = rng.randrange(len), redrawing both until a != b), and give the request to the one with the smaller load (on a tie the first, a).
        Return the final loads dict. ValueError('need two servers') if fewer than two servers."""
        pass


    def imbalance(loads):
        """The difference between the busiest and the idlest server."""
        pass
  tests:
  - name: simple policies
    code: |
      assert round_robin(["a", "b", "c"], 7) == ["a", "b", "c", "a", "b", "c", "a"]
      assert round_robin(["x"], 3) == ["x", "x", "x"] and round_robin(["a"], 0) == []
      assert pick_least({"b": 2, "a": 5, "c": 2}) == "b"
      assert pick_least({"z": 0}) == "z"
      assert imbalance({"a": 5, "b": 2, "c": 9}) == 7
      for f, args in ((round_robin, ([], 2)), (pick_least, ({},))):
          try:
              f(*args)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "no servers" in str(e)
  - name: two choices
    code: |
      S = ["s%d" % i for i in range(10)]
      loads = power_of_two(S, 1000, 3)
      assert sum(loads.values()) == 1000 and set(loads) == set(S)
      assert loads == power_of_two(list(reversed(S)), 1000, 3)
      assert imbalance(loads) <= 5
      two = power_of_two(["a", "b"], 11, 0)
      assert abs(two["a"] - two["b"]) == 1
      try:
          power_of_two(["a"], 3, 0)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "two servers" in str(e)
  - name: it beats purely random choice
    code: |
      import random
      S = ["s%d" % i for i in range(10)]
      rng = random.Random(7)
      rand = {s: 0 for s in S}
      for _ in range(1000):
          rand[S[rng.randrange(10)]] += 1
      assert imbalance(power_of_two(S, 1000, 7)) * 4 < imbalance(rand)
      assert all(imbalance(power_of_two(S, 1000, k)) <= 5 for k in range(10))
  hints:
  - Redraw both numbers when they are equal, exactly as described.
  solution: |
    import random


    def round_robin(servers, n):
        """The first n assignments of ROUND ROBIN over the list of servers, in order, cycling. ValueError('no servers') for an empty list."""
        if not servers:
            raise ValueError("no servers")
        return [servers[i % len(servers)] for i in range(n)]


    def pick_least(loads):
        """LEAST CONNECTIONS: from a dict {server: current load} return the server with the smallest load; ties go to the alphabetically first name. ValueError('no servers') if empty."""
        if not loads:
            raise ValueError("no servers")
        return min(sorted(loads), key=lambda s: loads[s])


    def power_of_two(servers, requests, seed):
        """POWER OF TWO CHOICES: every server starts with load 0. For each request pick TWO DIFFERENT random servers (rng = random.Random(seed); servers sorted first; draw a = rng.randrange(len) then b = rng.randrange(len), redrawing both until a != b), and give the request to the one with the smaller load (on a tie the first, a).
        Return the final loads dict. ValueError('need two servers') if fewer than two servers."""
        if len(servers) < 2:
            raise ValueError("need two servers")
        rng = random.Random(seed)
        names = sorted(servers)
        loads = {s: 0 for s in names}
        for _ in range(requests):
            while True:
                a = rng.randrange(len(names))
                b = rng.randrange(len(names))
                if a != b:
                    break
            x, y = names[a], names[b]
            loads[y if loads[y] < loads[x] else x] += 1
        return loads


    def imbalance(loads):
        """The difference between the busiest and the idlest server."""
        return max(loads.values()) - min(loads.values())
  explanation: Looking at just two random servers gets almost the balance of looking at all of them.
- id: client
  title: 'Capstone: a protected client'
  difficulty: 5
  prompt: 'The starter has `new_breaker`, `breaker_allow` and `record`. Write `run_client(script, max_attempts, threshold, cooldown)`. `script` is a list of requests, each a list of attempt outcomes (`True`/`False`; attempts beyond the list fail). Time starts at 0, and every attempt, or rejected attempt, advances it by 1. Make a breaker with `new_breaker(threshold, cooldown)`. For each request, for up to `max_attempts` attempts: if `not breaker_allow(b, now)` the result is `"rejected"`, time advances by 1 and this request stops; otherwise time advances by 1, then call `record(b, outcome, now)`; on success the result is `"ok"` and the request stops; if all attempts fail the result is `"failed"`. Return the list of results, one per request.'
  starter: |-
    def new_breaker(threshold, cooldown):
        """A CIRCUIT BREAKER stops calling a failing service. Return {"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}. ValueError('bad breaker') if threshold < 1 or cooldown < 1."""
        if threshold < 1 or cooldown < 1:
            raise ValueError("bad breaker")
        return {"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}


    def breaker_allow(b, now):
        """May a call go through right now? Closed or half_open: True. Open: if now - opened >= cooldown, change the state to "half_open" and return True (one trial call); otherwise return False."""
        if b["state"] == "open":
            if now - b["opened"] >= b["cooldown"]:
                b["state"] = "half_open"
                return True
            return False
        return True


    def record(b, ok, now):
        """Report the result of a call that was made. Success: state = "closed" and fails = 0. Failure: if the state is "half_open" the trial failed, so the state becomes "open" with opened = now; otherwise fails += 1 and when fails >= threshold the state becomes "open" with opened = now."""
        if ok:
            b["state"] = "closed"
            b["fails"] = 0
        elif b["state"] == "half_open":
            b["state"] = "open"
            b["opened"] = now
        else:
            b["fails"] += 1
            if b["fails"] >= b["threshold"]:
                b["state"] = "open"
                b["opened"] = now


    def run_client(script, max_attempts, threshold, cooldown):
        """A client protected by a circuit breaker. `script` is a list of requests, each a list of attempt outcomes (True/False; attempts beyond the list fail). Time starts at 0 and every attempt, or rejected attempt, advances it by 1. Create a breaker with new_breaker(threshold, cooldown). For each request, for up to max_attempts attempts:
        if not breaker_allow(b, now): result "rejected", now += 1, stop this request; otherwise now += 1, then call record(b, outcome, now); on success the result is "ok" and the request stops; if all attempts fail the result is "failed". Return the list of results, one per request."""
        pass
  tests:
  - name: healthy service
    code: |
      assert run_client([[True], [True], [False, True]], 3, 3, 5) == ["ok", "ok", "ok"]
      assert run_client([], 3, 3, 5) == []
      assert run_client([[False]], 1, 5, 5) == ["failed"]
  - name: the breaker trips and recovers
    code: |
      res = run_client([[False, False, True], [True], [True], [True], [True], [True]], 3, 2, 5)
      assert res == ["rejected", "rejected", "rejected", "rejected", "rejected", "ok"]
      res = run_client([[False] * 3, [True]], 3, 5, 5)
      assert res == ["failed", "ok"]
  - name: a failed trial re-opens it
    code: |
      script = [[False, False]] + [[True]] * 6 + [[False]] + [[True]] * 6
      res = run_client(script, 2, 2, 3)
      assert res[0] == "failed" and res[1:4] == ["rejected"] * 3
      assert res[4] == "ok"
      assert len(res) == len(script) and set(res) <= {"ok", "failed", "rejected"}
  hints:
  - Rejected attempts still advance the clock; that is how the cooldown ends.
  solution: |
    def new_breaker(threshold, cooldown):
        """A CIRCUIT BREAKER stops calling a failing service. Return {"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}. ValueError('bad breaker') if threshold < 1 or cooldown < 1."""
        if threshold < 1 or cooldown < 1:
            raise ValueError("bad breaker")
        return {"state": "closed", "fails": 0, "opened": 0, "threshold": threshold, "cooldown": cooldown}


    def breaker_allow(b, now):
        """May a call go through right now? Closed or half_open: True. Open: if now - opened >= cooldown, change the state to "half_open" and return True (one trial call); otherwise return False."""
        if b["state"] == "open":
            if now - b["opened"] >= b["cooldown"]:
                b["state"] = "half_open"
                return True
            return False
        return True


    def record(b, ok, now):
        """Report the result of a call that was made. Success: state = "closed" and fails = 0. Failure: if the state is "half_open" the trial failed, so the state becomes "open" with opened = now; otherwise fails += 1 and when fails >= threshold the state becomes "open" with opened = now."""
        if ok:
            b["state"] = "closed"
            b["fails"] = 0
        elif b["state"] == "half_open":
            b["state"] = "open"
            b["opened"] = now
        else:
            b["fails"] += 1
            if b["fails"] >= b["threshold"]:
                b["state"] = "open"
                b["opened"] = now


    def run_client(script, max_attempts, threshold, cooldown):
        """A client protected by a circuit breaker. `script` is a list of requests, each a list of attempt outcomes (True/False; attempts beyond the list fail). Time starts at 0 and every attempt, or rejected attempt, advances it by 1. Create a breaker with new_breaker(threshold, cooldown). For each request, for up to max_attempts attempts:
        if not breaker_allow(b, now): result "rejected", now += 1, stop this request; otherwise now += 1, then call record(b, outcome, now); on success the result is "ok" and the request stops; if all attempts fail the result is "failed". Return the list of results, one per request."""
        b = new_breaker(threshold, cooldown)
        now = 0
        results = []
        for outs in script:
            result = "failed"
            for i in range(max_attempts):
                if not breaker_allow(b, now):
                    result = "rejected"
                    now += 1
                    break
                ok = outs[i] if i < len(outs) else False
                now += 1
                record(b, ok, now)
                if ok:
                    result = "ok"
                    break
            results.append(result)
        return results
  explanation: Breakers, retries and rate limits are combined in real clients to stay polite to struggling servers.
commonMistakes:
- title: Retrying non-idempotent operations
  explanation: Charging a card twice because a reply was lost; use idempotency keys.
- title: Retrying immediately and forever
  explanation: That creates retry storms; back off, add jitter and limit the attempts.
- title: Backoff without jitter
  explanation: Clients stay in step and hit the server together.
- title: No timeouts
  explanation: A call to a dead server can hang for ever.
- title: Believing a system can be consistent, available and partition tolerant at once
  explanation: CAP says a partition forces a choice between consistency and availability.
summary:
- Retries need idempotent operations, backoff, jitter and an attempt limit.
- A token bucket allows bursts but limits the long-run rate.
- A circuit breaker fails fast when a dependency is down and probes for recovery.
- Power of two choices balances load almost as well as global knowledge.
- CAP and PACELC name the consistency, availability and latency trade-offs.
