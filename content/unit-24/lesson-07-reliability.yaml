id: u24-reliability
title: 'Surviving Failure: Retries, Limits and Balancing'
minutes: 90
objective: Learn the everyday techniques that keep distributed systems up when parts fail or get overloaded. You will write retry with backoff and jitter, a rate limiter, a circuit breaker and three load-balancing policies, then combine them in a protected client. You will also meet the CAP theorem, which names the central trade-off.
outcomes:
- Retry safely with exponential backoff and jitter
- Limit request rates with a token bucket
- Stop calling failing services with a circuit breaker
- Balance load with round robin, least connections and power of two choices
- Explain the CAP theorem and PACELC
sections:
- heading: 'Failure is normal: retries, backoff and jitter'
  body: |-
    In a distributed system a message can be lost, delayed or answered too late, and a server can crash in the middle of a request. The simplest defence is to **retry**: send the request again. Two rules make retrying safe. First, the operation must be **idempotent**, meaning doing it twice has the same effect as once, which is why the transactions lesson used idempotency keys. Second, the client must not retry carelessly. If a server is overloaded and every client instantly retries, the load doubles and the server never recovers, an effect called a **retry storm**.

    **Exponential backoff** fixes this by waiting longer after each failure: 1 second, then 2, 4, 8 and so on, up to a **cap** so the wait never grows absurd. Even so, thousands of clients that failed at the same moment will all retry at the same moment, again and again, in synchronised waves. **Jitter** adds randomness: with *full jitter* each client waits a random time between zero and its backoff delay, which spreads the retries out smoothly. Real clients also limit the **number of attempts** and use a **timeout** on each attempt, because waiting forever for a dead server is its own failure.
- heading: 'Protecting servers: rate limits and circuit breakers'
  body: |-
    A server also needs to protect *itself*. A **rate limiter** caps how much work each client may demand. The **token bucket** is the classic design: imagine a bucket holding up to `capacity` tokens that refills at `rate` tokens per second. Each request removes a token; if the bucket is empty the request is rejected (or delayed). A full bucket allows a short **burst** of capacity requests at once, while over a long time no more than `rate` per second can get through. Because it only stores two numbers, a token bucket scales to millions of clients.

    The **circuit breaker** protects the *caller*, named after the switch in an electrical fuse box. While a dependency works, the breaker is **closed** and calls pass. After a few failures in a row it trips **open**, and calls fail immediately without even trying, which saves resources and gives the broken service room to recover. After a **cooldown** it goes **half-open**: it allows one trial call. If that succeeds the breaker closes again; if it fails the breaker re-opens for another cooldown. Together, timeouts, retries with backoff, rate limits and circuit breakers are the standard toolkit that stops one failing component from dragging down everything that depends on it, a disaster called a **cascading failure**.
- heading: Spreading the load, and the CAP theorem
  body: |-
    A **load balancer** sits in front of many identical servers and decides which one gets each request. **Round robin** hands out requests in turn: simple, but it ignores how busy each server is. **Least connections** sends each request to the server with the fewest active requests: better, but it needs fresh load information from every server, which is hard at scale. **Power of two choices** is a surprisingly good compromise: for each request pick **two servers at random** and use the less loaded one. With ten servers and a thousand requests, plain random choice leaves a gap of dozens of requests between the busiest and the idlest, while two choices keeps the gap to two or three. Looking at a tiny random sample captures nearly all the benefit of looking at everyone.

    Finally, the big trade-off. The **CAP theorem** says that when the network **partitions** (some machines cannot talk to others), a system must choose between **consistency** (every read sees the latest write, so the cut-off side must refuse to answer) and **availability** (every request gets an answer, though possibly a stale one). It cannot have both during a partition. A bank ledger chooses consistency; a social media feed usually chooses availability. **PACELC** extends the idea: even when there is *no* partition, there is a trade-off between **latency** and consistency, because waiting for more replicas to confirm makes writes safer but slower. Naming which side of these trade-offs each system takes is the first step in designing any distributed system.
examples:
- title: Backoff, jitter and rate limiting
  intro: The waits a retrying client uses, and how a token bucket reacts to a burst.
  code: |
    import random


    def backoff_delays(attempts, base, cap):
        """The wait times used by EXPONENTIAL BACKOFF: after failure i (i = 0, 1, ...) wait min(cap, base * 2 ** i). Return a list of `attempts` delays. ValueError('bad parameters') if attempts < 0 or base <= 0 or cap < base."""
        if attempts < 0 or base <= 0 or cap < base:
            raise ValueError("bad parameters")
        return [min(cap, base * 2 ** i) for i in range(attempts)]


    def full_jitter(delays, seed):
        """Spread retries out with FULL JITTER: replace each delay d with a random number between 0 and d. Use rng = random.Random(seed) and round(rng.random() * d, 3) for each delay in order. Return the new list."""
        rng = random.Random(seed)
        return [round(rng.random() * d, 3) for d in delays]


    def retry_schedule(outcomes, max_attempts, base, cap):
        """Replay a retrying client. `outcomes` is the list of results of successive attempts (True = success; attempts beyond the list fail). The client tries up to max_attempts times, stopping at the first success. After a failure it waits backoff_delays(...)[i] before the NEXT attempt, but only if another attempt will follow.
        Return (succeeded, attempts_used, total_wait). ValueError('bad attempts') if max_attempts < 1."""
        if max_attempts < 1:
            raise ValueError("bad attempts")
        delays = backoff_delays(max_attempts, base, cap)
        wait = 0
        for i in range(max_attempts):
            ok = outcomes[i] if i < len(outcomes) else False
            if ok:
                return True, i + 1, wait
            if i + 1 < max_attempts:
                wait += delays[i]
        return False, max_attempts, wait


    def new_bucket(capacity, rate, now=0):
        """A TOKEN BUCKET rate limiter: it holds up to `capacity` tokens and gains `rate` tokens per time unit. Return a dict {"capacity", "rate", "tokens": capacity (starts full), "last": now}. ValueError('bad bucket') if capacity < 1 or rate <= 0."""
        if capacity < 1 or rate <= 0:
            raise ValueError("bad bucket")
        return {"capacity": capacity, "rate": rate, "tokens": capacity, "last": now}


    def allow(bucket, now, cost=1):
        """First refill: tokens = min(capacity, tokens + (now - last) * rate) and last = now. Then if tokens >= cost, subtract the cost and return True; otherwise leave the tokens and return False. The bucket dict is changed in place. ValueError('time went backwards') if now < last."""
        if now < bucket["last"]:
            raise ValueError("time went backwards")
        bucket["tokens"] = min(bucket["capacity"], bucket["tokens"] + (now - bucket["last"]) * bucket["rate"])
        bucket["last"] = now
        if bucket["tokens"] >= cost:
            bucket["tokens"] -= cost
            return True
        return False


    def rate_limit_log(times, capacity, rate):
        """Run a fresh bucket (created at time 0) over a list of request times (non-decreasing, one token each) and return the list of True/False answers."""
        bucket = new_bucket(capacity, rate)
        return [allow(bucket, t) for t in times]

    print("backoff delays:", backoff_delays(6, 1, 20))
    print("with full jitter:", full_jitter(backoff_delays(6, 1, 20), 1))
    print("retry [fail, fail, ok]:", retry_schedule([False, False, True], 5, 1, 20))
    print("rate limiter, 3 token bucket, 6 requests at once, then 1 per tick:", rate_limit_log([0, 0, 0, 0, 0, 0, 1, 2, 3], 3, 1))
  output: |
    backoff delays: [1, 2, 4, 8, 16, 20]
    with full jitter: [0.134, 1.695, 3.055, 2.041, 7.927, 8.99]
    retry [fail, fail, ok]: (True, 3, 3)
    rate limiter, 3 token bucket, 6 requests at once, then 1 per tick: [True, True, True, False, False, False, True, True, True]
