exercises:
- id: retry
  title: Retries with backoff
  difficulty: 4
  prompt: 'Networks lose messages, so clients **retry**. Hammering a struggling server makes it worse, so they wait longer after each failure: **exponential backoff**. Write `backoff_delays(attempts, base, cap)`: after failure `i` (0, 1, ...) wait `min(cap, base * 2 ** i)`; return a list of `attempts` delays (`ValueError("bad parameters")` if `attempts < 0`, `base <= 0` or `cap < base`). Clients that all retry on the same schedule collide again, so add **jitter**: `full_jitter(delays, seed)` replaces each delay `d` by a random number between 0 and `d`, computed with `rng = random.Random(seed)` and `round(rng.random() * d, 3)` for each delay in order. Write `retry_schedule(outcomes, max_attempts, base, cap)`: `outcomes` lists the results of successive attempts (`True` = success; attempts beyond the list fail). The client tries up to `max_attempts` times, stopping at the first success, and after a failure waits `backoff_delays(...)[i]` before the next attempt, but **only if** another attempt follows. Return `(succeeded, attempts_used, total_wait)`; `ValueError("bad attempts")` if `max_attempts < 1`.'
  starter: |-
    import random


    def backoff_delays(attempts, base, cap):
        """The wait times used by EXPONENTIAL BACKOFF: after failure i (i = 0, 1, ...) wait min(cap, base * 2 ** i). Return a list of `attempts` delays. ValueError('bad parameters') if attempts < 0 or base <= 0 or cap < base."""
        pass


    def full_jitter(delays, seed):
        """Spread retries out with FULL JITTER: replace each delay d with a random number between 0 and d. Use rng = random.Random(seed) and round(rng.random() * d, 3) for each delay in order. Return the new list."""
        pass


    def retry_schedule(outcomes, max_attempts, base, cap):
        """Replay a retrying client. `outcomes` is the list of results of successive attempts (True = success; attempts beyond the list fail). The client tries up to max_attempts times, stopping at the first success. After a failure it waits backoff_delays(...)[i] before the NEXT attempt, but only if another attempt will follow.
        Return (succeeded, attempts_used, total_wait). ValueError('bad attempts') if max_attempts < 1."""
        pass
  tests:
  - name: delays
    code: |
      assert backoff_delays(5, 1, 100) == [1, 2, 4, 8, 16]
      assert backoff_delays(6, 1, 10) == [1, 2, 4, 8, 10, 10]
      assert backoff_delays(0, 1, 5) == []
      for bad in ((-1, 1, 5), (3, 0, 5), (3, 4, 2)):
          try:
              backoff_delays(*bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad parameters" in str(e)
  - name: jitter
    code: |
      d = backoff_delays(6, 1, 100)
      j = full_jitter(d, 4)
      assert len(j) == 6 and all(0 <= x <= y for x, y in zip(j, d))
      assert j == full_jitter(d, 4) and j != full_jitter(d, 5)
      assert full_jitter([], 1) == []
      import random
      rng = random.Random(4)
      assert j == [round(rng.random() * x, 3) for x in d]
  - name: replaying a client
    code: |
      assert retry_schedule([True], 5, 1, 100) == (True, 1, 0)
      assert retry_schedule([False, False, True], 5, 1, 100) == (True, 3, 1 + 2)
      assert retry_schedule([], 4, 1, 100) == (False, 4, 1 + 2 + 4)
      assert retry_schedule([False, False, False, True], 3, 1, 100) == (False, 3, 1 + 2)
      assert retry_schedule([False], 1, 1, 100) == (False, 1, 0)
      assert retry_schedule([False] * 6 + [True], 8, 1, 4) == (True, 7, 1 + 2 + 4 + 4 + 4 + 4)
      try:
          retry_schedule([True], 0, 1, 2)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "bad attempts" in str(e)
  hints:
  - 'Only wait between attempts: no wait after the last allowed failure.'
  solution: |
    import random


    def backoff_delays(attempts, base, cap):
        """The wait times used by EXPONENTIAL BACKOFF: after failure i (i = 0, 1, ...) wait min(cap, base * 2 ** i). Return a list of `attempts` delays. ValueError('bad parameters') if attempts < 0 or base <= 0 or cap < base."""
        if attempts < 0 or base <= 0 or cap < base:
            raise ValueError("bad parameters")
        return [min(cap, base * 2 ** i) for i in range(attempts)]


    def full_jitter(delays, seed):
        """Spread retries out with FULL JITTER: replace each delay d with a random number between 0 and d. Use rng = random.Random(seed) and round(rng.random() * d, 3) for each delay in order. Return the new list."""
        rng = random.Random(seed)
        return [round(rng.random() * d, 3) for d in delays]


    def retry_schedule(outcomes, max_attempts, base, cap):
        """Replay a retrying client. `outcomes` is the list of results of successive attempts (True = success; attempts beyond the list fail). The client tries up to max_attempts times, stopping at the first success. After a failure it waits backoff_delays(...)[i] before the NEXT attempt, but only if another attempt will follow.
        Return (succeeded, attempts_used, total_wait). ValueError('bad attempts') if max_attempts < 1."""
        if max_attempts < 1:
            raise ValueError("bad attempts")
        delays = backoff_delays(max_attempts, base, cap)
        wait = 0
        for i in range(max_attempts):
            ok = outcomes[i] if i < len(outcomes) else False
            if ok:
                return True, i + 1, wait
            if i + 1 < max_attempts:
                wait += delays[i]
        return False, max_attempts, wait
  explanation: Backoff plus jitter keeps retrying clients from knocking over a server that is trying to recover.
