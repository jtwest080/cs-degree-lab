title: Mini Key-Value Cluster
language: python
brief: Build a small replicated key-value store in the style of Amazon Dynamo and Cassandra. Keys are
  placed on a consistent-hashing ring with virtual nodes; every key lives on several replicas; writes
  and reads use quorums; stale replicas are outvoted by version numbers and repaired when read; nodes
  can fail and recover; new nodes can join and take over only a fraction of the keys; and anti-entropy
  repairs replicas that missed writes. Everything runs in one program with a dict standing for the whole
  cluster.
steps:
- title: Placement
  body: Use the given `stable_hash`. Write `build_ring`, `make_cluster` and `preference_list`, which walks
    clockwise from a key's hash and collects the first `replicas` distinct nodes.
- title: Reading and writing
  body: Write `put` and `get` with versions, quorums and read repair, plus `fail` and `recover` for crashing
    nodes. A write that reaches fewer than `w` replicas still leaves its copies behind but reports failure.
- title: Changing the cluster
  body: Write `rebalance` (every key on exactly its preference list, newest version everywhere), `add_node`
    and `key_counts`. Adding a node must move only a fraction of the keys.
- title: Repair
  body: Write `anti_entropy`, which copies newer entries between two live nodes, but only to nodes that
    are supposed to hold the key.
checklist:
- text: Builds a cluster and validates its settings
  test: building the cluster
- text: Chooses distinct replicas for every key
  test: preference lists
- text: Writes versioned values to the replicas
  test: writing
- text: Reads the latest value
  test: reading
- text: Enforces write quorums
  test: write quorums
- text: Enforces read quorums
  test: read quorums
- text: Outvotes stale replicas
  test: stale replicas are outvoted
- text: Repairs replicas on read
  test: read repair
- text: Adds nodes and rebalances
  test: adding a node
- text: Moves only a fraction of keys on growth
  test: only a fraction of the keys move
- text: Repairs replicas with anti-entropy
  test: anti-entropy
- text: Never copies keys to the wrong nodes
  test: anti-entropy ignores nodes that should not hold a key
- text: Survives failures, recovery and growth together
  test: a day in the life
starter: |-
  def stable_hash(text):
      """A hash of a string that is the same on every run and every machine (Python's own hash is randomized): FNV-1a over the UTF-8 bytes, followed by a finishing mix. Returns an int in [0, 2**32)."""
      h = 2166136261
      for b in text.encode():
          h ^= b
          h = (h * 16777619) & 0xFFFFFFFF
      h ^= h >> 16
      h = (h * 0x85ebca6b) & 0xFFFFFFFF
      h ^= h >> 13
      h = (h * 0xc2b2ae35) & 0xFFFFFFFF
      h ^= h >> 16
      return h


  import bisect


  def build_ring(nodes, vnodes):
      """A consistent-hashing ring: a sorted list of (hash, node) points. Every node gets `vnodes` virtual nodes, the points stable_hash('NODE#I') for I = 0 .. vnodes - 1."""
      pass


  def make_cluster(nodes, replicas=3, vnodes=16):
      """Create a cluster: a dict {"nodes": sorted list of node names, "replicas": replicas, "vnodes": vnodes, "ring": build_ring(...), "data": {node: {} for every node}, "down": set(), "clock": 0}.
      ValueError('need at least one node') for an empty list, ValueError('not enough nodes') if replicas is more than the number of nodes, ValueError('bad replicas') if replicas < 1."""
      pass


  def preference_list(cluster, key):
      """The nodes responsible for a key: start at the first ring point whose hash is >= stable_hash(key) (wrapping around the end), walk clockwise, and collect the first `replicas` DISTINCT nodes in the order met."""
      pass


  def fail(cluster, node):
      """Mark a node as down (it keeps its data but answers nothing). ValueError('unknown node') if it is not in the cluster."""
      pass


  def recover(cluster, node):
      """Bring a node back up. ValueError('unknown node') if it is not in the cluster."""
      pass


  def put(cluster, key, value, w=2):
      """Write a value: add 1 to the cluster's clock and use it as the new version. Store (version, value) on every UP node of the key's preference list. If fewer than w nodes stored it raise ValueError('write quorum not met'); the nodes that were up still keep the write. Return the version."""
      pass


  def get(cluster, key, r=2):
      """Read a value. Ask every UP node of the key's preference list. If fewer than r are up raise ValueError('read quorum not met'). Take the entry with the highest version among those that have the key and return its value (None if nobody has it).
      READ REPAIR: every UP replica that answered with an older version or none at all is updated to the newest entry."""
      pass


  def rebalance(cluster):
      """Make every key live exactly where its preference list says. For every key held by any node (down nodes included) take the newest entry; store it on every node of the preference list that lacks it or has an older one (counting each store as one copy), and delete the key from nodes that are not in the list. Return the number of copies made."""
      pass


  def add_node(cluster, node):
      """Add a node: ValueError('duplicate node') if it exists. Insert it into the sorted node list, give it an empty data dict, rebuild the ring and rebalance. Return the number of copies rebalance made."""
      pass


  def anti_entropy(cluster, a, b):
      """Repair two UP nodes against each other: for every key held by either, the newer entry is copied to the other node IF that other node is in the key's preference list and has an older entry or none. Return the number of entries copied. ValueError('node is down') if either is down."""
      pass


  def key_counts(cluster):
      """How many keys each node holds: {node: count}."""
      pass
tests:
- name: building the cluster
  code: |
    c = make_cluster(["n2", "n1", "n3"], replicas=2, vnodes=8)
    assert c["nodes"] == ["n1", "n2", "n3"] and c["replicas"] == 2 and c["clock"] == 0 and c["down"] == set()
    assert len(c["ring"]) == 24 and c["ring"] == sorted(c["ring"]) and c["data"] == {"n1": {}, "n2": {}, "n3": {}}
    assert c["ring"] == build_ring(["n1", "n2", "n3"], 8)
    for args, msg in ((([], 1), "need at least one node"), ((["a"], 2), "not enough nodes"), ((["a", "b"], 0), "bad replicas")):
        try:
            make_cluster(*args)
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e)
- name: preference lists
  code: |
    c = make_cluster(["a", "b", "c", "d", "e"], replicas=3)
    seen = set()
    for i in range(100):
        p = preference_list(c, "key%d" % i)
        assert len(p) == 3 and len(set(p)) == 3 and set(p) <= set("abcde")
        assert p == preference_list(c, "key%d" % i)
        seen.add(p[0])
    assert len(seen) == 5
    one = make_cluster(["x"], replicas=1)
    assert preference_list(one, "anything") == ["x"]
- name: writing
  code: |
    c = make_cluster(["a", "b", "c", "d"], replicas=3)
    assert put(c, "user:1", "ada") == 1 and put(c, "user:2", "bob") == 2
    holders = [n for n in c["nodes"] if "user:1" in c["data"][n]]
    assert sorted(holders) == sorted(preference_list(c, "user:1"))
    assert all(c["data"][n]["user:1"] == (1, "ada") for n in holders)
    assert put(c, "user:1", "ada2") == 3 and c["clock"] == 3
    assert all(c["data"][n]["user:1"] == (3, "ada2") for n in holders)
- name: reading
  code: |
    c = make_cluster(["a", "b", "c"], replicas=3)
    put(c, "k", 1)
    put(c, "k", 2)
    assert get(c, "k") == 2 and get(c, "missing") is None
    assert get(c, "k", r=3) == 2
- name: write quorums
  code: |
    c = make_cluster(["a", "b", "c"], replicas=3)
    fail(c, "a"); fail(c, "b")
    try:
        put(c, "k", 1, w=2)
        raise AssertionError("accepted")
    except ValueError as e:
        assert "write quorum not met" in str(e)
    assert c["data"]["c"]["k"] == (1, 1)
    assert put(c, "k2", 2, w=1) == 2
    assert c["clock"] == 2
    try:
        fail(c, "zzz")
        raise AssertionError("accepted")
    except ValueError as e:
        assert "unknown node" in str(e)
- name: read quorums
  code: |
    c = make_cluster(["a", "b", "c"], replicas=3)
    put(c, "k", "v")
    fail(c, "a"); fail(c, "b")
    assert get(c, "k", r=1) == "v"
    try:
        get(c, "k", r=2)
        raise AssertionError("accepted")
    except ValueError as e:
        assert "read quorum not met" in str(e)
    recover(c, "a")
    assert get(c, "k", r=2) == "v"
- name: stale replicas are outvoted
  code: |
    c = make_cluster(["a", "b", "c"], replicas=3)
    put(c, "k", "old")
    fail(c, "b")
    put(c, "k", "new", w=2)
    recover(c, "b")
    assert c["data"]["b"]["k"] == (1, "old")
    assert get(c, "k", r=2) == "new"
- name: read repair
  code: |
    c = make_cluster(["a", "b", "c"], replicas=3)
    put(c, "k", "old")
    fail(c, "b")
    put(c, "k", "new")
    recover(c, "b")
    get(c, "k")
    assert c["data"]["b"]["k"] == (2, "new")
    fail(c, "c")
    c["data"]["a"].pop("k")
    assert get(c, "k", r=2) == "new" and c["data"]["a"]["k"] == (2, "new")
    assert c["data"]["c"]["k"] == (2, "new")
- name: adding a node
  code: |
    c = make_cluster(["a", "b", "c", "d"], replicas=2)
    for i in range(120):
        put(c, "key%d" % i, i, w=2)
    copies = add_node(c, "e")
    assert c["nodes"] == ["a", "b", "c", "d", "e"] and len(c["ring"]) == 5 * 16 and copies > 0
    for i in range(120):
        key = "key%d" % i
        holders = sorted(n for n in c["nodes"] if key in c["data"][n])
        assert holders == sorted(preference_list(c, key)), key
        assert get(c, key) == i
    assert sum(key_counts(c).values()) == 240 and key_counts(c)["e"] > 0
    assert rebalance(c) == 0
    try:
        add_node(c, "a")
        raise AssertionError("accepted")
    except ValueError as e:
        assert "duplicate node" in str(e)
- name: only a fraction of the keys move
  code: |
    c = make_cluster(["a", "b", "c", "d"], replicas=1)
    for i in range(400):
        put(c, "key%d" % i, i, w=1)
    moved = add_node(c, "e")
    assert 40 <= moved <= 140, moved
    assert sum(key_counts(c).values()) == 400
- name: anti-entropy
  code: |
    c = make_cluster(["a", "b", "c"], replicas=3)
    fail(c, "c")
    for i in range(10):
        put(c, "k%d" % i, i, w=2)
    recover(c, "c")
    assert key_counts(c)["c"] == 0
    assert anti_entropy(c, "a", "c") == 10
    assert key_counts(c)["c"] == 10 and c["data"]["c"] == c["data"]["a"]
    assert anti_entropy(c, "a", "c") == 0
    fail(c, "b")
    try:
        anti_entropy(c, "a", "b")
        raise AssertionError("accepted")
    except ValueError as e:
        assert "node is down" in str(e)
- name: anti-entropy ignores nodes that should not hold a key
  code: |
    c = make_cluster(["a", "b", "c", "d"], replicas=2)
    put(c, "k", 1)
    wanted = preference_list(c, "k")
    outsider = [n for n in c["nodes"] if n not in wanted][0]
    assert anti_entropy(c, wanted[0], outsider) == 0
    assert "k" not in c["data"][outsider]
- name: a day in the life
  code: |
    c = make_cluster(["n1", "n2", "n3", "n4", "n5"], replicas=3)
    for i in range(60):
        put(c, "item%d" % i, "v0")
    fail(c, "n2")
    for i in range(0, 60, 2):
        put(c, "item%d" % i, "v1", w=2)
    recover(c, "n2")
    add_node(c, "n6")
    for i in range(60):
        assert get(c, "item%d" % i, r=2) == ("v1" if i % 2 == 0 else "v0")
    fail(c, "n1"); fail(c, "n3")
    answered = 0
    for i in range(60):
        try:
            get(c, "item%d" % i, r=2)
            answered += 1
        except ValueError:
            pass
    assert 0 < answered <= 60
    assert sum(key_counts(c).values()) == 180
solution: |
  def stable_hash(text):
      """A hash of a string that is the same on every run and every machine (Python's own hash is randomized): FNV-1a over the UTF-8 bytes, followed by a finishing mix. Returns an int in [0, 2**32)."""
      h = 2166136261
      for b in text.encode():
          h ^= b
          h = (h * 16777619) & 0xFFFFFFFF
      h ^= h >> 16
      h = (h * 0x85ebca6b) & 0xFFFFFFFF
      h ^= h >> 13
      h = (h * 0xc2b2ae35) & 0xFFFFFFFF
      h ^= h >> 16
      return h


  import bisect


  def build_ring(nodes, vnodes):
      """A consistent-hashing ring: a sorted list of (hash, node) points. Every node gets `vnodes` virtual nodes, the points stable_hash('NODE#I') for I = 0 .. vnodes - 1."""
      return sorted((stable_hash("%s#%d" % (n, i)), n) for n in nodes for i in range(vnodes))


  def make_cluster(nodes, replicas=3, vnodes=16):
      """Create a cluster: a dict {"nodes": sorted list of node names, "replicas": replicas, "vnodes": vnodes, "ring": build_ring(...), "data": {node: {} for every node}, "down": set(), "clock": 0}.
      ValueError('need at least one node') for an empty list, ValueError('not enough nodes') if replicas is more than the number of nodes, ValueError('bad replicas') if replicas < 1."""
      if not nodes:
          raise ValueError("need at least one node")
      if replicas < 1:
          raise ValueError("bad replicas")
      if replicas > len(nodes):
          raise ValueError("not enough nodes")
      names = sorted(nodes)
      return {"nodes": names, "replicas": replicas, "vnodes": vnodes, "ring": build_ring(names, vnodes),
              "data": {n: {} for n in names}, "down": set(), "clock": 0}


  def preference_list(cluster, key):
      """The nodes responsible for a key: start at the first ring point whose hash is >= stable_hash(key) (wrapping around the end), walk clockwise, and collect the first `replicas` DISTINCT nodes in the order met."""
      ring = cluster["ring"]
      start = bisect.bisect_left(ring, (stable_hash(key), ""))
      found = []
      for i in range(len(ring)):
          node = ring[(start + i) % len(ring)][1]
          if node not in found:
              found.append(node)
              if len(found) == cluster["replicas"]:
                  break
      return found


  def fail(cluster, node):
      """Mark a node as down (it keeps its data but answers nothing). ValueError('unknown node') if it is not in the cluster."""
      if node not in cluster["data"]:
          raise ValueError("unknown node")
      cluster["down"].add(node)


  def recover(cluster, node):
      """Bring a node back up. ValueError('unknown node') if it is not in the cluster."""
      if node not in cluster["data"]:
          raise ValueError("unknown node")
      cluster["down"].discard(node)


  def put(cluster, key, value, w=2):
      """Write a value: add 1 to the cluster's clock and use it as the new version. Store (version, value) on every UP node of the key's preference list. If fewer than w nodes stored it raise ValueError('write quorum not met'); the nodes that were up still keep the write. Return the version."""
      cluster["clock"] += 1
      version = cluster["clock"]
      acks = 0
      for node in preference_list(cluster, key):
          if node not in cluster["down"]:
              cluster["data"][node][key] = (version, value)
              acks += 1
      if acks < w:
          raise ValueError("write quorum not met")
      return version


  def get(cluster, key, r=2):
      """Read a value. Ask every UP node of the key's preference list. If fewer than r are up raise ValueError('read quorum not met'). Take the entry with the highest version among those that have the key and return its value (None if nobody has it).
      READ REPAIR: every UP replica that answered with an older version or none at all is updated to the newest entry."""
      up = [n for n in preference_list(cluster, key) if n not in cluster["down"]]
      if len(up) < r:
          raise ValueError("read quorum not met")
      best = None
      for n in up:
          entry = cluster["data"][n].get(key)
          if entry is not None and (best is None or entry[0] > best[0]):
              best = entry
      if best is None:
          return None
      for n in up:
          entry = cluster["data"][n].get(key)
          if entry is None or entry[0] < best[0]:
              cluster["data"][n][key] = best
      return best[1]


  def rebalance(cluster):
      """Make every key live exactly where its preference list says. For every key held by any node (down nodes included) take the newest entry; store it on every node of the preference list that lacks it or has an older one (counting each store as one copy), and delete the key from nodes that are not in the list. Return the number of copies made."""
      newest = {}
      for node in cluster["nodes"]:
          for key, entry in cluster["data"][node].items():
              if key not in newest or entry[0] > newest[key][0]:
                  newest[key] = entry
      copies = 0
      for key, entry in sorted(newest.items()):
          wanted = preference_list(cluster, key)
          for node in wanted:
              have = cluster["data"][node].get(key)
              if have is None or have[0] < entry[0]:
                  cluster["data"][node][key] = entry
                  copies += 1
          for node in cluster["nodes"]:
              if node not in wanted:
                  cluster["data"][node].pop(key, None)
      return copies


  def add_node(cluster, node):
      """Add a node: ValueError('duplicate node') if it exists. Insert it into the sorted node list, give it an empty data dict, rebuild the ring and rebalance. Return the number of copies rebalance made."""
      if node in cluster["data"]:
          raise ValueError("duplicate node")
      cluster["nodes"] = sorted(cluster["nodes"] + [node])
      cluster["data"][node] = {}
      cluster["ring"] = build_ring(cluster["nodes"], cluster["vnodes"])
      return rebalance(cluster)


  def anti_entropy(cluster, a, b):
      """Repair two UP nodes against each other: for every key held by either, the newer entry is copied to the other node IF that other node is in the key's preference list and has an older entry or none. Return the number of entries copied. ValueError('node is down') if either is down."""
      if a in cluster["down"] or b in cluster["down"]:
          raise ValueError("node is down")
      copied = 0
      keys = set(cluster["data"][a]) | set(cluster["data"][b])
      for key in sorted(keys):
          ea, eb = cluster["data"][a].get(key), cluster["data"][b].get(key)
          wanted = preference_list(cluster, key)
          for node, mine, theirs in ((a, ea, eb), (b, eb, ea)):
              if theirs is not None and node in wanted and (mine is None or mine[0] < theirs[0]):
                  cluster["data"][node][key] = theirs
                  copied += 1
      return copied


  def key_counts(cluster):
      """How many keys each node holds: {node: count}."""
      return {n: len(cluster["data"][n]) for n in cluster["nodes"]}
stretch: Add hinted handoff (a stand-in node temporarily keeps writes for a down replica and hands them
  back when it returns), vector clocks instead of one global counter so concurrent writes are detected,
  or a Merkle-tree comparison to make anti-entropy cheaper.
