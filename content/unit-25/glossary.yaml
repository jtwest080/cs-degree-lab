# Terms introduced in Unit 25 (Database Internals). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Page
  definition: A fixed-size block of a database file, the unit that is read from and written to disk.
  lesson: u25-storage
- term: Durable
  definition: Describes data that survives a crash or a power cut.
  lesson: u25-storage
- term: Slotted page
  definition: A page layout with a directory of slots at the front and records packed from the back.
  lesson: u25-storage
- term: Slot directory
  definition: The table inside a page that records where each record starts and how long it is.
  lesson: u25-storage
- term: Record id
  definition: The address of a row, made of a page number and a slot number.
  lesson: u25-storage
- term: Compaction
  definition: Moving records together inside a page, or merging files, to remove wasted space.
  lesson: u25-storage
- term: Null bitmap
  definition: A row header with one bit per column showing which values are NULL.
  lesson: u25-storage
- term: Buffer pool
  definition: A cache of pages kept in memory so that the disk is read less often.
  lesson: u25-storage
- term: Cache hit
  definition: A request that is answered from the cache.
  lesson: u25-storage
- term: Cache miss
  definition: A request that must go to the slower storage because the item is not in the cache.
  lesson: u25-storage
- term: Eviction
  definition: Removing a page from the cache to make room for another.
  lesson: u25-storage
- term: Dirty page
  definition: A cached page that was changed and not yet written to disk.
  lesson: u25-storage
- term: Pinned page
  definition: A cached page that is in use and must not be evicted.
  lesson: u25-storage
- term: LRU
  definition: 'Least recently used: a policy that evicts the page that has gone unused the longest.'
  lesson: u25-storage
- term: FIFO
  definition: 'First in, first out: a policy that evicts the page that has been cached the longest.'
  lesson: u25-storage
- term: CLOCK
  definition: A cheap approximation of LRU that sweeps a hand over frames with reference bits.
  lesson: u25-storage
- term: Heap file
  definition: A table stored as an unordered collection of pages.
  lesson: u25-storage
- term: Full table scan
  definition: Reading every page of a table to answer a query.
  lesson: u25-storage
- term: Sequential I/O
  definition: Reading or writing data in order, which disks do much faster than random access.
  lesson: u25-storage
- term: B+ tree
  definition: A balanced tree with wide nodes that stores all keys in linked leaves, used by most database indexes.
  lesson: u25-btree
- term: Separator key
  definition: A key in an internal node that marks the boundary between two children.
  lesson: u25-btree
- term: Leaf node
  definition: A node at the bottom of a tree, which holds the actual entries.
  lesson: u25-btree
- term: Internal node
  definition: A node of a tree that holds keys and pointers to children rather than data.
  lesson: u25-btree
- term: Node split
  definition: Dividing a full node in two, pushing a separator key up into the parent.
  lesson: u25-btree
- term: Range scan
  definition: Reading all entries between two keys, in order.
  lesson: u25-btree
- term: Bulk load
  definition: Building an index in one pass from data that is already sorted.
  lesson: u25-btree
- term: Fill factor
  definition: How full the pages of an index are, as a fraction of their capacity.
  lesson: u25-btree
- term: Clustered index
  definition: An index in which the table rows themselves are stored in key order.
  lesson: u25-btree
- term: LSM tree
  definition: 'A log-structured merge tree: a store that buffers writes in memory and merges sorted files in the background.'
  lesson: u25-lsm
- term: Memtable
  definition: The sorted in-memory buffer that receives writes in an LSM tree.
  lesson: u25-lsm
- term: SSTable
  definition: 'A sorted string table: an immutable file of entries sorted by key.'
  lesson: u25-lsm
- term: Tombstone
  definition: A marker that records the deletion of a key until compaction removes it.
  lesson: u25-lsm
- term: Write amplification
  definition: The extra writing a store does beyond the data the user wrote.
  lesson: u25-lsm
- term: Size-tiered compaction
  definition: A strategy that merges tables of similar size.
  lesson: u25-lsm
- term: Leveled compaction
  definition: A strategy that keeps tables in levels, each larger than the one above, with non-overlapping key ranges.
  lesson: u25-lsm
- term: Skip list
  definition: A sorted linked structure with extra shortcut links, used for in-memory sorted data.
  lesson: u25-lsm
- term: Declarative
  definition: Describing what result you want and leaving the method to the system.
  lesson: u25-query
- term: Operator
  definition: One step of a query plan, such as a scan, a filter or a join.
  lesson: u25-query
- term: Iterator model
  definition: A way of running a plan in which each operator hands out one row at a time on request.
  lesson: u25-query
- term: Selection
  definition: Keeping only the rows that satisfy a condition, written WHERE in SQL.
  lesson: u25-query
- term: Nested-loop join
  definition: A join that compares every row of one table with every row of the other.
  lesson: u25-query
- term: Hash join
  definition: A join that builds a hash table of one input and looks up rows of the other.
  lesson: u25-query
- term: Sort-merge join
  definition: A join that sorts both inputs and walks through them together.
  lesson: u25-query
- term: Outer join
  definition: A join that also keeps rows without a match, filling the gaps with NULL.
  lesson: u25-query
- term: Aggregate
  definition: A function such as count, sum or average that summarises many rows.
  lesson: u25-query
- term: Query optimizer
  definition: The part of a database that chooses the cheapest plan for a query.
  lesson: u25-optimizer
- term: Statistics
  definition: Summaries of the data, such as row counts and distinct values, used for estimates.
  lesson: u25-optimizer
- term: Independence assumption
  definition: The guess that conditions on different columns do not influence each other.
  lesson: u25-optimizer
- term: Equi-width histogram
  definition: A histogram whose buckets all cover ranges of the same size.
  lesson: u25-optimizer
- term: Cost model
  definition: A formula that estimates the work of a plan, usually in page reads.
  lesson: u25-optimizer
- term: Sequential scan
  definition: Reading a whole table in order.
  lesson: u25-optimizer
- term: Block nested-loop join
  definition: A nested-loop join that reads one table in chunks that fit in memory.
  lesson: u25-optimizer
- term: External merge sort
  definition: Sorting data larger than memory by sorting chunks and merging them in passes.
  lesson: u25-optimizer
- term: Left-deep plan
  definition: A join plan that joins tables one at a time to the result so far.
  lesson: u25-optimizer
- term: Filter push-down
  definition: Moving a condition lower in the plan so that fewer rows reach later operators.
  lesson: u25-optimizer
- term: EXPLAIN
  definition: An SQL command that shows the plan a database chose.
  lesson: u25-optimizer
- term: Serializability
  definition: The guarantee that concurrent transactions give the same result as some one-at-a-time order.
  lesson: u25-txn
- term: Schedule
  definition: The order in which the steps of several transactions actually ran.
  lesson: u25-txn
- term: Precedence graph
  definition: A graph of which transactions had to come before which, based on conflicts.
  lesson: u25-txn
- term: Phantom
  definition: A row that appears in a repeated query because another transaction inserted it.
  lesson: u25-txn
- term: Shared lock
  definition: A lock that allows reading and can be held by several transactions at once.
  lesson: u25-txn
- term: Exclusive lock
  definition: A lock that allows writing and excludes all other locks.
  lesson: u25-txn
- term: Two-phase locking
  definition: A rule that a transaction takes all its locks before releasing any.
  lesson: u25-txn
- term: Wait-die
  definition: A deadlock-prevention rule in which a younger transaction that would wait is aborted.
  lesson: u25-txn
- term: Wound-wait
  definition: A deadlock-prevention rule in which an older transaction aborts a younger lock holder.
  lesson: u25-txn
- term: Snapshot isolation
  definition: A level of isolation in which each transaction sees the data as it was when it began.
  lesson: u25-txn
- term: Write skew
  definition: An anomaly in which transactions write different rows based on overlapping reads and break a rule.
  lesson: u25-txn
- term: Undo log
  definition: A record of old values used to roll a transaction back.
  lesson: u25-txn
- term: Anomaly
  definition: A problem caused by redundant data, such as an inconsistent update.
  lesson: u25-design
- term: Attribute closure
  definition: The set of all attributes determined by a set of attributes.
  lesson: u25-design
- term: Superkey
  definition: A set of attributes that determines all the attributes of a table.
  lesson: u25-design
- term: Candidate key
  definition: A minimal superkey.
  lesson: u25-design
- term: Prime attribute
  definition: An attribute that belongs to at least one candidate key.
  lesson: u25-design
- term: BCNF
  definition: 'Boyce-Codd normal form: every non-trivial dependency starts from a superkey.'
  lesson: u25-design
- term: Lossless join
  definition: A decomposition that gives back exactly the original rows when joined.
  lesson: u25-design
- term: Dependency preservation
  definition: A decomposition in which every dependency can be checked within one table.
  lesson: u25-design
- term: Minimal cover
  definition: A simplest set of dependencies with the same meaning as a given one.
  lesson: u25-design
