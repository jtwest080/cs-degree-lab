  - The null bitmap comes first; skip NULL columns when writing the values.
  solution: |
    import struct


    def encode_row(schema, row):
        """Pack a row into bytes. `schema` is a list of (name, type) with type 'int', 'bool' or 'text'; `row` is a list of values (None means NULL). Layout: first a NULL BITMAP of ceil(n / 8) bytes (bit i, counting from the lowest bit of the first byte, is 1 if column i is NULL),
        then each non-NULL value in order: int = 4 bytes big-endian signed; bool = 1 byte (0 or 1); text = 2-byte big-endian length then the UTF-8 bytes. ValueError('wrong number of values') if the lengths differ."""
        if len(schema) != len(row):
            raise ValueError("wrong number of values")
        bitmap = bytearray((len(schema) + 7) // 8)
        body = b""
        for i, ((name, kind), value) in enumerate(zip(schema, row)):
            if value is None:
                bitmap[i // 8] |= 1 << (i % 8)
            elif kind == "int":
                body += struct.pack(">i", value)
            elif kind == "bool":
                body += bytes([1 if value else 0])
            else:
                raw = value.encode("utf-8")
                body += struct.pack(">H", len(raw)) + raw
        return bytes(bitmap) + body


    def decode_row(schema, data):
        """The inverse of encode_row: return the list of values (None for NULLs; bool columns come back as True/False)."""
        nbytes = (len(schema) + 7) // 8
        bitmap = data[:nbytes]
        pos = nbytes
        row = []
        for i, (name, kind) in enumerate(schema):
            if bitmap[i // 8] >> (i % 8) & 1:
                row.append(None)
            elif kind == "int":
                row.append(struct.unpack(">i", data[pos:pos + 4])[0])
                pos += 4
            elif kind == "bool":
                row.append(data[pos] == 1)
                pos += 1
            else:
                n = struct.unpack(">H", data[pos:pos + 2])[0]
                row.append(data[pos + 2:pos + 2 + n].decode("utf-8"))
                pos += 2 + n
        return row


    def row_size(schema, row):
        """The number of bytes encode_row would use, computed WITHOUT encoding."""
        size = (len(schema) + 7) // 8
        for (name, kind), value in zip(schema, row):
            if value is None:
                continue
            if kind == "int":
                size += 4
            elif kind == "bool":
                size += 1
            else:
                size += 2 + len(value.encode("utf-8"))
        return size
  explanation: A compact row format means more rows per page and fewer disk reads.
- id: pool
  title: The buffer pool
  difficulty: 5
  prompt: 'Disk is thousands of times slower than memory, so a database keeps recently used pages in a **buffer pool**. Write `new_pool(capacity, disk)` where `disk` is a dict `page_id -> contents`: return `{"cap", "disk", "frames": OrderedDict(), "hits": 0, "misses": 0, "writes": 0}`; frames map `page_id -> {"data", "pins", "dirty"}` kept in order from **least** to **most recently used** (`ValueError("bad capacity")` if `capacity < 1`). Write `fetch(pool, page_id)`, which gets a page and **pins** it (`pins += 1`, a pinned page cannot be evicted). If it is cached: `hits += 1` and it becomes most recently used. Otherwise: `misses += 1`; if the pool is full evict the **least recently used frame with no pins**, first writing it back to the disk dict (`writes += 1`) if it is **dirty** (`ValueError("all pages pinned")` if every frame is pinned); load the page from disk with `pins = 1` and `dirty = False` (`ValueError("no such page")` if the disk lacks it). Return the page''s data. Write `unpin(pool, page_id, dirty=False)` (one pin fewer; `dirty=True` marks the frame dirty; `ValueError("not pinned")` if the page is not cached or has no pins) and `flush_all(pool)`: write back every dirty frame (`writes += 1` each), mark them clean and return how many were written.'
  starter: |-
    from collections import OrderedDict


    def new_pool(capacity, disk):
        """A BUFFER POOL caching pages of a 'disk' (a dict page_id -> contents). Return {"cap": capacity, "disk": disk, "frames": OrderedDict(), "hits": 0, "misses": 0, "writes": 0}; the frames map page_id -> {"data", "pins", "dirty"} and are kept in order from least to most recently used. ValueError('bad capacity') if capacity < 1."""
        pass


    def fetch(pool, page_id):
        """Get a page and PIN it (pins += 1) so it cannot be evicted. If it is cached: hits += 1 and mark it most recently used. Otherwise: misses += 1; if the pool is full evict the LEAST recently used frame with pins == 0, writing it back to disk first (writes += 1) if it is dirty
        (ValueError('all pages pinned') if every frame is pinned); then load the page from disk (ValueError('no such page') if the disk lacks it) with pins = 1 and dirty False. Return the page's data."""
        pass


    def unpin(pool, page_id, dirty=False):
        """Release one pin on a cached page; if dirty is True mark the frame dirty. ValueError('not pinned') if the page is not cached or has no pins."""
        pass


    def flush_all(pool):
        """Write every dirty cached frame back to disk (writes += 1 each), mark them clean, and return how many were written."""
        pass
  tests:
  - name: hits and misses
