    def simulate_lru(capacity, accesses):
        """Count the cache HITS when the page ids in `accesses` are requested in order and a cache of `capacity` pages evicts the LEAST RECENTLY USED page."""
        pass


    def simulate_fifo(capacity, accesses):
        """The same count of hits for FIFO: evict the page that has been in the cache the LONGEST (a hit does not change the order)."""
        pass


    def simulate_clock(capacity, accesses):
        """The same count of hits for the CLOCK algorithm, an approximation of LRU. Keep `frames` (page ids), a reference bit for each, and a hand index starting at 0. A hit sets the page's bit to 1. A miss while there is room appends the page with bit 1. A miss when full: while the frame under the hand has bit 1, clear it and advance the hand (wrapping);
        then replace that frame by the new page with bit 1 and advance the hand once more (wrapping)."""
        pass
