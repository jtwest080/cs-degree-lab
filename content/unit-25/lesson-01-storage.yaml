              assert "not pinned" in str(e)
  - name: dirty pages are written back
    code: |
      disk = {0: [1], 1: [2], 2: [3]}
      pool = new_pool(2, disk)
      page = fetch(pool, 0)
      page.append(100)
      unpin(pool, 0, dirty=True)
      fetch(pool, 1); unpin(pool, 1)
      assert pool["writes"] == 0
      fetch(pool, 2); unpin(pool, 2)
      assert pool["writes"] == 1 and disk[0] == [1, 100] and 0 not in pool["frames"]
      d = fetch(pool, 2); d.append(7); unpin(pool, 2, dirty=True)
      d = fetch(pool, 1); d.append(9); unpin(pool, 1, dirty=True)
      assert flush_all(pool) == 2 and pool["writes"] == 3 and disk[2] == [3, 7] and disk[1] == [2, 9]
      assert flush_all(pool) == 0
  hints:
  - 'The OrderedDict keeps frames in recency order: move_to_end on a hit, and look for victims from the front.'
  solution: |
    from collections import OrderedDict


    def new_pool(capacity, disk):
        """A BUFFER POOL caching pages of a 'disk' (a dict page_id -> contents). Return {"cap": capacity, "disk": disk, "frames": OrderedDict(), "hits": 0, "misses": 0, "writes": 0}; the frames map page_id -> {"data", "pins", "dirty"} and are kept in order from least to most recently used. ValueError('bad capacity') if capacity < 1."""
        if capacity < 1:
            raise ValueError("bad capacity")
        return {"cap": capacity, "disk": disk, "frames": OrderedDict(), "hits": 0, "misses": 0, "writes": 0}


    def fetch(pool, page_id):
        """Get a page and PIN it (pins += 1) so it cannot be evicted. If it is cached: hits += 1 and mark it most recently used. Otherwise: misses += 1; if the pool is full evict the LEAST recently used frame with pins == 0, writing it back to disk first (writes += 1) if it is dirty
        (ValueError('all pages pinned') if every frame is pinned); then load the page from disk (ValueError('no such page') if the disk lacks it) with pins = 1 and dirty False. Return the page's data."""
        frames = pool["frames"]
        if page_id in frames:
            pool["hits"] += 1
            frames.move_to_end(page_id)
            frames[page_id]["pins"] += 1
            return frames[page_id]["data"]
        if page_id not in pool["disk"]:
            raise ValueError("no such page")
        pool["misses"] += 1
        if len(frames) >= pool["cap"]:
            victim = next((p for p, f in frames.items() if f["pins"] == 0), None)
            if victim is None:
                raise ValueError("all pages pinned")
            if frames[victim]["dirty"]:
                pool["disk"][victim] = frames[victim]["data"]
                pool["writes"] += 1
            del frames[victim]
        frames[page_id] = {"data": pool["disk"][page_id], "pins": 1, "dirty": False}
        return frames[page_id]["data"]


    def unpin(pool, page_id, dirty=False):
        """Release one pin on a cached page; if dirty is True mark the frame dirty. ValueError('not pinned') if the page is not cached or has no pins."""
        f = pool["frames"].get(page_id)
        if f is None or f["pins"] == 0:
            raise ValueError("not pinned")
        f["pins"] -= 1
        if dirty:
            f["dirty"] = True


    def flush_all(pool):
        """Write every dirty cached frame back to disk (writes += 1 each), mark them clean, and return how many were written."""
        n = 0
        for pid, f in pool["frames"].items():
            if f["dirty"]:
                pool["disk"][pid] = f["data"]
                f["dirty"] = False
                pool["writes"] += 1
                n += 1
        return n
  explanation: 'The buffer pool is why databases are fast: most requests are answered from memory.'
- id: policy
  title: Replacement policies
  difficulty: 4
  prompt: 'Which page should the buffer pool throw out? Write three functions that each count the **hits** when the page ids in `accesses` are requested in order and the cache holds `capacity` pages. `simulate_lru(capacity, accesses)` evicts the **least recently used** page. `simulate_fifo(capacity, accesses)` evicts the page that has been cached the **longest** (a hit does not change the order). `simulate_clock(capacity, accesses)` is the **CLOCK** algorithm, a cheap approximation of LRU: keep the frames, a **reference bit** for each, and a hand index starting at 0. A hit sets that page''s bit to 1. A miss while there is room appends the page with bit 1. A miss when full: while the frame under the hand has bit 1, clear it and advance the hand (wrapping around); then replace that frame by the new page (bit 1) and advance the hand once more (wrapping).'
