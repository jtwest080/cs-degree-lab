  tests:
  - name: inserting and reading
    code: |
      p = new_page(64)
      assert p["free_end"] == 64 and free_space(p) == 56 and p["slots"] == []
      a = insert_record(p, b"hello")
      b = insert_record(p, b"world!!")
      assert (a, b) == (0, 1)
      assert read_record(p, 0) == b"hello" and read_record(p, 1) == b"world!!"
      assert p["free_end"] == 64 - 12 and free_space(p) == 52 - 16
      assert p["slots"][0] == (59, 5) and p["slots"][1] == (52, 7)
      for bad in (-1, 2):
          try:
              read_record(p, bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad slot" in str(e)
      try:
          new_page(10)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "too small" in str(e)
  - name: a full page
    code: |
      p = new_page(32)
      assert insert_record(p, b"x" * 20) == 0
      assert free_space(p) == 32 - 20 - 12
      try:
          insert_record(p, b"y" * 1)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "page full" in str(e)
      assert len(p["slots"]) == 1
      assert insert_record(new_page(32), b"z" * 20) == 0
      q = new_page(32)
      try:
          insert_record(q, b"z" * 21)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "page full" in str(e)
  - name: deleting and reusing slots
    code: |
      p = new_page(64)
      for r in (b"aa", b"bb", b"cc"):
          insert_record(p, r)
      assert delete_record(p, 1) is True and delete_record(p, 1) is False
      assert read_record(p, 1) is None and read_record(p, 2) == b"cc"
      assert free_space(p) == 64 - 6 - 8 - 12
      assert insert_record(p, b"new") == 1
      assert read_record(p, 1) == b"new" and len(p["slots"]) == 3
      assert free_space(p) == 64 - 9 - 8 - 12
      try:
          delete_record(p, 7)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "bad slot" in str(e)
  - name: compaction
    code: |
      p = new_page(48)
      for r in (b"AAAA", b"BBBBBB", b"CC", b"DDD"):
          insert_record(p, r)
      delete_record(p, 0); delete_record(p, 2)
      before = p["free_end"]
      gained = compact(p)
      assert gained == 6 and p["free_end"] == before + 6
      assert read_record(p, 1) == b"BBBBBB" and read_record(p, 3) == b"DDD"
      assert read_record(p, 0) is None and read_record(p, 2) is None
      assert p["slots"][3] == (39, 3) and p["slots"][1] == (42, 6)
      assert compact(p) == 0
      assert insert_record(p, b"E" * 8) == 0 and read_record(p, 3) == b"DDD"
