      assert simulate_lru(3, [1, 2, 3, 1, 2, 3, 1, 2, 3]) == 6
      assert simulate_lru(3, [1, 2, 3, 4] * 5) == 0
      assert simulate_lru(1, [5, 5, 5]) == 2 and simulate_lru(4, []) == 0
  - name: FIFO
    code: |
      assert simulate_fifo(2, [1, 2, 1, 3, 2]) == 2
      assert simulate_fifo(2, [1, 2, 1, 3, 1]) == 1
      assert simulate_lru(2, [1, 2, 1, 3, 1]) == 2
      assert simulate_fifo(3, [1, 2, 3, 1, 2, 3]) == 3
      assert simulate_fifo(3, [1, 2, 3, 4, 1, 2, 3, 4]) == 0
