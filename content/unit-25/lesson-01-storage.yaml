      disk = {i: "page%d" % i for i in range(10)}
      pool = new_pool(3, disk)
      assert fetch(pool, 1) == "page1" and fetch(pool, 2) == "page2"
      unpin(pool, 1); unpin(pool, 2)
      assert fetch(pool, 1) == "page1"
      assert (pool["hits"], pool["misses"]) == (1, 2)
