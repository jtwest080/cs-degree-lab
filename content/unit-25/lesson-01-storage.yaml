      import random
      rng = random.Random(3)
      hot = [rng.randrange(5) if rng.random() < 0.8 else 5 + rng.randrange(40) for _ in range(2000)]
      lru, fifo, clock = simulate_lru(8, hot), simulate_fifo(8, hot), simulate_clock(8, hot)
      assert lru >= fifo and abs(clock - lru) < 150, (lru, fifo, clock)
      assert lru > 1000
      scan = list(range(100)) * 3
      assert simulate_lru(50, scan) == 0 and simulate_clock(50, scan) == 0 and simulate_fifo(50, scan) == 0
