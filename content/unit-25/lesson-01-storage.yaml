  - 'Do each policy with a small list; for CLOCK keep three variables: frames, bits and hand.'
  solution: |
    def simulate_lru(capacity, accesses):
        """Count the cache HITS when the page ids in `accesses` are requested in order and a cache of `capacity` pages evicts the LEAST RECENTLY USED page."""
        cache = []
        hits = 0
        for p in accesses:
            if p in cache:
                hits += 1
                cache.remove(p)
            elif len(cache) >= capacity:
                cache.pop(0)
            cache.append(p)
        return hits


    def simulate_fifo(capacity, accesses):
        """The same count of hits for FIFO: evict the page that has been in the cache the LONGEST (a hit does not change the order)."""
        cache = []
        hits = 0
        for p in accesses:
            if p in cache:
                hits += 1
            else:
                if len(cache) >= capacity:
                    cache.pop(0)
                cache.append(p)
        return hits


    def simulate_clock(capacity, accesses):
        """The same count of hits for the CLOCK algorithm, an approximation of LRU. Keep `frames` (page ids), a reference bit for each, and a hand index starting at 0. A hit sets the page's bit to 1. A miss while there is room appends the page with bit 1. A miss when full: while the frame under the hand has bit 1, clear it and advance the hand (wrapping);
        then replace that frame by the new page with bit 1 and advance the hand once more (wrapping)."""
        frames, bits = [], []
        hand = 0
        hits = 0
        for p in accesses:
            if p in frames:
                hits += 1
                bits[frames.index(p)] = 1
            elif len(frames) < capacity:
                frames.append(p)
                bits.append(1)
            else:
                while bits[hand]:
                    bits[hand] = 0
                    hand = (hand + 1) % capacity
                frames[hand] = p
                bits[hand] = 1
                hand = (hand + 1) % capacity
        return hits
  explanation: A sequential scan of a table bigger than the cache defeats LRU, which is why databases protect the cache from scans.
- id: heap
  title: 'Capstone: a heap file'
  difficulty: 5
  prompt: 'Starter code gives you the slotted-page functions. Build a **heap file**, the simplest table storage: an unordered list of pages. Write `new_table(page_size)` returning `{"page_size": page_size, "pages": []}`; `heap_insert(table, record)`, which stores the record in the **first** page that has room (use `insert_record` and catch `ValueError`), adding a new page if none does, and returns the record id `(page_number, slot)` (`ValueError("record too large")` if it would not fit even in an empty page); `heap_read(table, rid)` (the bytes, or `None` if deleted; `ValueError("bad record id")` if the page does not exist); `heap_delete(table, rid)` (True if something was deleted; same error) and `heap_scan(table)`: the list of `(record id, bytes)` for every live record, ordered by page then slot.'
  starter: |-
    HEADER = 8
    SLOT = 4


    def new_page(size):
        """An empty SLOTTED PAGE of `size` bytes: {"size": size, "slots": [], "data": bytearray(size), "free_end": size}. Records are stored at the END of the page growing downward (free_end moves down); the slot directory (one (offset, length) pair per slot, None for a deleted slot) conceptually sits after an 8-byte header and costs 4 bytes per slot.
        ValueError('page too small') if size < 16."""
        if size < 16:
            raise ValueError("page too small")
        return {"size": size, "slots": [], "data": bytearray(size), "free_end": size}


    def free_space(page):
        """The bytes still free between the slot directory and the records: free_end - (HEADER + SLOT * number of slots)."""
        return page["free_end"] - (HEADER + SLOT * len(page["slots"]))


    def insert_record(page, record):
        """Store `record` (bytes) and return its slot number. Reuse the lowest-numbered deleted slot if there is one (then no new directory entry is needed), otherwise add a new slot. The record needs len(record) bytes, plus SLOT bytes if a new slot is added; if that does not fit in free_space raise ValueError('page full').
        Records are written just below free_end."""
        reuse = next((i for i, s in enumerate(page["slots"]) if s is None), None)
        need = len(record) + (0 if reuse is not None else SLOT)
        if need > free_space(page):
            raise ValueError("page full")
        page["free_end"] -= len(record)
        start = page["free_end"]
        page["data"][start:start + len(record)] = record
        if reuse is None:
            page["slots"].append((start, len(record)))
            return len(page["slots"]) - 1
        page["slots"][reuse] = (start, len(record))
        return reuse


    def read_record(page, slot):
        """The bytes of the record in a slot, or None if it was deleted. ValueError('bad slot') if the slot number does not exist."""
        if slot < 0 or slot >= len(page["slots"]):
            raise ValueError("bad slot")
        entry = page["slots"][slot]
        if entry is None:
            return None
        return bytes(page["data"][entry[0]:entry[0] + entry[1]])


    def delete_record(page, slot):
        """Delete the record in a slot (the slot becomes None; the other slot numbers do not change). Return True if a record was deleted, False if it was already deleted. ValueError('bad slot') for a slot that does not exist."""
        if slot < 0 or slot >= len(page["slots"]):
            raise ValueError("bad slot")
        if page["slots"][slot] is None:
            return False
        page["slots"][slot] = None
        return True


    def compact(page):
        """Squeeze out the holes left by deleted records: move all live records to the end of the page, in DESCENDING order of their current offsets (so no record is overwritten), keeping slot numbers. Update free_end and return the number of bytes gained
        (the new free_end minus the old free_end)."""
        old = page["free_end"]
        live = sorted(((s[0], i) for i, s in enumerate(page["slots"]) if s is not None), reverse=True)
        end = page["size"]
        for offset, i in live:
            length = page["slots"][i][1]
            end -= length
            page["data"][end:end + length] = page["data"][offset:offset + length]
            page["slots"][i] = (end, length)
        page["free_end"] = end
        return end - old


    def new_table(page_size):
        """A HEAP FILE: {"page_size": page_size, "pages": []}, a list of slotted pages (built with new_page)."""
        pass


    def heap_insert(table, record):
        """Store a record in the FIRST page that has room for it (use insert_record and catch ValueError), adding a new page if none does. Return its record id (page_number, slot). ValueError('record too large') if the record could not fit even in an empty page."""
        pass


    def heap_read(table, rid):
        """The record with this (page_number, slot) id, or None if deleted. ValueError('bad record id') if the page does not exist."""
        pass


    def heap_delete(table, rid):
        """Delete the record with this id (see delete_record); return True if something was deleted. ValueError('bad record id') if the page does not exist."""
        pass


    def heap_scan(table):
        """A FULL TABLE SCAN: the list of (record id, bytes) for every live record, by page then slot."""
        pass
  tests:
  - name: inserting
    code: |
      t = new_table(40)
      assert heap_insert(t, b"a" * 10) == (0, 0)
      assert heap_insert(t, b"b" * 10) == (0, 1)
      assert heap_insert(t, b"c" * 10) == (1, 0)
      assert len(t["pages"]) == 2 and heap_read(t, (0, 1)) == b"b" * 10
      assert heap_insert(t, b"d") == (1, 1)
      try:
          heap_insert(t, b"x" * 40)
          raise AssertionError("accepted")
      except ValueError as e:
