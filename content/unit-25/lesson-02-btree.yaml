id: u25-btree
title: B+ Trees and Indexes
minutes: 90
objective: Learn the data structure that makes databases fast. You will search a B+ tree, insert keys and split nodes, scan ranges through linked leaves, validate the tree, bulk-load an index and build a real index on a table.
outcomes:
- Explain why a table needs an index
- Search a B+ tree page by page
- Insert keys and split nodes to stay balanced
- Run range scans through linked leaves
- Bulk-load a tree from sorted data
- Build a non-unique index
sections:
- heading: Why an index?
  body: |-
    Suppose a table has ten million rows and you ask for the one with a particular email address. Without help the database must read every page of the heap file: a **full table scan**, millions of reads. An **index** is a second structure, kept beside the table, that maps a column's values to the places where those rows are stored, like the index at the back of a book. With an index the same question needs only a handful of page reads.

    The index of almost every database is a **B+ tree** (the B is thought to stand for Bayer, its inventor, or for "balanced"). It is a close cousin of the binary search trees you met earlier, but each node is a whole **page** holding hundreds of sorted keys, not just one. Wide nodes keep the tree extremely shallow, and because each node is read from disk in one go, the width costs almost nothing.
- heading: The shape of a B+ tree
  body: |-
    A B+ tree has two kinds of node. An **internal** node holds sorted **separator keys** and one more **child** pointer than keys. The child before a separator holds keys smaller than it, the child after holds keys greater or equal. A **leaf** node holds the actual keys together with their values (or record ids) and a pointer to the **next leaf**, so all leaves form one long sorted chain. Every leaf is at the **same depth**, which is what "balanced" means.

    To search, start at the root, do a **binary search** among its keys to choose the child, and repeat until you reach a leaf, where you look for the exact key. The cost is one page read per level, which is the **height** of the tree. The number of children per node is called the **fanout**. With a fanout of 500 a tree of just 4 levels holds 500 to the power 4, roughly 60 billion, keys, and the top levels are small enough to stay in the buffer pool, so a lookup typically costs one or two actual disk reads.

    Because the leaves are chained, a **range scan** (every key between 100 and 200) searches once for the lower bound and then simply walks right along the leaves, reading pages in sorted order. That is why indexes also make ORDER BY cheap.
- heading: Inserting and splitting
  body: |-
    To insert a key, search for the leaf where it belongs and put it there in sorted position. If the leaf now holds more keys than a page can take, it is **split** into two leaves, each about half full, and the first key of the new right leaf is **copied up** as a separator into the parent. That may overflow the parent, which splits in the same way (except the middle separator is **moved** up, not copied). Splits can ripple all the way to the root; when the root splits, a new root is created above it and the whole tree grows **one level taller**. The tree therefore grows from the top, never unbalanced.

    A tree filled by random inserts has leaves between half and full, about 70 percent on average, which wastes space. If the data already exists in sorted order, a **bulk load** builds the tree from the bottom up: fill the leaves completely, then build each level of parents above them. Databases do this when you run CREATE INDEX. Deleting is the mirror image: a node left too empty is merged with a neighbour or borrows keys from one. Many systems simply tolerate underfull pages and rebuild the index occasionally.
- heading: Indexes in practice
  body: A **clustered** index stores the rows themselves in the leaves, so the table *is* the tree, sorted by that key (MySQL's InnoDB does this with the primary key). A **secondary** index stores, for each key, the record id or primary key of a row. Several rows may share a value, so a non-unique index keeps a list of ids for each key. Every index speeds up reading but slows down writing, since each insert, update or delete must change every index on the table, and costs disk space. Choosing which columns to index is one of the main skills of working with databases.
examples:
- title: Building and searching a tree
  intro: Seven inserts into a tiny tree with room for three keys per node.
  code: |
    def new_tree(max_keys):
        """An empty B+TREE whose nodes hold at most `max_keys` keys: {"max": max_keys, "root": a leaf}. A node is a dict. A LEAF is {"leaf": True, "keys": [], "vals": [], "next": None} (next links to the leaf on its right); an INTERNAL node is {"leaf": False, "keys": [...], "children": [...]} with len(children) == len(keys) + 1.
        ValueError('max_keys must be at least 3') if max_keys < 3."""
        if max_keys < 3:
            raise ValueError("max_keys must be at least 3")
        return {"max": max_keys, "root": {"leaf": True, "keys": [], "vals": [], "next": None}}


    def child_index(keys, key):
        """Binary search in one node: how many of the sorted `keys` are <= key (0 .. len(keys)). Write the loop yourself; do not use the bisect module. In an internal node this is the index of the child to follow."""
        lo, hi = 0, len(keys)
        while lo < hi:
            mid = (lo + hi) // 2
            if keys[mid] <= key:
                lo = mid + 1
            else:
                hi = mid
        return lo


    def find_leaf(node, key):
        """Walk down from `node` to the leaf that would hold `key`, following children[child_index(keys, key)] in every internal node."""
        while not node["leaf"]:
            node = node["children"][child_index(node["keys"], key)]
        return node


    def search(tree, key):
        """The value stored under `key`, or None if the key is absent (values are never None)."""
        leaf = find_leaf(tree["root"], key)
        i = child_index(leaf["keys"], key)
        if i > 0 and leaf["keys"][i - 1] == key:
            return leaf["vals"][i - 1]
        return None


    def height(tree):
        """The number of levels: 1 for a tree that is a single leaf."""
        node, h = tree["root"], 1
        while not node["leaf"]:
            node = node["children"][0]
            h += 1
        return h


    def insert(tree, key, value):
        """Add key -> value. If the key exists replace its value and return False; otherwise return True. Put a new key into its leaf in sorted position. While a node has MORE than tree["max"] keys, SPLIT it: with mid = len(keys) // 2,
        a leaf keeps keys[:mid] and a new right sibling gets keys[mid:] (and the matching vals; fix the `next` links) and the separator pushed up is the first key of the new right leaf; an internal node keeps keys[:mid] with children[:mid + 1], the separator pushed up is keys[mid] (it leaves the node),
        and the new right node gets keys[mid + 1:] with children[mid + 1:]. Insert the separator into the parent just after the position of the node that split (keys.insert(i, sep) and children.insert(i + 1, right)); if the root splits, make a new root with the single separator and the two halves."""
        path = []
        node = tree["root"]
        while not node["leaf"]:
            i = child_index(node["keys"], key)
            path.append((node, i))
            node = node["children"][i]
        j = child_index(node["keys"], key)
        if j > 0 and node["keys"][j - 1] == key:
            node["vals"][j - 1] = value
            return False
        node["keys"].insert(j, key)
        node["vals"].insert(j, value)
        while len(node["keys"]) > tree["max"]:
            mid = len(node["keys"]) // 2
            if node["leaf"]:
                right = {"leaf": True, "keys": node["keys"][mid:], "vals": node["vals"][mid:], "next": node["next"]}
                node["keys"] = node["keys"][:mid]
                node["vals"] = node["vals"][:mid]
                node["next"] = right
                sep = right["keys"][0]
            else:
                sep = node["keys"][mid]
                right = {"leaf": False, "keys": node["keys"][mid + 1:], "children": node["children"][mid + 1:]}
                node["keys"] = node["keys"][:mid]
                node["children"] = node["children"][:mid + 1]
            if not path:
                tree["root"] = {"leaf": False, "keys": [sep], "children": [node, right]}
                break
            parent, i = path.pop()
            parent["keys"].insert(i, sep)
            parent["children"].insert(i + 1, right)
            node = parent
        return True


    def leftmost_leaf(tree):
        """The first (smallest) leaf of the tree."""
        node = tree["root"]
        while not node["leaf"]:
            node = node["children"][0]
        return node


    def all_items(tree):
        """Every (key, value) pair in key order, found by walking the chain of leaves with their `next` links from the leftmost leaf (never by going back up the tree)."""
        out = []
        leaf = leftmost_leaf(tree)
        while leaf is not None:
            out.extend(zip(leaf["keys"], leaf["vals"]))
            leaf = leaf["next"]
        return out


    def range_scan(tree, lo, hi):
        """All (key, value) pairs with lo <= key <= hi in key order. Descend ONCE to the leaf for `lo`, then follow the `next` links, stopping as soon as a key exceeds hi. An empty list if lo > hi."""
        out = []
        if lo > hi:
            return out
        leaf = find_leaf(tree["root"], lo)
        while leaf is not None:
            for k, v in zip(leaf["keys"], leaf["vals"]):
                if k > hi:
                    return out
                if k >= lo:
                    out.append((k, v))
            leaf = leaf["next"]
        return out


    def delete(tree, key):
        """Remove a key from its leaf and return True; False if it was absent. (This simple version never merges or rebalances nodes, so leaves may become small or even empty, and the rest of the tree stays valid.)"""
        leaf = find_leaf(tree["root"], key)
        i = child_index(leaf["keys"], key)
        if i > 0 and leaf["keys"][i - 1] == key:
            del leaf["keys"][i - 1]
            del leaf["vals"][i - 1]
            return True
        return False


    def is_valid(tree):
        """Check the tree's invariants and return True or False: every node has at most tree["max"] keys; keys inside a node are strictly increasing; an internal node has len(keys) + 1 children; every key in children[i] is >= keys[i - 1] and < keys[i] (where those exist);
        all leaves are at the same depth; and following the `next` links from the leftmost leaf visits exactly the leaves in left-to-right order, ending with None."""
        leaves = []

        def walk(node, lo, hi, depth):
            keys = node["keys"]
            if len(keys) > tree["max"] or any(a >= b for a, b in zip(keys, keys[1:])):
                return None
            if any((lo is not None and k < lo) or (hi is not None and k >= hi) for k in keys):
                return None
            if node["leaf"]:
                leaves.append(node)
                return depth
            if len(node["children"]) != len(keys) + 1:
                return None
            depths = set()
            for i, child in enumerate(node["children"]):
                clo = keys[i - 1] if i > 0 else lo
                chi = keys[i] if i < len(keys) else hi
                d = walk(child, clo, chi, depth + 1)
                if d is None:
                    return None
                depths.add(d)
            return depths.pop() if len(depths) == 1 else None

        if walk(tree["root"], None, None, 1) is None:
            return False
        for a, b in zip(leaves, leaves[1:]):
            if a["next"] is not b:
                return False
        return leaves[-1]["next"] is None

    tree = new_tree(3)
    for k in (10, 20, 30, 40, 50, 60, 70):
        insert(tree, k, "row" + str(k))
    print("height after 7 inserts:", height(tree), "root separators:", tree["root"]["keys"])
    print("search 40:", search(tree, 40), "search 45:", search(tree, 45))
    print("range 25 to 60:", range_scan(tree, 25, 60))
    print("valid:", is_valid(tree))
    print("leaf chain:", [leaf_keys for leaf_keys in all_items(tree)][:3], "...")
  output: |
    height after 7 inserts: 2 root separators: [30, 50]
    search 40: row40 search 45: None
    range 25 to 60: [(30, 'row30'), (40, 'row40'), (50, 'row50'), (60, 'row60')]
    valid: True
    leaf chain: [(10, 'row10'), (20, 'row20'), (30, 'row30')] ...
