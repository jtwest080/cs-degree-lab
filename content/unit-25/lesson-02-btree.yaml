- title: Splitting leaves and internal nodes the same way
  explanation: A leaf copies its separator up; an internal node moves it up.
- title: Forgetting the next pointers when splitting a leaf
  explanation: Range scans would skip or loop.
- title: Indexing every column
  explanation: Each index slows writes and costs space.
- title: Using a tree with tiny nodes
  explanation: The point of a B-tree is wide nodes that match disk pages.
summary:
- An index avoids reading the whole table.
- A B+ tree has wide sorted nodes and all leaves at the same depth.
- A search costs one page read per level, and the height stays tiny.
- Overflowing nodes split, and the tree grows from the root.
- Linked leaves make range scans and sorting cheap.
- Bulk loading builds a packed tree from sorted data.
