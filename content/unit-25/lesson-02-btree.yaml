  - line: 166
    note: Seven keys with room for three per node need two levels.
  - line: 167
    note: Missing keys return None.
  - line: 168
    note: One descent, then walk along the leaves.
  - line: 169
    note: All invariants hold.
- title: A hundred thousand keys
  intro: A wide tree is only three levels tall, and bulk loading packs it fully.
  code: |
    def new_tree(max_keys):
        """An empty B+TREE whose nodes hold at most `max_keys` keys: {"max": max_keys, "root": a leaf}. A node is a dict. A LEAF is {"leaf": True, "keys": [], "vals": [], "next": None} (next links to the leaf on its right); an INTERNAL node is {"leaf": False, "keys": [...], "children": [...]} with len(children) == len(keys) + 1.
        ValueError('max_keys must be at least 3') if max_keys < 3."""
        if max_keys < 3:
            raise ValueError("max_keys must be at least 3")
        return {"max": max_keys, "root": {"leaf": True, "keys": [], "vals": [], "next": None}}


    def child_index(keys, key):
        """Binary search in one node: how many of the sorted `keys` are <= key (0 .. len(keys)). Write the loop yourself; do not use the bisect module. In an internal node this is the index of the child to follow."""
        lo, hi = 0, len(keys)
        while lo < hi:
            mid = (lo + hi) // 2
            if keys[mid] <= key:
                lo = mid + 1
            else:
                hi = mid
        return lo


    def find_leaf(node, key):
        """Walk down from `node` to the leaf that would hold `key`, following children[child_index(keys, key)] in every internal node."""
        while not node["leaf"]:
            node = node["children"][child_index(node["keys"], key)]
        return node


    def search(tree, key):
        """The value stored under `key`, or None if the key is absent (values are never None)."""
        leaf = find_leaf(tree["root"], key)
        i = child_index(leaf["keys"], key)
        if i > 0 and leaf["keys"][i - 1] == key:
            return leaf["vals"][i - 1]
        return None


    def height(tree):
        """The number of levels: 1 for a tree that is a single leaf."""
        node, h = tree["root"], 1
        while not node["leaf"]:
            node = node["children"][0]
            h += 1
        return h


    def insert(tree, key, value):
        """Add key -> value. If the key exists replace its value and return False; otherwise return True. Put a new key into its leaf in sorted position. While a node has MORE than tree["max"] keys, SPLIT it: with mid = len(keys) // 2,
        a leaf keeps keys[:mid] and a new right sibling gets keys[mid:] (and the matching vals; fix the `next` links) and the separator pushed up is the first key of the new right leaf; an internal node keeps keys[:mid] with children[:mid + 1], the separator pushed up is keys[mid] (it leaves the node),
        and the new right node gets keys[mid + 1:] with children[mid + 1:]. Insert the separator into the parent just after the position of the node that split (keys.insert(i, sep) and children.insert(i + 1, right)); if the root splits, make a new root with the single separator and the two halves."""
        path = []
        node = tree["root"]
        while not node["leaf"]:
            i = child_index(node["keys"], key)
            path.append((node, i))
            node = node["children"][i]
        j = child_index(node["keys"], key)
        if j > 0 and node["keys"][j - 1] == key:
            node["vals"][j - 1] = value
            return False
        node["keys"].insert(j, key)
        node["vals"].insert(j, value)
        while len(node["keys"]) > tree["max"]:
            mid = len(node["keys"]) // 2
            if node["leaf"]:
                right = {"leaf": True, "keys": node["keys"][mid:], "vals": node["vals"][mid:], "next": node["next"]}
                node["keys"] = node["keys"][:mid]
                node["vals"] = node["vals"][:mid]
                node["next"] = right
                sep = right["keys"][0]
            else:
                sep = node["keys"][mid]
                right = {"leaf": False, "keys": node["keys"][mid + 1:], "children": node["children"][mid + 1:]}
                node["keys"] = node["keys"][:mid]
                node["children"] = node["children"][:mid + 1]
            if not path:
                tree["root"] = {"leaf": False, "keys": [sep], "children": [node, right]}
                break
            parent, i = path.pop()
            parent["keys"].insert(i, sep)
            parent["children"].insert(i + 1, right)
            node = parent
        return True


    def leftmost_leaf(tree):
        """The first (smallest) leaf of the tree."""
        node = tree["root"]
        while not node["leaf"]:
            node = node["children"][0]
        return node


    def all_items(tree):
        """Every (key, value) pair in key order, found by walking the chain of leaves with their `next` links from the leftmost leaf (never by going back up the tree)."""
        out = []
        leaf = leftmost_leaf(tree)
        while leaf is not None:
            out.extend(zip(leaf["keys"], leaf["vals"]))
            leaf = leaf["next"]
        return out


    def range_scan(tree, lo, hi):
        """All (key, value) pairs with lo <= key <= hi in key order. Descend ONCE to the leaf for `lo`, then follow the `next` links, stopping as soon as a key exceeds hi. An empty list if lo > hi."""
        out = []
        if lo > hi:
            return out
        leaf = find_leaf(tree["root"], lo)
        while leaf is not None:
            for k, v in zip(leaf["keys"], leaf["vals"]):
                if k > hi:
                    return out
                if k >= lo:
                    out.append((k, v))
            leaf = leaf["next"]
        return out


    def delete(tree, key):
        """Remove a key from its leaf and return True; False if it was absent. (This simple version never merges or rebalances nodes, so leaves may become small or even empty, and the rest of the tree stays valid.)"""
        leaf = find_leaf(tree["root"], key)
        i = child_index(leaf["keys"], key)
        if i > 0 and leaf["keys"][i - 1] == key:
            del leaf["keys"][i - 1]
            del leaf["vals"][i - 1]
            return True
        return False


    def is_valid(tree):
        """Check the tree's invariants and return True or False: every node has at most tree["max"] keys; keys inside a node are strictly increasing; an internal node has len(keys) + 1 children; every key in children[i] is >= keys[i - 1] and < keys[i] (where those exist);
        all leaves are at the same depth; and following the `next` links from the leftmost leaf visits exactly the leaves in left-to-right order, ending with None."""
        leaves = []

        def walk(node, lo, hi, depth):
            keys = node["keys"]
            if len(keys) > tree["max"] or any(a >= b for a, b in zip(keys, keys[1:])):
                return None
            if any((lo is not None and k < lo) or (hi is not None and k >= hi) for k in keys):
                return None
            if node["leaf"]:
                leaves.append(node)
                return depth
            if len(node["children"]) != len(keys) + 1:
                return None
            depths = set()
            for i, child in enumerate(node["children"]):
                clo = keys[i - 1] if i > 0 else lo
                chi = keys[i] if i < len(keys) else hi
                d = walk(child, clo, chi, depth + 1)
                if d is None:
                    return None
                depths.add(d)
            return depths.pop() if len(depths) == 1 else None

        if walk(tree["root"], None, None, 1) is None:
            return False
        for a, b in zip(leaves, leaves[1:]):
            if a["next"] is not b:
                return False
        return leaves[-1]["next"] is None


    def min_key(node):
        """The smallest key in the subtree under `node` (follow the first child down to a leaf and take its first key)."""
        while not node["leaf"]:
            node = node["children"][0]
        return node["keys"][0]


    def bulk_load(pairs, max_keys):
        """Build a tree from a list of (key, value) pairs ALREADY SORTED by key, much faster than inserting one by one. ValueError('keys must be sorted and unique') otherwise (an empty list is fine and gives an empty tree). Fill LEAVES completely, max_keys pairs each (the last may have fewer), linked through `next`.
        Then build each INTERNAL level from the level below by grouping max_keys + 1 consecutive nodes under one parent, whose keys are min_key of each child except the first; if the last group would hold only ONE child, move the last child of the previous group into it (so it has 2). Repeat until one node remains: the root."""
        tree = new_tree(max_keys)
        if not pairs:
            return tree
        keys = [k for k, v in pairs]
        if any(a >= b for a, b in zip(keys, keys[1:])):
            raise ValueError("keys must be sorted and unique")
        level = []
        for i in range(0, len(pairs), max_keys):
            chunk = pairs[i:i + max_keys]
            level.append({"leaf": True, "keys": [k for k, v in chunk], "vals": [v for k, v in chunk], "next": None})
        for a, b in zip(level, level[1:]):
            a["next"] = b
        while len(level) > 1:
            size = max_keys + 1
            groups = [level[i:i + size] for i in range(0, len(level), size)]
            if len(groups) > 1 and len(groups[-1]) == 1:
                groups[-1].insert(0, groups[-2].pop())
            level = [{"leaf": False, "keys": [min_key(c) for c in g[1:]], "children": g} for g in groups]
        tree["root"] = level[0]
        return tree


    def tree_stats(tree):
        """A summary dict: {"height": levels, "nodes": total nodes, "leaves": number of leaves, "keys": total keys stored in leaves, "fill": average leaf fullness = keys / (leaves * max) rounded to 3 decimals}."""
        nodes = leaves = keys = 0
        stack = [tree["root"]]
        while stack:
            n = stack.pop()
            nodes += 1
            if n["leaf"]:
                leaves += 1
                keys += len(n["keys"])
            else:
                stack.extend(n["children"])
        return {"height": height(tree), "nodes": nodes, "leaves": leaves, "keys": keys, "fill": round(keys / (leaves * tree["max"]), 3)}

    import random
    big = bulk_load([(i, i) for i in range(100000)], 100)
    print("100000 keys, up to 100 per page:", tree_stats(big))
    print("a lookup reads", height(big), "pages; a full scan would read", tree_stats(big)["leaves"], "pages")
    keys = list(range(20000))
    random.Random(1).shuffle(keys)
    one_by_one = new_tree(100)
    for k in keys:
        insert(one_by_one, k, k)
    print("20000 shuffled inserts, leaf fill:", tree_stats(one_by_one)["fill"])
    print("same keys bulk loaded, leaf fill:", tree_stats(bulk_load([(i, i) for i in range(20000)], 100))["fill"])
