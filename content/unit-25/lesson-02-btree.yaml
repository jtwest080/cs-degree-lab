  - name: binary search in a node
    code: |
      assert child_index([10, 20, 30], 5) == 0 and child_index([10, 20, 30], 10) == 1
      assert child_index([10, 20, 30], 25) == 2 and child_index([10, 20, 30], 30) == 3 and child_index([10, 20, 30], 99) == 3
