- type: code
  question: Write `levels_needed(keys, fanout)` returning the smallest number of levels a tree with that fanout needs to hold at least `keys` keys, where `levels` levels hold `fanout ** levels` keys (use 1 level for 1 to `fanout` keys, and 0 levels for 0 keys).
  starter: |
    def levels_needed(keys, fanout):
        pass
  tests:
  - name: levels
    code: |
      assert levels_needed(0, 10) == 0 and levels_needed(1, 10) == 1 and levels_needed(10, 10) == 1 and levels_needed(11, 10) == 2 and levels_needed(1000, 10) == 3 and levels_needed(1001, 10) == 4
  solution: |
    def levels_needed(keys, fanout):
        if keys == 0:
            return 0
        levels = 1
        capacity = fanout
        while capacity < keys:
            capacity *= fanout
            levels += 1
        return levels
