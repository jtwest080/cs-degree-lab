playground:
  prompt: Change the fanout and see how many levels you need for a million keys.
  code: |
    keys = 1000000
    fanout = 100
    levels = 1
    capacity = fanout
    while capacity < keys:
        capacity = capacity * fanout
        levels = levels + 1
    print('levels needed:', levels)
