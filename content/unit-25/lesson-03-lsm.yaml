  solution: |
    TOMB = "<deleted>"


    def table_get(table, key):
        """Look up a key in an SSTABLE: a list of (key, value) pairs SORTED by key, with no repeated keys. Use BINARY SEARCH (write the loop yourself). Return the stored value, which may be TOMB, or None if the key is not in the table."""
        lo, hi = 0, len(table) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            k, v = table[mid]
            if k == key:
                return v
            if k < key:
                lo = mid + 1
            else:
                hi = mid - 1
        return None


    def merge_tables(older, newer):
        """Merge two sorted tables into one sorted table with MERGE-SORT style two-pointer logic (do not sort the concatenation). When both tables have the same key the entry from `newer` wins. Tombstones are kept like any other value."""
        out = []
        i = j = 0
        while i < len(older) and j < len(newer):
            if older[i][0] < newer[j][0]:
                out.append(older[i])
                i += 1
            elif older[i][0] > newer[j][0]:
                out.append(newer[j])
                j += 1
            else:
                out.append(newer[j])
                i += 1
                j += 1
        out.extend(older[i:])
        out.extend(newer[j:])
        return out


    def drop_tombstones(table):
        """A copy of the table without the entries whose value is TOMB."""
        return [(k, v) for k, v in table if v != TOMB]


    import math


    def stable_hash(text):
        """A hash of a string that is the same on every run and every machine: FNV-1a over the UTF-8 bytes followed by a finishing mix. Returns an int in [0, 2**32)."""
        h = 2166136261
        for b in text.encode():
            h ^= b
            h = (h * 16777619) & 0xFFFFFFFF
        h ^= h >> 16
        h = (h * 0x85ebca6b) & 0xFFFFFFFF
        h ^= h >> 13
        h = (h * 0xc2b2ae35) & 0xFFFFFFFF
        h ^= h >> 16
        return h


    def new_bloom(m, k):
        """An empty BLOOM FILTER: {"m": m, "k": k, "bits": [0] * m}. ValueError('bad bloom') if m < 1 or k < 1."""
        if m < 1 or k < 1:
            raise ValueError("bad bloom")
        return {"m": m, "k": k, "bits": [0] * m}


    def bloom_positions(bloom, item):
        """The k bit positions for an item using DOUBLE HASHING: h1 = stable_hash(item), h2 = stable_hash(item + '#2') | 1, and position i (for i = 0 .. k - 1) is (h1 + i * h2) % m."""
        h1 = stable_hash(item)
        h2 = stable_hash(item + "#2") | 1
        return [(h1 + i * h2) % bloom["m"] for i in range(bloom["k"])]


    def bloom_add(bloom, item):
        """Set the item's k bits to 1."""
        for p in bloom_positions(bloom, item):
            bloom["bits"][p] = 1


    def might_contain(bloom, item):
        """False means the item is DEFINITELY absent; True means it MAY be present (all k bits are set)."""
        return all(bloom["bits"][p] for p in bloom_positions(bloom, item))


    def false_positive_rate(m, k, n):
        """The theoretical false-positive probability after n items: (1 - e ** (-k * n / m)) ** k, rounded to 4 decimals."""
        return round((1 - math.exp(-k * n / m)) ** k, 4)


    def optimal_k(m, n):
        """The best number of hash functions: round((m / n) * ln 2), but at least 1."""
        return max(1, round(m / n * math.log(2)))


    def build_table(pairs, m, k):
        """An SSTable with a Bloom filter: {"data": the pairs sorted by key, "bloom": a filter (new_bloom(m, k)) holding every key}."""
        bloom = new_bloom(m, k)
        for key, value in pairs:
            bloom_add(bloom, key)
        return {"data": sorted(pairs), "bloom": bloom}


    def lookup(tables, key):
        """Search a list of tables (OLDEST FIRST) from newest to oldest. A table whose Bloom filter says the key is absent is skipped WITHOUT being read; otherwise it is READ (use table_get). Stop at the first table that has the key. Return (value or None, number of tables actually read).
        Values equal to TOMB count as found (return TOMB itself; the caller decides what that means)."""
        reads = 0
        for table in reversed(tables):
            if not might_contain(table["bloom"], key):
                continue
            reads += 1
            v = table_get(table["data"], key)
            if v is not None:
                return v, reads
        return None, reads
  explanation: Real systems keep one Bloom filter per SSTable in memory, so most missing keys cost no disk reads at all.
commonMistakes:
- title: Reading oldest tables first
  explanation: The newest entry for a key is the real one.
- title: Dropping a tombstone too early
  explanation: An older table that still holds the key would bring it back.
- title: Believing a Bloom filter can say a key is surely present
  explanation: It only guarantees 'definitely absent'.
- title: Modifying an SSTable in place
  explanation: They are immutable; changes go to new tables.
- title: Never compacting
  explanation: Reads slow down and space is wasted.
summary:
- LSM trees turn writes into memory inserts and sequential flushes.
- SSTables are immutable sorted files, merged like in merge sort.
- A delete is a tombstone, removed only during compaction.
- Reads check the memtable then SSTables from newest to oldest.
- Bloom filters answer 'definitely not here' to skip tables.
- LSM trees favour writes, B+ trees favour reads.
