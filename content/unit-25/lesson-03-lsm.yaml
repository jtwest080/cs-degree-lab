exercises:
- id: sstable
  title: SSTables and merging
  difficulty: 4
  prompt: 'A B+ tree updates pages **in place**, which means random disk writes. A **log-structured merge tree (LSM tree)** turns every write into a cheap sequential one: new data goes into an in-memory sorted buffer, which is later written out as an immutable **SSTable** (*sorted string table*), a file sorted by key. Write the building blocks. `table_get(table, key)`: look up a key in an SSTable (a list of `(key, value)` pairs sorted by key, no repeated keys) using **binary search** (write the loop yourself); return the value (which may be the tombstone marker `TOMB`, given) or `None` if absent. `merge_tables(older, newer)`: merge two sorted tables into one with the **two-pointer** merge-sort technique (do not sort the concatenation); when both have the same key the entry from `newer` **wins**; tombstones are kept like any other value. `drop_tombstones(table)`: a copy without the entries whose value is `TOMB`.'
  starter: |-
    TOMB = "<deleted>"


    def table_get(table, key):
        """Look up a key in an SSTABLE: a list of (key, value) pairs SORTED by key, with no repeated keys. Use BINARY SEARCH (write the loop yourself). Return the stored value, which may be TOMB, or None if the key is not in the table."""
        pass


    def merge_tables(older, newer):
        """Merge two sorted tables into one sorted table with MERGE-SORT style two-pointer logic (do not sort the concatenation). When both tables have the same key the entry from `newer` wins. Tombstones are kept like any other value."""
        pass


    def drop_tombstones(table):
        """A copy of the table without the entries whose value is TOMB."""
        pass
  tests:
  - name: binary search
    code: |
      t = [(1, "a"), (3, "b"), (5, "c"), (9, "d")]
      for k, v in t:
          assert table_get(t, k) == v
      assert table_get(t, 0) is None and table_get(t, 4) is None and table_get(t, 10) is None
      assert table_get([], 1) is None and table_get([(2, TOMB)], 2) == TOMB
      big = [(i * 2, i) for i in range(1000)]
      assert table_get(big, 998) == 499 and table_get(big, 999) is None
  - name: merging
    code: |
      older = [(1, "old1"), (3, "old3"), (5, "old5")]
      newer = [(2, "new2"), (3, "new3"), (6, "new6")]
      assert merge_tables(older, newer) == [(1, "old1"), (2, "new2"), (3, "new3"), (5, "old5"), (6, "new6")]
      assert merge_tables([], newer) == newer and merge_tables(older, []) == older and merge_tables([], []) == []
      assert merge_tables([(1, "a")], [(1, TOMB)]) == [(1, TOMB)]
      assert older == [(1, "old1"), (3, "old3"), (5, "old5")]
      import random
      rng = random.Random(1)
      a = sorted((k, "a") for k in rng.sample(range(100), 30))
      b = sorted((k, "b") for k in rng.sample(range(100), 30))
      m = merge_tables(a, b)
      assert [k for k, v in m] == sorted(set(k for k, v in a) | set(k for k, v in b))
      assert all(v == "b" for k, v in m if k in dict(b))
  - name: dropping tombstones
    code: |
      t = [(1, "a"), (2, TOMB), (3, "c"), (4, TOMB)]
      assert drop_tombstones(t) == [(1, "a"), (3, "c")]
      assert drop_tombstones([]) == [] and drop_tombstones([(1, TOMB)]) == []
      assert t[1] == (2, TOMB)
  hints:
  - For the merge, compare the current keys of both lists; on equality keep the newer entry and advance both.
  solution: |
    TOMB = "<deleted>"


    def table_get(table, key):
        """Look up a key in an SSTABLE: a list of (key, value) pairs SORTED by key, with no repeated keys. Use BINARY SEARCH (write the loop yourself). Return the stored value, which may be TOMB, or None if the key is not in the table."""
        lo, hi = 0, len(table) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            k, v = table[mid]
            if k == key:
                return v
            if k < key:
                lo = mid + 1
            else:
                hi = mid - 1
        return None


    def merge_tables(older, newer):
        """Merge two sorted tables into one sorted table with MERGE-SORT style two-pointer logic (do not sort the concatenation). When both tables have the same key the entry from `newer` wins. Tombstones are kept like any other value."""
        out = []
        i = j = 0
        while i < len(older) and j < len(newer):
            if older[i][0] < newer[j][0]:
                out.append(older[i])
                i += 1
            elif older[i][0] > newer[j][0]:
                out.append(newer[j])
                j += 1
            else:
                out.append(newer[j])
                i += 1
                j += 1
        out.extend(older[i:])
        out.extend(newer[j:])
        return out


    def drop_tombstones(table):
        """A copy of the table without the entries whose value is TOMB."""
        return [(k, v) for k, v in table if v != TOMB]
  explanation: Because SSTables are immutable and sorted, merging them is a fast sequential pass.
- id: lsm
  title: The LSM tree
  difficulty: 5
  prompt: 'Starter code gives `TOMB`, `table_get`, `merge_tables` and `drop_tombstones`. Write `new_lsm(limit)` returning `{"limit": limit, "memtable": {}, "tables": []}`; `memtable` is the in-memory write buffer, `tables` the SSTables on disk, **oldest first** (`ValueError("limit must be at least 1")` if `limit < 1`). Write `flush(lsm)`: write the memtable out as a new SSTable (its items **sorted by key**) at the **end** of `tables`, empty the memtable and return the number of entries written (0 and no new table if the memtable was empty). Write `put(lsm, key, value)`: store it in the memtable and, if the memtable now holds `limit` or more entries, flush it. Write `delete(lsm, key)`: write a **tombstone**, `put(lsm, key, TOMB)`, because older copies still sit in older tables until compaction. Write `get(lsm, key)`: the newest value, or `None` if the key was never written or its newest entry is a tombstone. Look in the memtable first, then the tables from **newest to oldest**; the first entry found decides.'
  starter: |-
    TOMB = "<deleted>"


    def table_get(table, key):
        """Look up a key in an SSTABLE: a list of (key, value) pairs SORTED by key, with no repeated keys. Use BINARY SEARCH (write the loop yourself). Return the stored value, which may be TOMB, or None if the key is not in the table."""
        lo, hi = 0, len(table) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            k, v = table[mid]
            if k == key:
                return v
            if k < key:
                lo = mid + 1
            else:
                hi = mid - 1
        return None


    def merge_tables(older, newer):
        """Merge two sorted tables into one sorted table with MERGE-SORT style two-pointer logic (do not sort the concatenation). When both tables have the same key the entry from `newer` wins. Tombstones are kept like any other value."""
        out = []
        i = j = 0
        while i < len(older) and j < len(newer):
            if older[i][0] < newer[j][0]:
                out.append(older[i])
                i += 1
            elif older[i][0] > newer[j][0]:
                out.append(newer[j])
                j += 1
            else:
                out.append(newer[j])
                i += 1
                j += 1
        out.extend(older[i:])
        out.extend(newer[j:])
        return out


    def drop_tombstones(table):
        """A copy of the table without the entries whose value is TOMB."""
        return [(k, v) for k, v in table if v != TOMB]


    def new_lsm(limit):
        """An empty LSM TREE: {"limit": limit, "memtable": {}, "tables": []}. `memtable` is the in-memory write buffer; `tables` are the SSTables on disk, OLDEST FIRST. ValueError('limit must be at least 1') if limit < 1."""
        pass


    def flush(lsm):
        """Write the memtable out as a new SSTable (its items sorted by key) at the END of lsm["tables"] and empty the memtable. Return the number of entries written (0 and no new table if the memtable was empty)."""
        pass


    def put(lsm, key, value):
        """Write a key: store it in the memtable; if the memtable then holds `limit` or more entries, flush it."""
        pass


    def delete(lsm, key):
        """Delete a key by writing a TOMBSTONE: put(lsm, key, TOMB). (Old versions of the key still sit in older tables until compaction.)"""
        pass


    def get(lsm, key):
        """The newest value for the key, or None if it was never written or its newest entry is a tombstone. Look in the memtable first, then the tables from NEWEST to OLDEST (use table_get); the first entry found decides."""
        pass
  tests:
  - name: writing and flushing
    code: |
      db = new_lsm(3)
      put(db, "b", 2); put(db, "a", 1)
      assert db["tables"] == [] and db["memtable"] == {"b": 2, "a": 1}
      put(db, "c", 3)
      assert db["memtable"] == {} and db["tables"] == [[("a", 1), ("b", 2), ("c", 3)]]
      assert flush(db) == 0 and len(db["tables"]) == 1
      put(db, "z", 26)
      assert flush(db) == 1 and db["tables"][1] == [("z", 26)]
      try:
          new_lsm(0)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "at least 1" in str(e)
  - name: reading newest first
    code: |
      db = new_lsm(2)
      put(db, "k", "v1"); put(db, "x", 1)
      put(db, "k", "v2"); put(db, "y", 2)
      put(db, "k", "v3")
      assert len(db["tables"]) == 2 and db["memtable"] == {"k": "v3"}
      assert get(db, "k") == "v3" and get(db, "x") == 1 and get(db, "y") == 2 and get(db, "nope") is None
      flush(db)
      assert get(db, "k") == "v3" and db["tables"][2] == [("k", "v3")]
  - name: deletes are tombstones
    code: |
      db = new_lsm(2)
      put(db, "a", 1); put(db, "b", 2)
      delete(db, "a")
      assert get(db, "a") is None and get(db, "b") == 2
      assert db["tables"] == [[("a", 1), ("b", 2)]] and db["memtable"] == {"a": TOMB}
      put(db, "c", 3)
      assert db["tables"][1] == [("a", TOMB), ("c", 3)] and get(db, "a") is None
      put(db, "a", 99)
      assert get(db, "a") == 99
      delete(db, "never-existed")
      assert get(db, "never-existed") is None
  - name: many writes
    code: |
      import random
      rng = random.Random(3)
      db = new_lsm(10)
      model = {}
      for i in range(500):
          k = "key%d" % rng.randrange(40)
          if rng.random() < 0.25:
              delete(db, k); model.pop(k, None)
          else:
              put(db, k, i); model[k] = i
