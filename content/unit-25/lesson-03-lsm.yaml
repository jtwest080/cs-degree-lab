id: u25-lsm
title: LSM Trees and Bloom Filters
minutes: 90
objective: 'Learn the second great way to store data: the log-structured merge tree used by Cassandra, RocksDB, LevelDB and many others. You will write SSTables, a memtable with tombstones, compaction, and Bloom filters that avoid useless disk reads.'
outcomes:
- Explain why LSM trees make writes fast
- Build SSTables and merge them
- Delete with tombstones
- Compact tables and scan ranges
- Use Bloom filters to skip tables
- Compare LSM trees with B+ trees
sections:
- heading: Writes without seeking
  body: |-
    A B+ tree updates a page in the middle of a file, which forces the disk to jump around (a **random write**). Disks, including SSDs, are far faster at **sequential writes**, appending one block after another. The **log-structured merge tree**, or **LSM tree**, is designed around that fact. Instead of changing data in place it never modifies a file after writing it.

    Here is how it works. Every write first goes into the **memtable**, a sorted structure in memory (a balanced tree or skip list), and also into a **write-ahead log** so a crash cannot lose it. When the memtable gets full it is written to disk in one sequential pass as an **SSTable**, a *sorted string table*: an immutable file whose entries are sorted by key, with an index to find a key quickly by binary search. Writes are therefore very fast: an in-memory insert plus an occasional big sequential write. That is why Cassandra, RocksDB, LevelDB and HBase use LSM trees for write-heavy workloads such as logs, messaging and time series.
- heading: Reads, deletes and compaction
  body: |-
    The price is paid when reading. A key may live in the memtable or in any of several SSTables, with older versions of the same key in older files. A read checks the memtable first, then the SSTables from **newest to oldest**, and the first version it finds is the answer. Deleting is a special write. Since files are never changed, a delete writes a **tombstone**, a marker saying "this key is gone", which hides the older values below it.

    Left alone, SSTables accumulate and reads get slower. So background threads perform **compaction**: they merge several sorted tables into one larger one, a fast sequential pass like the merge step of merge sort. During a merge the newer version of each key wins, and once a tombstone has been merged with all the older tables that could contain the key it can finally be discarded, reclaiming space. Compaction strategies decide *which* tables to merge: **size-tiered** merges tables of similar size, and **leveled** compaction keeps tables in levels, each ten times bigger than the one above, with non-overlapping key ranges. All of them trade extra background writing (**write amplification**) against read speed and space.
- heading: Bloom filters
  body: |-
    To look up a key that is not in the database, a naive read would have to search every SSTable. A **Bloom filter**, named after Burton Bloom, avoids most of that work. It is an array of `m` bits, initially all zero, together with `k` different hash functions. To **add** an item, compute its `k` hashes and set those `k` bits to 1. To **test** an item, check whether all `k` of its bits are 1. If any bit is 0 the item is **definitely not present**. If all are 1 it is **probably present**, but other items might have set those same bits by chance, a **false positive**. There are never false negatives.

    With about 10 bits per key and 7 hash functions, the false-positive rate is roughly one percent, for a filter far smaller than the keys themselves. Keeping one filter per SSTable in memory lets a read skip nearly every table that lacks the key, so only about one disk read in a hundred is wasted. The formula for the rate after storing `n` items is `(1 - e^(-kn/m))^k`, and the best `k` is about `(m/n) · ln 2`.
- heading: B+ tree or LSM tree?
  body: Neither is better in general. **B+ trees** (PostgreSQL, MySQL InnoDB, SQLite) give predictable fast reads and in-place updates, and suit workloads with many reads and moderate writes. **LSM trees** give very high write throughput and compress well, but reads may touch several files, compaction uses background effort, and performance can fluctuate while it runs. Choosing between them means asking whether the workload is dominated by reads or writes.
examples:
- title: Writes, deletes and compaction
  intro: A tiny LSM tree flushes to SSTables, hides a deleted key with a tombstone, and compacts.
  code: |
    TOMB = "<deleted>"


    def table_get(table, key):
        """Look up a key in an SSTABLE: a list of (key, value) pairs SORTED by key, with no repeated keys. Use BINARY SEARCH (write the loop yourself). Return the stored value, which may be TOMB, or None if the key is not in the table."""
        lo, hi = 0, len(table) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            k, v = table[mid]
            if k == key:
                return v
            if k < key:
                lo = mid + 1
            else:
                hi = mid - 1
        return None


    def merge_tables(older, newer):
        """Merge two sorted tables into one sorted table with MERGE-SORT style two-pointer logic (do not sort the concatenation). When both tables have the same key the entry from `newer` wins. Tombstones are kept like any other value."""
        out = []
        i = j = 0
        while i < len(older) and j < len(newer):
            if older[i][0] < newer[j][0]:
                out.append(older[i])
                i += 1
            elif older[i][0] > newer[j][0]:
                out.append(newer[j])
                j += 1
            else:
                out.append(newer[j])
                i += 1
                j += 1
        out.extend(older[i:])
        out.extend(newer[j:])
        return out


    def drop_tombstones(table):
        """A copy of the table without the entries whose value is TOMB."""
        return [(k, v) for k, v in table if v != TOMB]


    def new_lsm(limit):
        """An empty LSM TREE: {"limit": limit, "memtable": {}, "tables": []}. `memtable` is the in-memory write buffer; `tables` are the SSTables on disk, OLDEST FIRST. ValueError('limit must be at least 1') if limit < 1."""
        if limit < 1:
            raise ValueError("limit must be at least 1")
        return {"limit": limit, "memtable": {}, "tables": []}


    def flush(lsm):
        """Write the memtable out as a new SSTable (its items sorted by key) at the END of lsm["tables"] and empty the memtable. Return the number of entries written (0 and no new table if the memtable was empty)."""
        mem = lsm["memtable"]
        if not mem:
            return 0
        lsm["tables"].append(sorted(mem.items()))
        n = len(mem)
        mem.clear()
        return n


    def put(lsm, key, value):
        """Write a key: store it in the memtable; if the memtable then holds `limit` or more entries, flush it."""
        lsm["memtable"][key] = value
        if len(lsm["memtable"]) >= lsm["limit"]:
            flush(lsm)


    def delete(lsm, key):
        """Delete a key by writing a TOMBSTONE: put(lsm, key, TOMB). (Old versions of the key still sit in older tables until compaction.)"""
        put(lsm, key, TOMB)


    def get(lsm, key):
        """The newest value for the key, or None if it was never written or its newest entry is a tombstone. Look in the memtable first, then the tables from NEWEST to OLDEST (use table_get); the first entry found decides."""
        if key in lsm["memtable"]:
            v = lsm["memtable"][key]
            return None if v == TOMB else v
        for table in reversed(lsm["tables"]):
            v = table_get(table, key)
            if v is not None:
                return None if v == TOMB else v
        return None


    def compact(lsm, count):
        """Merge the `count` OLDEST tables into one table (use merge_tables, newer tables overriding older ones) and drop its tombstones, which is safe because the merge includes the oldest table so nothing older can resurface. Replace those tables by the merged one (omit it if it is empty).
        ValueError('bad count') if count < 2 or count > number of tables. Return how many entries disappeared: total entries before minus entries in the merged table."""
        tables = lsm["tables"]
        if count < 2 or count > len(tables):
            raise ValueError("bad count")
        before = sum(len(t) for t in tables[:count])
        merged = tables[0]
        for t in tables[1:count]:
            merged = merge_tables(merged, t)
        merged = drop_tombstones(merged)
        tables[:count] = [merged] if merged else []
        return before - len(merged)


    def maybe_compact(lsm, trigger):
        """If there are at least `trigger` tables, compact(lsm, trigger) once and return True; otherwise do nothing and return False."""
        if len(lsm["tables"]) >= trigger:
            compact(lsm, trigger)
            return True
        return False


    def scan(lsm, lo, hi):
        """All live (key, value) pairs with lo <= key <= hi, sorted by key, as a read would see them: newer sources override older ones (memtable newest, then tables from newest to oldest) and keys whose newest entry is a tombstone are left out."""
        view = {}
        for table in lsm["tables"]:
            for k, v in table:
                if lo <= k <= hi:
                    view[k] = v
        for k, v in lsm["memtable"].items():
            if lo <= k <= hi:
                view[k] = v
        return sorted((k, v) for k, v in view.items() if v != TOMB)

    db = new_lsm(3)
    for i in range(7):
        put(db, "user%d" % (i % 4), "v%d" % i)
    delete(db, "user1")
    print("tables on disk:", len(db["tables"]), "memtable:", db["memtable"])
    print("user0 =", get(db, "user0"), "user1 =", get(db, "user1"))
    print("scan:", scan(db, "user0", "user9"))
    flush(db)
    print("tables before compaction:", [len(t) for t in db["tables"]])
    removed = compact(db, len(db["tables"]))
    print("entries removed by compaction:", removed, "tables now:", [len(t) for t in db["tables"]])
  output: |
    tables on disk: 2 memtable: {'user2': 'v6', 'user1': '<deleted>'}
    user0 = v4 user1 = None
    scan: [('user0', 'v4'), ('user2', 'v6'), ('user3', 'v3')]
    tables before compaction: [3, 3, 2]
    entries removed by compaction: 5 tables now: [3]
  lines:
  - line: 125
    note: Three keys fill the memtable, so tables are flushed along the way.
  - line: 126
    note: A tombstone hides user1.
  - line: 127
    note: A scan shows only live entries.
  - line: 130
    note: Compaction merges everything and discards old versions and tombstones.
- title: Bloom filters skip tables
  intro: Missing keys are rejected by the filters without reading the tables.
  code: |
    import math


    def stable_hash(text):
        """A hash of a string that is the same on every run and every machine: FNV-1a over the UTF-8 bytes followed by a finishing mix. Returns an int in [0, 2**32)."""
        h = 2166136261
        for b in text.encode():
            h ^= b
            h = (h * 16777619) & 0xFFFFFFFF
        h ^= h >> 16
        h = (h * 0x85ebca6b) & 0xFFFFFFFF
        h ^= h >> 13
        h = (h * 0xc2b2ae35) & 0xFFFFFFFF
        h ^= h >> 16
        return h


    def new_bloom(m, k):
        """An empty BLOOM FILTER: {"m": m, "k": k, "bits": [0] * m}. ValueError('bad bloom') if m < 1 or k < 1."""
        if m < 1 or k < 1:
            raise ValueError("bad bloom")
        return {"m": m, "k": k, "bits": [0] * m}


    def bloom_positions(bloom, item):
        """The k bit positions for an item using DOUBLE HASHING: h1 = stable_hash(item), h2 = stable_hash(item + '#2') | 1, and position i (for i = 0 .. k - 1) is (h1 + i * h2) % m."""
        h1 = stable_hash(item)
        h2 = stable_hash(item + "#2") | 1
        return [(h1 + i * h2) % bloom["m"] for i in range(bloom["k"])]


    def bloom_add(bloom, item):
        """Set the item's k bits to 1."""
        for p in bloom_positions(bloom, item):
            bloom["bits"][p] = 1


    def might_contain(bloom, item):
        """False means the item is DEFINITELY absent; True means it MAY be present (all k bits are set)."""
        return all(bloom["bits"][p] for p in bloom_positions(bloom, item))


    def false_positive_rate(m, k, n):
        """The theoretical false-positive probability after n items: (1 - e ** (-k * n / m)) ** k, rounded to 4 decimals."""
        return round((1 - math.exp(-k * n / m)) ** k, 4)


    def optimal_k(m, n):
        """The best number of hash functions: round((m / n) * ln 2), but at least 1."""
        return max(1, round(m / n * math.log(2)))


    def build_table(pairs, m, k):
        """An SSTable with a Bloom filter: {"data": the pairs sorted by key, "bloom": a filter (new_bloom(m, k)) holding every key}."""
        bloom = new_bloom(m, k)
        for key, value in pairs:
            bloom_add(bloom, key)
        return {"data": sorted(pairs), "bloom": bloom}


    def lookup(tables, key):
        """Search a list of tables (OLDEST FIRST) from newest to oldest. A table whose Bloom filter says the key is absent is skipped WITHOUT being read; otherwise it is READ (use table_get). Stop at the first table that has the key. Return (value or None, number of tables actually read).
        Values equal to TOMB count as found (return TOMB itself; the caller decides what that means)."""
        reads = 0
        for table in reversed(tables):
            if not might_contain(table["bloom"], key):
                continue
            reads += 1
            v = table_get(table["data"], key)
            if v is not None:
                return v, reads
        return None, reads

    def table_get(table, key):
        for k, v in table:
            if k == key:
                return v
        return None


    tables = [build_table([("t%d-%d" % (t, i), i) for i in range(100)], 1000, 7) for t in range(8)]
    reads = sum(lookup(tables, "absent%d" % i)[1] for i in range(1000))
    print("1000 lookups of missing keys across 8 tables read", reads, "tables out of", 8000)
    print("one key from the oldest table reads", lookup(tables, "t0-5")[1], "table(s)")
    print("theory: false positive rate with 10 bits per key:", false_positive_rate(1000, 7, 100), "best k:", optimal_k(1000, 100))
  output: |
    1000 lookups of missing keys across 8 tables read 87 tables out of 8000
    one key from the oldest table reads 1 table(s)
    theory: false positive rate with 10 bits per key: 0.0082 best k: 7
  lines:
  - line: 83
    note: Almost every missing key is rejected without a read.
  - line: 84
    note: A key in the oldest table needs few reads thanks to the filters.
  - line: 85
    note: About one percent false positives.
