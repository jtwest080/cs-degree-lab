    def scan(table):
        """The leaf of every query plan: a GENERATOR that yields a COPY (dict(row)) of each row of the table (a list of dicts), one at a time."""
        for row in table:
            yield dict(row)


    def where(rows, pred):
        """A FILTER: yield only the rows for which pred(row) is true."""
        for row in rows:
            if pred(row):
                yield row


    def project(rows, cols):
        """A PROJECTION: yield new dicts holding only the named columns, in the order given. ValueError('no such column NAME') if a row lacks a requested column."""
        for row in rows:
            out = {}
            for c in cols:
                if c not in row:
                    raise ValueError("no such column " + c)
                out[c] = row[c]
            yield out


    def limit(rows, n, offset=0):
        """Skip `offset` rows, then yield at most n rows. It must be LAZY: once n rows have been yielded it stops WITHOUT asking its input for another row (so it works on an endless generator)."""
        if n <= 0:
            return
        skipped = 0
        given = 0
        for row in rows:
            if skipped < offset:
                skipped += 1
                continue
            yield row
            given += 1
            if given >= n:
                return


    def order_by(rows, keys):
        """SORT: `keys` is a list of (column, descending) pairs, most important first. Read ALL the rows, sort them (stable) and yield them. Hint: sort repeatedly, starting from the LAST key, with list.sort(key=..., reverse=...)."""
        data = list(rows)
        for col, desc in reversed(keys):
            data.sort(key=lambda r: r[col], reverse=desc)
        yield from data


