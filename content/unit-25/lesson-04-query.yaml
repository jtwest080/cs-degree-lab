  tests:
  - name: scan, filter, project
    code: |
      table = [{"id": 1, "name": "ada", "age": 36}, {"id": 2, "name": "alan", "age": 41}, {"id": 3, "name": "grace", "age": 45}]
      rows = scan(table)
      assert iter(rows) is rows
      r = list(scan(table))
      assert r == table and r[0] is not table[0]
      r[0]["name"] = "changed"
      assert table[0]["name"] == "ada"
      assert list(where(scan(table), lambda row: row["age"] > 40)) == table[1:]
      assert list(project(scan(table), ["name", "id"])) == [{"name": "ada", "id": 1}, {"name": "alan", "id": 2}, {"name": "grace", "id": 3}]
      assert list(project(scan(table), ["name"]))[0].keys() == {"name": 0}.keys()
      try:
          list(project(scan(table), ["salary"]))
          raise AssertionError("accepted")
      except ValueError as e:
          assert "no such column salary" in str(e)
  - name: limit is lazy
    code: |
      def counter():
          n = 0
          while True:
              yield {"n": n}
              n += 1
      assert list(limit(counter(), 3)) == [{"n": 0}, {"n": 1}, {"n": 2}]
      assert list(limit(counter(), 2, offset=5)) == [{"n": 5}, {"n": 6}]
      assert list(limit(counter(), 0)) == []
      assert list(limit(iter([{"n": 1}]), 5)) == [{"n": 1}]
      assert list(limit(iter([{"n": 1}, {"n": 2}]), 5, offset=5)) == []
      pulled = []
      def watched():
          for i in range(100):
              pulled.append(i)
              yield {"n": i}
      assert len(list(limit(watched(), 4))) == 4 and pulled == [0, 1, 2, 3]
  - name: sorting
    code: |
      t = [{"d": "x", "n": 3}, {"d": "y", "n": 1}, {"d": "x", "n": 1}, {"d": "y", "n": 3}, {"d": "x", "n": 2}]
      assert [r["n"] for r in order_by(iter(t), [("n", False)])] == [1, 1, 2, 3, 3]
      got = list(order_by(iter(t), [("d", False), ("n", True)]))
      assert [(r["d"], r["n"]) for r in got] == [("x", 3), ("x", 2), ("x", 1), ("y", 3), ("y", 1)]
      got = list(order_by(iter(t), [("n", True), ("d", False)]))
      assert [(r["d"], r["n"]) for r in got] == [("x", 3), ("y", 3), ("x", 2), ("x", 1), ("y", 1)]
      assert list(order_by(iter([]), [("n", False)])) == [] and len(list(order_by(iter(t), []))) == 5
  - name: a pipeline
    code: |
      people = [{"name": n, "age": a} for n, a in (("ada", 36), ("alan", 41), ("grace", 45), ("edsger", 72), ("barbara", 29), ("donald", 85))]
      plan = limit(project(order_by(where(scan(people), lambda r: r["age"] > 30), [("age", True)]), ["name"]), 3)
      assert list(plan) == [{"name": "donald"}, {"name": "edsger"}, {"name": "grace"}]
      assert people[0] == {"name": "ada", "age": 36}
