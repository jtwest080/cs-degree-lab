id: u25-query
title: Running Queries
minutes: 100
objective: Learn how a database turns a SQL query into rows. You will write streaming operators, three join algorithms, grouping with aggregates, a SQL parser, and a small query engine that executes and explains queries.
outcomes:
- Describe the iterator (Volcano) model of query execution
- Write filter, projection, sort and limit operators
- Implement nested-loop, hash and sort-merge joins
- Group rows and compute aggregates
- Parse a small SQL language
- Explain a query plan
sections:
- heading: From SQL to a plan
  body: |-
    **SQL** (Structured Query Language) is *declarative*: you describe *what* you want, such as the names of all customers older than 40, and the database decides *how* to get it. Inside the database a query goes through stages very similar to a compiler. A **parser** turns the text into a tree. A **planner** (or *optimizer*, the next lesson) chooses an efficient strategy. An **executor** runs the chosen **query plan**, which is a tree of **operators**.

    The classic way to run a plan is the **iterator model**, also called the **Volcano model**. Each operator is a small machine that produces rows one at a time on demand: when asked for the next row, it asks the operator below it for rows. The scan at the bottom reads rows from a table; a **filter** passes along only the rows that satisfy a condition (SQL's WHERE); a **projection** keeps only the requested columns (the SELECT list); a **sort** (ORDER BY) must read all its input before it can return the first row; and **limit** stops asking once it has enough. Python generators behave just like this, and because rows flow one at a time, a query can start returning results before it has read the whole table and uses very little memory.
- heading: Joins
  body: |-
    Data is split over several tables to avoid repetition, for example *people* and *orders*, and a **join** puts matching rows back together, for example each order next to the person who placed it. There are three main algorithms. The **nested-loop join** compares every row of one table with every row of the other: simple, but with a million rows each it needs a trillion comparisons. The **hash join** reads one table into a hash table keyed by the join column, then looks up each row of the other table: roughly one step per row, and the usual choice when no index exists. The **sort-merge join** sorts both tables by the join column and then walks through both at once like the merge step of merge sort, which is excellent when the inputs are already sorted, for instance coming from a B+ tree.

    An **outer join** also keeps rows that have no partner, filling the missing columns with **NULL**, SQL's marker for an unknown or absent value. NULL never equals anything, not even another NULL, so rows with NULL keys do not match in an ordinary join.
- heading: Grouping and aggregates
  body: 'SQL''s GROUP BY collects rows with the same value in some columns into **groups** and computes an **aggregate** for each group: COUNT, SUM, MIN, MAX or AVG. The usual implementation is a hash table from the group key to running totals, so one pass over the data is enough. Aggregates ignore NULL values, except COUNT(*) which counts rows. A query with aggregates but no GROUP BY has a single group covering the whole table, which exists even when the table is empty (COUNT is 0, the others are NULL).'
- heading: Putting the engine together
  body: 'A tiny engine needs just four parts: a **tokenizer** that splits the text into words, numbers, strings and symbols; a **parser** that checks the grammar and produces a structure describing the query; the **operators**; and a function that assembles the operators into a pipeline in the right order. The order matters: filter first to shrink the data early, then sort, then project, then limit. Sorting before projecting lets you order by a column you do not display. SQL''s **EXPLAIN** command prints the plan the database chose, which is the first thing to read when a query is slow.'
examples:
- title: Joining, grouping and streaming
  intro: People and their orders joined with a hash join, grouped per person, plus a lazy limit on an endless table.
  code: |
    def scan(table):
        """The leaf of every query plan: a GENERATOR that yields a COPY (dict(row)) of each row of the table (a list of dicts), one at a time."""
        for row in table:
            yield dict(row)


    def where(rows, pred):
        """A FILTER: yield only the rows for which pred(row) is true."""
        for row in rows:
            if pred(row):
                yield row


    def project(rows, cols):
        """A PROJECTION: yield new dicts holding only the named columns, in the order given. ValueError('no such column NAME') if a row lacks a requested column."""
        for row in rows:
            out = {}
            for c in cols:
                if c not in row:
                    raise ValueError("no such column " + c)
                out[c] = row[c]
            yield out


    def limit(rows, n, offset=0):
        """Skip `offset` rows, then yield at most n rows. It must be LAZY: once n rows have been yielded it stops WITHOUT asking its input for another row (so it works on an endless generator)."""
        if n <= 0:
            return
        skipped = 0
        given = 0
        for row in rows:
            if skipped < offset:
                skipped += 1
                continue
            yield row
            given += 1
            if given >= n:
                return


    def order_by(rows, keys):
        """SORT: `keys` is a list of (column, descending) pairs, most important first. Read ALL the rows, sort them (stable) and yield them. Hint: sort repeatedly, starting from the LAST key, with list.sort(key=..., reverse=...)."""
        data = list(rows)
        for col, desc in reversed(keys):
            data.sort(key=lambda r: r[col], reverse=desc)
        yield from data


    def nested_loop_join(left, right, lcol, rcol):
        """JOIN by brute force: for every left row compare it with every right row (read `right` into a list once); when left[lcol] == right[rcol] yield the merged row {**left, **right}. A None key never matches anything (as in SQL). Output order: by left row, then right row."""
        right = list(right)
        for l in left:
            for r in right:
                if l[lcol] is not None and l[lcol] == r[rcol]:
                    yield {**l, **r}


    def hash_join(left, right, lcol, rcol):
        """HASH JOIN: build a dict from rcol value to the list of right rows (skip rows whose key is None), then for each left row look up its key and yield {**left, **right} for each match. Same output order as the nested-loop join."""
        table = {}
        for r in right:
            if r[rcol] is not None:
                table.setdefault(r[rcol], []).append(r)
        for l in left:
            if l[lcol] is None:
                continue
            for r in table.get(l[lcol], []):
                yield {**l, **r}


    def merge_join(left, right, lcol, rcol):
        """SORT-MERGE JOIN: put both inputs in lists, drop rows whose key is None, sort each by its key column (stable), then walk both with two indexes. When the keys are equal, yield the merged rows for EVERY pairing of the left rows and right rows that share that key
        (left rows in order, each with all the right rows in order), then move past the whole group. Output is ordered by key."""
        a = sorted((l for l in left if l[lcol] is not None), key=lambda r: r[lcol])
        b = sorted((r for r in right if r[rcol] is not None), key=lambda r: r[rcol])
        i = j = 0
        while i < len(a) and j < len(b):
            ka, kb = a[i][lcol], b[j][rcol]
            if ka < kb:
                i += 1
            elif ka > kb:
                j += 1
            else:
                i2 = i
                while i2 < len(a) and a[i2][lcol] == ka:
                    i2 += 1
                j2 = j
                while j2 < len(b) and b[j2][rcol] == kb:
                    j2 += 1
                for l in a[i:i2]:
                    for r in b[j:j2]:
                        yield {**l, **r}
                i, j = i2, j2


    def left_join(left, right, lcol, rcol, right_cols):
        """LEFT OUTER JOIN: like hash_join, but a left row with NO match is still yielded, extended with every name in `right_cols` set to None (a left row with a None key also counts as unmatched). Left rows come in their original order."""
        table = {}
        for r in right:
            if r[rcol] is not None:
                table.setdefault(r[rcol], []).append(r)
        for l in left:
            matches = table.get(l[lcol], []) if l[lcol] is not None else []
            if not matches:
                yield {**l, **{c: None for c in right_cols}}
            for r in matches:
                yield {**l, **r}


    def group_by(rows, keys, aggs):
        """GROUP BY with aggregates. `keys` is a list of column names; `aggs` a list of (output_name, function, column) with function one of 'count', 'sum', 'min', 'max', 'avg' (ValueError('unknown aggregate NAME') otherwise). Only values that are not None are used: count counts them (the column '*' counts every row),
        sum/min/max/avg ignore None and give None if there is nothing left; avg is rounded to 2 decimals. Return a list of dicts, one per group, holding the key columns and then the aggregates, sorted by the tuple of key values. With NO keys there is always exactly one group, even for no rows (count 0, the rest None)."""
        for name, fn, col in aggs:
            if fn not in ("count", "sum", "min", "max", "avg"):
                raise ValueError("unknown aggregate " + fn)
        groups = {}
        for row in rows:
            groups.setdefault(tuple(row[k] for k in keys), []).append(row)
        if not keys and not groups:
            groups[()] = []
        out = []
        for key in sorted(groups):
            members = groups[key]
            result = dict(zip(keys, key))
            for name, fn, col in aggs:
                if fn == "count" and col == "*":
                    result[name] = len(members)
                    continue
                vals = [r[col] for r in members if r[col] is not None]
                if fn == "count":
                    result[name] = len(vals)
                elif not vals:
                    result[name] = None
                elif fn == "sum":
                    result[name] = sum(vals)
                elif fn == "min":
                    result[name] = min(vals)
                elif fn == "max":
                    result[name] = max(vals)
                else:
                    result[name] = round(sum(vals) / len(vals), 2)
            out.append(result)
        return out

    people = [{"pid": 1, "name": "ada"}, {"pid": 2, "name": "alan"}, {"pid": 3, "name": "grace"}]
    orders = [{"buyer": 2, "item": "pen", "price": 3}, {"buyer": 1, "item": "ink", "price": 9}, {"buyer": 2, "item": "pad", "price": 5}]
    joined = list(hash_join(people, orders, "pid", "buyer"))
    print("joined rows:", len(joined))
    for row in group_by(joined, ["name"], [("orders", "count", "*"), ("spent", "sum", "price")]):
        print(row)
    print("no orders:", [r["name"] for r in left_join(people, orders, "pid", "buyer", ["item"]) if r["item"] is None])
    def numbers():
        n = 0
        while True:
            yield {"n": n}
            n += 1
    print("first three squares of an endless table:", [r["n"] ** 2 for r in limit(numbers(), 3)])
  output: |
    joined rows: 3
    {'name': 'ada', 'orders': 1, 'spent': 9}
    {'name': 'alan', 'orders': 2, 'spent': 8}
    no orders: ['grace']
    first three squares of an endless table: [0, 1, 4]
