    import re

    KEYWORDS = ("SELECT", "FROM", "WHERE", "AND", "ORDER", "BY", "ASC", "DESC", "LIMIT")


    def tokenize_sql(text):
        """Split SQL text into a list of tokens: words (letters, digits, underscores, not starting with a digit), whole numbers, strings in single quotes (kept WITH their quotes) and the symbols >= <= != = < > , *. Spaces are skipped. ValueError('unexpected character C') for anything else."""
        tokens = []
        pos = 0
        pattern = re.compile(r"\s+|(>=|<=|!=|=|<|>|,|\*|'[^']*'|\d+|[A-Za-z_][A-Za-z0-9_]*)")
        while pos < len(text):
            m = pattern.match(text, pos)
            if not m:
                raise ValueError("unexpected character " + text[pos])
            if m.group(1) is not None:
                tokens.append(m.group(1))
            pos = m.end()
        return tokens


    def parse_sql(text):
        """Parse  SELECT cols FROM table [WHERE cond AND cond ...] [ORDER BY col [ASC|DESC], ...] [LIMIT n]  into {"cols": [...] (or ["*"]), "table": name, "where": [(column, op, value)], "order": [(column, descending)], "limit": n or None}.
        Keywords are case-insensitive; names are case-sensitive. A condition is column op value with op one of = != < <= > >=, and value an integer or a quoted string (returned without the quotes). Errors are ValueError with the message 'expected X' (X = what was missing, for example 'expected FROM') or 'unexpected extra input'."""
        toks = tokenize_sql(text)
        pos = 0

        def peek():
            return toks[pos] if pos < len(toks) else None

        def is_kw(word):
            t = peek()
            return t is not None and t.upper() == word

        def eat_kw(word):
            nonlocal pos
            if not is_kw(word):
                raise ValueError("expected " + word)
            pos += 1

        def name(what):
            nonlocal pos
            t = peek()
            if t is None or not re.match(r"[A-Za-z_]", t) or t.upper() in KEYWORDS:
                raise ValueError("expected " + what)
            pos += 1
            return t

        eat_kw("SELECT")
        if peek() == "*":
            pos += 1
            cols = ["*"]
        else:
            cols = [name("column")]
            while peek() == ",":
                pos += 1
                cols.append(name("column"))
        eat_kw("FROM")
        table = name("table name")
        conds, order, lim = [], [], None
        if is_kw("WHERE"):
            pos += 1
            while True:
                col = name("column")
                op = peek()
                if op not in ("=", "!=", "<", "<=", ">", ">="):
                    raise ValueError("expected comparison")
                pos += 1
                t = peek()
                if t is None:
                    raise ValueError("expected value")
                if t.startswith("'"):
                    val = t[1:-1]
                elif t.isdigit():
                    val = int(t)
                else:
                    raise ValueError("expected value")
                pos += 1
                conds.append((col, op, val))
                if is_kw("AND"):
                    pos += 1
                else:
                    break
        if is_kw("ORDER"):
            pos += 1
            eat_kw("BY")
            while True:
                col = name("column")
                desc = False
                if is_kw("DESC"):
                    desc = True
                    pos += 1
                elif is_kw("ASC"):
                    pos += 1
                order.append((col, desc))
                if peek() == ",":
                    pos += 1
                else:
                    break
        if is_kw("LIMIT"):
            pos += 1
            t = peek()
            if t is None or not t.isdigit():
                raise ValueError("expected number")
            lim = int(t)
            pos += 1
        if pos != len(toks):
            raise ValueError("unexpected extra input")
        return {"cols": cols, "table": table, "where": conds, "order": order, "limit": lim}


    def make_predicate(conds):
        """Turn a WHERE list of (column, op, value) conditions into a function row -> bool that is true only if ALL conditions hold. Operators: = != < <= > >=. A condition on a NULL (None) value is never true. ValueError('no such column NAME') when the row lacks the column."""
        def pred(row):
            for col, op, value in conds:
                if col not in row:
                    raise ValueError("no such column " + col)
                v = row[col]
                if v is None:
                    return False
                ok = {"=": v == value, "!=": v != value, "<": v < value, "<=": v <= value, ">": v > value, ">=": v >= value}[op]
                if not ok:
                    return False
            return True
        return pred


    def execute(sql, db):
        """Run a query against `db`, a dict from table name to list of row dicts, and return the result as a list of dicts. Build the plan as a pipeline of the operators: scan the table (ValueError('no such table NAME') if missing), then where (with make_predicate) if there is a WHERE,
        then order_by if there is an ORDER BY, then project unless the columns are ['*'], and finally limit if there is a LIMIT. (Sorting BEFORE projecting lets you order by a column you do not select.)"""
        q = parse_sql(sql)
        if q["table"] not in db:
            raise ValueError("no such table " + q["table"])
        rows = scan(db[q["table"]])
        if q["where"]:
            rows = where(rows, make_predicate(q["where"]))
        if q["order"]:
            rows = order_by(rows, q["order"])
        if q["cols"] != ["*"]:
            rows = project(rows, q["cols"])
        if q["limit"] is not None:
            rows = limit(rows, q["limit"])
        return list(rows)


    def explain(sql):
        """Describe the plan of a query as a list of strings from the TOP operator down to the scan. Include only the operators that apply: 'Limit N', 'Project a, b', 'Sort a DESC, b ASC' (every key written with ASC or DESC), 'Filter x > 3 AND y = 'z'' (string values in single quotes, integers bare, conditions joined with ' AND '), and always 'Scan TABLE'."""
        q = parse_sql(sql)
        plan = []
        if q["limit"] is not None:
            plan.append("Limit %d" % q["limit"])
        if q["cols"] != ["*"]:
            plan.append("Project " + ", ".join(q["cols"]))
        if q["order"]:
            plan.append("Sort " + ", ".join("%s %s" % (c, "DESC" if d else "ASC") for c, d in q["order"]))
        if q["where"]:
            plan.append("Filter " + " AND ".join("%s %s %s" % (c, o, repr(v) if isinstance(v, str) else v) for c, o, v in q["where"]))
        plan.append("Scan " + q["table"])
        return plan
  explanation: The same pipeline, with smarter choices of operators, is how every SQL database runs your query.
commonMistakes:
- title: Joining with a nested loop on big tables
  explanation: The cost multiplies; use a hash or merge join.
- title: Expecting NULL to equal NULL
  explanation: A comparison with NULL is never true, so such rows do not join.
- title: Projecting before sorting
  explanation: You could not order by a column you removed.
- title: Reading the whole input in limit
  explanation: Stop pulling rows as soon as you have enough.
- title: Counting NULLs with COUNT(column)
  explanation: It skips them; only COUNT(*) counts every row.
summary:
- A query is parsed, planned and executed as a tree of operators.
- In the iterator model each operator pulls rows from below one at a time.
- Joins can be nested-loop, hash or sort-merge.
- GROUP BY keeps running totals per group and aggregates ignore NULL.
- 'Order matters: filter, sort, project, limit.'
- EXPLAIN shows the plan the database chose.
