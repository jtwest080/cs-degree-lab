  prompt: 'A database runs a query as a pipeline of **operators**, each pulling rows from the one below it, one row at a time (the **iterator** or **Volcano** model). Python generators are perfect for this. Write `scan(table)`, a generator yielding a **copy** (`dict(row)`) of each row of a list of dicts; `where(rows, pred)`, the **filter**; `project(rows, cols)`, yielding new dicts with only the named columns in the order given (`ValueError("no such column NAME")` if a row lacks one); `limit(rows, n, offset=0)`: skip `offset` rows, then yield at most `n`; it must be **lazy**: once `n` rows have been given it stops **without asking its input for another row**, so it works even on an endless generator; and `order_by(rows, keys)` where `keys` is a list of `(column, descending)` pairs, most important first: read all the rows, sort them and yield them (hint: sort **repeatedly starting from the last key** with `list.sort(key=..., reverse=...)`, because Python''s sort is stable).'
