  - A generator function uses yield; limit can simply return after the n-th row.
  solution: |
    def scan(table):
        """The leaf of every query plan: a GENERATOR that yields a COPY (dict(row)) of each row of the table (a list of dicts), one at a time."""
        for row in table:
            yield dict(row)


    def where(rows, pred):
        """A FILTER: yield only the rows for which pred(row) is true."""
        for row in rows:
            if pred(row):
                yield row


    def project(rows, cols):
        """A PROJECTION: yield new dicts holding only the named columns, in the order given. ValueError('no such column NAME') if a row lacks a requested column."""
        for row in rows:
            out = {}
            for c in cols:
                if c not in row:
                    raise ValueError("no such column " + c)
                out[c] = row[c]
            yield out


    def limit(rows, n, offset=0):
        """Skip `offset` rows, then yield at most n rows. It must be LAZY: once n rows have been yielded it stops WITHOUT asking its input for another row (so it works on an endless generator)."""
        if n <= 0:
            return
        skipped = 0
        given = 0
        for row in rows:
            if skipped < offset:
                skipped += 1
                continue
            yield row
            given += 1
            if given >= n:
                return


    def order_by(rows, keys):
        """SORT: `keys` is a list of (column, descending) pairs, most important first. Read ALL the rows, sort them (stable) and yield them. Hint: sort repeatedly, starting from the LAST key, with list.sort(key=..., reverse=...)."""
        data = list(rows)
        for col, desc in reversed(keys):
            data.sort(key=lambda r: r[col], reverse=desc)
        yield from data
  explanation: Streaming operators let a database start answering before it has read everything.
- id: joins
  title: Three ways to join
  difficulty: 5
  prompt: 'A **join** combines rows of two tables that agree on a column. Rows are dicts; the output row is `{**left, **right}`. A `None` key never matches anything (as in SQL). Write all of these as generators. `nested_loop_join(left, right, lcol, rcol)`: for every left row compare it with every right row (read `right` into a list first). `hash_join(left, right, lcol, rcol)`: build a dict from the right key to the **list** of right rows, then look each left row up; the output order is the same as the nested-loop join. `merge_join(left, right, lcol, rcol)`: **sort-merge join**: put both inputs in lists, drop `None` keys, sort each by its key (stable) and walk both with two indexes; when the keys are equal yield the merged rows for **every pairing** of the left rows and right rows sharing that key, then move past the whole group; the output is ordered by key. Write `left_join(left, right, lcol, rcol, right_cols)`: a **left outer join**: like the hash join, but a left row with no match is still yielded, extended with every name in `right_cols` set to `None` (a left row with a `None` key also counts as unmatched).'
  starter: |-
    def nested_loop_join(left, right, lcol, rcol):
        """JOIN by brute force: for every left row compare it with every right row (read `right` into a list once); when left[lcol] == right[rcol] yield the merged row {**left, **right}. A None key never matches anything (as in SQL). Output order: by left row, then right row."""
        pass


    def hash_join(left, right, lcol, rcol):
        """HASH JOIN: build a dict from rcol value to the list of right rows (skip rows whose key is None), then for each left row look up its key and yield {**left, **right} for each match. Same output order as the nested-loop join."""
        pass


    def merge_join(left, right, lcol, rcol):
        """SORT-MERGE JOIN: put both inputs in lists, drop rows whose key is None, sort each by its key column (stable), then walk both with two indexes. When the keys are equal, yield the merged rows for EVERY pairing of the left rows and right rows that share that key
        (left rows in order, each with all the right rows in order), then move past the whole group. Output is ordered by key."""
        pass


    def left_join(left, right, lcol, rcol, right_cols):
        """LEFT OUTER JOIN: like hash_join, but a left row with NO match is still yielded, extended with every name in `right_cols` set to None (a left row with a None key also counts as unmatched). Left rows come in their original order."""
        pass
  tests:
  - name: matching rows
    code: |
      people = [{"pid": 1, "name": "ada"}, {"pid": 2, "name": "alan"}, {"pid": 3, "name": "grace"}]
      orders = [{"oid": 10, "buyer": 2, "item": "pen"}, {"oid": 11, "buyer": 1, "item": "ink"}, {"oid": 12, "buyer": 2, "item": "pad"}, {"oid": 13, "buyer": 9, "item": "cup"}]
      want = [{"pid": 1, "name": "ada", "oid": 11, "buyer": 1, "item": "ink"}, {"pid": 2, "name": "alan", "oid": 10, "buyer": 2, "item": "pen"}, {"pid": 2, "name": "alan", "oid": 12, "buyer": 2, "item": "pad"}]
      assert list(nested_loop_join(iter(people), iter(orders), "pid", "buyer")) == want
      assert list(hash_join(iter(people), iter(orders), "pid", "buyer")) == want
      assert list(merge_join(iter(people), iter(orders), "pid", "buyer")) == want
      assert list(hash_join(people, [], "pid", "buyer")) == [] and list(merge_join([], orders, "pid", "buyer")) == []
  - name: nulls and duplicates
    code: |
      a = [{"k": 1, "a": "x"}, {"k": None, "a": "y"}, {"k": 1, "a": "z"}, {"k": 2, "a": "w"}]
      b = [{"k2": 1, "b": 1}, {"k2": None, "b": 2}, {"k2": 1, "b": 3}]
      want = [{"k": 1, "a": "x", "k2": 1, "b": 1}, {"k": 1, "a": "x", "k2": 1, "b": 3}, {"k": 1, "a": "z", "k2": 1, "b": 1}, {"k": 1, "a": "z", "k2": 1, "b": 3}]
      for fn in (nested_loop_join, hash_join, merge_join):
          assert list(fn(a, b, "k", "k2")) == want, fn.__name__
  - name: the algorithms agree
    code: |
      import random
      rng = random.Random(8)
      left = [{"x": rng.randrange(20), "l": i} for i in range(60)]
      right = [{"y": rng.randrange(20), "r": i} for i in range(50)]
      key = lambda r: (r["l"], r["r"])
      n = sorted(nested_loop_join(left, right, "x", "y"), key=key)
      h = sorted(hash_join(left, right, "x", "y"), key=key)
      m = sorted(merge_join(left, right, "x", "y"), key=key)
      assert n == h == m and len(n) > 100
      ms = list(merge_join(left, right, "x", "y"))
      assert [r["x"] for r in ms] == sorted(r["x"] for r in ms)
      assert [r["x"] for r in ms] == [r["x"] for r in ms if r["x"] == r["y"]]
  - name: outer join
    code: |
      people = [{"pid": 1, "name": "ada"}, {"pid": 2, "name": "alan"}, {"pid": None, "name": "ghost"}, {"pid": 3, "name": "grace"}]
      orders = [{"buyer": 2, "item": "pen"}, {"buyer": 2, "item": "pad"}, {"buyer": 3, "item": "cup"}]
      got = list(left_join(people, orders, "pid", "buyer", ["buyer", "item"]))
      assert got == [{"pid": 1, "name": "ada", "buyer": None, "item": None}, {"pid": 2, "name": "alan", "buyer": 2, "item": "pen"}, {"pid": 2, "name": "alan", "buyer": 2, "item": "pad"},
       {"pid": None, "name": "ghost", "buyer": None, "item": None}, {"pid": 3, "name": "grace", "buyer": 3, "item": "cup"}]
      assert list(left_join([], orders, "pid", "buyer", ["item"])) == []
      assert list(left_join(people[:1], [], "pid", "buyer", ["item"])) == [{"pid": 1, "name": "ada", "item": None}]
  hints:
  - A dict from key to list of rows is the heart of the hash join; the merge join needs a group of equal keys on each side.
  solution: |
    def nested_loop_join(left, right, lcol, rcol):
        """JOIN by brute force: for every left row compare it with every right row (read `right` into a list once); when left[lcol] == right[rcol] yield the merged row {**left, **right}. A None key never matches anything (as in SQL). Output order: by left row, then right row."""
        right = list(right)
        for l in left:
            for r in right:
                if l[lcol] is not None and l[lcol] == r[rcol]:
                    yield {**l, **r}


    def hash_join(left, right, lcol, rcol):
        """HASH JOIN: build a dict from rcol value to the list of right rows (skip rows whose key is None), then for each left row look up its key and yield {**left, **right} for each match. Same output order as the nested-loop join."""
        table = {}
        for r in right:
            if r[rcol] is not None:
                table.setdefault(r[rcol], []).append(r)
        for l in left:
            if l[lcol] is None:
                continue
            for r in table.get(l[lcol], []):
                yield {**l, **r}


    def merge_join(left, right, lcol, rcol):
        """SORT-MERGE JOIN: put both inputs in lists, drop rows whose key is None, sort each by its key column (stable), then walk both with two indexes. When the keys are equal, yield the merged rows for EVERY pairing of the left rows and right rows that share that key
        (left rows in order, each with all the right rows in order), then move past the whole group. Output is ordered by key."""
        a = sorted((l for l in left if l[lcol] is not None), key=lambda r: r[lcol])
        b = sorted((r for r in right if r[rcol] is not None), key=lambda r: r[rcol])
        i = j = 0
        while i < len(a) and j < len(b):
            ka, kb = a[i][lcol], b[j][rcol]
            if ka < kb:
                i += 1
            elif ka > kb:
                j += 1
            else:
                i2 = i
                while i2 < len(a) and a[i2][lcol] == ka:
                    i2 += 1
                j2 = j
                while j2 < len(b) and b[j2][rcol] == kb:
                    j2 += 1
                for l in a[i:i2]:
                    for r in b[j:j2]:
                        yield {**l, **r}
                i, j = i2, j2


    def left_join(left, right, lcol, rcol, right_cols):
        """LEFT OUTER JOIN: like hash_join, but a left row with NO match is still yielded, extended with every name in `right_cols` set to None (a left row with a None key also counts as unmatched). Left rows come in their original order."""
        table = {}
        for r in right:
            if r[rcol] is not None:
                table.setdefault(r[rcol], []).append(r)
        for l in left:
            matches = table.get(l[lcol], []) if l[lcol] is not None else []
            if not matches:
                yield {**l, **{c: None for c in right_cols}}
            for r in matches:
                yield {**l, **r}
  explanation: Which join algorithm is fastest depends on the sizes and on whether the data is already sorted or indexed.
- id: groupby
  title: Grouping and aggregates
  difficulty: 4
  prompt: 'Aggregation squeezes many rows into summary rows: *how many orders per customer, what is the average salary per department*. Write `group_by(rows, keys, aggs)`. `keys` is a list of column names; `aggs` is a list of `(output_name, function, column)` where the function is one of `''count''`, `''sum''`, `''min''`, `''max''`, `''avg''` (`ValueError("unknown aggregate NAME")` otherwise). Only values that are **not `None`** are used: `count` counts them (the column `''*''` counts **every** row), `sum`/`min`/`max`/`avg` ignore `None` and give `None` if nothing is left; `avg` is rounded to 2 decimals. Return a list of dicts, one per group, holding the key columns followed by the aggregates, **sorted by the tuple of key values**. With **no keys** there is always exactly one group, even for no rows (count 0, the others `None`).'
  starter: |-
    def group_by(rows, keys, aggs):
        """GROUP BY with aggregates. `keys` is a list of column names; `aggs` a list of (output_name, function, column) with function one of 'count', 'sum', 'min', 'max', 'avg' (ValueError('unknown aggregate NAME') otherwise). Only values that are not None are used: count counts them (the column '*' counts every row),
        sum/min/max/avg ignore None and give None if there is nothing left; avg is rounded to 2 decimals. Return a list of dicts, one per group, holding the key columns and then the aggregates, sorted by the tuple of key values. With NO keys there is always exactly one group, even for no rows (count 0, the rest None)."""
        pass
  tests:
  - name: one key
    code: |
      emp = [{"dept": "eng", "pay": 100}, {"dept": "ops", "pay": 60}, {"dept": "eng", "pay": 120}, {"dept": "ops", "pay": 80}, {"dept": "eng", "pay": 110}]
      got = group_by(emp, ["dept"], [("n", "count", "*"), ("total", "sum", "pay"), ("top", "max", "pay"), ("low", "min", "pay"), ("mean", "avg", "pay")])
      assert got == [{"dept": "eng", "n": 3, "total": 330, "top": 120, "low": 100, "mean": 110.0}, {"dept": "ops", "n": 2, "total": 140, "top": 80, "low": 60, "mean": 70.0}]
      assert group_by([{"a": 1}, {"a": 2}, {"a": 4}], [], [("m", "avg", "a")]) == [{"m": 2.33}]
  - name: nulls
    code: |
      rows = [{"g": "x", "v": 4}, {"g": "x", "v": None}, {"g": "y", "v": None}, {"g": "x", "v": 6}]
      got = group_by(rows, ["g"], [("rows", "count", "*"), ("vals", "count", "v"), ("s", "sum", "v"), ("a", "avg", "v"), ("lo", "min", "v")])
      assert got == [{"g": "x", "rows": 3, "vals": 2, "s": 10, "a": 5.0, "lo": 4}, {"g": "y", "rows": 1, "vals": 0, "s": None, "a": None, "lo": None}]
  - name: several keys and no keys
    code: |
      rows = [{"a": 1, "b": "p", "v": 1}, {"a": 2, "b": "p", "v": 2}, {"a": 1, "b": "q", "v": 3}, {"a": 1, "b": "p", "v": 4}]
      got = group_by(rows, ["a", "b"], [("t", "sum", "v")])
      assert got == [{"a": 1, "b": "p", "t": 5}, {"a": 1, "b": "q", "t": 3}, {"a": 2, "b": "p", "t": 2}]
      assert group_by(rows, [], [("n", "count", "*"), ("t", "sum", "v")]) == [{"n": 4, "t": 10}]
      assert group_by([], [], [("n", "count", "*"), ("t", "sum", "v"), ("m", "max", "v")]) == [{"n": 0, "t": None, "m": None}]
      assert group_by([], ["a"], [("n", "count", "*")]) == []
      assert group_by(iter(rows[:1]), ["a"], []) == [{"a": 1}]
  - name: errors
    code: |
      try:
          group_by([{"a": 1}], ["a"], [("m", "median", "a")])
          raise AssertionError("accepted")
      except ValueError as e:
          assert "unknown aggregate median" in str(e)
  hints:
  - Collect the rows of each group in a dict keyed by a tuple, then compute each aggregate from the list.
  solution: |
    def group_by(rows, keys, aggs):
        """GROUP BY with aggregates. `keys` is a list of column names; `aggs` a list of (output_name, function, column) with function one of 'count', 'sum', 'min', 'max', 'avg' (ValueError('unknown aggregate NAME') otherwise). Only values that are not None are used: count counts them (the column '*' counts every row),
        sum/min/max/avg ignore None and give None if there is nothing left; avg is rounded to 2 decimals. Return a list of dicts, one per group, holding the key columns and then the aggregates, sorted by the tuple of key values. With NO keys there is always exactly one group, even for no rows (count 0, the rest None)."""
        for name, fn, col in aggs:
            if fn not in ("count", "sum", "min", "max", "avg"):
                raise ValueError("unknown aggregate " + fn)
        groups = {}
        for row in rows:
            groups.setdefault(tuple(row[k] for k in keys), []).append(row)
        if not keys and not groups:
            groups[()] = []
        out = []
        for key in sorted(groups):
            members = groups[key]
            result = dict(zip(keys, key))
            for name, fn, col in aggs:
                if fn == "count" and col == "*":
                    result[name] = len(members)
                    continue
                vals = [r[col] for r in members if r[col] is not None]
                if fn == "count":
                    result[name] = len(vals)
                elif not vals:
                    result[name] = None
                elif fn == "sum":
                    result[name] = sum(vals)
                elif fn == "min":
                    result[name] = min(vals)
                elif fn == "max":
                    result[name] = max(vals)
                else:
                    result[name] = round(sum(vals) / len(vals), 2)
            out.append(result)
        return out
  explanation: GROUP BY is a hash table of partial results; real engines may use sorting instead when memory is short.
- id: parser
  title: Parsing SQL
  difficulty: 5
  prompt: 'Before running a query the database must understand it. Write `tokenize_sql(text)`: split into a list of tokens: words (letters, digits, underscores; not starting with a digit), whole numbers, strings in single quotes (**kept with their quotes**) and the symbols `>= <= != = < > , *`; spaces are skipped; `ValueError("unexpected character C")` for anything else. Write `parse_sql(text)` for `SELECT cols FROM table [WHERE cond AND cond ...] [ORDER BY col [ASC|DESC], ...] [LIMIT n]`. It returns `{"cols": [...] (or ["*"]), "table": name, "where": [(column, op, value)], "order": [(column, descending)], "limit": n or None}`. Keywords are **case-insensitive**, names case-sensitive. A condition is `column op value` with `op` one of `= != < <= > >=` and the value an integer or a quoted string (returned **without** the quotes). Errors are `ValueError` with `expected X` (for example `expected FROM`, `expected column`, `expected table name`, `expected comparison`, `expected value`, `expected number`) or `unexpected extra input`. Starter code gives `KEYWORDS` and the `re` import.'
  starter: |-
    import re

    KEYWORDS = ("SELECT", "FROM", "WHERE", "AND", "ORDER", "BY", "ASC", "DESC", "LIMIT")


    def tokenize_sql(text):
        """Split SQL text into a list of tokens: words (letters, digits, underscores, not starting with a digit), whole numbers, strings in single quotes (kept WITH their quotes) and the symbols >= <= != = < > , *. Spaces are skipped. ValueError('unexpected character C') for anything else."""
        pass


    def parse_sql(text):
        """Parse  SELECT cols FROM table [WHERE cond AND cond ...] [ORDER BY col [ASC|DESC], ...] [LIMIT n]  into {"cols": [...] (or ["*"]), "table": name, "where": [(column, op, value)], "order": [(column, descending)], "limit": n or None}.
        Keywords are case-insensitive; names are case-sensitive. A condition is column op value with op one of = != < <= > >=, and value an integer or a quoted string (returned without the quotes). Errors are ValueError with the message 'expected X' (X = what was missing, for example 'expected FROM') or 'unexpected extra input'."""
        pass
  tests:
  - name: tokens
    code: |
      assert tokenize_sql("SELECT a, b FROM t") == ["SELECT", "a", ",", "b", "FROM", "t"]
      assert tokenize_sql("x>=10 and y!='hi there'") == ["x", ">=", "10", "and", "y", "!=", "'hi there'"]
      assert tokenize_sql("select * from t where a<5") == ["select", "*", "from", "t", "where", "a", "<", "5"]
      assert tokenize_sql("") == [] and tokenize_sql("  a_1 ") == ["a_1"]
      try:
          tokenize_sql("select a; from t")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "unexpected character ;" in str(e)
  - name: simple queries
    code: |
      assert parse_sql("SELECT * FROM people") == {"cols": ["*"], "table": "people", "where": [], "order": [], "limit": None}
      assert parse_sql("select name, age from people") == {"cols": ["name", "age"], "table": "people", "where": [], "order": [], "limit": None}
      q = parse_sql("SELECT a FROM t WHERE x > 3 AND y = 'hello world' AND z != 0")
      assert q["where"] == [("x", ">", 3), ("y", "=", "hello world"), ("z", "!=", 0)]
      q = parse_sql("SELECT a FROM t ORDER BY a DESC, b, c ASC LIMIT 10")
      assert q["order"] == [("a", True), ("b", False), ("c", False)] and q["limit"] == 10
  - name: everything together
    code: |
      q = parse_sql("select name from People where Age >= 30 and name != 'bob' order by name desc limit 5")
      assert q == {"cols": ["name"], "table": "People", "where": [("Age", ">=", 30), ("name", "!=", "bob")], "order": [("name", True)], "limit": 5}
      assert parse_sql("SELECT a FROM t LIMIT 0")["limit"] == 0
  - name: errors
    code: |
      cases = [("SELECT FROM t", "expected column"), ("SELECT a t", "expected FROM"), ("SELECT a FROM", "expected table name"), ("SELECT a FROM t WHERE", "expected column"),
       ("SELECT a FROM t WHERE x 5", "expected comparison"), ("SELECT a FROM t WHERE x >", "expected value"), ("SELECT a FROM t WHERE x > y", "expected value"),
       ("SELECT a FROM t ORDER a", "expected BY"), ("SELECT a FROM t LIMIT x", "expected number"), ("SELECT a FROM t extra", "unexpected extra input"),
       ("a FROM t", "expected SELECT"), ("SELECT a, FROM t", "expected column"), ("SELECT a FROM t LIMIT", "expected number")]
      for text, msg in cases:
          try:
              parse_sql(text)
              raise AssertionError("accepted " + text)
          except ValueError as e:
              assert msg in str(e), (text, str(e))
  hints:
  - Write small helpers peek, eat and name that move a position through the token list.
  solution: |
    import re

    KEYWORDS = ("SELECT", "FROM", "WHERE", "AND", "ORDER", "BY", "ASC", "DESC", "LIMIT")


    def tokenize_sql(text):
        """Split SQL text into a list of tokens: words (letters, digits, underscores, not starting with a digit), whole numbers, strings in single quotes (kept WITH their quotes) and the symbols >= <= != = < > , *. Spaces are skipped. ValueError('unexpected character C') for anything else."""
        tokens = []
        pos = 0
        pattern = re.compile(r"\s+|(>=|<=|!=|=|<|>|,|\*|'[^']*'|\d+|[A-Za-z_][A-Za-z0-9_]*)")
        while pos < len(text):
            m = pattern.match(text, pos)
            if not m:
                raise ValueError("unexpected character " + text[pos])
            if m.group(1) is not None:
                tokens.append(m.group(1))
            pos = m.end()
        return tokens


    def parse_sql(text):
        """Parse  SELECT cols FROM table [WHERE cond AND cond ...] [ORDER BY col [ASC|DESC], ...] [LIMIT n]  into {"cols": [...] (or ["*"]), "table": name, "where": [(column, op, value)], "order": [(column, descending)], "limit": n or None}.
        Keywords are case-insensitive; names are case-sensitive. A condition is column op value with op one of = != < <= > >=, and value an integer or a quoted string (returned without the quotes). Errors are ValueError with the message 'expected X' (X = what was missing, for example 'expected FROM') or 'unexpected extra input'."""
        toks = tokenize_sql(text)
        pos = 0

        def peek():
            return toks[pos] if pos < len(toks) else None

        def is_kw(word):
            t = peek()
            return t is not None and t.upper() == word

        def eat_kw(word):
            nonlocal pos
            if not is_kw(word):
                raise ValueError("expected " + word)
            pos += 1

        def name(what):
            nonlocal pos
            t = peek()
            if t is None or not re.match(r"[A-Za-z_]", t) or t.upper() in KEYWORDS:
                raise ValueError("expected " + what)
            pos += 1
            return t

        eat_kw("SELECT")
        if peek() == "*":
            pos += 1
            cols = ["*"]
        else:
            cols = [name("column")]
            while peek() == ",":
                pos += 1
                cols.append(name("column"))
        eat_kw("FROM")
        table = name("table name")
        conds, order, lim = [], [], None
        if is_kw("WHERE"):
            pos += 1
            while True:
                col = name("column")
                op = peek()
                if op not in ("=", "!=", "<", "<=", ">", ">="):
                    raise ValueError("expected comparison")
                pos += 1
                t = peek()
                if t is None:
                    raise ValueError("expected value")
                if t.startswith("'"):
                    val = t[1:-1]
                elif t.isdigit():
                    val = int(t)
                else:
                    raise ValueError("expected value")
                pos += 1
                conds.append((col, op, val))
                if is_kw("AND"):
                    pos += 1
                else:
                    break
        if is_kw("ORDER"):
            pos += 1
            eat_kw("BY")
            while True:
                col = name("column")
                desc = False
                if is_kw("DESC"):
                    desc = True
                    pos += 1
                elif is_kw("ASC"):
                    pos += 1
                order.append((col, desc))
                if peek() == ",":
                    pos += 1
                else:
                    break
        if is_kw("LIMIT"):
            pos += 1
            t = peek()
            if t is None or not t.isdigit():
                raise ValueError("expected number")
            lim = int(t)
            pos += 1
        if pos != len(toks):
            raise ValueError("unexpected extra input")
        return {"cols": cols, "table": table, "where": conds, "order": order, "limit": lim}
  explanation: A parser turns text into a tree the engine can run; every real database contains one.
