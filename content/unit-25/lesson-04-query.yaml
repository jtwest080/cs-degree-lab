  question: Write `count_matches(rows, column, value)` returning how many of the dict rows have `row[column] == value`.
  starter: |
    def count_matches(rows, column, value):
        pass
  tests:
  - name: count
    code: |
      rows = [{"a": 1}, {"a": 2}, {"a": 1}, {"a": None}]
      assert count_matches(rows, "a", 1) == 2 and count_matches(rows, "a", 9) == 0 and count_matches([], "a", 1) == 0 and count_matches(rows, "a", None) == 1
  solution: |
    def count_matches(rows, column, value):
        return sum(1 for r in rows if r[column] == value)
