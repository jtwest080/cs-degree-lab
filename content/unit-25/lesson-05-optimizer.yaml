- title: Join order and push-down
  intro: The best and worst join orders, and a filter moving below a join.
  code: |
    def join_size(tables, sizes, sel):
        """The estimated number of rows after joining the tables in the tuple/list `tables`: the PRODUCT of their sizes (dict name -> rows), times sel[frozenset({a, b})] for every pair of tables a, b in the list that has an entry in `sel` (a missing pair means a cross product and counts as 1.0). Return a float."""
        size = 1.0
        for t in tables:
            size *= sizes[t]
        names = list(tables)
        for i in range(len(names)):
            for j in range(i + 1, len(names)):
                size *= sel.get(frozenset((names[i], names[j])), 1.0)
        return size


    def plan_cost(order, sizes, sel):
        """The cost of a LEFT-DEEP join plan that joins the tables in `order` one at a time: the sum of the estimated sizes of the INTERMEDIATE results, i.e. join_size of the first 2 tables, of the first 3, and so on up to all of them. (A single table costs 0.) Return a float."""
        return sum(join_size(order[:k], sizes, sel) for k in range(2, len(order) + 1))


    def best_order(sizes, sel):
        """Try EVERY order of the tables (itertools.permutations over the sorted table names) and return (best order as a tuple, its cost). On equal costs prefer the order that is smaller as a tuple of names. ValueError('need two tables') if there are fewer than two."""
        from itertools import permutations
        names = sorted(sizes)
        if len(names) < 2:
            raise ValueError("need two tables")
        best = None
        for order in permutations(names):
            cost = plan_cost(order, sizes, sel)
            if best is None or cost < best[1]:
                best = (order, cost)
        return best


    def tables_of(plan):
        """The set of table names scanned anywhere under a plan. A PLAN is a nested tuple: ("scan", table), ("filter", (table, column, op, value), child), ("project", [columns], child) or ("join", left, right)."""
        if plan[0] == "scan":
            return {plan[1]}
        if plan[0] == "join":
            return tables_of(plan[1]) | tables_of(plan[2])
        return tables_of(plan[-1])


    def push_filters(plan):
        """FILTER PUSH-DOWN: return a plan where every filter has been moved as far DOWN as possible, because filtering early shrinks everything above it. A filter directly above a join moves into the side that scans the filter's table (and keeps moving down there);
        if the table is on neither side the filter stays where it is. Filters above filters work too (the inner one is pushed first; then the outer one is looked at again). Filters stay above projections and scans. Recurse into all children. Do not change the input."""
        kind = plan[0]
        if kind == "scan":
            return plan
        if kind == "join":
            return ("join", push_filters(plan[1]), push_filters(plan[2]))
        if kind == "project":
            return ("project", plan[1], push_filters(plan[2]))
        cond, child = plan[1], push_filters(plan[2])
        if child[0] == "join":
            if cond[0] in tables_of(child[1]):
                return ("join", push_filters(("filter", cond, child[1])), child[2])
            if cond[0] in tables_of(child[2]):
                return ("join", child[1], push_filters(("filter", cond, child[2])))
        return ("filter", cond, child)


    def plan_text(plan, depth=0):
        """Draw a plan as text, one operator per line, indented two spaces per level, parent above children (left child first): 'Scan t', 'Filter t.col op value' (strings in single quotes via repr, numbers bare), 'Project a, b' and 'Join'. Lines are joined with newlines, with no trailing newline."""
        pad = "  " * depth
        kind = plan[0]
        if kind == "scan":
            return pad + "Scan " + plan[1]
        if kind == "join":
            return "\n".join([pad + "Join", plan_text(plan[1], depth + 1), plan_text(plan[2], depth + 1)])
        if kind == "project":
            return "\n".join([pad + "Project " + ", ".join(plan[1]), plan_text(plan[2], depth + 1)])
        t, c, op, v = plan[1]
        return "\n".join([pad + "Filter %s.%s %s %s" % (t, c, op, repr(v) if isinstance(v, str) else v), plan_text(plan[2], depth + 1)])

    sizes = {"orders": 100000, "people": 1000, "cities": 20}
    sel = {frozenset(("orders", "people")): 0.001, frozenset(("people", "cities")): 0.05}
    order, cost = best_order(sizes, sel)
    print("best join order:", order, "cost:", cost)
    print("worst order cost:", max(plan_cost(p, sizes, sel) for p in __import__("itertools").permutations(sizes)))
    plan = ("filter", ("people", "city", "=", "oslo"), ("join", ("scan", "orders"), ("scan", "people")))
    print("before:")
    print(plan_text(plan))
    print("after pushing the filter down:")
    print(plan_text(push_filters(plan)))
  output: |
    best join order: ('cities', 'people', 'orders') cost: 101000.0
    worst order cost: 2100000.0
    before:
    Filter people.city = 'oslo'
      Join
        Scan orders
        Scan people
    after pushing the filter down:
    Join
      Scan orders
      Filter people.city = 'oslo'
        Scan people
