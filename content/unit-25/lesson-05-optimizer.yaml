      assert block_nested_cost(10, 100, 12) == 10 + 1 * 100
      assert block_nested_cost(100, 50, 12) == 100 + 10 * 50
      assert block_nested_cost(101, 50, 12) == 101 + 11 * 50
      assert block_nested_cost(10, 100, 3) == 10 + 10 * 100
      assert hash_join_cost(10, 100) == 330 and hash_join_cost(0, 0) == 0
      try:
          block_nested_cost(1, 1, 2)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "buffer too small" in str(e)
      assert block_nested_cost(1000, 1000, 50) > hash_join_cost(1000, 1000)
  - name: external sorting
