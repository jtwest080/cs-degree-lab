exercises:
- id: stats
  title: Statistics and selectivity
  difficulty: 4
  prompt: 'A database may run a query in many ways, so its **optimizer** must guess how much work each way is, and it guesses from **statistics** about the data. Write `table_stats(rows)`: for a list of dicts return `{"rows": n, "cols": {column: {"distinct": number of distinct non-None values, "min": smallest non-None value, "max": largest, "nulls": number of None values}}}` (for a column with no non-None values `min` and `max` are `None` and `distinct` is 0). Write `selectivity(stats, col, op, value)`: the estimated **fraction** of rows satisfying `col op value`, assuming values are spread **uniformly** between `min` and `max`, rounded to 4 decimals. `=` is 0 if the value is outside `[min, max]`, else `1 / distinct`; `!=` is 1 minus that. `<` is 0 if `value <= min`, 1 if `value > max`, else `(value - min) / (max - min)`; `<=` is 0 if `value < min`, 1 if `value >= max`, else the same fraction; `>` is 1 minus the `<=` result and `>=` is 1 minus the `<` result. If `min == max` use 0.5 for the in-between fraction. `ValueError("no such column NAME")` for an unknown column, `ValueError("unknown operator OP")` for another operator; a column with no values gives `0.0`. Write `estimate_rows(stats, conds)` for a list of `(column, op, value)`: `stats["rows"]` times the **product** of the selectivities (the **independence** assumption), rounded to an integer.'
