  tests:
  - name: collecting statistics
    code: |
      rows = [{"id": 1, "city": "oslo", "age": 30}, {"id": 2, "city": "rome", "age": 40}, {"id": 3, "city": "oslo", "age": None}, {"id": 4, "city": "kyiv", "age": 50}]
      s = table_stats(rows)
      assert s["rows"] == 4
      assert s["cols"]["id"] == {"distinct": 4, "min": 1, "max": 4, "nulls": 0}
      assert s["cols"]["city"] == {"distinct": 3, "min": "kyiv", "max": "rome", "nulls": 0}
      assert s["cols"]["age"] == {"distinct": 3, "min": 30, "max": 50, "nulls": 1}
      assert table_stats([]) == {"rows": 0, "cols": {}}
      assert table_stats([{"a": None}])["cols"]["a"] == {"distinct": 0, "min": None, "max": None, "nulls": 1}
  - name: selectivity
    code: |
      rows = [{"x": v} for v in range(0, 100)]
      s = table_stats(rows)
      assert selectivity(s, "x", "=", 10) == 0.01 and selectivity(s, "x", "=", 500) == 0.0 and selectivity(s, "x", "!=", 10) == 0.99
      assert selectivity(s, "x", "<", 50) == 0.5051 and selectivity(s, "x", "<=", 50) == 0.5051
      assert selectivity(s, "x", ">", 50) == 0.4949 and selectivity(s, "x", ">=", 50) == 0.4949
      assert selectivity(s, "x", "<", 0) == 0.0 and selectivity(s, "x", "<", 1000) == 1.0 and selectivity(s, "x", "<=", 99) == 1.0
      assert selectivity(s, "x", ">", 99) == 0.0 and selectivity(s, "x", ">=", 0) == 1.0 and selectivity(s, "x", ">=", 100) == 0.0
      one = table_stats([{"x": 5}, {"x": 5}])
      assert selectivity(one, "x", "<", 5) == 0.0 and selectivity(one, "x", "<=", 5) == 1.0 and selectivity(one, "x", "=", 5) == 1.0
      assert selectivity(table_stats([{"x": None}]), "x", "=", 1) == 0.0
  - name: errors
    code: |
      s = table_stats([{"x": 1}])
      for args, msg in ((("y", "=", 1), "no such column y"), (("x", "~", 1), "unknown operator ~")):
          try:
              selectivity(s, *args)
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
  - name: estimating rows
    code: |
      rows = [{"a": i % 10, "b": i % 4, "c": "k"} for i in range(1000)]
      s = table_stats(rows)
      assert estimate_rows(s, []) == 1000
      assert estimate_rows(s, [("a", "=", 3)]) == 100
      assert estimate_rows(s, [("a", "=", 3), ("b", "=", 1)]) == 25
      assert estimate_rows(s, [("a", ">=", 5)]) == round(1000 * selectivity(s, "a", ">=", 5))
      assert estimate_rows(s, [("a", "=", 99)]) == 0
      assert estimate_rows(table_stats([]), []) == 0
  hints:
  - Selectivity is a number between 0 and 1; multiply selectivities for several conditions.
  solution: |
    def table_stats(rows):
        """Statistics for the OPTIMIZER about a table (a list of dicts with the same columns): {"rows": number of rows, "cols": {column: {"distinct": number of distinct non-None values, "min": smallest non-None value, "max": largest, "nulls": number of None values}}}. For a column with no non-None values, min and max are None and distinct is 0."""
        cols = {}
        if rows:
            for c in rows[0]:
                vals = [r[c] for r in rows if r[c] is not None]
                cols[c] = {"distinct": len(set(vals)), "min": min(vals) if vals else None, "max": max(vals) if vals else None, "nulls": len(rows) - len(vals)}
        return {"rows": len(rows), "cols": cols}


    def selectivity(stats, col, op, value):
        """The estimated FRACTION of rows that satisfy `col op value`, assuming values are spread UNIFORMLY between min and max (op is one of = != < <= > >=). Rounded to 4 decimals.
        '=': 0 if value is outside [min, max], else 1 / distinct. '!=': 1 minus the '=' result. '<': 0 if value <= min, 1 if value > max, else (value - min) / (max - min). '<=': 0 if value < min, 1 if value >= max, else the same fraction.
        '>': 1 minus the '<=' result; '>=': 1 minus the '<' result. If min == max, treat the fraction for the in-between case as 0.5. ValueError('no such column NAME') if the column is unknown; ValueError('unknown operator OP') for another operator; a column with no values gives 0.0."""
        if col not in stats["cols"]:
            raise ValueError("no such column " + col)
        if op not in ("=", "!=", "<", "<=", ">", ">="):
            raise ValueError("unknown operator " + op)
        c = stats["cols"][col]
        if c["distinct"] == 0:
            return 0.0
        lo, hi = c["min"], c["max"]

        def eq():
            return 0.0 if value < lo or value > hi else 1 / c["distinct"]

        def frac():
            return 0.5 if hi == lo else (value - lo) / (hi - lo)

        def lt():
            return 0.0 if value <= lo else 1.0 if value > hi else frac()

        def le():
            return 0.0 if value < lo else 1.0 if value >= hi else frac()

        result = {"=": eq, "!=": lambda: 1 - eq(), "<": lt, "<=": le, ">": lambda: 1 - le(), ">=": lambda: 1 - lt()}[op]()
        return round(result, 4)


    def estimate_rows(stats, conds):
        """The estimated number of rows after applying ALL the conditions, a list of (column, op, value): stats["rows"] times the product of the selectivities (the INDEPENDENCE assumption), rounded to the nearest integer."""
        est = float(stats["rows"])
        for col, op, value in conds:
            est *= selectivity(stats, col, op, value)
        return round(est)
  explanation: Statistics let the optimizer predict the size of every intermediate result.
- id: cost
  title: A cost model
  difficulty: 5
  prompt: 'The optimizer compares plans by estimated **cost**, here the number of **page reads**. Write `scan_cost(pages)` (one read per page) and `index_cost(height, matches, rows_per_page, clustered)`: the descent costs `height` reads; if the index is **clustered** (rows stored in key order) the matching rows are contiguous, so add `ceil(matches / rows_per_page)` reads (nothing if `matches` is 0); if **not** clustered every match may sit on a different page, so add `matches` reads. Write `choose_access(table_pages, rows_per_page, height, matches, clustered)` returning `(''seq scan'', cost)` or `(''index scan'', cost)`, the cheaper one, preferring the sequential scan on a tie. Write `block_nested_cost(pages_l, pages_r, buffer_pages)`: read the left table in chunks of `buffer_pages - 2` pages and scan the whole right table once per chunk: `pages_l + ceil(pages_l / (buffer_pages - 2)) * pages_r` (`ValueError("buffer too small")` if `buffer_pages < 3`). Write `hash_join_cost(pages_l, pages_r)` = `3 * (pages_l + pages_r)` (partition both inputs, then read them back). Write `external_sort_cost(pages, buffer_pages)`: pass 0 sorts runs of `buffer_pages` pages in memory, giving `runs = ceil(pages / buffer_pages)`; every later pass merges up to `buffer_pages - 1` runs into one (`runs = ceil(runs / (buffer_pages - 1))`); count the passes (pass 0 included) until one run remains; the cost is `2 * pages * passes`. Use integer arithmetic only (`ValueError("buffer too small")` if `buffer_pages < 3`).'
  starter: |-
    def scan_cost(pages):
        """The cost, in page reads, of a SEQUENTIAL SCAN of a table: one read per page."""
        pass


    def index_cost(height, matches, rows_per_page, clustered):
        """The cost of finding `matches` rows through a B+ tree of the given height. The descent costs `height` reads. If the index is CLUSTERED (the rows are stored in key order) the matching rows are contiguous: add ceil(matches / rows_per_page) reads (none if matches is 0).
        If it is NOT clustered every matching row may be on a different page: add `matches` reads."""
        pass


    def choose_access(table_pages, rows_per_page, height, matches, clustered):
        """Pick the cheaper access path: return ('seq scan', cost) or ('index scan', cost); on a tie choose the sequential scan."""
        pass


    def block_nested_cost(pages_l, pages_r, buffer_pages):
        """BLOCK NESTED-LOOP JOIN: read the left table in chunks of (buffer_pages - 2) pages and scan the whole right table once per chunk: pages_l + ceil(pages_l / (buffer_pages - 2)) * pages_r. ValueError('buffer too small') if buffer_pages < 3."""
        pass


    def hash_join_cost(pages_l, pages_r):
        """GRACE HASH JOIN: partition both inputs (read and write them) and then read the partitions: 3 * (pages_l + pages_r)."""
        pass


    def external_sort_cost(pages, buffer_pages):
