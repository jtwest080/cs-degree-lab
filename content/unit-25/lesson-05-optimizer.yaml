      assert scan_cost(500) == 500
      assert index_cost(3, 0, 100, False) == 3 and index_cost(3, 0, 100, True) == 3
      assert index_cost(3, 40, 100, False) == 43 and index_cost(3, 40, 100, True) == 4
      assert index_cost(3, 250, 100, True) == 6 and index_cost(2, 100, 100, True) == 3
      assert choose_access(500, 100, 3, 10, False) == ("index scan", 13)
      assert choose_access(500, 100, 3, 1000, False) == ("seq scan", 500)
      assert choose_access(500, 100, 3, 1000, True) == ("index scan", 13)
      assert choose_access(13, 100, 3, 10, False) == ("seq scan", 13)
  - name: join costs
