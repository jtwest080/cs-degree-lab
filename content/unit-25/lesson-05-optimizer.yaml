      assert external_sort_cost(10, 10) == 20
      assert external_sort_cost(100, 10) == 2 * 100 * 3
      assert external_sort_cost(1000, 10) == 2 * 1000 * 4
      assert external_sort_cost(1000, 100) == 2 * 1000 * 2
      assert external_sort_cost(0, 5) == 0 and external_sort_cost(5, 5) == 10
      assert external_sort_cost(10000, 3) == 2 * 10000 * 13
