id: u25-optimizer
title: The Query Optimizer
minutes: 100
objective: Learn how a database chooses among thousands of ways to run a query. You will compute statistics and selectivity, build a page-read cost model, use histograms for skewed data, choose a join order and rewrite plans by pushing filters down.
outcomes:
- Explain what a query optimizer does
- Estimate how many rows a condition matches
- Compare an index scan with a full scan using costs
- Use histograms to estimate skewed data
- Choose a join order that keeps intermediate results small
- Rewrite plans by filter push-down
sections:
- heading: Many ways to answer one question
  body: 'SQL says *what* you want, never *how*, so the database must pick a plan. Even a simple query has options: read the whole table, or use an index? And a join of five tables can be done in 120 different orders, using several join algorithms for each step, giving millions of possible plans whose speeds can differ by factors of a million. The **query optimizer** is the component that searches for a good plan. It cannot try every plan by actually running it, so it **estimates** the cost of each plan and picks the cheapest. Its estimates come from **statistics** that the database collects about every table.'
- heading: Statistics and selectivity
  body: |-
    For each column the database remembers the number of rows, the number of **distinct** values, the smallest and largest values, and the number of NULLs. From these it computes the **selectivity** of a condition: the fraction of rows that pass. If a column has 100 distinct values, `col = 5` is expected to match about 1/100 of the rows. If values run from 0 to 100 evenly, `col < 25` matches about a quarter. With several conditions the optimizer usually multiplies the selectivities, assuming the columns are **independent**. That assumption is often false (city and postal code are strongly related), which is a classic source of bad estimates.

    Real data is rarely uniform, and the uniform guess fails badly when most values are small and a few are huge. A **histogram** fixes much of that. It cuts the range of values into buckets and records how many values land in each. With an **equi-width** histogram all buckets cover the same range; an **equi-depth** histogram instead gives each bucket the same number of values. To estimate `col < 30`, add the counts of the buckets entirely below 30 and a fraction of the bucket that contains it.
- heading: 'Costs: scan or index?'
  body: |-
    The usual cost measure is the number of **page reads**, because disk dominates. A sequential scan of a table of P pages costs P. An index lookup costs the **height** of the B+ tree (typically 3 or 4) plus the cost of fetching the matching rows. If the index is **clustered**, meaning the rows are stored in index order, the matches sit side by side and few pages are needed. If it is **unclustered**, each match may be on a different page, so fetching many rows through the index can be *more* expensive than simply scanning everything. This is why a database sometimes ignores an index: when the condition matches a large fraction of the table, a sequential scan, which reads in order and benefits from prefetching, wins.

    Joins and sorts have costs too. A **block nested-loop join** reads the outer table in chunks that fit in memory and scans the inner table once per chunk. A **hash join** partitions both tables by a hash of the join key, which costs about three passes over the data. An **external merge sort** sorts chunks that fit in memory, writes them as **runs**, then merges runs in passes, so its cost is two times the data size times the number of passes.
- heading: Join order and rewrites
  body: |-
    The order in which tables are joined matters enormously, because each join produces an intermediate result that the next join must process. Joining two huge tables first may create a billion rows that a later, selective join throws away; starting with the most selective join keeps everything small. A classic optimizer, the System R design by Selinger, uses **dynamic programming** over subsets of tables to find the cheapest left-deep order without trying every permutation.

    Before costing, the optimizer also **rewrites** the plan using rules that are always safe. The most important is **filter push-down**: a condition on one table should be applied right after scanning that table, before the join, so the join sees fewer rows. Others include removing columns that are never used (projection push-down), merging filters, and simplifying constant expressions. The result is shown by the EXPLAIN command: reading plans and the estimated versus actual row counts is the main way developers diagnose slow queries.
examples:
- title: Estimates and costs
  intro: Skewed ages fool the uniform guess but not the histogram; an index loses when it matches too much.
  code: |
    def table_stats(rows):
        """Statistics for the OPTIMIZER about a table (a list of dicts with the same columns): {"rows": number of rows, "cols": {column: {"distinct": number of distinct non-None values, "min": smallest non-None value, "max": largest, "nulls": number of None values}}}. For a column with no non-None values, min and max are None and distinct is 0."""
        cols = {}
        if rows:
            for c in rows[0]:
                vals = [r[c] for r in rows if r[c] is not None]
                cols[c] = {"distinct": len(set(vals)), "min": min(vals) if vals else None, "max": max(vals) if vals else None, "nulls": len(rows) - len(vals)}
        return {"rows": len(rows), "cols": cols}


    def selectivity(stats, col, op, value):
        """The estimated FRACTION of rows that satisfy `col op value`, assuming values are spread UNIFORMLY between min and max (op is one of = != < <= > >=). Rounded to 4 decimals.
        '=': 0 if value is outside [min, max], else 1 / distinct. '!=': 1 minus the '=' result. '<': 0 if value <= min, 1 if value > max, else (value - min) / (max - min). '<=': 0 if value < min, 1 if value >= max, else the same fraction.
        '>': 1 minus the '<=' result; '>=': 1 minus the '<' result. If min == max, treat the fraction for the in-between case as 0.5. ValueError('no such column NAME') if the column is unknown; ValueError('unknown operator OP') for another operator; a column with no values gives 0.0."""
        if col not in stats["cols"]:
            raise ValueError("no such column " + col)
        if op not in ("=", "!=", "<", "<=", ">", ">="):
            raise ValueError("unknown operator " + op)
        c = stats["cols"][col]
        if c["distinct"] == 0:
            return 0.0
        lo, hi = c["min"], c["max"]

        def eq():
            return 0.0 if value < lo or value > hi else 1 / c["distinct"]

        def frac():
            return 0.5 if hi == lo else (value - lo) / (hi - lo)

        def lt():
            return 0.0 if value <= lo else 1.0 if value > hi else frac()

        def le():
            return 0.0 if value < lo else 1.0 if value >= hi else frac()

        result = {"=": eq, "!=": lambda: 1 - eq(), "<": lt, "<=": le, ">": lambda: 1 - le(), ">=": lambda: 1 - lt()}[op]()
        return round(result, 4)


    def estimate_rows(stats, conds):
        """The estimated number of rows after applying ALL the conditions, a list of (column, op, value): stats["rows"] times the product of the selectivities (the INDEPENDENCE assumption), rounded to the nearest integer."""
        est = float(stats["rows"])
        for col, op, value in conds:
            est *= selectivity(stats, col, op, value)
        return round(est)


    def scan_cost(pages):
        """The cost, in page reads, of a SEQUENTIAL SCAN of a table: one read per page."""
        return pages


    def index_cost(height, matches, rows_per_page, clustered):
        """The cost of finding `matches` rows through a B+ tree of the given height. The descent costs `height` reads. If the index is CLUSTERED (the rows are stored in key order) the matching rows are contiguous: add ceil(matches / rows_per_page) reads (none if matches is 0).
        If it is NOT clustered every matching row may be on a different page: add `matches` reads."""
        if matches == 0:
            return height
        if clustered:
            return height + (matches + rows_per_page - 1) // rows_per_page
        return height + matches


    def choose_access(table_pages, rows_per_page, height, matches, clustered):
        """Pick the cheaper access path: return ('seq scan', cost) or ('index scan', cost); on a tie choose the sequential scan."""
        s = scan_cost(table_pages)
        i = index_cost(height, matches, rows_per_page, clustered)
        return ("index scan", i) if i < s else ("seq scan", s)


    def block_nested_cost(pages_l, pages_r, buffer_pages):
        """BLOCK NESTED-LOOP JOIN: read the left table in chunks of (buffer_pages - 2) pages and scan the whole right table once per chunk: pages_l + ceil(pages_l / (buffer_pages - 2)) * pages_r. ValueError('buffer too small') if buffer_pages < 3."""
        if buffer_pages < 3:
            raise ValueError("buffer too small")
        chunks = (pages_l + buffer_pages - 3) // (buffer_pages - 2)
        return pages_l + chunks * pages_r


    def hash_join_cost(pages_l, pages_r):
        """GRACE HASH JOIN: partition both inputs (read and write them) and then read the partitions: 3 * (pages_l + pages_r)."""
        return 3 * (pages_l + pages_r)


    def external_sort_cost(pages, buffer_pages):
        """The cost of an EXTERNAL MERGE SORT. Pass 0 sorts runs of buffer_pages pages in memory, giving runs = ceil(pages / buffer_pages). Each later pass merges up to (buffer_pages - 1) runs into one, so runs = ceil(runs / (buffer_pages - 1)). Count the passes (pass 0 included) until one run is left.
        Every pass reads and writes every page: cost = 2 * pages * passes. Use integer arithmetic only. ValueError('buffer too small') if buffer_pages < 3."""
        if buffer_pages < 3:
            raise ValueError("buffer too small")
        runs = (pages + buffer_pages - 1) // buffer_pages
        passes = 1
        while runs > 1:
            runs = (runs + buffer_pages - 2) // (buffer_pages - 1)
            passes += 1
        return 2 * pages * passes


    def equi_width_histogram(values, buckets):
        """A HISTOGRAM of whole numbers: {"lo": min, "hi": max, "counts": [...], "total": number of values}. The range [lo, hi] is cut into `buckets` equal-width buckets; a value goes into bucket int((v - lo) / width) where width = (hi - lo) / buckets, and the maximum value goes into the last bucket.
        If all values are equal (hi == lo) they all go into bucket 0. ValueError('no values') for an empty list, ValueError('need a bucket') if buckets < 1."""
        if not values:
            raise ValueError("no values")
        if buckets < 1:
            raise ValueError("need a bucket")
        lo, hi = min(values), max(values)
        counts = [0] * buckets
        width = (hi - lo) / buckets
        for v in values:
            i = 0 if hi == lo else min(int((v - lo) / width), buckets - 1)
            counts[i] += 1
        return {"lo": lo, "hi": hi, "counts": counts, "total": len(values)}


    def hist_less_than(h, value):
        """The ESTIMATED number of values < value. 0 if value <= lo; the total if value > hi. Otherwise let pos = (value - lo) / width, i = min(int(pos), buckets - 1): add the counts of all buckets before bucket i, plus counts[i] * (pos - i) (assume values are spread evenly inside a bucket).
        If hi == lo the answer is 0 when value <= lo, else the total. Round to 2 decimals."""
        if value <= h["lo"]:
            return 0.0
        if value > h["hi"]:
            return float(h["total"])
        if h["hi"] == h["lo"]:
            return float(h["total"])
        n = len(h["counts"])
        width = (h["hi"] - h["lo"]) / n
        pos = (value - h["lo"]) / width
        i = min(int(pos), n - 1)
        return round(sum(h["counts"][:i]) + h["counts"][i] * (pos - i), 2)


    def hist_between(h, a, b):
        """The estimated number of values with a <= value < b, which is hist_less_than(b) minus hist_less_than(a), never below 0, rounded to 2 decimals."""
        return round(max(0.0, hist_less_than(h, b) - hist_less_than(h, a)), 2)

    import random
    rng = random.Random(2)
    ages = [int(rng.expovariate(1 / 12)) + 18 for _ in range(2000)]
    rows = [{"age": a} for a in ages]
    stats = table_stats(rows)
    actual = sum(1 for a in ages if a < 30)
    print("rows:", stats["rows"], "age range:", stats["cols"]["age"]["min"], "to", stats["cols"]["age"]["max"])
    print("people under 30 -> actual:", actual, "uniform guess:", estimate_rows(stats, [("age", "<", 30)]), "histogram guess:", round(hist_less_than(equi_width_histogram(ages, 20), 30)))
    print("fetch 40 matching rows (50 pages of data):", choose_access(50, 100, 3, 40, False))
    print("fetch 4000 matching rows through an unclustered index:", choose_access(50, 100, 3, 4000, False))
    print("join 100 and 1000 pages with 20 buffer pages:", block_nested_cost(100, 1000, 20), "block loop vs", hash_join_cost(100, 1000), "hash")
  output: |
    rows: 2000 age range: 18 to 115
    people under 30 -> actual: 1262 uniform guess: 247 histogram guess: 1276
    fetch 40 matching rows (50 pages of data): ('index scan', 43)
    fetch 4000 matching rows through an unclustered index: ('seq scan', 50)
    join 100 and 1000 pages with 20 buffer pages: 6100 block loop vs 3300 hash
