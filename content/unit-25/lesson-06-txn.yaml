exercises:
- id: sched
  title: Schedules and serializability
  difficulty: 5
  prompt: 'A database runs many **transactions** at once, interleaving their steps, and the result must be the same as if they had run one at a time (**serializability**). A **schedule** is a list of `(transaction, operation, item)` steps in the order they ran, with operation `''R''` (read) or `''W''` (write), for example `[(''T1'', ''R'', ''x''), (''T2'', ''W'', ''x'')]`. Two steps **conflict** if they belong to different transactions, touch the same item and at least one is a write. Write `conflict_edges(schedule)`: the **set** of pairs `(a, b)` meaning *a has a conflicting step before a step of b* (`ValueError("bad operation OP")` if an operation is not `''R''` or `''W''`). Write `serial_order(schedule)`: if the schedule is **conflict-serializable** return an equivalent serial order of its transactions: a topological order of the graph formed by those edges, always taking the **smallest** transaction name that is ready first; return `None` if the graph has a **cycle**. Write `is_conflict_serializable(schedule)` and `is_serial(schedule)` (each transaction''s steps form one unbroken block).'
  starter: |-
    def conflict_edges(schedule):
        """A SCHEDULE is a list of (transaction, operation, item) steps in the order they ran, with operation 'R' (read) or 'W' (write), for example [('T1', 'R', 'x'), ('T2', 'W', 'x')]. Two steps CONFLICT if they belong to different transactions, touch the same item and at least one is a write.
        Return the SET of pairs (a, b) meaning 'a had a conflicting step BEFORE a step of b'. ValueError('bad operation OP') if an operation is not 'R' or 'W'."""
        pass


    def serial_order(schedule):
        """If the schedule is CONFLICT-SERIALIZABLE return an equivalent serial order of its transactions: a topological order of the graph whose edges are conflict_edges, always taking the smallest transaction name that is ready first. Return None if the graph has a cycle (no equivalent serial order exists)."""
        pass


    def is_conflict_serializable(schedule):
        """True if the schedule is equivalent to some serial schedule (its precedence graph has no cycle)."""
        pass


    def is_serial(schedule):
        """True if the transactions run one after another with no interleaving: each transaction's steps form ONE unbroken block."""
        pass
  tests:
  - name: conflicts
    code: |
      s = [("T1", "R", "x"), ("T2", "W", "x"), ("T1", "W", "y"), ("T3", "R", "y"), ("T3", "R", "x")]
      assert conflict_edges(s) == {("T1", "T2"), ("T1", "T3"), ("T2", "T3")}
      assert conflict_edges([("T1", "R", "x"), ("T2", "R", "x")]) == set()
      assert conflict_edges([("T1", "W", "x"), ("T1", "W", "x")]) == set() and conflict_edges([]) == set()
      assert conflict_edges([("T1", "R", "x"), ("T2", "W", "x"), ("T1", "R", "x")]) == {("T1", "T2"), ("T2", "T1")}
      try:
          conflict_edges([("T1", "X", "x")])
          raise AssertionError("accepted")
      except ValueError as e:
          assert "bad operation X" in str(e)
  - name: serial orders
    code: |
      s = [("T1", "R", "x"), ("T2", "W", "x"), ("T1", "W", "y"), ("T3", "R", "y"), ("T3", "R", "x")]
      assert serial_order(s) == ["T1", "T2", "T3"] and is_conflict_serializable(s)
      s2 = [("T2", "W", "x"), ("T1", "W", "y"), ("T3", "R", "z")]
      assert serial_order(s2) == ["T1", "T2", "T3"]
      s3 = [("T2", "W", "x"), ("T1", "W", "x")]
      assert serial_order(s3) == ["T2", "T1"]
      assert serial_order([]) == []
  - name: cycles
    code: |
      lost = [("T1", "R", "x"), ("T2", "R", "x"), ("T1", "W", "x"), ("T2", "W", "x")]
      assert serial_order(lost) is None and not is_conflict_serializable(lost)
      dirty = [("T1", "W", "x"), ("T2", "R", "x"), ("T2", "W", "y"), ("T1", "R", "y")]
      assert is_conflict_serializable(dirty) is False
      tri = [("T1", "W", "a"), ("T2", "W", "a"), ("T2", "W", "b"), ("T3", "W", "b"), ("T3", "W", "c"), ("T1", "W", "c")]
      assert serial_order(tri) == ["T1", "T2", "T3"] or serial_order(tri) is None
      assert is_conflict_serializable([("T1", "R", "x"), ("T2", "W", "x"), ("T1", "R", "y")]) is True
  - name: serial schedules
    code: |
      assert is_serial([("T1", "R", "x"), ("T1", "W", "x"), ("T2", "R", "x")]) is True
      assert is_serial([("T1", "R", "x"), ("T2", "W", "x"), ("T1", "W", "x")]) is False
      assert is_serial([]) is True and is_serial([("T1", "R", "x")]) is True
      assert is_serial([("T1", "R", "x"), ("T2", "R", "x"), ("T3", "R", "x")]) is True
  hints:
  - For serial_order repeatedly choose the smallest transaction with no unprocessed predecessor.
  solution: |
    def conflict_edges(schedule):
        """A SCHEDULE is a list of (transaction, operation, item) steps in the order they ran, with operation 'R' (read) or 'W' (write), for example [('T1', 'R', 'x'), ('T2', 'W', 'x')]. Two steps CONFLICT if they belong to different transactions, touch the same item and at least one is a write.
        Return the SET of pairs (a, b) meaning 'a had a conflicting step BEFORE a step of b'. ValueError('bad operation OP') if an operation is not 'R' or 'W'."""
        for t, op, x in schedule:
            if op not in ("R", "W"):
                raise ValueError("bad operation " + str(op))
        edges = set()
        for i, (t1, op1, x1) in enumerate(schedule):
            for t2, op2, x2 in schedule[i + 1:]:
                if t1 != t2 and x1 == x2 and "W" in (op1, op2):
                    edges.add((t1, t2))
        return edges


    def serial_order(schedule):
        """If the schedule is CONFLICT-SERIALIZABLE return an equivalent serial order of its transactions: a topological order of the graph whose edges are conflict_edges, always taking the smallest transaction name that is ready first. Return None if the graph has a cycle (no equivalent serial order exists)."""
        edges = conflict_edges(schedule)
        nodes = sorted({t for t, op, x in schedule})
        incoming = {n: set() for n in nodes}
        for a, b in edges:
            incoming[b].add(a)
        order = []
        remaining = set(nodes)
        while remaining:
            ready = sorted(n for n in remaining if not (incoming[n] & remaining))
            if not ready:
                return None
            order.append(ready[0])
            remaining.discard(ready[0])
        return order


    def is_conflict_serializable(schedule):
        """True if the schedule is equivalent to some serial schedule (its precedence graph has no cycle)."""
        return serial_order(schedule) is not None


    def is_serial(schedule):
        """True if the transactions run one after another with no interleaving: each transaction's steps form ONE unbroken block."""
        seen = set()
        last = None
        for t, op, x in schedule:
            if t != last:
                if t in seen:
                    return False
                seen.add(t)
                last = t
        return True
  explanation: Serializability is the gold standard for correctness; the other lessons' techniques are ways to guarantee it.
- id: locks
  title: Locks
  difficulty: 4
  prompt: 'The most common way to get serializability is **locking**. A **shared lock** (`''S''`) lets a transaction read and may be held by several transactions at once; an **exclusive lock** (`''X''`) lets one transaction write and excludes everyone else. With **strict two-phase locking** a transaction keeps all its locks until it commits, which prevents the anomalies of interleaving. Write `new_lock_table()` returning `{"items": {}}`; each locked item maps to `{"mode": ''S'' or ''X'', "holders": set of transactions}`. Write `acquire(table, txn, item, mode)` (`ValueError("bad mode")` for another mode) returning `''granted''` or `''blocked''`, changing nothing when blocked (there are no queues). Rules: an unlocked item is granted; a transaction that already holds a lock that is **strong enough** (it holds `X`, or it holds `S` and asks for `S`) is granted; several transactions may hold `S` together; a holder of `S` asking for `X` is **upgraded** (the mode becomes `''X''`, granted) only if it is the **only** holder, otherwise blocked; every other request is blocked. Write `locks_held(table, txn)`: the sorted list of `(item, mode)` the transaction holds. Write `release_all(table, txn)`: release every lock of the transaction, remove items nobody holds any more, and return the sorted list of items it had locked.'
  starter: |-
    def new_lock_table():
        """An empty LOCK TABLE: {"items": {}}. Each locked item maps to {"mode": 'S' or 'X', "holders": set of transactions}."""
        pass


    def acquire(table, txn, item, mode):
        """Ask for a SHARED ('S', for reading) or EXCLUSIVE ('X', for writing) lock; ValueError('bad mode') for another mode. Return 'granted' or 'blocked' (nothing is changed when blocked; there are no queues). Rules: an unlocked item is granted. A transaction that already holds the item with a lock that is strong enough
        (it holds X, or it holds S and asks for S) is granted. Several transactions may hold S together. A holder of S asking for X is UPGRADED (mode becomes 'X', granted) only if it is the ONLY holder, otherwise blocked. Every other request is blocked."""
        pass


    def locks_held(table, txn):
        """The sorted list of (item, mode) for every lock the transaction holds."""
        pass


    def release_all(table, txn):
        """Release every lock held by the transaction (as at COMMIT in STRICT TWO-PHASE LOCKING). Remove items nobody holds any more. Return the sorted list of items it had locked."""
        pass
  tests:
  - name: compatibility
    code: |
      t = new_lock_table()
      assert t == {"items": {}}
      assert acquire(t, "T1", "x", "S") == "granted" and acquire(t, "T2", "x", "S") == "granted"
      assert acquire(t, "T3", "x", "X") == "blocked"
      assert t["items"]["x"] == {"mode": "S", "holders": {"T1", "T2"}}
      assert acquire(t, "T1", "y", "X") == "granted"
      assert acquire(t, "T2", "y", "S") == "blocked" and acquire(t, "T2", "y", "X") == "blocked"
      assert t["items"]["y"]["holders"] == {"T1"}
      try:
          acquire(t, "T1", "z", "U")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "bad mode" in str(e)
  - name: re-requests and upgrades
    code: |
      t = new_lock_table()
      assert acquire(t, "T1", "x", "X") == "granted" and acquire(t, "T1", "x", "S") == "granted" and acquire(t, "T1", "x", "X") == "granted"
      assert t["items"]["x"]["mode"] == "X"
      assert acquire(t, "T1", "y", "S") == "granted" and acquire(t, "T1", "y", "S") == "granted"
      assert acquire(t, "T1", "y", "X") == "granted" and t["items"]["y"]["mode"] == "X"
      assert acquire(t, "T1", "z", "S") == "granted" and acquire(t, "T2", "z", "S") == "granted"
      assert acquire(t, "T1", "z", "X") == "blocked" and t["items"]["z"]["mode"] == "S"
  - name: holdings and release
    code: |
      t = new_lock_table()
      for item, mode in (("b", "S"), ("a", "X"), ("c", "S")):
          acquire(t, "T1", item, mode)
      acquire(t, "T2", "c", "S")
      assert locks_held(t, "T1") == [("a", "X"), ("b", "S"), ("c", "S")] and locks_held(t, "T2") == [("c", "S")] and locks_held(t, "T3") == []
      assert release_all(t, "T1") == ["a", "b", "c"]
      assert "a" not in t["items"] and "b" not in t["items"] and t["items"]["c"]["holders"] == {"T2"}
      assert release_all(t, "T1") == []
      assert acquire(t, "T3", "a", "X") == "granted"
      assert acquire(t, "T3", "c", "X") == "blocked"
      release_all(t, "T2")
      assert acquire(t, "T3", "c", "X") == "granted"
  hints:
  - 'Check the cases in order: unlocked, already held, shared with shared, upgrade, everything else blocked.'
  solution: |
    def new_lock_table():
        """An empty LOCK TABLE: {"items": {}}. Each locked item maps to {"mode": 'S' or 'X', "holders": set of transactions}."""
        return {"items": {}}


    def acquire(table, txn, item, mode):
        """Ask for a SHARED ('S', for reading) or EXCLUSIVE ('X', for writing) lock; ValueError('bad mode') for another mode. Return 'granted' or 'blocked' (nothing is changed when blocked; there are no queues). Rules: an unlocked item is granted. A transaction that already holds the item with a lock that is strong enough
        (it holds X, or it holds S and asks for S) is granted. Several transactions may hold S together. A holder of S asking for X is UPGRADED (mode becomes 'X', granted) only if it is the ONLY holder, otherwise blocked. Every other request is blocked."""
        if mode not in ("S", "X"):
            raise ValueError("bad mode")
        entry = table["items"].get(item)
        if entry is None:
            table["items"][item] = {"mode": mode, "holders": {txn}}
            return "granted"
        holders = entry["holders"]
        if txn in holders:
            if entry["mode"] == "X" or mode == "S":
                return "granted"
            if holders == {txn}:
                entry["mode"] = "X"
                return "granted"
            return "blocked"
        if mode == "S" and entry["mode"] == "S":
            holders.add(txn)
            return "granted"
        return "blocked"


    def locks_held(table, txn):
        """The sorted list of (item, mode) for every lock the transaction holds."""
        return sorted((item, e["mode"]) for item, e in table["items"].items() if txn in e["holders"])


    def release_all(table, txn):
        """Release every lock held by the transaction (as at COMMIT in STRICT TWO-PHASE LOCKING). Remove items nobody holds any more. Return the sorted list of items it had locked."""
        freed = []
        for item in list(table["items"]):
            e = table["items"][item]
            if txn in e["holders"]:
                freed.append(item)
                e["holders"].discard(txn)
                if not e["holders"]:
                    del table["items"][item]
        return sorted(freed)
  explanation: Locks give correctness at the price of waiting, and waiting can lead to deadlock.
- id: deadlock
  title: Deadlocks
  difficulty: 5
  prompt: 'If T1 waits for a lock held by T2 while T2 waits for a lock held by T1, neither can ever continue: a **deadlock**. Databases keep a **wait-for graph**: `waits` maps each transaction to the collection of transactions it is **waiting for**; a deadlock is a **cycle**. Write `find_deadlock(waits)`: search with **depth-first search**, trying transactions in sorted order and, for each, the transactions it waits for in sorted order; return the first cycle found as a list in waiting order (each waits for the next, the last waits for the first), **rotated so the smallest transaction comes first**; `None` if there is no cycle. Write `choose_victim(cycle, start_times)`: the transaction to **abort**, the **youngest** (largest start time; on a tie the larger name). Write `resolve(waits, start_times)`: while a deadlock exists, choose a victim, record it, and remove it from the graph (as a waiter and from everybody''s wait sets); do not change the input; return the list of victims in order. Write the two **prevention** rules by timestamp (smaller means older): `wait_die(requester_ts, holder_ts)` returns `''wait''` if the requester is older, else `''die''`; `wound_wait(requester_ts, holder_ts)` returns `''wound''` if the requester is older, else `''wait''`.'
  starter: |-
    def find_deadlock(waits):
        """`waits` maps each transaction to the collection of transactions it is WAITING FOR (the WAIT-FOR GRAPH). A DEADLOCK is a cycle. Search with depth-first search, trying transactions in sorted order and the transactions each waits for in sorted order; return the first cycle found as a list of transactions in
        waiting order (each waits for the next, the last waits for the first), ROTATED so the smallest transaction comes first. Return None if there is no cycle."""
        pass


    def choose_victim(cycle, start_times):
        """Pick the transaction of the cycle to ABORT: the YOUNGEST, that is the one with the largest start time (start_times maps transaction to its start time); on a tie take the larger transaction name."""
        pass


    def resolve(waits, start_times):
        """Break all deadlocks: while find_deadlock finds a cycle, choose a victim, record it, and remove it from the graph (as a waiter and from everybody's wait sets). Do not change the input. Return the list of victims in the order chosen."""
        pass


    def wait_die(requester_ts, holder_ts):
        """DEADLOCK PREVENTION, WAIT-DIE: a transaction asking for a lock held by another may WAIT only if it is OLDER (smaller timestamp); a younger one DIES (is aborted). Return 'wait' or 'die'."""
        pass


    def wound_wait(requester_ts, holder_ts):
        """WOUND-WAIT: an OLDER requester WOUNDS (aborts) the younger holder and takes the lock; a younger requester WAITS. Return 'wound' or 'wait'."""
        pass
  tests:
  - name: finding cycles
    code: |
      assert find_deadlock({}) is None and find_deadlock({"T1": []}) is None
      assert find_deadlock({"T1": ["T2"], "T2": ["T1"]}) == ["T1", "T2"]
      assert find_deadlock({"T2": {"T3"}, "T3": {"T1"}, "T1": {"T2"}}) == ["T1", "T2", "T3"]
      assert find_deadlock({"T1": ["T2"], "T2": ["T3"], "T3": []}) is None
      assert find_deadlock({"T1": ["T2"], "T2": ["T3"], "T3": ["T2"]}) == ["T2", "T3"]
      assert find_deadlock({"T1": ["T1"]}) == ["T1"]
      assert find_deadlock({"A": ["B", "C"], "B": [], "C": ["A"]}) == ["A", "C"]
  - name: victims
    code: |
      cyc = ["T1", "T2", "T3"]
      assert choose_victim(cyc, {"T1": 5, "T2": 9, "T3": 7}) == "T2"
      assert choose_victim(cyc, {"T1": 5, "T2": 5, "T3": 5}) == "T3"
      assert choose_victim(["T4"], {"T4": 1}) == "T4"
  - name: breaking deadlocks
    code: |
      waits = {"T1": {"T2"}, "T2": {"T1"}, "T3": {"T4"}, "T4": {"T5"}, "T5": {"T3"}, "T6": {"T1"}}
      start = {"T1": 1, "T2": 2, "T3": 3, "T4": 9, "T5": 4, "T6": 6}
      victims = resolve(waits, start)
      assert victims == ["T2", "T4"]
      assert waits["T1"] == {"T2"}
      assert resolve({"T1": ["T2"], "T2": []}, {"T1": 1, "T2": 2}) == []
      assert resolve({}, {}) == []
      assert resolve({"A": ["B"], "B": ["A"]}, {"A": 2, "B": 1}) == ["A"]
  - name: prevention rules
    code: |
      assert wait_die(1, 5) == "wait" and wait_die(5, 1) == "die" and wait_die(3, 3) == "die"
      assert wound_wait(1, 5) == "wound" and wound_wait(5, 1) == "wait" and wound_wait(3, 3) == "wait"
  hints:
  - 'Depth-first search: keep the current path; reaching a node that is already on the path means you found a cycle.'
  solution: |
    def find_deadlock(waits):
        """`waits` maps each transaction to the collection of transactions it is WAITING FOR (the WAIT-FOR GRAPH). A DEADLOCK is a cycle. Search with depth-first search, trying transactions in sorted order and the transactions each waits for in sorted order; return the first cycle found as a list of transactions in
        waiting order (each waits for the next, the last waits for the first), ROTATED so the smallest transaction comes first. Return None if there is no cycle."""
        color = {}
        path = []

        def visit(t):
            color[t] = 1
            path.append(t)
            for u in sorted(waits.get(t, ())):
                if color.get(u) == 1:
                    cycle = path[path.index(u):]
                    k = cycle.index(min(cycle))
                    return cycle[k:] + cycle[:k]
                if color.get(u) is None:
                    found = visit(u)
                    if found:
                        return found
            path.pop()
            color[t] = 2
            return None

        for t in sorted(waits):
            if color.get(t) is None:
                found = visit(t)
                if found:
                    return found
        return None


    def choose_victim(cycle, start_times):
        """Pick the transaction of the cycle to ABORT: the YOUNGEST, that is the one with the largest start time (start_times maps transaction to its start time); on a tie take the larger transaction name."""
        return max(cycle, key=lambda t: (start_times[t], t))


    def resolve(waits, start_times):
        """Break all deadlocks: while find_deadlock finds a cycle, choose a victim, record it, and remove it from the graph (as a waiter and from everybody's wait sets). Do not change the input. Return the list of victims in the order chosen."""
        graph = {t: set(ws) for t, ws in waits.items()}
        victims = []
        while True:
            cycle = find_deadlock(graph)
            if cycle is None:
                return victims
            v = choose_victim(cycle, start_times)
            victims.append(v)
            graph.pop(v, None)
            for t in graph:
                graph[t].discard(v)


    def wait_die(requester_ts, holder_ts):
        """DEADLOCK PREVENTION, WAIT-DIE: a transaction asking for a lock held by another may WAIT only if it is OLDER (smaller timestamp); a younger one DIES (is aborted). Return 'wait' or 'die'."""
        return "wait" if requester_ts < holder_ts else "die"


    def wound_wait(requester_ts, holder_ts):
        """WOUND-WAIT: an OLDER requester WOUNDS (aborts) the younger holder and takes the lock; a younger requester WAITS. Return 'wound' or 'wait'."""
        return "wound" if requester_ts < holder_ts else "wait"
  explanation: Databases either detect deadlocks and abort a victim, or prevent them with timestamp rules.
- id: mvcc
  title: Snapshots and MVCC
  difficulty: 5
  prompt: 'Locks make readers wait for writers. **Multi-version concurrency control (MVCC)** avoids that by keeping **several versions** of every value, so a reader just looks at an older one. Under **snapshot isolation** each transaction sees the database as it was when it started. Write `new_store()` returning `{"versions": {}, "clock": 0, "txns": {}, "next_id": 1}` (`versions` maps a key to a list of `(commit_time, value)` in commit order). Write `begin(store)`: its id is `next_id` (then add 1) and it remembers a **snapshot** of the clock: `store["txns"][id] = {"snapshot": clock, "writes": {}, "state": "active"}`; return the id. Write `read(store, tid, key)`: the transaction''s own buffered write if it made one, otherwise the value of the **newest version committed at a time `<=` its snapshot**, or `None`. Write `write(store, tid, key, value)`: buffer the write in the transaction. All three raise `ValueError("transaction not active")` for an unknown, committed or aborted transaction (the helper `_active` is yours to write too if you wish). Write `commit(store, tid)` with **first-committer-wins**: if any key it wrote has a version committed **after** its snapshot, set its state to `''aborted''` and return `False`; otherwise, if it wrote anything, add 1 to the clock and append `(clock, value)` for each written key, set the state to `''committed''` and return `True` (a transaction with no writes commits without changing the clock). Write `abort(store, tid)`: state `''aborted''`, buffered writes discarded.'
  starter: |-
    def new_store():
        """A MULTI-VERSION store: {"versions": {}, "clock": 0, "txns": {}, "next_id": 1}. versions maps a key to a list of (commit_time, value) in commit order."""
        pass


    def begin(store):
        """Start a transaction: its id is next_id (then add 1) and it remembers a SNAPSHOT of the current clock: store["txns"][id] = {"snapshot": clock, "writes": {}, "state": "active"}. Return the id."""
        pass


    def _active(store, tid):
        pass


    def read(store, tid, key):
        """What the transaction sees for a key: its own buffered write if it made one; otherwise the value of the NEWEST version committed at a time <= its snapshot; None if there is none. ValueError('transaction not active') for an unknown, committed or aborted transaction."""
        pass


    def write(store, tid, key, value):
        """Buffer a write in the transaction (nothing is visible to others until commit). Same error as read for an inactive transaction."""
        pass


    def commit(store, tid):
        """SNAPSHOT ISOLATION with FIRST-COMMITTER-WINS. If any key the transaction wrote has a version committed AFTER its snapshot (a concurrent transaction got there first), set its state to 'aborted' and return False. Otherwise, if it wrote anything, add 1 to the clock and append (clock, value) for each written key,
        set the state to 'committed' and return True. (A transaction with no writes commits without changing the clock.) ValueError('transaction not active') if it is not active."""
        pass


    def abort(store, tid):
        """Abort an active transaction: state 'aborted', its buffered writes are discarded."""
        pass
  tests:
  - name: snapshots
    code: |
      s = new_store()
      t1 = begin(s)
      write(s, t1, "x", 10)
      assert read(s, t1, "x") == 10
      t2 = begin(s)
      assert read(s, t2, "x") is None
      assert commit(s, t1) is True and s["clock"] == 1 and s["versions"]["x"] == [(1, 10)]
      assert read(s, t2, "x") is None
      t3 = begin(s)
      assert read(s, t3, "x") == 10 and t3 == 3
      assert s["txns"][t3] == {"snapshot": 1, "writes": {}, "state": "active"}
      assert commit(s, t2) is True and s["clock"] == 1
  - name: readers do not block
    code: |
      s = new_store()
      t = begin(s); write(s, t, "a", 1); commit(s, t)
      reader = begin(s)
      w = begin(s); write(s, w, "a", 2); assert commit(s, w) is True
      assert read(s, reader, "a") == 1
      fresh = begin(s)
      assert read(s, fresh, "a") == 2
      assert s["versions"]["a"] == [(1, 1), (2, 2)]
      assert commit(s, reader) is True
  - name: first committer wins
    code: |
      s = new_store()
      t = begin(s); write(s, t, "bal", 100); commit(s, t)
      a, b = begin(s), begin(s)
      write(s, a, "bal", read(s, a, "bal") + 10)
      write(s, b, "bal", read(s, b, "bal") + 20)
      assert commit(s, a) is True
      assert commit(s, b) is False and s["txns"][b]["state"] == "aborted"
      assert s["versions"]["bal"] == [(1, 100), (2, 110)]
      try:
          read(s, b, "bal")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "transaction not active" in str(e)
      c = begin(s); write(s, c, "bal", 5)
      abort(s, c)
      assert s["txns"][c]["state"] == "aborted" and s["versions"]["bal"][-1] == (2, 110)
      try:
          commit(s, c)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "not active" in str(e)
  - name: write skew is allowed
    code: |
      s = new_store()
      t = begin(s); write(s, t, "alice", "on-call"); write(s, t, "bob", "on-call"); commit(s, t)
      a, b = begin(s), begin(s)
      assert read(s, a, "alice") == "on-call" and read(s, a, "bob") == "on-call"
      assert read(s, b, "alice") == "on-call" and read(s, b, "bob") == "on-call"
      write(s, a, "alice", "off")
      write(s, b, "bob", "off")
      assert commit(s, a) is True and commit(s, b) is True
      check = begin(s)
      assert read(s, check, "alice") == "off" and read(s, check, "bob") == "off"
      try:
          write(s, 99, "x", 1)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "not active" in str(e)
  hints:
  - Find the newest version with commit time <= snapshot by scanning the list; versions are stored in commit order.
  solution: |
    def new_store():
        """A MULTI-VERSION store: {"versions": {}, "clock": 0, "txns": {}, "next_id": 1}. versions maps a key to a list of (commit_time, value) in commit order."""
        return {"versions": {}, "clock": 0, "txns": {}, "next_id": 1}


    def begin(store):
        """Start a transaction: its id is next_id (then add 1) and it remembers a SNAPSHOT of the current clock: store["txns"][id] = {"snapshot": clock, "writes": {}, "state": "active"}. Return the id."""
        tid = store["next_id"]
        store["next_id"] += 1
        store["txns"][tid] = {"snapshot": store["clock"], "writes": {}, "state": "active"}
        return tid


    def _active(store, tid):
        t = store["txns"].get(tid)
        if t is None or t["state"] != "active":
            raise ValueError("transaction not active")
        return t


    def read(store, tid, key):
        """What the transaction sees for a key: its own buffered write if it made one; otherwise the value of the NEWEST version committed at a time <= its snapshot; None if there is none. ValueError('transaction not active') for an unknown, committed or aborted transaction."""
        t = _active(store, tid)
        if key in t["writes"]:
            return t["writes"][key]
        value = None
        for ts, v in store["versions"].get(key, []):
            if ts <= t["snapshot"]:
                value = v
        return value


    def write(store, tid, key, value):
        """Buffer a write in the transaction (nothing is visible to others until commit). Same error as read for an inactive transaction."""
        _active(store, tid)["writes"][key] = value


    def commit(store, tid):
        """SNAPSHOT ISOLATION with FIRST-COMMITTER-WINS. If any key the transaction wrote has a version committed AFTER its snapshot (a concurrent transaction got there first), set its state to 'aborted' and return False. Otherwise, if it wrote anything, add 1 to the clock and append (clock, value) for each written key,
        set the state to 'committed' and return True. (A transaction with no writes commits without changing the clock.) ValueError('transaction not active') if it is not active."""
        t = _active(store, tid)
        for key in t["writes"]:
            versions = store["versions"].get(key, [])
            if versions and versions[-1][0] > t["snapshot"]:
                t["state"] = "aborted"
                return False
        if t["writes"]:
            store["clock"] += 1
            for key, value in t["writes"].items():
                store["versions"].setdefault(key, []).append((store["clock"], value))
        t["state"] = "committed"
        return True


    def abort(store, tid):
        """Abort an active transaction: state 'aborted', its buffered writes are discarded."""
        t = _active(store, tid)
        t["state"] = "aborted"
        t["writes"] = {}
  explanation: Snapshot isolation lets reads proceed without locks, which is why PostgreSQL, Oracle and many others use MVCC.
- id: undo
  title: 'Capstone: rollback with an undo log'
  difficulty: 5
  prompt: 'Real databases must be able to **roll back** a transaction. A simple method is the **undo log**: before changing a value, remember its old value. Write `new_db()` returning `{"data": {}, "txns": {}, "next_id": 1}`. Write `begin(db)`: the next id (then add 1), with `db["txns"][id] = {"undo": [], "state": "active"}`; return the id. All other functions raise `ValueError("transaction not active")` for an unknown, committed or aborted transaction. Write `get(db, tid, key)`: the current value, or `None`; it sees every change, even **uncommitted** ones by other transactions (a **dirty read**; there is no isolation here). Write `put(db, tid, key, value)`: **first** append to the transaction''s undo log the tuple `(key, existed, old_value)` (`existed` says whether the key was present), then set the key in place. Write `delete(db, tid, key)`: remove the key, logging the same way, and return `True` if it existed; if it did not, return `False` and log nothing. Write `savepoint(db, tid)`: the current length of the undo log. Write `rollback_to(db, tid, mark)`: take the undo entries beyond position `mark` in **reverse** order, restore each key (put the old value back, or delete the key if it did not exist) and cut the log back to `mark`; the transaction stays active. Write `commit(db, tid)` (state `''committed''`, undo log emptied) and `abort(db, tid)`: roll back completely and set the state to `''aborted''`.'
