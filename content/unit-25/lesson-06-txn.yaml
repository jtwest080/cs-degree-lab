- type: code
  question: Write `has_cycle(edges)` for a list of directed edges `(a, b)` returning True if the graph has a cycle. Use any method.
  starter: |
    def has_cycle(edges):
        pass
  tests:
  - name: cycle
    code: |
      assert has_cycle([("a", "b"), ("b", "c"), ("c", "a")]) is True and has_cycle([("a", "b"), ("b", "c")]) is False and has_cycle([]) is False and has_cycle([("x", "x")]) is True and has_cycle([("a", "b"), ("a", "c"), ("b", "d"), ("c", "d")]) is False
  solution: |
    def has_cycle(edges):
        graph = {}
        for a, b in edges:
            graph.setdefault(a, []).append(b)
            graph.setdefault(b, [])
        state = {}
        def visit(n):
            state[n] = 1
            for m in graph[n]:
                if state.get(m) == 1:
                    return True
                if m not in state and visit(m):
                    return True
            state[n] = 2
            return False
        return any(n not in state and visit(n) for n in graph)
