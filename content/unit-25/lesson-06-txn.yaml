  - Always log first, then change; rolling back replays the log backwards.
  solution: |
    def new_db():
        """A database that updates IN PLACE and keeps an UNDO LOG so a transaction can be rolled back: {"data": {}, "txns": {}, "next_id": 1}."""
        return {"data": {}, "txns": {}, "next_id": 1}


    def begin(db):
        """Start a transaction with the next id (then add 1): db["txns"][id] = {"undo": [], "state": "active"}. Return the id."""
        tid = db["next_id"]
        db["next_id"] += 1
        db["txns"][tid] = {"undo": [], "state": "active"}
        return tid


    def _active(db, tid):
        t = db["txns"].get(tid)
        if t is None or t["state"] != "active":
            raise ValueError("transaction not active")
        return t


    def get(db, tid, key):
        """The current value of a key (None if absent). It sees every change, even uncommitted ones by other transactions (a DIRTY READ: there is no isolation here). ValueError('transaction not active') if the transaction is not active."""
        _active(db, tid)
        return db["data"].get(key)


    def put(db, tid, key, value):
        """Set a key in place, but FIRST append to the transaction's undo log the tuple (key, existed, old_value), where existed says whether the key was present. ValueError('transaction not active') if not active."""
        t = _active(db, tid)
        t["undo"].append((key, key in db["data"], db["data"].get(key)))
        db["data"][key] = value


    def delete(db, tid, key):
        """Remove a key, logging undo information like put. Return True if the key existed, False otherwise (nothing is logged then)."""
        t = _active(db, tid)
        if key not in db["data"]:
            return False
        t["undo"].append((key, True, db["data"][key]))
        del db["data"][key]
        return True


    def savepoint(db, tid):
        """A SAVEPOINT: the current length of the transaction's undo log."""
        return len(_active(db, tid)["undo"])


    def rollback_to(db, tid, mark):
        """Undo the changes made after a savepoint: take the undo entries beyond position `mark` in REVERSE order, restore each key (put the old value back, or delete the key if it did not exist), and cut the log back to `mark`. The transaction stays active."""
        t = _active(db, tid)
        while len(t["undo"]) > mark:
            key, existed, old = t["undo"].pop()
            if existed:
                db["data"][key] = old
            else:
                db["data"].pop(key, None)


    def commit(db, tid):
        """Make the transaction permanent: state 'committed' and an empty undo log."""
        t = _active(db, tid)
        t["state"] = "committed"
        t["undo"] = []


    def abort(db, tid):
        """Roll the transaction back completely (rollback_to 0) and set its state to 'aborted'."""
        rollback_to(db, tid, 0)
        db["txns"][tid]["state"] = "aborted"
  explanation: Rolling back by replaying an undo log backwards is how a database cancels half-finished work.
commonMistakes:
- title: Releasing locks before commit
  explanation: Others could read data that is later rolled back.
- title: Believing snapshot isolation is fully serializable
  explanation: Write skew can still happen.
- title: Aborting the transaction that has done the most work
  explanation: Pick the cheapest victim, usually the youngest.
- title: Not retrying an aborted transaction
  explanation: Deadlock and conflict aborts are normal; the application must retry.
- title: Rolling back by replaying the undo log forwards
  explanation: Undo entries must be applied in reverse order.
summary:
- Transactions are atomic, consistent, isolated and durable.
- Anomalies include dirty reads, lost updates and phantoms.
- A schedule is conflict-serializable if its precedence graph has no cycle.
- Strict two-phase locking gives serializability by holding locks to commit.
- Deadlocks are cycles in the wait-for graph; abort a victim or use wait-die / wound-wait.
- MVCC gives each transaction a snapshot so readers never block; undo logs roll back.
