  - line: 159
    note: No cycle, so a serial order exists.
  - line: 161
    note: Readers share; a writer is blocked.
  - line: 164
    note: T3 is the youngest, so it becomes the victim.
- title: Snapshots and rollback
  intro: A reader keeps seeing its old snapshot, a second writer loses the race, and a savepoint undoes part of a transaction.
  code: |
    def new_store():
        """A MULTI-VERSION store: {"versions": {}, "clock": 0, "txns": {}, "next_id": 1}. versions maps a key to a list of (commit_time, value) in commit order."""
        return {"versions": {}, "clock": 0, "txns": {}, "next_id": 1}


    def begin(store):
        """Start a transaction: its id is next_id (then add 1) and it remembers a SNAPSHOT of the current clock: store["txns"][id] = {"snapshot": clock, "writes": {}, "state": "active"}. Return the id."""
        tid = store["next_id"]
        store["next_id"] += 1
        store["txns"][tid] = {"snapshot": store["clock"], "writes": {}, "state": "active"}
        return tid


    def _active(store, tid):
        t = store["txns"].get(tid)
        if t is None or t["state"] != "active":
            raise ValueError("transaction not active")
        return t


    def read(store, tid, key):
        """What the transaction sees for a key: its own buffered write if it made one; otherwise the value of the NEWEST version committed at a time <= its snapshot; None if there is none. ValueError('transaction not active') for an unknown, committed or aborted transaction."""
        t = _active(store, tid)
        if key in t["writes"]:
            return t["writes"][key]
        value = None
        for ts, v in store["versions"].get(key, []):
            if ts <= t["snapshot"]:
                value = v
        return value


    def write(store, tid, key, value):
        """Buffer a write in the transaction (nothing is visible to others until commit). Same error as read for an inactive transaction."""
        _active(store, tid)["writes"][key] = value


    def commit(store, tid):
        """SNAPSHOT ISOLATION with FIRST-COMMITTER-WINS. If any key the transaction wrote has a version committed AFTER its snapshot (a concurrent transaction got there first), set its state to 'aborted' and return False. Otherwise, if it wrote anything, add 1 to the clock and append (clock, value) for each written key,
        set the state to 'committed' and return True. (A transaction with no writes commits without changing the clock.) ValueError('transaction not active') if it is not active."""
        t = _active(store, tid)
        for key in t["writes"]:
            versions = store["versions"].get(key, [])
            if versions and versions[-1][0] > t["snapshot"]:
                t["state"] = "aborted"
                return False
        if t["writes"]:
            store["clock"] += 1
            for key, value in t["writes"].items():
                store["versions"].setdefault(key, []).append((store["clock"], value))
        t["state"] = "committed"
        return True


    def abort(store, tid):
        """Abort an active transaction: state 'aborted', its buffered writes are discarded."""
        t = _active(store, tid)
        t["state"] = "aborted"
        t["writes"] = {}


    def new_db():
        """A database that updates IN PLACE and keeps an UNDO LOG so a transaction can be rolled back: {"data": {}, "txns": {}, "next_id": 1}."""
        return {"data": {}, "txns": {}, "next_id": 1}


    def begin_db(db):
        """Start a transaction with the next id (then add 1): db["txns"][id] = {"undo": [], "state": "active"}. Return the id."""
        tid = db["next_id"]
        db["next_id"] += 1
        db["txns"][tid] = {"undo": [], "state": "active"}
        return tid


    def _active_db(db, tid):
        t = db["txns"].get(tid)
        if t is None or t["state"] != "active":
            raise ValueError("transaction not active")
        return t


    def get_db(db, tid, key):
        """The current value of a key (None if absent). It sees every change, even uncommitted ones by other transactions (a DIRTY READ: there is no isolation here). ValueError('transaction not active') if the transaction is not active."""
        _active_db(db, tid)
        return db["data"].get(key)


    def put_db(db, tid, key, value):
        """Set a key in place, but FIRST append to the transaction's undo log the tuple (key, existed, old_value), where existed says whether the key was present. ValueError('transaction not active') if not active."""
        t = _active_db(db, tid)
        t["undo"].append((key, key in db["data"], db["data"].get(key)))
        db["data"][key] = value


    def delete_db(db, tid, key):
        """Remove a key, logging undo information like put. Return True if the key existed, False otherwise (nothing is logged then)."""
        t = _active_db(db, tid)
        if key not in db["data"]:
            return False
        t["undo"].append((key, True, db["data"][key]))
        del db["data"][key]
        return True


    def savepoint_db(db, tid):
        """A SAVEPOINT: the current length of the transaction's undo log."""
        return len(_active_db(db, tid)["undo"])


    def rollback_to_db(db, tid, mark):
        """Undo the changes made after a savepoint: take the undo entries beyond position `mark` in REVERSE order, restore each key (put the old value back, or delete the key if it did not exist), and cut the log back to `mark`. The transaction stays active."""
        t = _active_db(db, tid)
        while len(t["undo"]) > mark:
            key, existed, old = t["undo"].pop()
            if existed:
                db["data"][key] = old
            else:
                db["data"].pop(key, None)


    def commit_db(db, tid):
        """Make the transaction permanent: state 'committed' and an empty undo log."""
        t = _active_db(db, tid)
        t["state"] = "committed"
        t["undo"] = []


    def abort_db(db, tid):
        """Roll the transaction back completely (rollback_to 0) and set its state to 'aborted'."""
        rollback_to_db(db, tid, 0)
        db["txns"][tid]["state"] = "aborted"

    store = new_store()
    setup = begin(store)
    write(store, setup, "balance", 100)
    commit(store, setup)
    reader = begin(store)
    writer = begin(store)
    write(store, writer, "balance", 150)
    print("writer commits:", commit(store, writer))
    print("the old reader still sees:", read(store, reader, "balance"))
    print("a new reader sees:", read(store, begin(store), "balance"))
    a, b = begin(store), begin(store)
    write(store, a, "balance", 1)
    write(store, b, "balance", 2)
    print("two writers on one key, first commits:", commit(store, a), "second commits:", commit(store, b))
    db = new_db()
    t = begin_db(db)
    put_db(db, t, "x", 1)
    mark = savepoint_db(db, t)
    put_db(db, t, "x", 2)
    put_db(db, t, "y", 3)
    rollback_to_db(db, t, mark)
    print("after rollback to the savepoint:", db["data"])
    abort_db(db, t)
    print("after abort:", db["data"])
  output: |
    writer commits: True
    the old reader still sees: 100
    a new reader sees: 150
    two writers on one key, first commits: True second commits: False
    after rollback to the savepoint: {'x': 1}
    after abort: {}
