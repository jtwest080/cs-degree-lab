id: u25-txn
title: Transactions and Concurrency
minutes: 100
objective: Learn how a database lets many users change data at once without corrupting it. You will test schedules for serializability, build a lock manager, detect deadlocks, implement snapshot isolation with versions, and roll back with an undo log.
outcomes:
- State the ACID properties
- Recognise lost updates, dirty reads and other anomalies
- Decide whether a schedule is serializable
- Use shared and exclusive locks
- Detect and prevent deadlocks
- Explain snapshot isolation and MVCC
- Roll back with an undo log
sections:
- heading: Transactions and ACID
  body: |-
    A **transaction** is a group of operations that the database treats as one unit: moving 50 dollars from one account to another means subtracting from one row and adding to another, and the world must never see only half of it. The guarantees are summed up as **ACID**. **Atomicity**: all of the transaction happens or none of it does. **Consistency**: the data always satisfies its rules, such as "the balance is never negative". **Isolation**: transactions running at the same time do not see each other's half-finished work, as if they ran one at a time. **Durability**: once the database says "committed", the change survives a crash (the write-ahead log from the Distributed Systems unit does this).

    Isolation is the hard one. Without it you get **anomalies**. A **dirty read** sees another transaction's change that is later rolled back. A **lost update** happens when two transactions read the same value, both add to it, and the second write erases the first. A **non-repeatable read** sees a value change between two reads in one transaction. A **phantom** is a row that appears between two identical queries. The strongest guarantee, **serializability**, says the outcome must equal some serial execution of the transactions.
- heading: Schedules and locks
  body: |-
    A **schedule** lists the reads and writes of all transactions in the order they happened. Two operations **conflict** when they come from different transactions, touch the same item and at least one writes. If we draw an arrow from transaction A to B whenever A did a conflicting operation first, we get the **precedence graph**. A schedule is **conflict-serializable** exactly when this graph has **no cycle**; a topological order of the graph is an equivalent serial order.

    The classic way to enforce this is **locking**. Before reading an item a transaction takes a **shared lock** (many readers allowed together); before writing, an **exclusive lock** (no one else may hold any lock). If a lock cannot be granted the transaction waits. **Two-phase locking (2PL)** says a transaction may not take any new lock after releasing one; every schedule it produces is serializable. In practice databases use **strict 2PL**, holding all locks until the transaction commits or aborts, so no one sees uncommitted data.
- heading: Deadlocks
  body: |-
    Waiting for locks can go wrong: T1 holds x and wants y while T2 holds y and wants x. Both wait forever, a **deadlock**. A database can **detect** deadlocks by maintaining a **wait-for graph**, with an arrow from each waiting transaction to the one holding the lock it needs. A cycle in the graph is a deadlock. The remedy is to abort one transaction in the cycle, the **victim**, usually the youngest or the one that has done the least work, which releases its locks and lets the others proceed; the application then simply retries it.

    Alternatively a database can **prevent** deadlocks using timestamps. With **wait-die** an older transaction may wait for a younger one, but a younger one that would wait for an older one is aborted ("dies"). With **wound-wait** an older transaction aborts ("wounds") a younger lock holder, while a younger one waits. Either way waits can only go in one direction of age, so cycles are impossible.
- heading: Snapshots, versions and rollback
  body: |-
    Locking makes readers and writers block each other. **Multi-version concurrency control (MVCC)** keeps **several versions** of each row, each stamped with the time its writer committed. A transaction takes a **snapshot** when it starts and reads, for every row, the newest version committed before the snapshot, so it never waits for writers and never sees partial changes. Writers create new versions instead of overwriting. This is **snapshot isolation**, the default in PostgreSQL, Oracle and many others. Two transactions that change the *same* row conflict: with **first-committer-wins** the second one is aborted. Snapshot isolation is not fully serializable: **write skew** can occur when two transactions read overlapping data and write *different* rows, for example two doctors who each see that two are on call and both go off call, leaving no one. Stricter modes (serializable snapshot isolation) detect this.

    Finally, **atomicity** needs **rollback**. A simple technique records an **undo log**: before changing a value, save the old one. To roll back, replay the log backwards. A **savepoint** marks a position in the log so only part of the work is undone.
examples:
- title: Schedules, locks and deadlocks
  intro: A lost update is not serializable, locks say no to a second writer, and a three-way wait is a deadlock.
  code: |
    def conflict_edges(schedule):
        """A SCHEDULE is a list of (transaction, operation, item) steps in the order they ran, with operation 'R' (read) or 'W' (write), for example [('T1', 'R', 'x'), ('T2', 'W', 'x')]. Two steps CONFLICT if they belong to different transactions, touch the same item and at least one is a write.
        Return the SET of pairs (a, b) meaning 'a had a conflicting step BEFORE a step of b'. ValueError('bad operation OP') if an operation is not 'R' or 'W'."""
        for t, op, x in schedule:
            if op not in ("R", "W"):
                raise ValueError("bad operation " + str(op))
        edges = set()
        for i, (t1, op1, x1) in enumerate(schedule):
            for t2, op2, x2 in schedule[i + 1:]:
                if t1 != t2 and x1 == x2 and "W" in (op1, op2):
                    edges.add((t1, t2))
        return edges


    def serial_order(schedule):
        """If the schedule is CONFLICT-SERIALIZABLE return an equivalent serial order of its transactions: a topological order of the graph whose edges are conflict_edges, always taking the smallest transaction name that is ready first. Return None if the graph has a cycle (no equivalent serial order exists)."""
        edges = conflict_edges(schedule)
        nodes = sorted({t for t, op, x in schedule})
        incoming = {n: set() for n in nodes}
        for a, b in edges:
            incoming[b].add(a)
        order = []
        remaining = set(nodes)
        while remaining:
            ready = sorted(n for n in remaining if not (incoming[n] & remaining))
            if not ready:
                return None
            order.append(ready[0])
            remaining.discard(ready[0])
        return order


    def is_conflict_serializable(schedule):
        """True if the schedule is equivalent to some serial schedule (its precedence graph has no cycle)."""
        return serial_order(schedule) is not None


    def is_serial(schedule):
        """True if the transactions run one after another with no interleaving: each transaction's steps form ONE unbroken block."""
        seen = set()
        last = None
        for t, op, x in schedule:
            if t != last:
                if t in seen:
                    return False
                seen.add(t)
                last = t
        return True


    def new_lock_table():
        """An empty LOCK TABLE: {"items": {}}. Each locked item maps to {"mode": 'S' or 'X', "holders": set of transactions}."""
        return {"items": {}}


    def acquire(table, txn, item, mode):
        """Ask for a SHARED ('S', for reading) or EXCLUSIVE ('X', for writing) lock; ValueError('bad mode') for another mode. Return 'granted' or 'blocked' (nothing is changed when blocked; there are no queues). Rules: an unlocked item is granted. A transaction that already holds the item with a lock that is strong enough
        (it holds X, or it holds S and asks for S) is granted. Several transactions may hold S together. A holder of S asking for X is UPGRADED (mode becomes 'X', granted) only if it is the ONLY holder, otherwise blocked. Every other request is blocked."""
        if mode not in ("S", "X"):
            raise ValueError("bad mode")
        entry = table["items"].get(item)
        if entry is None:
            table["items"][item] = {"mode": mode, "holders": {txn}}
            return "granted"
        holders = entry["holders"]
        if txn in holders:
            if entry["mode"] == "X" or mode == "S":
                return "granted"
            if holders == {txn}:
                entry["mode"] = "X"
                return "granted"
            return "blocked"
        if mode == "S" and entry["mode"] == "S":
            holders.add(txn)
            return "granted"
        return "blocked"


    def locks_held(table, txn):
        """The sorted list of (item, mode) for every lock the transaction holds."""
        return sorted((item, e["mode"]) for item, e in table["items"].items() if txn in e["holders"])


    def release_all(table, txn):
        """Release every lock held by the transaction (as at COMMIT in STRICT TWO-PHASE LOCKING). Remove items nobody holds any more. Return the sorted list of items it had locked."""
        freed = []
        for item in list(table["items"]):
            e = table["items"][item]
            if txn in e["holders"]:
                freed.append(item)
                e["holders"].discard(txn)
                if not e["holders"]:
                    del table["items"][item]
        return sorted(freed)


    def find_deadlock(waits):
        """`waits` maps each transaction to the collection of transactions it is WAITING FOR (the WAIT-FOR GRAPH). A DEADLOCK is a cycle. Search with depth-first search, trying transactions in sorted order and the transactions each waits for in sorted order; return the first cycle found as a list of transactions in
        waiting order (each waits for the next, the last waits for the first), ROTATED so the smallest transaction comes first. Return None if there is no cycle."""
        color = {}
        path = []

        def visit(t):
            color[t] = 1
            path.append(t)
            for u in sorted(waits.get(t, ())):
                if color.get(u) == 1:
                    cycle = path[path.index(u):]
                    k = cycle.index(min(cycle))
                    return cycle[k:] + cycle[:k]
                if color.get(u) is None:
                    found = visit(u)
                    if found:
                        return found
            path.pop()
            color[t] = 2
            return None

        for t in sorted(waits):
            if color.get(t) is None:
                found = visit(t)
                if found:
                    return found
        return None


    def choose_victim(cycle, start_times):
        """Pick the transaction of the cycle to ABORT: the YOUNGEST, that is the one with the largest start time (start_times maps transaction to its start time); on a tie take the larger transaction name."""
        return max(cycle, key=lambda t: (start_times[t], t))


    def resolve(waits, start_times):
        """Break all deadlocks: while find_deadlock finds a cycle, choose a victim, record it, and remove it from the graph (as a waiter and from everybody's wait sets). Do not change the input. Return the list of victims in the order chosen."""
        graph = {t: set(ws) for t, ws in waits.items()}
        victims = []
        while True:
            cycle = find_deadlock(graph)
            if cycle is None:
                return victims
            v = choose_victim(cycle, start_times)
            victims.append(v)
            graph.pop(v, None)
            for t in graph:
                graph[t].discard(v)


    def wait_die(requester_ts, holder_ts):
        """DEADLOCK PREVENTION, WAIT-DIE: a transaction asking for a lock held by another may WAIT only if it is OLDER (smaller timestamp); a younger one DIES (is aborted). Return 'wait' or 'die'."""
        return "wait" if requester_ts < holder_ts else "die"


    def wound_wait(requester_ts, holder_ts):
        """WOUND-WAIT: an OLDER requester WOUNDS (aborts) the younger holder and takes the lock; a younger requester WAITS. Return 'wound' or 'wait'."""
        return "wound" if requester_ts < holder_ts else "wait"

    lost_update = [("T1", "R", "x"), ("T2", "R", "x"), ("T1", "W", "x"), ("T2", "W", "x")]
    fine = [("T1", "R", "x"), ("T1", "W", "x"), ("T2", "R", "x"), ("T2", "W", "x")]
    print("lost update serializable?", is_conflict_serializable(lost_update))
    print("one after another serializable?", is_conflict_serializable(fine), "order:", serial_order(fine))
    table = new_lock_table()
    print("T1 reads x:", acquire(table, "T1", "x", "S"), "| T2 reads x:", acquire(table, "T2", "x", "S"), "| T2 writes x:", acquire(table, "T2", "x", "X"))
    waits = {"T1": {"T2"}, "T2": {"T3"}, "T3": {"T1"}}
    cycle = find_deadlock(waits)
    print("deadlock cycle:", cycle, "victim:", choose_victim(cycle, {"T1": 1, "T2": 2, "T3": 3}))
  output: |
    lost update serializable? False
    one after another serializable? True order: ['T1', 'T2']
    T1 reads x: granted | T2 reads x: granted | T2 writes x: blocked
    deadlock cycle: ['T1', 'T2', 'T3'] victim: T3
