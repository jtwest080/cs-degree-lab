  tests:
  - name: closures
    code: |
      fds = [("A", "B"), ("B", "C")]
      assert closure("A", fds) == "ABC" and closure("B", fds) == "BC" and closure("C", fds) == "C" and closure("", fds) == ""
      assert closure("CA", fds) == "ABC" and closure("AA", fds) == "ABC"
      assert closure("AB", [("AB", "C"), ("C", "D"), ("D", "A")]) == "ABCD"
      assert closure("C", [("AB", "C"), ("C", "D"), ("D", "A")]) == "ACD"
      assert closure("X", []) == "X"
  - name: what is implied
    code: |
      fds = [("A", "BC"), ("C", "D")]
      assert implies(fds, "A", "D") and implies(fds, "A", "BD") and not implies(fds, "B", "C") and implies(fds, "C", "") and implies(fds, "A", "A")
      assert not implies([], "A", "B")
  - name: superkeys
    code: |
      fds = [("A", "BC"), ("C", "D")]
      assert is_superkey("ABCD", "A", fds) and is_superkey("ABCD", "AB", fds)
      assert not is_superkey("ABCD", "C", fds) and not is_superkey("ABCD", "BD", fds)
      assert is_superkey("ABCDE", "AE", fds + [("E", "E")]) and not is_superkey("ABCDE", "A", fds)
      assert is_superkey("A", "A", [])
  hints:
  - Loop until a whole pass over the dependencies adds nothing new.
  solution: |
    def closure(attrs, fds):
        """The CLOSURE of a set of attributes: everything they determine. Attributes are single letters; `attrs` is a string like 'AB'; `fds` is a list of FUNCTIONAL DEPENDENCIES (lhs, rhs) of strings like ('A', 'BC') meaning 'A determines B and C'. Start with the attributes and keep adding the rhs of every dependency whose lhs is already inside, until nothing changes.
        Return the result as a string of the letters in sorted order."""
        result = set(attrs)
        changed = True
        while changed:
            changed = False
            for lhs, rhs in fds:
                if set(lhs) <= result and not set(rhs) <= result:
                    result |= set(rhs)
                    changed = True
        return "".join(sorted(result))


    def implies(fds, lhs, rhs):
        """True if the dependencies imply that lhs determines rhs (every letter of rhs is in the closure of lhs)."""
        return set(rhs) <= set(closure(lhs, fds))


    def is_superkey(attrs, key, fds):
        """True if `key` determines ALL the attributes of the relation `attrs`."""
        return set(attrs) <= set(closure(key, fds))
  explanation: 'Closure is the basic tool of design theory: everything else, keys, normal forms, decompositions, is computed from it.'
