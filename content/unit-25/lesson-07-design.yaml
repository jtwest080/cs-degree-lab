    def is_superkey(attrs, key, fds):
        """True if `key` determines ALL the attributes of the relation `attrs`."""
        return set(attrs) <= set(closure(key, fds))


    from itertools import combinations


    def candidate_keys(attrs, fds):
        """All CANDIDATE KEYS of a relation: the MINIMAL sets of attributes that determine everything (a superkey with no smaller superkey inside it). Try the subsets of the sorted attributes in order of size (itertools.combinations), keep a subset if it is a superkey and does not contain a key already found.
        Return the keys as strings, ordered by size and then alphabetically."""
        letters = sorted(set(attrs))
        keys = []
        for size in range(1, len(letters) + 1):
