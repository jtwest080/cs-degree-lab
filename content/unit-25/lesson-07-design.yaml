id: u25-design
title: Relational Design and Normalization
minutes: 90
objective: Learn the theory behind well-designed tables. You will compute attribute closures and candidate keys, check Boyce-Codd and third normal forms, decompose relations, find minimal covers, and test decompositions on real data.
outcomes:
- Explain redundancy and the anomalies it causes
- Compute the closure of attributes under functional dependencies
- Find candidate keys
- Check BCNF and 3NF
- Decompose a relation losslessly
- Find dependencies in data
sections:
- heading: Why normalize?
  body: |-
    Suppose one big table lists every order with the customer's name, address and city repeated on each row. The same fact, *ada lives in Oslo*, is stored many times. This causes three **anomalies**. When she moves, you must change every row, and if you miss one the data contradicts itself (the **update anomaly**). You cannot record a new customer until she orders something (the **insertion anomaly**). Deleting her last order erases the only record of where she lives (the **deletion anomaly**).

    **Normalization** is the process of splitting tables so that each fact is stored exactly once. The mathematical tool is the **functional dependency**, a rule about the data written `X -> Y` and read "X determines Y": whenever two rows have the same X they must have the same Y. For example `customer -> city`, since one customer has one city, and `zip -> city`. Dependencies come from the meaning of the data, so a designer must state them; a computer cannot discover what is *intended*, only what happens to hold in the rows it sees.
- heading: Closure, keys and normal forms
  body: |-
    From a set of dependencies we can derive others. The **closure** of a set of attributes `X`, written X⁺, is every attribute it determines directly or through a chain of dependencies. To compute it start with X and repeatedly add the right-hand side of any dependency whose left-hand side is already inside, until nothing changes. A **superkey** is a set whose closure is *all* the attributes, so it identifies every row. A **candidate key** is a *minimal* superkey, one where removing any attribute breaks the property. An attribute that belongs to some candidate key is **prime**.

    A **normal form** is a quality standard for a table. **Boyce-Codd normal form (BCNF)** says that whenever `X -> Y` holds and Y is not already part of X, X must be a superkey. In other words, only keys may determine other things, which rules out the redundancy above. **Third normal form (3NF)** is slightly weaker: the right-hand side may also be a prime attribute. 3NF can always be reached without losing anything, while BCNF sometimes cannot. (First and second normal forms are earlier, weaker standards that BCNF and 3NF include.)
- heading: Decomposition
  body: |-
    To fix a table that violates BCNF because of `X -> Y`, **decompose** it: one table with X and everything X determines, and one with X and all the remaining attributes. Repeat until every table is in BCNF. A good decomposition must be **lossless**: joining the pieces back together gives *exactly* the original rows. A bad split invents rows that never existed, such as pairing every student with every teacher of a common course. A simple test for two pieces: the attributes they share must determine all of one piece. Ideally the decomposition also **preserves dependencies**, so each rule can be enforced inside a single table without joins.

    Before decomposing, designers usually simplify the dependencies into a **minimal cover**: single attributes on the right, no extra attributes on the left, and no dependency that others already imply. Finally, real systems sometimes **denormalize** on purpose, keeping a duplicate fact to avoid an expensive join, trading some redundancy for speed. That is a deliberate decision, made after the design is clean.
examples:
- title: Keys and normal forms
  intro: A chain of dependencies, its single key, and a table that is 3NF but not BCNF.
  code: |
    def closure(attrs, fds):
        """The CLOSURE of a set of attributes: everything they determine. Attributes are single letters; `attrs` is a string like 'AB'; `fds` is a list of FUNCTIONAL DEPENDENCIES (lhs, rhs) of strings like ('A', 'BC') meaning 'A determines B and C'. Start with the attributes and keep adding the rhs of every dependency whose lhs is already inside, until nothing changes.
        Return the result as a string of the letters in sorted order."""
        result = set(attrs)
        changed = True
        while changed:
            changed = False
            for lhs, rhs in fds:
                if set(lhs) <= result and not set(rhs) <= result:
                    result |= set(rhs)
                    changed = True
        return "".join(sorted(result))


    def implies(fds, lhs, rhs):
        """True if the dependencies imply that lhs determines rhs (every letter of rhs is in the closure of lhs)."""
        return set(rhs) <= set(closure(lhs, fds))


    def is_superkey(attrs, key, fds):
        """True if `key` determines ALL the attributes of the relation `attrs`."""
        return set(attrs) <= set(closure(key, fds))


    from itertools import combinations


    def candidate_keys(attrs, fds):
        """All CANDIDATE KEYS of a relation: the MINIMAL sets of attributes that determine everything (a superkey with no smaller superkey inside it). Try the subsets of the sorted attributes in order of size (itertools.combinations), keep a subset if it is a superkey and does not contain a key already found.
        Return the keys as strings, ordered by size and then alphabetically."""
        letters = sorted(set(attrs))
        keys = []
        for size in range(1, len(letters) + 1):
            for combo in combinations(letters, size):
                key = "".join(combo)
                if is_superkey(letters, key, fds) and not any(set(k) <= set(key) for k in keys):
                    keys.append(key)
        return keys


    def prime_attributes(attrs, fds):
        """The attributes that belong to at least one candidate key, as a sorted string."""
        return "".join(sorted(set("".join(candidate_keys(attrs, fds)))))


    def subsets(attrs):
        """All non-empty subsets of the attributes as strings of sorted letters, ordered by size and then alphabetically."""
        letters = sorted(set(attrs))
        return ["".join(c) for size in range(1, len(letters) + 1) for c in combinations(letters, size)]


    def bcnf_violations(attrs, fds):
        """The attribute sets X (as strings, in the order of `subsets`) that determine something NEW inside the relation without being a superkey: closure(X) restricted to the relation's attributes is bigger than X but is not all the attributes."""
        whole = set(attrs)
        bad = []
        for x in subsets(attrs):
            c = set(closure(x, fds)) & whole
            if c != set(x) and c != whole:
                bad.append(x)
        return bad


    def is_bcnf(attrs, fds):
        """BOYCE-CODD NORMAL FORM: every non-trivial dependency starts from a superkey, i.e. there are no violations."""
        return not bcnf_violations(attrs, fds)


    def is_3nf(attrs, fds):
        """THIRD NORMAL FORM: for every X that determines something new but is not a superkey, every NEW attribute it determines (inside the relation) must be PRIME (part of some candidate key)."""
        whole = set(attrs)
        prime = set(prime_attributes(attrs, fds))
        for x in bcnf_violations(attrs, fds):
            new = (set(closure(x, fds)) & whole) - set(x)
            if not new <= prime:
                return False
        return True


    def bcnf_decompose(attrs, fds):
        """Split a relation into BCNF relations. If there are no violations return [attrs] (sorted letters). Otherwise take the FIRST violation X (the first in bcnf_violations) and split into R1 = the closure of X restricted to the relation, and R2 = (the other attributes) plus X; decompose both recursively.
        Return the final relations as sorted-letter strings, without duplicates and without any relation that is contained in another, sorted alphabetically."""
        attrs = "".join(sorted(set(attrs)))
        bad = bcnf_violations(attrs, fds)
        if not bad:
            return [attrs]
        x = bad[0]
        r1 = "".join(sorted(set(closure(x, fds)) & set(attrs)))
        r2 = "".join(sorted((set(attrs) - set(r1)) | set(x)))
        parts = set(bcnf_decompose(r1, fds)) | set(bcnf_decompose(r2, fds))
        parts = [p for p in parts if not any(p != q and set(p) <= set(q) for q in parts)]
        return sorted(parts)

    fds = [("A", "B"), ("B", "C")]
    print("closure of A:", closure("A", fds), "| closure of B:", closure("B", fds))
    print("candidate keys of ABC:", candidate_keys("ABC", fds), "| BCNF?", is_bcnf("ABC", fds))
    print("split into:", bcnf_decompose("ABC", fds))
    fds2 = [("AB", "C"), ("C", "B")]
    print("keys of ABC with AB->C and C->B:", candidate_keys("ABC", fds2), "| 3NF?", is_3nf("ABC", fds2), "| BCNF?", is_bcnf("ABC", fds2))
  output: |
    closure of A: ABC | closure of B: BC
    candidate keys of ABC: ['A'] | BCNF? False
    split into: ['AB', 'BC']
    keys of ABC with AB->C and C->B: ['AB', 'AC'] | 3NF? True | BCNF? False
  lines:
  - line: 94
    note: A determines B, and B determines C, so A determines everything.
  - line: 95
    note: The only key is A, but B -> C breaks BCNF.
  - line: 96
    note: The decomposition AB and BC is in BCNF.
  - line: 98
    note: AB and AC are both keys, so every attribute is prime and the table is in 3NF but not BCNF.
- title: Dependencies in real rows
  intro: Finding dependencies in an orders table and testing whether splitting it loses information.
  code: |
    def closure(attrs, fds):
        """The CLOSURE of a set of attributes: everything they determine. Attributes are single letters; `attrs` is a string like 'AB'; `fds` is a list of FUNCTIONAL DEPENDENCIES (lhs, rhs) of strings like ('A', 'BC') meaning 'A determines B and C'. Start with the attributes and keep adding the rhs of every dependency whose lhs is already inside, until nothing changes.
        Return the result as a string of the letters in sorted order."""
        result = set(attrs)
        changed = True
        while changed:
            changed = False
            for lhs, rhs in fds:
                if set(lhs) <= result and not set(rhs) <= result:
                    result |= set(rhs)
                    changed = True
        return "".join(sorted(result))


    def implies(fds, lhs, rhs):
        """True if the dependencies imply that lhs determines rhs (every letter of rhs is in the closure of lhs)."""
        return set(rhs) <= set(closure(lhs, fds))


    def is_superkey(attrs, key, fds):
        """True if `key` determines ALL the attributes of the relation `attrs`."""
        return set(attrs) <= set(closure(key, fds))


    def minimal_cover(fds):
        """A MINIMAL COVER: a simpler list of dependencies with the same meaning. (1) split every right-hand side into single attributes and drop trivial ones (the attribute is already in the lhs); remove duplicates and sort. (2) For each dependency try to remove EXTRANEOUS attributes from its lhs, going through the lhs letters in alphabetical order:
        a letter can go if the rhs is still in the closure of the smaller lhs (under the whole current list). (3) Remove each REDUNDANT dependency (one implied by the others), checking them in order. Return the sorted list of (lhs, rhs) with single-letter rhs."""
        g = sorted({("".join(sorted(set(l))), a) for l, r in fds for a in set(r) if a not in l})
        for i in range(len(g)):
            l, a = g[i]
            for b in sorted(l):
                if len(l) > 1 and b in l:
                    smaller = l.replace(b, "")
                    if a in closure(smaller, g):
                        l = smaller
            g[i] = (l, a)
        g = sorted(set(g))
        i = 0
        while i < len(g):
            l, a = g[i]
            rest = g[:i] + g[i + 1:]
            if a in closure(l, rest):
                g = rest
            else:
                i += 1
        return g


    def lossless_binary(r1, r2, fds):
        """Is splitting a relation into the two relations r1 and r2 LOSSLESS (joining them back gives exactly the original)? True if the shared attributes determine all of r1 or all of r2 (use closure)."""
        cl = set(closure("".join(set(r1) & set(r2)), fds))
        return set(r1) <= cl or set(r2) <= cl


    def preserves_dependencies(parts, fds):
        """Does a decomposition PRESERVE the dependencies (can each one still be checked inside a single relation)? For every (lhs, rhs): start with z = set(lhs); repeat until nothing changes: for each part, add (closure(z intersect part) intersect part) to z. The dependency is preserved if rhs is inside z in the end. True if all are preserved."""
        for lhs, rhs in fds:
            z = set(lhs)
            changed = True
            while changed:
                changed = False
                for part in parts:
                    new = set(closure("".join(z & set(part)), fds)) & set(part)
                    if not new <= z:
                        z |= new
                        changed = True
            if not set(rhs) <= z:
                return False
        return True


    from itertools import combinations


    def fd_holds(rows, lhs, rhs):
        """Does the functional dependency lhs -> rhs hold in the DATA? `rows` is a list of dicts, lhs and rhs are lists of column names. It holds if no two rows agree on all the lhs columns but differ on some rhs column."""
        seen = {}
        for row in rows:
            key = tuple(row[c] for c in lhs)
            val = tuple(row[c] for c in rhs)
            if seen.setdefault(key, val) != val:
                return False
        return True


    def discover_fds(rows, columns, max_lhs=2):
        """Find the dependencies that hold in the data. For each rhs column and each lhs size from 1 to max_lhs, try every combination of OTHER columns (itertools.combinations over the columns in the given order) and keep (lhs tuple, rhs column) if fd_holds, but skip an lhs that contains the lhs of a dependency already found for the same rhs (only MINIMAL ones).
        Return the list sorted by (size of lhs, lhs, rhs)."""
        found = []
        for rhs in columns:
            others = [c for c in columns if c != rhs]
            mine = []
            for size in range(1, max_lhs + 1):
                for lhs in combinations(others, size):
                    if any(set(m) <= set(lhs) for m in mine):
                        continue
                    if fd_holds(rows, list(lhs), [rhs]):
                        mine.append(lhs)
                        found.append((lhs, rhs))
        return sorted(found, key=lambda f: (len(f[0]), f[0], f[1]))


    def project_rows(rows, cols):
        """The DISTINCT combinations of the given columns, as tuples in the order of `cols`, sorted by repr."""
        return sorted({tuple(r[c] for c in cols) for r in rows}, key=repr)


    def join_back(parts):
        """NATURAL-JOIN a list of (columns, tuples) pieces: start with the rows of the first piece as dicts; for each next piece, combine every row so far with every tuple of the piece whose values AGREE on the shared columns (merge the dicts). Return the distinct result rows as a list of dicts sorted by repr(sorted(row.items()))."""
        rows = [dict(zip(parts[0][0], t)) for t in parts[0][1]]
        for cols, tuples in parts[1:]:
            merged = []
            for r in rows:
                for t in tuples:
                    d = dict(zip(cols, t))
                    if all(r[c] == d[c] for c in cols if c in r):
                        merged.append({**r, **d})
            rows = merged
        unique = {repr(sorted(r.items())): r for r in rows}
        return [unique[k] for k in sorted(unique)]


    def is_lossless(rows, parts):
        """Split the table into the column groups in `parts` (a list of lists of columns), project every group with project_rows, join them back with join_back and return True if the result is exactly the set of original rows."""
        pieces = [(cols, project_rows(rows, cols)) for cols in parts]
        back = join_back(pieces)
        return {repr(sorted(r.items())) for r in back} == {repr(sorted(r.items())) for r in rows}

    orders = [
        {"order": 1, "customer": "ada", "city": "Oslo", "item": "pen"},
        {"order": 2, "customer": "ada", "city": "Oslo", "item": "ink"},
        {"order": 3, "customer": "bob", "city": "Rome", "item": "pen"},
        {"order": 4, "customer": "cy", "city": "Oslo", "item": "pad"},
    ]
    print("dependencies found:", discover_fds(orders, ["order", "customer", "city", "item"], max_lhs=1))
    print("lossless to split into customer+city and order+customer+item:", is_lossless(orders, [["customer", "city"], ["order", "customer", "item"]]))
    print("lossless to split into customer+city and city+item:", is_lossless(orders, [["customer", "city"], ["city", "item"]]))
    print("minimal cover:", minimal_cover([("A", "BC"), ("B", "C"), ("A", "B"), ("AB", "C")]))
  output: |
    dependencies found: [(('customer',), 'city'), (('order',), 'city'), (('order',), 'customer'), (('order',), 'item')]
    lossless to split into customer+city and order+customer+item: True
    lossless to split into customer+city and city+item: False
    minimal cover: [('A', 'B'), ('B', 'C')]
  lines:
  - line: 135
    note: order determines everything; customer determines city.
  - line: 136
    note: Splitting off customer and city is lossless.
  - line: 137
    note: Joining on city invents rows, so this split loses information.
  - line: 138
    note: Redundant dependencies are removed.
playground:
  prompt: Add rows that break the rule that a customer has one city.
  code: |
    rows = [('ada', 'Oslo'), ('ada', 'Oslo'), ('bob', 'Rome')]
    cities = {}
    for customer, city in rows:
        cities.setdefault(customer, set()).add(city)
    print(cities)
    print('customer -> city holds:', all(len(c) == 1 for c in cities.values()))
