title: Mini Database
language: python
brief: Build a small in-memory relational database that ties the whole unit together. It has typed tables
  with record ids, a unique key, secondary indexes kept as sorted lists, a planner that chooses between
  an index lookup, an index range scan and a sequential scan, SELECT with conditions, ordering, limits
  and column lists, UPDATE and DELETE that keep every index correct, and transactions that can be rolled
  back using an undo log. The helper functions for matching rows and for searching a sorted index are
  given.
steps:
- title: Tables and rows
  body: Write `new_database`, `get_table`, `create_table`, `check_values` and `insert`. Validate types
    and column names, enforce a unique, non-null key and keep every index up to date.
- title: Indexes and plans
  body: Write `create_index`, `plan`, `explain` and `find_rids`. The planner prefers an equality condition
    on an indexed column, then a range condition, and otherwise scans the whole table. An index must give
    exactly the same rows as a scan.
- title: Queries and changes
  body: Write `select` (conditions, ordering, limit, column list), `update` and `delete`. Updates must
    move the row inside the indexes; a key update must not create duplicates.
- title: Transactions
  body: Write `begin`, `commit` and `rollback`. Every insert, update and delete logs an undo entry while
    a transaction is active, and rollback replays the log backwards, restoring rows, record ids and indexes.
checklist:
- text: Creates tables and validates their definition
  test: creating tables
- text: Checks types and columns when inserting
  test: inserting and typing
- text: Enforces a unique, non-null key
  test: keys are unique
- text: Selects with conditions and columns
  test: selecting
- text: Orders and limits results
  test: ordering and limits
- text: Chooses between index and table scans
  test: indexes and plans
- text: Index plans return the same rows as scans
  test: index results equal scan results
- text: Updates rows and keeps indexes correct
  test: updating
- text: Deletes rows and keeps indexes correct
  test: deleting
- text: Rolls back inserts
  test: rolling back inserts
- text: Rolls back updates and deletes exactly
  test: rolling back updates and deletes
- text: Handles a realistic sequence of operations
  test: a day in the life
starter: |-
  import bisect

  OPS = {"=": lambda a, b: a == b, "!=": lambda a, b: a != b, "<": lambda a, b: a < b, "<=": lambda a, b: a <= b, ">": lambda a, b: a > b, ">=": lambda a, b: a >= b}


  def matches(row, where):
      """True if every condition (column, op, value) in the list holds for the row dict. A NULL (None) value never satisfies a condition."""
      for col, op, value in where:
          v = row[col]
          if v is None or not OPS[op](v, value):
              return False
      return True


  def index_add(table, rid, row):
      """Add the row's values to every index of the table (an index is a sorted list of (value, rid); NULLs are not indexed)."""
      for col, idx in table["indexes"].items():
          if row[col] is not None:
              bisect.insort(idx, (row[col], rid))


  def index_remove(table, rid, row):
      """Remove the row's entries from every index of the table."""
      for col, idx in table["indexes"].items():
          if row[col] is not None:
              i = bisect.bisect_left(idx, (row[col], rid))
              if i < len(idx) and idx[i] == (row[col], rid):
                  del idx[i]


  def index_scan(index, op, value):
      """The record ids found in a sorted index list for the condition `column op value` (op is one of = < <= > >=), as a sorted list of rids."""
      big = 10 ** 18
      if op == "=":
          lo, hi = bisect.bisect_left(index, (value, -1)), bisect.bisect_right(index, (value, big))
      elif op == "<":
          lo, hi = 0, bisect.bisect_left(index, (value, -1))
      elif op == "<=":
          lo, hi = 0, bisect.bisect_right(index, (value, big))
      elif op == ">":
          lo, hi = bisect.bisect_right(index, (value, big)), len(index)
      else:
          lo, hi = bisect.bisect_left(index, (value, -1)), len(index)
      return sorted(rid for v, rid in index[lo:hi])


  def new_database():
      """An empty database: {"tables": {}, "txn": None}. `txn` holds the undo log (a list) while a transaction is active."""
      pass


  def get_table(db, name):
      """The table dict, or ValueError('no such table NAME')."""
      pass


  def create_table(db, name, columns, key=None):
      """Create a table. `columns` is a list of (name, type) with type 'int' or 'text' (ValueError('unknown type T') otherwise). ValueError('table exists') if the name is taken; if `key` is given it must be a column (ValueError('unknown column K')) and it gets an index automatically.
      The table is {"columns": {name: type, ...}, "key": key, "rows": {}, "next": 0, "indexes": {}} (rows maps a record id to a row dict; next is the next record id)."""
      pass


  def create_index(db, name, col):
      """Create an index on a column and fill it from the existing rows (NULLs skipped). ValueError('unknown column C') for a missing column, ValueError('index exists') if there already is one."""
      pass


  def check_values(table, values):
      """Validate a dict of column values: ValueError('unknown column C') for an unknown column; ValueError('bad type for C') unless the value is None, an int (not a bool) for 'int' columns or a str for 'text' columns."""
      pass


  def insert(db, name, row):
      """Insert a row (a dict; missing columns become None) and return its record id. Validate with check_values; if the table has a key: ValueError('key cannot be null') for a None key and ValueError('duplicate key') if another row has it. Store the row, add it to the indexes,
      use next as the id and add 1 to it. If a transaction is active, append ('insert', name, rid) to the undo log."""
      pass


  def plan(table, where):
      """Choose HOW to find the rows. Return (kind, column, op): prefer a condition with op '=' on an INDEXED column (kind 'Index lookup'); otherwise the first condition with op < <= > >= on an indexed column (kind 'Index range'); otherwise ('Seq scan', None, None)."""
      pass


  def explain(db, name, where=()):
      """Describe the plan as text: 'Seq scan', 'Index lookup on COL' or 'Index range on COL' (see plan). Check the columns of the conditions first (ValueError('unknown column C'))."""
      pass


  def find_rids(table, where):
      """The record ids of the rows matching every condition, in increasing id order. Use the plan: for an index plan take the candidate ids with index_scan on the chosen condition, otherwise all ids; then keep those whose row passes `matches` for ALL the conditions."""
      pass


  def select(db, name, where=(), columns=None, order_by=None, limit=None):
      """Return the matching rows as NEW dicts. ValueError('unknown column C') for an unknown column in the conditions, `columns` or `order_by`. Rows are in record id order unless `order_by` (a list of (column, descending), most important first; sort with repeated stable sorts, the last key first) is given.
      Then apply `limit` (a number) and finally keep only the listed `columns` (all columns if None, and in the order given). Use find_rids."""
      pass


  def update(db, name, where, changes):
      """Set the columns in `changes` (a dict) in every matching row; return how many rows were changed. Validate with check_values. If the key column is changed: ValueError('key cannot be null') for None, and ValueError('duplicate key') if more than one row matches or another row already has that value.
      For each row: if a transaction is active log ('update', name, rid, copy of the old row), remove it from the indexes, change it, add it back."""
      pass


  def delete(db, name, where):
      """Delete every matching row (remove it from the table and the indexes) and return how many were deleted. If a transaction is active log ('delete', name, rid, the row) for each."""
      pass


  def begin(db):
      """Start a transaction: db['txn'] = []. ValueError('transaction already active') if there is one."""
      pass


  def commit(db):
      """Keep the changes: db['txn'] = None. ValueError('no active transaction') if there is none."""
      pass


  def rollback(db):
      """Undo everything done since begin: go through the undo log in REVERSE order. 'insert': remove the row (and its index entries); 'delete': put the row back under its old id (and into the indexes); 'update': take the changed row out of the indexes and restore the old copy (and index it).
      Then db['txn'] = None. ValueError('no active transaction') if there is none."""
      pass
tests:
- name: creating tables
  code: |
    db = new_database()
    assert db == {"tables": {}, "txn": None}
    create_table(db, "people", [("id", "int"), ("name", "text"), ("age", "int")], key="id")
    t = db["tables"]["people"]
    assert list(t["columns"]) == ["id", "name", "age"] and t["columns"]["age"] == "int" and t["key"] == "id" and t["rows"] == {} and t["next"] == 0 and t["indexes"] == {"id": []}
    create_table(db, "log", [("msg", "text")])
    assert db["tables"]["log"]["key"] is None and db["tables"]["log"]["indexes"] == {}
    for args, msg in ((("people", [("a", "int")]), "table exists"), (("t2", [("a", "float")]), "unknown type float"), (("t3", [("a", "int")], "zzz"), "unknown column zzz")):
        try:
            create_table(db, *args)
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e)
    try:
        insert(db, "nope", {})
        raise AssertionError("accepted")
    except ValueError as e:
        assert "no such table nope" in str(e)
- name: inserting and typing
  code: |
    db = new_database()
    create_table(db, "p", [("id", "int"), ("name", "text"), ("age", "int")], key="id")
    assert insert(db, "p", {"id": 1, "name": "ada", "age": 36}) == 0
    assert insert(db, "p", {"id": 2, "name": "bob"}) == 1
    assert db["tables"]["p"]["rows"] == {0: {"id": 1, "name": "ada", "age": 36}, 1: {"id": 2, "name": "bob", "age": None}} and db["tables"]["p"]["next"] == 2
    for row, msg in (({"id": 3, "name": 5}, "bad type for name"), ({"id": "3"}, "bad type for id"), ({"id": True}, "bad type for id"), ({"id": 3, "zip": 1}, "unknown column zip")):
        try:
            insert(db, "p", row)
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e), (row, str(e))
    assert db["tables"]["p"]["next"] == 2 and len(db["tables"]["p"]["rows"]) == 2
- name: keys are unique
  code: |
    db = new_database()
    create_table(db, "p", [("id", "int"), ("name", "text")], key="id")
    insert(db, "p", {"id": 1, "name": "a"})
    for row, msg in (({"id": 1, "name": "b"}, "duplicate key"), ({"name": "c"}, "key cannot be null"), ({"id": None}, "key cannot be null")):
        try:
            insert(db, "p", row)
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e)
    assert len(db["tables"]["p"]["rows"]) == 1 and db["tables"]["p"]["indexes"]["id"] == [(1, 0)]
    insert(db, "p", {"id": 5, "name": "z"})
    assert db["tables"]["p"]["indexes"]["id"] == [(1, 0), (5, 1)]
- name: selecting
  code: |
    db = new_database()
    create_table(db, "p", [("id", "int"), ("name", "text"), ("age", "int")], key="id")
    for i, (n, a) in enumerate((("ada", 36), ("alan", 41), ("grace", 45), ("edsger", None), ("barbara", 29))):
        insert(db, "p", {"id": i + 1, "name": n, "age": a})
    assert [r["name"] for r in select(db, "p")] == ["ada", "alan", "grace", "edsger", "barbara"]
    assert select(db, "p", where=[("age", ">", 30), ("age", "<", 45)], columns=["name", "id"]) == [{"name": "ada", "id": 1}, {"name": "alan", "id": 2}]
    assert select(db, "p", where=[("name", "=", "grace")]) == [{"id": 3, "name": "grace", "age": 45}]
    assert select(db, "p", where=[("age", "!=", 36)], columns=["id"]) == [{"id": 2}, {"id": 3}, {"id": 5}]
    assert select(db, "p", where=[("age", "=", 99)]) == []
    r = select(db, "p")
    r[0]["name"] = "changed"
    assert select(db, "p", columns=["name"])[0] == {"name": "ada"}
    for kw, msg in (({"where": [("zip", "=", 1)]}, "unknown column zip"), ({"columns": ["zip"]}, "unknown column zip"), ({"order_by": [("zip", False)]}, "unknown column zip")):
        try:
            select(db, "p", **kw)
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e)
- name: ordering and limits
  code: |
    db = new_database()
    create_table(db, "t", [("g", "text"), ("n", "int")])
    for g, n in (("b", 2), ("a", 3), ("b", 1), ("a", 1), ("c", None)):
        insert(db, "t", {"g": g, "n": n})
    assert [r["n"] for r in select(db, "t", where=[("n", ">", 0)], order_by=[("n", False)])] == [1, 1, 2, 3]
    assert [(r["g"], r["n"]) for r in select(db, "t", where=[("n", ">", 0)], order_by=[("g", False), ("n", True)])] == [("a", 3), ("a", 1), ("b", 2), ("b", 1)]
    assert select(db, "t", where=[("n", ">", 0)], order_by=[("n", True)], limit=2, columns=["n"]) == [{"n": 3}, {"n": 2}]
    assert select(db, "t", limit=0) == [] and len(select(db, "t", limit=100)) == 5
    assert select(db, "t", order_by=[("n", False)], columns=["g"])[0] == {"g": "c"}
- name: indexes and plans
  code: |
    db = new_database()
    create_table(db, "p", [("id", "int"), ("age", "int"), ("city", "text")], key="id")
    for i in range(20):
        insert(db, "p", {"id": i, "age": 20 + i % 5, "city": "c%d" % (i % 3)})
    assert explain(db, "p") == "Seq scan" and explain(db, "p", [("age", "=", 21)]) == "Seq scan"
    assert explain(db, "p", [("id", "=", 3)]) == "Index lookup on id" and explain(db, "p", [("id", ">", 3)]) == "Index range on id"
    create_index(db, "p", "age")
    assert db["tables"]["p"]["indexes"]["age"] == sorted((20 + i % 5, i) for i in range(20))
    assert explain(db, "p", [("age", "=", 21)]) == "Index lookup on age"
    assert explain(db, "p", [("city", "=", "c1"), ("age", ">=", 22)]) == "Index range on age"
    assert explain(db, "p", [("age", ">", 22), ("id", "=", 4)]) == "Index lookup on id"
    assert explain(db, "p", [("age", "!=", 22)]) == "Seq scan"
    for call, msg in ((lambda: create_index(db, "p", "age"), "index exists"), (lambda: create_index(db, "p", "zip"), "unknown column zip"), (lambda: explain(db, "p", [("zip", "=", 1)]), "unknown column zip")):
        try:
            call()
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e)
- name: index results equal scan results
  code: |
    import random
    rng = random.Random(4)
    db = new_database()
    create_table(db, "t", [("id", "int"), ("v", "int"), ("w", "text")], key="id")
    for i in range(300):
        insert(db, "t", {"id": i, "v": rng.randrange(50) if i % 17 else None, "w": rng.choice("abc")})
    plain = new_database()
    create_table(plain, "t", [("id", "int"), ("v", "int"), ("w", "text")])
    for r in select(db, "t"):
        insert(plain, "t", r)
    create_index(db, "t", "v")
    for op in ("=", "<", "<=", ">", ">="):
        for value in (-1, 0, 7, 25, 49, 60):
            for extra in ([], [("w", "=", "a")]):
                where = [("v", op, value)] + extra
                assert select(db, "t", where) == select(plain, "t", where), (op, value)
    assert explain(db, "t", [("v", ">", 3)]) == "Index range on v" and explain(plain, "t", [("v", ">", 3)]) == "Seq scan"
    assert select(db, "t", [("id", "=", 17)]) == select(plain, "t", [("id", "=", 17)])
- name: updating
  code: |
    db = new_database()
    create_table(db, "p", [("id", "int"), ("name", "text"), ("age", "int")], key="id")
    create_index(db, "p", "age")
    for i, a in enumerate((30, 40, 50, 40)):
        insert(db, "p", {"id": i, "name": "n%d" % i, "age": a})
    assert update(db, "p", [("age", "=", 40)], {"age": 41, "name": "x"}) == 2
    assert [(r["name"], r["age"]) for r in select(db, "p")] == [("n0", 30), ("x", 41), ("n2", 50), ("x", 41)]
    assert db["tables"]["p"]["indexes"]["age"] == [(30, 0), (41, 1), (41, 3), (50, 2)]
    assert select(db, "p", [("age", "=", 40)]) == [] and len(select(db, "p", [("age", "=", 41)])) == 2
    assert update(db, "p", [("age", "=", 99)], {"age": 1}) == 0
    assert update(db, "p", [("id", "=", 2)], {"id": 7}) == 1 and select(db, "p", [("id", "=", 7)], columns=["name"]) == [{"name": "n2"}]
    assert db["tables"]["p"]["indexes"]["id"] == [(0, 0), (1, 1), (3, 3), (7, 2)]
    for where, ch, msg in (([("id", "=", 0)], {"id": 1}, "duplicate key"), ([], {"id": 9}, "duplicate key"), ([("id", "=", 0)], {"id": None}, "key cannot be null"), ([("id", "=", 0)], {"age": "old"}, "bad type for age"), ([], {"zip": 1}, "unknown column zip")):
        try:
            update(db, "p", where, ch)
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e), (ch, str(e))
    assert update(db, "p", [("id", "=", 0)], {"id": 0}) == 1
- name: deleting
  code: |
    db = new_database()
    create_table(db, "t", [("id", "int"), ("v", "int")], key="id")
    create_index(db, "t", "v")
    for i in range(6):
        insert(db, "t", {"id": i, "v": i % 3})
    assert delete(db, "t", [("v", "=", 1)]) == 2
    assert [r["id"] for r in select(db, "t")] == [0, 2, 3, 5]
    assert db["tables"]["t"]["indexes"]["v"] == [(0, 0), (0, 3), (2, 2), (2, 5)] and db["tables"]["t"]["indexes"]["id"] == [(0, 0), (2, 2), (3, 3), (5, 5)]
    assert delete(db, "t", [("v", "=", 1)]) == 0
    assert insert(db, "t", {"id": 1, "v": 1}) == 6
    assert delete(db, "t", []) == 5 and select(db, "t") == [] and db["tables"]["t"]["indexes"]["v"] == []
    try:
        delete(db, "t", [("zip", "=", 1)])
        raise AssertionError("accepted")
    except ValueError as e:
        assert "unknown column zip" in str(e)
- name: rolling back inserts
  code: |
    db = new_database()
    create_table(db, "t", [("id", "int"), ("v", "int")], key="id")
    create_index(db, "t", "v")
    insert(db, "t", {"id": 1, "v": 10})
    begin(db)
    insert(db, "t", {"id": 2, "v": 20}); insert(db, "t", {"id": 3, "v": 10})
    assert len(select(db, "t")) == 3 and db["txn"] == [("insert", "t", 1), ("insert", "t", 2)]
    rollback(db)
    assert db["txn"] is None and [r["id"] for r in select(db, "t")] == [1]
    assert db["tables"]["t"]["indexes"]["v"] == [(10, 0)] and db["tables"]["t"]["indexes"]["id"] == [(1, 0)]
    begin(db)
    insert(db, "t", {"id": 4, "v": 40})
    commit(db)
    assert db["txn"] is None and [r["id"] for r in select(db, "t")] == [1, 4]
    for call, msg in ((lambda: commit(db), "no active transaction"), (lambda: rollback(db), "no active transaction")):
        try:
            call()
            raise AssertionError("accepted")
        except ValueError as e:
            assert msg in str(e)
    begin(db)
    try:
        begin(db)
        raise AssertionError("accepted")
    except ValueError as e:
        assert "transaction already active" in str(e)
- name: rolling back updates and deletes
  code: |
    db = new_database()
    create_table(db, "t", [("id", "int"), ("v", "int")], key="id")
    create_index(db, "t", "v")
    for i in range(5):
        insert(db, "t", {"id": i, "v": i * 10})
    before = (select(db, "t"), {k: list(v) for k, v in db["tables"]["t"]["indexes"].items()}, __import__("copy").deepcopy(db["tables"]["t"]["rows"]))
    begin(db)
    update(db, "t", [("v", ">", 20)], {"v": 1})
    delete(db, "t", [("id", "<", 2)])
    insert(db, "t", {"id": 9, "v": 5})
    update(db, "t", [("id", "=", 2)], {"v": 99})
    assert len(select(db, "t")) == 4 and len(db["txn"]) == 2 + 2 + 1 + 1
    rollback(db)
    after = (select(db, "t"), {k: list(v) for k, v in db["tables"]["t"]["indexes"].items()}, __import__("copy").deepcopy(db["tables"]["t"]["rows"]))
    assert after == before
- name: a day in the life
  code: |
    db = new_database()
    create_table(db, "accounts", [("id", "int"), ("owner", "text"), ("balance", "int")], key="id")
    create_index(db, "accounts", "balance")
    for i, (o, b) in enumerate((("ada", 100), ("bob", 50), ("cy", 75))):
        insert(db, "accounts", {"id": i + 1, "owner": o, "balance": b})
    begin(db)
    update(db, "accounts", [("id", "=", 1)], {"balance": 70})
    update(db, "accounts", [("id", "=", 2)], {"balance": 80})
    commit(db)
    assert [(r["owner"], r["balance"]) for r in select(db, "accounts", order_by=[("balance", True)])] == [("bob", 80), ("cy", 75), ("ada", 70)]
    begin(db)
    update(db, "accounts", [("id", "=", 3)], {"balance": 0})
    delete(db, "accounts", [("balance", "<", 10)])
    assert select(db, "accounts", [("id", "=", 3)]) == []
    rollback(db)
    assert select(db, "accounts", [("balance", ">=", 75)], columns=["owner"], order_by=[("owner", False)]) == [{"owner": "bob"}, {"owner": "cy"}]
    assert explain(db, "accounts", [("balance", ">=", 75)]) == "Index range on balance"
solution: |
  import bisect

  OPS = {"=": lambda a, b: a == b, "!=": lambda a, b: a != b, "<": lambda a, b: a < b, "<=": lambda a, b: a <= b, ">": lambda a, b: a > b, ">=": lambda a, b: a >= b}


  def matches(row, where):
      """True if every condition (column, op, value) in the list holds for the row dict. A NULL (None) value never satisfies a condition."""
      for col, op, value in where:
          v = row[col]
          if v is None or not OPS[op](v, value):
              return False
      return True


  def index_add(table, rid, row):
      """Add the row's values to every index of the table (an index is a sorted list of (value, rid); NULLs are not indexed)."""
      for col, idx in table["indexes"].items():
          if row[col] is not None:
              bisect.insort(idx, (row[col], rid))


  def index_remove(table, rid, row):
      """Remove the row's entries from every index of the table."""
      for col, idx in table["indexes"].items():
          if row[col] is not None:
              i = bisect.bisect_left(idx, (row[col], rid))
              if i < len(idx) and idx[i] == (row[col], rid):
                  del idx[i]


  def index_scan(index, op, value):
      """The record ids found in a sorted index list for the condition `column op value` (op is one of = < <= > >=), as a sorted list of rids."""
      big = 10 ** 18
      if op == "=":
          lo, hi = bisect.bisect_left(index, (value, -1)), bisect.bisect_right(index, (value, big))
      elif op == "<":
          lo, hi = 0, bisect.bisect_left(index, (value, -1))
      elif op == "<=":
          lo, hi = 0, bisect.bisect_right(index, (value, big))
      elif op == ">":
          lo, hi = bisect.bisect_right(index, (value, big)), len(index)
      else:
          lo, hi = bisect.bisect_left(index, (value, -1)), len(index)
      return sorted(rid for v, rid in index[lo:hi])


  def new_database():
      """An empty database: {"tables": {}, "txn": None}. `txn` holds the undo log (a list) while a transaction is active."""
      return {"tables": {}, "txn": None}


  def get_table(db, name):
      """The table dict, or ValueError('no such table NAME')."""
      if name not in db["tables"]:
          raise ValueError("no such table " + name)
      return db["tables"][name]


  def create_table(db, name, columns, key=None):
      """Create a table. `columns` is a list of (name, type) with type 'int' or 'text' (ValueError('unknown type T') otherwise). ValueError('table exists') if the name is taken; if `key` is given it must be a column (ValueError('unknown column K')) and it gets an index automatically.
      The table is {"columns": {name: type, ...}, "key": key, "rows": {}, "next": 0, "indexes": {}} (rows maps a record id to a row dict; next is the next record id)."""
      if name in db["tables"]:
          raise ValueError("table exists")
      cols = {}
      for c, t in columns:
          if t not in ("int", "text"):
              raise ValueError("unknown type " + t)
          cols[c] = t
      if key is not None and key not in cols:
          raise ValueError("unknown column " + key)
      db["tables"][name] = {"columns": cols, "key": key, "rows": {}, "next": 0, "indexes": {key: []} if key else {}}


  def create_index(db, name, col):
      """Create an index on a column and fill it from the existing rows (NULLs skipped). ValueError('unknown column C') for a missing column, ValueError('index exists') if there already is one."""
      table = get_table(db, name)
      if col not in table["columns"]:
          raise ValueError("unknown column " + col)
      if col in table["indexes"]:
          raise ValueError("index exists")
      table["indexes"][col] = sorted((r[col], rid) for rid, r in table["rows"].items() if r[col] is not None)


  def check_values(table, values):
      """Validate a dict of column values: ValueError('unknown column C') for an unknown column; ValueError('bad type for C') unless the value is None, an int (not a bool) for 'int' columns or a str for 'text' columns."""
      for c, v in values.items():
          if c not in table["columns"]:
              raise ValueError("unknown column " + c)
          t = table["columns"][c]
          if v is not None and not ((t == "int" and isinstance(v, int) and not isinstance(v, bool)) or (t == "text" and isinstance(v, str))):
              raise ValueError("bad type for " + c)


  def insert(db, name, row):
      """Insert a row (a dict; missing columns become None) and return its record id. Validate with check_values; if the table has a key: ValueError('key cannot be null') for a None key and ValueError('duplicate key') if another row has it. Store the row, add it to the indexes,
      use next as the id and add 1 to it. If a transaction is active, append ('insert', name, rid) to the undo log."""
      table = get_table(db, name)
      check_values(table, row)
      full = {c: row.get(c) for c in table["columns"]}
      k = table["key"]
      if k:
          if full[k] is None:
              raise ValueError("key cannot be null")
          if any(r[k] == full[k] for r in table["rows"].values()):
              raise ValueError("duplicate key")
      rid = table["next"]
      table["next"] += 1
      table["rows"][rid] = full
      index_add(table, rid, full)
      if db["txn"] is not None:
          db["txn"].append(("insert", name, rid))
      return rid


  def plan(table, where):
      """Choose HOW to find the rows. Return (kind, column, op): prefer a condition with op '=' on an INDEXED column (kind 'Index lookup'); otherwise the first condition with op < <= > >= on an indexed column (kind 'Index range'); otherwise ('Seq scan', None, None)."""
      for col, op, v in where:
          if op == "=" and col in table["indexes"]:
              return ("Index lookup", col, op)
      for col, op, v in where:
          if op in ("<", "<=", ">", ">=") and col in table["indexes"]:
              return ("Index range", col, op)
      return ("Seq scan", None, None)


  def explain(db, name, where=()):
      """Describe the plan as text: 'Seq scan', 'Index lookup on COL' or 'Index range on COL' (see plan). Check the columns of the conditions first (ValueError('unknown column C'))."""
      table = get_table(db, name)
      for col, op, v in where:
          if col not in table["columns"]:
              raise ValueError("unknown column " + col)
      kind, col, op = plan(table, where)
      return kind if col is None else kind + " on " + col


  def find_rids(table, where):
      """The record ids of the rows matching every condition, in increasing id order. Use the plan: for an index plan take the candidate ids with index_scan on the chosen condition, otherwise all ids; then keep those whose row passes `matches` for ALL the conditions."""
      kind, col, op = plan(table, where)
      if kind == "Seq scan":
          candidates = sorted(table["rows"])
      else:
          value = next(v for c, o, v in where if c == col and o == op)
          candidates = index_scan(table["indexes"][col], op, value)
      return [rid for rid in candidates if matches(table["rows"][rid], where)]


  def select(db, name, where=(), columns=None, order_by=None, limit=None):
      """Return the matching rows as NEW dicts. ValueError('unknown column C') for an unknown column in the conditions, `columns` or `order_by`. Rows are in record id order unless `order_by` (a list of (column, descending), most important first; sort with repeated stable sorts, the last key first) is given.
      Then apply `limit` (a number) and finally keep only the listed `columns` (all columns if None, and in the order given). Use find_rids."""
      table = get_table(db, name)
      for col in [c for c, o, v in where] + list(columns or []) + [c for c, d in (order_by or [])]:
          if col not in table["columns"]:
              raise ValueError("unknown column " + col)
      rows = [dict(table["rows"][rid]) for rid in find_rids(table, where)]
      for col, desc in reversed(order_by or []):
          rows.sort(key=lambda r: (r[col] is not None, r[col]), reverse=desc)
      if limit is not None:
          rows = rows[:limit]
      if columns is not None:
          rows = [{c: r[c] for c in columns} for r in rows]
      return rows


  def update(db, name, where, changes):
      """Set the columns in `changes` (a dict) in every matching row; return how many rows were changed. Validate with check_values. If the key column is changed: ValueError('key cannot be null') for None, and ValueError('duplicate key') if more than one row matches or another row already has that value.
      For each row: if a transaction is active log ('update', name, rid, copy of the old row), remove it from the indexes, change it, add it back."""
      table = get_table(db, name)
      check_values(table, changes)
      rids = find_rids(table, where)
      k = table["key"]
      if k and k in changes:
          if changes[k] is None:
              raise ValueError("key cannot be null")
          if len(rids) > 1 or any(r[k] == changes[k] and rid not in rids for rid, r in table["rows"].items()):
              raise ValueError("duplicate key")
      for rid in rids:
          old = dict(table["rows"][rid])
          if db["txn"] is not None:
              db["txn"].append(("update", name, rid, old))
          index_remove(table, rid, old)
          table["rows"][rid].update(changes)
          index_add(table, rid, table["rows"][rid])
      return len(rids)


  def delete(db, name, where):
      """Delete every matching row (remove it from the table and the indexes) and return how many were deleted. If a transaction is active log ('delete', name, rid, the row) for each."""
      table = get_table(db, name)
      for col, op, v in where:
          if col not in table["columns"]:
              raise ValueError("unknown column " + col)
      rids = find_rids(table, where)
      for rid in rids:
          row = table["rows"].pop(rid)
          index_remove(table, rid, row)
          if db["txn"] is not None:
              db["txn"].append(("delete", name, rid, row))
      return len(rids)


  def begin(db):
      """Start a transaction: db['txn'] = []. ValueError('transaction already active') if there is one."""
      if db["txn"] is not None:
          raise ValueError("transaction already active")
      db["txn"] = []


  def commit(db):
      """Keep the changes: db['txn'] = None. ValueError('no active transaction') if there is none."""
      if db["txn"] is None:
          raise ValueError("no active transaction")
      db["txn"] = None


  def rollback(db):
      """Undo everything done since begin: go through the undo log in REVERSE order. 'insert': remove the row (and its index entries); 'delete': put the row back under its old id (and into the indexes); 'update': take the changed row out of the indexes and restore the old copy (and index it).
      Then db['txn'] = None. ValueError('no active transaction') if there is none."""
      if db["txn"] is None:
          raise ValueError("no active transaction")
      log = db["txn"]
      db["txn"] = None
      for entry in reversed(log):
          table = db["tables"][entry[1]]
          rid = entry[2]
          if entry[0] == "insert":
              index_remove(table, rid, table["rows"].pop(rid))
          elif entry[0] == "delete":
              table["rows"][rid] = entry[3]
              index_add(table, rid, entry[3])
          else:
              index_remove(table, rid, table["rows"][rid])
              table["rows"][rid] = entry[3]
              index_add(table, rid, entry[3])
