# Terms introduced in Unit 26 (Computer Graphics). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Raster
  definition: A picture stored as a grid of pixels.
  lesson: u26-raster
- term: Canvas
  definition: A grid of pixels that a program draws on.
  lesson: u26-raster
- term: Rasterization
  definition: Turning shapes such as lines and triangles into the pixels that show them.
  lesson: u26-raster
- term: Clipping
  definition: Ignoring the parts of a shape that fall outside the drawing area.
  lesson: u26-raster
- term: Bresenham's algorithm
  definition: A line-drawing method that uses only whole numbers to choose the pixels nearest to a line.
  lesson: u26-raster
- term: Midpoint circle algorithm
  definition: A way to draw a circle by walking around one eighth of it and mirroring the points.
  lesson: u26-raster
- term: Edge function
  definition: A formula whose sign tells which side of a line a point is on.
  lesson: u26-raster
- term: Barycentric coordinates
  definition: Three weights that add to 1 and say how much of each corner of a triangle a point is made of.
  lesson: u26-raster
- term: Flood fill
  definition: Filling a region by spreading from a starting pixel to all connected pixels of the same colour.
  lesson: u26-raster
- term: Scanline fill
  definition: Filling a shape one horizontal row of pixels at a time.
  lesson: u26-raster
- term: Even-odd rule
  definition: A rule that decides a point is inside a shape if a ray from it crosses the outline an odd number of times.
  lesson: u26-raster
- term: Polyline
  definition: A path made of connected straight line segments.
  lesson: u26-raster
- term: Blit
  definition: Copying a block of pixels from one picture onto another.
  lesson: u26-raster
- term: Normalize
  definition: To divide a vector by its length so that its length becomes 1.
  lesson: u26-transforms
- term: Transformation
  definition: A rule that moves, turns or stretches points.
  lesson: u26-transforms
- term: Translation
  definition: A transformation that moves every point by the same amount.
  lesson: u26-transforms
- term: Scaling
  definition: A transformation that stretches or shrinks.
  lesson: u26-transforms
- term: Rotation
  definition: A transformation that turns points about a centre or an axis.
  lesson: u26-transforms
- term: Homogeneous coordinates
  definition: Points written with an extra coordinate of 1 so that moving can be done by matrix multiplication.
  lesson: u26-transforms
- term: Perspective projection
  definition: Drawing 3D points on a flat screen so that farther things look smaller.
  lesson: u26-transforms
- term: Picture plane
  definition: The flat surface on which a 3D scene is projected.
  lesson: u26-transforms
- term: Wireframe
  definition: A drawing of a 3D object that shows only its edges.
  lesson: u26-transforms
- term: Vertex
  definition: A corner point of a shape or model.
  lesson: u26-transforms
- term: Edge
  definition: A line joining two vertices.
  lesson: u26-transforms
- term: RGB
  definition: A way to describe colour as amounts of red, green and blue.
  lesson: u26-color
- term: Channel
  definition: One of the numbers that make up a colour, such as the red part.
  lesson: u26-color
- term: Hex colour
  definition: 'A colour written as a hash sign and six hexadecimal digits, such as #ff8800.'
  lesson: u26-color
- term: HSV
  definition: A way to describe colour as hue, saturation and value.
  lesson: u26-color
- term: Hue
  definition: Which colour it is, given as an angle on the colour wheel.
  lesson: u26-color
- term: Saturation
  definition: How vivid a colour is; zero is grey.
  lesson: u26-color
- term: Value
  definition: How bright a colour is in the HSV model.
  lesson: u26-color
- term: Alpha
  definition: A number saying how opaque a colour is, from 0 invisible to 1 solid.
  lesson: u26-color
- term: Alpha blending
  definition: Mixing a semi-transparent colour with the colour behind it.
  lesson: u26-color
- term: Interpolation
  definition: Finding values between two known values.
  lesson: u26-color
- term: Luminance
  definition: How bright a colour looks to the human eye.
  lesson: u26-color
- term: Greyscale
  definition: A picture that has only shades of grey.
  lesson: u26-color
- term: Gamma
  definition: A power curve used to store brightness so that dark tones get more numbers.
  lesson: u26-color
- term: Dithering
  definition: Using a pattern of dots to fake shades that a display cannot show.
  lesson: u26-color
- term: Threshold
  definition: A cut-off value that splits things into two groups.
  lesson: u26-color
- term: Convolution
  definition: Sliding a small grid of weights over an image to compute each new pixel from its neighbours.
  lesson: u26-color
- term: Blur
  definition: An effect that averages each pixel with its neighbours.
  lesson: u26-color
- term: Edge detection
  definition: Finding the places in a picture where brightness changes sharply.
  lesson: u26-color
- term: Ray
  definition: A starting point and a direction, used to follow a line of sight or light.
  lesson: u26-raytrace
- term: Ray tracing
  definition: Making a picture by following rays from the camera into a scene.
  lesson: u26-raytrace
- term: Discriminant
  definition: The part of the quadratic formula under the square root, which tells whether there are real solutions.
  lesson: u26-raytrace
- term: Quadratic equation
  definition: An equation of the form a t squared plus b t plus c equals zero.
  lesson: u26-raytrace
- term: Surface normal
  definition: A vector at right angles to a surface, pointing outward.
  lesson: u26-raytrace
- term: Lambert's law
  definition: The rule that a surface is brightest when facing the light and darker as it turns away.
  lesson: u26-raytrace
- term: Ambient light
  definition: A small constant light that stands in for light bouncing around everywhere.
  lesson: u26-raytrace
- term: Shadow ray
  definition: A ray sent from a surface point toward a light to see whether something blocks it.
  lesson: u26-raytrace
- term: Mesh
  definition: A model built from many triangles.
  lesson: u26-shading
- term: Back-face culling
  definition: Skipping triangles that face away from the camera.
  lesson: u26-shading
- term: Phong lighting
  definition: A model that adds ambient, diffuse and specular light.
  lesson: u26-shading
- term: Diffuse light
  definition: The matte brightness of a surface from light that scatters in all directions.
  lesson: u26-shading
- term: Specular highlight
  definition: The bright shiny spot where light reflects straight toward the eye.
  lesson: u26-shading
- term: Shininess
  definition: A number that controls how small and sharp a specular highlight is.
  lesson: u26-shading
- term: Flat shading
  definition: Lighting each triangle with one brightness.
  lesson: u26-shading
- term: Gouraud shading
  definition: Lighting the corners of a triangle and blending the brightness across it.
  lesson: u26-shading
- term: Shader
  definition: A small program that runs on the graphics card to compute colours.
  lesson: u26-shading
- term: Depth buffer
  definition: A grid that remembers the distance of the nearest surface drawn at each pixel.
  lesson: u26-shading
- term: Painter's algorithm
  definition: Drawing the farthest objects first so that nearer ones cover them.
  lesson: u26-shading
- term: Linear interpolation
  definition: Finding a value a fraction of the way between two values.
  lesson: u26-curves
- term: Bezier curve
  definition: A smooth curve shaped by a few control points.
  lesson: u26-curves
- term: Control point
  definition: A point that pulls a curve toward it.
  lesson: u26-curves
- term: De Casteljau's algorithm
  definition: A way to find a point on a Bezier curve by repeated linear interpolation.
  lesson: u26-curves
- term: Bernstein polynomial
  definition: The weight that tells how strongly one control point pulls a Bezier curve.
  lesson: u26-curves
- term: Tangent
  definition: The direction a curve is travelling at a point.
  lesson: u26-curves
- term: Spline
  definition: A smooth curve that passes through a list of points.
  lesson: u26-curves
- term: Catmull-Rom spline
  definition: A spline whose shape in each segment is guided by the points on either side.
  lesson: u26-curves
- term: Smoothstep
  definition: An S-shaped function that eases from 0 to 1.
  lesson: u26-curves
- term: Value noise
  definition: Smooth randomness made by blending random values at whole numbers.
  lesson: u26-curves
- term: Octave
  definition: One layer of fractal noise, twice as detailed and half as strong as the one before.
  lesson: u26-curves
- term: Fractal
  definition: A shape that has detail at every scale.
  lesson: u26-curves
- term: Complex number
  definition: A number with a real part and an imaginary part.
  lesson: u26-curves
- term: Mandelbrot set
  definition: The set of complex numbers c for which repeating z squared plus c from zero stays bounded.
  lesson: u26-curves
- term: Keyframe
  definition: A chosen moment with a given value, from which the in-between values are computed.
  lesson: u26-animation
- term: Tweening
  definition: Computing the in-between values of an animation.
  lesson: u26-animation
- term: Easing function
  definition: A function that shapes how fast a value changes over time.
  lesson: u26-animation
- term: Numerical integration
  definition: Simulating motion by adding up many small changes.
  lesson: u26-animation
- term: Euler integration
  definition: 'The simplest integration method: change velocity by acceleration times a small time step, and position by velocity
    times the step.'
  lesson: u26-animation
- term: Verlet integration
  definition: An integration method that stores the previous position instead of a velocity.
  lesson: u26-animation
- term: Time step
  definition: The small amount of time covered by one update of a simulation.
  lesson: u26-animation
- term: Acceleration
  definition: The rate at which velocity changes.
  lesson: u26-animation
- term: Restitution
  definition: How much of its speed an object keeps when it bounces.
  lesson: u26-animation
- term: Hooke's law
  definition: The rule that a spring pulls back with a force proportional to how far it is stretched.
  lesson: u26-animation
- term: Damping
  definition: Friction that removes energy from a moving system.
  lesson: u26-animation
- term: Collision detection
  definition: Finding out whether two objects overlap.
  lesson: u26-animation
- term: Particle system
  definition: Many small short-lived objects used to make effects such as fire or smoke.
  lesson: u26-animation
- term: Game loop
  definition: A loop that repeatedly reads input, updates the simulation and draws.
  lesson: u26-animation
- term: Fixed time step
  definition: Updating a simulation in equal steps of time regardless of how long frames take.
  lesson: u26-animation
