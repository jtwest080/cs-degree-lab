id: u26-raster
title: Pixels, Lines and Triangles
minutes: 90
objective: Learn how computers turn shapes into pictures. You will build a canvas of pixels, draw lines with Bresenham's algorithm, rasterize triangles with the edge function, draw circles, fill regions, and fill any polygon with scanlines.
outcomes:
- Explain what a pixel and a framebuffer are
- Draw lines with integer arithmetic
- Fill a triangle using the edge function
- Compute barycentric coordinates
- Draw circles and flood-fill regions
- Fill polygons with the even-odd rule
sections:
- heading: Pixels and the framebuffer
  body: |-
    Everything you see on a screen is made of **pixels**, tiny coloured squares arranged in a grid. A 1920 by 1080 display has over two million of them. The program keeps the current picture in memory as a **framebuffer**: one number (or three, for red, green and blue) for each pixel. To draw something, a program changes values in the framebuffer, and the display hardware reads it about 60 times a second.

    By convention the origin `(0, 0)` is the **top-left** corner, `x` grows to the right and `y` grows **downward**, the opposite of the graphs in maths class. We will use a canvas of text characters instead of colours so that every picture can be printed. Drawing code must also deal with shapes that stick out of the screen: **clipping** means simply ignoring pixels outside the canvas. A **sprite** (a small picture such as a game character) is placed on the screen by copying its pixels with a **blit** (bit-block transfer), usually skipping one "transparent" value.
- heading: Lines and circles
  body: |-
    A line between two points in a maths book is perfectly thin and smooth, but a screen can only light whole pixels, so we must choose which ones. A simple method is to step along x and compute y from the slope with fractions, but division and rounding are slow. **Bresenham's algorithm** (1962) uses only integer addition. It keeps a running **error** that says how far the pixel row is from the ideal line, and at each step moves sideways, or sideways and up, depending on that error. Because it is so cheap, variants of it are still used inside graphics hardware.

    The **midpoint circle algorithm** works the same way. It computes only one eighth of the circle, from the top going around to the 45-degree point, and uses **symmetry** to mirror each point into the other seven eighths, again using an integer decision value. A **flood fill** colours a whole region: starting at one pixel it spreads to neighbours of the same colour, up, down, left and right, using a stack of pixels still to visit. It is the paint bucket of every drawing program.
- heading: Triangles
  body: |-
    Almost every 3D scene on screen, from a game character to a car in a film, is built from thousands or millions of **triangles**, because three points always lie in one flat plane and a triangle has no awkward cases. Filling a triangle is called **rasterization**. The modern method uses the **edge function**: for a line from point a to point b and a pixel p, the value `(bx-ax)*(py-ay) - (by-ay)*(px-ax)` is positive on one side of the line, negative on the other and zero exactly on it. A pixel is inside the triangle when it is on the same side of all three edges. We only need to test pixels inside the triangle's **bounding box**, the smallest rectangle around it.

    The same three numbers, divided by the area, are the **barycentric coordinates** (u, v, w) of the pixel: they say how much of each corner the point is made of, always adding up to 1. They are used to **interpolate**, that is, to blend any value defined at the corners (a colour, a texture position, a depth) smoothly across the triangle. Graphics cards do this for every pixel of every triangle, billions of times per second.
- heading: Filling any polygon
  body: 'For general shapes there is the **scanline** method. For each row of pixels, find where the outline crosses the middle of that row, sort the crossings from left to right, and fill between the first and second crossing, then between the third and fourth, and so on. This is the **even-odd rule**: a point is inside if a ray from it crosses the outline an odd number of times. It handles concave shapes such as an L or a star, and shapes with holes, and it is how fonts, icons and vector graphics are turned into pixels.'
examples:
- title: A picture in text
  intro: A frame, a Bresenham line and a circle on a text canvas.
  code: |
    def new_canvas(width, height, fill="."):
        """A CANVAS is a grid of characters standing for pixels: a list of `height` rows, each a list of `width` copies of `fill`. The pixel at column x and row y is canvas[y][x] and (0, 0) is the TOP-LEFT corner. ValueError('bad size') if width or height is less than 1."""
        if width < 1 or height < 1:
            raise ValueError("bad size")
        return [[fill] * width for _ in range(height)]


    def set_pixel(canvas, x, y, ch):
        """Set one pixel. Positions outside the canvas are CLIPPED: ignored. Return True if the pixel was set, False if it was outside."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]):
            canvas[y][x] = ch
            return True
        return False


    def get_pixel(canvas, x, y):
        """The character at (x, y), or None if the position is outside the canvas."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]):
            return canvas[y][x]
        return None


    def canvas_to_text(canvas):
        """The picture as text: each row joined into a string, rows joined with newlines (no trailing newline)."""
        return "\n".join("".join(row) for row in canvas)


    def count_pixels(canvas, ch):
        """How many pixels equal ch."""
        return sum(row.count(ch) for row in canvas)


    def blit(dst, src, x, y, transparent=" "):
        """BLIT (copy) the picture `src` onto `dst` with its top-left corner at (x, y). Pixels of src equal to `transparent` are skipped; anything falling outside dst is clipped. Return how many pixels were copied."""
        n = 0
        for j, row in enumerate(src):
            for i, ch in enumerate(row):
                if ch != transparent and set_pixel(dst, x + i, y + j, ch):
                    n += 1
        return n


    def line_points(x0, y0, x1, y1):
        """The pixels of a line from (x0, y0) to (x1, y1) INCLUSIVE, using BRESENHAM'S algorithm, which needs only integers: dx = |x1 - x0|, dy = -|y1 - y0|, sx = 1 if x0 < x1 else -1, sy = 1 if y0 < y1 else -1, err = dx + dy.
        Loop: record (x0, y0); stop if it is the end point; e2 = 2 * err; if e2 >= dy: err += dy and x0 += sx; if e2 <= dx: err += dx and y0 += sy. Return the list of (x, y) in drawing order."""
        dx, dy = abs(x1 - x0), -abs(y1 - y0)
        sx = 1 if x0 < x1 else -1
        sy = 1 if y0 < y1 else -1
        err = dx + dy
        pts = []
        while True:
            pts.append((x0, y0))
            if x0 == x1 and y0 == y1:
                return pts
            e2 = 2 * err
            if e2 >= dy:
                err += dy
                x0 += sx
            if e2 <= dx:
                err += dx
                y0 += sy


    def draw_line(canvas, x0, y0, x1, y1, ch):
        """Draw a line with line_points (clipped by set_pixel). Return the number of pixels that were actually set."""
        return sum(1 for x, y in line_points(x0, y0, x1, y1) if set_pixel(canvas, x, y, ch))


    def draw_rect(canvas, x, y, w, h, ch, filled=False):
        """A rectangle with its top-left corner at (x, y), w wide and h tall. Outline only unless filled=True. Return the number of pixels set (clipped ones not counted). A rectangle with w < 1 or h < 1 draws nothing and returns 0."""
        if w < 1 or h < 1:
            return 0
        n = 0
        for j in range(y, y + h):
            for i in range(x, x + w):
                edge = j in (y, y + h - 1) or i in (x, x + w - 1)
                if (filled or edge) and set_pixel(canvas, i, j, ch):
                    n += 1
        return n


    def draw_polyline(canvas, points, ch, closed=False):
        """Draw lines between consecutive (x, y) points (and from the last back to the first if closed). Return the number of DISTINCT pixels set. Fewer than 2 points: draw nothing, return 0."""
        if len(points) < 2:
            return 0
        segments = list(zip(points, points[1:]))
        if closed:
            segments.append((points[-1], points[0]))
        seen = set()
        for (ax, ay), (bx, by) in segments:
            for p in line_points(ax, ay, bx, by):
                if set_pixel(canvas, p[0], p[1], ch):
                    seen.add(p)
        return len(seen)


    def circle_points(cx, cy, r):
        """The pixels of a circle outline by the MIDPOINT algorithm using only integers, as a SET. Start with x = r, y = 0, d = 1 - r. While x >= y: add the 8 mirror images (cx +- x, cy +- y) and (cx +- y, cy +- x); then y += 1 and if d < 0 then d += 2 * y + 1 else x -= 1 and d += 2 * (y - x) + 1.
        ValueError('bad radius') if r < 0. A radius of 0 gives just the centre."""
        if r < 0:
            raise ValueError("bad radius")
        x, y, d = r, 0, 1 - r
        pts = set()
        while x >= y:
            for px, py in ((x, y), (y, x), (-x, y), (-y, x), (x, -y), (y, -x), (-x, -y), (-y, -x)):
                pts.add((cx + px, cy + py))
            y += 1
            if d < 0:
                d += 2 * y + 1
            else:
                x -= 1
                d += 2 * (y - x) + 1
        return pts


    def draw_circle(canvas, cx, cy, r, ch, filled=False):
        """Draw a circle: the outline from circle_points, or if filled=True every pixel whose distance from the centre satisfies (x - cx) ** 2 + (y - cy) ** 2 <= r * r + r (so the disc covers its outline). Clip to the canvas and return the number of pixels set."""
        n = 0
        if filled:
            for y in range(cy - r, cy + r + 1):
                for x in range(cx - r, cx + r + 1):
                    if (x - cx) ** 2 + (y - cy) ** 2 <= r * r + r and set_pixel(canvas, x, y, ch):
                        n += 1
            return n
        return sum(1 for x, y in circle_points(cx, cy, r) if set_pixel(canvas, x, y, ch))


    def flood_fill(canvas, x, y, ch):
        """FLOOD FILL (the paint bucket): replace the region of pixels connected to (x, y) UP, DOWN, LEFT and RIGHT that have the same character as (x, y) by ch. Use a stack, not recursion. Return the number of pixels changed; 0 if (x, y) is outside the canvas or already equal to ch."""
        old = get_pixel(canvas, x, y)
        if old is None or old == ch:
            return 0
        stack = [(x, y)]
        n = 0
        while stack:
            px, py = stack.pop()
            if get_pixel(canvas, px, py) != old:
                continue
            canvas[py][px] = ch
            n += 1
            stack.extend(((px + 1, py), (px - 1, py), (px, py + 1), (px, py - 1)))
        return n

    c = new_canvas(21, 9)
    draw_rect(c, 0, 0, 21, 9, "#")
    draw_line(c, 1, 1, 19, 7, "*")
    draw_circle(c, 15, 3, 2, "o")
    print(canvas_to_text(c))
    print("hash pixels:", count_pixels(c, "#"), "| line points from (0,0) to (7,3):", line_points(0, 0, 7, 3))
  output: |
