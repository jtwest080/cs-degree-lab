    def new_canvas(width, height, fill="."):
        """A CANVAS is a grid of characters standing for pixels: a list of `height` rows, each a list of `width` copies of `fill`. The pixel at column x and row y is canvas[y][x] and (0, 0) is the TOP-LEFT corner. ValueError('bad size') if width or height is less than 1."""
        if width < 1 or height < 1:
            raise ValueError("bad size")
        return [[fill] * width for _ in range(height)]


    def set_pixel(canvas, x, y, ch):
        """Set one pixel. Positions outside the canvas are CLIPPED: ignored. Return True if the pixel was set, False if it was outside."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]):
            canvas[y][x] = ch
            return True
        return False


    def get_pixel(canvas, x, y):
        """The character at (x, y), or None if the position is outside the canvas."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]):
            return canvas[y][x]
        return None


    def canvas_to_text(canvas):
        """The picture as text: each row joined into a string, rows joined with newlines (no trailing newline)."""
        return "\n".join("".join(row) for row in canvas)


    def count_pixels(canvas, ch):
        """How many pixels equal ch."""
        return sum(row.count(ch) for row in canvas)


    def blit(dst, src, x, y, transparent=" "):
        """BLIT (copy) the picture `src` onto `dst` with its top-left corner at (x, y). Pixels of src equal to `transparent` are skipped; anything falling outside dst is clipped. Return how many pixels were copied."""
        n = 0
        for j, row in enumerate(src):
            for i, ch in enumerate(row):
                if ch != transparent and set_pixel(dst, x + i, y + j, ch):
                    n += 1
        return n


    def line_points(x0, y0, x1, y1):
        """The pixels of a line from (x0, y0) to (x1, y1) INCLUSIVE, using BRESENHAM'S algorithm, which needs only integers: dx = |x1 - x0|, dy = -|y1 - y0|, sx = 1 if x0 < x1 else -1, sy = 1 if y0 < y1 else -1, err = dx + dy.
        Loop: record (x0, y0); stop if it is the end point; e2 = 2 * err; if e2 >= dy: err += dy and x0 += sx; if e2 <= dx: err += dx and y0 += sy. Return the list of (x, y) in drawing order."""
        dx, dy = abs(x1 - x0), -abs(y1 - y0)
        sx = 1 if x0 < x1 else -1
        sy = 1 if y0 < y1 else -1
        err = dx + dy
        pts = []
        while True:
            pts.append((x0, y0))
            if x0 == x1 and y0 == y1:
                return pts
            e2 = 2 * err
            if e2 >= dy:
                err += dy
                x0 += sx
            if e2 <= dx:
                err += dx
                y0 += sy


    def draw_line(canvas, x0, y0, x1, y1, ch):
        """Draw a line with line_points (clipped by set_pixel). Return the number of pixels that were actually set."""
        return sum(1 for x, y in line_points(x0, y0, x1, y1) if set_pixel(canvas, x, y, ch))


    def draw_rect(canvas, x, y, w, h, ch, filled=False):
        """A rectangle with its top-left corner at (x, y), w wide and h tall. Outline only unless filled=True. Return the number of pixels set (clipped ones not counted). A rectangle with w < 1 or h < 1 draws nothing and returns 0."""
        if w < 1 or h < 1:
            return 0
        n = 0
        for j in range(y, y + h):
            for i in range(x, x + w):
                edge = j in (y, y + h - 1) or i in (x, x + w - 1)
                if (filled or edge) and set_pixel(canvas, i, j, ch):
                    n += 1
        return n


    def draw_polyline(canvas, points, ch, closed=False):
        """Draw lines between consecutive (x, y) points (and from the last back to the first if closed). Return the number of DISTINCT pixels set. Fewer than 2 points: draw nothing, return 0."""
        if len(points) < 2:
            return 0
        segments = list(zip(points, points[1:]))
        if closed:
            segments.append((points[-1], points[0]))
        seen = set()
        for (ax, ay), (bx, by) in segments:
            for p in line_points(ax, ay, bx, by):
                if set_pixel(canvas, p[0], p[1], ch):
                    seen.add(p)
        return len(seen)
  explanation: Bresenham's algorithm draws a line with no division and no floating-point numbers, which made it fast on 1960s hardware and still useful today.
