  tests:
  - name: making and reading
    code: |
      c = new_canvas(4, 2)
      assert c == [[".", ".", ".", "."], [".", ".", ".", "."]]
      c[0][0] = "x"
      assert c[1][0] == "." and canvas_to_text(c) == "x...\n...."
      assert get_pixel(c, 0, 0) == "x" and get_pixel(c, 3, 1) == "." and get_pixel(c, 4, 0) is None and get_pixel(c, 0, -1) is None
      assert new_canvas(2, 2, "#") == [["#", "#"], ["#", "#"]]
      for size in ((0, 3), (3, 0)):
          try:
              new_canvas(*size)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad size" in str(e)
  - name: clipping
    code: |
      c = new_canvas(3, 3)
      assert set_pixel(c, 1, 1, "#") is True and set_pixel(c, 3, 1, "#") is False and set_pixel(c, -1, 0, "#") is False and set_pixel(c, 0, 3, "#") is False
      assert canvas_to_text(c) == "...\n.#.\n..." and count_pixels(c, "#") == 1 and count_pixels(c, ".") == 8
  - name: copying a picture
    code: |
      dst = new_canvas(5, 3)
      sprite = [list("ab"), list(" c")]
      assert blit(dst, sprite, 1, 1) == 3
      assert canvas_to_text(dst) == ".....\n.ab..\n..c.."
      assert blit(dst, sprite, 4, 2) == 1 and get_pixel(dst, 4, 2) == "a"
      assert blit(dst, sprite, -1, -1) == 1 and get_pixel(dst, 0, 0) == "c"
      assert blit(dst, sprite, 9, 9) == 0
      assert blit(new_canvas(2, 1), [list("xy")], 0, 0, transparent="x") == 1
  hints:
  - Check 0 <= y < len(canvas) and 0 <= x < len(canvas[0]) before touching a pixel.
  solution: |
    def new_canvas(width, height, fill="."):
