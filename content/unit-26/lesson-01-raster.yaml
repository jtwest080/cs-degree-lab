- title: Triangles and polygons
  intro: A rasterized triangle and a concave polygon, with barycentric coordinates and a flood fill.
  code: |
    def new_canvas(width, height, fill="."):
        """A CANVAS is a grid of characters standing for pixels: a list of `height` rows, each a list of `width` copies of `fill`. The pixel at column x and row y is canvas[y][x] and (0, 0) is the TOP-LEFT corner. ValueError('bad size') if width or height is less than 1."""
        if width < 1 or height < 1:
            raise ValueError("bad size")
        return [[fill] * width for _ in range(height)]


    def set_pixel(canvas, x, y, ch):
        """Set one pixel. Positions outside the canvas are CLIPPED: ignored. Return True if the pixel was set, False if it was outside."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]):
            canvas[y][x] = ch
            return True
        return False


    def get_pixel(canvas, x, y):
        """The character at (x, y), or None if the position is outside the canvas."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]):
            return canvas[y][x]
        return None


    def canvas_to_text(canvas):
        """The picture as text: each row joined into a string, rows joined with newlines (no trailing newline)."""
        return "\n".join("".join(row) for row in canvas)


    def count_pixels(canvas, ch):
        """How many pixels equal ch."""
        return sum(row.count(ch) for row in canvas)


    def blit(dst, src, x, y, transparent=" "):
        """BLIT (copy) the picture `src` onto `dst` with its top-left corner at (x, y). Pixels of src equal to `transparent` are skipped; anything falling outside dst is clipped. Return how many pixels were copied."""
        n = 0
        for j, row in enumerate(src):
            for i, ch in enumerate(row):
                if ch != transparent and set_pixel(dst, x + i, y + j, ch):
                    n += 1
        return n


    def edge(ax, ay, bx, by, px, py):
        """The EDGE FUNCTION: (bx - ax) * (py - ay) - (by - ay) * (px - ax). It is positive on one side of the line from a to b, negative on the other and zero on the line (it is also twice the signed area of the triangle a, b, p)."""
        return (bx - ax) * (py - ay) - (by - ay) * (px - ax)


    def inside_triangle(px, py, a, b, c):
        """True if the point is inside the triangle a, b, c (each an (x, y) pair) or ON its boundary, whichever way the corners are ordered: the three edge function values must be all >= 0 or all <= 0."""
        w0 = edge(b[0], b[1], c[0], c[1], px, py)
        w1 = edge(c[0], c[1], a[0], a[1], px, py)
        w2 = edge(a[0], a[1], b[0], b[1], px, py)
        return (w0 >= 0 and w1 >= 0 and w2 >= 0) or (w0 <= 0 and w1 <= 0 and w2 <= 0)


    def barycentric(px, py, a, b, c):
        """The BARYCENTRIC COORDINATES (u, v, w) of the point: how much of each corner it is made of, with u + v + w = 1 and point = u * a + v * b + w * c. Compute u = edge(b, c, p) / area, v = edge(c, a, p) / area, w = edge(a, b, p) / area where area = edge(a, b, c).
        Round each to 4 decimals. ValueError('degenerate triangle') if the area is 0."""
        area = edge(a[0], a[1], b[0], b[1], c[0], c[1])
        if area == 0:
            raise ValueError("degenerate triangle")
        u = edge(b[0], b[1], c[0], c[1], px, py) / area
        v = edge(c[0], c[1], a[0], a[1], px, py) / area
        w = edge(a[0], a[1], b[0], b[1], px, py) / area
        return (round(u, 4), round(v, 4), round(w, 4))


    def fill_triangle(canvas, a, b, c, ch):
        """RASTERIZE a triangle: test every pixel (x, y) of the triangle's bounding box (clipped to the canvas) with inside_triangle and set it to ch. A degenerate (zero-area) triangle draws nothing. Return the number of pixels set."""
        if edge(a[0], a[1], b[0], b[1], c[0], c[1]) == 0:
            return 0
        xs, ys = [a[0], b[0], c[0]], [a[1], b[1], c[1]]
        n = 0
        for y in range(max(min(ys), 0), min(max(ys), len(canvas) - 1) + 1):
            for x in range(max(min(xs), 0), min(max(xs), len(canvas[0]) - 1) + 1):
                if inside_triangle(x, y, a, b, c):
                    canvas[y][x] = ch
                    n += 1
        return n


    def circle_points(cx, cy, r):
        """The pixels of a circle outline by the MIDPOINT algorithm using only integers, as a SET. Start with x = r, y = 0, d = 1 - r. While x >= y: add the 8 mirror images (cx +- x, cy +- y) and (cx +- y, cy +- x); then y += 1 and if d < 0 then d += 2 * y + 1 else x -= 1 and d += 2 * (y - x) + 1.
        ValueError('bad radius') if r < 0. A radius of 0 gives just the centre."""
        if r < 0:
            raise ValueError("bad radius")
        x, y, d = r, 0, 1 - r
        pts = set()
        while x >= y:
            for px, py in ((x, y), (y, x), (-x, y), (-y, x), (x, -y), (y, -x), (-x, -y), (-y, -x)):
                pts.add((cx + px, cy + py))
            y += 1
            if d < 0:
                d += 2 * y + 1
            else:
                x -= 1
                d += 2 * (y - x) + 1
        return pts


    def draw_circle(canvas, cx, cy, r, ch, filled=False):
        """Draw a circle: the outline from circle_points, or if filled=True every pixel whose distance from the centre satisfies (x - cx) ** 2 + (y - cy) ** 2 <= r * r + r (so the disc covers its outline). Clip to the canvas and return the number of pixels set."""
        n = 0
        if filled:
            for y in range(cy - r, cy + r + 1):
                for x in range(cx - r, cx + r + 1):
                    if (x - cx) ** 2 + (y - cy) ** 2 <= r * r + r and set_pixel(canvas, x, y, ch):
                        n += 1
            return n
        return sum(1 for x, y in circle_points(cx, cy, r) if set_pixel(canvas, x, y, ch))


    def flood_fill(canvas, x, y, ch):
        """FLOOD FILL (the paint bucket): replace the region of pixels connected to (x, y) UP, DOWN, LEFT and RIGHT that have the same character as (x, y) by ch. Use a stack, not recursion. Return the number of pixels changed; 0 if (x, y) is outside the canvas or already equal to ch."""
        old = get_pixel(canvas, x, y)
        if old is None or old == ch:
            return 0
        stack = [(x, y)]
        n = 0
        while stack:
            px, py = stack.pop()
            if get_pixel(canvas, px, py) != old:
                continue
            canvas[py][px] = ch
            n += 1
            stack.extend(((px + 1, py), (px - 1, py), (px, py + 1), (px, py - 1)))
        return n


    def fill_polygon(canvas, points, ch):
        """SCANLINE FILL of a polygon with the EVEN-ODD rule. For every pixel row y (clipped to the canvas) look at the height y + 0.5, the centre of the row. Every edge (x0, y0)-(x1, y1) with y0 != y1 that has min(y0, y1) <= y + 0.5 < max(y0, y1) crosses that height at
        x = x0 + (y + 0.5 - y0) * (x1 - x0) / (y1 - y0). Sort the crossings; take them in pairs (a, b); every pixel x with a <= x + 0.5 < b is inside (x from ceil(a - 0.5) up to ceil(b - 0.5) - 1). Set those pixels (clipped) and return how many were set.
        The polygon is closed automatically. Fewer than 3 points: draw nothing, return 0."""
        import math
        if len(points) < 3:
            return 0
        n = 0
        for y in range(len(canvas)):
            yc = y + 0.5
            xs = []
            for (x0, y0), (x1, y1) in zip(points, points[1:] + points[:1]):
                if y0 != y1 and min(y0, y1) <= yc < max(y0, y1):
                    xs.append(x0 + (yc - y0) * (x1 - x0) / (y1 - y0))
            xs.sort()
            for a, b in zip(xs[0::2], xs[1::2]):
                for x in range(math.ceil(a - 0.5), math.ceil(b - 0.5)):
                    if set_pixel(canvas, x, y, ch):
                        n += 1
        return n

    c = new_canvas(24, 10)
    fill_triangle(c, (1, 8), (10, 8), (5, 1), "#")
    fill_polygon(c, [(13, 1), (22, 1), (22, 8), (19, 8), (19, 4), (16, 4), (16, 8), (13, 8)], "+")
    print(canvas_to_text(c))
    print("barycentric coordinates of (5, 5):", barycentric(5, 5, (1, 8), (10, 8), (5, 1)))
    print("paint bucket filled", flood_fill(c, 0, 0, "~"), "background pixels")
