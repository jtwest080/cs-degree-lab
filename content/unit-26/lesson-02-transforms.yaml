    def dot(a, b):
        """The DOT PRODUCT: the sum of the products of matching components. It is |a| |b| cos(angle between them), so it is 0 for perpendicular vectors. ValueError('size mismatch') if the lengths differ."""
        if len(a) != len(b):
            raise ValueError("size mismatch")
        return sum(x * y for x, y in zip(a, b))


    def cross(a, b):
