    import math


    def vec_add(a, b):
        """The sum of two vectors (tuples or lists of the same length) as a TUPLE. ValueError('size mismatch') if the lengths differ."""
        if len(a) != len(b):
            raise ValueError("size mismatch")
        return tuple(x + y for x, y in zip(a, b))


    def vec_sub(a, b):
        """a minus b as a tuple (same error as vec_add)."""
        if len(a) != len(b):
            raise ValueError("size mismatch")
        return tuple(x - y for x, y in zip(a, b))


    def vec_scale(a, k):
        """Every component of the vector times the number k, as a tuple."""
        return tuple(x * k for x in a)


    def dot(a, b):
        """The DOT PRODUCT: the sum of the products of matching components. It is |a| |b| cos(angle between them), so it is 0 for perpendicular vectors. ValueError('size mismatch') if the lengths differ."""
        if len(a) != len(b):
            raise ValueError("size mismatch")
        return sum(x * y for x, y in zip(a, b))


    def cross(a, b):
        """The CROSS PRODUCT of two 3D vectors: (a1*b2 - a2*b1, a2*b0 - a0*b2, a0*b1 - a1*b0), a vector perpendicular to both. ValueError('need 3D vectors') unless both have exactly 3 components."""
        if len(a) != 3 or len(b) != 3:
            raise ValueError("need 3D vectors")
        return (a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0])


    def length(a):
        """The length (magnitude) of a vector: the square root of its dot product with itself."""
        return math.sqrt(dot(a, a))


    def normalize(a):
        """The vector divided by its length, so its length becomes 1 (a tuple). ValueError('zero vector') if its length is 0."""
        n = length(a)
        if n == 0:
            raise ValueError("zero vector")
        return tuple(x / n for x in a)


    def identity(n):
        """The n by n IDENTITY MATRIX as a list of rows: 1 on the diagonal, 0 elsewhere. Multiplying by it changes nothing."""
        return [[1 if i == j else 0 for j in range(n)] for i in range(n)]


    def transpose(m):
        """The TRANSPOSE: rows become columns (a new list of lists)."""
        return [list(col) for col in zip(*m)]


    def mat_mul(a, b):
        """Multiply two matrices (lists of rows): the entry in row i, column j of the result is the dot product of row i of a with column j of b. ValueError('shape mismatch') unless the number of columns of a equals the number of rows of b. Matrix multiplication is NOT commutative: a * b is usually not b * a."""
        if len(a[0]) != len(b):
            raise ValueError("shape mismatch")
        return [[sum(a[i][k] * b[k][j] for k in range(len(b))) for j in range(len(b[0]))] for i in range(len(a))]


    def mat_vec(m, v):
        """Multiply a matrix by a vector, returning a TUPLE (entry i is the dot product of row i with v). ValueError('shape mismatch') if the number of columns is not len(v)."""
        if len(m[0]) != len(v):
            raise ValueError("shape mismatch")
        return tuple(sum(m[i][k] * v[k] for k in range(len(v))) for i in range(len(m)))
  explanation: A matrix is a function on vectors; multiplying matrices composes the functions.
