    def length(a):
        """The length (magnitude) of a vector: the square root of its dot product with itself."""
        return math.sqrt(dot(a, a))


    def normalize(a):
        """The vector divided by its length, so its length becomes 1 (a tuple). ValueError('zero vector') if its length is 0."""
        n = length(a)
        if n == 0:
            raise ValueError("zero vector")
        return tuple(x / n for x in a)


    def identity(n):
        """The n by n IDENTITY MATRIX as a list of rows: 1 on the diagonal, 0 elsewhere. Multiplying by it changes nothing."""
        return [[1 if i == j else 0 for j in range(n)] for i in range(n)]


    def transpose(m):
        """The TRANSPOSE: rows become columns (a new list of lists)."""
        return [list(col) for col in zip(*m)]


    def mat_mul(a, b):
        """Multiply two matrices (lists of rows): the entry in row i, column j of the result is the dot product of row i of a with column j of b. ValueError('shape mismatch') unless the number of columns of a equals the number of rows of b. Matrix multiplication is NOT commutative: a * b is usually not b * a."""
        if len(a[0]) != len(b):
            raise ValueError("shape mismatch")
        return [[sum(a[i][k] * b[k][j] for k in range(len(b))) for j in range(len(b[0]))] for i in range(len(a))]


    def mat_vec(m, v):
        """Multiply a matrix by a vector, returning a TUPLE (entry i is the dot product of row i with v). ValueError('shape mismatch') if the number of columns is not len(v)."""
        if len(m[0]) != len(v):
            raise ValueError("shape mismatch")
        return tuple(sum(m[i][k] * v[k] for k in range(len(v))) for i in range(len(m)))


    def clean(x):
        """Round to 6 decimals and turn -0.0 into 0.0 (add 0.0 after rounding), so that tiny floating-point errors do not show."""
        return round(x, 6) + 0.0


    def translation(tx, ty):
        """The 3 by 3 HOMOGENEOUS matrix that moves points by (tx, ty): [[1, 0, tx], [0, 1, ty], [0, 0, 1]]. (A 2D point (x, y) is written (x, y, 1) so that a move can be a multiplication too.)"""
        return [[1, 0, tx], [0, 1, ty], [0, 0, 1]]


    def scaling(sx, sy):
        """The matrix that scales x by sx and y by sy (about the origin): [[sx, 0, 0], [0, sy, 0], [0, 0, 1]]."""
        return [[sx, 0, 0], [0, sy, 0], [0, 0, 1]]


    def rotation(degrees):
        """The matrix that rotates COUNTER-CLOCKWISE (in the usual maths picture with y up) by the angle about the origin: [[cos, -sin, 0], [sin, cos, 0], [0, 0, 1]], with entries passed through clean()."""
        a = math.radians(degrees)
        c, s = math.cos(a), math.sin(a)
        return [[clean(c), clean(-s), 0], [clean(s), clean(c), 0], [0, 0, 1]]


    def compose(*mats):
