id: u26-transforms
title: Vectors, Matrices and 3D
minutes: 100
objective: Learn the mathematics that moves and projects objects. You will write vector operations, multiply matrices, build 2D and 3D transformation matrices, combine them in the right order, project 3D points onto the screen with perspective, and draw a rotating wireframe cube.
outcomes:
- Use dot and cross products
- Multiply matrices and apply them to points
- Build translation, scaling and rotation matrices
- Compose transformations and explain why order matters
- Project 3D points with perspective
- Render a wireframe model
sections:
- heading: Vectors
  body: |-
    A **vector** is a list of numbers describing a direction and a size, or a position. In 2D it has two components (x, y), in 3D three. You add two vectors component by component, and scale a vector by multiplying each component by a number. The **length** of a vector is found with Pythagoras' theorem, and **normalizing** a vector divides it by its length so it has length exactly 1, leaving only the direction. These unit vectors describe directions such as "which way does this surface face".

    Two products matter. The **dot product** multiplies matching components and adds them. It equals the product of the two lengths times the cosine of the angle between them, so it is **zero** when vectors are perpendicular and large when they point the same way, which is how lighting decides how bright a surface is. The **cross product** of two 3D vectors is a third vector **perpendicular to both**, used to compute the direction a triangle faces.
- heading: Matrices and transformations
  body: |-
    A **matrix** is a grid of numbers. Multiplying a matrix by a vector produces a new vector, so a matrix is a *function* that transforms points. **Scaling** stretches coordinates, **rotation** turns them around an axis using sines and cosines, and **translation** moves them. Translation is not naturally a matrix multiplication, because it *adds* rather than multiplies. The trick is **homogeneous coordinates**: add an extra coordinate that is always 1, so a 2D point (x, y) becomes (x, y, 1) and a 3 by 3 matrix can include a shift. In 3D, points get a fourth coordinate and matrices are 4 by 4. All graphics cards work this way.

    Matrices combine by **matrix multiplication**: the entry in row i, column j of the product is the dot product of row i of the first matrix with column j of the second. Doing transformation A and then B is the single matrix B times A, so with a chain the **rightmost matrix acts first**. Matrix multiplication is **not commutative**: rotating then moving is not the same as moving then rotating. To rotate about a point other than the origin, move that point to the origin, rotate, and move back, which is the product of three matrices computed once and reused for every vertex.
- heading: Perspective
  body: |-
    To show a 3D scene on a flat screen we **project** it. Imagine a camera at the origin looking along the z axis with a picture plane at distance d in front of it. A point (x, y, z) lies on the line of sight that crosses the picture plane at (x·d/z, y·d/z). The division by z is **perspective**: the farther an object is, the closer it appears to the centre and the smaller it looks, as in a photograph. Points with z less than or equal to zero are behind the camera and cannot be drawn. Finally the picture-plane coordinates, which have the origin in the middle and y pointing up, are converted to **pixel coordinates** with the origin at the top-left and y pointing down.

    A **wireframe** shows an object as just its edges: a list of vertices (3D points) and a list of edges (pairs of vertices). Transform every vertex, project it, and draw a line for each edge with the line algorithm from the previous lesson. The rotating cube you will draw is the first thing most graphics programmers ever write.
examples:
- title: Order of transformations
  intro: Vectors, and the same two transformations applied in two different orders.
  code: |
    import math


    def vec_add(a, b):
        """The sum of two vectors (tuples or lists of the same length) as a TUPLE. ValueError('size mismatch') if the lengths differ."""
        if len(a) != len(b):
            raise ValueError("size mismatch")
        return tuple(x + y for x, y in zip(a, b))


    def vec_sub(a, b):
        """a minus b as a tuple (same error as vec_add)."""
        if len(a) != len(b):
            raise ValueError("size mismatch")
        return tuple(x - y for x, y in zip(a, b))


    def vec_scale(a, k):
        """Every component of the vector times the number k, as a tuple."""
        return tuple(x * k for x in a)


    def dot(a, b):
        """The DOT PRODUCT: the sum of the products of matching components. It is |a| |b| cos(angle between them), so it is 0 for perpendicular vectors. ValueError('size mismatch') if the lengths differ."""
        if len(a) != len(b):
            raise ValueError("size mismatch")
        return sum(x * y for x, y in zip(a, b))


    def cross(a, b):
        """The CROSS PRODUCT of two 3D vectors: (a1*b2 - a2*b1, a2*b0 - a0*b2, a0*b1 - a1*b0), a vector perpendicular to both. ValueError('need 3D vectors') unless both have exactly 3 components."""
        if len(a) != 3 or len(b) != 3:
            raise ValueError("need 3D vectors")
        return (a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0])


    def length(a):
        """The length (magnitude) of a vector: the square root of its dot product with itself."""
        return math.sqrt(dot(a, a))


    def normalize(a):
        """The vector divided by its length, so its length becomes 1 (a tuple). ValueError('zero vector') if its length is 0."""
        n = length(a)
        if n == 0:
            raise ValueError("zero vector")
        return tuple(x / n for x in a)


    def identity(n):
        """The n by n IDENTITY MATRIX as a list of rows: 1 on the diagonal, 0 elsewhere. Multiplying by it changes nothing."""
        return [[1 if i == j else 0 for j in range(n)] for i in range(n)]


    def transpose(m):
        """The TRANSPOSE: rows become columns (a new list of lists)."""
        return [list(col) for col in zip(*m)]


    def mat_mul(a, b):
        """Multiply two matrices (lists of rows): the entry in row i, column j of the result is the dot product of row i of a with column j of b. ValueError('shape mismatch') unless the number of columns of a equals the number of rows of b. Matrix multiplication is NOT commutative: a * b is usually not b * a."""
        if len(a[0]) != len(b):
            raise ValueError("shape mismatch")
        return [[sum(a[i][k] * b[k][j] for k in range(len(b))) for j in range(len(b[0]))] for i in range(len(a))]


    def mat_vec(m, v):
        """Multiply a matrix by a vector, returning a TUPLE (entry i is the dot product of row i with v). ValueError('shape mismatch') if the number of columns is not len(v)."""
        if len(m[0]) != len(v):
            raise ValueError("shape mismatch")
        return tuple(sum(m[i][k] * v[k] for k in range(len(v))) for i in range(len(m)))


    import math


    def clean(x):
        """Round to 6 decimals and turn -0.0 into 0.0 (add 0.0 after rounding), so that tiny floating-point errors do not show."""
        return round(x, 6) + 0.0


    def translation(tx, ty):
        """The 3 by 3 HOMOGENEOUS matrix that moves points by (tx, ty): [[1, 0, tx], [0, 1, ty], [0, 0, 1]]. (A 2D point (x, y) is written (x, y, 1) so that a move can be a multiplication too.)"""
        return [[1, 0, tx], [0, 1, ty], [0, 0, 1]]


    def scaling(sx, sy):
        """The matrix that scales x by sx and y by sy (about the origin): [[sx, 0, 0], [0, sy, 0], [0, 0, 1]]."""
        return [[sx, 0, 0], [0, sy, 0], [0, 0, 1]]


    def rotation(degrees):
        """The matrix that rotates COUNTER-CLOCKWISE (in the usual maths picture with y up) by the angle about the origin: [[cos, -sin, 0], [sin, cos, 0], [0, 0, 1]], with entries passed through clean()."""
        a = math.radians(degrees)
        c, s = math.cos(a), math.sin(a)
        return [[clean(c), clean(-s), 0], [clean(s), clean(c), 0], [0, 0, 1]]


    def compose(*mats):
        """Combine transformations into ONE matrix: the product mats[0] * mats[1] * ... * mats[-1] (use mat_mul). The RIGHTMOST matrix is applied FIRST. ValueError('nothing to compose') if no matrices are given."""
        if not mats:
            raise ValueError("nothing to compose")
        result = mats[0]
        for m in mats[1:]:
            result = mat_mul(result, m)
        return result


    def apply2d(m, point):
        """Transform a 2D point (x, y) with a 3 by 3 matrix: multiply by the vector (x, y, 1) and return (x, y) of the result, each passed through clean() (as a tuple)."""
        x, y, w = mat_vec(m, (point[0], point[1], 1))
        return (clean(x), clean(y))


    def rotate_about(degrees, cx, cy):
        """The matrix that rotates by the angle about the point (cx, cy) instead of the origin: move the centre to the origin, rotate, move back (use compose)."""
        return compose(translation(cx, cy), rotation(degrees), translation(-cx, -cy))

    print("dot of perpendicular vectors:", dot((1, 0, 0), (0, 1, 0)), "| cross:", cross((1, 0, 0), (0, 1, 0)))
    print("normalized (3, 4):", normalize((3, 4)))
    square = [(0, 0), (2, 0), (2, 2), (0, 2)]
    move_then_turn = compose(rotation(90), translation(3, 0))
    turn_then_move = compose(translation(3, 0), rotation(90))
    print("move then turn:", [apply2d(move_then_turn, p) for p in square])
    print("turn then move:", [apply2d(turn_then_move, p) for p in square])
    print("turn the square about its centre:", [apply2d(rotate_about(90, 1, 1), p) for p in square])
  output: |
    dot of perpendicular vectors: 0 | cross: (0, 0, 1)
    normalized (3, 4): (0.6, 0.8)
    move then turn: [(0.0, 3.0), (0.0, 5.0), (-2.0, 5.0), (-2.0, 3.0)]
    turn then move: [(3.0, 0.0), (3.0, 2.0), (1.0, 2.0), (1.0, 0.0)]
    turn the square about its centre: [(2.0, 0.0), (2.0, 2.0), (0.0, 2.0), (0.0, 0.0)]
