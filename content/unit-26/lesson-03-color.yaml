  tests:
  - name: identity and blur
    code: |
      g = [[0, 0, 0], [0, 90, 0], [0, 0, 0]]
      assert convolve(g, [[0, 0, 0], [0, 1, 0], [0, 0, 0]]) == g
      assert blur(g) == [[10, 10, 10], [10, 10, 10], [10, 10, 10]]
      flat = [[77] * 5 for _ in range(4)]
      assert blur(flat) == flat and sharpen(flat) == flat and edges(flat) == [[0] * 5 for _ in range(4)]
      assert g == [[0, 0, 0], [0, 90, 0], [0, 0, 0]]
  - name: edges
