id: u26-color
title: Colour and Images
minutes: 100
objective: Understand how computers represent colour and pictures. You will convert between RGB, hexadecimal and HSV colour, blend transparent colours, turn images into greyscale and negatives, simulate grey with dithering, and blur, sharpen and find edges with convolution.
outcomes:
- Convert RGB to hex and back
- Explain hue, saturation and value
- Blend colours with alpha
- Treat an image as a grid of pixels and transform it
- Explain gamma and dithering
- Apply a convolution kernel to an image
sections:
- heading: How a computer stores colour
  body: |-
    A screen pixel is made of three tiny lights: **red, green and blue**. Mixing different amounts of the three makes any colour. Each amount is a whole number from **0 to 255**, which fits in one byte (8 bits), so one pixel takes three bytes and there are 256 x 256 x 256, about 16.7 million colours. This is **RGB**. Web designers write the three bytes in **hexadecimal** (base 16, using the digits 0 to 9 and then a to f), two digits per channel: "#ff8800" means red 255, green 136, blue 0, which is orange. A short form "#f80" doubles each digit.

    RGB matches how screens work but not how people think. **HSV** describes colour as **hue** (the position on the colour wheel, an angle: 0 degrees red, 120 green, 240 blue), **saturation** (how vivid, from 0 which is grey to 1 which is pure) and **value** (how bright). To make a colour lighter or duller you change one HSV number instead of three RGB ones. To animate a colour smoothly you can blend (**interpolate**) between two colours channel by channel, and to draw something semi-transparent you use **alpha**: a number from 0 (invisible) to 1 (solid) giving how much of the new colour to mix with what is already there.
- heading: Images are grids of numbers
  body: |-
    A picture is a **grid of pixels**: a list of rows, each row a list of colours. Every photo filter is a function that builds a new grid from the old one. **Greyscale** replaces each colour by a single brightness, and the right brightness is a weighted sum of red, green and blue, since our eyes are far more sensitive to green than blue. The **negative** replaces each channel c by 255 - c. **Brightening** adds a constant and must **clamp** the result to stay between 0 and 255, otherwise a byte would overflow.

    Brightness on a real screen is not linear: the number 128 does not show half as much light as 255. Images are stored with a **gamma** curve (a power such as 2.2) that spends more numbers on dark tones, where our eyes can tell small differences. Software must **decode** gamma before doing arithmetic on light, such as blurring. When a device can show only black or white, **dithering** places the dots in a pattern so that your eye averages them into grey; **ordered dithering** compares each pixel with a repeating grid of thresholds.
- heading: Convolution
  body: |-
    Most image filters are one idea: **convolution**. A **kernel** is a small grid of weights, say 3 by 3. For every pixel, line the kernel up over the pixel and its neighbours, multiply each neighbour by the weight above it, and add the nine products. That sum is the new pixel. A kernel of all ones divided by 9 averages the neighbours, which **blurs**. A kernel with a big positive centre and negative neighbours makes a pixel stand out from its surroundings: **sharpening**, or, if the weights add up to zero, **edge detection**, which is zero in flat areas and large wherever brightness changes. At the picture's border the neighbours do not exist, so we reuse the nearest edge pixel.

    A **histogram** counts how many pixels have each brightness; photographers use it to see whether a picture is too dark or washed out. Convolution is also the basic operation inside the neural networks that recognise faces and objects, where the network *learns* the best kernels instead of a programmer choosing them.
examples:
- title: Colour conversions
  intro: Hex, HSV, a colour wheel and a blend.
  code: |
    def clamp(x, lo, hi):
        """Keep x between lo and hi."""
        return max(lo, min(hi, x))


    def rgb_to_hex(r, g, b):
        """Write a colour as a web hex string: '#' followed by two lowercase hexadecimal digits for each of red, green and blue (use format(value, '02x')). ValueError('out of range') if any value is not an integer from 0 to 255."""
        for v in (r, g, b):
            if not isinstance(v, int) or v < 0 or v > 255:
                raise ValueError("out of range")
        return "#" + format(r, "02x") + format(g, "02x") + format(b, "02x")


    def hex_to_rgb(text):
        """Read '#rrggbb' or the short form '#rgb' (each digit doubled, so '#f80' means '#ff8800'), upper or lower case, and return (r, g, b) as ints. ValueError('bad hex') for anything else."""
        if not isinstance(text, str) or not text.startswith("#") or len(text) not in (4, 7):
            raise ValueError("bad hex")
        digits = text[1:]
        if len(digits) == 3:
            digits = "".join(ch * 2 for ch in digits)
        try:
            return (int(digits[0:2], 16), int(digits[2:4], 16), int(digits[4:6], 16))
        except ValueError:
            raise ValueError("bad hex")


    def lerp_color(c1, c2, t):
        """Blend between two (r, g, b) colours: t = 0 gives c1, t = 1 gives c2, t = 0.5 the middle. Each channel is c1 + (c2 - c1) * t, rounded to an int. Python's round() rounds halves to the nearest EVEN number, which is fine here."""
        return tuple(round(a + (b - a) * t) for a, b in zip(c1, c2))


    def rgb_to_hsv(r, g, b):
        """Convert 0-255 red, green, blue to (hue, saturation, value). Hue is an angle 0 to 360 (0 red, 120 green, 240 blue), saturation 0 to 1 is how far from grey, value 0 to 1 is brightness. With mx = the largest channel, mn = the smallest, delta = mx - mn (all divided by 255 first):
        v = mx; s = 0 if mx is 0 else delta / mx; h = 0 if delta is 0, else 60 * (((g - b) / delta) % 6) when red is the largest, 60 * ((b - r) / delta + 2) when green is, and 60 * ((r - g) / delta + 4) when blue is.
        Return (round(h, 1), round(s, 3), round(v, 3))."""
        r, g, b = r / 255, g / 255, b / 255
        mx, mn = max(r, g, b), min(r, g, b)
        delta = mx - mn
        if delta == 0:
            h = 0
        elif mx == r:
            h = 60 * (((g - b) / delta) % 6)
        elif mx == g:
            h = 60 * ((b - r) / delta + 2)
        else:
            h = 60 * ((r - g) / delta + 4)
        s = 0 if mx == 0 else delta / mx
        return (round(h, 1), round(s, 3), round(mx, 3))


    def hsv_to_rgb(h, s, v):
        """The reverse: c = v * s; the hue sector hp = (h % 360) / 60; x = c * (1 - abs(hp % 2 - 1)); m = v - c. Sector 0 (hp < 1) gives (c, x, 0), sector 1 gives (x, c, 0), 2 gives (0, c, x), 3 gives (0, x, c), 4 gives (x, 0, c), 5 gives (c, 0, x); then add m to each and return round(channel * 255) as ints."""
        c = v * s
        hp = (h % 360) / 60
        x = c * (1 - abs(hp % 2 - 1))
        m = v - c
        sector = int(hp)
        r, g, b = [(c, x, 0), (x, c, 0), (0, c, x), (0, x, c), (x, 0, c), (c, 0, x)][sector]
        return (round((r + m) * 255), round((g + m) * 255), round((b + m) * 255))

    print("hex colours:", rgb_to_hex(255, 136, 0), hex_to_rgb("#f80"), hex_to_rgb("#1e90ff"))
    print("orange as hue/sat/value:", rgb_to_hsv(255, 136, 0))
    print("colour wheel:", [rgb_to_hex(*hsv_to_rgb(h, 1, 1)) for h in range(0, 360, 60)])
    print("halfway from red to blue:", lerp_color((255, 0, 0), (0, 0, 255), 0.5))
    print("brightness 0.5 is stored as:", round(0.5 ** (1 / 2.2), 4))
  output: |
    hex colours: #ff8800 (255, 136, 0) (30, 144, 255)
    orange as hue/sat/value: (32.0, 1.0, 1.0)
    colour wheel: ['#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff']
    halfway from red to blue: (128, 0, 128)
    brightness 0.5 is stored as: 0.7297
