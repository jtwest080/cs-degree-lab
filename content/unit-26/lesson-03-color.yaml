exercises:
- id: hex
  title: Hex colours and blending
  difficulty: 3
  prompt: 'A colour on screen is three numbers from 0 to 255 for **red, green and blue** (RGB). Websites write them in **hexadecimal** (base 16, digits `0-9` then `a-f`), two digits per channel, like `#ff8800`. Write `clamp(x, lo, hi)`, `rgb_to_hex(r, g, b)` (`''#''` plus `format(value, ''02x'')` for each channel; `ValueError("out of range")` if any is not an integer from 0 to 255), `hex_to_rgb(text)` (accepts `''#rrggbb''` and the short `''#rgb''` form where each digit is doubled, upper or lower case; `ValueError("bad hex")` for anything else) and `lerp_color(c1, c2, t)`: blend between two colours, `t = 0` giving the first and `t = 1` the second, each channel `c1 + (c2 - c1) * t` rounded to an int (a tuple).'
  starter: |-
    def clamp(x, lo, hi):
        """Keep x between lo and hi."""
        pass


    def rgb_to_hex(r, g, b):
        """Write a colour as a web hex string: '#' followed by two lowercase hexadecimal digits for each of red, green and blue (use format(value, '02x')). ValueError('out of range') if any value is not an integer from 0 to 255."""
        pass


    def hex_to_rgb(text):
        """Read '#rrggbb' or the short form '#rgb' (each digit doubled, so '#f80' means '#ff8800'), upper or lower case, and return (r, g, b) as ints. ValueError('bad hex') for anything else."""
        pass


    def lerp_color(c1, c2, t):
        """Blend between two (r, g, b) colours: t = 0 gives c1, t = 1 gives c2, t = 0.5 the middle. Each channel is c1 + (c2 - c1) * t, rounded to an int. Python's round() rounds halves to the nearest EVEN number, which is fine here."""
        pass
  tests:
  - name: to hex
    code: |
      assert rgb_to_hex(255, 136, 0) == "#ff8800" and rgb_to_hex(0, 0, 0) == "#000000" and rgb_to_hex(1, 2, 255) == "#0102ff"
      for bad in ((256, 0, 0), (-1, 0, 0), (0, 1.5, 0), (0, 0, "9")):
          try:
              rgb_to_hex(*bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "out of range" in str(e)
  - name: from hex
    code: |
      assert hex_to_rgb("#ff8800") == (255, 136, 0) and hex_to_rgb("#FF8800") == (255, 136, 0) and hex_to_rgb("#f80") == (255, 136, 0) and hex_to_rgb("#000") == (0, 0, 0)
      for bad in ("ff8800", "#ff88", "#gg0000", "#12345678", "", 5):
          try:
              hex_to_rgb(bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad hex" in str(e)
      for c in ((0, 0, 0), (12, 200, 99), (255, 255, 255)):
          assert hex_to_rgb(rgb_to_hex(*c)) == c
  - name: blending
    code: |
      assert lerp_color((0, 0, 0), (255, 255, 255), 0) == (0, 0, 0) and lerp_color((0, 0, 0), (255, 255, 255), 1) == (255, 255, 255)
      assert lerp_color((255, 0, 0), (0, 0, 255), 0.5) == (128, 0, 128) or lerp_color((255, 0, 0), (0, 0, 255), 0.5) == (127, 0, 128)
      assert lerp_color((10, 20, 30), (110, 120, 130), 0.25) == (35, 45, 55) and lerp_color((200, 100, 0), (100, 100, 100), 0.1) == (190, 100, 10)
      assert clamp(5, 0, 3) == 3 and clamp(-5, 0, 3) == 0 and clamp(2, 0, 3) == 2
  hints:
  - Use format(value, '02x') for two hex digits with a leading zero.
  solution: |
    def clamp(x, lo, hi):
        """Keep x between lo and hi."""
        return max(lo, min(hi, x))


    def rgb_to_hex(r, g, b):
        """Write a colour as a web hex string: '#' followed by two lowercase hexadecimal digits for each of red, green and blue (use format(value, '02x')). ValueError('out of range') if any value is not an integer from 0 to 255."""
        for v in (r, g, b):
            if not isinstance(v, int) or v < 0 or v > 255:
                raise ValueError("out of range")
        return "#" + format(r, "02x") + format(g, "02x") + format(b, "02x")


    def hex_to_rgb(text):
        """Read '#rrggbb' or the short form '#rgb' (each digit doubled, so '#f80' means '#ff8800'), upper or lower case, and return (r, g, b) as ints. ValueError('bad hex') for anything else."""
        if not isinstance(text, str) or not text.startswith("#") or len(text) not in (4, 7):
            raise ValueError("bad hex")
        digits = text[1:]
        if len(digits) == 3:
            digits = "".join(ch * 2 for ch in digits)
        try:
            return (int(digits[0:2], 16), int(digits[2:4], 16), int(digits[4:6], 16))
        except ValueError:
            raise ValueError("bad hex")


    def lerp_color(c1, c2, t):
        """Blend between two (r, g, b) colours: t = 0 gives c1, t = 1 gives c2, t = 0.5 the middle. Each channel is c1 + (c2 - c1) * t, rounded to an int. Python's round() rounds halves to the nearest EVEN number, which is fine here."""
        return tuple(round(a + (b - a) * t) for a, b in zip(c1, c2))
  explanation: 'Hex is just base 16: two digits per channel (16 * 16 = 256 shades).'
- id: hsv
  title: Hue, saturation, value
  difficulty: 4
  prompt: 'RGB is how screens work, but people think of colour as **hue** (which colour, as an angle on a colour wheel: 0 red, 120 green, 240 blue), **saturation** (how vivid, 0 is grey) and **value** (how bright). Starter code gives `clamp`. Write `rgb_to_hsv(r, g, b)` (channels 0-255; divide by 255 first; with `mx` the largest and `mn` the smallest channel and `delta = mx - mn`: `v = mx`; `s = 0` if `mx` is 0 else `delta / mx`; `h = 0` if `delta` is 0, else `60 * (((g - b) / delta) % 6)` when red is the largest, `60 * ((b - r) / delta + 2)` when green is, and `60 * ((r - g) / delta + 4)` when blue is; return `(round(h, 1), round(s, 3), round(v, 3))`) and `hsv_to_rgb(h, s, v)` (`c = v * s`; `hp = (h % 360) / 60`; `x = c * (1 - abs(hp % 2 - 1))`; `m = v - c`; sector `int(hp)` 0 to 5 picks the pattern `(c, x, 0)`, `(x, c, 0)`, `(0, c, x)`, `(0, x, c)`, `(x, 0, c)`, `(c, 0, x)`; add `m` to each and return `round(channel * 255)` as ints).'
  starter: |-
    def clamp(x, lo, hi):
        """Keep x between lo and hi."""
        return max(lo, min(hi, x))




    def rgb_to_hsv(r, g, b):
        """Convert 0-255 red, green, blue to (hue, saturation, value). Hue is an angle 0 to 360 (0 red, 120 green, 240 blue), saturation 0 to 1 is how far from grey, value 0 to 1 is brightness. With mx = the largest channel, mn = the smallest, delta = mx - mn (all divided by 255 first):
        v = mx; s = 0 if mx is 0 else delta / mx; h = 0 if delta is 0, else 60 * (((g - b) / delta) % 6) when red is the largest, 60 * ((b - r) / delta + 2) when green is, and 60 * ((r - g) / delta + 4) when blue is.
        Return (round(h, 1), round(s, 3), round(v, 3))."""
        pass


    def hsv_to_rgb(h, s, v):
        """The reverse: c = v * s; the hue sector hp = (h % 360) / 60; x = c * (1 - abs(hp % 2 - 1)); m = v - c. Sector 0 (hp < 1) gives (c, x, 0), sector 1 gives (x, c, 0), 2 gives (0, c, x), 3 gives (0, x, c), 4 gives (x, 0, c), 5 gives (c, 0, x); then add m to each and return round(channel * 255) as ints."""
        pass
  tests:
  - name: to hsv
    code: |
      assert rgb_to_hsv(255, 0, 0) == (0.0, 1.0, 1.0) and rgb_to_hsv(0, 255, 0) == (120.0, 1.0, 1.0) and rgb_to_hsv(0, 0, 255) == (240.0, 1.0, 1.0)
      assert rgb_to_hsv(255, 255, 0) == (60.0, 1.0, 1.0) and rgb_to_hsv(0, 255, 255) == (180.0, 1.0, 1.0) and rgb_to_hsv(255, 0, 255) == (300.0, 1.0, 1.0)
      assert rgb_to_hsv(0, 0, 0) == (0.0, 0.0, 0.0) and rgb_to_hsv(255, 255, 255) == (0.0, 0.0, 1.0) and rgb_to_hsv(128, 128, 128) == (0.0, 0.0, 0.502)
      assert rgb_to_hsv(255, 128, 0) == (30.1, 1.0, 1.0) and rgb_to_hsv(100, 50, 50) == (0.0, 0.5, 0.392)
  - name: from hsv
    code: |
      assert hsv_to_rgb(0, 1, 1) == (255, 0, 0) and hsv_to_rgb(120, 1, 1) == (0, 255, 0) and hsv_to_rgb(240, 1, 1) == (0, 0, 255)
      assert hsv_to_rgb(60, 1, 1) == (255, 255, 0) and hsv_to_rgb(180, 1, 1) == (0, 255, 255) and hsv_to_rgb(300, 1, 1) == (255, 0, 255)
      assert hsv_to_rgb(0, 0, 0.5) == (128, 128, 128) and hsv_to_rgb(0, 0, 0) == (0, 0, 0) and hsv_to_rgb(360, 1, 1) == (255, 0, 0)
      assert hsv_to_rgb(30, 1, 1) == (255, 128, 0)
  - name: round trips
    code: |
      for c in ((200, 30, 90), (10, 250, 40), (90, 90, 200), (255, 128, 0), (7, 7, 7)):
          h, s, v = rgb_to_hsv(*c)
          back = hsv_to_rgb(h, s, v)
          assert all(abs(a - b) <= 2 for a, b in zip(c, back)), (c, back)
      wheel = [hsv_to_rgb(h, 1, 1) for h in range(0, 360, 60)]
      assert wheel == [(255, 0, 0), (255, 255, 0), (0, 255, 0), (0, 255, 255), (0, 0, 255), (255, 0, 255)]
  hints:
  - Hue is an angle, so wrap it with % 360; divide by 60 to find which of the six colour sectors it is in.
  solution: |
    def clamp(x, lo, hi):
        """Keep x between lo and hi."""
        return max(lo, min(hi, x))




    def rgb_to_hsv(r, g, b):
        """Convert 0-255 red, green, blue to (hue, saturation, value). Hue is an angle 0 to 360 (0 red, 120 green, 240 blue), saturation 0 to 1 is how far from grey, value 0 to 1 is brightness. With mx = the largest channel, mn = the smallest, delta = mx - mn (all divided by 255 first):
        v = mx; s = 0 if mx is 0 else delta / mx; h = 0 if delta is 0, else 60 * (((g - b) / delta) % 6) when red is the largest, 60 * ((b - r) / delta + 2) when green is, and 60 * ((r - g) / delta + 4) when blue is.
        Return (round(h, 1), round(s, 3), round(v, 3))."""
        r, g, b = r / 255, g / 255, b / 255
        mx, mn = max(r, g, b), min(r, g, b)
        delta = mx - mn
        if delta == 0:
            h = 0
        elif mx == r:
            h = 60 * (((g - b) / delta) % 6)
        elif mx == g:
            h = 60 * ((b - r) / delta + 2)
        else:
            h = 60 * ((r - g) / delta + 4)
        s = 0 if mx == 0 else delta / mx
        return (round(h, 1), round(s, 3), round(mx, 3))


    def hsv_to_rgb(h, s, v):
        """The reverse: c = v * s; the hue sector hp = (h % 360) / 60; x = c * (1 - abs(hp % 2 - 1)); m = v - c. Sector 0 (hp < 1) gives (c, x, 0), sector 1 gives (x, c, 0), 2 gives (0, c, x), 3 gives (0, x, c), 4 gives (x, 0, c), 5 gives (c, 0, x); then add m to each and return round(channel * 255) as ints."""
        c = v * s
        hp = (h % 360) / 60
        x = c * (1 - abs(hp % 2 - 1))
        m = v - c
        sector = int(hp)
        r, g, b = [(c, x, 0), (x, c, 0), (0, c, x), (0, x, c), (x, 0, c), (c, 0, x)][sector]
        return (round((r + m) * 255), round((g + m) * 255), round((b + m) * 255))
  explanation: HSV makes it easy to change a colour's brightness or vividness without changing which colour it is.
