- title: Blur and edges
  intro: A white rectangle drawn with ASCII shading, blurred, and its edges found.
  code: |
    def clamp(x, lo, hi):
        """Keep x between lo and hi."""
        return max(lo, min(hi, x))




    def convolve(gray, kernel, divisor=1):
        """CONVOLUTION: slide a small odd-sized grid of weights (the KERNEL, rows of numbers) over a greyscale image. For each pixel multiply the neighbours around it by the matching kernel weights, add them, divide by divisor, round to an int and keep it between 0 and 255. Neighbours beyond the image edge reuse the nearest edge pixel (clamp the coordinates into the image). Return a new image."""
        h, w = len(gray), len(gray[0])
        ry, rx = len(kernel) // 2, len(kernel[0]) // 2
        out = []
        for y in range(h):
            row = []
            for x in range(w):
                total = 0
                for ky in range(len(kernel)):
                    for kx in range(len(kernel[0])):
                        yy = clamp(y + ky - ry, 0, h - 1)
                        xx = clamp(x + kx - rx, 0, w - 1)
                        total += gray[yy][xx] * kernel[ky][kx]
                row.append(clamp(round(total / divisor), 0, 255))
            out.append(row)
        return out


    def blur(gray):
        """Average each pixel with its 8 neighbours: convolve with a 3 by 3 grid of ones and divisor 9."""
        return convolve(gray, [[1, 1, 1], [1, 1, 1], [1, 1, 1]], 9)


    def sharpen(gray):
        """Make edges crisper: convolve with [[0, -1, 0], [-1, 5, -1], [0, -1, 0]] (divisor 1)."""
        return convolve(gray, [[0, -1, 0], [-1, 5, -1], [0, -1, 0]])


    def edges(gray):
        """Highlight edges (places where brightness changes): convolve with [[-1, -1, -1], [-1, 8, -1], [-1, -1, -1]]. Flat areas become 0."""
        return convolve(gray, [[-1, -1, -1], [-1, 8, -1], [-1, -1, -1]])


    def histogram(gray, buckets=8):
        """Count how many pixels fall in each brightness range. Split 0-255 into `buckets` equal ranges (bucket index = value * buckets // 256) and return the list of counts."""
        counts = [0] * buckets
        for row in gray:
            for p in row:
                counts[p * buckets // 256] += 1
        return counts

    RAMP = "._:-=+*#%@"


    def show(gray):
        return "\n".join("".join(RAMP[p * 10 // 256] for p in row) for row in gray)


    picture = [[255 if 4 <= x < 12 and 2 <= y < 8 else 30 for x in range(16)] for y in range(10)]
    print("original")
    print(show(picture))
    print("blurred")
    print(show(blur(picture)))
    print("edges")
    print(show(edges(picture)))
  output: |
