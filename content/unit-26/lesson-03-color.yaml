  difficulty: 5
  prompt: 'Blur, sharpen and edge detection are all one operation: **convolution**. Slide a small odd-sized grid of weights (the **kernel**) over a greyscale image. For each pixel multiply the neighbours around it by the matching weights, add them up, divide by `divisor`, round to an int and keep it between 0 and 255. Neighbours beyond the edge reuse the nearest edge pixel (clamp the coordinates into the image). Starter code gives `clamp`. Write `convolve(gray, kernel, divisor=1)`, `blur(gray)` (a 3 by 3 grid of ones, divisor 9), `sharpen(gray)` (`[[0, -1, 0], [-1, 5, -1], [0, -1, 0]]`), `edges(gray)` (`[[-1, -1, -1], [-1, 8, -1], [-1, -1, -1]]`; flat areas become 0) and `histogram(gray, buckets=8)`: split the range 0-255 into `buckets` equal ranges (index `value * buckets // 256`) and return how many pixels fall in each.'
