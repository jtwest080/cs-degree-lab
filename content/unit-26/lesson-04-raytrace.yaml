    def normalize(a):
        """The vector divided by its length (length 1)."""
        n = length(a)
        return (a[0] / n, a[1] / n, a[2] / n)


    def clean(x):
        """Round to 6 decimals and turn -0.0 into 0.0."""
        return round(x, 6) + 0.0


    def ray_point(origin, direction, t):
        """A RAY starts at `origin` and travels along `direction`. The point after travelling t steps is origin + direction * t (a tuple)."""
        return vec_add(origin, vec_scale(direction, t))


    def camera_ray(x, y, width, height, aspect=1.0):
        """The direction of the ray that goes from a camera at the origin, looking along +z, through the CENTRE of pixel (x, y) on a width by height screen that is 1 unit in front of the camera.
        u = (2 * (x + 0.5) / width - 1) * aspect and v = 1 - 2 * (y + 0.5) / height (so row 0 is the top). The direction is normalize((u, v, 1)) with every component passed through clean(). Return a tuple."""
        u = (2 * (x + 0.5) / width - 1) * aspect
        v = 1 - 2 * (y + 0.5) / height
        d = normalize((u, v, 1))
        return (clean(d[0]), clean(d[1]), clean(d[2]))


    def hit_sphere(origin, direction, center, radius):
        """Where does a ray hit a sphere? A point origin + direction * t is on the sphere when its distance from the centre equals the radius, which gives a QUADRATIC equation a*t*t + b*t + c = 0 with
        oc = origin - center, a = dot(direction, direction), b = 2 * dot(oc, direction), c = dot(oc, oc) - radius * radius.
        If the discriminant b*b - 4*a*c is negative the ray misses: return None. Otherwise the two solutions are (-b - sqrt(disc)) / (2a) and (-b + sqrt(disc)) / (2a). Return the SMALLER one that is greater than 0.001 (hits behind the origin, or on the surface the ray starts from, do not count), rounded to 6 decimals; None if neither qualifies."""
        oc = vec_sub(origin, center)
        a = dot(direction, direction)
        b = 2 * dot(oc, direction)
        c = dot(oc, oc) - radius * radius
        disc = b * b - 4 * a * c
        if disc < 0:
            return None
        root = math.sqrt(disc)
        for t in ((-b - root) / (2 * a), (-b + root) / (2 * a)):
            if t > 0.001:
                return round(t, 6)
        return None


    def sphere_normal(point, center):
        """The NORMAL of a sphere at a point on its surface: the unit vector pointing from the centre to the point, each component passed through clean()."""
        n = normalize(vec_sub(point, center))
        return (clean(n[0]), clean(n[1]), clean(n[2]))


    def reflect(d, n):
        """Bounce a direction d off a surface with unit normal n: d - 2 * dot(d, n) * n, each component passed through clean()."""
        k = 2 * dot(d, n)
        r = vec_sub(d, vec_scale(n, k))
        return (clean(r[0]), clean(r[1]), clean(r[2]))


    def diffuse(normal, light_dir):
        """LAMBERT'S LAW: a surface is brightest when it faces the light and dark when it is edge-on or turned away. For unit vectors the brightness is max(0, dot(normal, light_dir)), rounded to 4 decimals. light_dir points FROM the surface TOWARD the light."""
        return round(max(0, dot(normal, light_dir)), 4)


    def nearest_hit(origin, direction, spheres):
        """`spheres` is a list of (center, radius) pairs. Return (t, index) for the closest sphere the ray hits, or None if it hits nothing. (If two are at the same distance prefer the lower index.)"""
        best = None
        for i, (center, radius) in enumerate(spheres):
            t = hit_sphere(origin, direction, center, radius)
            if t is not None and (best is None or t < best[0]):
                best = (t, i)
        return best


    def in_shadow(point, light, spheres):
        """Is there something between a surface point and the light? Shoot a ray from the point toward the light (direction normalize(light - point)). The point is in SHADOW if any sphere is hit at a distance smaller than the distance to the light."""
        to_light = vec_sub(light, point)
        dist = length(to_light)
        d = normalize(to_light)
        for center, radius in spheres:
            t = hit_sphere(point, d, center, radius)
            if t is not None and t < dist:
                return True
        return False
