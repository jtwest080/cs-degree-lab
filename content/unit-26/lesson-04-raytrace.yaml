  solution: |
    import math


    def vec_add(a, b):
        """Add two 3D vectors."""
        return (a[0] + b[0], a[1] + b[1], a[2] + b[2])


    def vec_sub(a, b):
        """Subtract b from a."""
        return (a[0] - b[0], a[1] - b[1], a[2] - b[2])


    def vec_scale(a, k):
        """Multiply a vector by a number."""
        return (a[0] * k, a[1] * k, a[2] * k)


    def dot(a, b):
        """The dot product."""
        return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]


    def length(a):
        """The length of a vector."""
        return math.sqrt(dot(a, a))


    def normalize(a):
        """The vector divided by its length (length 1)."""
        n = length(a)
        return (a[0] / n, a[1] / n, a[2] / n)


    def clean(x):
        """Round to 6 decimals and turn -0.0 into 0.0."""
        return round(x, 6) + 0.0


    def ray_point(origin, direction, t):
        """A RAY starts at `origin` and travels along `direction`. The point after travelling t steps is origin + direction * t (a tuple)."""
        return vec_add(origin, vec_scale(direction, t))


    def camera_ray(x, y, width, height, aspect=1.0):
        """The direction of the ray that goes from a camera at the origin, looking along +z, through the CENTRE of pixel (x, y) on a width by height screen that is 1 unit in front of the camera.
        u = (2 * (x + 0.5) / width - 1) * aspect and v = 1 - 2 * (y + 0.5) / height (so row 0 is the top). The direction is normalize((u, v, 1)) with every component passed through clean(). Return a tuple."""
        u = (2 * (x + 0.5) / width - 1) * aspect
        v = 1 - 2 * (y + 0.5) / height
        d = normalize((u, v, 1))
        return (clean(d[0]), clean(d[1]), clean(d[2]))
  explanation: A ray is just a starting point plus t times a direction; everything else is about finding the right t.
- id: sphere
  title: Hitting a sphere
  difficulty: 5
  prompt: 'Does a ray hit a sphere, and where? A point `origin + direction * t` is on the sphere when its distance from the centre equals the radius. Expanding that gives a **quadratic equation** `a*t*t + b*t + c = 0` with `oc = origin - center`, `a = dot(direction, direction)`, `b = 2 * dot(oc, direction)` and `c = dot(oc, oc) - radius * radius`. If the **discriminant** `b*b - 4*a*c` is negative the ray misses: return `None`. Otherwise the two solutions are `(-b - sqrt(disc)) / (2a)` and `(-b + sqrt(disc)) / (2a)`. Write `hit_sphere(origin, direction, center, radius)` returning the **smaller** solution that is greater than `0.001` (a hit behind the origin, or on the surface the ray starts from, does not count), rounded to 6 decimals, or `None` if neither qualifies. Starter code gives the vector functions.'
