id: u26-raytrace
title: Ray Tracing
minutes: 110
objective: Build a ray tracer, the algorithm that makes photo-realistic pictures. You will shoot rays from a camera, solve a quadratic equation to find where they hit spheres, compute surface normals, light the scene with Lambert's law, cast shadows, and render a picture made of text.
outcomes:
- Describe a ray and a camera
- Solve the ray-sphere intersection equation
- Compute normals and reflections
- Light a surface with Lambert's law
- Test for shadows
- Assemble a complete ray tracer
sections:
- heading: Seeing with rays
  body: |-
    Real vision works like this: light leaves a lamp, bounces off objects and some of it enters your eye. Simulating that forwards would waste almost every ray, because most never reach the eye. **Ray tracing** runs it **backwards**: for every pixel of the screen, shoot a ray *from the camera* through that pixel into the scene, and find the nearest object it hits. That object decides the pixel's colour.

    A **ray** is a starting point (the **origin**) and a **direction**. The point reached after travelling t steps is origin + direction x t, so every question about a ray becomes "find t". The camera sits at the origin looking along the z axis, and the screen is a rectangle one unit in front of it. The ray through the centre of pixel (x, y) points toward (u, v, 1), where u and v run from -1 to 1 across the screen, and we **normalize** it so that t measures real distance.
- heading: Where does the ray hit?
  body: |-
    To intersect a ray with a **sphere**, ask when the ray's point is exactly one radius from the centre. Writing that out gives a **quadratic equation** in t, a t-squared + b t + c = 0, solved with the formula you know from algebra. The **discriminant** (b-squared minus 4ac) tells how many solutions there are: negative means the ray misses the sphere, zero means it just touches, positive means it passes through and hits two points, an entry and an exit. We want the **nearest** hit that is in *front* of the ray, so we take the smaller solution if it is positive, otherwise the larger one (the ray started inside the sphere), otherwise nothing.

    With many objects, test every one and keep the smallest t. This is the heart of the renderer. Real scenes use triangles instead of spheres and clever data structures (trees of bounding boxes) to avoid testing every one, but the idea is the same.
- heading: Light and shadow
  body: |-
    Once we know where a ray hit, we need to know how bright that spot is. The **normal** is the direction the surface faces: for a sphere, from the centre straight out to the point. **Lambert's law** says a surface is brightest when it faces the light directly and fades to dark as it turns edge-on, exactly the **dot product** of the normal with the direction to the light (clamped at zero for surfaces turned away). Add a small constant **ambient** light, which stands in for light bouncing around the room, so nothing is pitch black.

    To find **shadows**, shoot a second ray from the hit point toward the light. If it hits anything closer than the light, the light is blocked and the point is in shadow. A **mirror** reflection is the same trick: bounce the ray off the surface using the normal (the reflect formula) and trace *that* ray to see what the mirror shows. Tracing rays recursively gives reflections, glass and realistic soft light, at the price of a lot of arithmetic, which is why films take hours per frame and games use shortcuts or special graphics hardware.
examples:
- title: Rays and spheres
  intro: Shoot rays at a sphere and see whether and where they hit.
  code: |
    import math


    def vec_add(a, b):
        """Add two 3D vectors."""
        return (a[0] + b[0], a[1] + b[1], a[2] + b[2])


    def vec_sub(a, b):
        """Subtract b from a."""
        return (a[0] - b[0], a[1] - b[1], a[2] - b[2])


    def vec_scale(a, k):
        """Multiply a vector by a number."""
        return (a[0] * k, a[1] * k, a[2] * k)


    def dot(a, b):
        """The dot product."""
        return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]


    def length(a):
        """The length of a vector."""
        return math.sqrt(dot(a, a))


    def normalize(a):
        """The vector divided by its length (length 1)."""
        n = length(a)
        return (a[0] / n, a[1] / n, a[2] / n)


    def clean(x):
        """Round to 6 decimals and turn -0.0 into 0.0."""
        return round(x, 6) + 0.0


    def ray_point(origin, direction, t):
        """A RAY starts at `origin` and travels along `direction`. The point after travelling t steps is origin + direction * t (a tuple)."""
        return vec_add(origin, vec_scale(direction, t))


    def camera_ray(x, y, width, height, aspect=1.0):
        """The direction of the ray that goes from a camera at the origin, looking along +z, through the CENTRE of pixel (x, y) on a width by height screen that is 1 unit in front of the camera.
        u = (2 * (x + 0.5) / width - 1) * aspect and v = 1 - 2 * (y + 0.5) / height (so row 0 is the top). The direction is normalize((u, v, 1)) with every component passed through clean(). Return a tuple."""
        u = (2 * (x + 0.5) / width - 1) * aspect
        v = 1 - 2 * (y + 0.5) / height
        d = normalize((u, v, 1))
        return (clean(d[0]), clean(d[1]), clean(d[2]))


    def hit_sphere(origin, direction, center, radius):
        """Where does a ray hit a sphere? A point origin + direction * t is on the sphere when its distance from the centre equals the radius, which gives a QUADRATIC equation a*t*t + b*t + c = 0 with
        oc = origin - center, a = dot(direction, direction), b = 2 * dot(oc, direction), c = dot(oc, oc) - radius * radius.
        If the discriminant b*b - 4*a*c is negative the ray misses: return None. Otherwise the two solutions are (-b - sqrt(disc)) / (2a) and (-b + sqrt(disc)) / (2a). Return the SMALLER one that is greater than 0.001 (hits behind the origin, or on the surface the ray starts from, do not count), rounded to 6 decimals; None if neither qualifies."""
        oc = vec_sub(origin, center)
        a = dot(direction, direction)
        b = 2 * dot(oc, direction)
        c = dot(oc, oc) - radius * radius
        disc = b * b - 4 * a * c
        if disc < 0:
            return None
        root = math.sqrt(disc)
        for t in ((-b - root) / (2 * a), (-b + root) / (2 * a)):
            if t > 0.001:
                return round(t, 6)
        return None

    print("a ray from the origin along z, after 5 steps:", ray_point((0, 0, 0), (0, 0, 1), 5))
    print("direction through the top-left pixel of a 2 by 2 screen:", camera_ray(0, 0, 2, 2))
    print("straight at a sphere 5 away with radius 1:", hit_sphere((0, 0, 0), (0, 0, 1), (0, 0, 5), 1))
    print("aimed too high:", hit_sphere((0, 0, 0), (0, 0, 1), (0, 3, 5), 1))
    print("sphere behind the camera:", hit_sphere((0, 0, 0), (0, 0, 1), (0, 0, -5), 1))
    print("from inside the sphere:", hit_sphere((0, 0, 5), (0, 0, 1), (0, 0, 5), 2))
  output: |
