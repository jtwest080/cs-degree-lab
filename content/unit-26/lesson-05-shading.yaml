    def barycentric(p, a, b, c):
        """The BARYCENTRIC coordinates (w0, w1, w2) of the 2D point p in the triangle a, b, c: weights that add to 1 with p = w0 * a + w1 * b + w2 * c. All three are positive exactly when p is inside. ValueError('degenerate triangle') if the corners are in a line."""
