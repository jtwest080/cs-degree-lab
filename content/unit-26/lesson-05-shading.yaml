        return [[float("inf")] * width for _ in range(height)]


    def plot_with_depth(canvas, zbuf, x, y, z, ch):
        """Draw character ch at (x, y) ONLY if it is nearer than what is already there: if (x, y) is on the canvas and z is SMALLER than zbuf[y][x], store z in the depth buffer, draw the character and return True. Otherwise change nothing and return False."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]) and z < zbuf[y][x]:
            zbuf[y][x] = z
            canvas[y][x] = ch
            return True
        return False


    def draw_triangle_zbuf(canvas, zbuf, a, b, c, ch):
        """Fill the triangle with 3D corners a, b, c = (x, y, z) in screen space. For every pixel (x, y) of the canvas take its CENTRE p = (x + 0.5, y + 0.5); if all three barycentric weights of p (from the x, y parts) are greater than 1e-9 the pixel is inside, and its depth z is the weighted blend of the corners' z values. Use plot_with_depth. Return how many pixels were actually drawn (a degenerate triangle draws 0)."""
        try:
            drawn = 0
            for y in range(len(canvas)):
                for x in range(len(canvas[0])):
                    w = barycentric((x + 0.5, y + 0.5), a[:2], b[:2], c[:2])
                    if min(w) > 1e-9:
                        z = w[0] * a[2] + w[1] * b[2] + w[2] * c[2]
                        if plot_with_depth(canvas, zbuf, x, y, z, ch):
                            drawn += 1
            return drawn
        except ValueError:
            return 0

    RAMP = ":-=+*#%@"


    def signed_area2(a, b, c):
        """Twice the signed area of a 2D triangle: (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x). Positive when a, b, c turn counter-clockwise in maths axes (clockwise on a screen whose y grows downward)."""
