- title: Overlapping triangles
  intro: Three triangles at different depths, drawn with a depth buffer.
  code: |
    def barycentric(p, a, b, c):
        """The BARYCENTRIC coordinates (w0, w1, w2) of the 2D point p in the triangle a, b, c: weights that add to 1 with p = w0 * a + w1 * b + w2 * c. All three are positive exactly when p is inside. ValueError('degenerate triangle') if the corners are in a line."""
        den = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1])
        if den == 0:
            raise ValueError("degenerate triangle")
        w0 = ((b[1] - c[1]) * (p[0] - c[0]) + (c[0] - b[0]) * (p[1] - c[1])) / den
        w1 = ((c[1] - a[1]) * (p[0] - c[0]) + (a[0] - c[0]) * (p[1] - c[1])) / den
        return (w0, w1, 1 - w0 - w1)


    def new_canvas(width, height):
        """A canvas: a list of `height` rows, each a list of `width` '.' characters."""
        return [["."] * width for _ in range(height)]


    def canvas_to_text(canvas):
        """The canvas as one string: rows joined with newlines."""
        return "\n".join("".join(row) for row in canvas)


    def new_zbuffer(width, height):
        """A DEPTH BUFFER: a list of `height` rows of `width` entries, each the float infinity (float('inf')) meaning "nothing drawn here yet"."""
        return [[float("inf")] * width for _ in range(height)]


    def plot_with_depth(canvas, zbuf, x, y, z, ch):
        """Draw character ch at (x, y) ONLY if it is nearer than what is already there: if (x, y) is on the canvas and z is SMALLER than zbuf[y][x], store z in the depth buffer, draw the character and return True. Otherwise change nothing and return False."""
        if 0 <= y < len(canvas) and 0 <= x < len(canvas[0]) and z < zbuf[y][x]:
            zbuf[y][x] = z
            canvas[y][x] = ch
            return True
        return False


    def draw_triangle_zbuf(canvas, zbuf, a, b, c, ch):
        """Fill the triangle with 3D corners a, b, c = (x, y, z) in screen space. For every pixel (x, y) of the canvas take its CENTRE p = (x + 0.5, y + 0.5); if all three barycentric weights of p (from the x, y parts) are greater than 1e-9 the pixel is inside, and its depth z is the weighted blend of the corners' z values. Use plot_with_depth. Return how many pixels were actually drawn (a degenerate triangle draws 0)."""
        try:
            drawn = 0
            for y in range(len(canvas)):
                for x in range(len(canvas[0])):
                    w = barycentric((x + 0.5, y + 0.5), a[:2], b[:2], c[:2])
                    if min(w) > 1e-9:
                        z = w[0] * a[2] + w[1] * b[2] + w[2] * c[2]
                        if plot_with_depth(canvas, zbuf, x, y, z, ch):
                            drawn += 1
            return drawn
        except ValueError:
            return 0


    RAMP = ":-=+*#%@"


    def signed_area2(a, b, c):
        """Twice the signed area of a 2D triangle: (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x). Positive when a, b, c turn counter-clockwise in maths axes (clockwise on a screen whose y grows downward)."""
        return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])


    def render_triangles(width, height, triangles):
        """Draw a list of triangles `(a, b, c, brightness)` where a, b, c are (x, y, z) screen-space corners (smaller z is nearer) and brightness is 0 to 1. Return the picture as a list of `height` strings of `width` characters, background '.'.
        Skip BACK-FACING triangles: those whose signed_area2 of the x, y parts is NOT greater than 0. Draw the rest with a depth buffer (draw_triangle_zbuf) using the character RAMP[min(len(RAMP) - 1, int(brightness * len(RAMP)))], so the nearest surface wins whatever the drawing order."""
        canvas = new_canvas(width, height)
        zbuf = new_zbuffer(width, height)
        for a, b, c, brightness in triangles:
            if signed_area2(a[:2], b[:2], c[:2]) <= 0:
                continue
            ch = RAMP[min(len(RAMP) - 1, int(brightness * len(RAMP)))]
            draw_triangle_zbuf(canvas, zbuf, a, b, c, ch)
        return [ "".join(row) for row in canvas ]

    sheet_one = ((1, 1, 4), (22, 1, 4), (1, 15, 4), 0.95)
    sheet_two = ((12, 4, 2), (30, 4, 2), (12, 14, 2), 0.45)
    sheet_three = ((8, 10, 8), (36, 10, 8), (8, 18, 8), 0.7)
    for row in render_triangles(40, 20, [sheet_one, sheet_two, sheet_three]):
        print(row)
