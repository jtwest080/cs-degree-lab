id: u26-shading
title: Shading and Hidden Surfaces
minutes: 100
objective: Learn how 3D models made of triangles are lit and drawn. You will compute triangle normals, skip back-facing triangles, light surfaces with the Phong model, blend brightness across a triangle, and use a depth buffer so nearer objects hide farther ones.
outcomes:
- Compute a triangle's normal and area
- Explain back-face culling
- Apply ambient, diffuse and specular lighting
- Interpolate values with barycentric coordinates
- Use a z-buffer to hide surfaces
- Assemble a small triangle renderer
sections:
- heading: Meshes of triangles
  body: |-
    Almost every 3D object in a game or film is a **mesh**: a list of **triangles**. Triangles are used because three points always lie in a flat plane, so a triangle is always flat and has an unambiguous inside. A curved surface such as a face or a ball is approximated by thousands or millions of tiny triangles.

    Each triangle has a **normal**: the direction it faces, found with the **cross product** of two of its edges. Which way the normal points depends on the order you list the corners, so by convention corners are listed **counter-clockwise** when seen from the front. A closed object such as a cube has a front-facing and a back-facing side to every triangle, and half of its triangles are always on the far side where nobody can see them. **Back-face culling** throws those away early by checking whether the normal points away from the camera, which saves about half the work.
- heading: Lighting a surface
  body: |-
    The **Phong model** adds three effects. **Ambient** light is a constant glow standing in for light bouncing around everywhere. **Diffuse** light is the matte brightness you already know from Lambert's law: the dot product of the normal with the direction to the light. **Specular** light is the shiny highlight on a polished surface: it appears where the light would reflect straight into your eye. You compute the mirror direction of the light about the normal and take its dot product with the direction to the eye, then raise it to a power called the **shininess**: a high power makes a small, sharp highlight like on glass, and a low one a broad glow like on plastic.

    Computing this for every pixel is expensive, so cheaper options exist. **Flat shading** lights each triangle once, which looks faceted. **Gouraud shading** lights only the three corners and **interpolates** (blends) the brightness across the inside. Modern graphics cards run **Phong shading**: they interpolate the normals and light every pixel, with a small program called a **shader**.
- heading: Barycentric coordinates and the depth buffer
  body: |-
    To blend a value across a triangle you need each point's recipe in terms of the three corners. The **barycentric coordinates** of a point are three weights that add up to 1, telling how much of each corner it is made of: at corner A the weights are (1, 0, 0), at the middle of edge AB they are (0.5, 0.5, 0), and at the centre of the triangle they are one third each. A point is inside the triangle exactly when all three weights are positive. Multiplying the corners' brightness, colour, depth or texture position by these weights blends them smoothly.

    When triangles overlap you need to know which is in front. You could sort them and draw the farthest first (the **painter's algorithm**) but sorting fails when triangles intersect or overlap in a cycle. The **depth buffer** solves it simply: keep an array with the distance (z) of the nearest thing drawn at every pixel. A new pixel is drawn only if it is nearer than what is stored, and then the stored depth is updated. Drawing order no longer matters, and every graphics card has this built in.
examples:
- title: Normals and lighting
  intro: A triangle's normal, back-face test and Phong brightness.
  code: |
    import math


    def vec_sub(a, b):
        """Subtract b from a (3D)."""
        return (a[0] - b[0], a[1] - b[1], a[2] - b[2])


    def vec_scale(a, k):
        """Multiply a 3D vector by a number."""
        return (a[0] * k, a[1] * k, a[2] * k)


    def dot(a, b):
        """The dot product."""
        return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]


    def cross(a, b):
        """The cross product of two 3D vectors."""
        return (a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0])


    def length(a):
        """The length of a vector."""
        return math.sqrt(dot(a, a))


    def normalize(a):
        """The vector divided by its length."""
        n = length(a)
        return (a[0] / n, a[1] / n, a[2] / n)


    def clean(x):
        """Round to 6 decimals and turn -0.0 into 0.0."""
        return round(x, 6) + 0.0


    def triangle_normal(a, b, c):
        """The unit NORMAL of the triangle with corners a, b, c (3D points listed counter-clockwise as seen from the front): normalize(cross(b - a, c - a)), each component passed through clean(). ValueError('degenerate triangle') if the corners are in a line (the cross product has length 0)."""
        n = cross(vec_sub(b, a), vec_sub(c, a))
        if length(n) == 0:
            raise ValueError("degenerate triangle")
        n = normalize(n)
        return (clean(n[0]), clean(n[1]), clean(n[2]))


    def triangle_area(a, b, c):
        """The area of a 3D triangle: half the length of cross(b - a, c - a), rounded to 6 decimals."""
        return round(length(cross(vec_sub(b, a), vec_sub(c, a))) / 2, 6)


    def is_back_facing(a, b, c, view_dir):
        """A triangle whose normal points the same way the camera looks (dot(normal, view_dir) >= 0) faces AWAY from the camera: nobody can see its front, so BACK-FACE CULLING skips it. Return True for such triangles, False for ones facing the camera."""
        return dot(triangle_normal(a, b, c), view_dir) >= 0


    def phong(normal, light_dir, view_dir, ambient, diff_k, spec_k, shininess):
        """The PHONG lighting model: brightness = ambient light + a DIFFUSE part + a SPECULAR part (the shiny highlight). All direction vectors are UNIT vectors pointing away from the surface: toward the light and toward the eye.
        diffuse = max(0, dot(normal, light_dir)). The light's mirror direction is r = 2 * dot(normal, light_dir) * normal - light_dir; specular = max(0, dot(r, view_dir)) ** shininess, but 0 when diffuse is 0 (a surface turned away from the light has no highlight).
        Result = ambient + diff_k * diffuse + spec_k * specular, limited to at most 1 and rounded to 4 decimals."""
        diffuse = max(0, dot(normal, light_dir))
        if diffuse == 0:
            specular = 0
        else:
            k = 2 * dot(normal, light_dir)
            r = vec_sub(vec_scale(normal, k), light_dir)
            specular = max(0, dot(r, view_dir)) ** shininess
        return round(min(1, ambient + diff_k * diffuse + spec_k * specular), 4)

    roof = ((0, 0, 0), (1, 0, 0), (0, 1, 0))
    print("normal of the triangle:", triangle_normal(*roof), "| area:", triangle_area(*roof))
    print("seen from the front, back-facing?", is_back_facing(*roof, (0, 0, -1)), "| seen from behind:", is_back_facing(*roof, (0, 0, 1)))
    n = (0, 0, 1)
    light = normalize((1, 0, 1))
    for name, eye in (("looking straight on", (0, 0, 1)), ("looking along the reflection", normalize((-1, 0, 1)))):
        print(name, "- matte:", phong(n, light, eye, 0.1, 0.8, 0, 20), "| shiny:", phong(n, light, eye, 0.1, 0.8, 0.5, 20))
  output: |
