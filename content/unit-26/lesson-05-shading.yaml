    def barycentric(p, a, b, c):
        """The BARYCENTRIC coordinates (w0, w1, w2) of the 2D point p in the triangle a, b, c: weights that add to 1 with p = w0 * a + w1 * b + w2 * c. All three are positive exactly when p is inside. ValueError('degenerate triangle') if the corners are in a line."""
        den = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1])
        if den == 0:
            raise ValueError("degenerate triangle")
        w0 = ((b[1] - c[1]) * (p[0] - c[0]) + (c[0] - b[0]) * (p[1] - c[1])) / den
        w1 = ((c[1] - a[1]) * (p[0] - c[0]) + (a[0] - c[0]) * (p[1] - c[1])) / den
        return (w0, w1, 1 - w0 - w1)


    def new_canvas(width, height):
        """A canvas: a list of `height` rows, each a list of `width` '.' characters."""
        return [["."] * width for _ in range(height)]


    def canvas_to_text(canvas):
        """The canvas as one string: rows joined with newlines."""
        return "\n".join("".join(row) for row in canvas)


    def gouraud(p, a, b, c, va, vb, vc):
        """GOURAUD SHADING: compute the brightness only at the three corners (va, vb, vc) and let the brightness at any point p inside the triangle be the blend of them using its barycentric weights: w0 * va + w1 * vb + w2 * vc, rounded to 4 decimals. Return None if p is outside the triangle (any weight below -1e-9)."""
        w = barycentric(p, a, b, c)
        if min(w) < -1e-9:
            return None
        return round(w[0] * va + w[1] * vb + w[2] * vc, 4)


    def depth_at(p, a, b, c):
        """The depth (z) at the 2D point p inside the triangle whose corners are the 3D points a, b, c = (x, y, z): blend the three z values with the barycentric weights of p computed from the (x, y) parts. Return None if p is outside (any weight below -1e-9). Rounded to 6 decimals."""
        w = barycentric(p, a[:2], b[:2], c[:2])
        if min(w) < -1e-9:
            return None
        return round(w[0] * a[2] + w[1] * b[2] + w[2] * c[2], 6)
  explanation: The same weights blend brightness, depth, colour and texture coordinates.
