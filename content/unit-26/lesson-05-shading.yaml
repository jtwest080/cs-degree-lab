  - Compute the specular part only when the surface faces the light.
  solution: |
    import math


    def vec_sub(a, b):
        """Subtract b from a (3D)."""
        return (a[0] - b[0], a[1] - b[1], a[2] - b[2])


    def vec_scale(a, k):
        """Multiply a 3D vector by a number."""
        return (a[0] * k, a[1] * k, a[2] * k)


    def dot(a, b):
        """The dot product."""
        return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]


    def cross(a, b):
        """The cross product of two 3D vectors."""
        return (a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0])


    def length(a):
        """The length of a vector."""
        return math.sqrt(dot(a, a))


    def normalize(a):
        """The vector divided by its length."""
        n = length(a)
        return (a[0] / n, a[1] / n, a[2] / n)


    def clean(x):
        """Round to 6 decimals and turn -0.0 into 0.0."""
        return round(x, 6) + 0.0


    def phong(normal, light_dir, view_dir, ambient, diff_k, spec_k, shininess):
        """The PHONG lighting model: brightness = ambient light + a DIFFUSE part + a SPECULAR part (the shiny highlight). All direction vectors are UNIT vectors pointing away from the surface: toward the light and toward the eye.
        diffuse = max(0, dot(normal, light_dir)). The light's mirror direction is r = 2 * dot(normal, light_dir) * normal - light_dir; specular = max(0, dot(r, view_dir)) ** shininess, but 0 when diffuse is 0 (a surface turned away from the light has no highlight).
        Result = ambient + diff_k * diffuse + spec_k * specular, limited to at most 1 and rounded to 4 decimals."""
        diffuse = max(0, dot(normal, light_dir))
        if diffuse == 0:
            specular = 0
        else:
            k = 2 * dot(normal, light_dir)
            r = vec_sub(vec_scale(normal, k), light_dir)
            specular = max(0, dot(r, view_dir)) ** shininess
        return round(min(1, ambient + diff_k * diffuse + spec_k * specular), 4)
  explanation: Phong lighting is over fifty years old and still taught because it is cheap and looks good.
