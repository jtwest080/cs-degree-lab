- id: face
  title: Triangle normals and culling
  difficulty: 3
  prompt: '3D models are built from **triangles**. Starter code gives the vector functions (`vec_sub`, `vec_scale`, `dot`, `cross`, `length`, `normalize`, `clean`). Write `triangle_normal(a, b, c)`: the unit **normal** of the triangle with 3D corners `a, b, c` listed counter-clockwise as seen from the front, `normalize(cross(b - a, c - a))` with each component passed through `clean` (`ValueError("degenerate triangle")` if the corners are in a line). Write `triangle_area(a, b, c)`: half the length of `cross(b - a, c - a)`, rounded to 6 decimals. Write `is_back_facing(a, b, c, view_dir)`: a triangle whose normal points the same way as the camera''s viewing direction (`dot(normal, view_dir) >= 0`) faces **away** from the camera, so **back-face culling** can skip it: return `True` for those.'
