- title: Noise and a fractal
  intro: Fractal noise drawn as a bar chart, then the Mandelbrot set in text.
  code: |
    import math


    def lattice(i, seed):
        """A repeatable pseudo-random number from 0 to 1 for the whole number i and a seed. Use exactly this integer hash (never Python's hash(), which changes between runs):
        h = (i * 374761393 + seed * 668265263) & 0xFFFFFFFF; h = ((h ^ (h >> 13)) * 1274126177) & 0xFFFFFFFF; h = h ^ (h >> 16); return h / 4294967295."""
        h = (i * 374761393 + seed * 668265263) & 0xFFFFFFFF
        h = ((h ^ (h >> 13)) * 1274126177) & 0xFFFFFFFF
        h = h ^ (h >> 16)
        return h / 4294967295


    def smooth(t):
        """The fade curve t * t * (3 - 2 * t) (for t from 0 to 1)."""
        return t * t * (3 - 2 * t)


    def value_noise(x, seed):
        """VALUE NOISE: smooth randomness. The whole numbers have random values (lattice); between them blend with the fade curve: with i = floor(x) and f = x - i the result is lattice(i, seed) + (lattice(i + 1, seed) - lattice(i, seed)) * smooth(f). Round to 6 decimals."""
        i = math.floor(x)
        f = x - i
        a, b = lattice(i, seed), lattice(i + 1, seed)
        return round(a + (b - a) * smooth(f), 6)


    def fbm(x, seed, octaves):
        """FRACTAL NOISE (fBm): add several layers of noise, each OCTAVE twice as detailed and half as strong: the sum over o from 0 to octaves - 1 of 0.5 ** o * value_noise(x * 2 ** o, seed + o), divided by the sum of the amplitudes (0.5 ** o) so the result stays between 0 and 1. Round to 6 decimals. ValueError('need an octave') if octaves < 1."""
        if octaves < 1:
            raise ValueError("need an octave")
        total = weight = 0.0
        for o in range(octaves):
            total += 0.5 ** o * value_noise(x * 2 ** o, seed + o)
            weight += 0.5 ** o
        return round(total / weight, 6)


    def mandelbrot_iterations(cr, ci, max_iter):
        """The MANDELBROT SET: start with z = 0 and repeat z = z * z + c, where c is the complex number cr + ci * j. If z ever gets farther than 2 from the origin (abs(z) > 2) it escapes to infinity: return how many steps that took (1 if the first step already escapes). If it never escapes in max_iter steps, c is in the set: return max_iter."""
        c = complex(cr, ci)
        z = 0
        for i in range(max_iter):
            z = z * z + c
            if abs(z) > 2:
                return i + 1
        return max_iter


    SHADES = ".:-=+*#%"


    def render_mandelbrot(width, height, max_iter):
        """Draw the set as text. For pixel (x, y) use the centre of the pixel mapped to the complex plane: cr = -2.2 + (x + 0.5) / width * 3.2 and ci = 1.2 - (y + 0.5) / height * 2.4. Points in the set (iterations equal max_iter) are '@'; others use SHADES[min(len(SHADES) - 1, it * len(SHADES) // max_iter)]. Return a list of `height` strings."""
        rows = []
        for y in range(height):
            row = ""
            for x in range(width):
                cr = -2.2 + (x + 0.5) / width * 3.2
                ci = 1.2 - (y + 0.5) / height * 2.4
                it = mandelbrot_iterations(cr, ci, max_iter)
                row += "@" if it == max_iter else SHADES[min(len(SHADES) - 1, it * len(SHADES) // max_iter)]
            rows.append(row)
        return rows

    bars = []
    for x in range(48):
        v = fbm(x / 6, 11, 3)
        bars.append(int(v * 8))
    for level in range(7, -1, -1):
        print("".join("#" if b >= level else "." for b in bars))
    print()
    for row in render_mandelbrot(60, 22, 40):
        print(row)
