id: u26-curves
title: Curves, Noise and Fractals
minutes: 100
objective: Create smooth and natural-looking shapes. You will build Bezier curves with de Casteljau's algorithm, derive their formula, draw splines through points, generate layered random noise, and render the Mandelbrot fractal.
outcomes:
- Interpolate linearly between values and points
- Draw a Bezier curve with de Casteljau's algorithm
- Use Bernstein polynomials
- Build a spline through points
- Generate value noise and fractal noise
- Render the Mandelbrot set
sections:
- heading: Curves from straight lines
  body: |-
    A computer can only draw straight lines, so a smooth curve is a list of many very short ones. The question is how to describe a curve with only a few numbers. The most popular answer is the **Bezier curve**, used by every font, vector drawing program and animation tool. You give it a few **control points**. The curve starts at the first, ends at the last, and is *pulled toward* the ones in between without usually touching them.

    The idea behind it is **linear interpolation**, or **lerp**: the point a fraction t of the way from a to b is a + (b - a) x t. **De Casteljau's algorithm** uses it repeatedly: lerp between each neighbouring pair of control points, giving one fewer point; do it again with the new points; keep going until one point is left. That point is on the curve. Repeating for t from 0 to 1 sweeps out the whole curve, which you draw as a polyline. Three control points give a **quadratic** curve, four a **cubic** one, which is what fonts use.
- heading: Formulas, splines and easing
  body: |-
    De Casteljau's procedure also has a **formula**. The curve is a weighted sum of the control points, where the weight of point number i is the **Bernstein polynomial** (n choose i) t^i (1-t)^(n-i). The binomial coefficient "n choose i" counts the ways to pick i items from n, and these weights always add to 1, so the curve stays inside the shape formed by its control points. The formula's derivative gives the **tangent**, the direction the curve is travelling.

    Sometimes you want a smooth curve that passes **through** all your points, such as the path of a camera. That is a **spline**; the **Catmull-Rom spline** bends each segment according to the points on either side of it. In animation we also **ease** between values: instead of moving at constant speed, **smoothstep** starts and ends gently with the S-shaped curve t-squared times (3 minus 2t), which looks far more natural.
- heading: Noise and fractals
  body: |-
    Real clouds, mountains and flames are random, but not like static on a television: nearby points look alike. **Value noise** makes this by picking a random number at each whole number and blending smoothly between them. The random numbers must be **repeatable**, so we use a **hash function** that scrambles a number and a **seed** into the same pseudo-random result every time. Adding several copies of the noise, each **octave** twice as detailed and half as strong, gives **fractal noise** that looks rough and natural at every zoom level. Games use it to make terrain and textures from a handful of numbers.

    A **fractal** is a shape with detail at every scale. The **Mandelbrot set** takes a **complex number** c (a number with two parts, written a + bj) and repeats z = z-squared + c starting from 0. If z grows without bound, c is outside the set; if it stays small forever, c is inside. Colouring each point by *how fast* it escapes makes the famous picture. Zoom in anywhere and new patterns appear forever, all from one line of arithmetic.
examples:
- title: A Bezier curve
  intro: Points on a cubic curve and its length at three levels of detail.
  code: |
    import math


    def lerp(a, b, t):
        """LINEAR INTERPOLATION: the number a + (b - a) * t. t = 0 gives a, t = 1 gives b, t = 0.5 the middle."""
        return a + (b - a) * t


    def lerp_point(p, q, t):
        """The same blend for points of any dimension (tuples): each coordinate separately; return a tuple."""
        return tuple(lerp(a, b, t) for a, b in zip(p, q))


    def de_casteljau(points, t):
        """The point at parameter t (0 to 1) of the BEZIER CURVE whose CONTROL POINTS are `points` (a list of tuples). DE CASTELJAU'S ALGORITHM: replace the list by the points a fraction t along each segment between neighbours (lerp_point of points[i] and points[i + 1]) and repeat until ONE point is left. Round each coordinate to 6 decimals and add 0.0 (to avoid -0.0); return a tuple. ValueError('no points') for an empty list."""
        if not points:
            raise ValueError("no points")
        pts = [tuple(p) for p in points]
        while len(pts) > 1:
            pts = [lerp_point(a, b, t) for a, b in zip(pts, pts[1:])]
        return tuple(round(c, 6) + 0.0 for c in pts[0])


    def sample_curve(points, n):
        """n + 1 points along the Bezier curve, at t = 0, 1/n, 2/n, ... 1 (a list of tuples from de_casteljau). ValueError('need n >= 1') if n < 1."""
        if n < 1:
            raise ValueError("need n >= 1")
        return [de_casteljau(points, i / n) for i in range(n + 1)]


    def polyline_length(pts):
        """The total length of the path that joins the points in order with straight segments, rounded to 3 decimals (0 for fewer than two points)."""
        total = 0.0
        for a, b in zip(pts, pts[1:]):
            total += math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b)))
        return round(total, 3)

    cubic = [(0, 0), (0, 10), (10, 10), (10, 0)]
    print("control points:", cubic)
    print("start, middle and end of the curve:", de_casteljau(cubic, 0), de_casteljau(cubic, 0.5), de_casteljau(cubic, 1))
    print("a few sample points:", sample_curve([(0, 0), (4, 8), (8, 0)], 4))
    print("length of the curve with 4, 20 and 200 segments:", polyline_length(sample_curve(cubic, 4)), polyline_length(sample_curve(cubic, 20)), polyline_length(sample_curve(cubic, 200)))
  output: |
