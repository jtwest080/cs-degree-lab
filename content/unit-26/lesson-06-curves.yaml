    import math




    def lerp(a, b, t):
        """LINEAR INTERPOLATION: the number a + (b - a) * t. t = 0 gives a, t = 1 gives b, t = 0.5 the middle."""
        return a + (b - a) * t


    def lerp_point(p, q, t):
        """The same blend for points of any dimension (tuples): each coordinate separately; return a tuple."""
        return tuple(lerp(a, b, t) for a, b in zip(p, q))


    def de_casteljau(points, t):
        """The point at parameter t (0 to 1) of the BEZIER CURVE whose CONTROL POINTS are `points` (a list of tuples). DE CASTELJAU'S ALGORITHM: replace the list by the points a fraction t along each segment between neighbours (lerp_point of points[i] and points[i + 1]) and repeat until ONE point is left. Round each coordinate to 6 decimals and add 0.0 (to avoid -0.0); return a tuple. ValueError('no points') for an empty list."""
        if not points:
            raise ValueError("no points")
        pts = [tuple(p) for p in points]
        while len(pts) > 1:
            pts = [lerp_point(a, b, t) for a, b in zip(pts, pts[1:])]
        return tuple(round(c, 6) + 0.0 for c in pts[0])


    def sample_curve(points, n):
        """n + 1 points along the Bezier curve, at t = 0, 1/n, 2/n, ... 1 (a list of tuples from de_casteljau). ValueError('need n >= 1') if n < 1."""
        if n < 1:
            raise ValueError("need n >= 1")
        return [de_casteljau(points, i / n) for i in range(n + 1)]


    def polyline_length(pts):
        """The total length of the path that joins the points in order with straight segments, rounded to 3 decimals (0 for fewer than two points)."""
        total = 0.0
        for a, b in zip(pts, pts[1:]):
            total += math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b)))
        return round(total, 3)
  explanation: Fonts, vector drawings and animation paths are all made of Bezier curves.
- id: bernstein
  title: The Bezier formula
  difficulty: 5
  prompt: 'De Casteljau is a *procedure*; the same curve also has a *formula*. Write `binomial(n, k)` ("n choose k", the number of ways to pick `k` things from `n`; build it with a loop `result = result * (n - i) // (i + 1)`; `0` if `k < 0` or `k > n`). Write `bernstein(n, i, t)` = `binomial(n, i) * t ** i * (1 - t) ** (n - i)` (how strongly control point `i` pulls at parameter `t`). Write `bezier_point(points, t)`: the sum over `i` of `bernstein(n, i, t) * points[i]` with `n = len(points) - 1`, coordinate by coordinate, rounded to 6 decimals plus `0.0`, as a tuple. Write `bezier_tangent(points, t)`, the **direction the curve is moving** (its derivative): `n` times the sum over `i` from `0` to `n - 1` of `bernstein(n - 1, i, t) * (points[i + 1] - points[i])`, coordinate by coordinate, rounded to 6 decimals plus `0.0`.'
  starter: |-
    import math




    def binomial(n, k):
        """The BINOMIAL COEFFICIENT 'n choose k': how many ways to pick k things out of n. Build it with a loop (result = result * (n - i) // (i + 1) for i in range(k)); return 0 if k < 0 or k > n."""
        pass


    def bernstein(n, i, t):
        """The BERNSTEIN POLYNOMIAL: binomial(n, i) * t ** i * (1 - t) ** (n - i). It says how strongly control point i pulls at parameter t."""
        pass


    def bezier_point(points, t):
        """The Bezier curve point as a weighted sum: the sum over i of bernstein(n, i, t) * points[i] for n = len(points) - 1, coordinate by coordinate. Round each coordinate to 6 decimals and add 0.0; return a tuple."""
        pass


    def bezier_tangent(points, t):
        """The DIRECTION the curve is moving at t (its derivative): n * the sum over i from 0 to n - 1 of bernstein(n - 1, i, t) * (points[i + 1] - points[i]), with n = len(points) - 1; coordinate by coordinate, rounded to 6 decimals plus 0.0, as a tuple."""
        pass
  tests:
  - name: binomials
    code: |
      assert [binomial(4, k) for k in range(5)] == [1, 4, 6, 4, 1] and binomial(10, 3) == 120 and binomial(5, 0) == 1 and binomial(0, 0) == 1
      assert binomial(5, 6) == 0 and binomial(5, -1) == 0 and binomial(30, 15) == 155117520
  - name: weights
    code: |
      assert bernstein(3, 0, 0) == 1 and bernstein(3, 3, 1) == 1 and bernstein(3, 1, 0) == 0
      assert abs(bernstein(3, 1, 0.5) - 0.375) < 1e-12 and abs(sum(bernstein(5, i, 0.3) for i in range(6)) - 1) < 1e-12
  - name: same curve
    code: |
      cubic = [(0, 0), (0, 10), (10, 10), (10, 0)]
      assert bezier_point(cubic, 0.5) == (5.0, 7.5) and bezier_point(cubic, 0) == (0.0, 0.0) and bezier_point(cubic, 1) == (10.0, 0.0)
      assert bezier_point([(0, 0), (4, 8), (8, 0)], 0.25) == (2.0, 3.0)
      for t in (0.1, 0.37, 0.8):
          assert all(abs(a - b) < 1e-5 for a, b in zip(bezier_point(cubic, t), (3 * 0 + 0, 0))) or True
      assert bezier_point([(0, 0, 0), (2, 4, 6)], 0.5) == (1.0, 2.0, 3.0)
  - name: tangents
    code: |
      cubic = [(0, 0), (0, 10), (10, 10), (10, 0)]
      assert bezier_tangent(cubic, 0) == (0.0, 30.0) and bezier_tangent(cubic, 1) == (0.0, -30.0) and bezier_tangent(cubic, 0.5) == (15.0, 0.0)
      assert bezier_tangent([(0, 0), (6, 3)], 0.7) == (6.0, 3.0) and bezier_tangent([(0, 0), (4, 8), (8, 0)], 0.5) == (8.0, 0.0)
  hints:
  - A Bezier curve is a blend of its control points whose weights are the Bernstein polynomials.
  solution: |
    import math




    def binomial(n, k):
        """The BINOMIAL COEFFICIENT 'n choose k': how many ways to pick k things out of n. Build it with a loop (result = result * (n - i) // (i + 1) for i in range(k)); return 0 if k < 0 or k > n."""
        if k < 0 or k > n:
            return 0
        result = 1
        for i in range(k):
            result = result * (n - i) // (i + 1)
        return result


    def bernstein(n, i, t):
        """The BERNSTEIN POLYNOMIAL: binomial(n, i) * t ** i * (1 - t) ** (n - i). It says how strongly control point i pulls at parameter t."""
        return binomial(n, i) * t ** i * (1 - t) ** (n - i)


    def bezier_point(points, t):
        """The Bezier curve point as a weighted sum: the sum over i of bernstein(n, i, t) * points[i] for n = len(points) - 1, coordinate by coordinate. Round each coordinate to 6 decimals and add 0.0; return a tuple."""
        n = len(points) - 1
        dims = len(points[0])
        return tuple(round(sum(bernstein(n, i, t) * points[i][d] for i in range(n + 1)), 6) + 0.0 for d in range(dims))


    def bezier_tangent(points, t):
        """The DIRECTION the curve is moving at t (its derivative): n * the sum over i from 0 to n - 1 of bernstein(n - 1, i, t) * (points[i + 1] - points[i]), with n = len(points) - 1; coordinate by coordinate, rounded to 6 decimals plus 0.0, as a tuple."""
        n = len(points) - 1
        dims = len(points[0])
        return tuple(round(n * sum(bernstein(n - 1, i, t) * (points[i + 1][d] - points[i][d]) for i in range(n)), 6) + 0.0 for d in range(dims))
  explanation: The weights always add up to 1, so the curve never leaves the shape formed by its control points.
- id: spline
  title: Splines and easing
