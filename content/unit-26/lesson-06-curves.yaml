  - Each octave doubles the frequency (x * 2 ** o) and halves the amplitude; divide by the total amplitude at the end.
  solution: |
    import math


    def smooth(t):
        """The fade curve t * t * (3 - 2 * t)."""
        return t * t * (3 - 2 * t)


    def lattice(i, seed):
        """A repeatable pseudo-random number from 0 to 1 for the whole number i and a seed. Use exactly this integer hash (never Python's hash(), which changes between runs):
        h = (i * 374761393 + seed * 668265263) & 0xFFFFFFFF; h = ((h ^ (h >> 13)) * 1274126177) & 0xFFFFFFFF; h = h ^ (h >> 16); return h / 4294967295."""
        h = (i * 374761393 + seed * 668265263) & 0xFFFFFFFF
        h = ((h ^ (h >> 13)) * 1274126177) & 0xFFFFFFFF
        h = h ^ (h >> 16)
        return h / 4294967295


    def value_noise(x, seed):
        """VALUE NOISE: smooth randomness. The whole numbers have random values (lattice); between them blend with the fade curve: with i = floor(x) and f = x - i the result is lattice(i, seed) + (lattice(i + 1, seed) - lattice(i, seed)) * smooth(f). Round to 6 decimals."""
        i = math.floor(x)
        f = x - i
        a, b = lattice(i, seed), lattice(i + 1, seed)
        return round(a + (b - a) * smooth(f), 6)


    def fbm(x, seed, octaves):
        """FRACTAL NOISE (fBm): add several layers of noise, each OCTAVE twice as detailed and half as strong: the sum over o from 0 to octaves - 1 of 0.5 ** o * value_noise(x * 2 ** o, seed + o), divided by the sum of the amplitudes (0.5 ** o) so the result stays between 0 and 1. Round to 6 decimals. ValueError('need an octave') if octaves < 1."""
        if octaves < 1:
            raise ValueError("need an octave")
        total = weight = 0.0
        for o in range(octaves):
            total += 0.5 ** o * value_noise(x * 2 ** o, seed + o)
            weight += 0.5 ** o
        return round(total / weight, 6)
  explanation: Terrain in games, clouds in films and textures everywhere are built from layered noise.
- id: mandel
  title: 'Capstone: the Mandelbrot set'
  difficulty: 4
  prompt: 'One of the most famous pictures in mathematics comes from a tiny rule. Take a **complex number** `c` (a number `cr + ci * j` that has two parts; Python writes it `complex(cr, ci)`), start with `z = 0` and repeat `z = z * z + c`. If `z` ever gets farther than 2 from the origin (`abs(z) > 2`) it **escapes** to infinity; otherwise it stays small forever and `c` is in the **Mandelbrot set**. Write `mandelbrot_iterations(cr, ci, max_iter)`: how many steps it takes to escape (`1` if the first step already escapes), or `max_iter` if it never does. Write `render_mandelbrot(width, height, max_iter)`: for pixel `(x, y)` use the **centre** of the pixel mapped to the complex plane, `cr = -2.2 + (x + 0.5) / width * 3.2` and `ci = 1.2 - (y + 0.5) / height * 2.4`; points in the set (`iterations == max_iter`) are `''@''`, the others use `SHADES[min(len(SHADES) - 1, it * len(SHADES) // max_iter)]` with `SHADES = ".:-=+*#%"` (given). Return a list of `height` strings.'
  starter: |-
    SHADES = ".:-=+*#%"


    def mandelbrot_iterations(cr, ci, max_iter):
        """The MANDELBROT SET: start with z = 0 and repeat z = z * z + c, where c is the complex number cr + ci * j. If z ever gets farther than 2 from the origin (abs(z) > 2) it escapes to infinity: return how many steps that took (1 if the first step already escapes). If it never escapes in max_iter steps, c is in the set: return max_iter."""
        pass


    def render_mandelbrot(width, height, max_iter):
        """Draw the set as text. For pixel (x, y) use the centre of the pixel mapped to the complex plane: cr = -2.2 + (x + 0.5) / width * 3.2 and ci = 1.2 - (y + 0.5) / height * 2.4. Points in the set (iterations equal max_iter) are '@'; others use SHADES[min(len(SHADES) - 1, it * len(SHADES) // max_iter)]. Return a list of `height` strings."""
        pass
  tests:
  - name: escape counts
    code: |
      assert mandelbrot_iterations(0, 0, 50) == 50 and mandelbrot_iterations(-1, 0, 50) == 50 and mandelbrot_iterations(2, 2, 50) == 1
      assert mandelbrot_iterations(1, 0, 50) == 3 and mandelbrot_iterations(0.5, 0, 50) == 5 and mandelbrot_iterations(-2, 0, 50) == 50
      assert mandelbrot_iterations(1, 0, 2) == 2 and mandelbrot_iterations(0, 1, 30) == 30 and mandelbrot_iterations(3, 0, 10) == 1
  - name: the picture
    code: |
      img = render_mandelbrot(40, 20, 30)
      assert len(img) == 20 and all(len(r) == 40 for r in img)
      assert img == render_mandelbrot(40, 20, 30) and img[:10] == img[::-1][:10]
      assert "@" in "".join(img) and "." in "".join(img) and set("".join(img)) <= set("@.:-=+*#%")
      assert img[0][0] == "." and img[10][22] == "@" or img[9][22] == "@"
      inside = sum(r.count("@") for r in img)
      assert 40 < inside < 300
  - name: detail grows
    code: |
      a, b = render_mandelbrot(40, 20, 10), render_mandelbrot(40, 20, 100)
      assert sum(r.count("@") for r in a) >= sum(r.count("@") for r in b)
      assert render_mandelbrot(2, 2, 5) == [".@", ".@"] or len(render_mandelbrot(2, 2, 5)) == 2
  hints:
  - 'Python has complex numbers built in: z * z + c and abs(z) just work.'
  solution: |
    SHADES = ".:-=+*#%"


    def mandelbrot_iterations(cr, ci, max_iter):
        """The MANDELBROT SET: start with z = 0 and repeat z = z * z + c, where c is the complex number cr + ci * j. If z ever gets farther than 2 from the origin (abs(z) > 2) it escapes to infinity: return how many steps that took (1 if the first step already escapes). If it never escapes in max_iter steps, c is in the set: return max_iter."""
        c = complex(cr, ci)
        z = 0
        for i in range(max_iter):
            z = z * z + c
            if abs(z) > 2:
                return i + 1
        return max_iter


    def render_mandelbrot(width, height, max_iter):
        """Draw the set as text. For pixel (x, y) use the centre of the pixel mapped to the complex plane: cr = -2.2 + (x + 0.5) / width * 3.2 and ci = 1.2 - (y + 0.5) / height * 2.4. Points in the set (iterations equal max_iter) are '@'; others use SHADES[min(len(SHADES) - 1, it * len(SHADES) // max_iter)]. Return a list of `height` strings."""
        rows = []
        for y in range(height):
            row = ""
            for x in range(width):
                cr = -2.2 + (x + 0.5) / width * 3.2
                ci = 1.2 - (y + 0.5) / height * 2.4
                it = mandelbrot_iterations(cr, ci, max_iter)
                row += "@" if it == max_iter else SHADES[min(len(SHADES) - 1, it * len(SHADES) // max_iter)]
            rows.append(row)
        return rows
  explanation: Zooming into this set reveals endless new detail, because a simple rule can produce infinite complexity.
commonMistakes:
- title: Expecting a Bezier curve to touch its middle control points
  explanation: It is only pulled toward them.
- title: Using Python's hash() for noise
  explanation: It changes between runs; use a fixed integer hash.
- title: Using too few segments for a curve
  explanation: A polyline with few points looks angular.
- title: Forgetting to divide fractal noise by the total amplitude
  explanation: The sum would leave the range 0 to 1.
- title: Using sample points for t instead of 0 to 1
  explanation: The parameter t always runs from 0 to 1.
summary:
- Lerp blends two values; de Casteljau repeats it to find a point on a Bezier curve.
- The same curve is a weighted sum with Bernstein weights.
- A spline passes through its points; smoothstep eases motion.
- Value noise blends repeatable random values; octaves add detail.
- The Mandelbrot set colours points by how fast z * z + c escapes.
