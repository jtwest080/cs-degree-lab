  solution: |
    def smoothstep(t):
        """An S-shaped ease between 0 and 1: clamp t to between 0 and 1 first, then return t * t * (3 - 2 * t), rounded to 6 decimals."""
        t = max(0.0, min(1.0, t))
        return round(t * t * (3 - 2 * t), 6)


    def catmull_rom(p0, p1, p2, p3, t):
        """A smooth curve segment from p1 to p2 that is shaped by the points before and after (p0 and p3). For numbers:
        0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t), rounded to 6 decimals plus 0.0."""
        value = 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t)
        return round(value, 6) + 0.0


    def spline_points(pts, per):
        """A SPLINE: a smooth curve that passes through every one of the 2D points `pts` (tuples). For segment i (from pts[i] to pts[i + 1]) use p0 = pts[max(i - 1, 0)] and p3 = pts[min(i + 2, len(pts) - 1)] and catmull_rom on x and y separately for t = s / per with s from 0 to per - 1. Finally append the last point. Return a list of tuples. ValueError('need two points') if there are fewer than two points."""
        if len(pts) < 2:
            raise ValueError("need two points")
        out = []
        for i in range(len(pts) - 1):
            p0, p1 = pts[max(i - 1, 0)], pts[i]
            p2, p3 = pts[i + 1], pts[min(i + 2, len(pts) - 1)]
            for s in range(per):
                t = s / per
                out.append((catmull_rom(p0[0], p1[0], p2[0], p3[0], t), catmull_rom(p0[1], p1[1], p2[1], p3[1], t)))
        out.append(tuple(pts[-1]))
        return out
  explanation: Animators place a few key points and let a spline draw the smooth motion between them.
- id: noise
  title: Smooth random noise
  difficulty: 5
  prompt: 'Natural looking randomness (clouds, terrain, flames) is not coin-flipping: it is smooth. **Value noise** gives random values at whole numbers and blends smoothly between them. Write `lattice(i, seed)`: a repeatable pseudo-random number from 0 to 1 for the whole number `i`, with exactly this integer hash (never Python''s `hash()`, which changes between runs): `h = (i * 374761393 + seed * 668265263) & 0xFFFFFFFF`; `h = ((h ^ (h >> 13)) * 1274126177) & 0xFFFFFFFF`; `h = h ^ (h >> 16)`; return `h / 4294967295`. Starter code gives `smooth(t)` = `t * t * (3 - 2 * t)`. Write `value_noise(x, seed)`: with `i = math.floor(x)` and `f = x - i` the result is `lattice(i, seed) + (lattice(i + 1, seed) - lattice(i, seed)) * smooth(f)` rounded to 6 decimals. Write `fbm(x, seed, octaves)` (**fractal noise**): add several layers (**octaves**), each twice as detailed and half as strong: the sum over `o` from `0` to `octaves - 1` of `0.5 ** o * value_noise(x * 2 ** o, seed + o)`, divided by the sum of the amplitudes `0.5 ** o`, rounded to 6 decimals (`ValueError("need an octave")` if `octaves < 1`).'
  starter: |-
    import math


    def smooth(t):
        """The fade curve t * t * (3 - 2 * t)."""
        return t * t * (3 - 2 * t)


    def lattice(i, seed):
        """A repeatable pseudo-random number from 0 to 1 for the whole number i and a seed. Use exactly this integer hash (never Python's hash(), which changes between runs):
        h = (i * 374761393 + seed * 668265263) & 0xFFFFFFFF; h = ((h ^ (h >> 13)) * 1274126177) & 0xFFFFFFFF; h = h ^ (h >> 16); return h / 4294967295."""
        pass


    def value_noise(x, seed):
        """VALUE NOISE: smooth randomness. The whole numbers have random values (lattice); between them blend with the fade curve: with i = floor(x) and f = x - i the result is lattice(i, seed) + (lattice(i + 1, seed) - lattice(i, seed)) * smooth(f). Round to 6 decimals."""
        pass


    def fbm(x, seed, octaves):
        """FRACTAL NOISE (fBm): add several layers of noise, each OCTAVE twice as detailed and half as strong: the sum over o from 0 to octaves - 1 of 0.5 ** o * value_noise(x * 2 ** o, seed + o), divided by the sum of the amplitudes (0.5 ** o) so the result stays between 0 and 1. Round to 6 decimals. ValueError('need an octave') if octaves < 1."""
        pass
  tests:
  - name: lattice
    code: |
      vals = [lattice(i, 7) for i in range(-20, 20)]
      assert all(0 <= v <= 1 for v in vals) and lattice(5, 7) == lattice(5, 7) and lattice(5, 7) != lattice(5, 8) and lattice(5, 7) != lattice(6, 7)
      assert len(set(vals)) == 40 and 0.3 < sum(vals) / 40 < 0.7 and lattice(0, 0) == 0
  - name: smooth blending
    code: |
      for seed in (1, 2, 3):
          for i in (-3, 0, 4):
              assert value_noise(i, seed) == round(lattice(i, seed), 6)
              a, b = lattice(i, seed), lattice(i + 1, seed)
              for f in (0.1, 0.5, 0.9):
                  assert min(a, b) - 1e-6 <= value_noise(i + f, seed) <= max(a, b) + 1e-6
      assert abs(value_noise(2.5, 4) - (lattice(2, 4) + lattice(3, 4)) / 2) < 1e-6
      steps = [value_noise(x / 100, 9) for x in range(300)]
      assert max(abs(a - b) for a, b in zip(steps, steps[1:])) < 0.05
      assert value_noise(-1.5, 3) == value_noise(-1.5, 3)
  - name: octaves
    code: |
      assert fbm(1.3, 5, 1) == value_noise(1.3, 5)
      for x in (0.0, 0.7, 3.14, -2.2):
          assert 0 <= fbm(x, 5, 4) <= 1
      rough = [fbm(x / 20, 5, 5) for x in range(200)]
      smooth_ = [fbm(x / 20, 5, 1) for x in range(200)]
      assert sum(abs(a - b) for a, b in zip(rough, rough[1:])) > sum(abs(a - b) for a, b in zip(smooth_, smooth_[1:]))
      assert fbm(2.0, 5, 3) == fbm(2.0, 5, 3) and fbm(2.0, 5, 3) != fbm(2.0, 6, 3)
      try:
          fbm(1, 1, 0)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "need an octave" in str(e)
