- title: A bouncing ball and particles
  intro: A ball bouncing inside a box drawn as text, particles dying out, and a fixed time step.
  code: |
    import math
    import random


    def make_particles(n, seed):
        """A PARTICLE SYSTEM makes fire, smoke and fireworks from many tiny objects. Make n particles with a random.Random(seed) generator. For each one, in this order: angle = rng.uniform(0, math.pi), speed = rng.uniform(2, 6), life = rng.uniform(0.5, 2.0). The particle is a dict with x = 0, y = 0, vx = cos(angle) * speed, vy = sin(angle) * speed and life, with vx, vy and life rounded to 4 decimals. Return the list."""
        rng = random.Random(seed)
        out = []
        for _ in range(n):
            angle = rng.uniform(0, math.pi)
            speed = rng.uniform(2, 6)
            life = rng.uniform(0.5, 2.0)
            out.append({"x": 0, "y": 0, "vx": round(math.cos(angle) * speed, 4), "vy": round(math.sin(angle) * speed, 4), "life": round(life, 4)})
        return out


    def step_particles(particles, dt, gravity):
        """Advance every particle by dt and return a NEW list (the old particles must not change): vy += gravity * dt, x += vx * dt, y += vy * dt, life -= dt; round x, y, vy and life to 6 decimals. Particles whose life is now 0 or less are REMOVED."""
        out = []
        for p in particles:
            vy = p["vy"] + gravity * dt
            life = p["life"] - dt
            if life <= 1e-9:
                continue
            out.append({"x": round(p["x"] + p["vx"] * dt, 6), "y": round(p["y"] + vy * dt, 6), "vx": p["vx"], "vy": round(vy, 6), "life": round(life, 6)})
        return out


    def run_simulation(n, seed, dt, steps):
        """Make n particles with the seed, then step them `steps` times with gravity -9.8, recording how many are still ALIVE after each step. Return that list of `steps` counts."""
        parts = make_particles(n, seed)
        counts = []
        for _ in range(steps):
            parts = step_particles(parts, dt, -9.8)
            counts.append(len(parts))
        return counts


    def fixed_steps(frame_ms, step_ms):
        """A GAME LOOP runs the physics in FIXED time steps even though frames take different amounts of real time. `frame_ms` is the list of how long each frame took, in whole milliseconds, and step_ms the fixed step. Keep a time ACCUMULATOR: for each frame add its time, run accumulator // step_ms physics steps, and keep the remainder (accumulator % step_ms). Return (list of the steps run in each frame, the leftover accumulator)."""
        acc = 0
        steps = []
        for f in frame_ms:
            acc += f
            steps.append(acc // step_ms)
            acc %= step_ms
        return (steps, acc)


    def circles_collide(c1, r1, c2, r2):
        """Do two circles overlap? True when the distance between their centres is LESS than the sum of the radii (touching exactly does not count). Compare squared distances to avoid a square root."""
        dx, dy = c1[0] - c2[0], c1[1] - c2[1]
        return dx * dx + dy * dy < (r1 + r2) ** 2


    def rects_overlap(a, b):
        """Do two axis-aligned rectangles, each (x, y, width, height) with (x, y) the corner with the smallest coordinates, overlap? They do when they overlap along BOTH axes; touching edges do not count."""
        return a[0] < b[0] + b[2] and b[0] < a[0] + a[2] and a[1] < b[1] + b[3] and b[1] < a[1] + a[3]


    def wall_bounce(x, y, vx, vy, radius, width, height):
        """A ball of the given radius inside a box from (0, 0) to (width, height). If it has gone past the left wall (x < radius) put x at radius and reverse vx; past the right wall (x > width - radius) put x at width - radius and reverse vx; do the same for y with the bottom (0) and top (height) walls. Return (x, y, vx, vy)."""
        if x < radius:
            x, vx = radius, -vx
        elif x > width - radius:
            x, vx = width - radius, -vx
        if y < radius:
            y, vy = radius, -vy
        elif y > height - radius:
            y, vy = height - radius, -vy
        return (x, y, vx, vy)


    def ball_step(ball, dt, width, height, gravity):
        """A ball is a dict with keys x, y, vx, vy and r. Return a NEW dict after one time step (do not change the original): vy = vy + gravity * dt, then x += vx * dt and y += vy * dt, then wall_bounce. Round x, y, vx and vy to 6 decimals; r stays the same."""
        vy = ball["vy"] + gravity * dt
        x = ball["x"] + ball["vx"] * dt
        y = ball["y"] + vy * dt
        x, y, vx, vy = wall_bounce(x, y, ball["vx"], vy, ball["r"], width, height)
        return {"x": round(x, 6), "y": round(y, 6), "vx": round(vx, 6), "vy": round(vy, 6), "r": ball["r"]}


    def spring_force(x, rest, k):
        """HOOKE'S LAW: a spring pulls back toward its rest length with a force proportional to how far it is stretched: -k * (x - rest)."""
        return -k * (x - rest)


    def verlet_start(pos, vel, accel, dt):
        """VERLET integration remembers the PREVIOUS position instead of storing a velocity. To start it you need a previous position: pos - vel * dt + 0.5 * accel * dt * dt."""
        return pos - vel * dt + 0.5 * accel * dt * dt


    def verlet_step(pos, prev, accel, dt):
        """One Verlet step (1D): new = 2 * pos - prev + accel * dt * dt. Return (new, pos), the new position and the one to remember as 'previous'."""
        return (2 * pos - prev + accel * dt * dt, pos)


    def simulate_spring(x0, v0, k, mass, damping, dt, steps):
        """A mass on a spring (1D, rest position 0). Each step: the acceleration is (spring_force(x, 0, k) - damping * v) / mass (damping is friction that removes energy); then v = v + a * dt (semi-implicit Euler) and x = x + v * dt. Return the list of positions INCLUDING the start (steps + 1 numbers), each rounded to 4 decimals."""
        x, v = x0, v0
        out = [round(x, 4)]
        for _ in range(steps):
            a = (spring_force(x, 0, k) - damping * v) / mass
            v = v + a * dt
            x = x + v * dt
            out.append(round(x, 4))
        return out

    ball = {"x": 2, "y": 8, "vx": 6, "vy": 0, "r": 1}
    rows = []
    for frame in range(60):
        ball = ball_step(ball, 0.05, 20, 10, -9.8)
        rows.append((round(ball["x"]), round(ball["y"])))
    grid = [["." for _ in range(21)] for _ in range(11)]
    for x, y in rows:
        grid[10 - y][x] = "o"
    for line in grid:
        print("".join(line))
    print("particles still alive each 5th step:", run_simulation(200, 4, 0.1, 25)[::5])
    print("physics steps for frames of 16, 20, 14, 30 ms with a 10 ms step:", fixed_steps([16, 20, 14, 30], 10))
