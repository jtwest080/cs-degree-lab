      assert all(p["x"] == 0 and p["y"] == 0 and p["vy"] >= 0 and 0.5 <= p["life"] <= 2.0 for p in a)
      assert all(1.99 <= (p["vx"] ** 2 + p["vy"] ** 2) ** 0.5 <= 6.01 for p in a)
