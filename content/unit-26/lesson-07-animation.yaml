      assert len(c) == 25 and c == sorted(c, reverse=True) and c[0] <= 100 and c[-1] == 0 and c[0] > 80
      assert run_simulation(30, 3, 0.1, 5) == run_simulation(30, 3, 0.1, 5) and run_simulation(0, 1, 0.1, 3) == [0, 0, 0]
      assert run_simulation(100, 3, 1.0, 1)[0] < 100
