id: u26-animation
title: Animation and Physics
minutes: 100
objective: Make things move. You will ease and tween values over time, step objects through simple physics with Euler and Verlet integration, simulate springs and bouncing, detect collisions, build a particle system, and run it in a fixed-time-step game loop.
outcomes:
- Use easing and keyframes
- Integrate motion step by step
- Simulate gravity, bounces and springs
- Detect collisions between circles, rectangles and walls
- Build a particle system
- Explain a fixed time step game loop
sections:
- heading: Animation is values over time
  body: 'A moving picture is a sequence of still **frames** shown quickly, typically 30 or 60 per second. An animation is just a value, such as a position, a size or a colour, that changes from frame to frame. Animators set **keyframes**, the important values at chosen times, and the computer fills in the **in-between** frames, which is called **tweening**. The simplest in-between is linear: move at constant speed. Real objects do not move like that. They speed up and slow down, so we **ease** the motion with a curve: **ease-in** starts slowly, **ease-out** ends slowly, and **ease-in-out** does both. An easing function turns the time t (0 to 1) into a *progress* (0 to 1) which is then used to blend the start and end values. Because functions are values in Python, tween can take the easing function as an argument.'
- heading: Simulating physics
  body: |-
    Instead of drawing the motion we can **simulate** it. Newton's laws say that **acceleration** changes **velocity** and velocity changes **position**. A computer cannot solve that continuously, so it takes small time steps **dt** (say 1/60 of a second): add acceleration times dt to the velocity, then add velocity times dt to the position. This is **numerical integration** and the simple version is **Euler integration**. Updating the velocity first and then moving with the new velocity, **semi-implicit Euler**, stays stable far longer than the naive order. **Verlet integration** stores the previous position instead of a velocity, which is very robust and used for cloth and ropes.

    Gravity is a constant downward acceleration. A **bounce** reverses the vertical velocity and multiplies it by a **restitution** between 0 and 1 to lose energy. **Hooke's law** says a spring pulls back with a force proportional to how far it is stretched; with **damping** friction the wobble dies away. Everything in a physics engine is built from these simple ingredients repeated thousands of times.
- heading: Collisions, particles and the game loop
  body: |-
    To make objects interact we must **detect collisions**. Two circles overlap when the distance between their centres is less than the sum of their radii; comparing squared distances avoids a slow square root. Two axis-aligned rectangles overlap when their ranges overlap on both the x axis and the y axis. Walls are the simplest case: if a ball has passed a wall, put it back and reverse that velocity component.

    A **particle system** creates fire, smoke, sparks and rain from hundreds of tiny short-lived objects. Each particle has a position, velocity and **life**; every frame it moves, ages, and is removed when its life runs out. A random generator with a fixed **seed** makes the effect repeatable.

    Finally a **game loop** repeats forever: read input, update the simulation, draw. If you update by however long the last frame took, a slow computer would simulate differently from a fast one. The fix is a **fixed time step**: keep an **accumulator** of real elapsed time and run the physics in equal steps (for example 10 ms) as many times as fit, carrying the remainder to the next frame. Every machine then computes exactly the same simulation.
examples:
- title: Easing and a thrown ball
  intro: Easing curves, tweening, keyframes and a projectile.
  code: |
    def clamp01(t):
        """Keep t between 0 and 1."""
        return max(0.0, min(1.0, t))


    def ease_in(t):
        """Start slowly and speed up: t * t (t clamped to 0..1 first), rounded to 6 decimals."""
        t = clamp01(t)
        return round(t * t, 6)


    def ease_out(t):
        """Start fast and slow down: 1 - (1 - t) * (1 - t) (t clamped first), rounded to 6 decimals."""
        t = clamp01(t)
        return round(1 - (1 - t) * (1 - t), 6)


    def ease_in_out(t):
        """Gentle at both ends: t * t * (3 - 2 * t) (t clamped first), rounded to 6 decimals."""
        t = clamp01(t)
        return round(t * t * (3 - 2 * t), 6)


    def tween(a, b, t, easing):
        """TWEENING (in-betweening): the value between a and b at time t from 0 to 1, shaped by an EASING FUNCTION that you receive as an argument and call: a + (b - a) * easing(t), rounded to 6 decimals."""
        return round(a + (b - a) * easing(t), 6)


    def keyframes(frames, t):
        """`frames` is a list of (time, value) pairs sorted by time. Return the value at time t by linear blending between the two frames around it. Before the first frame give the first value; after the last frame give the last value. Round to 6 decimals. ValueError('no keyframes') for an empty list."""
        if not frames:
            raise ValueError("no keyframes")
        if t <= frames[0][0]:
            return round(frames[0][1], 6)
        if t >= frames[-1][0]:
            return round(frames[-1][1], 6)
        for (t0, v0), (t1, v1) in zip(frames, frames[1:]):
            if t0 <= t <= t1:
                return round(v0 + (v1 - v0) * (t - t0) / (t1 - t0), 6)


    import math


    def euler_step(pos, vel, accel, dt):
        """Move a 2D object forward by one small time step dt. SEMI-IMPLICIT EULER INTEGRATION: first change the velocity with the acceleration, new_vel = vel + accel * dt, then move with the NEW velocity, new_pos = pos + new_vel * dt. All three are (x, y) tuples; return (new_pos, new_vel), each rounded to 6 decimals per component."""
        new_vel = (vel[0] + accel[0] * dt, vel[1] + accel[1] * dt)
        new_pos = (pos[0] + new_vel[0] * dt, pos[1] + new_vel[1] * dt)
        return ((round(new_pos[0], 6), round(new_pos[1], 6)), (round(new_vel[0], 6), round(new_vel[1], 6)))


    def simulate_projectile(x0, y0, vx, vy, gravity, dt, steps):
        """Throw something. Start at (x0, y0) with velocity (vx, vy), acceleration (0, gravity) (gravity is negative, for example -9.8) and apply euler_step `steps` times. Return the list of positions INCLUDING the start (steps + 1 tuples), each rounded to 4 decimals."""
        pos, vel = (x0, y0), (vx, vy)
        out = [(round(x0, 4), round(y0, 4))]
        for _ in range(steps):
            pos, vel = euler_step(pos, vel, (0, gravity), dt)
            out.append((round(pos[0], 4), round(pos[1], 4)))
        return out


    def bounce(y, vy, floor, restitution):
        """If the object has sunk below the floor (y < floor) put it back ON the floor and reverse its vertical velocity, losing energy: new vy = -vy * restitution (1 = perfectly bouncy, 0 = no bounce); return (floor, new_vy). Otherwise return (y, vy) unchanged."""
        if y < floor:
            return (floor, -vy * restitution)
        return (y, vy)


    def time_of_flight(y0, vy, g):
        """How long a thrown object stays up before reaching height 0, from starting height y0 with upward speed vy and gravity strength g (a positive number): (vy + sqrt(vy * vy + 2 * g * y0)) / g, rounded to 4 decimals."""
        return round((vy + math.sqrt(vy * vy + 2 * g * y0)) / g, 4)

    print("easing at t = 0, 0.25, 0.5, 0.75, 1")
    for f in (ease_in, ease_out, ease_in_out):
        print(f.__name__, [f(t / 4) for t in range(5)])
    print("tween a box from 0 to 100 at t = 0.5 with ease_in:", tween(0, 100, 0.5, ease_in))
    print("keyframes:", [keyframes([(0, 0), (2, 10), (6, 10), (10, 0)], t) for t in (1, 4, 8)])
    path = simulate_projectile(0, 0, 8, 12, -9.8, 0.1, 25)
    print("thrown ball positions:", path[::5])
    print("time in the air:", time_of_flight(0, 12, 9.8))
