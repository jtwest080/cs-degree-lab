  - Never change the list you receive; build and return a new one.
  solution: |
    import math
    import random




    def make_particles(n, seed):
        """A PARTICLE SYSTEM makes fire, smoke and fireworks from many tiny objects. Make n particles with a random.Random(seed) generator. For each one, in this order: angle = rng.uniform(0, math.pi), speed = rng.uniform(2, 6), life = rng.uniform(0.5, 2.0). The particle is a dict with x = 0, y = 0, vx = cos(angle) * speed, vy = sin(angle) * speed and life, with vx, vy and life rounded to 4 decimals. Return the list."""
        rng = random.Random(seed)
        out = []
        for _ in range(n):
            angle = rng.uniform(0, math.pi)
            speed = rng.uniform(2, 6)
            life = rng.uniform(0.5, 2.0)
            out.append({"x": 0, "y": 0, "vx": round(math.cos(angle) * speed, 4), "vy": round(math.sin(angle) * speed, 4), "life": round(life, 4)})
        return out


    def step_particles(particles, dt, gravity):
        """Advance every particle by dt and return a NEW list (the old particles must not change): vy += gravity * dt, x += vx * dt, y += vy * dt, life -= dt; round x, y, vy and life to 6 decimals. Particles whose life is now 0 or less are REMOVED."""
        out = []
        for p in particles:
            vy = p["vy"] + gravity * dt
            life = p["life"] - dt
            if life <= 1e-9:
                continue
            out.append({"x": round(p["x"] + p["vx"] * dt, 6), "y": round(p["y"] + vy * dt, 6), "vx": p["vx"], "vy": round(vy, 6), "life": round(life, 6)})
        return out


    def run_simulation(n, seed, dt, steps):
        """Make n particles with the seed, then step them `steps` times with gravity -9.8, recording how many are still ALIVE after each step. Return that list of `steps` counts."""
        parts = make_particles(n, seed)
        counts = []
        for _ in range(steps):
            parts = step_particles(parts, dt, -9.8)
            counts.append(len(parts))
        return counts


    def fixed_steps(frame_ms, step_ms):
        """A GAME LOOP runs the physics in FIXED time steps even though frames take different amounts of real time. `frame_ms` is the list of how long each frame took, in whole milliseconds, and step_ms the fixed step. Keep a time ACCUMULATOR: for each frame add its time, run accumulator // step_ms physics steps, and keep the remainder (accumulator % step_ms). Return (list of the steps run in each frame, the leftover accumulator)."""
        acc = 0
        steps = []
        for f in frame_ms:
            acc += f
            steps.append(acc // step_ms)
            acc %= step_ms
        return (steps, acc)
  explanation: Fixed time steps make simulations behave identically on fast and slow computers.
commonMistakes:
- title: Updating the position before the velocity
  explanation: Semi-implicit Euler changes the velocity first.
- title: Making the time step depend on the frame rate
  explanation: Use a fixed step and an accumulator.
- title: Changing the particle list while looping over it
  explanation: Build a new list instead.
- title: Forgetting to move the ball back from inside the wall
  explanation: Reset its position as well as reversing velocity.
- title: Using a bounce that never loses energy
  explanation: Restitution below 1 makes bounces die out.
summary:
- Tweening fills in values between keyframes; easing makes the motion natural.
- 'Physics simulation repeats small steps: velocity from acceleration, position from velocity.'
- Springs follow Hooke's law; damping removes energy.
- Collisions compare shapes; walls reset position and flip velocity.
- Games use particle systems and a fixed time step loop.
