      assert p == [(0, 0), (1.0, 0.9), (2.0, 1.7)]
      q = simulate_projectile(0, 10, 3, 0, -10, 0.5, 3)
      assert len(q) == 4 and q[0] == (0, 10) and q[-1][0] == 4.5 and q[1][1] == 7.5 and q[3][1] < q[2][1] < q[1][1]
      assert simulate_projectile(1, 2, 3, 4, -9.8, 0.1, 0) == [(1, 2)]
      top = max(y for x, y in simulate_projectile(0, 0, 0, 20, -9.8, 0.01, 500))
      assert 20 < top < 21.5
