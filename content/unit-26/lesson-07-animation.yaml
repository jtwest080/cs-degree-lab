  solution: |
    def circles_collide(c1, r1, c2, r2):
        """Do two circles overlap? True when the distance between their centres is LESS than the sum of the radii (touching exactly does not count). Compare squared distances to avoid a square root."""
        dx, dy = c1[0] - c2[0], c1[1] - c2[1]
        return dx * dx + dy * dy < (r1 + r2) ** 2


    def rects_overlap(a, b):
        """Do two axis-aligned rectangles, each (x, y, width, height) with (x, y) the corner with the smallest coordinates, overlap? They do when they overlap along BOTH axes; touching edges do not count."""
        return a[0] < b[0] + b[2] and b[0] < a[0] + a[2] and a[1] < b[1] + b[3] and b[1] < a[1] + a[3]


    def wall_bounce(x, y, vx, vy, radius, width, height):
        """A ball of the given radius inside a box from (0, 0) to (width, height). If it has gone past the left wall (x < radius) put x at radius and reverse vx; past the right wall (x > width - radius) put x at width - radius and reverse vx; do the same for y with the bottom (0) and top (height) walls. Return (x, y, vx, vy)."""
        if x < radius:
            x, vx = radius, -vx
        elif x > width - radius:
            x, vx = width - radius, -vx
        if y < radius:
            y, vy = radius, -vy
        elif y > height - radius:
            y, vy = height - radius, -vy
        return (x, y, vx, vy)


    def ball_step(ball, dt, width, height, gravity):
        """A ball is a dict with keys x, y, vx, vy and r. Return a NEW dict after one time step (do not change the original): vy = vy + gravity * dt, then x += vx * dt and y += vy * dt, then wall_bounce. Round x, y, vx and vy to 6 decimals; r stays the same."""
        vy = ball["vy"] + gravity * dt
        x = ball["x"] + ball["vx"] * dt
        y = ball["y"] + vy * dt
        x, y, vx, vy = wall_bounce(x, y, ball["vx"], vy, ball["r"], width, height)
        return {"x": round(x, 6), "y": round(y, 6), "vx": round(vx, 6), "vy": round(vy, 6), "r": ball["r"]}
  explanation: Collision detection is the most expensive part of a physics engine, so it is done cheaply first and precisely later.
- id: particles
  title: 'Capstone: particles and the game loop'
  difficulty: 5
  prompt: 'Fire, smoke and fireworks are made of hundreds of tiny **particles**. Write `make_particles(n, seed)`: create `n` particles with a `random.Random(seed)` generator, each in this order: `angle = rng.uniform(0, math.pi)`, `speed = rng.uniform(2, 6)`, `life = rng.uniform(0.5, 2.0)`. A particle is a dict with `x = 0`, `y = 0`, `vx = cos(angle) * speed`, `vy = sin(angle) * speed` and `life`, with `vx`, `vy` and `life` rounded to 4 decimals. Write `step_particles(particles, dt, gravity)`: return a **new** list (the old particles must not change) where each particle has `vy += gravity * dt`, `x += vx * dt`, `y += vy * dt` and `life -= dt` (round `x, y, vy, life` to 6 decimals), and particles whose life is now `0` or less are **removed**. Write `run_simulation(n, seed, dt, steps)`: make the particles, step them `steps` times with gravity `-9.8`, and return the list of how many are still alive after each step. Write `fixed_steps(frame_ms, step_ms)`: a **game loop** runs physics in **fixed** time steps even though frames take different amounts of real time. Keep an **accumulator**: for each frame add its time (whole milliseconds), run `accumulator // step_ms` steps and keep `accumulator % step_ms`. Return `(steps run in each frame, leftover)`.'
