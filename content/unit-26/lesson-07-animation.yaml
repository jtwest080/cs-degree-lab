      assert wall_bounce(9.5, 5, 2, 0, 1, 10, 10) == (9, 5, -2, 0) and wall_bounce(5, 0.2, 0, -3, 1, 10, 10) == (5, 1, 0, 3) and wall_bounce(5, 10, 0, 3, 1, 10, 10) == (5, 9, 0, -3)
