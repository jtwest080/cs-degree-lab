    code: |
      assert bounce(-0.5, -4, 0, 0.5) == (0, 2.0) and bounce(1, -4, 0, 0.5) == (1, -4) and bounce(0, -4, 0, 0.5) == (0, -4) and bounce(-1, -10, 0, 1) == (0, 10) and bounce(-1, -10, 0, 0) == (0, 0)
      assert time_of_flight(0, 10, 10) == 2 and time_of_flight(5, 0, 10) == 1 and time_of_flight(0, 9.8, 9.8) == 2 and time_of_flight(10, 0, 9.8) == 1.4286
