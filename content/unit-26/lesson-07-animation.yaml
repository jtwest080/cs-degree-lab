      n = step_particles(ps, 0.1, -10)
      assert n == [{"x": 0.2, "y": 0.3, "vx": 2, "vy": 3.0, "life": 0.9}]
      assert ps[0]["x"] == 0 and len(ps) == 2 and step_particles([], 0.1, -9.8) == []
      assert step_particles([{"x": 0, "y": 0, "vx": 0, "vy": 0, "life": 0.1}], 0.1, 0) == []
  - name: running
