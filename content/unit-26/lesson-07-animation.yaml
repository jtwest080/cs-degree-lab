  solution: |
    def spring_force(x, rest, k):
        """HOOKE'S LAW: a spring pulls back toward its rest length with a force proportional to how far it is stretched: -k * (x - rest)."""
        return -k * (x - rest)


    def verlet_start(pos, vel, accel, dt):
        """VERLET integration remembers the PREVIOUS position instead of storing a velocity. To start it you need a previous position: pos - vel * dt + 0.5 * accel * dt * dt."""
        return pos - vel * dt + 0.5 * accel * dt * dt


    def verlet_step(pos, prev, accel, dt):
        """One Verlet step (1D): new = 2 * pos - prev + accel * dt * dt. Return (new, pos), the new position and the one to remember as 'previous'."""
        return (2 * pos - prev + accel * dt * dt, pos)


    def simulate_spring(x0, v0, k, mass, damping, dt, steps):
        """A mass on a spring (1D, rest position 0). Each step: the acceleration is (spring_force(x, 0, k) - damping * v) / mass (damping is friction that removes energy); then v = v + a * dt (semi-implicit Euler) and x = x + v * dt. Return the list of positions INCLUDING the start (steps + 1 numbers), each rounded to 4 decimals."""
        x, v = x0, v0
        out = [round(x, 4)]
        for _ in range(steps):
            a = (spring_force(x, 0, k) - damping * v) / mass
            v = v + a * dt
            x = x + v * dt
            out.append(round(x, 4))
        return out
  explanation: Cloth, hair and ragdolls in games are many springs simulated this way.
