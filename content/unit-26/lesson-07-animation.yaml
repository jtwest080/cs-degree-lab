  - First update the velocity from the acceleration, then update the position from the new velocity.
  solution: |
    import math




    def euler_step(pos, vel, accel, dt):
        """Move a 2D object forward by one small time step dt. SEMI-IMPLICIT EULER INTEGRATION: first change the velocity with the acceleration, new_vel = vel + accel * dt, then move with the NEW velocity, new_pos = pos + new_vel * dt. All three are (x, y) tuples; return (new_pos, new_vel), each rounded to 6 decimals per component."""
        new_vel = (vel[0] + accel[0] * dt, vel[1] + accel[1] * dt)
        new_pos = (pos[0] + new_vel[0] * dt, pos[1] + new_vel[1] * dt)
        return ((round(new_pos[0], 6), round(new_pos[1], 6)), (round(new_vel[0], 6), round(new_vel[1], 6)))


    def simulate_projectile(x0, y0, vx, vy, gravity, dt, steps):
        """Throw something. Start at (x0, y0) with velocity (vx, vy), acceleration (0, gravity) (gravity is negative, for example -9.8) and apply euler_step `steps` times. Return the list of positions INCLUDING the start (steps + 1 tuples), each rounded to 4 decimals."""
        pos, vel = (x0, y0), (vx, vy)
        out = [(round(x0, 4), round(y0, 4))]
        for _ in range(steps):
            pos, vel = euler_step(pos, vel, (0, gravity), dt)
            out.append((round(pos[0], 4), round(pos[1], 4)))
        return out


    def bounce(y, vy, floor, restitution):
        """If the object has sunk below the floor (y < floor) put it back ON the floor and reverse its vertical velocity, losing energy: new vy = -vy * restitution (1 = perfectly bouncy, 0 = no bounce); return (floor, new_vy). Otherwise return (y, vy) unchanged."""
        if y < floor:
            return (floor, -vy * restitution)
        return (y, vy)


    def time_of_flight(y0, vy, g):
        """How long a thrown object stays up before reaching height 0, from starting height y0 with upward speed vy and gravity strength g (a positive number): (vy + sqrt(vy * vy + 2 * g * y0)) / g, rounded to 4 decimals."""
        return round((vy + math.sqrt(vy * vy + 2 * g * y0)) / g, 4)
  explanation: Games run this loop 60 times a second for every moving object.
