exercises:
- id: ease
  title: Easing and keyframes
  difficulty: 3
  prompt: '**Animation** changes values over time. **Tweening** (in-betweening) computes the values between two **keyframes**, and an **easing function** shapes the motion: instead of constant speed, things speed up or slow down like real objects. Write `clamp01(t)` (keep `t` between 0 and 1), `ease_in(t)` (`t * t`), `ease_out(t)` (`1 - (1 - t) * (1 - t)`) and `ease_in_out(t)` (`t * t * (3 - 2 * t)`); each clamps `t` first and rounds to 6 decimals. Write `tween(a, b, t, easing)`: `a + (b - a) * easing(t)` rounded to 6 decimals; `easing` is a **function passed in as an argument**, which you call. Write `keyframes(frames, t)`: `frames` is a list of `(time, value)` pairs sorted by time; return the value at time `t` by linear blending between the two frames around `t` (the first value before the first frame, the last value after the last), rounded to 6 decimals; `ValueError("no keyframes")` for an empty list.'
  starter: |-
    def clamp01(t):
        """Keep t between 0 and 1."""
        pass


    def ease_in(t):
        """Start slowly and speed up: t * t (t clamped to 0..1 first), rounded to 6 decimals."""
        pass


    def ease_out(t):
        """Start fast and slow down: 1 - (1 - t) * (1 - t) (t clamped first), rounded to 6 decimals."""
        pass


    def ease_in_out(t):
        """Gentle at both ends: t * t * (3 - 2 * t) (t clamped first), rounded to 6 decimals."""
        pass


    def tween(a, b, t, easing):
        """TWEENING (in-betweening): the value between a and b at time t from 0 to 1, shaped by an EASING FUNCTION that you receive as an argument and call: a + (b - a) * easing(t), rounded to 6 decimals."""
        pass


    def keyframes(frames, t):
        """`frames` is a list of (time, value) pairs sorted by time. Return the value at time t by linear blending between the two frames around it. Before the first frame give the first value; after the last frame give the last value. Round to 6 decimals. ValueError('no keyframes') for an empty list."""
        pass
  tests:
  - name: easing curves
    code: |
      assert [ease_in(t / 4) for t in range(5)] == [0, 0.0625, 0.25, 0.5625, 1] and [ease_out(t / 4) for t in range(5)] == [0, 0.4375, 0.75, 0.9375, 1]
      assert ease_in_out(0.25) == 0.15625 and ease_in_out(0.5) == 0.5 and ease_in(-1) == 0 and ease_out(9) == 1 and ease_in_out(2) == 1 and clamp01(0.3) == 0.3
      assert ease_in(0.5) < 0.5 < ease_out(0.5)
  - name: tweening
    code: |
      assert tween(0, 100, 0.5, ease_in) == 25 and tween(0, 100, 0.5, ease_out) == 75 and tween(10, 20, 0.25, lambda t: t) == 12.5
      assert tween(50, 0, 1, ease_in_out) == 0 and tween(5, 5, 0.7, ease_in) == 5 and tween(0, 1, 0.5, lambda t: 1) == 1
  - name: keyframes
    code: |
      f = [(0, 0), (2, 10), (6, 10), (10, 0)]
      assert keyframes(f, 1) == 5 and keyframes(f, 2) == 10 and keyframes(f, 4) == 10 and keyframes(f, 8) == 5 and keyframes(f, 0) == 0
      assert keyframes(f, -5) == 0 and keyframes(f, 50) == 0 and keyframes([(3, 7)], 1) == 7 and keyframes([(3, 7)], 9) == 7
      assert keyframes([(0, 0), (3, 1)], 1) == 0.333333
      try:
          keyframes([], 1)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "no keyframes" in str(e)
  hints:
  - 'The easing function is just another value: call it as easing(t).'
  solution: |
    def clamp01(t):
        """Keep t between 0 and 1."""
        return max(0.0, min(1.0, t))


    def ease_in(t):
        """Start slowly and speed up: t * t (t clamped to 0..1 first), rounded to 6 decimals."""
        t = clamp01(t)
        return round(t * t, 6)


    def ease_out(t):
        """Start fast and slow down: 1 - (1 - t) * (1 - t) (t clamped first), rounded to 6 decimals."""
        t = clamp01(t)
        return round(1 - (1 - t) * (1 - t), 6)


    def ease_in_out(t):
        """Gentle at both ends: t * t * (3 - 2 * t) (t clamped first), rounded to 6 decimals."""
        t = clamp01(t)
        return round(t * t * (3 - 2 * t), 6)


    def tween(a, b, t, easing):
        """TWEENING (in-betweening): the value between a and b at time t from 0 to 1, shaped by an EASING FUNCTION that you receive as an argument and call: a + (b - a) * easing(t), rounded to 6 decimals."""
        return round(a + (b - a) * easing(t), 6)


    def keyframes(frames, t):
        """`frames` is a list of (time, value) pairs sorted by time. Return the value at time t by linear blending between the two frames around it. Before the first frame give the first value; after the last frame give the last value. Round to 6 decimals. ValueError('no keyframes') for an empty list."""
        if not frames:
            raise ValueError("no keyframes")
        if t <= frames[0][0]:
            return round(frames[0][1], 6)
        if t >= frames[-1][0]:
            return round(frames[-1][1], 6)
        for (t0, v0), (t1, v1) in zip(frames, frames[1:]):
            if t0 <= t <= t1:
                return round(v0 + (v1 - v0) * (t - t0) / (t1 - t0), 6)
  explanation: Every animation program is a tweening engine with a library of easing functions.
- id: physics
  title: Moving things with physics
  difficulty: 4
  prompt: 'To simulate motion step by step we **integrate**: repeat tiny updates of velocity and position. Write `euler_step(pos, vel, accel, dt)` for a 2D object (all `(x, y)` tuples): **semi-implicit Euler integration** first changes the velocity, `new_vel = vel + accel * dt`, then moves with the **new** velocity, `new_pos = pos + new_vel * dt`; return `(new_pos, new_vel)` with every component rounded to 6 decimals. Write `simulate_projectile(x0, y0, vx, vy, gravity, dt, steps)`: start at `(x0, y0)` with velocity `(vx, vy)` and acceleration `(0, gravity)` (gravity is **negative**, such as `-9.8`), apply `euler_step` `steps` times and return the list of positions **including the start** (`steps + 1` tuples), rounded to 4 decimals. Write `bounce(y, vy, floor, restitution)`: if `y < floor` put the object **on** the floor and reverse its vertical velocity, losing energy, `-vy * restitution` (1 is perfectly bouncy); return `(floor, new_vy)`; otherwise return `(y, vy)` unchanged. Write `time_of_flight(y0, vy, g)`: how long a thrown object stays up before reaching height 0, `(vy + sqrt(vy * vy + 2 * g * y0)) / g` (`g` is a positive number), rounded to 4 decimals.'
  starter: |-
    import math




    def euler_step(pos, vel, accel, dt):
        """Move a 2D object forward by one small time step dt. SEMI-IMPLICIT EULER INTEGRATION: first change the velocity with the acceleration, new_vel = vel + accel * dt, then move with the NEW velocity, new_pos = pos + new_vel * dt. All three are (x, y) tuples; return (new_pos, new_vel), each rounded to 6 decimals per component."""
        pass


    def simulate_projectile(x0, y0, vx, vy, gravity, dt, steps):
        """Throw something. Start at (x0, y0) with velocity (vx, vy), acceleration (0, gravity) (gravity is negative, for example -9.8) and apply euler_step `steps` times. Return the list of positions INCLUDING the start (steps + 1 tuples), each rounded to 4 decimals."""
        pass


    def bounce(y, vy, floor, restitution):
        """If the object has sunk below the floor (y < floor) put it back ON the floor and reverse its vertical velocity, losing energy: new vy = -vy * restitution (1 = perfectly bouncy, 0 = no bounce); return (floor, new_vy). Otherwise return (y, vy) unchanged."""
        pass


    def time_of_flight(y0, vy, g):
        """How long a thrown object stays up before reaching height 0, from starting height y0 with upward speed vy and gravity strength g (a positive number): (vy + sqrt(vy * vy + 2 * g * y0)) / g, rounded to 4 decimals."""
        pass
  tests:
  - name: one step
    code: |
      assert euler_step((0, 0), (10, 10), (0, -10), 0.1) == ((1.0, 0.9), (10.0, 9.0)) and euler_step((5, 5), (0, 0), (0, 0), 1) == ((5, 5), (0, 0))
      assert euler_step((0, 0), (0, 0), (2, 0), 0.5) == ((0.5, 0.0), (1.0, 0.0)) and euler_step((1, 1), (1, 1), (0, 0), 0) == ((1, 1), (1, 1))
  - name: projectile
    code: |
