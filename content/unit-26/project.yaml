    a = render_mesh(CUBE_VERTICES, CUBE_TRIANGLES, 0, 0, 5, 5, 8, 41, 41, (0, 0, -1), 0.2)
    b = render_mesh(CUBE_VERTICES, CUBE_TRIANGLES, 0, 90, 5, 5, 8, 41, 41, (0, 0, -1), 0.2)
    c = render_mesh(CUBE_VERTICES, CUBE_TRIANGLES, 20, 35, 5, 5, 8, 41, 41, (0, 0, -1), 0.2)
    assert a == b and a != c
    shades = set("".join(c)) - {"."}
    assert len(shades) >= 3
    assert any(r.strip(".") for r in c)
    d = render_mesh(CUBE_VERTICES, CUBE_TRIANGLES, 0, 45, 5, 5, 8, 41, 41, (0, 0, -1), 0.2)
    assert len(set("".join(d)) - {"."}) == 1 and "%" in "".join(d)
