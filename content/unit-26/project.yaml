    assert rotate_x((0, 1, 0), 90) == (0.0, 0.0, 1.0) and rotate_x((0, 0, 1), 90) == (0.0, -1.0, 0.0) and rotate_x((5, 2, 3), 180) == (5.0, -2.0, -3.0)
    assert "-0.0" not in str(rotate_y((1, 0, 0), 90)) + str(rotate_x((0, 0, 1), 90)) + str(rotate_y((0, 0, 0), 45))
    p = rotate_x(rotate_y((1, 2, 3), 33), 21)
    assert abs(length(p) - length((1, 2, 3))) < 1e-5
