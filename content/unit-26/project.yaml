  code: |
    away = ((0, 0, 5), (1, 0, 5), (0, 1, 5))
    toward = ((0, 0, 5), (0, 1, 5), (1, 0, 5))
    assert is_visible(*away) is False and is_visible(*toward) is True
    assert is_visible((0, 0, 5), (1, 0, 5), (0, 0, 6)) is False or True
    below = ((0, -2, 4), (0, -2, 6), (1, -2, 4))
    assert is_visible(*below) in (True, False)
    cube = [transform_vertex(v, 0, 0, 5) for v in CUBE_VERTICES]
    visible = [t for t in CUBE_TRIANGLES if is_visible(*(cube[i] for i in t))]
    assert len(visible) == 2
    turned = [transform_vertex(v, 25, 35, 5) for v in CUBE_VERTICES]
    assert len([t for t in CUBE_TRIANGLES if is_visible(*(turned[i] for i in t))]) in (4, 6)
