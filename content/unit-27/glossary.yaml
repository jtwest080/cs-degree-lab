# Terms introduced in Unit 27 (Human-Computer Interaction). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Human-computer interaction
  definition: The study of how people use computers and how to design systems that work well for them.
  lesson: u27-models
- term: Usability
  definition: How easily and pleasantly people can reach their goals with a product.
  lesson: u27-models
- term: User interface
  definition: The part of a program that people see and use, such as buttons, menus and text.
  lesson: u27-models
- term: Fitts's law
  definition: A rule that says the time to reach a target grows with the distance to it and shrinks as the target gets bigger.
  lesson: u27-models
- term: Hick's law
  definition: A rule that says the time to choose grows with the number of equally likely choices.
  lesson: u27-models
- term: Keystroke-level model
  definition: A method that predicts how long an expert needs for a task by adding up the times of small actions such as keys,
    points and mental pauses.
  lesson: u27-models
- term: Readability
  definition: How easy a text is to read.
  lesson: u27-models
- term: Flesch reading ease
  definition: A score that rates how easy English text is, using sentence length and syllables per word.
  lesson: u27-models
- term: Syllable
  definition: A single beat of sound in a word.
  lesson: u27-models
- term: Throughput
  definition: The amount of work or information handled in a given time.
  lesson: u27-models
- term: WCAG
  definition: The Web Content Accessibility Guidelines, a widely used set of rules for accessible websites.
  lesson: u27-access
- term: Contrast ratio
  definition: A number from 1 to 21 that compares the brightness of two colours.
  lesson: u27-access
- term: Relative luminance
  definition: How bright a colour looks to people, from 0 for black to 1 for white.
  lesson: u27-access
- term: Color blindness
  definition: A condition in which some colours are hard to tell apart.
  lesson: u27-access
- term: Focus
  definition: The widget that currently receives keyboard input.
  lesson: u27-access
- term: Focus order
  definition: The order in which the Tab key moves between widgets.
  lesson: u27-access
- term: Keyboard trap
  definition: A place where keyboard focus can enter but cannot leave.
  lesson: u27-access
- term: Assistive technology
  definition: Tools such as screen readers that help people with disabilities use computers.
  lesson: u27-access
- term: Audit
  definition: A careful check of something against a list of rules.
  lesson: u27-access
- term: Event handler
  definition: A function that runs when a certain event happens.
  lesson: u27-state
- term: State machine
  definition: A model with a fixed set of states and rules for moving from one to another.
  lesson: u27-state
- term: Undo
  definition: Taking back the last change.
  lesson: u27-state
- term: Redo
  definition: Doing again a change that was undone.
  lesson: u27-state
- term: Command pattern
  definition: A design in which each action is stored as an object or record so that it can be run, undone and repeated.
  lesson: u27-state
- term: Debounce
  definition: Waiting until events stop for a short time before reacting once.
  lesson: u27-state
- term: Throttle
  definition: Reacting to an event at most once in every time period.
  lesson: u27-state
- term: Gesture
  definition: A pattern of movement, such as a swipe, that a program recognises as a command.
  lesson: u27-state
- term: Layout
  definition: The way elements are arranged and sized on a screen.
  lesson: u27-layout
- term: Margin collapse
  definition: When the touching margins of two boxes merge into one instead of adding up.
  lesson: u27-layout
- term: Grid layout
  definition: A layout method that arranges items in rows and columns of tracks.
  lesson: u27-layout
- term: Track
  definition: One row or column of a grid.
  lesson: u27-layout
- term: Breakpoint
  definition: A screen width at which the layout changes.
  lesson: u27-layout
- term: Truncate
  definition: To cut text short, usually ending with an ellipsis.
  lesson: u27-layout
- term: Word wrap
  definition: Breaking text into lines so that it fits a given width.
  lesson: u27-layout
- term: Typo
  definition: A mistake made while typing.
  lesson: u27-forms
- term: Snippet
  definition: A short excerpt of a page shown in a search result.
  lesson: u27-forms
- term: Pagination
  definition: Splitting long lists into pages.
  lesson: u27-forms
- term: Usability test
  definition: A study in which real people try to complete tasks with a product while researchers watch.
  lesson: u27-research
- term: System Usability Scale
  definition: A ten-question survey that gives a usability score from 0 to 100.
  lesson: u27-research
- term: Wilson interval
  definition: A reliable way to compute a confidence interval for a proportion such as a success rate.
  lesson: u27-research
- term: Geometric mean
  definition: The nth root of the product of n numbers, used for times and ratios.
  lesson: u27-research
- term: Conversion rate
  definition: The fraction of visitors who complete a wanted action.
  lesson: u27-research
- term: Statistical significance
  definition: A result that is unlikely to have happened by chance alone.
  lesson: u27-research
- term: Sample size
  definition: The number of people or cases in a study.
  lesson: u27-research
- term: Heuristic evaluation
  definition: Checking a design against a list of rules of thumb.
  lesson: u27-research
- term: Severity rating
  definition: A score for how serious a usability problem is.
  lesson: u27-research
- term: Information architecture
  definition: The way content is organised and labelled so that people can find it.
  lesson: u27-ia
- term: Navigation
  definition: The menus and links that let people move around a site or app.
  lesson: u27-ia
- term: Breadcrumb
  definition: A trail of links that shows where a page sits in a site, such as Home > Shoes.
  lesson: u27-ia
- term: Click depth
  definition: The smallest number of clicks needed to reach a page from the home page.
  lesson: u27-ia
- term: Orphan page
  definition: A page that nothing links to, so people cannot reach it by browsing.
  lesson: u27-ia
- term: Dead end
  definition: A page with no links leading anywhere else.
  lesson: u27-ia
- term: Sitemap
  definition: A list or outline of all the pages of a site.
  lesson: u27-ia
- term: Card sort
  definition: A study in which people group topics written on cards.
  lesson: u27-ia
- term: Cluster
  definition: A group of items that are similar to one another.
  lesson: u27-ia
- term: Tree test
  definition: A study in which people look for items in a plain menu structure to check that the labels make sense.
  lesson: u27-ia
- term: Backtrack
  definition: A step back to a page that was already visited.
  lesson: u27-ia
- term: Stop words
  definition: Very common words, such as the and a, that are ignored when comparing texts.
  lesson: u27-ia
- term: Bag of words
  definition: A way of describing a text by how often each word occurs, ignoring word order.
  lesson: u27-ia
- term: RICE score
  definition: A way to rank ideas by reach times impact times confidence divided by effort.
  lesson: u27-ia
- term: Decision matrix
  definition: A table that scores options against weighted criteria so that they can be compared.
  lesson: u27-ia
- term: Prioritize
  definition: To decide which things to do first.
  lesson: u27-ia
