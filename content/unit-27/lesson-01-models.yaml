      except ValueError as e:
          assert "no steps" in str(e)
  - name: ranking designs
    code: |
      a = [{"op": "point", "distance": 100, "width": 10}, {"op": "choose", "n": 8}]
      b = [{"op": "think"}, {"op": "type", "text": "save"}]
      c = [{"op": "wait", "seconds": 10}]
      assert rank_designs({"slow": c, "menu": a, "keys": b}) == ["menu", "keys", "slow"] or rank_designs({"slow": c, "menu": a, "keys": b})[-1] == "slow"
      assert rank_designs({"y": a, "x": a}) == ["x", "y"] and rank_designs({}) == []
      big = [{"op": "type", "text": "a" * 100}]
      assert rank_designs({"type": big, "wait": [{"op": "wait", "seconds": 20}]}, 20) == ["wait", "type"] and rank_designs({"type": big, "wait": [{"op": "wait", "seconds": 20}]}, 200) == ["type", "wait"]
  hints:
  - Write step_time first, with one branch per operation, then build the others on top of it.
  solution: |
    import math




    def step_time(step, wpm=40):
        """The predicted time of ONE step of a task, a dict with an "op" key:
        {"op": "point", "distance": d, "width": w}: fitts_time(d, w) = 0.1 + 0.15 * log2(d / w + 1);
        {"op": "choose", "n": n}: Hick's law, 0.2 * log2(n + 1);
        {"op": "type", "text": t}: len(t) / 5 / wpm * 60;
        {"op": "think"}: 1.35;
        {"op": "wait", "seconds": s}: s (the system is slow).
        Round to 4 decimals. ValueError('unknown step') for any other op."""
        op = step["op"]
        if op == "point":
            return round(0.1 + 0.15 * math.log2(step["distance"] / step["width"] + 1), 4)
        if op == "choose":
            return round(0.2 * math.log2(step["n"] + 1), 4)
        if op == "type":
            return round(len(step["text"]) / 5 / wpm * 60, 4)
        if op == "think":
            return 1.35
        if op == "wait":
            return round(step["seconds"], 4)
        raise ValueError("unknown step")


    def task_time(steps, wpm=40):
        """The total predicted time of a task (a list of steps), the sum of step_time, rounded to 2 decimals."""
        return round(sum(step_time(s, wpm) for s in steps), 2)


    def slowest_step(steps, wpm=40):
        """The INDEX of the step that takes longest (the first one on a tie). ValueError('no steps') for an empty list."""
        if not steps:
            raise ValueError("no steps")
        times = [step_time(s, wpm) for s in steps]
        return times.index(max(times))


    def rank_designs(designs, wpm=40):
        """`designs` is a dict {name: list of steps}. Return the names sorted from the fastest task_time to the slowest, ties broken by name."""
        return [name for t, name in sorted((task_time(steps, wpm), name) for name, steps in designs.items())]
  explanation: Companies use exactly these calculations to estimate how many seconds a redesign saves, multiplied by millions of uses.
commonMistakes:
- title: Designing for yourself instead of for the users
  explanation: Test with people who are not the programmers.
- title: Making frequent buttons small and far away
  explanation: Fitts's law punishes small, distant targets.
- title: Burying options in deep menus
  explanation: Each level costs time; a flat menu is usually faster.
- title: Assuming laws are exact
  explanation: They are predictions measured on averages; verify with real users.
- title: Showing long codes as one string
  explanation: Break them into chunks.
summary:
- HCI studies how people use computers; usability is how well they reach their goals.
- 'Fitts''s law: pointing time grows with distance and shrinks with target size.'
- 'Hick''s law: choice time grows with the logarithm of the number of options.'
- The keystroke-level model adds up operator times to predict expert performance.
- Readable text and chunked information respect human memory.
