- title: Experts and readers
  intro: The keystroke-level model, typing time and text readability.
  code: |
    KLM_TIMES = {"K": 0.2, "P": 1.1, "H": 0.4, "M": 1.35, "B": 0.1}


    def klm_time(sequence):
        """The KEYSTROKE-LEVEL MODEL predicts how long an expert takes to do a task by adding up the times of its small steps. A sequence is a string of operator letters: K press a key (0.2 s), P point with the mouse (1.1 s), H move a hand between keyboard and mouse (0.4 s), M think (1.35 s) and B press a mouse button (0.1 s); the times are in KLM_TIMES. Return the total rounded to 2 decimals. ValueError('unknown operator X') (with the bad letter in place of X) for any other character."""
        total = 0.0
        for op in sequence:
            if op not in KLM_TIMES:
                raise ValueError("unknown operator " + op)
            total += KLM_TIMES[op]
        return round(total, 2)


    def compare_methods(methods):
        """`methods` is a dict {name: sequence}. Return (fastest name, its time, the time of the slowest), with times from klm_time; break ties by name. ValueError('no methods') if the dict is empty."""
        if not methods:
            raise ValueError("no methods")
        timed = sorted((klm_time(seq), name) for name, seq in methods.items())
        return (timed[0][1], timed[0][0], timed[-1][0])


    def typing_time(text, wpm):
        """How long it takes to type text at `wpm` words per minute, where a WORD is defined as 5 characters (spaces included): len(text) / 5 / wpm * 60 seconds, rounded to 2 decimals. ValueError('bad speed') if wpm is not positive."""
        if wpm <= 0:
            raise ValueError("bad speed")
        return round(len(text) / 5 / wpm * 60, 2)


    import re


    def count_syllables(word):
        """Estimate the syllables of a word: lower-case it, count the groups of consecutive vowels (a, e, i, o, u, y), subtract 1 if the word ends in 'e' and has more than one group, and never return less than 1."""
        groups = re.findall(r"[aeiouy]+", word.lower())
        n = len(groups)
        if word.lower().endswith("e") and n > 1:
            n -= 1
        return max(1, n)


    def flesch_reading_ease(text):
        """FLESCH READING EASE: higher is easier. Words are the runs of letters (regular expression [A-Za-z]+, apostrophes split words), sentences are counted by the characters . ! ? (at least 1 sentence). The score is 206.835 - 1.015 * (words / sentences) - 84.6 * (syllables / words), rounded to 1 decimal. ValueError('no words') if the text has no words."""
        words = re.findall(r"[A-Za-z]+", text)
        if not words:
            raise ValueError("no words")
        sentences = max(1, len(re.findall(r"[.!?]", text)))
        syllables = sum(count_syllables(w) for w in words)
        return round(206.835 - 1.015 * (len(words) / sentences) - 84.6 * (syllables / len(words)), 1)


    def reading_level(score):
        """Name the band: 90 or more 'Very easy', 80 or more 'Easy', 70 or more 'Fairly easy', 60 or more 'Plain English', 50 or more 'Fairly difficult', 30 or more 'Difficult', otherwise 'Very difficult'."""
        for limit, name in ((90, "Very easy"), (80, "Easy"), (70, "Fairly easy"), (60, "Plain English"), (50, "Fairly difficult"), (30, "Difficult")):
            if score >= limit:
                return name
        return "Very difficult"


    def chunk(items, size):
        """Split a list into consecutive chunks of at most `size` items (the last may be shorter), as a list of lists. People remember about 7 plus or minus 2 CHUNKS, which is why phone numbers are written in groups. ValueError('size must be positive') if size < 1."""
        if size < 1:
            raise ValueError("size must be positive")
        return [list(items[i:i + size]) for i in range(0, len(items), size)]

    methods = {"mouse and menu": "HPBPB", "keyboard shortcut": "MKK", "type a command": "MKKKKKK"}
    print("methods to save a file:", compare_methods(methods))
    print("typing a 60-character sentence at 40 words per minute:", typing_time("x" * 60, 40), "seconds")
    easy = "The cat sat on the mat. It was a warm day."
    hard = "Notwithstanding considerable organisational disagreements, administrators implemented comprehensive reorganisation."
    for text in (easy, hard):
        score = flesch_reading_ease(text)
        print(score, reading_level(score))
    print(chunk(list("5551234567"), 3))
  output: |
    methods to save a file: ('keyboard shortcut', 1.75, 2.8)
    typing a 60-character sentence at 40 words per minute: 18.0 seconds
    116.7 Very easy
    -182.0 Very difficult
    [['5', '5', '5'], ['1', '2', '3'], ['4', '5', '6'], ['7']]
  lines:
  - line: 66
    note: The shortcut wins for experts.
  - line: 67
    note: Sixty characters is 12 words.
  - line: 70
    note: Short plain words score high; long words score very low.
  - line: 73
    note: Ten digits in groups of three.
