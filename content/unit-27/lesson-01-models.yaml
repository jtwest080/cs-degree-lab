  tests:
  - name: difficulty
    code: |
      import math
      assert index_of_difficulty(0, 10) == 0 and index_of_difficulty(10, 10) == 1 and index_of_difficulty(30, 10) == 2 and index_of_difficulty(70, 10) == 3
      assert index_of_difficulty(100, 10) == round(math.log2(11), 4) and index_of_difficulty(100, 5) > index_of_difficulty(100, 50)
      for bad in ((-1, 5), (5, 0), (5, -2)):
          try:
              index_of_difficulty(*bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad size" in str(e)
  - name: time
    code: |
      import math
      assert fitts_time(0, 10) == 0.1 and fitts_time(10, 10) == 0.25 and fitts_time(30, 10) == 0.4 and fitts_time(70, 10, 0, 1) == 3
      assert fitts_time(100, 10) == round(0.1 + 0.15 * math.log2(11), 4) and fitts_time(200, 10) > fitts_time(100, 10) > fitts_time(100, 20)
      assert fitts_time(100, 20, 0.2, 0.1) == round(0.2 + 0.1 * math.log2(6), 4)
      try:
          fitts_time(5, 0)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "bad size" in str(e)
  - name: throughput
    code: |
      assert throughput(30, 10, 1) == 2 and throughput(70, 10, 2) == 1.5 and throughput(10, 10, 0.5) == 2
      for s in (0, -1):
          try:
              throughput(30, 10, s)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad time" in str(e)
  - name: ranking
    code: |
      btn = {"save": (10, 0, 20), "cancel": (100, 0, 20), "help": (10, 0, 5)}
      assert rank_buttons((0, 0), btn) == ["save", "help", "cancel"]
      assert rank_buttons((100, 0), btn) == ["cancel", "save", "help"]
      assert rank_buttons((0, 0), {"b": (10, 0, 10), "a": (10, 0, 10)}) == ["a", "b"] and rank_buttons((0, 0), {}) == []
      assert rank_buttons((0, 0), {"far": (300, 400, 100), "near": (3, 4, 10)}) == ["near", "far"]
  hints:
  - Compute the straight-line distance with math.sqrt; sort (time, name) pairs so ties fall back to the name.
  solution: |
    import math




    def index_of_difficulty(distance, width):
        """FITTS'S LAW says that the time to point at a target depends on how FAR it is and how BIG it is. The INDEX OF DIFFICULTY (in bits) is log2(distance / width + 1), rounded to 4 decimals. ValueError('bad size') if distance is negative or width is not positive."""
        if distance < 0 or width <= 0:
            raise ValueError("bad size")
        return round(math.log2(distance / width + 1), 4)


    def fitts_time(distance, width, a=0.1, b=0.15):
        """The predicted time in SECONDS to move a pointer to a target: a + b * log2(distance / width + 1), where a is the fixed reaction time and b the cost of each bit of difficulty. Rounded to 4 decimals; same ValueError as index_of_difficulty."""
        if distance < 0 or width <= 0:
            raise ValueError("bad size")
        return round(a + b * math.log2(distance / width + 1), 4)


    def throughput(distance, width, seconds):
        """How well a person performs: the index of difficulty (use the formula, not the rounded function) divided by the time taken, in BITS PER SECOND, rounded to 2 decimals. ValueError('bad time') if seconds is not positive."""
        if seconds <= 0:
            raise ValueError("bad time")
        return round(math.log2(distance / width + 1) / seconds, 2)


    def rank_buttons(pointer, buttons):
        """`pointer` is the (x, y) position of the mouse and `buttons` a dict {name: (x, y, width)} of button centres and sizes. Return the button NAMES sorted from the quickest to reach to the slowest using fitts_time (distance = straight-line distance from the pointer to the centre). Break ties by name."""
        timed = []
        for name, (x, y, w) in buttons.items():
            d = math.sqrt((x - pointer[0]) ** 2 + (y - pointer[1]) ** 2)
            timed.append((fitts_time(d, w), name))
        timed.sort()
        return [name for t, name in timed]
  explanation: Fitts's law is why menus in screen corners are easy to hit (the edge stops the pointer, so their effective size is huge) and why tiny close buttons are frustrating.
