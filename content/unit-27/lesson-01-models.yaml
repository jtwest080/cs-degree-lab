id: u27-models
title: How People Use Interfaces
minutes: 100
objective: Learn the science behind good interface design. You will predict pointing and choosing times with Fitts's and Hick's laws, estimate an expert's speed with the keystroke-level model, measure how readable text is, and compare designs by calculation before building them.
outcomes:
- Explain what human-computer interaction studies
- Apply Fitts's law to button size and distance
- Apply Hick's law to menus
- Predict task time with the keystroke-level model
- Measure text readability
- Compare two designs numerically
sections:
- heading: Designing for people
  body: |-
    **Human-computer interaction (HCI)** is the study of how people use computers and how to make that easier. A **user interface (UI)** is everything a person touches or sees: screens, buttons, menus, sounds and text. **Usability** means how well a person can reach their goal with it: how fast, how few mistakes, and how pleasant. Programmers often assume that the way they would use something is the way everybody does, but people are not computers. They have eyes that see only a small area sharply, a short-term memory that holds only a handful of items, and hands that move at limited speed.

    The good news is that human performance follows **laws**, simple mathematical models that were measured in experiments and can be used before anything is built. Designers use them to choose button sizes, menu layouts and shortcuts. In this lesson you will implement four of them and use them to compare designs. They give *predictions*, not certainty, so the best designs are always tested with real users too, which you will study in a later lesson.
- heading: Fitts's law and Hick's law
  body: |-
    **Fitts's law** (1954) says the time to point at a target depends on its **distance** D and its **width** W. The predicted time is a + b times log2(D / W + 1), where a and b are constants measured for the device. The logarithm means that doubling the distance does not double the time, but making a target half as wide does cost a fixed extra amount. The part inside the logarithm gives the **index of difficulty** in **bits**. Consequences: make important buttons large, put them near where the pointer already is, and use the screen edges and corners, because the pointer stops there, which makes the target effectively infinitely large.

    **Hick's law** (also Hick-Hyman) says that the time to choose among n equally likely options is b times log2(n + 1). It grows slowly with the number of options, because people can scan and narrow down rather than check every item one by one. That is why wide, flat menus usually beat deep ones: each extra level of a hierarchy costs a whole screen load and a fresh decision. A menu with 1,000 items takes 3 levels with 10 items per screen but 5 levels with only 4.
- heading: Experts, typing and reading
  body: |-
    The **keystroke-level model (KLM)**, from Card, Moran and Newell (1980), predicts how long an **expert** needs to do a task by adding up the times of its smallest steps: pressing a key (about 0.2 seconds), pointing with the mouse (1.1), moving a hand between keyboard and mouse (0.4), a moment of mental preparation (1.35) and pressing a mouse button (0.1). Writing a task as a string such as "MPBB" lets you compare designs: a keyboard shortcut is usually much quicker than finding a menu command, but only after it has been learned, which is why good software offers both.

    People also read and remember within limits. We hold about **7 plus or minus 2 chunks** in short-term memory, where a **chunk** is a familiar group such as a word or a three-digit block of a phone number, so long codes should be shown in groups. Text is easier when words are short and sentences brief. The **Flesch reading ease** score measures this from the average sentence length and the average number of syllables per word: 60 to 70 is plain English that most adults read easily, and under 30 is academic. A usable interface speaks the user's language, not the programmer's.
examples:
- title: Pointing and choosing
  intro: How size, distance and the number of options change the predicted times.
  code: |
    import math


    def index_of_difficulty(distance, width):
        """FITTS'S LAW says that the time to point at a target depends on how FAR it is and how BIG it is. The INDEX OF DIFFICULTY (in bits) is log2(distance / width + 1), rounded to 4 decimals. ValueError('bad size') if distance is negative or width is not positive."""
        if distance < 0 or width <= 0:
            raise ValueError("bad size")
        return round(math.log2(distance / width + 1), 4)


    def fitts_time(distance, width, a=0.1, b=0.15):
        """The predicted time in SECONDS to move a pointer to a target: a + b * log2(distance / width + 1), where a is the fixed reaction time and b the cost of each bit of difficulty. Rounded to 4 decimals; same ValueError as index_of_difficulty."""
        if distance < 0 or width <= 0:
            raise ValueError("bad size")
        return round(a + b * math.log2(distance / width + 1), 4)


    def throughput(distance, width, seconds):
        """How well a person performs: the index of difficulty (use the formula, not the rounded function) divided by the time taken, in BITS PER SECOND, rounded to 2 decimals. ValueError('bad time') if seconds is not positive."""
        if seconds <= 0:
            raise ValueError("bad time")
        return round(math.log2(distance / width + 1) / seconds, 2)


    def rank_buttons(pointer, buttons):
        """`pointer` is the (x, y) position of the mouse and `buttons` a dict {name: (x, y, width)} of button centres and sizes. Return the button NAMES sorted from the quickest to reach to the slowest using fitts_time (distance = straight-line distance from the pointer to the centre). Break ties by name."""
        timed = []
        for name, (x, y, w) in buttons.items():
            d = math.sqrt((x - pointer[0]) ** 2 + (y - pointer[1]) ** 2)
            timed.append((fitts_time(d, w), name))
        timed.sort()
        return [name for t, name in timed]


    def hick_time(n, b=0.2):
        """HICK'S LAW: the time to choose one of n equally likely options is b * log2(n + 1) seconds, rounded to 4 decimals. ValueError('need a choice') if n < 1."""
        if n < 1:
            raise ValueError("need a choice")
        return round(b * math.log2(n + 1), 4)


    def menu_levels(total_items, breadth):
        """A menu system shows `breadth` items per screen. How many levels are needed to reach any of `total_items` items? The smallest depth such that breadth ** depth >= total_items (work it out with a loop, not logarithms, to avoid rounding errors). ValueError('breadth must be at least 2') if breadth < 2; at least 1 level."""
        if breadth < 2:
            raise ValueError("breadth must be at least 2")
        depth = 1
        reach = breadth
        while reach < total_items:
            reach *= breadth
            depth += 1
        return depth


    def menu_total_time(total_items, breadth, level_cost, b=0.2):
        """Total time to find an item in a menu hierarchy: for each level the user makes a choice among `breadth` items (hick_time) and pays `level_cost` seconds to open the next screen. The result is menu_levels(total_items, breadth) * (hick_time(breadth, b) + level_cost), rounded to 4 decimals."""
        levels = menu_levels(total_items, breadth)
        return round(levels * (hick_time(breadth, b) + level_cost), 4)


    def best_breadth(total_items, level_cost, max_breadth=20):
        """Which breadth from 2 to max_breadth gives the smallest menu_total_time? Return that breadth (the smallest on a tie)."""
        best = None
        for breadth in range(2, max_breadth + 1):
            t = menu_total_time(total_items, breadth, level_cost)
            if best is None or t < best[0]:
                best = (t, breadth)
        return best[1]

    print("time to hit a 20-wide button 100 away:", fitts_time(100, 20), "| a 5-wide button:", fitts_time(100, 5))
    print("quickest buttons from the corner:", rank_buttons((0, 0), {"ok": (40, 0, 30), "cancel": (200, 0, 30), "help": (30, 0, 6)}))
    print("choosing among 3, 7 and 15 options:", hick_time(3), hick_time(7), hick_time(15))
    print("levels for 1000 items with 10 per screen:", menu_levels(1000, 10), "| with 4 per screen:", menu_levels(1000, 4))
    for breadth in (4, 10, 32):
        print("breadth", breadth, "takes", menu_total_time(1000, breadth, 1.0), "seconds")
    print("best breadth when opening a screen costs 1 second:", best_breadth(1000, 1.0))
  output: |
    time to hit a 20-wide button 100 away: 0.4877 | a 5-wide button: 0.7588
    quickest buttons from the corner: ['ok', 'help', 'cancel']
    choosing among 3, 7 and 15 options: 0.4 0.6 0.8
    levels for 1000 items with 10 per screen: 3 | with 4 per screen: 5
    breadth 4 takes 7.322 seconds
    breadth 10 takes 5.0757 seconds
    breadth 32 takes 4.0178 seconds
    best breadth when opening a screen costs 1 second: 10
