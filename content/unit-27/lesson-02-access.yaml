  prompt: Find the lightest grey that is still readable on white.
  code: |
    def lum(c):
        s = c / 255
        return s / 12.92 if s <= 0.03928 else ((s + 0.055) / 1.055) ** 2.4
    for grey in range(100, 181, 10):
        print(grey, round(1.05 / (lum(grey) + 0.05), 2))
exercises:
