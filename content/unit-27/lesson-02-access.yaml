  tests:
  - name: simulation
    code: |
      assert simulate((255, 0, 0), "protanopia") == (145, 142, 0) and simulate((0, 255, 0), "protanopia") == (110, 113, 62) and simulate((255, 255, 255), "protanopia") == (255, 255, 255)
      assert simulate((255, 0, 0), "deuteranopia") == (159, 178, 0) and simulate((0, 0, 255), "tritanopia") == (0, 145, 134)
      assert simulate((0, 0, 0), "tritanopia") == (0, 0, 0) and simulate((100, 100, 100), "deuteranopia") == (100, 100, 100)
      try:
          simulate((1, 2, 3), "x-ray")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "unknown kind" in str(e)
  - name: distance
