  solution: |
    import re




    def parse_attrs(tag):
        """Read the attributes of a tag such as <img src="a.png" alt="A cat"> into a dict. Names are lower-cased; values are the text inside double quotes; attributes written without a quoted value are ignored."""
        return {m.group(1).lower(): m.group(2) for m in re.finditer(r'([A-Za-z][\w-]*)\s*=\s*"([^"]*)"', tag)}


    def find_tags(html, name):
        """All opening tags with the given name (any case), as strings, in document order, for example find_tags(html, 'img') gives ['<img src="a.png">', ...]."""
        return re.findall(r"<%s\b[^>]*>" % name, html, flags=re.I)


    def images_missing_alt(html):
        """TEXT ALTERNATIVES let screen readers describe pictures. Return the src of every <img> that has NO alt attribute at all, in document order (use '?' when there is no src either). An EMPTY alt (alt="") is allowed: it marks a decorative image."""
        out = []
        for tag in find_tags(html, "img"):
            a = parse_attrs(tag)
            if "alt" not in a:
                out.append(a.get("src", "?"))
        return out


    def heading_problems(html):
        """Headings give a page its OUTLINE, which screen reader users navigate by. Return a list of problems in document order: 'first heading is hN' if the first heading is not h1, and 'hA jumps to hB' whenever a heading is more than one level deeper than the one before it (going back up any amount is fine). Headings are the tags h1 to h6."""
        levels = [int(n) for n in re.findall(r"<h([1-6])\b", html, flags=re.I)]
        problems = []
        if levels and levels[0] != 1:
            problems.append("first heading is h%d" % levels[0])
        for a, b in zip(levels, levels[1:]):
            if b > a + 1:
                problems.append("h%d jumps to h%d" % (a, b))
        return problems


    def unlabelled_inputs(html):
        """Every form field needs a LABEL. Return the id of each <input> that has no label: its type is not hidden, submit or button, it has no aria-label attribute, and no <label for="ID"> matches its id. Use '(no id)' for an input without an id. Document order."""
        labelled = {parse_attrs(t).get("for") for t in find_tags(html, "label")}
        out = []
        for tag in find_tags(html, "input"):
            a = parse_attrs(tag)
            if a.get("type", "text").lower() in ("hidden", "submit", "button"):
                continue
            if "aria-label" in a or a.get("id") in labelled:
                continue
            out.append(a.get("id", "(no id)"))
        return out
  explanation: Many of the most serious accessibility problems can be found by a simple script, which is why teams run automatic checks on every change.
