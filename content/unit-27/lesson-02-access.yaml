  tests:
  - name: luminance
    code: |
      assert relative_luminance((0, 0, 0)) == 0 and relative_luminance((255, 255, 255)) == 1 and relative_luminance((255, 0, 0)) == 0.2126 and relative_luminance((0, 255, 0)) == 0.7152 and relative_luminance((0, 0, 255)) == 0.0722
      assert relative_luminance((128, 128, 128)) == 0.215861 and relative_luminance((10, 10, 10)) == round(10 / 255 / 12.92, 6)
  - name: ratios
    code: |
      assert contrast_ratio("#000000", "#ffffff") == 21 and contrast_ratio("#fff", "#000") == 21 and contrast_ratio("#ffffff", "#ffffff") == 1
      assert contrast_ratio("#767676", "#ffffff") == 4.54 and contrast_ratio("#777", "#fff") == 4.48 and contrast_ratio("#fff", "#777") == 4.48
      assert contrast_ratio("#0000ff", "#ffffff") == 8.59 and contrast_ratio("#ff0000", "#ffffff") == 4.0
      try:
          contrast_ratio("red", "#fff")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "bad hex" in str(e)
  - name: levels
    code: |
      assert wcag_level(21) == "AAA" and wcag_level(7) == "AAA" and wcag_level(6.99) == "AA" and wcag_level(4.5) == "AA" and wcag_level(4.49) == "Fail" and wcag_level(1) == "Fail"
      assert wcag_level(4.5, True) == "AAA" and wcag_level(3, True) == "AA" and wcag_level(2.99, True) == "Fail" and wcag_level(4.49, True) == "AA"
  - name: choosing a colour
    code: |
      assert best_text_color("#ffffff", ["#777777", "#000000", "#333333"]) == "#000000"
      assert best_text_color("#000000", ["#777777", "#ffffff", "#cccccc"]) == "#ffffff"
      assert best_text_color("#808080", ["#000", "#fff"]) == "#000" and best_text_color("#fff", ["#222"]) == "#222"
      assert best_text_color("#fff", ["#000", "#000000"]) == "#000"
      try:
          best_text_color("#fff", [])
          raise AssertionError("accepted")
      except ValueError as e:
          assert "no candidates" in str(e)
  hints:
  - Convert the hex strings with hex_to_rgb, then use the luminance formula for each channel.
  solution: |
    def hex_to_rgb(text):
        """Read '#rrggbb' or '#rgb' (each digit doubled) and return (r, g, b) as ints. ValueError('bad hex') for anything else."""
        if not isinstance(text, str) or not text.startswith("#") or len(text) not in (4, 7):
            raise ValueError("bad hex")
        digits = text[1:]
        if len(digits) == 3:
            digits = "".join(ch * 2 for ch in digits)
        try:
            return (int(digits[0:2], 16), int(digits[2:4], 16), int(digits[4:6], 16))
        except ValueError:
            raise ValueError("bad hex")


    def relative_luminance(rgb):
        """The WCAG RELATIVE LUMINANCE of a colour (how much light it gives off, 0 black to 1 white). For each channel c from 0 to 255: s = c / 255; the linear value is s / 12.92 when s <= 0.03928, otherwise ((s + 0.055) / 1.055) ** 2.4. Then L = 0.2126 * red + 0.7152 * green + 0.0722 * blue (the linear values), rounded to 6 decimals."""
        lin = []
        for c in rgb:
            s = c / 255
            lin.append(s / 12.92 if s <= 0.03928 else ((s + 0.055) / 1.055) ** 2.4)
        return round(0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2], 6)


    def contrast_ratio(c1, c2):
        """The CONTRAST RATIO between two colours given as hex strings: (lighter + 0.05) / (darker + 0.05), where lighter and darker are the relative luminances of the brighter and the dimmer colour (it does not matter which you pass first). Rounded to 2 decimals; it runs from 1 (identical) to 21 (black on white)."""
        a = relative_luminance(hex_to_rgb(c1))
        b = relative_luminance(hex_to_rgb(c2))
        hi, lo = max(a, b), min(a, b)
        return round((hi + 0.05) / (lo + 0.05), 2)


    def wcag_level(ratio, large=False):
        """The WCAG conformance level for a contrast ratio. Normal text needs 7 for 'AAA' and 4.5 for 'AA'; LARGE text (big or bold) needs 4.5 for 'AAA' and 3 for 'AA'. Anything lower is 'Fail'."""
        aaa, aa = (4.5, 3) if large else (7, 4.5)
        if ratio >= aaa:
            return "AAA"
        if ratio >= aa:
            return "AA"
        return "Fail"


    def best_text_color(background, candidates):
        """Of the hex colours in `candidates`, return the one with the highest contrast ratio against the background (the first one on a tie). ValueError('no candidates') if the list is empty."""
        if not candidates:
            raise ValueError("no candidates")
        best = candidates[0]
        for c in candidates[1:]:
            if contrast_ratio(c, background) > contrast_ratio(best, background):
                best = c
        return best
  explanation: About one in twelve men and one in two hundred women has some colour vision deficiency, and almost everybody benefits from good contrast.
