  - Positive tabindex elements are sorted with a stable sort, so ties keep document order.
  solution: |
    def tab_order(elements):
        """The order in which the Tab key visits elements. `elements` is a list of dicts with an "id" and an optional integer "tabindex", in document order. The browser rules: elements with a POSITIVE tabindex come first, sorted by tabindex (equal values keep document order); then the elements with tabindex 0 or none, in document order; elements with a NEGATIVE tabindex are skipped (they can be focused only by a program or a click). Return the list of ids."""
        positive = sorted((e for e in elements if e.get("tabindex", 0) > 0), key=lambda e: e["tabindex"])
        normal = [e for e in elements if e.get("tabindex", 0) == 0]
        return [e["id"] for e in positive + normal]


    def next_focus(order, current, backwards=False):
        """Where focus goes when Tab (or Shift+Tab when backwards) is pressed. With current None, focus starts at the first element (the last when backwards). Otherwise it moves one place and WRAPS around at the ends. ValueError('not focusable') if current is not None and not in the order; None if the order is empty."""
        if not order:
            return None
        if current is None:
            return order[-1] if backwards else order[0]
        if current not in order:
            raise ValueError("not focusable")
        i = order.index(current)
        return order[(i - 1) % len(order)] if backwards else order[(i + 1) % len(order)]


    def modal_trap(order, modal_ids, current, backwards=False):
        """While a dialog is open, focus must stay INSIDE it (a FOCUS TRAP). Restrict the order to the ids in `modal_ids` (keeping the order), then apply next_focus. If current is outside the dialog, jump to the first (or last, when backwards) element of the dialog. ValueError('empty dialog') if no dialog element is focusable."""
        inside = [i for i in order if i in modal_ids]
        if not inside:
            raise ValueError("empty dialog")
        if current not in inside:
            return inside[-1] if backwards else inside[0]
        return next_focus(inside, current, backwards)


    def keyboard_presses(order, start, target):
        """How many Tab presses does it take to move focus forward from `start` to `target` (both ids in the order; wrapping around)? 0 if they are the same. ValueError('not focusable') if either is missing."""
        if start not in order or target not in order:
            raise ValueError("not focusable")
        return (order.index(target) - order.index(start)) % len(order)
  explanation: A page that works with the keyboard alone also works with switches, voice control and screen readers.
- id: audit
  title: 'Capstone: an accessibility audit'
  difficulty: 5
  prompt: 'Build the core of a real **accessibility checker**. Starter code gives `hex_to_rgb`, `relative_luminance`, `contrast_ratio` and `wcag_level`. Write `is_large(size_px, bold)`: WCAG calls text **large** when it is at least 24 px, or at least 19 px **and** bold. Write `audit_page(page)` for a dict with optional keys `"images"` (a list of `{"src", "alt"?}`), `"texts"` (a list of `{"fg", "bg", "size", "bold"?}` with hex colours and `size` in pixels), `"inputs"` (a list of `{"id", "label"?}`) and `"headings"` (a list of levels such as `[1, 2, 4]`). It returns a dict `{"issues": [...], "checks": n, "score": s}`. Issues, in this order: for each image without an `"alt"` key `''missing alt: SRC''`; for each text whose contrast ratio is below the AA limit (4.5, or 3 for large text) `''low contrast: FG on BG (RATIO)''` with the ratio from `contrast_ratio`; for each input without a `"label"` key `''unlabelled input: ID''`; for each heading more than one level deeper than the one before it `''heading skip: hA to hB''`. `checks` counts everything examined: every image, text and input, plus one per heading after the first. `score` is 100 when `checks` is 0, otherwise `round(100 * (1 - len(issues) / checks))`.'
  starter: |-
    def hex_to_rgb(text):
        """Read '#rrggbb' or '#rgb' (each digit doubled) and return (r, g, b) as ints. ValueError('bad hex') for anything else."""
        if not isinstance(text, str) or not text.startswith("#") or len(text) not in (4, 7):
            raise ValueError("bad hex")
        digits = text[1:]
        if len(digits) == 3:
            digits = "".join(ch * 2 for ch in digits)
        try:
            return (int(digits[0:2], 16), int(digits[2:4], 16), int(digits[4:6], 16))
        except ValueError:
            raise ValueError("bad hex")


    def relative_luminance(rgb):
        """The WCAG RELATIVE LUMINANCE of a colour (how much light it gives off, 0 black to 1 white). For each channel c from 0 to 255: s = c / 255; the linear value is s / 12.92 when s <= 0.03928, otherwise ((s + 0.055) / 1.055) ** 2.4. Then L = 0.2126 * red + 0.7152 * green + 0.0722 * blue (the linear values), rounded to 6 decimals."""
        lin = []
        for c in rgb:
            s = c / 255
            lin.append(s / 12.92 if s <= 0.03928 else ((s + 0.055) / 1.055) ** 2.4)
        return round(0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2], 6)


    def contrast_ratio(c1, c2):
        """The CONTRAST RATIO between two colours given as hex strings: (lighter + 0.05) / (darker + 0.05), where lighter and darker are the relative luminances of the brighter and the dimmer colour (it does not matter which you pass first). Rounded to 2 decimals; it runs from 1 (identical) to 21 (black on white)."""
        a = relative_luminance(hex_to_rgb(c1))
        b = relative_luminance(hex_to_rgb(c2))
        hi, lo = max(a, b), min(a, b)
        return round((hi + 0.05) / (lo + 0.05), 2)


    def wcag_level(ratio, large=False):
        """The WCAG conformance level for a contrast ratio. Normal text needs 7 for 'AAA' and 4.5 for 'AA'; LARGE text (big or bold) needs 4.5 for 'AAA' and 3 for 'AA'. Anything lower is 'Fail'."""
        aaa, aa = (4.5, 3) if large else (7, 4.5)
        if ratio >= aaa:
            return "AAA"
        if ratio >= aa:
            return "AA"
        return "Fail"




    def is_large(size_px, bold):
        """WCAG calls text LARGE when it is at least 24 px, or at least 19 px and bold."""
        pass


    def audit_page(page):
        """AUDIT a page description (a dict) against WCAG level AA. Keys (all optional): "images" a list of {"src", "alt"?}; "texts" a list of {"fg", "bg", "size", "bold"} with hex colours and size in px; "inputs" a list of {"id", "label"?}; "headings" a list of levels such as [1, 2, 4].
        Collect issue strings in this order and return a dict {"issues": [...], "checks": n, "score": s}:
        for each image without an "alt" key: 'missing alt: SRC';
        for each text whose contrast ratio is below the AA limit (4.5 normal, 3 large): 'low contrast: FG on BG (RATIO)' with the ratio from contrast_ratio;
        for each input without a "label" key: 'unlabelled input: ID';
        for each heading that is more than one level deeper than the previous one: 'heading skip: hA to hB'.
        checks counts everything examined: every image, text and input, plus one per heading after the first. score is 100 when checks is 0, otherwise round(100 * (1 - len(issues) / checks))."""
        pass
  tests:
  - name: a clean page
    code: |
      page = {"images": [{"src": "a.png", "alt": "A"}, {"src": "b.png", "alt": ""}], "texts": [{"fg": "#000", "bg": "#fff", "size": 16}], "inputs": [{"id": "name", "label": "Name"}], "headings": [1, 2, 3, 2]}
      r = audit_page(page)
      assert r == {"issues": [], "checks": 2 + 1 + 1 + 3, "score": 100}
      assert audit_page({}) == {"issues": [], "checks": 0, "score": 100}
  - name: finding issues
    code: |
      page = {"images": [{"src": "a.png"}, {"src": "b.png", "alt": "ok"}], "texts": [{"fg": "#aaa", "bg": "#fff", "size": 14}, {"fg": "#000", "bg": "#fff", "size": 14}],
              "inputs": [{"id": "email"}, {"id": "pw", "label": "Password"}], "headings": [1, 3, 2, 4]}
      r = audit_page(page)
      assert r["issues"] == ["missing alt: a.png", "low contrast: #aaa on #fff (2.32)", "unlabelled input: email", "heading skip: h1 to h3", "heading skip: h2 to h4"]
      assert r["checks"] == 2 + 2 + 2 + 3 and r["score"] == round(100 * (1 - 5 / 9)) == 44
  - name: large text
    code: |
      assert is_large(24, False) and is_large(19, True) and not is_large(18, True) and not is_large(23, False) and is_large(30, True)
      grey = {"fg": "#777", "bg": "#fff"}
      small = audit_page({"texts": [dict(grey, size=16)]})
      big = audit_page({"texts": [dict(grey, size=24)]})
      bold = audit_page({"texts": [dict(grey, size=19, bold=True)]})
      assert len(small["issues"]) == 1 and small["issues"][0] == "low contrast: #777 on #fff (4.48)" and small["score"] == 0 and big["issues"] == [] and bold["issues"] == []
      assert audit_page({"texts": [{"fg": "#999", "bg": "#fff", "size": 30}]})["issues"] == ["low contrast: #999 on #fff (2.85)"]
  - name: scoring
