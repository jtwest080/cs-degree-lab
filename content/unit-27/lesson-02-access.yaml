      red, green = (255, 0, 0), (0, 255, 0)
      assert distinguishable(red, green) is True and distinguishable(red, green, "protanopia") is True and distinguishable(red, green, "protanopia", 100) is False
      assert distinguishable((200, 100, 50), (205, 105, 55)) is False and distinguishable((200, 100, 50), (205, 105, 55), None, 5) is True
      assert distinguishable((0, 0, 0), (255, 255, 255), "tritanopia", 400) is True
