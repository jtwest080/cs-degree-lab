id: u27-access
title: Accessibility
minutes: 100
objective: Learn to make software usable by everyone. You will calculate WCAG colour contrast, simulate colour blindness, check page structure for missing text alternatives, headings and labels, model keyboard focus and dialogs, and build an accessibility auditor.
outcomes:
- Explain what accessibility means and why it matters
- Calculate contrast ratios and WCAG levels
- Simulate colour vision deficiencies
- Find structural accessibility problems in HTML
- Model keyboard focus order and focus traps
- Score a page with an automatic audit
sections:
- heading: Software for everyone
  body: |-
    **Accessibility** means designing software that people with disabilities can use: people who are blind or have low vision, who are deaf or hard of hearing, who cannot use a mouse, who have trouble reading or concentrating, or who are simply using a phone in bright sunlight with one hand. Roughly one person in six in the world lives with a significant disability, and anyone can have a temporary one, such as a broken arm. In many countries accessibility is also the **law** for public services and businesses.

    The standard to follow is the **Web Content Accessibility Guidelines (WCAG)**, which is organised around four principles abbreviated **POUR**: content must be **Perceivable** (people can see or hear it, so pictures need text descriptions and text needs enough contrast), **Operable** (it works from a keyboard and gives enough time), **Understandable** (clear language and predictable behaviour), and **Robust** (it works with assistive technology such as **screen readers**, programs that read the page aloud). Accessible design is not a separate feature: it also helps everyone, as in captions in a noisy cafe.
- heading: 'Seeing: contrast and colour'
  body: |-
    The most common problem is poor **contrast**: light grey text on white, or text over a busy picture. WCAG measures it with the **contrast ratio**, from 1 (no difference) to 21 (black on white). It compares the **relative luminance** of the two colours, a measure of how much light they emit, computed from the red, green and blue values after undoing the screen's gamma curve. Level **AA**, the usual legal target, needs a ratio of at least 4.5 for normal text and 3 for **large** text, and the stricter level **AAA** needs 7 and 4.5. Light grey #999 on white scores only 2.85 and fails.

    About 8 percent of men have a **colour vision deficiency**: **protanopia** and **deuteranopia** make reds and greens hard to separate, and **tritanopia** affects blues and yellows. A chart that distinguishes lines only by red and green is unreadable to them. The rule is: **never use colour alone** to carry information. Add a label, a shape, an icon or a pattern. Programs can simulate these conditions with a small matrix that mixes the red, green and blue channels, which lets designers test a palette.
- heading: Structure and keyboard
  body: |-
    Screen readers cannot see pictures, so every meaningful image needs a **text alternative** (the **alt** attribute) that says what it shows. A purely decorative image gets an *empty* alt so that it is skipped. Users of screen readers move around a page by its **headings**, like a table of contents, so the headings must form an outline without gaps: an h2 should not be followed directly by an h4. Every form field needs a **label** connected to it, so that the reader announces what to type, and clicking the label focuses the field.

    Many people cannot use a mouse and move with the **Tab** key instead. The element that receives the keyboard input is the one with **focus**. The browser visits controls in **document order**, except that a positive tabindex jumps the queue and a negative one removes the control from the sequence. A **modal dialog** must **trap** focus: Tab should cycle only among the dialog's controls until it is closed. Many accessibility faults can be found automatically with a few rules, as you will build in this lesson, but not all: a human must still check that the alt texts make sense and that the page can really be used with the keyboard alone.
examples:
- title: Contrast levels
  intro: Contrast ratios and the WCAG levels they reach.
  code: |
    def hex_to_rgb(text):
        """Read '#rrggbb' or '#rgb' (each digit doubled) and return (r, g, b) as ints. ValueError('bad hex') for anything else."""
        if not isinstance(text, str) or not text.startswith("#") or len(text) not in (4, 7):
            raise ValueError("bad hex")
        digits = text[1:]
        if len(digits) == 3:
            digits = "".join(ch * 2 for ch in digits)
        try:
            return (int(digits[0:2], 16), int(digits[2:4], 16), int(digits[4:6], 16))
        except ValueError:
            raise ValueError("bad hex")


    def relative_luminance(rgb):
        """The WCAG RELATIVE LUMINANCE of a colour (how much light it gives off, 0 black to 1 white). For each channel c from 0 to 255: s = c / 255; the linear value is s / 12.92 when s <= 0.03928, otherwise ((s + 0.055) / 1.055) ** 2.4. Then L = 0.2126 * red + 0.7152 * green + 0.0722 * blue (the linear values), rounded to 6 decimals."""
        lin = []
        for c in rgb:
            s = c / 255
            lin.append(s / 12.92 if s <= 0.03928 else ((s + 0.055) / 1.055) ** 2.4)
        return round(0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2], 6)


    def contrast_ratio(c1, c2):
        """The CONTRAST RATIO between two colours given as hex strings: (lighter + 0.05) / (darker + 0.05), where lighter and darker are the relative luminances of the brighter and the dimmer colour (it does not matter which you pass first). Rounded to 2 decimals; it runs from 1 (identical) to 21 (black on white)."""
        a = relative_luminance(hex_to_rgb(c1))
        b = relative_luminance(hex_to_rgb(c2))
        hi, lo = max(a, b), min(a, b)
        return round((hi + 0.05) / (lo + 0.05), 2)


    def wcag_level(ratio, large=False):
        """The WCAG conformance level for a contrast ratio. Normal text needs 7 for 'AAA' and 4.5 for 'AA'; LARGE text (big or bold) needs 4.5 for 'AAA' and 3 for 'AA'. Anything lower is 'Fail'."""
        aaa, aa = (4.5, 3) if large else (7, 4.5)
        if ratio >= aaa:
            return "AAA"
        if ratio >= aa:
            return "AA"
        return "Fail"


    def best_text_color(background, candidates):
        """Of the hex colours in `candidates`, return the one with the highest contrast ratio against the background (the first one on a tie). ValueError('no candidates') if the list is empty."""
        if not candidates:
            raise ValueError("no candidates")
        best = candidates[0]
        for c in candidates[1:]:
            if contrast_ratio(c, background) > contrast_ratio(best, background):
                best = c
        return best

    for fg, bg in (("#000000", "#ffffff"), ("#767676", "#ffffff"), ("#777777", "#ffffff"), ("#999999", "#ffffff"), ("#ffff00", "#ffffff"), ("#ffffff", "#0057b8")):
        r = contrast_ratio(fg, bg)
        print(fg, "on", bg, "->", r, wcag_level(r), "| large text:", wcag_level(r, True))
    print("best text colour on a mid blue:", best_text_color("#3366cc", ["#000000", "#ffffff", "#ffff00"]))
  output: |
    #000000 on #ffffff -> 21.0 AAA | large text: AAA
    #767676 on #ffffff -> 4.54 AA | large text: AAA
    #777777 on #ffffff -> 4.48 Fail | large text: AA
    #999999 on #ffffff -> 2.85 Fail | large text: Fail
    #ffff00 on #ffffff -> 1.07 Fail | large text: Fail
    #ffffff on #0057b8 -> 6.87 AA | large text: AAA
    best text colour on a mid blue: #ffffff
  lines:
  - line: 51
    note: '#767676 is the lightest grey that just passes AA on white; yellow on white fails badly.'
  - line: 54
    note: Black or white is chosen by whichever gives the higher ratio.
- title: Colour blindness and page structure
  intro: Simulate colour vision deficiencies and check a snippet of HTML.
  code: |
    import re


    MATRICES = {
        "protanopia": [[0.567, 0.433, 0.0], [0.558, 0.442, 0.0], [0.0, 0.242, 0.758]],
        "deuteranopia": [[0.625, 0.375, 0.0], [0.7, 0.3, 0.0], [0.0, 0.3, 0.7]],
        "tritanopia": [[0.95, 0.05, 0.0], [0.0, 0.433, 0.567], [0.0, 0.475, 0.525]],
    }


    def simulate(rgb, kind):
        """What a person with a COLOUR VISION DEFICIENCY sees. Multiply the matrix MATRICES[kind] (3 rows of 3 weights) by the colour (r, g, b): each new channel is the sum of the row's weights times the old channels. Round each channel to an int and keep it between 0 and 255. ValueError('unknown kind') if the kind is not a key of MATRICES. Return a tuple."""
        if kind not in MATRICES:
            raise ValueError("unknown kind")
        m = MATRICES[kind]
        return tuple(max(0, min(255, round(sum(m[i][j] * rgb[j] for j in range(3))))) for i in range(3))


    def color_distance(c1, c2):
        """The straight-line distance between two (r, g, b) colours, rounded to 2 decimals."""
        return round(sum((a - b) ** 2 for a, b in zip(c1, c2)) ** 0.5, 2)


    def distinguishable(c1, c2, kind=None, threshold=50):
        """Can two colours be told apart? Simulate both with `kind` (skip the simulation when kind is None) and return True when their color_distance is at least `threshold`."""
        if kind is not None:
            c1, c2 = simulate(c1, kind), simulate(c2, kind)
        return color_distance(c1, c2) >= threshold


    def safe_pairs(colors, kinds, threshold=50):
        """`colors` is a dict {name: (r, g, b)}. Return the sorted list of (name1, name2) pairs (name1 before name2 alphabetically) that are distinguishable by people with normal vision AND under every deficiency in `kinds`."""
        names = sorted(colors)
        out = []
        for i, a in enumerate(names):
            for b in names[i + 1:]:
                if all(distinguishable(colors[a], colors[b], k, threshold) for k in [None] + list(kinds)):
                    out.append((a, b))
        return out


    def parse_attrs(tag):
        """Read the attributes of a tag such as <img src="a.png" alt="A cat"> into a dict. Names are lower-cased; values are the text inside double quotes; attributes written without a quoted value are ignored."""
        return {m.group(1).lower(): m.group(2) for m in re.finditer(r'([A-Za-z][\w-]*)\s*=\s*"([^"]*)"', tag)}


    def find_tags(html, name):
        """All opening tags with the given name (any case), as strings, in document order, for example find_tags(html, 'img') gives ['<img src="a.png">', ...]."""
        return re.findall(r"<%s\b[^>]*>" % name, html, flags=re.I)


    def images_missing_alt(html):
        """TEXT ALTERNATIVES let screen readers describe pictures. Return the src of every <img> that has NO alt attribute at all, in document order (use '?' when there is no src either). An EMPTY alt (alt="") is allowed: it marks a decorative image."""
        out = []
        for tag in find_tags(html, "img"):
            a = parse_attrs(tag)
            if "alt" not in a:
                out.append(a.get("src", "?"))
        return out


    def heading_problems(html):
        """Headings give a page its OUTLINE, which screen reader users navigate by. Return a list of problems in document order: 'first heading is hN' if the first heading is not h1, and 'hA jumps to hB' whenever a heading is more than one level deeper than the one before it (going back up any amount is fine). Headings are the tags h1 to h6."""
        levels = [int(n) for n in re.findall(r"<h([1-6])\b", html, flags=re.I)]
        problems = []
        if levels and levels[0] != 1:
            problems.append("first heading is h%d" % levels[0])
        for a, b in zip(levels, levels[1:]):
            if b > a + 1:
                problems.append("h%d jumps to h%d" % (a, b))
        return problems


    def unlabelled_inputs(html):
        """Every form field needs a LABEL. Return the id of each <input> that has no label: its type is not hidden, submit or button, it has no aria-label attribute, and no <label for="ID"> matches its id. Use '(no id)' for an input without an id. Document order."""
        labelled = {parse_attrs(t).get("for") for t in find_tags(html, "label")}
        out = []
        for tag in find_tags(html, "input"):
            a = parse_attrs(tag)
            if a.get("type", "text").lower() in ("hidden", "submit", "button"):
                continue
            if "aria-label" in a or a.get("id") in labelled:
                continue
            out.append(a.get("id", "(no id)"))
        return out

    for kind in (None, "protanopia", "deuteranopia", "tritanopia"):
        print(kind or "normal vision", "- red vs green:", color_distance(simulate((220, 40, 40), kind) if kind else (220, 40, 40), simulate((40, 160, 60), kind) if kind else (40, 160, 60)))
    page = '<h1>Shop</h1><h3>Offers</h3><img src="sale.png"><img src="logo.png" alt="Logo"><label for="q">Search</label><input id="q" type="text"><input id="coupon" type="text">'
    print("images without alt:", images_missing_alt(page))
    print("heading problems:", heading_problems(page))
    print("inputs without labels:", unlabelled_inputs(page))
  output: |
    normal vision - red vs green: 217.26
    protanopia - red vs green: 81.52
    deuteranopia - red vs green: 122.84
    tritanopia - red vs green: 189.26
    images without alt: ['sale.png']
    heading problems: ['h1 jumps to h3']
    inputs without labels: ['coupon']
