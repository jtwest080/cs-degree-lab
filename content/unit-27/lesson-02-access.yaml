      palette = {"red": (255, 0, 0), "green": (0, 255, 0), "blue": (0, 0, 255), "black": (0, 0, 0)}
      every = safe_pairs(palette, ["protanopia", "deuteranopia", "tritanopia"])
      assert ("black", "blue") in every or ("black", "blue") not in every
      assert all(a < b for a, b in every) and every == sorted(every)
      assert ("green", "red") not in safe_pairs(palette, ["protanopia", "deuteranopia"], 90)
      assert safe_pairs({"a": (0, 0, 0), "b": (255, 255, 255)}, []) == [("a", "b")] and safe_pairs({}, ["protanopia"]) == [] and safe_pairs({"a": (1, 1, 1)}, []) == []
      assert len(safe_pairs(palette, [], 10)) == 6
  hints:
  - 'The matrix is applied to the colour: new channel i = sum over j of M[i][j] * old[j].'
  solution: |
    MATRICES = {
        "protanopia": [[0.567, 0.433, 0.0], [0.558, 0.442, 0.0], [0.0, 0.242, 0.758]],
        "deuteranopia": [[0.625, 0.375, 0.0], [0.7, 0.3, 0.0], [0.0, 0.3, 0.7]],
        "tritanopia": [[0.95, 0.05, 0.0], [0.0, 0.433, 0.567], [0.0, 0.475, 0.525]],
    }




    def simulate(rgb, kind):
        """What a person with a COLOUR VISION DEFICIENCY sees. Multiply the matrix MATRICES[kind] (3 rows of 3 weights) by the colour (r, g, b): each new channel is the sum of the row's weights times the old channels. Round each channel to an int and keep it between 0 and 255. ValueError('unknown kind') if the kind is not a key of MATRICES. Return a tuple."""
        if kind not in MATRICES:
            raise ValueError("unknown kind")
        m = MATRICES[kind]
        return tuple(max(0, min(255, round(sum(m[i][j] * rgb[j] for j in range(3))))) for i in range(3))


    def color_distance(c1, c2):
        """The straight-line distance between two (r, g, b) colours, rounded to 2 decimals."""
        return round(sum((a - b) ** 2 for a, b in zip(c1, c2)) ** 0.5, 2)


    def distinguishable(c1, c2, kind=None, threshold=50):
        """Can two colours be told apart? Simulate both with `kind` (skip the simulation when kind is None) and return True when their color_distance is at least `threshold`."""
        if kind is not None:
            c1, c2 = simulate(c1, kind), simulate(c2, kind)
        return color_distance(c1, c2) >= threshold


    def safe_pairs(colors, kinds, threshold=50):
        """`colors` is a dict {name: (r, g, b)}. Return the sorted list of (name1, name2) pairs (name1 before name2 alphabetically) that are distinguishable by people with normal vision AND under every deficiency in `kinds`."""
        names = sorted(colors)
        out = []
        for i, a in enumerate(names):
            for b in names[i + 1:]:
                if all(distinguishable(colors[a], colors[b], k, threshold) for k in [None] + list(kinds)):
                    out.append((a, b))
        return out
  explanation: 'Never use colour alone to carry meaning: add a shape, a pattern or a label.'
