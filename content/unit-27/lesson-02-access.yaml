  title: Keyboard focus
  difficulty: 4
  prompt: 'Many people never use a mouse: they use the **Tab** key to move **focus** from control to control. Write `tab_order(elements)`: `elements` is a list of dicts with an `"id"` and an optional integer `"tabindex"`, in document order. The browser''s rules: elements with a **positive** `tabindex` come first, sorted by `tabindex` (equal values keep document order); then those with `tabindex` 0 or none, in document order; **negative** `tabindex` elements are skipped (a program or a click can focus them, Tab cannot). Return the list of ids. Write `next_focus(order, current, backwards=False)`: where focus goes on Tab (Shift+Tab when `backwards`). With `current` `None`, start at the first element (the last when backwards); otherwise move one place and **wrap around** at the ends; `ValueError("not focusable")` if `current` is not `None` and not in the order; `None` if the order is empty. Write `modal_trap(order, modal_ids, current, backwards=False)`: while a dialog is open, focus must stay **inside** it (a **focus trap**). Restrict the order to the ids in `modal_ids`, keeping the order, then apply `next_focus`; if `current` is outside the dialog, jump to its first (last when backwards) element; `ValueError("empty dialog")` if no dialog element is focusable. Write `keyboard_presses(order, start, target)`: how many Tab presses move focus forward from `start` to `target`, wrapping around (0 if they are the same; `ValueError("not focusable")` if either is missing).'
  starter: |-
    def tab_order(elements):
        """The order in which the Tab key visits elements. `elements` is a list of dicts with an "id" and an optional integer "tabindex", in document order. The browser rules: elements with a POSITIVE tabindex come first, sorted by tabindex (equal values keep document order); then the elements with tabindex 0 or none, in document order; elements with a NEGATIVE tabindex are skipped (they can be focused only by a program or a click). Return the list of ids."""
        pass


    def next_focus(order, current, backwards=False):
        """Where focus goes when Tab (or Shift+Tab when backwards) is pressed. With current None, focus starts at the first element (the last when backwards). Otherwise it moves one place and WRAPS around at the ends. ValueError('not focusable') if current is not None and not in the order; None if the order is empty."""
        pass


    def modal_trap(order, modal_ids, current, backwards=False):
        """While a dialog is open, focus must stay INSIDE it (a FOCUS TRAP). Restrict the order to the ids in `modal_ids` (keeping the order), then apply next_focus. If current is outside the dialog, jump to the first (or last, when backwards) element of the dialog. ValueError('empty dialog') if no dialog element is focusable."""
        pass


    def keyboard_presses(order, start, target):
        """How many Tab presses does it take to move focus forward from `start` to `target` (both ids in the order; wrapping around)? 0 if they are the same. ValueError('not focusable') if either is missing."""
        pass
