  title: Colour contrast
  difficulty: 4
  prompt: 'Text that is hard to read excludes people with low vision, and everybody in bright sunlight. The **Web Content Accessibility Guidelines (WCAG)** set contrast rules. Starter code gives `hex_to_rgb(text)`. Write `relative_luminance(rgb)`: for each channel `c` (0 to 255) let `s = c / 255`; its linear value is `s / 12.92` when `s <= 0.03928`, otherwise `((s + 0.055) / 1.055) ** 2.4`; then `L = 0.2126 * red + 0.7152 * green + 0.0722 * blue` using the linear values, rounded to 6 decimals (0 is black, 1 white). Write `contrast_ratio(c1, c2)` for two hex colour strings: `(lighter + 0.05) / (darker + 0.05)` with the relative luminances of the brighter and dimmer colour (the order you pass them in does not matter), rounded to 2 decimals; it runs from 1 to 21. Write `wcag_level(ratio, large=False)`: normal text needs 7 for `"AAA"` and 4.5 for `"AA"`; **large** text needs 4.5 for `"AAA"` and 3 for `"AA"`; anything less is `"Fail"`. Write `best_text_color(background, candidates)`: of the hex colours in `candidates` return the one with the highest contrast ratio against the background (the first on a tie; `ValueError("no candidates")` if the list is empty).'
