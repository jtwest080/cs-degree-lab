    code: |
      h = new_history("a")
      for v in "bcd":
          h = apply_change(h, v)
      h = undo(undo(h))
      assert h["future"] == ["c", "d"]
      h = apply_change(h, "x")
      assert h == {"past": ["a", "b"], "present": "x", "future": []}
      try:
          redo(h)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "nothing to redo" in str(e)
  - name: limited history
    code: |
      h = new_history(0)
      for v in range(1, 8):
          h = apply_change(h, v, 3)
      assert h["past"] == [4, 5, 6] and h["present"] == 7
      z = apply_change(new_history("a"), "b", 0)
      assert z == {"past": [], "present": "b", "future": []}
