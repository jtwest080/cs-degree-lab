  - For debounce, look at the gap to the NEXT event; for throttle, remember when it last fired.
  solution: |
    def debounce(times, wait):
        """DEBOUNCING waits until events have STOPPED coming before acting (for example searching only when the user pauses typing). `times` is a sorted list of event times in milliseconds. The action fires `wait` ms after an event if no further event arrives within that time (a gap of exactly `wait` counts as no event). Return the list of times at which it fires."""
        fires = []
        for i, t in enumerate(times):
            if i + 1 == len(times) or times[i + 1] - t >= wait:
                fires.append(t + wait)
        return fires


    def throttle(times, interval):
        """THROTTLING limits how often something happens (for example handling a scroll). The first event fires; after that an event fires only if at least `interval` ms have passed since the last time it FIRED. Return the list of firing times."""
        fired = []
        for t in times:
            if not fired or t - fired[-1] >= interval:
                fired.append(t)
        return fired


    def classify_presses(events, threshold):
        """`events` is a list of ("down", time) and ("up", time) pairs in time order. Each "down" followed by its "up" is a press: 'tap' if it lasted LESS than threshold ms, otherwise 'long'. Ignore an "up" with no "down" before it and a "down" that never gets its "up". Return the list of press names in order."""
        out = []
        down = None
        for kind, t in events:
            if kind == "down":
                down = t
            elif kind == "up" and down is not None:
                out.append("tap" if t - down < threshold else "long")
                down = None
        return out


    def classify_clicks(times, window):
        """Group clicks into gestures: a click belongs to the previous gesture if it comes at most `window` ms after the previous click. Name each gesture by its size: 1 'single', 2 'double', 3 or more 'triple'. Return the list of names (times are sorted)."""
        names = {1: "single", 2: "double"}
        groups = []
        for t in times:
            if groups and t - groups[-1][-1] <= window:
                groups[-1].append(t)
            else:
                groups.append([t])
        return [names.get(len(g), "triple") for g in groups]
  explanation: Search boxes use debouncing so that typing five letters sends one request instead of five.
- id: reducer
  title: 'Capstone: an app state reducer'
  difficulty: 5
  prompt: 'Many modern apps keep all their data in one **state** and change it only through a pure function called a **reducer**: `(old state, action) -> new state`. It never modifies the old state, which makes undo, debugging and time travel easy. Build a to-do list. Write `initial_state()` = `{"items": [], "next_id": 1, "filter": "all"}`. Write `reduce(state, action)` with these actions (dicts with a `"type"`): `add` (with `"text"`) appends `{"id": next_id, "text": text, "done": False}` and increases `next_id` (`ValueError("empty text")` if the text is blank); `toggle` (with `"id"`) flips that item''s `done` flag; `edit` (with `"id"` and `"text"`) changes its text (same empty check); `remove` (with `"id"`) deletes it; `clear_done` deletes every done item; `set_filter` (with `"filter"`: `"all"`, `"active"` or `"done"`, otherwise `ValueError("bad filter")`). `ValueError("no such item")` for toggle, edit or remove with an unknown id and `ValueError("unknown action")` for any other type. Write `visible_items(state)` (the items matching the filter), `count_left(state)` (how many items are **not** done) and `state_after(actions, n=None)`: start from `initial_state()`, apply the first `n` actions (all if `n` is `None`) and return the state: **time travel**.'
  starter: |-
    def initial_state():
        """A new empty to-do app state: {"items": [], "next_id": 1, "filter": "all"}."""
        pass


    def reduce(state, action):
        """A REDUCER is a pure function: (old state, action) -> NEW state. It never changes the old state (this makes undo and debugging easy). Actions are dicts with a "type":
        add (with "text"): append {"id": next_id, "text": text, "done": False} and increase next_id; ValueError('empty text') if the text is blank (only spaces or nothing);
        toggle (with "id"): flip that item's done flag;
        edit (with "id" and "text"): change the item's text (same empty check);
        remove (with "id"): delete the item;
        clear_done: delete every item that is done;
        set_filter (with "filter"): "all", "active" or "done", otherwise ValueError('bad filter').
        ValueError('no such item') for toggle, edit or remove with an unknown id, and ValueError('unknown action') for any other type."""
        pass


    def visible_items(state):
        """The items to show: all of them, only the ones not done ("active"), or only the done ones, according to the filter. Return the list of items (the same dicts)."""
        pass


    def count_left(state):
        """How many items are NOT done."""
        pass


    def state_after(actions, n=None):
        """Start from initial_state() and apply the first n actions with reduce (all of them if n is None) and return the resulting state: TIME TRAVEL, because every earlier state can be recomputed."""
        pass
  tests:
  - name: adding and toggling
    code: |
      s0 = initial_state()
      assert s0 == {"items": [], "next_id": 1, "filter": "all"}
      s1 = reduce(s0, {"type": "add", "text": "milk"})
      s2 = reduce(s1, {"type": "add", "text": "eggs"})
      s3 = reduce(s2, {"type": "toggle", "id": 1})
      assert s3["items"] == [{"id": 1, "text": "milk", "done": True}, {"id": 2, "text": "eggs", "done": False}] and s3["next_id"] == 3
      assert s0 == {"items": [], "next_id": 1, "filter": "all"} and s2["items"][0]["done"] is False and s1["items"] == [{"id": 1, "text": "milk", "done": False}]
      assert reduce(s3, {"type": "toggle", "id": 1})["items"][0]["done"] is False
      for bad, msg in (({"type": "add", "text": "   "}, "empty text"), ({"type": "toggle", "id": 9}, "no such item"), ({"type": "fly"}, "unknown action"), ({"type": "set_filter", "filter": "x"}, "bad filter")):
          try:
              reduce(s3, bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
