      acts = [{"type": "add", "text": "a"}, {"type": "add", "text": "b"}, {"type": "add", "text": "c"}, {"type": "toggle", "id": 2}]
      s = state_after(acts)
      assert count_left(s) == 2 and count_left(initial_state()) == 0
      assert [i["id"] for i in visible_items(s)] == [1, 2, 3]
      assert [i["id"] for i in visible_items(reduce(s, {"type": "set_filter", "filter": "active"}))] == [1, 3]
      assert [i["id"] for i in visible_items(reduce(s, {"type": "set_filter", "filter": "done"}))] == [2]
      c = reduce(s, {"type": "clear_done"})
      assert [i["id"] for i in c["items"]] == [1, 3] and c["next_id"] == 4 and c["filter"] == "all"
  - name: time travel
    code: |
      acts = [{"type": "add", "text": "x"}, {"type": "add", "text": "y"}, {"type": "toggle", "id": 1}, {"type": "remove", "id": 2}]
      assert state_after(acts, 0) == initial_state() and len(state_after(acts, 2)["items"]) == 2 and state_after(acts, 2)["items"][0]["done"] is False
      assert state_after(acts)["items"] == [{"id": 1, "text": "x", "done": True}] and state_after(acts) == state_after(acts, 4) and state_after(acts, 99) == state_after(acts)
      assert acts[0] == {"type": "add", "text": "x"} and state_after([]) == initial_state()
  hints:
  - Copy the items list (and each item dict) before changing anything, so the old state stays intact.
  solution: |
    def initial_state():
        """A new empty to-do app state: {"items": [], "next_id": 1, "filter": "all"}."""
        return {"items": [], "next_id": 1, "filter": "all"}


    def reduce(state, action):
        """A REDUCER is a pure function: (old state, action) -> NEW state. It never changes the old state (this makes undo and debugging easy). Actions are dicts with a "type":
        add (with "text"): append {"id": next_id, "text": text, "done": False} and increase next_id; ValueError('empty text') if the text is blank (only spaces or nothing);
        toggle (with "id"): flip that item's done flag;
        edit (with "id" and "text"): change the item's text (same empty check);
        remove (with "id"): delete the item;
        clear_done: delete every item that is done;
        set_filter (with "filter"): "all", "active" or "done", otherwise ValueError('bad filter').
        ValueError('no such item') for toggle, edit or remove with an unknown id, and ValueError('unknown action') for any other type."""
        items = [dict(i) for i in state["items"]]
        kind = action["type"]
        nxt, flt = state["next_id"], state["filter"]
        if kind == "add":
            if not action["text"].strip():
                raise ValueError("empty text")
            items.append({"id": nxt, "text": action["text"], "done": False})
            nxt += 1
        elif kind in ("toggle", "edit", "remove"):
            found = [i for i in items if i["id"] == action["id"]]
            if not found:
                raise ValueError("no such item")
            if kind == "toggle":
                found[0]["done"] = not found[0]["done"]
            elif kind == "edit":
                if not action["text"].strip():
                    raise ValueError("empty text")
                found[0]["text"] = action["text"]
            else:
                items.remove(found[0])
        elif kind == "clear_done":
            items = [i for i in items if not i["done"]]
        elif kind == "set_filter":
            if action["filter"] not in ("all", "active", "done"):
                raise ValueError("bad filter")
            flt = action["filter"]
        else:
            raise ValueError("unknown action")
        return {"items": items, "next_id": nxt, "filter": flt}


    def visible_items(state):
        """The items to show: all of them, only the ones not done ("active"), or only the done ones, according to the filter. Return the list of items (the same dicts)."""
        if state["filter"] == "active":
            return [i for i in state["items"] if not i["done"]]
        if state["filter"] == "done":
            return [i for i in state["items"] if i["done"]]
        return list(state["items"])


    def count_left(state):
        """How many items are NOT done."""
        return sum(1 for i in state["items"] if not i["done"])


    def state_after(actions, n=None):
        """Start from initial_state() and apply the first n actions with reduce (all of them if n is None) and return the resulting state: TIME TRAVEL, because every earlier state can be recomputed."""
        state = initial_state()
        for action in (actions if n is None else actions[:n]):
            state = reduce(state, action)
        return state
  explanation: This is the idea behind Redux, Elm and most modern interface frameworks.
commonMistakes:
- title: Changing an old state in place
  explanation: Build a new state so earlier states stay valid.
- title: Keeping the redo list after a new change
  explanation: A new change must clear the future.
- title: Inverting a delete without remembering the text
  explanation: The inverse needs the removed characters.
- title: Reacting to every keystroke with a slow search
  explanation: Debounce the input.
- title: Forgetting states where an event is impossible
  explanation: Decide whether to ignore or reject it.
summary:
- Interfaces wait for events and react according to their state.
- A state machine lists what each event does in each state.
- Undo keeps a past, present and future; new changes clear the future.
- Commands can invert themselves, which makes editors undoable.
- Debounce and throttle tame event bursts; reducers make state changes pure and replayable.
