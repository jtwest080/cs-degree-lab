exercises:
- id: fsm
  title: State machines
  difficulty: 3
  prompt: 'Interfaces are always in some **state** (a button is `idle`, `pressed` or `disabled`; a video is `stopped`, `playing` or `paused`) and **events** (clicks, key presses, timers) move them between states. A **state machine** lists exactly what each event does in each state, which prevents impossible situations. `transitions` is a dict `{(state, event): new_state}`. Write `step(transitions, state, event)`: return the new state, or `ValueError("no transition from STATE on EVENT")` (with the real state and event) if there is none. Write `run_events(transitions, start, events, strict=False)`: feed the events in order and return the list of states visited **including the start** state; an event with no transition is **ignored** (the state is repeated in the list) unless `strict` is `True`, in which case the error from `step` is raised. Write `reachable(transitions, start)`: the sorted list of states that can be reached from `start` (including `start`). Write `unreachable_states(transitions, start)`: states that appear in the transitions (as a source or a target) but can never be reached from `start`, as a sorted list: usually bugs.'
  starter: |-
    def step(transitions, state, event):
        """A STATE MACHINE says what happens when an event arrives in a given state. `transitions` is a dict {(state, event): new_state}. Return the new state; ValueError('no transition from STATE on EVENT') (with the real state and event) if there is none."""
        pass


    def run_events(transitions, start, events, strict=False):
        """Feed a list of events to the machine and return the list of states visited, INCLUDING the start state. An event with no transition is IGNORED (the state stays and is repeated in the list) unless strict is True, in which case the ValueError from step is raised."""
        pass


    def reachable(transitions, start):
        """The sorted list of states that can be reached from `start` by some sequence of events (including start itself)."""
        pass


    def unreachable_states(transitions, start):
        """States that appear in the transitions (as a source or a target) but can never be reached from `start`, as a sorted list: these are usually bugs."""
        pass
  tests:
  - name: one step
    code: |
      t = {("stopped", "play"): "playing", ("playing", "pause"): "paused", ("paused", "play"): "playing", ("playing", "stop"): "stopped", ("paused", "stop"): "stopped"}
      assert step(t, "stopped", "play") == "playing" and step(t, "paused", "stop") == "stopped"
      for state, event in (("stopped", "pause"), ("playing", "play")):
          try:
              step(t, state, event)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "no transition from %s on %s" % (state, event) in str(e)
  - name: running events
    code: |
      t = {("stopped", "play"): "playing", ("playing", "pause"): "paused", ("paused", "play"): "playing", ("playing", "stop"): "stopped", ("paused", "stop"): "stopped"}
      assert run_events(t, "stopped", ["play", "pause", "play", "stop"]) == ["stopped", "playing", "paused", "playing", "stopped"]
      assert run_events(t, "stopped", ["pause", "play", "play", "stop"]) == ["stopped", "stopped", "playing", "playing", "stopped"] and run_events(t, "paused", []) == ["paused"]
      try:
          run_events(t, "stopped", ["play", "play"], strict=True)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "no transition from playing on play" in str(e)
      assert run_events(t, "stopped", ["play", "stop"], True) == ["stopped", "playing", "stopped"]
  - name: reachability
    code: |
      t = {("a", "go"): "b", ("b", "go"): "c", ("c", "back"): "a", ("x", "go"): "y", ("y", "go"): "a", ("d", "go"): "d"}
      assert reachable(t, "a") == ["a", "b", "c"] and reachable(t, "x") == ["a", "b", "c", "x", "y"] and reachable(t, "z") == ["z"] and reachable({}, "a") == ["a"]
      assert unreachable_states(t, "a") == ["d", "x", "y"] and unreachable_states(t, "x") == ["d"] and unreachable_states({("a", "e"): "b"}, "a") == []
  hints:
  - 'Reachability is a search: keep a set of seen states and a list of states still to explore.'
  solution: |
    def step(transitions, state, event):
        """A STATE MACHINE says what happens when an event arrives in a given state. `transitions` is a dict {(state, event): new_state}. Return the new state; ValueError('no transition from STATE on EVENT') (with the real state and event) if there is none."""
        if (state, event) not in transitions:
            raise ValueError("no transition from %s on %s" % (state, event))
        return transitions[(state, event)]


    def run_events(transitions, start, events, strict=False):
        """Feed a list of events to the machine and return the list of states visited, INCLUDING the start state. An event with no transition is IGNORED (the state stays and is repeated in the list) unless strict is True, in which case the ValueError from step is raised."""
        state = start
        visited = [state]
        for event in events:
            if (state, event) in transitions:
                state = transitions[(state, event)]
            elif strict:
                step(transitions, state, event)
            visited.append(state)
        return visited


    def reachable(transitions, start):
        """The sorted list of states that can be reached from `start` by some sequence of events (including start itself)."""
        seen = {start}
        todo = [start]
        while todo:
            s = todo.pop()
            for (a, event), b in transitions.items():
                if a == s and b not in seen:
                    seen.add(b)
                    todo.append(b)
        return sorted(seen)


    def unreachable_states(transitions, start):
        """States that appear in the transitions (as a source or a target) but can never be reached from `start`, as a sorted list: these are usually bugs."""
        mentioned = set()
        for (a, event), b in transitions.items():
            mentioned.add(a)
            mentioned.add(b)
        return sorted(mentioned - set(reachable(transitions, start)))
  explanation: Drawing the state machine on paper before coding finds most interface bugs, such as a Pay button that can be pressed twice.
- id: undo
  title: Undo and redo
  difficulty: 4
  prompt: 'Every good editor lets you undo. A **history** is a dict `{"past": [...], "present": value, "future": [...]}`: the earlier values (oldest first), the current value, and the values that were undone (nearest first). None of your functions may modify the history they receive; each returns a **new** one. Write `new_history(value)` (empty past and future). Write `apply_change(history, value, max_undo=None)`: the new present is `value`, the old present goes to the end of the past, and the **future is emptied** (a new change erases what could be redone); if `value` equals the present return an unchanged copy; if `max_undo` is not `None` keep only the newest `max_undo` entries of the past. Write `undo(history)`: the last past value becomes the present and the old present goes to the **front** of the future (`ValueError("nothing to undo")` if the past is empty). Write `redo(history)`: the first future value becomes the present and the old present goes to the **end** of the past (`ValueError("nothing to redo")` if the future is empty).'
  starter: |-
    def new_history(value):
        """A HISTORY for undo and redo is a dict {"past": [], "present": value, "future": []}: the values before the current one (oldest first), the current value, and the values that were undone (nearest first)."""
        pass


    def apply_change(history, value, max_undo=None):
        """Make a change: return a NEW history whose present is `value`, whose past gets the old present at its end, and whose future is EMPTY (a new change erases what could be redone). If value equals the present, return an unchanged copy. If max_undo is not None, keep only the newest max_undo entries of the past. Never modify the history you were given."""
        pass


    def undo(history):
        """Go back one step: the last past value becomes the present and the old present goes to the FRONT of the future. ValueError('nothing to undo') if the past is empty. Return a new history."""
        pass


    def redo(history):
        """Go forward one step: the first future value becomes the present and the old present goes to the END of the past. ValueError('nothing to redo') if the future is empty. Return a new history."""
        pass
  tests:
  - name: changing
    code: |
      h = new_history("a")
      assert h == {"past": [], "present": "a", "future": []}
      h2 = apply_change(h, "b")
      h3 = apply_change(h2, "c")
      assert h3 == {"past": ["a", "b"], "present": "c", "future": []} and h == {"past": [], "present": "a", "future": []} and h2["past"] == ["a"]
      same = apply_change(h3, "c")
      assert same == h3 and same is not h3 and same["past"] is not h3["past"]
  - name: undo and redo
    code: |
      h = new_history(0)
      for v in (1, 2, 3):
          h = apply_change(h, v)
      u = undo(h)
      assert u == {"past": [0, 1], "present": 2, "future": [3]} and h["present"] == 3
      u2 = undo(u)
      assert u2 == {"past": [0], "present": 1, "future": [2, 3]}
      r = redo(u2)
      assert r == u and redo(redo(u2)) == h
      for f, msg in ((lambda: undo(new_history(1)), "nothing to undo"), (lambda: redo(h), "nothing to redo")):
          try:
              f()
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
