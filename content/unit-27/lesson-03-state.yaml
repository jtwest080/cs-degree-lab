    code: |
      ev = [("down", 0), ("up", 100), ("down", 300), ("up", 900), ("down", 1000), ("up", 1199)]
      assert classify_presses(ev, 200) == ["tap", "long", "tap"] and classify_presses(ev, 100) == ["long", "long", "long"]
      assert classify_presses([("up", 5), ("down", 10), ("up", 20)], 50) == ["tap"] and classify_presses([("down", 0)], 50) == [] and classify_presses([], 50) == [] and classify_presses([("down", 0), ("up", 50)], 50) == ["long"]
  - name: clicks
