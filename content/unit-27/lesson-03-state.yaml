    note: Events with no transition are ignored.
  - line: 73
    note: From stopped you can reach every state.
  - line: 78
    note: The past, present and future after undoing twice.
  - line: 79
    note: A new change clears the future.
- title: Commands, timing and a reducer
  intro: Edit and undo a text, smooth bursts of events, and replay a to-do list.
  code: |
    def apply_command(text, cmd):
        """Apply one editing COMMAND to a string and return the new string. A command is a dict: {"type": "insert", "pos": i, "text": s} puts s before index i (ValueError('bad position') unless 0 <= i <= len(text)); {"type": "delete", "pos": i, "count": n} removes n characters starting at i (ValueError('bad range') unless 0 <= i and i + n <= len(text) and n >= 0); anything else is ValueError('unknown command')."""
        kind = cmd["type"]
        if kind == "insert":
            if cmd["pos"] < 0 or cmd["pos"] > len(text):
                raise ValueError("bad position")
            return text[:cmd["pos"]] + cmd["text"] + text[cmd["pos"]:]
        if kind == "delete":
            if cmd["pos"] < 0 or cmd["count"] < 0 or cmd["pos"] + cmd["count"] > len(text):
                raise ValueError("bad range")
            return text[:cmd["pos"]] + text[cmd["pos"] + cmd["count"]:]
        raise ValueError("unknown command")


    def invert_command(text, cmd):
        """The command that UNDOES `cmd` when applied to the text that results from it. Work it out from the text BEFORE the command: an insert is undone by deleting exactly what was inserted ({"type": "delete", "pos": same, "count": len of the inserted text}); a delete is undone by inserting back the characters that were removed ({"type": "insert", "pos": same, "text": the removed characters})."""
        if cmd["type"] == "insert":
            return {"type": "delete", "pos": cmd["pos"], "count": len(cmd["text"])}
        return {"type": "insert", "pos": cmd["pos"], "text": text[cmd["pos"]:cmd["pos"] + cmd["count"]]}


    def run_commands(text, commands):
        """Apply the commands in order. Return (final text, undo stack) where the undo stack is the list of inverse commands, one per command, in the order the commands were applied (so undoing means taking them from the END)."""
        stack = []
        for cmd in commands:
            inverse = invert_command(text, cmd)
            text = apply_command(text, cmd)
            stack.append(inverse)
        return (text, stack)


    def undo_all(text, undo_stack):
        """Undo everything: apply the inverse commands from the LAST to the FIRST and return the resulting text. The stack itself must not change."""
        for inverse in reversed(undo_stack):
            text = apply_command(text, inverse)
        return text


    def debounce(times, wait):
        """DEBOUNCING waits until events have STOPPED coming before acting (for example searching only when the user pauses typing). `times` is a sorted list of event times in milliseconds. The action fires `wait` ms after an event if no further event arrives within that time (a gap of exactly `wait` counts as no event). Return the list of times at which it fires."""
        fires = []
        for i, t in enumerate(times):
            if i + 1 == len(times) or times[i + 1] - t >= wait:
                fires.append(t + wait)
        return fires


    def throttle(times, interval):
        """THROTTLING limits how often something happens (for example handling a scroll). The first event fires; after that an event fires only if at least `interval` ms have passed since the last time it FIRED. Return the list of firing times."""
        fired = []
        for t in times:
            if not fired or t - fired[-1] >= interval:
                fired.append(t)
        return fired


    def classify_presses(events, threshold):
        """`events` is a list of ("down", time) and ("up", time) pairs in time order. Each "down" followed by its "up" is a press: 'tap' if it lasted LESS than threshold ms, otherwise 'long'. Ignore an "up" with no "down" before it and a "down" that never gets its "up". Return the list of press names in order."""
        out = []
        down = None
        for kind, t in events:
            if kind == "down":
                down = t
            elif kind == "up" and down is not None:
                out.append("tap" if t - down < threshold else "long")
                down = None
        return out


    def classify_clicks(times, window):
        """Group clicks into gestures: a click belongs to the previous gesture if it comes at most `window` ms after the previous click. Name each gesture by its size: 1 'single', 2 'double', 3 or more 'triple'. Return the list of names (times are sorted)."""
        names = {1: "single", 2: "double"}
        groups = []
        for t in times:
            if groups and t - groups[-1][-1] <= window:
                groups[-1].append(t)
            else:
                groups.append([t])
        return [names.get(len(g), "triple") for g in groups]


    def initial_state():
        """A new empty to-do app state: {"items": [], "next_id": 1, "filter": "all"}."""
        return {"items": [], "next_id": 1, "filter": "all"}


    def reduce(state, action):
        """A REDUCER is a pure function: (old state, action) -> NEW state. It never changes the old state (this makes undo and debugging easy). Actions are dicts with a "type":
        add (with "text"): append {"id": next_id, "text": text, "done": False} and increase next_id; ValueError('empty text') if the text is blank (only spaces or nothing);
        toggle (with "id"): flip that item's done flag;
        edit (with "id" and "text"): change the item's text (same empty check);
        remove (with "id"): delete the item;
        clear_done: delete every item that is done;
        set_filter (with "filter"): "all", "active" or "done", otherwise ValueError('bad filter').
        ValueError('no such item') for toggle, edit or remove with an unknown id, and ValueError('unknown action') for any other type."""
        items = [dict(i) for i in state["items"]]
        kind = action["type"]
        nxt, flt = state["next_id"], state["filter"]
        if kind == "add":
            if not action["text"].strip():
                raise ValueError("empty text")
            items.append({"id": nxt, "text": action["text"], "done": False})
            nxt += 1
        elif kind in ("toggle", "edit", "remove"):
            found = [i for i in items if i["id"] == action["id"]]
            if not found:
                raise ValueError("no such item")
            if kind == "toggle":
                found[0]["done"] = not found[0]["done"]
            elif kind == "edit":
                if not action["text"].strip():
                    raise ValueError("empty text")
                found[0]["text"] = action["text"]
            else:
                items.remove(found[0])
        elif kind == "clear_done":
            items = [i for i in items if not i["done"]]
        elif kind == "set_filter":
            if action["filter"] not in ("all", "active", "done"):
                raise ValueError("bad filter")
            flt = action["filter"]
        else:
            raise ValueError("unknown action")
        return {"items": items, "next_id": nxt, "filter": flt}


    def visible_items(state):
        """The items to show: all of them, only the ones not done ("active"), or only the done ones, according to the filter. Return the list of items (the same dicts)."""
        if state["filter"] == "active":
            return [i for i in state["items"] if not i["done"]]
        if state["filter"] == "done":
            return [i for i in state["items"] if i["done"]]
        return list(state["items"])


    def count_left(state):
        """How many items are NOT done."""
        return sum(1 for i in state["items"] if not i["done"])


    def state_after(actions, n=None):
        """Start from initial_state() and apply the first n actions with reduce (all of them if n is None) and return the resulting state: TIME TRAVEL, because every earlier state can be recomputed."""
        state = initial_state()
        for action in (actions if n is None else actions[:n]):
            state = reduce(state, action)
        return state

    text, stack = run_commands("", [{"type": "insert", "pos": 0, "text": "Hello"}, {"type": "insert", "pos": 5, "text": " world"}, {"type": "delete", "pos": 0, "count": 1}])
    print("edited text:", text, "| undone:", repr(undo_all(text, stack)))
    keys = [0, 80, 150, 900, 950, 2000]
    print("search fires (debounce 300 ms):", debounce(keys, 300), "| scroll handled (throttle 500 ms):", throttle(keys, 500))
    print("clicks:", classify_clicks([0, 150, 1000, 5000, 5100, 5200], 300))
    acts = [{"type": "add", "text": "buy milk"}, {"type": "add", "text": "write essay"}, {"type": "toggle", "id": 1}, {"type": "set_filter", "filter": "active"}]
    state = state_after(acts)
    print("visible:", [i["text"] for i in visible_items(state)], "| left:", count_left(state), "| items after each step:", [len(state_after(acts, n)["items"]) for n in range(5)])
  output: |
    edited text: ello world | undone: ''
    search fires (debounce 300 ms): [450, 1250, 2300] | scroll handled (throttle 500 ms): [0, 900, 2000]
    clicks: ['double', 'single', 'triple']
    visible: ['write essay'] | left: 1 | items after each step: [0, 1, 2, 2, 2]
  lines:
  - line: 149
    note: Undoing the three commands returns to the empty text.
  - line: 151
    note: Debouncing waits for pauses; throttling fires at fixed spacing.
  - line: 152
    note: Two clicks close together form a double click.
  - line: 155
    note: State after every prefix of the actions shows how it grew.
