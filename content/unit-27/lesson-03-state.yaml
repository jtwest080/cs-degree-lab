      while h["past"]:
          h = undo(h)
          steps += 1
      assert steps == 3 and h["present"] == 4
  hints:
  - Build new lists with + and slices; never use append on the lists inside the old history.
  solution: |
    def new_history(value):
        """A HISTORY for undo and redo is a dict {"past": [], "present": value, "future": []}: the values before the current one (oldest first), the current value, and the values that were undone (nearest first)."""
        return {"past": [], "present": value, "future": []}


    def apply_change(history, value, max_undo=None):
        """Make a change: return a NEW history whose present is `value`, whose past gets the old present at its end, and whose future is EMPTY (a new change erases what could be redone). If value equals the present, return an unchanged copy. If max_undo is not None, keep only the newest max_undo entries of the past. Never modify the history you were given."""
        if value == history["present"]:
            return {"past": list(history["past"]), "present": history["present"], "future": list(history["future"])}
        past = history["past"] + [history["present"]]
        if max_undo is not None:
            past = past[-max_undo:] if max_undo > 0 else []
        return {"past": past, "present": value, "future": []}


    def undo(history):
        """Go back one step: the last past value becomes the present and the old present goes to the FRONT of the future. ValueError('nothing to undo') if the past is empty. Return a new history."""
        if not history["past"]:
            raise ValueError("nothing to undo")
        return {"past": history["past"][:-1], "present": history["past"][-1], "future": [history["present"]] + history["future"]}


    def redo(history):
        """Go forward one step: the first future value becomes the present and the old present goes to the END of the past. ValueError('nothing to redo') if the future is empty. Return a new history."""
        if not history["future"]:
            raise ValueError("nothing to redo")
        return {"past": history["past"] + [history["present"]], "present": history["future"][0], "future": history["future"][1:]}
  explanation: Undo is the safety net that lets people explore without fear.
- id: commands
  title: The command pattern
  difficulty: 4
  prompt: 'A text editor can undo precisely if every edit is a **command** (a small description of the change) that can be **inverted**. A command is a dict: `{"type": "insert", "pos": i, "text": s}` puts `s` before index `i`; `{"type": "delete", "pos": i, "count": n}` removes `n` characters from `i`. Write `apply_command(text, cmd)`: return the new string; `ValueError("bad position")` for an insert unless `0 <= i <= len(text)`; `ValueError("bad range")` for a delete unless `0 <= i`, `0 <= n` and `i + n <= len(text)`; `ValueError("unknown command")` for any other type. Write `invert_command(text, cmd)`: the command that **undoes** `cmd`, worked out from the text **before** the command: an insert is undone by a delete of exactly the inserted length at the same position; a delete is undone by an insert, at the same position, of the characters that were removed. Write `run_commands(text, commands)`: apply them in order and return `(final text, undo stack)`, where the undo stack is the list of inverse commands, one per command, in the order the commands were applied. Write `undo_all(text, undo_stack)`: apply the inverses from the **last to the first** and return the text (the stack must not change).'
  starter: |-
    def apply_command(text, cmd):
        """Apply one editing COMMAND to a string and return the new string. A command is a dict: {"type": "insert", "pos": i, "text": s} puts s before index i (ValueError('bad position') unless 0 <= i <= len(text)); {"type": "delete", "pos": i, "count": n} removes n characters starting at i (ValueError('bad range') unless 0 <= i and i + n <= len(text) and n >= 0); anything else is ValueError('unknown command')."""
        pass


    def invert_command(text, cmd):
        """The command that UNDOES `cmd` when applied to the text that results from it. Work it out from the text BEFORE the command: an insert is undone by deleting exactly what was inserted ({"type": "delete", "pos": same, "count": len of the inserted text}); a delete is undone by inserting back the characters that were removed ({"type": "insert", "pos": same, "text": the removed characters})."""
        pass


    def run_commands(text, commands):
        """Apply the commands in order. Return (final text, undo stack) where the undo stack is the list of inverse commands, one per command, in the order the commands were applied (so undoing means taking them from the END)."""
        pass


    def undo_all(text, undo_stack):
        """Undo everything: apply the inverse commands from the LAST to the FIRST and return the resulting text. The stack itself must not change."""
        pass
  tests:
  - name: applying
    code: |
      assert apply_command("hello", {"type": "insert", "pos": 5, "text": " world"}) == "hello world" and apply_command("hello", {"type": "insert", "pos": 0, "text": ">"}) == ">hello"
      assert apply_command("hello", {"type": "delete", "pos": 1, "count": 3}) == "ho" and apply_command("hello", {"type": "delete", "pos": 0, "count": 0}) == "hello" and apply_command("", {"type": "insert", "pos": 0, "text": "x"}) == "x"
      for cmd, msg in (({"type": "insert", "pos": 6, "text": "x"}, "bad position"), ({"type": "insert", "pos": -1, "text": "x"}, "bad position"), ({"type": "delete", "pos": 3, "count": 3}, "bad range"), ({"type": "delete", "pos": -1, "count": 1}, "bad range"), ({"type": "delete", "pos": 1, "count": -1}, "bad range"), ({"type": "paint"}, "unknown command")):
          try:
              apply_command("hello", cmd)
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
  - name: inverting
    code: |
      ins = {"type": "insert", "pos": 2, "text": "XYZ"}
      dele = {"type": "delete", "pos": 1, "count": 2}
      assert invert_command("hello", ins) == {"type": "delete", "pos": 2, "count": 3} and invert_command("hello", dele) == {"type": "insert", "pos": 1, "text": "el"}
      for cmd in (ins, dele):
          after = apply_command("hello", cmd)
          assert apply_command(after, invert_command("hello", cmd)) == "hello"
      assert ins == {"type": "insert", "pos": 2, "text": "XYZ"}
  - name: running and undoing
    code: |
      cmds = [{"type": "insert", "pos": 0, "text": "Hello"}, {"type": "insert", "pos": 5, "text": " world"}, {"type": "delete", "pos": 0, "count": 1}, {"type": "insert", "pos": 0, "text": "J"}, {"type": "delete", "pos": 5, "count": 6}]
      text, stack = run_commands("", cmds)
      assert text == "Jello" and len(stack) == 5 and stack[0] == {"type": "delete", "pos": 0, "count": 5} and stack[2] == {"type": "insert", "pos": 0, "text": "H"}
      assert undo_all(text, stack) == "" and len(stack) == 5
      assert run_commands("abc", []) == ("abc", []) and undo_all("abc", []) == "abc"
      text, stack = run_commands("The quick fox", [{"type": "delete", "pos": 4, "count": 6}, {"type": "insert", "pos": 4, "text": "slow "}])
      assert text == "The slow fox" and undo_all(text, stack) == "The quick fox"
      try:
          run_commands("ab", [{"type": "delete", "pos": 0, "count": 5}])
          raise AssertionError("accepted")
      except ValueError as e:
          assert "bad range" in str(e)
  hints:
  - To invert a delete you must remember the deleted text, which is why the original text is passed in.
  solution: |
    def apply_command(text, cmd):
        """Apply one editing COMMAND to a string and return the new string. A command is a dict: {"type": "insert", "pos": i, "text": s} puts s before index i (ValueError('bad position') unless 0 <= i <= len(text)); {"type": "delete", "pos": i, "count": n} removes n characters starting at i (ValueError('bad range') unless 0 <= i and i + n <= len(text) and n >= 0); anything else is ValueError('unknown command')."""
        kind = cmd["type"]
        if kind == "insert":
            if cmd["pos"] < 0 or cmd["pos"] > len(text):
                raise ValueError("bad position")
            return text[:cmd["pos"]] + cmd["text"] + text[cmd["pos"]:]
        if kind == "delete":
            if cmd["pos"] < 0 or cmd["count"] < 0 or cmd["pos"] + cmd["count"] > len(text):
                raise ValueError("bad range")
            return text[:cmd["pos"]] + text[cmd["pos"] + cmd["count"]:]
        raise ValueError("unknown command")


    def invert_command(text, cmd):
        """The command that UNDOES `cmd` when applied to the text that results from it. Work it out from the text BEFORE the command: an insert is undone by deleting exactly what was inserted ({"type": "delete", "pos": same, "count": len of the inserted text}); a delete is undone by inserting back the characters that were removed ({"type": "insert", "pos": same, "text": the removed characters})."""
        if cmd["type"] == "insert":
            return {"type": "delete", "pos": cmd["pos"], "count": len(cmd["text"])}
        return {"type": "insert", "pos": cmd["pos"], "text": text[cmd["pos"]:cmd["pos"] + cmd["count"]]}


    def run_commands(text, commands):
        """Apply the commands in order. Return (final text, undo stack) where the undo stack is the list of inverse commands, one per command, in the order the commands were applied (so undoing means taking them from the END)."""
        stack = []
        for cmd in commands:
            inverse = invert_command(text, cmd)
            text = apply_command(text, cmd)
            stack.append(inverse)
        return (text, stack)


    def undo_all(text, undo_stack):
        """Undo everything: apply the inverse commands from the LAST to the FIRST and return the resulting text. The stack itself must not change."""
        for inverse in reversed(undo_stack):
            text = apply_command(text, inverse)
        return text
  explanation: Every undo feature in every editor, from Word to Photoshop, is built from commands like these.
- id: timing
  title: Debouncing, throttling and gestures
  difficulty: 4
  prompt: 'Input events arrive in bursts, so interfaces smooth them. Times are in **milliseconds**. Write `debounce(times, wait)`: **debouncing** waits until events have **stopped** before acting (such as searching only when the user pauses typing). `times` is a sorted list of event times; the action fires `wait` ms after an event if no further event arrives within that time (a gap of exactly `wait` counts as no event). Return the list of times it fires. Write `throttle(times, interval)`: **throttling** limits how often something happens (such as handling a scroll). The first event fires; after that an event fires only if at least `interval` ms have passed since the last time it **fired**. Return the firing times. Write `classify_presses(events, threshold)`: `events` is a list of `("down", time)` and `("up", time)` pairs in time order. Each `"down"` followed by its `"up"` is a press: `"tap"` if it lasted **less than** `threshold` ms, otherwise `"long"`. Ignore an `"up"` with no `"down"` before it and a `"down"` that never gets its `"up"`. Write `classify_clicks(times, window)`: a click belongs to the previous gesture if it comes **at most** `window` ms after the previous click; name each gesture by its size: 1 `"single"`, 2 `"double"`, 3 or more `"triple"`.'
  starter: |-
    def debounce(times, wait):
        """DEBOUNCING waits until events have STOPPED coming before acting (for example searching only when the user pauses typing). `times` is a sorted list of event times in milliseconds. The action fires `wait` ms after an event if no further event arrives within that time (a gap of exactly `wait` counts as no event). Return the list of times at which it fires."""
        pass


