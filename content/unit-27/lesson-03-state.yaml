      s = state_after([{"type": "add", "text": "a"}, {"type": "add", "text": "b"}, {"type": "add", "text": "c"}])
      e = reduce(s, {"type": "edit", "id": 2, "text": "B!"})
      assert [i["text"] for i in e["items"]] == ["a", "B!", "c"] and [i["text"] for i in s["items"]] == ["a", "b", "c"]
      r = reduce(e, {"type": "remove", "id": 1})
      assert [i["id"] for i in r["items"]] == [2, 3] and r["next_id"] == 4
      assert reduce(r, {"type": "add", "text": "d"})["items"][-1]["id"] == 4
      for bad, msg in (({"type": "edit", "id": 2, "text": ""}, "empty text"), ({"type": "edit", "id": 7, "text": "x"}, "no such item"), ({"type": "remove", "id": 7}, "no such item")):
          try:
              reduce(r, bad)
              raise AssertionError("accepted")
          except ValueError as err:
              assert msg in str(err)
