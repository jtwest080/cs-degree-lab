      assert classify_clicks([0, 200, 1000, 1300, 1500, 1700, 5000], 300) == ["double", "triple", "single"] and classify_clicks([], 300) == [] and classify_clicks([10], 300) == ["single"]
      assert classify_clicks([0, 300], 300) == ["double"] and classify_clicks([0, 301], 300) == ["single", "single"] and classify_clicks([0, 100, 200, 300, 400], 100) == ["triple"]
