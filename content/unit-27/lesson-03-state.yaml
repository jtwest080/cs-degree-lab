- type: code
  question: 'Write `toggle_state(state)` for a light switch: return `"on"` if the state is `"off"` and `"off"` if it is `"on"`; raise `ValueError` for any other value.'
  starter: |
    def toggle_state(state):
        pass
  tests:
  - name: switch
    code: |
      assert toggle_state("off") == "on" and toggle_state("on") == "off"
      try:
          toggle_state("broken")
          raise AssertionError("accepted")
      except ValueError:
          pass
  solution: |
    def toggle_state(state):
        if state == "off":
            return "on"
        if state == "on":
            return "off"
        raise ValueError("bad state")
