id: u27-state
title: Events, State and Undo
minutes: 100
objective: Understand how interfaces respond to events. You will model screens as state machines, build undo and redo from a history, use the command pattern for an editor, smooth noisy input with debouncing and throttling, and write a reducer that holds the whole state of an app.
outcomes:
- Draw an interface as a state machine
- Find unreachable states
- Implement undo and redo without modifying old values
- Invert editing commands
- Debounce and throttle events
- Write a pure reducer
sections:
- heading: Events and state
  body: |-
    Graphical programs are different from the programs you have written so far, which run from the top to the bottom. An interface mostly **waits**. When the user clicks, types, touches or the clock ticks, the system receives an **event** and runs some code, an **event handler**, then waits again. The central loop that collects events and dispatches them is the **event loop**.

    What an event should do depends on what the program remembers, its **state**. A play button means "start" while a video is stopped and "pause" while it is playing. The tidiest way to think about this is a **state machine**: a list of states and, for each state, which events cause a move to which new state. Drawing it out as circles and arrows (a **state diagram**) makes bugs visible before coding: a state with no way out, a state that cannot be reached, or an event that is not handled in a state where it can happen, such as a double click on a Pay button. In code the machine can be a plain dictionary from (state, event) to the next state.
- heading: Undo, redo and commands
  body: |-
    Undo is the safety net that lets people experiment, and it is harder than it looks. One simple design keeps a **history** with three parts: the **past** values, the **present**, and the **future** (the values that were undone). A normal change pushes the present onto the past and **clears the future**, because after undoing and then typing something new, the old future no longer makes sense. Undo moves the present to the front of the future, and redo moves it back. The functions must create new values rather than change old ones, since sharing the same list between history entries would silently corrupt them. This works well when a state is small. A big document would take too much memory, so editors instead store **commands**.

    In the **command pattern** each edit is a small object describing *what* to do, for example "insert 'abc' at position 4". Each command can produce its own **inverse**: the inverse of an insert is a delete of the same length, and the inverse of a delete is an insert of the deleted text, which is why the command must look at the text *before* it runs. Undo applies the inverses from the last to the first. The same list of commands can also be saved, sent to other computers for collaborative editing, or replayed.
- heading: Timing, gestures and reducers
  body: |-
    Events arrive in bursts: typing produces one event per key, scrolling produces hundreds per second. Doing expensive work for every one wastes time. **Debouncing** waits until the events have stopped for a moment: a search box fires one request when you pause, not one per letter. **Throttling** lets an action happen at most once per interval, such as updating a scroll position every 100 milliseconds. Gestures also come from timing: a **tap** and a **long press** differ only in how long the finger stays down, and a **double click** is two clicks within a short **window**.

    Finally, large apps need a disciplined way to change state. In the **reducer** style, all the data lives in one object and every change is described by an **action** such as "add item" or "toggle item 3". A **reducer** is a **pure function** that takes the old state and an action and returns a *new* state without touching the old one. Because the state after any action is determined by the previous state and the action alone, you can log every action, replay them to reproduce a bug, undo by going back to an earlier state, and test the whole app without a screen. This is the idea behind popular frameworks such as Redux and Elm.
examples:
- title: A state machine and undo
  intro: A media player, its reachable states, and an undo history.
  code: |
    def step(transitions, state, event):
        """A STATE MACHINE says what happens when an event arrives in a given state. `transitions` is a dict {(state, event): new_state}. Return the new state; ValueError('no transition from STATE on EVENT') (with the real state and event) if there is none."""
        if (state, event) not in transitions:
            raise ValueError("no transition from %s on %s" % (state, event))
        return transitions[(state, event)]


    def run_events(transitions, start, events, strict=False):
        """Feed a list of events to the machine and return the list of states visited, INCLUDING the start state. An event with no transition is IGNORED (the state stays and is repeated in the list) unless strict is True, in which case the ValueError from step is raised."""
        state = start
        visited = [state]
        for event in events:
            if (state, event) in transitions:
                state = transitions[(state, event)]
            elif strict:
                step(transitions, state, event)
            visited.append(state)
        return visited


    def reachable(transitions, start):
        """The sorted list of states that can be reached from `start` by some sequence of events (including start itself)."""
        seen = {start}
        todo = [start]
        while todo:
            s = todo.pop()
            for (a, event), b in transitions.items():
                if a == s and b not in seen:
                    seen.add(b)
                    todo.append(b)
        return sorted(seen)


    def unreachable_states(transitions, start):
        """States that appear in the transitions (as a source or a target) but can never be reached from `start`, as a sorted list: these are usually bugs."""
        mentioned = set()
        for (a, event), b in transitions.items():
            mentioned.add(a)
            mentioned.add(b)
        return sorted(mentioned - set(reachable(transitions, start)))


    def new_history(value):
        """A HISTORY for undo and redo is a dict {"past": [], "present": value, "future": []}: the values before the current one (oldest first), the current value, and the values that were undone (nearest first)."""
        return {"past": [], "present": value, "future": []}


    def apply_change(history, value, max_undo=None):
        """Make a change: return a NEW history whose present is `value`, whose past gets the old present at its end, and whose future is EMPTY (a new change erases what could be redone). If value equals the present, return an unchanged copy. If max_undo is not None, keep only the newest max_undo entries of the past. Never modify the history you were given."""
        if value == history["present"]:
            return {"past": list(history["past"]), "present": history["present"], "future": list(history["future"])}
        past = history["past"] + [history["present"]]
        if max_undo is not None:
            past = past[-max_undo:] if max_undo > 0 else []
        return {"past": past, "present": value, "future": []}


    def undo(history):
        """Go back one step: the last past value becomes the present and the old present goes to the FRONT of the future. ValueError('nothing to undo') if the past is empty. Return a new history."""
        if not history["past"]:
            raise ValueError("nothing to undo")
        return {"past": history["past"][:-1], "present": history["past"][-1], "future": [history["present"]] + history["future"]}


    def redo(history):
        """Go forward one step: the first future value becomes the present and the old present goes to the END of the past. ValueError('nothing to redo') if the future is empty. Return a new history."""
        if not history["future"]:
            raise ValueError("nothing to redo")
        return {"past": history["past"] + [history["present"]], "present": history["future"][0], "future": history["future"][1:]}

    player = {("stopped", "play"): "playing", ("playing", "pause"): "paused", ("paused", "play"): "playing", ("playing", "stop"): "stopped", ("paused", "stop"): "stopped", ("playing", "ended"): "stopped"}
    print("state sequence:", run_events(player, "stopped", ["play", "pause", "pause", "play", "ended"]))
    print("states reachable from stopped:", reachable(player, "stopped"))
    h = new_history("")
    for word in ("a", "ab", "abc"):
        h = apply_change(h, word)
    h = undo(undo(h))
    print("after two undos:", h)
    print("after a redo:", redo(h)["present"], "| after a new change:", apply_change(h, "x"))
  output: |
    state sequence: ['stopped', 'playing', 'paused', 'paused', 'playing', 'stopped']
    states reachable from stopped: ['paused', 'playing', 'stopped']
    after two undos: {'past': [''], 'present': 'a', 'future': ['ab', 'abc']}
    after a redo: ab | after a new change: {'past': ['', 'a'], 'present': 'x', 'future': []}
