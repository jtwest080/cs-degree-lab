        pass


    def classify_clicks(times, window):
        """Group clicks into gestures: a click belongs to the previous gesture if it comes at most `window` ms after the previous click. Name each gesture by its size: 1 'single', 2 'double', 3 or more 'triple'. Return the list of names (times are sorted)."""
        pass
