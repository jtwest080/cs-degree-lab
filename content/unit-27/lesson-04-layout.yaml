  solution: |
    def split_rows(items, container, gap):
        """FLOW LAYOUT puts items on a line from left to right and WRAPS to a new line when the next item would not fit. `items` is a list of (width, height) pairs. Return a list of rows, each a list of item indexes, filling each row greedily: an item starts a new row when the row already has an item and x + width would exceed the container, where x counts every earlier item's width plus a gap after it. ValueError('item too wide') if any item is wider than the container."""
        rows, row, x = [], [], 0
        for i, (w, h) in enumerate(items):
            if w > container:
                raise ValueError("item too wide")
            if row and x + w > container:
                rows.append(row)
                row, x = [], 0
            row.append(i)
            x += w + gap
        if row:
            rows.append(row)
        return rows


    def flow_layout(items, container, gap):
        """Place the items. Return (positions, total_height): positions is a list of (x, y) for each item in the original order. Items in a row sit at x = the sum of the earlier widths and gaps; a row's y is the sum of the heights of the TALLEST items of the rows above, plus a gap after each row. total_height is the y after the last row plus its tallest item (0 for no items)."""
        positions = [None] * len(items)
        y = 0
        rows = split_rows(items, container, gap)
        for row in rows:
            x = 0
            for i in row:
                positions[i] = (x, y)
                x += items[i][0] + gap
            y += max(items[i][1] for i in row) + gap
        total = y - gap if rows else 0
        return (positions, total)


    def row_widths(items, container, gap):
        """The width actually used by each row (item widths plus the gaps BETWEEN items, no trailing gap), as a list in row order."""
        return [sum(items[i][0] for i in row) + gap * (len(row) - 1) for row in split_rows(items, container, gap)]


    def center_rows(items, container, gap):
        """Like flow_layout but with every row CENTRED: shift each row right by (container - row width) / 2. Return only the x positions (rounded to 2 decimals), one per item in the original order."""
        xs = [None] * len(items)
        for row in split_rows(items, container, gap):
            used = sum(items[i][0] for i in row) + gap * (len(row) - 1)
            x = (container - used) / 2
            for i in row:
                xs[i] = round(x, 2)
                x += items[i][0] + gap
        return xs
  explanation: This is the layout the browser uses for words in a paragraph and for tags, chips and photos in a gallery.
