id: u27-layout
title: Layout
minutes: 100
objective: Learn how interfaces are arranged on a screen. You will compute the CSS box model, wrap items with flow layout, share space with flexbox rules and grid tracks, adapt a card grid to the screen width, and wrap and truncate text.
outcomes:
- Describe the box model and box-sizing
- Collapse vertical margins
- Lay out items in wrapping rows
- Share space with grow and shrink
- Compute grid column widths
- Build a responsive card layout
sections:
- heading: Boxes
  body: |-
    Everything on a screen is a **box**. Browsers, game user interfaces and document editors all work this way: a rectangle with some **content**, surrounded by **padding** (space *inside* the box, between the content and its edge), a **border**, and a **margin** (empty space *outside* it). The total space an element needs is the sum of all four layers. A frequent surprise is what **width** means. By default (`content-box`) it is only the width of the content, so adding 10 pixels of padding makes the element 20 wider than you asked. With `border-box` the width includes padding and border, so the element is exactly as wide as you said and the content shrinks to fit. Most modern style sheets use border-box everywhere for that reason.

    Vertical margins also have a special rule: when two blocks are stacked and both have a margin, the margins **collapse** and the gap is the larger of the two rather than their sum, since the extra space would look like a mistake. A positive and a negative margin simply add.
- heading: Flow, flexbox and grid
  body: |-
    Layout is the process of deciding the **position** and **size** of every box. The oldest method is **flow layout**: put items in a row from left to right and, when the next one would not fit, **wrap** to the next row, like words in a paragraph. Each row is as tall as its tallest item. Layout code does exactly what you did in the lesson: split the items into rows greedily, then assign coordinates.

    **Flexbox** lays items out along one direction and shares leftover space. Every item has a preferred size, its **basis**, and numbers saying how much it may **grow** into extra space and how much it may **shrink** when the row is too small. If there is free space it is divided in proportion to the grow numbers, and if there is a shortage it is taken away in proportion to the shrink number times the basis. A **justify** rule decides where the items sit in the leftover space: at the start, centred, at the end, or spread between. A **grid** divides space in two directions into rows and columns. A column is a fixed number of pixels or a **fraction** (fr) of the space left after fixed columns and gaps, and an item can **span** several columns.
- heading: Responsive design and text
  body: |-
    People open the same page on a phone, a tablet and a wide monitor, so the layout must adapt. **Responsive design** changes the layout at **breakpoints**, certain widths such as 600 and 1000 pixels. A common pattern is a grid of cards where the number of **columns** is computed from the width: as many as fit if each card needs a minimum width, and each card then stretches to share the space. On a narrow screen the same code simply produces one column.

    Text needs layout too. **Word wrapping** breaks a paragraph into lines no longer than a given width, filling each line greedily with whole words. Text that must fit a fixed space is **truncated** and ends with an **ellipsis** (...) so the reader knows something is missing, ideally with the full text available another way, such as a tooltip. Good layout code is mostly careful arithmetic with edge cases: a word longer than the line, an item wider than the container, or a row with no free space left.
examples:
- title: Boxes, rows and flexbox
  intro: Box sizes, wrapping rows of tags, and flexible widths.
  code: |
    def content_width(width, padding, border, box_sizing="content-box"):
        """The BOX MODEL: every element is a box with CONTENT in the middle, then PADDING (space inside), a BORDER, and outside it a MARGIN (space around). The `width` you set means different things under the two box-sizing rules: with "content-box" it is the width of the content alone; with "border-box" it includes the padding and border on both sides, so the content is width - 2 * (padding + border). Return the content width; ValueError('box too small') if it would be negative; ValueError('bad box-sizing') for any other rule."""
        if box_sizing == "content-box":
            return width
        if box_sizing == "border-box":
            inner = width - 2 * (padding + border)
            if inner < 0:
                raise ValueError("box too small")
            return inner
        raise ValueError("bad box-sizing")


    def total_width(width, padding, border, margin, box_sizing="content-box"):
        """The space the element takes up in a row, margins included. content-box: width + 2 * (padding + border + margin). border-box: width + 2 * margin. Same ValueError('bad box-sizing') as content_width."""
        if box_sizing == "content-box":
            return width + 2 * (padding + border + margin)
        if box_sizing == "border-box":
            return width + 2 * margin
        raise ValueError("bad box-sizing")


    def collapse(a, b):
        """MARGIN COLLAPSING: when two vertical margins touch, they overlap instead of adding. Two positive margins collapse to the larger; two negative ones to the one that is more negative (the smaller); a positive and a negative one simply add up."""
        if a >= 0 and b >= 0:
            return max(a, b)
        if a <= 0 and b <= 0:
            return min(a, b)
        return a + b


    def stack_height(blocks):
        """The height of blocks stacked in a column. Each block is a dict {"height", "margin_top", "margin_bottom"}. The total is the first block's margin_top, plus every height, plus between each pair of neighbours the collapse of the upper block's margin_bottom and the lower block's margin_top, plus the last block's margin_bottom. 0 for no blocks."""
        if not blocks:
            return 0
        total = blocks[0]["margin_top"] + blocks[-1]["margin_bottom"]
        for i, b in enumerate(blocks):
            total += b["height"]
            if i + 1 < len(blocks):
                total += collapse(b["margin_bottom"], blocks[i + 1]["margin_top"])
        return total


    def split_rows(items, container, gap):
        """FLOW LAYOUT puts items on a line from left to right and WRAPS to a new line when the next item would not fit. `items` is a list of (width, height) pairs. Return a list of rows, each a list of item indexes, filling each row greedily: an item starts a new row when the row already has an item and x + width would exceed the container, where x counts every earlier item's width plus a gap after it. ValueError('item too wide') if any item is wider than the container."""
        rows, row, x = [], [], 0
        for i, (w, h) in enumerate(items):
            if w > container:
                raise ValueError("item too wide")
            if row and x + w > container:
                rows.append(row)
                row, x = [], 0
            row.append(i)
            x += w + gap
        if row:
            rows.append(row)
        return rows


    def flow_layout(items, container, gap):
        """Place the items. Return (positions, total_height): positions is a list of (x, y) for each item in the original order. Items in a row sit at x = the sum of the earlier widths and gaps; a row's y is the sum of the heights of the TALLEST items of the rows above, plus a gap after each row. total_height is the y after the last row plus its tallest item (0 for no items)."""
        positions = [None] * len(items)
        y = 0
        rows = split_rows(items, container, gap)
        for row in rows:
            x = 0
            for i in row:
                positions[i] = (x, y)
                x += items[i][0] + gap
            y += max(items[i][1] for i in row) + gap
        total = y - gap if rows else 0
        return (positions, total)


    def row_widths(items, container, gap):
        """The width actually used by each row (item widths plus the gaps BETWEEN items, no trailing gap), as a list in row order."""
        return [sum(items[i][0] for i in row) + gap * (len(row) - 1) for row in split_rows(items, container, gap)]


    def center_rows(items, container, gap):
        """Like flow_layout but with every row CENTRED: shift each row right by (container - row width) / 2. Return only the x positions (rounded to 2 decimals), one per item in the original order."""
        xs = [None] * len(items)
        for row in split_rows(items, container, gap):
            used = sum(items[i][0] for i in row) + gap * (len(row) - 1)
            x = (container - used) / 2
            for i in row:
                xs[i] = round(x, 2)
                x += items[i][0] + gap
        return xs


    def flex_widths(container, items, gap):
        """FLEXBOX shares a row among items that can grow or shrink. Each item is a dict {"basis": preferred width, "grow": g, "shrink": s}. The free space is container - gap * (n - 1) - the sum of the bases. If it is positive, give each item a share proportional to its grow (the items keep their basis if the total grow is 0). If it is negative, remove from each item in proportion to shrink * basis (nothing changes if that total is 0). No width may go below 0. Round every width to 2 decimals. An empty list gives []."""
        n = len(items)
        if n == 0:
            return []
        free = container - gap * (n - 1) - sum(i["basis"] for i in items)
        widths = []
        if free >= 0:
            total = sum(i["grow"] for i in items)
            for i in items:
                widths.append(i["basis"] + (free * i["grow"] / total if total else 0))
        else:
            total = sum(i["shrink"] * i["basis"] for i in items)
            for i in items:
                widths.append(i["basis"] + (free * i["shrink"] * i["basis"] / total if total else 0))
        return [round(max(0, w), 2) for w in widths]


    def flex_positions(widths, container, gap, justify):
        """Where each item starts (x, rounded to 2 decimals). Let used = the sum of the widths + gap * (n - 1). justify "start": the first item at 0; "center": at (container - used) / 2; "end": at container - used; "space-between": the first at 0 and the extra space container - sum(widths) spread equally between the items (the gap between neighbours becomes (container - sum(widths)) / (n - 1)). Items follow each other separated by the gap. ValueError('bad justify') for anything else; [] for no items."""
        n = len(widths)
        if n == 0:
            return []
        used = sum(widths) + gap * (n - 1)
        if justify == "start":
            x, g = 0, gap
        elif justify == "center":
            x, g = (container - used) / 2, gap
        elif justify == "end":
            x, g = container - used, gap
        elif justify == "space-between":
            x, g = 0, ((container - sum(widths)) / (n - 1) if n > 1 else gap)
        else:
            raise ValueError("bad justify")
        out = []
        for w in widths:
            out.append(round(x, 2))
            x += w + g
        return out

    print("a 200-wide box with padding 10 and border 2: content", content_width(200, 10, 2), "(content-box) or", content_width(200, 10, 2, "border-box"), "(border-box)")
    print("total widths:", total_width(200, 10, 2, 5), "and", total_width(200, 10, 2, 5, "border-box"))
    print("margins 20 and 30 collapse to", collapse(20, 30), "| 20 and -5 give", collapse(20, -5))
    tags = [(60, 20), (90, 20), (40, 20), (110, 20), (70, 20), (50, 20)]
    print("rows of tags:", split_rows(tags, 200, 8))
    positions, height = flow_layout(tags, 200, 8)
    print("positions:", positions, "| height:", height)
    print("flex 500 wide, growing 1:2:", flex_widths(500, [{"basis": 100, "grow": 1, "shrink": 1}, {"basis": 100, "grow": 2, "shrink": 1}], 20))
    print("flex 150 wide, shrinking:", flex_widths(150, [{"basis": 100, "grow": 0, "shrink": 1}, {"basis": 200, "grow": 0, "shrink": 1}], 0))
    print("centred:", flex_positions([50, 50, 50], 300, 10, "center"), "| space-between:", flex_positions([50, 50, 50], 300, 10, "space-between"))
  output: |
