  - Compute the free space first; its sign decides whether grow or shrink applies.
  solution: |
    def flex_widths(container, items, gap):
        """FLEXBOX shares a row among items that can grow or shrink. Each item is a dict {"basis": preferred width, "grow": g, "shrink": s}. The free space is container - gap * (n - 1) - the sum of the bases. If it is positive, give each item a share proportional to its grow (the items keep their basis if the total grow is 0). If it is negative, remove from each item in proportion to shrink * basis (nothing changes if that total is 0). No width may go below 0. Round every width to 2 decimals. An empty list gives []."""
        n = len(items)
        if n == 0:
            return []
        free = container - gap * (n - 1) - sum(i["basis"] for i in items)
        widths = []
        if free >= 0:
            total = sum(i["grow"] for i in items)
            for i in items:
                widths.append(i["basis"] + (free * i["grow"] / total if total else 0))
        else:
            total = sum(i["shrink"] * i["basis"] for i in items)
            for i in items:
                widths.append(i["basis"] + (free * i["shrink"] * i["basis"] / total if total else 0))
        return [round(max(0, w), 2) for w in widths]


    def flex_positions(widths, container, gap, justify):
        """Where each item starts (x, rounded to 2 decimals). Let used = the sum of the widths + gap * (n - 1). justify "start": the first item at 0; "center": at (container - used) / 2; "end": at container - used; "space-between": the first at 0 and the extra space container - sum(widths) spread equally between the items (the gap between neighbours becomes (container - sum(widths)) / (n - 1)). Items follow each other separated by the gap. ValueError('bad justify') for anything else; [] for no items."""
        n = len(widths)
        if n == 0:
            return []
        used = sum(widths) + gap * (n - 1)
        if justify == "start":
            x, g = 0, gap
        elif justify == "center":
            x, g = (container - used) / 2, gap
        elif justify == "end":
            x, g = container - used, gap
        elif justify == "space-between":
            x, g = 0, ((container - sum(widths)) / (n - 1) if n > 1 else gap)
        else:
            raise ValueError("bad justify")
        out = []
        for w in widths:
            out.append(round(x, 2))
            x += w + g
        return out
  explanation: Flexbox replaced decades of layout hacks, and the maths is just proportional sharing.
