- title: Grids and responsive layouts
  intro: Grid columns, breakpoints, a card grid at three screen sizes, and text wrapping.
  code: |
    import math


    def parse_track(track):
        """A GRID TRACK is a column size written like '120px' (a fixed number of pixels) or '2fr' (a FRACTION of the free space). Return ('px', number) or ('fr', number); ValueError('bad track X') (with the text in place of X) for anything else, including negative or non-numeric sizes. Numbers may have decimals."""
        for unit in ("px", "fr"):
            if isinstance(track, str) and track.endswith(unit):
                try:
                    value = float(track[:-len(unit)])
                except ValueError:
                    break
                if value < 0:
                    break
                return (unit, value)
        raise ValueError("bad track " + str(track))


    def grid_tracks(container, tracks, gap):
        """The width of each column. Fixed ('px') tracks keep their size. What is left after the fixed tracks and the gaps between columns (container - gap * (n - 1) - fixed total, at least 0) is shared among the 'fr' tracks in proportion to their numbers. Return the widths rounded to 2 decimals."""
        parsed = [parse_track(t) for t in tracks]
        fixed = sum(v for u, v in parsed if u == "px")
        fr_total = sum(v for u, v in parsed if u == "fr")
        free = max(0, container - gap * (len(parsed) - 1) - fixed)
        return [round(v if u == "px" else (free * v / fr_total if fr_total else 0), 2) for u, v in parsed]


    def column_offsets(widths, gap):
        """The x position where each column starts: 0, then each column adds its width and a gap (rounded to 2 decimals)."""
        out, x = [], 0
        for w in widths:
            out.append(round(x, 2))
            x += w + gap
        return out


    def cell_for(index, columns):
        """Items fill a grid row by row. Return (row, column) of the item with this 0-based index in a grid with `columns` columns. ValueError('need a column') if columns < 1."""
        if columns < 1:
            raise ValueError("need a column")
        return (index // columns, index % columns)


    def span_width(widths, gap, start, span):
        """The width of an item that SPANS `span` columns beginning at column `start`: the sum of those columns' widths plus the gaps between them, rounded to 2 decimals. ValueError('bad span') if span < 1 or the columns run past the end."""
        if span < 1 or start < 0 or start + span > len(widths):
            raise ValueError("bad span")
        return round(sum(widths[start:start + span]) + gap * (span - 1), 2)


    def pick_breakpoint(width, breakpoints):
        """RESPONSIVE design changes the layout with the screen width. `breakpoints` is a dict {name: minimum width}. Return the name whose minimum is the LARGEST one that is not above `width`. ValueError('below every breakpoint') if there is none."""
        best = None
        for name, low in breakpoints.items():
            if low <= width and (best is None or low > breakpoints[best]):
                best = name
        if best is None:
            raise ValueError("below every breakpoint")
        return best


    def card_layout(n_cards, width, card_min, gap, card_height):
        """A responsive grid of cards: as many columns as fit when each card is at least card_min wide, with a gap between neighbours: columns = max(1, floor((width + gap) / (card_min + gap))) (but never more columns than cards, and at least 1). The cards then share the width: card_width = round((width - gap * (columns - 1)) / columns, 2). rows = ceil(n_cards / columns) and height = rows * card_height + gap * (rows - 1) (0 rows and height 0 for no cards). Return a dict {"columns", "card_width", "rows", "height"}."""
        if n_cards == 0:
            return {"columns": 0, "card_width": 0, "rows": 0, "height": 0}
        columns = max(1, math.floor((width + gap) / (card_min + gap)))
        columns = min(columns, n_cards)
        card_width = round((width - gap * (columns - 1)) / columns, 2)
        rows = math.ceil(n_cards / columns)
        return {"columns": columns, "card_width": card_width, "rows": rows, "height": rows * card_height + gap * (rows - 1)}


    def wrap_text(text, width):
        """Break text into lines no longer than `width` characters. Split it into words (on any white space) and fill each line greedily with single spaces between words; a word longer than the width gets a line to itself. Return the list of lines ([] for no words). ValueError('width must be positive') if width < 1."""
        if width < 1:
            raise ValueError("width must be positive")
        lines, line = [], ""
        for word in text.split():
            if not line:
                line = word
            elif len(line) + 1 + len(word) <= width:
                line += " " + word
            else:
                lines.append(line)
                line = word
        if line:
            lines.append(line)
        return lines


    def truncate(text, max_chars, ellipsis="\u2026"):
        """Shorten text that does not fit, ending it with an ellipsis (one character, '\u2026', by default). Text of at most max_chars characters is returned unchanged. Otherwise keep the first max_chars - len(ellipsis) characters, remove spaces at the end of that piece, and add the ellipsis. ValueError('too short') if max_chars is less than the length of the ellipsis."""
        if max_chars < len(ellipsis):
            raise ValueError("too short")
        if len(text) <= max_chars:
            return text
        return text[:max_chars - len(ellipsis)].rstrip() + ellipsis

    widths = grid_tracks(960, ["200px", "1fr", "2fr"], 20)
    print("grid columns:", widths, "| offsets:", column_offsets(widths, 20), "| a banner across all three:", span_width(widths, 20, 0, 3))
    print("cells of items 0 to 7 in 3 columns:", [cell_for(i, 3) for i in range(8)])
    for w in (320, 700, 1100):
        print(w, "px:", pick_breakpoint(w, {"phone": 0, "tablet": 600, "desktop": 1000}), card_layout(9, w, 240, 16, 180))
    for line in wrap_text("Responsive layouts adapt to the width of the screen so that text stays easy to read.", 28):
        print("|" + line)
    print(truncate("A very long title that will not fit", 20))
