  solution: |
    def content_width(width, padding, border, box_sizing="content-box"):
        """The BOX MODEL: every element is a box with CONTENT in the middle, then PADDING (space inside), a BORDER, and outside it a MARGIN (space around). The `width` you set means different things under the two box-sizing rules: with "content-box" it is the width of the content alone; with "border-box" it includes the padding and border on both sides, so the content is width - 2 * (padding + border). Return the content width; ValueError('box too small') if it would be negative; ValueError('bad box-sizing') for any other rule."""
        if box_sizing == "content-box":
            return width
        if box_sizing == "border-box":
            inner = width - 2 * (padding + border)
            if inner < 0:
                raise ValueError("box too small")
            return inner
        raise ValueError("bad box-sizing")


    def total_width(width, padding, border, margin, box_sizing="content-box"):
        """The space the element takes up in a row, margins included. content-box: width + 2 * (padding + border + margin). border-box: width + 2 * margin. Same ValueError('bad box-sizing') as content_width."""
        if box_sizing == "content-box":
            return width + 2 * (padding + border + margin)
        if box_sizing == "border-box":
            return width + 2 * margin
        raise ValueError("bad box-sizing")


    def collapse(a, b):
        """MARGIN COLLAPSING: when two vertical margins touch, they overlap instead of adding. Two positive margins collapse to the larger; two negative ones to the one that is more negative (the smaller); a positive and a negative one simply add up."""
        if a >= 0 and b >= 0:
            return max(a, b)
        if a <= 0 and b <= 0:
            return min(a, b)
        return a + b


    def stack_height(blocks):
        """The height of blocks stacked in a column. Each block is a dict {"height", "margin_top", "margin_bottom"}. The total is the first block's margin_top, plus every height, plus between each pair of neighbours the collapse of the upper block's margin_bottom and the lower block's margin_top, plus the last block's margin_bottom. 0 for no blocks."""
        if not blocks:
            return 0
        total = blocks[0]["margin_top"] + blocks[-1]["margin_bottom"]
        for i, b in enumerate(blocks):
            total += b["height"]
            if i + 1 < len(blocks):
                total += collapse(b["margin_bottom"], blocks[i + 1]["margin_top"])
        return total
