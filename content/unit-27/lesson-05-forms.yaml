  prompt: 'People make typos, so good search forgives them. The **Levenshtein edit distance** between two words is the smallest number of single-character **insertions, deletions and substitutions** that turn one into the other. Write `edit_distance(a, b)` with **dynamic programming**: a table `d` where `d[i][j]` is the distance between the first `i` characters of `a` and the first `j` of `b`; `d[i][0] = i`, `d[0][j] = j`, and every other cell is the smallest of `d[i-1][j] + 1`, `d[i][j-1] + 1` and `d[i-1][j-1] + 0` (if the characters are equal) or `+ 1`. Write `closest(word, dictionary, max_distance)`: the dictionary words within `max_distance` edits of `word` (compared in lower case) as a list sorted by `(distance, word)`; return the words as they appear in the dictionary. Write `did_you_mean(query, dictionary, max_distance=2)`: if the query (lower case) is already a word of the dictionary (lower case) return `None`; otherwise return the first word of `closest`, or `None` if there is none.'
