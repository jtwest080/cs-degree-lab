id: u27-forms
title: Forms, Input and Search
minutes: 100
objective: Learn how interfaces take input and help people find things. You will validate emails, phone numbers, dates and passwords, build a form checker with clear messages, write autocomplete with a trie, forgive typos with edit distance, and build a ranked search with snippets and pages.
outcomes:
- Validate common kinds of input
- Write helpful error messages
- Build and use a trie for autocomplete
- Compute edit distance with dynamic programming
- Rank search results by weighted matches
- Paginate results
sections:
- heading: Taking input
  body: |-
    Forms are where most people give a program its data: sign-up pages, shopping carts, settings. **Validation** checks the input before using it. There are two reasons: to *help* the user (catch a mistyped email before the message is lost) and to *protect* the program (never trust input; it may be wrong or even hostile). Validate in the browser for speed and again on the server for safety, since a browser check can be bypassed.

    Good validation follows human-centred rules. Accept reasonable variations (phone numbers with spaces or dashes) and **normalise** them rather than rejecting them. Check meaning where you can: a date such as 31 April does not exist, and years divisible by 4 are leap years except those divisible by 100 unless also divisible by 400. Beware of rules that are too strict: many real email addresses contain a plus sign or a hyphen, and names may contain apostrophes or be a single word. A **password strength** meter should reward length and variety and reject the lists of very common passwords, but it is only a hint.
- heading: Error messages
  body: |-
    An **error message** is the interface talking to a person who is probably annoyed. A good one says **what is wrong**, **where**, and **how to fix it**, in plain words: "Enter a valid email address", not "Error 4007" or "Invalid input". Show it next to the field it belongs to, keep what the user typed, never blame them, and show the first problem of each field rather than a wall of text. Mark required fields clearly rather than only complaining afterwards.

    A tidy way to organise this is a table of **rules** for each field, such as required, minimum length, email, number between two values, or must match another field (a repeated password). Code applies the rules in order and reports the first failure, and a rule that does not make sense is a **programming error** that should be reported loudly. Because the rules are data rather than a long chain of ifs, they are easy to read, test and reuse.
- heading: Autocomplete and search
  body: |-
    **Autocomplete** suggests how to finish what you are typing. A **trie** (pronounced "try", from re-trie-val), or prefix tree, stores words letter by letter so that words with the same beginning share a path: to find every word starting with "py", walk down p, then y, then collect everything below. Suggestions are usually ranked by **popularity** rather than alphabetically, and the part you already typed is highlighted.

    People also make typos, so good search is **forgiving**. The **edit distance** (Levenshtein distance) counts the fewest single-letter insertions, deletions and substitutions needed to turn one word into another: "kitten" to "sitting" is 3. It is computed with **dynamic programming**, filling a table of the answers for every pair of prefixes. A "Did you mean...?" hint suggests the closest dictionary word. Finally, a **search engine** finds documents containing all the query words and **ranks** them: a match in the title counts for more than one in the body. Results are shown with a **snippet** around the match and split into **pages** so the screen is not flooded. Real engines such as Google use hundreds of signals, but this is the core.
examples:
- title: Validation and form rules
  intro: Checking an email, dates, passwords and a whole form.
  code: |
    def valid_email(text):
        """A simple EMAIL check (real email rules are far more complicated). It needs exactly one '@'. The part before it (at most 64 characters) is non-empty, uses only letters, digits and the characters . _ % + -, and neither starts nor ends with a '.' nor contains '..'. The part after it splits on '.' into at least two labels; each label is non-empty, uses only letters, digits and '-', and does not start or end with '-'; the last label has only letters and at least 2 of them. Return True or False (False for anything that is not a string)."""
        if not isinstance(text, str) or text.count("@") != 1:
            return False
        local, domain = text.split("@")
        allowed = set("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._%+-")
        if not local or len(local) > 64 or not set(local) <= allowed or local[0] == "." or local[-1] == "." or ".." in local:
            return False
        labels = domain.split(".")
        if len(labels) < 2:
            return False
        for label in labels:
            if not label or not label.replace("-", "").isalnum() or label[0] == "-" or label[-1] == "-":
                return False
        last = labels[-1]
        return last.isalpha() and len(last) >= 2 and last.isascii()


    def valid_phone(text):
        """A PHONE NUMBER may contain spaces, hyphens, dots and brackets, and a leading '+'. Remove those (the '+' only counts at the very start); what is left must be 7 to 15 digits (0-9 only). Return True or False."""
        if not isinstance(text, str):
            return False
        body = text[1:] if text.startswith("+") else text
        for ch in " -.()":
            body = body.replace(ch, "")
        return body.isascii() and body.isdigit() and 7 <= len(body) <= 15


    def is_leap(year):
        """A LEAP YEAR is divisible by 4, except years divisible by 100 that are not divisible by 400."""
        return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


    def valid_date(year, month, day):
        """Is this a real calendar date? The year must be at least 1, the month 1 to 12, and the day from 1 to the length of that month (28 or 29 for February depending on is_leap)."""
        if year < 1 or not 1 <= month <= 12:
            return False
        days = [31, 29 if is_leap(year) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1]
        return 1 <= day <= days


    def password_score(password, common):
        """Rate a password from 0 to 5: one point each for length of at least 8, length of at least 12, having both a lower-case and an upper-case letter, having a digit, and having a character that is not a letter or digit. A password whose lower-case form is in the set `common` always scores 0."""
        if password.lower() in common:
            return 0
        score = 0
        score += len(password) >= 8
        score += len(password) >= 12
        score += any(c.islower() for c in password) and any(c.isupper() for c in password)
        score += any(c.isdigit() for c in password)
        score += any(not c.isalnum() for c in password)
        return int(score)


    def strength_label(score):
        """Name a score: 0 'Very weak', 1 or 2 'Weak', 3 'Fair', 4 'Good', 5 'Strong'."""
        if score <= 0:
            return "Very weak"
        if score <= 2:
            return "Weak"
        return {3: "Fair", 4: "Good"}.get(score, "Strong")


    def check_rule(value, rule, values):
        """Test one RULE against a value (a string already stripped of spaces at both ends) and return None if it passes or the error MESSAGE: 'required' fails on an empty value ('This field is required'); 'min:N' needs at least N characters ('Must be at least N characters'); 'max:N' at most N ('Must be at most N characters'); 'email' uses valid_email ('Enter a valid email address'); 'number' must be readable by float ('Enter a number'); 'between:A:B' must be a number from A to B inclusive ('Must be between A and B'); 'match:FIELD' must equal values[FIELD] (stripped; 'Must match FIELD'). ValueError('unknown rule R') (with the rule text) for anything else. A value that is empty passes every rule except 'required'."""
        name, *args = rule.split(":")
        if name == "required":
            return "This field is required" if value == "" else None
        if name not in ("min", "max", "email", "number", "between", "match"):
            raise ValueError("unknown rule " + rule)
        if value == "":
            return None
        if name == "min":
            return None if len(value) >= int(args[0]) else "Must be at least %s characters" % args[0]
        if name == "max":
            return None if len(value) <= int(args[0]) else "Must be at most %s characters" % args[0]
        if name == "email":
            return None if valid_email(value) else "Enter a valid email address"
        if name == "number":
            try:
                float(value)
                return None
            except ValueError:
                return "Enter a number"
        if name == "between":
            try:
                x = float(value)
            except ValueError:
                return "Must be between %s and %s" % (args[0], args[1])
            return None if float(args[0]) <= x <= float(args[1]) else "Must be between %s and %s" % (args[0], args[1])
        return None if value == str(values.get(args[0], "")).strip() else "Must match " + args[0]


    def validate_form(values, rules):
        """Check a whole FORM. `values` is a dict {field: text} and `rules` a dict {field: [rule, ...]}. For every field in rules, in order, strip the value (a missing field is the empty string) and apply its rules in order with check_rule; the FIRST failing rule gives that field's message. Return a dict {field: message} that contains only the fields with errors (empty if the form is valid). Unknown rules raise ValueError even when an earlier rule failed: check all the rules first."""
        for rule_list in rules.values():
            for rule in rule_list:
                check_rule("x", rule, values)
        errors = {}
        for field, rule_list in rules.items():
            value = str(values.get(field, "")).strip()
            for rule in rule_list:
                message = check_rule(value, rule, values)
                if message:
                    errors[field] = message
                    break
        return errors

    for address in ("ann@example.com", "ann@example", "a b@example.com"):
        print(address, "->", valid_email(address))
    print("dates:", valid_date(2024, 2, 29), valid_date(2023, 2, 29), valid_date(1900, 2, 29), valid_date(2000, 2, 29))
    common = {"password", "123456"}
    for pw in ("password", "abcdefgh", "Abcdefg1!", "Correct-Horse-Battery-9"):
        print(pw, "->", password_score(pw, common), strength_label(password_score(pw, common)))
    rules = {"name": ["required", "min:2"], "email": ["required", "email"], "age": ["number", "between:13:120"], "pw2": ["match:pw"]}
    print(validate_form({"name": "A", "email": "ann@", "age": "9", "pw": "x", "pw2": "y"}, rules))
    print(validate_form({"name": "Ann", "email": "ann@example.com", "age": "30", "pw": "x", "pw2": "x"}, rules))
