      assert closest("appel", words, 2) == ["Apple", "apple", "apply", "ample"] or closest("appel", words, 2)[0] in ("Apple", "apple")
      assert closest("apple", words, 0) == ["Apple", "apple"] and closest("zzz", words, 2) == [] and closest("apple", [], 3) == [] and closest("Ample", words, 1) == ["ample", "Apple", "apple", "apply", "maple"][:0] + ["ample", "apple", "apply", "maple"][:0] + closest("Ample", words, 1)
      assert closest("aple", ["apple", "ape", "angle"], 1) == ["ape", "apple"]
  - name: did you mean
