- title: Autocomplete, typos and search
  intro: A trie, ranked suggestions, edit distance and a small search engine.
  code: |
    def build_trie(words):
        """A TRIE (prefix tree) stores words letter by letter so that all words with a given beginning share a path. Build it as nested dicts: each node is a dict from a character to the child node, and the special key '$' (with the value True) marks the end of a word. Words are lower-cased. The empty trie is {}."""
        root = {}
        for word in words:
            node = root
            for ch in word.lower():
                node = node.setdefault(ch, {})
            node["$"] = True
        return root


    def complete(trie, prefix, limit=None):
        """All words in the trie that start with the prefix (lower-cased), in alphabetical order, at most `limit` of them (all when limit is None). An empty prefix gives every word."""
        node = trie
        for ch in prefix.lower():
            if ch not in node:
                return []
            node = node[ch]
        found = []

        def walk(n, path):
            if "$" in n:
                found.append(path)
            for ch in sorted(k for k in n if k != "$"):
                walk(n[ch], path + ch)

        walk(node, prefix.lower())
        return found if limit is None else found[:limit]


    def ranked_suggestions(counts, prefix, limit):
        """AUTOCOMPLETE usually shows the most popular matches. `counts` is a dict {word: how often it was used}. Return up to `limit` words that start with the prefix (ignoring case), sorted by count from highest to lowest, with ties in alphabetical order."""
        p = prefix.lower()
        matches = sorted((w for w in counts if w.lower().startswith(p)), key=lambda w: (-counts[w], w))
        return matches[:limit]


    def highlight(word, prefix):
        """Show which part of a suggestion the user has already typed by wrapping it in <b> tags: highlight('Python', 'py') gives '<b>Py</b>thon' (the case of the word is kept). If the word does not start with the prefix (ignoring case), or the prefix is empty, return the word unchanged."""
        if not prefix or not word.lower().startswith(prefix.lower()):
            return word
        return "<b>" + word[:len(prefix)] + "</b>" + word[len(prefix):]


    def edit_distance(a, b):
        """The LEVENSHTEIN EDIT DISTANCE: the smallest number of single-character insertions, deletions and substitutions that turn a into b. Use dynamic programming with a table: d[i][j] is the distance between the first i characters of a and the first j of b; d[i][0] = i, d[0][j] = j, and each other cell is the smallest of d[i-1][j] + 1, d[i][j-1] + 1 and d[i-1][j-1] + (0 if the characters are equal, else 1)."""
        d = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
        for i in range(len(a) + 1):
            d[i][0] = i
        for j in range(len(b) + 1):
            d[0][j] = j
        for i in range(1, len(a) + 1):
            for j in range(1, len(b) + 1):
                cost = 0 if a[i - 1] == b[j - 1] else 1
                d[i][j] = min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost)
        return d[len(a)][len(b)]


    def closest(word, dictionary, max_distance):
        """The dictionary words within max_distance edits of `word` (compare in lower case), as a list sorted by (distance, word). Return the words as they appear in the dictionary."""
        scored = []
        for w in dictionary:
            d = edit_distance(word.lower(), w.lower())
            if d <= max_distance:
                scored.append((d, w))
        scored.sort()
        return [w for d, w in scored]


    def did_you_mean(query, dictionary, max_distance=2):
        """The 'Did you mean...?' hint. If the query (compared in lower case) is already a word of the dictionary (compared in lower case) return None. Otherwise return the closest word within max_distance (the first by the sort order of closest) or None if there is no such word."""
        if query.lower() in {w.lower() for w in dictionary}:
            return None
        options = closest(query, dictionary, max_distance)
        return options[0] if options else None


    def tokens(text):
        """The lower-case words of a text: runs of letters and digits (use str.isalnum to decide), in order."""
        words, current = [], ""
        for ch in text.lower():
            if ch.isalnum():
                current += ch
            elif current:
                words.append(current)
                current = ""
        if current:
            words.append(current)
        return words


    def search_ranked(docs, query):
        """Full-text SEARCH. `docs` is a dict {id: {"title": text, "body": text}}. Every word of the query must appear (as a whole word, ignoring case) in the title or the body of a document, otherwise the document is not a result. The score of a result is, for each query word, 5 points per occurrence in the title plus 1 point per occurrence in the body. Return a list of (id, score) sorted by score from highest to lowest, ties by id. An empty query (no words) returns []."""
        q = tokens(query)
        if not q:
            return []
        results = []
        for doc_id, doc in docs.items():
            title, body = tokens(doc["title"]), tokens(doc["body"])
            if all(w in title or w in body for w in q):
                score = sum(5 * title.count(w) + body.count(w) for w in q)
                results.append((doc_id, score))
        results.sort(key=lambda r: (-r[1], r[0]))
        return results


    def snippet(text, word, width):
        """The part of the text to show under a search result. Find the first occurrence of `word` (ignoring case). Return the piece of text that starts max(0, position - (width - len(word)) // 2) characters in and is at most `width` characters long, with '...' at the start if text was cut off before it and '...' at the end if text was cut off after it. If the word is not found, return the first `width` characters (with '...' at the end if cut)."""
        i = text.lower().find(word.lower())
        if i < 0:
            return text[:width] + ("..." if len(text) > width else "")
        start = max(0, i - (width - len(word)) // 2)
        piece = text[start:start + width]
        return ("..." if start > 0 else "") + piece + ("..." if start + width < len(text) else "")


    def search_page(docs, query, page, per_page):
        """PAGINATION: show results a page at a time. Return {"total": number of results, "pages": number of pages (0 for no results), "ids": the ids on the requested page (pages count from 1)} using search_ranked. ValueError('bad page') if page < 1 or per_page < 1; a page beyond the last gives an empty list of ids."""
        if page < 1 or per_page < 1:
            raise ValueError("bad page")
        results = search_ranked(docs, query)
        start = (page - 1) * per_page
        return {"total": len(results), "pages": -(-len(results) // per_page), "ids": [r[0] for r in results[start:start + per_page]]}

    words = ["python", "pytorch", "pytest", "pyramid", "java", "javascript", "kotlin"]
    trie = build_trie(words)
    print("complete 'py':", complete(trie, "py"), "| complete 'java':", complete(trie, "java"))
    counts = {"python": 90, "pytorch": 30, "pytest": 45, "pyramid": 8}
    print("popular first:", [highlight(w, "py") for w in ranked_suggestions(counts, "py", 3)])
    print("distances:", edit_distance("kitten", "sitting"), edit_distance("python", "pyhton"))
    print("did you mean:", did_you_mean("pyhton", words), "|", did_you_mean("pytest", words), "|", did_you_mean("zzzzzz", words))
    docs = {"a": {"title": "Python basics", "body": "Variables, loops and functions in Python."},
            "b": {"title": "Snake care", "body": "A pet python needs a warm tank."},
            "c": {"title": "Java basics", "body": "Compared with Python, Java needs more typing."}}
    print("search 'python basics':", search_ranked(docs, "python basics"))
    print("search 'python':", search_ranked(docs, "python"))
    print(snippet(docs["b"]["body"], "python", 24))
    print(search_page(docs, "python", 1, 2), search_page(docs, "python", 2, 2))
  output: |
    complete 'py': ['pyramid', 'pytest', 'python', 'pytorch'] | complete 'java': ['java', 'javascript']
    popular first: ['<b>py</b>thon', '<b>py</b>test', '<b>py</b>torch']
    distances: 3 2
    did you mean: python | None | None
    search 'python basics': [('a', 11), ('c', 6)]
    search 'python': [('a', 6), ('b', 1), ('c', 1)]
    A pet python needs a war...
    {'total': 3, 'pages': 2, 'ids': ['a', 'b']} {'total': 3, 'pages': 2, 'ids': ['c']}
