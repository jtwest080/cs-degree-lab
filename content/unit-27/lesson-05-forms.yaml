      assert did_you_mean("pyhton", dic) == "python" and did_you_mean("pythn", dic) == "python" and did_you_mean("python", dic) is None and did_you_mean("PYTHON", dic) is None and did_you_mean("xyzzy", dic) is None and did_you_mean("jva", dic) == "java"
      assert did_you_mean("rst", dic) == "rust" and did_you_mean("ruby", dic, 1) is None and did_you_mean("rubst", dic, 3) == "rust" and did_you_mean("a", []) is None
