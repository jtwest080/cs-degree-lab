      good = ["a@b.co", "first.last+tag@example.com", "x_y%z@sub.domain.org", "A1@b-c.io"]
      bad = ["", "plain", "a@b", "@b.com", "a@@b.com", "a@b..com", "a@-b.com", "a@b-.com", ".a@b.com", "a.@b.com", "a..b@c.com", "a b@c.com", "a@b.c", "a@b.c0m", "a@.com", "a@b.com.", "a" * 65 + "@b.com", None, 5]
      assert all(valid_email(g) is True for g in good) and all(valid_email(b) is False for b in bad)
