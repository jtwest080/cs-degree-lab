  solution: |
    def valid_email(text):
        """A simple EMAIL check (real email rules are far more complicated). It needs exactly one '@'. The part before it (at most 64 characters) is non-empty, uses only letters, digits and the characters . _ % + -, and neither starts nor ends with a '.' nor contains '..'. The part after it splits on '.' into at least two labels; each label is non-empty, uses only letters, digits and '-', and does not start or end with '-'; the last label has only letters and at least 2 of them. Return True or False (False for anything that is not a string)."""
        if not isinstance(text, str) or text.count("@") != 1:
            return False
        local, domain = text.split("@")
        allowed = set("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._%+-")
        if not local or len(local) > 64 or not set(local) <= allowed or local[0] == "." or local[-1] == "." or ".." in local:
            return False
        labels = domain.split(".")
        if len(labels) < 2:
            return False
        for label in labels:
            if not label or not label.replace("-", "").isalnum() or label[0] == "-" or label[-1] == "-":
                return False
        last = labels[-1]
        return last.isalpha() and len(last) >= 2 and last.isascii()




    def check_rule(value, rule, values):
        """Test one RULE against a value (a string already stripped of spaces at both ends) and return None if it passes or the error MESSAGE: 'required' fails on an empty value ('This field is required'); 'min:N' needs at least N characters ('Must be at least N characters'); 'max:N' at most N ('Must be at most N characters'); 'email' uses valid_email ('Enter a valid email address'); 'number' must be readable by float ('Enter a number'); 'between:A:B' must be a number from A to B inclusive ('Must be between A and B'); 'match:FIELD' must equal values[FIELD] (stripped; 'Must match FIELD'). ValueError('unknown rule R') (with the rule text) for anything else. A value that is empty passes every rule except 'required'."""
        name, *args = rule.split(":")
        if name == "required":
            return "This field is required" if value == "" else None
        if name not in ("min", "max", "email", "number", "between", "match"):
            raise ValueError("unknown rule " + rule)
        if value == "":
            return None
        if name == "min":
            return None if len(value) >= int(args[0]) else "Must be at least %s characters" % args[0]
        if name == "max":
            return None if len(value) <= int(args[0]) else "Must be at most %s characters" % args[0]
        if name == "email":
            return None if valid_email(value) else "Enter a valid email address"
        if name == "number":
            try:
                float(value)
                return None
            except ValueError:
                return "Enter a number"
        if name == "between":
            try:
                x = float(value)
            except ValueError:
                return "Must be between %s and %s" % (args[0], args[1])
            return None if float(args[0]) <= x <= float(args[1]) else "Must be between %s and %s" % (args[0], args[1])
        return None if value == str(values.get(args[0], "")).strip() else "Must match " + args[0]


    def validate_form(values, rules):
        """Check a whole FORM. `values` is a dict {field: text} and `rules` a dict {field: [rule, ...]}. For every field in rules, in order, strip the value (a missing field is the empty string) and apply its rules in order with check_rule; the FIRST failing rule gives that field's message. Return a dict {field: message} that contains only the fields with errors (empty if the form is valid). Unknown rules raise ValueError even when an earlier rule failed: check all the rules first."""
        for rule_list in rules.values():
            for rule in rule_list:
                check_rule("x", rule, values)
        errors = {}
        for field, rule_list in rules.items():
            value = str(values.get(field, "")).strip()
            for rule in rule_list:
                message = check_rule(value, rule, values)
                if message:
                    errors[field] = message
                    break
        return errors
  explanation: The best forms show the message next to the field, in plain words, and keep what the user already typed.
