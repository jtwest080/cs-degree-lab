  solution: |
    def build_trie(words):
        """A TRIE (prefix tree) stores words letter by letter so that all words with a given beginning share a path. Build it as nested dicts: each node is a dict from a character to the child node, and the special key '$' (with the value True) marks the end of a word. Words are lower-cased. The empty trie is {}."""
        root = {}
        for word in words:
            node = root
            for ch in word.lower():
                node = node.setdefault(ch, {})
            node["$"] = True
        return root


    def complete(trie, prefix, limit=None):
        """All words in the trie that start with the prefix (lower-cased), in alphabetical order, at most `limit` of them (all when limit is None). An empty prefix gives every word."""
        node = trie
        for ch in prefix.lower():
            if ch not in node:
                return []
            node = node[ch]
        found = []

        def walk(n, path):
            if "$" in n:
                found.append(path)
            for ch in sorted(k for k in n if k != "$"):
                walk(n[ch], path + ch)

        walk(node, prefix.lower())
        return found if limit is None else found[:limit]


    def ranked_suggestions(counts, prefix, limit):
        """AUTOCOMPLETE usually shows the most popular matches. `counts` is a dict {word: how often it was used}. Return up to `limit` words that start with the prefix (ignoring case), sorted by count from highest to lowest, with ties in alphabetical order."""
        p = prefix.lower()
        matches = sorted((w for w in counts if w.lower().startswith(p)), key=lambda w: (-counts[w], w))
        return matches[:limit]


    def highlight(word, prefix):
        """Show which part of a suggestion the user has already typed by wrapping it in <b> tags: highlight('Python', 'py') gives '<b>Py</b>thon' (the case of the word is kept). If the word does not start with the prefix (ignoring case), or the prefix is empty, return the word unchanged."""
        if not prefix or not word.lower().startswith(prefix.lower()):
            return word
        return "<b>" + word[:len(prefix)] + "</b>" + word[len(prefix):]
  explanation: Search boxes feel instant because the dictionary is organised for prefix lookups.
- id: fuzzy
  title: Forgiving search
