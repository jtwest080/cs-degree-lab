  solution: |
    def valid_email(text):
        """A simple EMAIL check (real email rules are far more complicated). It needs exactly one '@'. The part before it (at most 64 characters) is non-empty, uses only letters, digits and the characters . _ % + -, and neither starts nor ends with a '.' nor contains '..'. The part after it splits on '.' into at least two labels; each label is non-empty, uses only letters, digits and '-', and does not start or end with '-'; the last label has only letters and at least 2 of them. Return True or False (False for anything that is not a string)."""
        if not isinstance(text, str) or text.count("@") != 1:
            return False
        local, domain = text.split("@")
        allowed = set("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._%+-")
        if not local or len(local) > 64 or not set(local) <= allowed or local[0] == "." or local[-1] == "." or ".." in local:
            return False
        labels = domain.split(".")
        if len(labels) < 2:
            return False
        for label in labels:
            if not label or not label.replace("-", "").isalnum() or label[0] == "-" or label[-1] == "-":
                return False
        last = labels[-1]
        return last.isalpha() and len(last) >= 2 and last.isascii()


    def valid_phone(text):
        """A PHONE NUMBER may contain spaces, hyphens, dots and brackets, and a leading '+'. Remove those (the '+' only counts at the very start); what is left must be 7 to 15 digits (0-9 only). Return True or False."""
        if not isinstance(text, str):
            return False
        body = text[1:] if text.startswith("+") else text
        for ch in " -.()":
            body = body.replace(ch, "")
        return body.isascii() and body.isdigit() and 7 <= len(body) <= 15


    def is_leap(year):
        """A LEAP YEAR is divisible by 4, except years divisible by 100 that are not divisible by 400."""
        return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


    def valid_date(year, month, day):
        """Is this a real calendar date? The year must be at least 1, the month 1 to 12, and the day from 1 to the length of that month (28 or 29 for February depending on is_leap)."""
        if year < 1 or not 1 <= month <= 12:
            return False
        days = [31, 29 if is_leap(year) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1]
        return 1 <= day <= days


    def password_score(password, common):
        """Rate a password from 0 to 5: one point each for length of at least 8, length of at least 12, having both a lower-case and an upper-case letter, having a digit, and having a character that is not a letter or digit. A password whose lower-case form is in the set `common` always scores 0."""
        if password.lower() in common:
            return 0
        score = 0
        score += len(password) >= 8
        score += len(password) >= 12
        score += any(c.islower() for c in password) and any(c.isupper() for c in password)
        score += any(c.isdigit() for c in password)
        score += any(not c.isalnum() for c in password)
        return int(score)


    def strength_label(score):
        """Name a score: 0 'Very weak', 1 or 2 'Weak', 3 'Fair', 4 'Good', 5 'Strong'."""
        if score <= 0:
            return "Very weak"
        if score <= 2:
            return "Weak"
        return {3: "Fair", 4: "Good"}.get(score, "Strong")
  explanation: Validation should be forgiving about format (spaces, dashes) and strict about meaning; and always check again on the server.
