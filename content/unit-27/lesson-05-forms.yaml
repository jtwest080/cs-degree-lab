  - name: distance
    code: |
      assert edit_distance("kitten", "sitting") == 3 and edit_distance("", "abc") == 3 and edit_distance("abc", "") == 3 and edit_distance("", "") == 0 and edit_distance("same", "same") == 0
      assert edit_distance("flaw", "lawn") == 2 and edit_distance("intention", "execution") == 5 and edit_distance("a", "b") == 1 and edit_distance("ab", "ba") == 2 and edit_distance("abc", "abcd") == 1 and edit_distance("Hello", "hello") == 1
      assert edit_distance("saturday", "sunday") == 3 and edit_distance("book", "back") == 2
  - name: nearby words
