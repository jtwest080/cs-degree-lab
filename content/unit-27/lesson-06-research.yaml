id: u27-research
title: Evaluating Designs
minutes: 100
objective: Learn how to find out whether a design really works. You will score the System Usability Scale, put confidence intervals on small studies, run an A/B test with a z statistic and a p-value, rank the problems found in an expert review, and analyse a whole usability study.
outcomes:
- Explain why designs must be tested with people
- Score and interpret the SUS questionnaire
- Compute and read a confidence interval
- Run an A/B significance test
- Combine a heuristic evaluation
- Compare two designs with evidence
sections:
- heading: Why test with people?
  body: |-
    Designers and programmers are the worst judges of their own work. They know exactly how the thing is supposed to be used, so they cannot see why a newcomer is confused. The only way to learn whether an interface works is to **evaluate** it, and the earlier the cheaper: a flaw found on paper costs nothing, the same flaw found after release costs a great deal. Evaluation is **iterative**: design, test, learn, improve, repeat.

    There are two broad kinds of evidence. **Qualitative** evidence is observation: watch five people try to do a task while they think aloud and note where they hesitate or fail. It tells you *why* things go wrong. **Quantitative** evidence is numbers: how many succeeded, how long it took, how many errors, how satisfied people said they were. It tells you *how much*. Good studies use both. A standard measure of satisfaction is the **System Usability Scale (SUS)**, ten questions turned into a score from 0 to 100. The average product scores about 68; above 80 is excellent.
- heading: Numbers from small studies
  body: |-
    Usability studies are small, often 5 to 20 people, so you must be careful with the numbers. If 8 of 10 people succeed, the true success rate for everyone is not exactly 80 percent. A **confidence interval** gives a range that probably contains the truth: for 8 of 10 the **Wilson interval** is about 49 to 94 percent, wide and honest. With 80 of 100 it narrows to about 71 to 87. More participants give narrower intervals, but only as the square root of the number: four times the people halves the width.

    Task times are usually **skewed**: most people take 20 to 30 seconds but one takes 200. The **mean** is dragged upward, so reports use the **median** (the middle value) or the **geometric mean**. When you want to know whether version B is really better than version A you run an **A/B test**: randomly give each user one version and compare success rates. The **z statistic** measures the difference in units of its expected random wobble, and the **p-value** is the probability of seeing a difference at least that large *if the two versions were actually identical*. A small p-value (conventionally under 0.05) means the difference is **statistically significant**: unlikely to be luck. Tiny improvements need huge samples to detect, which is why big companies test on millions of users.
- heading: Experts and decisions
  body: |-
    Testing with users is expensive, so experts also review an interface themselves in a **heuristic evaluation**, checking it against a list of general principles such as Nielsen's ten heuristics: visibility of system status, match with the real world, user control and freedom (such as undo), consistency, error prevention, recognition rather than recall, flexibility, minimalist design, helpful error messages, and documentation. Each expert lists the problems found with a **severity** from 0 to 4. One expert finds only about a third of the problems, but different people find different ones, so five experts find about 85 percent. A **priority** that multiplies how many experts found a problem by its mean severity tells the team what to fix first.

    Finally the evidence must lead to a decision, and the decision should state its uncertainty honestly: "design B won on task success (p = 0.01); satisfaction was about the same". Do not say "users loved it" from three friendly opinions. Be careful about the order in which you show versions, about who you recruit, and about stopping a test as soon as it looks significant, which makes false wins very likely.
examples:
- title: SUS and small samples
  intro: Scoring questionnaires and putting intervals on success rates and times.
  code: |
    import math


    def sus_score(answers):
        """The SYSTEM USABILITY SCALE (SUS) is a famous 10-question survey. Each answer is a whole number from 1 (strongly disagree) to 5 (strongly agree). The odd-numbered questions (1st, 3rd, ... , positions 0, 2, ... in the list) are positive statements and give answer - 1 points; the even-numbered ones are negative statements and give 5 - answer points. The total (0 to 40) times 2.5 is the score from 0 to 100. ValueError('need 10 answers') unless there are exactly 10, and ValueError('answers must be 1 to 5') if any is not a whole number from 1 to 5."""
        if len(answers) != 10:
            raise ValueError("need 10 answers")
        total = 0
        for i, a in enumerate(answers):
            if not isinstance(a, int) or isinstance(a, bool) or a < 1 or a > 5:
                raise ValueError("answers must be 1 to 5")
            total += (a - 1) if i % 2 == 0 else (5 - a)
        return total * 2.5


    def sus_grade(score):
        """Describe a SUS score: 85 or more 'Excellent', 72 or more 'Good', 52 or more 'OK', 38 or more 'Poor', otherwise 'Awful'."""
        for limit, name in ((85, "Excellent"), (72, "Good"), (52, "OK"), (38, "Poor")):
            if score >= limit:
                return name
        return "Awful"


    def sus_summary(all_answers):
        """Summarise a study: the list of answer lists of all participants. Return {"n": number of participants, "mean": average SUS score rounded to 1 decimal, "min": lowest score, "max": highest score}. ValueError('no participants') for an empty list."""
        if not all_answers:
            raise ValueError("no participants")
        scores = [sus_score(a) for a in all_answers]
        return {"n": len(scores), "mean": round(sum(scores) / len(scores), 1), "min": min(scores), "max": max(scores)}


    def success_rate(results):
        """The fraction of True values in a list of task results (True = the participant succeeded), rounded to 3 decimals. ValueError('no trials') for an empty list."""
        if not results:
            raise ValueError("no trials")
        return round(sum(1 for r in results if r) / len(results), 3)


    def wilson_interval(successes, trials, z=1.96):
        """With only a few participants a success rate is uncertain. The WILSON CONFIDENCE INTERVAL gives a range that probably contains the true rate (95 percent for z = 1.96). With p = successes / trials: centre = (p + z * z / (2 * trials)) / (1 + z * z / trials) and half-width = z * sqrt(p * (1 - p) / trials + z * z / (4 * trials * trials)) / (1 + z * z / trials). Return (centre - half-width, centre + half-width), each rounded to 3 decimals and limited to 0 and 1. ValueError('no trials') if trials < 1 and ValueError('bad successes') if successes is below 0 or above trials."""
        if trials < 1:
            raise ValueError("no trials")
        if successes < 0 or successes > trials:
            raise ValueError("bad successes")
        p = successes / trials
        denom = 1 + z * z / trials
        centre = (p + z * z / (2 * trials)) / denom
        half = z * math.sqrt(p * (1 - p) / trials + z * z / (4 * trials * trials)) / denom
        return (round(max(0.0, centre - half), 3), round(min(1.0, centre + half), 3))


    def median(values):
        """The middle value of a list (the average of the two middle ones for an even length), as a float. ValueError('no values') for an empty list."""
        if not values:
            raise ValueError("no values")
        s = sorted(values)
        n = len(s)
        return float(s[n // 2]) if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2


    def time_summary(times):
        """Summarise task times in seconds. Times are skewed (a few very slow people), so the MEDIAN matters more than the mean. Return {"mean": ..., "median": ..., "geometric_mean": ...} each rounded to 2 decimals; the GEOMETRIC MEAN is the n-th root of the product, computed as exp(average of log(t)). ValueError('no values') for an empty list and ValueError('times must be positive') if any time is 0 or less."""
        if not times:
            raise ValueError("no values")
        if any(t <= 0 for t in times):
            raise ValueError("times must be positive")
        mean = sum(times) / len(times)
        geo = math.exp(sum(math.log(t) for t in times) / len(times))
        return {"mean": round(mean, 2), "median": round(median(times), 2), "geometric_mean": round(geo, 2)}

    answers = [[5, 1, 4, 2, 5, 1, 4, 1, 5, 2], [4, 2, 4, 2, 3, 2, 4, 2, 4, 3], [2, 4, 2, 4, 3, 3, 2, 4, 2, 4]]
    for a in answers:
        print(a, "->", sus_score(a), sus_grade(sus_score(a)))
    print(sus_summary(answers))
    print("8 of 10 succeeded:", success_rate([True] * 8 + [False] * 2), "interval", wilson_interval(8, 10))
    print("80 of 100 succeeded: interval", wilson_interval(80, 100))
    times = [20, 25, 30, 22, 28, 200]
    print("times:", time_summary(times))
  output: |
    [5, 1, 4, 2, 5, 1, 4, 1, 5, 2] -> 90.0 Excellent
    [4, 2, 4, 2, 3, 2, 4, 2, 4, 3] -> 70.0 OK
    [2, 4, 2, 4, 3, 3, 2, 4, 2, 4] -> 30.0 Awful
    {'n': 3, 'mean': 63.3, 'min': 30.0, 'max': 90.0}
    8 of 10 succeeded: 0.8 interval (0.49, 0.943)
    80 of 100 succeeded: interval (0.711, 0.867)
    times: {'mean': 54.17, 'median': 26.5, 'geometric_mean': 35.03}
