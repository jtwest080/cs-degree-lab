- title: A/B tests and expert reviews
  intro: Is the difference real? How many users? Which problems first?
  code: |
    import math


    def two_proportion_z(x1, n1, x2, n2):
        """An A/B TEST shows two versions to two groups: group 1 had x1 successes out of n1 users, group 2 had x2 out of n2. The Z STATISTIC tells how surprising the difference is: with p1 = x1 / n1, p2 = x2 / n2 and the pooled rate p = (x1 + x2) / (n1 + n2), z = (p1 - p2) / sqrt(p * (1 - p) * (1 / n1 + 1 / n2)). Round to 3 decimals. ValueError('empty group') if n1 or n2 is below 1, and return 0.0 when the pooled rate is 0 or 1 (no variation)."""
        if n1 < 1 or n2 < 1:
            raise ValueError("empty group")
        p = (x1 + x2) / (n1 + n2)
        if p in (0, 1):
            return 0.0
        z = (x1 / n1 - x2 / n2) / math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2))
        return round(z, 3)


    def p_value(z):
        """The two-sided P-VALUE: the probability of seeing a difference at least this large by pure chance if the versions were really the same. It is 2 * (1 - Phi(|z|)) where Phi(x) = 0.5 * (1 + erf(x / sqrt(2))) is the normal distribution function (math.erf). Round to 4 decimals."""
        phi = 0.5 * (1 + math.erf(abs(z) / math.sqrt(2)))
        return round(2 * (1 - phi), 4)


    def significant(x1, n1, x2, n2, alpha=0.05):
        """Is the difference SIGNIFICANT? True when the p-value of two_proportion_z is below alpha."""
        return p_value(two_proportion_z(x1, n1, x2, n2)) < alpha


    def sample_size(p1, p2, z_alpha=1.96, z_power=0.84):
        """How many users does EACH group need to notice a change from rate p1 to rate p2 with 95 percent confidence and 80 percent power? ceil((z_alpha + z_power) ** 2 * (p1 * (1 - p1) + p2 * (1 - p2)) / (p1 - p2) ** 2). ValueError('no difference') if p1 equals p2 and ValueError('bad rate') unless both rates are strictly between 0 and 1."""
        if not (0 < p1 < 1 and 0 < p2 < 1):
            raise ValueError("bad rate")
        if p1 == p2:
            raise ValueError("no difference")
        return math.ceil((z_alpha + z_power) ** 2 * (p1 * (1 - p1) + p2 * (1 - p2)) / (p1 - p2) ** 2)


    def combine_issues(evaluators):
        """In a HEURISTIC EVALUATION several experts inspect an interface and list the problems they find, each with a SEVERITY from 0 (not a problem) to 4 (catastrophe). `evaluators` is a list of dicts {issue: severity}. Combine them into a dict {issue: {"found": how many evaluators found it, "severity": the mean severity rounded to 2 decimals}}."""
        combined = {}
        for ev in evaluators:
            for issue, sev in ev.items():
                combined.setdefault(issue, []).append(sev)
        return {issue: {"found": len(s), "severity": round(sum(s) / len(s), 2)} for issue, s in combined.items()}


    def rank_issues(combined):
        """The order in which to fix the problems: by priority = found * severity from highest to lowest, ties alphabetical. Return the list of issue names."""
        return sorted(combined, key=lambda i: (-combined[i]["found"] * combined[i]["severity"], i))


    def problems_found(rate, evaluators):
        """Nielsen's finding: one evaluator finds only a fraction `rate` of the problems (about 0.31), but different evaluators find different ones. The expected fraction found by k independent evaluators is 1 - (1 - rate) ** k, rounded to 4 decimals. ValueError('bad rate') unless 0 < rate < 1."""
        if not 0 < rate < 1:
            raise ValueError("bad rate")
        return round(1 - (1 - rate) ** evaluators, 4)


    def evaluators_needed(rate, target):
        """The smallest number of evaluators for whom problems_found reaches at least `target` (a fraction, strictly between 0 and 1: ValueError('bad target') otherwise). Use a loop."""
        if not 0 < target < 1:
            raise ValueError("bad target")
        k = 1
        while problems_found(rate, k) < target:
            k += 1
        return k

    z = two_proportion_z(60, 500, 85, 500)
    print("version A 12.0% vs version B 17.0%: z =", z, "p =", p_value(z), "| significant:", significant(60, 500, 85, 500))
    print("the same rates with only 50 users each: p =", p_value(two_proportion_z(6, 50, 8, 50)))
    print("users needed per group to see 10% -> 12%:", sample_size(0.10, 0.12))
    experts = [{"tiny buttons": 3, "no undo": 4}, {"tiny buttons": 2, "jargon": 1}, {"no undo": 3, "tiny buttons": 3, "low contrast": 2}]
    combined = combine_issues(experts)
    print(combined)
    print("fix in this order:", rank_issues(combined))
    print("problems found by 1, 3 and 5 evaluators:", [problems_found(0.31, k) for k in (1, 3, 5)], "| needed for 90%:", evaluators_needed(0.31, 0.9))
  output: |
    version A 12.0% vs version B 17.0%: z = -2.245 p = 0.0248 | significant: True
    the same rates with only 50 users each: p = 0.5646
    users needed per group to see 10% -> 12%: 3834
    {'tiny buttons': {'found': 3, 'severity': 2.67}, 'no undo': {'found': 2, 'severity': 3.5}, 'jargon': {'found': 1, 'severity': 1.0}, 'low contrast': {'found': 1, 'severity': 2.0}}
    fix in this order: ['tiny buttons', 'no undo', 'low contrast', 'jargon']
    problems found by 1, 3 and 5 evaluators: [0.31, 0.6715, 0.8436] | needed for 90%: 7
  lines:
  - line: 66
    note: A 5-point difference with 500 users per group is significant.
  - line: 67
    note: The same rates with only 50 users each are not.
  - line: 68
    note: Detecting a small change needs thousands of users per group.
  - line: 71
    note: Problems found by several experts get a higher count.
  - line: 72
    note: Priority is the number of finders times mean severity.
  - line: 73
    note: Evaluators add diminishing returns.
