  solution: |
    def combine_issues(evaluators):
        """In a HEURISTIC EVALUATION several experts inspect an interface and list the problems they find, each with a SEVERITY from 0 (not a problem) to 4 (catastrophe). `evaluators` is a list of dicts {issue: severity}. Combine them into a dict {issue: {"found": how many evaluators found it, "severity": the mean severity rounded to 2 decimals}}."""
        combined = {}
        for ev in evaluators:
            for issue, sev in ev.items():
                combined.setdefault(issue, []).append(sev)
        return {issue: {"found": len(s), "severity": round(sum(s) / len(s), 2)} for issue, s in combined.items()}


    def rank_issues(combined):
        """The order in which to fix the problems: by priority = found * severity from highest to lowest, ties alphabetical. Return the list of issue names."""
        return sorted(combined, key=lambda i: (-combined[i]["found"] * combined[i]["severity"], i))


    def problems_found(rate, evaluators):
        """Nielsen's finding: one evaluator finds only a fraction `rate` of the problems (about 0.31), but different evaluators find different ones. The expected fraction found by k independent evaluators is 1 - (1 - rate) ** k, rounded to 4 decimals. ValueError('bad rate') unless 0 < rate < 1."""
        if not 0 < rate < 1:
            raise ValueError("bad rate")
        return round(1 - (1 - rate) ** evaluators, 4)


    def evaluators_needed(rate, target):
        """The smallest number of evaluators for whom problems_found reaches at least `target` (a fraction, strictly between 0 and 1: ValueError('bad target') otherwise). Use a loop."""
        if not 0 < target < 1:
            raise ValueError("bad target")
        k = 1
        while problems_found(rate, k) < target:
            k += 1
        return k
  explanation: Five evaluators find about 85 percent of the problems; beyond that each extra expert adds little.
- id: study
  title: 'Capstone: analysing a study'
  difficulty: 5
  prompt: 'Bring the evidence together. Starter code gives `sus_score`, `sus_grade`, `wilson_interval`, `median`, `two_proportion_z` and `p_value`. Each participant is a dict `{"success": True or False, "time": seconds, "errors": number of errors, "sus": list of 10 SUS answers}`. Write `analyze_study(participants)`: return a dict with `"n"` (the number of participants), `"success_rate"` (rounded to 3 decimals), `"interval"` (the Wilson interval of the successes), `"median_time"` (rounded to 2 decimals), `"mean_errors"` (rounded to 2 decimals), `"sus"` (the mean SUS score rounded to 1 decimal) and `"grade"` (its `sus_grade`); `ValueError("no participants")` for an empty list. Write `compare_designs(a, b)`: `a` and `b` are lists of participants of design A and design B; return `{"success_p": the p-value of the difference in success counts, "sus_diff": mean SUS of A minus mean SUS of B (rounded to 1 decimal), "winner": "A", "B" or "tie"}`. If the success difference is significant (`p` below 0.05) the design with the higher success rate wins; otherwise, if the SUS means differ by at least 5 points, the design with the higher SUS wins; otherwise `"tie"`.'
  starter: |-
    import math


    def sus_score(answers):
        """The SYSTEM USABILITY SCALE (SUS) is a famous 10-question survey. Each answer is a whole number from 1 (strongly disagree) to 5 (strongly agree). The odd-numbered questions (1st, 3rd, ... , positions 0, 2, ... in the list) are positive statements and give answer - 1 points; the even-numbered ones are negative statements and give 5 - answer points. The total (0 to 40) times 2.5 is the score from 0 to 100. ValueError('need 10 answers') unless there are exactly 10, and ValueError('answers must be 1 to 5') if any is not a whole number from 1 to 5."""
        if len(answers) != 10:
            raise ValueError("need 10 answers")
        total = 0
        for i, a in enumerate(answers):
            if not isinstance(a, int) or isinstance(a, bool) or a < 1 or a > 5:
                raise ValueError("answers must be 1 to 5")
            total += (a - 1) if i % 2 == 0 else (5 - a)
        return total * 2.5


    def sus_grade(score):
        """Describe a SUS score: 85 or more 'Excellent', 72 or more 'Good', 52 or more 'OK', 38 or more 'Poor', otherwise 'Awful'."""
        for limit, name in ((85, "Excellent"), (72, "Good"), (52, "OK"), (38, "Poor")):
            if score >= limit:
                return name
        return "Awful"


    def wilson_interval(successes, trials, z=1.96):
        """With only a few participants a success rate is uncertain. The WILSON CONFIDENCE INTERVAL gives a range that probably contains the true rate (95 percent for z = 1.96). With p = successes / trials: centre = (p + z * z / (2 * trials)) / (1 + z * z / trials) and half-width = z * sqrt(p * (1 - p) / trials + z * z / (4 * trials * trials)) / (1 + z * z / trials). Return (centre - half-width, centre + half-width), each rounded to 3 decimals and limited to 0 and 1. ValueError('no trials') if trials < 1 and ValueError('bad successes') if successes is below 0 or above trials."""
        if trials < 1:
            raise ValueError("no trials")
        if successes < 0 or successes > trials:
            raise ValueError("bad successes")
        p = successes / trials
        denom = 1 + z * z / trials
        centre = (p + z * z / (2 * trials)) / denom
        half = z * math.sqrt(p * (1 - p) / trials + z * z / (4 * trials * trials)) / denom
        return (round(max(0.0, centre - half), 3), round(min(1.0, centre + half), 3))


    def median(values):
        """The middle value of a list (the average of the two middle ones for an even length), as a float. ValueError('no values') for an empty list."""
        if not values:
            raise ValueError("no values")
        s = sorted(values)
        n = len(s)
        return float(s[n // 2]) if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2


    def two_proportion_z(x1, n1, x2, n2):
        """An A/B TEST shows two versions to two groups: group 1 had x1 successes out of n1 users, group 2 had x2 out of n2. The Z STATISTIC tells how surprising the difference is: with p1 = x1 / n1, p2 = x2 / n2 and the pooled rate p = (x1 + x2) / (n1 + n2), z = (p1 - p2) / sqrt(p * (1 - p) * (1 / n1 + 1 / n2)). Round to 3 decimals. ValueError('empty group') if n1 or n2 is below 1, and return 0.0 when the pooled rate is 0 or 1 (no variation)."""
        if n1 < 1 or n2 < 1:
            raise ValueError("empty group")
        p = (x1 + x2) / (n1 + n2)
        if p in (0, 1):
            return 0.0
        z = (x1 / n1 - x2 / n2) / math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2))
        return round(z, 3)


    def p_value(z):
        """The two-sided P-VALUE: the probability of seeing a difference at least this large by pure chance if the versions were really the same. It is 2 * (1 - Phi(|z|)) where Phi(x) = 0.5 * (1 + erf(x / sqrt(2))) is the normal distribution function (math.erf). Round to 4 decimals."""
        phi = 0.5 * (1 + math.erf(abs(z) / math.sqrt(2)))
        return round(2 * (1 - phi), 4)


    def analyze_study(participants):
        """Summarise a usability study. Each participant is a dict {"success": True or False, "time": seconds, "errors": number of errors, "sus": list of 10 SUS answers}. Return a dict with: "n" the number of participants; "success_rate" (rounded to 3 decimals); "interval" the Wilson interval of the successes; "median_time" (rounded to 2 decimals); "mean_errors" (rounded to 2 decimals); "sus" the mean SUS score rounded to 1 decimal; "grade" its sus_grade. ValueError('no participants') for an empty list."""
        pass


    def compare_designs(a, b):
        """Compare two studies (lists of participants) of design A and design B. Return {"success_p": the p-value of the difference in success counts, "sus_diff": mean SUS of A minus mean SUS of B (rounded to 1 decimal), "winner": 'A', 'B' or 'tie'}. The winner is decided like this: if the success difference is significant (p below 0.05) the design with the higher success rate wins; otherwise if the SUS means differ by at least 5 points the design with the higher SUS wins; otherwise 'tie'."""
        pass
  tests:
  - name: one study
    code: |
      good = [5, 1, 5, 2, 4, 1, 5, 1, 5, 1]
      ok = [3] * 10
      people = [{"success": True, "time": 30, "errors": 0, "sus": good}, {"success": True, "time": 45, "errors": 1, "sus": good}, {"success": False, "time": 120, "errors": 4, "sus": ok}, {"success": True, "time": 38, "errors": 0, "sus": good}]
      r = analyze_study(people)
      assert r == {"n": 4, "success_rate": 0.75, "interval": wilson_interval(3, 4), "median_time": 41.5, "mean_errors": 1.25, "sus": 83.8, "grade": "Good"}
      assert r["interval"] == (0.301, 0.954) and people[0]["time"] == 30
  - name: grades and empties
    code: |
      bad = [{"success": False, "time": 90, "errors": 5, "sus": [1, 5, 1, 5, 1, 5, 1, 5, 1, 5]}] * 3
      r = analyze_study(bad)
      assert r["success_rate"] == 0.0 and r["sus"] == 0.0 and r["grade"] == "Awful" and r["interval"] == (0.0, 0.562) and r["mean_errors"] == 5.0 and r["median_time"] == 90.0
      try:
          analyze_study([])
          raise AssertionError("accepted")
      except ValueError as e:
          assert "no participants" in str(e)
  - name: comparing by success
    code: |
      mk = lambda wins, n, sus: [{"success": i < wins, "time": 30, "errors": 0, "sus": sus} for i in range(n)]
      hi, lo = [5, 1, 5, 1, 5, 1, 5, 1, 5, 1], [3] * 10
      r = compare_designs(mk(90, 100, lo), mk(60, 100, hi))
      assert r["winner"] == "A" and r["success_p"] < 0.0001 and r["sus_diff"] == -50.0
      assert compare_designs(mk(60, 100, hi), mk(90, 100, lo))["winner"] == "B"
  - name: comparing by SUS and ties
    code: |
      mk = lambda wins, n, sus: [{"success": i < wins, "time": 30, "errors": 0, "sus": sus} for i in range(n)]
      hi, lo, mid = [5, 1, 5, 1, 5, 1, 5, 1, 5, 1], [3] * 10, [4, 2, 4, 2, 4, 2, 4, 2, 4, 2]
      r = compare_designs(mk(8, 10, hi), mk(7, 10, lo))
      assert r["winner"] == "A" and r["sus_diff"] == 50.0 and r["success_p"] > 0.05
      r = compare_designs(mk(8, 10, lo), mk(7, 10, hi))
      assert r["winner"] == "B" and r["sus_diff"] == -50.0
      r = compare_designs(mk(8, 10, mid), mk(8, 10, mid))
      assert r == {"success_p": 1.0, "sus_diff": 0.0, "winner": "tie"}
      assert compare_designs(mk(8, 10, [4, 2, 4, 2, 4, 2, 4, 2, 4, 3]), mk(8, 10, mid))["winner"] == "tie"
  hints:
  - Reuse sus_score for every participant; then the study statistics are just means, a median and a z test.
  solution: |
    import math


    def sus_score(answers):
        """The SYSTEM USABILITY SCALE (SUS) is a famous 10-question survey. Each answer is a whole number from 1 (strongly disagree) to 5 (strongly agree). The odd-numbered questions (1st, 3rd, ... , positions 0, 2, ... in the list) are positive statements and give answer - 1 points; the even-numbered ones are negative statements and give 5 - answer points. The total (0 to 40) times 2.5 is the score from 0 to 100. ValueError('need 10 answers') unless there are exactly 10, and ValueError('answers must be 1 to 5') if any is not a whole number from 1 to 5."""
        if len(answers) != 10:
            raise ValueError("need 10 answers")
        total = 0
        for i, a in enumerate(answers):
            if not isinstance(a, int) or isinstance(a, bool) or a < 1 or a > 5:
                raise ValueError("answers must be 1 to 5")
            total += (a - 1) if i % 2 == 0 else (5 - a)
        return total * 2.5


    def sus_grade(score):
        """Describe a SUS score: 85 or more 'Excellent', 72 or more 'Good', 52 or more 'OK', 38 or more 'Poor', otherwise 'Awful'."""
        for limit, name in ((85, "Excellent"), (72, "Good"), (52, "OK"), (38, "Poor")):
            if score >= limit:
                return name
        return "Awful"


    def wilson_interval(successes, trials, z=1.96):
        """With only a few participants a success rate is uncertain. The WILSON CONFIDENCE INTERVAL gives a range that probably contains the true rate (95 percent for z = 1.96). With p = successes / trials: centre = (p + z * z / (2 * trials)) / (1 + z * z / trials) and half-width = z * sqrt(p * (1 - p) / trials + z * z / (4 * trials * trials)) / (1 + z * z / trials). Return (centre - half-width, centre + half-width), each rounded to 3 decimals and limited to 0 and 1. ValueError('no trials') if trials < 1 and ValueError('bad successes') if successes is below 0 or above trials."""
        if trials < 1:
            raise ValueError("no trials")
        if successes < 0 or successes > trials:
            raise ValueError("bad successes")
        p = successes / trials
        denom = 1 + z * z / trials
        centre = (p + z * z / (2 * trials)) / denom
        half = z * math.sqrt(p * (1 - p) / trials + z * z / (4 * trials * trials)) / denom
        return (round(max(0.0, centre - half), 3), round(min(1.0, centre + half), 3))


    def median(values):
        """The middle value of a list (the average of the two middle ones for an even length), as a float. ValueError('no values') for an empty list."""
        if not values:
            raise ValueError("no values")
        s = sorted(values)
        n = len(s)
        return float(s[n // 2]) if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2


    def two_proportion_z(x1, n1, x2, n2):
        """An A/B TEST shows two versions to two groups: group 1 had x1 successes out of n1 users, group 2 had x2 out of n2. The Z STATISTIC tells how surprising the difference is: with p1 = x1 / n1, p2 = x2 / n2 and the pooled rate p = (x1 + x2) / (n1 + n2), z = (p1 - p2) / sqrt(p * (1 - p) * (1 / n1 + 1 / n2)). Round to 3 decimals. ValueError('empty group') if n1 or n2 is below 1, and return 0.0 when the pooled rate is 0 or 1 (no variation)."""
        if n1 < 1 or n2 < 1:
            raise ValueError("empty group")
        p = (x1 + x2) / (n1 + n2)
        if p in (0, 1):
            return 0.0
        z = (x1 / n1 - x2 / n2) / math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2))
        return round(z, 3)


    def p_value(z):
        """The two-sided P-VALUE: the probability of seeing a difference at least this large by pure chance if the versions were really the same. It is 2 * (1 - Phi(|z|)) where Phi(x) = 0.5 * (1 + erf(x / sqrt(2))) is the normal distribution function (math.erf). Round to 4 decimals."""
        phi = 0.5 * (1 + math.erf(abs(z) / math.sqrt(2)))
        return round(2 * (1 - phi), 4)


    def analyze_study(participants):
        """Summarise a usability study. Each participant is a dict {"success": True or False, "time": seconds, "errors": number of errors, "sus": list of 10 SUS answers}. Return a dict with: "n" the number of participants; "success_rate" (rounded to 3 decimals); "interval" the Wilson interval of the successes; "median_time" (rounded to 2 decimals); "mean_errors" (rounded to 2 decimals); "sus" the mean SUS score rounded to 1 decimal; "grade" its sus_grade. ValueError('no participants') for an empty list."""
        if not participants:
            raise ValueError("no participants")
        n = len(participants)
        wins = sum(1 for p in participants if p["success"])
        scores = [sus_score(p["sus"]) for p in participants]
        mean_sus = round(sum(scores) / n, 1)
        return {"n": n, "success_rate": round(wins / n, 3), "interval": wilson_interval(wins, n),
                "median_time": round(median([p["time"] for p in participants]), 2),
                "mean_errors": round(sum(p["errors"] for p in participants) / n, 2),
                "sus": mean_sus, "grade": sus_grade(mean_sus)}


    def compare_designs(a, b):
        """Compare two studies (lists of participants) of design A and design B. Return {"success_p": the p-value of the difference in success counts, "sus_diff": mean SUS of A minus mean SUS of B (rounded to 1 decimal), "winner": 'A', 'B' or 'tie'}. The winner is decided like this: if the success difference is significant (p below 0.05) the design with the higher success rate wins; otherwise if the SUS means differ by at least 5 points the design with the higher SUS wins; otherwise 'tie'."""
        wa, wb = sum(1 for p in a if p["success"]), sum(1 for p in b if p["success"])
        pv = p_value(two_proportion_z(wa, len(a), wb, len(b)))
        sa = sum(sus_score(p["sus"]) for p in a) / len(a)
        sb = sum(sus_score(p["sus"]) for p in b) / len(b)
        diff = round(sa - sb, 1)
        if pv < 0.05:
            winner = "A" if wa / len(a) > wb / len(b) else "B"
        elif abs(diff) >= 5:
            winner = "A" if diff > 0 else "B"
        else:
            winner = "tie"
        return {"success_p": pv, "sus_diff": diff, "winner": winner}
  explanation: Real reports combine a number with its uncertainty, which is much more honest than 'users loved it'.
commonMistakes:
- title: Treating a small study's rate as exact
  explanation: Report a confidence interval.
- title: Using the mean of skewed times
  explanation: Use the median or geometric mean.
- title: Calling any difference significant
  explanation: Check the p-value and the sample size.
- title: Stopping an A/B test as soon as it looks good
  explanation: Decide the sample size in advance.
- title: Testing only with colleagues
  explanation: Recruit people who match the real users.
summary:
- Interfaces must be evaluated with real people, early and repeatedly.
- SUS turns ten questions into a 0 to 100 score; about 68 is average.
- Small studies need confidence intervals; use the median for times.
- A/B tests use a z statistic and p-value; small effects need many users.
- Heuristic evaluation by several experts finds many problems cheaply; rank them by frequency times severity.
