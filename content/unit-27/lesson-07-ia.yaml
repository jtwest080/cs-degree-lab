        """The fraction of participants who grouped a and b together, rounded to 3 decimals (a card is always 1.0 similar to itself)."""
        pass


    def cluster_cards(cards, sorts, threshold):
        """Group the cards into CLUSTERS: two cards belong together when their similarity is at least `threshold`, and the relation is followed through chains (if A goes with B and B with C, all three are one cluster: single-link clustering; use a union-find or a search). Return a list of clusters, each a sorted list of cards, with the clusters ordered by size from the largest, then by their first card."""
        pass
  tests:
  - name: counting pairs
    code: |
      cards = ["shoes", "bags", "faq", "returns"]
      sorts = [[["shoes", "bags"], ["faq", "returns"]], [["shoes", "bags", "returns"], ["faq"]], [["shoes"], ["bags"], ["faq", "returns"]]]
      c = pair_counts(cards, sorts)
      assert c == {("bags", "faq"): 0, ("bags", "returns"): 1, ("bags", "shoes"): 2, ("faq", "returns"): 2, ("faq", "shoes"): 0, ("returns", "shoes"): 1}
      assert len(c) == 6 and pair_counts(["a"], [[["a"]]]) == {} and pair_counts(["a", "b"], [[]]) == {("a", "b"): 0}
      try:
          pair_counts(cards, [])
          raise AssertionError("accepted")
