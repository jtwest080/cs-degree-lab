  solution: |
    def backtracks(path):
        """In a TREE TEST people try to find an item by clicking through a menu. A BACKTRACK is a step to a page that was already visited earlier in the same path. Count them."""
        seen = set()
        count = 0
        for page in path:
            if page in seen:
                count += 1
            seen.add(page)
        return count


    def path_efficiency(path, shortest):
        """How direct was the path? The optimal number of clicks is len(shortest) - 1 and the actual number is len(path) - 1. Return min(1, optimal / actual) rounded to 2 decimals; when the actual number of clicks is 0 return 1.0 if the optimal number is also 0 and 0.0 otherwise."""
        optimal, actual = len(shortest) - 1, len(path) - 1
        if actual == 0:
            return 1.0 if optimal == 0 else 0.0
        return round(min(1, optimal / actual), 2)


    def tree_test_summary(paths, correct):
        """Summarise one task of a tree test. `paths` is a list of the paths (lists of pages) that participants clicked and `correct` the page they should end at. Return {"success": fraction whose last page is correct (rounded to 2 decimals), "direct": fraction that succeeded WITHOUT any backtrack (rounded to 2), "avg_clicks": mean of len(path) - 1 rounded to 2}. ValueError('no results') for an empty list."""
        if not paths:
            raise ValueError("no results")
        n = len(paths)
        wins = sum(1 for p in paths if p[-1] == correct)
        direct = sum(1 for p in paths if p[-1] == correct and backtracks(p) == 0)
        return {"success": round(wins / n, 2), "direct": round(direct / n, 2), "avg_clicks": round(sum(len(p) - 1 for p in paths) / n, 2)}
  explanation: A tree test removes visual design so you learn whether the labels and structure alone make sense.
