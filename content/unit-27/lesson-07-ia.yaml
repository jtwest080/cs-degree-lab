- title: Card sorts, related pages and priorities
  intro: A sitemap, clusters from card sorts, a tree test, related pages and RICE scores.
  code: |
    def pair_counts(cards, sorts):
        """In a CARD SORT each participant groups cards (topics of a site) the way that makes sense to them. `sorts` is a list with one entry per participant; each entry is a list of groups and each group a list of cards. Return a dict {(a, b): number of participants who put a and b in the SAME group} for EVERY pair of cards with a before b alphabetically (pairs nobody grouped get 0). ValueError('no sorts') for an empty list."""
        if not sorts:
            raise ValueError("no sorts")
        counts = {}
        ordered = sorted(cards)
        for i, a in enumerate(ordered):
            for b in ordered[i + 1:]:
                counts[(a, b)] = 0
        for sort in sorts:
            for group in sort:
                g = sorted(set(group))
                for i, a in enumerate(g):
                    for b in g[i + 1:]:
                        if (a, b) in counts:
                            counts[(a, b)] += 1
        return counts


    def similarity(a, b, cards, sorts):
        """The fraction of participants who grouped a and b together, rounded to 3 decimals (a card is always 1.0 similar to itself)."""
        if a == b:
            return 1.0
        key = (a, b) if a < b else (b, a)
        return round(pair_counts(cards, sorts)[key] / len(sorts), 3)


    def cluster_cards(cards, sorts, threshold):
        """Group the cards into CLUSTERS: two cards belong together when their similarity is at least `threshold`, and the relation is followed through chains (if A goes with B and B with C, all three are one cluster: single-link clustering; use a union-find or a search). Return a list of clusters, each a sorted list of cards, with the clusters ordered by size from the largest, then by their first card."""
        parent = {c: c for c in cards}

        def find(x):
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        counts = pair_counts(cards, sorts)
        for (a, b), n in counts.items():
            if round(n / len(sorts), 3) >= threshold:
                parent[find(a)] = find(b)
        groups = {}
        for c in cards:
            groups.setdefault(find(c), []).append(c)
        return sorted((sorted(g) for g in groups.values()), key=lambda g: (-len(g), g[0]))


    def backtracks(path):
        """In a TREE TEST people try to find an item by clicking through a menu. A BACKTRACK is a step to a page that was already visited earlier in the same path. Count them."""
        seen = set()
        count = 0
        for page in path:
            if page in seen:
                count += 1
            seen.add(page)
        return count


    def path_efficiency(path, shortest):
        """How direct was the path? The optimal number of clicks is len(shortest) - 1 and the actual number is len(path) - 1. Return min(1, optimal / actual) rounded to 2 decimals; when the actual number of clicks is 0 return 1.0 if the optimal number is also 0 and 0.0 otherwise."""
        optimal, actual = len(shortest) - 1, len(path) - 1
        if actual == 0:
            return 1.0 if optimal == 0 else 0.0
        return round(min(1, optimal / actual), 2)


    def tree_test_summary(paths, correct):
        """Summarise one task of a tree test. `paths` is a list of the paths (lists of pages) that participants clicked and `correct` the page they should end at. Return {"success": fraction whose last page is correct (rounded to 2 decimals), "direct": fraction that succeeded WITHOUT any backtrack (rounded to 2), "avg_clicks": mean of len(path) - 1 rounded to 2}. ValueError('no results') for an empty list."""
        if not paths:
            raise ValueError("no results")
        n = len(paths)
        wins = sum(1 for p in paths if p[-1] == correct)
        direct = sum(1 for p in paths if p[-1] == correct and backtracks(p) == 0)
        return {"success": round(wins / n, 2), "direct": round(direct / n, 2), "avg_clicks": round(sum(len(p) - 1 for p in paths) / n, 2)}


    import math


    def word_counts(text, stop=frozenset()):
        """How often each word occurs: a dict {word: count} of the lower-case words of the text (runs of letters and digits, str.isalnum) that are not in the set `stop` of STOP WORDS such as 'the' and 'a'."""
        counts, current = {}, ""
        for ch in text.lower() + " ":
            if ch.isalnum():
                current += ch
            else:
                if current and current not in stop:
                    counts[current] = counts.get(current, 0) + 1
                current = ""
        return counts


    def cosine_similarity(a, b):
        """How alike two word-count dicts are, from 0 (no words in common) to 1 (same proportions): the dot product (the sum over words of a[w] * b[w]) divided by the product of the two lengths (the square roots of the sums of squares). Rounded to 4 decimals; 0.0 if either dict is empty."""
        dot = sum(n * b.get(w, 0) for w, n in a.items())
        la = math.sqrt(sum(n * n for n in a.values()))
        lb = math.sqrt(sum(n * n for n in b.values()))
        if la == 0 or lb == 0:
            return 0.0
        return round(dot / (la * lb), 4)


    def most_similar(texts, target, k, stop=frozenset()):
        """RELATED PAGES: `texts` is a dict {page id: text}. Return the k pages most similar to page `target` (not including itself) as a list of (id, similarity rounded to 3 decimals), sorted by similarity from highest to lowest, ties by id; pages with similarity 0 are left out."""
        mine = word_counts(texts[target], stop)
        scored = []
        for page, text in texts.items():
            if page != target:
                s = cosine_similarity(mine, word_counts(text, stop))
                if s > 0:
                    scored.append((page, round(s, 3)))
        scored.sort(key=lambda r: (-r[1], r[0]))
        return scored[:k]


    def sitemap_text(tree, root):
        """Draw the site as an indented outline: one line per page, 2 spaces of indent per level of depth, children in the listed order, each page shown the FIRST time it is reached (a page linked from several places, or a loop, appears only once). Lines are joined with newlines."""
        lines, seen = [], set()

        def walk(page, depth):
            seen.add(page)
            lines.append("  " * depth + page)
            for child in tree.get(page, []):
                if child not in seen:
                    walk(child, depth + 1)

        walk(root, 0)
        return "\n".join(lines)


    def breadcrumb(tree, root, page):
        """The 'You are here' trail: the names of the shortest path from the root to the page joined with ' > ', or None if the page cannot be reached. (Compute the shortest path with a breadth-first search.)"""
        parent = {root: None}
        queue = [root]
        while queue:
            p = queue.pop(0)
            if p == page:
                trail = []
                while p is not None:
                    trail.append(p)
                    p = parent[p]
                return " > ".join(trail[::-1])
            for child in tree.get(p, []):
                if child not in parent:
                    parent[child] = p
                    queue.append(child)
        return None


    def rice_score(reach, impact, confidence, effort):
        """The RICE priority score of a feature idea: reach (how many users per period) times impact (such as 0.5 small, 1 medium, 3 massive) times confidence (a fraction from 0 to 1) divided by effort (person-weeks). Rounded to 2 decimals. ValueError('effort must be positive') if effort <= 0."""
        if effort <= 0:
            raise ValueError("effort must be positive")
        return round(reach * impact * confidence / effort, 2)


    def prioritize(features):
        """`features` is a dict {name: (reach, impact, confidence, effort)}. Return a list of (name, rice score) sorted from the highest score to the lowest, ties by name."""
        scored = [(name, rice_score(*vals)) for name, vals in features.items()]
        scored.sort(key=lambda r: (-r[1], r[0]))
        return scored


    def decision_matrix(options, weights):
        """A DECISION MATRIX compares designs on several criteria. `options` is a dict {name: {criterion: score}} and `weights` a dict {criterion: weight}. The total of an option is the sum over the criteria in `weights` of weight * score. Return a list of (name, total rounded to 2 decimals) sorted from the highest to the lowest, ties by name. ValueError('missing score') if an option lacks a criterion."""
        results = []
        for name, scores in options.items():
            total = 0.0
            for criterion, w in weights.items():
                if criterion not in scores:
                    raise ValueError("missing score")
                total += w * scores[criterion]
            results.append((name, round(total, 2)))
        results.sort(key=lambda r: (-r[1], r[0]))
        return results

    site = {"home": ["products", "about", "help"], "products": ["shoes", "bags", "sale"], "shoes": ["running", "hiking"], "about": ["team", "jobs"], "help": ["faq", "contact", "home"], "faq": ["returns"], "sale": ["shoes"], "lost": ["found"]}
    print(sitemap_text(site, "home"))
    print(breadcrumb(site, "home", "returns"))
    cards = ["shoes", "bags", "faq", "returns", "contact"]
    sorts = [[["shoes", "bags"], ["faq", "returns", "contact"]], [["shoes", "bags", "returns"], ["faq", "contact"]], [["shoes"], ["bags"], ["faq", "returns"], ["contact"]]]
    print("similarity shoes/bags:", similarity("shoes", "bags", cards, sorts), "| clusters at 0.6:", cluster_cards(cards, sorts, 0.6))
    print(tree_test_summary([["home", "products", "shoes"], ["home", "help", "home", "products", "shoes"], ["home", "about", "team"]], "shoes"))
    texts = {"run": "Running shoes for road and trail running", "hike": "Hiking boots and trail shoes", "tax": "Tax returns policy"}
    print("related to run:", most_similar(texts, "run", 2, {"for", "and"}))
    print(prioritize({"dark mode": (1000, 0.5, 0.8, 2), "search": (800, 2, 0.8, 4), "export": (200, 1, 1, 1)}))
  output: |
