  - A queue (a list you take from the front) explores pages in order of their distance from the root.
  solution: |
    def bfs_depths(tree, root):
        """A website is a TREE (really a graph) of pages: `tree` is a dict {page: [pages it links to]}; a page that is not a key has no links. The DEPTH of a page is the smallest number of CLICKS needed to reach it from `root`. Return a dict {page: depth} for every page reachable from the root (the root has depth 0). Pages may link back to earlier ones, so remember which pages you have seen (breadth-first search with a queue)."""
        depths = {root: 0}
        queue = [root]
        while queue:
            page = queue.pop(0)
            for child in tree.get(page, []):
                if child not in depths:
                    depths[child] = depths[page] + 1
                    queue.append(child)
        return depths


    def shortest_path(tree, root, target):
        """The list of pages from root to target with the fewest clicks (including both ends); this is the BREADCRUMB trail. With several shortest paths take the one found first when links are followed in the listed order. None if the target cannot be reached."""
        parent = {root: None}
        queue = [root]
        while queue:
            page = queue.pop(0)
            if page == target:
                path = []
                while page is not None:
                    path.append(page)
                    page = parent[page]
                return path[::-1]
            for child in tree.get(page, []):
                if child not in parent:
                    parent[child] = page
                    queue.append(child)
        return None


    def orphans(tree, root):
        """ORPHAN pages are mentioned somewhere (as a key or as a link target) but cannot be reached from the root: nobody can find them by clicking. Return them as a sorted list."""
        mentioned = set(tree)
        for children in tree.values():
            mentioned.update(children)
        return sorted(mentioned - set(bfs_depths(tree, root)))


    def dead_ends(tree, root):
        """Reachable pages that link to nothing (they are not keys of the tree or have an empty list), as a sorted list."""
        return sorted(p for p in bfs_depths(tree, root) if not tree.get(p))


    def too_deep(tree, root, limit):
        """The reachable pages that need MORE than `limit` clicks (the 'three-click rule' is a popular guideline), sorted by depth from the deepest, then by name."""
        d = bfs_depths(tree, root)
        return sorted((p for p, k in d.items() if k > limit), key=lambda p: (-d[p], p))
  explanation: Studies show people give up after a few wrong clicks, so a page five clicks deep may as well not exist.
