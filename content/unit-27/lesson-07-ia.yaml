  tests:
  - name: depths
    code: |
      site = {"home": ["products", "about", "help"], "products": ["shoes", "bags", "sale"], "shoes": ["running", "hiking"], "about": ["team", "jobs"], "help": ["faq", "contact", "home"], "faq": ["returns"], "sale": ["shoes"], "lost": ["found"]}
      d = bfs_depths(site, "home")
      assert d == {"home": 0, "products": 1, "about": 1, "help": 1, "shoes": 2, "bags": 2, "sale": 2, "team": 2, "jobs": 2, "faq": 2, "contact": 2, "running": 3, "hiking": 3, "returns": 3}
      assert bfs_depths({}, "x") == {"x": 0} and bfs_depths({"a": ["b"], "b": ["a"]}, "a") == {"a": 0, "b": 1} and bfs_depths(site, "sale")["running"] == 2 and "lost" not in d
  - name: paths
    code: |
      site = {"home": ["products", "about", "help"], "products": ["shoes", "bags", "sale"], "shoes": ["running", "hiking"], "about": ["team", "jobs"], "help": ["faq", "contact", "home"], "faq": ["returns"], "sale": ["shoes"], "lost": ["found"]}
      assert shortest_path(site, "home", "home") == ["home"] and shortest_path(site, "home", "running") == ["home", "products", "shoes", "running"] and shortest_path(site, "home", "returns") == ["home", "help", "faq", "returns"]
      assert shortest_path(site, "home", "lost") is None and shortest_path(site, "home", "nowhere") is None and shortest_path(site, "sale", "home") is None and shortest_path({"a": ["b", "c"], "b": ["d"], "c": ["d"]}, "a", "d") == ["a", "b", "d"]
