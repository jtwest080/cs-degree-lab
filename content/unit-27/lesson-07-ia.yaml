    breadcrumb to running: ['home', 'products', 'shoes', 'running']
    orphans: ['found', 'lost'] | dead ends: ['bags', 'contact', 'hiking', 'jobs', 'returns', 'running', 'team']
    pages more than 2 clicks deep: ['hiking', 'returns', 'running']
