      stop = {"for", "and", "the"}
      r = most_similar(texts, "run", 3, stop)
      assert [x[0] for x in r] == ["road", "hike"] and r[0][1] > r[1][1] and all(0 < s <= 1 for _, s in r)
      assert most_similar(texts, "run", 1, stop) == r[:1] and most_similar(texts, "ret", 5, stop) == [] and most_similar(texts, "bag", 5) == [("hike", 0.15)] or most_similar(texts, "bag", 5)[0][0] == "hike"
      assert "run" not in [x[0] for x in most_similar(texts, "run", 10, stop)] and most_similar({"a": "x y", "b": "x y"}, "a", 3) == [("b", 1.0)]
