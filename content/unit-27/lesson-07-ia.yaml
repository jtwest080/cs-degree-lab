- type: code
  question: 'Write `click_depth(path)` returning the number of clicks of a path (a list of pages): one fewer than its length, and 0 for an empty list.'
  starter: |
    def click_depth(path):
        pass
  tests:
  - name: clicks
    code: |
      assert click_depth(["home", "a", "b"]) == 2 and click_depth(["home"]) == 0 and click_depth([]) == 0 and click_depth(list("abcde")) == 4
  solution: |
    def click_depth(path):
        return max(0, len(path) - 1)
