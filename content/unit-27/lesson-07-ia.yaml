  prompt: 'How should a site''s topics be grouped? Ask the users. In a **card sort** each participant groups cards (topics) the way that makes sense to them. `sorts` is a list with one entry per participant; each entry is a list of **groups** and each group a list of cards. Write `pair_counts(cards, sorts)`: a dict `{(a, b): the number of participants who put a and b in the SAME group}` for **every** pair of cards with `a` before `b` alphabetically (pairs nobody grouped get 0); `ValueError("no sorts")` for an empty list. Write `similarity(a, b, cards, sorts)`: the fraction of participants who grouped them together, rounded to 3 decimals (a card is always `1.0` similar to itself). Write `cluster_cards(cards, sorts, threshold)`: two cards belong together when their similarity is **at least** `threshold`, and the relation follows chains (if A goes with B and B with C, all three form one **cluster**: single-link clustering, with a union-find or a search); return a list of clusters, each a sorted list of cards, ordered by size from the largest, then by their first card.'
  starter: |-
    def pair_counts(cards, sorts):
        """In a CARD SORT each participant groups cards (topics of a site) the way that makes sense to them. `sorts` is a list with one entry per participant; each entry is a list of groups and each group a list of cards. Return a dict {(a, b): number of participants who put a and b in the SAME group} for EVERY pair of cards with a before b alphabetically (pairs nobody grouped get 0). ValueError('no sorts') for an empty list."""
