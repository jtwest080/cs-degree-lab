      assert tree_test_summary(paths, "shoes") == {"success": 0.75, "direct": 0.5, "avg_clicks": 2.5} and tree_test_summary([["a"]], "a") == {"success": 1.0, "direct": 1.0, "avg_clicks": 0.0} and tree_test_summary([["a", "b"]], "c") == {"success": 0.0, "direct": 0.0, "avg_clicks": 1.0}
