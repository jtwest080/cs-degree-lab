id: u27-ia
title: Navigation and Design Decisions
minutes: 100
objective: Learn how to organise what people see and how to decide what to build. You will analyse a website's structure with breadth-first search, cluster topics from card sorts, evaluate navigation with tree tests, recommend related pages by cosine similarity, and prioritise work with RICE scores and decision matrices.
outcomes:
- Model a site as a graph and measure click depth
- Find orphan pages and dead ends
- Cluster topics from a card sort
- Analyse a tree test
- Compare texts with cosine similarity
- Prioritise features with a scoring method
sections:
- heading: Information architecture
  body: |-
    A good interface is not only pretty; it is **organised**. **Information architecture (IA)** is the art of structuring content so that people can find it and understand where they are. A website is a **graph**: pages are **nodes** and links are **edges**. Usually there is a **home page** (the **root**) and everything else is reached by **clicking** through menus, so the number of clicks needed to reach a page is its **depth**. The shortest path from the root to a page is also the **breadcrumb** trail ("Home > Products > Shoes") that tells users where they are.

    Several common faults can be detected automatically with a graph search. A **breadth-first search** visits pages in order of increasing distance and gives every page's depth. An **orphan page** is one that exists but cannot be reached by following links from the home page: it is invisible to anyone who browses. A **dead end** has no links out, which is fine for content but a trap if it has no way back. Very deep pages are hard to find, which is the reason behind the popular (if crude) "three-click rule". Wide, shallow structures usually work better than deep ones, in line with Hick's law.
- heading: 'Asking users: card sorts and tree tests'
  body: |-
    The labels and groups designers invent often make sense only inside the company. To learn how users think, run a **card sort**: write each topic on a card and ask participants to group them and name the groups. If most people put "shoes" and "bags" together, they belong in one menu. A computer helps by counting for every pair of cards how many participants grouped them together, which gives a **similarity** from 0 to 1. Cards whose similarity is above a **threshold** are linked, and chains of linked cards form **clusters**: candidate menu sections.

    Once you have a structure, a **tree test** checks it before any visual design. Participants are given a task such as "find where to return a pair of shoes" and click through a bare text menu. Researchers measure **success** (did they end at the right place), **directness** (without going back) and the number of clicks. A high rate of **backtracking** means the labels are misleading. These two methods complement each other: card sorting *builds* a structure from users' minds, and tree testing *verifies* it.
- heading: Related content and design decisions
  body: |-
    Sites also suggest related pages. A common method treats each page as a **bag of words**, a count of how often each word occurs, ignoring order. Common **stop words** such as "the" are left out. Two pages can then be compared with **cosine similarity**: the dot product of their count vectors divided by the product of their lengths. It is 1 for the same proportions of words and 0 if no word is shared, regardless of how long the pages are.

    Finally, a team always has more ideas than time, so it needs a fair way to **prioritise**. The **RICE** score multiplies **reach**, **impact** and **confidence** and divides by **effort**, so cheap, widely useful and well-understood ideas rise to the top. A **decision matrix** scores each design option against several **criteria**, multiplies each score by a **weight** that expresses how much the criterion matters, and adds them up. Such numbers do not replace judgement, but they make the reasoning visible, so that people can argue about the weights instead of about feelings.
examples:
- title: Analysing a site
  intro: Click depth, breadcrumbs, orphans and dead ends of a small shop.
  code: |
    def bfs_depths(tree, root):
        """A website is a TREE (really a graph) of pages: `tree` is a dict {page: [pages it links to]}; a page that is not a key has no links. The DEPTH of a page is the smallest number of CLICKS needed to reach it from `root`. Return a dict {page: depth} for every page reachable from the root (the root has depth 0). Pages may link back to earlier ones, so remember which pages you have seen (breadth-first search with a queue)."""
        depths = {root: 0}
        queue = [root]
        while queue:
            page = queue.pop(0)
            for child in tree.get(page, []):
                if child not in depths:
                    depths[child] = depths[page] + 1
                    queue.append(child)
        return depths


    def shortest_path(tree, root, target):
        """The list of pages from root to target with the fewest clicks (including both ends); this is the BREADCRUMB trail. With several shortest paths take the one found first when links are followed in the listed order. None if the target cannot be reached."""
        parent = {root: None}
        queue = [root]
        while queue:
            page = queue.pop(0)
            if page == target:
                path = []
                while page is not None:
                    path.append(page)
                    page = parent[page]
                return path[::-1]
            for child in tree.get(page, []):
                if child not in parent:
                    parent[child] = page
                    queue.append(child)
        return None


    def orphans(tree, root):
        """ORPHAN pages are mentioned somewhere (as a key or as a link target) but cannot be reached from the root: nobody can find them by clicking. Return them as a sorted list."""
        mentioned = set(tree)
        for children in tree.values():
            mentioned.update(children)
        return sorted(mentioned - set(bfs_depths(tree, root)))


    def dead_ends(tree, root):
        """Reachable pages that link to nothing (they are not keys of the tree or have an empty list), as a sorted list."""
        return sorted(p for p in bfs_depths(tree, root) if not tree.get(p))


    def too_deep(tree, root, limit):
        """The reachable pages that need MORE than `limit` clicks (the 'three-click rule' is a popular guideline), sorted by depth from the deepest, then by name."""
        d = bfs_depths(tree, root)
        return sorted((p for p, k in d.items() if k > limit), key=lambda p: (-d[p], p))

    site = {"home": ["products", "about", "help"], "products": ["shoes", "bags", "sale"], "shoes": ["running", "hiking"], "about": ["team", "jobs"], "help": ["faq", "contact", "home"], "faq": ["returns"], "sale": ["shoes"], "lost": ["found"]}
    print("clicks from home:", bfs_depths(site, "home"))
    print("breadcrumb to running:", shortest_path(site, "home", "running"))
    print("orphans:", orphans(site, "home"), "| dead ends:", dead_ends(site, "home"))
    print("pages more than 2 clicks deep:", too_deep(site, "home", 2))
  output: |
