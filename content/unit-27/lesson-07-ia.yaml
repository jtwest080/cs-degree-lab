  solution: |
    def sitemap_text(tree, root):
        """Draw the site as an indented outline: one line per page, 2 spaces of indent per level of depth, children in the listed order, each page shown the FIRST time it is reached (a page linked from several places, or a loop, appears only once). Lines are joined with newlines."""
        lines, seen = [], set()

        def walk(page, depth):
            seen.add(page)
            lines.append("  " * depth + page)
            for child in tree.get(page, []):
                if child not in seen:
                    walk(child, depth + 1)

        walk(root, 0)
        return "\n".join(lines)


    def breadcrumb(tree, root, page):
        """The 'You are here' trail: the names of the shortest path from the root to the page joined with ' > ', or None if the page cannot be reached. (Compute the shortest path with a breadth-first search.)"""
        parent = {root: None}
        queue = [root]
        while queue:
            p = queue.pop(0)
            if p == page:
                trail = []
                while p is not None:
                    trail.append(p)
                    p = parent[p]
                return " > ".join(trail[::-1])
            for child in tree.get(p, []):
                if child not in parent:
                    parent[child] = p
                    queue.append(child)
        return None


    def rice_score(reach, impact, confidence, effort):
        """The RICE priority score of a feature idea: reach (how many users per period) times impact (such as 0.5 small, 1 medium, 3 massive) times confidence (a fraction from 0 to 1) divided by effort (person-weeks). Rounded to 2 decimals. ValueError('effort must be positive') if effort <= 0."""
        if effort <= 0:
            raise ValueError("effort must be positive")
        return round(reach * impact * confidence / effort, 2)


    def prioritize(features):
        """`features` is a dict {name: (reach, impact, confidence, effort)}. Return a list of (name, rice score) sorted from the highest score to the lowest, ties by name."""
        scored = [(name, rice_score(*vals)) for name, vals in features.items()]
        scored.sort(key=lambda r: (-r[1], r[0]))
        return scored


    def decision_matrix(options, weights):
        """A DECISION MATRIX compares designs on several criteria. `options` is a dict {name: {criterion: score}} and `weights` a dict {criterion: weight}. The total of an option is the sum over the criteria in `weights` of weight * score. Return a list of (name, total rounded to 2 decimals) sorted from the highest to the lowest, ties by name. ValueError('missing score') if an option lacks a criterion."""
        results = []
        for name, scores in options.items():
            total = 0.0
            for criterion, w in weights.items():
                if criterion not in scores:
                    raise ValueError("missing score")
                total += w * scores[criterion]
            results.append((name, round(total, 2)))
        results.sort(key=lambda r: (-r[1], r[0]))
        return results
  explanation: 'Teams use exactly these tools to decide what to build next: a map of what exists and a transparent way to choose.'
commonMistakes:
- title: Organising the site like the company chart
  explanation: Group topics the way users think.
- title: Leaving pages that nothing links to
  explanation: Check for orphans.
- title: Searching a graph without remembering visited pages
  explanation: Loops will make the search run forever.
- title: Choosing priorities by the loudest voice
  explanation: Use a transparent scoring method.
- title: Believing a score is the decision
  explanation: Scores support judgement; they do not replace it.
summary:
- A site is a graph; depth is the number of clicks from the home page.
- Breadth-first search finds depths, breadcrumbs, orphans and dead ends.
- Card sorting builds a structure from users' groupings; tree testing verifies it.
- Cosine similarity of word counts finds related pages.
- RICE scores and decision matrices make priorities explicit.
