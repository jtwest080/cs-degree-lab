          assert "no sorts" in str(e)
  - name: similarity
    code: |
      cards = ["shoes", "bags", "faq", "returns"]
      sorts = [[["shoes", "bags"], ["faq", "returns"]], [["shoes", "bags", "returns"], ["faq"]], [["shoes"], ["bags"], ["faq", "returns"]]]
      assert similarity("shoes", "bags", cards, sorts) == 0.667 and similarity("bags", "shoes", cards, sorts) == 0.667 and similarity("faq", "shoes", cards, sorts) == 0.0 and similarity("faq", "faq", cards, sorts) == 1.0 and similarity("returns", "shoes", cards, sorts) == 0.333
  - name: clusters
    code: |
      cards = ["shoes", "bags", "faq", "returns", "contact"]
      sorts = [[["shoes", "bags"], ["faq", "returns", "contact"]], [["shoes", "bags", "returns"], ["faq", "contact"]], [["shoes"], ["bags"], ["faq", "returns"], ["contact"]]]
      assert cluster_cards(cards, sorts, 0.6) == [["contact", "faq", "returns"], ["bags", "shoes"]]
      assert cluster_cards(cards, sorts, 0.0) == [["bags", "contact", "faq", "returns", "shoes"]] and cluster_cards(cards, sorts, 1.0) == [["bags"], ["contact"], ["faq"], ["returns"], ["shoes"]] and cluster_cards([], [[]], 0.5) == []
      chain = [[["a", "b"], ["c"]], [["b", "c"], ["a"]]]
      assert cluster_cards(["a", "b", "c"], chain, 0.5) == [["a", "b", "c"]] and cluster_cards(["a", "b", "c"], chain, 0.75) == [["a"], ["b"], ["c"]]
