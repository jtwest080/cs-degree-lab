  - Turn each text into a word-count dict first; then similarity is a small formula.
  solution: |
    import math




    def word_counts(text, stop=frozenset()):
        """How often each word occurs: a dict {word: count} of the lower-case words of the text (runs of letters and digits, str.isalnum) that are not in the set `stop` of STOP WORDS such as 'the' and 'a'."""
        counts, current = {}, ""
        for ch in text.lower() + " ":
            if ch.isalnum():
                current += ch
            else:
                if current and current not in stop:
                    counts[current] = counts.get(current, 0) + 1
                current = ""
        return counts


    def cosine_similarity(a, b):
        """How alike two word-count dicts are, from 0 (no words in common) to 1 (same proportions): the dot product (the sum over words of a[w] * b[w]) divided by the product of the two lengths (the square roots of the sums of squares). Rounded to 4 decimals; 0.0 if either dict is empty."""
        dot = sum(n * b.get(w, 0) for w, n in a.items())
        la = math.sqrt(sum(n * n for n in a.values()))
        lb = math.sqrt(sum(n * n for n in b.values()))
        if la == 0 or lb == 0:
            return 0.0
        return round(dot / (la * lb), 4)


    def most_similar(texts, target, k, stop=frozenset()):
        """RELATED PAGES: `texts` is a dict {page id: text}. Return the k pages most similar to page `target` (not including itself) as a list of (id, similarity rounded to 3 decimals), sorted by similarity from highest to lowest, ties by id; pages with similarity 0 are left out."""
        mine = word_counts(texts[target], stop)
        scored = []
        for page, text in texts.items():
            if page != target:
                s = cosine_similarity(mine, word_counts(text, stop))
                if s > 0:
                    scored.append((page, round(s, 3)))
        scored.sort(key=lambda r: (-r[1], r[0]))
        return scored[:k]
  explanation: Recommendation systems on shopping and video sites are sophisticated versions of this idea.
