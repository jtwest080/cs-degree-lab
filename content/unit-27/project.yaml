  code: |
    UI = {"type": "column", "id": "root", "children": [
        {"type": "label", "id": "title", "text": "Sign up"},
        {"type": "row", "id": "name_row", "children": [{"type": "label", "id": "name_l", "text": "Name"}, {"type": "input", "id": "name", "label": "Name", "value": ""}]},
