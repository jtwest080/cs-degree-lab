- name: undo and redo
  code: |
    s0 = {"values": {"a": ""}, "past": [], "future": []}
    s1 = apply_action(s0, ("set", "a", "Hi"))
    assert s1 == {"values": {"a": "Hi"}, "past": [{"a": ""}], "future": []} and s0 == {"values": {"a": ""}, "past": [], "future": []}
    s2 = apply_action(s1, ("set", "a", "Hi!"))
    assert s2["values"] == {"a": "Hi!"} and s2["past"] == [{"a": ""}, {"a": "Hi"}]
    u = apply_action(s2, ("undo",))
    assert u == {"values": {"a": "Hi"}, "past": [{"a": ""}], "future": [{"a": "Hi!"}]}
    assert s2["past"] == [{"a": ""}, {"a": "Hi"}] and s2["future"] == []
    r = apply_action(u, ("redo",))
    assert r == s2
    assert apply_action(s0, ("undo",)) == s0 and apply_action(s0, ("redo",)) == s0 and apply_action(s1, ("set", "a", "Hi")) == s1
    uu = apply_action(apply_action(s2, ("undo",)), ("undo",))
    assert uu["values"] == {"a": ""} and uu["future"] == [{"a": "Hi"}, {"a": "Hi!"}]
    branch = apply_action(u, ("set", "a", "New"))
    assert branch["future"] == [] and branch["past"] == [{"a": ""}, {"a": "Hi"}]
    two = apply_action({"values": {"a": "1", "b": "2"}, "past": [], "future": []}, ("set", "b", "3"))
    assert two["values"] == {"a": "1", "b": "3"} and two["past"] == [{"a": "1", "b": "2"}]
