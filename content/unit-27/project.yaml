    assert r3 == {"focus": "name", "values": {"name": "Bo"}, "pressed": ["ok", "cancel"]}
    pre = {"type": "column", "id": "r", "children": [{"type": "input", "id": "i", "label": "I", "value": "Hi"}]}
    assert simulate(pre, [("tab",), ("type", "!"), ("undo",), ("undo",), ("redo",)], 10) == {"focus": "i", "values": {"i": "Hi!"}, "pressed": []}
solution: |
  FOCUSABLE = ("button", "input")


  def new_canvas(width, height):
      """A grid of `height` rows of `width` dots (a dot means 'empty')."""
      return [["."] * width for _ in range(height)]


  def walk(node):
      """Every widget of a tree (a dict with a "type", an "id" and maybe "children") in pre-order: the widget first, then its children from first to last."""
      found = [node]
      for child in node.get("children", []):
          found.extend(walk(child))
      return found


  def hex_to_rgb(color):
      """Turn "#rrggbb" into a tuple of three whole numbers from 0 to 255."""
      return (int(color[1:3], 16), int(color[3:5], 16), int(color[5:7], 16))


  def luminance(color):
      """The relative luminance (WCAG) of a "#rrggbb" colour, from 0 for black to 1 for white."""
      parts = []
      for v in hex_to_rgb(color):
          s = v / 255
          parts.append(s / 12.92 if s <= 0.03928 else ((s + 0.055) / 1.055) ** 2.4)
      return 0.2126 * parts[0] + 0.7152 * parts[1] + 0.0722 * parts[2]


  def contrast_ratio(fg, bg):
      """The WCAG contrast ratio of two colours, from 1 to 21, rounded to 2 decimals."""
      a, b = luminance(fg), luminance(bg)
      hi, lo = max(a, b), min(a, b)
      return round((hi + 0.05) / (lo + 0.05), 2)


  def label_text(node):
      """The text a widget shows: a label shows its "text"; a button shows its "text" between square brackets; an input shows its "value" (default "") between square brackets; any other widget (a row or a column) shows nothing, "" ."""
      t = node["type"]
      if t == "label":
          return node.get("text", "")
      if t == "button":
          return "[" + node.get("text", "") + "]"
      if t == "input":
          return "[" + node.get("value", "") + "]"
      return ""


  def layout(node, x, y, width):
      """Place a widget tree on a text screen. Return (boxes, height). Every widget has a box {"id", "x", "y", "w", "h", "text"} where text is label_text(widget); `boxes` lists the boxes in pre-order (the widget's own box first, then those of its children). A leaf (label, button, input) is `width` wide and node.get("h", 1) high. A "column" gives each child the full width and stacks them downward, its height being the total. A "row" has its children side by side and splits the width evenly: every child gets width // n columns except the LAST child, which gets the rest; its height is the tallest child (0 if it has no children)."""
      t = node["type"]
      children = node.get("children", [])
      boxes, height = [], 0
      if t == "column":
          cy = y
          for child in children:
              b, h = layout(child, x, cy, width)
              boxes.extend(b)
              cy += h
          height = cy - y
      elif t == "row":
          n = len(children)
          base = width // n if n else 0
          cx = x
          for i, child in enumerate(children):
              w = base if i < n - 1 else width - base * (n - 1)
              b, h = layout(child, cx, y, w)
              boxes.extend(b)
              cx += w
              height = max(height, h)
      else:
          height = node.get("h", 1)
      own = {"id": node["id"], "x": x, "y": y, "w": width, "h": height, "text": label_text(node)}
      return [own] + boxes, height


  def draw(root, width):
      """Draw the screen as a list of strings: lay the tree out at (0, 0), start from new_canvas(width, height), and for every box with some text write the text from its (x, y), cut off so that it never goes past the box's own width."""
      boxes, height = layout(root, 0, 0, width)
      canvas = new_canvas(width, height)
      for b in boxes:
          for i, ch in enumerate(b["text"][:b["w"]]):
              canvas[b["y"]][b["x"] + i] = ch
      return ["".join(row) for row in canvas]


  def hit_test(boxes, x, y):
      """The id of the DEEPEST widget under the point (x, y), or None. A box covers x from its x up to (not including) x + w, and likewise for y. Boxes are in pre-order, so the last box that covers the point is the deepest."""
      found = None
      for b in boxes:
          if b["x"] <= x < b["x"] + b["w"] and b["y"] <= y < b["y"] + b["h"]:
              found = b["id"]
      return found


  def focus_order(root):
      """The ids of the widgets that the Tab key visits: buttons and inputs that are not disabled (no "disabled": True), in tree order."""
      return [n["id"] for n in walk(root) if n["type"] in FOCUSABLE and not n.get("disabled")]


  def next_focus(order, current, backwards=False):
      """Where Tab (or Shift+Tab when backwards) moves the focus. It wraps around at the ends. If `current` is not in `order` (nothing focused yet) go to the first item (the last when backwards). None if `order` is empty."""
      if not order:
          return None
      if current not in order:
          return order[-1] if backwards else order[0]
      i = order.index(current)
      return order[(i + (-1 if backwards else 1)) % len(order)]


  def apply_action(state, action):
      """Edit text with undo and redo. `state` is {"values": {id: text}, "past": [earlier values dicts], "future": [undone values dicts]}. Never change the old state; return a new one. ("set", id, text) changes a value: if it is already that text return an equal state, otherwise push a copy of the old values on `past`, set the new value and empty `future`. ("undo",) restores the last dict of `past` (the current values go to the FRONT of `future`); with an empty `past` nothing changes. ("redo",) is the reverse: it takes the FIRST dict of `future`, and the current values go to the end of `past`. With an empty `future` nothing changes."""
      values, past, future = dict(state["values"]), list(state["past"]), list(state["future"])
      kind = action[0]
      if kind == "set":
          _, wid, text = action
          if values.get(wid) == text:
              return {"values": values, "past": past, "future": future}
          past.append(dict(values))
          values[wid] = text
          return {"values": values, "past": past, "future": []}
      if kind == "undo" and past:
          future.insert(0, values)
          return {"values": past.pop(), "past": past, "future": future}
      if kind == "redo" and future:
          past.append(values)
          return {"values": future.pop(0), "past": past, "future": future}
      return {"values": values, "past": past, "future": future}


  def audit(root):
      """Check the screen for ACCESSIBILITY problems and return a sorted list of messages. An input without a "label" gives "<id>: input needs a label". A button whose text is empty (after strip()) and that has no "label" gives "<id>: button needs a name". A widget with both "fg" and "bg" colours whose contrast_ratio is below 4.5 gives "<id>: low contrast". An id used by more than one widget gives "<id>: duplicate id" (once per id)."""
      issues, seen = [], set()
      for n in walk(root):
          wid = n["id"]
          if wid in seen:
              msg = wid + ": duplicate id"
              if msg not in issues:
                  issues.append(msg)
          seen.add(wid)
          if n["type"] == "input" and not n.get("label"):
              issues.append(wid + ": input needs a label")
          if n["type"] == "button" and not n.get("text", "").strip() and not n.get("label"):
              issues.append(wid + ": button needs a name")
          if "fg" in n and "bg" in n and contrast_ratio(n["fg"], n["bg"]) < 4.5:
              issues.append(wid + ": low contrast")
      return sorted(issues)


  def simulate(root, events, width):
      """Run a whole session. Lay the tree out at (0, 0) with the given width and start with focus None, no buttons pressed, and every input's "value" (default "") as the text in a fresh history state. Handle each event in order: ("tab",) and ("shift-tab",) move the focus with next_focus over focus_order; ("click", x, y) focuses the widget under the point if it is in focus_order, and if that widget is a button it is also pressed; ("enter",) presses the focused widget if it is a button; ("type", text) appends text to the focused input's value (an ("set", ...) action; ignored when no input has the focus); ("undo",) and ("redo",) use apply_action. Pressing a button appends its id to a list. Return {"focus": id or None, "values": {id: text}, "pressed": [ids]}."""
      boxes, _ = layout(root, 0, 0, width)
      order = focus_order(root)
      kinds = {n["id"]: n["type"] for n in walk(root)}
      state = {"values": {n["id"]: n.get("value", "") for n in walk(root) if n["type"] == "input"}, "past": [], "future": []}
      focus, pressed = None, []
      for ev in events:
          kind = ev[0]
          if kind == "tab":
              focus = next_focus(order, focus)
          elif kind == "shift-tab":
              focus = next_focus(order, focus, True)
          elif kind == "click":
              hit = hit_test(boxes, ev[1], ev[2])
              if hit in order:
                  focus = hit
                  if kinds[hit] == "button":
                      pressed.append(hit)
          elif kind == "enter":
              if focus is not None and kinds[focus] == "button":
                  pressed.append(focus)
          elif kind == "type":
              if focus is not None and kinds[focus] == "input":
                  state = apply_action(state, ("set", focus, state["values"][focus] + ev[1]))
          elif kind in ("undo", "redo"):
              state = apply_action(state, (kind,))
      return {"focus": focus, "values": state["values"], "pressed": pressed}
