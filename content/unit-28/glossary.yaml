# Terms introduced in Unit 28 (Git and GitHub). `lesson` is the id of the lesson that introduces the term.
terms:
- term: GitHub
  definition: A website that stores Git repositories online so that people can share and review them.
  lesson: u28-snapshots
- term: SHA-1
  definition: The hash function Git uses; it gives 40 hexadecimal characters.
  lesson: u28-snapshots
- term: Object store
  definition: The place where Git keeps all its objects, each named by its hash.
  lesson: u28-snapshots
- term: Content-addressed storage
  definition: Storing data under a name computed from the data itself.
  lesson: u28-snapshots
- term: Commit message
  definition: The short text that explains why a commit was made.
  lesson: u28-snapshots
- term: Staging area
  definition: The place where you collect the changes that will go into the next commit.
  lesson: u28-snapshots
- term: Main branch
  definition: The branch that holds the stable, finished version of a project.
  lesson: u28-branches
- term: Working folder
  definition: The folder of files that you are editing now.
  lesson: u28-branches
- term: Clean
  definition: Having no changes since the last commit.
  lesson: u28-branches
- term: Ancestor
  definition: A commit that can be reached by following parent links backwards.
  lesson: u28-branches
- term: Ahead and behind
  definition: How many commits a branch has that another lacks, and how many it is missing.
  lesson: u28-branches
- term: Detached HEAD
  definition: Being on a commit directly instead of on a branch.
  lesson: u28-branches
- term: Diff
  definition: The list of changes that turns one version of a text into another.
  lesson: u28-diff
- term: Patch
  definition: A diff that can be applied to a text to make the same change.
  lesson: u28-diff
- term: Unified diff
  definition: The common text format for diffs, with lines marked by a space, a minus or a plus.
  lesson: u28-diff
- term: Insertion
  definition: A line added by a change.
  lesson: u28-diff
- term: Deletion
  definition: A line removed by a change.
  lesson: u28-diff
- term: Blame
  definition: A report that shows which commit last changed each line of a file.
  lesson: u28-diff
- term: Hunk
  definition: One group of changed lines in a diff.
  lesson: u28-diff
- term: Conflict marker
  definition: The lines such as <<<<<<< and ======= that Git writes into a file to show a conflict.
  lesson: u28-merge
- term: Common ancestor
  definition: A commit that is in the history of both branches.
  lesson: u28-merge
- term: Remote
  definition: Another copy of a repository, usually on a server.
  lesson: u28-remote
- term: Clone
  definition: To copy a whole repository, with its history, to your computer.
  lesson: u28-remote
- term: Pull
  definition: To fetch and then merge the remote changes into your branch.
  lesson: u28-remote
- term: Push
  definition: To upload your commits to a remote.
  lesson: u28-remote
- term: Remote-tracking branch
  definition: A label such as origin/main that remembers where a remote branch was.
  lesson: u28-remote
- term: Rejected push
  definition: A push that Git refuses because it would not be a fast-forward.
  lesson: u28-remote
- term: Distributed
  definition: Spread over many computers that each hold a full copy.
  lesson: u28-remote
- term: Issue
  definition: A tracked task, bug report or question on GitHub.
  lesson: u28-remote
- term: GitHub flow
  definition: 'A simple way of working: branch, commit, open a pull request, review, merge.'
  lesson: u28-remote
- term: Gitignore
  definition: A file that lists patterns of files Git should not track.
  lesson: u28-workflow
- term: Revert
  definition: To undo a commit by making a new commit that reverses it.
  lesson: u28-workflow
- term: Reset
  definition: To move a branch back to an earlier commit.
  lesson: u28-workflow
- term: Cherry-pick
  definition: To copy the change of one commit onto another branch.
  lesson: u28-workflow
- term: Bisect
  definition: Finding the commit that introduced a bug by binary search through history.
  lesson: u28-workflow
- term: Conventional commits
  definition: 'A format for commit messages such as feat: or fix: that tools can read.'
  lesson: u28-workflow
- term: Breaking change
  definition: A change that makes existing users' code stop working.
  lesson: u28-workflow
- term: Reflog
  definition: Git's private diary of where your branches used to point, used to recover lost commits.
  lesson: u28-workflow
- term: CODEOWNERS
  definition: A file that says who must review changes to which files.
  lesson: u28-collab
- term: Triage
  definition: Sorting new issues and deciding what to do with them first.
  lesson: u28-collab
- term: GitHub Actions
  definition: GitHub's service for running automatic workflows such as tests.
  lesson: u28-collab
- term: Workflow
  definition: A file that describes automatic jobs to run.
  lesson: u28-collab
- term: Job
  definition: One part of a CI workflow, made of steps.
  lesson: u28-collab
- term: Topological sort
  definition: Putting items in an order so that each comes after the ones it depends on.
  lesson: u28-collab
- term: Branch protection
  definition: Rules that stop direct pushes to a branch and require reviews and passing checks.
  lesson: u28-collab
