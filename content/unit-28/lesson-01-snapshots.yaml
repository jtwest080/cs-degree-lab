      assert file_changes({}, {}) == {"added": [], "modified": [], "deleted": []} and file_changes(old, old) == {"added": [], "modified": [], "deleted": []}
      assert file_changes({"z": "1"}, {}) == {"added": [], "modified": [], "deleted": ["z"]}
