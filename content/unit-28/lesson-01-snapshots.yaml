id: u28-snapshots
title: Snapshots, Hashes and Commits
minutes: 100
objective: 'Understand what Git really is by building its core: a store of objects named by the hash of their content, trees that record folders, and commits that link snapshots into a history. You will meet the real commands (`git init`, `git add`, `git commit`) and then build the machinery behind them yourself.'
outcomes:
- Explain why version control exists
- Compute Git-style content hashes
- Build an object store with blobs, trees and commits
- Read history back from a commit
- Describe what `git add` and `git commit` do
sections:
- heading: Why version control?
  body: |-
    Imagine writing an essay and saving copies: `essay.doc`, `essay-final.doc`, `essay-final-REAL.doc`, `essay-final-REAL-2.doc`. Which one is newest? What changed between them? Who wrote which part? **Version control** solves this. It remembers every saved state of your project, lets you go back to any of them, compares them, and lets several people work at once without overwriting each other. Nearly every software team in the world uses it, and the most popular tool is **Git**.

    Two words you will see everywhere. A **repository** (or "repo") is a project folder together with its complete history. A **commit** is one saved moment in that history: a snapshot of all your files plus a short message saying why you saved it. A good history reads like a diary of the project.

    In a terminal the first steps look like this. You do not need to run them now; the rest of this unit builds the same ideas in Python so that you understand what happens inside.

    ```bash
    git init                      # start a repository in the current folder
    git add notes.txt             # choose what goes into the next snapshot
    git commit -m "Add notes"     # save the snapshot with a message
    git log                       # list the history
    ```

    > **Note:** Git is not GitHub. **Git** is the program on your computer. **GitHub** is a website that stores Git repositories online so that people can share and review them. You can use Git without GitHub, but not the other way round.
- heading: 'Hashes: naming things by their content'
  body: |-
    Git's central trick is to name every piece of data by a **hash** of its content. A **hash function** turns any text into a short, fixed-length "fingerprint" (Git uses **SHA-1**, which gives 40 hexadecimal characters such as `ce013625030ba8dba906f756967f9e9ca394464a`). Two properties matter. The same text always gives the same hash. And even a tiny change gives a completely different, unpredictable hash.

    So the name of a file's contents is also a check that it has not changed. Git stores a file's contents as a **blob** (a "binary large object", just a bag of bytes) in an **object store**: a big dictionary from hash to content. If two files, or two versions of a file, have identical content they share one blob, so unchanged files cost nothing.

    A folder is stored as a **tree**: a list of `name  hash` lines, one per file, where each hash is that file's blob (or a smaller tree for a sub-folder). The tree's own hash depends on every hash inside it, so one changed letter anywhere changes the hash of the whole folder. A tree is therefore a complete **snapshot**.
- heading: Commits form a chain
  body: |-
    A **commit** is a small object holding four things: the hash of a tree (what the project looked like), the hashes of its **parent** commits (what came just before), the author and time, and the message. Because each commit contains its parent's hash, and the parent's hash depends on everything before it, the whole history is **tamper-evident**: changing an old commit would change its hash, and then every later hash too. History is a chain, or more generally a **graph**, of commits pointing backwards.

    This is why Git is fast: it never stores lists of edits. It stores complete snapshots, but shares every unchanged file, so a snapshot only adds the files that changed.

    A **branch** is nothing more than a label that points at one commit, and `HEAD` is the label that says where you are now. When you commit, Git makes the new commit with your current one as its parent and then moves your branch label forward. In the next lessons you will build branches, comparing, merging and sharing on top of the little store you build here.

    > **Key idea:** Everything in Git is an object named by the hash of its content: blobs hold files, trees hold folders, commits hold snapshots and history. The rest is labels that point at commits.
examples:
- title: Hashing
  intro: Real Git hashes, and the avalanche effect.
  code: |
    import hashlib


    def hash_object(text, kind="blob"):
        """Git names every stored thing by a HASH of its content. Real Git builds the bytes `kind + " " + length + a zero byte + the content` (the length is the number of BYTES of the UTF-8 text) and returns their SHA-1 as 40 lowercase hexadecimal characters. Return that string."""
        data = text.encode("utf-8")
        header = (kind + " " + str(len(data))).encode("utf-8") + b"\0"
        return hashlib.sha1(header + data).hexdigest()


    def short_hash(h, n=7):
        """The first n characters of a hash: how people write hashes in practice."""
        return h[:n]


    def store_object(store, kind, text):
        """The OBJECT STORE is a dict {hash: (kind, text)}. Hash the object with hash_object(text, kind), save it in the store and return the hash. Saving the same content twice must not create a second entry."""
        h = hash_object(text, kind)
        store[h] = (kind, text)
        return h


    def read_object(store, h):
        """Return the (kind, text) saved under the hash h. ValueError('unknown object') if it is missing."""
        if h not in store:
            raise ValueError("unknown object")
        return store[h]


    def find_by_prefix(store, prefix):
        """People type only the start of a hash. Return the FULL hash in the store that starts with the prefix. ValueError('prefix too short') if the prefix has fewer than 4 characters, ValueError('unknown object') if nothing matches and ValueError('ambiguous prefix') if more than one hash matches. (Check them in that order.)"""
        if len(prefix) < 4:
            raise ValueError("prefix too short")
        found = [h for h in store if h.startswith(prefix)]
        if not found:
            raise ValueError("unknown object")
        if len(found) > 1:
            raise ValueError("ambiguous prefix")
        return found[0]


    def make_tree(store, files):
        """A TREE records a whole folder. `files` is a dict {path: text}. Save every file as a "blob" object, then build the tree text: one line `path hash` per file, sorted by path, joined with newlines (no newline at the end). Save it as a "tree" object and return its hash. The order in which files were added to the dict must not matter. An empty dict gives an empty tree text."""
        lines = []
        for path in sorted(files):
            h = store_object(store, "blob", files[path])
            lines.append(path + " " + h)
        return store_object(store, "tree", "\n".join(lines))


    def read_tree(store, h):
        """The reverse of make_tree: return the dict {path: text} of the tree object h. (A tree line is `path hash`; split it at the LAST space, then read the blob.)"""
        kind, text = read_object(store, h)
        files = {}
        for line in text.split("\n"):
            if line:
                path, blob = line.rsplit(" ", 1)
                files[path] = read_object(store, blob)[1]
        return files


    def make_commit(store, tree, parents, message, author, time):
        """A COMMIT points at a tree (the snapshot) and at its parent commits (its history). Build the text with these lines, in order: `tree <tree hash>`, then one `parent <hash>` line per parent, then `author <author> <time>`, then an empty line, then the message. Join with newlines, save it as a "commit" object and return its hash."""
        lines = ["tree " + tree]
        for p in parents:
            lines.append("parent " + p)
        lines.append("author " + author + " " + str(time))
        lines.append("")
        lines.append(message)
        return store_object(store, "commit", "\n".join(lines))


    def read_commit(store, h):
        """Parse a commit object back into a dict {"tree": hash, "parents": [hashes], "author": name, "time": int, "message": text}. (The author line is `author <name> <time>`: the time is the last word and the name is everything before it. The message is everything after the first empty line.) ValueError('not a commit') if the object is of another kind."""
        kind, text = read_object(store, h)
        if kind != "commit":
            raise ValueError("not a commit")
        head, message = text.split("\n\n", 1)
        info = {"tree": None, "parents": [], "author": "", "time": 0, "message": message}
        for line in head.split("\n"):
            key, value = line.split(" ", 1)
            if key == "tree":
                info["tree"] = value
            elif key == "parent":
                info["parents"].append(value)
            elif key == "author":
                name, when = value.rsplit(" ", 1)
                info["author"], info["time"] = name, int(when)
        return info

    store = {}
    print("hash of 'hello\\n':", hash_object("hello\n"))
    print("short:", short_hash(hash_object("hello\n")))
    print("same text, same hash:", hash_object("abc") == hash_object("abc"))
    print("one letter changed:", short_hash(hash_object("abc")), short_hash(hash_object("abd")))
  output: |
    hash of 'hello\n': ce013625030ba8dba906f756967f9e9ca394464a
    short: ce01362
    same text, same hash: True
    one letter changed: f2ba8f8 d4a5aa5
  lines:
  - line: 92
    note: Real Git prints this same hash for a file containing hello.
  - line: 93
    note: Hashes are usually shown shortened.
  - line: 94
    note: Same content, same name.
  - line: 95
    note: A one-letter change gives an unrelated hash.
- title: A tiny repository
  intro: Two commits, their parent link and the files that changed.
  code: |
    import hashlib


    def hash_object(text, kind="blob"):
        """Git names every stored thing by a HASH of its content. Real Git builds the bytes `kind + " " + length + a zero byte + the content` (the length is the number of BYTES of the UTF-8 text) and returns their SHA-1 as 40 lowercase hexadecimal characters. Return that string."""
        data = text.encode("utf-8")
        header = (kind + " " + str(len(data))).encode("utf-8") + b"\0"
        return hashlib.sha1(header + data).hexdigest()


    def short_hash(h, n=7):
        """The first n characters of a hash: how people write hashes in practice."""
        return h[:n]


    def store_object(store, kind, text):
        """The OBJECT STORE is a dict {hash: (kind, text)}. Hash the object with hash_object(text, kind), save it in the store and return the hash. Saving the same content twice must not create a second entry."""
        h = hash_object(text, kind)
        store[h] = (kind, text)
        return h


    def read_object(store, h):
        """Return the (kind, text) saved under the hash h. ValueError('unknown object') if it is missing."""
        if h not in store:
            raise ValueError("unknown object")
        return store[h]


    def find_by_prefix(store, prefix):
        """People type only the start of a hash. Return the FULL hash in the store that starts with the prefix. ValueError('prefix too short') if the prefix has fewer than 4 characters, ValueError('unknown object') if nothing matches and ValueError('ambiguous prefix') if more than one hash matches. (Check them in that order.)"""
        if len(prefix) < 4:
            raise ValueError("prefix too short")
        found = [h for h in store if h.startswith(prefix)]
        if not found:
            raise ValueError("unknown object")
        if len(found) > 1:
            raise ValueError("ambiguous prefix")
        return found[0]


    def make_tree(store, files):
        """A TREE records a whole folder. `files` is a dict {path: text}. Save every file as a "blob" object, then build the tree text: one line `path hash` per file, sorted by path, joined with newlines (no newline at the end). Save it as a "tree" object and return its hash. The order in which files were added to the dict must not matter. An empty dict gives an empty tree text."""
        lines = []
        for path in sorted(files):
            h = store_object(store, "blob", files[path])
            lines.append(path + " " + h)
        return store_object(store, "tree", "\n".join(lines))


    def read_tree(store, h):
        """The reverse of make_tree: return the dict {path: text} of the tree object h. (A tree line is `path hash`; split it at the LAST space, then read the blob.)"""
        kind, text = read_object(store, h)
        files = {}
        for line in text.split("\n"):
            if line:
                path, blob = line.rsplit(" ", 1)
                files[path] = read_object(store, blob)[1]
        return files


    def make_commit(store, tree, parents, message, author, time):
        """A COMMIT points at a tree (the snapshot) and at its parent commits (its history). Build the text with these lines, in order: `tree <tree hash>`, then one `parent <hash>` line per parent, then `author <author> <time>`, then an empty line, then the message. Join with newlines, save it as a "commit" object and return its hash."""
        lines = ["tree " + tree]
        for p in parents:
            lines.append("parent " + p)
        lines.append("author " + author + " " + str(time))
        lines.append("")
        lines.append(message)
        return store_object(store, "commit", "\n".join(lines))


    def read_commit(store, h):
        """Parse a commit object back into a dict {"tree": hash, "parents": [hashes], "author": name, "time": int, "message": text}. (The author line is `author <name> <time>`: the time is the last word and the name is everything before it. The message is everything after the first empty line.) ValueError('not a commit') if the object is of another kind."""
        kind, text = read_object(store, h)
        if kind != "commit":
            raise ValueError("not a commit")
        head, message = text.split("\n\n", 1)
        info = {"tree": None, "parents": [], "author": "", "time": 0, "message": message}
        for line in head.split("\n"):
            key, value = line.split(" ", 1)
            if key == "tree":
                info["tree"] = value
            elif key == "parent":
                info["parents"].append(value)
            elif key == "author":
                name, when = value.rsplit(" ", 1)
                info["author"], info["time"] = name, int(when)
        return info


    def new_repo():
        """A REPOSITORY holds everything: return {"store": {}, "branches": {"main": None}, "head": "main", "clock": 0}. `branches` maps a branch name to the hash of its newest commit (None while it has none), `head` is the name of the branch you are on and `clock` is a counter that gives commits a time."""
        return {"store": {}, "branches": {"main": None}, "head": "main", "clock": 0}


    def commit_snapshot(repo, files, message, author):
        """Save a new commit of the whole folder `files` on the current branch. Add 1 to repo["clock"] and use it as the commit time; save the tree with make_tree and make the commit (its only parent is the branch's current newest commit, if there is one); move the branch to the new commit and return its hash."""
        repo["clock"] += 1
        tree = make_tree(repo["store"], files)
        tip = repo["branches"][repo["head"]]
        parents = [tip] if tip else []
        h = make_commit(repo["store"], tree, parents, message, author, repo["clock"])
        repo["branches"][repo["head"]] = h
        return h


    def snapshot_of(repo, commit_hash):
        """The dict {path: text} of all files as they were in that commit."""
        info = read_commit(repo["store"], commit_hash)
        return read_tree(repo["store"], info["tree"])


    def file_changes(old, new):
        """Compare two folders (dicts {path: text}). Return {"added": [...], "modified": [...], "deleted": [...]}: each a sorted list of paths that are only in `new`, in both but with different text, or only in `old`."""
        return {
            "added": sorted(p for p in new if p not in old),
            "modified": sorted(p for p in new if p in old and new[p] != old[p]),
            "deleted": sorted(p for p in old if p not in new),
        }

    repo = new_repo()
    c1 = commit_snapshot(repo, {"app.py": "print('v1')\n", "README": "hi\n"}, "first version", "Ada")
    c2 = commit_snapshot(repo, {"app.py": "print('v2')\n", "README": "hi\n"}, "change the app", "Ada")
    print("commit 1:", short_hash(c1), "| commit 2:", short_hash(c2))
    print("parent of commit 2 is commit 1:", read_commit(repo["store"], c2)["parents"] == [c1])
    print("objects stored:", len(repo["store"]))
    print("changes:", file_changes(snapshot_of(repo, c1), snapshot_of(repo, c2)))
    print(repo["store"][c2][1])
  output: |
    commit 1: f61c94f | commit 2: ffe99dd
    parent of commit 2 is commit 1: True
    objects stored: 7
    changes: {'added': [], 'modified': ['app.py'], 'deleted': []}
    tree e4beffc478abfbc008a86e9ab2be06619fd2d290
    parent f61c94f4d4aa755f1b2d32fd7acd32dfb9ea59e9
    author Ada 2

    change the app
