        tip = repo["branches"][repo["head"]]
        base = snapshot_of(repo, tip) if tip else {}
        return file_changes(base, working)


    def is_clean(repo, working):
        """True when there are no changes at all."""
        s = status(repo, working)
        return not (s["added"] or s["modified"] or s["deleted"])


    def safe_switch(repo, name, working):
        """Switch to a branch, like `git switch`, but refuse if you would lose uncommitted work: ValueError('uncommitted changes') if the working folder is not clean (check this first); ValueError('no such branch') for an unknown branch. Otherwise make it the current branch and return the dict of files of its newest commit (an empty dict if it has none)."""
        if not is_clean(repo, working):
