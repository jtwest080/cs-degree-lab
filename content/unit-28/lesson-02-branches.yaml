        return [("* " if n == repo["head"] else "  ") + n for n in sorted(repo["branches"])]


    def delete_branch(repo, name):
        """Delete a branch label (the commits stay in the store). ValueError('no such branch') if missing; ValueError('cannot delete current branch') for the branch you are on. (Check 'no such branch' first.)"""
