- id: log
  title: History and the log
  difficulty: 3
  prompt: 'Every commit points at its parent, so a branch''s **history** is a chain you can walk. All the earlier helpers are given. Write `log_hashes(repo, start=None)`: starting at `start` (a commit hash; by default the newest commit of the current branch) follow the **first parent** again and again and return the list of commit hashes, newest first (an empty list if the branch has no commits). Write `log_lines(repo, start=None)`: what `git log --oneline` prints: for each commit the 7-character short hash, a space, and the **first line** of its message.'
