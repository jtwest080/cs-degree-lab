id: u28-branches
title: Branches and History
minutes: 100
objective: Learn that a branch is only a label on a commit, and use that to understand `git branch`, `git switch`, `git log` and `git status`. You will build history walking, branch management, ancestor queries and the 'ahead and behind' counts that GitHub shows.
outcomes:
- Walk a commit history
- Create, list, switch and delete branches
- Compute ancestors and commit ranges
- Explain what git status compares
- Count how far two branches have diverged
sections:
- heading: History and the log
  body: |-
    Each commit stores the hash of its parent, so history is a chain you can walk backwards: start at the newest commit, read its parent, read that parent's parent, and stop at the first commit, which has none. That walk is exactly what `git log` does. The version `git log --oneline` prints one short line per commit: the first seven characters of the hash and the first line of the message.

    ```bash
    git log --oneline
    # 3f2a9c1 Add search box
    # b81d0e4 Fix typo in header
    # 9a7c5d2 First version
    ```

    A good **commit message** is a short summary line (under about 50 characters, in the imperative: "Add search box", not "added stuff"), then optionally an empty line and a longer explanation of *why*. Months later you will read these to understand what the project did and why.
- heading: A branch is a sticky note
  body: |-
    Working on a new idea in the main version of a project is risky: if it goes wrong, everyone is affected. A **branch** is a separate line of development. You try your idea on your own branch and join it back into the main one only when it works.

    The surprising thing is how cheap this is. A branch is not a copy of the files. It is just a **name that points at one commit**, like a sticky note on a page of the history. `HEAD` is the pointer that says which branch you are on now. When you commit, Git creates the new commit with the current commit as its parent and then moves the sticky note of your current branch forward to it. Other branches stay where they were.

    ```bash
    git branch                 # list branches; * marks the current one
    git switch -c idea         # create a branch called idea and move to it
    git switch main            # go back to main
    git branch -d idea         # delete the label (the commits are kept)
    ```

    In the main branch of most projects (called `main` or older `master`) work is finished and stable; feature branches hold work in progress.
- heading: What git status compares
  body: |-
    You edit files in your **working folder**. Git does not see those edits as history until you commit them, so there are three places: the working folder (what you are editing), the **staging area** (what you chose to include in the next commit with `git add`) and the **repository** (the saved commits). Our simplified model skips the staging area and compares the working folder with the newest commit.

    `git status` reports the difference: files that are **new**, **modified** or **deleted** since the last commit. If it prints nothing to commit, the working folder is **clean**. Git will refuse to switch branches if that would overwrite changes you have not saved, which protects you from losing work.

    Because history is a graph, you can also ask about relationships: which commits are on my branch but not on `main`? That set difference is what GitHub shows as "2 commits ahead, 1 commit behind". It will be the heart of merging in the next lesson.
