        """The one-line summary of `git diff --stat`: '<n> file(s) changed, <i> insertion(s)(+), <d> deletion(s)(-)'. Use 'file' for 1 and 'files' otherwise, 'insertion' for 1 and 'insertions' otherwise, 'deletion' for 1 and 'deletions' otherwise; leave out the insertions part if there are none and the deletions part if there are none. With no changed file at all return 'no changes'."""
        changes = diff_folders(old, new)
        if not changes:
            return "no changes"
        ins = sum(diff_stats(ops)[0] for ops in changes.values())
        dele = sum(diff_stats(ops)[1] for ops in changes.values())
        n = len(changes)
        parts = ["%d file%s changed" % (n, "" if n == 1 else "s")]
        if ins:
            parts.append("%d insertion%s(+)" % (ins, "" if ins == 1 else "s"))
        if dele:
            parts.append("%d deletion%s(-)" % (dele, "" if dele == 1 else "s"))
        return ", ".join(parts)
