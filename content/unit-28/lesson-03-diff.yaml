  prompt: 'To show what changed, Git first finds what stayed the same: the **longest common subsequence** (LCS) of the old and new lines, the longest list of lines that appear in both **in the same order** (not necessarily next to each other). Write `lcs_table(a, b)`: a table `t` with `len(a) + 1` rows and `len(b) + 1` columns where `t[i][j]` is the length of the LCS of `a[i:]` and `b[j:]`; the last row and last column are all 0; fill the rest from the bottom right: if `a[i] == b[j]` then `t[i][j] = 1 + t[i+1][j+1]`, otherwise the larger of `t[i+1][j]` and `t[i][j+1]`. Write `lcs_length(a, b)`: the length (the top-left cell). Write `lcs(a, b)`: the subsequence itself: walk from `(0, 0)`: if `a[i] == b[j]` take that line and move diagonally; otherwise move down (`i + 1`) if `t[i+1][j] >= t[i][j+1]`, else right (`j + 1`).'
