            for j in range(len(b) - 1, -1, -1):
                if a[i] == b[j]:
                    t[i][j] = 1 + t[i + 1][j + 1]
                else:
                    t[i][j] = max(t[i + 1][j], t[i][j + 1])
        return t


    def lcs_length(a, b):
