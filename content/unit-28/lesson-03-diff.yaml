id: u28-diff
title: Diff and Patch
minutes: 100
objective: 'Learn how Git (and every code-review tool) shows what changed: the longest common subsequence, the diff of two files, patches that can be applied and reversed, and a blame report that says who last changed each line.'
outcomes:
- Compute a longest common subsequence
- Write a line diff
- Apply and reverse a patch
- Summarise changes across files
- Find who last changed each line
sections:
- heading: What changed?
  body: |-
    Because Git stores snapshots, it does not remember *edits*; it works them out by comparing two snapshots. This comparison is called a **diff**. You use it constantly: `git diff` shows what you changed since the last commit, and every pull request on GitHub is a diff shown in red (removed) and green (added).

    ```bash
    git diff                   # changes not yet committed
    git diff main..feature     # what feature changed compared to main
    git show 3f2a9c1           # the changes made by one commit
    ```

    The challenge is to find a *small* description of the change. If you only compared line 1 to line 1, line 2 to line 2, and so on, then inserting one line at the top would look as if every line had changed. A good diff notices that most lines are still there, just shifted.
- heading: The longest common subsequence
  body: |-
    The idea is to find the **longest common subsequence** (LCS) of the old and new lines: the longest list of lines that appear in both files, in the same order, though not necessarily side by side. Everything in that list is unchanged. Every old line outside it was **deleted**, and every new line outside it was **inserted**.

    Finding it is a classic use of **dynamic programming** (Unit 8). Let `t[i][j]` be the length of the LCS of the old lines from `i` on and the new lines from `j` on. If the two current lines are equal, they belong to the LCS and `t[i][j] = 1 + t[i+1][j+1]`. If not, one of them must be skipped, so `t[i][j]` is the larger of the two neighbours. Fill the table from the end, then walk from the top left reading off the decisions. The cost is the product of the two lengths, so for files of a thousand lines it takes about a million steps: instant.

    A diff is then the list of operations `=` (keep), `-` (delete) and `+` (insert). Real Git uses faster, cleverer algorithms (Myers' diff) that give similar results.
- heading: Patches, reverse and blame
  body: |-
    A diff is more than a picture: it is a **patch**, a recipe to turn the old file into the new one. Sending someone a patch lets them apply your change to their copy. A patch only fits the text it was made from; if the lines do not match, it **fails to apply**, which is exactly the situation that produces merge conflicts in the next lesson.

    Patches are reversible: swap every insertion for a deletion and the patch **undoes** the change. This is how `git revert` can undo an old commit without rewriting history.

    Finally, `git blame file.py` shows for every line the commit that last changed it. You get it by walking forward through the file's versions: compute the diff between each pair, let lines that were kept keep their old owner, and give new lines to the new version. The point is not to find someone to blame but to read the commit message that explains why a puzzling line exists.

    > **Tip:** When a line looks strange, run blame, then read the commit message and the whole change. It usually explains the *why* that the code cannot.
examples:
- title: A diff of two versions
  intro: The changed function, as the red and green of a pull request.
  code: |
    def lcs_table(a, b):
        """The LONGEST COMMON SUBSEQUENCE (LCS) of two lists of lines is the longest list of lines that appear in both, in the same order (not necessarily next to each other). Build a table t with len(a) + 1 rows and len(b) + 1 columns where t[i][j] is the length of the LCS of a[i:] and b[j:]. The last row and last column are all 0; fill the rest from the bottom right: if a[i] == b[j] then t[i][j] = 1 + t[i+1][j+1], otherwise the larger of t[i+1][j] and t[i][j+1]."""
        t = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
        for i in range(len(a) - 1, -1, -1):
            for j in range(len(b) - 1, -1, -1):
                if a[i] == b[j]:
                    t[i][j] = 1 + t[i + 1][j + 1]
                else:
                    t[i][j] = max(t[i + 1][j], t[i][j + 1])
        return t


    def lcs_length(a, b):
        """The length of the longest common subsequence of the two lists."""
        return lcs_table(a, b)[0][0]


    def lcs(a, b):
        """The longest common subsequence itself as a list. Walk through the table from (0, 0): if a[i] == b[j] take that line and move diagonally; otherwise move down (i + 1) if t[i+1][j] >= t[i][j+1], else right (j + 1)."""
        t = lcs_table(a, b)
        i = j = 0
        out = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                out.append(a[i])
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                i += 1
            else:
                j += 1
        return out


    def diff_lines(a, b):
        """The DIFF of two lists of lines: the list of operations (tag, line) that turns a into b, where tag "=" keeps a line, "-" deletes a line of a and "+" inserts a line of b. Use the table of lcs_table and walk from (0, 0): if a[i] == b[j] emit "=" and move diagonally; otherwise if t[i+1][j] >= t[i][j+1] emit "-" for a[i] and move down, else emit "+" for b[j] and move right. When one list is used up, emit the rest of the other (deletions for a, insertions for b)."""
        t = lcs_table(a, b)
        i = j = 0
        ops = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                ops.append(("=", a[i]))
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                ops.append(("-", a[i]))
                i += 1
            else:
                ops.append(("+", b[j]))
                j += 1
        while i < len(a):
            ops.append(("-", a[i]))
            i += 1
        while j < len(b):
            ops.append(("+", b[j]))
            j += 1
        return ops


    def format_diff(ops):
        """Print the diff the way Git does: one string per operation: a space for "=", "-" or "+", directly followed by the line."""
        return [(" " if tag == "=" else tag) + line for tag, line in ops]


    def diff_stats(ops):
        """Return (insertions, deletions): how many "+" and how many "-" operations there are."""
        return (sum(1 for t, _ in ops if t == "+"), sum(1 for t, _ in ops if t == "-"))


    old = ["def greet(name):", "    print('Hello ' + name)", "", "greet('Ada')"]
    new = ["def greet(name, punct='!'):", "    print('Hello ' + name + punct)", "", "greet('Ada')", "greet('Bo')"]

    print("lines in common:", lcs_length(old, new))
    for line in format_diff(diff_lines(old, new)):
        print(("|" + line).rstrip())
    print(diff_stats(diff_lines(old, new)))
  output: |
    lines in common: 2
