- title: Patches
  intro: Apply a patch, undo it, see it fail on other text, and summarise a change.
  code: |
    def lcs_table(a, b):
        """The LONGEST COMMON SUBSEQUENCE (LCS) of two lists of lines is the longest list of lines that appear in both, in the same order (not necessarily next to each other). Build a table t with len(a) + 1 rows and len(b) + 1 columns where t[i][j] is the length of the LCS of a[i:] and b[j:]. The last row and last column are all 0; fill the rest from the bottom right: if a[i] == b[j] then t[i][j] = 1 + t[i+1][j+1], otherwise the larger of t[i+1][j] and t[i][j+1]."""
        t = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
        for i in range(len(a) - 1, -1, -1):
            for j in range(len(b) - 1, -1, -1):
                if a[i] == b[j]:
                    t[i][j] = 1 + t[i + 1][j + 1]
                else:
                    t[i][j] = max(t[i + 1][j], t[i][j + 1])
        return t


    def lcs_length(a, b):
        """The length of the longest common subsequence of the two lists."""
        return lcs_table(a, b)[0][0]


    def lcs(a, b):
        """The longest common subsequence itself as a list. Walk through the table from (0, 0): if a[i] == b[j] take that line and move diagonally; otherwise move down (i + 1) if t[i+1][j] >= t[i][j+1], else right (j + 1)."""
        t = lcs_table(a, b)
        i = j = 0
        out = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                out.append(a[i])
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                i += 1
            else:
                j += 1
        return out


    def diff_lines(a, b):
        """The DIFF of two lists of lines: the list of operations (tag, line) that turns a into b, where tag "=" keeps a line, "-" deletes a line of a and "+" inserts a line of b. Use the table of lcs_table and walk from (0, 0): if a[i] == b[j] emit "=" and move diagonally; otherwise if t[i+1][j] >= t[i][j+1] emit "-" for a[i] and move down, else emit "+" for b[j] and move right. When one list is used up, emit the rest of the other (deletions for a, insertions for b)."""
        t = lcs_table(a, b)
        i = j = 0
        ops = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                ops.append(("=", a[i]))
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                ops.append(("-", a[i]))
                i += 1
            else:
                ops.append(("+", b[j]))
                j += 1
        while i < len(a):
            ops.append(("-", a[i]))
            i += 1
        while j < len(b):
            ops.append(("+", b[j]))
            j += 1
        return ops


    def format_diff(ops):
        """Print the diff the way Git does: one string per operation: a space for "=", "-" or "+", directly followed by the line."""
        return [(" " if tag == "=" else tag) + line for tag, line in ops]


    def diff_stats(ops):
        """Return (insertions, deletions): how many "+" and how many "-" operations there are."""
        return (sum(1 for t, _ in ops if t == "+"), sum(1 for t, _ in ops if t == "-"))


    def apply_patch(a, ops):
        """Apply a diff: rebuild the NEW list of lines from the old list `a` and the operations. Go through the operations with a pointer i into `a`: "=" and "-" must match a[i] (otherwise ValueError('patch does not apply')) and move the pointer on; "=" and "+" add their line to the result. After the last operation the pointer must be at the end of `a`, otherwise ValueError('patch does not apply')."""
        i = 0
        out = []
        for tag, line in ops:
            if tag in ("=", "-"):
                if i >= len(a) or a[i] != line:
                    raise ValueError("patch does not apply")
                i += 1
            if tag in ("=", "+"):
                out.append(line)
        if i != len(a):
            raise ValueError("patch does not apply")
        return out


    def reverse_patch(ops):
        """The patch that undoes a patch: swap every "+" for a "-" and every "-" for a "+", keeping the order and the "=" lines."""
        swap = {"+": "-", "-": "+", "=": "="}
        return [(swap[t], line) for t, line in ops]


    def split_lines(text):
        """The lines of a text without their line ends (text.splitlines()); an empty text has no lines."""
        return text.splitlines()


    def diff_folders(old, new):
        """Diff two folders (dicts {path: text}). Return a dict {path: ops} for every path whose text changed, including added files (diffed against no lines) and deleted files (diffed against no lines); unchanged files are left out. Use diff_lines on split_lines."""
        out = {}
        for path in sorted(set(old) | set(new)):
            a = split_lines(old[path]) if path in old else []
            b = split_lines(new[path]) if path in new else []
            if old.get(path) != new.get(path):
                out[path] = diff_lines(a, b)
        return out


    def summary(old, new):
        """The one-line summary of `git diff --stat`: '<n> file(s) changed, <i> insertion(s)(+), <d> deletion(s)(-)'. Use 'file' for 1 and 'files' otherwise, 'insertion' for 1 and 'insertions' otherwise, 'deletion' for 1 and 'deletions' otherwise; leave out the insertions part if there are none and the deletions part if there are none. With no changed file at all return 'no changes'."""
        changes = diff_folders(old, new)
        if not changes:
            return "no changes"
        ins = sum(diff_stats(ops)[0] for ops in changes.values())
        dele = sum(diff_stats(ops)[1] for ops in changes.values())
        n = len(changes)
        parts = ["%d file%s changed" % (n, "" if n == 1 else "s")]
        if ins:
            parts.append("%d insertion%s(+)" % (ins, "" if ins == 1 else "s"))
        if dele:
            parts.append("%d deletion%s(-)" % (dele, "" if dele == 1 else "s"))
        return ", ".join(parts)


    old = ["def greet(name):", "    print('Hello ' + name)", "", "greet('Ada')"]
    new = ["def greet(name, punct='!'):", "    print('Hello ' + name + punct)", "", "greet('Ada')", "greet('Bo')"]

    patch = diff_lines(old, new)
    print("apply the patch:", apply_patch(old, patch) == new)
    print("undo the patch:", apply_patch(new, reverse_patch(patch)) == old)
    try:
        apply_patch(["something else"], patch)
    except ValueError as err:
        print("on other text:", err)
    before = {"app.py": "\n".join(old) + "\n", "notes.txt": "todo\n"}
    after = {"app.py": "\n".join(new) + "\n", "notes.txt": "todo\n", "new.txt": "hi\n"}
    print(summary(before, after))
  output: |
    apply the patch: True
    undo the patch: True
    on other text: patch does not apply
    2 files changed, 4 insertions(+), 2 deletions(-)
