  tests:
  - name: simple changes
    code: |
      assert diff_lines(["a", "b", "c"], ["a", "B", "c"]) == [("=", "a"), ("-", "b"), ("+", "B"), ("=", "c")]
      assert diff_lines(["a", "b"], ["a", "b", "c"]) == [("=", "a"), ("=", "b"), ("+", "c")]
      assert diff_lines(["a", "b", "c"], ["a", "c"]) == [("=", "a"), ("-", "b"), ("=", "c")]
      assert diff_lines([], ["x", "y"]) == [("+", "x"), ("+", "y")] and diff_lines(["x"], []) == [("-", "x")] and diff_lines([], []) == [] and diff_lines(["s"], ["s"]) == [("=", "s")]
  - name: a bigger change
    code: |
      old = ["def f(x):", "    return x", "", "print(f(1))"]
      new = ["def f(x):", "    y = x * 2", "    return y", "", "print(f(1))", "print(f(2))"]
      ops = diff_lines(old, new)
      assert ops == [("=", "def f(x):"), ("-", "    return x"), ("+", "    y = x * 2"), ("+", "    return y"), ("=", ""), ("=", "print(f(1))"), ("+", "print(f(2))")]
