      assert shared_prefix([1, 2, 3], [1, 2, 9]) == [1, 2] and shared_prefix([], [1]) == [] and shared_prefix(["a"], ["a"]) == ["a"] and shared_prefix([1, 2], [3, 2]) == []
  solution: |
    def shared_prefix(a, b):
        out = []
        for x, y in zip(a, b):
            if x != y:
                break
            out.append(x)
        return out
