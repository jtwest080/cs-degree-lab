    commit_snapshot(repo, {"page.txt": "heading\nline one\nline two\n"}, "Start the page", "Ada")
    create_branch(repo, "style")
    commit_snapshot(repo, {"page.txt": "HEADING\nline one\nline two\n"}, "Shout the heading", "Ada")
    switch(repo, "style")
    commit_snapshot(repo, {"page.txt": "heading\nline one\nline 2\n"}, "Number the line", "Bo")
