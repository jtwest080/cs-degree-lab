id: u28-merge
title: Merging and Conflicts
minutes: 110
objective: Understand `git merge`. You will find the merge base, merge two edited versions of a text with the version they both started from, merge whole folders, build a real merge that makes a two-parent commit, and resolve conflicts by hand.
outcomes:
- Find the merge base of two commits
- Tell fast-forward from true merges
- Merge text with a three-way merge
- Recognise and resolve conflicts
- Record a merge commit
sections:
- heading: Why merging is not obvious
  body: |-
    Suppose you and a colleague both start from the same page of text. You change the title. They add a paragraph at the end. When you join the two versions, it is clear what should happen: keep both changes. But comparing only your file and theirs, the computer cannot tell whether a difference is *your* change or *theirs*. It needs the version you both started from, the **merge base** (also called the **common ancestor**).

    With three versions, the rule is simple. A line that only one side changed takes that side's change. A line that both sides changed in the same way is taken once. Only a line that both sides changed **differently** is a **conflict**, and a human must decide. This is a **three-way merge**.

    ```bash
    git switch main
    git merge feature       # bring the feature branch's work into main
    ```
- heading: Fast-forward and merge commits
  body: |-
    Finding the merge base means finding the nearest commit that is an ancestor of both branch tips, which is a question about the history graph from the last lesson.

    Sometimes no merge is needed. If `main` has not moved since you branched, then your branch is simply `main` plus some new commits, and Git just moves the `main` label forward to your tip. This is a **fast-forward**: no new commit is created. If the branch you are merging is already contained in your history, Git says **Already up to date**.

    When both branches have new commits, Git makes a **merge commit**: a commit with **two parents** (your branch's tip and the other tip) whose snapshot is the merged files. A merge commit is what ties the histories together, and why the commit graph is a graph rather than a straight line.
- heading: Conflicts
  body: |-
    When Git cannot decide, it stops and marks the file:

    ```text
    <<<<<<< ours
    the line as you wrote it
    =======
    the line as they wrote it
    >>>>>>> theirs
    ```

    Do not panic: a conflict is normal and is not an error. Open the file, decide what the line should say (yours, theirs, both, or something new), delete the three marker lines, then `git add` the file and `git commit` to finish. Until you do, the merge is unfinished, and nothing has been lost; you can even abandon it with `git merge --abort`.

    A few habits make conflicts rare and small: commit small changes often, merge the main branch into your feature branch regularly so you never drift far, and keep files focused so that two people seldom edit the same lines. Our model is simplified: when one side changes a line and the other deletes it, real Git reports a conflict where ours takes the change. Real merges also detect moved and renamed files.

    > **Warning:** Never leave conflict markers in a file you commit. Searching for `<<<<<<<` before committing is a good habit; our `finish_merge` refuses in the same way.
