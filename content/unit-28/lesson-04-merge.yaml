    create_branch(repo2, "other")
    commit_snapshot(repo2, {"a": "main\n"}, "main edit", "Ada")
    switch(repo2, "other")
    commit_snapshot(repo2, {"a": "other\n"}, "other edit", "Bo")
    switch(repo2, "main")
    clash = merge_branch(repo2, "other", "Ada")
