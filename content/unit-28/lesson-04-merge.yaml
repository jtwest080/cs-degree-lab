        return lcs_table(a, b)[0][0]


    def lcs(a, b):
        """The longest common subsequence itself as a list. Walk through the table from (0, 0): if a[i] == b[j] take that line and move diagonally; otherwise move down (i + 1) if t[i+1][j] >= t[i][j+1], else right (j + 1)."""
        t = lcs_table(a, b)
        i = j = 0
        out = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                out.append(a[i])
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                i += 1
            else:
                j += 1
        return out


    def diff_lines(a, b):
        """The DIFF of two lists of lines: the list of operations (tag, line) that turns a into b, where tag "=" keeps a line, "-" deletes a line of a and "+" inserts a line of b. Use the table of lcs_table and walk from (0, 0): if a[i] == b[j] emit "=" and move diagonally; otherwise if t[i+1][j] >= t[i][j+1] emit "-" for a[i] and move down, else emit "+" for b[j] and move right. When one list is used up, emit the rest of the other (deletions for a, insertions for b)."""
        t = lcs_table(a, b)
        i = j = 0
        ops = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                ops.append(("=", a[i]))
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                ops.append(("-", a[i]))
                i += 1
            else:
                ops.append(("+", b[j]))
                j += 1
        while i < len(a):
            ops.append(("-", a[i]))
            i += 1
        while j < len(b):
            ops.append(("+", b[j]))
            j += 1
        return ops


    def format_diff(ops):
        """Print the diff the way Git does: one string per operation: a space for "=", "-" or "+", directly followed by the line."""
        return [(" " if tag == "=" else tag) + line for tag, line in ops]


    def diff_stats(ops):
        """Return (insertions, deletions): how many "+" and how many "-" operations there are."""
        return (sum(1 for t, _ in ops if t == "+"), sum(1 for t, _ in ops if t == "-"))


    def split_lines(text):
        """The lines of a text without their line ends (text.splitlines()); an empty text has no lines."""
        return text.splitlines()


    def merge_lines(base, ours, theirs):
        """THREE-WAY MERGE of lists of lines. `base` is the common ancestor, `ours` and `theirs` are the two changed versions. Use diff_lines(base, other) to record, for each side, which base lines were deleted and which lines were inserted before each base position (an insertion that comes after the "-" of base line i belongs to position i + 1; position len(base) means the end). Then build the result by going through the positions i = 0 .. len(base): first the inserted lines of position i: if both sides inserted the same lines use them once, if only one side inserted lines use those, if both inserted DIFFERENT lines write a CONFLICT: the line '<<<<<<< ours', our lines, '=======', their lines, '>>>>>>> theirs'. Then (for i < len(base)) keep base[i] unless at least one side deleted it. Return (merged lines, True if there was a conflict)."""
        def changes(other):
            ins = {i: [] for i in range(len(base) + 1)}
            deleted = set()
            i = 0
            for tag, line in diff_lines(base, other):
                if tag == "+":
                    ins[i].append(line)
                elif tag == "-":
                    deleted.add(i)
                    i += 1
                else:
                    i += 1
            return ins, deleted

        o_ins, o_del = changes(ours)
        t_ins, t_del = changes(theirs)
        out, conflict = [], False
        for i in range(len(base) + 1):
            a, b = o_ins[i], t_ins[i]
            if a == b or not b:
                out.extend(a)
            elif not a:
                out.extend(b)
            else:
                conflict = True
                out.append("<<<<<<< ours")
                out.extend(a)
                out.append("=======")
                out.extend(b)
                out.append(">>>>>>> theirs")
            if i < len(base) and i not in o_del and i not in t_del:
                out.append(base[i])
        return out, conflict


    def merge_base(store, a, b):
        """The BEST COMMON ANCESTOR of commits a and b: the point where their histories split. Take the commits that are ancestors of both (each commit counts as its own ancestor); drop every one that is a proper ancestor of another common commit; if several remain return the one with the latest commit time (ties: the larger hash). None if they share no history."""
        common = ancestors(store, a) & ancestors(store, b)
        best = [c for c in common if not any(c != d and c in ancestors(store, d) for d in common)]
        if not best:
            return None
        return max(best, key=lambda c: (read_commit(store, c)["time"], c))


    def merge_kind(store, a, b):
        """What merging commit b into commit a needs: 'up-to-date' if b is already in a's history (or equal), 'fast-forward' if a is in b's history (the branch label can just move), otherwise 'merge'."""
        if b in ancestors(store, a):
            return "up-to-date"
        if a in ancestors(store, b):
            return "fast-forward"
        return "merge"


    def merge_files(base, ours, theirs):
        """Merge three folders (dicts {path: text}); a path missing from a dict means the file does not exist there. For every path in any of them: if ours and theirs are equal take that (None means the file is gone); else if ours equals base take theirs; else if theirs equals base take ours; otherwise both changed it differently: if one side deleted the file and the other changed it, that is a conflict and the changed version is kept; if both have text, merge_lines on split_lines (an absent base counts as no lines) and join the result with newlines plus a final newline (an empty result is ''); a conflict from merge_lines is a conflict too. Return (merged folder, sorted list of conflicting paths). Deleted files are left out of the folder."""
        out, conflicts = {}, []
        for path in sorted(set(base) | set(ours) | set(theirs)):
            b, o, t = base.get(path), ours.get(path), theirs.get(path)
            if o == t:
                result = o
            elif o == b:
                result = t
            elif t == b:
                result = o
            elif o is None or t is None:
                result = o if o is not None else t
                conflicts.append(path)
            else:
                lines, bad = merge_lines(split_lines(b) if b is not None else [], split_lines(o), split_lines(t))
                result = "\n".join(lines) + "\n" if lines else ""
                if bad:
                    conflicts.append(path)
            if result is not None:
                out[path] = result
        return out, conflicts


    def merge_branch(repo, other, author):
        """Merge the branch `other` into the CURRENT branch. ValueError('no such branch') if `other` does not exist; ValueError('nothing to merge') if either branch has no commit. Use merge_kind on the two tips: 'up-to-date' returns {"kind": "up-to-date", "commit": the current tip, "conflicts": []}; 'fast-forward' moves the current branch to the other tip and returns {"kind": "fast-forward", "commit": that tip, "conflicts": []}; 'merge' merges the snapshots of the merge base, the current tip and the other tip with merge_files. If there are conflicts change nothing and return {"kind": "conflict", "commit": None, "conflicts": [paths], "files": merged folder}. Otherwise add 1 to repo['clock'], make a commit with TWO parents (current tip first, then the other tip), the message "Merge branch 'NAME'" with the other branch's name, and the merged tree, move the current branch to it and return {"kind": "merge", "commit": its hash, "conflicts": []}."""
        if other not in repo["branches"]:
            raise ValueError("no such branch")
        ours, theirs = repo["branches"][repo["head"]], repo["branches"][other]
        if ours is None or theirs is None:
            raise ValueError("nothing to merge")
        store = repo["store"]
        kind = merge_kind(store, ours, theirs)
        if kind == "up-to-date":
            return {"kind": kind, "commit": ours, "conflicts": []}
        if kind == "fast-forward":
            repo["branches"][repo["head"]] = theirs
            return {"kind": kind, "commit": theirs, "conflicts": []}
        base = merge_base(store, ours, theirs)
        base_files = snapshot_of(repo, base) if base else {}
        files, conflicts = merge_files(base_files, snapshot_of(repo, ours), snapshot_of(repo, theirs))
        if conflicts:
            return {"kind": "conflict", "commit": None, "conflicts": conflicts, "files": files}
        repo["clock"] += 1
        tree = make_tree(store, files)
        h = make_commit(store, tree, [ours, theirs], "Merge branch '" + other + "'", author, repo["clock"])
        repo["branches"][repo["head"]] = h
        return {"kind": "merge", "commit": h, "conflicts": []}


    def has_conflict_markers(text):
        """True if the text contains a line that starts with '<<<<<<< ', a line that is exactly '=======' and a line that starts with '>>>>>>> '."""
        lines = text.split("\n")
        return (any(l.startswith("<<<<<<< ") for l in lines) and "=======" in lines
                and any(l.startswith(">>>>>>> ") for l in lines))


    def resolve(text, choice):
        """Resolve every conflict block of a text. `choice` is 'ours' (keep our lines), 'theirs' (keep their lines) or 'both' (our lines, then theirs); the three marker lines are removed and text outside the blocks is kept. ValueError('bad choice') for another value. A text without markers is returned unchanged."""
        if choice not in ("ours", "theirs", "both"):
            raise ValueError("bad choice")
        out, part = [], None
        for line in text.split("\n"):
            if line.startswith("<<<<<<< "):
                part = "ours"
            elif line == "=======" and part == "ours":
                part = "theirs"
            elif line.startswith(">>>>>>> ") and part == "theirs":
                part = None
            elif part is None or choice == "both" or part == choice:
                out.append(line)
        return "\n".join(out)


    def finish_merge(repo, other, files, author):
        """After you resolved conflicts by hand, record the merge: add 1 to repo['clock'], save `files` as a tree, make a commit with two parents (the current tip, then the tip of `other`) and the message "Merge branch 'NAME'", move the current branch to it and return its hash. ValueError('conflict markers left') if any file still has conflict markers (check this first)."""
        for text in files.values():
            if has_conflict_markers(text):
                raise ValueError("conflict markers left")
        store = repo["store"]
        repo["clock"] += 1
        tree = make_tree(store, files)
        ours, theirs = repo["branches"][repo["head"]], repo["branches"][other]
        h = make_commit(store, tree, [ours, theirs], "Merge branch '" + other + "'", author, repo["clock"])
        repo["branches"][repo["head"]] = h
        return h

