  tests:
  - name: counts
    code: |
      assert ahead_behind_counts(["a", "b", "c"], ["a", "b", "d", "e"]) == (1, 2) and ahead_behind_counts([], []) == (0, 0) and ahead_behind_counts(["a"], ["a"]) == (0, 0) and ahead_behind_counts(["x"], []) == (1, 0)
  solution: |
    def ahead_behind_counts(mine, theirs):
        return len(set(mine) - set(theirs)), len(set(theirs) - set(mine))
