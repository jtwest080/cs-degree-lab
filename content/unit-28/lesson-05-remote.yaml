      def origin():
          r = new_repo()
          commit_snapshot(r, {"a.txt": "1\n2\n3\n"}, "first", "Ada")
          return r

      r = origin()
      create_branch(r, "feature")
      switch(r, "feature")
      commit_snapshot(r, {"a.txt": "f\n2\n3\n"}, "feature", "Bo")
      switch(r, "main")
      commit_snapshot(r, {"a.txt": "m\n2\n3\n"}, "main edit", "Ada")
      prs = []
      p = open_pr(prs, "Clash", "feature", "main", "Bo")
      review(p, "Ada", "approve")
      try:
          merge_pr(r, p, "Ada")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "merge conflict" in str(e)
      assert p["state"] == "open"
