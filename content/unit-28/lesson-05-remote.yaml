      assert p["reviews"] == [("Ada", "comment"), ("Ada", "approve")]
      for fn, msg in ((lambda: open_pr(prs, "x", "main", "main", "Bo"), "same branch"), (lambda: review(p, "Ada", "love it"), "bad verdict")):
          try:
              fn()
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
      p["state"] = "closed"
      try:
          review(p, "Ada", "approve")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "pull request is not open" in str(e)
