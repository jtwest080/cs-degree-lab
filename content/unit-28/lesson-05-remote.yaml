      prs = []
      p = open_pr(prs, "t", "f", "main", "Bo")
      assert not can_merge(p)
      review(p, "Bo", "approve")
      assert not can_merge(p)
      review(p, "Ada", "approve")
      assert can_merge(p) and not can_merge(p, 2)
      review(p, "Cy", "request changes")
