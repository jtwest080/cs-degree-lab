    import hashlib


    def hash_object(text, kind="blob"):
        """Git names every stored thing by a HASH of its content. Real Git builds the bytes `kind + " " + length + a zero byte + the content` (the length is the number of BYTES of the UTF-8 text) and returns their SHA-1 as 40 lowercase hexadecimal characters. Return that string."""
        data = text.encode("utf-8")
        header = (kind + " " + str(len(data))).encode("utf-8") + b"\0"
        return hashlib.sha1(header + data).hexdigest()


    def short_hash(h, n=7):
        """The first n characters of a hash: how people write hashes in practice."""
        return h[:n]


    def store_object(store, kind, text):
        """The OBJECT STORE is a dict {hash: (kind, text)}. Hash the object with hash_object(text, kind), save it in the store and return the hash. Saving the same content twice must not create a second entry."""
        h = hash_object(text, kind)
        store[h] = (kind, text)
        return h


    def read_object(store, h):
        """Return the (kind, text) saved under the hash h. ValueError('unknown object') if it is missing."""
        if h not in store:
            raise ValueError("unknown object")
        return store[h]


    def find_by_prefix(store, prefix):
        """People type only the start of a hash. Return the FULL hash in the store that starts with the prefix. ValueError('prefix too short') if the prefix has fewer than 4 characters, ValueError('unknown object') if nothing matches and ValueError('ambiguous prefix') if more than one hash matches. (Check them in that order.)"""
        if len(prefix) < 4:
            raise ValueError("prefix too short")
        found = [h for h in store if h.startswith(prefix)]
        if not found:
            raise ValueError("unknown object")
        if len(found) > 1:
            raise ValueError("ambiguous prefix")
        return found[0]


    def make_tree(store, files):
        """A TREE records a whole folder. `files` is a dict {path: text}. Save every file as a "blob" object, then build the tree text: one line `path hash` per file, sorted by path, joined with newlines (no newline at the end). Save it as a "tree" object and return its hash. The order in which files were added to the dict must not matter. An empty dict gives an empty tree text."""
        lines = []
        for path in sorted(files):
            h = store_object(store, "blob", files[path])
            lines.append(path + " " + h)
        return store_object(store, "tree", "\n".join(lines))


    def read_tree(store, h):
        """The reverse of make_tree: return the dict {path: text} of the tree object h. (A tree line is `path hash`; split it at the LAST space, then read the blob.)"""
        kind, text = read_object(store, h)
        files = {}
        for line in text.split("\n"):
            if line:
                path, blob = line.rsplit(" ", 1)
                files[path] = read_object(store, blob)[1]
        return files


    def make_commit(store, tree, parents, message, author, time):
        """A COMMIT points at a tree (the snapshot) and at its parent commits (its history). Build the text with these lines, in order: `tree <tree hash>`, then one `parent <hash>` line per parent, then `author <author> <time>`, then an empty line, then the message. Join with newlines, save it as a "commit" object and return its hash."""
        lines = ["tree " + tree]
        for p in parents:
            lines.append("parent " + p)
        lines.append("author " + author + " " + str(time))
        lines.append("")
        lines.append(message)
        return store_object(store, "commit", "\n".join(lines))


    def read_commit(store, h):
        """Parse a commit object back into a dict {"tree": hash, "parents": [hashes], "author": name, "time": int, "message": text}. (The author line is `author <name> <time>`: the time is the last word and the name is everything before it. The message is everything after the first empty line.) ValueError('not a commit') if the object is of another kind."""
        kind, text = read_object(store, h)
        if kind != "commit":
            raise ValueError("not a commit")
        head, message = text.split("\n\n", 1)
        info = {"tree": None, "parents": [], "author": "", "time": 0, "message": message}
        for line in head.split("\n"):
            key, value = line.split(" ", 1)
            if key == "tree":
                info["tree"] = value
            elif key == "parent":
                info["parents"].append(value)
            elif key == "author":
                name, when = value.rsplit(" ", 1)
                info["author"], info["time"] = name, int(when)
        return info


    def new_repo():
        """A REPOSITORY holds everything: return {"store": {}, "branches": {"main": None}, "head": "main", "clock": 0}. `branches` maps a branch name to the hash of its newest commit (None while it has none), `head` is the name of the branch you are on and `clock` is a counter that gives commits a time."""
        return {"store": {}, "branches": {"main": None}, "head": "main", "clock": 0}


    def commit_snapshot(repo, files, message, author):
        """Save a new commit of the whole folder `files` on the current branch. Add 1 to repo["clock"] and use it as the commit time; save the tree with make_tree and make the commit (its only parent is the branch's current newest commit, if there is one); move the branch to the new commit and return its hash."""
        repo["clock"] += 1
        tree = make_tree(repo["store"], files)
        tip = repo["branches"][repo["head"]]
        parents = [tip] if tip else []
        h = make_commit(repo["store"], tree, parents, message, author, repo["clock"])
        repo["branches"][repo["head"]] = h
        return h


    def snapshot_of(repo, commit_hash):
        """The dict {path: text} of all files as they were in that commit."""
        info = read_commit(repo["store"], commit_hash)
        return read_tree(repo["store"], info["tree"])


    def file_changes(old, new):
        """Compare two folders (dicts {path: text}). Return {"added": [...], "modified": [...], "deleted": [...]}: each a sorted list of paths that are only in `new`, in both but with different text, or only in `old`."""
        return {
            "added": sorted(p for p in new if p not in old),
            "modified": sorted(p for p in new if p in old and new[p] != old[p]),
            "deleted": sorted(p for p in old if p not in new),
        }


    def ancestors(store, h):
        """The set of commit hashes reachable from h by following ALL parents, including h itself."""
        seen = set()
        todo = [h]
        while todo:
            c = todo.pop()
            if c not in seen:
                seen.add(c)
                todo.extend(read_commit(store, c)["parents"])
        return seen


    def create_branch(repo, name):
        """Make a new branch at the current branch's newest commit."""
        if name in repo["branches"]:
            raise ValueError("branch exists")
        tip = repo["branches"][repo["head"]]
        if tip is None:
            raise ValueError("no commits yet")
        repo["branches"][name] = tip


    def switch(repo, name):
        """Make `name` the current branch."""
        if name not in repo["branches"]:
            raise ValueError("no such branch")
        repo["head"] = name


    def lcs_table(a, b):
        """The LONGEST COMMON SUBSEQUENCE (LCS) of two lists of lines is the longest list of lines that appear in both, in the same order (not necessarily next to each other). Build a table t with len(a) + 1 rows and len(b) + 1 columns where t[i][j] is the length of the LCS of a[i:] and b[j:]. The last row and last column are all 0; fill the rest from the bottom right: if a[i] == b[j] then t[i][j] = 1 + t[i+1][j+1], otherwise the larger of t[i+1][j] and t[i][j+1]."""
        t = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
        for i in range(len(a) - 1, -1, -1):
            for j in range(len(b) - 1, -1, -1):
                if a[i] == b[j]:
                    t[i][j] = 1 + t[i + 1][j + 1]
                else:
                    t[i][j] = max(t[i + 1][j], t[i][j + 1])
        return t


    def lcs_length(a, b):
        """The length of the longest common subsequence of the two lists."""
        return lcs_table(a, b)[0][0]


    def lcs(a, b):
        """The longest common subsequence itself as a list. Walk through the table from (0, 0): if a[i] == b[j] take that line and move diagonally; otherwise move down (i + 1) if t[i+1][j] >= t[i][j+1], else right (j + 1)."""
        t = lcs_table(a, b)
        i = j = 0
        out = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                out.append(a[i])
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                i += 1
            else:
                j += 1
        return out


    def diff_lines(a, b):
        """The DIFF of two lists of lines: the list of operations (tag, line) that turns a into b, where tag "=" keeps a line, "-" deletes a line of a and "+" inserts a line of b. Use the table of lcs_table and walk from (0, 0): if a[i] == b[j] emit "=" and move diagonally; otherwise if t[i+1][j] >= t[i][j+1] emit "-" for a[i] and move down, else emit "+" for b[j] and move right. When one list is used up, emit the rest of the other (deletions for a, insertions for b)."""
        t = lcs_table(a, b)
        i = j = 0
        ops = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                ops.append(("=", a[i]))
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                ops.append(("-", a[i]))
                i += 1
            else:
                ops.append(("+", b[j]))
                j += 1
        while i < len(a):
            ops.append(("-", a[i]))
            i += 1
        while j < len(b):
            ops.append(("+", b[j]))
            j += 1
        return ops


    def format_diff(ops):
        """Print the diff the way Git does: one string per operation: a space for "=", "-" or "+", directly followed by the line."""
        return [(" " if tag == "=" else tag) + line for tag, line in ops]


    def diff_stats(ops):
        """Return (insertions, deletions): how many "+" and how many "-" operations there are."""
        return (sum(1 for t, _ in ops if t == "+"), sum(1 for t, _ in ops if t == "-"))


    def split_lines(text):
        """The lines of a text without their line ends (text.splitlines()); an empty text has no lines."""
        return text.splitlines()


    def merge_lines(base, ours, theirs):
        """THREE-WAY MERGE of lists of lines. `base` is the common ancestor, `ours` and `theirs` are the two changed versions. Use diff_lines(base, other) to record, for each side, which base lines were deleted and which lines were inserted before each base position (an insertion that comes after the "-" of base line i belongs to position i + 1; position len(base) means the end). Then build the result by going through the positions i = 0 .. len(base): first the inserted lines of position i: if both sides inserted the same lines use them once, if only one side inserted lines use those, if both inserted DIFFERENT lines write a CONFLICT: the line '<<<<<<< ours', our lines, '=======', their lines, '>>>>>>> theirs'. Then (for i < len(base)) keep base[i] unless at least one side deleted it. Return (merged lines, True if there was a conflict)."""
        def changes(other):
            ins = {i: [] for i in range(len(base) + 1)}
            deleted = set()
            i = 0
            for tag, line in diff_lines(base, other):
                if tag == "+":
                    ins[i].append(line)
                elif tag == "-":
                    deleted.add(i)
                    i += 1
                else:
                    i += 1
            return ins, deleted

        o_ins, o_del = changes(ours)
        t_ins, t_del = changes(theirs)
        out, conflict = [], False
        for i in range(len(base) + 1):
            a, b = o_ins[i], t_ins[i]
            if a == b or not b:
                out.extend(a)
            elif not a:
                out.extend(b)
            else:
                conflict = True
                out.append("<<<<<<< ours")
                out.extend(a)
                out.append("=======")
                out.extend(b)
                out.append(">>>>>>> theirs")
            if i < len(base) and i not in o_del and i not in t_del:
                out.append(base[i])
        return out, conflict


    def merge_base(store, a, b):
        """The BEST COMMON ANCESTOR of commits a and b: the point where their histories split. Take the commits that are ancestors of both (each commit counts as its own ancestor); drop every one that is a proper ancestor of another common commit; if several remain return the one with the latest commit time (ties: the larger hash). None if they share no history."""
        common = ancestors(store, a) & ancestors(store, b)
        best = [c for c in common if not any(c != d and c in ancestors(store, d) for d in common)]
        if not best:
            return None
        return max(best, key=lambda c: (read_commit(store, c)["time"], c))


    def merge_kind(store, a, b):
        """What merging commit b into commit a needs: 'up-to-date' if b is already in a's history (or equal), 'fast-forward' if a is in b's history (the branch label can just move), otherwise 'merge'."""
        if b in ancestors(store, a):
            return "up-to-date"
        if a in ancestors(store, b):
            return "fast-forward"
        return "merge"


    def merge_files(base, ours, theirs):
