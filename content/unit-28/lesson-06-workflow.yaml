      assert matches("debug.log", "*.log") and matches("logs/debug.log", "*.log") and not matches("debug.txt", "*.log")
      assert matches("src/build/out.o", "build/") and not matches("build", "build/") and matches("build", "build") and matches("build/x", "build/")
      assert matches("src/app.py", "src/*.py") and not matches("lib/src/app.py", "src/*.py") and matches("secret.txt", "/secret.txt") and not matches("sub/secret.txt", "/secret.txt")
      assert matches("node_modules/a/b.js", "node_modules/") and matches("a/node_modules/b.js", "node_modules/") and matches("a.log", "!a.log")
