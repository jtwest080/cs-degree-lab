- id: ignore
  title: Ignoring files
  difficulty: 4
  prompt: 'Some files should never be committed: build output, secrets, editor folders. A **`.gitignore`** file lists patterns for them. Write `matches(path, pattern)` (the helper `fnmatchcase` is imported for you). Ignore any leading `"!"` of the pattern (that is handled elsewhere). A trailing `"/"` means the pattern is for **directories only**. If the pattern (without that trailing slash) contains **no** `"/"`, it matches when it matches any single path component (a directory-only pattern may not match the last component, which is the file). Otherwise it is **anchored** to the project root (remove a leading `"/"`): it matches when it matches any prefix of the path made of whole components (again, a directory-only pattern may not match the whole path). Write `is_ignored(path, patterns)`: skip empty lines and lines starting with `"#"`; go through the patterns in order and let the **last** one that matches decide: a pattern starting with `"!"` un-ignores the path, any other ignores it; a path that no pattern matches is not ignored. Write `tracked(paths, patterns)`: the paths that are **not** ignored, in their order.'
  starter: |-
    from fnmatch import fnmatchcase




    def matches(path, pattern):
        """Does ONE ignore pattern match a file path such as 'src/build/out.o'? (Ignore any leading '!' of the pattern: that is handled elsewhere.) A trailing '/' means the pattern is for DIRECTORIES only. If the pattern (without that trailing slash) contains no '/', it matches when it matches any single path component (use fnmatchcase; a directory-only pattern may not match the last component, which is the file). Otherwise it is ANCHORED to the project root (remove a leading '/'): it matches when it matches any prefix of the path made of whole components (again, a directory-only pattern may not match the whole path)."""
        pass


    def is_ignored(path, patterns):
        """Apply a .gitignore file (a list of lines) to a path: skip empty lines and lines starting with '#' (after strip()); go through the patterns in order and let the LAST pattern that matches decide: a pattern starting with '!' un-ignores the path, any other ignores it. A path that no pattern matches is not ignored."""
        pass


    def tracked(paths, patterns):
        """The paths that are NOT ignored, in their original order."""
        pass
