id: u28-workflow
title: Everyday Git Workflow
minutes: 110
objective: 'Learn the habits and commands that you use every day with Git: ignoring files, undoing mistakes safely with revert, cherry-pick and reset, finding the commit that broke something with bisect, rebasing to keep history tidy, and writing commit messages that tools can read to make version numbers and release notes.'
outcomes:
- Write and read a .gitignore
- Choose between revert and reset
- Cherry-pick a commit
- Find a bug with bisect
- Explain rebase and when not to use it
- Write conventional commits and compute semantic versions
sections:
- heading: What not to commit, and how to undo
  body: |-
    A repository should hold the **source** of a project, not things that can be regenerated or that must stay secret. A **`.gitignore`** file lists patterns for files Git should pretend not to see: compiled output, downloaded libraries (`node_modules/`), editor settings, and above all **secrets** such as passwords and API keys. Once a secret is committed and pushed it must be treated as leaked, even if you delete it later, because the history keeps it.

    ```text
    # .gitignore
    *.log
    build/
    .env
    !important.log
    ```

    Everyone makes mistakes, so Git offers several ways to undo, with very different risks. `git restore file` throws away edits you have not committed. `git revert <commit>` makes a **new commit that undoes** an old one: the history only grows, so it is always safe on shared branches. `git reset --hard <commit>` **moves your branch back**, so later commits become unreachable (you can still find them with `git reflog` for a while). Use reset only on work you have not pushed.
- heading: Cherry-pick, bisect and rebase
  body: |-
    Three more tools make you faster. **Cherry-pick** (`git cherry-pick <commit>`) copies one commit onto your current branch: it takes the change the commit made and applies it again, producing a new commit with a different hash. It is handy to bring a single bug fix to a release branch.

    **Bisect** finds the commit that introduced a bug by **binary search**. You tell Git a commit that is good and one that is bad; it checks out the middle, you test, and each answer halves the suspects, so a hundred commits need only seven checks. `git bisect run ./test.sh` does it automatically.

    **Rebase** (`git rebase main`) takes the commits of your branch and replays them on top of the latest `main`, so history becomes one straight line instead of a tangle of merges. The replayed commits are *new* commits. That is why there is a golden rule: **never rebase commits that other people already have**, because you would rewrite history they are building on. On your own private branch it is perfectly fine and keeps the history tidy.

    > **Key idea:** Revert adds history; reset and rebase rewrite it. Rewrite only what is yours alone.
- heading: Messages, versions and releases
  body: |-
    A good commit message is a gift to your future self. Many teams adopt **conventional commits**: `type(scope): description`, where the type says what kind of change it is (`feat` for a feature, `fix` for a bug fix, `docs`, `refactor`, `test`, `chore`) and a `!` marks a **breaking change**. Because the format is regular, a program can read it.

    That matters for **semantic versioning** (SemVer). A version number has three parts, `MAJOR.MINOR.PATCH`. Raise **PATCH** for bug fixes, **MINOR** for new features that do not break existing users, and **MAJOR** for changes that **break** compatibility. A user who sees version `2.3.1` knows that going to `2.4.0` is safe and going to `3.0.0` needs care. With conventional commits, tools can work out the next version and write the **changelog** (release notes) automatically.

    Good habits to take away: commit small and often, write the message in the imperative ("Fix crash on start"), keep unrelated changes in separate commits, never commit secrets, and pull before you push.
examples:
- title: A .gitignore
  intro: Which files does Git track?
  code: |
    from fnmatch import fnmatchcase


    def matches(path, pattern):
        """Does ONE ignore pattern match a file path such as 'src/build/out.o'? (Ignore any leading '!' of the pattern: that is handled elsewhere.) A trailing '/' means the pattern is for DIRECTORIES only. If the pattern (without that trailing slash) contains no '/', it matches when it matches any single path component (use fnmatchcase; a directory-only pattern may not match the last component, which is the file). Otherwise it is ANCHORED to the project root (remove a leading '/'): it matches when it matches any prefix of the path made of whole components (again, a directory-only pattern may not match the whole path)."""
        parts = path.split("/")
        pat = pattern.lstrip("!")
        dir_only = pat.endswith("/")
        pat = pat.rstrip("/")
        if "/" not in pat:
            for i, part in enumerate(parts):
                if dir_only and i == len(parts) - 1:
                    continue
                if fnmatchcase(part, pat):
                    return True
            return False
        pat = pat.lstrip("/")
        for k in range(1, len(parts) + 1):
            if dir_only and k == len(parts):
                continue
            if fnmatchcase("/".join(parts[:k]), pat):
                return True
        return False


    def is_ignored(path, patterns):
        """Apply a .gitignore file (a list of lines) to a path: skip empty lines and lines starting with '#' (after strip()); go through the patterns in order and let the LAST pattern that matches decide: a pattern starting with '!' un-ignores the path, any other ignores it. A path that no pattern matches is not ignored."""
        result = False
        for line in patterns:
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            if matches(path, line):
                result = not line.startswith("!")
        return result


    def tracked(paths, patterns):
        """The paths that are NOT ignored, in their original order."""
        return [p for p in paths if not is_ignored(p, patterns)]

    rules = ["*.log", "build/", "!important.log", "/secret.txt"]
    files = ["main.py", "debug.log", "important.log", "build/out.o", "src/build/x.o", "secret.txt", "docs/secret.txt"]
    for f in files:
        print(f, "->", "ignored" if is_ignored(f, rules) else "tracked")
    print(tracked(files, rules))
  output: |
    main.py -> tracked
    debug.log -> ignored
    important.log -> tracked
    build/out.o -> ignored
    src/build/x.o -> ignored
    secret.txt -> ignored
    docs/secret.txt -> tracked
    ['main.py', 'important.log', 'docs/secret.txt']
