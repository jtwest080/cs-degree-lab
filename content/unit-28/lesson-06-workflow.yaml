      assert is_ignored("a.log", rules) and not is_ignored("keep.log", rules) and is_ignored("build/x.o", rules) and is_ignored("secret.txt", rules)
      assert not is_ignored("sub/secret.txt", rules) and not is_ignored("main.py", rules) and not is_ignored("anything", []) and not is_ignored("# build output", rules)
      assert is_ignored("keep.log", ["!keep.log", "*.log"]) and not is_ignored("keep.log", ["*.log", "!keep.log"])
  - name: filtering
