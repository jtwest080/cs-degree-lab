        t = lcs_table(a, b)
        i = j = 0
        ops = []
        while i < len(a) and j < len(b):
            if a[i] == b[j]:
                ops.append(("=", a[i]))
                i += 1
                j += 1
            elif t[i + 1][j] >= t[i][j + 1]:
                ops.append(("-", a[i]))
                i += 1
            else:
                ops.append(("+", b[j]))
                j += 1
        while i < len(a):
            ops.append(("-", a[i]))
            i += 1
