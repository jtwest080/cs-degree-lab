      paths = ["main.py", "main.pyc", "pkg/__pycache__/x.py", "pkg/util.py", ".env", "docs/.env"]
      assert tracked(paths, rules) == ["main.py", "pkg/util.py"] and tracked([], rules) == [] and tracked(paths, []) == paths
