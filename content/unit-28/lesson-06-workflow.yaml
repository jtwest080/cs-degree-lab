- type: code
  question: Write `bump_patch(version)` that adds 1 to the last number of a `MAJOR.MINOR.PATCH` version string and returns the new string.
  starter: |
    def bump_patch(version):
        pass
  tests:
  - name: patch
    code: |
      assert bump_patch("1.4.2") == "1.4.3" and bump_patch("0.0.0") == "0.0.1" and bump_patch("2.10.9") == "2.10.10"
  solution: |
    def bump_patch(version):
        major, minor, patch = version.split(".")
        return major + "." + minor + "." + str(int(patch) + 1)
