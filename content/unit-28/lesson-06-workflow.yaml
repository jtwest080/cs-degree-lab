  solution: |
    import re




    def parse_commit(message):
        """Teams write CONVENTIONAL COMMITS: the first line is 'type(scope): description' or 'type: description', and a '!' just before the colon (as in 'feat!: ...' or 'feat(api)!: ...') marks a BREAKING change. Parse the FIRST LINE of the message into {"type": str, "scope": str or None, "breaking": bool, "description": str}. The type is lower-case letters. The description is whatever follows ': ' with surrounding spaces removed and must not be empty. A body line starting with 'BREAKING CHANGE:' anywhere later in the message also makes it breaking. ValueError('not a conventional commit') if the first line does not fit."""
        lines = message.split("\n")
        m = re.match(r"^([a-z]+)(?:\(([^)]+)\))?(!)?: (.+)$", lines[0].strip())
        if not m or not m.group(4).strip():
            raise ValueError("not a conventional commit")
        breaking = bool(m.group(3)) or any(l.startswith("BREAKING CHANGE:") for l in lines[1:])
        return {"type": m.group(1), "scope": m.group(2), "breaking": breaking, "description": m.group(4).strip()}


    def next_version(version, messages):
        """SEMANTIC VERSIONING: a version 'MAJOR.MINOR.PATCH' such as '1.4.2'. Given the commit messages since the last release decide the next version: if any message is breaking raise MAJOR by 1 and reset minor and patch to 0; otherwise if any has type 'feat' raise MINOR by 1 and reset patch to 0; otherwise if any has type 'fix' raise PATCH by 1; otherwise the version stays. Messages that are not conventional commits are ignored. Return the version string."""
        major, minor, patch = (int(x) for x in version.split("."))
        parsed = []
        for m in messages:
            try:
                parsed.append(parse_commit(m))
            except ValueError:
                pass
        if any(p["breaking"] for p in parsed):
            return "%d.0.0" % (major + 1)
        if any(p["type"] == "feat" for p in parsed):
            return "%d.%d.0" % (major, minor + 1)
        if any(p["type"] == "fix" for p in parsed):
            return "%d.%d.%d" % (major, minor, patch + 1)
        return version


    def changelog(messages):
        """A list of lines for release notes. Group the conventional commits (others are ignored) in this order: 'Breaking changes' (all breaking commits), 'Features' (type feat, not breaking), 'Fixes' (type fix, not breaking). Each non-empty group gives a heading line (just its name) followed by one line per commit: '- ' + the description, or '- scope: description' if it has a scope; keep the original order inside a group."""
        groups = [("Breaking changes", []), ("Features", []), ("Fixes", [])]
        for m in messages:
            try:
                p = parse_commit(m)
            except ValueError:
                continue
            text = "- " + ((p["scope"] + ": ") if p["scope"] else "") + p["description"]
            if p["breaking"]:
                groups[0][1].append(text)
            elif p["type"] == "feat":
                groups[1][1].append(text)
            elif p["type"] == "fix":
                groups[2][1].append(text)
        out = []
        for name, items in groups:
            if items:
                out.append(name)
                out.extend(items)
        return out
  explanation: Many projects generate their version numbers and release notes automatically from commit messages like these.
