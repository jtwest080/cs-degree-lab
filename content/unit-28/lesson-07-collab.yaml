  explanation: Split big changes into small steps.
- title: Reviewing only the style
  explanation: Look for bugs and missing tests too.
- title: Bug reports without steps to reproduce
  explanation: Say exactly what you did.
- title: Ignoring a failing CI check
  explanation: Fix the cause or the test; never skip the check.
- title: Leaving dead branches around
  explanation: Delete merged branches.
summary:
- Code review finds bugs and spreads knowledge; small changes get better reviews.
- CODEOWNERS says who must review which files.
- Issues with labels and search organise the work.
- CI runs tests automatically and blocks bad merges.
- A pipeline is a dependency graph run in topological order.
