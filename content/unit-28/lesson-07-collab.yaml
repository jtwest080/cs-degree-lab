- id: prsize
  title: Checking a pull request
  difficulty: 4
  prompt: 'Small pull requests get better reviews. Write `pr_size(insertions, deletions)`: by the total number of lines changed return `"small"` (up to 50), `"medium"` (up to 250), `"large"` (up to 1000) or `"huge"`. Write `check_pr(title, body, files, insertions, deletions)`: return a list of problems in **this order** (only those that apply): `"title is empty"` (the title is empty after `strip()`), `"title too long"` (more than 72 characters after `strip()`), `"no description"` (the body is empty after `strip()`), `"too big"` (size is large or huge), `"no tests"` (some changed path starts with `"src/"` but none starts with `"tests/"`), `"too many files"` (more than 20 files).'
  starter: |-
    def pr_size(insertions, deletions):
        """Classify a pull request by the total number of lines changed (insertions + deletions): 'small' up to 50, 'medium' up to 250, 'large' up to 1000, otherwise 'huge'."""
        pass


    def check_pr(title, body, files, insertions, deletions):
        """Automatic checks on a pull request. Return a list of problems in THIS order (only those that apply): 'title is empty' (title.strip() is empty), 'title too long' (more than 72 characters after strip()), 'no description' (body.strip() is empty), 'too big' (pr_size is 'large' or 'huge'), 'no tests' (some changed path starts with 'src/' but none starts with 'tests/'), 'too many files' (more than 20 files)."""
        pass
  tests:
  - name: sizes
    code: |
      assert pr_size(0, 0) == "small" and pr_size(30, 20) == "small" and pr_size(30, 21) == "medium" and pr_size(200, 50) == "medium" and pr_size(200, 51) == "large" and pr_size(1000, 0) == "large" and pr_size(600, 401) == "huge"
  - name: a good one
    code: |
      assert check_pr("Fix crash on start", "The app crashed when...", ["src/app.py", "tests/test_app.py"], 10, 2) == []
      assert check_pr("Update docs", "Typos", ["docs/a.md"], 3, 3) == []
  - name: problems
    code: |
      assert check_pr("", "", [], 0, 0) == ["title is empty", "no description"]
      assert check_pr("x" * 73, "ok", ["src/a.py"], 1, 1) == ["title too long", "no tests"] and check_pr("x" * 72, "ok", [], 1, 1) == []
      assert check_pr("  ", "text", ["src/a.py"], 500, 600) == ["title is empty", "too big", "no tests"]
      assert check_pr("Big", "d", ["tests/f%d.py" % i for i in range(21)], 5, 5) == ["too many files"] and check_pr("Big", "d", ["src/a.py", "tests/t.py"], 800, 300) == ["too big"]
  hints:
  - Run the checks in the order the problems are listed.
  solution: |
    def pr_size(insertions, deletions):
        """Classify a pull request by the total number of lines changed (insertions + deletions): 'small' up to 50, 'medium' up to 250, 'large' up to 1000, otherwise 'huge'."""
        total = insertions + deletions
        if total <= 50:
            return "small"
        if total <= 250:
            return "medium"
        if total <= 1000:
            return "large"
        return "huge"


    def check_pr(title, body, files, insertions, deletions):
        """Automatic checks on a pull request. Return a list of problems in THIS order (only those that apply): 'title is empty' (title.strip() is empty), 'title too long' (more than 72 characters after strip()), 'no description' (body.strip() is empty), 'too big' (pr_size is 'large' or 'huge'), 'no tests' (some changed path starts with 'src/' but none starts with 'tests/'), 'too many files' (more than 20 files)."""
        problems = []
        if not title.strip():
            problems.append("title is empty")
        if len(title.strip()) > 72:
            problems.append("title too long")
        if not body.strip():
            problems.append("no description")
        if pr_size(insertions, deletions) in ("large", "huge"):
            problems.append("too big")
        if any(f.startswith("src/") for f in files) and not any(f.startswith("tests/") for f in files):
            problems.append("no tests")
        if len(files) > 20:
            problems.append("too many files")
        return problems
  explanation: Many teams enforce checks like these automatically on every pull request.
- id: issues
  title: Issues and search
  difficulty: 4
  prompt: '**Issues** track bugs and ideas. Write `triage_labels(title)`: suggest labels from the title (case-insensitive substring tests): `"bug"` if it contains `crash`, `error` or `bug`; `"enhancement"` if it contains `add`, `feature` or `support`; `"question"` if it contains `how` or `?`; `"documentation"` if it contains `typo` or `docs`. Return the labels as a **sorted** list, or `["needs-triage"]` if none apply. Write `search_issues(issues, query)`: `issues` is a list of dicts `{"id", "title", "state", "labels": [...], "author"}`. The query is words separated by spaces: `label:X` requires the label `X`, `-label:X` forbids it, `state:X` requires that state, `author:X` that author; **every other word** must occur in the title (ignoring case). All conditions must hold. Return the **sorted** list of matching ids.'
  starter: |-
    def triage_labels(title):
        """Suggest labels for a new issue from its title (case-insensitive substring tests): 'bug' if it contains 'crash', 'error' or 'bug'; 'enhancement' if it contains 'add', 'feature' or 'support'; 'question' if it contains 'how' or '?'; 'documentation' if it contains 'typo' or 'docs'. Return the labels as a SORTED list, or ['needs-triage'] if none apply."""
        pass


    def search_issues(issues, query):
        """Search issues like GitHub does. `issues` is a list of dicts {"id", "title", "state", "labels": [...], "author"}. The query is words separated by spaces: 'label:X' requires the label X, '-label:X' forbids it, 'state:X' requires that state, 'author:X' that author; every other word must occur in the title (ignoring case). All conditions must hold. Return the sorted list of matching ids."""
        pass
  tests:
  - name: labels
    code: |
      assert triage_labels("App crashes on start") == ["bug"] and triage_labels("Add dark mode") == ["enhancement"] and triage_labels("How do I log in?") == ["question"]
      assert triage_labels("Typo in docs") == ["documentation"] and triage_labels("Error when I add a file?") == ["bug", "enhancement", "question"] and triage_labels("Hello") == ["needs-triage"]
  - name: searching
    code: |
      issues = [
          {"id": 1, "title": "Crash on start", "state": "open", "labels": ["bug"], "author": "ada"},
          {"id": 2, "title": "Add dark mode", "state": "open", "labels": ["enhancement"], "author": "bo"},
          {"id": 3, "title": "Crash when saving", "state": "closed", "labels": ["bug", "urgent"], "author": "bo"},
          {"id": 4, "title": "Docs typo", "state": "open", "labels": ["documentation"], "author": "ada"},
      ]
      assert search_issues(issues, "") == [1, 2, 3, 4] and search_issues(issues, "crash") == [1, 3] and search_issues(issues, "CRASH state:open") == [1]
      assert search_issues(issues, "label:bug") == [1, 3] and search_issues(issues, "label:bug -label:urgent") == [1] and search_issues(issues, "author:bo state:open") == [2]
      assert search_issues(issues, "label:bug author:ada dark") == [] and search_issues([], "x") == [] and search_issues(issues, "state:closed label:urgent crash saving") == [3]
  hints:
  - Check every token of the query against every issue; keep an issue only if all tokens pass.
  solution: |
    def triage_labels(title):
        """Suggest labels for a new issue from its title (case-insensitive substring tests): 'bug' if it contains 'crash', 'error' or 'bug'; 'enhancement' if it contains 'add', 'feature' or 'support'; 'question' if it contains 'how' or '?'; 'documentation' if it contains 'typo' or 'docs'. Return the labels as a SORTED list, or ['needs-triage'] if none apply."""
        t = title.lower()
        labels = set()
        if any(w in t for w in ("crash", "error", "bug")):
            labels.add("bug")
        if any(w in t for w in ("add", "feature", "support")):
            labels.add("enhancement")
        if "how" in t or "?" in t:
            labels.add("question")
        if "typo" in t or "docs" in t:
            labels.add("documentation")
        return sorted(labels) or ["needs-triage"]


    def search_issues(issues, query):
        """Search issues like GitHub does. `issues` is a list of dicts {"id", "title", "state", "labels": [...], "author"}. The query is words separated by spaces: 'label:X' requires the label X, '-label:X' forbids it, 'state:X' requires that state, 'author:X' that author; every other word must occur in the title (ignoring case). All conditions must hold. Return the sorted list of matching ids."""
        found = []
        for issue in issues:
            ok = True
            for token in query.split():
                if token.startswith("label:"):
                    ok = ok and token[6:] in issue["labels"]
