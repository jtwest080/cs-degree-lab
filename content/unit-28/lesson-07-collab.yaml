        def changes(other):
            ins = {i: [] for i in range(len(base) + 1)}
            deleted = set()
            i = 0
            for tag, line in diff_lines(base, other):
                if tag == "+":
                    ins[i].append(line)
                elif tag == "-":
                    deleted.add(i)
                    i += 1
                else:
                    i += 1
            return ins, deleted

        o_ins, o_del = changes(ours)
        t_ins, t_del = changes(theirs)
        out, conflict = [], False
        for i in range(len(base) + 1):
            a, b = o_ins[i], t_ins[i]
            if a == b or not b:
                out.extend(a)
            elif not a:
                out.extend(b)
            else:
                conflict = True
                out.append("<<<<<<< ours")
                out.extend(a)
                out.append("=======")
                out.extend(b)
                out.append(">>>>>>> theirs")
