        pass


    def pipeline_ok(jobs, outcomes):
        """True when EVERY job of the pipeline succeeded (so the pull request may be merged)."""
        pass
  tests:
  - name: order
    code: |
      jobs = {"deploy": {"needs": ["test", "lint"], "steps": ["upload"]}, "test": {"needs": ["build"], "steps": ["pytest"]}, "lint": {"needs": [], "steps": ["ruff"]}, "build": {"needs": [], "steps": ["compile"]}}
      assert run_order(jobs) == ["build", "lint", "test", "deploy"] and run_order({}) == [] and run_order({"a": {"needs": [], "steps": []}}) == ["a"]
      for bad, msg in (({"a": {"needs": ["zzz"], "steps": []}}, "unknown job: zzz"), ({"a": {"needs": ["b"], "steps": []}, "b": {"needs": ["a"], "steps": []}}, "cycle"), ({"a": {"needs": ["a"], "steps": []}}, "cycle")):
          try:
              run_order(bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
  - name: running
    code: |
      jobs = {"deploy": {"needs": ["test", "lint"], "steps": ["upload"]}, "test": {"needs": ["build"], "steps": ["pytest"]}, "lint": {"needs": [], "steps": ["ruff"]}, "build": {"needs": [], "steps": ["compile"]}}
      assert run_pipeline(jobs, {}) == {"build": "success", "lint": "success", "test": "success", "deploy": "success"}
      r = run_pipeline(jobs, {"pytest": False})
      assert r == {"build": "success", "lint": "success", "test": "failed", "deploy": "skipped"}
      r2 = run_pipeline(jobs, {"compile": False, "ruff": True})
      assert r2 == {"build": "failed", "lint": "success", "test": "skipped", "deploy": "skipped"}
  - name: ready to merge
    code: |
      jobs = {"test": {"needs": [], "steps": ["pytest", "mypy"]}, "docs": {"needs": ["test"], "steps": []}}
      assert pipeline_ok(jobs, {}) and not pipeline_ok(jobs, {"mypy": False}) and pipeline_ok({}, {}) and not pipeline_ok(jobs, {"pytest": False, "mypy": True})
  hints:
  - Keep a set of finished jobs and pick the first alphabetical job whose needs are all in it.
  solution: |
    def run_order(jobs):
        """A CI PIPELINE (such as GitHub Actions) is a set of jobs; `jobs` is a dict {name: {"needs": [names of jobs that must run first], "steps": [step names]}}. Return the order in which to run the jobs: ValueError('unknown job: X') for a needed job that does not exist (check this first), otherwise repeatedly run the first job in alphabetical order whose needs are all done (topological sort); if jobs remain but none is ready raise ValueError('cycle')."""
        for name, job in jobs.items():
            for need in job["needs"]:
                if need not in jobs:
                    raise ValueError("unknown job: " + need)
        done, order = set(), []
        while len(order) < len(jobs):
            ready = sorted(n for n, j in jobs.items() if n not in done and all(d in done for d in j["needs"]))
            if not ready:
                raise ValueError("cycle")
            done.add(ready[0])
            order.append(ready[0])
        return order


    def run_pipeline(jobs, outcomes):
        """Run the pipeline: go through run_order. A job is 'skipped' if any job it needs is not 'success'; otherwise it runs its steps in order and is 'failed' as soon as a step has outcomes[step] == False (a step missing from `outcomes` counts as passing), else 'success'. Return the dict {job name: 'success' | 'failed' | 'skipped'}."""
        status = {}
        for name in run_order(jobs):
            job = jobs[name]
            if any(status[d] != "success" for d in job["needs"]):
                status[name] = "skipped"
            elif any(outcomes.get(step, True) is False for step in job["steps"]):
                status[name] = "failed"
            else:
                status[name] = "success"
        return status


    def pipeline_ok(jobs, outcomes):
        """True when EVERY job of the pipeline succeeded (so the pull request may be merged)."""
        return all(s == "success" for s in run_pipeline(jobs, outcomes).values())
  explanation: A red cross next to a pull request means a job failed; a skipped job means something it depends on failed.
commonMistakes:
