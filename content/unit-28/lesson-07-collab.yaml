id: u28-collab
title: 'Teamwork: Reviews, Issues and Automation'
minutes: 100
objective: 'Learn how teams use Git and GitHub together: code owners and reviews, healthy pull requests, issues and searching them, cleaning up branches, and continuous integration that runs tests automatically before anything is merged.'
outcomes:
- Explain code review and code owners
- Judge the size and quality of a pull request
- Search and label issues
- Clean up old branches
- Describe continuous integration
sections:
- heading: Code review
  body: |-
    Writing code is only half of engineering; the other half is reading it. In a **code review** a teammate reads your change before it is merged. Studies and experience agree that reviews find bugs early, spread knowledge so that nobody is the only person who understands a part, and keep the style of a project consistent. A review is not a test of you; it is a way of making the code better together.

    What makes a change reviewable? It is **small** (reviewers lose focus after a few hundred lines), it does **one thing**, it has a clear title and a description that explains *why*, and it comes with **tests**. As a reviewer: read the description first, then the tests, then the code; be kind and specific; ask questions instead of giving orders; separate must-fix problems from taste.

    Large projects add a **CODEOWNERS** file that says who must approve changes to which files, so changes to the payment code always reach the payment team.
- heading: Issues and project hygiene
  body: |-
    An **issue** is a tracked piece of work: a bug report, a feature request or a question. Good bug reports say what you did, what you expected and what happened instead, ideally with the smallest example that shows the problem. **Labels** such as `bug`, `enhancement` or `question` help teams sort them (called **triage**) and a search box with filters like `label:bug state:open` finds them again. A pull request can say "Fixes #42" in its description, and GitHub then closes issue 42 automatically when the PR is merged.

    Repositories also need housekeeping. Merged branches should be deleted: the commits are safe in `main`, only the label goes. Long-forgotten branches suggest abandoned work that someone should either finish or close. Releases are tagged (`v1.4.2`), and a README explains what the project is and how to run it.
- heading: Continuous integration
  body: |-
    Humans forget to run the tests. **Continuous integration (CI)** makes a machine do it: whenever you push or open a pull request, a service such as **GitHub Actions** starts a fresh computer, installs the project, runs the tests and linters, and reports a green tick or a red cross on the pull request. Combined with **branch protection**, a change that fails the checks simply cannot be merged.

    A CI **workflow** is a file in the repository (in `.github/workflows/`), written in YAML, made of **jobs**, each a list of **steps** (check out the code, install, run tests). Jobs may **need** other jobs: deploying must wait for the tests. So a pipeline is a graph of dependencies, and running it means a **topological sort**, the same algorithm that decides the order in which you must take courses. If a job fails, jobs that depend on it are **skipped**.

    ```text
    build -> test -> deploy
    lint --------->
    ```

    **Continuous delivery** goes one step further and ships every successful change to users automatically. Together with reviews and small steps, this is how modern teams release dozens of times a day with confidence.
examples:
- title: Owners and checks
  intro: Who must review a change, and is the pull request in good shape?
  code: |
    from fnmatch import fnmatchcase


    def matches(path, pattern):
        """Does ONE ignore pattern match a file path such as 'src/build/out.o'? (Ignore any leading '!' of the pattern: that is handled elsewhere.) A trailing '/' means the pattern is for DIRECTORIES only. If the pattern (without that trailing slash) contains no '/', it matches when it matches any single path component (use fnmatchcase; a directory-only pattern may not match the last component, which is the file). Otherwise it is ANCHORED to the project root (remove a leading '/'): it matches when it matches any prefix of the path made of whole components (again, a directory-only pattern may not match the whole path)."""
        parts = path.split("/")
        pat = pattern.lstrip("!")
        dir_only = pat.endswith("/")
        pat = pat.rstrip("/")
        if "/" not in pat:
            for i, part in enumerate(parts):
                if dir_only and i == len(parts) - 1:
                    continue
                if fnmatchcase(part, pat):
                    return True
            return False
        pat = pat.lstrip("/")
        for k in range(1, len(parts) + 1):
            if dir_only and k == len(parts):
                continue
            if fnmatchcase("/".join(parts[:k]), pat):
                return True
        return False


    def is_ignored(path, patterns):
        """Apply a .gitignore file (a list of lines) to a path: skip empty lines and lines starting with '#' (after strip()); go through the patterns in order and let the LAST pattern that matches decide: a pattern starting with '!' un-ignores the path, any other ignores it. A path that no pattern matches is not ignored."""
        result = False
        for line in patterns:
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            if matches(path, line):
                result = not line.startswith("!")
        return result


    def tracked(paths, patterns):
        """The paths that are NOT ignored, in their original order."""
        return [p for p in paths if not is_ignored(p, patterns)]


    def owners_for(path, rules):
        """A CODEOWNERS file says who must review changes to which files. `rules` is a list of (pattern, [owners]) pairs in file order and patterns work like .gitignore patterns (use the given `matches`). The LAST rule that matches the path wins; return its list of owners, or an empty list if no rule matches."""
        owners = []
        for pattern, who in rules:
            if matches(path, pattern):
                owners = list(who)
        return owners


    def reviewers_for(paths, rules, author):
        """Who should be asked to review a change that touches `paths`? The sorted list of distinct owners (owners_for each path), without the author of the change."""
        found = set()
        for p in paths:
            found.update(owners_for(p, rules))
        found.discard(author)
        return sorted(found)

    rules = [("*", ["@lead"]), ("docs/", ["@writers"]), ("*.py", ["@devs"])]
    changed = ["docs/guide.md", "src/app.py"]
    print("review by:", reviewers_for(changed, rules, "@bo"))

    def pr_size(insertions, deletions):
        """Classify a pull request by the total number of lines changed (insertions + deletions): 'small' up to 50, 'medium' up to 250, 'large' up to 1000, otherwise 'huge'."""
        total = insertions + deletions
        if total <= 50:
            return "small"
        if total <= 250:
            return "medium"
        if total <= 1000:
            return "large"
        return "huge"


    def check_pr(title, body, files, insertions, deletions):
        """Automatic checks on a pull request. Return a list of problems in THIS order (only those that apply): 'title is empty' (title.strip() is empty), 'title too long' (more than 72 characters after strip()), 'no description' (body.strip() is empty), 'too big' (pr_size is 'large' or 'huge'), 'no tests' (some changed path starts with 'src/' but none starts with 'tests/'), 'too many files' (more than 20 files)."""
        problems = []
        if not title.strip():
            problems.append("title is empty")
        if len(title.strip()) > 72:
            problems.append("title too long")
        if not body.strip():
            problems.append("no description")
        if pr_size(insertions, deletions) in ("large", "huge"):
            problems.append("too big")
        if any(f.startswith("src/") for f in files) and not any(f.startswith("tests/") for f in files):
            problems.append("no tests")
        if len(files) > 20:
            problems.append("too many files")
        return problems

    print(pr_size(40, 30), "|", check_pr("Add search", "", ["src/search.py"], 120, 10))
  output: |
