  title: 'Capstone: a CI pipeline'
  difficulty: 5
  prompt: '**Continuous integration** (CI) runs tests automatically on every push, for example with GitHub Actions. A pipeline is a set of **jobs** and `jobs` is a dict `{name: {"needs": [job names that must run first], "steps": [step names]}}`. Write `run_order(jobs)`: `ValueError("unknown job: X")` for a needed job that does not exist (check this first); otherwise repeatedly run the first job, in alphabetical order, whose needs are all done (a **topological sort**); if jobs remain but none is ready raise `ValueError("cycle")`. Write `run_pipeline(jobs, outcomes)`: go through `run_order`; a job is `"skipped"` if any job it needs is not `"success"`; otherwise it runs its steps in order and is `"failed"` as soon as a step has `outcomes[step] == False` (a step missing from `outcomes` counts as passing), else `"success"`; return the dict `{job: status}`. Write `pipeline_ok(jobs, outcomes)`: true when **every** job succeeded (so the pull request may be merged).'
