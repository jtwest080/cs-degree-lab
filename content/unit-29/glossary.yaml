# Terms introduced in Unit 29 (Command Line). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Command line
  definition: A text interface where you type commands and read the replies.
  lesson: u29-shell
- term: Shell
  definition: The program that reads your commands, expands them and runs other programs.
  lesson: u29-shell
- term: Bash
  definition: The most common shell on Linux and older Macs.
  lesson: u29-shell
- term: Command
  definition: A program name followed by arguments, typed to make the computer do one thing.
  lesson: u29-shell
- term: Working directory
  definition: The folder you are currently in; relative paths start here.
  lesson: u29-shell
- term: Home directory
  definition: Your own personal folder, written ~.
  lesson: u29-shell
- term: Root directory
  definition: The top folder that contains all others, written /.
  lesson: u29-shell
- term: Hidden file
  definition: A file whose name starts with a dot; most listings skip it.
  lesson: u29-shell
- term: Tab completion
  definition: Pressing Tab to finish a name for you.
  lesson: u29-shell
- term: File extension
  definition: The part of a file name after the last dot, such as .py.
  lesson: u29-shell
- term: Permission
  definition: A rule that says who may read, write or run a file.
  lesson: u29-files
- term: Octal
  definition: Counting in base 8, used to write permissions such as 755.
  lesson: u29-files
- term: Execute permission
  definition: The right to run a file as a program.
  lesson: u29-files
- term: chmod
  definition: The command that changes the permissions of a file.
  lesson: u29-files
- term: Owner
  definition: The user that a file belongs to.
  lesson: u29-files
- term: Recursive
  definition: Applying an action to a folder and everything inside it.
  lesson: u29-files
- term: Disk usage
  definition: How much storage space files and folders take.
  lesson: u29-files
- term: Standard input
  definition: The stream a program reads its input from, usually the keyboard.
  lesson: u29-text
- term: Standard output
  definition: The stream a program writes its results to, usually the screen.
  lesson: u29-text
- term: grep
  definition: A command that prints the lines of its input that contain a pattern.
  lesson: u29-text
- term: sort
  definition: A command that puts lines in order.
  lesson: u29-text
- term: Field
  definition: One piece of a line that is separated from the others by a delimiter.
  lesson: u29-text
- term: Delimiter
  definition: The character that separates fields, such as a comma or a tab.
  lesson: u29-text
- term: Log file
  definition: A file where a program writes down what happened, one line per event.
  lesson: u29-text
- term: Stream editor
  definition: A program, such as sed, that changes text as it flows past.
  lesson: u29-text
- term: Redirection
  definition: Sending a program's input or output to a file instead of the keyboard or screen.
  lesson: u29-pipes
- term: Tokenize
  definition: To split text into tokens.
  lesson: u29-pipes
- term: Quoting
  definition: Putting text in quotes so that the shell does not interpret it.
  lesson: u29-pipes
- term: Option
  definition: An argument that starts with a dash and changes how a command works.
  lesson: u29-pipes
- term: Unix philosophy
  definition: The idea of building small programs that do one thing and combining them.
  lesson: u29-pipes
- term: Expansion
  definition: The shell replacing wildcards, variables and braces with their values before running a command.
  lesson: u29-scripts
- term: Wildcard
  definition: A symbol such as * or ? that matches many names.
  lesson: u29-scripts
- term: Globbing
  definition: Matching file names with wildcards.
  lesson: u29-scripts
- term: Brace expansion
  definition: Turning file{1,2} into file1 and file2.
  lesson: u29-scripts
- term: Environment variable
  definition: A named value that every program started by the shell can read.
  lesson: u29-scripts
- term: Export
  definition: To make a shell variable part of the environment.
  lesson: u29-scripts
- term: Script
  definition: A file of commands that the shell runs one after the other.
  lesson: u29-scripts
- term: Shebang
  definition: 'The first line of a script, such as #!/bin/bash, that names the program that runs it.'
  lesson: u29-scripts
- term: Command substitution
  definition: Using the output of a command as text inside another command.
  lesson: u29-scripts
- term: Process ID
  definition: The number that identifies a running process.
  lesson: u29-system
- term: Init
  definition: The first process, with ID 1, which starts the others.
  lesson: u29-system
- term: Background process
  definition: A process started so that the prompt comes back immediately.
  lesson: u29-system
- term: Cron
  definition: The service that runs commands on a schedule.
  lesson: u29-system
- term: Crontab
  definition: The file that lists a user's scheduled jobs.
  lesson: u29-system
- term: xargs
  definition: A command that turns lines of input into arguments of another command.
  lesson: u29-system
