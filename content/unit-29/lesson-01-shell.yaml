  - name: normalizing
    code: |
      assert normalize("/a/b/../c/./d") == "/a/c/d" and normalize("/") == "/" and normalize("//a///b/") == "/a/b" and normalize("/..") == "/" and normalize("/a/../../..") == "/" and normalize("/a/b/c/../../") == "/a"
      assert normalize("/./.") == "/" and normalize("/a/.b/..c") == "/a/.b/..c"
  - name: what the user typed
    code: |
      assert resolve("/home/user", "docs") == "/home/user/docs" and resolve("/home/user", "..") == "/home" and resolve("/home/user", "/etc/hosts") == "/etc/hosts"
      assert resolve("/home/user", "~") == "/home/user" and resolve("/tmp", "~/notes.txt") == "/home/user/notes.txt" and resolve("/tmp", "") == "/tmp" and resolve("/", "..") == "/"
      assert resolve("/a/b", "../c/./d") == "/a/c/d" and resolve("/a", "~x") == "/a/~x"
