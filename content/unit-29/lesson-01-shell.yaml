- id: paths
  title: Absolute and relative paths
  difficulty: 3
  prompt: 'A **path** says where a file or folder is. An **absolute** path starts at the root `/`; a **relative** path starts at the **current working directory** (`cwd`). Write `normalize(path)` for an absolute path: split it at `/`, ignore empty parts and `.` parts (the current folder), and let `..` remove the previous part (at the top `..` stays at the top: `"/.."` is `"/"`); return `"/"` plus the parts joined with `/` (`"/"` if there are none). Write `resolve(cwd, path)`: turn what the user typed into an absolute clean path: a path starting with `~` (just `~` or `~/...`) starts at `HOME` (given) instead, a path that does not start with `/` is relative to `cwd`.'
  starter: |-
