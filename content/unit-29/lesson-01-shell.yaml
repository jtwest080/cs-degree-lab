id: u29-shell
title: The Shell and the File System
minutes: 90
objective: Learn what the command line is and why professionals use it, how paths work, and how the file system is organised. You will build a small file system and the commands `cd`, `ls`, `tree` and Tab completion on top of it.
outcomes:
- Explain what a shell and a terminal are
- Read absolute and relative paths
- Use `pwd`, `cd`, `ls`
- Normalize paths with `.` and `..`
- Describe how Tab completion works
sections:
- heading: What is the command line?
  body: |-
    Most programs you use have buttons and menus: a **graphical user interface** (GUI). Underneath, computers can also be driven by typing **commands**: that is the **command line**. A **terminal** is the window you type in. The **shell** is the program inside it that reads what you type, understands it and runs the programs you ask for. On macOS and Linux the usual shell is **bash** or **zsh**; on Windows there is **PowerShell**, and **WSL** gives Windows a Linux shell.

    Why bother, when clicking is easier at first? Because typed commands are **precise, repeatable and combinable**. You can save a command in a file and run it again tomorrow, do the same thing to a thousand files in one line, run programs on servers that have no screen at all, and chain small tools together. Every developer meets the shell sooner or later; Git, Python, web servers and cloud tools are all used from it.

    A shell prompt looks like `user@laptop:~$`. After it you type a command, possibly followed by **arguments** (what to work on) and **options** or **flags** (how to do it, starting with `-`):

    ```bash
    ls -l docs        # command: ls, option: -l, argument: docs
    ```

    > **Tip:** You cannot easily break your computer by typing commands you do not understand, as long as you avoid anything with `sudo` (run as administrator) or `rm -rf` until you know exactly what it does. In this unit everything runs on a safe pretend file system.
- heading: 'Paths: where things are'
  body: |-
    Files live in **folders** (also called **directories**) inside folders, forming a **tree** that starts at the **root**, written `/`. A **path** is a list of folders ending in the item you mean, separated by `/`: `/home/user/docs/report.md`.

    An **absolute path** starts with `/` and always means the same place. A **relative path** (no leading `/`) starts from where you are now, the **current working directory**, which `pwd` ("print working directory") shows. Two special names help: `.` means "this folder" and `..` means "the folder above". So from `/home/user/docs`, the path `../notes.txt` means `/home/user/notes.txt`. A leading `~` (tilde) stands for your **home directory**, your personal folder, such as `/home/user`.

    ```bash
    pwd                      # /home/user
    ls                       # docs  notes.txt  projects
    cd docs                  # go into docs
    cd ..                    # go back up
    cd ~/projects/app        # jump straight to a folder in your home
    ```

    The program must **normalize** what you type: join the cwd to relative paths, drop the `.` parts, and let each `..` cancel the part before it. File names starting with a dot, like `.bashrc`, are **hidden** (`ls` skips them; `ls -a` shows all). The part of a name after the last dot is its **extension** (`.md`, `.py`), a hint about the type.
- heading: Looking around and saving typing
  body: |-
    The three commands you will type most are `pwd` (where am I?), `ls` (what is here?) and `cd` (go there). `ls` has useful options: `-l` for details, `-a` for hidden files, `-R` for everything below. The tool `tree` draws a folder as an outline that shows the structure at a glance.

    Typing long paths is slow and error-prone, so shells offer **Tab completion**: type the first letters and press **Tab**. If only one name starts with those letters, the shell completes it; if several do, it completes the part they share, and pressing Tab twice lists the choices. It works by listing the folder and keeping the names that start with what you typed, exactly what you will code in this lesson. The **up arrow** brings back earlier commands, and `Ctrl+R` searches through them.

    Other habits: use `man ls` or `ls --help` to read about a command, and clear the screen with `clear`. In the next lessons we will create, copy and delete files, search text, and join commands with pipes.
examples:
- title: Cleaning up paths
  intro: The path arithmetic every shell does.
  code: |
    HOME = "/home/user"


    def normalize(path):
        """Clean an ABSOLUTE path (one that starts with '/'). Split it at '/', ignore empty parts and '.' parts (the current folder), and let '..' remove the previous part (at the top, '..' stays at the top: '/..' is '/'). Return '/' plus the remaining parts joined with '/'; the result for no parts is '/'."""
        parts = []
        for p in path.split("/"):
            if p in ("", "."):
                continue
            if p == "..":
                if parts:
                    parts.pop()
            else:
                parts.append(p)
        return "/" + "/".join(parts)


    def resolve(cwd, path):
        """Turn what the user typed into an absolute, clean path. `cwd` is the current working directory. A path starting with '~' (just '~' or '~/...') starts at HOME instead. A path that does not start with '/' is relative to cwd. Return the normalized absolute path."""
        if path == "~" or path.startswith("~/"):
            path = HOME + path[1:]
        if not path.startswith("/"):
            path = cwd + "/" + path
        return normalize(path)


    def split_path(path):
        """Split a path into (folder, name): normalize it first; the folder of '/a/b/c.txt' is '/a/b' and its name is 'c.txt'; for '/c.txt' the folder is '/'; for '/' itself return ('/', '')."""
        path = normalize(path)
        if path == "/":
            return ("/", "")
        i = path.rindex("/")
        return (path[:i] or "/", path[i + 1:])


    def extension(name):
        """The file extension of a name: the text after the LAST dot, without the dot, or '' if there is none. A leading dot does not count ('.bashrc' has no extension) and a name ending in a dot has none."""
        stem = name.lstrip(".")
        if "." not in stem:
            return ""
        return stem.rsplit(".", 1)[1]


    def join_path(*parts):
        """Join path parts with '/' like os.path.join, then normalize: a part that starts with '/' starts again from there (everything before it is dropped). The result is always absolute (a first part without '/' is taken from the root)."""
        result = ""
        for p in parts:
            if p.startswith("/"):
                result = p
            else:
                result += "/" + p
        return normalize(result)

    print(normalize("/home/user/../user/./docs//"))
    print(resolve("/home/user/docs", "../notes.txt"))
    print(resolve("/tmp", "~/notes.txt"))
    print(split_path("/home/user/report.final.md"), extension("report.final.md"))
    print(join_path("/home", "user", "/etc", "hosts"))
  output: |
    /home/user/docs
    /home/user/notes.txt
    /home/user/notes.txt
    ('/home/user', 'report.final.md') md
    /etc/hosts
