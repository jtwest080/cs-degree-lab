summary:
- The shell reads commands; the terminal is the window.
- Absolute paths start with /; relative ones start at the working directory.
- . is here, .. is the parent, ~ is your home.
- pwd, ls and cd are the basic navigation commands.
- Tab completion lists the folder and keeps names that match.
