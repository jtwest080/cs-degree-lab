      assert chmod_apply(0o755, "a-x") == 0o644 and chmod_apply(0o644, "g+w") == 0o664 and chmod_apply(0o644, "o-r") == 0o640 and chmod_apply(0, "a+rwx") == 0o777
  - name: setting
    code: |
      assert chmod_apply(0o777, "a=r") == 0o444 and chmod_apply(0o755, "u=rw") == 0o655 and chmod_apply(0o755, "go=") == 0o700 and chmod_apply(0o644, "=rwx") == 0o777 and chmod_apply(0o123, "g=r") == 0o143
  - name: several and bad specs
