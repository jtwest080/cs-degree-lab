      assert chmod_apply(0o644, "u+x,go-r") == 0o700 and chmod_apply(0o600, "u+x,g+r,o+r") == 0o744 and chmod_apply(0o777, "a-rwx,u+r") == 0o400
      for bad in ("", "u", "x+u", "u+q", "u+r+w", "z+x", "u+x,", "u++x"):
