- title: Permissions
  intro: A mode as letters, chmod, and who may do what.
  code: |
    def octal_to_rwx(mode):
        """File PERMISSIONS: each file has three groups of rights, for the OWNER, the GROUP and EVERYONE ELSE; each right is r (read, value 4), w (write, 2) or x (execute, 1). A MODE is a number whose three octal digits give these groups, such as 0o755. Turn a mode (an int from 0 to 0o777) into the 9-character string such as 'rwxr-xr-x' ('-' for a missing right)."""
        out = ""
        for shift in (6, 3, 0):
            bits = (mode >> shift) & 7
            out += ("r" if bits & 4 else "-") + ("w" if bits & 2 else "-") + ("x" if bits & 1 else "-")
        return out


    def rwx_to_octal(text):
        """The reverse: a 9-character string such as 'rw-r--r--' to the mode number (0o644). ValueError('bad mode') if it is not exactly 9 characters of the form r/w/x or '-' in the right places."""
        if len(text) != 9:
            raise ValueError("bad mode")
        mode = 0
        for i, ch in enumerate(text):
            want = "rwx"[i % 3]
            if ch == want:
                mode |= {"r": 4, "w": 2, "x": 1}[want] << (6 - 3 * (i // 3))
            elif ch != "-":
                raise ValueError("bad mode")
        return mode


    def can_access(meta, user, groups, action):
        """May `user` (who belongs to the list `groups`) do `action` ('r', 'w' or 'x') to a file whose metadata is meta = {"owner": name, "group": name, "mode": int}? Only ONE class of rights applies: the owner's if user == meta['owner'], else the group's if meta['group'] is in groups, else everyone else's. ValueError('bad action') for any other action."""
        if action not in ("r", "w", "x"):
            raise ValueError("bad action")
        if user == meta["owner"]:
            shift = 6
        elif meta["group"] in groups:
            shift = 3
        else:
            shift = 0
        return bool(((meta["mode"] >> shift) & 7) & {"r": 4, "w": 2, "x": 1}[action])


    def chmod_apply(mode, spec):
        """Change a mode with a SYMBOLIC spec like `chmod` does: optional who letters (u = owner, g = group, o = others, a = all; none means all), then one operator (+ adds rights, - removes them, = sets exactly these rights for those classes), then the rights r, w, x. Examples: 'u+x', 'go-w', 'a=r', '+x', 'u=rw'. Several specs may be joined with commas ('u+x,go-w'), applied from left to right. ValueError('bad spec') for anything else. Return the new mode."""
        for part in spec.split(","):
            i = 0
            while i < len(part) and part[i] in "ugoa":
                i += 1
            who, rest = part[:i], part[i:]
            if not rest or rest[0] not in "+-=" or any(c not in "rwx" for c in rest[1:]):
                raise ValueError("bad spec")
            op, rights = rest[0], rest[1:]
            classes = set()
            for w in (who or "a"):
                classes.update({"u": (6,), "g": (3,), "o": (0,), "a": (6, 3, 0)}[w])
            bits = sum({"r": 4, "w": 2, "x": 1}[c] for c in rights)
            for shift in classes:
                if op == "+":
                    mode |= bits << shift
                elif op == "-":
                    mode &= ~(bits << shift)
                else:
                    mode = (mode & ~(7 << shift)) | (bits << shift)
        return mode & 0o777

    mode = 0o644
    print(octal_to_rwx(mode), oct(mode))
    mode = chmod_apply(mode, "u+x")
    print(octal_to_rwx(mode), oct(mode))
    print(octal_to_rwx(chmod_apply(0o777, "go-w")))
    secret = {"owner": "ada", "group": "staff", "mode": 0o640}
    for user, groups in (("ada", []), ("bo", ["staff"]), ("cy", [])):
        print(user, [a for a in "rwx" if can_access(secret, user, groups, a)])
  output: |
    rw-r--r-- 0o644
    rwxr--r-- 0o744
    rwxr-xr-x
    ada ['r', 'w']
    bo ['r']
    cy []
