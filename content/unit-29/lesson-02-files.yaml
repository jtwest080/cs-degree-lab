id: u29-files
title: Files, Folders and Permissions
minutes: 100
objective: Learn to create, read, copy, move and delete files and folders from the shell, understand what permissions mean and how `chmod` changes them, and find out what is using your disk space. You will build `cat`, `touch`, `mkdir`, `cp`, `mv`, `rm`, `chmod` and `du` on the pretend file system.
outcomes:
- Create files and folders
- Copy, move and remove safely
- Read and set permissions
- Explain why rm -rf is dangerous
- Find large files
sections:
- heading: Making and changing things
  body: |-
    A handful of commands do most of the work. `mkdir name` makes a folder (`mkdir -p a/b/c` makes the whole chain). `touch file` creates an empty file. `cat file` prints a file's contents (the name comes from "concatenate" because it can join several). `cp a b` copies, `mv a b` moves or **renames** (moving within a folder is renaming), and `rm file` removes.

    ```bash
    mkdir -p projects/app
    touch projects/app/main.py
    cp notes.txt notes-backup.txt
    mv notes.txt docs/            # a folder as target: move inside it
    cp -r docs docs-backup        # -r: recursive, copy the folder and everything in it
    rm notes-backup.txt
    ```

    Two rules explain most behaviour. If the target of `cp` or `mv` is an **existing folder**, the item goes *inside* it; otherwise the target is the new name. And folders need `-r` (recursive) for copying and removing, because the command must visit everything below them.

    > **Warning:** There is **no recycle bin** at the command line. `rm` deletes for good, and `rm -rf folder` (recursive, force, no questions) is how people lose a project in one second, especially with a typo or an empty variable such as `rm -rf $DIR/`. Look at what you are deleting with `ls` first. Our `rm` refuses the root folder on purpose, and real systems add similar guards.
- heading: Permissions
  body: |-
    On a computer shared by many users and programs, files need **permissions**. Every file has an **owner** and a **group**, and three sets of rights: for the owner, for the group and for everyone else (called **others**). Each set may allow **read** (`r`), **write** (`w`) and **execute** (`x`, run it as a program, or for a folder, enter it).

    `ls -l` shows them: `-rw-r--r--` means a normal file where the owner can read and write, the group and others can only read. The nine letters can be written as three **octal digits**, because each right is a bit: read = 4, write = 2, execute = 1, so `rwx` = 7, `r-x` = 5, `r--` = 4. Thus `rw-r--r--` is `644` and `rwxr-xr-x` is `755`.

    ```bash
    chmod 644 notes.txt       # set exactly rw-r--r--
    chmod +x script.sh        # make it executable (for everyone)
    chmod u+x,go-w file       # owner may run it; group and others may not write
    ```

    Only **one** set applies to a given person: if you are the owner, the owner's rights decide, even if the group's are wider. Rights for folders mean: `r` list the names, `w` add or remove entries, `x` enter. Secrets such as private keys should be `600` (owner only); programs usually `755`. A very common beginner error is `Permission denied`, which usually means "you need chmod +x" or "this belongs to another user".
- heading: Where did my disk go?
  body: |-
    Disks fill up: logs grow, downloads accumulate, build folders swell. **`du`** (disk usage) adds up file sizes per folder, and `du -sh *` shows the total of each item in **h**uman-readable units (`K` kilobytes, `M` megabytes, `G` gigabytes, each 1024 times the one before). `df -h` shows free space on each disk. Sorting the sizes shows the biggest items first, and the biggest few usually explain everything.

    A **byte** is one character of ordinary English text, so a page of text is a few kilobytes, a photo some megabytes, a film some gigabytes. Knowing these sizes lets you judge whether a number is surprising.

    Next we will meet the tools that make the shell truly powerful: small programs that read text, change it and pass it on.
examples:
- title: Making a mess and cleaning up
  intro: Create, copy, move and remove, and see the safety rules.
  code: |
    HOME = "/home/user"


    def normalize(path):
        """Clean an ABSOLUTE path (one that starts with '/'). Split it at '/', ignore empty parts and '.' parts (the current folder), and let '..' remove the previous part (at the top, '..' stays at the top: '/..' is '/'). Return '/' plus the remaining parts joined with '/'; the result for no parts is '/'."""
        parts = []
        for p in path.split("/"):
            if p in ("", "."):
                continue
            if p == "..":
                if parts:
                    parts.pop()
            else:
                parts.append(p)
        return "/" + "/".join(parts)


    def resolve(cwd, path):
        """Turn what the user typed into an absolute, clean path. `cwd` is the current working directory. A path starting with '~' (just '~' or '~/...') starts at HOME instead. A path that does not start with '/' is relative to cwd. Return the normalized absolute path."""
        if path == "~" or path.startswith("~/"):
            path = HOME + path[1:]
        if not path.startswith("/"):
            path = cwd + "/" + path
        return normalize(path)


    def split_path(path):
        """Split a path into (folder, name): normalize it first; the folder of '/a/b/c.txt' is '/a/b' and its name is 'c.txt'; for '/c.txt' the folder is '/'; for '/' itself return ('/', '')."""
        path = normalize(path)
        if path == "/":
            return ("/", "")
        i = path.rindex("/")
        return (path[:i] or "/", path[i + 1:])


    def extension(name):
        """The file extension of a name: the text after the LAST dot, without the dot, or '' if there is none. A leading dot does not count ('.bashrc' has no extension) and a name ending in a dot has none."""
        stem = name.lstrip(".")
        if "." not in stem:
            return ""
        return stem.rsplit(".", 1)[1]


    def join_path(*parts):
        """Join path parts with '/' like os.path.join, then normalize: a part that starts with '/' starts again from there (everything before it is dropped). The result is always absolute (a first part without '/' is taken from the root)."""
        result = ""
        for p in parts:
            if p.startswith("/"):
                result = p
            else:
                result += "/" + p
        return normalize(result)


    def new_fs():
        """A tiny file system: {"dirs": a set holding just '/', "files": an empty dict mapping absolute path -> text}."""
        return {"dirs": {"/"}, "files": {}}


    def is_dir(fs, path):
        """True if the (normalized) path is a directory."""
        return normalize(path) in fs["dirs"]


    def is_file(fs, path):
        """True if the (normalized) path is a file."""
        return normalize(path) in fs["files"]


    def mkdir_p(fs, path):
        """Like `mkdir -p`: create the directory and all missing parents (already existing ones are fine). ValueError('not a directory') if some part of the path is a FILE."""
        cur = ""
        for part in [p for p in normalize(path).split("/") if p]:
            cur += "/" + part
            if cur in fs["files"]:
                raise ValueError("not a directory")
            fs["dirs"].add(cur)


    def write_file(fs, path, text):
        """Create or overwrite a file. ValueError('is a directory') if the path is a directory or the root; ValueError('no such directory') if its folder does not exist."""
        path = normalize(path)
        folder, name = split_path(path)
        if not name or path in fs["dirs"]:
            raise ValueError("is a directory")
        if folder not in fs["dirs"]:
            raise ValueError("no such directory")
        fs["files"][path] = text


    def ls(fs, path, all=False):
        """List a directory like `ls`: the sorted names of the things directly inside it, with '/' added after directory names. Names that start with '.' are hidden unless all=True. For a FILE return just [its name]. ValueError('no such file or directory') if the path does not exist."""
        path = normalize(path)
        if path in fs["files"]:
            return [split_path(path)[1]]
        if path not in fs["dirs"]:
            raise ValueError("no such file or directory")
        names = set()
        for d in fs["dirs"]:
            if d != path and split_path(d)[0] == path:
                names.add(split_path(d)[1] + "/")
        for f in fs["files"]:
            if split_path(f)[0] == path:
                names.add(split_path(f)[1])
        return sorted(n for n in names if all or not n.startswith("."))


    def tree_lines(fs, path):
        """Draw a directory as an outline: the first line is the directory's own name ('/' for the root) followed by '/' unless it is the root; below it every entry of ls(fs, path, all=True) on its own line, indented by 2 spaces per level, directories followed by '/' and listed with their contents right below them (depth first). ValueError('not a directory') if the path is not a directory."""
        path = normalize(path)
        if path not in fs["dirs"]:
            raise ValueError("not a directory")
        lines = ["/" if path == "/" else split_path(path)[1] + "/"]

        def walk(folder, depth):
            for name in ls(fs, folder, all=True):
                lines.append("  " * depth + name)
                if name.endswith("/"):
                    walk(join_path(folder, name[:-1]), depth + 1)

        walk(path, 1)
        return lines


    def cd(fs, cwd, path):
        """Like `cd`: return the new working directory resolve(cwd, path). ValueError('not a directory') if it is a file, ValueError('no such directory') if it does not exist."""
        target = resolve(cwd, path)
        if target in fs["files"]:
            raise ValueError("not a directory")
        if target not in fs["dirs"]:
            raise ValueError("no such directory")
        return target


    def under(fs, path):
        """Everything at or below a path: return (dirs, files): the sorted list of directories whose path is `path` or starts with `path + '/'`, and the same for files (a file path equal to `path` counts). The path is normalized first."""
        path = normalize(path)
        prefix = "/" if path == "/" else path + "/"
        dirs = sorted(d for d in fs["dirs"] if d == path or d.startswith(prefix))
        files = sorted(f for f in fs["files"] if f == path or f.startswith(prefix))
        return dirs, files


    def demo_fs():
        fs = new_fs()
        mkdir_p(fs, "/home/user/docs")
        mkdir_p(fs, "/home/user/.config")
        mkdir_p(fs, "/home/user/projects/app")
        write_file(fs, "/home/user/notes.txt", "buy milk\n")
        write_file(fs, "/home/user/docs/report.md", "# Report\n")
        write_file(fs, "/home/user/docs/readme.md", "# Read me\n")
        write_file(fs, "/home/user/projects/app/main.py", "print('hi')\n")
        write_file(fs, "/home/user/.bashrc", "export A=1\n")
        return fs


    def cat(fs, *paths):
        """Return the text of the files one after the other. ValueError('no such file: PATH') for a missing path and ValueError('is a directory: PATH') for a directory (using the path as given). Check each path in order."""
        out = ""
        for p in paths:
            if is_dir(fs, p):
                raise ValueError("is a directory: " + p)
            if not is_file(fs, p):
                raise ValueError("no such file: " + p)
            out += fs["files"][normalize(p)]
        return out


    def touch(fs, path):
        """Create an EMPTY file if the path does not exist yet; an existing file is left unchanged. ValueError('is a directory') for a directory; ValueError('no such directory') if the folder does not exist."""
        path = normalize(path)
        if path in fs["files"]:
            return
        write_file(fs, path, "")


    def mkdir(fs, path):
        """Like `mkdir` without -p: create ONE directory. ValueError('file exists') if the path already exists (as a file or directory); ValueError('no such directory') if its folder does not exist."""
        path = normalize(path)
        if path in fs["files"] or path in fs["dirs"]:
            raise ValueError("file exists")
        if split_path(path)[0] not in fs["dirs"]:
            raise ValueError("no such directory")
        fs["dirs"].add(path)


    def destination(fs, src, dst):
        """Where does `cp src dst` put the copy? If dst is an existing directory the copy goes INSIDE it under the source's own name (join_path(dst, name of src)); otherwise the destination is dst itself (normalized)."""
        if is_dir(fs, dst):
            return join_path(dst, split_path(src)[1])
        return normalize(dst)


    def cp(fs, src, dst, recursive=False):
        """Copy a file or, with recursive=True, a whole directory. ValueError('no such file or directory') if src does not exist; ValueError('is a directory') if src is a directory and recursive is False; ValueError('no such directory') if the folder of the destination does not exist. Copying a directory into itself is an error: ValueError('cannot copy into itself'). Copy the directories and files given by under(fs, src), replacing the start of each path by the destination (see destination). Use the helpers."""
        src = normalize(src)
        if src not in fs["files"] and src not in fs["dirs"]:
            raise ValueError("no such file or directory")
        target = destination(fs, src, dst)
        if split_path(target)[0] not in fs["dirs"]:
            raise ValueError("no such directory")
        if src in fs["files"]:
            fs["files"][target] = fs["files"][src]
            return
        if not recursive:
            raise ValueError("is a directory")
        if target == src or target.startswith(src + "/"):
            raise ValueError("cannot copy into itself")
        dirs, files = under(fs, src)
        for d in dirs:
            fs["dirs"].add(target + d[len(src):])
        for f in files:
            fs["files"][target + f[len(src):]] = fs["files"][f]


    def rm(fs, path, recursive=False):
        """Remove a file, or with recursive=True a directory and everything in it. ValueError('refusing to remove /') for the root (check first); ValueError('no such file or directory'); ValueError('is a directory') for a directory when recursive is False."""
        path = normalize(path)
        if path == "/":
            raise ValueError("refusing to remove /")
        if path in fs["files"]:
            del fs["files"][path]
            return
        if path not in fs["dirs"]:
            raise ValueError("no such file or directory")
        if not recursive:
            raise ValueError("is a directory")
        dirs, files = under(fs, path)
        for d in dirs:
            fs["dirs"].discard(d)
        for f in files:
            del fs["files"][f]


    def mv(fs, src, dst):
        """Move or rename: copy (recursively for a directory) with cp, then remove the original, but never remove the copy by accident: ValueError('no such file or directory') if src is missing, and nothing happens if the destination is the source itself. Use the same destination rule as cp."""
        src = normalize(src)
        if src not in fs["files"] and src not in fs["dirs"]:
            raise ValueError("no such file or directory")
        if destination(fs, src, dst) == src:
            return
        cp(fs, src, dst, recursive=True)
        rm(fs, src, recursive=True)

    fs = demo_fs()
    touch(fs, "/home/user/todo.txt")
    cp(fs, "/home/user/docs", "/home/user/backup", recursive=True)
    print(ls(fs, "/home/user"))
    mv(fs, "/home/user/notes.txt", "/home/user/docs")
    rm(fs, "/home/user/backup", recursive=True)
    print(ls(fs, "/home/user"), ls(fs, "/home/user/docs"))
    try:
        rm(fs, "/home/user/docs")
    except ValueError as err:
        print("rm docs:", err)
    try:
        rm(fs, "/")
    except ValueError as err:
        print("rm /:", err)
    print(repr(cat(fs, "/home/user/docs/notes.txt")))
  output: |
    ['backup/', 'docs/', 'notes.txt', 'projects/', 'todo.txt']
    ['docs/', 'projects/', 'todo.txt'] ['notes.txt', 'readme.md', 'report.md']
    rm docs: is a directory
    rm /: refusing to remove /
    'buy milk\n'
