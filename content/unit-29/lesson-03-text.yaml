    def parse_log_line(line):
        """A WEB SERVER LOG has one line per request, for example `203.0.113.5 GET /index.html 200 1024` (visitor address, method, path, status code, bytes sent). Return {"ip": str, "method": str, "path": str, "status": int, "size": int}. ValueError('bad log line') if there are not exactly five whitespace-separated fields or the last two are not whole numbers."""
        pass


    def status_counts(lines):
        """How many requests had each status code: a dict {status: count}, in increasing order of status. Lines that cannot be parsed are ignored."""
        pass


    def top_paths(lines, n):
        """The n most requested paths as (path, count) pairs, most requested first, ties by path. Unparseable lines are ignored."""
        pass


    def bytes_by_ip(lines):
        """The total bytes sent to each visitor: a dict {ip: bytes}, sorted by ip text. Unparseable lines are ignored."""
        pass


    def error_rate(lines):
        """The share of parseable requests whose status is 400 or higher, as a percentage rounded to 1 decimal (0.0 if there are no parseable lines)."""
        pass
  tests:
  - name: parsing
    code: |
      assert parse_log_line("10.0.0.1 GET /a.html 200 1500") == {"ip": "10.0.0.1", "method": "GET", "path": "/a.html", "status": 200, "size": 1500}
      assert parse_log_line("  1.1.1.1   POST   /x   404   0  ")["status"] == 404
      for bad in ("", "a b c", "1.1.1.1 GET /x 200", "1.1.1.1 GET /x OK 10", "1.1.1.1 GET /x 200 -5", "1.1.1.1 GET /x 200 5 extra"):
          try:
              parse_log_line(bad)
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "bad log line" in str(e)
  - name: counting
    code: |
      assert status_counts(LOG) == {200: 3, 304: 1, 404: 1, 500: 1} and list(status_counts(LOG)) == [200, 304, 404, 500] and status_counts([]) == {} and status_counts(["junk"]) == {}
      assert top_paths(LOG, 2) == [("/index.html", 3), ("/about.html", 1)] and top_paths(LOG, 0) == [] and len(top_paths(LOG, 99)) == 4 and top_paths([], 3) == []
  - name: per visitor and errors
    code: |
      assert bytes_by_ip(LOG) == {"10.0.0.1": 3000, "10.0.0.2": 1100, "10.0.0.3": 120} and list(bytes_by_ip(LOG)) == ["10.0.0.1", "10.0.0.2", "10.0.0.3"] and bytes_by_ip([]) == {}
      assert error_rate(LOG) == 33.3 and error_rate([]) == 0.0 and error_rate(["junk"]) == 0.0 and error_rate(["1.1.1.1 GET /x 200 1"]) == 0.0 and error_rate(["1.1.1.1 GET /x 500 1"]) == 100.0
  hints:
  - Use a try/except around parse_log_line to skip bad lines in every function.
  solution: |
    LOG = [
        "10.0.0.1 GET /index.html 200 1500",
        "10.0.0.2 GET /about.html 200 800",
        "10.0.0.1 GET /index.html 304 0",
        "10.0.0.3 GET /missing 404 120",
        "10.0.0.2 POST /login 500 300",
        "garbage line",
        "10.0.0.1 GET /index.html 200 1500",
    ]




    def parse_log_line(line):
        """A WEB SERVER LOG has one line per request, for example `203.0.113.5 GET /index.html 200 1024` (visitor address, method, path, status code, bytes sent). Return {"ip": str, "method": str, "path": str, "status": int, "size": int}. ValueError('bad log line') if there are not exactly five whitespace-separated fields or the last two are not whole numbers."""
        parts = line.split()
        if len(parts) != 5 or not parts[3].isdigit() or not parts[4].isdigit():
            raise ValueError("bad log line")
        return {"ip": parts[0], "method": parts[1], "path": parts[2], "status": int(parts[3]), "size": int(parts[4])}


    def status_counts(lines):
        """How many requests had each status code: a dict {status: count}, in increasing order of status. Lines that cannot be parsed are ignored."""
        counts = {}
        for line in lines:
            try:
                s = parse_log_line(line)["status"]
            except ValueError:
                continue
            counts[s] = counts.get(s, 0) + 1
        return dict(sorted(counts.items()))


    def top_paths(lines, n):
        """The n most requested paths as (path, count) pairs, most requested first, ties by path. Unparseable lines are ignored."""
        counts = {}
        for line in lines:
            try:
                p = parse_log_line(line)["path"]
            except ValueError:
                continue
            counts[p] = counts.get(p, 0) + 1
        return sorted(counts.items(), key=lambda r: (-r[1], r[0]))[:n]


    def bytes_by_ip(lines):
        """The total bytes sent to each visitor: a dict {ip: bytes}, sorted by ip text. Unparseable lines are ignored."""
        totals = {}
        for line in lines:
            try:
                rec = parse_log_line(line)
            except ValueError:
                continue
            totals[rec["ip"]] = totals.get(rec["ip"], 0) + rec["size"]
        return dict(sorted(totals.items()))


    def error_rate(lines):
        """The share of parseable requests whose status is 400 or higher, as a percentage rounded to 1 decimal (0.0 if there are no parseable lines)."""
        recs = []
        for line in lines:
            try:
                recs.append(parse_log_line(line))
            except ValueError:
                pass
        if not recs:
            return 0.0
        return round(100 * sum(1 for r in recs if r["status"] >= 400) / len(recs), 1)
  explanation: Two lines of this kind of analysis often answer the question 'is the site broken or just busy?'.
commonMistakes:
- title: Using uniq without sort
  explanation: uniq only joins adjacent duplicates.
- title: Sorting numbers as text
  explanation: Use sort -n, or 10 sorts before 9.
- title: Forgetting g in sed
  explanation: Without it only the first match on each line changes.
- title: Mixing up plain text and regular expressions
  explanation: A dot in a regex matches any character.
- title: Editing a file in place without a backup
  explanation: sed -i overwrites; keep a copy or use version control.
summary:
- Small tools work on lines of plain text.
- head, tail, wc, cut and tr select and count.
- sort then uniq -c counts frequencies.
- grep finds lines; its options invert, number and count.
- sed replaces text; regular expressions describe patterns.
