id: u29-text
title: Text Tools
minutes: 100
objective: 'Meet the small programs that make the shell powerful: `head`, `tail`, `wc`, `cut`, `tr`, `sort`, `uniq`, `grep` and `sed`. You will write each one and use them together to analyse a web server log, a real daily task.'
outcomes:
- Use head, tail and wc
- Select columns with cut
- Sort and count with sort and uniq
- Search with grep and regular expressions
- Replace text with sed
- Analyse a log file
sections:
- heading: Everything is text
  body: |-
    Unix-style systems follow a philosophy: write small programs that **do one thing well** and work on **plain text**, so that they can be combined. A text file is a list of **lines**; a line is often a list of **fields** (separated by spaces, commas or colons). The tools in this lesson read lines in, change or select them, and write lines out.

    `head -n 5 file` shows the first five lines and `tail -n 5 file` the last five (`tail -f file` keeps watching a growing log). `wc` counts **l**ines, **w**ords and **c**haracters (`wc -l` is the usual way to count lines). `cut -d, -f1,3 data.csv` keeps fields 1 and 3 of a comma-separated file. `tr 'a-z' 'A-Z'` translates characters, here to upper case.

    ```bash
    head -n 3 report.txt
    wc -l *.py                      # lines in each Python file
    cut -d: -f1 /etc/passwd         # the user names
    tr 'a-z' 'A-Z' < notes.txt
    ```
- heading: Sorting and counting
  body: |-
    `sort` puts lines in order. By default it compares them as **text**, so `10` comes before `9` (because `1` comes before `9`); `sort -n` compares **numbers**, `-r` reverses, `-u` removes duplicates, `-f` ignores case. `uniq` collapses **adjacent** identical lines, which is why it is almost always used after `sort`; `uniq -c` adds a count to each.

    Together they make the best-known one-liner of the shell, the frequency count:

    ```bash
    sort words.txt | uniq -c | sort -n -r | head -n 5
    ```

    Read it left to right: sort the words so that equal ones are adjacent, count each run, sort the counts from largest, keep the top five. The **pipe** `|` that joins the steps is the subject of the next lesson. Note that `sort` is stable in our version and keeps equal lines in input order; real `sort` details differ a little depending on your locale, which also affects how upper and lower case are ordered.
- heading: Searching and replacing
  body: |-
    **`grep`** prints the lines that match a pattern, and it is the command you will use most. Useful options: `-i` ignore case, `-v` show lines that do **not** match, `-n` show line numbers, `-c` count matching lines, `-r` search all files in a folder. By default the pattern is plain text; with `-E` it is an **extended regular expression**.

    A **regular expression** (regex) is a compact language for patterns: `.` any character, `^` the start of a line, `$` the end, `*` repeated, `\d` a digit, `[abc]` one of these, `a|b` either. `grep -E '^ERROR [0-9]+' app.log` finds lines that start with `ERROR` and a number. You met regexes in Unit 16 and will use them in many languages.

    **`sed`** edits a stream. Its most common job is substitution: `sed 's/old/new/g'` replaces every `old` by `new` on each line (`g` means global; without it only the first match per line changes). With `-i` it edits the file in place, which is how you rename something in many files at once. For columns and arithmetic there is **`awk`**, a small language of its own: `awk '{ total += $3 } END { print total }'` adds up the third field.

    > **Tip:** Build pipelines step by step. Run the first command, look at the output, add the next stage, and check again. Debugging a long one-liner you wrote all at once is much harder.
examples:
- title: Counting words
  intro: The classic sort and count one-liner, plus wc, cut and tr.
  code: |
    def head(lines, n=10):
        """The first n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        return lines[:n] if n > 0 else []


    def tail(lines, n=10):
        """The last n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        return lines[-n:] if n > 0 else []


    def wc(text):
        """Like `wc`: return (number of lines, number of words, number of characters). Lines are counted as the number of newline characters; words are the pieces of text.split(); characters are len(text)."""
        return (text.count("\n"), len(text.split()), len(text))


    def cut(lines, delimiter, fields):
        """Like `cut -d DELIMITER -f FIELDS`: split every line at the delimiter and keep the chosen fields. `fields` is a list of 1-based field numbers; they are output in the ORDER OF THE LINE (not the order given) with duplicates removed, joined again with the delimiter; a field the line does not have is skipped. A line that has no delimiter at all is returned unchanged."""
        out = []
        for line in lines:
            if delimiter not in line:
                out.append(line)
                continue
            parts = line.split(delimiter)
            keep = sorted(set(f for f in fields if 1 <= f <= len(parts)))
            out.append(delimiter.join(parts[i - 1] for i in keep))
        return out


    def tr(text, source, target):
        """Like `tr`: replace each character of `source` by the character at the same position of `target`. If target is shorter, its LAST character is used for the rest; if target is empty the characters of source are DELETED. Other characters are unchanged."""
        table = {}
        for i, ch in enumerate(source):
            if not target:
                table[ch] = ""
            else:
                table[ch] = target[min(i, len(target) - 1)]
        return "".join(table.get(c, c) for c in text)


    def sort_lines(lines, reverse=False, numeric=False, unique=False, ignore_case=False):
        """Like `sort`. Normally compare lines as text. numeric=True (`-n`): compare by the number at the START of the line (after any leading blanks: the digits, with an optional '-' sign and decimal point, as a float); a line without a leading number counts as 0. ignore_case=True (`-f`) compares text in lower case. Equal keys keep their original order (the sort is stable), also when reverse=True (use sorted(..., reverse=reverse)). unique=True (`-u`) then keeps only the FIRST of lines that compare equal (equal KEYS, so with ignore_case 'A' and 'a' are the same)."""
        import re

        def key(line):
            if numeric:
                m = re.match(r"\s*(-?\d+(\.\d+)?)", line)
                return float(m.group(1)) if m else 0.0
            return line.lower() if ignore_case else line

        result = sorted(lines, key=key, reverse=reverse)
        if unique:
            seen, out = set(), []
            for line in result:
                k = key(line)
                if k not in seen:
                    seen.add(k)
                    out.append(line)
            return out
        return result


    def uniq(lines, count=False):
        """Like `uniq`: collapse runs of ADJACENT equal lines into one (so the input must be sorted to remove all duplicates). With count=True each output line is the run length right-aligned in 7 characters, a space, then the line (`'%7d %s'`)."""
        out = []
        for line in lines:
            if out and out[-1][0] == line:
                out[-1][1] += 1
            else:
                out.append([line, 1])
        if count:
            return ["%7d %s" % (n, line) for line, n in out]
        return [line for line, n in out]

    words = "the cat and the dog and the bird".split()
    print(uniq(sort_lines(words), count=True))
    ranked = sort_lines(uniq(sort_lines(words), count=True), numeric=True, reverse=True)
    print(ranked[0].strip())
    print(wc("one two\nthree\n"))
    print(cut(["ada:30:london", "bo:25:paris"], ":", [1, 3]))
    print(tr("hello", "el", "ip"))
    print(head(["a", "b", "c"], 2), tail(["a", "b", "c"], 1))
  output: |
    ['      2 and', '      1 bird', '      1 cat', '      1 dog', '      3 the']
    3 the
    (2, 3, 14)
    ['ada:london', 'bo:paris']
    hippo
    ['a', 'b'] ['c']
