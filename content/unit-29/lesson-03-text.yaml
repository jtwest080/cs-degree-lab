- title: Searching and a log
  intro: grep, sed and a little log analysis.
  code: |
    import re


    def grep(lines, pattern, ignore_case=False, invert=False, number=False, count=False, regex=False):
        """Like `grep`: keep the lines that CONTAIN the pattern (plain text; with regex=True a regular expression found with re.search). ignore_case=True (`-i`) ignores letter case. invert=True (`-v`) keeps the lines that do NOT match. number=True (`-n`) puts the 1-based line number and a colon in front of each kept line ('3:text'). count=True (`-c`) returns just a one-item list holding the number of kept lines as a string. ValueError('bad pattern') if regex=True and the pattern is not a valid regular expression."""
        flags = re.IGNORECASE if ignore_case else 0
        if regex:
            try:
                rx = re.compile(pattern, flags)
            except re.error:
                raise ValueError("bad pattern")
            test = lambda line: rx.search(line) is not None
        else:
            needle = pattern.lower() if ignore_case else pattern
            test = lambda line: needle in (line.lower() if ignore_case else line)
        kept = [(i, line) for i, line in enumerate(lines, 1) if test(line) != invert]
        if count:
            return [str(len(kept))]
        return [("%d:%s" % (i, line)) if number else line for i, line in kept]


    import re


    def sed_s(lines, expr):
        """Like `sed 's/OLD/NEW/'`: expr has the form 's/old/new/' or 's/old/new/g' (replace every match instead of only the first) or with the flag 'i' (ignore case) or both ('gi' or 'ig'); 'old' is a regular expression, 'new' is plain replacement text. The separator is always '/'. ValueError('bad expression') for anything else (not exactly four parts, not starting with 's', unknown flags, an invalid regular expression). Return the changed lines."""
        parts = expr.split("/")
        if len(parts) != 4 or parts[0] != "s" or parts[3] not in ("", "g", "i", "gi", "ig"):
            raise ValueError("bad expression")
        flags = re.IGNORECASE if "i" in parts[3] else 0
        try:
            rx = re.compile(parts[1], flags)
        except re.error:
            raise ValueError("bad expression")
        count = 0 if "g" in parts[3] else 1
        return [rx.sub(parts[2], line, count=count) for line in lines]


    LOG = [
        "10.0.0.1 GET /index.html 200 1500",
        "10.0.0.2 GET /about.html 200 800",
        "10.0.0.1 GET /index.html 304 0",
        "10.0.0.3 GET /missing 404 120",
        "10.0.0.2 POST /login 500 300",
        "garbage line",
        "10.0.0.1 GET /index.html 200 1500",
    ]


    def parse_log_line(line):
        """A WEB SERVER LOG has one line per request, for example `203.0.113.5 GET /index.html 200 1024` (visitor address, method, path, status code, bytes sent). Return {"ip": str, "method": str, "path": str, "status": int, "size": int}. ValueError('bad log line') if there are not exactly five whitespace-separated fields or the last two are not whole numbers."""
        parts = line.split()
        if len(parts) != 5 or not parts[3].isdigit() or not parts[4].isdigit():
            raise ValueError("bad log line")
        return {"ip": parts[0], "method": parts[1], "path": parts[2], "status": int(parts[3]), "size": int(parts[4])}


    def status_counts(lines):
        """How many requests had each status code: a dict {status: count}, in increasing order of status. Lines that cannot be parsed are ignored."""
        counts = {}
        for line in lines:
            try:
                s = parse_log_line(line)["status"]
            except ValueError:
                continue
            counts[s] = counts.get(s, 0) + 1
        return dict(sorted(counts.items()))


    def top_paths(lines, n):
        """The n most requested paths as (path, count) pairs, most requested first, ties by path. Unparseable lines are ignored."""
        counts = {}
        for line in lines:
            try:
                p = parse_log_line(line)["path"]
            except ValueError:
                continue
            counts[p] = counts.get(p, 0) + 1
        return sorted(counts.items(), key=lambda r: (-r[1], r[0]))[:n]


    def bytes_by_ip(lines):
        """The total bytes sent to each visitor: a dict {ip: bytes}, sorted by ip text. Unparseable lines are ignored."""
        totals = {}
        for line in lines:
            try:
                rec = parse_log_line(line)
            except ValueError:
                continue
            totals[rec["ip"]] = totals.get(rec["ip"], 0) + rec["size"]
        return dict(sorted(totals.items()))


    def error_rate(lines):
        """The share of parseable requests whose status is 400 or higher, as a percentage rounded to 1 decimal (0.0 if there are no parseable lines)."""
        recs = []
        for line in lines:
            try:
                recs.append(parse_log_line(line))
            except ValueError:
                pass
        if not recs:
            return 0.0
        return round(100 * sum(1 for r in recs if r["status"] >= 400) / len(recs), 1)

    print(grep(LOG, "index"))
    print(grep(LOG, "200", invert=True, number=True))
    print(grep(LOG, r"^10\.0\.0\.[12] ", regex=True, count=True))
    print(sed_s(["a cat sat"], "s/cat/dog/"))
    print(status_counts(LOG))
    print(top_paths(LOG, 2))
    print(error_rate(LOG), "% errors")
  output: |
    ['10.0.0.1 GET /index.html 200 1500', '10.0.0.1 GET /index.html 304 0', '10.0.0.1 GET /index.html 200 1500']
    ['3:10.0.0.1 GET /index.html 304 0', '4:10.0.0.3 GET /missing 404 120', '5:10.0.0.2 POST /login 500 300', '6:garbage line']
    ['5']
    ['a dog sat']
    {200: 3, 304: 1, 404: 1, 500: 1}
    [('/index.html', 3), ('/about.html', 1)]
    33.3 % errors
