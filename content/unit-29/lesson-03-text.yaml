exercises:
- id: slices
  title: head, tail, wc, cut and tr
  difficulty: 3
  prompt: 'The shell''s text tools work on **lines**. Write `head(lines, n=10)`: the first `n` lines (all of them if there are fewer, `[]` if `n <= 0`). Write `tail(lines, n=10)`: the last `n` lines (same rules). Write `wc(text)`: like `wc`: return `(number of lines, number of words, number of characters)`: lines are the number of **newline characters**, words are the pieces of `text.split()`, characters are `len(text)`. Write `cut(lines, delimiter, fields)`: like `cut -d DELIMITER -f FIELDS`: split every line at the delimiter and keep the chosen fields (`fields` is a list of **1-based** numbers); they come out in the **order of the line** (not the order given) without duplicates, joined again with the delimiter; a field the line does not have is skipped; a line with no delimiter at all is returned unchanged. Write `tr(text, source, target)`: replace each character of `source` by the character at the same position of `target`; if `target` is shorter its **last** character is used for the rest; if `target` is empty the characters of `source` are **deleted**; other characters stay.'
  starter: |-
    def head(lines, n=10):
        """The first n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        pass


    def tail(lines, n=10):
        """The last n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        pass


    def wc(text):
        """Like `wc`: return (number of lines, number of words, number of characters). Lines are counted as the number of newline characters; words are the pieces of text.split(); characters are len(text)."""
        pass


    def cut(lines, delimiter, fields):
        """Like `cut -d DELIMITER -f FIELDS`: split every line at the delimiter and keep the chosen fields. `fields` is a list of 1-based field numbers; they are output in the ORDER OF THE LINE (not the order given) with duplicates removed, joined again with the delimiter; a field the line does not have is skipped. A line that has no delimiter at all is returned unchanged."""
        pass


    def tr(text, source, target):
        """Like `tr`: replace each character of `source` by the character at the same position of `target`. If target is shorter, its LAST character is used for the rest; if target is empty the characters of source are DELETED. Other characters are unchanged."""
        pass
  tests:
  - name: head and tail
    code: |
      L = ["a", "b", "c", "d", "e"]
      assert head(L, 2) == ["a", "b"] and head(L, 99) == L and head(L, 0) == [] and head(L, -1) == [] and head([], 3) == []
      assert tail(L, 2) == ["d", "e"] and tail(L, 99) == L and tail(L, 0) == [] and tail(L, -3) == [] and tail(L, 5) == L
      assert len(head(list(range(50)))) == 10 and tail(list(range(50)))[0] == 40
  - name: counting
    code: |
      assert wc("one two\nthree\n") == (2, 3, 14) and wc("") == (0, 0, 0) and wc("no newline") == (0, 2, 10) and wc("  a   b  \n\n") == (2, 2, 11)
  - name: cutting columns
    code: |
      rows = ["ada:30:london", "bo:25:paris", "cy:41"]
      assert cut(rows, ":", [1]) == ["ada", "bo", "cy"] and cut(rows, ":", [3]) == ["london", "paris", ""]
      assert cut(rows, ":", [3, 1]) == ["ada:london", "bo:paris", "cy"] and cut(rows, ":", [1, 1, 2]) == ["ada:30", "bo:25", "cy:41"] and cut(["no delimiter"], ":", [2]) == ["no delimiter"] and cut(rows, ":", [9]) == ["", "", ""]
      assert cut(["a,b,c"], ",", [0, 2]) == ["b"]
  - name: translating
    code: |
      assert tr("hello world", "lo", "01") == "he001 w1r0d" and tr("hello", "el", "x") == "hxxxo" and tr("hello", "l", "") == "heo" and tr("abc", "", "x") == "abc" and tr("", "a", "b") == ""
      assert tr("Hello", "abcdefghijklmnopqrstuvwxyz", "ABCDEFGHIJKLMNOPQRSTUVWXYZ") == "HELLO"
  hints:
  - Slices handle too-large n gracefully.
  - A dict from source characters to replacements makes tr simple.
  solution: |
    def head(lines, n=10):
        """The first n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        return lines[:n] if n > 0 else []


    def tail(lines, n=10):
        """The last n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        return lines[-n:] if n > 0 else []


    def wc(text):
        """Like `wc`: return (number of lines, number of words, number of characters). Lines are counted as the number of newline characters; words are the pieces of text.split(); characters are len(text)."""
        return (text.count("\n"), len(text.split()), len(text))


    def cut(lines, delimiter, fields):
        """Like `cut -d DELIMITER -f FIELDS`: split every line at the delimiter and keep the chosen fields. `fields` is a list of 1-based field numbers; they are output in the ORDER OF THE LINE (not the order given) with duplicates removed, joined again with the delimiter; a field the line does not have is skipped. A line that has no delimiter at all is returned unchanged."""
        out = []
        for line in lines:
            if delimiter not in line:
                out.append(line)
                continue
            parts = line.split(delimiter)
            keep = sorted(set(f for f in fields if 1 <= f <= len(parts)))
            out.append(delimiter.join(parts[i - 1] for i in keep))
        return out


    def tr(text, source, target):
        """Like `tr`: replace each character of `source` by the character at the same position of `target`. If target is shorter, its LAST character is used for the rest; if target is empty the characters of source are DELETED. Other characters are unchanged."""
        table = {}
        for i, ch in enumerate(source):
            if not target:
                table[ch] = ""
            else:
                table[ch] = target[min(i, len(target) - 1)]
        return "".join(table.get(c, c) for c in text)
  explanation: Each tool does one small job; the power comes from combining them in the next lesson.
- id: sorting
  title: sort and uniq
  difficulty: 4
  prompt: 'Write `sort_lines(lines, reverse=False, numeric=False, unique=False, ignore_case=False)`: like `sort`. Normally compare lines as **text**. `numeric=True` (`-n`) compares by the **number at the start** of the line (after any leading blanks: digits with an optional `"-"` sign and decimal point, as a float; a line without a leading number counts as 0). `ignore_case=True` (`-f`) compares text in lower case. Equal keys keep their **original order** (the sort is stable, also with `reverse=True`: use `sorted(..., reverse=reverse)`). `unique=True` (`-u`) then keeps only the **first** of lines with equal keys (so with `ignore_case`, `"A"` and `"a"` are the same). Write `uniq(lines, count=False)`: like `uniq`: collapse runs of **adjacent** equal lines into one (the input must be sorted to remove all duplicates); with `count=True` each output line is the run length right-aligned in 7 characters, a space and the line (`"%7d %s"`).'
