    def sort_lines(lines, reverse=False, numeric=False, unique=False, ignore_case=False):
        """Like `sort`. Normally compare lines as text. numeric=True (`-n`): compare by the number at the START of the line (after any leading blanks: the digits, with an optional '-' sign and decimal point, as a float); a line without a leading number counts as 0. ignore_case=True (`-f`) compares text in lower case. Equal keys keep their original order (the sort is stable), also when reverse=True (use sorted(..., reverse=reverse)). unique=True (`-u`) then keeps only the FIRST of lines that compare equal (equal KEYS, so with ignore_case 'A' and 'a' are the same)."""
        pass


    def uniq(lines, count=False):
        """Like `uniq`: collapse runs of ADJACENT equal lines into one (so the input must be sorted to remove all duplicates). With count=True each output line is the run length right-aligned in 7 characters, a space, then the line (`'%7d %s'`)."""
        pass
  tests:
  - name: text sort
    code: |
      assert sort_lines(["pear", "apple", "fig"]) == ["apple", "fig", "pear"] and sort_lines(["b", "A", "a", "B"]) == ["A", "B", "a", "b"] and sort_lines(["b", "A", "a", "B"], ignore_case=True) == ["A", "a", "b", "B"]
      assert sort_lines(["b", "a", "c"], reverse=True) == ["c", "b", "a"] and sort_lines([]) == [] and sort_lines(["a", "b", "a"], unique=True) == ["a", "b"]
      assert sort_lines(["B", "a", "A", "b"], ignore_case=True, unique=True) == ["a", "B"]
  - name: numeric sort
    code: |
      L = ["10 apples", "9 pears", "100 figs", "no number", "-5 debt", "2.5 half"]
      assert sort_lines(L, numeric=True) == ["-5 debt", "no number", "2.5 half", "9 pears", "10 apples", "100 figs"]
      assert sort_lines(L, numeric=True, reverse=True) == ["100 figs", "10 apples", "9 pears", "2.5 half", "no number", "-5 debt"]
      assert sort_lines(["1 b", "1 a", "0 z"], numeric=True) == ["0 z", "1 b", "1 a"] and sort_lines(["1 b", "1 a"], numeric=True, unique=True) == ["1 b"]
      assert sort_lines(["      2 a", "     10 b", "      1 c"], numeric=True) == ["      1 c", "      2 a", "     10 b"]
      assert sorted(["10", "9"]) == ["10", "9"] and sort_lines(["10", "9"], numeric=True) == ["9", "10"]
  - name: uniq
    code: |
      assert uniq(["a", "a", "b", "a"]) == ["a", "b", "a"] and uniq([]) == [] and uniq(["x"]) == ["x"]
      assert uniq(["a", "a", "b", "a"], count=True) == ["      2 a", "      1 b", "      1 a"] and uniq(["z"] * 12, count=True) == ["     12 z"]
      data = ["b", "a", "b", "c", "a", "b"]
      assert uniq(sort_lines(data), count=True) == ["      2 a", "      3 b", "      1 c"] and uniq(sort_lines(data)) == ["a", "b", "c"]
  hints:
  - Python's sorted is stable, which matches what sort does with equal keys here.
  - A regular expression such as -?\d+(\.\d+)? finds the leading number.
  solution: |
    def sort_lines(lines, reverse=False, numeric=False, unique=False, ignore_case=False):
        """Like `sort`. Normally compare lines as text. numeric=True (`-n`): compare by the number at the START of the line (after any leading blanks: the digits, with an optional '-' sign and decimal point, as a float); a line without a leading number counts as 0. ignore_case=True (`-f`) compares text in lower case. Equal keys keep their original order (the sort is stable), also when reverse=True (use sorted(..., reverse=reverse)). unique=True (`-u`) then keeps only the FIRST of lines that compare equal (equal KEYS, so with ignore_case 'A' and 'a' are the same)."""
        import re

        def key(line):
            if numeric:
                m = re.match(r"\s*(-?\d+(\.\d+)?)", line)
                return float(m.group(1)) if m else 0.0
            return line.lower() if ignore_case else line

        result = sorted(lines, key=key, reverse=reverse)
        if unique:
            seen, out = set(), []
            for line in result:
                k = key(line)
                if k not in seen:
                    seen.add(k)
                    out.append(line)
            return out
        return result


    def uniq(lines, count=False):
        """Like `uniq`: collapse runs of ADJACENT equal lines into one (so the input must be sorted to remove all duplicates). With count=True each output line is the run length right-aligned in 7 characters, a space, then the line (`'%7d %s'`)."""
        out = []
        for line in lines:
            if out and out[-1][0] == line:
                out[-1][1] += 1
            else:
                out.append([line, 1])
        if count:
            return ["%7d %s" % (n, line) for line, n in out]
        return [line for line, n in out]
  explanation: sort | uniq -c | sort -n is the classic way to count how often things occur.
- id: search
  title: 'grep: searching text'
  difficulty: 4
  prompt: '`grep` is the most used command of all. `import re` is given. Write `grep(lines, pattern, ignore_case=False, invert=False, number=False, count=False, regex=False)`: keep the lines that **contain** the pattern (plain text; with `regex=True` a regular expression found with `re.search`). `ignore_case=True` (`-i`) ignores letter case. `invert=True` (`-v`) keeps the lines that do **not** match. `number=True` (`-n`) puts the 1-based line number and a colon in front of each kept line (`"3:text"`). `count=True` (`-c`) returns just a one-item list holding the number of kept lines as a **string**. `ValueError("bad pattern")` if `regex=True` and the pattern is not a valid regular expression.'
  starter: |-
    import re




    def grep(lines, pattern, ignore_case=False, invert=False, number=False, count=False, regex=False):
        """Like `grep`: keep the lines that CONTAIN the pattern (plain text; with regex=True a regular expression found with re.search). ignore_case=True (`-i`) ignores letter case. invert=True (`-v`) keeps the lines that do NOT match. number=True (`-n`) puts the 1-based line number and a colon in front of each kept line ('3:text'). count=True (`-c`) returns just a one-item list holding the number of kept lines as a string. ValueError('bad pattern') if regex=True and the pattern is not a valid regular expression."""
        pass
  tests:
  - name: plain text
    code: |
      L = ["Error: disk full", "ok", "error again", "fine", "ERROR!"]
      assert grep(L, "error") == ["error again"] and grep(L, "error", ignore_case=True) == ["Error: disk full", "error again", "ERROR!"] and grep(L, "zzz") == [] and grep([], "a") == [] and grep(L, "") == L
      assert grep(L, "ok", invert=True) == ["Error: disk full", "error again", "fine", "ERROR!"] and grep(L, "error", ignore_case=True, invert=True) == ["ok", "fine"]
  - name: numbers and counts
    code: |
      L = ["a1", "b", "a2", "c", "a3"]
      assert grep(L, "a", number=True) == ["1:a1", "3:a2", "5:a3"] and grep(L, "a", count=True) == ["3"] and grep(L, "z", count=True) == ["0"] and grep(L, "a", invert=True, number=True) == ["2:b", "4:c"] and grep(L, "a", number=True, count=True) == ["3"]
  - name: regular expressions
    code: |
      L = ["cat", "cot", "coat", "c.t", "dog 123", "dog"]
      assert grep(L, "c.t", regex=True) == ["cat", "cot", "c.t"] and grep(L, "c.t") == ["c.t"] and grep(L, r"\d+", regex=True) == ["dog 123"] and grep(L, "^c", regex=True, count=True) == ["4"]
      assert grep(["Cat"], "^c", regex=True) == [] and grep(["Cat"], "^c", regex=True, ignore_case=True) == ["Cat"] and grep(L, r"o$", regex=True) == []
      for bad in ("(", "[a-", "*x"):
          try:
              grep(L, bad, regex=True)
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "bad pattern" in str(e)
      assert grep(L, "(", regex=False) == []
  hints:
  - Decide with a small test function, then build the output from the kept (number, line) pairs.
  solution: |
    import re




    def grep(lines, pattern, ignore_case=False, invert=False, number=False, count=False, regex=False):
        """Like `grep`: keep the lines that CONTAIN the pattern (plain text; with regex=True a regular expression found with re.search). ignore_case=True (`-i`) ignores letter case. invert=True (`-v`) keeps the lines that do NOT match. number=True (`-n`) puts the 1-based line number and a colon in front of each kept line ('3:text'). count=True (`-c`) returns just a one-item list holding the number of kept lines as a string. ValueError('bad pattern') if regex=True and the pattern is not a valid regular expression."""
        flags = re.IGNORECASE if ignore_case else 0
        if regex:
            try:
                rx = re.compile(pattern, flags)
            except re.error:
                raise ValueError("bad pattern")
            test = lambda line: rx.search(line) is not None
        else:
            needle = pattern.lower() if ignore_case else pattern
            test = lambda line: needle in (line.lower() if ignore_case else line)
        kept = [(i, line) for i, line in enumerate(lines, 1) if test(line) != invert]
        if count:
            return [str(len(kept))]
        return [("%d:%s" % (i, line)) if number else line for i, line in kept]
  explanation: 'grep -rn ''TODO'' . finds every TODO in a project in a blink: the single most useful command for programmers.'
- id: sed
  title: 'sed: replacing text'
  difficulty: 4
  prompt: '`sed` edits streams of text. `import re` is given. Write `sed_s(lines, expr)`: like `sed ''s/OLD/NEW/''`. `expr` has the form `"s/old/new/"`, `"s/old/new/g"` (replace **every** match instead of only the first), with the flag `"i"` (ignore case) or both (`"gi"` or `"ig"`); `old` is a **regular expression**, `new` is plain replacement text (use `rx.sub(new, line, count=...)`). The separator is always `"/"`. `ValueError("bad expression")` for anything else: not exactly four `"/"`-separated parts, not starting with `s`, unknown flags, or an invalid regular expression. Return the changed lines.'
  starter: |-
    import re




    def sed_s(lines, expr):
        """Like `sed 's/OLD/NEW/'`: expr has the form 's/old/new/' or 's/old/new/g' (replace every match instead of only the first) or with the flag 'i' (ignore case) or both ('gi' or 'ig'); 'old' is a regular expression, 'new' is plain replacement text. The separator is always '/'. ValueError('bad expression') for anything else (not exactly four parts, not starting with 's', unknown flags, an invalid regular expression). Return the changed lines."""
        pass
  tests:
  - name: replacing
    code: |
      L = ["cat cat", "a cat", "dog"]
      assert sed_s(L, "s/cat/bird/") == ["bird cat", "a bird", "dog"] and sed_s(L, "s/cat/bird/g") == ["bird bird", "a bird", "dog"] and sed_s(L, "s/cat//") == [" cat", "a ", "dog"] and sed_s([], "s/a/b/") == []
      assert sed_s(["Cat CAT"], "s/cat/x/i") == ["x CAT"] and sed_s(["Cat CAT"], "s/cat/x/gi") == ["x x"] and sed_s(["Cat CAT"], "s/cat/x/ig") == ["x x"]
  - name: patterns
    code: |
      assert sed_s(["abc123def", "x9"], r"s/\d+/#/") == ["abc#def", "x#"] and sed_s(["  padded  "], r"s/^ +//") == ["padded  "] and sed_s(["a.b"], r"s/\./-/g") == ["a-b"]
      assert sed_s(["hello world"], "s/o/0/g") == ["hell0 w0rld"] and sed_s(["tab"], "s/$/!/") == ["tab!"]
  - name: bad expressions
    code: |
      for bad in ("", "s/a/b", "s/a/b/x", "x/a/b/", "s/a/b/g/", "s/(/b/", "s/a/b/gg", "s//"):
          try:
              sed_s(["a"], bad)
              raise AssertionError("accepted " + repr(bad))
          except ValueError as e:
              assert "bad expression" in str(e)
  hints:
  - str.split('/') gives the four parts; the last one holds the flags.
  solution: |
    import re




    def sed_s(lines, expr):
        """Like `sed 's/OLD/NEW/'`: expr has the form 's/old/new/' or 's/old/new/g' (replace every match instead of only the first) or with the flag 'i' (ignore case) or both ('gi' or 'ig'); 'old' is a regular expression, 'new' is plain replacement text. The separator is always '/'. ValueError('bad expression') for anything else (not exactly four parts, not starting with 's', unknown flags, an invalid regular expression). Return the changed lines."""
        parts = expr.split("/")
        if len(parts) != 4 or parts[0] != "s" or parts[3] not in ("", "g", "i", "gi", "ig"):
            raise ValueError("bad expression")
        flags = re.IGNORECASE if "i" in parts[3] else 0
        try:
            rx = re.compile(parts[1], flags)
        except re.error:
            raise ValueError("bad expression")
        count = 0 if "g" in parts[3] else 1
        return [rx.sub(parts[2], line, count=count) for line in lines]
  explanation: 'sed -i ''s/old/new/g'' file edits a file in place: it is how people rename a function in a hundred files at once.'
