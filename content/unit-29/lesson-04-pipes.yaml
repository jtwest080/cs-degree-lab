id: u29-pipes
title: Pipes, Redirection and Command Lines
minutes: 110
objective: Understand how the shell reads a line, splits it into words and operators, and connects programs with pipes and redirection. You will build the tokenizer, the option parser, a command runner and a full pipeline engine, then chain commands with `;`, `&&` and `||`.
outcomes:
- Explain how a command line is split into tokens
- Use quotes correctly
- Connect commands with pipes
- Redirect input and output
- Use && || ; to chain commands
sections:
- heading: How the shell reads a line
  body: |-
    When you press Enter, the shell does not just hand the line to the computer. It first **tokenizes** it: splits it into **words** and **operators**. Spaces separate words, so `cp my file.txt docs` has four words, not three. To keep text together you **quote** it: `cp "my file.txt" docs`. Inside **single quotes** everything is literal; inside **double quotes** most things are literal but the shell still expands `$variables` (next lesson). The quotes themselves are removed before the program sees the word.

    The first word is the **command**, the rest are its **arguments**. Arguments starting with `-` are **options** (also called flags): `-l`, a bundle of them like `-rn`, or options with values (`-n 5`, `-n5`). Two dashes `--` mean "no more options after this", handy for a file called `-weird`. A programmer's usual way to read these is a small function like our `parse_args`.

    Some characters are **operators**, symbols with a special meaning: `|`, `>`, `>>`, `<`, `;`, `&&`, `||`. Quote them if you mean them literally: `echo "a | b"` prints the text.
- heading: Pipes and redirection
  body: |-
    Every program has three standard streams: **standard input** (stdin, where it reads), **standard output** (stdout, where it writes) and **standard error** (stderr, where it reports problems). Usually stdin is the keyboard and stdout and stderr are the screen. The shell can **rewire** them.

    A **pipe** `a | b` connects the output of `a` to the input of `b`: `a` produces lines, `b` consumes them, and they run at the same time. **Redirection** connects a stream to a file: `> file` writes the output to a file (replacing it), `>> file` appends, and `< file` reads input from a file.

    ```bash
    sort words.txt | uniq -c | sort -rn | head -n 3     # the three most common words
    echo "buy milk" >> todo.txt                          # add a line to a file
    sort < unsorted.txt > sorted.txt                     # read from one file, write to another
    grep error app.log 2> errors.txt                     # redirect only the error stream
    ```

    This is the **Unix philosophy** in action: tiny programs that read and write text can be combined in endless ways. The shell does the plumbing.

    > **Warning:** `>` silently **replaces** an existing file. `sort data.txt > data.txt` empties the file before `sort` reads it. When in doubt, write to a new file.
- heading: Exit codes and chaining
  body: |-
    Every program ends with an **exit status**, a number: **0 means success**, anything else means failure (1 for a general error, 127 when the command was not found, and so on). The shell keeps the last one in `$?`.

    You can use it to chain commands. `a ; b` runs `b` after `a` no matter what. `a && b` runs `b` **only if `a` succeeded**. `a || b` runs `b` **only if `a` failed**. Combined: `make && ./run || echo "something failed"`. The `&&` form is the safe way to do dependent steps (`cd build && rm -rf *` does not delete in the wrong folder if the `cd` fails; a bare `;` would!).

    ```bash
    mkdir out && cd out && echo "ready"
    grep -q error app.log || echo "no errors found"
    ```

    With these pieces, the Unix command line becomes a small programming language. Next we add **variables, wildcards and scripts**.
examples:
- title: Tokens and options
  intro: How a line is split, and how options are read.
  code: |
    def tokenize(line):
        """Split a command line into tokens, the way a shell does. Return a list of pairs ("word", text) and ("op", text). Spaces separate words. Text inside single quotes '...' or double quotes "..." is part of a word, including spaces and operator characters, and the quote characters themselves are removed ('' makes an EMPTY word); quotes may be glued to other text (ab"c d"e is one word abc de). The OPERATORS are the unquoted '||', '&&', '>>', '|', ';', '>' and '<' (always read the longest one); they split words even without spaces around them (a>b gives a, >, b). ValueError('unterminated quote') if a quote is never closed."""
        tokens = []
        cur = None
        i = 0
        n = len(line)

        def flush():
            nonlocal cur
            if cur is not None:
                tokens.append(("word", cur))
                cur = None

        while i < n:
            ch = line[i]
            if ch in "'\"":
                end = line.find(ch, i + 1)
                if end < 0:
                    raise ValueError("unterminated quote")
                cur = (cur or "") + line[i + 1:end]
                i = end + 1
            elif ch.isspace():
                flush()
                i += 1
            else:
                op = None
                for candidate in ("||", "&&", ">>", "|", ";", ">", "<"):
                    if line.startswith(candidate, i):
                        op = candidate
                        break
                if op:
                    flush()
                    tokens.append(("op", op))
                    i += len(op)
                else:
                    cur = (cur or "") + ch
                    i += 1
        flush()
        return tokens


    def parse_args(args, takes_value):
        """Split the arguments of a command into OPTIONS and normal arguments. `takes_value` is a set of option letters that need a value, such as {"n", "d", "f"}. Return (flags, values, rest): `flags` is the list of single-letter flags in the order they appear; `values` is a dict {letter: value} for the letters in takes_value; `rest` is the list of other arguments. Rules: an argument that starts with '-' and has more characters ('-r', '-rn', '-n5') is an option cluster; go through its letters: a letter in takes_value takes the REST of the cluster as its value, or if there is none the NEXT argument (ValueError('option needs a value: -X') if there is no next argument), and ends the cluster; any other letter is a flag. A single '-' is a normal argument. '--' ends the options: everything after it is in `rest`. Anything not starting with '-' is in `rest`."""
        flags, values, rest = [], {}, []
        i = 0
        while i < len(args):
            a = args[i]
            if a == "--":
                rest.extend(args[i + 1:])
                break
            if a.startswith("-") and len(a) > 1:
                j = 1
                while j < len(a):
                    letter = a[j]
                    if letter in takes_value:
                        if j + 1 < len(a):
                            values[letter] = a[j + 1:]
                        elif i + 1 < len(args):
                            i += 1
                            values[letter] = args[i]
                        else:
                            raise ValueError("option needs a value: -" + letter)
                        break
                    flags.append(letter)
                    j += 1
            else:
                rest.append(a)
            i += 1
        return flags, values, rest

    for kind, text in tokenize("grep -n 'hello world' notes.txt | sort > out.txt && echo done"):
        print(kind, repr(text))
    print(parse_args(["-rn", "-d,", "-f", "1,3", "data.csv"], {"d", "f"}))
  output: |
    word 'grep'
    word '-n'
    word 'hello world'
    word 'notes.txt'
    op '|'
    word 'sort'
    op '>'
    word 'out.txt'
    op '&&'
    word 'echo'
    word 'done'
    (['r', 'n'], {'d': ',', 'f': '1,3'}, ['data.csv'])
