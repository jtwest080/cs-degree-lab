      assert parse_args(["-n", "5", "file"], {"n"}) == ([], {"n": "5"}, ["file"]) and parse_args(["-n5", "file"], {"n"}) == ([], {"n": "5"}, ["file"]) and parse_args(["-d,", "-f", "1,3", "data"], {"d", "f"}) == ([], {"d": ",", "f": "1,3"}, ["data"])
      assert parse_args(["-rn", "x"], {"n"}) == (["r"], {"n": "x"}, []) and parse_args(["-nr"], {"n"}) == ([], {"n": "r"}, []) and parse_args(["-in", "3", "p"], {"n"}) == (["i"], {"n": "3"}, ["p"])
