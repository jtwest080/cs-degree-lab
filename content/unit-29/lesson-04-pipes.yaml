    def is_dir(fs, path):
        """True if the (normalized) path is a directory."""
        return normalize(path) in fs["dirs"]


    def is_file(fs, path):
        """True if the (normalized) path is a file."""
        return normalize(path) in fs["files"]


    def mkdir_p(fs, path):
