- type: code
  question: Write `exit_message(status)` returning 'ok' for status 0, 'not found' for 127 and 'failed' for any other number.
  starter: |
    def exit_message(status):
        pass
  tests:
  - name: status
    code: |
      assert exit_message(0) == "ok" and exit_message(127) == "not found" and exit_message(1) == "failed" and exit_message(2) == "failed"
  solution: |
    def exit_message(status):
        if status == 0:
            return "ok"
        if status == 127:
            return "not found"
        return "failed"
