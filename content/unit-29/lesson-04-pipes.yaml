  prompt: 'Commands take **options** such as `-n 5` or `-rn`. Write `parse_args(args, takes_value)`. `takes_value` is a set of option letters that need a value, such as `{"n", "d", "f"}`. Return `(flags, values, rest)`: `flags` is the list of single-letter flags in the order they appear; `values` is a dict `{letter: value}` for the letters in `takes_value`; `rest` is the list of other arguments. Rules: an argument that starts with `"-"` and has more characters (`"-r"`, `"-rn"`, `"-n5"`) is an **option cluster**: go through its letters: a letter in `takes_value` takes the **rest of the cluster** as its value, or, if there is none, the **next argument** (`ValueError("option needs a value: -X")` if there is no next argument) and ends the cluster; any other letter is a flag. A single `"-"` is a normal argument. `"--"` ends the options: everything after it is in `rest`. Anything not starting with `"-"` is in `rest`.'
