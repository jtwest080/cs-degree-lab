        flags, values, rest = [], {}, []
        i = 0
        while i < len(args):
            a = args[i]
            if a == "--":
                rest.extend(args[i + 1:])
                break
            if a.startswith("-") and len(a) > 1:
                j = 1
                while j < len(a):
