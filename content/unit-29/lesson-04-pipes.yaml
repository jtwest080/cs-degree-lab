- title: A shell session
  intro: Redirect, pipe and chain commands on the pretend file system.
  code: |
    HOME = "/home/user"


    def normalize(path):
        """Clean an ABSOLUTE path (one that starts with '/'). Split it at '/', ignore empty parts and '.' parts (the current folder), and let '..' remove the previous part (at the top, '..' stays at the top: '/..' is '/'). Return '/' plus the remaining parts joined with '/'; the result for no parts is '/'."""
        parts = []
        for p in path.split("/"):
            if p in ("", "."):
                continue
            if p == "..":
                if parts:
                    parts.pop()
            else:
                parts.append(p)
        return "/" + "/".join(parts)


    def resolve(cwd, path):
        """Turn what the user typed into an absolute, clean path. `cwd` is the current working directory. A path starting with '~' (just '~' or '~/...') starts at HOME instead. A path that does not start with '/' is relative to cwd. Return the normalized absolute path."""
        if path == "~" or path.startswith("~/"):
            path = HOME + path[1:]
        if not path.startswith("/"):
            path = cwd + "/" + path
        return normalize(path)


    def split_path(path):
        """Split a path into (folder, name): normalize it first; the folder of '/a/b/c.txt' is '/a/b' and its name is 'c.txt'; for '/c.txt' the folder is '/'; for '/' itself return ('/', '')."""
        path = normalize(path)
        if path == "/":
            return ("/", "")
        i = path.rindex("/")
        return (path[:i] or "/", path[i + 1:])


    def extension(name):
        """The file extension of a name: the text after the LAST dot, without the dot, or '' if there is none. A leading dot does not count ('.bashrc' has no extension) and a name ending in a dot has none."""
        stem = name.lstrip(".")
        if "." not in stem:
            return ""
        return stem.rsplit(".", 1)[1]


    def join_path(*parts):
        """Join path parts with '/' like os.path.join, then normalize: a part that starts with '/' starts again from there (everything before it is dropped). The result is always absolute (a first part without '/' is taken from the root)."""
        result = ""
        for p in parts:
            if p.startswith("/"):
                result = p
            else:
                result += "/" + p
        return normalize(result)


    def new_fs():
        """A tiny file system: {"dirs": a set holding just '/', "files": an empty dict mapping absolute path -> text}."""
        return {"dirs": {"/"}, "files": {}}


    def is_dir(fs, path):
        """True if the (normalized) path is a directory."""
        return normalize(path) in fs["dirs"]


    def is_file(fs, path):
        """True if the (normalized) path is a file."""
        return normalize(path) in fs["files"]


    def mkdir_p(fs, path):
        """Like `mkdir -p`: create the directory and all missing parents (already existing ones are fine). ValueError('not a directory') if some part of the path is a FILE."""
        cur = ""
        for part in [p for p in normalize(path).split("/") if p]:
            cur += "/" + part
            if cur in fs["files"]:
                raise ValueError("not a directory")
            fs["dirs"].add(cur)


    def write_file(fs, path, text):
        """Create or overwrite a file. ValueError('is a directory') if the path is a directory or the root; ValueError('no such directory') if its folder does not exist."""
        path = normalize(path)
        folder, name = split_path(path)
        if not name or path in fs["dirs"]:
            raise ValueError("is a directory")
        if folder not in fs["dirs"]:
            raise ValueError("no such directory")
        fs["files"][path] = text


    def ls(fs, path, all=False):
        """List a directory like `ls`: the sorted names of the things directly inside it, with '/' added after directory names. Names that start with '.' are hidden unless all=True. For a FILE return just [its name]. ValueError('no such file or directory') if the path does not exist."""
        path = normalize(path)
        if path in fs["files"]:
            return [split_path(path)[1]]
        if path not in fs["dirs"]:
            raise ValueError("no such file or directory")
        names = set()
        for d in fs["dirs"]:
            if d != path and split_path(d)[0] == path:
                names.add(split_path(d)[1] + "/")
        for f in fs["files"]:
            if split_path(f)[0] == path:
                names.add(split_path(f)[1])
        return sorted(n for n in names if all or not n.startswith("."))


    def tree_lines(fs, path):
        """Draw a directory as an outline: the first line is the directory's own name ('/' for the root) followed by '/' unless it is the root; below it every entry of ls(fs, path, all=True) on its own line, indented by 2 spaces per level, directories followed by '/' and listed with their contents right below them (depth first). ValueError('not a directory') if the path is not a directory."""
        path = normalize(path)
        if path not in fs["dirs"]:
            raise ValueError("not a directory")
        lines = ["/" if path == "/" else split_path(path)[1] + "/"]

        def walk(folder, depth):
            for name in ls(fs, folder, all=True):
                lines.append("  " * depth + name)
                if name.endswith("/"):
                    walk(join_path(folder, name[:-1]), depth + 1)

        walk(path, 1)
        return lines


    def cd(fs, cwd, path):
        """Like `cd`: return the new working directory resolve(cwd, path). ValueError('not a directory') if it is a file, ValueError('no such directory') if it does not exist."""
        target = resolve(cwd, path)
        if target in fs["files"]:
            raise ValueError("not a directory")
        if target not in fs["dirs"]:
            raise ValueError("no such directory")
        return target


    def under(fs, path):
        """Everything at or below a path: return (dirs, files): the sorted list of directories whose path is `path` or starts with `path + '/'`, and the same for files (a file path equal to `path` counts). The path is normalized first."""
        path = normalize(path)
        prefix = "/" if path == "/" else path + "/"
        dirs = sorted(d for d in fs["dirs"] if d == path or d.startswith(prefix))
        files = sorted(f for f in fs["files"] if f == path or f.startswith(prefix))
        return dirs, files


    def cat(fs, *paths):
        """Return the text of the files one after the other. ValueError('no such file: PATH') for a missing path and ValueError('is a directory: PATH') for a directory (using the path as given). Check each path in order."""
        out = ""
        for p in paths:
            if is_dir(fs, p):
                raise ValueError("is a directory: " + p)
            if not is_file(fs, p):
                raise ValueError("no such file: " + p)
            out += fs["files"][normalize(p)]
        return out


    def touch(fs, path):
        """Create an EMPTY file if the path does not exist yet; an existing file is left unchanged. ValueError('is a directory') for a directory; ValueError('no such directory') if the folder does not exist."""
        path = normalize(path)
        if path in fs["files"]:
            return
        write_file(fs, path, "")


    def mkdir(fs, path):
        """Like `mkdir` without -p: create ONE directory. ValueError('file exists') if the path already exists (as a file or directory); ValueError('no such directory') if its folder does not exist."""
        path = normalize(path)
        if path in fs["files"] or path in fs["dirs"]:
            raise ValueError("file exists")
        if split_path(path)[0] not in fs["dirs"]:
            raise ValueError("no such directory")
        fs["dirs"].add(path)


    def head(lines, n=10):
        """The first n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        return lines[:n] if n > 0 else []


    def tail(lines, n=10):
        """The last n lines (all of them if there are fewer; n <= 0 gives an empty list)."""
        return lines[-n:] if n > 0 else []


    def wc(text):
        """Like `wc`: return (number of lines, number of words, number of characters). Lines are counted as the number of newline characters; words are the pieces of text.split(); characters are len(text)."""
        return (text.count("\n"), len(text.split()), len(text))


    def cut(lines, delimiter, fields):
        """Like `cut -d DELIMITER -f FIELDS`: split every line at the delimiter and keep the chosen fields. `fields` is a list of 1-based field numbers; they are output in the ORDER OF THE LINE (not the order given) with duplicates removed, joined again with the delimiter; a field the line does not have is skipped. A line that has no delimiter at all is returned unchanged."""
        out = []
        for line in lines:
            if delimiter not in line:
                out.append(line)
                continue
            parts = line.split(delimiter)
            keep = sorted(set(f for f in fields if 1 <= f <= len(parts)))
            out.append(delimiter.join(parts[i - 1] for i in keep))
        return out


    def tr(text, source, target):
        """Like `tr`: replace each character of `source` by the character at the same position of `target`. If target is shorter, its LAST character is used for the rest; if target is empty the characters of source are DELETED. Other characters are unchanged."""
        table = {}
        for i, ch in enumerate(source):
            if not target:
                table[ch] = ""
            else:
                table[ch] = target[min(i, len(target) - 1)]
        return "".join(table.get(c, c) for c in text)


    def sort_lines(lines, reverse=False, numeric=False, unique=False, ignore_case=False):
        """Like `sort`. Normally compare lines as text. numeric=True (`-n`): compare by the number at the START of the line (after any leading blanks: the digits, with an optional '-' sign and decimal point, as a float); a line without a leading number counts as 0. ignore_case=True (`-f`) compares text in lower case. Equal keys keep their original order (the sort is stable), also when reverse=True (use sorted(..., reverse=reverse)). unique=True (`-u`) then keeps only the FIRST of lines that compare equal (equal KEYS, so with ignore_case 'A' and 'a' are the same)."""
        import re

        def key(line):
            if numeric:
                m = re.match(r"\s*(-?\d+(\.\d+)?)", line)
                return float(m.group(1)) if m else 0.0
            return line.lower() if ignore_case else line

        result = sorted(lines, key=key, reverse=reverse)
        if unique:
            seen, out = set(), []
            for line in result:
                k = key(line)
                if k not in seen:
                    seen.add(k)
                    out.append(line)
            return out
        return result


    def uniq(lines, count=False):
        """Like `uniq`: collapse runs of ADJACENT equal lines into one (so the input must be sorted to remove all duplicates). With count=True each output line is the run length right-aligned in 7 characters, a space, then the line (`'%7d %s'`)."""
        out = []
        for line in lines:
            if out and out[-1][0] == line:
                out[-1][1] += 1
            else:
                out.append([line, 1])
        if count:
            return ["%7d %s" % (n, line) for line, n in out]
        return [line for line, n in out]


    import re


    def grep(lines, pattern, ignore_case=False, invert=False, number=False, count=False, regex=False):
        """Like `grep`: keep the lines that CONTAIN the pattern (plain text; with regex=True a regular expression found with re.search). ignore_case=True (`-i`) ignores letter case. invert=True (`-v`) keeps the lines that do NOT match. number=True (`-n`) puts the 1-based line number and a colon in front of each kept line ('3:text'). count=True (`-c`) returns just a one-item list holding the number of kept lines as a string. ValueError('bad pattern') if regex=True and the pattern is not a valid regular expression."""
        flags = re.IGNORECASE if ignore_case else 0
        if regex:
            try:
                rx = re.compile(pattern, flags)
            except re.error:
                raise ValueError("bad pattern")
            test = lambda line: rx.search(line) is not None
        else:
            needle = pattern.lower() if ignore_case else pattern
            test = lambda line: needle in (line.lower() if ignore_case else line)
        kept = [(i, line) for i, line in enumerate(lines, 1) if test(line) != invert]
        if count:
            return [str(len(kept))]
        return [("%d:%s" % (i, line)) if number else line for i, line in kept]


    def demo_fs():
        fs = new_fs()
        mkdir_p(fs, "/home/user/docs")
        mkdir_p(fs, "/home/user/.config")
        mkdir_p(fs, "/home/user/projects/app")
        write_file(fs, "/home/user/notes.txt", "buy milk\n")
        write_file(fs, "/home/user/docs/report.md", "# Report\n")
        write_file(fs, "/home/user/docs/readme.md", "# Read me\n")
        write_file(fs, "/home/user/projects/app/main.py", "print('hi')\n")
        write_file(fs, "/home/user/.bashrc", "export A=1\n")
        return fs


    def parse_args(args, takes_value):
        """Split the arguments of a command into OPTIONS and normal arguments. `takes_value` is a set of option letters that need a value, such as {"n", "d", "f"}. Return (flags, values, rest): `flags` is the list of single-letter flags in the order they appear; `values` is a dict {letter: value} for the letters in takes_value; `rest` is the list of other arguments. Rules: an argument that starts with '-' and has more characters ('-r', '-rn', '-n5') is an option cluster; go through its letters: a letter in takes_value takes the REST of the cluster as its value, or if there is none the NEXT argument (ValueError('option needs a value: -X') if there is no next argument), and ends the cluster; any other letter is a flag. A single '-' is a normal argument. '--' ends the options: everything after it is in `rest`. Anything not starting with '-' is in `rest`."""
        flags, values, rest = [], {}, []
        i = 0
        while i < len(args):
            a = args[i]
            if a == "--":
                rest.extend(args[i + 1:])
                break
            if a.startswith("-") and len(a) > 1:
                j = 1
                while j < len(a):
                    letter = a[j]
                    if letter in takes_value:
                        if j + 1 < len(a):
                            values[letter] = a[j + 1:]
                        elif i + 1 < len(args):
                            i += 1
                            values[letter] = args[i]
                        else:
                            raise ValueError("option needs a value: -" + letter)
                        break
                    flags.append(letter)
                    j += 1
            else:
                rest.append(a)
            i += 1
        return flags, values, rest


    def tokenize(line):
        """Split a command line into tokens, the way a shell does. Return a list of pairs ("word", text) and ("op", text). Spaces separate words. Text inside single quotes '...' or double quotes "..." is part of a word, including spaces and operator characters, and the quote characters themselves are removed ('' makes an EMPTY word); quotes may be glued to other text (ab"c d"e is one word abc de). The OPERATORS are the unquoted '||', '&&', '>>', '|', ';', '>' and '<' (always read the longest one); they split words even without spaces around them (a>b gives a, >, b). ValueError('unterminated quote') if a quote is never closed."""
        tokens = []
        cur = None
        i = 0
        n = len(line)

        def flush():
            nonlocal cur
            if cur is not None:
                tokens.append(("word", cur))
                cur = None

        while i < n:
            ch = line[i]
            if ch in "'\"":
                end = line.find(ch, i + 1)
                if end < 0:
                    raise ValueError("unterminated quote")
                cur = (cur or "") + line[i + 1:end]
                i = end + 1
            elif ch.isspace():
                flush()
                i += 1
            else:
                op = None
                for candidate in ("||", "&&", ">>", "|", ";", ">", "<"):
                    if line.startswith(candidate, i):
                        op = candidate
                        break
                if op:
                    flush()
                    tokens.append(("op", op))
                    i += len(op)
                else:
                    cur = (cur or "") + ch
                    i += 1
        flush()
        return tokens


    def read_lines(fs, cwd, names):
        """The lines of the named files (relative to cwd) one after the other, using cat; errors of cat are passed on."""
        return cat(fs, *[resolve(cwd, n) for n in names]).splitlines()


    def run_command(fs, cwd, argv, stdin):
        """Run ONE command. `argv` is the list [name, arguments...] and `stdin` the list of input lines. Return (lines, status): status 0 and the output lines on success, or status 1 and ONE error line 'name: message' when a ValueError is raised, or status 127 and 'name: command not found'. Commands: echo (the arguments joined by spaces, one line); pwd (the cwd); ls [path] (the names, one per line; default '.'; -a shows hidden); cat [files] (the files' lines; no files means the stdin); head and tail ('-n N', default 10, on files or stdin); sort (flags r n u f, on files or stdin); uniq (flag c); wc (flag l: just the number of lines as one string; otherwise the three numbers of the text joined with spaces); grep [flags i v n c E] PATTERN [files] (E makes the pattern a regular expression; no files means stdin); cut (-d DELIMITER -f FIELDS, the fields are comma-separated numbers; default delimiter is a TAB); tr SOURCE TARGET. Use parse_args and the tool functions. Files are resolved with `resolve(cwd, name)`; when there are file names they replace stdin."""
        name, args = argv[0], argv[1:]
        try:
            if name == "echo":
                return [" ".join(args)], 0
            if name == "pwd":
                return [cwd], 0
            if name == "ls":
                flags, _, rest = parse_args(args, set())
                return ls(fs, resolve(cwd, rest[0] if rest else "."), all="a" in flags), 0
            if name == "cat":
                return (read_lines(fs, cwd, args) if args else list(stdin)), 0
            if name in ("head", "tail"):
                _, values, rest = parse_args(args, {"n"})
                lines = read_lines(fs, cwd, rest) if rest else list(stdin)
                n = int(values.get("n", "10"))
                return (head(lines, n) if name == "head" else tail(lines, n)), 0
            if name == "sort":
                flags, _, rest = parse_args(args, set())
                lines = read_lines(fs, cwd, rest) if rest else list(stdin)
                return sort_lines(lines, reverse="r" in flags, numeric="n" in flags, unique="u" in flags, ignore_case="f" in flags), 0
            if name == "uniq":
                flags, _, rest = parse_args(args, set())
                lines = read_lines(fs, cwd, rest) if rest else list(stdin)
                return uniq(lines, count="c" in flags), 0
            if name == "wc":
                flags, _, rest = parse_args(args, set())
                lines = read_lines(fs, cwd, rest) if rest else list(stdin)
                text = "\n".join(lines) + "\n" if lines else ""
                counts = wc(text)
                return ([str(counts[0])] if "l" in flags else [" ".join(str(c) for c in counts)]), 0
            if name == "grep":
                flags, _, rest = parse_args(args, set())
                if not rest:
                    raise ValueError("missing pattern")
                lines = read_lines(fs, cwd, rest[1:]) if len(rest) > 1 else list(stdin)
                return grep(lines, rest[0], ignore_case="i" in flags, invert="v" in flags, number="n" in flags, count="c" in flags, regex="E" in flags), 0
            if name == "cut":
                _, values, rest = parse_args(args, {"d", "f"})
                lines = read_lines(fs, cwd, rest) if rest else list(stdin)
                fields = [int(x) for x in values["f"].split(",")]
                return cut(lines, values.get("d", "\t"), fields), 0
            if name == "tr":
                if len(args) != 2:
                    raise ValueError("expected two arguments")
                return [tr(line, args[0], args[1]) for line in stdin], 0
        except (ValueError, KeyError) as err:
            return [name + ": " + (str(err) if isinstance(err, ValueError) else "missing option")], 1
        return [name + ": command not found"], 127


    def parse_pipeline(tokens):
        """Turn the tokens of ONE pipeline (no ';', '&&' or '||' in it) into a list of STAGES, one per command between '|' operators. Each stage is {"argv": [the words], "stdin": file name or None, "stdout": None or (file name, append)} where '< file' sets stdin, '> file' sets stdout with append False and '>> file' with append True (a later redirect of the same kind replaces an earlier one). ValueError('syntax error') for an empty stage (nothing between pipes or at the ends), a redirect operator with no word after it, or any other operator."""
        stages, cur = [], {"argv": [], "stdin": None, "stdout": None}
        i = 0
        while i < len(tokens):
            kind, text = tokens[i]
            if kind == "word":
                cur["argv"].append(text)
            elif text == "|":
                if not cur["argv"]:
                    raise ValueError("syntax error")
                stages.append(cur)
                cur = {"argv": [], "stdin": None, "stdout": None}
            elif text in ("<", ">", ">>"):
                if i + 1 >= len(tokens) or tokens[i + 1][0] != "word":
                    raise ValueError("syntax error")
                target = tokens[i + 1][1]
                if text == "<":
                    cur["stdin"] = target
                else:
                    cur["stdout"] = (target, text == ">>")
                i += 1
            else:
                raise ValueError("syntax error")
            i += 1
        if not cur["argv"]:
            raise ValueError("syntax error")
        stages.append(cur)
        return stages


    def run_pipeline(fs, cwd, stages):
        """Run the stages of a pipeline. For every stage in order: the input is the output of the previous stage (empty for the first); if the stage has stdin set, the lines of that file (resolved against cwd, via read_lines) replace it. Run run_command. A non-zero status means the stage FAILED: remember its error lines to show on the terminal, and pass NO lines on. If the stage has stdout redirection and succeeded, write its lines to that file (resolve against cwd; text = the lines joined with newlines plus one final newline, or '' for no lines; with append=True add to the existing text of that file, if any) and then the stage's output is empty; a ValueError from the write or the stdin read is an error line 'name: message' with status 1. Return (terminal lines, status of the LAST stage): the terminal lines are all error lines of failed stages in order, followed by the output of the last stage if it succeeded."""
        data, errors, status = [], [], 0
        for stage in stages:
            argv = stage["argv"]
            stdin = data
            status = 0
            try:
                if stage["stdin"] is not None:
                    stdin = read_lines(fs, cwd, [stage["stdin"]])
            except ValueError as err:
                errors.append(argv[0] + ": " + str(err))
                data, status = [], 1
                continue
            lines, status = run_command(fs, cwd, argv, stdin)
            if status != 0:
                errors.extend(lines)
                data = []
                continue
            if stage["stdout"] is not None:
                path, append = stage["stdout"]
                text = "\n".join(lines) + "\n" if lines else ""
                full = resolve(cwd, path)
                if append and full in fs["files"]:
                    text = fs["files"][full] + text
                try:
                    write_file(fs, full, text)
                except ValueError as err:
                    errors.append(argv[0] + ": " + str(err))
                    data, status = [], 1
                    continue
                lines = []
            data = lines
        return errors + data, status


    def shell_line(fs, cwd, line):
        """Run a whole command line and return (terminal lines, status of the last pipeline that ran). Split the tokens at the unquoted ';', '&&' and '||' operators into pipelines (ValueError('syntax error') for an empty pipeline; ValueError('unterminated quote') passes through from tokenize). Run them from left to right with parse_pipeline and run_pipeline: ';' always runs the next pipeline; '&&' runs it only if the previous status was 0; '||' only if it was not 0 (a pipeline that is skipped leaves the status as it was). The terminal lines of all pipelines that ran are joined in order. An empty line (no tokens) gives ([], 0)."""
        tokens = tokenize(line)
        if not tokens:
            return [], 0
        groups, current, connectors = [], [], []
        for tok in tokens:
            if tok[0] == "op" and tok[1] in (";", "&&", "||"):
                if not current:
                    raise ValueError("syntax error")
                groups.append(current)
                connectors.append(tok[1])
                current = []
            else:
                current.append(tok)
        if not current:
            raise ValueError("syntax error")
        groups.append(current)
        out, status = [], 0
        for i, group in enumerate(groups):
            if i > 0:
                c = connectors[i - 1]
                if (c == "&&" and status != 0) or (c == "||" and status == 0):
                    continue
            lines, status = run_pipeline(fs, cwd, parse_pipeline(group))
            out.extend(lines)
        return out, status

    fs = demo_fs()
    cwd = "/home/user"
    shell_line(fs, cwd, "echo pear > fruit.txt; echo apple >> fruit.txt; echo pear >> fruit.txt")
    print(shell_line(fs, cwd, "cat fruit.txt | sort | uniq -c"))
    print(shell_line(fs, cwd, "cat fruit.txt | grep -c pear"))
    print(shell_line(fs, cwd, "cat missing.txt || echo 'not found, using default'"))
    print(shell_line(fs, cwd, "ls docs && echo listed"))
    print(shell_line(fs, cwd, "nonsense | cat"))
