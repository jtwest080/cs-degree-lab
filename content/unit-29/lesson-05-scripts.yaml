  title: 'Capstone: a tiny scripting language'
  difficulty: 5
  prompt: 'A **script** is a file of commands. Write `run_script(lines, env, run)`. `lines` is the list of script lines, `env` the dict of variables (changed in place; `expand_vars` is given) and `run(line)` a function that runs **one** ordinary command line and returns `(output lines, status)`. Return all output lines. For every line: skip blank lines and comments (first non-blank character `#`) and strip blanks around it. Supported: (1) **assignment** `NAME=value`: the value (variables expanded, with the last status) is stored in `env`; (2) `for NAME in w1 w2 ...` up to its matching `done` (loops may nest): expand the variables in the word list, split it at blanks, and run the body once for each word with `env[NAME]` set; (3) `if COMMAND` up to its matching `fi` with an optional `else` (ifs may nest): run COMMAND (after expanding variables) and run the first part when its status is 0, the second otherwise; (4) every other line has its variables expanded and is passed to `run(line)`. The status for `$?` is the status of the last command that ran (0 at the start). Raise `ValueError("unterminated block")` for a `for` or `if` with no matching `done` or `fi`.'
