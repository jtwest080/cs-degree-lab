      out = run_script(["for a in 1 2", "for b in x y", "echo $a$b", "done", "echo end$a", "done"], {}, run)
      assert out == ["echo 1x", "echo 1y", "echo end1", "echo 2x", "echo 2y", "echo end2"] and run_script(["for z in", "echo never", "done", "echo ok"], {}, run) == ["echo ok"]
