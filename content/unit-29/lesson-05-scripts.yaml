      assert expand_vars("cost: $5.00", env) == "cost: .00" and expand_vars("100$", env) == "100$" and expand_vars("$ x", env) == "$ x" and expand_vars("$-", env) == "$-" and expand_vars("${x", env) == "${x" and expand_vars("a$$b", env) == "a$" and expand_vars("$", env) == "$"
