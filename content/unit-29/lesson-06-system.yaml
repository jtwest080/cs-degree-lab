- title: Kill and cron
  intro: Orphans after a kill, and the next runs of a schedule.
  code: |
    def kill_process(procs, pid, kill_children=False):
        """Simulate `kill`. `procs` is a dict {pid: {"ppid": parent pid, "name": text}} and is NOT changed. Return (killed, new_procs): `killed` is the sorted list of pids that ended and `new_procs` the table afterwards. Killing a process removes it. With kill_children=True all its descendants (children, their children, ...) end too. Otherwise its children become ORPHANS: they stay alive and their ppid is set to 1 (the init process). ValueError('no such process') if pid is not in the table and ValueError('cannot kill init') for pid 1."""
        if pid == 1:
            raise ValueError("cannot kill init")
        if pid not in procs:
            raise ValueError("no such process")
        killed = {pid}
        if kill_children:
            grew = True
            while grew:
                grew = False
                for p, info in procs.items():
                    if info["ppid"] in killed and p not in killed:
                        killed.add(p)
                        grew = True
        new = {}
        for p, info in procs.items():
            if p in killed:
                continue
            new[p] = {"ppid": 1 if info["ppid"] in killed else info["ppid"], "name": info["name"]}
        return sorted(killed), new


    def cron_values(field, lo, hi):
        """Read ONE field of a cron schedule and return the sorted list of the numbers it allows, between lo and hi (both included). A field is a comma-separated list of parts; a part is '*' (every value from lo to hi), '*/n' (every n-th value starting at lo), 'a' (one number), 'a-b' (a range) or 'a-b/n' (a range in steps of n). ValueError('bad field') for anything else: not a number, a value outside lo..hi, a range with a > b, or a step n that is not a positive number."""
        values = set()
        for part in field.split(","):
            rng, slash, step = part.partition("/")
            if slash:
                if not step.isdigit() or int(step) == 0:
                    raise ValueError("bad field")
                n = int(step)
            else:
                n = 1
            if rng == "*":
                a, b = lo, hi
            elif rng.isdigit():
                a = int(rng)
                b = hi if slash else a
            elif rng.count("-") == 1 and all(x.isdigit() for x in rng.split("-")):
                a, b = (int(x) for x in rng.split("-"))
            else:
                raise ValueError("bad field")
            if a > b or a < lo or b > hi:
                raise ValueError("bad field")
            values.update(range(a, b + 1, n))
        return sorted(values)


    def cron_next(expr, start, count):
        """When will a cron job run? `expr` is the five fields 'minute hour day-of-month month day-of-week' (cron_values is given: minute 0-59, hour 0-23, day 1-31, month 1-12, weekday 0-6 with 0 = Sunday). `start` is a tuple (year, month, day, hour, minute); return the next `count` run times AFTER that minute (never the minute itself) as text 'YYYY-MM-DD HH:MM', in order. A day qualifies when its month matches and: if BOTH the day-of-month and the weekday fields are restricted (not a plain '*'), the day matches when EITHER of them does; otherwise when both do (a '*' always matches). Use the datetime module. ValueError('bad schedule') unless there are exactly five fields (and ValueError('bad field') comes from cron_values). Give up after looking ahead 5 years and return what you have."""
        import datetime
        parts = expr.split()
        if len(parts) != 5:
            raise ValueError("bad schedule")
        minutes = cron_values(parts[0], 0, 59)
        hours = cron_values(parts[1], 0, 23)
        doms = cron_values(parts[2], 1, 31)
        months = cron_values(parts[3], 1, 12)
        dows = cron_values(parts[4], 0, 6)
        both = parts[2] != "*" and parts[4] != "*"
        y, mo, d, h, mi = start
        first = datetime.datetime(y, mo, d, h, mi)
        day = first.date()
        out = []
        limit = day + datetime.timedelta(days=366 * 5)
        while len(out) < count and day <= limit:
            weekday = (day.weekday() + 1) % 7
            dom_ok, dow_ok = day.day in doms, weekday in dows
            if day.month in months and ((dom_ok or dow_ok) if both else (dom_ok and dow_ok)):
                for hh in hours:
                    for mm in minutes:
                        when = datetime.datetime(day.year, day.month, day.day, hh, mm)
                        if when > first and len(out) < count:
                            out.append(when.strftime("%Y-%m-%d %H:%M"))
            day += datetime.timedelta(days=1)
        return out

    procs = {1: {"ppid": 0, "name": "init"}, 10: {"ppid": 1, "name": "bash"}, 11: {"ppid": 10, "name": "sleep"}, 12: {"ppid": 10, "name": "editor"}}
    print(kill_process(procs, 10)[0], {p: i["ppid"] for p, i in kill_process(procs, 10)[1].items()})
    print(kill_process(procs, 10, kill_children=True)[0])
    print(cron_values("*/15", 0, 59), cron_values("1-5", 0, 6))
    for when in cron_next("30 2 * * 1-5", (2026, 11, 20, 3, 0), 3):
        print("next run:", when)
  output: |
    [10] {1: 0, 11: 1, 12: 1}
    [10, 11, 12]
    [0, 15, 30, 45] [1, 2, 3, 4, 5]
    next run: 2026-11-23 02:30
    next run: 2026-11-24 02:30
    next run: 2026-11-25 02:30
