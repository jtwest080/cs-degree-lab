exercises:
- id: which
  title: Finding the program
  difficulty: 3
  prompt: 'When you type `python`, the shell looks through the folders in the **PATH** variable, from left to right, for a program with that name. Write `which(command, path_var, programs)`. `path_var` is the PATH text: folders separated by `":"`. `programs` is a dict `{folder: list of program names in it}`. Return `folder + "/" + command` for the first folder whose list contains the command, or `None`. Skip empty entries; a folder that is not in `programs` simply has no programs; a command containing `"/"` is never searched (return `None`).'
  starter: |-
    def which(command, path_var, programs):
        """Find which program the shell would run for `command`. `path_var` is the PATH text: folders separated by ':'. `programs` is a dict {folder: list of program names in it}. Look at the folders from LEFT to RIGHT (skip empty entries) and return folder + '/' + command for the first folder whose list contains the command, or None if there is none. A folder that is not in `programs` simply has no programs. (A command containing '/' is never searched: return None.)"""
        pass
  tests:
  - name: search order
    code: |
      programs = {"/usr/local/bin": ["python", "node"], "/usr/bin": ["python", "ls", "grep"], "/bin": ["sh", "ls"]}
      assert which("python", "/usr/local/bin:/usr/bin:/bin", programs) == "/usr/local/bin/python" and which("python", "/usr/bin:/usr/local/bin", programs) == "/usr/bin/python" and which("sh", "/usr/local/bin:/usr/bin:/bin", programs) == "/bin/sh" and which("ls", "/bin:/usr/bin", programs) == "/bin/ls"
      assert which("git", "/usr/local/bin:/usr/bin:/bin", programs) is None and which("ls", "", programs) is None and which("ls", ":/usr/bin::", programs) == "/usr/bin/ls" and which("ls", "/nowhere:/bin", programs) == "/bin/ls"
  - name: slashes
    code: |
      programs = {"/bin": ["ls"], "/": ["tool"]}
      assert which("./ls", "/bin", programs) is None and which("/bin/ls", "/bin", programs) is None and which("tool", "/", programs) == "/tool"
  hints:
  - Split the PATH at ':' and try each folder in order.
  - programs.get(folder, ()) avoids an error for a folder with no entry.
  solution: |
    def which(command, path_var, programs):
        """Find which program the shell would run for `command`. `path_var` is the PATH text: folders separated by ':'. `programs` is a dict {folder: list of program names in it}. Look at the folders from LEFT to RIGHT (skip empty entries) and return folder + '/' + command for the first folder whose list contains the command, or None if there is none. A folder that is not in `programs` simply has no programs. (A command containing '/' is never searched: return None.)"""
        if "/" in command:
            return None
        for folder in path_var.split(":"):
            if folder and command in programs.get(folder, ()):
                return folder.rstrip("/") + "/" + command
        return None
  explanation: If two programs share a name, the folder listed first in PATH wins. That is why putting your own folder at the front of PATH lets you override a system tool.
- id: find
  title: Searching the tree
  difficulty: 5
  prompt: Write `find(fs, start, name=None, kind=None, maxdepth=None)`, like the real **find** command. List everything under the folder `start` (an absolute path), **including `start` itself**. `name` is a wildcard that must match the **last part** of the path (`glob_match` is given); `kind` is `"f"` for files only or `"d"` for folders only; `maxdepth` limits how deep to look (the start has depth 0, its children depth 1, and so on). Return the full paths **sorted as text**. `ValueError("no such directory")` if `start` is not a folder.
  starter: |-
    HOME = "/home/user"


    def normalize(path):
        """Clean an ABSOLUTE path (one that starts with '/'). Split it at '/', ignore empty parts and '.' parts (the current folder), and let '..' remove the previous part (at the top, '..' stays at the top: '/..' is '/'). Return '/' plus the remaining parts joined with '/'; the result for no parts is '/'."""
        parts = []
        for p in path.split("/"):
            if p in ("", "."):
                continue
            if p == "..":
                if parts:
                    parts.pop()
            else:
                parts.append(p)
        return "/" + "/".join(parts)


    def resolve(cwd, path):
        """Turn what the user typed into an absolute, clean path. `cwd` is the current working directory. A path starting with '~' (just '~' or '~/...') starts at HOME instead. A path that does not start with '/' is relative to cwd. Return the normalized absolute path."""
        if path == "~" or path.startswith("~/"):
            path = HOME + path[1:]
        if not path.startswith("/"):
            path = cwd + "/" + path
        return normalize(path)


    def split_path(path):
