      procs = {1: {"ppid": 0, "name": "init"}, 10: {"ppid": 1, "name": "bash"}, 11: {"ppid": 10, "name": "sleep"}, 12: {"ppid": 10, "name": "editor"}, 13: {"ppid": 12, "name": "linter"}}
      killed, new = kill_process(procs, 10)
