    def glob_match(pattern, name):
        """Does `name` match the wildcard `pattern`? '*' matches any number of characters (also none), '?' exactly one character, and '[abc]' one character from the set; ranges like '[a-f]' work, and '[!abc]' means any character NOT in the set. Every other character must match itself. A '[' with no closing ']' is an ordinary character. (Do not use the fnmatch module.)"""
        if not pattern:
            return not name
        c = pattern[0]
        if c == "*":
            return any(glob_match(pattern[1:], name[i:]) for i in range(len(name) + 1))
        if not name:
            return False
        if c == "?":
            return glob_match(pattern[1:], name[1:])
        if c == "[":
            close = pattern.find("]", 2)
            if close > 0:
                body = pattern[1:close]
                negate = body.startswith("!")
                if negate:
                    body = body[1:]
                hit, i = False, 0
                while i < len(body):
                    if i + 2 < len(body) and body[i + 1] == "-":
                        hit = hit or body[i] <= name[0] <= body[i + 2]
                        i += 3
                    else:
                        hit = hit or body[i] == name[0]
                        i += 1
                return hit != negate and glob_match(pattern[close + 1:], name[1:])
        return c == name[0] and glob_match(pattern[1:], name[1:])




    def find(fs, start, name=None, kind=None, maxdepth=None):
        """Like the `find` command: list everything under the folder `start` (an absolute path), including `start` itself. `name` is a wildcard that must match the LAST part of the path (use glob_match); `kind` is 'f' for files only or 'd' for folders only; `maxdepth` limits how deep to look (the start has depth 0, its children depth 1, and so on). Return the full paths sorted as text. ValueError('no such directory') if start is not a folder. Remember that '/' alone has an empty last part."""
        if start not in fs["dirs"]:
            raise ValueError("no such directory")
        prefix = start.rstrip("/") + "/"
        found = []
        candidates = [(d, "d") for d in fs["dirs"]] + [(f, "f") for f in fs["files"]]
        for path, k in candidates:
            if path != start and not path.startswith(prefix):
                continue
