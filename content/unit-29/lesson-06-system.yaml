        pass
  tests:
  - name: parts
    code: |
      assert cron_values("*", 0, 5) == [0, 1, 2, 3, 4, 5] and cron_values("5", 0, 59) == [5] and cron_values("1,3,5", 0, 59) == [1, 3, 5] and cron_values("2-4", 0, 59) == [2, 3, 4] and cron_values("3,1,3", 0, 9) == [1, 3]
      assert cron_values("*/15", 0, 59) == [0, 15, 30, 45] and cron_values("*/5", 1, 12) == [1, 6, 11] and cron_values("1-10/3", 0, 59) == [1, 4, 7, 10] and cron_values("0-23/6", 0, 23) == [0, 6, 12, 18] and cron_values("10/20", 0, 59) == [10, 30, 50] and cron_values("9-17,22", 0, 23) == [9, 10, 11, 12, 13, 14, 15, 16, 17, 22]
  - name: errors
    code: |
      for bad in ("", "x", "1-", "-3", "60", "5-3", "*/0", "*/x", "1,,2", "1-2-3", "0", "1.5", "*/", "1/0"):
          try:
              cron_values(bad, 1 if bad == "0" else 0, 59)
              raise AssertionError("accepted " + repr(bad))
          except ValueError as e:
              assert "bad field" in str(e)
      assert cron_values("0", 0, 0) == [0]
  hints:
  - Split at commas, then split each part at '/' and then handle *, a number or a range.
  - Check the limits after you know a and b.
  solution: |
    def cron_values(field, lo, hi):
        """Read ONE field of a cron schedule and return the sorted list of the numbers it allows, between lo and hi (both included). A field is a comma-separated list of parts; a part is '*' (every value from lo to hi), '*/n' (every n-th value starting at lo), 'a' (one number), 'a-b' (a range) or 'a-b/n' (a range in steps of n). ValueError('bad field') for anything else: not a number, a value outside lo..hi, a range with a > b, or a step n that is not a positive number."""
        values = set()
        for part in field.split(","):
            rng, slash, step = part.partition("/")
            if slash:
                if not step.isdigit() or int(step) == 0:
                    raise ValueError("bad field")
                n = int(step)
            else:
                n = 1
            if rng == "*":
                a, b = lo, hi
            elif rng.isdigit():
                a = int(rng)
                b = hi if slash else a
            elif rng.count("-") == 1 and all(x.isdigit() for x in rng.split("-")):
                a, b = (int(x) for x in rng.split("-"))
            else:
                raise ValueError("bad field")
            if a > b or a < lo or b > hi:
                raise ValueError("bad field")
            values.update(range(a, b + 1, n))
        return sorted(values)
  explanation: The five-field format is from the 1970s and is still how most servers schedule backups, reports and clean-up jobs.
