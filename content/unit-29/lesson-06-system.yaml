id: u29-system
title: Processes, Search and Scheduling
minutes: 110
objective: Understand how the shell finds programs (PATH), how programs run as processes you can inspect and stop, how to search a file tree, and how to schedule work with cron.
outcomes:
- Explain PATH and how a command is found
- Describe processes, signals and orphans
- Search for files with find and glob patterns
- Read and write cron schedules
sections:
- heading: Finding and running programs
  body: |-
    A command like `python` is just a name. The shell looks it up in the **PATH** variable: a list of folders separated by `:`, searched from **left to right**. The first folder that contains a program with that name wins. `which python` shows which one that is, and `echo $PATH` shows the list. A program must also have the **execute permission** (lesson 2). If you give a path (`./script.sh` or `/usr/bin/python`), the shell does not search at all.

    Each program you run starts in a new **environment**: a copy of the exported variables. Changing a variable in the program does not change yours, which keeps programs from interfering with each other.
- heading: Processes
  body: |-
    A running program is a **process**. Each one has a **pid** (process id, a number), a **parent** (the process that started it, `ppid`), an owner, and some memory. The very first process is **init** (pid 1), which starts the others and adopts **orphans** (children whose parent ended). `ps` lists processes, `top` shows them live, and the `&` at the end of a line starts a process in the **background** so you get your prompt back (`sleep 60 &`).

    To stop one you send a **signal** with `kill pid`. The default signal `SIGTERM` politely asks the program to finish (it can clean up). `kill -9` sends `SIGKILL`, which the program cannot refuse. `Ctrl+C` sends `SIGINT` to the program in the foreground. Signals are the way the operating system tells a process that something happened.

    ```bash
    sleep 300 &        # start in the background
    ps                 # list processes: find its pid
    kill 4242          # ask it to end
    kill -9 4242       # force it if it ignores you
    ```

    > **Tip:** A **daemon** is a process that runs in the background for a long time (a web server, a database, cron). Its name often ends in `d`.
- heading: Searching and scheduling
  body: |-
    `find` walks a folder tree and lists what matches: `find . -name "*.py" -type f`. Combine it with `xargs`, which turns the lines it reads into arguments of another command: `find . -name "*.tmp" | xargs rm` removes every temporary file (use `-print0` and `xargs -0` if names might contain spaces). `locate` searches a prebuilt index instead, which is much faster but can be out of date.

    **cron** is the scheduler. Each user has a **crontab** with one job per line: five time fields and then the command.

    ```
    # minute hour day-of-month month day-of-week  command
    30 2 * * *      /home/user/backup.sh      # every day at 02:30
    */15 * * * *    /home/user/check.sh       # every 15 minutes
    0 9 * * 1-5     /home/user/report.sh      # 09:00 on weekdays
    0 0 1 * *       /home/user/monthly.sh     # first of every month
    ```

    `*` means every value, `a,b` a list, `a-b` a range and `*/n` every n-th. If both day-of-month and weekday are restricted, the job runs when **either** matches, a famous quirk. Jobs run without your terminal, so use full paths and send their output to a log file.
examples:
- title: which and find
  intro: Search the PATH and a folder tree.
  code: |
    HOME = "/home/user"


    def normalize(path):
        """Clean an ABSOLUTE path (one that starts with '/'). Split it at '/', ignore empty parts and '.' parts (the current folder), and let '..' remove the previous part (at the top, '..' stays at the top: '/..' is '/'). Return '/' plus the remaining parts joined with '/'; the result for no parts is '/'."""
        parts = []
        for p in path.split("/"):
            if p in ("", "."):
                continue
            if p == "..":
                if parts:
                    parts.pop()
            else:
                parts.append(p)
        return "/" + "/".join(parts)


    def resolve(cwd, path):
        """Turn what the user typed into an absolute, clean path. `cwd` is the current working directory. A path starting with '~' (just '~' or '~/...') starts at HOME instead. A path that does not start with '/' is relative to cwd. Return the normalized absolute path."""
        if path == "~" or path.startswith("~/"):
            path = HOME + path[1:]
        if not path.startswith("/"):
            path = cwd + "/" + path
        return normalize(path)


    def split_path(path):
        """Split a path into (folder, name): normalize it first; the folder of '/a/b/c.txt' is '/a/b' and its name is 'c.txt'; for '/c.txt' the folder is '/'; for '/' itself return ('/', '')."""
        path = normalize(path)
        if path == "/":
            return ("/", "")
        i = path.rindex("/")
        return (path[:i] or "/", path[i + 1:])


    def extension(name):
        """The file extension of a name: the text after the LAST dot, without the dot, or '' if there is none. A leading dot does not count ('.bashrc' has no extension) and a name ending in a dot has none."""
        stem = name.lstrip(".")
        if "." not in stem:
            return ""
        return stem.rsplit(".", 1)[1]


    def join_path(*parts):
        """Join path parts with '/' like os.path.join, then normalize: a part that starts with '/' starts again from there (everything before it is dropped). The result is always absolute (a first part without '/' is taken from the root)."""
        result = ""
        for p in parts:
            if p.startswith("/"):
                result = p
            else:
                result += "/" + p
        return normalize(result)


    def new_fs():
        """A tiny file system: {"dirs": a set holding just '/', "files": an empty dict mapping absolute path -> text}."""
        return {"dirs": {"/"}, "files": {}}


    def is_dir(fs, path):
        """True if the (normalized) path is a directory."""
        return normalize(path) in fs["dirs"]


    def is_file(fs, path):
        """True if the (normalized) path is a file."""
        return normalize(path) in fs["files"]


    def mkdir_p(fs, path):
        """Like `mkdir -p`: create the directory and all missing parents (already existing ones are fine). ValueError('not a directory') if some part of the path is a FILE."""
        cur = ""
        for part in [p for p in normalize(path).split("/") if p]:
            cur += "/" + part
            if cur in fs["files"]:
                raise ValueError("not a directory")
            fs["dirs"].add(cur)


    def write_file(fs, path, text):
        """Create or overwrite a file. ValueError('is a directory') if the path is a directory or the root; ValueError('no such directory') if its folder does not exist."""
        path = normalize(path)
        folder, name = split_path(path)
        if not name or path in fs["dirs"]:
            raise ValueError("is a directory")
        if folder not in fs["dirs"]:
            raise ValueError("no such directory")
        fs["files"][path] = text


    def ls(fs, path, all=False):
        """List a directory like `ls`: the sorted names of the things directly inside it, with '/' added after directory names. Names that start with '.' are hidden unless all=True. For a FILE return just [its name]. ValueError('no such file or directory') if the path does not exist."""
        path = normalize(path)
        if path in fs["files"]:
            return [split_path(path)[1]]
        if path not in fs["dirs"]:
            raise ValueError("no such file or directory")
        names = set()
        for d in fs["dirs"]:
            if d != path and split_path(d)[0] == path:
                names.add(split_path(d)[1] + "/")
        for f in fs["files"]:
            if split_path(f)[0] == path:
                names.add(split_path(f)[1])
        return sorted(n for n in names if all or not n.startswith("."))


    def tree_lines(fs, path):
        """Draw a directory as an outline: the first line is the directory's own name ('/' for the root) followed by '/' unless it is the root; below it every entry of ls(fs, path, all=True) on its own line, indented by 2 spaces per level, directories followed by '/' and listed with their contents right below them (depth first). ValueError('not a directory') if the path is not a directory."""
        path = normalize(path)
        if path not in fs["dirs"]:
            raise ValueError("not a directory")
        lines = ["/" if path == "/" else split_path(path)[1] + "/"]

        def walk(folder, depth):
            for name in ls(fs, folder, all=True):
                lines.append("  " * depth + name)
                if name.endswith("/"):
                    walk(join_path(folder, name[:-1]), depth + 1)

        walk(path, 1)
        return lines


    def cd(fs, cwd, path):
        """Like `cd`: return the new working directory resolve(cwd, path). ValueError('not a directory') if it is a file, ValueError('no such directory') if it does not exist."""
        target = resolve(cwd, path)
        if target in fs["files"]:
            raise ValueError("not a directory")
        if target not in fs["dirs"]:
            raise ValueError("no such directory")
        return target


    def under(fs, path):
        """Everything at or below a path: return (dirs, files): the sorted list of directories whose path is `path` or starts with `path + '/'`, and the same for files (a file path equal to `path` counts). The path is normalized first."""
        path = normalize(path)
        prefix = "/" if path == "/" else path + "/"
        dirs = sorted(d for d in fs["dirs"] if d == path or d.startswith(prefix))
        files = sorted(f for f in fs["files"] if f == path or f.startswith(prefix))
        return dirs, files


    def cat(fs, *paths):
        """Return the text of the files one after the other. ValueError('no such file: PATH') for a missing path and ValueError('is a directory: PATH') for a directory (using the path as given). Check each path in order."""
        out = ""
        for p in paths:
            if is_dir(fs, p):
                raise ValueError("is a directory: " + p)
            if not is_file(fs, p):
                raise ValueError("no such file: " + p)
            out += fs["files"][normalize(p)]
        return out


    def touch(fs, path):
        """Create an EMPTY file if the path does not exist yet; an existing file is left unchanged. ValueError('is a directory') for a directory; ValueError('no such directory') if the folder does not exist."""
        path = normalize(path)
        if path in fs["files"]:
            return
        write_file(fs, path, "")


    def mkdir(fs, path):
        """Like `mkdir` without -p: create ONE directory. ValueError('file exists') if the path already exists (as a file or directory); ValueError('no such directory') if its folder does not exist."""
        path = normalize(path)
        if path in fs["files"] or path in fs["dirs"]:
            raise ValueError("file exists")
        if split_path(path)[0] not in fs["dirs"]:
            raise ValueError("no such directory")
        fs["dirs"].add(path)


    def demo_fs():
        fs = new_fs()
        mkdir_p(fs, "/home/user/docs")
        mkdir_p(fs, "/home/user/.config")
        mkdir_p(fs, "/home/user/projects/app")
        write_file(fs, "/home/user/notes.txt", "buy milk\n")
        write_file(fs, "/home/user/docs/report.md", "# Report\n")
        write_file(fs, "/home/user/docs/readme.md", "# Read me\n")
        write_file(fs, "/home/user/projects/app/main.py", "print('hi')\n")
        write_file(fs, "/home/user/.bashrc", "export A=1\n")
        return fs


    def glob_match(pattern, name):
        """Does `name` match the wildcard `pattern`? '*' matches any number of characters (also none), '?' exactly one character, and '[abc]' one character from the set; ranges like '[a-f]' work, and '[!abc]' means any character NOT in the set. Every other character must match itself. A '[' with no closing ']' is an ordinary character. (Do not use the fnmatch module.)"""
        if not pattern:
            return not name
        c = pattern[0]
        if c == "*":
            return any(glob_match(pattern[1:], name[i:]) for i in range(len(name) + 1))
        if not name:
            return False
        if c == "?":
            return glob_match(pattern[1:], name[1:])
        if c == "[":
            close = pattern.find("]", 2)
            if close > 0:
                body = pattern[1:close]
                negate = body.startswith("!")
                if negate:
                    body = body[1:]
                hit, i = False, 0
                while i < len(body):
                    if i + 2 < len(body) and body[i + 1] == "-":
                        hit = hit or body[i] <= name[0] <= body[i + 2]
                        i += 3
                    else:
                        hit = hit or body[i] == name[0]
                        i += 1
                return hit != negate and glob_match(pattern[close + 1:], name[1:])
        return c == name[0] and glob_match(pattern[1:], name[1:])


    def which(command, path_var, programs):
        """Find which program the shell would run for `command`. `path_var` is the PATH text: folders separated by ':'. `programs` is a dict {folder: list of program names in it}. Look at the folders from LEFT to RIGHT (skip empty entries) and return folder + '/' + command for the first folder whose list contains the command, or None if there is none. A folder that is not in `programs` simply has no programs. (A command containing '/' is never searched: return None.)"""
        if "/" in command:
            return None
        for folder in path_var.split(":"):
            if folder and command in programs.get(folder, ()):
                return folder.rstrip("/") + "/" + command
        return None


    def find(fs, start, name=None, kind=None, maxdepth=None):
        """Like the `find` command: list everything under the folder `start` (an absolute path), including `start` itself. `name` is a wildcard that must match the LAST part of the path (use glob_match); `kind` is 'f' for files only or 'd' for folders only; `maxdepth` limits how deep to look (the start has depth 0, its children depth 1, and so on). Return the full paths sorted as text. ValueError('no such directory') if start is not a folder. Remember that '/' alone has an empty last part."""
        if start not in fs["dirs"]:
            raise ValueError("no such directory")
        prefix = start.rstrip("/") + "/"
        found = []
        candidates = [(d, "d") for d in fs["dirs"]] + [(f, "f") for f in fs["files"]]
        for path, k in candidates:
            if path != start and not path.startswith(prefix):
                continue
            depth = 0 if path == start else path[len(prefix):].count("/") + 1
            if maxdepth is not None and depth > maxdepth:
                continue
            if kind is not None and k != kind:
                continue
            if name is not None and not glob_match(name, path.rsplit("/", 1)[-1]):
                continue
            found.append(path)
        return sorted(found)

    programs = {"/usr/local/bin": ["python"], "/usr/bin": ["python", "ls", "grep"], "/bin": ["sh"]}
    PATH = "/usr/local/bin:/usr/bin:/bin"
    for cmd in ("python", "grep", "sh", "git"):
        print(cmd, "->", which(cmd, PATH, programs))
    fs = demo_fs()
    mkdir_p(fs, "/home/user/work/app/src")
    for p in ("app/src/main.py", "app/README.md", "app/src/util.py"):
        write_file(fs, "/home/user/work/" + p, "x\n")
    for path in find(fs, "/home/user/work", name="*.py"):
        print(path)
    print(find(fs, "/home/user/work", kind="d", maxdepth=1))
  output: |
    python -> /usr/local/bin/python
    grep -> /usr/bin/grep
    sh -> /bin/sh
    git -> None
    /home/user/work/app/src/main.py
    /home/user/work/app/src/util.py
    ['/home/user/work', '/home/user/work/app']
