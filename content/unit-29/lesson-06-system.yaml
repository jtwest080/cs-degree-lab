  - Collect the pids to remove first, then build the new table without changing the old one.
  - For descendants keep adding any process whose parent is already in the set until nothing new appears.
  solution: |
    def kill_process(procs, pid, kill_children=False):
        """Simulate `kill`. `procs` is a dict {pid: {"ppid": parent pid, "name": text}} and is NOT changed. Return (killed, new_procs): `killed` is the sorted list of pids that ended and `new_procs` the table afterwards. Killing a process removes it. With kill_children=True all its descendants (children, their children, ...) end too. Otherwise its children become ORPHANS: they stay alive and their ppid is set to 1 (the init process). ValueError('no such process') if pid is not in the table and ValueError('cannot kill init') for pid 1."""
        if pid == 1:
            raise ValueError("cannot kill init")
        if pid not in procs:
            raise ValueError("no such process")
        killed = {pid}
        if kill_children:
            grew = True
            while grew:
                grew = False
                for p, info in procs.items():
                    if info["ppid"] in killed and p not in killed:
                        killed.add(p)
                        grew = True
        new = {}
        for p, info in procs.items():
            if p in killed:
                continue
            new[p] = {"ppid": 1 if info["ppid"] in killed else info["ppid"], "name": info["name"]}
        return sorted(killed), new
  explanation: Most programs reacting to the default kill (SIGTERM) clean up and exit; kill -9 (SIGKILL) cannot be ignored, which is why it is the last resort.
- id: cronfield
  title: Reading a schedule field
  difficulty: 5
  prompt: '**Cron** runs commands on a schedule, written as five fields: `minute hour day-of-month month day-of-week`. Write `cron_values(field, lo, hi)`: read **one** field and return the sorted list of the numbers it allows, between `lo` and `hi` (both included). A field is a comma-separated list of parts; a part is `*` (every value from `lo` to `hi`), `*/n` (every n-th value starting at `lo`), `a` (one number), `a-b` (a range) or `a-b/n` (a range in steps of `n`; a plain `a/n` counts from `a` up to `hi`). `ValueError("bad field")` for anything else: not a number, a value outside `lo..hi`, a range with `a > b`, or a step that is not a positive number.'
