  def new_shell(fs=None):
      """A fresh shell: {"fs": fs (default demo_fs()), "cwd": "/home/user", "env": {"HOME": "/home/user", "USER": "user", "PATH": "/bin:/usr/bin"}, "status": 0, "history": []}."""
      return {"fs": fs if fs is not None else demo_fs(), "cwd": HOME, "env": {"HOME": HOME, "USER": "user", "PATH": "/bin:/usr/bin"}, "status": 0, "history": []}


  def prompt(sh):
      """The text shown before you type: USER + '@lab:' + the folder + '$ '. The folder is written '~' for the home folder (the HOME variable), '~/docs' for a folder below it, and in full otherwise. Example: 'user@lab:~/docs$ '."""
      home, cwd = sh["env"]["HOME"], sh["cwd"]
      if cwd == home:
          shown = "~"
      elif cwd.startswith(home.rstrip("/") + "/"):
          shown = "~" + cwd[len(home.rstrip("/")):]
      else:
          shown = cwd
      return sh["env"]["USER"] + "@lab:" + shown + "$ "


  def expand_words(sh, tokens):
      """Expand the words of ONE pipeline's tokens (triples from tokenize_q) into plain pairs (kind, text). Operators pass through as ("op", text). For a word: mode "single" is left exactly as typed; mode "double" gets only variable expansion (expand_vars with the shell's env and its last status); mode "plain" gets, in this order, brace expansion (expand_braces), then variable expansion on every result, then wildcard expansion (expand_glob in the shell's folder) of every result; a plain word that is empty after the variable step disappears. Every produced word is ("word", text)."""
      out = []
      for kind, text, mode in tokens:
          if kind == "op":
              out.append(("op", text))
          elif mode == "single":
              out.append(("word", text))
          elif mode == "double":
              out.append(("word", expand_vars(text, sh["env"], sh["status"])))
          else:
              for piece in expand_braces(text):
                  value = expand_vars(piece, sh["env"], sh["status"])
                  if value == "":
                      continue
                  for name in expand_glob(sh["fs"], sh["cwd"], value):
                      out.append(("word", name))
      return out


  def read_lines(sh, names):
      """The lines of the named files (relative to the shell's folder) one after the other; ValueError from cat passes through."""
      return cat(sh["fs"], *[resolve(sh["cwd"], n) for n in names]).splitlines()


  def run_command(sh, argv, stdin):
      """Run ONE command. `argv` is [name, arguments...], `stdin` the list of input lines. Return (lines, status): status 0 with the output lines on success; status 1 with ONE line 'name: message' when a ValueError is raised (or a KeyError for a missing option, message 'missing option'); status 127 and 'name: command not found' for an unknown command. All paths are resolved against the shell's folder with resolve. Commands: echo (arguments joined by spaces); pwd; cd [path] (default: the HOME variable; changes sh['cwd']; no output); ls [-a] [path] (default '.'); cat [files] (no files: stdin); mkdir [-p] DIRS... (-p uses mkdir_p); touch FILES...; rm [-r] PATHS...; cp [-r] SRC DST; mv SRC DST; head / tail [-n N] [files]; sort [-r -n -u -f] [files]; uniq [-c] [files]; wc [-l] [files] (like the earlier lesson: the one number for -l, otherwise 'lines words chars'); grep [-i -v -n -c -E] PATTERN [files]; cut -d D -f F [files]; tr SOURCE TARGET (on stdin); env (every 'NAME=value' sorted); export NAME=value ... (sets variables; no output); history (one line per earlier command: the number right-aligned in 4 characters, two spaces, the line: '%4d  %s'); true (status 0); false (status 1). When file names are given they replace stdin. rm, cp and mv with the wrong number of arguments raise ValueError('missing operand'). Use the tool functions you already have."""
      name, args = argv[0], argv[1:]
      fs, cwd = sh["fs"], sh["cwd"]
      path = lambda p: resolve(cwd, p)
      try:
          if name == "echo":
              return [" ".join(args)], 0
          if name == "pwd":
              return [cwd], 0
          if name == "cd":
              sh["cwd"] = cd(fs, cwd, args[0] if args else sh["env"]["HOME"])
              return [], 0
          if name == "ls":
              flags, _, rest = parse_args(args, set())
              return ls(fs, path(rest[0] if rest else "."), all="a" in flags), 0
          if name == "cat":
              return (read_lines(sh, args) if args else list(stdin)), 0
          if name == "mkdir":
              flags, _, rest = parse_args(args, set())
              if not rest:
                  raise ValueError("missing operand")
              for d in rest:
                  (mkdir_p if "p" in flags else mkdir)(fs, path(d))
              return [], 0
          if name == "touch":
              if not args:
                  raise ValueError("missing operand")
              for f in args:
                  touch(fs, path(f))
              return [], 0
          if name == "rm":
              flags, _, rest = parse_args(args, set())
              if not rest:
                  raise ValueError("missing operand")
              for p in rest:
                  rm(fs, path(p), recursive="r" in flags)
              return [], 0
          if name in ("cp", "mv"):
              flags, _, rest = parse_args(args, set())
              if len(rest) != 2:
                  raise ValueError("missing operand")
              if name == "cp":
                  cp(fs, path(rest[0]), path(rest[1]), recursive="r" in flags)
              else:
                  mv(fs, path(rest[0]), path(rest[1]))
              return [], 0
          if name in ("head", "tail"):
              _, values, rest = parse_args(args, {"n"})
              lines = read_lines(sh, rest) if rest else list(stdin)
              n = int(values.get("n", "10"))
              return (head(lines, n) if name == "head" else tail(lines, n)), 0
          if name == "sort":
              flags, _, rest = parse_args(args, set())
              lines = read_lines(sh, rest) if rest else list(stdin)
              return sort_lines(lines, reverse="r" in flags, numeric="n" in flags, unique="u" in flags, ignore_case="f" in flags), 0
          if name == "uniq":
              flags, _, rest = parse_args(args, set())
              lines = read_lines(sh, rest) if rest else list(stdin)
              return uniq(lines, count="c" in flags), 0
          if name == "wc":
              flags, _, rest = parse_args(args, set())
              lines = read_lines(sh, rest) if rest else list(stdin)
              counts = wc("\n".join(lines) + "\n" if lines else "")
              return ([str(counts[0])] if "l" in flags else [" ".join(str(c) for c in counts)]), 0
          if name == "grep":
              flags, _, rest = parse_args(args, set())
              if not rest:
                  raise ValueError("missing pattern")
              lines = read_lines(sh, rest[1:]) if len(rest) > 1 else list(stdin)
              return grep(lines, rest[0], ignore_case="i" in flags, invert="v" in flags, number="n" in flags, count="c" in flags, regex="E" in flags), 0
          if name == "cut":
              _, values, rest = parse_args(args, {"d", "f"})
              lines = read_lines(sh, rest) if rest else list(stdin)
              return cut(lines, values.get("d", "\t"), [int(x) for x in values["f"].split(",")]), 0
          if name == "tr":
              if len(args) != 2:
                  raise ValueError("expected two arguments")
              return [tr(line, args[0], args[1]) for line in stdin], 0
          if name == "env":
              return [k + "=" + v for k, v in sorted(sh["env"].items()) if k.isidentifier()], 0
          if name == "export":
              for a in args:
                  key, eq, value = a.partition("=")
                  if eq and key.isidentifier():
                      sh["env"][key] = value
              return [], 0
          if name == "history":
              return ["%4d  %s" % (i + 1, h) for i, h in enumerate(sh["history"])], 0
          if name == "true":
              return [], 0
          if name == "false":
              return [], 1
      except KeyError:
          return [name + ": missing option"], 1
      except ValueError as err:
          return [name + ": " + str(err)], 1
      return [name + ": command not found"], 127


  def run_pipeline(sh, stages):
      """Run the stages of a pipeline (from parse_pipeline) with run_command. Each stage's input is the previous stage's output (nothing for the first); `stdin` redirection replaces it with the lines of that file. A stage with a non-zero status FAILED: keep its error lines for the terminal and pass nothing on. A successful stage with `stdout` redirection writes its lines to that file (resolved against the folder; text = the lines joined with newlines plus a final newline, or '' for no lines; append=True adds to the old text) and passes nothing on. A ValueError while reading or writing a redirection is an error line 'name: message' with status 1. Return (terminal lines, status of the LAST stage); the terminal lines are the errors in order followed by the output of the last stage."""
      data, errors, status = [], [], 0
      for stage in stages:
          argv, stdin, status = stage["argv"], data, 0
          try:
              if stage["stdin"] is not None:
                  stdin = read_lines(sh, [stage["stdin"]])
          except ValueError as err:
              errors.append(argv[0] + ": " + str(err))
              data, status = [], 1
              continue
          lines, status = run_command(sh, argv, stdin)
          if status != 0:
              errors.extend(lines)
              data = []
              continue
          if stage["stdout"] is not None:
              target, append = stage["stdout"]
              full = resolve(sh["cwd"], target)
              text = "\n".join(lines) + "\n" if lines else ""
              if append and full in sh["fs"]["files"]:
                  text = sh["fs"]["files"][full] + text
              try:
                  write_file(sh["fs"], full, text)
              except ValueError as err:
                  errors.append(argv[0] + ": " + str(err))
                  data, status = [], 1
                  continue
              lines = []
          data = lines
      return errors + data, status


  def run_line(sh, line):
      """Run one command line and return (terminal lines, status). Also store the status in sh['status']. A blank line returns ([], the old status) and is not remembered; every other line is first appended to sh['history'] (exactly as typed, stripped of blanks at the ends). Split the tokens (tokenize_q) at the unquoted ';', '&&' and '||' into pipelines and run them from left to right: ';' always continues, '&&' only after status 0, '||' only after a non-zero status (a skipped pipeline leaves the status). For each pipeline: expand_words (with the CURRENT status), and if nothing is left do nothing (status 0); then parse_pipeline; a pipeline that is one stage consisting of the single word NAME=value (NAME a valid identifier, no redirection) is a variable assignment: set sh['env'][NAME] = value and the status 0; otherwise run_pipeline. A ValueError from tokenizing or parsing is not raised but returned as (['shell: ' + the message], 2)."""
      line = line.strip()
      if not line:
          return [], sh["status"]
      sh["history"].append(line)
      try:
          tokens = tokenize_q(line)
          groups, current, connectors = [], [], []
          for tok in tokens:
              if tok[0] == "op" and tok[1] in (";", "&&", "||"):
                  if not current:
                      raise ValueError("syntax error")
                  groups.append(current)
                  connectors.append(tok[1])
                  current = []
              else:
                  current.append(tok)
          if not current:
              raise ValueError("syntax error")
          groups.append(current)
          out = []
          for i, group in enumerate(groups):
              if i > 0:
                  c = connectors[i - 1]
                  if (c == "&&" and sh["status"] != 0) or (c == "||" and sh["status"] == 0):
                      continue
              words = expand_words(sh, group)
              if not words:
                  sh["status"] = 0
                  continue
              stages = parse_pipeline(words)
              first = stages[0]["argv"][0].partition("=")
              if len(stages) == 1 and len(stages[0]["argv"]) == 1 and first[1] and first[0].isidentifier() and stages[0]["stdin"] is None and stages[0]["stdout"] is None:
                  sh["env"][first[0]] = first[2]
                  sh["status"] = 0
                  continue
              lines, sh["status"] = run_pipeline(sh, stages)
              out.extend(lines)
          return out, sh["status"]
      except ValueError as err:
          sh["status"] = 2
          return ["shell: " + str(err)], 2


  def run_script(sh, text, args=()):
      """Run a script. Set the variables '1', '2', ... to the arguments (as text) and '#' to how many there are (keep the others), then run the lines of `text` with run_line: skip blank lines and lines whose first non-blank character is '#'. The line 'exit' (optionally followed by a number) stops the script immediately: the status is that number (as int) or, without one, the last status. Return (all output lines, the final status; sh['status'] too)."""
      for i, a in enumerate(args):
          sh["env"][str(i + 1)] = a
      sh["env"]["#"] = str(len(args))
      out = []
      for raw in text.splitlines():
          line = raw.strip()
          if not line or line.startswith("#"):
              continue
          words = line.split()
          if words[0] == "exit":
              sh["status"] = int(words[1]) if len(words) > 1 else sh["status"]
              break
          lines, _ = run_line(sh, line)
          out.extend(lines)
      return out, sh["status"]
