# Terms introduced in Unit 30 (Testing and Debugging). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Test
  definition: A small program that runs other code and checks that the result is what you expect.
  lesson: u30-asserts
- term: Automated test
  definition: A test that a computer runs for you, so it can be repeated at any time.
  lesson: u30-asserts
- term: Assertion
  definition: A statement that must be true; if it is false the test fails.
  lesson: u30-asserts
- term: Code under test
  definition: The code that a test is checking.
  lesson: u30-asserts
- term: Test failure
  definition: A test that ran but found a wrong result.
  lesson: u30-asserts
- term: Test error
  definition: A test that crashed with an unexpected exception instead of finishing.
  lesson: u30-asserts
- term: Test runner
  definition: The program that finds tests, runs each one and reports the results.
  lesson: u30-asserts
- term: Regression test
  definition: A test that guards against a bug that was already fixed coming back.
  lesson: u30-asserts
- term: Setup
  definition: The step that prepares a fixture before a test.
  lesson: u30-asserts
- term: Teardown
  definition: The step that cleans up after a test, even when it failed.
  lesson: u30-asserts
- term: Deterministic
  definition: Giving the same result every time for the same input.
  lesson: u30-asserts
- term: Boundary value
  definition: An input at or next to the edge of what a function accepts.
  lesson: u30-design
- term: Equivalence class
  definition: A group of inputs that the code handles in the same way.
  lesson: u30-design
- term: Happy path
  definition: The normal case where nothing goes wrong.
  lesson: u30-design
- term: Table-driven test
  definition: A test that lists many cases as data and checks them all in one loop.
  lesson: u30-design
- term: Shrinking
  definition: Making a failing input as small as possible while it still fails.
  lesson: u30-design
- term: Spy
  definition: A real object wrapped so that its calls are recorded.
  lesson: u30-isolate
- term: Time to live
  definition: How long a cached answer stays valid.
  lesson: u30-isolate
- term: Line coverage
  definition: Coverage counted in lines of code.
  lesson: u30-coverage
- term: Branch coverage
  definition: Coverage that counts both outcomes of every if.
  lesson: u30-coverage
- term: Mutant
  definition: A copy of the code with one small deliberate change.
  lesson: u30-coverage
- term: Killed mutant
  definition: A mutant that made a test fail, which is what you want.
  lesson: u30-coverage
- term: Surviving mutant
  definition: A mutant that the tests did not catch.
  lesson: u30-coverage
- term: Mutation score
  definition: The share of mutants that the tests killed.
  lesson: u30-coverage
- term: Stack frame
  definition: The record of one function call in a traceback.
  lesson: u30-debug
- term: Debugger
  definition: A tool that lets you stop a program, look at its variables and step through it.
  lesson: u30-debug
- term: Watchpoint
  definition: A debugger feature that reports when a variable changes.
  lesson: u30-debug
- term: Delta debugging
  definition: Reducing a failing input by removing parts while it still fails.
  lesson: u30-debug
- term: Minimal reproduction
  definition: The smallest input or program that still shows a bug.
  lesson: u30-debug
- term: Rubber-duck debugging
  definition: Explaining a problem aloud, even to a toy duck, to see the answer.
  lesson: u30-debug
- term: Logging
  definition: Writing down what a program does so that you can understand it later.
  lesson: u30-quality
- term: Allow-list
  definition: A list of what is permitted; everything else is rejected.
  lesson: u30-quality
- term: Exception chaining
  definition: Linking an error to the earlier error that caused it.
  lesson: u30-quality
- term: Root cause
  definition: The original reason that something went wrong.
  lesson: u30-quality
