- type: code
  question: Write `summary(passed, failed)` returning text like `'3 passed, 1 failed'`; when `failed` is 0 return just `'3 passed'`.
  starter: |
    def summary(passed, failed):
        pass
  tests:
  - name: summary
    code: |
      assert summary(3, 1) == "3 passed, 1 failed" and summary(5, 0) == "5 passed" and summary(0, 2) == "0 passed, 2 failed"
  solution: |
    def summary(passed, failed):
        text = str(passed) + " passed"
        if failed:
            text += ", " + str(failed) + " failed"
        return text
