  hints:
  - 'Run the setup with run_test only once: you need its returned fixture, so call it yourself inside try/except.'
  - Do the teardown after the test whatever happened, then adjust the result.
  solution: |
    def run_test(func, *args):
        """Run one test function and classify what happens. Return a pair (status, message): ('pass', '') when it returns normally; ('fail', the text of the AssertionError, or 'assertion failed' if the text is empty) when it raises AssertionError; ('error', 'TypeName: text') for any other exception, where TypeName is the exception's class name and the text is str(exception) (just 'TypeName' when the text is empty). The arguments are passed to the function."""
        try:
            func(*args)
        except AssertionError as err:
            return "fail", str(err) or "assertion failed"
        except Exception as err:
            return "error", type(err).__name__ + (": " + str(err) if str(err) else "")
        return "pass", ""




    def run_suite(tests):
        """Run a list of tests and return a list of (name, status, message) in the same order. Each test is a dict {"name": text, "func": function} and may also have "setup" (a function with no arguments that makes a FIXTURE) and "teardown" (a function that takes the fixture). With a setup, func is called with the fixture as its only argument (otherwise with no arguments). Use run_test for the call. If the setup raises, the test is ('error', 'setup: ' + the usual error message) and nothing else runs for it. The teardown runs after the test even when it failed; if the teardown itself raises, the result becomes ('error', 'teardown: ' + the message) (even when the test had passed; if the test had already failed or errored keep that result). Tests must not influence each other: every test gets a new fixture from its own setup."""
        results = []
        for t in tests:
            fixture, args, status, message = None, (), "pass", ""
            if "setup" in t:
                try:
                    fixture = t["setup"]()
                except Exception as err:
                    results.append((t["name"], "error", "setup: " + type(err).__name__ + (": " + str(err) if str(err) else "")))
                    continue
                args = (fixture,)
            status, message = run_test(t["func"], *args)
            if "teardown" in t:
                tstatus, tmessage = run_test(t["teardown"], fixture)
                if tstatus != "pass" and status == "pass":
                    status, message = "error", "teardown: " + tmessage
            results.append((t["name"], status, message))
        return results
  explanation: These are the same ideas as the setUp and tearDown methods of unittest and the fixtures of pytest.
commonMistakes:
- title: Tests that depend on each other
  explanation: Each test must create its own data.
- title: Testing only the happy path
  explanation: Also test bad input and edge cases.
- title: Comparing floats with ==
  explanation: 0.1 + 0.2 is not exactly 0.3; allow a small difference.
- title: A test that can never fail
  explanation: Watch it fail first.
- title: Ignoring the exit code
  explanation: A runner that always returns 0 hides failures from CI.
summary:
- A test arranges, acts and asserts.
- A failure is a wrong answer; an error is a crash.
- A runner runs every test separately and reports.
- Fixtures prepare state; teardown always runs.
- Independent, fast, deterministic tests are trustworthy.
