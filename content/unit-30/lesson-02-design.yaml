id: u30-design
title: Designing Good Tests
minutes: 110
objective: 'Learn how to **choose** tests that find bugs: boundary values, equivalence classes, table-driven tests, and property-based testing with random inputs and **shrinking**.'
outcomes:
- Choose boundary values
- Group inputs into equivalence classes
- Write table-driven tests
- State properties and test them with random inputs
- Explain shrinking
sections:
- heading: What to test
  body: |-
    You can never test every input, so the skill is choosing the few that are most likely to reveal a bug. Three ideas do most of the work.

    **Boundary values.** Programs are most often wrong at the edges: `<` instead of `<=`, an empty list, the last item, zero. If a function accepts 1 to 50, test 0, 1, 2, 49, 50 and 51.

    **Equivalence classes.** Inputs that the code treats the same way form a class. A ticket price function may have classes child, adult and senior; one or two examples from each class (plus the edges between classes) are enough. Also include the odd classes: empty, `None`, negative, huge, text with spaces or accents.

    **Typical and error cases.** Test the normal case (the **happy path**), the edges, and the cases that should be **rejected**. A test list for any function should read like a checklist of those.

    > **Tip:** When you find a bug, first write a test that fails because of it, then fix the code. The test stays as a regression test.
- heading: Tables and properties
  body: |-
    A **table-driven test** keeps the cases as data: a list of inputs and expected outputs, plus one loop that checks them all. Adding a case is one line, and the failure message names the row. In `pytest` this is `@pytest.mark.parametrize`.

    A **property-based test** checks a *rule* rather than examples. For sorting: the result has the same length, it is in order, and sorting it again changes nothing. The tool then generates hundreds of **random** inputs (with a **seed**, so a failure can be reproduced exactly) and looks for one that breaks the rule. When it finds one, it **shrinks** it: it removes parts again and again as long as the test still fails, until a small, readable **counterexample** is left such as `[1, 0]`.

    Good properties often come in these kinds: **round trip** (decode(encode(x)) == x), **invariant** (length or sum is unchanged), **idempotent** (doing it twice equals doing it once), and **comparison with a slow but obviously correct version**.
examples:
- title: Boundaries, tables and classes
  intro: Test a shipping-price function at its edges.
  code: |
    def compare(actual, expected):
        """Compare two values like a test framework. Return '' when they are equal. Numbers (int or float) are equal when they differ by less than 1e-9. Two lists (or tuples) of the same length are compared item by item and the FIRST difference is reported as 'item I: ' followed by the message for the two items (so nested lists work, the index counts from 0); lists of different length give 'length: expected N but got M'. Anything else is compared with ==. The message for a difference is 'expected E but got A' using repr for both values (E is the expected value, A the actual)."""
        nums = (int, float)
        if isinstance(actual, nums) and isinstance(expected, nums) and not isinstance(actual, bool) and not isinstance(expected, bool):
            return "" if abs(actual - expected) < 1e-9 else "expected " + repr(expected) + " but got " + repr(actual)
        if isinstance(actual, (list, tuple)) and isinstance(expected, (list, tuple)):
            if len(actual) != len(expected):
                return "length: expected " + str(len(expected)) + " but got " + str(len(actual))
            for i, (a, e) in enumerate(zip(actual, expected)):
                msg = compare(a, e)
                if msg:
                    return "item " + str(i) + ": " + msg
            return ""
        return "" if actual == expected else "expected " + repr(expected) + " but got " + repr(actual)


    def assert_raises(func, args, exc_name):
        """Check that func(*args) raises the exception called exc_name (given as TEXT, such as 'ValueError'); a subclass counts too (look at the names in type(err).__mro__). Return '' when it does, 'did not raise ' + exc_name when the call returns normally, and 'raised OTHER instead of ' + exc_name (OTHER is the class name) for an exception of another kind."""
        try:
            func(*args)
        except Exception as err:
            if exc_name in [c.__name__ for c in type(err).__mro__]:
                return ""
            return "raised " + type(err).__name__ + " instead of " + exc_name
        return "did not raise " + exc_name


    def boundary_values(lo, hi):
        """Boundary value analysis for a function that accepts the whole numbers from lo to hi (both included). Return the sorted list, without duplicates, of the values on and next to each boundary: lo - 1, lo, lo + 1, hi - 1, hi and hi + 1. ValueError('empty range') when hi < lo."""
        if hi < lo:
            raise ValueError("empty range")
        return sorted({lo - 1, lo, lo + 1, hi - 1, hi, hi + 1})


    def pick_representatives(values, classify):
        """Equivalence classes: `classify(value)` gives the NAME of the class a value belongs to. Return a dict {class name: [smallest value of that class, largest value of that class]} for the classes that occur in `values` (the list has ONE item when the smallest and the largest are the same value). The dict keys are in sorted order."""
        groups = {}
        for v in values:
            groups.setdefault(classify(v), []).append(v)
        out = {}
        for name in sorted(groups):
            lo, hi = min(groups[name]), max(groups[name])
            out[name] = [lo] if lo == hi else [lo, hi]
        return out


    def run_table(func, table):
        """Table-driven tests. `table` is a list of rows (args, expected). `args` is a tuple that func is called with. If `expected` is a tuple ('raises', 'ValueError') the call must raise that exception (use assert_raises); otherwise the result is compared with compare. Return the list of problems, one text per bad row, in order: 'row I: ' followed by the message (the row index counts from 0). A function that raises an exception where a value was expected counts as a problem with the message 'raised NAME' (the class name). No problems give an empty list."""
        problems = []
        for i, (args, expected) in enumerate(table):
            if isinstance(expected, tuple) and len(expected) == 2 and expected[0] == "raises":
                msg = assert_raises(func, list(args), expected[1])
            else:
                try:
                    msg = compare(func(*args), expected)
                except Exception as err:
                    msg = "raised " + type(err).__name__
            if msg:
                problems.append("row " + str(i) + ": " + msg)
        return problems

    def shipping(weight):
        if weight < 1 or weight > 50:
            raise ValueError("weight out of range")
        return 5 if weight <= 10 else 9

    print(boundary_values(1, 50))
    rows = [((w,), 5 if w <= 10 else 9) for w in (1, 2, 9, 10, 11, 49, 50)]
    rows += [((w,), ("raises", "ValueError")) for w in (0, 51)]
    print(run_table(shipping, rows))
    print(pick_representatives(range(0, 60), lambda w: "invalid" if w < 1 or w > 50 else "light" if w <= 10 else "heavy"))
  output: |
    [0, 1, 2, 49, 50, 51]
    []
    {'heavy': [11, 50], 'invalid': [0, 59], 'light': [1, 10]}
  lines:
  - line: 67
    note: Values at both edges of the valid range.
  - line: 70
    note: 'An empty list: every row passed.'
  - line: 71
    note: One small and one large example from every class.
- title: Properties and shrinking
  intro: Find the smallest list that breaks a buggy sort.
  code: |
    def check_property(prop, gen, n, seed):
        """Property-based testing. Make a random generator with random.Random(seed). Do up to n rounds: call gen(rng) to get a tuple of arguments, then prop(*args), which should return True. Return the FIRST argument tuple for which prop returns anything but True or raises an exception, or None if all n rounds passed."""
        import random
        rng = random.Random(seed)
        for _ in range(n):
            args = gen(rng)
            try:
                ok = prop(*args) is True
            except Exception:
                ok = False
            if not ok:
                return args
        return None


    def shrink(items, fails):
        """Make a failing input as small as possible. `fails(items)` returns True when the list still makes the test fail. Start from `items` (which fails). Repeat: try removing ONE item at a time, from the front, and keep the first removal after which the list still fails; start again from the shorter list. Stop when no single removal still fails and return that list (a new list; the input is not changed)."""
        current = list(items)
        changed = True
        while changed:
            changed = False
            for i in range(len(current)):
                candidate = current[:i] + current[i + 1:]
                if fails(candidate):
                    current = candidate
                    changed = True
                    break
        return current


    def minimal_counterexample(prop, gen, n, seed):
        """Find a small counterexample. `gen(rng)` returns a tuple holding ONE list; `prop(items)` should be True. Use check_property to find a failing tuple (return None if there is none) and then shrink its list with `shrink`, where a list fails if prop(list) is not True or raises. Return the shrunk list."""
        found = check_property(prop, gen, n, seed)
        if found is None:
            return None

        def fails(items):
            try:
                return prop(items) is not True
            except Exception:
                return True

        return shrink(found[0], fails)

    def my_sort(xs):
        """A sort with a hidden bug: it reverses the result when the 2nd and 3rd smallest values are equal."""
        out = sorted(xs)
        if len(out) >= 4 and out[1] == out[2]:
            out = out[::-1]
        return out

    gen = lambda rng: ([rng.randint(0, 5) for _ in range(rng.randint(6, 10))],)
    print(check_property(lambda xs: my_sort(xs) == sorted(xs), gen, 100, 1))
    print(minimal_counterexample(lambda xs: my_sort(xs) == sorted(xs), gen, 100, 1))
  output: |
    ([1, 0, 3, 0, 3, 3, 4, 0, 5],)
    [0, 0, 0, 5]
  lines:
  - line: 53
    note: A random failing list with many items, hard to read.
  - line: 54
    note: Shrinking leaves the smallest list that still fails.
