- type: code
  question: Write `is_idempotent(func, value)` returning True when `func(func(value)) == func(value)`.
  starter: |
    def is_idempotent(func, value):
        pass
  tests:
  - name: idempotent
    code: |
      assert is_idempotent(abs, -3) is True and is_idempotent(str.upper, "abc") is True and is_idempotent(lambda x: x + 1, 1) is False and is_idempotent(sorted, [3, 1, 2]) is True
  solution: |
    def is_idempotent(func, value):
        once = func(value)
        return func(once) == once
