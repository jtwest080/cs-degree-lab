id: u30-isolate
title: Test Doubles and Dependency Injection
minutes: 110
objective: Learn how to test code that depends on slow or unpredictable things (the network, the clock, randomness) by **injecting** replacements. You will build mocks, call verification, a retry loop with backoff and a cache with expiry, all testable without waiting.
outcomes:
- Explain stubs, fakes and mocks
- Pass dependencies as parameters
- Verify how a mock was called
- Test time-dependent code without waiting
sections:
- heading: Why isolate code
  body: |-
    A good unit test is **fast**, **deterministic** and **independent**. Code that calls the internet, reads the real clock, uses random numbers or writes to a real database is none of those: it is slow, it changes between runs and it can fail for reasons that have nothing to do with your code.

    The fix is **isolation**: separate the code you are testing (the **unit**) from the things it depends on (its **dependencies**), and in tests replace those with **test doubles**:

    - A **stub** returns fixed answers (`get` always returns the same user).
    - A **fake** is a simple working version (an in-memory dictionary instead of a database).
    - A **mock** records how it was called so you can check it afterwards (`send_email` was called once with this address).
    - A **spy** is a real object wrapped so that its calls are recorded.
- heading: Dependency injection
  body: |-
    The easiest way to swap a dependency is to **pass it in**. This is called **dependency injection**. Compare:

    ```python
    import time
    def is_expired(created):                      # hard to test: reads the real clock
        return time.time() - created > 3600

    def is_expired(created, now):                 # easy to test: time is a parameter
        return now - created > 3600
    ```

    The second version can be tested for "just before" and "just after" the limit in microseconds. In the same way a function can take the `get` function, the `sleep` function, the random generator or the file system as an argument, with a real one as the default in production.

    Retries show why: `retry(func, attempts, sleep)` waits 1, 2, 4... seconds between attempts. With a fake `sleep` that only records the delays, you can test a five-minute retry schedule instantly.

    > **Warning:** Over-mocking is a trap. If a test mocks everything, it only checks that your code calls the mocks the way you wrote it, and it breaks whenever you change the inside. Prefer **fakes** and check **results** over checking calls, and keep a few **integration tests** that use the real thing.
examples:
- title: A mock for the network
  intro: A function that retries once, tested without a network.
  code: |
    def make_recorder(results=None):
        """Make a MOCK: a stand-in function that remembers how it was used. Return (mock, calls). `calls` is a list that gets one entry (args, kwargs) for every call to the mock (args is a tuple, kwargs a dict). `results` is a list of what the calls should return, in order: call number 1 returns results[0], and so on; once the list is used up (or if it is None) the mock returns None. If the entry is an exception INSTANCE, the mock raises it instead of returning it."""
        calls = []
        queue = list(results) if results is not None else []

        def mock(*args, **kwargs):
            calls.append((args, kwargs))
            if not queue:
                return None
            value = queue.pop(0)
            if isinstance(value, Exception):
                raise value
            return value

        return mock, calls


    def verify_calls(calls, expected):
        """Check a mock's calls. `calls` is the list of (args, kwargs) from make_recorder and `expected` a list of args tuples (no keyword arguments expected). Return '' if the number of calls is the same and every call's args match, in order, and its kwargs are empty. Otherwise return the FIRST problem: 'expected N calls but got M' (check the count first), or 'call I: expected EXPECTED but got ACTUAL' (with repr of the tuples; I from 0). A call with keyword arguments is shown as the args tuple followed by the text ' with ' and repr of the kwargs, for example "(1,) with {'x': 2}", and counts as different."""
        if len(calls) != len(expected):
            return "expected " + str(len(expected)) + " calls but got " + str(len(calls))
        for i, ((args, kwargs), want) in enumerate(zip(calls, expected)):
            if args != tuple(want) or kwargs:
                shown = repr(args) + (" with " + repr(kwargs) if kwargs else "")
                return "call " + str(i) + ": expected " + repr(tuple(want)) + " but got " + shown
        return ""


    def fetch_user_name(get, user_id):
        """Code that is easy to test because it receives its helper as a parameter (DEPENDENCY INJECTION). `get(url)` returns a dict {"status": number, "body": dict} or raises ConnectionError. Call get('/users/' + str(user_id)). Return the 'name' from the body when the status is 200; 'unknown' when the status is 404. For any other status raise ValueError('bad status NUMBER'). If get raises ConnectionError, try ONE more time; if the second call also fails, let the error out."""
        for attempt in range(2):
            try:
                response = get("/users/" + str(user_id))
                break
            except ConnectionError:
                if attempt == 1:
                    raise
        if response["status"] == 200:
            return response["body"]["name"]
        if response["status"] == 404:
            return "unknown"
        raise ValueError("bad status " + str(response["status"]))

    get, calls = make_recorder([ConnectionError("network down"), {"status": 200, "body": {"name": "Ada"}}])
    print(fetch_user_name(get, 7))
    print(len(calls), "calls:", [c[0] for c in calls])
    print(repr(verify_calls(calls, [("/users/7",), ("/users/7",)])))
    print(verify_calls(calls, [("/users/7",)]))
    get, calls = make_recorder([{"status": 404, "body": {}}])
    print(fetch_user_name(get, 99), verify_calls(calls, [("/users/98",)]))
  output: |
    Ada
    2 calls: [('/users/7',), ('/users/7',)]
    ''
    expected 1 calls but got 2
    unknown call 0: expected ('/users/98',) but got ('/users/99',)
  lines:
  - line: 45
    note: The first call fails, the retry succeeds.
  - line: 46
    note: Both attempts were recorded.
  - line: 47
    note: An empty string means the calls are as expected.
- title: Retry and cache with fake time
  intro: A fake clock and a fake sleep make time-based code instant to test.
  code: |
    def make_recorder(results=None):
        """Make a MOCK: a stand-in function that remembers how it was used. Return (mock, calls). `calls` is a list that gets one entry (args, kwargs) for every call to the mock (args is a tuple, kwargs a dict). `results` is a list of what the calls should return, in order: call number 1 returns results[0], and so on; once the list is used up (or if it is None) the mock returns None. If the entry is an exception INSTANCE, the mock raises it instead of returning it."""
        calls = []
        queue = list(results) if results is not None else []

        def mock(*args, **kwargs):
            calls.append((args, kwargs))
            if not queue:
                return None
            value = queue.pop(0)
            if isinstance(value, Exception):
                raise value
            return value

        return mock, calls


    def retry(func, attempts, sleep):
        """Call func() until it works. Make at most `attempts` calls (attempts >= 1). If a call raises an exception, wait with sleep(seconds) and try again: the waits are 1, 2, 4, 8 ... seconds (doubling: EXPONENTIAL BACKOFF), never after the last attempt. Return the first successful result. If every attempt fails, raise the LAST exception. The sleep function is a parameter so that tests do not really wait. ValueError('attempts must be at least 1') for fewer than one attempt."""
        if attempts < 1:
            raise ValueError("attempts must be at least 1")
        delay = 1
        for i in range(attempts):
            try:
                return func()
            except Exception:
                if i == attempts - 1:
                    raise
                sleep(delay)
                delay *= 2


    def ttl_cache(func, ttl, clock):
        """Wrap `func` in a cache whose entries expire. Return a function `cached(*args)` (positional, hashable arguments only). `clock()` returns the current time in seconds (a parameter so tests can control time). The first call with some arguments calls func and remembers the result with the time. A later call with the same arguments returns the remembered result if the entry is YOUNGER than ttl seconds (clock() - stored time < ttl), otherwise it calls func again and replaces the entry. `cached.stats` is a dict {"hits": number of answers from the cache, "misses": number of calls of func}; `cached.clear()` forgets all entries (the stats stay)."""
        store = {}

        def cached(*args):
            now = clock()
            if args in store and now - store[args][1] < ttl:
                cached.stats["hits"] += 1
                return store[args][0]
            cached.stats["misses"] += 1
            value = func(*args)
            store[args] = (value, now)
            return value

        cached.stats = {"hits": 0, "misses": 0}
        cached.clear = store.clear
        return cached

    sleeps, slept = make_recorder()
    flaky, _ = make_recorder([OSError("a"), OSError("b"), OSError("c"), "finally"])
    print(retry(flaky, 5, sleeps), [c[0][0] for c in slept])

    time = [0]
    slow, calls = make_recorder(["result 1", "result 2"])
    cached = ttl_cache(slow, 30, lambda: time[0])
    for t in (0, 10, 29, 30, 40):
        time[0] = t
        print(t, cached("q"))
    print(cached.stats)
  output: |
    finally [1, 2, 4]
    0 result 1
    10 result 1
    29 result 1
    30 result 2
    40 result 2
    {'hits': 3, 'misses': 2}
  lines:
  - line: 53
    note: Three failures, with waits of 1, 2 and 4 seconds that never actually happened.
  - line: 58
    note: The cache answer expires exactly at 30 seconds.
