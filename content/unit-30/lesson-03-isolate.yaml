        return mock, calls
  explanation: Python's unittest.mock.Mock does this and much more; building the idea yourself shows there is no magic.
- id: verify
  title: Checking the calls
  difficulty: 4
  prompt: 'Having a mock is only useful if you check what happened to it. `make_recorder` is given. Write `verify_calls(calls, expected)`: `calls` is the list of `(args, kwargs)` and `expected` a list of args tuples (no keyword arguments expected). Return `""` if the number of calls is the same and every call''s args match, in order, and its kwargs are empty. Otherwise return the **first** problem: `"expected N calls but got M"` (check the **count** first), or `"call I: expected EXPECTED but got ACTUAL"` (using `repr` of the tuples, `I` from 0). A call with keyword arguments is shown as the args tuple followed by `" with "` and `repr` of the kwargs, for example `"(1,) with {''x'': 2}"`, and counts as different.'
