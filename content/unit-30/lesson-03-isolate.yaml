  code: |
    from unittest.mock import Mock
    m = Mock(return_value=5)
    print(m(1, 2), m.call_args)
exercises:
- id: recorder
  title: A mock function
  difficulty: 4
  prompt: 'Real code often talks to things you do not want in a test: the internet, the clock, a database, an email server. In a test you replace them with **test doubles**. A **mock** is a stand-in that remembers how it was used. Write `make_recorder(results=None)`: return `(mock, calls)`. `calls` is a list that gets one entry `(args, kwargs)` for every call to the mock (`args` a tuple, `kwargs` a dict). `results` is a list of what the calls should return, in order: call 1 returns `results[0]`, and so on; once the list is used up (or if it is `None`) the mock returns `None`. If the entry is an exception **instance**, the mock **raises** it instead of returning it.'
  starter: |-
    def make_recorder(results=None):
        """Make a MOCK: a stand-in function that remembers how it was used. Return (mock, calls). `calls` is a list that gets one entry (args, kwargs) for every call to the mock (args is a tuple, kwargs a dict). `results` is a list of what the calls should return, in order: call number 1 returns results[0], and so on; once the list is used up (or if it is None) the mock returns None. If the entry is an exception INSTANCE, the mock raises it instead of returning it."""
        pass
  tests:
  - name: recording
    code: |
      mock, calls = make_recorder()
      assert mock(1, 2) is None and mock("a", key=5) is None and mock() is None
      assert calls == [((1, 2), {}), (("a",), {"key": 5}), ((), {})] and make_recorder()[1] == []
      m1, c1 = make_recorder([10, 20])
      assert (m1("x"), m1("y"), m1("z"), m1("w")) == (10, 20, None, None) and len(c1) == 4 and c1[2] == (("z",), {})
      m2, c2 = make_recorder([0, "", None, []])
      assert (m2(), m2(), m2(), m2()) == (0, "", None, [])
  - name: raising
    code: |
      mock, calls = make_recorder([ConnectionError("down"), "ok", ValueError("bad")])
      try:
          mock("first")
          raise AssertionError("did not raise")
      except ConnectionError as e:
          assert str(e) == "down"
      assert mock("second") == "ok"
      try:
          mock("third")
          raise AssertionError("did not raise")
      except ValueError:
          pass
      assert [c[0] for c in calls] == [("first",), ("second",), ("third",)] and mock() is None
      a, ca = make_recorder([1])
      b, cb = make_recorder([2])
      assert a() == 1 and b() == 2 and len(ca) == 1 and len(cb) == 1
  hints:
  - Use a closure over a list for the calls and a list for the remaining results.
  - Check isinstance(value, Exception) before returning.
  solution: |
