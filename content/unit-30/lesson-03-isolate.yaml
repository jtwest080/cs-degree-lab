    def verify_calls(calls, expected):
        """Check a mock's calls. `calls` is the list of (args, kwargs) from make_recorder and `expected` a list of args tuples (no keyword arguments expected). Return '' if the number of calls is the same and every call's args match, in order, and its kwargs are empty. Otherwise return the FIRST problem: 'expected N calls but got M' (check the count first), or 'call I: expected EXPECTED but got ACTUAL' (with repr of the tuples; I from 0). A call with keyword arguments is shown as the args tuple followed by the text ' with ' and repr of the kwargs, for example "(1,) with {'x': 2}", and counts as different."""
        pass
  tests:
  - name: matching
    code: |
      mock, calls = make_recorder()
      mock(1)
      mock("a", "b")
      mock()
      assert verify_calls(calls, [(1,), ("a", "b"), ()]) == "" and verify_calls([], []) == "" and verify_calls(calls, [[1], ["a", "b"], []]) == ""
  - name: problems
    code: |
      mock, calls = make_recorder()
      mock(1)
      mock(2, key="v")
      assert verify_calls(calls, [(1,)]) == "expected 1 calls but got 2" and verify_calls(calls, [(1,), (2,), (3,)]) == "expected 3 calls but got 2"
      assert verify_calls(calls, [(1,), (2,)]) == "call 1: expected (2,) but got (2,) with {'key': 'v'}" and verify_calls(calls, [(9,), (2,)]) == "call 0: expected (9,) but got (1,)"
      assert verify_calls([((), {})], [()]) == "" and verify_calls(calls[:1], [("1",)]) == "call 0: expected ('1',) but got (1,)" and verify_calls([], [(1,)]) == "expected 1 calls but got 0"
  hints:
  - Compare the number of calls first.
  - A call with keyword arguments never matches an expected args tuple.
  solution: |
    def make_recorder(results=None):
        """Make a MOCK: a stand-in function that remembers how it was used. Return (mock, calls). `calls` is a list that gets one entry (args, kwargs) for every call to the mock (args is a tuple, kwargs a dict). `results` is a list of what the calls should return, in order: call number 1 returns results[0], and so on; once the list is used up (or if it is None) the mock returns None. If the entry is an exception INSTANCE, the mock raises it instead of returning it."""
        calls = []
        queue = list(results) if results is not None else []

        def mock(*args, **kwargs):
            calls.append((args, kwargs))
            if not queue:
                return None
            value = queue.pop(0)
            if isinstance(value, Exception):
                raise value
            return value

        return mock, calls




    def verify_calls(calls, expected):
        """Check a mock's calls. `calls` is the list of (args, kwargs) from make_recorder and `expected` a list of args tuples (no keyword arguments expected). Return '' if the number of calls is the same and every call's args match, in order, and its kwargs are empty. Otherwise return the FIRST problem: 'expected N calls but got M' (check the count first), or 'call I: expected EXPECTED but got ACTUAL' (with repr of the tuples; I from 0). A call with keyword arguments is shown as the args tuple followed by the text ' with ' and repr of the kwargs, for example "(1,) with {'x': 2}", and counts as different."""
        if len(calls) != len(expected):
            return "expected " + str(len(expected)) + " calls but got " + str(len(calls))
        for i, ((args, kwargs), want) in enumerate(zip(calls, expected)):
            if args != tuple(want) or kwargs:
                shown = repr(args) + (" with " + repr(kwargs) if kwargs else "")
                return "call " + str(i) + ": expected " + repr(tuple(want)) + " but got " + shown
        return ""
  explanation: 'Be careful not to over-specify: a test that checks every internal call breaks whenever you improve the code without changing what it does.'
- id: inject
  title: Injecting a dependency
  difficulty: 5
  prompt: 'Code is easy to test when it **receives** what it depends on instead of creating it. Write `fetch_user_name(get, user_id)`, where `get(url)` returns a dict `{"status": number, "body": dict}` or raises `ConnectionError`. Call `get("/users/" + str(user_id))`. Return the `"name"` from the body when the status is 200; `"unknown"` when the status is 404. For any other status raise `ValueError("bad status NUMBER")`. If `get` raises `ConnectionError`, try **one** more time; if the second call also fails, let the error out. (`make_recorder` is given for your own tests.)'
  starter: |-
    def make_recorder(results=None):
        """Make a MOCK: a stand-in function that remembers how it was used. Return (mock, calls). `calls` is a list that gets one entry (args, kwargs) for every call to the mock (args is a tuple, kwargs a dict). `results` is a list of what the calls should return, in order: call number 1 returns results[0], and so on; once the list is used up (or if it is None) the mock returns None. If the entry is an exception INSTANCE, the mock raises it instead of returning it."""
        calls = []
        queue = list(results) if results is not None else []

        def mock(*args, **kwargs):
            calls.append((args, kwargs))
            if not queue:
                return None
            value = queue.pop(0)
            if isinstance(value, Exception):
                raise value
            return value

        return mock, calls




    def fetch_user_name(get, user_id):
        """Code that is easy to test because it receives its helper as a parameter (DEPENDENCY INJECTION). `get(url)` returns a dict {"status": number, "body": dict} or raises ConnectionError. Call get('/users/' + str(user_id)). Return the 'name' from the body when the status is 200; 'unknown' when the status is 404. For any other status raise ValueError('bad status NUMBER'). If get raises ConnectionError, try ONE more time; if the second call also fails, let the error out."""
        pass
  tests:
  - name: normal answers
    code: |
      def make_recorder(results=None):
          """Make a MOCK: a stand-in function that remembers how it was used. Return (mock, calls). `calls` is a list that gets one entry (args, kwargs) for every call to the mock (args is a tuple, kwargs a dict). `results` is a list of what the calls should return, in order: call number 1 returns results[0], and so on; once the list is used up (or if it is None) the mock returns None. If the entry is an exception INSTANCE, the mock raises it instead of returning it."""
          calls = []
          queue = list(results) if results is not None else []

          def mock(*args, **kwargs):
              calls.append((args, kwargs))
              if not queue:
                  return None
              value = queue.pop(0)
              if isinstance(value, Exception):
                  raise value
              return value

          return mock, calls

      get, calls = make_recorder([{"status": 200, "body": {"name": "Ada"}}])
      assert fetch_user_name(get, 7) == "Ada" and calls == [(("/users/7",), {})]
      get, calls = make_recorder([{"status": 404, "body": {}}])
      assert fetch_user_name(get, "x") == "unknown" and len(calls) == 1
      for status in (500, 301, 403):
          get, _ = make_recorder([{"status": status, "body": {}}])
          try:
              fetch_user_name(get, 1)
              raise AssertionError("accepted")
          except ValueError as e:
              assert str(e) == "bad status " + str(status)
  - name: retrying
    code: |
      def make_recorder(results=None):
          """Make a MOCK: a stand-in function that remembers how it was used. Return (mock, calls). `calls` is a list that gets one entry (args, kwargs) for every call to the mock (args is a tuple, kwargs a dict). `results` is a list of what the calls should return, in order: call number 1 returns results[0], and so on; once the list is used up (or if it is None) the mock returns None. If the entry is an exception INSTANCE, the mock raises it instead of returning it."""
          calls = []
          queue = list(results) if results is not None else []

          def mock(*args, **kwargs):
              calls.append((args, kwargs))
              if not queue:
                  return None
              value = queue.pop(0)
              if isinstance(value, Exception):
                  raise value
              return value

          return mock, calls

      good = {"status": 200, "body": {"name": "Bo"}}
      get, calls = make_recorder([ConnectionError("blip"), good])
      assert fetch_user_name(get, 2) == "Bo" and [c[0] for c in calls] == [("/users/2",), ("/users/2",)]
      get, calls = make_recorder([ConnectionError("a"), ConnectionError("b"), good])
      try:
          fetch_user_name(get, 3)
          raise AssertionError("did not raise")
      except ConnectionError as e:
          assert str(e) == "b" and len(calls) == 2
      get, calls = make_recorder([ConnectionError("a"), {"status": 404, "body": {}}])
      assert fetch_user_name(get, 4) == "unknown"
      get, calls = make_recorder([ValueError("not retried")])
      try:
          fetch_user_name(get, 5)
          raise AssertionError("did not raise")
      except ValueError as e:
          assert str(e) == "not retried" and len(calls) == 1
  hints:
  - Use a loop of two attempts; on the second failure re-raise.
  - Only ConnectionError is retried.
