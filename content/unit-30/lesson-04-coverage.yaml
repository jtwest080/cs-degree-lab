        return out




    def mutation_score(source, tests):
        """How good are the tests? `tests(ns)` receives the dict of names defined by a version of the source and must RAISE (AssertionError or anything else) when it finds a problem. First check that the tests pass on the ORIGINAL source (run it with exec in a new dict; if tests raise, raise ValueError('tests fail on the original')). Then run the tests on every mutant from make_mutants (each in a new dict). A mutant is KILLED when the tests raise an exception (or the mutant's source cannot be executed) and SURVIVES when they pass. Return (killed, total, survivors) where survivors is the list of the descriptions of the surviving mutants, in order."""
