commonMistakes:
- title: Chasing 100 % coverage
  explanation: It encourages tests without assertions.
- title: Reading coverage as correctness
  explanation: Coverage only shows what ran.
- title: Ignoring surviving mutants
  explanation: They show real gaps.
- title: Running mutation tests on every commit
  explanation: They are slow.
- title: Testing only lines, not branches
  explanation: An if with only the true side tested has hidden gaps.
summary:
- Coverage shows which lines the tests ran.
- Missing lines point at untested cases.
- Coverage cannot show that tests are good.
- Mutation testing breaks code on purpose to see if tests notice.
- Boundary tests kill mutants.
