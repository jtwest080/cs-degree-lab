              return "A"
          elif score >= 50:
              return "B"
          return "F"
      """
      assert coverage(src, []) == {"percent": 0.0, "missing": [2, 3, 4, 5, 6, 7, 8]}
      assert coverage(src, ["grade(95)"]) == {"percent": 42.9, "missing": [3, 6, 7, 8]} and coverage(src, ["grade(95)", "grade(60)"]) == {"percent": 71.4, "missing": [3, 8]}
      assert coverage(src, ["grade(95)", "grade(60)", "grade(10)", "grade(-1)"]) == {"percent": 100.0, "missing": []} and coverage(src, ["grade(500)"]) == {"percent": 28.6, "missing": [4, 5, 6, 7, 8]}
  - name: edges
    code: |
      assert coverage("x = 1\n", []) == {"percent": 100.0, "missing": []} and coverage("", ["1"]) == {"percent": 100.0, "missing": []}
      src = """def f(x):
          return x
