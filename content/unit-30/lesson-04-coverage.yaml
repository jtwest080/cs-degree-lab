id: u30-coverage
title: Coverage and Mutation Testing
minutes: 110
objective: Measure how good a test suite is. You will build a **line coverage** tool with `sys.settrace` and an `ast`-based **mutation tester**, and learn why 100 % coverage is not the same as good tests.
outcomes:
- Explain line and branch coverage
- Measure coverage by tracing
- Explain mutation testing
- Use surviving mutants to improve tests
sections:
- heading: 'Coverage: did the tests run it?'
  body: |-
    **Code coverage** is the share of your code that runs while the tests run. **Line coverage** counts lines; **branch coverage** counts each outcome of every `if` (the true and the false path). A tool called `coverage.py` (and `pytest-cov`) measures it for Python: it asks the interpreter to report every line as it runs (`sys.settrace`), then compares that with the list of lines that could run.

    The useful output is the list of **missing lines**: code your tests never touched. Look at them: usually they are error handling or rare cases, exactly where bugs hide. A typical project aims at 80-90 % and reads the missing lines rather than chasing 100 %.

    > **Warning:** Coverage tells you what is **not** tested; it can never tell you that the tested code is **right**. A test with no assertions at all gives full coverage and checks nothing.
- heading: 'Mutation testing: would the tests notice a bug?'
  body: |-
    To check whether your tests are actually good, break the code on purpose. A **mutation testing** tool makes many small changes (**mutants**): turn `>=` into `>`, `+` into `-`, `True` into `False`, `18` into `19`. For each mutant it runs the tests. If a test fails the mutant is **killed**: good, the tests noticed. If everything still passes the mutant **survives**: your tests would not notice that bug.

    The **mutation score** is killed divided by all mutants. A surviving mutant tells you exactly what to add. In the `is_adult` example, if only age 30 is tested, `>=` to `>` survives: you never tested age 18, the boundary from lesson 2. The two ideas fit together: **boundary tests kill mutants**.

    Mutation testing is slow (the tests run once per mutant), so it is used on important code and in the background, not on every change.
examples:
- title: Measuring coverage
  intro: Watch which lines of a function run.
  code: |
    def statement_lines(source):
        """Which lines of this Python source can be executed inside a function? Parse the source with the ast module. Collect the line number (node.lineno, 1-based) of every STATEMENT (ast.stmt) that is inside the body of a function definition (at any depth, also inside loops, ifs, try blocks and nested functions), but NOT the def statements themselves and NOT docstrings (an expression statement that is just a string constant). Return the sorted list of different line numbers. Statements outside any function are not counted."""
        import ast
        tree = ast.parse(source)
        lines = set()

        def is_doc(node):
            return isinstance(node, ast.Expr) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str)

        for fn in ast.walk(tree):
            if isinstance(fn, (ast.FunctionDef, ast.AsyncFunctionDef)):
                for node in ast.walk(fn):
                    if isinstance(node, ast.stmt) and node is not fn and not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and not is_doc(node):
                        lines.add(node.lineno)
        return sorted(lines)


    def trace_lines(source, call):
        """Which lines of the source run when we execute `call`? Compile the source with the file name '<cov>' and run it with exec in a new dict (this part is NOT traced). Then evaluate the text `call` (for example 'grade(95)') in that dict while recording with sys.settrace every 'line' event whose frame belongs to the file '<cov>' and whose function is not the module itself ('<module>'). Always remove the trace again (sys.settrace(None)), also when the call raises an exception (the exception is swallowed: a crashing call still counts for the lines it reached). Return the sorted list of the different line numbers."""
        import sys
        seen = set()
        ns = {}
        exec(compile(source, "<cov>", "exec"), ns)

        def tracer(frame, event, arg):
            if frame.f_code.co_filename != "<cov>" or frame.f_code.co_name == "<module>":
                return None
            if event == "line":
                seen.add(frame.f_lineno)
            return tracer

        sys.settrace(tracer)
        try:
            eval(call, ns)
        except Exception:
            pass
        finally:
            sys.settrace(None)
        return sorted(seen)


    def coverage(source, calls):
        """Line coverage. `calls` is a list of call texts like 'grade(95)'. Take the statement lines of the source (statement_lines) and the lines that run in ANY of the calls (trace_lines, one call at a time). Return {"percent": 100 * covered / total rounded to 1 decimal, "missing": sorted list of the statement lines that never ran}. A source with no statement lines has percent 100.0 and nothing missing. Lines that ran but are not statement lines are ignored."""
        stmts = set(statement_lines(source))
        ran = set()
        for call in calls:
            ran |= set(trace_lines(source, call))
        covered = stmts & ran
        percent = round(100 * len(covered) / len(stmts), 1) if stmts else 100.0
        return {"percent": percent, "missing": sorted(stmts - ran)}

    GRADE_SRC = """def grade(score):
        if score < 0 or score > 100:
            raise ValueError("bad score")
        if score >= 90:
            return "A"
        elif score >= 50:
            return "B"
        return "F"
    """

    print(statement_lines(GRADE_SRC))
    print(coverage(GRADE_SRC, ["grade(95)"]))
    print(coverage(GRADE_SRC, ["grade(95)", "grade(60)", "grade(10)"]))
    print(coverage(GRADE_SRC, ["grade(95)", "grade(60)", "grade(10)", "grade(-1)"]))
  output: |
    [2, 3, 4, 5, 6, 7, 8]
    {'percent': 42.9, 'missing': [3, 6, 7, 8]}
    {'percent': 85.7, 'missing': [3]}
    {'percent': 100.0, 'missing': []}
  lines:
  - line: 62
    note: Seven lines of the function can run.
  - line: 63
    note: One call reaches only three of the seven lines.
  - line: 64
    note: Everything except the error case ran.
  - line: 65
    note: Every line ran.
- title: Mutation score of two test suites
  intro: A weak and a strong test suite for the same function.
  code: |
    def make_mutants(source):
        """Mutation testing creates slightly WRONG copies of the code (mutants) to find out if the tests notice. Parse the source with ast and build one mutant for EVERY place that can be changed, in the order in which ast.walk visits the nodes. The possible changes: a + becomes -, - becomes +, * becomes //, a < becomes <=, <= becomes <, > becomes >=, >= becomes >, == becomes !=, != becomes ==, and becomes or, or becomes and, True becomes False, False becomes True, an integer constant n (not bool) becomes n + 1. Only the ONE chosen place is changed in each mutant. Return a list of pairs (description, new source text made with ast.unparse) where the description is 'line L: OLD -> NEW' using the symbols (+, -, *, //, <, <=, >, >=, ==, !=, and, or, True, False) or the numbers, for example 'line 3: < -> <='. A comparison with several operators changes each operator separately. Do not change anything for the other node types."""
        import ast
        swaps = {ast.Add: (ast.Sub, "+", "-"), ast.Sub: (ast.Add, "-", "+"), ast.Mult: (ast.FloorDiv, "*", "//"), ast.Lt: (ast.LtE, "<", "<="), ast.LtE: (ast.Lt, "<=", "<"), ast.Gt: (ast.GtE, ">", ">="), ast.GtE: (ast.Gt, ">=", ">"), ast.Eq: (ast.NotEq, "==", "!="), ast.NotEq: (ast.Eq, "!=", "=="), ast.And: (ast.Or, "and", "or"), ast.Or: (ast.And, "or", "and")}
        count = sum(1 for _ in ast.walk(ast.parse(source)))
        out = []
        for index in range(count):
            tree = ast.parse(source)
            node = list(ast.walk(tree))[index]
            desc = None
            if isinstance(node, (ast.BinOp, ast.BoolOp)):
                op = node.op
                if type(op) in swaps:
                    new, old_s, new_s = swaps[type(op)]
                    node.op = new()
                    desc = "line " + str(node.lineno) + ": " + old_s + " -> " + new_s
                subs = []
            elif isinstance(node, ast.Compare):
                for k, op in enumerate(node.ops):
                    if type(op) in swaps:
                        t2 = ast.parse(source)
                        n2 = list(ast.walk(t2))[index]
                        new, old_s, new_s = swaps[type(op)]
                        n2.ops[k] = new()
                        out.append(("line " + str(node.lineno) + ": " + old_s + " -> " + new_s, ast.unparse(t2)))
                continue
            elif isinstance(node, ast.Constant):
                if node.value is True or node.value is False:
                    desc = "line " + str(node.lineno) + ": " + str(node.value) + " -> " + str(not node.value)
                    node.value = not node.value
                elif isinstance(node.value, int):
                    desc = "line " + str(node.lineno) + ": " + str(node.value) + " -> " + str(node.value + 1)
                    node.value = node.value + 1
            if desc:
                out.append((desc, ast.unparse(tree)))
        return out


    def mutation_score(source, tests):
        """How good are the tests? `tests(ns)` receives the dict of names defined by a version of the source and must RAISE (AssertionError or anything else) when it finds a problem. First check that the tests pass on the ORIGINAL source (run it with exec in a new dict; if tests raise, raise ValueError('tests fail on the original')). Then run the tests on every mutant from make_mutants (each in a new dict). A mutant is KILLED when the tests raise an exception (or the mutant's source cannot be executed) and SURVIVES when they pass. Return (killed, total, survivors) where survivors is the list of the descriptions of the surviving mutants, in order."""
        ns = {}
        exec(source, ns)
        try:
            tests(ns)
        except Exception:
            raise ValueError("tests fail on the original")
        mutants = make_mutants(source)
        killed, survivors = 0, []
        for desc, text in mutants:
            env = {}
            try:
                exec(text, env)
                tests(env)
            except Exception:
                killed += 1
            else:
                survivors.append(desc)
        return killed, len(mutants), survivors

    GRADE_SRC = """def grade(score):
        if score < 0 or score > 100:
            raise ValueError("bad score")
        if score >= 90:
            return "A"
        elif score >= 50:
            return "B"
        return "F"
    """

    mutants = make_mutants(GRADE_SRC)
    print(len(mutants), "mutants, for example:", mutants[0][0])

    def weak(ns):
        assert ns["grade"](95) == "A"
        assert ns["grade"](10) == "F"

    def strong(ns):
        g = ns["grade"]
        assert (g(95), g(90), g(89), g(50), g(49), g(0), g(100)) == ("A", "A", "B", "B", "F", "F", "A")
        for bad in (-1, 101):
            try:
                g(bad)
                raise AssertionError("accepted")
            except ValueError:
                pass

    for name, tests in (("weak", weak), ("strong", strong)):
        killed, total, survivors = mutation_score(GRADE_SRC, tests)
        print(name, "tests killed", killed, "of", total)
        print(" survivors:", len(survivors))
  output: |
    9 mutants, for example: line 2: or -> and
    weak tests killed 0 of 9
     survivors: 9
    strong tests killed 9 of 9
     survivors: 0
  lines:
  - line: 70
    note: Each place that can be changed gives one mutant.
  - line: 87
    note: The weak tests run most lines but kill none of the mutants.
playground:
  prompt: Trace the lines of a call yourself.
  code: |
    import sys
    lines = []
    def f(x):
        y = x + 1
        return y
    def tr(frame, event, arg):
        if event == 'line' and frame.f_code.co_name == 'f':
            lines.append(frame.f_lineno)
        return tr
    sys.settrace(tr)
    f(1)
    sys.settrace(None)
    print(len(lines))
exercises:
- id: stmts
  title: Which lines count?
  difficulty: 4
  prompt: '**Code coverage** measures how much of your code the tests actually run. First you need the list of lines that *can* run. Write `statement_lines(source)`. Parse the source with the `ast` module and collect the line number (`node.lineno`, 1-based) of every **statement** (`ast.stmt`) that is inside the body of a function definition (at any depth: also inside loops, `if`s, `try` blocks and nested functions), but **not** the `def` statements themselves and **not** docstrings (an expression statement that is just a string constant). Return the sorted list of different line numbers. Statements outside any function are not counted.'
  starter: |-
    def statement_lines(source):
        """Which lines of this Python source can be executed inside a function? Parse the source with the ast module. Collect the line number (node.lineno, 1-based) of every STATEMENT (ast.stmt) that is inside the body of a function definition (at any depth, also inside loops, ifs, try blocks and nested functions), but NOT the def statements themselves and NOT docstrings (an expression statement that is just a string constant). Return the sorted list of different line numbers. Statements outside any function are not counted."""
        pass
  tests:
  - name: simple functions
    code: |
      src = """def add(a, b):
          \"\"\"Add.\"\"\"
          total = a + b
          return total
      """
      assert statement_lines(src) == [3, 4] and statement_lines("x = 1\n") == [] and statement_lines("") == []
      src2 = """import os

      LIMIT = 5

      def grade(score):
          if score < 0:
              raise ValueError("bad")
          elif score > 5:
              return "A"
          for i in range(3):
              print(i)
          return "B"
      """
      assert statement_lines(src2) == [6, 7, 8, 9, 10, 11, 12]
  - name: nesting
    code: |
      src = """def outer(items):
          def inner(x):
              return x * 2
          result = []
          for item in items:
              try:
                  result.append(inner(item))
              except TypeError:
                  pass
              finally:
                  print("done")
          while False:
              break
          return result

      class Box:
          def size(self):
              return 1
      """
      assert statement_lines(src) == [3, 4, 5, 6, 7, 9, 11, 12, 13, 14, 18]
  hints:
  - Walk the tree, find the function definitions, and look inside each one.
  - A docstring is an Expr node whose value is a string constant.
