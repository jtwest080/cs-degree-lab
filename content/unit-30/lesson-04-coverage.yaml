- type: code
  question: Write `mutation_score_percent(killed, total)` returning the percentage `100 * killed / total` rounded to one decimal; return `100.0` when `total` is 0.
  starter: |
    def mutation_score_percent(killed, total):
        pass
  tests:
  - name: score
    code: |
      assert mutation_score_percent(3, 4) == 75.0 and mutation_score_percent(0, 5) == 0.0 and mutation_score_percent(0, 0) == 100.0 and mutation_score_percent(2, 3) == 66.7
  solution: |
    def mutation_score_percent(killed, total):
        if total == 0:
            return 100.0
        return round(100 * killed / total, 1)
