- id: trace
  title: Watching lines run
  difficulty: 5
  prompt: 'Python lets you watch a program run with `sys.settrace`. Write `trace_lines(source, call)`: compile the source with the file name `"<cov>"` and run it with `exec` in a new dict (this part is **not** traced). Then evaluate the text `call` (for example `"grade(95)"`) in that dict while recording, with a trace function, every `"line"` event whose frame belongs to the file `"<cov>"` and whose function is not the module itself (`"<module>"`). Always switch the tracing off again (`sys.settrace(None)`), also when the call raises an exception (the exception is swallowed: a crashing call still counts for the lines it reached). Return the sorted list of the different line numbers.'
  starter: |-
    def trace_lines(source, call):
        """Which lines of the source run when we execute `call`? Compile the source with the file name '<cov>' and run it with exec in a new dict (this part is NOT traced). Then evaluate the text `call` (for example 'grade(95)') in that dict while recording with sys.settrace every 'line' event whose frame belongs to the file '<cov>' and whose function is not the module itself ('<module>'). Always remove the trace again (sys.settrace(None)), also when the call raises an exception (the exception is swallowed: a crashing call still counts for the lines it reached). Return the sorted list of the different line numbers."""
        pass
  tests:
  - name: which lines run
    code: |
      src = """def sign(n):
          if n < 0:
              return "neg"
          if n == 0:
              return "zero"
          return "pos"
      """
      assert trace_lines(src, "sign(-5)") == [2, 3] and trace_lines(src, "sign(0)") == [2, 4, 5] and trace_lines(src, "sign(7)") == [2, 4, 6] and trace_lines(src, "1 + 1") == []
      src2 = """def total(items):
          t = 0
          for x in items:
              t += x
          return t

      def twice(items):
          return total(items) * 2
      """
      assert trace_lines(src2, "total([1, 2])") == [2, 3, 4, 5] and trace_lines(src2, "total([])") == [2, 3, 5] and trace_lines(src2, "twice([1])") == [2, 3, 4, 5, 8]
  - name: errors and cleanup
    code: |
      import sys
      src = """def risky(x):
          y = 10
          z = y / x
          return z
      """
      assert trace_lines(src, "risky(0)") == [2, 3] and trace_lines(src, "risky(2)") == [2, 3, 4] and trace_lines(src, "undefined_name(1)") == []
      assert sys.gettrace() is None
      src3 = """def f():
          return 1
      print("module line")
      """
      assert trace_lines(src3, "f()") == [2]
  hints:
  - Define a trace function that checks frame.f_code.co_filename and returns itself so lines inside the function are traced too.
  - Use try/finally so that tracing is always switched off.
  solution: |
    def trace_lines(source, call):
        """Which lines of the source run when we execute `call`? Compile the source with the file name '<cov>' and run it with exec in a new dict (this part is NOT traced). Then evaluate the text `call` (for example 'grade(95)') in that dict while recording with sys.settrace every 'line' event whose frame belongs to the file '<cov>' and whose function is not the module itself ('<module>'). Always remove the trace again (sys.settrace(None)), also when the call raises an exception (the exception is swallowed: a crashing call still counts for the lines it reached). Return the sorted list of the different line numbers."""
        import sys
        seen = set()
        ns = {}
        exec(compile(source, "<cov>", "exec"), ns)

        def tracer(frame, event, arg):
            if frame.f_code.co_filename != "<cov>" or frame.f_code.co_name == "<module>":
                return None
            if event == "line":
                seen.add(frame.f_lineno)
            return tracer

        sys.settrace(tracer)
        try:
            eval(call, ns)
        except Exception:
            pass
        finally:
            sys.settrace(None)
        return sorted(seen)
  explanation: Tracing slows programs down a lot, which is why coverage is usually measured only in the test run.
