id: u30-debug
title: Debugging Like a Scientist
minutes: 110
objective: Learn a **method** for finding bugs instead of guessing. Read tracebacks, search history with binary search, watch variables, reduce a failing input to a tiny one and deal with flaky tests.
outcomes:
- Read a traceback from the bottom
- Reproduce, isolate and fix a bug step by step
- Use binary search to find a breaking change
- Reduce a failing input with delta debugging
- Recognise and handle flaky tests
sections:
- heading: The scientific method for bugs
  body: |-
    Debugging is not guessing; it is the **scientific method**. Follow these steps every time:

    1. **Reproduce** the bug. If you cannot make it happen on purpose you cannot know that you fixed it. Write down the exact input and steps.
    2. **Read the error.** A **traceback** is read from the **bottom**: the last line names the exception and the message; the last frame is where it crashed. The frames above show how the program got there.
    3. **Form a hypothesis**: "the list is empty when it gets here". A hypothesis is a *guess that can be tested*.
    4. **Test the hypothesis** with an experiment: add a `print`, use a **debugger** (`python -m pdb`, or the one in your editor) to stop at a line, look at the variables and step forward. Change *one* thing at a time.
    5. **Fix** the real cause (not just the symptom), then add a **regression test** and remove the debugging code.

    Two helpful habits: explain the problem aloud to a rubber duck (**rubber-duck debugging**; putting it in words often shows the answer), and take a break: fresh eyes find bugs faster than tired ones.
- heading: Finding it faster
  body: |-
    **Binary search the history.** If it worked in version 100 and fails in version 900, do not test every version. Check version 500: if it works, the problem is later; if not, earlier. About 10 checks find the exact change among 1000. `git bisect` automates this: you say which commit is good and which is bad, and Git checks out the middle ones for you while you run the test.

    **Shrink the input.** A failure on a 10,000-line input is hard to read. **Delta debugging** removes chunks of the input and keeps any smaller version that still fails, until nothing more can be removed. The result is a tiny **minimal reproduction**, perfect for a bug report.

    **Watch the state.** Where does a value go wrong? A **watchpoint** reports each time a variable changes and which line changed it. Often the first wrong value is far from where the crash happens.

    **Flaky tests.** A test that sometimes passes and sometimes fails usually depends on timing, random numbers, the order of tests or shared state. Run it many times with different seeds to see how often it fails, then remove the dependence: fix the seed, inject the clock (lesson 3) or make the test create its own data.

    > **Tip:** The bug is almost never in the compiler or the library. If your assumption "this cannot be wrong" does not hold up, check it first.
examples:
- title: Traceback and bisect
  intro: Pull the facts out of a traceback and find the breaking version in 20 history entries.
  code: |
    def parse_traceback(text):
        """Read a Python traceback. Example:
    Traceback (most recent call last):
      File "app.py", line 12, in main
        result = divide(1, 0)
      File "app.py", line 5, in divide
        return a / b
    ZeroDivisionError: division by zero
        Return a dict {"error": exception name, "message": the text after the first ': ' on the last line ('' if there is none), "frames": list of {"file": text, "line": int, "function": text, "code": the source line stripped} in the order shown (the LAST frame is where it crashed)}. A frame line looks like '  File "NAME", line N, in FUNC' and is followed by an indented source line (if there is none, the code is ''). ValueError('not a traceback') if the first non-blank line is not 'Traceback (most recent call last):' or there is no final exception line (a last line that is not indented and not a File line)."""
        import re
        lines = [l for l in text.splitlines() if l.strip()]
        if not lines or lines[0].strip() != "Traceback (most recent call last):":
            raise ValueError("not a traceback")
        frames = []
        i = 1
        pattern = re.compile(r'^\s*File "(.*)", line (\d+), in (.*)$')
        while i < len(lines):
            m = pattern.match(lines[i])
            if not m:
                break
            code = ""
            if i + 1 < len(lines) and not pattern.match(lines[i + 1]) and lines[i + 1].startswith("    "):
                code = lines[i + 1].strip()
                i += 1
            frames.append({"file": m.group(1), "line": int(m.group(2)), "function": m.group(3), "code": code})
            i += 1
        if i >= len(lines) or lines[i].startswith(" "):
            raise ValueError("not a traceback")
        last = lines[-1]
        name, sep, message = last.partition(": ")
        return {"error": name.strip(), "message": message if sep else "", "frames": frames}


    def bisect_first_bad(versions, is_bad):
        """Find the version that BROKE something, like `git bisect`. `versions` is a list ordered from oldest to newest; every version up to some point is good and every later one is bad (is_bad(version) returns True for bad ones). Use binary search so that few checks are needed. Return (index of the first bad version, number of times is_bad was called). If no version is bad return (None, number of calls); if the very first version is bad the index is 0. Do not call is_bad twice for the same index. An empty list gives (None, 0)."""
        lo, hi = 0, len(versions)
        calls = 0
        while lo < hi:
            mid = (lo + hi) // 2
            calls += 1
            if is_bad(versions[mid]):
                hi = mid
            else:
                lo = mid + 1
        return (lo if lo < len(versions) else None), calls

    text = """Traceback (most recent call last):
      File "shop.py", line 20, in main
        print(average_price(prices))
      File "shop.py", line 9, in average_price
        return sum(prices) / len(prices)
    ZeroDivisionError: division by zero
    """
    tb = parse_traceback(text)
    print(tb["error"], "-", tb["message"])
    last = tb["frames"][-1]
    print("crashed in", last["function"], "at line", last["line"], ":", last["code"])
    print("called from", [f["function"] for f in tb["frames"][:-1]])

    history = ["v" + str(i) for i in range(1, 21)]
    broken_from = "v13"
    idx, checks = bisect_first_bad(history, lambda v: int(v[1:]) >= int(broken_from[1:]))
    print("first bad:", history[idx], "after", checks, "checks of", len(history))
  output: |
    ZeroDivisionError - division by zero
    crashed in average_price at line 9 : return sum(prices) / len(prices)
    called from ['main']
    first bad: v13 after 5 checks of 20
  lines:
  - line: 55
    note: The exception name and message come from the last line.
  - line: 57
    note: The last frame is the crash site.
  - line: 63
    note: About 5 checks find one of 20 versions.
- title: Watchpoints, reduction and flakiness
  intro: Find where a value goes wrong, shrink a failing input and measure a flaky test.
  code: |
    def watch_variable(source, call, var):
        """A watchpoint: follow ONE local variable while a function runs. Compile the source with the file name '<watch>' and run it with exec (untraced) in a new dict, then evaluate `call` (such as 'total([1, 2, 3])') under sys.settrace. On every 'line' event and on the 'return' event of a function that belongs to '<watch>' (and is not the module), read `var` in the frame's locals. If the variable exists and its repr differs from the last repr seen in THIS call of the function (or nothing was seen yet), append the pair (prev, repr text) where prev is the line number of the previous 'line' event of this call (None when the change is seen at the very first event). Return the list of pairs. Always switch the trace off again and ignore exceptions raised by the call. (Use a dict keyed by id(frame) or the frame object for the per-call state.)"""
        import sys
        ns = {}
        exec(compile(source, "<watch>", "exec"), ns)
        out = []
        state = {}

        def tracer(frame, event, arg):
            if frame.f_code.co_filename != "<watch>" or frame.f_code.co_name == "<module>":
                return None
            st = state.setdefault(frame, {"prev": None, "last": None, "first": True})
            if event in ("line", "return"):
                if var in frame.f_locals:
                    text = repr(frame.f_locals[var])
                    if st["last"] != text:
                        out.append((st["prev"], text))
                        st["last"] = text
                if event == "line":
                    st["prev"] = frame.f_lineno
            return tracer

        sys.settrace(tracer)
        try:
            eval(call, ns)
        except Exception:
            pass
        finally:
            sys.settrace(None)
        return out


    def classify_flaky(test, seeds):
        """Is a test flaky? Run test(seed) once for every seed in `seeds`. A run PASSES when it returns without raising an exception (the returned value does not matter). Return a dict {"runs": how many, "passed": how many passed, "status": text}. The status is 'stable pass' when all passed, 'stable fail' when none passed, and 'flaky' when some passed and some did not. With no seeds the status is 'no runs'. Also add "failing_seeds": the list of seeds that failed, in order."""
        failing = []
        for s in seeds:
            try:
                test(s)
            except Exception:
                failing.append(s)
        runs = len(seeds)
        passed = runs - len(failing)
        if runs == 0:
            status = "no runs"
        elif passed == runs:
            status = "stable pass"
        elif passed == 0:
            status = "stable fail"
        else:
            status = "flaky"
        return {"runs": runs, "passed": passed, "status": status, "failing_seeds": failing}


    def ddmin(items, fails):
        """Delta debugging: find a SMALL subset of `items` that still makes `fails(subset)` return True (the whole list fails; keep the original order). Algorithm: n = 2. While the list has at least 2 items: cut it into n chunks of nearly equal size (the first len % n chunks get one extra item). First try every chunk ALONE: if fails(chunk) take it as the new list and set n = 2. Otherwise try every COMPLEMENT (the list without that chunk): if fails(complement) take it as the new list and set n = max(n - 1, 2). If neither worked: if n >= len(list) stop, otherwise n = min(2 * n, len(list)). Return the final list. A list of one item or none is returned as is. The input list is not changed."""
        current = list(items)
        n = 2
        while len(current) >= 2:
            size, extra = divmod(len(current), n)
            chunks, start = [], 0
            for k in range(n):
                end = start + size + (1 if k < extra else 0)
                chunks.append(current[start:end])
                start = end
            reduced = False
            for chunk in chunks:
                if chunk and fails(chunk):
                    current, n, reduced = chunk, 2, True
                    break
            if not reduced:
                for k in range(n):
                    complement = [x for j, c in enumerate(chunks) if j != k for x in c]
                    if complement and fails(complement):
                        current, n, reduced = complement, max(n - 1, 2), True
                        break
            if not reduced:
                if n >= len(current):
                    break
                n = min(2 * n, len(current))
        return current

    buggy = """def average(values):
        total = 0
        for v in values:
            total += v
        total = total / len(values) + 1
        return total
    """
    for line, value in watch_variable(buggy, "average([2, 4, 6])", "total"):
        print("after line", line, "total =", value)

    def fails(items):
        return "bad" in items and "worse" in items

    big = ["ok"] * 20 + ["bad"] + ["ok"] * 15 + ["worse"] + ["ok"] * 10
    print(len(big), "items ->", ddmin(big, fails))

    import random
    def test_dice(seed):
        assert random.Random(seed).randint(1, 6) <= 4

    print(classify_flaky(test_dice, range(12)))
  output: |
    after line 2 total = 0
    after line 4 total = 2
    after line 4 total = 6
    after line 4 total = 12
    after line 5 total = 5.0
    47 items -> ['bad', 'worse']
    {'runs': 12, 'passed': 9, 'status': 'flaky', 'failing_seeds': [5, 6, 10]}
  lines:
  - line: 89
    note: The value is wrong only after the division line.
  - line: 96
    note: Two culprits hidden among 47 items.
  - line: 102
    note: 'Some seeds fail: flaky.'
