- type: code
  question: Write `last_line(traceback_text)` returning the last non-blank line of a traceback, stripped.
  starter: |
    def last_line(traceback_text):
        pass
  tests:
  - name: last
    code: |
      assert last_line("Traceback (most recent call last):\n  File \"a.py\", line 1, in f\n    x()\nNameError: name 'x' is not defined\n\n") == "NameError: name 'x' is not defined" and last_line("A\nB  ") == "B" and last_line("only") == "only"
  solution: |
    def last_line(traceback_text):
        lines = [l.strip() for l in traceback_text.splitlines() if l.strip()]
        return lines[-1]
