- type: code
  question: Write `should_log(level, minimum)` returning True if `level` is at least as important as `minimum`. Levels from low to high are DEBUG, INFO, WARNING, ERROR, CRITICAL.
  starter: |
    def should_log(level, minimum):
        pass
  tests:
  - name: levels
    code: |
      assert should_log("ERROR", "INFO") is True and should_log("INFO", "INFO") is True and should_log("DEBUG", "WARNING") is False and should_log("CRITICAL", "CRITICAL") is True
  solution: |
    def should_log(level, minimum):
        order = ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
        return order.index(level) >= order.index(minimum)
