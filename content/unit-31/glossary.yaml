# Terms introduced in Unit 31 (Security Basics). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Security
  definition: Protecting a system and its data from people who should not have access.
  lesson: u31-hash
- term: SHA-256
  definition: A widely used hash function that gives a 256-bit fingerprint.
  lesson: u31-hash
- term: Avalanche effect
  definition: A tiny change in the input changes about half of the output bits.
  lesson: u31-hash
- term: Dictionary attack
  definition: Guessing passwords from a list of common words and passwords.
  lesson: u31-hash
- term: Passphrase
  definition: A long password made of several words.
  lesson: u31-hash
- term: Entropy
  definition: A measure of how unpredictable something is, in bits.
  lesson: u31-hash
- term: Encryption
  definition: Scrambling data with a key so that only someone with the right key can read it.
  lesson: u31-crypto
- term: Cipher
  definition: A method for encrypting and decrypting.
  lesson: u31-crypto
- term: Frequency analysis
  definition: Breaking a cipher by counting how often letters appear.
  lesson: u31-crypto
- term: Asymmetric encryption
  definition: Encryption with a public key to lock and a private key to unlock.
  lesson: u31-crypto
- term: Public key
  definition: The half of a key pair that can be shared with everyone.
  lesson: u31-crypto
- term: Private key
  definition: The half of a key pair that must be kept secret.
  lesson: u31-crypto
- term: Modular exponentiation
  definition: Computing a power and keeping only the remainder after division.
  lesson: u31-crypto
- term: Prime factorization
  definition: Splitting a number into prime numbers that multiply to it.
  lesson: u31-crypto
- term: MAC
  definition: 'Message authentication code: a tag that proves a message was not changed.'
  lesson: u31-crypto
- term: Escaping
  definition: Replacing special characters so that they are treated as plain text.
  lesson: u31-injection
- term: Placeholder
  definition: A marker in a query that is filled in safely with a value.
  lesson: u31-injection
- term: Sanitizing
  definition: Cleaning or escaping input before use.
  lesson: u31-injection
- term: Session ID
  definition: A long random value that identifies a session.
  lesson: u31-auth
- term: JWT
  definition: 'JSON Web Token: a signed token that carries data.'
  lesson: u31-auth
- term: Account lockout
  definition: Blocking logins for a while after too many failures.
  lesson: u31-auth
- term: Secure cookie
  definition: A cookie sent only over HTTPS.
  lesson: u31-web
- term: SameSite
  definition: A cookie setting that limits sending it with requests from other sites.
  lesson: u31-web
- term: HTTPS
  definition: HTTP carried inside an encrypted TLS connection.
  lesson: u31-web
- term: Content Security Policy
  definition: A header that lists where a page may load scripts and other content from.
  lesson: u31-web
- term: Man-in-the-middle
  definition: An attacker who sits between two parties and reads or changes their traffic.
  lesson: u31-web
- term: Security header
  definition: An HTTP header that turns on a browser protection.
  lesson: u31-web
- term: Spoofing
  definition: Pretending to be someone else.
  lesson: u31-threats
- term: Tampering
  definition: Changing data without permission.
  lesson: u31-threats
- term: Repudiation
  definition: Denying that you did something.
  lesson: u31-threats
- term: Denial of service
  definition: Making a system unavailable.
  lesson: u31-threats
- term: Elevation of privilege
  definition: Gaining rights that you should not have.
  lesson: u31-threats
- term: Trust boundary
  definition: A line where data passes between parts with different levels of trust.
  lesson: u31-threats
- term: Mitigation
  definition: An action that reduces a risk.
  lesson: u31-threats
- term: Supply chain attack
  definition: An attack through the libraries and tools that a program depends on.
  lesson: u31-threats
- term: CVE
  definition: A public identifier for a known security flaw.
  lesson: u31-threats
- term: CVSS
  definition: A scoring system for the severity of vulnerabilities.
  lesson: u31-threats
- term: Secrets manager
  definition: A service for storing passwords and keys safely.
  lesson: u31-threats
