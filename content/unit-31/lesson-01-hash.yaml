exercises:
- id: hash
  title: Fingerprints
  difficulty: 3
  prompt: 'A **hash function** turns any text into a short, fixed-size **fingerprint**. Tiny changes in the text change the fingerprint completely (the **avalanche effect**), and you cannot go back from fingerprint to text. Write `sha256_hex(text)`: the SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters, using the `hashlib` module. Write `bit_difference(a, b)`: how many of the 256 bits differ between the fingerprints of `a` and `b`? (Convert both hex strings to integers, XOR them and count the ones, for example with `bin(x).count("1")`.) Identical texts give `0`.'
  starter: |-
    def sha256_hex(text):
        """The SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters. Use the hashlib module."""
        pass


    def bit_difference(a, b):
        """How many of the 256 bits differ between the SHA-256 fingerprints of the texts a and b? (Convert both hex strings to integers, XOR them and count the ones, e.g. with bin(x).count('1').) Identical texts give 0."""
        pass
  tests:
  - name: fingerprints
    code: |
      assert sha256_hex("abc") == "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad" and sha256_hex("") == "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      assert len(sha256_hex("anything")) == 64 and sha256_hex("é") != sha256_hex("e") and sha256_hex("Hello") != sha256_hex("hello") and sha256_hex("same") == sha256_hex("same") and all(c in "0123456789abcdef" for c in sha256_hex("x"))
  - name: avalanche
    code: |
      assert bit_difference("abc", "abc") == 0 and bit_difference("", "") == 0
      for a, b in (("hello", "hellp"), ("password1", "password2"), ("a", "b"), ("The quick brown fox", "The quick brown fax")):
          assert 90 <= bit_difference(a, b) <= 170
      assert bit_difference("x", "y") == bit_difference("y", "x")
  hints:
  - hashlib.sha256(bytes).hexdigest() does the hashing.
  - int(hexstring, 16) turns hex into a number.
  solution: |
    def sha256_hex(text):
        """The SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters. Use the hashlib module."""
        import hashlib
        return hashlib.sha256(text.encode("utf-8")).hexdigest()


    def bit_difference(a, b):
        """How many of the 256 bits differ between the SHA-256 fingerprints of the texts a and b? (Convert both hex strings to integers, XOR them and count the ones, e.g. with bin(x).count('1').) Identical texts give 0."""
        x = int(sha256_hex(a), 16) ^ int(sha256_hex(b), 16)
        return bin(x).count("1")
  explanation: 'Websites store fingerprints of passwords, not the passwords: if the database leaks, the passwords are not simply readable.'
- id: password
  title: Storing passwords safely
  difficulty: 5
  prompt: 'A plain fingerprint is not enough: attackers keep tables of fingerprints of common passwords. Defences: a random **salt** (different for every user, so a table must be rebuilt for each) and a deliberately **slow** hash that repeats the work many times (**iterations**). Write `hash_password(password, salt_hex, iterations)`: use `hashlib.pbkdf2_hmac("sha256", password as UTF-8 bytes, bytes.fromhex(salt_hex), iterations)` and return the text `"pbkdf2$ITERATIONS$SALT$HASH"` where `SALT` is `salt_hex` as given and `HASH` the result as hex. `ValueError("iterations must be positive")` if `iterations < 1`, and `ValueError("salt must be hex")` if the salt is not valid hexadecimal or shorter than 4 bytes (8 hex digits). Write `verify_password(stored, attempt)`: split the stored text at `"$"` (`ValueError("bad record")` unless there are four parts, the first is `pbkdf2` and the number is a positive whole number), hash the attempt with the **same** salt and iterations and compare with `hmac.compare_digest` (a comparison whose time does not reveal how many characters matched). Return `True` or `False`.'
  starter: |-
    def hash_password(password, salt_hex, iterations):
        """Store a password safely with PBKDF2. Use hashlib.pbkdf2_hmac('sha256', password bytes (UTF-8), bytes.fromhex(salt_hex), iterations) and return the text 'pbkdf2$ITERATIONS$SALT$HASH' where SALT is salt_hex as given and HASH the result as hexadecimal. ValueError('iterations must be positive') if iterations < 1 and ValueError('salt must be hex') if salt_hex is not valid hexadecimal (an even number of hex digits, at least 8 digits)."""
        pass


    def verify_password(stored, attempt):
        """Check an attempt against a stored text made by hash_password. Split it at '$' (ValueError('bad record') unless there are four parts and the first is 'pbkdf2' and the number is a positive whole number). Hash the attempt with the SAME salt and iterations and compare with hmac.compare_digest (a comparison whose time does not reveal how many characters matched). Return True or False."""
        pass
  tests:
  - name: making records
    code: |
      r = hash_password("secret", "00112233aabbccdd", 1000)
      parts = r.split("$")
      assert parts[:3] == ["pbkdf2", "1000", "00112233aabbccdd"] and len(parts[3]) == 64
      import hashlib
      assert parts[3] == hashlib.pbkdf2_hmac("sha256", b"secret", bytes.fromhex("00112233aabbccdd"), 1000).hex()
      assert hash_password("secret", "00112233aabbccdd", 1000) == r and hash_password("secret", "00112233aabbccde", 1000) != r and hash_password("Secret", "00112233aabbccdd", 1000) != r and hash_password("secret", "00112233aabbccdd", 1001) != r
      for bad_salt, it, msg in (("xyz", 10, "salt must be hex"), ("00ff", 10, "salt must be hex"), ("", 10, "salt must be hex"), ("0011223", 10, "salt must be hex"), ("00112233", 0, "iterations must be positive")):
          try:
              hash_password("p", bad_salt, it)
              raise AssertionError("accepted")
          except ValueError as e:
              assert msg in str(e)
  - name: checking attempts
    code: |
      stored = hash_password("correct horse", "a1b2c3d4e5f60718", 500)
      assert verify_password(stored, "correct horse") is True and verify_password(stored, "Correct horse") is False and verify_password(stored, "") is False and verify_password(stored, "correct horse ") is False
      other = hash_password("correct horse", "ffffffff00000000", 500)
      assert other != stored and verify_password(other, "correct horse") is True
      for bad in ("", "abc", "pbkdf2$10$00112233", "md5$10$00112233$aa", "pbkdf2$x$00112233$aa", "pbkdf2$0$00112233$aa", "pbkdf2$10$00112233$aa$bb"):
          try:
              verify_password(bad, "x")
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "bad record" in str(e)
  hints:
  - Build the record text from the pieces, in order.
  - verify_password can reuse hash_password and compare the whole texts.
  solution: |
    def hash_password(password, salt_hex, iterations):
        """Store a password safely with PBKDF2. Use hashlib.pbkdf2_hmac('sha256', password bytes (UTF-8), bytes.fromhex(salt_hex), iterations) and return the text 'pbkdf2$ITERATIONS$SALT$HASH' where SALT is salt_hex as given and HASH the result as hexadecimal. ValueError('iterations must be positive') if iterations < 1 and ValueError('salt must be hex') if salt_hex is not valid hexadecimal (an even number of hex digits, at least 8 digits)."""
        import hashlib
        if iterations < 1:
            raise ValueError("iterations must be positive")
        try:
            salt = bytes.fromhex(salt_hex)
        except ValueError:
            raise ValueError("salt must be hex")
        if len(salt) < 4:
            raise ValueError("salt must be hex")
        digest = hashlib.pbkdf2_hmac("sha256", password.encode("utf-8"), salt, iterations)
        return "pbkdf2$" + str(iterations) + "$" + salt_hex + "$" + digest.hex()


    def verify_password(stored, attempt):
        """Check an attempt against a stored text made by hash_password. Split it at '$' (ValueError('bad record') unless there are four parts and the first is 'pbkdf2' and the number is a positive whole number). Hash the attempt with the SAME salt and iterations and compare with hmac.compare_digest (a comparison whose time does not reveal how many characters matched). Return True or False."""
        import hmac
        parts = stored.split("$")
        if len(parts) != 4 or parts[0] != "pbkdf2" or not parts[1].isdigit() or int(parts[1]) < 1:
            raise ValueError("bad record")
        again = hash_password(attempt, parts[2], int(parts[1]))
        return hmac.compare_digest(again.encode(), stored.encode())
  explanation: Real systems use bcrypt, scrypt or Argon2, which are made to be slow and use memory; PBKDF2 is the one built into Python.
- id: crack
  title: How long to guess?
  difficulty: 4
  prompt: 'A password is only as strong as the work needed to **guess** it. Write `brute_force_seconds(length, charset_size, guesses_per_second)`: the **worst-case** time in seconds to try every password of exactly `length` characters from an alphabet of `charset_size` symbols: `charset_size ** length / guesses_per_second` (a float). `ValueError("bad parameters")` when `length < 1`, `charset_size < 1` or `guesses_per_second <= 0`. Write `describe_duration(seconds)`: say it in words. Units: second, minute (60 seconds), hour, day (24 hours), year (365 days). Below 1 second return `"less than a second"`. Otherwise take the **largest** unit for which the amount is at least 1 and round the amount to the nearest whole number (round half up: `int(x + 0.5)`); return `"N unit"` with an `s` added unless N is 1 (`"1 minute"`, `"45 seconds"`, `"3 days"`). From 100 years on return `"centuries"`. A negative number raises `ValueError("negative time")`.'
  starter: |-
    def describe_duration(seconds):
        """Say how long something takes in words. Units: second, minute (60 seconds), hour (60 minutes), day (24 hours), year (365 days). Below 1 second return 'less than a second'. Otherwise take the LARGEST unit for which the amount is at least 1 and round the amount to the nearest whole number (round half up: int(x + 0.5)); return 'N unit' with an 's' added unless N is 1 (for example '1 minute', '45 seconds', '3 days'). From 100 years on return 'centuries'. If rounding gives the next unit's size (for example 59.6 seconds rounds to 60) simply write the rounded number (for example '60 seconds'): keep it simple. A negative number raises ValueError('negative time')."""
        pass


    def brute_force_seconds(length, charset_size, guesses_per_second):
        """The WORST-CASE time in seconds to try every password of exactly `length` characters from an alphabet of `charset_size` symbols: charset_size ** length / guesses_per_second (a float). ValueError('bad parameters') when length < 1, charset_size < 1 or guesses_per_second <= 0."""
        pass
  tests:
  - name: estimates
    code: |
      assert brute_force_seconds(4, 10, 1) == 10000 and brute_force_seconds(1, 26, 2) == 13 and brute_force_seconds(8, 94, 1e9) == 94 ** 8 / 1e9 and brute_force_seconds(3, 2, 4) == 2.0
      for args in ((0, 10, 1), (3, 0, 1), (3, 10, 0), (3, 10, -5)):
          try:
              brute_force_seconds(*args)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad parameters" in str(e)
  - name: in words
    code: |
      assert describe_duration(0) == "less than a second" and describe_duration(0.99) == "less than a second" and describe_duration(1) == "1 second" and describe_duration(45) == "45 seconds" and describe_duration(59) == "59 seconds"
      assert describe_duration(60) == "1 minute" and describe_duration(150) == "3 minutes" and describe_duration(3600) == "1 hour" and describe_duration(7200) == "2 hours" and describe_duration(86400) == "1 day" and describe_duration(3 * 86400) == "3 days"
      assert describe_duration(365 * 86400) == "1 year" and describe_duration(40 * 365 * 86400) == "40 years" and describe_duration(99 * 365 * 86400) == "99 years" and describe_duration(100 * 365 * 86400) == "centuries" and describe_duration(10 ** 30) == "centuries"
      assert describe_duration(1.5) == "2 seconds" and describe_duration(89) == "1 minute" and describe_duration(90) == "2 minutes"
      try:
          describe_duration(-1)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "negative time" in str(e)
      assert describe_duration(brute_force_seconds(6, 26, 1000)) == "4 days" and describe_duration(brute_force_seconds(12, 62, 1e10)) == "centuries" and describe_duration(brute_force_seconds(8, 10, 1000)) == "1 day"
  hints:
  - Go through the units from large to small and stop at the first that fits.
  - Round with int(x + 0.5).
  solution: |
    def describe_duration(seconds):
        """Say how long something takes in words. Units: second, minute (60 seconds), hour (60 minutes), day (24 hours), year (365 days). Below 1 second return 'less than a second'. Otherwise take the LARGEST unit for which the amount is at least 1 and round the amount to the nearest whole number (round half up: int(x + 0.5)); return 'N unit' with an 's' added unless N is 1 (for example '1 minute', '45 seconds', '3 days'). From 100 years on return 'centuries'. If rounding gives the next unit's size (for example 59.6 seconds rounds to 60) simply write the rounded number (for example '60 seconds'): keep it simple. A negative number raises ValueError('negative time')."""
        if seconds < 0:
            raise ValueError("negative time")
        if seconds < 1:
            return "less than a second"
        units = [("year", 365 * 86400), ("day", 86400), ("hour", 3600), ("minute", 60), ("second", 1)]
        if seconds >= 100 * 365 * 86400:
            return "centuries"
        for name, size in units:
            if seconds >= size:
                n = int(seconds / size + 0.5)
                return str(n) + " " + name + ("" if n == 1 else "s")


    def brute_force_seconds(length, charset_size, guesses_per_second):
        """The WORST-CASE time in seconds to try every password of exactly `length` characters from an alphabet of `charset_size` symbols: charset_size ** length / guesses_per_second (a float). ValueError('bad parameters') when length < 1, charset_size < 1 or guesses_per_second <= 0."""
        if length < 1 or charset_size < 1 or guesses_per_second <= 0:
            raise ValueError("bad parameters")
        return charset_size ** length / guesses_per_second
  explanation: 'Every extra character multiplies the work by the size of the alphabet: length beats complexity. Four random words are stronger than P@ssw0rd!.'
- id: policy
  title: Checking a password
  difficulty: 4
  prompt: 'Write `password_problems(password, username, common)`: check a password against a policy and return the list of problems (empty when it is fine), always in this order: `"too short"` if shorter than 12 characters; `"needs a lower-case letter"`; `"needs an upper-case letter"`; `"needs a digit"` (use the `str` methods); `"contains the username"` if `username` (not empty) occurs in the password, ignoring case; `"is a common password"` if the password in lower case is in the set `common`. (Modern advice stresses **length** and **uniqueness** more than strange symbols, and checking against lists of leaked passwords.)'
  starter: |-
    def password_problems(password, username, common):
        """Check a password against a policy and return the list of problems (empty when it is fine), always in this order: 'too short' if shorter than 12 characters; 'needs a lower-case letter'; 'needs an upper-case letter'; 'needs a digit' (use str methods); 'contains the username' if username (not empty) occurs in the password ignoring case; 'is a common password' if the password in lower case is in the set `common`. (The length rule matters most: modern advice is long passphrases rather than strange symbols.)"""
        pass
  tests:
  - name: rules
    code: |
      common = {"password123", "qwertyuiop12", "letmein"}
      assert password_problems("Correct1Horse9Battery", "ada", common) == [] and password_problems("short", "ada", common) == ["too short", "needs an upper-case letter", "needs a digit"]
      assert password_problems("ALLUPPERCASE123", "ada", common) == ["needs a lower-case letter"] and password_problems("alllowercase123", "ada", common) == ["needs an upper-case letter"] and password_problems("NoDigitsHereAtAll", "ada", common) == ["needs a digit"]
      assert password_problems("", "ada", common) == ["too short", "needs a lower-case letter", "needs an upper-case letter", "needs a digit"]
  - name: username and common
    code: |
      common = {"password123", "qwertyuiop12", "letmein"}
      assert password_problems("MyAdaPassword99", "ada", common) == ["contains the username"] and password_problems("MyADApassword99", "Ada", common) == ["contains the username"] and password_problems("Fine-Passphrase-7", "", common) == []
      assert password_problems("Password123", "bo", common) == ["too short", "is a common password"] and password_problems("qwertyuiop12", "x", common) == ["needs an upper-case letter", "is a common password"] and password_problems("LETMEIN", "x", common) == ["too short", "needs a lower-case letter", "needs a digit", "is a common password"]
      assert password_problems("Xx1" * 5, "xx1", common) == ["contains the username"]
  hints:
  - Build the list in the fixed order of the rules.
  - any() over a generator keeps the checks short.
  solution: |
    def password_problems(password, username, common):
        """Check a password against a policy and return the list of problems (empty when it is fine), always in this order: 'too short' if shorter than 12 characters; 'needs a lower-case letter'; 'needs an upper-case letter'; 'needs a digit' (use str methods); 'contains the username' if username (not empty) occurs in the password ignoring case; 'is a common password' if the password in lower case is in the set `common`. (The length rule matters most: modern advice is long passphrases rather than strange symbols.)"""
        problems = []
        if len(password) < 12:
            problems.append("too short")
        if not any(c.islower() for c in password):
            problems.append("needs a lower-case letter")
        if not any(c.isupper() for c in password):
            problems.append("needs an upper-case letter")
        if not any(c.isdigit() for c in password):
            problems.append("needs a digit")
        if username and username.lower() in password.lower():
            problems.append("contains the username")
        if password.lower() in common:
            problems.append("is a common password")
        return problems
  explanation: Long random passphrases kept in a password manager beat memorable tricks. Never reuse a password between sites.
- id: attack
  title: 'Capstone: a dictionary attack'
  difficulty: 5
  prompt: 'Attackers do not try every combination: they try **likely** passwords first. Write `attack(records, wordlist)`; `sha256_hex` is given. `records` is a dict `{user: "SALT$HEX"}` where `HEX` is `sha256_hex(SALT + password)` (the salt may be empty: `"$HEX"`). `wordlist` is a list of words. For **every user separately** go through the words in order and for each word try these candidates in this order: the word, the word capitalised (`str.capitalize`), the word + `"1"`, the word + `"123"`. Each candidate costs one hash computation (count it, also the wrong ones); stop for this user at the first candidate whose hash matches. Return `(found, attempts)`: `found` is a dict `{user: password}` for the users that were cracked (in the order of `records`) and `attempts` the **total** number of hash computations over all users. This shows the **cost of salting**: without salts one table of hashes serves all users, with salts the attacker pays again for each user.'
  starter: |-
    def sha256_hex(text):
        """The SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters. Use the hashlib module."""
        import hashlib
        return hashlib.sha256(text.encode("utf-8")).hexdigest()






    def attack(records, wordlist):
        """A dictionary attack, to understand why salting matters. `records` is a dict {user: 'SALT$HEX'} where HEX is sha256_hex(SALT + password) (the salt may be empty: '$HEX'). `wordlist` is a list of words. For EVERY user separately go through the words in order and for each word try these candidates in this order: the word, the word capitalised (str.capitalize), the word + '1', the word + '123'. Each candidate costs one hash computation (count it, also the wrong ones); stop for this user at the first candidate whose hash matches. Return (found, attempts): found is a dict {user: password} for the users that were cracked (users in the order of `records`) and attempts the TOTAL number of hash computations over all users. (sha256_hex is given.)"""
        pass
  tests:
  - name: unsalted
    code: |
      words = ["apple", "dragon", "monkey", "sunshine"]
      records = {"ada": "$" + sha256_hex("monkey"), "bo": "$" + sha256_hex("Dragon"), "cy": "$" + sha256_hex("apple123"), "di": "$" + sha256_hex("S3cur3-Passphrase")}
      found, attempts = attack(records, words)
      assert found == {"ada": "monkey", "bo": "Dragon", "cy": "apple123"} and list(found) == ["ada", "bo", "cy"]
      assert attempts == 9 + 6 + 4 + 16 and attack({}, words) == ({}, 0) and attack(records, []) == ({}, 0)
  - name: salted
    code: |
      words = ["cat", "dog"]
      records = {"u1": "s1$" + sha256_hex("s1" + "cat1"), "u2": "s2$" + sha256_hex("s2" + "Dog"), "u3": "s3$" + sha256_hex("cat1")}
      found, attempts = attack(records, words)
      assert found == {"u1": "cat1", "u2": "Dog"} and attempts == 3 + 6 + 8
      same = {"u1": "$" + sha256_hex("dog123"), "u2": "$" + sha256_hex("dog123")}
      assert attack(same, words) == ({"u1": "dog123", "u2": "dog123"}, 8 + 8) and attack({"x": "$"}, words) == ({}, 8)
      assert attack({"x": "salt$" + sha256_hex("saltcat")}, words) == ({"x": "cat"}, 1)
  hints:
  - Loop over users, then words, then the four candidates, counting every hash.
  - Stop for a user as soon as one candidate matches.
  solution: |
    def sha256_hex(text):
        """The SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters. Use the hashlib module."""
        import hashlib
        return hashlib.sha256(text.encode("utf-8")).hexdigest()






    def attack(records, wordlist):
        """A dictionary attack, to understand why salting matters. `records` is a dict {user: 'SALT$HEX'} where HEX is sha256_hex(SALT + password) (the salt may be empty: '$HEX'). `wordlist` is a list of words. For EVERY user separately go through the words in order and for each word try these candidates in this order: the word, the word capitalised (str.capitalize), the word + '1', the word + '123'. Each candidate costs one hash computation (count it, also the wrong ones); stop for this user at the first candidate whose hash matches. Return (found, attempts): found is a dict {user: password} for the users that were cracked (users in the order of `records`) and attempts the TOTAL number of hash computations over all users. (sha256_hex is given.)"""
        found, attempts = {}, 0
        for user, record in records.items():
            salt, _, target = record.partition("$")
            done = False
            for word in wordlist:
                for candidate in (word, word.capitalize(), word + "1", word + "123"):
                    attempts += 1
                    if sha256_hex(salt + candidate) == target:
                        found[user] = candidate
                        done = True
                        break
                if done:
                    break
        return found, attempts
  explanation: Real attackers use GPUs and wordlists with billions of entries, which is why slow hashes (the previous exercises) and unique passwords matter.
commonMistakes:
- title: Using MD5 or SHA-1 for passwords
  explanation: They are fast and broken; use a slow password hash.
- title: Storing passwords in plain text
  explanation: A leak exposes every account at once.
- title: One salt for all users
  explanation: The salt must be unique per user.
- title: Comparing hashes with ==
  explanation: Use a constant-time comparison.
- title: Reusing passwords on several sites
  explanation: One leak opens all of them.
summary:
- Security protects confidentiality, integrity and availability.
- A hash is a one-way fingerprint; a tiny change flips about half its bits.
- Store passwords with a unique salt and a slow hash.
- Guessing cost grows with length like alphabet ** length.
- Never reuse passwords; use a manager and two-factor authentication.
