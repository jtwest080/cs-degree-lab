id: u31-hash
title: Hashing and Passwords
minutes: 110
objective: Understand how passwords should be stored and why guessing is easy or hard. You will compute SHA-256 fingerprints, store passwords with a salt and PBKDF2, estimate brute-force times, check password rules and run a dictionary attack against your own test data.
outcomes:
- Explain what a hash function does
- Store passwords with a salt and a slow hash
- Estimate how long guessing takes
- Explain why length and uniqueness matter
sections:
- heading: Security is about thinking like an attacker
  body: |-
    **Security** means protecting information and systems from people who should not have access. The people who attack are **attackers** (also adversaries); what they can do is the **threat**; a weakness they can use is a **vulnerability**; the likelihood and damage together are the **risk**. The three classic goals are the **CIA triad**: **confidentiality** (only the right people can read it), **integrity** (nobody can change it unnoticed) and **availability** (it works when needed).

    Three rules run through this whole unit. **Assume the attacker is clever** and knows how your system works (**Kerckhoffs's principle**: security should depend on the key, not on secret design). **Never trust input** from outside. **Layer your defences** (**defence in depth**): if one fails, another still protects.

    > **Warning:** Everything here is for defending your own systems. Testing someone else's system without permission is illegal. All the attacks in this unit run on your own made-up data.
- heading: Hash functions
  body: |-
    A **hash function** turns any amount of data into a fixed-size fingerprint, the **digest**. A **cryptographic** hash such as **SHA-256** has three properties: the same input always gives the same digest; you cannot go back from the digest to the input (**one-way**); and a tiny change in the input changes about half of the bits of the digest (the **avalanche effect**). Because of this, hashes also check **integrity**: if the fingerprint of a downloaded file matches the published one, the file was not changed.

    Old hashes such as **MD5** and **SHA-1** are **broken** (attackers can make two different inputs with the same digest, a **collision**): do not use them for security.
- heading: Storing and guessing passwords
  body: |-
    A website must never store your password. It stores a hash, and when you log in it hashes what you typed and compares. But plain hashing has a weakness: people choose the same passwords, so an attacker can compute the hashes of millions of likely passwords once (a **rainbow table** or word list) and look the stolen hashes up.

    Two defences. A **salt** is a random value, different for every user, mixed into the password before hashing and stored next to the hash: the attacker's precomputed table is useless and identical passwords look different. A **slow hash** (bcrypt, scrypt, Argon2 or PBKDF2) repeats the work thousands of times: one login takes a few milliseconds longer, but a guessing attack is thousands of times more expensive. Compare the stored and computed values with a **constant-time comparison** so that timing does not leak information.

    Attacks: **brute force** tries every combination (the work grows like `alphabet ** length`, so every extra character multiplies it); a **dictionary attack** tries likely passwords first and is far faster against human-chosen passwords; **credential stuffing** tries passwords leaked from one site on other sites, which is why you must never **reuse** passwords. Defences for people: long **passphrases**, a **password manager**, and **two-factor authentication** (lesson 4).
examples:
- title: A fingerprint and the avalanche
  intro: One changed letter flips about half of the bits.
  code: |
    def sha256_hex(text):
        """The SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters. Use the hashlib module."""
        import hashlib
        return hashlib.sha256(text.encode("utf-8")).hexdigest()


    def bit_difference(a, b):
        """How many of the 256 bits differ between the SHA-256 fingerprints of the texts a and b? (Convert both hex strings to integers, XOR them and count the ones, e.g. with bin(x).count('1').) Identical texts give 0."""
        x = int(sha256_hex(a), 16) ^ int(sha256_hex(b), 16)
        return bin(x).count("1")

    print(sha256_hex("abc"))
    print(bit_difference("hello", "hellp"), "of 256 bits differ after changing one letter")
  output: |
    ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
    131 of 256 bits differ after changing one letter
  lines:
  - line: 12
    note: The famous test value for abc.
  - line: 13
    note: About half of 256 bits differ.
- title: Storing passwords and estimating guessing
  intro: A PBKDF2 record, and how long brute force takes for different passwords at a billion guesses per second.
  code: |
    def sha256_hex(text):
        """The SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters. Use the hashlib module."""
        import hashlib
        return hashlib.sha256(text.encode("utf-8")).hexdigest()


    def bit_difference(a, b):
        """How many of the 256 bits differ between the SHA-256 fingerprints of the texts a and b? (Convert both hex strings to integers, XOR them and count the ones, e.g. with bin(x).count('1').) Identical texts give 0."""
        x = int(sha256_hex(a), 16) ^ int(sha256_hex(b), 16)
        return bin(x).count("1")


    def hash_password(password, salt_hex, iterations):
        """Store a password safely with PBKDF2. Use hashlib.pbkdf2_hmac('sha256', password bytes (UTF-8), bytes.fromhex(salt_hex), iterations) and return the text 'pbkdf2$ITERATIONS$SALT$HASH' where SALT is salt_hex as given and HASH the result as hexadecimal. ValueError('iterations must be positive') if iterations < 1 and ValueError('salt must be hex') if salt_hex is not valid hexadecimal (an even number of hex digits, at least 8 digits)."""
        import hashlib
        if iterations < 1:
            raise ValueError("iterations must be positive")
        try:
            salt = bytes.fromhex(salt_hex)
        except ValueError:
            raise ValueError("salt must be hex")
        if len(salt) < 4:
            raise ValueError("salt must be hex")
        digest = hashlib.pbkdf2_hmac("sha256", password.encode("utf-8"), salt, iterations)
        return "pbkdf2$" + str(iterations) + "$" + salt_hex + "$" + digest.hex()


    def verify_password(stored, attempt):
        """Check an attempt against a stored text made by hash_password. Split it at '$' (ValueError('bad record') unless there are four parts and the first is 'pbkdf2' and the number is a positive whole number). Hash the attempt with the SAME salt and iterations and compare with hmac.compare_digest (a comparison whose time does not reveal how many characters matched). Return True or False."""
        import hmac
        parts = stored.split("$")
        if len(parts) != 4 or parts[0] != "pbkdf2" or not parts[1].isdigit() or int(parts[1]) < 1:
            raise ValueError("bad record")
        again = hash_password(attempt, parts[2], int(parts[1]))
        return hmac.compare_digest(again.encode(), stored.encode())


    def describe_duration(seconds):
        """Say how long something takes in words. Units: second, minute (60 seconds), hour (60 minutes), day (24 hours), year (365 days). Below 1 second return 'less than a second'. Otherwise take the LARGEST unit for which the amount is at least 1 and round the amount to the nearest whole number (round half up: int(x + 0.5)); return 'N unit' with an 's' added unless N is 1 (for example '1 minute', '45 seconds', '3 days'). From 100 years on return 'centuries'. If rounding gives the next unit's size (for example 59.6 seconds rounds to 60) simply write the rounded number (for example '60 seconds'): keep it simple. A negative number raises ValueError('negative time')."""
        if seconds < 0:
            raise ValueError("negative time")
        if seconds < 1:
            return "less than a second"
        units = [("year", 365 * 86400), ("day", 86400), ("hour", 3600), ("minute", 60), ("second", 1)]
        if seconds >= 100 * 365 * 86400:
            return "centuries"
        for name, size in units:
            if seconds >= size:
                n = int(seconds / size + 0.5)
                return str(n) + " " + name + ("" if n == 1 else "s")


    def brute_force_seconds(length, charset_size, guesses_per_second):
        """The WORST-CASE time in seconds to try every password of exactly `length` characters from an alphabet of `charset_size` symbols: charset_size ** length / guesses_per_second (a float). ValueError('bad parameters') when length < 1, charset_size < 1 or guesses_per_second <= 0."""
        if length < 1 or charset_size < 1 or guesses_per_second <= 0:
            raise ValueError("bad parameters")
        return charset_size ** length / guesses_per_second


    def password_problems(password, username, common):
        """Check a password against a policy and return the list of problems (empty when it is fine), always in this order: 'too short' if shorter than 12 characters; 'needs a lower-case letter'; 'needs an upper-case letter'; 'needs a digit' (use str methods); 'contains the username' if username (not empty) occurs in the password ignoring case; 'is a common password' if the password in lower case is in the set `common`. (The length rule matters most: modern advice is long passphrases rather than strange symbols.)"""
        problems = []
        if len(password) < 12:
            problems.append("too short")
        if not any(c.islower() for c in password):
            problems.append("needs a lower-case letter")
        if not any(c.isupper() for c in password):
            problems.append("needs an upper-case letter")
        if not any(c.isdigit() for c in password):
            problems.append("needs a digit")
        if username and username.lower() in password.lower():
            problems.append("contains the username")
        if password.lower() in common:
            problems.append("is a common password")
        return problems

    record = hash_password("correct horse battery", "a1b2c3d4e5f60718", 2000)
    print(record[:26] + "...")
    print(verify_password(record, "correct horse battery"), verify_password(record, "correct horse batterY"))
    for length, charset, label in ((8, 10, "8 digits"), (8, 26, "8 lower-case letters"), (8, 94, "8 any characters"), (12, 94, "12 any characters"), (4, 7776, "4 random words (diceware list)")):
        print(label + ":", describe_duration(brute_force_seconds(length, charset, 1e9)))
    print(password_problems("Tr0ub4dor", "ada", {"password"}))
  output: |
    pbkdf2$2000$a1b2c3d4e5f607...
    True False
    8 digits: less than a second
    8 lower-case letters: 3 minutes
    8 any characters: 71 days
    12 any characters: centuries
    4 random words (diceware list): 42 days
    ['too short']
  lines:
  - line: 78
    note: The record carries the algorithm, iterations and salt.
  - line: 79
    note: Only the exact password works.
  - line: 80
    note: Length and alphabet decide the work.
  - line: 82
    note: Short, so it fails the policy.
- title: What salting costs the attacker
  intro: The same word list against unsalted and salted records.
  code: |
    def sha256_hex(text):
        """The SHA-256 fingerprint of the text (encode it as UTF-8) as 64 lower-case hexadecimal characters. Use the hashlib module."""
        import hashlib
        return hashlib.sha256(text.encode("utf-8")).hexdigest()




    def attack(records, wordlist):
        """A dictionary attack, to understand why salting matters. `records` is a dict {user: 'SALT$HEX'} where HEX is sha256_hex(SALT + password) (the salt may be empty: '$HEX'). `wordlist` is a list of words. For EVERY user separately go through the words in order and for each word try these candidates in this order: the word, the word capitalised (str.capitalize), the word + '1', the word + '123'. Each candidate costs one hash computation (count it, also the wrong ones); stop for this user at the first candidate whose hash matches. Return (found, attempts): found is a dict {user: password} for the users that were cracked (users in the order of `records`) and attempts the TOTAL number of hash computations over all users. (sha256_hex is given.)"""
        found, attempts = {}, 0
        for user, record in records.items():
            salt, _, target = record.partition("$")
            done = False
            for word in wordlist:
                for candidate in (word, word.capitalize(), word + "1", word + "123"):
                    attempts += 1
                    if sha256_hex(salt + candidate) == target:
                        found[user] = candidate
                        done = True
                        break
                if done:
                    break
        return found, attempts

    words = ["monkey", "dragon", "sunshine", "apple"]
    plain = {"ada": "$" + sha256_hex("dragon"), "bo": "$" + sha256_hex("Apple"), "cy": "$" + sha256_hex("N0t-in-the-list")}
    salted = {u: "salt" + u + "$" + sha256_hex("salt" + u + p) for u, p in (("ada", "dragon"), ("bo", "Apple"), ("cy", "N0t-in-the-list"))}
    found, attempts = attack(plain, words)
    print("unsalted:", found, attempts, "hashes")
    print("one shared table would need only", 4 * len(words), "hashes for ANY number of users")
    found, attempts = attack(salted, words)
    print("salted:  ", found, attempts, "hashes, and a new table is needed for each user")
  output: |
    unsalted: {'ada': 'dragon', 'bo': 'Apple'} 35 hashes
    one shared table would need only 16 hashes for ANY number of users
    salted:   {'ada': 'dragon', 'bo': 'Apple'} 35 hashes, and a new table is needed for each user
  lines:
  - line: 29
    note: Two of three users fall to a short word list.
  - line: 31
    note: Unsalted hashes can all be looked up in one precomputed table.
  - line: 32
    note: With salts the work is repeated for every single user.
