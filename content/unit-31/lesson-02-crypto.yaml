        """Encrypt the whole number m with the PUBLIC key (n, e): m ** e % n using mod_pow. ValueError('message too large') unless 0 <= m < n."""
        pass


    def rsa_decrypt(c, n, d):
        """Decrypt c with the PRIVATE exponent: c ** d % n using mod_pow. ValueError('message too large') unless 0 <= c < n."""
        pass
