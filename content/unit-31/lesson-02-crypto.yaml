  - phi = (p - 1)(q - 1) and d is the inverse of e modulo phi.
  - Encrypting and decrypting are the same operation with different exponents.
  solution: |
    def mod_pow(base, exp, mod):
        """base ** exp % mod without computing the huge power: SQUARE AND MULTIPLY. Keep a result (start 1) and walk through the bits of exp from the lowest: when the bit is 1 multiply the result by base (mod mod); then square base (mod mod). ValueError('bad parameters') if mod < 1 or exp < 0. The answer for mod == 1 is 0. (Do not use the three-argument pow.)"""
        if mod < 1 or exp < 0:
            raise ValueError("bad parameters")
        result, base = 1 % mod, base % mod
        while exp:
            if exp & 1:
                result = result * base % mod
            base = base * base % mod
            exp >>= 1
        return result


    def mod_inverse(a, m):
        """The number x with 0 <= x < m and a * x % m == 1 (the MODULAR INVERSE), found with the extended Euclidean algorithm. ValueError('no inverse') when gcd(a, m) is not 1 or m < 2."""
        if m < 2:
            raise ValueError("no inverse")
        old_r, r, old_s, s = a % m, m, 1, 0
        while r:
            q = old_r // r
            old_r, r = r, old_r - q * r
            old_s, s = s, old_s - q * s
        if old_r != 1:
            raise ValueError("no inverse")
        return old_s % m




    def make_rsa(p, q, e):
        """Make a toy RSA key from two primes p and q (not checked) and a public exponent e. n = p * q and phi = (p - 1) * (q - 1). ValueError('bad exponent') unless 1 < e < phi and gcd(e, phi) == 1 (use math.gcd). The private exponent d is the modular inverse of e modulo phi. Return {'n': n, 'e': e, 'd': d}."""
        import math
        n, phi = p * q, (p - 1) * (q - 1)
        if not 1 < e < phi or math.gcd(e, phi) != 1:
            raise ValueError("bad exponent")
        return {"n": n, "e": e, "d": mod_inverse(e, phi)}


    def rsa_encrypt(m, n, e):
        """Encrypt the whole number m with the PUBLIC key (n, e): m ** e % n using mod_pow. ValueError('message too large') unless 0 <= m < n."""
        if not 0 <= m < n:
            raise ValueError("message too large")
        return mod_pow(m, e, n)


    def rsa_decrypt(c, n, d):
        """Decrypt c with the PRIVATE exponent: c ** d % n using mod_pow. ValueError('message too large') unless 0 <= c < n."""
        if not 0 <= c < n:
            raise ValueError("message too large")
        return mod_pow(c, d, n)
  explanation: 'Run the private operation first and the public one second and you have a digital signature: only the key owner could have produced it, and anyone can check it.'
- id: seal
  title: 'Capstone: encrypt and authenticate'
  difficulty: 5
  prompt: 'Encryption hides a message; it does not stop someone **changing** it. A **message authentication code** (**MAC**) proves that the message came from someone who knows the key and was not altered. `xor_encrypt` and `xor_decrypt` are given. Write `seal(plaintext, enc_key, mac_key)`, **encrypt-then-MAC**: encrypt the text with `xor_encrypt` and the `enc_key`. Compute the **tag**: the hexadecimal HMAC-SHA256 of the ciphertext hex **text** (as UTF-8) with the `mac_key` (as UTF-8), using the `hmac` module. Return `ciphertext_hex + ":" + tag`. Write `open_sealed(sealed, enc_key, mac_key)`: `ValueError("bad format")` unless the text has exactly one `":"`. Recompute the tag of the ciphertext part and compare it with the given tag using `hmac.compare_digest`: `ValueError("tampered")` if they differ. **Only then** decrypt and return the text. (Check before decrypting: never act on data that fails the check.)'
  starter: |-
    def xor_encrypt(text, key):
        """A simple stream cipher. Turn the text into UTF-8 bytes, XOR each byte with the next byte of the key (the key text as UTF-8 bytes, repeated over and over) and return the result as lower-case hexadecimal. ValueError('empty key') if the key is empty."""
        if not key:
            raise ValueError("empty key")
        data, k = text.encode("utf-8"), key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).hex()


    def xor_decrypt(hex_text, key):
        """Undo xor_encrypt: read the hexadecimal, XOR with the repeated key and decode as UTF-8. ValueError('empty key') for an empty key and ValueError('bad hex') if the text is not valid hexadecimal."""
        if not key:
            raise ValueError("empty key")
        try:
            data = bytes.fromhex(hex_text)
        except ValueError:
            raise ValueError("bad hex")
        k = key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).decode("utf-8")




    def seal(plaintext, enc_key, mac_key):
        """ENCRYPT-THEN-MAC. Encrypt the text with xor_encrypt and the enc_key. Compute the tag: the hexadecimal HMAC-SHA256 of the ciphertext hex text (as UTF-8) with the mac_key (UTF-8), using the hmac module. Return ciphertext_hex + ':' + tag. A MAC (message authentication code) proves that the message was not changed and that the sender knew the key."""
        pass


    def open_sealed(sealed, enc_key, mac_key):
        """The opposite of seal. ValueError('bad format') unless the text has exactly one ':'. Recompute the tag of the ciphertext part and compare with the given tag using hmac.compare_digest: ValueError('tampered') if they differ. ONLY THEN decrypt (xor_decrypt) and return the text. (Check before decrypting: never act on data that fails the check.)"""
        pass
  tests:
  - name: sealing
    code: |
      import hmac, hashlib
      s = seal("transfer 100 to Bo", "enckey", "mackey")
      cipher, tag = s.split(":")
      assert cipher == xor_encrypt("transfer 100 to Bo", "enckey") and tag == hmac.new(b"mackey", cipher.encode(), hashlib.sha256).hexdigest() and len(tag) == 64
      assert open_sealed(s, "enckey", "mackey") == "transfer 100 to Bo" and open_sealed(seal("", "k", "m"), "k", "m") == "" and open_sealed(seal("héllo", "k", "m"), "k", "m") == "héllo"
      assert seal("a", "x", "m") != seal("a", "y", "m") and seal("a", "k", "m1") != seal("a", "k", "m2") and seal("a", "k", "m") == seal("a", "k", "m")
  - name: tampering
    code: |
      s = seal("transfer 100 to Bo", "enckey", "mackey")
      cipher, tag = s.split(":")
      flipped = cipher[:-2] + ("00" if cipher[-2:] != "00" else "01")
      for bad in (flipped + ":" + tag, cipher + ":" + tag[:-1] + ("0" if tag[-1] != "0" else "1"), cipher + ":" + tag.upper() if tag != tag.upper() else cipher + ":x", cipher + ":"):
          try:
              open_sealed(bad, "enckey", "mackey")
              raise AssertionError("accepted")
          except ValueError as e:
              assert "tampered" in str(e)
      try:
          open_sealed(s, "enckey", "other key")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "tampered" in str(e)
      for bad in ("", "nocolon", "a:b:c"):
          try:
              open_sealed(bad, "k", "m")
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad format" in str(e)
      assert open_sealed(s, "wrongenc", "mackey") != "transfer 100 to Bo"
  hints:
  - The tag covers the ciphertext text, so check it before decrypting.
  - hmac.new(key_bytes, message_bytes, hashlib.sha256).hexdigest()
  solution: |
    def xor_encrypt(text, key):
        """A simple stream cipher. Turn the text into UTF-8 bytes, XOR each byte with the next byte of the key (the key text as UTF-8 bytes, repeated over and over) and return the result as lower-case hexadecimal. ValueError('empty key') if the key is empty."""
        if not key:
            raise ValueError("empty key")
        data, k = text.encode("utf-8"), key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).hex()


    def xor_decrypt(hex_text, key):
        """Undo xor_encrypt: read the hexadecimal, XOR with the repeated key and decode as UTF-8. ValueError('empty key') for an empty key and ValueError('bad hex') if the text is not valid hexadecimal."""
        if not key:
            raise ValueError("empty key")
        try:
            data = bytes.fromhex(hex_text)
        except ValueError:
            raise ValueError("bad hex")
        k = key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).decode("utf-8")




    def seal(plaintext, enc_key, mac_key):
        """ENCRYPT-THEN-MAC. Encrypt the text with xor_encrypt and the enc_key. Compute the tag: the hexadecimal HMAC-SHA256 of the ciphertext hex text (as UTF-8) with the mac_key (UTF-8), using the hmac module. Return ciphertext_hex + ':' + tag. A MAC (message authentication code) proves that the message was not changed and that the sender knew the key."""
        import hmac, hashlib
        cipher = xor_encrypt(plaintext, enc_key)
        tag = hmac.new(mac_key.encode("utf-8"), cipher.encode("utf-8"), hashlib.sha256).hexdigest()
        return cipher + ":" + tag


    def open_sealed(sealed, enc_key, mac_key):
        """The opposite of seal. ValueError('bad format') unless the text has exactly one ':'. Recompute the tag of the ciphertext part and compare with the given tag using hmac.compare_digest: ValueError('tampered') if they differ. ONLY THEN decrypt (xor_decrypt) and return the text. (Check before decrypting: never act on data that fails the check.)"""
        import hmac, hashlib
        parts = sealed.split(":")
        if len(parts) != 2:
            raise ValueError("bad format")
        cipher, tag = parts
        good = hmac.new(mac_key.encode("utf-8"), cipher.encode("utf-8"), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(good.encode(), tag.encode()):
            raise ValueError("tampered")
        return xor_decrypt(cipher, enc_key)
  explanation: 'This is the shape of every secure channel: encrypt for secrecy, authenticate for integrity, and refuse anything that fails the check.'
commonMistakes:
- title: Inventing your own cipher
  explanation: Homemade crypto is almost always breakable.
- title: Reusing a key or nonce
  explanation: It can reveal the messages.
- title: Encrypting without authenticating
  explanation: Attackers can change the ciphertext.
- title: Hard-coding keys in the code
  explanation: Anyone who reads the code has the key.
- title: Confusing hashing with encryption
  explanation: A hash cannot be reversed; encryption can.
summary:
- Symmetric encryption uses one shared key; public-key uses a pair.
- Only the key should be secret, never the method.
- RSA and Diffie-Hellman rest on modular arithmetic.
- Encrypt for secrecy, MAC or sign for integrity.
- Use standard libraries; never invent crypto.
