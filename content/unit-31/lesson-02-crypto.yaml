          assert rsa_decrypt(rsa_encrypt(m, key["n"], key["e"]), key["n"], key["d"]) == m
      k2 = make_rsa(1009, 1013, 65537 % ((1009 - 1) * (1013 - 1)))
      assert all(rsa_decrypt(rsa_encrypt(m, k2["n"], k2["e"]), k2["n"], k2["d"]) == m for m in (2, 99999, 1021116))
  - name: errors and signing
    code: |
      for p, q, e in ((61, 53, 1), (61, 53, 2), (61, 53, 3120), (61, 53, 4000), (61, 53, 0)):
          try:
              make_rsa(p, q, e)
              raise AssertionError("accepted")
          except ValueError as err:
              assert "bad exponent" in str(err)
      key = make_rsa(61, 53, 17)
      for fn, args in ((rsa_encrypt, (3233, 3233, 17)), (rsa_encrypt, (-1, 3233, 17)), (rsa_decrypt, (3233, 3233, 2753)), (rsa_decrypt, (-5, 3233, 2753))):
          try:
              fn(*args)
              raise AssertionError("accepted")
          except ValueError as err:
              assert "message too large" in str(err)
      sig = rsa_decrypt(1234, key["n"], key["d"])
      assert rsa_encrypt(sig, key["n"], key["e"]) == 1234
