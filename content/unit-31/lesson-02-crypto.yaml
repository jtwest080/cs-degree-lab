        if m < 2:
            raise ValueError("no inverse")
        old_r, r, old_s, s = a % m, m, 1, 0
        while r:
            q = old_r // r
            old_r, r = r, old_r - q * r
            old_s, s = s, old_s - q * s
        if old_r != 1:
            raise ValueError("no inverse")
        return old_s % m




