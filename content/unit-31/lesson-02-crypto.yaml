id: u31-crypto
title: Encryption and Authentication
minutes: 110
objective: Understand how data is kept secret and how changes are detected. You will break the Caesar cipher, build a stream cipher with XOR, do the modular arithmetic behind public-key cryptography, make a toy RSA key and combine encryption with a MAC.
outcomes:
- Explain symmetric and public-key encryption
- Break a simple substitution cipher
- Use modular exponentiation and inverses
- Explain why a MAC is needed as well as encryption
sections:
- heading: Ciphers and keys
  body: |-
    **Encryption** turns readable data (**plaintext**) into unreadable data (**ciphertext**) with a **key**; **decryption** reverses it with the key. A good system follows **Kerckhoffs's principle**: everything about the method is public and only the key is secret.

    **Symmetric** encryption uses the **same key** to encrypt and decrypt: **AES** is the standard. It is fast, but both sides must somehow share the key. Simple old ciphers show why strength matters: the **Caesar cipher** (shift letters) has only 25 keys and also falls to **frequency analysis** (in English `e` is the most common letter), and **XOR** with a short repeating key is easily broken, and **reusing** a key is fatal.

    Never invent your own cryptography. Use well-tested libraries and the standard algorithms; the building blocks here are for understanding.
- heading: Public-key cryptography
  body: |-
    **Asymmetric** (**public-key**) cryptography uses a **pair** of keys. Anyone may know the **public key** and use it to encrypt a message that only the owner of the **private key** can read. Run the other way, the owner's private key makes a **digital signature** that anyone can check with the public key.

    **RSA** builds on **modular arithmetic** (remainders). Multiplying two big primes `p * q` is easy; finding `p` and `q` from the product is believed to be very hard. The key facts: `m ** e % n` is quick with **square and multiply**, and a **modular inverse** (found with the extended Euclidean algorithm) gives the private exponent. **Diffie-Hellman** lets two people agree on a shared secret over an open line: each sends `g ** secret % p`, and both then compute the same `g ** (a * b) % p`.

    Public-key operations are slow, so real systems (**TLS**, which protects every `https` page) use them only to agree on a symmetric key, then switch to fast AES. Certificates tie a public key to a website's name, signed by an authority that your browser trusts.
- heading: 'Integrity: hashes, MACs and signatures'
  body: |-
    Encryption alone hides a message but does not stop someone from changing the ciphertext (**tampering**). To detect changes, add a **message authentication code** (**MAC**): a fingerprint computed from the message *and a secret key* (**HMAC** uses SHA-256 inside). Only someone who knows the key can compute a valid tag. The receiver checks the tag first and **refuses** anything that does not match; this order, **encrypt-then-MAC**, is the safe one. Use constant-time comparison for the check.

    Summary of tools: a **hash** detects accidental changes; a **MAC** detects changes by anyone without the key; a **signature** also proves *who* sent it and cannot be denied. Modern systems use authenticated encryption (AES-GCM or ChaCha20-Poly1305) which does encryption and MAC in one step.
examples:
- title: Old ciphers and XOR
  intro: Break a Caesar cipher by counting letters and hide a message with XOR.
  code: |
    def caesar(text, shift):
        """The Caesar cipher: move every LETTER `shift` places along the alphabet, wrapping around (z + 1 gives a). Keep the case; digits, spaces and punctuation stay. A negative shift or one larger than 25 also works (use % 26)."""
        out = []
        for ch in text:
            if "a" <= ch <= "z":
                out.append(chr((ord(ch) - 97 + shift) % 26 + 97))
            elif "A" <= ch <= "Z":
                out.append(chr((ord(ch) - 65 + shift) % 26 + 65))
            else:
                out.append(ch)
        return "".join(out)


    def break_caesar(ciphertext):
        """Break the cipher without the key by FREQUENCY ANALYSIS. Try every shift from 0 to 25 to decrypt (caesar(ciphertext, -shift)) and score each result by counting its letters that are in 'etaoinshr' (ignoring case). Return (best shift, decrypted text); on a tie take the smallest shift."""
        best = None
        for shift in range(26):
            plain = caesar(ciphertext, -shift)
            score = sum(1 for c in plain.lower() if c in "etaoinshr")
            if best is None or score > best[0]:
                best = (score, shift, plain)
        return best[1], best[2]


    def xor_encrypt(text, key):
        """A simple stream cipher. Turn the text into UTF-8 bytes, XOR each byte with the next byte of the key (the key text as UTF-8 bytes, repeated over and over) and return the result as lower-case hexadecimal. ValueError('empty key') if the key is empty."""
        if not key:
            raise ValueError("empty key")
        data, k = text.encode("utf-8"), key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).hex()


    def xor_decrypt(hex_text, key):
        """Undo xor_encrypt: read the hexadecimal, XOR with the repeated key and decode as UTF-8. ValueError('empty key') for an empty key and ValueError('bad hex') if the text is not valid hexadecimal."""
        if not key:
            raise ValueError("empty key")
        try:
            data = bytes.fromhex(hex_text)
        except ValueError:
            raise ValueError("bad hex")
        k = key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).decode("utf-8")

    secret = caesar("Meet at the old bridge at midnight and bring the documents", 9)
    print(secret)
    print(break_caesar(secret))
    hidden = xor_encrypt("launch codes", "k3y")
    print(hidden)
    print(xor_decrypt(hidden, "k3y"))
  output: |
    Vnnc jc cqn xum karmpn jc vrmwrpqc jwm karwp cqn mxldvnwcb
    (9, 'Meet at the old bridge at midnight and bring the documents')
    07520c0550114b50160f560a
    launch codes
  lines:
  - line: 45
    note: The text is unreadable but the letter pattern is intact.
  - line: 46
    note: Frequency analysis finds the shift and the text.
  - line: 48
    note: Hexadecimal bytes.
  - line: 49
    note: The same key restores the text.
- title: RSA, key agreement and sealing
  intro: A textbook key pair, Diffie-Hellman with tiny numbers and tamper detection.
  code: |
    def mod_pow(base, exp, mod):
        """base ** exp % mod without computing the huge power: SQUARE AND MULTIPLY. Keep a result (start 1) and walk through the bits of exp from the lowest: when the bit is 1 multiply the result by base (mod mod); then square base (mod mod). ValueError('bad parameters') if mod < 1 or exp < 0. The answer for mod == 1 is 0. (Do not use the three-argument pow.)"""
        if mod < 1 or exp < 0:
            raise ValueError("bad parameters")
        result, base = 1 % mod, base % mod
        while exp:
            if exp & 1:
                result = result * base % mod
            base = base * base % mod
            exp >>= 1
        return result


    def mod_inverse(a, m):
        """The number x with 0 <= x < m and a * x % m == 1 (the MODULAR INVERSE), found with the extended Euclidean algorithm. ValueError('no inverse') when gcd(a, m) is not 1 or m < 2."""
        if m < 2:
            raise ValueError("no inverse")
        old_r, r, old_s, s = a % m, m, 1, 0
        while r:
            q = old_r // r
            old_r, r = r, old_r - q * r
            old_s, s = s, old_s - q * s
        if old_r != 1:
            raise ValueError("no inverse")
        return old_s % m


    def make_rsa(p, q, e):
        """Make a toy RSA key from two primes p and q (not checked) and a public exponent e. n = p * q and phi = (p - 1) * (q - 1). ValueError('bad exponent') unless 1 < e < phi and gcd(e, phi) == 1 (use math.gcd). The private exponent d is the modular inverse of e modulo phi. Return {'n': n, 'e': e, 'd': d}."""
        import math
        n, phi = p * q, (p - 1) * (q - 1)
        if not 1 < e < phi or math.gcd(e, phi) != 1:
            raise ValueError("bad exponent")
        return {"n": n, "e": e, "d": mod_inverse(e, phi)}


    def rsa_encrypt(m, n, e):
        """Encrypt the whole number m with the PUBLIC key (n, e): m ** e % n using mod_pow. ValueError('message too large') unless 0 <= m < n."""
        if not 0 <= m < n:
            raise ValueError("message too large")
        return mod_pow(m, e, n)


    def rsa_decrypt(c, n, d):
        """Decrypt c with the PRIVATE exponent: c ** d % n using mod_pow. ValueError('message too large') unless 0 <= c < n."""
        if not 0 <= c < n:
            raise ValueError("message too large")
        return mod_pow(c, d, n)


    def seal(plaintext, enc_key, mac_key):
        """ENCRYPT-THEN-MAC. Encrypt the text with xor_encrypt and the enc_key. Compute the tag: the hexadecimal HMAC-SHA256 of the ciphertext hex text (as UTF-8) with the mac_key (UTF-8), using the hmac module. Return ciphertext_hex + ':' + tag. A MAC (message authentication code) proves that the message was not changed and that the sender knew the key."""
        import hmac, hashlib
        cipher = xor_encrypt(plaintext, enc_key)
        tag = hmac.new(mac_key.encode("utf-8"), cipher.encode("utf-8"), hashlib.sha256).hexdigest()
        return cipher + ":" + tag


    def open_sealed(sealed, enc_key, mac_key):
        """The opposite of seal. ValueError('bad format') unless the text has exactly one ':'. Recompute the tag of the ciphertext part and compare with the given tag using hmac.compare_digest: ValueError('tampered') if they differ. ONLY THEN decrypt (xor_decrypt) and return the text. (Check before decrypting: never act on data that fails the check.)"""
        import hmac, hashlib
        parts = sealed.split(":")
        if len(parts) != 2:
            raise ValueError("bad format")
        cipher, tag = parts
        good = hmac.new(mac_key.encode("utf-8"), cipher.encode("utf-8"), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(good.encode(), tag.encode()):
            raise ValueError("tampered")
        return xor_decrypt(cipher, enc_key)


    def xor_encrypt(text, key):
        """A simple stream cipher. Turn the text into UTF-8 bytes, XOR each byte with the next byte of the key (the key text as UTF-8 bytes, repeated over and over) and return the result as lower-case hexadecimal. ValueError('empty key') if the key is empty."""
        if not key:
            raise ValueError("empty key")
        data, k = text.encode("utf-8"), key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).hex()


    def xor_decrypt(hex_text, key):
        """Undo xor_encrypt: read the hexadecimal, XOR with the repeated key and decode as UTF-8. ValueError('empty key') for an empty key and ValueError('bad hex') if the text is not valid hexadecimal."""
        if not key:
            raise ValueError("empty key")
        try:
            data = bytes.fromhex(hex_text)
        except ValueError:
            raise ValueError("bad hex")
        k = key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).decode("utf-8")

    key = make_rsa(61, 53, 17)
    print(key)
    cipher = rsa_encrypt(65, key["n"], key["e"])
    print("encrypted:", cipher, "decrypted:", rsa_decrypt(cipher, key["n"], key["d"]))
    p, g = 23, 5
    a, b = 6, 15
    A, B = mod_pow(g, a, p), mod_pow(g, b, p)
    print("public values:", A, B, "shared secrets:", mod_pow(B, a, p), mod_pow(A, b, p))
    sealed = seal("pay Bo 10", "enc", "mac")
    print(open_sealed(sealed, "enc", "mac"))
    altered = "00" + sealed[2:]
    try:
        open_sealed(altered, "enc", "mac")
    except ValueError as e:
        print("error:", e)
  output: |
    {'n': 3233, 'e': 17, 'd': 2753}
    encrypted: 2790 decrypted: 65
    public values: 8 19 shared secrets: 2 2
    pay Bo 10
    error: tampered
  lines:
  - line: 92
    note: The classic textbook key.
  - line: 94
    note: Public key encrypts, private key decrypts.
  - line: 98
    note: Both sides compute the same shared secret without sending it.
  - line: 100
    note: A good message opens.
  - line: 105
    note: A changed message is refused.
