  question: Write `shift_letter(ch, k)` returning the lower-case letter `ch` moved `k` places along the alphabet with wrapping (`shift_letter('z', 1)` is `'a'`).
  starter: |
    def shift_letter(ch, k):
        pass
  tests:
  - name: shift
    code: |
      assert shift_letter("a", 3) == "d" and shift_letter("z", 1) == "a" and shift_letter("c", -3) == "z" and shift_letter("m", 26) == "m"
  solution: |
    def shift_letter(ch, k):
        return chr((ord(ch) - 97 + k) % 26 + 97)
