exercises:
- id: caesar
  title: The Caesar cipher
  difficulty: 3
  prompt: 'The oldest cipher: move every letter a fixed number of places along the alphabet. Write `caesar(text, shift)`: shift every **letter**, wrapping around (`z` + 1 gives `a`), keep upper/lower case, and leave digits, spaces and punctuation alone. Negative shifts and shifts above 25 also work (use `% 26`). Then write `break_caesar(ciphertext)`: break it without the key by **frequency analysis**. Try every shift from 0 to 25 to decrypt (`caesar(ciphertext, -shift)`) and score each result by counting its letters that are in `"etaoinshr"` (ignoring case). Return `(best shift, decrypted text)`; on a tie take the smallest shift.'
  starter: |-
    def caesar(text, shift):
        """The Caesar cipher: move every LETTER `shift` places along the alphabet, wrapping around (z + 1 gives a). Keep the case; digits, spaces and punctuation stay. A negative shift or one larger than 25 also works (use % 26)."""
        pass


    def break_caesar(ciphertext):
        """Break the cipher without the key by FREQUENCY ANALYSIS. Try every shift from 0 to 25 to decrypt (caesar(ciphertext, -shift)) and score each result by counting its letters that are in 'etaoinshr' (ignoring case). Return (best shift, decrypted text); on a tie take the smallest shift."""
        pass
  tests:
  - name: shifting
    code: |
      assert caesar("abc xyz", 3) == "def abc" and caesar("Hello, World!", 13) == "Uryyb, Jbeyq!" and caesar("Uryyb, Jbeyq!", 13) == "Hello, World!" and caesar("abc", 0) == "abc" and caesar("abc", 26) == "abc" and caesar("abc", -1) == "zab" and caesar("Zz 9!", 1) == "Aa 9!" and caesar("", 5) == "" and caesar("abc", 29) == "def"
      assert caesar(caesar("Attack at dawn", 7), -7) == "Attack at dawn"
  - name: breaking it
    code: |
      secret = caesar("The enemy attacks at dawn from the north, so hold the line and send reinforcements", 11)
      assert secret != "The enemy attacks at dawn from the north, so hold the line and send reinforcements"
      shift, plain = break_caesar(secret)
      assert shift == 11 and plain == "The enemy attacks at dawn from the north, so hold the line and send reinforcements"
      for s in (1, 5, 19, 25):
          text = "Meet me at the station at noon and bring the train tickets, there is no time to waste"
          assert break_caesar(caesar(text, s)) == (s, text)
      assert break_caesar("") == (0, "")
  hints:
  - Use ord and chr with an offset of 97 (a) or 65 (A).
  - Decrypting with the right shift gives the text with the most common English letters.
  solution: |
    def caesar(text, shift):
        """The Caesar cipher: move every LETTER `shift` places along the alphabet, wrapping around (z + 1 gives a). Keep the case; digits, spaces and punctuation stay. A negative shift or one larger than 25 also works (use % 26)."""
        out = []
        for ch in text:
            if "a" <= ch <= "z":
                out.append(chr((ord(ch) - 97 + shift) % 26 + 97))
            elif "A" <= ch <= "Z":
                out.append(chr((ord(ch) - 65 + shift) % 26 + 65))
            else:
                out.append(ch)
        return "".join(out)


    def break_caesar(ciphertext):
        """Break the cipher without the key by FREQUENCY ANALYSIS. Try every shift from 0 to 25 to decrypt (caesar(ciphertext, -shift)) and score each result by counting its letters that are in 'etaoinshr' (ignoring case). Return (best shift, decrypted text); on a tie take the smallest shift."""
        best = None
        for shift in range(26):
            plain = caesar(ciphertext, -shift)
            score = sum(1 for c in plain.lower() if c in "etaoinshr")
            if best is None or score > best[0]:
                best = (score, shift, plain)
        return best[1], best[2]
  explanation: 'Only 25 keys: a computer breaks it instantly. Frequency analysis also breaks any cipher that maps each letter to one other letter.'
- id: xor
  title: A stream cipher
  difficulty: 4
  prompt: 'Real ciphers combine the message with a **keystream**. The simplest way is **XOR** (exclusive or): `a ^ b` flips the bits of `a` where `b` has ones, and XOR with the same value again undoes it. Write `xor_encrypt(text, key)`: turn the text into UTF-8 bytes, XOR each byte with the next byte of the key (the key as UTF-8 bytes, **repeated** over and over) and return the result as lower-case hexadecimal. `ValueError("empty key")` if the key is empty. Write `xor_decrypt(hex_text, key)`: read the hexadecimal, XOR with the repeated key and decode as UTF-8. `ValueError("empty key")` for an empty key and `ValueError("bad hex")` if the text is not valid hexadecimal.'
  starter: |-
    def xor_encrypt(text, key):
        """A simple stream cipher. Turn the text into UTF-8 bytes, XOR each byte with the next byte of the key (the key text as UTF-8 bytes, repeated over and over) and return the result as lower-case hexadecimal. ValueError('empty key') if the key is empty."""
        pass


    def xor_decrypt(hex_text, key):
        """Undo xor_encrypt: read the hexadecimal, XOR with the repeated key and decode as UTF-8. ValueError('empty key') for an empty key and ValueError('bad hex') if the text is not valid hexadecimal."""
        pass
  tests:
  - name: round trip
    code: |
      assert xor_encrypt("A", "A") == "00" and xor_encrypt("abc", "k") == bytes([ord(c) ^ ord("k") for c in "abc"]).hex() and xor_encrypt("", "key") == "" and xor_encrypt("Hi", "ab") == "290b"
      for text, key in (("attack at dawn", "lemon"), ("héllo wörld", "k"), ("short", "a much longer key than the message"), ("", "x")):
          assert xor_decrypt(xor_encrypt(text, key), key) == text
      assert xor_encrypt("hello", "k") != xor_encrypt("hello", "j") and len(xor_encrypt("hello", "k")) == 10
  - name: errors and weakness
    code: |
      for fn, args in ((xor_encrypt, ("x", "")), (xor_decrypt, ("00", ""))):
          try:
              fn(*args)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "empty key" in str(e)
      for bad in ("zz", "abc", "0g"):
          try:
              xor_decrypt(bad, "k")
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad hex" in str(e)
      a, b = xor_encrypt("secret one", "key"), xor_encrypt("secret two", "key")
      x = bytes(p ^ q for p, q in zip(bytes.fromhex(a), bytes.fromhex(b)))
      assert x == bytes(p ^ q for p, q in zip(b"secret one", b"secret two"))
  hints:
  - bytes([...]) and .hex() / bytes.fromhex() convert between bytes and hex text.
  - key[i % len(key)] repeats the key.
  solution: |
    def xor_encrypt(text, key):
        """A simple stream cipher. Turn the text into UTF-8 bytes, XOR each byte with the next byte of the key (the key text as UTF-8 bytes, repeated over and over) and return the result as lower-case hexadecimal. ValueError('empty key') if the key is empty."""
        if not key:
            raise ValueError("empty key")
        data, k = text.encode("utf-8"), key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).hex()


    def xor_decrypt(hex_text, key):
        """Undo xor_encrypt: read the hexadecimal, XOR with the repeated key and decode as UTF-8. ValueError('empty key') for an empty key and ValueError('bad hex') if the text is not valid hexadecimal."""
        if not key:
            raise ValueError("empty key")
        try:
            data = bytes.fromhex(hex_text)
        except ValueError:
            raise ValueError("bad hex")
        k = key.encode("utf-8")
        return bytes(b ^ k[i % len(k)] for i, b in enumerate(data)).decode("utf-8")
  explanation: 'Reusing a key with XOR is fatal: XOR of two ciphertexts equals XOR of the two messages, with the key gone. That is why a key must be used only once (the one-time pad) or replaced by a long unpredictable keystream.'
- id: modmath
  title: Modular arithmetic
  difficulty: 5
  prompt: 'Public-key cryptography is built on arithmetic with remainders. Write `mod_pow(base, exp, mod)`: `base ** exp % mod` **without** computing the huge power, by **square and multiply**: keep a `result` (start at 1); walk through the bits of `exp` from the lowest: when the bit is 1 multiply the result by `base` (mod `mod`); then square `base` (mod `mod`). `ValueError("bad parameters")` if `mod < 1` or `exp < 0`. The answer for `mod == 1` is `0`. Do not use the three-argument `pow`. Write `mod_inverse(a, m)`: the number `x` with `0 <= x < m` and `a * x % m == 1`, found with the **extended Euclidean algorithm**. `ValueError("no inverse")` when `gcd(a, m)` is not 1 or `m < 2`.'
  starter: |-
    def mod_pow(base, exp, mod):
        """base ** exp % mod without computing the huge power: SQUARE AND MULTIPLY. Keep a result (start 1) and walk through the bits of exp from the lowest: when the bit is 1 multiply the result by base (mod mod); then square base (mod mod). ValueError('bad parameters') if mod < 1 or exp < 0. The answer for mod == 1 is 0. (Do not use the three-argument pow.)"""
        pass


    def mod_inverse(a, m):
        """The number x with 0 <= x < m and a * x % m == 1 (the MODULAR INVERSE), found with the extended Euclidean algorithm. ValueError('no inverse') when gcd(a, m) is not 1 or m < 2."""
        pass
  tests:
  - name: powers
    code: |
      assert mod_pow(2, 10, 1000) == 24 and mod_pow(3, 0, 7) == 1 and mod_pow(0, 5, 7) == 0 and mod_pow(5, 3, 1) == 0 and mod_pow(7, 1, 100) == 7 and mod_pow(4, 13, 497) == 445 and mod_pow(-2, 3, 5) == 2
      assert mod_pow(2, 1000, 1000007) == pow(2, 1000, 1000007) and mod_pow(123456789, 987654321, 1000000007) == pow(123456789, 987654321, 1000000007) and mod_pow(10, 10 ** 18, 97) == pow(10, 10 ** 18, 97)
      for args in ((2, 3, 0), (2, -1, 5)):
          try:
              mod_pow(*args)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad parameters" in str(e)
  - name: inverses
    code: |
      assert mod_inverse(3, 7) == 5 and mod_inverse(17, 3120) == 2753 and mod_inverse(1, 5) == 1 and mod_inverse(10, 17) == 12 and mod_inverse(-3, 7) == 2 and mod_inverse(8, 15) == 2
      for a in range(1, 25):
          if a not in (5, 10, 15, 20):
              assert a * mod_inverse(a, 25) % 25 == 1
      for a, m in ((4, 8), (6, 9), (0, 5), (5, 25), (3, 1), (3, 0)):
          try:
              mod_inverse(a, m)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "no inverse" in str(e)
  hints:
  - Square and multiply needs only about log2(exp) steps.
  - Track the coefficient of a in the extended Euclid loop.
  solution: |
    def mod_pow(base, exp, mod):
        """base ** exp % mod without computing the huge power: SQUARE AND MULTIPLY. Keep a result (start 1) and walk through the bits of exp from the lowest: when the bit is 1 multiply the result by base (mod mod); then square base (mod mod). ValueError('bad parameters') if mod < 1 or exp < 0. The answer for mod == 1 is 0. (Do not use the three-argument pow.)"""
        if mod < 1 or exp < 0:
            raise ValueError("bad parameters")
        result, base = 1 % mod, base % mod
        while exp:
            if exp & 1:
                result = result * base % mod
            base = base * base % mod
            exp >>= 1
        return result


    def mod_inverse(a, m):
        """The number x with 0 <= x < m and a * x % m == 1 (the MODULAR INVERSE), found with the extended Euclidean algorithm. ValueError('no inverse') when gcd(a, m) is not 1 or m < 2."""
        if m < 2:
            raise ValueError("no inverse")
        old_r, r, old_s, s = a % m, m, 1, 0
        while r:
            q = old_r // r
            old_r, r = r, old_r - q * r
            old_s, s = s, old_s - q * s
        if old_r != 1:
            raise ValueError("no inverse")
        return old_s % m
  explanation: Modular exponentiation is easy; going backwards (the discrete logarithm) and factoring large numbers are believed to be hard. That gap is the foundation of public-key cryptography.
- id: rsa
  title: Toy RSA
  difficulty: 5
  prompt: '**RSA** uses two keys: a **public** key anyone can use to encrypt, and a **private** key that only the owner can use to decrypt. `mod_pow` and `mod_inverse` are given. Write `make_rsa(p, q, e)`: from two primes `p` and `q` (not checked) and a public exponent `e`: `n = p * q` and `phi = (p - 1) * (q - 1)`. `ValueError("bad exponent")` unless `1 < e < phi` and `gcd(e, phi) == 1` (use `math.gcd`). The private exponent `d` is the modular inverse of `e` modulo `phi`. Return `{"n": n, "e": e, "d": d}`. Write `rsa_encrypt(m, n, e)`: `m ** e % n` using `mod_pow` (`ValueError("message too large")` unless `0 <= m < n`), and `rsa_decrypt(c, n, d)`: `c ** d % n` (same check for `c`). Real keys use primes with hundreds of digits.'
  starter: |-
    def mod_pow(base, exp, mod):
        """base ** exp % mod without computing the huge power: SQUARE AND MULTIPLY. Keep a result (start 1) and walk through the bits of exp from the lowest: when the bit is 1 multiply the result by base (mod mod); then square base (mod mod). ValueError('bad parameters') if mod < 1 or exp < 0. The answer for mod == 1 is 0. (Do not use the three-argument pow.)"""
        if mod < 1 or exp < 0:
            raise ValueError("bad parameters")
