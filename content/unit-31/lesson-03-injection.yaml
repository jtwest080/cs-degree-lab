- title: Paths, commands and redirects
  intro: Refuse the ../ trick, quote a hostile argument and check redirect targets.
  code: |
    def safe_join(base, user_path):
        """Join a user-supplied path onto a base folder without allowing escape (PATH TRAVERSAL: ../../etc/passwd). Use posixpath. ValueError('bad path') if user_path contains a NUL character ('\x00') or starts with '/' (absolute) or a backslash. Otherwise normalise posixpath.join(base, user_path) with posixpath.normpath and make sure the result is the base itself or inside it (the result must equal normpath(base) or start with normpath(base) + '/'); if not raise ValueError('outside base'). Return the normalised path."""
        import posixpath
        if "\x00" in user_path or user_path.startswith("/") or user_path.startswith("\\"):
            raise ValueError("bad path")
        root = posixpath.normpath(base)
        full = posixpath.normpath(posixpath.join(root, user_path))
        if full != root and not full.startswith(root.rstrip("/") + "/"):
            raise ValueError("outside base")
        return full


    def quote_arg(text):
        """Make text safe as ONE argument for a Unix shell: wrap it in single quotes, and write every single quote inside it as '\\'' (end the quote, an escaped quote, start again). The empty text becomes ''. Example: it's -> 'it'\\''s'."""
        return "'" + text.replace("'", "'\\''") + "'"


    def build_command(program, args, allowed):
        """Build a shell command line. The program must be in the list `allowed` (ValueError('program not allowed') otherwise: never run a program the user names). Return the program, then every argument made safe with quote_arg, joined with single spaces."""
        if program not in allowed:
            raise ValueError("program not allowed")
        return " ".join([program] + [quote_arg(a) for a in args])


    def safe_redirect(target, allowed_hosts):
        """After login a site may send you to the page in a 'next' parameter. An attacker can try to send you to THEIR site (OPEN REDIRECT). Return target when it is safe and '/' otherwise. Safe means: (1) a path on this site: it starts with a single '/' and the second character is not '/' or a backslash, and the text has no control characters (characters below ' ', or a backslash anywhere); or (2) an absolute 'https' URL (scheme compared ignoring case) whose host name (urllib.parse.urlparse(target).hostname, which is lower case and ignores any user@ part) is exactly one of allowed_hosts (given in lower case). Anything else ('//evil.com', 'javascript:alert(1)', 'http://...', 'https://good.com.evil.com', '', ...) gives '/'."""
        from urllib.parse import urlparse
        if not target or any(ord(c) < 32 for c in target) or "\\" in target:
            return "/"
        if target.startswith("/"):
            return target if not target.startswith("//") else "/"
        parsed = urlparse(target)
        if parsed.scheme.lower() == "https" and parsed.hostname in allowed_hosts:
            return target
        return "/"

    for p in ("notes/a.txt", "../../etc/passwd", "/etc/passwd"):
        try:
            print(p, "->", safe_join("/srv/files", p))
        except ValueError as e:
            print(p, "->", "refused:", e)
    print(build_command("ping", ["-c", "1", "x; rm -rf ~"], ["ping"]))
    hosts = {"example.com"}
    for t in ("/account", "//evil.com", "https://example.com/pay", "https://example.com@evil.com/"):
        print(t, "->", safe_redirect(t, hosts))
  output: |
    notes/a.txt -> /srv/files/notes/a.txt
    ../../etc/passwd -> refused: outside base
    /etc/passwd -> refused: bad path
    ping '-c' '1' 'x; rm -rf ~'
    /account -> /account
    //evil.com -> /
    https://example.com/pay -> https://example.com/pay
    https://example.com@evil.com/ -> /
