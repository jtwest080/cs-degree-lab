id: u31-injection
title: Injection and Untrusted Input
minutes: 110
objective: 'See how most real attacks work: **untrusted input** changes the meaning of a command. You will escape HTML, use SQL placeholders, confine file paths, quote shell arguments and check redirect targets.'
outcomes:
- Explain injection in one sentence
- Prevent XSS with output escaping
- Prevent SQL injection with placeholders
- Stop path traversal and command injection
- Avoid open redirects
sections:
- heading: One idea behind many bugs
  body: |-
    **Injection** happens when a program builds a command, query or page by gluing together text, and some of that text comes from an **untrusted** source (a form field, URL, file name, header). If the attacker's text contains characters that have a special meaning in the target language, the **data** becomes **code**.

    The same bug appears under different names: **SQL injection** (data becomes SQL), **cross-site scripting** (**XSS**, data becomes JavaScript in someone's browser), **command injection** (data becomes shell commands), **path traversal** (`../` escapes a folder), **open redirect** (the data picks where you go). The cure is also the same: **keep data and code apart**.

    1. Prefer APIs that take the data **separately** from the command: SQL placeholders, `subprocess.run([...])` without a shell, template engines that escape.
    2. If you must build text, **escape or quote** for the exact target language (HTML escaping is different from shell quoting).
    3. Check against an **allow-list** (what is permitted), not a block-list (what is forbidden): attackers find the case you forgot.
    4. Validate the **final** form after decoding and normalising, not the text as typed.
- heading: The classic attacks
  body: |-
    **SQL injection.** A query built as `"... WHERE name = '" + name + "'"` with the input `x' OR '1'='1` becomes `WHERE name = 'x' OR '1'='1'`, true for every row. Worse inputs end the statement and add `DROP TABLE`. With a **placeholder** (`WHERE name = ?` and the value passed separately) the database treats the whole input as a name. An **ORM** (object-relational mapper) normally does this for you.

    **Cross-site scripting.** A comment `<script>...</script>` shown without escaping runs in every visitor's browser and can steal their session. Escape `& < > " '` when writing text into HTML; modern frameworks do it by default. A **Content Security Policy** header adds a second layer by telling the browser which scripts may run.

    **Path traversal** reads files outside the intended folder. Normalise the path and check it is still **inside** the base folder. **Command injection** runs extra commands: avoid shells, or quote every argument. **Open redirects** let phishing links start on your trusted domain: only redirect to your own pages or an allow-list.

    > **Tip:** Treat all input as hostile until it is checked, including data from your own database, other services and uploaded files.
examples:
- title: XSS and SQL injection
  intro: A script in a comment, and a classic injection against a table of users.
  code: |
    def escape_html(text):
        """Make text safe to put inside an HTML page. Replace & with &amp; FIRST, then < with &lt;, > with &gt;, the double quote with &quot; and the single quote with &#x27;. (Do the ampersand first, or you would escape your own entities.)"""
        return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;").replace("'", "&#x27;")


    def render_comment(name, text):
        """The HTML for a comment: '<p><b>NAME</b>: TEXT</p>' where NAME and TEXT are both passed through escape_html. Line breaks in the text (\n) become '<br>' AFTER the escaping."""
        return "<p><b>" + escape_html(name) + "</b>: " + escape_html(text).replace("\n", "<br>") + "</p>"


    class Cursor:
        """The result of a query."""
        def __init__(self, rows):
            self.rows = rows

        def fetchall(self):
            return list(self.rows)

        def fetchone(self):
            return self.rows[0] if self.rows else None

        def __iter__(self):
            return iter(self.rows)


    def tokenize_sql(sql):
        """Split SQL text into (kind, value) tokens. A quote starts a string; two quotes inside a string mean one quote. Anything unknown (such as ; or --) is a syntax error."""
        tokens, i = [], 0
        while i < len(sql):
            c = sql[i]
            if c.isspace():
                i += 1
            elif c == "'":
                j, text = i + 1, ""
                while True:
                    if j >= len(sql):
                        raise ValueError("syntax error: unterminated string")
                    if sql[j] == "'":
                        if j + 1 < len(sql) and sql[j + 1] == "'":
                            text += "'"
                            j += 2
                            continue
                        break
                    text += sql[j]
                    j += 1
                tokens.append(("str", text))
                i = j + 1
            elif c.isalpha() or c == "_":
                j = i
                while j < len(sql) and (sql[j].isalnum() or sql[j] == "_"):
                    j += 1
                tokens.append(("word", sql[i:j]))
                i = j
            elif c.isdigit():
                j = i
                while j < len(sql) and sql[j].isdigit():
                    j += 1
                tokens.append(("num", int(sql[i:j])))
                i = j
            elif sql[i:i + 2] in (">=", "<=", "!=", "<>"):
                tokens.append(("op", sql[i:i + 2]))
                i += 2
            elif c in "=<>?,":
                tokens.append(("op", c))
                i += 1
            else:
                raise ValueError("syntax error near " + repr(c))
        return tokens


    class Conn:
        """A tiny pretend database: one table `users` and a small part of SQL (SELECT columns FROM users [WHERE ...] [ORDER BY column [DESC]], with = != < <= > >= LIKE ... ESCAPE, AND, OR, strings, numbers and ? placeholders). Python's real sqlite3 module works the same way; this stand-in runs everywhere."""
        COLUMNS = ["name", "age", "secret"]

        def __init__(self, rows):
            self.rows = rows

        def execute(self, sql, params=()):
            import re
            tokens = tokenize_sql(sql)
            values = list(params)
            for k, (kind, value) in enumerate(tokens):
                if (kind, value) == ("op", "?"):
                    if not values:
                        raise ValueError("wrong number of parameters")
                    tokens[k] = ("val", values.pop(0))
            if values:
                raise ValueError("wrong number of parameters")
            pos = [0]

            def peek():
                return tokens[pos[0]] if pos[0] < len(tokens) else (None, None)

            def keyword(word):
                kind, value = peek()
                if kind == "word" and value.upper() == word:
                    pos[0] += 1
                    return True
                return False

            def need(word):
                if not keyword(word):
                    raise ValueError("syntax error: expected " + word)

            def column():
                kind, value = peek()
                if kind != "word" or value.lower() not in self.COLUMNS:
                    raise ValueError("no such column: " + str(value))
                pos[0] += 1
                return value.lower()

            def operand():
                kind, value = peek()
                if kind in ("str", "num", "val"):
                    pos[0] += 1
                    return lambda row: value
                name = column()
                return lambda row: row[name]

            def comparison():
                left = operand()
                kind, value = peek()
                if kind == "word" and value.upper() == "LIKE":
                    pos[0] += 1
                    right = operand()
                    esc = None
                    if keyword("ESCAPE"):
                        esc = operand()

                    def like(row):
                        pattern, e, out, i = right(row), (esc(row) if esc else None), "", 0
                        while i < len(pattern):
                            ch = pattern[i]
                            if e and ch == e and i + 1 < len(pattern):
                                out += re.escape(pattern[i + 1])
                                i += 1
                            elif ch == "%":
                                out += ".*"
                            elif ch == "_":
                                out += "."
                            else:
                                out += re.escape(ch)
                            i += 1
                        return re.fullmatch(out, str(left(row)), re.I | re.S) is not None
                    return like
                if kind != "op" or value not in ("=", "!=", "<>", "<", "<=", ">", ">="):
                    raise ValueError("syntax error: expected a comparison")
                pos[0] += 1
                right = operand()

                def compare(row):
                    a, b = left(row), right(row)
                    try:
                        return {"=": a == b, "!=": a != b, "<>": a != b, "<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b}[value]
                    except TypeError:
                        return False
                return compare

            def conjunction():
                parts = [comparison()]
                while keyword("AND"):
                    parts.append(comparison())
                return lambda row: all(p(row) for p in parts)

            def expression():
                parts = [conjunction()]
                while keyword("OR"):
                    parts.append(conjunction())
                return lambda row: any(p(row) for p in parts)

            need("SELECT")
            chosen = [column()]
            while peek() == ("op", ","):
                pos[0] += 1
                chosen.append(column())
            need("FROM")
            need("USERS")
            test = expression() if keyword("WHERE") else (lambda row: True)
            order, descending = None, False
            if keyword("ORDER"):
                need("BY")
                order = column()
                if keyword("DESC"):
                    descending = True
                else:
                    keyword("ASC")
            if pos[0] != len(tokens):
                raise ValueError("syntax error near " + repr(peek()[1]))
            rows = [r for r in self.rows if test(r)]
            if order:
                rows = sorted(rows, key=lambda r: r[order], reverse=descending)
            return Cursor([tuple(r[c] for c in chosen) for r in rows])


    def make_db():
        """A small in-memory database for the examples: the table users has the columns name, age and secret."""
        return Conn([{"name": n, "age": a, "secret": s} for n, a, s in [("ada", 36, "s1"), ("bo", 17, "s2"), ("cy", 52, "s3"), ("o'brien", 40, "s4")]])


    def find_users(conn, name, min_age):
        """Return the sorted list of the NAMES of users whose name equals `name` and whose age is at least min_age. Build the query with PLACEHOLDERS: conn.execute('SELECT name FROM users WHERE name = ? AND age >= ?', (name, min_age)). Never put the values into the SQL text with + or f-strings: that allows SQL INJECTION, where input such as x' OR '1'='1 changes the meaning of the query."""
        rows = conn.execute("SELECT name FROM users WHERE name = ? AND age >= ?", (name, min_age)).fetchall()
        return sorted(r[0] for r in rows)


    def order_clause(column, allowed):
        """Placeholders cannot be used for column names, so use an ALLOW-LIST. Return 'ORDER BY ' + column when the column is in the list `allowed`, otherwise raise ValueError('column not allowed'). The comparison is exact (case matters)."""
        if column not in allowed:
            raise ValueError("column not allowed")
        return "ORDER BY " + column

    comment = "<script>alert('stolen cookies')</script>"
    print(render_comment("Mallory", comment))
    db = make_db()
    attack = "x' OR '1'='1"
    unsafe_sql = "SELECT name FROM users WHERE name = '" + attack + "'"
    print(unsafe_sql)
    print("unsafe query returns:", sorted(r[0] for r in db.execute(unsafe_sql)))
    print("safe query returns:  ", find_users(db, attack, 0))
  output: |
    <p><b>Mallory</b>: &lt;script&gt;alert(&#x27;stolen cookies&#x27;)&lt;/script&gt;</p>
    SELECT name FROM users WHERE name = 'x' OR '1'='1'
    unsafe query returns: ['ada', 'bo', 'cy', "o'brien"]
    safe query returns:   []
