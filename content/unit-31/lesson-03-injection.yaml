exercises:
- id: html
  title: Escaping output
  difficulty: 3
  prompt: '**Cross-site scripting** (**XSS**) happens when a site puts user text into a page without **escaping**, so that a comment like `<script>steal()</script>` runs as code in other users'' browsers. The cure is to turn special characters into harmless **entities**. Write `escape_html(text)`: replace `&` with `&amp;` **first**, then `<` with `&lt;`, `>` with `&gt;`, the double quote with `&quot;` and the single quote with `&#x27;`. (Do the ampersand first, or you would escape your own entities.) Write `render_comment(name, text)`: the HTML `<p><b>NAME</b>: TEXT</p>` where `NAME` and `TEXT` are both passed through `escape_html`. Line breaks in the text (`\n`) become `<br>` **after** the escaping.'
  starter: |-
    def escape_html(text):
        """Make text safe to put inside an HTML page. Replace & with &amp; FIRST, then < with &lt;, > with &gt;, the double quote with &quot; and the single quote with &#x27;. (Do the ampersand first, or you would escape your own entities.)"""
        pass


    def render_comment(name, text):
        """The HTML for a comment: '<p><b>NAME</b>: TEXT</p>' where NAME and TEXT are both passed through escape_html. Line breaks in the text (\n) become '<br>' AFTER the escaping."""
        pass
  tests:
  - name: escaping
    code: |
      assert escape_html("<b>hi</b>") == "&lt;b&gt;hi&lt;/b&gt;" and escape_html("a & b") == "a &amp; b" and escape_html("&lt;") == "&amp;lt;" and escape_html('say "hi"') == "say &quot;hi&quot;" and escape_html("it's") == "it&#x27;s" and escape_html("") == "" and escape_html("plain text 123") == "plain text 123"
      assert escape_html("<img src=x onerror=alert(1)>") == "&lt;img src=x onerror=alert(1)&gt;" and escape_html("<script>alert('x')</script>") == "&lt;script&gt;alert(&#x27;x&#x27;)&lt;/script&gt;"
  - name: comments
    code: |
      assert render_comment("Ada", "Nice!") == "<p><b>Ada</b>: Nice!</p>" and render_comment("<i>Bo</i>", "x < y") == "<p><b>&lt;i&gt;Bo&lt;/i&gt;</b>: x &lt; y</p>"
      assert render_comment("Cy", "line one\nline two") == "<p><b>Cy</b>: line one<br>line two</p>" and render_comment("Di", "<script>x()</script>\n<b>") == "<p><b>Di</b>: &lt;script&gt;x()&lt;/script&gt;<br>&lt;b&gt;</p>" and render_comment("", "") == "<p><b></b>: </p>"
      assert "<script" not in render_comment("<script>", "<script>")
  hints:
  - Replace the ampersand before the other characters.
  - Insert the <br> tags last, because escaping would turn them into text.
  solution: |
    def escape_html(text):
        """Make text safe to put inside an HTML page. Replace & with &amp; FIRST, then < with &lt;, > with &gt;, the double quote with &quot; and the single quote with &#x27;. (Do the ampersand first, or you would escape your own entities.)"""
        return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;").replace("'", "&#x27;")


    def render_comment(name, text):
        """The HTML for a comment: '<p><b>NAME</b>: TEXT</p>' where NAME and TEXT are both passed through escape_html. Line breaks in the text (\n) become '<br>' AFTER the escaping."""
        return "<p><b>" + escape_html(name) + "</b>: " + escape_html(text).replace("\n", "<br>") + "</p>"
  explanation: Modern frameworks (React, Django templates) escape by default; the dangerous moment is when you switch that off or build HTML text by hand.
- id: sql
  title: SQL injection
  difficulty: 4
  prompt: 'When a program builds a database query by gluing text together, user input can change the **meaning** of the query. This is **SQL injection**, among the most damaging web bugs. `make_db()` is given: a small pretend database with a `users` table (`name`, `age`, `secret`) that understands a small part of SQL (Python''s real `sqlite3` module works the same way, but this stand-in runs in every browser). Write `find_users(conn, name, min_age)`: return the sorted list of the **names** of users whose name equals `name` and whose age is at least `min_age`. Build the query with **placeholders**: `conn.execute("SELECT name FROM users WHERE name = ? AND age >= ?", (name, min_age))`. Never put the values into the SQL text with `+` or f-strings. Write `order_clause(column, allowed)`: placeholders cannot be used for column names, so use an **allow-list**: return `"ORDER BY " + column` when the column is in the list `allowed`, otherwise raise `ValueError("column not allowed")` (the comparison is exact: case matters).'
  starter: |-
    class Cursor:
        """The result of a query."""
        def __init__(self, rows):
            self.rows = rows

        def fetchall(self):
            return list(self.rows)

        def fetchone(self):
            return self.rows[0] if self.rows else None

        def __iter__(self):
            return iter(self.rows)


    def tokenize_sql(sql):
