                        esc = operand()

                    def like(row):
                        pattern, e, out, i = right(row), (esc(row) if esc else None), "", 0
                        while i < len(pattern):
                            ch = pattern[i]
                            if e and ch == e and i + 1 < len(pattern):
                                out += re.escape(pattern[i + 1])
                                i += 1
                            elif ch == "%":
                                out += ".*"
                            elif ch == "_":
                                out += "."
                            else:
                                out += re.escape(ch)
                            i += 1
                        return re.fullmatch(out, str(left(row)), re.I | re.S) is not None
                    return like
                if kind != "op" or value not in ("=", "!=", "<>", "<", "<=", ">", ">="):
                    raise ValueError("syntax error: expected a comparison")
                pos[0] += 1
                right = operand()

                def compare(row):
                    a, b = left(row), right(row)
                    try:
                        return {"=": a == b, "!=": a != b, "<>": a != b, "<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b}[value]
                    except TypeError:
                        return False
                return compare

            def conjunction():
                parts = [comparison()]
                while keyword("AND"):
                    parts.append(comparison())
                return lambda row: all(p(row) for p in parts)

            def expression():
                parts = [conjunction()]
                while keyword("OR"):
                    parts.append(conjunction())
                return lambda row: any(p(row) for p in parts)

            need("SELECT")
            chosen = [column()]
            while peek() == ("op", ","):
                pos[0] += 1
                chosen.append(column())
            need("FROM")
            need("USERS")
            test = expression() if keyword("WHERE") else (lambda row: True)
            order, descending = None, False
            if keyword("ORDER"):
                need("BY")
                order = column()
                if keyword("DESC"):
                    descending = True
                else:
                    keyword("ASC")
            if pos[0] != len(tokens):
                raise ValueError("syntax error near " + repr(peek()[1]))
            rows = [r for r in self.rows if test(r)]
            if order:
                rows = sorted(rows, key=lambda r: r[order], reverse=descending)
            return Cursor([tuple(r[c] for c in chosen) for r in rows])


    def make_db():
        """A small in-memory database for the examples: the table users has the columns name, age and secret."""
        return Conn([{"name": n, "age": a, "secret": s} for n, a, s in [("ada", 36, "s1"), ("bo", 17, "s2"), ("cy", 52, "s3"), ("o'brien", 40, "s4")]])




    def find_users(conn, name, min_age):
        """Return the sorted list of the NAMES of users whose name equals `name` and whose age is at least min_age. Build the query with PLACEHOLDERS: conn.execute('SELECT name FROM users WHERE name = ? AND age >= ?', (name, min_age)). Never put the values into the SQL text with + or f-strings: that allows SQL INJECTION, where input such as x' OR '1'='1 changes the meaning of the query."""
        pass


    def order_clause(column, allowed):
        """Placeholders cannot be used for column names, so use an ALLOW-LIST. Return 'ORDER BY ' + column when the column is in the list `allowed`, otherwise raise ValueError('column not allowed'). The comparison is exact (case matters)."""
        pass
  tests:
  - name: safe lookups
    code: |
      db = make_db()
      assert find_users(db, "ada", 0) == ["ada"] and find_users(db, "ada", 37) == [] and find_users(db, "bo", 17) == ["bo"] and find_users(db, "nobody", 0) == [] and find_users(db, "o'brien", 18) == ["o'brien"]
      assert len(db.execute("SELECT name FROM users").fetchall()) == 4
  - name: attacks fail
    code: |
      db = make_db()
      for attack in ("x' OR '1'='1", "' OR 1=1 --", "ada' --", "ada'; DROP TABLE users; --", "%", "ada' UNION SELECT secret FROM users --"):
          assert find_users(db, attack, 0) == []
      assert len(db.execute("SELECT name FROM users").fetchall()) == 4
      unsafe = "SELECT name FROM users WHERE name = '" + "x' OR '1'='1" + "'"
      assert len(db.execute(unsafe).fetchall()) == 4
  - name: order by
    code: |
      allowed = ["name", "age"]
      assert order_clause("name", allowed) == "ORDER BY name" and order_clause("age", allowed) == "ORDER BY age"
      for bad in ("secret", "Name", "name; DROP TABLE users", "", "name DESC", "1"):
          try:
              order_clause(bad, allowed)
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "column not allowed" in str(e)
      db = make_db()
      rows = db.execute("SELECT name FROM users " + order_clause("age", allowed)).fetchall()
      assert [r[0] for r in rows] == ["bo", "ada", "o'brien", "cy"]
  hints:
  - The ? marks are filled in by the database driver, which treats them as data, never as SQL.
  - Column names cannot be parameters, so check them against a list.
  solution: |
    class Cursor:
        """The result of a query."""
        def __init__(self, rows):
            self.rows = rows

        def fetchall(self):
            return list(self.rows)

        def fetchone(self):
            return self.rows[0] if self.rows else None

        def __iter__(self):
            return iter(self.rows)


    def tokenize_sql(sql):
        """Split SQL text into (kind, value) tokens. A quote starts a string; two quotes inside a string mean one quote. Anything unknown (such as ; or --) is a syntax error."""
        tokens, i = [], 0
        while i < len(sql):
            c = sql[i]
            if c.isspace():
                i += 1
            elif c == "'":
                j, text = i + 1, ""
                while True:
                    if j >= len(sql):
                        raise ValueError("syntax error: unterminated string")
                    if sql[j] == "'":
                        if j + 1 < len(sql) and sql[j + 1] == "'":
                            text += "'"
                            j += 2
                            continue
                        break
                    text += sql[j]
                    j += 1
                tokens.append(("str", text))
                i = j + 1
            elif c.isalpha() or c == "_":
                j = i
                while j < len(sql) and (sql[j].isalnum() or sql[j] == "_"):
                    j += 1
                tokens.append(("word", sql[i:j]))
                i = j
            elif c.isdigit():
                j = i
                while j < len(sql) and sql[j].isdigit():
                    j += 1
                tokens.append(("num", int(sql[i:j])))
                i = j
            elif sql[i:i + 2] in (">=", "<=", "!=", "<>"):
                tokens.append(("op", sql[i:i + 2]))
                i += 2
            elif c in "=<>?,":
                tokens.append(("op", c))
                i += 1
            else:
                raise ValueError("syntax error near " + repr(c))
        return tokens


    class Conn:
        """A tiny pretend database: one table `users` and a small part of SQL (SELECT columns FROM users [WHERE ...] [ORDER BY column [DESC]], with = != < <= > >= LIKE ... ESCAPE, AND, OR, strings, numbers and ? placeholders). Python's real sqlite3 module works the same way; this stand-in runs everywhere."""
        COLUMNS = ["name", "age", "secret"]

        def __init__(self, rows):
            self.rows = rows

        def execute(self, sql, params=()):
            import re
            tokens = tokenize_sql(sql)
            values = list(params)
            for k, (kind, value) in enumerate(tokens):
                if (kind, value) == ("op", "?"):
                    if not values:
                        raise ValueError("wrong number of parameters")
                    tokens[k] = ("val", values.pop(0))
            if values:
                raise ValueError("wrong number of parameters")
            pos = [0]

            def peek():
                return tokens[pos[0]] if pos[0] < len(tokens) else (None, None)

            def keyword(word):
                kind, value = peek()
                if kind == "word" and value.upper() == word:
                    pos[0] += 1
                    return True
                return False

            def need(word):
                if not keyword(word):
                    raise ValueError("syntax error: expected " + word)

            def column():
                kind, value = peek()
                if kind != "word" or value.lower() not in self.COLUMNS:
                    raise ValueError("no such column: " + str(value))
                pos[0] += 1
                return value.lower()

            def operand():
                kind, value = peek()
                if kind in ("str", "num", "val"):
                    pos[0] += 1
                    return lambda row: value
                name = column()
                return lambda row: row[name]

            def comparison():
                left = operand()
                kind, value = peek()
                if kind == "word" and value.upper() == "LIKE":
                    pos[0] += 1
                    right = operand()
                    esc = None
                    if keyword("ESCAPE"):
                        esc = operand()

                    def like(row):
                        pattern, e, out, i = right(row), (esc(row) if esc else None), "", 0
                        while i < len(pattern):
                            ch = pattern[i]
                            if e and ch == e and i + 1 < len(pattern):
                                out += re.escape(pattern[i + 1])
                                i += 1
                            elif ch == "%":
                                out += ".*"
                            elif ch == "_":
                                out += "."
                            else:
                                out += re.escape(ch)
                            i += 1
                        return re.fullmatch(out, str(left(row)), re.I | re.S) is not None
                    return like
                if kind != "op" or value not in ("=", "!=", "<>", "<", "<=", ">", ">="):
                    raise ValueError("syntax error: expected a comparison")
                pos[0] += 1
                right = operand()

                def compare(row):
                    a, b = left(row), right(row)
                    try:
                        return {"=": a == b, "!=": a != b, "<>": a != b, "<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b}[value]
                    except TypeError:
                        return False
                return compare

            def conjunction():
                parts = [comparison()]
                while keyword("AND"):
                    parts.append(comparison())
                return lambda row: all(p(row) for p in parts)

            def expression():
                parts = [conjunction()]
                while keyword("OR"):
                    parts.append(conjunction())
                return lambda row: any(p(row) for p in parts)

            need("SELECT")
            chosen = [column()]
            while peek() == ("op", ","):
                pos[0] += 1
                chosen.append(column())
            need("FROM")
            need("USERS")
            test = expression() if keyword("WHERE") else (lambda row: True)
            order, descending = None, False
            if keyword("ORDER"):
                need("BY")
                order = column()
                if keyword("DESC"):
                    descending = True
                else:
                    keyword("ASC")
            if pos[0] != len(tokens):
                raise ValueError("syntax error near " + repr(peek()[1]))
            rows = [r for r in self.rows if test(r)]
            if order:
                rows = sorted(rows, key=lambda r: r[order], reverse=descending)
            return Cursor([tuple(r[c] for c in chosen) for r in rows])


    def make_db():
        """A small in-memory database for the examples: the table users has the columns name, age and secret."""
        return Conn([{"name": n, "age": a, "secret": s} for n, a, s in [("ada", 36, "s1"), ("bo", 17, "s2"), ("cy", 52, "s3"), ("o'brien", 40, "s4")]])




    def find_users(conn, name, min_age):
        """Return the sorted list of the NAMES of users whose name equals `name` and whose age is at least min_age. Build the query with PLACEHOLDERS: conn.execute('SELECT name FROM users WHERE name = ? AND age >= ?', (name, min_age)). Never put the values into the SQL text with + or f-strings: that allows SQL INJECTION, where input such as x' OR '1'='1 changes the meaning of the query."""
        rows = conn.execute("SELECT name FROM users WHERE name = ? AND age >= ?", (name, min_age)).fetchall()
        return sorted(r[0] for r in rows)


    def order_clause(column, allowed):
        """Placeholders cannot be used for column names, so use an ALLOW-LIST. Return 'ORDER BY ' + column when the column is in the list `allowed`, otherwise raise ValueError('column not allowed'). The comparison is exact (case matters)."""
        if column not in allowed:
            raise ValueError("column not allowed")
        return "ORDER BY " + column
  explanation: The database never confuses the query with the data when they travel separately. This one habit prevents the whole class of bug.
- id: path
  title: Path traversal
  difficulty: 4
  prompt: If a program opens `base + user_filename`, a user can ask for `../../etc/passwd` and read files outside the folder (**path traversal**). Write `safe_join(base, user_path)` using `posixpath`. `ValueError("bad path")` if `user_path` contains a NUL character (`"\x00"`) or starts with `/` (absolute) or a backslash. Otherwise normalise `posixpath.join(base, user_path)` with `posixpath.normpath` and make sure the result is the base itself or **inside** it (the result must equal `normpath(base)` or start with `normpath(base) + "/"`); if not raise `ValueError("outside base")`. Return the normalised path.
  starter: |-
    def safe_join(base, user_path):
        """Join a user-supplied path onto a base folder without allowing escape (PATH TRAVERSAL: ../../etc/passwd). Use posixpath. ValueError('bad path') if user_path contains a NUL character ('\x00') or starts with '/' (absolute) or a backslash. Otherwise normalise posixpath.join(base, user_path) with posixpath.normpath and make sure the result is the base itself or inside it (the result must equal normpath(base) or start with normpath(base) + '/'); if not raise ValueError('outside base'). Return the normalised path."""
        pass
  tests:
  - name: allowed paths
    code: |
      assert safe_join("/srv/files", "report.txt") == "/srv/files/report.txt" and safe_join("/srv/files", "a/b/c.txt") == "/srv/files/a/b/c.txt" and safe_join("/srv/files/", "x") == "/srv/files/x" and safe_join("/srv/files", "") == "/srv/files" and safe_join("/srv/files", ".") == "/srv/files"
      assert safe_join("/srv/files", "a/../b.txt") == "/srv/files/b.txt" and safe_join("/srv/files", "a/./b") == "/srv/files/a/b" and safe_join("/srv/files", "a//b") == "/srv/files/a/b" and safe_join("/srv/files", "..hidden") == "/srv/files/..hidden" and safe_join("/", "etc") == "/etc"
  - name: attacks
    code: |
      for bad in ("../secret", "../../etc/passwd", "a/../../etc", "a/b/../../../x", "..", "../files2/x", "a/../.."):
          try:
              safe_join("/srv/files", bad)
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "outside base" in str(e)
      for bad in ("/etc/passwd", "\\windows\\system32", "ok\x00.txt", "/"):
          try:
              safe_join("/srv/files", bad)
              raise AssertionError("accepted " + repr(bad))
          except ValueError as e:
              assert "bad path" in str(e)
      try:
          safe_join("/srv/files", "../files-evil/x")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "outside base" in str(e)
  hints:
  - Normalise first, then check that the result is still inside the base.
  - Compare with base + '/' so that /srv/files-evil is not mistaken for /srv/files.
  solution: |
    def safe_join(base, user_path):
        """Join a user-supplied path onto a base folder without allowing escape (PATH TRAVERSAL: ../../etc/passwd). Use posixpath. ValueError('bad path') if user_path contains a NUL character ('\x00') or starts with '/' (absolute) or a backslash. Otherwise normalise posixpath.join(base, user_path) with posixpath.normpath and make sure the result is the base itself or inside it (the result must equal normpath(base) or start with normpath(base) + '/'); if not raise ValueError('outside base'). Return the normalised path."""
        import posixpath
        if "\x00" in user_path or user_path.startswith("/") or user_path.startswith("\\"):
            raise ValueError("bad path")
        root = posixpath.normpath(base)
        full = posixpath.normpath(posixpath.join(root, user_path))
        if full != root and not full.startswith(root.rstrip("/") + "/"):
            raise ValueError("outside base")
        return full
  explanation: 'Check the final, normalised path, not the text the user typed: attackers use encodings and tricks to disguise ..'
- id: shell
  title: Command injection
  difficulty: 5
  prompt: 'If a program builds a shell command from user input (`"ping " + host`), input such as `x; rm -rf ~` runs extra commands (**command injection**). The best cure is not to use a shell at all (pass a list of arguments to the program); when you must build a command line, **quote** every argument. Write `quote_arg(text)`: make text safe as **one** argument for a Unix shell: wrap it in single quotes, and write every single quote inside it as `''\''''` (end the quote, an escaped quote, start again). The empty text becomes `''''`. For example `it''s` becomes `''it''\''''s''`. Write `build_command(program, args, allowed)`: the program must be in the list `allowed` (`ValueError("program not allowed")` otherwise: never run a program the user names). Return the program, then every argument made safe with `quote_arg`, joined with single spaces.'
  starter: |-
    def quote_arg(text):
        """Make text safe as ONE argument for a Unix shell: wrap it in single quotes, and write every single quote inside it as '\\'' (end the quote, an escaped quote, start again). The empty text becomes ''. Example: it's -> 'it'\\''s'."""
        pass


    def build_command(program, args, allowed):
        """Build a shell command line. The program must be in the list `allowed` (ValueError('program not allowed') otherwise: never run a program the user names). Return the program, then every argument made safe with quote_arg, joined with single spaces."""
        pass
  tests:
  - name: quoting
    code: |
      import shlex
      assert quote_arg("hello") == "'hello'" and quote_arg("") == "''" and quote_arg("a b") == "'a b'" and quote_arg("it's") == "'it'\\''s'" and quote_arg("; rm -rf ~") == "'; rm -rf ~'" and quote_arg("$(whoami)") == "'$(whoami)'"
      for text in ("plain", "with space", "it's", "''", "a;b|c&d", "$HOME `id` $(id)", "new\nline", "", "\"quoted\"", "back\\slash", "*.txt", "é"):
          assert shlex.split(quote_arg(text)) == [text]
  - name: commands
    code: |
      import shlex
      allowed = ["ping", "convert"]
      assert build_command("ping", ["-c", "1", "example.com"], allowed) == "ping '-c' '1' 'example.com'" and build_command("convert", [], allowed) == "convert"
      evil = build_command("ping", ["x; rm -rf ~", "$(reboot)", "it's"], allowed)
      assert shlex.split(evil) == ["ping", "x; rm -rf ~", "$(reboot)", "it's"]
      for prog in ("rm", "ping; rm", "", "PING"):
          try:
              build_command(prog, [], allowed)
              raise AssertionError("accepted " + prog)
          except ValueError as e:
              assert "program not allowed" in str(e)
  hints:
  - Single quotes switch off every special meaning except the single quote itself.
  - 'Write each single quote as: close quote, backslash-quote, open quote.'
  solution: |
    def quote_arg(text):
        """Make text safe as ONE argument for a Unix shell: wrap it in single quotes, and write every single quote inside it as '\\'' (end the quote, an escaped quote, start again). The empty text becomes ''. Example: it's -> 'it'\\''s'."""
        return "'" + text.replace("'", "'\\''") + "'"


    def build_command(program, args, allowed):
        """Build a shell command line. The program must be in the list `allowed` (ValueError('program not allowed') otherwise: never run a program the user names). Return the program, then every argument made safe with quote_arg, joined with single spaces."""
        if program not in allowed:
            raise ValueError("program not allowed")
        return " ".join([program] + [quote_arg(a) for a in args])
  explanation: 'In Python prefer subprocess.run([program, arg1, arg2]) without shell=True: then no quoting is needed because no shell is involved.'
- id: redirect
  title: 'Capstone: safe redirects'
  difficulty: 5
  prompt: 'After login a site may send you to the page named in a `next` parameter. An attacker can try to send you to **their** site, which then looks like the real one (an **open redirect**). Write `safe_redirect(target, allowed_hosts)`: return `target` when it is safe and `"/"` otherwise. Safe means: (1) a path on this site: it starts with a single `/` (the second character is not `/` and there is no backslash anywhere) and the text has no control characters (characters below a space); or (2) an absolute `https` URL (scheme compared ignoring case) whose host name (`urllib.parse.urlparse(target).hostname`, which is lower case and ignores any `user@` part) is **exactly** one of `allowed_hosts` (given in lower case). Anything else (`//evil.com`, `javascript:alert(1)`, `http://...`, `https://good.com.evil.com`, the empty text, ...) gives `"/"`.'
  starter: |-
    def safe_redirect(target, allowed_hosts):
        """After login a site may send you to the page in a 'next' parameter. An attacker can try to send you to THEIR site (OPEN REDIRECT). Return target when it is safe and '/' otherwise. Safe means: (1) a path on this site: it starts with a single '/' and the second character is not '/' or a backslash, and the text has no control characters (characters below ' ', or a backslash anywhere); or (2) an absolute 'https' URL (scheme compared ignoring case) whose host name (urllib.parse.urlparse(target).hostname, which is lower case and ignores any user@ part) is exactly one of allowed_hosts (given in lower case). Anything else ('//evil.com', 'javascript:alert(1)', 'http://...', 'https://good.com.evil.com', '', ...) gives '/'."""
        pass
  tests:
  - name: safe targets
    code: |
      hosts = {"shop.example.com", "example.com"}
      for ok in ("/", "/account", "/orders?id=5#top", "https://example.com/pay", "https://shop.example.com", "HTTPS://example.com/x", "https://EXAMPLE.com/x", "https://example.com:8443/x"):
          assert safe_redirect(ok, hosts) == ok
  - name: attacks
    code: |
      hosts = {"shop.example.com", "example.com"}
      for bad in ("", "//evil.com", "//example.com", "/\\evil.com", "\\\\evil.com", "http://example.com/x", "https://evil.com", "https://example.com.evil.com", "https://evil.com/example.com", "https://example.com@evil.com/", "https://evil.com#@example.com", "javascript:alert(1)", "data:text/html,x", "ftp://example.com", "evil.com", "example.com/x", "/ok\r\nSet-Cookie: x=1", "/\tevil", " /x", "https://sub.example.com/", "https://", "https:///x"):
          assert safe_redirect(bad, hosts) == "/", bad
      assert safe_redirect("https://example.com", set()) == "/" and safe_redirect("/x", set()) == "/x"
  hints:
  - Check cheap rejections first (empty, control characters, backslash).
  - hostname already removes user@ and the port, which defeats the @ trick.
  solution: |
    def safe_redirect(target, allowed_hosts):
        """After login a site may send you to the page in a 'next' parameter. An attacker can try to send you to THEIR site (OPEN REDIRECT). Return target when it is safe and '/' otherwise. Safe means: (1) a path on this site: it starts with a single '/' and the second character is not '/' or a backslash, and the text has no control characters (characters below ' ', or a backslash anywhere); or (2) an absolute 'https' URL (scheme compared ignoring case) whose host name (urllib.parse.urlparse(target).hostname, which is lower case and ignores any user@ part) is exactly one of allowed_hosts (given in lower case). Anything else ('//evil.com', 'javascript:alert(1)', 'http://...', 'https://good.com.evil.com', '', ...) gives '/'."""
        from urllib.parse import urlparse
        if not target or any(ord(c) < 32 for c in target) or "\\" in target:
            return "/"
        if target.startswith("/"):
            return target if not target.startswith("//") else "/"
        parsed = urlparse(target)
        if parsed.scheme.lower() == "https" and parsed.hostname in allowed_hosts:
            return target
        return "/"
  explanation: 'Check with a parser, not with startswith: attackers know a dozen ways to write a URL that looks fine to a simple check.'
commonMistakes:
- title: Building SQL with + or f-strings
  explanation: Always use placeholders.
- title: Escaping for the wrong language
  explanation: HTML, SQL and shell each need their own escaping.
- title: Using a block-list
  explanation: Attackers find the one case you missed.
- title: Checking the input before decoding
  explanation: Check the final, normalised form.
- title: Trusting data from inside the system
  explanation: It may have come from a user earlier.
summary:
- Injection turns data into code when text is glued together.
- 'Keep data and code apart: placeholders, argument lists, escaping templates.'
- Escape for the exact target language.
- Use allow-lists and check the normalised result.
- Treat all outside data as hostile.
