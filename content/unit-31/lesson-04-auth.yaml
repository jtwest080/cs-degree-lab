id: u31-auth
title: Authentication, Sessions and Access
minutes: 110
objective: Understand how a site knows who you are and what you may do. You will build signed tokens, one-time codes (TOTP), sessions with expiry, role-based permissions and a login that locks out guessers.
outcomes:
- Distinguish authentication from authorisation
- Explain tokens, sessions and cookies
- Explain how two-factor codes work
- Design roles with least privilege
- Limit guessing attacks
sections:
- heading: Who are you, and what may you do?
  body: |-
    **Authentication** proves **who** you are (a password, a code, a key). **Authorisation** decides **what** you may do. Many bugs confuse the two: a user who is logged in is not allowed to open every record.

    Proof comes from **factors**: something you **know** (password), something you **have** (phone, hardware key) and something you **are** (fingerprint). **Multi-factor authentication** (**MFA**) combines two or more, so a stolen password alone is not enough. **Passkeys** (public-key credentials kept on your device) go further: there is no password to steal or phish.

    Authorisation follows the **principle of least privilege**: give each account only the rights it needs. **Role-based access control** (**RBAC**) groups permissions into roles (viewer, editor, admin) and gives people roles. Check permissions on the **server** for every request: hiding a button is not security.
- heading: Staying logged in
  body: |-
    HTTP has no memory: every request is separate. After login the server gives your browser a **session token**, a long random value stored in a **cookie** and sent with each request. The server looks the token up (a **session**) to find the user. Good practice: make the token random and long (use the `secrets` module, never `random`), send it only over **HTTPS** (`Secure` cookie), keep it away from scripts (`HttpOnly`), limit cross-site sending (`SameSite`), give it an **expiry**, replace it at login (so an attacker cannot **fix** it beforehand) and delete it on logout.

    An alternative is a **signed token** (**JWT**): the server puts the data (user, expiry) in the token and signs it with a secret; later it only checks the signature and needs no lookup. The data is readable by anyone, only protected from change; and a signed token cannot easily be **revoked** before it expires, so keep expiry short.

    **One-time codes** (**TOTP**) come from a secret shared once when you scan the QR code. Phone and server each compute `HMAC(secret, time // 30)` and cut it down to six digits, so both see the same code without sending it.

    **Defending the login**: slow password hashes (lesson 1), a **lockout** or growing delay after failures, the **same message** for wrong name and wrong password (so attackers cannot find which names exist), and alerts for unusual logins. A related attack is **CSRF** (cross-site request forgery): another site makes your browser send a request while you are logged in; defences are `SameSite` cookies and secret **CSRF tokens** in forms.
examples:
- title: A signed token
  intro: Create, check and forge tokens.
  code: |
    def sign_token(payload, secret):
        """Make a signed token (like a simple JWT). Turn the payload dict into JSON text with json.dumps(payload, sort_keys=True, separators=(',', ':')), encode it as UTF-8 and then as URL-safe base64 (base64.urlsafe_b64encode) with the '=' padding removed. The token is that text, a '.', and the HMAC-SHA256 (hex) of that text (as UTF-8) using the secret (UTF-8 text) as key."""
        import base64, hashlib, hmac, json
        body = base64.urlsafe_b64encode(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")).decode("ascii").rstrip("=")
        tag = hmac.new(secret.encode("utf-8"), body.encode("utf-8"), hashlib.sha256).hexdigest()
        return body + "." + tag


    def verify_token(token, secret, now):
        """Check a token made by sign_token and return its payload dict. ValueError('malformed') unless the token has exactly one '.'; ValueError('bad signature') if the tag does not match (compare with hmac.compare_digest, and check the signature BEFORE reading the body); then decode the body (add back the '=' padding, base64 and JSON; any failure is ValueError('malformed')). If the payload is not a dict or has an 'exp' (expiry time in seconds) that is NOT greater than `now`, raise ValueError('expired'). A payload without 'exp' never expires."""
        import base64, hashlib, hmac, json
        parts = token.split(".")
        if len(parts) != 2:
            raise ValueError("malformed")
        body, tag = parts
        good = hmac.new(secret.encode("utf-8"), body.encode("utf-8"), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(good.encode(), tag.encode()):
            raise ValueError("bad signature")
        try:
            payload = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)).decode("utf-8"))
        except Exception:
            raise ValueError("malformed")
        if not isinstance(payload, dict):
            raise ValueError("malformed")
        if "exp" in payload and not payload["exp"] > now:
            raise ValueError("expired")
        return payload

    token = sign_token({"user": "ada", "role": "student", "exp": 5000}, "server-secret")
    print(token[:40] + "...")
    print(verify_token(token, "server-secret", 1000))
    forged = sign_token({"user": "ada", "role": "admin", "exp": 5000}, "attackers-guess")
    for tok, now in ((token, 6000), (forged, 1000)):
        try:
            verify_token(tok, "server-secret", now)
        except ValueError as e:
            print("refused:", e)
  output: |
    eyJleHAiOjUwMDAsInJvbGUiOiJzdHVkZW50Iiwi...
    {'exp': 5000, 'role': 'student', 'user': 'ada'}
    refused: expired
    refused: bad signature
  lines:
  - line: 30
    note: The first part is the readable (base64) payload.
  - line: 31
    note: 'Valid: the data comes back.'
  - line: 33
    note: Late and forged tokens are refused.
- title: One-time codes and roles
  intro: The RFC test codes, and permissions that inherit through roles.
  code: |
    def hotp(secret, counter, digits=6):
        """The one-time code of RFC 4226 (HOTP). `secret` is bytes. Compute HMAC-SHA1 of the counter written as 8 bytes big-endian (counter.to_bytes(8, 'big')) with the secret as key. DYNAMIC TRUNCATION: take the last 4 bits of the digest as an offset, read the 4 bytes from that offset as a big-endian number and clear its top bit (& 0x7fffffff). The code is that number modulo 10 ** digits, written with leading zeros up to `digits` characters. The first codes for the secret b'12345678901234567890' are 755224, 287082, 359152, 969429 ..."""
        import hashlib, hmac
        digest = hmac.new(secret, counter.to_bytes(8, "big"), hashlib.sha1).digest()
        offset = digest[-1] & 0x0F
        number = int.from_bytes(digest[offset:offset + 4], "big") & 0x7FFFFFFF
        return str(number % 10 ** digits).zfill(digits)


    def totp(secret, time_seconds, step=30, digits=6):
        """Time-based codes (RFC 6238): the counter is the number of whole `step` seconds since 1970 (time_seconds // step); the code is hotp(secret, counter, digits)."""
        return hotp(secret, int(time_seconds) // step, digits)


    def verify_totp(secret, code, time_seconds, window=1):
        """Accept a code typed by the user. Clocks differ a little, so accept the code of the current step and of `window` steps before and after (default 1: 30 seconds either way). Compare as text with hmac.compare_digest; return True or False. A negative step counter is never tried."""
        import hmac
        base = int(time_seconds) // 30
        for c in range(base - window, base + window + 1):
            if c >= 0 and hmac.compare_digest(hotp(secret, c).encode(), str(code).encode()):
                return True
        return False


    def permissions_of(role_defs, role):
        """Role-based access control. `role_defs` is a dict {role: {"perms": [permission texts], "inherits": [roles]}} (both keys optional). Return the sorted list of all permissions of the role, including those of the roles it inherits from, at any depth. Roles may inherit in a circle: do not loop forever. ValueError('unknown role NAME') for a role (also an inherited one) that is not defined."""
        seen, perms = set(), set()

        def walk(name):
            if name in seen:
                return
            if name not in role_defs:
                raise ValueError("unknown role " + name)
            seen.add(name)
            perms.update(role_defs[name].get("perms", []))
            for parent in role_defs[name].get("inherits", []):
                walk(parent)

        walk(role)
        return sorted(perms)


    def can(role_defs, roles, permission):
        """May someone with these roles do `permission`? Collect the permissions of ALL the roles first (permissions_of; an unknown role raises ValueError as above, even if an earlier role already grants the permission). Return True if any of them is exactly the permission, or is a WILDCARD: '*' allows everything, and 'files:*' allows every permission that starts with 'files:'. No roles means False."""
        granted = [p for role in roles for p in permissions_of(role_defs, role)]
        return any(p == permission or p == "*" or (p.endswith(":*") and permission.startswith(p[:-1])) for p in granted)

    secret = b"12345678901234567890"
    for t in (0, 29, 30, 59, 60):
        print(t, totp(secret, t))
    print(verify_totp(secret, "287082", 75), verify_totp(secret, "287082", 200))
    defs = {"viewer": {"perms": ["files:read"]}, "editor": {"perms": ["files:write"], "inherits": ["viewer"]}, "admin": {"perms": ["users:*"], "inherits": ["editor"]}}
    print(permissions_of(defs, "admin"))
    print(can(defs, ["editor"], "files:read"), can(defs, ["editor"], "users:delete"), can(defs, ["admin"], "users:delete"))
  output: |
    0 755224
    29 755224
    30 287082
    59 287082
    60 359152
    True False
    ['files:read', 'files:write', 'users:*']
    True False True
  lines:
  - line: 49
    note: The code is the same inside a 30-second step.
  - line: 51
    note: Accepted in the next step, refused much later.
  - line: 53
    note: Permissions inherited from the editor and the viewer.
  - line: 54
    note: The editor cannot delete users; the admin can.
