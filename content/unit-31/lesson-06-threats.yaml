- type: code
  question: Write `severity_rank(severity)` returning 0 for 'critical', 1 for 'high', 2 for 'medium', 3 for 'low' (so that sorting by it puts the worst first); raise `ValueError('unknown severity')` for anything else.
  starter: |
    def severity_rank(severity):
        pass
  tests:
  - name: rank
    code: |
      assert [severity_rank(s) for s in ("critical", "high", "medium", "low")] == [0, 1, 2, 3]
      try:
          severity_rank("urgent")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "unknown severity" in str(e)
  solution: |
    def severity_rank(severity):
        order = ["critical", "high", "medium", "low"]
        if severity not in order:
            raise ValueError("unknown severity")
        return order.index(severity)
