      assert compare_versions("1.2.3", "1.2.3") == 0 and compare_versions("1.10", "1.9") == 1 and compare_versions("1.9", "1.10") == -1 and compare_versions("1.2", "1.2.0") == 0 and compare_versions("2", "1.99.99") == 1 and compare_versions("1.0.0.1", "1.0") == 1 and compare_versions("0.9", "1.0") == -1 and compare_versions("10", "9") == 1
      for bad in ("", "1..2", "1.x", "v1.2", "1.2.", "-1"):
          try:
              compare_versions(bad, "1.0")
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "bad version" in str(e)
  - name: specs
    code: |
      assert version_matches("1.2.0", "<1.4.2") and not version_matches("1.4.2", "<1.4.2") and version_matches("1.4.2", "<=1.4.2") and version_matches("2.0", ">1.9") and not version_matches("2.0", ">2.0.0") and version_matches("2.0", ">=2") and version_matches("1.2", "==1.2.0") and not version_matches("1.3", "==1.2")
      assert version_matches("1.2", ">=1.0,<1.4.2") and not version_matches("0.9", ">=1.0,<1.4.2") and not version_matches("1.4.2", ">=1.0,<1.4.2") and version_matches("1.2", " >= 1.0 , < 1.4.2 ") and version_matches("3.0", ">1, >2, >=3")
      for bad in ("", "1.2", "=1.2", "!=1.2", "<", "<1.0,", ">=1.0,,<2", "~1.2"):
          try:
              version_matches("1.0", bad)
              raise AssertionError("accepted " + repr(bad))
          except ValueError as e:
              assert "bad spec" in str(e)
  - name: scanning
    code: |
      deps = {"requests": "2.19.0", "flask": "2.3.1", "left-pad": "1.0.0", "pillow": "9.0.0"}
      adv = [{"id": "CVE-1", "package": "requests", "affected": "<2.20.0", "severity": "high"}, {"id": "CVE-2", "package": "flask", "affected": ">=2.0,<2.3.0", "severity": "critical"}, {"id": "CVE-3", "package": "pillow", "affected": "<9.0.1", "severity": "critical"}, {"id": "CVE-4", "package": "left-pad", "affected": "==1.0.0", "severity": "low"}, {"id": "CVE-5", "package": "django", "affected": "<9", "severity": "high"}, {"id": "CVE-0", "package": "requests", "affected": ">=2.0,<2.19.1", "severity": "high"}]
      assert scan_dependencies(deps, adv) == [("CVE-3", "pillow", "9.0.0", "critical"), ("CVE-0", "requests", "2.19.0", "high"), ("CVE-1", "requests", "2.19.0", "high"), ("CVE-4", "left-pad", "1.0.0", "low")]
      assert scan_dependencies({}, adv) == [] and scan_dependencies(deps, []) == [] and scan_dependencies({"flask": "2.3.0"}, adv) == []
  hints:
  - Turn each version into a list of numbers and pad with zeros before comparing.
  - Try the two-character operators first, so that <= is not read as <.
  solution: |
    def compare_versions(a, b):
        """Compare two version texts such as '1.10.2' and '1.9'. Split at '.', every part must be a whole number (ValueError('bad version') otherwise, also for an empty text). A missing part counts as 0 ('1.2' equals '1.2.0'). Compare number by number (so 1.10 is newer than 1.9). Return -1 if a is older, 0 if equal, 1 if a is newer."""
        def parts(v):
            p = v.split(".")
            if not all(x.isdigit() for x in p):
                raise ValueError("bad version")
            return [int(x) for x in p]
        pa, pb = parts(a), parts(b)
        n = max(len(pa), len(pb))
        pa, pb = pa + [0] * (n - len(pa)), pb + [0] * (n - len(pb))
        return (pa > pb) - (pa < pb)


    def version_matches(version, spec):
        """Does `version` satisfy the specification `spec`? The spec is one or more clauses separated by commas, each an operator followed by a version: '<1.4.2', '>=1.0,<1.4.2', '==2.0'. The operators are <, <=, >, >= and == (ignore blanks around parts). ALL clauses must hold (check every clause for validity first). ValueError('bad spec') for an empty clause or an unknown operator."""
        ops = ["<=", ">=", "==", "<", ">"]
        clauses = []
        for clause in spec.split(","):
            clause = clause.strip()
            op = next((o for o in ops if clause.startswith(o)), None)
            if op is None or not clause[len(op):].strip():
                raise ValueError("bad spec")
            clauses.append((op, clause[len(op):].strip()))
        for op, target in clauses:
            c = compare_versions(version, target)
            ok = {"<": c < 0, "<=": c <= 0, ">": c > 0, ">=": c >= 0, "==": c == 0}[op]
            if not ok:
                return False
        return True


    def scan_dependencies(deps, advisories):
        """Every program depends on libraries, and libraries have known vulnerabilities (listed in advisories such as CVE entries). `deps` is a dict {package: installed version}; `advisories` a list of dicts {'id': text, 'package': name, 'affected': spec (as for version_matches), 'severity': 'low'/'medium'/'high'/'critical'}. Return the list of (id, package, version, severity) for every advisory whose package is installed in a version that matches the affected spec, sorted with the most severe first (critical, high, medium, low) and then by id."""
        order = {"critical": 0, "high": 1, "medium": 2, "low": 3}
        hits = []
        for adv in advisories:
            v = deps.get(adv["package"])
            if v is not None and version_matches(v, adv["affected"]):
                hits.append((adv["id"], adv["package"], v, adv["severity"]))
        hits.sort(key=lambda h: (order[h[3]], h[0]))
        return hits
  explanation: Tools such as pip-audit, npm audit and GitHub Dependabot do exactly this against public advisory databases and can open the update for you.
- id: secrets
  title: Finding secrets in code
  difficulty: 5
  prompt: 'Developers sometimes paste passwords, API keys or private keys into code and then publish it, and bots find them within minutes. A **secret scanner** looks for them. Write `shannon_entropy(text)`: the **Shannon entropy** of the text in bits per character: the sum over the different characters of `-p * log2(p)`, where `p` is the share of that character (use `math.log2`). The empty text has entropy `0.0`. Random secrets have a high entropy (about 4 or more); ordinary words and repeated text have a low one. Write `find_secrets(text)`: go through the text line by line (numbers start at 1) and return the sorted list of `(line number, kind)` pairs, each kind at most once per line. The kinds: `"aws key"` for `AKIA` followed by 16 upper-case letters or digits; `"private key"` for a `-----BEGIN ` ... `PRIVATE KEY-----` marker; `"hardcoded password"` for one of the words `password`, `passwd`, `secret`, `token`, or `api_key` / `api-key` / `apikey` (any case) followed by optional blanks, `:` or `=`, optional blanks and a quoted value of **at least 6 characters** without blanks (single or double quotes); and `"high entropy string"` for a run of at least 24 characters from `A-Z a-z 0-9 + / = _ -` whose `shannon_entropy` is at least `4.0`.'
  starter: |-
    def shannon_entropy(text):
        """The SHANNON ENTROPY of the text in bits per character: the sum over the different characters of -p * log2(p), where p is the share of that character (use math.log2). The empty text has entropy 0.0. Random secrets have a high entropy (about 4 or more); ordinary words and repeated text have a low one."""
        pass


    def find_secrets(text):
        """A SECRET SCANNER finds passwords and keys that were pasted into code. Go through the text line by line (numbers start at 1) and return the sorted list of (line number, kind) pairs, each kind at most once per line. The kinds: 'aws key' for AKIA followed by 16 upper-case letters or digits; 'private key' for a '-----BEGIN ' ... 'PRIVATE KEY-----' marker; 'hardcoded password' for a word password, passwd, secret, token or api_key / api-key / apikey (any case) followed by optional blanks, ':' or '=', optional blanks and a quoted value of at least 6 characters without blanks (single or double quotes); and 'high entropy string' for a run of at least 24 characters from A-Z a-z 0-9 + / = _ - whose shannon_entropy is at least 4.0."""
        pass
  tests:
  - name: entropy
    code: |
      assert shannon_entropy("") == 0.0 and shannon_entropy("aaaa") == 0.0 and abs(shannon_entropy("ab") - 1.0) < 1e-12 and abs(shannon_entropy("abcd") - 2.0) < 1e-12 and abs(shannon_entropy("aabb") - 1.0) < 1e-12 and abs(shannon_entropy("aaab") - 0.8112781244591328) < 1e-9
      assert shannon_entropy("correcthorsebatterystaple") < 4.0 and shannon_entropy("wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY") > 4.0 and shannon_entropy("x" * 50) == 0.0
  - name: kinds of secret
    code: |
      code = """import os
      aws = "AKIAIOSFODNN7EXAMPLE"
      password = "hunter2hunter2"
      db_password: 'short'
      API_KEY = "abcdef123456"
      pw = os.environ["PASSWORD"]
      -----BEGIN RSA PRIVATE KEY-----
      token = 'a b c d e f g'
      blob = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY"
      words = "correcthorsebatterystaplecorrecthorse"
      Secret : "abcdef"
      api-key="123456"
      """
      assert find_secrets(code) == [(2, "aws key"), (3, "hardcoded password"), (5, "hardcoded password"), (7, "private key"), (9, "high entropy string"), (11, "hardcoded password"), (12, "hardcoded password")]
      assert find_secrets("") == [] and find_secrets("nothing here\njust code") == []
  - name: one line, several kinds
    code: |
      line = 'secret = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY"  # AKIAABCDEFGHIJKLMNOP'
      assert find_secrets(line) == [(1, "aws key"), (1, "hardcoded password"), (1, "high entropy string")]
      assert find_secrets("-----BEGIN PRIVATE KEY-----") == [(1, "private key")] and find_secrets("-----BEGIN OPENSSH PRIVATE KEY-----") == [(1, "private key")] and find_secrets("-----BEGIN CERTIFICATE-----") == []
      assert find_secrets("AKIA1234") == [] and find_secrets("AKIAIOSFODNN7EXAMPLE AKIAIOSFODNN7EXAMPLF") == [(1, "aws key")] and find_secrets("token=abcdefg") == [] and find_secrets("TOKEN='abcdefg'") == [(1, "hardcoded password")]
  hints:
  - Use one regular expression per kind and a set to avoid duplicates.
  - Check every long run of key characters with shannon_entropy.
  solution: |
    def shannon_entropy(text):
        """The SHANNON ENTROPY of the text in bits per character: the sum over the different characters of -p * log2(p), where p is the share of that character (use math.log2). The empty text has entropy 0.0. Random secrets have a high entropy (about 4 or more); ordinary words and repeated text have a low one."""
        import math
        if not text:
            return 0.0
        n = len(text)
        return -sum((c / n) * math.log2(c / n) for c in (text.count(ch) for ch in set(text)))


    def find_secrets(text):
        """A SECRET SCANNER finds passwords and keys that were pasted into code. Go through the text line by line (numbers start at 1) and return the sorted list of (line number, kind) pairs, each kind at most once per line. The kinds: 'aws key' for AKIA followed by 16 upper-case letters or digits; 'private key' for a '-----BEGIN ' ... 'PRIVATE KEY-----' marker; 'hardcoded password' for a word password, passwd, secret, token or api_key / api-key / apikey (any case) followed by optional blanks, ':' or '=', optional blanks and a quoted value of at least 6 characters without blanks (single or double quotes); and 'high entropy string' for a run of at least 24 characters from A-Z a-z 0-9 + / = _ - whose shannon_entropy is at least 4.0."""
        import re
        patterns = [("aws key", re.compile(r"AKIA[0-9A-Z]{16}")), ("private key", re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")), ("hardcoded password", re.compile(r"(?i)(password|passwd|secret|token|api[_-]?key)\s*[:=]\s*['\"][^'\"\s]{6,}['\"]"))]
        token = re.compile(r"[A-Za-z0-9+/=_-]{24,}")
        found = set()
        for number, line in enumerate(text.splitlines(), 1):
            for kind, pattern in patterns:
                if pattern.search(line):
                    found.add((number, kind))
            if any(shannon_entropy(t) >= 4.0 for t in token.findall(line)):
                found.add((number, "high entropy string"))
        return sorted(found)
  explanation: 'If a secret ever reaches a public repository, assume it is stolen: revoke it and make a new one. Removing it from the code does not remove it from history.'
- id: log
  title: 'Capstone: reading a login log'
  difficulty: 5
  prompt: 'Detection is the other half of security: you need **logs** and someone (or something) to read them. Write `analyze_log(lines, threshold, window, min_users)`. Each line is `"SECONDS IP USER RESULT"` (four words; `RESULT` is `OK` or `FAIL`); skip lines that are malformed (not four words, `SECONDS` not a whole number, `RESULT` anything else). Handle the events in the order of their time (stable for equal times). Return a dict of three **sorted** lists of IP addresses: `"bruteforce"` = addresses with at least `threshold` `FAIL` events inside some window of `window` seconds (last time minus first time `<= window`); `"spraying"` = addresses with `FAIL` events against at least `min_users` **different** user names (any time); `"compromised"` = addresses with an `OK` event **after** they had become a bruteforce address, that is after the failure that completed the threshold (in the sorted event order).'
  starter: |-
    def analyze_log(lines, threshold, window, min_users):
        """Read a login log. Each line is 'SECONDS IP USER RESULT' (four words; RESULT is OK or FAIL); skip lines that are malformed (not four words, SECONDS not a whole number, RESULT anything else). Handle the events in the order of their time (stable for equal times). Return a dict of three sorted lists of IP addresses: 'bruteforce' = addresses with at least `threshold` FAIL events inside some window of `window` seconds (last time minus first time <= window); 'spraying' = addresses with FAIL events against at least `min_users` DIFFERENT user names (any time); 'compromised' = addresses with an OK event AFTER (or at the same time, later in the sorted order) they had become a 'bruteforce' address, that is after the failure that completed the threshold."""
        pass
  tests:
  - name: brute force
    code: |
      log = ["100 1.1.1.1 ada FAIL", "101 1.1.1.1 ada FAIL", "102 1.1.1.1 ada FAIL", "500 2.2.2.2 bo FAIL", "900 2.2.2.2 bo FAIL", "1300 2.2.2.2 bo FAIL", "105 3.3.3.3 cy OK"]
      r = analyze_log(log, 3, 10, 3)
      assert r == {"bruteforce": ["1.1.1.1"], "spraying": [], "compromised": []}
      assert analyze_log(log, 3, 800, 3)["bruteforce"] == ["1.1.1.1", "2.2.2.2"] and analyze_log(log, 3, 1, 3)["bruteforce"] == [] and analyze_log(log, 2, 1, 3)["bruteforce"] == ["1.1.1.1"] and analyze_log([], 3, 10, 3) == {"bruteforce": [], "spraying": [], "compromised": []}
  - name: spraying and compromise
    code: |
      log = ["10 9.9.9.9 ada FAIL", "11 9.9.9.9 bo FAIL", "12 9.9.9.9 cy FAIL", "13 9.9.9.9 di FAIL", "50 8.8.8.8 ada FAIL", "51 8.8.8.8 ada FAIL", "52 8.8.8.8 ada FAIL", "53 8.8.8.8 ada OK", "20 7.7.7.7 ada OK", "21 7.7.7.7 ada FAIL", "22 7.7.7.7 ada FAIL", "23 7.7.7.7 ada FAIL", "1000 7.7.7.7 ada OK"]
      r = analyze_log(log, 3, 5, 3)
      assert r == {"bruteforce": ["7.7.7.7", "8.8.8.8", "9.9.9.9"], "spraying": ["9.9.9.9"], "compromised": ["7.7.7.7", "8.8.8.8"]}
      r2 = analyze_log(log, 5, 5, 5)
      assert r2 == {"bruteforce": [], "spraying": [], "compromised": []}
      assert analyze_log(log, 3, 5, 4)["spraying"] == ["9.9.9.9"] and analyze_log(log, 3, 5, 5)["spraying"] == []
  - name: messy input
    code: |
      log = ["bad line", "10 1.1.1.1 ada FAIL", "x 1.1.1.1 ada FAIL", "11 1.1.1.1 ada FAIL extra", "12 1.1.1.1 ada MAYBE", "", "-5 1.1.1.1 ada FAIL", "10 1.1.1.1 ada FAIL", "10 1.1.1.1 bo FAIL"]
      assert analyze_log(log, 3, 0, 2) == {"bruteforce": ["1.1.1.1"], "spraying": ["1.1.1.1"], "compromised": []}
      unordered = ["30 5.5.5.5 a FAIL", "10 5.5.5.5 a FAIL", "20 5.5.5.5 a FAIL", "25 5.5.5.5 a OK", "35 5.5.5.5 a OK"]
      assert analyze_log(unordered, 3, 20, 2) == {"bruteforce": ["5.5.5.5"], "spraying": [], "compromised": ["5.5.5.5"]} and analyze_log(unordered, 3, 19, 2)["bruteforce"] == []
  hints:
  - Sort the events by time first, then walk through them once.
  - Keep for each address the times of its recent failures and drop the ones outside the window.
  solution: |
    def analyze_log(lines, threshold, window, min_users):
        """Read a login log. Each line is 'SECONDS IP USER RESULT' (four words; RESULT is OK or FAIL); skip lines that are malformed (not four words, SECONDS not a whole number, RESULT anything else). Handle the events in the order of their time (stable for equal times). Return a dict of three sorted lists of IP addresses: 'bruteforce' = addresses with at least `threshold` FAIL events inside some window of `window` seconds (last time minus first time <= window); 'spraying' = addresses with FAIL events against at least `min_users` DIFFERENT user names (any time); 'compromised' = addresses with an OK event AFTER (or at the same time, later in the sorted order) they had become a 'bruteforce' address, that is after the failure that completed the threshold."""
        events = []
        for line in lines:
            w = line.split()
            if len(w) != 4 or not w[0].isdigit() or w[3] not in ("OK", "FAIL"):
                continue
            events.append((int(w[0]), w[1], w[2], w[3]))
        events.sort(key=lambda e: e[0])
        recent, users, flagged, compromised = {}, {}, set(), set()
        for t, ip, user, result in events:
            if result == "FAIL":
                users.setdefault(ip, set()).add(user)
                times = recent.setdefault(ip, [])
                times.append(t)
                while t - times[0] > window:
                    times.pop(0)
                if len(times) >= threshold:
                    flagged.add(ip)
            elif ip in flagged:
                compromised.add(ip)
        spraying = sorted(ip for ip, u in users.items() if len(u) >= min_users)
        return {"bruteforce": sorted(flagged), "spraying": spraying, "compromised": sorted(compromised)}
  explanation: Security teams run this kind of rule all day over millions of lines and send alerts when something fires. Combine it with the rate limits and lockouts of lesson 4.
commonMistakes:
- title: Treating security as a final step
  explanation: Design for it from the start.
- title: Never updating dependencies
  explanation: Known holes stay open.
- title: Committing secrets to Git
  explanation: History keeps them forever.
- title: Logging passwords or tokens
  explanation: Logs are read by many people.
- title: No plan for an incident
  explanation: Panic costs more than preparation.
summary:
- 'Threat modelling: what can go wrong at each trust boundary (STRIDE).'
- Risk = likelihood × impact; mitigate, avoid, transfer or accept.
- Keep dependencies updated and scanned.
- Keep secrets out of code; revoke leaked ones.
- Log, monitor and have an incident plan.
