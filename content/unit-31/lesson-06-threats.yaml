id: u31-threats
title: Threat Modelling and Defence in Practice
minutes: 110
objective: 'Learn to think about security as a whole: find threats with STRIDE, rank risks, keep dependencies updated, scan for leaked secrets and read logs to catch attacks. This lesson ties the unit together.'
outcomes:
- Use STRIDE to find threats
- Rank risks by likelihood and impact
- Explain supply-chain risk and dependency scanning
- Find leaked secrets
- Detect brute force and spraying in logs
sections:
- heading: Find the threats first
  body: |-
    Security work starts with a question: **what are we protecting, from whom, and how might they get at it?** Drawing a **data-flow diagram** (users, programs, stores of data and the arrows between them) shows the **trust boundaries**, the places where data moves between parts with different levels of trust. These are where attacks happen.

    For each arrow or box ask the six **STRIDE** questions: Can someone **spoof** an identity? **Tamper** with data? **Repudiate** (deny doing something, because nothing was logged)? Cause **information disclosure**? Cause **denial of service**? Gain **elevated privilege**? The answers become a list of **threats**, each with a **mitigation** (a defence) from this unit: hashing and slow password storage, encryption and MACs, input escaping and placeholders, sessions, roles and lockouts, headers and TLS.

    You cannot fix everything, so you **rank** by **risk** = likelihood × impact and decide for each item: **mitigate** it, **avoid** it (drop the feature), **transfer** it (insurance, or let a specialist service handle it) or **accept** it, in writing. Remember **defence in depth**: layers, so that one failure is not the end, and **least privilege**, so that a break-in has limited reach.
- heading: Supply chain, secrets and monitoring
  body: |-
    **Supply chain.** Your program is mostly other people's code. A known bug in a library (a **CVE**, Common Vulnerabilities and Exposures entry, with a **severity** from the **CVSS** score) is a hole in your program. Keep a list of dependencies (a **software bill of materials**, SBOM), **pin** versions, **update** regularly with tests as a safety net, and run a dependency scanner. Beware **typosquatting** (a malicious package named almost like a popular one) and install only from sources you trust.

    **Secrets.** Passwords, keys and tokens do not belong in code or in repositories. Keep them in environment variables or a **secrets manager**, give each its own **least-privilege** key, **rotate** them regularly, and scan for leaks (secret scanners look for known formats and for high-**entropy** random strings). If one leaks, **revoke** it at once.

    **Detect and respond.** Prevention fails sometimes, so keep **logs** (what happened, when, from where, but never passwords), watch for patterns (many failures from one address is **brute force**; one address trying many accounts with few passwords each is **password spraying**; a success right after failures suggests a break-in) and have an **incident response** plan: contain, investigate, fix, recover, and learn. Keep **backups** and test restoring them.

    > **Warning:** Learning how attacks work is for defending. Only test systems you own or have written permission to test. Security researchers follow **responsible disclosure**: report a flaw privately to the owner and give time to fix it.
examples:
- title: Threats, risks and dependencies
  intro: Classify threats, rank four risks and scan two libraries against two advisories.
  code: |
    STRIDE = ["Spoofing", "Tampering", "Repudiation", "Information disclosure", "Denial of service", "Elevation of privilege"]


    def stride_categories(threat, keywords):
        """Threat modelling with STRIDE: six kinds of threat. `keywords` is a dict {category: list of key words or phrases}. Return the list of categories (in the order of the STRIDE list above) for which at least one keyword occurs in the threat text as a WHOLE WORD or phrase (use re.search with \\b around re.escape(keyword); ignore upper and lower case). A category missing from the dict has no keywords. No match gives an empty list."""
        import re
        text = threat.lower()
        found = []
        for category in STRIDE:
            for k in keywords.get(category, []):
                if re.search(r"\b" + re.escape(k.lower()) + r"\b", text):
                    found.append(category)
                    break
        return found


    def risk_score(likelihood, impact):
        """The classic RISK = LIKELIHOOD x IMPACT, each rated from 1 (lowest) to 5 (highest). ValueError('rating must be 1 to 5') unless both are whole numbers in that range (bool is not accepted). Return the product."""
        for v in (likelihood, impact):
            if not isinstance(v, int) or isinstance(v, bool) or not 1 <= v <= 5:
                raise ValueError("rating must be 1 to 5")
        return likelihood * impact


    def risk_level(score):
        """Name the score: 'low' for 1 to 4, 'medium' for 5 to 9, 'high' for 10 to 16 and 'critical' for 17 to 25. ValueError('bad score') for anything else."""
        if not isinstance(score, int) or not 1 <= score <= 25:
            raise ValueError("bad score")
        return "low" if score <= 4 else "medium" if score <= 9 else "high" if score <= 16 else "critical"


    def rank_risks(risks):
        """`risks` is a dict {name: (likelihood, impact)}. Return the list of (name, score, level) sorted with the highest score first and, for equal scores, by name (alphabetical). Bad ratings raise the ValueError of risk_score."""
        rows = [(name, risk_score(l, i)) for name, (l, i) in risks.items()]
        rows.sort(key=lambda r: (-r[1], r[0]))
        return [(name, score, risk_level(score)) for name, score in rows]


    def compare_versions(a, b):
        """Compare two version texts such as '1.10.2' and '1.9'. Split at '.', every part must be a whole number (ValueError('bad version') otherwise, also for an empty text). A missing part counts as 0 ('1.2' equals '1.2.0'). Compare number by number (so 1.10 is newer than 1.9). Return -1 if a is older, 0 if equal, 1 if a is newer."""
        def parts(v):
            p = v.split(".")
            if not all(x.isdigit() for x in p):
                raise ValueError("bad version")
            return [int(x) for x in p]
        pa, pb = parts(a), parts(b)
        n = max(len(pa), len(pb))
        pa, pb = pa + [0] * (n - len(pa)), pb + [0] * (n - len(pb))
        return (pa > pb) - (pa < pb)


    def version_matches(version, spec):
        """Does `version` satisfy the specification `spec`? The spec is one or more clauses separated by commas, each an operator followed by a version: '<1.4.2', '>=1.0,<1.4.2', '==2.0'. The operators are <, <=, >, >= and == (ignore blanks around parts). ALL clauses must hold (check every clause for validity first). ValueError('bad spec') for an empty clause or an unknown operator."""
        ops = ["<=", ">=", "==", "<", ">"]
        clauses = []
        for clause in spec.split(","):
            clause = clause.strip()
            op = next((o for o in ops if clause.startswith(o)), None)
            if op is None or not clause[len(op):].strip():
                raise ValueError("bad spec")
            clauses.append((op, clause[len(op):].strip()))
        for op, target in clauses:
            c = compare_versions(version, target)
            ok = {"<": c < 0, "<=": c <= 0, ">": c > 0, ">=": c >= 0, "==": c == 0}[op]
            if not ok:
                return False
        return True


    def scan_dependencies(deps, advisories):
        """Every program depends on libraries, and libraries have known vulnerabilities (listed in advisories such as CVE entries). `deps` is a dict {package: installed version}; `advisories` a list of dicts {'id': text, 'package': name, 'affected': spec (as for version_matches), 'severity': 'low'/'medium'/'high'/'critical'}. Return the list of (id, package, version, severity) for every advisory whose package is installed in a version that matches the affected spec, sorted with the most severe first (critical, high, medium, low) and then by id."""
        order = {"critical": 0, "high": 1, "medium": 2, "low": 3}
        hits = []
        for adv in advisories:
            v = deps.get(adv["package"])
            if v is not None and version_matches(v, adv["affected"]):
                hits.append((adv["id"], adv["package"], v, adv["severity"]))
        hits.sort(key=lambda h: (order[h[3]], h[0]))
        return hits

    kw = {"Spoofing": ["impersonate", "fake"], "Tampering": ["modify", "change"], "Information disclosure": ["leak", "expose"], "Denial of service": ["flood", "crash"]}
    for threat in ("An attacker can impersonate a teacher", "Anyone can modify the grades table", "Exam answers leak through the log files"):
        print(threat, "->", stride_categories(threat, kw))
    risks = {"phishing": (5, 4), "sql injection": (3, 5), "lost laptop": (3, 3), "ddos": (2, 4)}
    for row in rank_risks(risks):
        print(row)
    deps = {"requests": "2.19.0", "flask": "2.3.1"}
    adv = [{"id": "CVE-A", "package": "requests", "affected": "<2.20.0", "severity": "high"}, {"id": "CVE-B", "package": "flask", "affected": "<2.3.0", "severity": "critical"}]
    print(scan_dependencies(deps, adv))
  output: |
    An attacker can impersonate a teacher -> ['Spoofing']
    Anyone can modify the grades table -> ['Tampering']
    Exam answers leak through the log files -> ['Information disclosure']
    ('phishing', 20, 'critical')
    ('sql injection', 15, 'high')
    ('lost laptop', 9, 'medium')
    ('ddos', 8, 'medium')
    [('CVE-A', 'requests', '2.19.0', 'high')]
  lines:
  - line: 82
    note: Keywords decide which of the six questions apply.
  - line: 85
    note: Phishing is the biggest risk here.
  - line: 89
    note: Only the old requests version is affected; flask 2.3.1 is already fixed.
- title: Secrets and logs
  intro: Find a leaked key and a password in code, then read a login log.
  code: |
    def shannon_entropy(text):
        """The SHANNON ENTROPY of the text in bits per character: the sum over the different characters of -p * log2(p), where p is the share of that character (use math.log2). The empty text has entropy 0.0. Random secrets have a high entropy (about 4 or more); ordinary words and repeated text have a low one."""
        import math
        if not text:
            return 0.0
        n = len(text)
        return -sum((c / n) * math.log2(c / n) for c in (text.count(ch) for ch in set(text)))


    def find_secrets(text):
        """A SECRET SCANNER finds passwords and keys that were pasted into code. Go through the text line by line (numbers start at 1) and return the sorted list of (line number, kind) pairs, each kind at most once per line. The kinds: 'aws key' for AKIA followed by 16 upper-case letters or digits; 'private key' for a '-----BEGIN ' ... 'PRIVATE KEY-----' marker; 'hardcoded password' for a word password, passwd, secret, token or api_key / api-key / apikey (any case) followed by optional blanks, ':' or '=', optional blanks and a quoted value of at least 6 characters without blanks (single or double quotes); and 'high entropy string' for a run of at least 24 characters from A-Z a-z 0-9 + / = _ - whose shannon_entropy is at least 4.0."""
        import re
        patterns = [("aws key", re.compile(r"AKIA[0-9A-Z]{16}")), ("private key", re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")), ("hardcoded password", re.compile(r"(?i)(password|passwd|secret|token|api[_-]?key)\s*[:=]\s*['\"][^'\"\s]{6,}['\"]"))]
        token = re.compile(r"[A-Za-z0-9+/=_-]{24,}")
        found = set()
        for number, line in enumerate(text.splitlines(), 1):
            for kind, pattern in patterns:
                if pattern.search(line):
                    found.add((number, kind))
            if any(shannon_entropy(t) >= 4.0 for t in token.findall(line)):
                found.add((number, "high entropy string"))
        return sorted(found)


    def analyze_log(lines, threshold, window, min_users):
        """Read a login log. Each line is 'SECONDS IP USER RESULT' (four words; RESULT is OK or FAIL); skip lines that are malformed (not four words, SECONDS not a whole number, RESULT anything else). Handle the events in the order of their time (stable for equal times). Return a dict of three sorted lists of IP addresses: 'bruteforce' = addresses with at least `threshold` FAIL events inside some window of `window` seconds (last time minus first time <= window); 'spraying' = addresses with FAIL events against at least `min_users` DIFFERENT user names (any time); 'compromised' = addresses with an OK event AFTER (or at the same time, later in the sorted order) they had become a 'bruteforce' address, that is after the failure that completed the threshold."""
        events = []
        for line in lines:
            w = line.split()
            if len(w) != 4 or not w[0].isdigit() or w[3] not in ("OK", "FAIL"):
                continue
            events.append((int(w[0]), w[1], w[2], w[3]))
        events.sort(key=lambda e: e[0])
        recent, users, flagged, compromised = {}, {}, set(), set()
        for t, ip, user, result in events:
            if result == "FAIL":
                users.setdefault(ip, set()).add(user)
                times = recent.setdefault(ip, [])
                times.append(t)
                while t - times[0] > window:
                    times.pop(0)
                if len(times) >= threshold:
                    flagged.add(ip)
            elif ip in flagged:
                compromised.add(ip)
        spraying = sorted(ip for ip, u in users.items() if len(u) >= min_users)
        return {"bruteforce": sorted(flagged), "spraying": spraying, "compromised": sorted(compromised)}

    code = 'import boto3\nkey = "AKIAIOSFODNN7EXAMPLE"\npassword = "hunter2hunter2"\nprint("hello")\n'
    print(find_secrets(code))
    print(round(shannon_entropy("correct horse battery staple"), 2), round(shannon_entropy("wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY"), 2))
    log = ["100 1.1.1.1 ada FAIL", "101 1.1.1.1 ada FAIL", "102 1.1.1.1 ada FAIL", "103 1.1.1.1 ada OK", "200 2.2.2.2 ada FAIL", "201 2.2.2.2 bo FAIL", "202 2.2.2.2 cy FAIL", "300 3.3.3.3 di OK"]
    print(analyze_log(log, 3, 10, 3))
  output: |
    [(2, 'aws key'), (3, 'hardcoded password')]
    3.49 4.71
    {'bruteforce': ['1.1.1.1', '2.2.2.2'], 'spraying': ['2.2.2.2'], 'compromised': ['1.1.1.1']}
  lines:
  - line: 50
    note: The key on line 2 and the password on line 3.
  - line: 51
    note: Random text has a higher entropy than words.
  - line: 53
    note: One address guessed its way in; another tried three different accounts.
