        pass


    def risk_level(score):
        """Name the score: 'low' for 1 to 4, 'medium' for 5 to 9, 'high' for 10 to 16 and 'critical' for 17 to 25. ValueError('bad score') for anything else."""
        pass


    def rank_risks(risks):
        """`risks` is a dict {name: (likelihood, impact)}. Return the list of (name, score, level) sorted with the highest score first and, for equal scores, by name (alphabetical). Bad ratings raise the ValueError of risk_score."""
        pass
  tests:
  - name: scores and levels
    code: |
      assert risk_score(1, 1) == 1 and risk_score(5, 5) == 25 and risk_score(3, 4) == 12 and risk_score(2, 5) == 10
      for l, i in ((0, 3), (3, 6), (2.5, 3), ("2", 3), (True, 3), (3, None), (-1, 2)):
          try:
              risk_score(l, i)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "rating must be 1 to 5" in str(e)
      assert [risk_level(s) for s in (1, 4, 5, 9, 10, 16, 17, 25)] == ["low", "low", "medium", "medium", "high", "high", "critical", "critical"]
      for bad in (0, 26, -3, 2.5, "x"):
          try:
              risk_level(bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "bad score" in str(e)
  - name: ranking
