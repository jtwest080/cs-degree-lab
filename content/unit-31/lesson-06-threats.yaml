exercises:
- id: stride
  title: Thinking like an attacker
  difficulty: 3
  prompt: '**Threat modelling** means asking, before attackers do, *what can go wrong?* A popular checklist is **STRIDE**: **S**poofing (pretending to be someone), **T**ampering (changing data), **R**epudiation (denying an action), **I**nformation disclosure (leaks), **D**enial of service (making it unavailable) and **E**levation of privilege (gaining rights). The list `STRIDE` is given. Write `stride_categories(threat, keywords)`: `keywords` is a dict `{category: list of key words or phrases}`. Return the list of categories (in the order of `STRIDE`) for which at least one keyword occurs in the threat text as a **whole word or phrase** (use `re.search` with `\\b` around `re.escape(keyword)`; ignore upper and lower case). A category missing from the dict has no keywords. No match gives an empty list.'
  starter: |-
    STRIDE = ["Spoofing", "Tampering", "Repudiation", "Information disclosure", "Denial of service", "Elevation of privilege"]


    def stride_categories(threat, keywords):
        """Threat modelling with STRIDE: six kinds of threat. `keywords` is a dict {category: list of key words or phrases}. Return the list of categories (in the order of the STRIDE list above) for which at least one keyword occurs in the threat text as a WHOLE WORD or phrase (use re.search with \\b around re.escape(keyword); ignore upper and lower case). A category missing from the dict has no keywords. No match gives an empty list."""
        pass
  tests:
  - name: matching
    code: |
      kw = {"Spoofing": ["impersonate", "fake login"], "Tampering": ["modify", "alter"], "Repudiation": ["deny", "no log"], "Information disclosure": ["leak", "expose"], "Denial of service": ["flood", "crash"], "Elevation of privilege": ["admin", "escalate"]}
      assert stride_categories("An attacker can impersonate a teacher", kw) == ["Spoofing"] and stride_categories("The server can crash when flooded with requests", kw) == ["Denial of service"] and stride_categories("Users can deny sending the order because there is no log", kw) == ["Repudiation"]
      assert stride_categories("A user can leak data and then escalate to admin", kw) == ["Information disclosure", "Elevation of privilege"] and stride_categories("Attacker may MODIFY prices and Impersonate the shop", kw) == ["Spoofing", "Tampering"] and stride_categories("Nothing to see", kw) == [] and stride_categories("", kw) == []
  - name: whole words
    code: |
      kw = {"Tampering": ["alter", "change log"], "Denial of service": ["flood"], "Spoofing": ["fake login"]}
      assert stride_categories("Alteration of files", kw) == [] and stride_categories("alter", kw) == ["Tampering"] and stride_categories("A fake login page", kw) == ["Spoofing"] and stride_categories("fake logins", kw) == [] and stride_categories("a flood!", kw) == ["Denial of service"] and stride_categories("floodgate", kw) == []
      assert stride_categories("alter flood fake login", kw) == ["Spoofing", "Tampering", "Denial of service"] and stride_categories("anything", {}) == []
  hints:
  - Loop over STRIDE in order so that the result is already sorted.
  - re.escape protects special characters inside the keyword.
  solution: |
    STRIDE = ["Spoofing", "Tampering", "Repudiation", "Information disclosure", "Denial of service", "Elevation of privilege"]


    def stride_categories(threat, keywords):
        """Threat modelling with STRIDE: six kinds of threat. `keywords` is a dict {category: list of key words or phrases}. Return the list of categories (in the order of the STRIDE list above) for which at least one keyword occurs in the threat text as a WHOLE WORD or phrase (use re.search with \\b around re.escape(keyword); ignore upper and lower case). A category missing from the dict has no keywords. No match gives an empty list."""
        import re
        text = threat.lower()
        found = []
        for category in STRIDE:
            for k in keywords.get(category, []):
                if re.search(r"\b" + re.escape(k.lower()) + r"\b", text):
                    found.append(category)
                    break
        return found
  explanation: 'Run STRIDE on every arrow of a data-flow diagram: each place where data crosses a boundary is a place to ask the six questions.'
- id: risk
  title: Ranking risks
  difficulty: 3
  prompt: 'You cannot fix everything, so you rank risks. The classic score is **likelihood × impact**, each rated from 1 (lowest) to 5 (highest). Write `risk_score(likelihood, impact)`: `ValueError("rating must be 1 to 5")` unless both are whole numbers in that range (a `bool` is not accepted); return the product. Write `risk_level(score)`: `"low"` for 1 to 4, `"medium"` for 5 to 9, `"high"` for 10 to 16 and `"critical"` for 17 to 25; `ValueError("bad score")` for anything else. Write `rank_risks(risks)`: `risks` is a dict `{name: (likelihood, impact)}`. Return the list of `(name, score, level)` sorted with the **highest score first** and, for equal scores, by name (alphabetical). Bad ratings raise the `ValueError` of `risk_score`.'
