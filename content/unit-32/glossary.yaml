# Terms introduced in Unit 32 (AI-Assisted Coding). `lesson` is the id of the lesson that introduces the term.
terms:
- term: AI coding assistant
  definition: A program built on a language model that helps write, explain and fix code.
  lesson: u32-prompts
- term: LLM
  definition: Short for large language model.
  lesson: u32-prompts
- term: Completion
  definition: The text a model writes in reply to a prompt.
  lesson: u32-prompts
- term: Context window
  definition: The most tokens a model can read at once, including its own reply.
  lesson: u32-prompts
- term: Few-shot prompting
  definition: Giving a model a few solved examples before the real question.
  lesson: u32-prompts
- term: System message
  definition: Standing instructions at the start of a chat.
  lesson: u32-prompts
- term: Retrieval
  definition: Searching for relevant material to put into the prompt.
  lesson: u32-prompts
- term: Slopsquatting
  definition: Publishing malicious packages under names that AI assistants tend to invent.
  lesson: u32-review
- term: Bare except
  definition: An except clause without an exception type, which hides every error.
  lesson: u32-review
- term: Differential testing
  definition: Comparing two implementations on many inputs and looking at the differences.
  lesson: u32-verify
- term: Reference implementation
  definition: A simple trusted version used to check another one.
  lesson: u32-verify
- term: Bug report
  definition: A description of a problem with what was expected, what happened and how to repeat it.
  lesson: u32-debug
- term: Fake model
  definition: A pretend model that returns prepared replies so that tests are repeatable.
  lesson: u32-debug
- term: Iteration loop
  definition: Asking, checking and giving feedback again and again.
  lesson: u32-debug
- term: Symptom
  definition: What you can see of a bug, as opposed to its cause.
  lesson: u32-debug
- term: Agent
  definition: A program that lets a model use tools in a loop to reach a goal.
  lesson: u32-agents
- term: Tool call
  definition: A request from a model to run a function with given arguments.
  lesson: u32-agents
- term: Observation
  definition: The result of a tool call given back to the model.
  lesson: u32-agents
- term: Guardrail
  definition: A rule enforced in code that limits what an agent may do.
  lesson: u32-agents
- term: Allow-list of tools
  definition: A list of the only tools an agent may use.
  lesson: u32-agents
- term: Human in the loop
  definition: A person who approves risky actions.
  lesson: u32-agents
- term: Model Context Protocol
  definition: A standard way of offering tools and data to AI models.
  lesson: u32-agents
- term: Sandbox
  definition: A restricted environment where code can run without harming the rest of the computer.
  lesson: u32-agents
- term: Redaction
  definition: Removing or replacing sensitive parts of a text.
  lesson: u32-risks
- term: Personal data
  definition: Information that identifies a person.
  lesson: u32-risks
- term: Local model
  definition: A model that runs on your own computer.
  lesson: u32-risks
- term: SPDX
  definition: A standard list of short names for software licenses.
  lesson: u32-risks
