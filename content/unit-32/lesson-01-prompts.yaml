id: u32-prompts
title: 'Talking to an AI: Prompts and Context'
minutes: 110
objective: Learn how AI coding assistants work from the outside and how to ask them well. You will estimate tokens and fit material into a context window, build structured prompts with examples, read replies and check a prompt for gaps.
outcomes:
- Explain what a language model does and does not do
- Estimate tokens and fit material into a context window
- Build a structured prompt with constraints and examples
- Extract code from a reply
- Check a prompt for missing information
sections:
- heading: What an AI assistant really is
  body: |-
    An **AI coding assistant** is a program built on a **large language model** (LLM): a huge mathematical function trained on enormous amounts of text and code to **predict what text comes next**. You give it a **prompt** (your text) and it writes a **completion** (its reply), one **token** at a time. A token is a small piece of text, roughly four characters of English or a short word.

    This explains both its power and its weaknesses. It has seen millions of programs, so it writes good code quickly for common problems and explains errors well. But it does not **run** the code in its head and it does not **know** facts: it produces text that *looks likely*. Sometimes that text is wrong but sounds confident; this is called a **hallucination** (for example a function or a library that does not exist). Its reply can differ each time you ask (a setting called **temperature** controls how much it varies). It also has no memory of earlier conversations unless they are included in the prompt.

    So the right mental model is: **a very fast, well-read junior colleague who never tires, sometimes bluffs, and cannot see your screen**. You stay the engineer: you decide what to build, you give it what it needs, and you check everything it produces. This unit teaches those three habits.
- heading: The context window and what to send
  body: |-
    A model can read only a limited number of tokens at once: its **context window**. Your prompt, any files you include and the reply must all fit. Longer prompts also cost more and are slower, and models pay less attention to the middle of very long texts. So choose carefully: include the **error message**, the **relevant function**, and a short description of what you want, not the whole project.

    Tools such as coding agents solve this by **retrieval**: they search your project and send only the pieces that look relevant. When you work by hand, you do the same: paste the failing code, the exact error, the version of the language and what you already tried.
- heading: How to write a good prompt
  body: |-
    Treat a prompt like a **specification** for a person who knows programming but nothing about your project. A good prompt has:

    1. **A clear goal** with a verb: "Write a function that…", not "help with sorting".
    2. **Context**: language and version, libraries, what the code is for, what already exists.
    3. **Constraints**: what it must or must not do ("no external libraries", "keep the function names", "explain each step").
    4. **Examples** of input and expected output. **Few-shot prompting** (a few worked examples) often teaches the format better than a paragraph of description.
    5. **The output format**: "one code block, then a short explanation", "a JSON list", "only the changed lines".

    Then **iterate**: read the answer, say what is wrong, and ask again. Small, focused requests work better than "build me an app". Ask for **reasoning** when it matters ("explain why this works"), ask for **alternatives**, and when it goes in circles, **start a fresh conversation** with a better prompt.

    > **Learning warning:** If you let the assistant write everything, you do not learn, and you cannot check its work. Use it like a tutor: first try yourself, then ask it to explain, review or improve your solution.
examples:
- title: Tokens and structured prompts
  intro: Estimate tokens, choose what fits into a budget, and build a prompt with context, a rule, an example and a format.
  code: |
    def estimate_tokens(text):
        """AI models read TOKENS: pieces of text, roughly four characters of English each. Estimate the number of tokens as the number of characters divided by 4, ROUNDED UP (an empty text is 0 tokens). Use whole-number arithmetic: (len(text) + 3) // 4. A model can read only so many tokens at once (its CONTEXT WINDOW), and longer prompts cost more."""
        return (len(text) + 3) // 4


    def fit_context(chunks, budget):
        """You have more material than fits in the context window. `chunks` is a list of (name, text) in PRIORITY order (most important first) and `budget` the number of tokens you may use. Go through the chunks in order and keep a chunk if its estimated tokens fit into what is still left; a chunk that does not fit is skipped, but later (smaller) chunks may still fit. Return (the list of kept names in the original order, the total tokens used). ValueError('budget must not be negative') for a negative budget."""
        if budget < 0:
            raise ValueError("budget must not be negative")
        kept, used = [], 0
        for name, text in chunks:
            cost = estimate_tokens(text)
            if used + cost <= budget:
                kept.append(name)
                used += cost
        return kept, used


    def build_prompt(task, context="", constraints=(), examples=(), output_format=""):
        """A good PROMPT (the instructions you give an AI) states the task, the background, the rules, an example and the shape of the answer. Build the text from sections joined by ONE BLANK LINE (two newlines). ValueError('task is required') if the task is empty or only blanks. The sections, each only when it is given, in this order: 'Task:' then a newline and the stripped task; 'Context:' and the stripped context (skip if empty or only blanks); 'Constraints:' and one line '- ' + text for every constraint; 'Examples:' and for every (input, output) pair the two lines 'Input: ' + input and 'Output: ' + output, with a blank line between pairs; 'Output format:' and the stripped output_format (skip if empty)."""
        if not task.strip():
            raise ValueError("task is required")
        parts = ["Task:\n" + task.strip()]
        if context.strip():
            parts.append("Context:\n" + context.strip())
        if constraints:
            parts.append("Constraints:\n" + "\n".join("- " + c for c in constraints))
        if examples:
            parts.append("Examples:\n" + "\n\n".join("Input: " + i + "\nOutput: " + o for i, o in examples))
        if output_format.strip():
            parts.append("Output format:\n" + output_format.strip())
        return "\n\n".join(parts)


    def few_shot(examples, query):
        """FEW-SHOT prompting shows the model a few solved examples and then asks for a new one. `examples` is a list of (input, output) pairs. Return the pairs as 'Input: ' + input + a newline + 'Output: ' + output, each pair followed by a blank line, and at the end 'Input: ' + query + a newline + 'Output:' (nothing after the colon, so that the model continues there). With no examples only the last two lines remain."""
        shots = "".join("Input: " + i + "\nOutput: " + o + "\n\n" for i, o in examples)
        return shots + "Input: " + query + "\nOutput:"

    print(estimate_tokens("Write a function that reverses a string."))
    chunks = [("question", "Why does my code crash?"), ("traceback", "Traceback line " * 40), ("big file", "def f(): pass\n" * 300), ("config", "DEBUG=1\n" * 5)]
    print(fit_context(chunks, 200))
    prompt = build_prompt("Write a Python function is_even(n).", "Used in a grading script.", ["No imports"], [("4", "True")], "Only one code block")
    print(prompt)
    print(few_shot([("cat", "animal")], "oak"))
  output: |
    10
    (['question', 'traceback', 'config'], 166)
    Task:
    Write a Python function is_even(n).

    Context:
    Used in a grading script.

    Constraints:
    - No imports

    Examples:
    Input: 4
    Output: True

    Output format:
    Only one code block
    Input: cat
    Output: animal

    Input: oak
    Output:
  lines:
  - line: 40
    note: A short sentence is only a handful of tokens.
  - line: 42
    note: The big file is skipped; the small chunks still fit.
  - line: 44
    note: Every section has a label, so nothing is ambiguous.
  - line: 45
    note: The prompt ends where the model should continue.
- title: Reading a reply
  intro: Pull the code out of a chatty reply, and check two prompts for gaps.
  code: |
    def parse_code_block(reply):
        """Models answer with chatty text around the code. Extract the FIRST fenced code block of a reply: the lines between a line that starts (after blanks) with three backticks (the opening may carry a language name such as python) and the next line that is only three backticks (blanks around are allowed). If the closing fence is missing (the answer was cut off) the code runs to the end. Return the code lines joined with newlines (no newline at the very end), or None if there is no fence. An empty block gives an empty text."""
        lines = reply.split("\n")
        start = None
        for i, line in enumerate(lines):
            if line.strip().startswith("```"):
                start = i
                break
        if start is None:
            return None
        code = []
        for line in lines[start + 1:]:
            if line.strip() == "```":
                break
            code.append(line)
        return "\n".join(code)


    def prompt_checklist(prompt):
        """A quick quality check of a prompt text (all matches ignore upper and lower case and need WHOLE words). Return the list of missing items, in this order: 'goal' unless some word is an action verb from write, create, build, fix, explain, refactor, convert, review, add, implement, generate, find, list, make, summarize; 'language' unless a word is one of python, javascript, typescript, java, sql, html, css, rust, bash; 'example' unless one of the words example, examples, input appears (also accept the text 'e.g.' or 'for instance'); 'constraints' unless one of must, should, only, without, never, avoid appears (also accept 'do not', 'don't' or 'at most'); 'output format' unless one of format, return, respond, json, table, bullet appears."""
        import re
        text = prompt.lower()
        words = set(re.findall(r"[a-z']+", text))
        missing = []
        if not words & {"write", "create", "build", "fix", "explain", "refactor", "convert", "review", "add", "implement", "generate", "find", "list", "make", "summarize"}:
            missing.append("goal")
        if not words & {"python", "javascript", "typescript", "java", "sql", "html", "css", "rust", "bash"}:
            missing.append("language")
        if not (words & {"example", "examples", "input"} or "e.g." in text or "for instance" in text):
            missing.append("example")
        if not (words & {"must", "should", "only", "without", "never", "avoid", "don't"} or "do not" in text or "at most" in text):
            missing.append("constraints")
        if not words & {"format", "return", "respond", "json", "table", "bullet"}:
            missing.append("output format")
        return missing

    fence = "`" * 3
    reply = "Sure! Here is the code:\n" + fence + "python\nprint('hi')\n" + fence + "\nLet me know."
    print(parse_code_block(reply))
    print(parse_code_block("I cannot help with that."))
    print(prompt_checklist("make it better"))
    print(prompt_checklist("Write a Python function that returns the median, e.g. median([1, 3, 2]) is 2. It must not use imports."))
  output: |
    print('hi')
    None
    ['language', 'example', 'constraints', 'output format']
    ['output format']
  lines:
  - line: 39
    note: Only the code is kept.
  - line: 40
    note: No fence means no code, so you get None.
  - line: 41
    note: Four gaps in a three-word prompt.
  - line: 42
    note: A solid prompt has no gaps.
