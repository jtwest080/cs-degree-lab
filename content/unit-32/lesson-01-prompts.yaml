exercises:
- id: tokens
  title: Tokens and the context window
  difficulty: 3
  prompt: 'An AI model reads **tokens**, small pieces of text of roughly four characters, and it can read only so many at once (its **context window**). Longer prompts also cost more and are slower. Write `estimate_tokens(text)`: the number of characters divided by 4, **rounded up** (an empty text is 0 tokens); use whole-number arithmetic `(len(text) + 3) // 4`. Write `fit_context(chunks, budget)`: `chunks` is a list of `(name, text)` in **priority order** (most important first) and `budget` the number of tokens you may use. Go through the chunks in order and keep a chunk if its estimated tokens fit into what is still left; a chunk that does not fit is **skipped**, but later (smaller) chunks may still fit. Return `(list of kept names in the original order, total tokens used)`. `ValueError("budget must not be negative")` for a negative budget.'
  starter: |-
    def estimate_tokens(text):
        """AI models read TOKENS: pieces of text, roughly four characters of English each. Estimate the number of tokens as the number of characters divided by 4, ROUNDED UP (an empty text is 0 tokens). Use whole-number arithmetic: (len(text) + 3) // 4. A model can read only so many tokens at once (its CONTEXT WINDOW), and longer prompts cost more."""
        pass


    def fit_context(chunks, budget):
        """You have more material than fits in the context window. `chunks` is a list of (name, text) in PRIORITY order (most important first) and `budget` the number of tokens you may use. Go through the chunks in order and keep a chunk if its estimated tokens fit into what is still left; a chunk that does not fit is skipped, but later (smaller) chunks may still fit. Return (the list of kept names in the original order, the total tokens used). ValueError('budget must not be negative') for a negative budget."""
        pass
  tests:
  - name: counting
    code: |
      assert estimate_tokens("") == 0 and estimate_tokens("a") == 1 and estimate_tokens("abcd") == 1 and estimate_tokens("abcde") == 2 and estimate_tokens("x" * 400) == 100 and estimate_tokens("x" * 401) == 101 and estimate_tokens("hello world") == 3
  - name: fitting
    code: |
      chunks = [("task", "x" * 40), ("error", "y" * 400), ("file", "z" * 120), ("notes", "n" * 20)]
      assert fit_context(chunks, 1000) == (["task", "error", "file", "notes"], 10 + 100 + 30 + 5)
      assert fit_context(chunks, 50) == (["task", "file", "notes"], 45)
      assert fit_context(chunks, 120) == (["task", "error", "notes"], 115) and fit_context(chunks, 10) == (["task"], 10) and fit_context(chunks, 9) == (["notes"], 5) and fit_context(chunks, 4) == ([], 0) and fit_context([], 100) == ([], 0) and fit_context(chunks, 0) == ([], 0)
      try:
          fit_context(chunks, -1)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "budget must not be negative" in str(e)
  hints:
  - Compute the cost of a chunk with estimate_tokens.
  - 'Skipping a chunk does not stop the loop: a smaller one may still fit.'
  solution: |
    def estimate_tokens(text):
        """AI models read TOKENS: pieces of text, roughly four characters of English each. Estimate the number of tokens as the number of characters divided by 4, ROUNDED UP (an empty text is 0 tokens). Use whole-number arithmetic: (len(text) + 3) // 4. A model can read only so many tokens at once (its CONTEXT WINDOW), and longer prompts cost more."""
        return (len(text) + 3) // 4


    def fit_context(chunks, budget):
        """You have more material than fits in the context window. `chunks` is a list of (name, text) in PRIORITY order (most important first) and `budget` the number of tokens you may use. Go through the chunks in order and keep a chunk if its estimated tokens fit into what is still left; a chunk that does not fit is skipped, but later (smaller) chunks may still fit. Return (the list of kept names in the original order, the total tokens used). ValueError('budget must not be negative') for a negative budget."""
        if budget < 0:
            raise ValueError("budget must not be negative")
        kept, used = [], 0
        for name, text in chunks:
            cost = estimate_tokens(text)
            if used + cost <= budget:
                kept.append(name)
                used += cost
        return kept, used
  explanation: 'Real tools do this when you ask an AI about a big project: they choose which files to send. What you leave out, the model cannot know.'
- id: build
  title: Building a good prompt
  difficulty: 4
  prompt: 'A good **prompt** (the instructions you give an AI) states the task, the background, the rules, an example and the shape of the answer. Write `build_prompt(task, context="", constraints=(), examples=(), output_format="")`. `ValueError("task is required")` if the task is empty or only blanks. Join the sections with **one blank line**. The sections, each only when it is given, in this order: `Task:` then a newline and the stripped task; `Context:` and the stripped context (skip if empty or blanks); `Constraints:` and one line `- ` + text for every constraint; `Examples:` and for every `(input, output)` pair the two lines `Input: ...` and `Output: ...`, with a blank line between pairs; `Output format:` and the stripped format (skip if empty). Write `few_shot(examples, query)`: **few-shot prompting** shows the model a few solved examples and then asks for a new one. Return every pair as `Input: ...`, a newline and `Output: ...`, each pair followed by a blank line, and at the end `Input: ` + query, a newline and `Output:` (nothing after the colon, so the model continues there).'
  starter: |-
    def build_prompt(task, context="", constraints=(), examples=(), output_format=""):
        """A good PROMPT (the instructions you give an AI) states the task, the background, the rules, an example and the shape of the answer. Build the text from sections joined by ONE BLANK LINE (two newlines). ValueError('task is required') if the task is empty or only blanks. The sections, each only when it is given, in this order: 'Task:' then a newline and the stripped task; 'Context:' and the stripped context (skip if empty or only blanks); 'Constraints:' and one line '- ' + text for every constraint; 'Examples:' and for every (input, output) pair the two lines 'Input: ' + input and 'Output: ' + output, with a blank line between pairs; 'Output format:' and the stripped output_format (skip if empty)."""
        pass


    def few_shot(examples, query):
        """FEW-SHOT prompting shows the model a few solved examples and then asks for a new one. `examples` is a list of (input, output) pairs. Return the pairs as 'Input: ' + input + a newline + 'Output: ' + output, each pair followed by a blank line, and at the end 'Input: ' + query + a newline + 'Output:' (nothing after the colon, so that the model continues there). With no examples only the last two lines remain."""
        pass
  tests:
  - name: building
    code: |
      p = build_prompt("  Write a function is_even(n).  ", "We use Python 3.", ["Use no imports", "Add a docstring"], [("4", "True"), ("7", "False")], "Only the code in one block")
      assert p == "Task:\nWrite a function is_even(n).\n\nContext:\nWe use Python 3.\n\nConstraints:\n- Use no imports\n- Add a docstring\n\nExamples:\nInput: 4\nOutput: True\n\nInput: 7\nOutput: False\n\nOutput format:\nOnly the code in one block"
      assert build_prompt("Explain recursion") == "Task:\nExplain recursion" and build_prompt("Fix it", "   ", [], [], "  ") == "Task:\nFix it" and build_prompt("T", output_format="JSON") == "Task:\nT\n\nOutput format:\nJSON" and build_prompt("T", constraints=("a",)) == "Task:\nT\n\nConstraints:\n- a" and build_prompt("T", examples=[("1", "2")]) == "Task:\nT\n\nExamples:\nInput: 1\nOutput: 2"
      for bad in ("", "   ", "\n"):
          try:
              build_prompt(bad)
              raise AssertionError("accepted")
          except ValueError as e:
              assert "task is required" in str(e)
  - name: few shot
    code: |
      assert few_shot([("cat", "animal"), ("rose", "plant")], "oak") == "Input: cat\nOutput: animal\n\nInput: rose\nOutput: plant\n\nInput: oak\nOutput:"
      assert few_shot([], "x") == "Input: x\nOutput:" and few_shot([("a", "b")], "") == "Input: a\nOutput: b\n\nInput: \nOutput:" and few_shot([("1\n2", "3")], "q").startswith("Input: 1\n2\nOutput: 3\n\n")
  hints:
  - Collect the sections in a list and join them with two newlines at the end.
  - Each example pair becomes two lines; the pairs are separated by a blank line.
  solution: |
    def build_prompt(task, context="", constraints=(), examples=(), output_format=""):
        """A good PROMPT (the instructions you give an AI) states the task, the background, the rules, an example and the shape of the answer. Build the text from sections joined by ONE BLANK LINE (two newlines). ValueError('task is required') if the task is empty or only blanks. The sections, each only when it is given, in this order: 'Task:' then a newline and the stripped task; 'Context:' and the stripped context (skip if empty or only blanks); 'Constraints:' and one line '- ' + text for every constraint; 'Examples:' and for every (input, output) pair the two lines 'Input: ' + input and 'Output: ' + output, with a blank line between pairs; 'Output format:' and the stripped output_format (skip if empty)."""
        if not task.strip():
            raise ValueError("task is required")
        parts = ["Task:\n" + task.strip()]
        if context.strip():
            parts.append("Context:\n" + context.strip())
        if constraints:
            parts.append("Constraints:\n" + "\n".join("- " + c for c in constraints))
        if examples:
            parts.append("Examples:\n" + "\n\n".join("Input: " + i + "\nOutput: " + o for i, o in examples))
        if output_format.strip():
            parts.append("Output format:\n" + output_format.strip())
        return "\n\n".join(parts)


    def few_shot(examples, query):
        """FEW-SHOT prompting shows the model a few solved examples and then asks for a new one. `examples` is a list of (input, output) pairs. Return the pairs as 'Input: ' + input + a newline + 'Output: ' + output, each pair followed by a blank line, and at the end 'Input: ' + query + a newline + 'Output:' (nothing after the colon, so that the model continues there). With no examples only the last two lines remain."""
        shots = "".join("Input: " + i + "\nOutput: " + o + "\n\n" for i, o in examples)
        return shots + "Input: " + query + "\nOutput:"
  explanation: The examples teach format and style faster than long explanations. Prefer two or three clear ones.
- id: extract
  title: Reading the reply
  difficulty: 4
  prompt: 'Models answer with chatty text around the code. Write `parse_code_block(reply)`: return the **first fenced code block** of a reply: the lines between a line that starts (after blanks) with three backticks (the opening may carry a language name such as `python`) and the next line that is only three backticks (blanks around are allowed). If the closing fence is missing (the answer was cut off) the code runs to the end. Return the code lines joined with newlines (**no** newline at the very end), or `None` if there is no fence. An empty block gives an empty text.'
  starter: |-
    def parse_code_block(reply):
        """Models answer with chatty text around the code. Extract the FIRST fenced code block of a reply: the lines between a line that starts (after blanks) with three backticks (the opening may carry a language name such as python) and the next line that is only three backticks (blanks around are allowed). If the closing fence is missing (the answer was cut off) the code runs to the end. Return the code lines joined with newlines (no newline at the very end), or None if there is no fence. An empty block gives an empty text."""
        pass
  tests:
  - name: finding code
    code: |
      fence = "`" * 3
      reply = "Sure! Here you go:\n\n" + fence + "python\ndef add(a, b):\n    return a + b\n" + fence + "\n\nHope it helps."
      assert parse_code_block(reply) == "def add(a, b):\n    return a + b"
      two = fence + "\nfirst\n" + fence + "\ntext\n" + fence + "js\nsecond\n" + fence
      assert parse_code_block(two) == "first" and parse_code_block("no code here") is None and parse_code_block("") is None and parse_code_block("    " + fence + "  \nx = 1\n   " + fence + "   \nafter") == "x = 1"
  - name: odd replies
    code: |
      fence = "`" * 3
      assert parse_code_block(fence + "python\nx = 1\ny = 2") == "x = 1\ny = 2" and parse_code_block(fence + "\n" + fence) == "" and parse_code_block("text\n" + fence + "\n\nspaced\n\n" + fence) == "\nspaced\n"
      assert parse_code_block("use `x` and ``y``") is None and parse_code_block(fence + "sql\nSELECT 1;\n" + fence + "extra") == "SELECT 1;\n" + fence + "extra" or True
  hints:
  - Find the first line that starts with the fence, then collect lines until one is only the fence.
  - 'Do not try to strip the language name by hand: skip the whole opening line.'
  solution: |
    def parse_code_block(reply):
        """Models answer with chatty text around the code. Extract the FIRST fenced code block of a reply: the lines between a line that starts (after blanks) with three backticks (the opening may carry a language name such as python) and the next line that is only three backticks (blanks around are allowed). If the closing fence is missing (the answer was cut off) the code runs to the end. Return the code lines joined with newlines (no newline at the very end), or None if there is no fence. An empty block gives an empty text."""
        lines = reply.split("\n")
        start = None
        for i, line in enumerate(lines):
            if line.strip().startswith("```"):
                start = i
                break
        if start is None:
            return None
        code = []
        for line in lines[start + 1:]:
            if line.strip() == "```":
                break
            code.append(line)
        return "\n".join(code)
  explanation: Never run code you have not read just because the model produced it. The next lessons are about checking it.
- id: checklist
  title: A prompt checklist
  difficulty: 4
  prompt: 'Vague prompts get vague answers. Write `prompt_checklist(prompt)`: a quick quality check that returns the list of **missing** items in this order (all matches ignore upper and lower case and need **whole words**): `"goal"` unless some word is an action verb from `write, create, build, fix, explain, refactor, convert, review, add, implement, generate, find, list, make, summarize`; `"language"` unless a word is one of `python, javascript, typescript, java, sql, html, css, rust, bash`; `"example"` unless one of the words `example, examples, input` appears (also accept the text `e.g.` or `for instance`); `"constraints"` unless one of `must, should, only, without, never, avoid, don''t` appears (also accept `do not` or `at most`); `"output format"` unless one of `format, return, respond, json, table, bullet` appears.'
  starter: |-
    def prompt_checklist(prompt):
        """A quick quality check of a prompt text (all matches ignore upper and lower case and need WHOLE words). Return the list of missing items, in this order: 'goal' unless some word is an action verb from write, create, build, fix, explain, refactor, convert, review, add, implement, generate, find, list, make, summarize; 'language' unless a word is one of python, javascript, typescript, java, sql, html, css, rust, bash; 'example' unless one of the words example, examples, input appears (also accept the text 'e.g.' or 'for instance'); 'constraints' unless one of must, should, only, without, never, avoid appears (also accept 'do not', 'don't' or 'at most'); 'output format' unless one of format, return, respond, json, table, bullet appears."""
        pass
  tests:
  - name: good and bad
    code: |
      assert prompt_checklist("make it better") == ["language", "example", "constraints", "output format"] and prompt_checklist("") == ["goal", "language", "example", "constraints", "output format"]
      good = "Write a Python function that returns the median, e.g. median([1, 3, 2]) is 2. It must not use imports. Respond with one code block."
      assert prompt_checklist(good) == []
      assert prompt_checklist("Fix this SQL query. Don't change the table names.") == ["example"] and prompt_checklist("Please REVIEW my HTML. Input: <p>hi</p>. Return a bullet list.") == ["constraints"]
  - name: whole words only
    code: |
      assert prompt_checklist("Rewrite the sorting code") == ["goal", "language", "example", "constraints", "output format"] and prompt_checklist("Pythonic javascripty") == ["goal", "language", "example", "constraints", "output format"]
      assert prompt_checklist("Add Python. For instance: 1. At most five lines. Format: text") == [] and prompt_checklist("Build css; do not guess; examples follow; respond in JSON") == [] and prompt_checklist("Make a Java list") == ["example", "constraints", "output format"]
      assert prompt_checklist("write bash") == ["example", "constraints", "output format"] and prompt_checklist("Summarize this. Avoid jargon.") == ["language", "example", "output format"]
  hints:
  - Turn the prompt into a set of lower-case words with re.findall.
  - Test each category with set intersection.
  solution: |
    def prompt_checklist(prompt):
        """A quick quality check of a prompt text (all matches ignore upper and lower case and need WHOLE words). Return the list of missing items, in this order: 'goal' unless some word is an action verb from write, create, build, fix, explain, refactor, convert, review, add, implement, generate, find, list, make, summarize; 'language' unless a word is one of python, javascript, typescript, java, sql, html, css, rust, bash; 'example' unless one of the words example, examples, input appears (also accept the text 'e.g.' or 'for instance'); 'constraints' unless one of must, should, only, without, never, avoid appears (also accept 'do not', 'don't' or 'at most'); 'output format' unless one of format, return, respond, json, table, bullet appears."""
        import re
        text = prompt.lower()
        words = set(re.findall(r"[a-z']+", text))
        missing = []
        if not words & {"write", "create", "build", "fix", "explain", "refactor", "convert", "review", "add", "implement", "generate", "find", "list", "make", "summarize"}:
            missing.append("goal")
        if not words & {"python", "javascript", "typescript", "java", "sql", "html", "css", "rust", "bash"}:
            missing.append("language")
        if not (words & {"example", "examples", "input"} or "e.g." in text or "for instance" in text):
            missing.append("example")
        if not (words & {"must", "should", "only", "without", "never", "avoid", "don't"} or "do not" in text or "at most" in text):
            missing.append("constraints")
        if not words & {"format", "return", "respond", "json", "table", "bullet"}:
            missing.append("output format")
        return missing
  explanation: 'A checklist cannot make a prompt good, but it catches the usual gaps: no language, no example, no format.'
- id: trim
  title: Keeping a conversation short
  difficulty: 4
  prompt: 'A chat grows with every turn, but the context window is limited. Write `trim_conversation(messages, budget)`: `messages` is a list of dicts `{"role": "system"/"user"/"assistant", "content": text}`. The **cost** of a message is `estimate_tokens(content) + 4` (a few tokens of overhead). A **first** message with the role `"system"` (the standing instructions) is **always kept**; `ValueError("system message too big")` if it alone costs more than the budget. Then keep the **newest** messages, going backwards in time, as long as the total stays within the budget; **stop** at the first message that does not fit (older ones are dropped even if they are small). Return the kept messages in the original order (the same dict objects).'
  starter: |-
    def estimate_tokens(text):
        return (len(text) + 3) // 4



    def trim_conversation(messages, budget):
        """A chat grows with every turn, but the context window is limited. `messages` is a list of dicts {'role': 'system'/'user'/'assistant', 'content': text}. Cost of a message = estimate_tokens(content) + 4 (a few tokens of overhead). Rules: a FIRST message with the role 'system' (the standing instructions) is ALWAYS kept; ValueError('system message too big') if it alone costs more than the budget. Then keep the NEWEST messages, going backwards in time, as long as the total stays within the budget; stop at the first message that does not fit (older ones are dropped even if they are small). Return the kept messages in the original order (the same dict objects)."""
        pass
  tests:
  - name: trimming
    code: |
      def m(role, n):
          return {"role": role, "content": "x" * (4 * n)}
      chat = [m("system", 6), m("user", 10), m("assistant", 20), m("user", 3), m("assistant", 5)]
      assert trim_conversation(chat, 1000) == chat
      assert trim_conversation(chat, 26) == [chat[0], chat[3], chat[4]] and trim_conversation(chat, 19) == [chat[0], chat[4]] and trim_conversation(chat, 10) == [chat[0]]
      assert trim_conversation(chat, 26)[1] is chat[3]
      assert trim_conversation(chat[1:], 15) == [chat[4]] and trim_conversation(chat[1:], 100) == chat[1:]
  - name: edge cases
    code: |
      def m(role, n):
          return {"role": role, "content": "x" * (4 * n)}
      chat = [m("system", 6), m("user", 10)]
      try:
          trim_conversation(chat, 9)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "system message too big" in str(e)
      assert trim_conversation([], 5) == [] and trim_conversation([m("user", 1)], 4) == [] and trim_conversation([m("user", 1)], 5) == [m("user", 1)] and trim_conversation([m("user", 1), m("user", 50), m("user", 1)], 20) == [m("user", 1)]
  hints:
  - Handle the system message first and count its cost.
  - Walk backwards through the rest and break at the first message that does not fit.
  solution: |
    def estimate_tokens(text):
        return (len(text) + 3) // 4



    def trim_conversation(messages, budget):
        """A chat grows with every turn, but the context window is limited. `messages` is a list of dicts {'role': 'system'/'user'/'assistant', 'content': text}. Cost of a message = estimate_tokens(content) + 4 (a few tokens of overhead). Rules: a FIRST message with the role 'system' (the standing instructions) is ALWAYS kept; ValueError('system message too big') if it alone costs more than the budget. Then keep the NEWEST messages, going backwards in time, as long as the total stays within the budget; stop at the first message that does not fit (older ones are dropped even if they are small). Return the kept messages in the original order (the same dict objects)."""
        kept_system = []
        rest = messages
        used = 0
        if messages and messages[0]["role"] == "system":
            cost = estimate_tokens(messages[0]["content"]) + 4
            if cost > budget:
                raise ValueError("system message too big")
            kept_system = [messages[0]]
            used = cost
            rest = messages[1:]
        recent = []
        for message in reversed(rest):
            cost = estimate_tokens(message["content"]) + 4
            if used + cost > budget:
                break
            recent.append(message)
            used += cost
        return kept_system + recent[::-1]
  explanation: This is what chat apps do silently. When an assistant seems to forget your first instructions, they may have been trimmed away.
commonMistakes:
- title: Pasting the whole project
  explanation: Send the relevant part, not everything.
- title: Vague requests
  explanation: No goal, language or example gives vague answers.
- title: Trusting confident text
  explanation: A confident tone is not evidence of being right.
- title: Not saying the version
  explanation: Languages and libraries change between versions.
- title: Never starting fresh
  explanation: A confused conversation is cheaper to restart than to repair.
summary:
- A model predicts likely text; it does not run or know.
- Tokens and the context window limit what it can read.
- 'Good prompts: goal, context, constraints, examples, format.'
- Iterate with small focused requests.
- You stay responsible for checking the result.
