    def style_problems(source):
        """Find common bad habits. Parse the source and return the sorted list of unique (line, message) pairs: 'bare except' for an except without an exception type (it hides every error, even Ctrl-C); 'mutable default argument' for a function (def, at the line of the def) whose default value is a list, dict or set display or comprehension, or a call to list(), dict() or set() (the one default object is shared between all calls); 'compare to None with is' for a == or != comparison where either side is the constant None; 'missing docstring' for every function whose body does not start with a string constant."""
        import ast
        problems = set()
        for node in ast.walk(ast.parse(source)):
            if isinstance(node, ast.ExceptHandler) and node.type is None:
                problems.add((node.lineno, "bare except"))
            elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                defaults = [d for d in node.args.defaults + node.args.kw_defaults if d is not None]
                for d in defaults:
                    if isinstance(d, (ast.List, ast.Dict, ast.Set, ast.ListComp, ast.DictComp, ast.SetComp)) or (isinstance(d, ast.Call) and dotted_name(d.func) in ("list", "dict", "set")):
                        problems.add((node.lineno, "mutable default argument"))
                first = node.body[0]
                if not (isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str)):
                    problems.add((node.lineno, "missing docstring"))
            elif isinstance(node, ast.Compare) and any(isinstance(op, (ast.Eq, ast.NotEq)) for op in node.ops):
                sides = [node.left] + node.comparators
                if any(isinstance(s, ast.Constant) and s.value is None for s in sides):
                    problems.add((node.lineno, "compare to None with is"))
        return sorted(problems)


    def review_report(source, allowed):
        """The review of a whole piece of AI code. If the source has a syntax error return ['syntax error at line N'] (N from the SyntaxError, or 1 if it has none). Otherwise return the list of text lines, sorted by line number and then alphabetically, made from: 'line N: undefined name X' for undefined_names, 'line N: module X is not allowed' for check_imports, 'line N: risky call LABEL' for risky_calls and 'line N: MESSAGE' for style_problems. An empty list means the review found nothing."""
        try:
            undefined = undefined_names(source)
            imports = check_imports(source, allowed)
            risky = risky_calls(source)
            style = style_problems(source)
        except SyntaxError as err:
            return ["syntax error at line " + str(err.lineno or 1)]
        lines = [(n, "undefined name " + name) for n, name in undefined]
        lines += [(n, "module " + mod + " is not allowed") for n, mod in imports]
        lines += [(n, "risky call " + label) for n, label in risky]
        lines += [(n, msg) for n, msg in style]
        return ["line " + str(n) + ": " + msg for n, msg in sorted(lines)]

    answer = "import os\nimport super_utils\n\ndef clean(path, seen=[]):\n    \"\"\"Delete a file.\"\"\"\n    os.system('rm ' + path)\n    return fix_path(path)\n"
    for line in review_report(answer, {"os"}):
        print(line)
  output: |
    line 2: module super_utils is not allowed
    line 4: mutable default argument
    line 6: risky call os.system
    line 7: undefined name fix_path
  lines:
  - line: 113
    note: One list, sorted by line, ready to read.
playground:
  prompt: Parse a snippet and count its function definitions.
  code: |
    import ast
    tree = ast.parse('def a():\n    pass\ndef b():\n    pass\n')
    print(sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree)))
exercises:
- id: undefined
  title: Names that do not exist
  difficulty: 5
  prompt: 'An assistant may call a helper that **does not exist** (a *hallucination*). Python only finds out when that line runs. A tool can find it earlier with the `ast` module (the tree of the program). Write `undefined_names(source)`. AI assistants sometimes use a helper function or variable that DOES NOT EXIST (a hallucination). Parse the source with ast and return the sorted list of (line, name) for every place where a name is READ (an ast.Name in Load context) that is defined nowhere in the code and is not a built-in name (dir(builtins)). Use this simple FLAT rule: a name counts as defined if, anywhere in the code, it is assigned or deleted (a Name in Store or Del context, including for-loop and comprehension targets and with-as), defined by def or class, a parameter (of a def or lambda: normal, positional-only, keyword-only, *args, **kwargs), imported (import x, import x.y defines x, ''as'' gives the new name, from m import n), or the name of an except-as. Raise the SyntaxError of a broken source.'
  starter: |-
    def undefined_names(source):
        """AI assistants sometimes use a helper function or variable that DOES NOT EXIST (a hallucination). Parse the source with ast and return the sorted list of (line, name) for every place where a name is READ (an ast.Name in Load context) that is defined nowhere in the code and is not a built-in name (dir(builtins)). Use this simple FLAT rule: a name counts as defined if, anywhere in the code, it is assigned or deleted (a Name in Store or Del context, including for-loop and comprehension targets and with-as), defined by def or class, a parameter (of a def or lambda: normal, positional-only, keyword-only, *args, **kwargs), imported (import x, import x.y defines x, 'as' gives the new name, from m import n), or the name of an except-as. Raise the SyntaxError of a broken source."""
        pass
  tests:
  - name: finding them
    code: |
      src = "import os\n\ndef total(items, rate=2):\n    s = sum(items)\n    return apply_rate(s, rate) + os.sep\n\nvalue = total([1, 2]) + unknown\nprint(value, bad_name)\n"
      assert undefined_names(src) == [(5, "apply_rate"), (7, "unknown"), (8, "bad_name")]
      assert undefined_names("x = 1\ny = x + 1\nprint(len([y]))") == [] and undefined_names("") == [] and undefined_names("print(z)\nprint(z)") == [(1, "z"), (2, "z")]
  - name: what counts as defined
    code: |
      src = """import os.path, json as j
      from math import sqrt as root, pi
      class K:
          pass
      def f(a, /, b, *args, c=1, **kw):
          for i in range(3):
              pass
          with open(a) as fh:
              pass
          try:
              pass
          except ValueError as err:
              print(err)
          sq = [n * n for n in args]
          g = lambda p, *q: p + len(q)
          del sq
          return a, b, c, kw, fh, i, g, os, j, root, pi, K, f
      """
      assert undefined_names(src) == []
      assert undefined_names("def f():\n    return later\nlater = 1\n") == [] and undefined_names("print(a)\na = 1") == [] and undefined_names("x = [q for q in w]") == [(1, "w")]
      try:
          undefined_names("def f(:")
          raise AssertionError("accepted")
      except SyntaxError:
          pass
  hints:
  - Collect the defined names first (also include dir(builtins)), then list the loads.
  - ast.walk visits every node; look at isinstance and ctx.
  solution: |
