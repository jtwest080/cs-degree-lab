- type: code
  question: Write `count_functions(source)` returning how many functions (`def`, including `async def`) the source defines, counting methods and nested functions too. Use `ast`.
  starter: |
    def count_functions(source):
        pass
  tests:
  - name: counting
    code: |
      assert count_functions("") == 0 and count_functions("def a():\n    def b():\n        pass\nclass K:\n    def m(self):\n        pass\nasync def c():\n    pass\nx = lambda: 1\n") == 4
  solution: |
    import ast


    def count_functions(source):
        return sum(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) for n in ast.walk(ast.parse(source)))
