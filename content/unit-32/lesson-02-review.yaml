  explanation: This simple version ignores scopes, so it misses some mistakes, but it already catches the classic invented helper. Real linters such as pyflakes do the same job more carefully.
- id: imports
  title: Libraries that do not exist
  difficulty: 4
  prompt: Assistants also invent **libraries**, or use ones your project does not have; attackers even publish packages with names that assistants tend to invent. Write `check_imports(source, allowed)`. Assistants also invent LIBRARIES, or use ones your project does not have. Parse the source and return the sorted list of (line, module) for every import of a module whose TOP-LEVEL name (the part before the first dot) is not in the collection `allowed`. 'import a.b, c' gives the modules a and c (one entry each, on the line of the statement); 'from a.b import x' gives a; relative imports (from . import x) are ignored. The same module imported on two lines appears twice.
  starter: |-
    def check_imports(source, allowed):
        """Assistants also invent LIBRARIES, or use ones your project does not have. Parse the source and return the sorted list of (line, module) for every import of a module whose TOP-LEVEL name (the part before the first dot) is not in the collection `allowed`. 'import a.b, c' gives the modules a and c (one entry each, on the line of the statement); 'from a.b import x' gives a; relative imports (from . import x) are ignored. The same module imported on two lines appears twice."""
        pass
  tests:
  - name: finding imports
    code: |
      src = "import os\nimport numpy as np\nimport requests, sys\nfrom pandas.io import x\nfrom os.path import join\nimport a.b.c\nimport sys\n"
      assert check_imports(src, {"os", "sys"}) == [(2, "numpy"), (3, "requests"), (4, "pandas"), (6, "a")]
      assert check_imports(src, {"os", "sys", "numpy", "requests", "pandas", "a"}) == [] and check_imports("", set()) == [] and check_imports("import os\nimport os", []) == [(1, "os"), (2, "os")]
  - name: special forms
    code: |
      assert check_imports("from . import x\nfrom .sibling import y\nfrom .. import z", set()) == [] and check_imports("def f():\n    import secret_lib\n", ["os"]) == [(2, "secret_lib")] and check_imports("import os as o, sys as s", ["os"]) == [(1, "sys")]
      assert check_imports("from collections.abc import Mapping", {"collections"}) == [] and check_imports("try:\n    import ujson\nexcept ImportError:\n    import json", {"json"}) == [(2, "ujson")]
      try:
          check_imports("import (", [])
          raise AssertionError("accepted")
      except SyntaxError:
          pass
  hints:
  - Walk the tree and look at ast.Import and ast.ImportFrom nodes.
  - For ImportFrom use node.module and check node.level == 0.
  solution: |
    def check_imports(source, allowed):
