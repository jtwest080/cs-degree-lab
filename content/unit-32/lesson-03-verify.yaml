        pass
  tests:
  - name: round trip
    code: |
      import json
      assert round_trip_ok(json.dumps, json.loads, [1, "a", [1, 2], {"k": None}]) is True and round_trip_ok(str, int, [1, 2, 3]) is True and round_trip_ok(str, int, []) is True
      assert round_trip_ok(str.upper, str.lower, ["abc", "ABC"]) is False and round_trip_ok(str, int, ["x"]) is False and round_trip_ok(lambda v: 1 / v, lambda v: v, [0]) is False
  solution: |
    def round_trip_ok(encode, decode, values):
        for v in values:
            try:
                if decode(encode(v)) != v:
                    return False
            except Exception:
                return False
        return True
