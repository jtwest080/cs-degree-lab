id: u32-verify
title: Verifying AI Code
minutes: 115
objective: 'Learn the methods that turn ''it looks right'' into evidence: running examples, edge cases, a second implementation to compare against, and properties tested with random inputs. You will build each tool and combine them into a verdict.'
outcomes:
- Test AI code with examples and edge cases
- Compare two implementations with differential testing
- State properties and test them with random inputs
- Shrink a failing input
- Combine checks into one verdict
sections:
- heading: Evidence, not trust
  body: |-
    Reading code (last lesson) finds some bugs; **running** it finds others. The question is always: *what would convince me that this is correct?* An assistant can help here too, but you must understand what each test proves. In order of effort:

    1. **Run the examples** from your prompt. They must pass, but they prove little: the assistant has seen them.
    2. **Add edge cases**: empty input, one element, zero, negative numbers, the biggest number, duplicates, unusual characters (spaces, accents), very long input. Most real bugs live here. Ask yourself: what is the *weirdest* input a user could send?
    3. **Test the error behaviour**: what should happen with bad input? An exception with a clear message, a default value? Decide, then check.
    4. **Compare with a second opinion** (**differential testing**): a simple slow version that is obviously right (brute force), an older version, or a library function. Run both on thousands of inputs and look at the differences.
    5. **State properties** (**property-based testing**): rules that hold for every input, such as "the result of sorting has the same length as the input and is in order", "decoding what you encoded gives the original back", "the total never goes negative". The computer invents the inputs. When it finds a failure it **shrinks** the input to the smallest case that still fails.

    You can ask the assistant to **write the tests**, which is a good use. But then check that the tests are meaningful (mutation testing from Unit 30!) and that they were not written to match a wrong implementation: **write or read the tests first, before you read the code.**
- heading: A bug report the assistant can use
  body: |-
    When a check fails, give the assistant what a good colleague would need: the **smallest** input that fails, the **expected** result, the **actual** result, and the **error message**. Shrinking gives you exactly that. Then ask it to explain *why* it fails before it changes anything, so that you do not get a patch that hides the symptom. After the fix, **re-run all** the checks: assistants sometimes fix one case and break another.

    Keep the failing case as a permanent test. This is a **regression test**: it makes sure the same bug cannot return.
examples:
- title: The leap year that looked right
  intro: An assistant's answer passes the three examples from the prompt, but a second implementation disagrees on some years.
  code: |
    def outcome(func, *args):
        """What a call did: ('ok', the result) or ('error', the name of the exception type)."""
        try:
            return ("ok", func(*args))
        except Exception as err:
            return ("error", type(err).__name__)


    def check_examples(func, cases):
        """The first check of any code: do the examples work? `cases` is a list of (args, expected) where args is a tuple of arguments. `expected` is either the expected result or an exception CLASS (then the call must raise that class, or a subclass). Return the list of failure texts, in order of the cases (an empty list means all passed; case numbers start at 0): 'case N: expected X, got Y' when the result differs (X and Y written with repr); 'case N: expected E, got Y' when an exception E was expected but the call returned Y (E is the class name, Y written with repr); 'case N: expected E, got F' when another exception F was raised (class names); 'case N: expected X, raised F' when a result X was expected but exception F was raised. Compare results with ==."""
        failures = []
        for i, (args, expected) in enumerate(cases):
            wants_error = isinstance(expected, type) and issubclass(expected, BaseException)
            try:
                got = func(*args)
            except Exception as err:
                if wants_error:
                    if not isinstance(err, expected):
                        failures.append("case " + str(i) + ": expected " + expected.__name__ + ", got " + type(err).__name__)
                else:
                    failures.append("case " + str(i) + ": expected " + repr(expected) + ", raised " + type(err).__name__)
                continue
            if wants_error:
                failures.append("case " + str(i) + ": expected " + expected.__name__ + ", got " + repr(got))
            elif got != expected:
                failures.append("case " + str(i) + ": expected " + repr(expected) + ", got " + repr(got))
        return failures


    def differential(f, g, inputs):
        """DIFFERENTIAL TESTING compares a new implementation f with a trusted one g (a slow simple version, an older version, a library). `inputs` is a list of argument tuples. Use the given helper outcome. Return the list of (args, outcome of f, outcome of g) for the inputs where the two outcomes differ, in the order of the inputs. Two calls that raise the same exception type agree."""
        differences = []
        for args in inputs:
            a, b = outcome(f, *args), outcome(g, *args)
            if a != b:
                differences.append((args, a, b))
        return differences

    def leap_ai(year):
        return year % 4 == 0

    def leap_ref(year):
        return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)

    cases = [((2024,), True), ((2023,), False), ((2000,), True)]
    print(check_examples(leap_ai, cases))
    print(differential(leap_ai, leap_ref, [(y,) for y in range(1890, 1910)]))
  output: |
    []
    [((1900,), ('ok', True), ('ok', False))]
  lines:
  - line: 46
    note: 'All three examples pass: an empty list means no failures.'
  - line: 47
    note: 'But 1900 was not a leap year: the second version caught it.'
- title: Edge cases, properties and shrinking
  intro: An average function crashes on the empty list, a property check finds it by itself, and a failing input is shrunk.
  code: |
    def edge_cases(kind):
        """Bugs hide at the EDGES: zero, empty, one, negative, huge. Return a NEW list of edge values for the type name `kind`: 'int' -> [0, 1, -1, 2147483647, -2147483648]; 'float' -> [0.0, 1.5, -1.5, 1e-09, 1e+9]; 'str' -> ['', ' ', 'a', 'A', 'a b', 'é', 'x' * 1000]; 'list' -> [[], [0], [1, 1], [3, 2, 1], list(range(100))]. ValueError('unsupported type') for any other kind. (Every call returns fresh lists, so a test that changes one cannot disturb the next.)"""
        table = {
            "int": lambda: [0, 1, -1, 2147483647, -2147483648],
            "float": lambda: [0.0, 1.5, -1.5, 1e-09, 1e+9],
            "str": lambda: ["", " ", "a", "A", "a b", "é", "x" * 1000],
            "list": lambda: [[], [0], [1, 1], [3, 2, 1], list(range(100))],
        }
        if kind not in table:
            raise ValueError("unsupported type")
        return table[kind]()


    def find_counterexample(prop, make_input, trials, seed):
        """PROPERTY-BASED TESTING states a rule that must hold for ALL inputs and tries many random ones. `prop(x)` returns True if the rule holds, `make_input(rng)` builds a random input from a random.Random object. Create rng = random.Random(seed) ONCE, then for each of `trials` trials build an input and test it. A rule that returns something false or RAISES an exception is broken. Return the first input that breaks the rule, or None. ValueError('trials must not be negative') for negative trials. The same seed must give the same answer."""
        import random
        if trials < 0:
            raise ValueError("trials must not be negative")
        rng = random.Random(seed)
        for _ in range(trials):
            x = make_input(rng)
            try:
                ok = prop(x)
            except Exception:
                ok = False
            if not ok:
                return x
        return None


    def shrink_list(fails, items):
        """A failing input of 80 numbers is hard to understand. SHRINK it: `fails(list)` returns True while a list still shows the bug. ValueError('list does not fail') if fails(items) is False. Otherwise repeat: try removing each element in turn (from the left, one at a time); at the first removal after which the list still fails, keep the shorter list and start again from the left; stop when no single removal keeps the failure. Return the shrunk list (a new list; the input is not changed)."""
        if not fails(items):
            raise ValueError("list does not fail")
        current = list(items)
        changed = True
        while changed:
            changed = False
            for i in range(len(current)):
                candidate = current[:i] + current[i + 1:]
                if fails(candidate):
                    current = candidate
                    changed = True
                    break
        return current

    def average(xs):
        return sum(xs) / len(xs)

    for xs in edge_cases("list")[:3]:
        try:
            print(xs, "->", average(xs))
        except ZeroDivisionError:
            print(xs, "-> crash")

    import random
    def make(rng):
        return [rng.randint(0, 9) for _ in range(rng.randint(0, 5))]
    def holds(xs):
        return min(xs) <= average(xs) <= max(xs)
    found = find_counterexample(holds, make, 50, 1)
    print("counterexample:", found)
    print(shrink_list(lambda xs: sum(xs) > 20, [9, 1, 9, 1, 9, 1]))
  output: |
    [] -> crash
    [0] -> 0.0
    [1, 1] -> 1.0
    counterexample: []
    [1, 9, 1, 9, 1]
  lines:
  - line: 50
    note: The empty list is the first edge case.
  - line: 62
    note: The random search finds an input that breaks the rule.
  - line: 63
    note: Elements are removed for as long as the sum stays above 20.
