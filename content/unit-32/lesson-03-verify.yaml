  solution: |
    def outcome(func, *args):
        """What a call did: ('ok', the result) or ('error', the name of the exception type)."""
        try:
            return ("ok", func(*args))
        except Exception as err:
            return ("error", type(err).__name__)


    def check_examples(func, cases):
        """The first check of any code: do the examples work? `cases` is a list of (args, expected) where args is a tuple of arguments. `expected` is either the expected result or an exception CLASS (then the call must raise that class, or a subclass). Return the list of failure texts, in order of the cases (an empty list means all passed; case numbers start at 0): 'case N: expected X, got Y' when the result differs (X and Y written with repr); 'case N: expected E, got Y' when an exception E was expected but the call returned Y (E is the class name, Y written with repr); 'case N: expected E, got F' when another exception F was raised (class names); 'case N: expected X, raised F' when a result X was expected but exception F was raised. Compare results with ==."""
        failures = []
        for i, (args, expected) in enumerate(cases):
            wants_error = isinstance(expected, type) and issubclass(expected, BaseException)
            try:
                got = func(*args)
            except Exception as err:
                if wants_error:
                    if not isinstance(err, expected):
                        failures.append("case " + str(i) + ": expected " + expected.__name__ + ", got " + type(err).__name__)
                else:
                    failures.append("case " + str(i) + ": expected " + repr(expected) + ", raised " + type(err).__name__)
                continue
            if wants_error:
                failures.append("case " + str(i) + ": expected " + expected.__name__ + ", got " + repr(got))
            elif got != expected:
                failures.append("case " + str(i) + ": expected " + repr(expected) + ", got " + repr(got))
        return failures


    def differential(f, g, inputs):
        """DIFFERENTIAL TESTING compares a new implementation f with a trusted one g (a slow simple version, an older version, a library). `inputs` is a list of argument tuples. Use the given helper outcome. Return the list of (args, outcome of f, outcome of g) for the inputs where the two outcomes differ, in the order of the inputs. Two calls that raise the same exception type agree."""
        differences = []
        for args in inputs:
            a, b = outcome(f, *args), outcome(g, *args)
            if a != b:
                differences.append((args, a, b))
        return differences




    def verify_solution(candidate, reference, cases, make_input, trials, seed):
        """Judge a piece of AI code. Use the given check_examples and differential. Return a dict: 'failed_examples' (how many failure texts check_examples gives for the candidate), 'differences' (how many differences between candidate and reference over `trials` random argument tuples built by make_input(rng) from rng = random.Random(seed), created once), 'first_difference' (the args of the first difference, or None) and 'verdict' ('pass' only if both numbers are 0, else 'fail'). ValueError('trials must not be negative') for negative trials."""
        import random
        if trials < 0:
            raise ValueError("trials must not be negative")
        failed = check_examples(candidate, cases)
        rng = random.Random(seed)
        inputs = [make_input(rng) for _ in range(trials)]
        diffs = differential(candidate, reference, inputs)
        return {"failed_examples": len(failed), "differences": len(diffs), "first_difference": diffs[0][0] if diffs else None, "verdict": "pass" if not failed and not diffs else "fail"}
  explanation: A passing verdict is evidence, never proof. But a failing one is a precise, reproducible bug report you can paste straight back into the conversation.
commonMistakes:
- title: Testing only the prompt's examples
  explanation: The assistant saw them already.
- title: Letting the same AI write code and tests blindly
  explanation: Both can share one misunderstanding.
- title: Skipping error cases
  explanation: Decide what bad input should do.
- title: Fixing the symptom
  explanation: Ask why it failed before changing code.
- title: Not keeping the failing case
  explanation: A regression test prevents a repeat.
summary:
- 'Evidence beats trust: examples, edges, errors, comparisons, properties.'
- Edge cases find most bugs.
- Differential testing needs no known answers.
- Properties plus random inputs find surprises; shrinking explains them.
- A small failing case is the best bug report.
