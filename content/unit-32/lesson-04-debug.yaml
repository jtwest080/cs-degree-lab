  - name: giving up and odd replies
    code: |
      fence = "`" * 3
      replies = ["I think you should refactor.", fence + "\nx = 1\n" + fence, fence + "\nx = 2\n" + fence]
      seen = []
      def fake(prompt):
          seen.append(prompt)
          return replies[len(seen) - 1]
      def never(code):
          return False, "still wrong: " + code
      r = fix_loop(fake, "T", never, 3)
      assert r == {"solved": False, "rounds": 3, "code": "x = 2", "prompts": ["T", "T\n\nYour reply had no code block. Answer with one code block.", "T\n\nThe previous attempt failed:\nstill wrong: x = 1"]}
      assert fix_loop(lambda p: "no code", "T", never, 1) == {"solved": False, "rounds": 1, "code": None, "prompts": ["T"]}
      assert fix_loop(lambda p: fence + "\nok\n" + fence, "T", lambda c: (True, ""), 9) == {"solved": True, "rounds": 1, "code": "ok", "prompts": ["T"]}
