      fence = "`" * 3
      bad = "Try this:\n" + fence + "python\ndef add(a, b):\n    return a - b\n" + fence
      good = "Fixed:\n" + fence + "python\ndef add(a, b):\n    return a + b\n" + fence
      replies = [bad, good]
      seen = []
