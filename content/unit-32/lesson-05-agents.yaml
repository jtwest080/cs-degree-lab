      assert check_policy({}, [1, 2, 3], "anything", {"x": "y"}) is None and check_policy({"max_calls": 0}, [], "x", {}) == "too many calls" and check_policy({"max_calls": 1}, [], "x", {}) is None
      both = {"allowed": ["a"], "max_calls": 0, "blocked": ["x"]}
      assert check_policy(both, [], "b", {"v": "x"}) == "tool not allowed" and check_policy(both, [], "a", {"v": "x"}) == "too many calls" and check_policy({"blocked": ["x"]}, [], "a", {"v": "x"}) == "blocked argument" and check_policy({"allowed": []}, [], "a", {}) == "tool not allowed" and check_policy({"blocked": ["12"]}, [], "a", {"n": 3123}) == "blocked argument"
