exercises:
- id: toolcall
  title: Asking for a tool
  difficulty: 4
  prompt: 'A model can only produce text, so how can it *do* things? We let it **ask**: it writes a request in a fixed format, and our program carries it out and tells the model the result. That is a **tool call**. Write `parse_tool_call(reply)`. An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST ''{'' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing ''args'' means {}. Raise ValueError(''not a tool call'') if there is no ''{'', if the JSON is invalid, if it is not an object, if ''tool'' is not a text or if ''args'' is not an object.'
  starter: |-
    def parse_tool_call(reply):
        """An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST '{' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing 'args' means {}. Raise ValueError('not a tool call') if there is no '{', if the JSON is invalid, if it is not an object, if 'tool' is not a text or if 'args' is not an object."""
        pass
  tests:
  - name: reading requests
    code: |
      assert parse_tool_call('{"tool": "add", "args": {"a": 1, "b": 2}}') == ("add", {"a": 1, "b": 2})
      assert parse_tool_call('Sure, I will look it up.\n{"tool": "search", "args": {"q": "cats"}}\nDone!') == ("search", {"q": "cats"}) and parse_tool_call('{"tool": "now"}') == ("now", {}) and parse_tool_call('```json\n{"tool": "x", "args": {}}\n```') == ("x", {})
      assert parse_tool_call('{"tool": "a", "args": {"n": {"deep": [1, {"x": 2}]}}} trailing {junk') == ("a", {"n": {"deep": [1, {"x": 2}]}})
  - name: refusing non-requests
    code: |
      for bad in ("", "no braces here", "{broken", '{"tool": 5}', '{"args": {}}', '{"tool": "x", "args": [1]}', '[1, 2]', 'text {not json} {"tool": "x"}', '{"tool": "x", "args": "no"}', "null {"):
          try:
              parse_tool_call(bad)
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "not a tool call" in str(e)
  hints:
  - json.JSONDecoder().raw_decode(text) returns (value, end position).
  - Check the types of the parts of the object before returning.
  solution: |
    def parse_tool_call(reply):
        """An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST '{' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing 'args' means {}. Raise ValueError('not a tool call') if there is no '{', if the JSON is invalid, if it is not an object, if 'tool' is not a text or if 'args' is not an object."""
        import json
        start = reply.find("{")
        if start < 0:
            raise ValueError("not a tool call")
        try:
            obj, _ = json.JSONDecoder().raw_decode(reply[start:])
        except ValueError:
            raise ValueError("not a tool call")
        if not isinstance(obj, dict) or not isinstance(obj.get("tool"), str) or not isinstance(obj.get("args", {}), dict):
            raise ValueError("not a tool call")
        return obj["tool"], obj.get("args", {})
  explanation: This is the basic idea behind every AI agent and every plugin system. Real APIs use a more formal version, but the loop is the same.
- id: runtool
  title: Running a tool safely
  difficulty: 4
  prompt: 'The program that runs the model''s request must be **robust**: the model may ask for a tool that does not exist, give wrong arguments, or trigger an error. None of this may crash the loop; it must come back as text the model can learn from. Write `run_tool(tools, name, args)`. Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: ''error: unknown tool NAME'' if the name is not in tools; ''error: bad arguments'' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, ''error: '' + the exception type name + '': '' + its text.'
  starter: |-
    def run_tool(tools, name, args):
        """Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: 'error: unknown tool NAME' if the name is not in tools; 'error: bad arguments' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, 'error: ' + the exception type name + ': ' + its text."""
        pass
  tests:
  - name: success and mistakes
    code: |
      def add(a, b):
          return a + b
      def greet(name="world"):
          return "hello " + name
      tools = {"add": add, "greet": greet, "now": lambda: 42}
      assert run_tool(tools, "add", {"a": 1, "b": 2}) == "3" and run_tool(tools, "greet", {}) == "hello world" and run_tool(tools, "greet", {"name": "Ada"}) == "hello Ada" and run_tool(tools, "now", {}) == "42"
      assert run_tool(tools, "delete_all", {}) == "error: unknown tool delete_all" and run_tool(tools, "add", {"a": 1}) == "error: bad arguments" and run_tool(tools, "add", {"a": 1, "b": 2, "c": 3}) == "error: bad arguments" and run_tool(tools, "now", {"x": 1}) == "error: bad arguments"
  - name: errors inside tools
    code: |
      def div(a, b):
          return a / b
      def lookup(key):
          return {"a": 1}[key]
      def bad_type():
          return 1 + "x"
      tools = {"div": div, "lookup": lookup, "bad": bad_type, "none": lambda: None, "lst": lambda: [1, 2]}
      assert run_tool(tools, "div", {"a": 1, "b": 0}) == "error: ZeroDivisionError: division by zero" and run_tool(tools, "lookup", {"key": "z"}) == "error: KeyError: 'z'" and run_tool(tools, "bad", {}) == "error: TypeError: unsupported operand type(s) for +: 'int' and 'str'"
      assert run_tool(tools, "none", {}) == "None" and run_tool(tools, "lst", {}) == "[1, 2]" and run_tool({}, "x", {}) == "error: unknown tool x"
  hints:
  - Check the name first, then the arguments with inspect.signature(func).bind(**args), then call.
  - Convert the result with str.
  solution: |
    def run_tool(tools, name, args):
        """Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: 'error: unknown tool NAME' if the name is not in tools; 'error: bad arguments' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, 'error: ' + the exception type name + ': ' + its text."""
        import inspect
        if name not in tools:
            return "error: unknown tool " + name
        func = tools[name]
        try:
            inspect.signature(func).bind(**args)
        except TypeError:
            return "error: bad arguments"
        try:
            return str(func(**args))
        except Exception as err:
            return "error: " + type(err).__name__ + ": " + str(err)
  explanation: 'The text of an error is useful for the model: it can often correct itself. That is why we return it instead of hiding it.'
- id: calc
  title: A calculator the model can use
  difficulty: 5
  prompt: 'One of the most useful tools is a calculator, because models are unreliable at arithmetic. Write `safe_calc(expr)`. A calculator tool must NEVER use eval on text that came from a model. Parse with ast.parse(expr, mode=''eval'') and evaluate the tree yourself. Allowed: numbers (int or float, not True/False), the binary operators + - * / // %, and a unary + or -, with any nesting (parentheses are only grouping). ValueError(''too long'') if the text is longer than 100 characters; ValueError(''unsupported expression'') for anything else, including a syntax error, names, calls, ** and strings. A division by zero raises the ordinary ZeroDivisionError. Return the number.'
  starter: |-
    def safe_calc(expr):
        """A calculator tool must NEVER use eval on text that came from a model. Parse with ast.parse(expr, mode='eval') and evaluate the tree yourself. Allowed: numbers (int or float, not True/False), the binary operators + - * / // %, and a unary + or -, with any nesting (parentheses are only grouping). ValueError('too long') if the text is longer than 100 characters; ValueError('unsupported expression') for anything else, including a syntax error, names, calls, ** and strings. A division by zero raises the ordinary ZeroDivisionError. Return the number."""
        pass
  tests:
  - name: arithmetic
    code: |
      assert safe_calc("1 + 2 * 3") == 7 and safe_calc("(1 + 2) * 3") == 9 and safe_calc("10 / 4") == 2.5 and safe_calc("7 // 2") == 3 and safe_calc("7 % 4") == 3 and safe_calc("-3 + +5") == 2 and safe_calc("  2 * (3 + (4 - 1))  ") == 12 and safe_calc("1.5 * 2") == 3.0 and safe_calc("--4") == 4 and safe_calc("5") == 5
      try:
          safe_calc("1 / 0")
          raise AssertionError("accepted")
      except ZeroDivisionError:
          pass
  - name: refusing everything else
    code: |
      for bad in ("2 ** 10", "__import__('os').system('ls')", "abs(-1)", "x + 1", "'a' * 3", "True + 1", "[1]", "1 +", "", "lambda: 1", "1 if 2 else 3", "(1, 2)", "1 < 2", "2 ** 99999999"):
          try:
              safe_calc(bad)
              raise AssertionError("accepted " + bad)
          except ValueError as e:
              assert "unsupported expression" in str(e)
      try:
          safe_calc("1+" * 60 + "1")
          raise AssertionError("accepted")
      except ValueError as e:
          assert "too long" in str(e)
      assert safe_calc("1+" * 49 + "1") == 50
  hints:
  - Walk the tree with a small recursive function.
  - Allow only the node types you list, and refuse the rest by default.
  solution: |
    def safe_calc(expr):
        """A calculator tool must NEVER use eval on text that came from a model. Parse with ast.parse(expr, mode='eval') and evaluate the tree yourself. Allowed: numbers (int or float, not True/False), the binary operators + - * / // %, and a unary + or -, with any nesting (parentheses are only grouping). ValueError('too long') if the text is longer than 100 characters; ValueError('unsupported expression') for anything else, including a syntax error, names, calls, ** and strings. A division by zero raises the ordinary ZeroDivisionError. Return the number."""
        import ast, operator
        if len(expr) > 100:
            raise ValueError("too long")
        ops = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul, ast.Div: operator.truediv, ast.FloorDiv: operator.floordiv, ast.Mod: operator.mod}

        def ev(node):
            if isinstance(node, ast.Constant) and type(node.value) in (int, float):
                return node.value
            if isinstance(node, ast.BinOp) and type(node.op) in ops:
                return ops[type(node.op)](ev(node.left), ev(node.right))
            if isinstance(node, ast.UnaryOp) and isinstance(node.op, (ast.USub, ast.UAdd)):
                value = ev(node.operand)
                return -value if isinstance(node.op, ast.USub) else value
            raise ValueError("unsupported expression")
        try:
            tree = ast.parse(expr.strip(), mode="eval")
        except SyntaxError:
            raise ValueError("unsupported expression")
        return ev(tree.body)
  explanation: 'Refusing by default is the secret of safe tools: you list what is allowed instead of trying to list everything that is dangerous.'
- id: policy
  title: Guardrails
  difficulty: 4
  prompt: 'An agent with tools can do harm: delete files, send money, leak data. **Guardrails** limit what it may do, **outside** the model (you cannot rely on the model to behave). Write `check_policy(policy, history, name, args)`. GUARDRAILS decide what an agent may do. `policy` is a dict with the optional keys ''allowed'' (the list of permitted tool names; missing means all), ''max_calls'' (the most tool calls that may be executed in total; missing means no limit) and ''blocked'' (a list of forbidden pieces of text; missing means none). `history` is the list of calls executed so far. Return the first reason in this order, or None if the call is allowed: ''tool not allowed'' if the name is not in ''allowed''; ''too many calls'' if len(history) >= max_calls; ''blocked argument'' if any blocked text occurs in str(value) of any argument value (ignore upper and lower case).'
