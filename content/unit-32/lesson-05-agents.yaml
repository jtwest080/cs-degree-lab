- type: code
  question: Write `tool_names(tools)` returning the sorted list of the names of the tools in the dict `tools` whose function takes NO required arguments (use `inspect.signature`; a parameter with a default value is not required).
  starter: |
    def tool_names(tools):
        pass
  tests:
  - name: names
    code: |
      tools = {"now": lambda: 1, "add": lambda a, b: a + b, "greet": lambda name="x": name, "mix": lambda a, b=2: a}
      assert tool_names(tools) == ["greet", "now"] and tool_names({}) == [] and tool_names({"f": lambda *args, **kw: 0}) == ["f"]
  solution: |
    import inspect


    def tool_names(tools):
        names = []
        for name, func in tools.items():
            params = inspect.signature(func).parameters.values()
            if all(p.default is not p.empty or p.kind in (p.VAR_POSITIONAL, p.VAR_KEYWORD) for p in params):
                names.append(name)
        return sorted(names)
