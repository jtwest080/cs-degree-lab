id: u32-agents
title: Agents, Tools and Guardrails
minutes: 115
objective: 'Understand how an AI system can act in the world: by asking for tools. You will parse tool requests, run tools without ever crashing, write a calculator that never uses eval, enforce a policy and put it all into an agent loop.'
outcomes:
- Explain what an agent is
- Parse and run tool calls robustly
- Write a tool that is safe against hostile input
- Enforce guardrails outside the model
- Build a complete agent loop with a step limit
sections:
- heading: From chat to agents
  body: |-
    A model on its own only produces text. An **agent** is a program around a model that lets it *act*. The loop is simple:

    1. Send the model the task and everything that has happened so far.
    2. The model replies either with a **final answer** or with a **tool call**: a request to run a function, with arguments, written in a fixed format such as JSON.
    3. Your program checks the request, runs the tool and appends the result (an **observation**) to the conversation.
    4. Go back to step 1, until there is a final answer or a **step limit** is reached.

    Tools can read files, search the web, run tests, query a database, edit code or call other programs. This is how coding agents work: they read your project, make a change, run the tests, read the failures and try again. It is the loop of the last lesson with the human replaced by tools. Standards such as the **Model Context Protocol** (MCP) describe how tools are offered to models in a uniform way.
- heading: Power needs guardrails
  body: |-
    An agent can do real damage if it misunderstands you, or if someone **tricks** it (next lesson: prompt injection). Safety does not come from asking the model nicely. It comes from the **program around it**:

    - **Least privilege.** Give the agent only the tools and the folders it needs. Read-only unless writing is required.
    - **An allow-list of tools** and of arguments, and a **deny-list** of dangerous text, enforced in code.
    - **Limits**: maximum steps, maximum tool calls, time and cost budgets.
    - **Safe tools.** A calculator must not `eval` the text it is given; a file tool must refuse paths outside its folder (the *path traversal* of the security unit); a shell tool must not run arbitrary commands.
    - **Human approval** for irreversible actions: deleting, sending, paying, publishing.
    - **Sandboxing**: run the agent in a container or a separate account, not with your own passwords.
    - **Logs** of every call, so that you can see what happened.

    Treat an agent like a very fast new intern with access to your computer: capable, eager, sometimes mistaken, and *never* given the keys to everything on the first day.
examples:
- title: Reading and running a tool call
  intro: A reply with a request in the middle, a safe calculator, and three ways it can go wrong.
  code: |
    def parse_tool_call(reply):
        """An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST '{' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing 'args' means {}. Raise ValueError('not a tool call') if there is no '{', if the JSON is invalid, if it is not an object, if 'tool' is not a text or if 'args' is not an object."""
        import json
        start = reply.find("{")
        if start < 0:
            raise ValueError("not a tool call")
        try:
            obj, _ = json.JSONDecoder().raw_decode(reply[start:])
        except ValueError:
            raise ValueError("not a tool call")
        if not isinstance(obj, dict) or not isinstance(obj.get("tool"), str) or not isinstance(obj.get("args", {}), dict):
            raise ValueError("not a tool call")
        return obj["tool"], obj.get("args", {})


    def run_tool(tools, name, args):
        """Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: 'error: unknown tool NAME' if the name is not in tools; 'error: bad arguments' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, 'error: ' + the exception type name + ': ' + its text."""
        import inspect
        if name not in tools:
            return "error: unknown tool " + name
        func = tools[name]
        try:
            inspect.signature(func).bind(**args)
        except TypeError:
            return "error: bad arguments"
        try:
            return str(func(**args))
        except Exception as err:
            return "error: " + type(err).__name__ + ": " + str(err)


    def safe_calc(expr):
        """A calculator tool must NEVER use eval on text that came from a model. Parse with ast.parse(expr, mode='eval') and evaluate the tree yourself. Allowed: numbers (int or float, not True/False), the binary operators + - * / // %, and a unary + or -, with any nesting (parentheses are only grouping). ValueError('too long') if the text is longer than 100 characters; ValueError('unsupported expression') for anything else, including a syntax error, names, calls, ** and strings. A division by zero raises the ordinary ZeroDivisionError. Return the number."""
        import ast, operator
        if len(expr) > 100:
            raise ValueError("too long")
        ops = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul, ast.Div: operator.truediv, ast.FloorDiv: operator.floordiv, ast.Mod: operator.mod}

        def ev(node):
            if isinstance(node, ast.Constant) and type(node.value) in (int, float):
                return node.value
            if isinstance(node, ast.BinOp) and type(node.op) in ops:
                return ops[type(node.op)](ev(node.left), ev(node.right))
            if isinstance(node, ast.UnaryOp) and isinstance(node.op, (ast.USub, ast.UAdd)):
                value = ev(node.operand)
                return -value if isinstance(node.op, ast.USub) else value
            raise ValueError("unsupported expression")
        try:
            tree = ast.parse(expr.strip(), mode="eval")
        except SyntaxError:
            raise ValueError("unsupported expression")
        return ev(tree.body)

    reply = 'Let me check.\n{"tool": "calc", "args": {"expr": "12 * (3 + 4)"}}'
    name, args = parse_tool_call(reply)
    print(name, args)
    tools = {"calc": safe_calc}
    print(run_tool(tools, name, args))
    print(run_tool(tools, "calc", {"expr": "__import__('os').getcwd()"}))
    print(run_tool(tools, "calc", {"expression": "1+1"}))
    print(run_tool(tools, "browse", {}))
  output: |
    calc {'expr': '12 * (3 + 4)'}
    84
    error: ValueError: unsupported expression
    error: bad arguments
    error: unknown tool browse
  lines:
  - line: 56
    note: The request is found inside the chatty reply.
  - line: 58
    note: 84, calculated safely.
  - line: 59
    note: Hostile text is refused, not run.
  - line: 60
    note: A wrong argument name is reported, not crashed.
  - line: 61
    note: Unknown tools are reported too.
- title: An agent with a policy
  intro: The model uses the calculator, then tries to read a secret file, and the guardrail refuses.
  code: |
    def parse_tool_call(reply):
        """An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST '{' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing 'args' means {}. Raise ValueError('not a tool call') if there is no '{', if the JSON is invalid, if it is not an object, if 'tool' is not a text or if 'args' is not an object."""
        import json
        start = reply.find("{")
        if start < 0:
            raise ValueError("not a tool call")
        try:
            obj, _ = json.JSONDecoder().raw_decode(reply[start:])
        except ValueError:
            raise ValueError("not a tool call")
        if not isinstance(obj, dict) or not isinstance(obj.get("tool"), str) or not isinstance(obj.get("args", {}), dict):
            raise ValueError("not a tool call")
        return obj["tool"], obj.get("args", {})


    def run_tool(tools, name, args):
        """Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: 'error: unknown tool NAME' if the name is not in tools; 'error: bad arguments' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, 'error: ' + the exception type name + ': ' + its text."""
        import inspect
        if name not in tools:
            return "error: unknown tool " + name
        func = tools[name]
        try:
            inspect.signature(func).bind(**args)
        except TypeError:
            return "error: bad arguments"
        try:
            return str(func(**args))
        except Exception as err:
            return "error: " + type(err).__name__ + ": " + str(err)


    def safe_calc(expr):
        """A calculator tool must NEVER use eval on text that came from a model. Parse with ast.parse(expr, mode='eval') and evaluate the tree yourself. Allowed: numbers (int or float, not True/False), the binary operators + - * / // %, and a unary + or -, with any nesting (parentheses are only grouping). ValueError('too long') if the text is longer than 100 characters; ValueError('unsupported expression') for anything else, including a syntax error, names, calls, ** and strings. A division by zero raises the ordinary ZeroDivisionError. Return the number."""
        import ast, operator
        if len(expr) > 100:
            raise ValueError("too long")
        ops = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul, ast.Div: operator.truediv, ast.FloorDiv: operator.floordiv, ast.Mod: operator.mod}

        def ev(node):
            if isinstance(node, ast.Constant) and type(node.value) in (int, float):
                return node.value
            if isinstance(node, ast.BinOp) and type(node.op) in ops:
                return ops[type(node.op)](ev(node.left), ev(node.right))
            if isinstance(node, ast.UnaryOp) and isinstance(node.op, (ast.USub, ast.UAdd)):
                value = ev(node.operand)
                return -value if isinstance(node.op, ast.USub) else value
            raise ValueError("unsupported expression")
        try:
            tree = ast.parse(expr.strip(), mode="eval")
        except SyntaxError:
            raise ValueError("unsupported expression")
        return ev(tree.body)


    def check_policy(policy, history, name, args):
        """GUARDRAILS decide what an agent may do. `policy` is a dict with the optional keys 'allowed' (the list of permitted tool names; missing means all), 'max_calls' (the most tool calls that may be executed in total; missing means no limit) and 'blocked' (a list of forbidden pieces of text; missing means none). `history` is the list of calls executed so far. Return the first reason in this order, or None if the call is allowed: 'tool not allowed' if the name is not in 'allowed'; 'too many calls' if len(history) >= max_calls; 'blocked argument' if any blocked text occurs in str(value) of any argument value (ignore upper and lower case)."""
        if "allowed" in policy and name not in policy["allowed"]:
            return "tool not allowed"
        if "max_calls" in policy and len(history) >= policy["max_calls"]:
            return "too many calls"
        for value in args.values():
            for bad in policy.get("blocked", []):
                if bad.lower() in str(value).lower():
                    return "blocked argument"
        return None


    def agent_loop(model, tools, task, policy, max_steps):
        """The agent loop. Use the given parse_tool_call, check_policy and run_tool. ValueError('max_steps must be positive') if max_steps < 1. Repeat for step 1, 2, ... max_steps: the PROMPT is the task followed by one line '\nObservation: ' + text for every observation so far; the reply is model(prompt). If the stripped reply starts with 'FINAL:' stop and return the dict {'answer': the rest of the reply, stripped, 'steps': the step number, 'log': the log}. Otherwise try parse_tool_call: if that fails the observation is 'error: not a tool call' (log entry (None, None, observation)). If check_policy gives a reason the observation is 'refused: ' + reason and the call is NOT run; else the observation is run_tool(...) and the call is added to the history. Every tool attempt adds the log entry (name, args, observation). After max_steps without an answer return {'answer': None, 'steps': max_steps, 'log': log}."""
        if max_steps < 1:
            raise ValueError("max_steps must be positive")
        observations, log, history = [], [], []
        for step in range(1, max_steps + 1):
            prompt = task + "".join("\nObservation: " + o for o in observations)
            reply = model(prompt)
            if reply.strip().startswith("FINAL:"):
                return {"answer": reply.strip()[len("FINAL:"):].strip(), "steps": step, "log": log}
            try:
                name, args = parse_tool_call(reply)
            except ValueError:
                observation = "error: not a tool call"
                log.append((None, None, observation))
                observations.append(observation)
                continue
            reason = check_policy(policy, history, name, args)
            if reason:
                observation = "refused: " + reason
            else:
                observation = run_tool(tools, name, args)
                history.append((name, args))
            log.append((name, args, observation))
            observations.append(observation)
        return {"answer": None, "steps": max_steps, "log": log}

    script = ['{"tool": "calc", "args": {"expr": "19.99 * 3"}}', '{"tool": "read_file", "args": {"path": ".env"}}', "FINAL: Three books cost 59.97."]
    calls = []
    def model(prompt):
        calls.append(prompt)
        return script[len(calls) - 1]
    tools = {"calc": safe_calc, "read_file": lambda path: "file text"}
    policy = {"allowed": ["calc"], "max_calls": 3, "blocked": [".env"]}
    result = agent_loop(model, tools, "What do 3 books at 19.99 cost?", policy, 6)
    print(result["answer"])
    for entry in result["log"]:
        print(entry)
  output: |
    Three books cost 59.97.
    ('calc', {'expr': '19.99 * 3'}, '59.97')
    ('read_file', {'path': '.env'}, 'refused: tool not allowed')
  lines:
  - line: 103
    note: The final answer of the model.
  - line: 104
    note: The log shows the refused file read.
