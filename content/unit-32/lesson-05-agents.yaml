  - Check the rules in the stated order and return at the first reason.
  - policy.get('blocked', []) handles a missing key.
  solution: |
    def check_policy(policy, history, name, args):
        """GUARDRAILS decide what an agent may do. `policy` is a dict with the optional keys 'allowed' (the list of permitted tool names; missing means all), 'max_calls' (the most tool calls that may be executed in total; missing means no limit) and 'blocked' (a list of forbidden pieces of text; missing means none). `history` is the list of calls executed so far. Return the first reason in this order, or None if the call is allowed: 'tool not allowed' if the name is not in 'allowed'; 'too many calls' if len(history) >= max_calls; 'blocked argument' if any blocked text occurs in str(value) of any argument value (ignore upper and lower case)."""
        if "allowed" in policy and name not in policy["allowed"]:
            return "tool not allowed"
        if "max_calls" in policy and len(history) >= policy["max_calls"]:
            return "too many calls"
        for value in args.values():
            for bad in policy.get("blocked", []):
                if bad.lower() in str(value).lower():
                    return "blocked argument"
        return None
  explanation: 'Real systems add a human approval step for risky actions (sending an email, spending money) and run tools in a sandbox with only the access they need: least privilege again.'
- id: agent
  title: 'Capstone: an agent loop'
  difficulty: 5
  prompt: |-
    Put everything together into an **agent**: a model that can think, ask for tools, read the results and decide when it is done. The functions `parse_tool_call`, `check_policy` and `run_tool` are given. Write `agent_loop(model, tools, task, policy, max_steps)`. The agent loop. Use the given parse_tool_call, check_policy and run_tool. ValueError('max_steps must be positive') if max_steps < 1. Repeat for step 1, 2, ... max_steps: the PROMPT is the task followed by one line '
    Observation: ' + text for every observation so far; the reply is model(prompt). If the stripped reply starts with 'FINAL:' stop and return the dict {'answer': the rest of the reply, stripped, 'steps': the step number, 'log': the log}. Otherwise try parse_tool_call: if that fails the observation is 'error: not a tool call' (log entry (None, None, observation)). If check_policy gives a reason the observation is 'refused: ' + reason and the call is NOT run; else the observation is run_tool(...) and the call is added to the history. Every tool attempt adds the log entry (name, args, observation). After max_steps without an answer return {'answer': None, 'steps': max_steps, 'log': log}.
  starter: |-
    def parse_tool_call(reply):
        """An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST '{' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing 'args' means {}. Raise ValueError('not a tool call') if there is no '{', if the JSON is invalid, if it is not an object, if 'tool' is not a text or if 'args' is not an object."""
        import json
        start = reply.find("{")
        if start < 0:
            raise ValueError("not a tool call")
        try:
            obj, _ = json.JSONDecoder().raw_decode(reply[start:])
        except ValueError:
            raise ValueError("not a tool call")
        if not isinstance(obj, dict) or not isinstance(obj.get("tool"), str) or not isinstance(obj.get("args", {}), dict):
            raise ValueError("not a tool call")
        return obj["tool"], obj.get("args", {})


    def run_tool(tools, name, args):
        """Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: 'error: unknown tool NAME' if the name is not in tools; 'error: bad arguments' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, 'error: ' + the exception type name + ': ' + its text."""
        import inspect
        if name not in tools:
            return "error: unknown tool " + name
        func = tools[name]
        try:
            inspect.signature(func).bind(**args)
        except TypeError:
            return "error: bad arguments"
        try:
            return str(func(**args))
        except Exception as err:
            return "error: " + type(err).__name__ + ": " + str(err)


    def check_policy(policy, history, name, args):
        """GUARDRAILS decide what an agent may do. `policy` is a dict with the optional keys 'allowed' (the list of permitted tool names; missing means all), 'max_calls' (the most tool calls that may be executed in total; missing means no limit) and 'blocked' (a list of forbidden pieces of text; missing means none). `history` is the list of calls executed so far. Return the first reason in this order, or None if the call is allowed: 'tool not allowed' if the name is not in 'allowed'; 'too many calls' if len(history) >= max_calls; 'blocked argument' if any blocked text occurs in str(value) of any argument value (ignore upper and lower case)."""
        if "allowed" in policy and name not in policy["allowed"]:
            return "tool not allowed"
        if "max_calls" in policy and len(history) >= policy["max_calls"]:
            return "too many calls"
        for value in args.values():
            for bad in policy.get("blocked", []):
                if bad.lower() in str(value).lower():
                    return "blocked argument"
        return None




    def agent_loop(model, tools, task, policy, max_steps):
        """The agent loop. Use the given parse_tool_call, check_policy and run_tool. ValueError('max_steps must be positive') if max_steps < 1. Repeat for step 1, 2, ... max_steps: the PROMPT is the task followed by one line '\nObservation: ' + text for every observation so far; the reply is model(prompt). If the stripped reply starts with 'FINAL:' stop and return the dict {'answer': the rest of the reply, stripped, 'steps': the step number, 'log': the log}. Otherwise try parse_tool_call: if that fails the observation is 'error: not a tool call' (log entry (None, None, observation)). If check_policy gives a reason the observation is 'refused: ' + reason and the call is NOT run; else the observation is run_tool(...) and the call is added to the history. Every tool attempt adds the log entry (name, args, observation). After max_steps without an answer return {'answer': None, 'steps': max_steps, 'log': log}."""
        pass
  tests:
  - name: using a tool
    code: |
      replies = ['I will calculate.\n{"tool": "calc", "args": {"expr": "6 * 7"}}', "FINAL: The answer is 42."]
      seen = []
      def model(prompt):
          seen.append(prompt)
          return replies[len(seen) - 1]
      tools = {"calc": lambda expr: eval(expr)}
      r = agent_loop(model, tools, "What is 6 * 7?", {}, 5)
      assert r == {"answer": "The answer is 42.", "steps": 2, "log": [("calc", {"expr": "6 * 7"}, "42")]}
      assert seen == ["What is 6 * 7?", "What is 6 * 7?\nObservation: 42"]
  - name: trouble
    code: |
      replies = ["hmm, let me think", '{"tool": "delete", "args": {}}', '{"tool": "read", "args": {"path": "a"}}', '{"tool": "read", "args": {"path": "b"}}', '{"tool": "read", "args": {"path": "secret.env"}}', "  FINAL:   gave up  "]
      seen = []
      def model(prompt):
          seen.append(prompt)
          return replies[len(seen) - 1]
      tools = {"read": lambda path: "text of " + path, "delete": lambda: "deleted"}
      policy = {"allowed": ["read"], "max_calls": 2, "blocked": [".env"]}
      r = agent_loop(model, tools, "T", policy, 10)
      assert r["answer"] == "gave up" and r["steps"] == 6
      assert r["log"] == [(None, None, "error: not a tool call"), ("delete", {}, "refused: tool not allowed"), ("read", {"path": "a"}, "text of a"), ("read", {"path": "b"}, "text of b"), ("read", {"path": "secret.env"}, "refused: too many calls")]
      assert seen[2] == "T\nObservation: error: not a tool call\nObservation: refused: tool not allowed"
  - name: step limit
    code: |
      n = []
      def forever(prompt):
          n.append(prompt)
          return '{"tool": "ping", "args": {}}'
      r = agent_loop(forever, {"ping": lambda: "pong"}, "T", {}, 3)
      assert r["answer"] is None and r["steps"] == 3 and len(n) == 3 and r["log"] == [("ping", {}, "pong")] * 3
      assert agent_loop(lambda p: "FINAL: now", {}, "T", {}, 1) == {"answer": "now", "steps": 1, "log": []}
      try:
          agent_loop(lambda p: "", {}, "T", {}, 0)
          raise AssertionError("accepted")
      except ValueError as e:
          assert "max_steps must be positive" in str(e)
  hints:
  - Build the prompt from the task and all the observations each time.
  - '`continue` after an unparsable reply jumps to the next step.'
  solution: |
    def parse_tool_call(reply):
        """An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST '{' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing 'args' means {}. Raise ValueError('not a tool call') if there is no '{', if the JSON is invalid, if it is not an object, if 'tool' is not a text or if 'args' is not an object."""
        import json
        start = reply.find("{")
        if start < 0:
            raise ValueError("not a tool call")
        try:
            obj, _ = json.JSONDecoder().raw_decode(reply[start:])
        except ValueError:
            raise ValueError("not a tool call")
        if not isinstance(obj, dict) or not isinstance(obj.get("tool"), str) or not isinstance(obj.get("args", {}), dict):
            raise ValueError("not a tool call")
        return obj["tool"], obj.get("args", {})


    def run_tool(tools, name, args):
        """Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: 'error: unknown tool NAME' if the name is not in tools; 'error: bad arguments' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, 'error: ' + the exception type name + ': ' + its text."""
        import inspect
        if name not in tools:
            return "error: unknown tool " + name
        func = tools[name]
        try:
            inspect.signature(func).bind(**args)
        except TypeError:
            return "error: bad arguments"
        try:
            return str(func(**args))
        except Exception as err:
            return "error: " + type(err).__name__ + ": " + str(err)


    def check_policy(policy, history, name, args):
        """GUARDRAILS decide what an agent may do. `policy` is a dict with the optional keys 'allowed' (the list of permitted tool names; missing means all), 'max_calls' (the most tool calls that may be executed in total; missing means no limit) and 'blocked' (a list of forbidden pieces of text; missing means none). `history` is the list of calls executed so far. Return the first reason in this order, or None if the call is allowed: 'tool not allowed' if the name is not in 'allowed'; 'too many calls' if len(history) >= max_calls; 'blocked argument' if any blocked text occurs in str(value) of any argument value (ignore upper and lower case)."""
        if "allowed" in policy and name not in policy["allowed"]:
            return "tool not allowed"
        if "max_calls" in policy and len(history) >= policy["max_calls"]:
            return "too many calls"
        for value in args.values():
            for bad in policy.get("blocked", []):
                if bad.lower() in str(value).lower():
                    return "blocked argument"
        return None




    def agent_loop(model, tools, task, policy, max_steps):
        """The agent loop. Use the given parse_tool_call, check_policy and run_tool. ValueError('max_steps must be positive') if max_steps < 1. Repeat for step 1, 2, ... max_steps: the PROMPT is the task followed by one line '\nObservation: ' + text for every observation so far; the reply is model(prompt). If the stripped reply starts with 'FINAL:' stop and return the dict {'answer': the rest of the reply, stripped, 'steps': the step number, 'log': the log}. Otherwise try parse_tool_call: if that fails the observation is 'error: not a tool call' (log entry (None, None, observation)). If check_policy gives a reason the observation is 'refused: ' + reason and the call is NOT run; else the observation is run_tool(...) and the call is added to the history. Every tool attempt adds the log entry (name, args, observation). After max_steps without an answer return {'answer': None, 'steps': max_steps, 'log': log}."""
        if max_steps < 1:
            raise ValueError("max_steps must be positive")
        observations, log, history = [], [], []
        for step in range(1, max_steps + 1):
            prompt = task + "".join("\nObservation: " + o for o in observations)
            reply = model(prompt)
            if reply.strip().startswith("FINAL:"):
                return {"answer": reply.strip()[len("FINAL:"):].strip(), "steps": step, "log": log}
            try:
                name, args = parse_tool_call(reply)
            except ValueError:
                observation = "error: not a tool call"
                log.append((None, None, observation))
                observations.append(observation)
                continue
            reason = check_policy(policy, history, name, args)
            if reason:
                observation = "refused: " + reason
            else:
                observation = run_tool(tools, name, args)
                history.append((name, args))
            log.append((name, args, observation))
            observations.append(observation)
        return {"answer": None, "steps": max_steps, "log": log}
  explanation: 'Every serious agent has these four parts: a model, tools, guardrails and a step limit. Everything else, from planning to memory, is built on top.'
commonMistakes:
- title: Using eval in a tool
  explanation: Model text can contain anything.
- title: Crashing on a bad request
  explanation: Return the error as text instead.
- title: No step limit
  explanation: Loops can run for ever and cost money.
- title: Safety only in the prompt
  explanation: Enforce rules in code.
- title: Giving full access
  explanation: Least privilege limits the damage.
summary:
- 'An agent is a loop: model, tool call, observation.'
- Tool requests are text that you parse and check.
- Errors become observations, never crashes.
- 'Guardrails live in code: allow-lists, limits, approval.'
- Always set a step limit and keep logs.
