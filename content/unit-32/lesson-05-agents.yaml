      assert check_policy(policy, [], "read", {"path": "C:/.ENV"}) == "blocked argument" and check_policy(policy, [], "search", {"q": "my Password list"}) == "blocked argument" and check_policy(policy, [], "read", {"n": 5, "path": "ok"}) is None
  - name: order and missing keys
