  - name: checking licenses
    code: |
      files = {"b.py": "# SPDX-License-Identifier: GPL-3.0\nx = 1", "a.py": "# SPDX-License-Identifier: MIT\ny = 2", "c.py": "# Copyright (c) 2020 Someone\nz = 3", "d.py": "print('mine')", "e.py": "# Copyright \u00a9 2021 Other\n"}
      assert scan_licenses(files, {"MIT", "Apache-2.0"}) == [("b.py", "GPL-3.0"), ("c.py", "unknown license"), ("e.py", "unknown license")]
      assert scan_licenses(files, ["MIT", "GPL-3.0"]) == [("c.py", "unknown license"), ("e.py", "unknown license")] and scan_licenses({}, ["MIT"]) == []
  - name: details
    code: |
      two = {"x.py": "# SPDX-License-Identifier: GPL-2.0\n# SPDX-License-Identifier:   AGPL-3.0   more\nCopyright (c) 1999"}
      assert scan_licenses(two, {"MIT"}) == [("x.py", "GPL-2.0"), ("x.py", "AGPL-3.0")]
      assert scan_licenses({"y.py": "# SPDX-License-Identifier: MIT\n# Copyright (c) me"}, {"MIT"}) == [] and scan_licenses({"z.py": "copyright (c) lowercase"}, {"MIT"}) == []
  hints:
  - re.findall with a group returns the identifiers.
  - Report 'unknown license' only when there is no SPDX line at all.
  solution: |
    def scan_licenses(files, allowed):
        """AI assistants can reproduce code that has a LICENSE: rules about copying and sharing. (If you copy GPL code into your program you may have to publish your whole program under the GPL.) `files` is a dict {name: text}, `allowed` a collection of permitted SPDX license names such as 'MIT'. For every file, in sorted name order: each line 'SPDX-License-Identifier: NAME' (NAME is the text up to the next blank) gives (file, NAME) if NAME is not in allowed; a file that has no SPDX line but contains the text 'Copyright (c)' or 'Copyright ©' gives (file, 'unknown license'). Return the list of (file, problem)."""
        import re
        problems = []
        for name in sorted(files):
            text = files[name]
            ids = re.findall(r"SPDX-License-Identifier:\s*(\S+)", text)
            for ident in ids:
                if ident not in allowed:
                    problems.append((name, ident))
            if not ids and ("Copyright (c)" in text or "Copyright ©" in text):
                problems.append((name, "unknown license"))
        return problems
  explanation: This is no legal advice. Companies use scanners and a clear policy, and keep a record of which code came from where. Many AI services offer a setting that blocks suggestions that match public code.
- id: prepare
  title: 'Capstone: a safe request'
  difficulty: 5
