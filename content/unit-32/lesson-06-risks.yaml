- type: code
  question: Write `mask_card(number)` that returns a card number text with every digit except the last four replaced by `*` (other characters such as spaces stay as they are). A text with four or fewer digits is returned unchanged.
  starter: |
    def mask_card(number):
        pass
  tests:
  - name: masking
    code: |
      assert mask_card("4111 1111 1111 1234") == "**** **** **** 1234" and mask_card("1234") == "1234" and mask_card("12") == "12" and mask_card("") == "" and mask_card("a1b2c3d4e5") == "a*b2c3d4e5"
  solution: |
    def mask_card(number):
        total = sum(c.isdigit() for c in number)
        seen = 0
        out = []
        for c in number:
            if c.isdigit():
                seen += 1
                out.append(c if seen > total - 4 else "*")
            else:
                out.append(c)
        return "".join(out)
