    def estimate_tokens(text):
        """Rough number of tokens: characters divided by 4, rounded up."""
        return (len(text) + 3) // 4


    def redact_secrets(text):
        """Before you paste code or logs into an AI service, remove what must not leave your computer. Return (clean text, counts). Replace, in this order: every AWS key (AKIA followed by 16 upper-case letters or digits) with [AWS_KEY]; every e-mail address (letters, digits and . _ + - before an @, then a domain with at least one dot) with [EMAIL]; and the VALUE of a hard-coded secret with [SECRET]: one of the words password, passwd, secret, token, api_key, api-key or apikey (any case), then optional blanks, : or =, optional blanks, and a quoted value (single or double quotes) of at least 6 characters without blanks or quotes. Keep the word, the separator and the quote marks, e.g. password = "[SECRET]". `counts` is a dict {'aws key': n, 'email': n, 'secret': n} containing only the kinds that were replaced at least once."""
        import re
        counts = {}

        def sub(kind, pattern, repl, text):
            new, n = re.subn(pattern, repl, text)
            if n:
                counts[kind] = n
            return new
        text = sub("aws key", r"AKIA[0-9A-Z]{16}", "[AWS_KEY]", text)
        text = sub("email", r"[A-Za-z0-9._+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", "[EMAIL]", text)
        text = sub("secret", r"(?i)((?:password|passwd|secret|token|api[_-]?key)\s*[:=]\s*)(['\"])[^\s'\"]{6,}\2", r"\1\2[SECRET]\2", text)
        return text, counts


    def detect_injection(text):
        """PROMPT INJECTION: text that the model reads (a web page, a file, an e-mail) contains instructions meant for the model, such as 'ignore your instructions'. A simple detector uses rules. Ignoring upper and lower case, return the list of rule names, in this order, whose pattern is found (use re.search): 'ignore instructions': ignore, then optionally all or any, then previous, prior or above, then instructions or rules (single blanks between); 'reveal prompt': reveal, show, print or repeat, then your or the, then optionally 'system ', then prompt or instructions; 'role override': you are now, act as, or pretend to be; 'exfiltrate': send, post, upload or email, then up to 40 characters of anything on the same line, then password, secret, token or key; 'hidden command': rm -rf, or curl then text without | and then a | (a pipe) and then sh or bash. (A rule list can never catch everything; it only shows the idea.)"""
        import re
        rules = [
            ("ignore instructions", r"ignore (all |any )?(previous|prior|above) (instructions|rules)"),
            ("reveal prompt", r"(reveal|show|print|repeat) (your|the) (system )?(prompt|instructions)"),
            ("role override", r"you are now|act as|pretend to be"),
            ("exfiltrate", r"(send|post|upload|email) .{0,40}(password|secret|token|key)"),
            ("hidden command", r"rm -rf|curl [^|\n]*\| ?(ba)?sh"),
        ]
        return [name for name, pattern in rules if re.search(pattern, text, re.IGNORECASE)]


    def wrap_untrusted(text, nonce):
