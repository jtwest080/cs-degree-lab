- id: license
  title: Who owns this code?
  difficulty: 4
  prompt: 'Models learned from public code and sometimes reproduce it almost word for word, along with its **license**: the rules about copying and sharing. If you copy code under a strong copyleft license such as the GPL into your program, you may have to publish your whole program under it. Write `scan_licenses(files, allowed)`. AI assistants can reproduce code that has a LICENSE: rules about copying and sharing. (If you copy GPL code into your program you may have to publish your whole program under the GPL.) `files` is a dict {name: text}, `allowed` a collection of permitted SPDX license names such as ''MIT''. For every file, in sorted name order: each line ''SPDX-License-Identifier: NAME'' (NAME is the text up to the next blank) gives (file, NAME) if NAME is not in allowed; a file that has no SPDX line but contains the text ''Copyright (c)'' or ''Copyright ©'' gives (file, ''unknown license''). Return the list of (file, problem).'
