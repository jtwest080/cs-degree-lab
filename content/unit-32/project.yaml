solution: |
  def estimate_tokens(text):
      """Rough number of tokens: characters divided by 4, rounded up."""
      return (len(text) + 3) // 4


  def parse_code_block(reply):
      """The first fenced code block of a reply (None if there is none), as in lesson 1."""
      lines = reply.split("\n")
      start = None
      for i, line in enumerate(lines):
          if line.strip().startswith("```"):
              start = i
              break
      if start is None:
          return None
      code = []
      for line in lines[start + 1:]:
          if line.strip() == "```":
              break
          code.append(line)
      return "\n".join(code)


  def undefined_names(source):
      """AI assistants sometimes use a helper function or variable that DOES NOT EXIST (a hallucination). Parse the source with ast and return the sorted list of (line, name) for every place where a name is READ (an ast.Name in Load context) that is defined nowhere in the code and is not a built-in name (dir(builtins)). Use this simple FLAT rule: a name counts as defined if, anywhere in the code, it is assigned or deleted (a Name in Store or Del context, including for-loop and comprehension targets and with-as), defined by def or class, a parameter (of a def or lambda: normal, positional-only, keyword-only, *args, **kwargs), imported (import x, import x.y defines x, 'as' gives the new name, from m import n), or the name of an except-as. Raise the SyntaxError of a broken source."""
      import ast, builtins
      tree = ast.parse(source)
      defined = set(dir(builtins))
      for node in ast.walk(tree):
          if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
              defined.add(node.name)
          if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.Lambda)):
              a = node.args
              for arg in a.posonlyargs + a.args + a.kwonlyargs:
                  defined.add(arg.arg)
              for arg in (a.vararg, a.kwarg):
                  if arg:
                      defined.add(arg.arg)
          elif isinstance(node, ast.Name) and isinstance(node.ctx, (ast.Store, ast.Del)):
              defined.add(node.id)
          elif isinstance(node, ast.Import):
              for alias in node.names:
                  defined.add(alias.asname or alias.name.split(".")[0])
          elif isinstance(node, ast.ImportFrom):
              for alias in node.names:
                  defined.add(alias.asname or alias.name)
          elif isinstance(node, ast.ExceptHandler) and node.name:
              defined.add(node.name)
      found = [(n.lineno, n.id) for n in ast.walk(tree) if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load) and n.id not in defined]
      return sorted(found)


  def check_imports(source, allowed):
      """Assistants also invent LIBRARIES, or use ones your project does not have. Parse the source and return the sorted list of (line, module) for every import of a module whose TOP-LEVEL name (the part before the first dot) is not in the collection `allowed`. 'import a.b, c' gives the modules a and c (one entry each, on the line of the statement); 'from a.b import x' gives a; relative imports (from . import x) are ignored. The same module imported on two lines appears twice."""
      import ast
      problems = []
      for node in ast.walk(ast.parse(source)):
          if isinstance(node, ast.Import):
              for alias in node.names:
                  top = alias.name.split(".")[0]
                  if top not in allowed:
                      problems.append((node.lineno, top))
          elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
              top = node.module.split(".")[0]
              if top not in allowed:
                  problems.append((node.lineno, top))
      return sorted(problems)


  def dotted_name(node):
      """The name of what is called: 'eval' for eval(...), 'os.system' for os.system(...); '' for anything more complicated."""
      import ast
      parts = []
      while isinstance(node, ast.Attribute):
          parts.append(node.attr)
          node = node.value
      if isinstance(node, ast.Name):
          parts.append(node.id)
          return ".".join(reversed(parts))
      return ""


  def risky_calls(source):
      """Find DANGEROUS calls that AI code sometimes contains. Parse the source and return the sorted list of unique (line, label) pairs for every call of: eval -> 'eval'; exec -> 'exec'; os.system -> 'os.system'; pickle.load or pickle.loads -> 'pickle load' (unpickling can run any code); any subprocess.NAME(...) call that has the keyword shell=True (the constant True) -> 'subprocess shell=True'; and yaml.load -> 'yaml.load' (unsafe unless a safe loader is used; yaml.safe_load is fine). The helper dotted_name gives the called name."""
      import ast
      labels = {"eval": "eval", "exec": "exec", "os.system": "os.system", "pickle.load": "pickle load", "pickle.loads": "pickle load", "yaml.load": "yaml.load"}
      found = set()
      for node in ast.walk(ast.parse(source)):
          if isinstance(node, ast.Call):
              name = dotted_name(node.func)
              if name in labels:
                  found.add((node.lineno, labels[name]))
              elif name.startswith("subprocess.") and any(k.arg == "shell" and isinstance(k.value, ast.Constant) and k.value.value is True for k in node.keywords):
                  found.add((node.lineno, "subprocess shell=True"))
      return sorted(found)


  def style_problems(source):
      """Find common bad habits. Parse the source and return the sorted list of unique (line, message) pairs: 'bare except' for an except without an exception type (it hides every error, even Ctrl-C); 'mutable default argument' for a function (def, at the line of the def) whose default value is a list, dict or set display or comprehension, or a call to list(), dict() or set() (the one default object is shared between all calls); 'compare to None with is' for a == or != comparison where either side is the constant None; 'missing docstring' for every function whose body does not start with a string constant."""
      import ast
      problems = set()
      for node in ast.walk(ast.parse(source)):
          if isinstance(node, ast.ExceptHandler) and node.type is None:
              problems.add((node.lineno, "bare except"))
          elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
              defaults = [d for d in node.args.defaults + node.args.kw_defaults if d is not None]
              for d in defaults:
                  if isinstance(d, (ast.List, ast.Dict, ast.Set, ast.ListComp, ast.DictComp, ast.SetComp)) or (isinstance(d, ast.Call) and dotted_name(d.func) in ("list", "dict", "set")):
                      problems.add((node.lineno, "mutable default argument"))
              first = node.body[0]
              if not (isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str)):
                  problems.add((node.lineno, "missing docstring"))
          elif isinstance(node, ast.Compare) and any(isinstance(op, (ast.Eq, ast.NotEq)) for op in node.ops):
              sides = [node.left] + node.comparators
              if any(isinstance(s, ast.Constant) and s.value is None for s in sides):
                  problems.add((node.lineno, "compare to None with is"))
      return sorted(problems)


  def review_report(source, allowed):
      """The review of a whole piece of AI code. If the source has a syntax error return ['syntax error at line N'] (N from the SyntaxError, or 1 if it has none). Otherwise return the list of text lines, sorted by line number and then alphabetically, made from: 'line N: undefined name X' for undefined_names, 'line N: module X is not allowed' for check_imports, 'line N: risky call LABEL' for risky_calls and 'line N: MESSAGE' for style_problems. An empty list means the review found nothing."""
      try:
          undefined = undefined_names(source)
          imports = check_imports(source, allowed)
          risky = risky_calls(source)
          style = style_problems(source)
      except SyntaxError as err:
          return ["syntax error at line " + str(err.lineno or 1)]
      lines = [(n, "undefined name " + name) for n, name in undefined]
      lines += [(n, "module " + mod + " is not allowed") for n, mod in imports]
      lines += [(n, "risky call " + label) for n, label in risky]
      lines += [(n, msg) for n, msg in style]
      return ["line " + str(n) + ": " + msg for n, msg in sorted(lines)]


  def check_with_tests(code, tests):
      """Try a piece of code against tests. Run `code` and then `tests` (both source text) with exec in ONE new dict. Return (True, 'all tests passed') if nothing was raised. An AssertionError gives (False, 'test failed: ' + its text) or (False, 'test failed') if the text is empty; any other exception gives (False, 'TypeName: text'), or (False, 'TypeName') if the text is empty. A broken source (SyntaxError) is such an exception too. (Only run code you trust; this is a classroom tool.)"""
      names = {}
      try:
          exec(code, names)
          exec(tests, names)
      except AssertionError as err:
          return False, "test failed: " + str(err) if str(err) else "test failed"
      except Exception as err:
          return False, type(err).__name__ + (": " + str(err) if str(err) else "")
      return True, "all tests passed"


  def fix_loop(model, task, check, max_rounds):
      """The loop of AI pair programming: ask, check, report back, repeat. Use the given parse_code_block and the function `check(code)`, which returns (ok, message). ValueError('max_rounds must be positive') if max_rounds < 1. Each round sends a prompt (the first is the task text itself) to model(prompt) and takes the first code block of the reply. No code block: the next prompt feedback is 'Your reply had no code block. Answer with one code block.' Otherwise call check: if ok, stop with success; if not, the next feedback is 'The previous attempt failed:' + a newline + the message. The next prompt is the task, a blank line (two newlines) and the feedback. Return a dict: 'solved' (True/False), 'rounds' (the number of rounds used), 'code' (the last code block found, or None) and 'prompts' (the list of all prompts sent)."""
      if max_rounds < 1:
          raise ValueError("max_rounds must be positive")
      prompts, prompt, code = [], task, None
      for round_no in range(1, max_rounds + 1):
          prompts.append(prompt)
          code = parse_code_block(model(prompt))
          if code is None:
              feedback = "Your reply had no code block. Answer with one code block."
          else:
              ok, message = check(code)
              if ok:
                  return {"solved": True, "rounds": round_no, "code": code, "prompts": prompts}
              feedback = "The previous attempt failed:\n" + message
          prompt = task + "\n\n" + feedback
      return {"solved": False, "rounds": max_rounds, "code": code, "prompts": prompts}


  def parse_tool_call(reply):
      """An AGENT is a loop in which the model can ask for TOOLS (functions) to be run. The model asks by writing JSON such as {"tool": "add", "args": {"a": 1, "b": 2}}, maybe surrounded by chatty text. Find the FIRST '{' in the reply and read one JSON value from there (json.JSONDecoder().raw_decode(text[start:]) reads one value and ignores the rest). Return (tool name, args dict); a missing 'args' means {}. Raise ValueError('not a tool call') if there is no '{', if the JSON is invalid, if it is not an object, if 'tool' is not a text or if 'args' is not an object."""
      import json
      start = reply.find("{")
      if start < 0:
          raise ValueError("not a tool call")
      try:
          obj, _ = json.JSONDecoder().raw_decode(reply[start:])
      except ValueError:
          raise ValueError("not a tool call")
      if not isinstance(obj, dict) or not isinstance(obj.get("tool"), str) or not isinstance(obj.get("args", {}), dict):
          raise ValueError("not a tool call")
      return obj["tool"], obj.get("args", {})


  def run_tool(tools, name, args):
      """Run one tool for the model, and NEVER crash: whatever happens becomes text that the model can read. `tools` is a dict {name: function}, `args` a dict of keyword arguments. Return: 'error: unknown tool NAME' if the name is not in tools; 'error: bad arguments' if the arguments do not fit the function (use inspect.signature(func).bind(**args) to test this BEFORE calling); otherwise str(result) of func(**args); and if the function raises an exception, 'error: ' + the exception type name + ': ' + its text."""
      import inspect
      if name not in tools:
          return "error: unknown tool " + name
      func = tools[name]
      try:
          inspect.signature(func).bind(**args)
      except TypeError:
          return "error: bad arguments"
      try:
          return str(func(**args))
      except Exception as err:
          return "error: " + type(err).__name__ + ": " + str(err)


  def safe_calc(expr):
      """A calculator tool must NEVER use eval on text that came from a model. Parse with ast.parse(expr, mode='eval') and evaluate the tree yourself. Allowed: numbers (int or float, not True/False), the binary operators + - * / // %, and a unary + or -, with any nesting (parentheses are only grouping). ValueError('too long') if the text is longer than 100 characters; ValueError('unsupported expression') for anything else, including a syntax error, names, calls, ** and strings. A division by zero raises the ordinary ZeroDivisionError. Return the number."""
      import ast, operator
      if len(expr) > 100:
          raise ValueError("too long")
      ops = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul, ast.Div: operator.truediv, ast.FloorDiv: operator.floordiv, ast.Mod: operator.mod}

      def ev(node):
          if isinstance(node, ast.Constant) and type(node.value) in (int, float):
              return node.value
          if isinstance(node, ast.BinOp) and type(node.op) in ops:
              return ops[type(node.op)](ev(node.left), ev(node.right))
          if isinstance(node, ast.UnaryOp) and isinstance(node.op, (ast.USub, ast.UAdd)):
              value = ev(node.operand)
              return -value if isinstance(node.op, ast.USub) else value
          raise ValueError("unsupported expression")
      try:
          tree = ast.parse(expr.strip(), mode="eval")
      except SyntaxError:
          raise ValueError("unsupported expression")
      return ev(tree.body)


  def check_policy(policy, history, name, args):
      """GUARDRAILS decide what an agent may do. `policy` is a dict with the optional keys 'allowed' (the list of permitted tool names; missing means all), 'max_calls' (the most tool calls that may be executed in total; missing means no limit) and 'blocked' (a list of forbidden pieces of text; missing means none). `history` is the list of calls executed so far. Return the first reason in this order, or None if the call is allowed: 'tool not allowed' if the name is not in 'allowed'; 'too many calls' if len(history) >= max_calls; 'blocked argument' if any blocked text occurs in str(value) of any argument value (ignore upper and lower case)."""
      if "allowed" in policy and name not in policy["allowed"]:
          return "tool not allowed"
      if "max_calls" in policy and len(history) >= policy["max_calls"]:
          return "too many calls"
      for value in args.values():
          for bad in policy.get("blocked", []):
              if bad.lower() in str(value).lower():
                  return "blocked argument"
      return None


  def agent_loop(model, tools, task, policy, max_steps):
      """The agent loop. Use the given parse_tool_call, check_policy and run_tool. ValueError('max_steps must be positive') if max_steps < 1. Repeat for step 1, 2, ... max_steps: the PROMPT is the task followed by one line '\nObservation: ' + text for every observation so far; the reply is model(prompt). If the stripped reply starts with 'FINAL:' stop and return the dict {'answer': the rest of the reply, stripped, 'steps': the step number, 'log': the log}. Otherwise try parse_tool_call: if that fails the observation is 'error: not a tool call' (log entry (None, None, observation)). If check_policy gives a reason the observation is 'refused: ' + reason and the call is NOT run; else the observation is run_tool(...) and the call is added to the history. Every tool attempt adds the log entry (name, args, observation). After max_steps without an answer return {'answer': None, 'steps': max_steps, 'log': log}."""
      if max_steps < 1:
          raise ValueError("max_steps must be positive")
      observations, log, history = [], [], []
      for step in range(1, max_steps + 1):
          prompt = task + "".join("\nObservation: " + o for o in observations)
          reply = model(prompt)
          if reply.strip().startswith("FINAL:"):
              return {"answer": reply.strip()[len("FINAL:"):].strip(), "steps": step, "log": log}
          try:
              name, args = parse_tool_call(reply)
          except ValueError:
              observation = "error: not a tool call"
              log.append((None, None, observation))
              observations.append(observation)
              continue
          reason = check_policy(policy, history, name, args)
          if reason:
              observation = "refused: " + reason
          else:
              observation = run_tool(tools, name, args)
              history.append((name, args))
          log.append((name, args, observation))
          observations.append(observation)
      return {"answer": None, "steps": max_steps, "log": log}


  def redact_secrets(text):
      """Before you paste code or logs into an AI service, remove what must not leave your computer. Return (clean text, counts). Replace, in this order: every AWS key (AKIA followed by 16 upper-case letters or digits) with [AWS_KEY]; every e-mail address (letters, digits and . _ + - before an @, then a domain with at least one dot) with [EMAIL]; and the VALUE of a hard-coded secret with [SECRET]: one of the words password, passwd, secret, token, api_key, api-key or apikey (any case), then optional blanks, : or =, optional blanks, and a quoted value (single or double quotes) of at least 6 characters without blanks or quotes. Keep the word, the separator and the quote marks, e.g. password = "[SECRET]". `counts` is a dict {'aws key': n, 'email': n, 'secret': n} containing only the kinds that were replaced at least once."""
      import re
      counts = {}

      def sub(kind, pattern, repl, text):
          new, n = re.subn(pattern, repl, text)
          if n:
              counts[kind] = n
          return new
      text = sub("aws key", r"AKIA[0-9A-Z]{16}", "[AWS_KEY]", text)
      text = sub("email", r"[A-Za-z0-9._+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", "[EMAIL]", text)
      text = sub("secret", r"(?i)((?:password|passwd|secret|token|api[_-]?key)\s*[:=]\s*)(['\"])[^\s'\"]{6,}\2", r"\1\2[SECRET]\2", text)
      return text, counts


  def detect_injection(text):
      """PROMPT INJECTION: text that the model reads (a web page, a file, an e-mail) contains instructions meant for the model, such as 'ignore your instructions'. A simple detector uses rules. Ignoring upper and lower case, return the list of rule names, in this order, whose pattern is found (use re.search): 'ignore instructions': ignore, then optionally all or any, then previous, prior or above, then instructions or rules (single blanks between); 'reveal prompt': reveal, show, print or repeat, then your or the, then optionally 'system ', then prompt or instructions; 'role override': you are now, act as, or pretend to be; 'exfiltrate': send, post, upload or email, then up to 40 characters of anything on the same line, then password, secret, token or key; 'hidden command': rm -rf, or curl then text without | and then a | (a pipe) and then sh or bash. (A rule list can never catch everything; it only shows the idea.)"""
      import re
      rules = [
          ("ignore instructions", r"ignore (all |any )?(previous|prior|above) (instructions|rules)"),
          ("reveal prompt", r"(reveal|show|print|repeat) (your|the) (system )?(prompt|instructions)"),
          ("role override", r"you are now|act as|pretend to be"),
          ("exfiltrate", r"(send|post|upload|email) .{0,40}(password|secret|token|key)"),
          ("hidden command", r"rm -rf|curl [^|\n]*\| ?(ba)?sh"),
      ]
      return [name for name, pattern in rules if re.search(pattern, text, re.IGNORECASE)]


  def wrap_untrusted(text, nonce):
      """Mark where untrusted DATA starts and ends, so that the model (and your own code) can tell data from instructions. The nonce is a random word chosen by you, unknown to the attacker. ValueError('bad nonce') unless the nonce is non-empty and only letters and digits; ValueError('nonce in text') if the nonce occurs in the text (the attacker could otherwise fake the end marker). Return '<<<DATA ' + nonce + '>>>' + newline + text + newline + '<<<END ' + nonce + '>>>'."""
      if not nonce or not nonce.isalnum() or not nonce.isascii():
          raise ValueError("bad nonce")
      if nonce in text:
          raise ValueError("nonce in text")
      return "<<<DATA " + nonce + ">>>\n" + text + "\n<<<END " + nonce + ">>>"


  def prepare_for_ai(task, files, budget, nonce):
      """Get a project ready to send to an AI service, safely. The functions estimate_tokens, redact_secrets, detect_injection and wrap_untrusted are given. Go through the files {name: text} in sorted name order. For each: clean, counts = redact_secrets(text); its cost is estimate_tokens(clean); include it only if the cost fits into the budget still left (otherwise it is skipped, and the next file may still fit). Included files give a block 'File NAME:' + newline + wrap_untrusted(clean, nonce), a warning 'NAME: RULE' for every rule that detect_injection finds in the ORIGINAL text, and their counts are added up. Return a dict: 'prompt' (the task, then every block, all joined with a blank line; just the task if no file is included), 'included' and 'skipped' (name lists in the order they were considered), 'redactions' (the total number of replacements of included files) and 'warnings' (the list of warnings in order)."""
      included, skipped, blocks, warnings, redactions = [], [], [], [], 0
      left = budget
      for name in sorted(files):
          clean, counts = redact_secrets(files[name])
          cost = estimate_tokens(clean)
          if cost > left:
              skipped.append(name)
              continue
          left -= cost
          included.append(name)
          redactions += sum(counts.values())
          warnings.extend(name + ": " + rule for rule in detect_injection(files[name]))
          blocks.append("File " + name + ":\n" + wrap_untrusted(clean, nonce))
      return {"prompt": "\n\n".join([task] + blocks), "included": included, "skipped": skipped, "redactions": redactions, "warnings": warnings}


  def ask_safely(model, task, files, budget, nonce):
      """Send ONE safe request. First prepare_for_ai(task, files, budget, nonce). If it has any warnings (possible prompt injection) do NOT call the model: return the dict {'prompt': the prepared prompt, 'reply': None, 'code': None, 'warnings': the warnings, 'status': 'blocked'}. Otherwise call model(prompt) once and return {'prompt': ..., 'reply': the reply, 'code': parse_code_block(reply), 'warnings': [], 'status': 'ok' if a code block was found else 'no code'}."""
      prepared = prepare_for_ai(task, files, budget, nonce)
      if prepared["warnings"]:
          return {"prompt": prepared["prompt"], "reply": None, "code": None, "warnings": prepared["warnings"], "status": "blocked"}
      reply = model(prepared["prompt"])
      code = parse_code_block(reply)
      return {"prompt": prepared["prompt"], "reply": reply, "code": code, "warnings": [], "status": "ok" if code is not None else "no code"}


  def review_and_verify(code, allowed, tests):
      """Judge AI code, safely. review = review_report(code, allowed). NEVER RUN CODE THAT FAILED THE REVIEW BADLY: if any review line contains 'risky call' or 'is not allowed', or starts with 'syntax error', the tests are NOT run: passed is False and the test message is 'tests not run: review failed'. Otherwise run check_with_tests(code, tests). Return {'review': the review lines, 'tests': the test message, 'passed': True/False, 'verdict': 'accept' only if passed and the review is empty, else 'reject'}."""
      review = review_report(code, allowed)
      if any("risky call" in line or "is not allowed" in line or line.startswith("syntax error") for line in review):
          passed, message = False, "tests not run: review failed"
      else:
          passed, message = check_with_tests(code, tests)
      return {"review": review, "tests": message, "passed": passed, "verdict": "accept" if passed and not review else "reject"}


  def pair_session(model, task, files, allowed, tests, budget, nonce, max_rounds):
      """The complete pair-programming session. First prepare_for_ai(task, files, budget, nonce). With warnings, stop at once: return {'solved': False, 'rounds': 0, 'code': None, 'warnings': the warnings, 'redactions': the count}. Otherwise run fix_loop(model, the prepared prompt, check, max_rounds) where check(code) uses review_and_verify: it is ok when the verdict is 'accept', and its message is the review lines followed by the test message, all joined with '; '. Return {'solved': ..., 'rounds': ..., 'code': ..., 'warnings': [], 'redactions': the count of the prepared request}."""
      prepared = prepare_for_ai(task, files, budget, nonce)
      if prepared["warnings"]:
          return {"solved": False, "rounds": 0, "code": None, "warnings": prepared["warnings"], "redactions": prepared["redactions"]}

      def check(code):
          r = review_and_verify(code, allowed, tests)
          return r["verdict"] == "accept", "; ".join(r["review"] + [r["tests"]])
      result = fix_loop(model, prepared["prompt"], check, max_rounds)
      return {"solved": result["solved"], "rounds": result["rounds"], "code": result["code"], "warnings": [], "redactions": prepared["redactions"]}


  def agent_assist(model, files, question, max_steps):
      """A question-answering agent for a project. Give agent_loop two tools: 'read_file' (argument path; returns files[path], so a missing path becomes an error observation) and 'calc' (argument expr; safe_calc). The policy is {'allowed': ['read_file', 'calc'], 'max_calls': 6, 'blocked': ['.env', 'password', '..']}. Return the result of agent_loop(model, tools, question, policy, max_steps)."""
      def read_file(path):
          return files[path]
      tools = {"read_file": read_file, "calc": safe_calc}
      policy = {"allowed": ["read_file", "calc"], "max_calls": 6, "blocked": [".env", "password", ".."]}
      return agent_loop(model, tools, question, policy, max_steps)


  def summarize_session(result):
      """Report a pair_session result as a list of text lines: first 'solved in N round' (with 'rounds' when N is not 1) if solved, or 'not solved after N round(s)' written as 'not solved after N round' or 'not solved after N rounds' (plural unless N is 1); then 'redactions: R'; then 'warning: W' for every warning; and last, if the result has code, 'code: L lines' where L is the number of lines of the code ('code: 1 line' for one line)."""
      n = result["rounds"]
      unit = "round" if n == 1 else "rounds"
      lines = [("solved in " if result["solved"] else "not solved after ") + str(n) + " " + unit]
      lines.append("redactions: " + str(result["redactions"]))
      lines.extend("warning: " + w for w in result["warnings"])
      if result["code"]:
          count = len(result["code"].split("\n"))
          lines.append("code: " + str(count) + (" line" if count == 1 else " lines"))
      return lines
