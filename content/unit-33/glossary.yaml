# Terms introduced in Unit 33 (Operating Systems in Practice). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Process table
  definition: The list of all processes that the system keeps, each with an id, a parent and a state.
  lesson: u33-proc
- term: PID
  definition: The process id, the number that identifies a running process.
  lesson: u33-proc
- term: PPID
  definition: The process id of the parent that started a process.
  lesson: u33-proc
- term: Uninterruptible sleep
  definition: A state (D) in which a process waits for the disk or network and cannot be interrupted.
  lesson: u33-proc
- term: Load average
  definition: The average number of processes that wanted to run over the last 1, 5 and 15 minutes.
  lesson: u33-proc
- term: ps
  definition: The command that lists the processes of a computer.
  lesson: u33-proc
- term: top
  definition: A command that shows the processes and the use of CPU and memory live.
  lesson: u33-proc
- term: proc file system
  definition: A virtual folder, /proc, in which Linux shows information about the system as files.
  lesson: u33-proc
- term: Tick
  definition: A small unit of CPU time that the kernel counts.
  lesson: u33-proc
- term: Resident set size
  definition: The part of a process memory that is really in RAM at the moment.
  lesson: u33-memory
- term: Swap
  definition: Disk space used as an overflow for memory, which is much slower than RAM.
  lesson: u33-memory
- term: OOM killer
  definition: The part of the kernel that kills a process when memory has run out.
  lesson: u33-memory
- term: Memory map
  definition: The list of regions of memory that a process has, with their addresses and permissions.
  lesson: u33-memory
- term: Available memory
  definition: The memory that programs could still get, including what the cache would give back.
  lesson: u33-memory
- term: oom_score_adj
  definition: A setting that makes a process more or less likely to be chosen by the OOM killer.
  lesson: u33-memory
- term: Log
  definition: A file or record in which programs write what they did.
  lesson: u33-logs
- term: Syslog
  definition: The classic standard for system log messages with a time, host, program and message.
  lesson: u33-logs
- term: Journal
  definition: The binary log of systemd, which you read with journalctl.
  lesson: u33-logs
- term: Log rotation
  definition: Starting new log files regularly and removing old ones so that logs do not fill the disk.
  lesson: u33-logs
- term: Centralized logging
  definition: Sending the logs of many machines to one place where they are kept and searched.
  lesson: u33-logs
- term: Severity
  definition: The importance of a log message, from debug to emergency.
  lesson: u33-logs
- term: Service
  definition: A program that runs in the background and waits for work.
  lesson: u33-logs
- term: systemd
  definition: The system that starts and supervises services on most Linux machines.
  lesson: u33-logs
- term: Unit file
  definition: A small text file that tells systemd how to run a service and what it depends on.
  lesson: u33-logs
- term: fail2ban
  definition: A tool that blocks an address after too many failed logins.
  lesson: u33-logs
- term: Mount
  definition: Attaching a disk or file system to a folder of the file tree.
  lesson: u33-disk
- term: Mount point
  definition: The folder at which a disk is attached.
  lesson: u33-disk
- term: fstab
  definition: The file /etc/fstab, which lists the disks to mount at boot.
  lesson: u33-disk
- term: UUID
  definition: A long unique number that names a disk and never changes.
  lesson: u33-disk
- term: Quota
  definition: A limit on the disk space that a user or group may use.
  lesson: u33-disk
- term: Soft limit
  definition: A quota limit above which you get a warning and a grace period.
  lesson: u33-disk
- term: Hard limit
  definition: A quota limit that cannot be exceeded.
  lesson: u33-disk
- term: df
  definition: The command that shows how full the disks are.
  lesson: u33-disk
- term: du
  definition: The command that adds up the sizes of the files in folders.
  lesson: u33-disk
- term: 3-2-1 rule
  definition: Keep three copies of data, on two kinds of storage, with one copy somewhere else.
  lesson: u33-disk
- term: Journaling file system
  definition: A file system that writes down what it is about to do so that it can recover after a crash.
  lesson: u33-disk
- term: Container
  definition: A process that Linux isolates and limits so that it looks like a small separate computer.
  lesson: u33-containers
- term: Cgroup
  definition: A Linux feature that limits how much CPU, memory and other resources a group of processes can use.
  lesson: u33-containers
- term: Throttling
  definition: Pausing a process for part of the time to keep it under its CPU limit.
  lesson: u33-containers
- term: Image
  definition: The read-only package from which containers are started.
  lesson: u33-containers
- term: Layer
  definition: One step of an image, holding the files that it changed.
  lesson: u33-containers
- term: Dockerfile
  definition: The recipe from which a container image is built.
  lesson: u33-containers
- term: Overlay file system
  definition: A file system that shows several layers merged into one view.
  lesson: u33-containers
- term: Build cache
  definition: The stored layers that are reused when nothing has changed.
  lesson: u33-containers
- term: Volume
  definition: Storage that lives outside a container and survives it.
  lesson: u33-containers
- term: Registry
  definition: A server that stores and hands out container images.
  lesson: u33-containers
- term: Kubernetes
  definition: A system that decides where many containers run and restarts them when they fail.
  lesson: u33-containers
- term: Tail latency
  definition: The slowest few percent of the requests.
  lesson: u33-perf
- term: Little's law
  definition: The average number of items in a system equals the arrival rate times the time each stays.
  lesson: u33-perf
- term: USE method
  definition: A checklist that looks at utilization, saturation and errors of every resource.
  lesson: u33-perf
- term: Profiler
  definition: A tool that samples a running program to see where its time goes.
  lesson: u33-perf
- term: Flame graph
  definition: A picture of profiler samples in which the width of a box is the share of time.
  lesson: u33-perf
- term: Self time
  definition: The time spent in a function itself, without the functions it calls.
  lesson: u33-perf
- term: Premature optimization
  definition: Making code faster before you know that it is the slow part.
  lesson: u33-perf
