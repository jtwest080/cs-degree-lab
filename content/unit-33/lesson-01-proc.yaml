- type: code
  question: Write `count_states(procs)` returning a dict that counts the processes by state letter, given the list of dicts of `parse_ps` (each has a 'state' key). An empty list gives an empty dict.
  starter: |
    def count_states(procs):
        pass
  tests:
  - name: counting
    code: |
      procs = [{"state": "S"}, {"state": "R"}, {"state": "S"}, {"state": "Z"}, {"state": "S"}]
      assert count_states(procs) == {"S": 3, "R": 1, "Z": 1} and count_states([]) == {}
  solution: |
    def count_states(procs):
        counts = {}
        for p in procs:
            counts[p["state"]] = counts.get(p["state"], 0) + 1
        return counts
