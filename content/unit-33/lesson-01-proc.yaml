        lines = text.split("\n")
        rows, seen_header = [], False
        for n, line in enumerate(lines, 1):
            if not line.strip():
                continue
            if not seen_header:
                if not line.split()[0] == "PID":
                    raise ValueError("no header")
                seen_header = True
                continue
            parts = line.split(None, 5)
            try:
                if len(parts) < 6:
                    raise ValueError
                rows.append({"pid": int(parts[0]), "ppid": int(parts[1]), "state": parts[2][0], "cpu": float(parts[3]), "mem": float(parts[4]), "command": parts[5].strip()})
            except ValueError:
                raise ValueError("bad line " + str(n))
        if not seen_header:
            raise ValueError("no header")
        return rows
  explanation: Real programs read this text with the `ps` command, or directly from the files in /proc, a pretend folder through which Linux shows what the kernel knows.
- id: tree
  title: The process family tree
  difficulty: 4
  prompt: 'Every process is started by a **parent** (its PPID), so processes form a tree, like the output of `pstree`. Write `process_tree(procs)`. Draw the family tree of processes (every process is started by a parent, PPID). `procs` is a list as returned by parse_ps. A ROOT is a process whose ppid is not the pid of any process in the list. Return the list of lines: for each process, in depth-first order, two blanks of indentation per level, then the pid, a blank and the command. Roots and the children of each process are listed in order of pid.'
