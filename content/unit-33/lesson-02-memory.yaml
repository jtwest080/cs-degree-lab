- type: code
  question: 'Write `kb_to_human(kb)` that turns a number of kilobytes into text: below 1024 give e.g. `''512 kB''`; below 1024*1024 the value in MB with one decimal, e.g. `''1.5 MB''`; otherwise the value in GB with one decimal, e.g. `''16.0 GB''` (divide by 1024 each time).'
  starter: |
    def kb_to_human(kb):
        pass
  tests:
  - name: units
    code: |
      assert kb_to_human(512) == "512 kB" and kb_to_human(1536) == "1.5 MB" and kb_to_human(16 * 1024 * 1024) == "16.0 GB" and kb_to_human(0) == "0 kB" and kb_to_human(1023) == "1023 kB" and kb_to_human(1024) == "1.0 MB"
  solution: |
    def kb_to_human(kb):
        if kb < 1024:
            return str(kb) + " kB"
        if kb < 1024 * 1024:
            return format(kb / 1024, ".1f") + " MB"
        return format(kb / (1024 * 1024), ".1f") + " GB"
