    def parse_unit(text):
        """Services on a modern Linux system are described by 'unit files' in INI format, for example:\n[Unit]\nDescription=Web server\nAfter=network.target db.service\n[Service]\nExecStart=/usr/bin/web --port 80\n\nParse the text. Ignore blank lines and lines that start (after blanks) with # or ;. A line '[Name]' starts a section. A line 'key=value' (split at the FIRST '=', both sides stripped) belongs to the current section. Return a dict {section: {key: [values]}}: every key has a LIST with one entry per line in which it occurs, and for the dependency keys After, Before, Requires, Wants the value is split at blanks into separate names, all added to the list. ValueError('line N outside a section') for a key before any section, ValueError('bad line N') for a line that is not blank, a comment, a section or key=value (N counts all lines from 1)."""
        result, section = {}, None
        split_keys = {"After", "Before", "Requires", "Wants"}
        for n, raw in enumerate(text.split("\n"), 1):
            line = raw.strip()
            if not line or line[0] in "#;":
                continue
            if line.startswith("[") and line.endswith("]") and len(line) > 2:
                section = line[1:-1]
                result.setdefault(section, {})
                continue
            key, sep, value = line.partition("=")
            if not sep or not key.strip():
                raise ValueError("bad line " + str(n))
            if section is None:
                raise ValueError("line " + str(n) + " outside a section")
            key, value = key.strip(), value.strip()
            values = result[section].setdefault(key, [])
            values.extend(value.split() if key in split_keys else [value])
        return result
  explanation: Real unit files have many more keys, such as Restart=always (restart after a crash) and User= (run as a less powerful account).
