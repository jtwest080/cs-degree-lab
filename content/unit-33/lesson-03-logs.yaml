id: u33-logs
title: Logs and Services
minutes: 110
objective: Learn how a Linux system tells you what happened and how it starts its services. You will parse the system log, filter it, find a password-guessing attack, read systemd unit files and compute a valid boot order.
outcomes:
- Read the structure of a syslog line
- Filter and search logs
- Recognize a brute-force attack in an SSH log
- Read a systemd unit file
- Order services by their dependencies
sections:
- heading: 'Logs: the memory of a system'
  body: |-
    When something goes wrong at 3 a.m., the **log** is all you have. Programs write short lines about what they do, and the system collects them in files (`/var/log/syslog`, `/var/log/auth.log`) or in the binary **journal** that you read with `journalctl`. A classic line:

    `Nov 16 10:00:01 myhost sshd[812]: Failed password for ada from 203.0.113.5 port 4242 ssh2`

    It says *when*, *on which machine*, *which program* (and its process id), and a *message* written by the program. Good habits: **log what matters** (logins, errors, important decisions), **never log secrets**, keep clocks accurate (a **time server**, NTP, so that logs of different machines can be compared), and **rotate** logs (start a new file daily or when big, keep a few old ones, compress and delete the rest) so that they do not fill the disk.

    **Severity** helps filtering: debug, info, notice, warning, error, critical, alert, emergency. **Centralized logging** sends the logs of all machines to one place where they are searched and where an attacker who breaks into one machine cannot erase the evidence.
- heading: Services and systemd
  body: |-
    A **service** (also **daemon**) is a program that runs in the background: a web server, a database, the SSH server. On most Linux systems **systemd** (process 1) starts and supervises them. Each service is described by a **unit file** (`/etc/systemd/system/web.service`) in a simple INI format with sections: `[Unit]` (description and *ordering and dependencies*: `After=`, `Before=`, `Requires=`, `Wants=`), `[Service]` (what to run: `ExecStart=`, which `User=` to use, `Restart=` rules) and `[Install]` (when to enable it, e.g. `WantedBy=multi-user.target`).

    Useful commands: `systemctl status web` (state and the last log lines), `systemctl restart web`, `systemctl enable web` (start at boot), `journalctl -u web` (the log of one service), `systemd-analyze blame` (what slowed the boot). Because the start order is a **dependency graph**, the system can start independent services *in parallel* and detect configuration cycles.

    **Security note.** Run each service as its own **unprivileged user**, give it only the files it needs, and keep the log of failed logins: public machines are guessed at constantly, which is why key-based SSH logins and tools such as **fail2ban** matter.
examples:
- title: A log with an attack
  intro: Parse a small system log, find the memory message and the attacker.
  code: |
    def parse_syslog(lines, year):
        """Linux programs write messages to a log, and every line has the same shape: 'Nov 16 10:00:01 myhost sshd[812]: Failed password for ada'. That is month, day, time, host, the program with an optional process id in square brackets, a colon and the message. Parse a list of such lines. Return the list of dicts {'time': 'YYYY-MM-DD HH:MM:SS' (the year is given, the month name is one of the English three-letter names, day and month are padded to two digits), 'host', 'program', 'pid' (an int, or None if there are no brackets) and 'message' (the text after the colon and one blank, otherwise unchanged)}. Lines that do not have this shape (for example continuation lines) are skipped."""
        import re
        months = {m: i for i, m in enumerate(["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], 1)}
        pattern = re.compile(r"([A-Z][a-z]{2}) +(\d{1,2}) (\d\d:\d\d:\d\d) (\S+) ([^\s\[:]+)(?:\[(\d+)\])?: ?(.*)")
        entries = []
        for line in lines:
            m = pattern.fullmatch(line.rstrip("\n"))
            if not m or m.group(1) not in months:
                continue
            mon, day, clock, host, prog, pid, message = m.groups()
            entries.append({"time": "%04d-%02d-%02d %s" % (year, months[mon], int(day), clock), "host": host, "program": prog, "pid": int(pid) if pid else None, "message": message})
        return entries


    def filter_logs(entries, program=None, contains=None, since=None, until=None):
        """Find the interesting lines in a big log. Return the entries (in their order) that satisfy EVERY condition that is given (not None): 'program' equals the entry's program; 'contains' occurs in the message, ignoring upper and lower case; 'since' <= the entry's time; the entry's time <= 'until' (times are texts such as '2026-11-16 10:00:00'; text order is time order for this format)."""
        out = []
        for e in entries:
            if program is not None and e["program"] != program:
                continue
            if contains is not None and contains.lower() not in e["message"].lower():
                continue
            if since is not None and e["time"] < since:
                continue
            if until is not None and e["time"] > until:
                continue
            out.append(e)
        return out


    def failed_logins(entries, threshold):
        """The log of the SSH server (program sshd) shows attacks: 'Failed password for ada from 203.0.113.5 port 4242 ssh2' or 'Failed password for invalid user admin from 203.0.113.5 port 4243 ssh2' (the user may be invalid). A line 'Accepted password for ada from ... port ... ssh2' (or 'Accepted publickey for ...') is a successful login. Look only at entries of the program sshd. Return the sorted list of dicts {'ip', 'failures' (how many failed lines), 'users' (the sorted list of different user names tried), 'breached' (True if a successful login from the same address happened AFTER (later in the list than) its first failure)} for every address with at least `threshold` failures. Sort by failures, highest first, then by address as text."""
        import re
        fail = re.compile(r"Failed \w+ for (?:invalid user )?(\S+) from (\S+) port \d+")
        ok = re.compile(r"Accepted \w+ for (\S+) from (\S+) port \d+")
        stats = {}
        for e in entries:
            if e["program"] != "sshd":
                continue
            m = fail.search(e["message"])
            if m:
                s = stats.setdefault(m.group(2), {"failures": 0, "users": set(), "breached": False})
                s["failures"] += 1
                s["users"].add(m.group(1))
                continue
            m = ok.search(e["message"])
            if m and m.group(2) in stats:
                stats[m.group(2)]["breached"] = True
        rows = [{"ip": ip, "failures": s["failures"], "users": sorted(s["users"]), "breached": s["breached"]} for ip, s in stats.items() if s["failures"] >= threshold]
        rows.sort(key=lambda r: (-r["failures"], r["ip"]))
        return rows

    LOG = """Nov 16 10:00:01 myhost sshd[812]: Failed password for invalid user admin from 203.0.113.5 port 4242 ssh2
    Nov 16 10:00:05 myhost sshd[812]: Failed password for ada from 203.0.113.5 port 4243 ssh2
    Nov 16 10:00:09 myhost kernel: Out of memory: Killed process 77 (python3)
    Nov 16 10:00:12 myhost sshd[813]: Failed password for root from 203.0.113.5 port 4244 ssh2
    Nov 16 10:01:00 myhost sshd[814]: Accepted password for ada from 203.0.113.5 port 5000 ssh2
    """
    entries = parse_syslog(LOG.split("\n"), 2026)
    print(len(entries), "entries")
    for e in filter_logs(entries, contains="memory"):
        print(e["time"], e["program"], e["message"])
    print(failed_logins(entries, 3))
  output: |
    5 entries
    2026-11-16 10:00:09 kernel Out of memory: Killed process 77 (python3)
    [{'ip': '203.0.113.5', 'failures': 3, 'users': ['ada', 'admin', 'root'], 'breached': True}]
  lines:
  - line: 61
    note: Five lines parsed.
  - line: 62
    note: Only the message about memory is shown.
  - line: 64
    note: 'Three failures, then a successful login from the same address: a breach.'
- title: A unit file and boot order
  intro: Read a service description and compute the start order.
  code: |
    def parse_unit(text):
        """Services on a modern Linux system are described by 'unit files' in INI format, for example:\n[Unit]\nDescription=Web server\nAfter=network.target db.service\n[Service]\nExecStart=/usr/bin/web --port 80\n\nParse the text. Ignore blank lines and lines that start (after blanks) with # or ;. A line '[Name]' starts a section. A line 'key=value' (split at the FIRST '=', both sides stripped) belongs to the current section. Return a dict {section: {key: [values]}}: every key has a LIST with one entry per line in which it occurs, and for the dependency keys After, Before, Requires, Wants the value is split at blanks into separate names, all added to the list. ValueError('line N outside a section') for a key before any section, ValueError('bad line N') for a line that is not blank, a comment, a section or key=value (N counts all lines from 1)."""
        result, section = {}, None
        split_keys = {"After", "Before", "Requires", "Wants"}
        for n, raw in enumerate(text.split("\n"), 1):
            line = raw.strip()
            if not line or line[0] in "#;":
                continue
            if line.startswith("[") and line.endswith("]") and len(line) > 2:
                section = line[1:-1]
                result.setdefault(section, {})
                continue
            key, sep, value = line.partition("=")
            if not sep or not key.strip():
                raise ValueError("bad line " + str(n))
            if section is None:
                raise ValueError("line " + str(n) + " outside a section")
            key, value = key.strip(), value.strip()
            values = result[section].setdefault(key, [])
            values.extend(value.split() if key in split_keys else [value])
        return result


    def boot_order(units):
        """Systemd starts services in an order that respects the ordering rules 'After=' and 'Before=' (in the [Unit] section). `units` is a dict {unit name: parsed unit as returned by parse_unit}. A unit A with After=B must start after B; a unit B with Before=A also means B starts before A. Names that are not in the dict are ignored. Return the list of all unit names in a valid start order; when several units could start next, choose the one that comes first alphabetically. If the rules contain a cycle raise ValueError('ordering cycle: ' + the sorted names of the units that could not be ordered, joined with ', ')."""
        names = set(units)
        after = {n: set() for n in names}
        for n, u in units.items():
            sect = u.get("Unit", {})
            for dep in sect.get("After", []):
                if dep in names and dep != n:
                    after[n].add(dep)
            for later in sect.get("Before", []):
                if later in names and later != n:
                    after[later].add(n)
        order, done = [], set()
        while len(done) < len(names):
            ready = sorted(n for n in names - done if after[n] <= done)
            if not ready:
                raise ValueError("ordering cycle: " + ", ".join(sorted(names - done)))
            order.append(ready[0])
            done.add(ready[0])
        return order

    web = parse_unit("[Unit]\nDescription=Web server\nAfter=network.target db.service\n\n[Service]\nExecStart=/usr/bin/web --port=80\n")
    print(web["Unit"]["After"])
    print(web["Service"]["ExecStart"])
    units = {"web": web, "db": parse_unit("[Unit]\nAfter=network.target\n"), "network.target": {}}
    print(boot_order(units))
  output: |
    ['network.target', 'db.service']
    ['/usr/bin/web --port=80']
    ['network.target', 'db', 'web']
  lines:
  - line: 46
    note: The dependency names are split into a list.
  - line: 47
    note: One value, kept as written.
  - line: 49
    note: The network first, then the database, then the web server.
