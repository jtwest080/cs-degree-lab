        return result




    def boot_order(units):
        """Systemd starts services in an order that respects the ordering rules 'After=' and 'Before=' (in the [Unit] section). `units` is a dict {unit name: parsed unit as returned by parse_unit}. A unit A with After=B must start after B; a unit B with Before=A also means B starts before A. Names that are not in the dict are ignored. Return the list of all unit names in a valid start order; when several units could start next, choose the one that comes first alphabetically. If the rules contain a cycle raise ValueError('ordering cycle: ' + the sorted names of the units that could not be ordered, joined with ', ')."""
        pass
  tests:
  - name: ordering
    code: |
      units = {"web": parse_unit("[Unit]\nAfter=db net\n"), "db": parse_unit("[Unit]\nAfter=net\n"), "net": {}, "log": parse_unit("[Unit]\nBefore=net\n"), "cron": parse_unit("[Unit]\nAfter=ghost.service\n")}
      assert boot_order(units) == ["cron", "log", "net", "db", "web"]
      assert boot_order({}) == [] and boot_order({"a": {}}) == ["a"] and boot_order({"b": {}, "a": {}, "c": {}}) == ["a", "b", "c"]
      assert boot_order({"a": parse_unit("[Unit]\nAfter=a\n")}) == ["a"]
  - name: cycles
    code: |
      units = {"a": parse_unit("[Unit]\nAfter=b\n"), "b": parse_unit("[Unit]\nAfter=c\n"), "c": parse_unit("[Unit]\nAfter=a\n"), "d": {}}
      try:
          boot_order(units)
          raise AssertionError("accepted")
      except ValueError as e:
          assert str(e) == "ordering cycle: a, b, c"
      u2 = {"x": parse_unit("[Unit]\nBefore=y\n"), "y": parse_unit("[Unit]\nBefore=x\n")}
      try:
          boot_order(u2)
          raise AssertionError("accepted")
