    counts = {}
    for w in line.split():
        counts[w] = counts.get(w, 0) + 1
    print(counts)
exercises:
- id: syslog
  title: Parsing the system log
  difficulty: 4
  prompt: 'Almost everything a Linux system does leaves a line in a **log** (`/var/log/syslog`, or `journalctl`). Write `parse_syslog(lines, year)`. Linux programs write messages to a log, and every line has the same shape: ''Nov 16 10:00:01 myhost sshd[812]: Failed password for ada''. That is month, day, time, host, the program with an optional process id in square brackets, a colon and the message. Parse a list of such lines. Return the list of dicts {''time'': ''YYYY-MM-DD HH:MM:SS'' (the year is given, the month name is one of the English three-letter names, day and month are padded to two digits), ''host'', ''program'', ''pid'' (an int, or None if there are no brackets) and ''message'' (the text after the colon and one blank, otherwise unchanged)}. Lines that do not have this shape (for example continuation lines) are skipped.'
  starter: |-
    def parse_syslog(lines, year):
        """Linux programs write messages to a log, and every line has the same shape: 'Nov 16 10:00:01 myhost sshd[812]: Failed password for ada'. That is month, day, time, host, the program with an optional process id in square brackets, a colon and the message. Parse a list of such lines. Return the list of dicts {'time': 'YYYY-MM-DD HH:MM:SS' (the year is given, the month name is one of the English three-letter names, day and month are padded to two digits), 'host', 'program', 'pid' (an int, or None if there are no brackets) and 'message' (the text after the colon and one blank, otherwise unchanged)}. Lines that do not have this shape (for example continuation lines) are skipped."""
        pass
  tests:
  - name: parsing lines
    code: |
      lines = ["Nov 16 10:00:01 myhost sshd[812]: Failed password for ada", "Nov  6 09:15:00 myhost kernel: Out of memory: Killed process 77", "garbage line", "Foo 16 10:00:00 myhost cron: not a month", "Dec 31 23:59:59 box.local CRON[5]: (root) CMD (run it)\n", "Jan 2 00:00:00 h p[1]:"]
      r = parse_syslog(lines, 2026)
      assert r == [{"time": "2026-11-16 10:00:01", "host": "myhost", "program": "sshd", "pid": 812, "message": "Failed password for ada"}, {"time": "2026-11-06 09:15:00", "host": "myhost", "program": "kernel", "pid": None, "message": "Out of memory: Killed process 77"}, {"time": "2026-12-31 23:59:59", "host": "box.local", "program": "CRON", "pid": 5, "message": "(root) CMD (run it)"}, {"time": "2026-01-02 00:00:00", "host": "h", "program": "p", "pid": 1, "message": ""}]
  - name: odd shapes
    code: |
      assert parse_syslog([], 2026) == [] and parse_syslog(["", " ", "Nov 16 10:00:01"], 2026) == []
      r = parse_syslog(["Mar  3 01:02:03 h systemd-logind[9]: Session 4: opened: ok"], 1999)
      assert r == [{"time": "1999-03-03 01:02:03", "host": "h", "program": "systemd-logind", "pid": 9, "message": "Session 4: opened: ok"}]
      assert parse_syslog(["Nov 16 10:00:01 h kernel[x]: bad pid"], 2026) == []
  hints:
  - A regular expression with groups reads all parts at once.
  - The program name ends at '[' or ':'.
  solution: |
    def parse_syslog(lines, year):
        """Linux programs write messages to a log, and every line has the same shape: 'Nov 16 10:00:01 myhost sshd[812]: Failed password for ada'. That is month, day, time, host, the program with an optional process id in square brackets, a colon and the message. Parse a list of such lines. Return the list of dicts {'time': 'YYYY-MM-DD HH:MM:SS' (the year is given, the month name is one of the English three-letter names, day and month are padded to two digits), 'host', 'program', 'pid' (an int, or None if there are no brackets) and 'message' (the text after the colon and one blank, otherwise unchanged)}. Lines that do not have this shape (for example continuation lines) are skipped."""
        import re
        months = {m: i for i, m in enumerate(["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], 1)}
        pattern = re.compile(r"([A-Z][a-z]{2}) +(\d{1,2}) (\d\d:\d\d:\d\d) (\S+) ([^\s\[:]+)(?:\[(\d+)\])?: ?(.*)")
        entries = []
        for line in lines:
            m = pattern.fullmatch(line.rstrip("\n"))
            if not m or m.group(1) not in months:
                continue
            mon, day, clock, host, prog, pid, message = m.groups()
            entries.append({"time": "%04d-%02d-%02d %s" % (year, months[mon], int(day), clock), "host": host, "program": prog, "pid": int(pid) if pid else None, "message": message})
        return entries
  explanation: 'Real logs have many more shapes (and the journal is binary), but the idea is the same: turn lines into records, then ask questions.'
- id: filter
  title: Finding the needle
  difficulty: 3
  prompt: 'A server writes thousands of lines a minute, so you need to **filter**. Write `filter_logs(entries, program=None, contains=None, since=None, until=None)`. Find the interesting lines in a big log. Return the entries (in their order) that satisfy EVERY condition that is given (not None): ''program'' equals the entry''s program; ''contains'' occurs in the message, ignoring upper and lower case; ''since'' <= the entry''s time; the entry''s time <= ''until'' (times are texts such as ''2026-11-16 10:00:00''; text order is time order for this format).'
  starter: |-
    def filter_logs(entries, program=None, contains=None, since=None, until=None):
        """Find the interesting lines in a big log. Return the entries (in their order) that satisfy EVERY condition that is given (not None): 'program' equals the entry's program; 'contains' occurs in the message, ignoring upper and lower case; 'since' <= the entry's time; the entry's time <= 'until' (times are texts such as '2026-11-16 10:00:00'; text order is time order for this format)."""
        pass
  tests:
  - name: filters
    code: |
      def mk(t, prog, msg):
          return {"time": t, "host": "h", "program": prog, "pid": None, "message": msg}
      es = [mk("2026-11-16 10:00:00", "sshd", "Failed password"), mk("2026-11-16 10:05:00", "kernel", "Out of MEMORY"), mk("2026-11-16 11:00:00", "sshd", "Accepted publickey"), mk("2026-11-17 00:00:00", "cron", "ran")]
      assert filter_logs(es) == es and filter_logs(es, program="sshd") == [es[0], es[2]] and filter_logs(es, contains="memory") == [es[1]] and filter_logs(es, contains="ED") == [es[0], es[2]]
      assert filter_logs(es, since="2026-11-16 10:05:00", until="2026-11-16 11:00:00") == [es[1], es[2]] and filter_logs(es, program="sshd", since="2026-11-16 10:30:00") == [es[2]]
  - name: combined and empty
    code: |
      def mk(t, prog, msg):
          return {"time": t, "host": "h", "program": prog, "pid": None, "message": msg}
      es = [mk("2026-11-16 10:00:00", "sshd", "a b"), mk("2026-11-16 10:00:01", "sshd", "A c")]
      assert filter_logs([], program="x") == [] and filter_logs(es, program="sshd", contains="A", until="2026-11-16 10:00:00") == [es[0]] and filter_logs(es, contains="zzz") == [] and filter_logs(es, program="") == [] and filter_logs(es, contains="") == es
  hints:
  - Test the conditions one after the other and skip the entry as soon as one fails.
  - Compare times as text.
  solution: |
    def filter_logs(entries, program=None, contains=None, since=None, until=None):
        """Find the interesting lines in a big log. Return the entries (in their order) that satisfy EVERY condition that is given (not None): 'program' equals the entry's program; 'contains' occurs in the message, ignoring upper and lower case; 'since' <= the entry's time; the entry's time <= 'until' (times are texts such as '2026-11-16 10:00:00'; text order is time order for this format)."""
        out = []
        for e in entries:
            if program is not None and e["program"] != program:
                continue
            if contains is not None and contains.lower() not in e["message"].lower():
                continue
            if since is not None and e["time"] < since:
                continue
            if until is not None and e["time"] > until:
                continue
            out.append(e)
        return out
  explanation: Command-line tools do the same with grep, and journalctl has options such as --since and --unit.
- id: attacks
  title: Who is attacking us?
  difficulty: 5
  prompt: 'Public servers are attacked **all day** by robots that guess passwords. A log can tell you who and how successful they were. Write `failed_logins(entries, threshold)`. The log of the SSH server (program sshd) shows attacks: ''Failed password for ada from 203.0.113.5 port 4242 ssh2'' or ''Failed password for invalid user admin from 203.0.113.5 port 4243 ssh2'' (the user may be invalid). A line ''Accepted password for ada from ... port ... ssh2'' (or ''Accepted publickey for ...'') is a successful login. Look only at entries of the program sshd. Return the sorted list of dicts {''ip'', ''failures'' (how many failed lines), ''users'' (the sorted list of different user names tried), ''breached'' (True if a successful login from the same address happened AFTER (later in the list than) its first failure)} for every address with at least `threshold` failures. Sort by failures, highest first, then by address as text.'
  starter: |-
    def failed_logins(entries, threshold):
        """The log of the SSH server (program sshd) shows attacks: 'Failed password for ada from 203.0.113.5 port 4242 ssh2' or 'Failed password for invalid user admin from 203.0.113.5 port 4243 ssh2' (the user may be invalid). A line 'Accepted password for ada from ... port ... ssh2' (or 'Accepted publickey for ...') is a successful login. Look only at entries of the program sshd. Return the sorted list of dicts {'ip', 'failures' (how many failed lines), 'users' (the sorted list of different user names tried), 'breached' (True if a successful login from the same address happened AFTER (later in the list than) its first failure)} for every address with at least `threshold` failures. Sort by failures, highest first, then by address as text."""
        pass
  tests:
  - name: one attacker
    code: |
      def mk(msg, prog="sshd"):
          return {"time": "t", "host": "h", "program": prog, "pid": None, "message": msg}
      es = [mk("Failed password for invalid user admin from 203.0.113.5 port 4242 ssh2"), mk("Failed password for ada from 203.0.113.5 port 4243 ssh2"), mk("Failed password for root from 198.51.100.7 port 1 ssh2"), mk("Failed password for root from 203.0.113.5 port 4244 ssh2"), mk("Accepted password for ada from 203.0.113.5 port 5000 ssh2"), mk("Accepted publickey for bo from 192.0.2.1 port 22 ssh2")]
      assert failed_logins(es, 2) == [{"ip": "203.0.113.5", "failures": 3, "users": ["ada", "admin", "root"], "breached": True}]
      assert failed_logins(es, 1) == [{"ip": "203.0.113.5", "failures": 3, "users": ["ada", "admin", "root"], "breached": True}, {"ip": "198.51.100.7", "failures": 1, "users": ["root"], "breached": False}]
      assert failed_logins(es, 4) == [] and failed_logins([], 1) == []
  - name: order, programs and timing
    code: |
      def mk(msg, prog="sshd"):
          return {"time": "t", "host": "h", "program": prog, "pid": None, "message": msg}
      es = [mk("Accepted password for ada from 1.1.1.1 port 1 ssh2"), mk("Failed password for ada from 1.1.1.1 port 2 ssh2"), mk("Failed password for ada from 2.2.2.2 port 3 ssh2", "login"), mk("Failed password for x from 2.2.2.2 port 3 ssh2"), mk("Failed password for y from 9.9.9.9 port 3 ssh2"), mk("Failed password for z from 9.9.9.9 port 3 ssh2"), mk("Failed publickey for z from 8.8.8.8 port 3 ssh2"), mk("Failed password for z from 8.8.8.8 port 3 ssh2")]
      r = failed_logins(es, 1)
      assert [(x["ip"], x["failures"], x["breached"]) for x in r] == [("8.8.8.8", 2, False), ("9.9.9.9", 2, False), ("1.1.1.1", 1, False), ("2.2.2.2", 1, False)]
  hints:
  - 'Two regular expressions are enough: one for failures and one for accepted logins.'
  - A login counts as a breach only if the address has failed earlier in the log.
  solution: |
    def failed_logins(entries, threshold):
        """The log of the SSH server (program sshd) shows attacks: 'Failed password for ada from 203.0.113.5 port 4242 ssh2' or 'Failed password for invalid user admin from 203.0.113.5 port 4243 ssh2' (the user may be invalid). A line 'Accepted password for ada from ... port ... ssh2' (or 'Accepted publickey for ...') is a successful login. Look only at entries of the program sshd. Return the sorted list of dicts {'ip', 'failures' (how many failed lines), 'users' (the sorted list of different user names tried), 'breached' (True if a successful login from the same address happened AFTER (later in the list than) its first failure)} for every address with at least `threshold` failures. Sort by failures, highest first, then by address as text."""
        import re
        fail = re.compile(r"Failed \w+ for (?:invalid user )?(\S+) from (\S+) port \d+")
        ok = re.compile(r"Accepted \w+ for (\S+) from (\S+) port \d+")
        stats = {}
        for e in entries:
            if e["program"] != "sshd":
                continue
            m = fail.search(e["message"])
            if m:
                s = stats.setdefault(m.group(2), {"failures": 0, "users": set(), "breached": False})
                s["failures"] += 1
                s["users"].add(m.group(1))
                continue
            m = ok.search(e["message"])
            if m and m.group(2) in stats:
                stats[m.group(2)]["breached"] = True
        rows = [{"ip": ip, "failures": s["failures"], "users": sorted(s["users"]), "breached": s["breached"]} for ip, s in stats.items() if s["failures"] >= threshold]
        rows.sort(key=lambda r: (-r["failures"], r["ip"]))
        return rows
  explanation: 'Defences: key-based logins instead of passwords, no root login over SSH, tools such as fail2ban that block an address after too many failures, and rate limits.'
- id: unitfile
  title: Reading a systemd unit file
  difficulty: 4
  prompt: |-
    Modern Linux starts and watches its services with **systemd**, which reads **unit files** in a simple INI format. Write `parse_unit(text)`. Services on a modern Linux system are described by 'unit files' in INI format, for example:

    ```
    [Unit]
    Description=Web server
    After=network.target db.service

    [Service]
