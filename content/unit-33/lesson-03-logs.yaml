  solution: |
    def parse_unit(text):
        """Services on a modern Linux system are described by 'unit files' in INI format, for example:\n[Unit]\nDescription=Web server\nAfter=network.target db.service\n[Service]\nExecStart=/usr/bin/web --port 80\n\nParse the text. Ignore blank lines and lines that start (after blanks) with # or ;. A line '[Name]' starts a section. A line 'key=value' (split at the FIRST '=', both sides stripped) belongs to the current section. Return a dict {section: {key: [values]}}: every key has a LIST with one entry per line in which it occurs, and for the dependency keys After, Before, Requires, Wants the value is split at blanks into separate names, all added to the list. ValueError('line N outside a section') for a key before any section, ValueError('bad line N') for a line that is not blank, a comment, a section or key=value (N counts all lines from 1)."""
        result, section = {}, None
        split_keys = {"After", "Before", "Requires", "Wants"}
        for n, raw in enumerate(text.split("\n"), 1):
            line = raw.strip()
            if not line or line[0] in "#;":
                continue
            if line.startswith("[") and line.endswith("]") and len(line) > 2:
                section = line[1:-1]
                result.setdefault(section, {})
                continue
            key, sep, value = line.partition("=")
            if not sep or not key.strip():
                raise ValueError("bad line " + str(n))
            if section is None:
                raise ValueError("line " + str(n) + " outside a section")
            key, value = key.strip(), value.strip()
            values = result[section].setdefault(key, [])
            values.extend(value.split() if key in split_keys else [value])
        return result




    def boot_order(units):
        """Systemd starts services in an order that respects the ordering rules 'After=' and 'Before=' (in the [Unit] section). `units` is a dict {unit name: parsed unit as returned by parse_unit}. A unit A with After=B must start after B; a unit B with Before=A also means B starts before A. Names that are not in the dict are ignored. Return the list of all unit names in a valid start order; when several units could start next, choose the one that comes first alphabetically. If the rules contain a cycle raise ValueError('ordering cycle: ' + the sorted names of the units that could not be ordered, joined with ', ')."""
        names = set(units)
        after = {n: set() for n in names}
        for n, u in units.items():
            sect = u.get("Unit", {})
            for dep in sect.get("After", []):
                if dep in names and dep != n:
                    after[n].add(dep)
            for later in sect.get("Before", []):
                if later in names and later != n:
                    after[later].add(n)
        order, done = [], set()
        while len(done) < len(names):
            ready = sorted(n for n in names - done if after[n] <= done)
            if not ready:
                raise ValueError("ordering cycle: " + ", ".join(sorted(names - done)))
            order.append(ready[0])
            done.add(ready[0])
        return order
  explanation: The command systemd-analyze blame shows how long each service took to start, which is the first tool when a machine boots slowly.
