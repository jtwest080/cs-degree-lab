- type: code
  question: Write `count_by_program(entries)` returning a dict that counts the log entries (dicts with a 'program' key) per program name. An empty list gives an empty dict.
  starter: |
    def count_by_program(entries):
        pass
  tests:
  - name: counting
    code: |
      es = [{"program": "sshd"}, {"program": "cron"}, {"program": "sshd"}]
      assert count_by_program(es) == {"sshd": 2, "cron": 1} and count_by_program([]) == {}
  solution: |
    def count_by_program(entries):
        counts = {}
        for e in entries:
            counts[e["program"]] = counts.get(e["program"], 0) + 1
        return counts
