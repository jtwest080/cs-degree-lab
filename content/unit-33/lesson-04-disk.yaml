- type: code
  question: Write `percent_used(used, size)` that returns the percentage of a disk that is used, rounded to a whole number (use round). If size is 0 return 0.
  starter: |
    def percent_used(used, size):
        pass
  tests:
  - name: percent
    code: |
      assert percent_used(50, 200) == 25 and percent_used(1, 3) == 33 and percent_used(5, 0) == 0 and percent_used(0, 10) == 0 and percent_used(10, 10) == 100
  solution: |
    def percent_used(used, size):
        if size == 0:
            return 0
        return round(used * 100 / size)
