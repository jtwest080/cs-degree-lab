id: u33-disk
title: Disks, Files and Quotas
minutes: 110
objective: Learn how a Linux machine keeps track of its storage. You will read df output, find the folders that fill a disk, read and check /etc/fstab, calculate how blocks waste space and apply quotas.
outcomes:
- Read the output of df and du
- Explain mount points and /etc/fstab
- Explain blocks and inodes and why tiny files waste space
- Apply soft and hard quotas
- Find out what fills a disk
sections:
- heading: Mounts and the one big tree
  body: |-
    On Windows every disk has a letter (C:, D:). Linux and macOS have **one tree** that starts at `/` (root). Another disk (or a USB stick, a network share or a virtual file system) is attached to a folder of the tree: that is called **mounting**, and the folder is its **mount point**. The disk you open at `/home` may be an entirely different drive from the one at `/`, and you cannot tell by looking at paths.

    The commands: `mount` (list the mounts), `df -h` (**d**isk **f**ree, in **h**uman readable sizes), `lsblk` (list **bl**ock devices). A **file system** (ext4, XFS, APFS, NTFS) is the structure on the disk that records files; **formatting** creates it. The file `/etc/fstab` lists what to mount at boot: device (better the `UUID=`, a number that never changes, because `/dev/sdb` can change when you plug in another disk), mount point, type, options, a **dump** flag and a **pass** number (the order of the check after a crash; the root should be 1).

    Mount options matter: `noexec` forbids running programs from the disk, `ro` is read-only, `noatime` stops updating "last read" times to save writes. Virtual file systems such as `/proc` and `tmpfs` (kept in memory) are mounted too.
- heading: Blocks, inodes and a full disk
  body: |-
    A disk hands out space in **blocks** (typically 4096 bytes), so a file of 1 byte uses a whole block. The **inode** is a small record per file (owner, permissions, size, times and where its blocks are; the *name* is stored in the folder). A file system has a fixed number of inodes, chosen when it is made, so a disk can be **full without bytes being used**: millions of tiny files (mail queues, caches) use up all inodes. `df -i` shows that.

    When a disk is full, follow the path: `df -h` (which disk?) then `du -sh /* ` or `du -h --max-depth=1 /var` (which folder?) and go deeper until you find the culprit, often **logs** that were never rotated, a **core dump**, old **backups** or a **deleted file that a program still holds open** (the space comes back only when the program closes it or restarts; `lsof | grep deleted` finds it).

    Sharing a disk fairly needs **quotas**: a **soft limit** (a warning and a grace period) and a **hard limit** (writes are refused), per user, group or project. Also remember **backups** (the 3-2-1 rule: three copies, on two kinds of media, one off site) and that **RAID** (several disks used as one) protects against a broken disk but *not* against deleting a file.
examples:
- title: What fills the disk?
  intro: Parse df output and total the folders.
  code: |
    def parse_df(text):
        """The command 'df -k' shows how full each disk is. Its output has a header line that starts with 'Filesystem' and then one line per disk with six columns separated by blanks: device, size, used, available (all in kilobytes), the use percentage with a % sign, and the mount point (the folder where the disk appears; it is the rest of the line and may contain blanks). Parse the text. Return a list of dicts {'device', 'size', 'used', 'avail' (all three converted to BYTES, 1 kilobyte = 1024 bytes), 'percent' (an int without the % sign) and 'mount'}. Skip blank lines and the header. ValueError('bad line N') for a line with fewer than six columns or with numbers that are not whole numbers (N counts all lines of the text from 1, including the header and blank ones)."""
        rows = []
        for n, line in enumerate(text.split("\n"), 1):
            if not line.strip() or line.startswith("Filesystem"):
                continue
            parts = line.split(None, 5)
            try:
                if len(parts) < 6 or not parts[4].endswith("%"):
                    raise ValueError
                device, size, used, avail, pct, mount = parts
                rows.append({"device": device, "size": int(size) * 1024, "used": int(used) * 1024, "avail": int(avail) * 1024, "percent": int(pct[:-1]), "mount": mount.strip()})
            except ValueError:
                raise ValueError("bad line %d" % n)
        return rows


    def dir_sizes(files, depth):
        """To find out what fills a disk you add up the sizes of the files in each folder (the command 'du' does this). 'files' is a list of (path, size) pairs such as ('/var/log/syslog', 5000). Return a list of (folder, total size) pairs, one for each folder at the given depth, where depth 1 means folders such as '/var', depth 2 means '/var/log' and so on. A file belongs to the folder made of the first `depth` parts of its path; a file that is not deep enough (for example '/boot/vmlinuz' at depth 2) belongs to its own folder ('/boot'), and a file directly in the root ('/swapfile') belongs to '/'. Depth 0 puts everything into '/'. Sort the result by size, the biggest first, then by folder name."""
        totals = {}
        for path, size in files:
            parts = [p for p in path.split("/") if p]
            folders = parts[:-1]
            key = "/" + "/".join(folders[:depth])
            totals[key] = totals.get(key, 0) + size
        return sorted(totals.items(), key=lambda kv: (-kv[1], kv[0]))

    text = """Filesystem 1K-blocks Used Available Use% Mounted on
    /dev/sda1 100000 91000 9000 91% /
    tmpfs 8000 100 7900 2% /run
    """
    for row in parse_df(text):
        print(row["mount"], row["percent"], "% full,", row["avail"] // 1024, "KB free")
    files = [("/var/log/syslog", 52000), ("/var/log/auth.log", 4000), ("/var/lib/db/data", 31000), ("/home/ada/video.mp4", 8000)]
    for folder, size in dir_sizes(files, 2):
        print(folder, size)
  output: |
    / 91 % full, 9000 KB free
    /run 2 % full, 7900 KB free
    /var/log 56000
    /var/lib 31000
    /home/ada 8000
  lines:
  - line: 32
    note: Each disk is shown with its mount point, how full it is and the free space.
  - line: 35
    note: 'The biggest folder is at the top: the logs.'
- title: Blocks and quotas
  intro: See the waste of small files and the state of two users.
  code: |
    def block_usage(sizes, block_size):
        """A file system hands out space in whole **blocks** (for example 4096 bytes), so a file of 1 byte still uses a whole block, and every file also needs an **inode** (a small record with its owner, size and where its blocks are). Given the list of file sizes in bytes and the block size, return a dict {'files' (how many), 'bytes' (the sum of the sizes), 'disk' (the space really used: every file takes ceil(size / block_size) blocks; an empty file takes none), 'waste' (disk minus bytes) and 'inodes' (one per file)}."""
        disk = 0
        for s in sizes:
            disk += -(-s // block_size) * block_size
        total = sum(sizes)
        return {"files": len(sizes), "bytes": total, "disk": disk, "waste": disk - total, "inodes": len(sizes)}


    def quota_report(usage, quotas):
        """On a shared server every user gets a **quota**, a limit on the disk space. A quota has a soft limit (above it you get a warning and a grace period) and a hard limit (when you reach it, writing is refused). 'usage' is a dict {user: bytes used}; 'quotas' is a dict {user: (soft, hard)}. Return a list of dicts {'user', 'used', 'status'} for every user that appears in either dict, sorted by user name. A user without usage has used 0. The status is 'unlimited' for a user without a quota, otherwise 'blocked' if used >= hard, else 'over soft' if used > soft, else 'ok'."""
        rows = []
        for user in sorted(set(usage) | set(quotas)):
            used = usage.get(user, 0)
            if user not in quotas:
                status = "unlimited"
            else:
                soft, hard = quotas[user]
                status = "blocked" if used >= hard else "over soft" if used > soft else "ok"
            rows.append({"user": user, "used": used, "status": status})
        return rows

    print(block_usage([1, 4096, 4097], 4096))
    usage = {"ada": 70, "bo": 20}
    quotas = {"ada": (50, 100), "bo": (50, 100)}
    for row in quota_report(usage, quotas):
        print(row["user"], row["status"])
  output: |
    {'files': 3, 'bytes': 8194, 'disk': 16384, 'waste': 8190, 'inodes': 3}
    ada over soft
    bo ok
  lines:
  - line: 23
    note: 'Three files with 8194 bytes in total take 16384 bytes on the disk: half is wasted.'
  - line: 26
    note: Ada is over her soft limit and Bo is fine.
