        s = text.strip()
        units = {"k": 1024, "m": 1024 ** 2, "g": 1024 ** 3, "t": 1024 ** 4}
        mult = 1
        if s and s[-1].lower() in units:
            mult = units[s[-1].lower()]
            s = s[:-1]
        if not s.isdigit():
            raise ValueError("bad size " + text)
        return int(s) * mult




    def container_status(limits, usage):
        """A **container** is an ordinary process that Linux limits with **cgroups** (control groups). Given the limits of a container, a dict that may contain 'memory' (a text such as '512m'), 'cpus' (a number of CPU cores, for example 1.5) and 'pids' (the highest number of processes), and a dict with the current usage ('memory' in bytes, 'cpus' = how many cores it wants, 'pids' = how many processes; a missing key means 0), return a dict with four entries. 'memory': 'unlimited' without a memory limit, 'oom-killed' if the usage is MORE than the limit (the kernel kills the process), else 'ok'. 'cpu_granted': the cores it really gets, the smaller one of wish and limit (the whole wish without a limit). 'throttled': True if the wish is MORE than the cpu limit (the kernel pauses the container to enforce the limit), else False. 'pids': 'unlimited' without a limit, 'fork refused' if the usage is more than the limit, else 'ok'."""
        pass
  tests:
  - name: states
    code: |
      lim = {"memory": "512m", "cpus": 1.5, "pids": 10}
      assert container_status(lim, {"memory": 100 * 1024 ** 2, "cpus": 1, "pids": 3}) == {"memory": "ok", "cpu_granted": 1, "throttled": False, "pids": "ok"}
      assert container_status(lim, {"memory": 512 * 1024 ** 2 + 1, "cpus": 3, "pids": 11}) == {"memory": "oom-killed", "cpu_granted": 1.5, "throttled": True, "pids": "fork refused"}
      assert container_status(lim, {"memory": 512 * 1024 ** 2, "cpus": 1.5, "pids": 10}) == {"memory": "ok", "cpu_granted": 1.5, "throttled": False, "pids": "ok"}
  - name: no limits
    code: |
      assert container_status({}, {}) == {"memory": "unlimited", "cpu_granted": 0, "throttled": False, "pids": "unlimited"}
      assert container_status({}, {"memory": 10 ** 12, "cpus": 8, "pids": 5000}) == {"memory": "unlimited", "cpu_granted": 8, "throttled": False, "pids": "unlimited"}
      assert container_status({"cpus": 2}, {"cpus": 0.5}) == {"memory": "unlimited", "cpu_granted": 0.5, "throttled": False, "pids": "unlimited"}
      assert container_status({"memory": "1k"}, {"memory": 1025})["memory"] == "oom-killed"
  hints:
  - Convert the memory limit with the given parse_size.
  - Use dict.get(key, 0) for missing usage.
  solution: |
