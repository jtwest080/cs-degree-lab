id: u33-containers
title: Containers and Images
minutes: 110
objective: Understand what a container really is. You will apply cgroup limits, read a Dockerfile, work out which layers a build can reuse, merge layers like an overlay file system and see why deleting a file does not shrink an image.
outcomes:
- Explain that a container is a limited process
- Explain namespaces and cgroups
- Read a Dockerfile
- Order a Dockerfile for good caching
- Explain image layers and the overlay file system
sections:
- heading: A container is a boxed process
  body: |-
    A **virtual machine** pretends to be a whole computer, with its own kernel, and starts in a minute. A **container** is much lighter: an ordinary Linux process that the kernel puts into a box, so it starts in a fraction of a second. The box has two parts. **Namespaces** limit what the process can *see*: its own process list (it believes it is process 1), its own network, its own hostnames and its own view of the file system (`chroot` and mounts). **Cgroups** (control groups) limit how much it can *use*: memory, CPU time, number of processes, disk speed. A memory limit is enforced by the OOM killer (the process dies) and a CPU limit by **throttling** (the process is paused for part of every 100 ms).

    All containers on a machine **share one kernel**. That is why they are small and fast, and also why they are less isolated than virtual machines: a kernel bug can let one escape. Never run a container as root unless you must (`USER` in the Dockerfile), and treat `--privileged` (all limits off) as dangerous.

    Docker made containers easy, but the pieces are standard: images (the OCI format), runtimes (runc, containerd), registries (a server of images, such as Docker Hub) and orchestrators such as **Kubernetes**, which decides *where* many containers run and restarts them.
- heading: Images, layers and Dockerfiles
  body: |-
    An **image** is the read-only package from which containers start: files and some settings (the command to run, environment variables, open ports). It is built from a recipe, the **Dockerfile**: `FROM python:3.12-slim` (a base image to start with), `COPY` (add files), `RUN` (run a command while building), `ENV`, `WORKDIR`, `EXPOSE`, `USER` and `CMD` (what to run on start). Each of `FROM`, `RUN`, `COPY` and `ADD` creates a **layer**: a stack of changed files. An **overlay file system** merges all layers into one view, and each running container adds a thin writable layer on top (deleted when the container is, so keep data in **volumes**).

    Layers are the reason images are quick to build and to share. Docker caches each layer: if an instruction and everything before it is unchanged, it is reused, but **after the first change everything is rebuilt**. So put things that rarely change (installing the dependencies) first and things that change often (your own source code) last. The flip side: layers are never edited, only added, so deleting a file in a later `RUN` hides it but the old layer still holds it. Clean up in the same instruction that made the mess: `RUN apt-get install ... && rm -rf /var/lib/apt/lists/*`.

    **Security.** Images contain software with bugs, so use small trusted base images, pin versions, rebuild regularly, scan for known vulnerabilities and **never put secrets in an image** (anyone who can read the image can read its layers).
examples:
- title: Limits of a container
  intro: Convert a limit and apply it to the usage of a container.
  code: |
    def parse_size(text):
        """Container limits are written like '512m' or '2g'. Convert such a text into a number of bytes. Accepted: a whole number, optionally followed by ONE letter k, m, g or t (upper or lower case) for 1024, 1024**2, 1024**3, 1024**4 bytes; no letter means bytes; surrounding blanks are ignored. Anything else (an empty text, a decimal point, a minus sign, two letters, a letter without a number) is a ValueError('bad size ' + the original text)."""
        s = text.strip()
        units = {"k": 1024, "m": 1024 ** 2, "g": 1024 ** 3, "t": 1024 ** 4}
        mult = 1
        if s and s[-1].lower() in units:
            mult = units[s[-1].lower()]
            s = s[:-1]
        if not s.isdigit():
            raise ValueError("bad size " + text)
        return int(s) * mult


    def container_status(limits, usage):
        """A **container** is an ordinary process that Linux limits with **cgroups** (control groups). Given the limits of a container, a dict that may contain 'memory' (a text such as '512m'), 'cpus' (a number of CPU cores, for example 1.5) and 'pids' (the highest number of processes), and a dict with the current usage ('memory' in bytes, 'cpus' = how many cores it wants, 'pids' = how many processes; a missing key means 0), return a dict with four entries. 'memory': 'unlimited' without a memory limit, 'oom-killed' if the usage is MORE than the limit (the kernel kills the process), else 'ok'. 'cpu_granted': the cores it really gets, the smaller one of wish and limit (the whole wish without a limit). 'throttled': True if the wish is MORE than the cpu limit (the kernel pauses the container to enforce the limit), else False. 'pids': 'unlimited' without a limit, 'fork refused' if the usage is more than the limit, else 'ok'."""
        result = {}
        mem = usage.get("memory", 0)
        if "memory" not in limits:
            result["memory"] = "unlimited"
        else:
            result["memory"] = "oom-killed" if mem > parse_size(limits["memory"]) else "ok"
        want = usage.get("cpus", 0)
        if "cpus" in limits:
            result["cpu_granted"] = min(want, limits["cpus"])
            result["throttled"] = want > limits["cpus"]
        else:
            result["cpu_granted"] = want
            result["throttled"] = False
        n = usage.get("pids", 0)
        if "pids" not in limits:
            result["pids"] = "unlimited"
        else:
            result["pids"] = "fork refused" if n > limits["pids"] else "ok"
        return result

    limits = {"memory": "256m", "cpus": 1, "pids": 50}
    usage = {"memory": 300 * 1024 * 1024, "cpus": 2, "pids": 12}
    print(parse_size("256m"))
    for key, value in container_status(limits, usage).items():
        print(key, value)
  output: |
    268435456
    memory oom-killed
    cpu_granted 1
    throttled True
    pids ok
  lines:
  - line: 38
    note: 256 times 1024 times 1024.
  - line: 39
    note: The container uses too much memory and is killed; it is throttled to one core and its process count is fine.
- title: Layers and the build cache
  intro: Parse a recipe, see what is reused and why a deleted file still costs space.
  code: |
    def parse_dockerfile(text):
        """A **Dockerfile** is the recipe of a container image: one instruction per line, the first word is the instruction (FROM, RUN, COPY, ...) and the rest its arguments. Parse the text. Ignore blank lines and lines that start (after blanks) with #. A line that ends with a backslash continues on the next line: remove the backslash, join the lines with ONE blank and strip. The instruction word may be written in any case but is returned in upper case. Return a list of dicts {'op', 'args'} (args stripped; '' if none). The known instructions are FROM, RUN, COPY, ADD, CMD, ENTRYPOINT, ENV, EXPOSE, WORKDIR, USER, ARG, LABEL and VOLUME; anything else is a ValueError('unknown instruction ' + the word in upper case). The first instruction must be FROM; only ARG may come before it. Otherwise (or if there is no instruction at all) raise ValueError('first instruction must be FROM')."""
        known = {"FROM", "RUN", "COPY", "ADD", "CMD", "ENTRYPOINT", "ENV", "EXPOSE", "WORKDIR", "USER", "ARG", "LABEL", "VOLUME"}
        logical, current = [], None
        for raw in text.split("\n"):
            line = raw.strip()
            if current is None and (not line or line.startswith("#")):
                continue
            if current is not None and line.startswith("#"):
                continue
            cont = line.endswith("\\")
            piece = line[:-1].strip() if cont else line
            current = piece if current is None else (current + " " + piece).strip()
            if not cont:
                logical.append(current)
                current = None
        if current is not None:
            logical.append(current)
        result = []
        for line in logical:
            if not line:
                continue
            word, _, args = line.partition(" ")
            op = word.upper()
            if op not in known:
                raise ValueError("unknown instruction " + op)
            result.append({"op": op, "args": args.strip()})
        for item in result:
            if item["op"] == "FROM":
                break
            if item["op"] != "ARG":
                raise ValueError("first instruction must be FROM")
        else:
            raise ValueError("first instruction must be FROM")
        return result


    def build_cache(old, new):
        """Docker builds an image **layer** by layer and keeps each one in a **cache**. When you build again, every instruction that is the same as before (and all before it are the same too) is taken from the cache; from the first changed instruction on, everything is rebuilt. Only the instructions FROM, RUN, COPY and ADD create layers (the others only change settings). Given the old and the new instruction list (as returned by parse_dockerfile), find the longest common start, the instructions that are equal in op and args at the same positions. Return {'cached': the number of layer-creating instructions in that common start, 'rebuilt': the number of layer-creating instructions of the NEW list after it}."""
        layer_ops = {"FROM", "RUN", "COPY", "ADD"}
        p = 0
        while p < len(old) and p < len(new) and old[p] == new[p]:
            p += 1
        cached = sum(1 for i in new[:p] if i["op"] in layer_ops)
        rebuilt = sum(1 for i in new[p:] if i["op"] in layer_ops)
        return {"cached": cached, "rebuilt": rebuilt}


    def overlay(layers):
        """An image is a stack of read-only layers, and a container sees them merged by an **overlay file system**. Every layer is a dict {path: content}; a content of None means 'this file is deleted in this layer' (Docker's whiteout). The layers are given from the bottom (oldest) to the top (newest). Return the dict that a container sees: for each path the content of the NEWEST layer that mentions it; paths whose newest entry is None do not appear."""
        merged = {}
        for layer in layers:
            for path, content in layer.items():
                if content is None:
                    merged.pop(path, None)
                else:
                    merged[path] = content
        return merged


    def wasted_bytes(layers):
        """Deleting a file in a later layer does NOT make the image smaller, because the old layer still holds it. The size of an image is the total length of all contents (len of the text) in ALL layers (None counts as 0). The visible size is the total length of the contents in the merged view of overlay(layers). Return how many bytes are hidden: the image size minus the visible size."""
        image = sum(len(c) for layer in layers for c in layer.values() if c is not None)
        visible = sum(len(c) for c in overlay(layers).values())
        return image - visible

    first = parse_dockerfile("FROM python:3.12\nCOPY requirements.txt /app/\nRUN pip install -r /app/requirements.txt\nCOPY . /app\nCMD python /app/main.py")
    second = parse_dockerfile("FROM python:3.12\nCOPY requirements.txt /app/\nRUN pip install -r /app/requirements.txt\nCOPY . /app\nCMD python /app/main.py")
    print(build_cache(first, second))
    changed = parse_dockerfile("FROM python:3.12\nCOPY . /app\nRUN pip install -r /app/requirements.txt\nCMD python /app/main.py")
    print(build_cache(first, changed))
    layers = [{"/tmp/download.tar": "x" * 100, "/bin/tool": "t" * 10}, {"/tmp/download.tar": None}]
    print(sorted(overlay(layers)), wasted_bytes(layers))
  output: |
    {'cached': 4, 'rebuilt': 0}
    {'cached': 1, 'rebuilt': 2}
    ['/bin/tool'] 100
  lines:
  - line: 69
    note: Nothing changed, so every layer is reused.
  - line: 71
    note: Copying the source first makes the install step rebuild.
  - line: 73
    note: The file is gone from the container but 100 bytes remain in the image.
