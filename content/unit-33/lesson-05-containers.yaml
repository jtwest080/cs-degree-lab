exercises:
- id: cgroup
  title: Limits that the kernel enforces
  difficulty: 4
  prompt: 'A container is not a small computer; it is a normal process that Linux puts in a box with **namespaces** (what it can see) and **cgroups** (how much it can use). Write `container_status(limits, usage)`. A **container** is an ordinary process that Linux limits with **cgroups** (control groups). Given the limits of a container, a dict that may contain ''memory'' (a text such as ''512m''), ''cpus'' (a number of CPU cores, for example 1.5) and ''pids'' (the highest number of processes), and a dict with the current usage (''memory'' in bytes, ''cpus'' = how many cores it wants, ''pids'' = how many processes; a missing key means 0), return a dict with four entries. ''memory'': ''unlimited'' without a memory limit, ''oom-killed'' if the usage is MORE than the limit (the kernel kills the process), else ''ok''. ''cpu_granted'': the cores it really gets, the smaller one of wish and limit (the whole wish without a limit). ''throttled'': True if the wish is MORE than the cpu limit (the kernel pauses the container to enforce the limit), else False. ''pids'': ''unlimited'' without a limit, ''fork refused'' if the usage is more than the limit, else ''ok''.'
