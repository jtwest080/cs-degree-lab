        """Container limits are written like '512m' or '2g'. Convert such a text into a number of bytes. Accepted: a whole number, optionally followed by ONE letter k, m, g or t (upper or lower case) for 1024, 1024**2, 1024**3, 1024**4 bytes; no letter means bytes; surrounding blanks are ignored. Anything else (an empty text, a decimal point, a minus sign, two letters, a letter without a number) is a ValueError('bad size ' + the original text)."""
        s = text.strip()
        units = {"k": 1024, "m": 1024 ** 2, "g": 1024 ** 3, "t": 1024 ** 4}
        mult = 1
        if s and s[-1].lower() in units:
            mult = units[s[-1].lower()]
            s = s[:-1]
        if not s.isdigit():
            raise ValueError("bad size " + text)
        return int(s) * mult




    def container_status(limits, usage):
        """A **container** is an ordinary process that Linux limits with **cgroups** (control groups). Given the limits of a container, a dict that may contain 'memory' (a text such as '512m'), 'cpus' (a number of CPU cores, for example 1.5) and 'pids' (the highest number of processes), and a dict with the current usage ('memory' in bytes, 'cpus' = how many cores it wants, 'pids' = how many processes; a missing key means 0), return a dict with four entries. 'memory': 'unlimited' without a memory limit, 'oom-killed' if the usage is MORE than the limit (the kernel kills the process), else 'ok'. 'cpu_granted': the cores it really gets, the smaller one of wish and limit (the whole wish without a limit). 'throttled': True if the wish is MORE than the cpu limit (the kernel pauses the container to enforce the limit), else False. 'pids': 'unlimited' without a limit, 'fork refused' if the usage is more than the limit, else 'ok'."""
        result = {}
        mem = usage.get("memory", 0)
        if "memory" not in limits:
            result["memory"] = "unlimited"
        else:
            result["memory"] = "oom-killed" if mem > parse_size(limits["memory"]) else "ok"
        want = usage.get("cpus", 0)
        if "cpus" in limits:
            result["cpu_granted"] = min(want, limits["cpus"])
            result["throttled"] = want > limits["cpus"]
        else:
            result["cpu_granted"] = want
            result["throttled"] = False
        n = usage.get("pids", 0)
        if "pids" not in limits:
            result["pids"] = "unlimited"
        else:
            result["pids"] = "fork refused" if n > limits["pids"] else "ok"
        return result
  explanation: 'With a memory limit, Linux does not slow the process down: it kills it (the OOM killer), which you saw in the memory lesson. A CPU limit only slows it down (throttling).'
- id: dockerfile
  title: Reading a recipe
  difficulty: 4
  prompt: 'An **image** is a package with everything a program needs, made from a recipe: the `Dockerfile`. Write `parse_dockerfile(text)`. A **Dockerfile** is the recipe of a container image: one instruction per line, the first word is the instruction (FROM, RUN, COPY, ...) and the rest its arguments. Parse the text. Ignore blank lines and lines that start (after blanks) with #. A line that ends with a backslash continues on the next line: remove the backslash, join the lines with ONE blank and strip. The instruction word may be written in any case but is returned in upper case. Return a list of dicts {''op'', ''args''} (args stripped; '''' if none). The known instructions are FROM, RUN, COPY, ADD, CMD, ENTRYPOINT, ENV, EXPOSE, WORKDIR, USER, ARG, LABEL and VOLUME; anything else is a ValueError(''unknown instruction '' + the word in upper case). The first instruction must be FROM; only ARG may come before it. Otherwise (or if there is no instruction at all) raise ValueError(''first instruction must be FROM'').'
  starter: |-
    def parse_dockerfile(text):
        """A **Dockerfile** is the recipe of a container image: one instruction per line, the first word is the instruction (FROM, RUN, COPY, ...) and the rest its arguments. Parse the text. Ignore blank lines and lines that start (after blanks) with #. A line that ends with a backslash continues on the next line: remove the backslash, join the lines with ONE blank and strip. The instruction word may be written in any case but is returned in upper case. Return a list of dicts {'op', 'args'} (args stripped; '' if none). The known instructions are FROM, RUN, COPY, ADD, CMD, ENTRYPOINT, ENV, EXPOSE, WORKDIR, USER, ARG, LABEL and VOLUME; anything else is a ValueError('unknown instruction ' + the word in upper case). The first instruction must be FROM; only ARG may come before it. Otherwise (or if there is no instruction at all) raise ValueError('first instruction must be FROM')."""
        pass
  tests:
  - name: parsing
    code: |
      text = """# my service
      ARG VERSION=3.12

      from python:3.12-slim
      RUN apt-get update \\
          && apt-get install -y git \\
          # no cache
          && rm -rf /var/lib/apt/lists/*
      COPY . /app
        WORKDIR /app
      CMD python app.py
      """
      assert parse_dockerfile(text) == [{"op": "ARG", "args": "VERSION=3.12"}, {"op": "FROM", "args": "python:3.12-slim"}, {"op": "RUN", "args": "apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*"}, {"op": "COPY", "args": ". /app"}, {"op": "WORKDIR", "args": "/app"}, {"op": "CMD", "args": "python app.py"}]
      assert parse_dockerfile("FROM scratch") == [{"op": "FROM", "args": "scratch"}] and parse_dockerfile("FROM a\nEXPOSE") == [{"op": "FROM", "args": "a"}, {"op": "EXPOSE", "args": ""}]
  - name: errors
    code: |
      for text, msg in (("", "first instruction must be FROM"), ("# only a comment\n", "first instruction must be FROM"), ("RUN echo hi\nFROM a", "first instruction must be FROM"), ("ARG a=1\n", "first instruction must be FROM"), ("FROM a\nFOO bar", "unknown instruction FOO"), ("FROM a\nrun x\nmaintain me", "unknown instruction MAINTAIN")):
          try:
              parse_dockerfile(text)
              raise AssertionError("accepted " + repr(text))
          except ValueError as e:
              assert str(e) == msg, (text, str(e))
  hints:
  - First join the continuation lines into logical lines, then split each at the first blank.
  - str.partition(' ') gives (word, blank, rest).
  solution: |
    def parse_dockerfile(text):
        """A **Dockerfile** is the recipe of a container image: one instruction per line, the first word is the instruction (FROM, RUN, COPY, ...) and the rest its arguments. Parse the text. Ignore blank lines and lines that start (after blanks) with #. A line that ends with a backslash continues on the next line: remove the backslash, join the lines with ONE blank and strip. The instruction word may be written in any case but is returned in upper case. Return a list of dicts {'op', 'args'} (args stripped; '' if none). The known instructions are FROM, RUN, COPY, ADD, CMD, ENTRYPOINT, ENV, EXPOSE, WORKDIR, USER, ARG, LABEL and VOLUME; anything else is a ValueError('unknown instruction ' + the word in upper case). The first instruction must be FROM; only ARG may come before it. Otherwise (or if there is no instruction at all) raise ValueError('first instruction must be FROM')."""
        known = {"FROM", "RUN", "COPY", "ADD", "CMD", "ENTRYPOINT", "ENV", "EXPOSE", "WORKDIR", "USER", "ARG", "LABEL", "VOLUME"}
        logical, current = [], None
        for raw in text.split("\n"):
            line = raw.strip()
            if current is None and (not line or line.startswith("#")):
                continue
            if current is not None and line.startswith("#"):
                continue
            cont = line.endswith("\\")
            piece = line[:-1].strip() if cont else line
            current = piece if current is None else (current + " " + piece).strip()
            if not cont:
                logical.append(current)
                current = None
        if current is not None:
            logical.append(current)
        result = []
        for line in logical:
            if not line:
                continue
            word, _, args = line.partition(" ")
            op = word.upper()
            if op not in known:
                raise ValueError("unknown instruction " + op)
            result.append({"op": op, "args": args.strip()})
        for item in result:
            if item["op"] == "FROM":
                break
            if item["op"] != "ARG":
                raise ValueError("first instruction must be FROM")
        else:
            raise ValueError("first instruction must be FROM")
        return result
  explanation: Good Dockerfiles use a small base image, a non-root USER and (for build tools) multi-stage builds with several FROM lines; the extra FROM lines are what this exercise's simple rule allows.
- id: cache
  title: Why order matters in a Dockerfile
  difficulty: 5
  prompt: 'Building an image can take minutes, so Docker remembers layers. Write `build_cache(old, new)`. Docker builds an image **layer** by layer and keeps each one in a **cache**. When you build again, every instruction that is the same as before (and all before it are the same too) is taken from the cache; from the first changed instruction on, everything is rebuilt. Only the instructions FROM, RUN, COPY and ADD create layers (the others only change settings). Given the old and the new instruction list (as returned by parse_dockerfile), find the longest common start, the instructions that are equal in op and args at the same positions. Return {''cached'': the number of layer-creating instructions in that common start, ''rebuilt'': the number of layer-creating instructions of the NEW list after it}.'
  starter: |-
    def build_cache(old, new):
        """Docker builds an image **layer** by layer and keeps each one in a **cache**. When you build again, every instruction that is the same as before (and all before it are the same too) is taken from the cache; from the first changed instruction on, everything is rebuilt. Only the instructions FROM, RUN, COPY and ADD create layers (the others only change settings). Given the old and the new instruction list (as returned by parse_dockerfile), find the longest common start, the instructions that are equal in op and args at the same positions. Return {'cached': the number of layer-creating instructions in that common start, 'rebuilt': the number of layer-creating instructions of the NEW list after it}."""
        pass
  tests:
  - name: reuse
    code: |
      def ins(*pairs):
          return [{"op": o, "args": a} for o, a in pairs]
      old = ins(("FROM", "a"), ("RUN", "x"), ("COPY", ". /app"), ("ENV", "A=1"), ("RUN", "y"))
      same = ins(("FROM", "a"), ("RUN", "x"), ("COPY", ". /app"), ("ENV", "A=1"), ("RUN", "y"))
      env = ins(("FROM", "a"), ("RUN", "x"), ("COPY", ". /app"), ("ENV", "A=2"), ("RUN", "y"))
      assert build_cache(old, same) == {"cached": 4, "rebuilt": 0}
      assert build_cache(old, env) == {"cached": 3, "rebuilt": 1}
      assert build_cache(old, ins(("FROM", "b"), ("RUN", "x"))) == {"cached": 0, "rebuilt": 2}
  - name: edge cases
    code: |
      def ins(*pairs):
          return [{"op": o, "args": a} for o, a in pairs]
      a = ins(("FROM", "a"), ("RUN", "x"))
      assert build_cache([], a) == {"cached": 0, "rebuilt": 2} and build_cache(a, []) == {"cached": 0, "rebuilt": 0} and build_cache([], []) == {"cached": 0, "rebuilt": 0}
      b = ins(("FROM", "a"), ("ENV", "k=v"), ("RUN", "x"), ("CMD", "go"))
      assert build_cache(a, b) == {"cached": 1, "rebuilt": 1}
      assert build_cache(b, a) == {"cached": 1, "rebuilt": 1}
  hints:
  - Count how many items are equal from the start (a while loop).
  - Only FROM, RUN, COPY and ADD count as layers.
  solution: |
    def build_cache(old, new):
        """Docker builds an image **layer** by layer and keeps each one in a **cache**. When you build again, every instruction that is the same as before (and all before it are the same too) is taken from the cache; from the first changed instruction on, everything is rebuilt. Only the instructions FROM, RUN, COPY and ADD create layers (the others only change settings). Given the old and the new instruction list (as returned by parse_dockerfile), find the longest common start, the instructions that are equal in op and args at the same positions. Return {'cached': the number of layer-creating instructions in that common start, 'rebuilt': the number of layer-creating instructions of the NEW list after it}."""
        layer_ops = {"FROM", "RUN", "COPY", "ADD"}
        p = 0
        while p < len(old) and p < len(new) and old[p] == new[p]:
            p += 1
        cached = sum(1 for i in new[:p] if i["op"] in layer_ops)
        rebuilt = sum(1 for i in new[p:] if i["op"] in layer_ops)
        return {"cached": cached, "rebuilt": rebuilt}
  explanation: 'A good habit: copy the dependency list and install it first, and copy your source code last, because the code changes all the time and the dependencies rarely do.'
- id: overlay
  title: The merged view
  difficulty: 4
  prompt: 'Containers share layers: ten containers from one image use the same files on disk and only their own changes are stored in a small writable top layer. Write `overlay(layers)`. An image is a stack of read-only layers, and a container sees them merged by an **overlay file system**. Every layer is a dict {path: content}; a content of None means ''this file is deleted in this layer'' (Docker''s whiteout). The layers are given from the bottom (oldest) to the top (newest). Return the dict that a container sees: for each path the content of the NEWEST layer that mentions it; paths whose newest entry is None do not appear.'
  starter: |-
    def overlay(layers):
        """An image is a stack of read-only layers, and a container sees them merged by an **overlay file system**. Every layer is a dict {path: content}; a content of None means 'this file is deleted in this layer' (Docker's whiteout). The layers are given from the bottom (oldest) to the top (newest). Return the dict that a container sees: for each path the content of the NEWEST layer that mentions it; paths whose newest entry is None do not appear."""
        pass
  tests:
  - name: merging
    code: |
      layers = [{"/a": "x", "/b": "yy"}, {"/a": None, "/c": "z"}, {"/b": "qqq", "/a": "back"}]
      assert overlay(layers) == {"/a": "back", "/b": "qqq", "/c": "z"}
      assert overlay(layers[:2]) == {"/b": "yy", "/c": "z"} and overlay(layers[:1]) == {"/a": "x", "/b": "yy"}
      assert overlay([]) == {} and overlay([{}, {}]) == {}
  - name: deletion
    code: |
      assert overlay([{"/x": "1"}, {"/x": None}]) == {}
      assert overlay([{"/x": None}]) == {}
      l = [{"/x": "1"}]
      assert overlay(l) == {"/x": "1"} and l == [{"/x": "1"}]
  hints:
  - Go through the layers from the bottom and update a dict.
  - dict.pop(key, None) deletes a key that may not exist.
  solution: |
    def overlay(layers):
        """An image is a stack of read-only layers, and a container sees them merged by an **overlay file system**. Every layer is a dict {path: content}; a content of None means 'this file is deleted in this layer' (Docker's whiteout). The layers are given from the bottom (oldest) to the top (newest). Return the dict that a container sees: for each path the content of the NEWEST layer that mentions it; paths whose newest entry is None do not appear."""
        merged = {}
        for layer in layers:
            for path, content in layer.items():
                if content is None:
                    merged.pop(path, None)
                else:
                    merged[path] = content
        return merged
  explanation: A container that deletes a file from its base image only hides it (a whiteout entry), exactly like the None in this exercise.
- id: waste
  title: Deleting does not shrink the image
  difficulty: 3
  prompt: 'This is why people clean up in the *same* `RUN` instruction that created the mess. Write `wasted_bytes(layers)`. Deleting a file in a later layer does NOT make the image smaller, because the old layer still holds it. The size of an image is the total length of all contents (len of the text) in ALL layers (None counts as 0). The visible size is the total length of the contents in the merged view of overlay(layers). Return how many bytes are hidden: the image size minus the visible size.'
  starter: |-
    def overlay(layers):
        """An image is a stack of read-only layers, and a container sees them merged by an **overlay file system**. Every layer is a dict {path: content}; a content of None means 'this file is deleted in this layer' (Docker's whiteout). The layers are given from the bottom (oldest) to the top (newest). Return the dict that a container sees: for each path the content of the NEWEST layer that mentions it; paths whose newest entry is None do not appear."""
