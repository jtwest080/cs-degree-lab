    def wasted_bytes(layers):
        """Deleting a file in a later layer does NOT make the image smaller, because the old layer still holds it. The size of an image is the total length of all contents (len of the text) in ALL layers (None counts as 0). The visible size is the total length of the contents in the merged view of overlay(layers). Return how many bytes are hidden: the image size minus the visible size."""
        pass
  tests:
  - name: waste
    code: |
      layers = [{"/a": "xxxx", "/b": "yy"}, {"/a": None, "/c": "z"}, {"/b": "qqq"}]
      assert wasted_bytes(layers) == 6
      assert wasted_bytes(layers[:1]) == 0 and wasted_bytes([]) == 0
      assert wasted_bytes([{"/big": "x" * 1000}, {"/big": None}]) == 1000
  - name: overrides
    code: |
      assert wasted_bytes([{"/a": "12345"}, {"/a": "12"}]) == 5
      assert wasted_bytes([{"/a": "1"}, {"/a": "12"}, {"/a": "123"}]) == 3
      assert wasted_bytes([{"/a": "1", "/b": "22"}, {"/c": "333"}]) == 0
  hints:
  - Sum the lengths of everything in all layers, then subtract the visible total.
  - The given overlay function does the merging.
  solution: |
    def overlay(layers):
        """An image is a stack of read-only layers, and a container sees them merged by an **overlay file system**. Every layer is a dict {path: content}; a content of None means 'this file is deleted in this layer' (Docker's whiteout). The layers are given from the bottom (oldest) to the top (newest). Return the dict that a container sees: for each path the content of the NEWEST layer that mentions it; paths whose newest entry is None do not appear."""
        merged = {}
        for layer in layers:
            for path, content in layer.items():
                if content is None:
                    merged.pop(path, None)
                else:
                    merged[path] = content
        return merged




    def wasted_bytes(layers):
        """Deleting a file in a later layer does NOT make the image smaller, because the old layer still holds it. The size of an image is the total length of all contents (len of the text) in ALL layers (None counts as 0). The visible size is the total length of the contents in the merged view of overlay(layers). Return how many bytes are hidden: the image size minus the visible size."""
        image = sum(len(c) for layer in layers for c in layer.values() if c is not None)
        visible = sum(len(c) for c in overlay(layers).values())
        return image - visible
  explanation: Real tools that show this are docker history and the 'dive' program.
commonMistakes:
- title: Believing a container is a virtual machine
  explanation: It shares the kernel of the host.
- title: Running as root in the container
  explanation: A break-out then has full power.
- title: Copying the source before installing dependencies
  explanation: Every code change then reinstalls everything.
- title: Putting secrets in the image
  explanation: Layers can be read.
- title: Keeping data in the container layer
  explanation: It disappears with the container; use a volume.
summary:
- A container is a process limited by namespaces and cgroups.
- Containers share the kernel of the host.
- An image is a stack of layers made from a Dockerfile.
- Order instructions so that the cache is reused.
- Deleting a file in a later layer does not shrink the image.
