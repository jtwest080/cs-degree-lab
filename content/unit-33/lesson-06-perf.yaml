- type: code
  question: Write `average(values)` that returns the mean of a list of numbers, rounded to 2 decimals. An empty list gives 0.
  starter: |
    def average(values):
        pass
  tests:
  - name: mean
    code: |
      assert average([1, 2]) == 1.5 and average([]) == 0 and average([1, 1, 2]) == 1.33 and average([5]) == 5
  solution: |
    def average(values):
        if not values:
            return 0
        return round(sum(values) / len(values), 2)
