    CALM_PS = "PID PPID STAT %CPU %MEM COMMAND\n1 0 Ss 0.0 0.1 systemd\n200 1 Ss 0.5 0.3 sshd\n"
    CALM_UP = " 10:00:00 up 3 days,  2:14,  2 users,  load average: 0.20, 0.30, 0.25"
