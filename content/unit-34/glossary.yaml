# Terms introduced in Unit 34 (Networking in Practice). `lesson` is the id of the lesson that introduces the term.
terms:
- term: Round-trip time
  definition: The time a message needs to go to another computer and come back.
  lesson: u34-tools
- term: Packet loss
  definition: The share of messages that never arrive.
  lesson: u34-tools
- term: ping
  definition: A command that sends small test messages and measures the answer time and loss.
  lesson: u34-tools
- term: traceroute
  definition: A command that lists the routers on the path to another computer.
  lesson: u34-tools
- term: Hop
  definition: One router on the path of a packet.
  lesson: u34-tools
- term: TTL
  definition: A counter in a packet or the number of seconds an answer may be remembered, depending on the context.
  lesson: u34-tools
- term: dig
  definition: A command that asks a name server for DNS records.
  lesson: u34-tools
- term: SERVFAIL
  definition: The DNS answer that the name server itself failed.
  lesson: u34-tools
- term: curl
  definition: A command line tool that makes web requests.
  lesson: u34-tools
- term: Time to first byte
  definition: The time until the server starts to answer a request.
  lesson: u34-tools
- term: ICMP
  definition: The protocol of ping and of error messages between routers and computers.
  lesson: u34-tools
- term: Payload
  definition: The content that a packet carries behind its header.
  lesson: u34-packets
- term: Acknowledgment
  definition: The message that says which byte a receiver expects next.
  lesson: u34-packets
- term: SYN flood
  definition: An attack that sends many connection starts and never finishes them.
  lesson: u34-packets
- term: Wireshark
  definition: A program that captures and shows network packets.
  lesson: u34-packets
- term: Query string
  definition: The part of a web address after the question mark that carries parameters.
  lesson: u34-http
- term: Percent encoding
  definition: Writing a special character as a percent sign and two hexadecimal digits.
  lesson: u34-http
- term: Cache-Control
  definition: A header that tells caches how long and whether to keep a copy.
  lesson: u34-http
- term: CDN
  definition: A network of servers around the world that keep copies of content close to visitors.
  lesson: u34-http
- term: Redirect
  definition: An answer that sends the browser to another address.
  lesson: u34-http
- term: Proxy
  definition: A computer that passes requests on for someone else.
  lesson: u34-proxy
- term: Reverse proxy
  definition: A proxy in front of servers that receives requests for them.
  lesson: u34-proxy
- term: Weighted round robin
  definition: Round robin in which stronger servers get a bigger share.
  lesson: u34-proxy
- term: Health check
  definition: A regular test that tells whether a server works.
  lesson: u34-proxy
- term: Flapping
  definition: Switching quickly and repeatedly between working and failed.
  lesson: u34-proxy
- term: TLS termination
  definition: Doing the encryption work at the proxy so the servers behind it need not.
  lesson: u34-proxy
- term: Single point of failure
  definition: A part whose failure stops the whole system.
  lesson: u34-proxy
- term: Horizontal scaling
  definition: Growing by adding more machines instead of a bigger one.
  lesson: u34-proxy
- term: Failover
  definition: Switching to a standby system when the main one fails.
  lesson: u34-proxy
- term: Zone file
  definition: The text file that lists the DNS records of a domain.
  lesson: u34-dns
- term: A record
  definition: A DNS record that holds an IPv4 address.
  lesson: u34-dns
- term: AAAA record
  definition: A DNS record that holds an IPv6 address.
  lesson: u34-dns
- term: NS record
  definition: A DNS record that names the servers that answer for a domain.
  lesson: u34-dns
- term: TXT record
  definition: A DNS record with free text, used for proofs and mail rules.
  lesson: u34-dns
- term: PTR record
  definition: A DNS record that maps an address back to a name.
  lesson: u34-dns
- term: Resolver
  definition: A server that looks up DNS answers for others and remembers them.
  lesson: u34-dns
- term: SPF
  definition: A DNS record that lists the servers allowed to send mail for a domain.
  lesson: u34-dns
- term: DKIM
  definition: A way to sign emails with a key that is published in DNS.
  lesson: u34-dns
- term: DMARC
  definition: A DNS record that says what to do with mail that fails the SPF and DKIM checks.
  lesson: u34-dns
- term: Cache poisoning
  definition: Feeding a resolver a false answer so that it sends users to the wrong place.
  lesson: u34-dns
- term: Localhost
  definition: The name for this computer itself, 127.0.0.1.
  lesson: u34-firewall
- term: Default deny
  definition: The rule that everything not explicitly allowed is blocked.
  lesson: u34-firewall
- term: DMZ
  definition: A separate network zone for servers that the public may reach.
  lesson: u34-firewall
- term: Port forwarding
  definition: A fixed NAT entry that sends outside connections to one device.
  lesson: u34-firewall
- term: nmap
  definition: A well known tool for scanning ports and finding hosts.
  lesson: u34-firewall
- term: Security group
  definition: The firewall rules of a cloud server.
  lesson: u34-firewall
