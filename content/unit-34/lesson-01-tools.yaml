- type: code
  question: Write `loss_percent(sent, received)` that returns the percentage of lost messages, rounded to 1 decimal. If nothing was sent return 0.0.
  starter: |
    def loss_percent(sent, received):
        pass
  tests:
  - name: loss
    code: |
      assert loss_percent(4, 3) == 25.0 and loss_percent(3, 2) == 33.3 and loss_percent(0, 0) == 0.0 and loss_percent(5, 5) == 0.0 and loss_percent(10, 0) == 100.0
  solution: |
    def loss_percent(sent, received):
        if sent == 0:
            return 0.0
        return round((sent - received) / sent * 100, 1)
