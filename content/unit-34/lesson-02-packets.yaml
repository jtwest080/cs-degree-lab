  - int.from_bytes(data[4:8], 'big') reads a number.
  - Test a flag with data[13] & (1 << i).
  solution: |
    def parse_tcp(hexstr):
        """A TCP segment starts with its header (hexadecimal text, blanks allowed): bytes 0-1 source port, 2-3 destination port, 4-7 sequence number, 8-11 acknowledgment number (all big-endian, the high byte first), byte 12 the header length in 32-bit words in its high 4 bits (at least 5), byte 13 the flags, bytes 14-15 the window size. The flag bits, from the lowest: FIN (1), SYN (2), RST (4), PSH (8), ACK (16), URG (32). Return {'src_port', 'dst_port', 'seq', 'ack', 'header_bytes', 'flags' (the list of the names of the set flags in the order FIN, SYN, RST, PSH, ACK, URG), 'window'}. ValueError('too short') for fewer than 20 bytes, ValueError('bad header length') for a header length below 5 words (check the length of the data first)."""
        data = bytes.fromhex(hexstr)
        if len(data) < 20:
            raise ValueError("too short")
        words = data[12] >> 4
        if words < 5:
            raise ValueError("bad header length")
        names = ["FIN", "SYN", "RST", "PSH", "ACK", "URG"]
        flags = [n for i, n in enumerate(names) if data[13] & (1 << i)]
        return {"src_port": (data[0] << 8) | data[1], "dst_port": (data[2] << 8) | data[3],
                "seq": int.from_bytes(data[4:8], "big"), "ack": int.from_bytes(data[8:12], "big"),
                "header_bytes": words * 4, "flags": flags, "window": (data[14] << 8) | data[15]}
  explanation: SYN opens a connection, ACK confirms, FIN closes politely, RST slams the door, PSH asks to deliver data at once. A SYN without ACK arriving in huge numbers is a 'SYN flood' attack.
- id: reassemble
  title: Putting the stream back together
  difficulty: 5
  prompt: 'The internet delivers packets late, twice and in the wrong order, yet your download arrives correct. Write `reassemble(segments, start)`. TCP cuts a stream of bytes into segments that may arrive late, twice or in the wrong order, and puts them back together. Each segment is a pair (seq, text): the position of its first character in the stream and its characters (one character = one byte). The stream starts at position `start`. Return {''data'', ''next'', ''gaps''}: ''data'' is the text that is complete from `start` on without a hole (for overlapping or repeated segments the segment that comes first in the list wins for the overlap; characters before `start` are ignored), ''next'' is start + len(data) (the next position the receiver waits for, which it would put in its acknowledgment), and ''gaps'' is the list of (first, end) pairs for every stretch of missing positions between `start` and the end of the highest segment (''end'' is exclusive), in order.'
  starter: |-
    def reassemble(segments, start):
        """TCP cuts a stream of bytes into segments that may arrive late, twice or in the wrong order, and puts them back together. Each segment is a pair (seq, text): the position of its first character in the stream and its characters (one character = one byte). The stream starts at position `start`. Return {'data', 'next', 'gaps'}: 'data' is the text that is complete from `start` on without a hole (for overlapping or repeated segments the segment that comes first in the list wins for the overlap; characters before `start` are ignored), 'next' is start + len(data) (the next position the receiver waits for, which it would put in its acknowledgment), and 'gaps' is the list of (first, end) pairs for every stretch of missing positions between `start` and the end of the highest segment ('end' is exclusive), in order."""
        pass
  tests:
  - name: order, duplicates, holes
    code: |
      r = reassemble([(1005, "world"), (1000, "hello"), (1000, "hello"), (1015, "!!")], 1000)
      assert r == {"data": "helloworld", "next": 1010, "gaps": [(1010, 1015)]}
      r = reassemble([(1010, "-again"), (1000, "hello"), (1005, "world")], 1000)
      assert r == {"data": "helloworld-again", "next": 1016, "gaps": []}
      assert reassemble([(7, "x")], 5) == {"data": "", "next": 5, "gaps": [(5, 7)]}
  - name: overlaps and old data
    code: |
      assert reassemble([], 5) == {"data": "", "next": 5, "gaps": []}
      assert reassemble([(3, "abcdef")], 5) == {"data": "cdef", "next": 9, "gaps": []}
      r = reassemble([(0, "abc"), (2, "XYZ")], 0)
      assert r == {"data": "abcYZ", "next": 5, "gaps": []}
      r = reassemble([(10, "b"), (20, "c"), (0, "aa")], 0)
      assert r == {"data": "aa", "next": 2, "gaps": [(2, 10), (11, 20)]}
  hints:
  - A dict from position to character handles overlaps (first one wins).
  - Walk from `start` while the position is in the dict.
  solution: |
    def reassemble(segments, start):
        """TCP cuts a stream of bytes into segments that may arrive late, twice or in the wrong order, and puts them back together. Each segment is a pair (seq, text): the position of its first character in the stream and its characters (one character = one byte). The stream starts at position `start`. Return {'data', 'next', 'gaps'}: 'data' is the text that is complete from `start` on without a hole (for overlapping or repeated segments the segment that comes first in the list wins for the overlap; characters before `start` are ignored), 'next' is start + len(data) (the next position the receiver waits for, which it would put in its acknowledgment), and 'gaps' is the list of (first, end) pairs for every stretch of missing positions between `start` and the end of the highest segment ('end' is exclusive), in order."""
        chars = {}
        for seq, text in segments:
            for i, ch in enumerate(text):
                pos = seq + i
                if pos >= start and pos not in chars:
                    chars[pos] = ch
        data = ""
        pos = start
        while pos in chars:
            data += chars[pos]
            pos += 1
        gaps = []
        if chars:
            top = max(chars) + 1
            p = start
            while p < top:
                if p in chars:
                    p += 1
                    continue
                q = p
                while q < top and q not in chars:
                    q += 1
                gaps.append((p, q))
                p = q
        return {"data": data, "next": start + len(data), "gaps": gaps}
  explanation: 'Real TCP receivers do exactly this, with byte numbers instead of characters. The ''next'' value is the ACK number: it tells the sender what to send again.'
- id: handshake
  title: Reading a connection
  difficulty: 4
  prompt: 'Support people read connection traces all day: the word for what happened is more useful than the raw list. Write `classify_connection(packets)`. Read a list of packets of ONE TCP connection, each a pair (who, flags): who is ''c'' (the client, who started it) or ''s'' (the server), flags is a list of flag names such as [''SYN''] or [''SYN'', ''ACK'']. Return one of these words, checking in this order: ''none'' for an empty list; ''refused'' if the first packet is a client SYN and the second packet is a server RST; ''reset'' if any other packet has the flag RST; then look at the three-way handshake, which is: a client packet with exactly the flags SYN, later a server packet with exactly SYN and ACK, later a client packet that has ACK (and not SYN): ''no handshake'' if there is no client SYN-only packet at all; ''no answer'' if there is a SYN but no server SYN+ACK after it; ''half-open'' if the SYN+ACK came but no client ACK after it; otherwise the connection is established: ''closed'' if after the handshake BOTH sides sent a packet with FIN, ''closing'' if only one side did, else ''established''.'
  starter: |-
    def classify_connection(packets):
        """Read a list of packets of ONE TCP connection, each a pair (who, flags): who is 'c' (the client, who started it) or 's' (the server), flags is a list of flag names such as ['SYN'] or ['SYN', 'ACK']. Return one of these words, checking in this order: 'none' for an empty list; 'refused' if the first packet is a client SYN and the second packet is a server RST; 'reset' if any other packet has the flag RST; then look at the three-way handshake, which is: a client packet with exactly the flags SYN, later a server packet with exactly SYN and ACK, later a client packet that has ACK (and not SYN): 'no handshake' if there is no client SYN-only packet at all; 'no answer' if there is a SYN but no server SYN+ACK after it; 'half-open' if the SYN+ACK came but no client ACK after it; otherwise the connection is established: 'closed' if after the handshake BOTH sides sent a packet with FIN, 'closing' if only one side did, else 'established'."""
        pass
  tests:
  - name: normal and broken
    code: |
      C = [("c", ["SYN"]), ("s", ["SYN", "ACK"]), ("c", ["ACK"]), ("c", ["PSH", "ACK"]), ("c", ["FIN", "ACK"]), ("s", ["FIN", "ACK"]), ("c", ["ACK"])]
      assert classify_connection(C) == "closed" and classify_connection(C[:5]) == "closing" and classify_connection(C[:4]) == "established" and classify_connection(C[:3]) == "established"
      assert classify_connection(C[:2]) == "half-open" and classify_connection(C[:1]) == "no answer" and classify_connection([]) == "none"
  - name: resets
    code: |
      assert classify_connection([("c", ["SYN"]), ("s", ["RST", "ACK"])]) == "refused"
      C = [("c", ["SYN"]), ("s", ["SYN", "ACK"]), ("c", ["ACK"])]
      assert classify_connection(C + [("s", ["RST"])]) == "reset" and classify_connection(C[:2] + [("c", ["RST"])]) == "reset"
      assert classify_connection([("s", ["ACK"])]) == "no handshake" and classify_connection([("c", ["SYN", "ACK"]), ("s", ["ACK"])]) == "no handshake"
      assert classify_connection([("c", ["SYN"]), ("c", ["SYN"]), ("s", ["ACK", "SYN"])]) == "half-open"
      assert classify_connection(C + [("c", ["FIN"]), ("c", ["FIN"])]) == "closing"
  hints:
  - Use next(..., None) with a generator to find the first matching packet.
  - Compare sorted(flags) with ['ACK', 'SYN'] so that the order does not matter.
  solution: |
    def classify_connection(packets):
        """Read a list of packets of ONE TCP connection, each a pair (who, flags): who is 'c' (the client, who started it) or 's' (the server), flags is a list of flag names such as ['SYN'] or ['SYN', 'ACK']. Return one of these words, checking in this order: 'none' for an empty list; 'refused' if the first packet is a client SYN and the second packet is a server RST; 'reset' if any other packet has the flag RST; then look at the three-way handshake, which is: a client packet with exactly the flags SYN, later a server packet with exactly SYN and ACK, later a client packet that has ACK (and not SYN): 'no handshake' if there is no client SYN-only packet at all; 'no answer' if there is a SYN but no server SYN+ACK after it; 'half-open' if the SYN+ACK came but no client ACK after it; otherwise the connection is established: 'closed' if after the handshake BOTH sides sent a packet with FIN, 'closing' if only one side did, else 'established'."""
        if not packets:
            return "none"
        if len(packets) >= 2 and packets[0] == ("c", ["SYN"]) and packets[1][0] == "s" and "RST" in packets[1][1]:
            return "refused"
        if any("RST" in flags for _, flags in packets):
            return "reset"
        syn = next((i for i, (w, f) in enumerate(packets) if w == "c" and sorted(f) == ["SYN"]), None)
        if syn is None:
            return "no handshake"
        synack = next((i for i in range(syn + 1, len(packets)) if packets[i][0] == "s" and sorted(packets[i][1]) == ["ACK", "SYN"]), None)
        if synack is None:
            return "no answer"
        ack = next((i for i in range(synack + 1, len(packets)) if packets[i][0] == "c" and "ACK" in packets[i][1] and "SYN" not in packets[i][1]), None)
        if ack is None:
            return "half-open"
        fins = {w for w, f in packets[ack + 1:] if "FIN" in f}
        return "closed" if len(fins) == 2 else "closing" if fins else "established"
  explanation: '''Connection refused'' means somebody answered that nobody listens on that port. ''Timed out'' means no answer at all, often a firewall that silently drops packets.'
commonMistakes:
- title: Mixing up the byte order
  explanation: Networks put the high byte first.
- title: Forgetting to pad an odd number of bytes
  explanation: The checksum adds a zero byte.
- title: Reading 'timed out' as 'refused'
  explanation: Refused is an answer, a time-out is silence.
- title: Thinking the checksum protects against attackers
  explanation: Anyone can recompute it.
- title: Assuming UDP is reliable
  explanation: It never resends lost packets.
summary:
- 'Packets nest: frame, IP packet, TCP segment, data.'
- Headers are bytes at fixed places, written in hexadecimal.
- The checksum finds accidental damage.
- TCP numbers bytes, acknowledges them and reorders segments.
- The handshake is SYN, SYN+ACK, ACK.
