      syn = "c350" + "01bb" + "00000064" + "00000000" + "5002" + "ffff" + "0000" + "0000"
      assert parse_tcp(syn) == {"src_port": 50000, "dst_port": 443, "seq": 100, "ack": 0, "header_bytes": 20, "flags": ["SYN"], "window": 65535}
      pa = "01bb" + "c350" + "000000c8" + "00000065" + "5018" + "0400" + "0000" + "0000"
      r = parse_tcp(pa)
      assert r["flags"] == ["PSH", "ACK"] and r["src_port"] == 443 and r["ack"] == 101 and r["window"] == 1024
      assert parse_tcp("c350 01bb 00000064 00000000 5012 ffff 0000 0000")["flags"] == ["SYN", "ACK"]
  - name: all bits and errors
    code: |
      allflags = "0000" + "0050" + "ffffffff" + "00000000" + "603f" + "0001" + "0000" + "0000" + "00000000"
      r = parse_tcp(allflags)
      assert r["flags"] == ["FIN", "SYN", "RST", "PSH", "ACK", "URG"] and r["header_bytes"] == 24 and r["seq"] == 4294967295 and r["dst_port"] == 80
      assert parse_tcp("0000" * 6 + "5000" + "0000" * 3)["flags"] == []
      for text, msg in (("0000", "too short"), ("0000" * 6 + "4000" + "0000" * 3, "bad header length"), ("", "too short")):
