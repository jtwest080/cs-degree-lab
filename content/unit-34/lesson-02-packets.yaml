exercises:
- id: checksum
  title: The internet checksum
  difficulty: 4
  prompt: 'Cables and routers make mistakes. To notice, every packet carries a small number computed from its content. Write `internet_checksum(hexstr)`. Every IP header carries a 16-bit **checksum** so that a router can notice damage. The method (the ''internet checksum''): read the bytes as 16-bit numbers (two bytes each, the first one is the high one; if the number of bytes is odd, add a zero byte at the end), add them all up, then ''fold'' every carry back in (while the sum is above 0xFFFF, add the high part to the low part: (s & 0xFFFF) + (s >> 16)) and finally return the bitwise complement within 16 bits (0xFFFF - s). Input: a text of hexadecimal digits, blanks allowed anywhere. ValueError(''bad hex'') if it is not valid hexadecimal (an odd number of digits counts as not valid).'
  starter: |-
    def internet_checksum(hexstr):
        """Every IP header carries a 16-bit **checksum** so that a router can notice damage. The method (the 'internet checksum'): read the bytes as 16-bit numbers (two bytes each, the first one is the high one; if the number of bytes is odd, add a zero byte at the end), add them all up, then 'fold' every carry back in (while the sum is above 0xFFFF, add the high part to the low part: (s & 0xFFFF) + (s >> 16)) and finally return the bitwise complement within 16 bits (0xFFFF - s). Input: a text of hexadecimal digits, blanks allowed anywhere. ValueError('bad hex') if it is not valid hexadecimal (an odd number of digits counts as not valid)."""
        pass
  tests:
  - name: known values
    code: |
      assert internet_checksum("45 00 00 73 00 00 40 00 40 11 00 00 c0 a8 00 01 c0 a8 00 c7") == 0xB861
      assert internet_checksum("") == 0xFFFF and internet_checksum("0000") == 0xFFFF and internet_checksum("ffff") == 0 and internet_checksum("0001") == 0xFFFE
  - name: carries, padding and errors
    code: |
      assert internet_checksum("ffff0001") == 0xFFFE and internet_checksum("ff") == 0x00FF and internet_checksum("0102 03") == 0xFBFD
      assert internet_checksum("4500005400004000400600000a0000015db8d822") == 0xFAC8
      assert internet_checksum("45000054000040004006fac80a0000015db8d822") == 0
      for text in ("zz", "123", "0x12"):
          try:
              internet_checksum(text)
              raise AssertionError("accepted")
          except ValueError as e:
              assert str(e) == "bad hex"
  hints:
  - bytes.fromhex turns hexadecimal text into bytes (and ignores blanks).
  - 'Add bytes two at a time: (high << 8) | low.'
  solution: |
    def internet_checksum(hexstr):
        """Every IP header carries a 16-bit **checksum** so that a router can notice damage. The method (the 'internet checksum'): read the bytes as 16-bit numbers (two bytes each, the first one is the high one; if the number of bytes is odd, add a zero byte at the end), add them all up, then 'fold' every carry back in (while the sum is above 0xFFFF, add the high part to the low part: (s & 0xFFFF) + (s >> 16)) and finally return the bitwise complement within 16 bits (0xFFFF - s). Input: a text of hexadecimal digits, blanks allowed anywhere. ValueError('bad hex') if it is not valid hexadecimal (an odd number of digits counts as not valid)."""
        try:
            data = bytes.fromhex(hexstr)
        except ValueError:
            raise ValueError("bad hex")
        if len(data) % 2:
            data += b"\x00"
        total = 0
        for i in range(0, len(data), 2):
            total += (data[i] << 8) | data[i + 1]
        while total > 0xFFFF:
            total = (total & 0xFFFF) + (total >> 16)
        return 0xFFFF - total
  explanation: A checksum only finds accidents. It cannot stop an attacker, who can simply compute a new one. Security needs cryptography (see the Security unit).
- id: ipv4
  title: Reading an IP header
  difficulty: 5
  prompt: 'Every packet on the internet begins with an IP header, a few bytes in an exact layout that every router reads. Write `parse_ipv4(hexstr)`. An IPv4 packet starts with a header. Its first byte holds the version (the high 4 bits, always 4) and the header length in 32-bit words (the low 4 bits, at least 5). Then: byte 2-3 total length; byte 8 TTL (time to live); byte 9 protocol (1 = ''ICMP'', 6 = ''TCP'', 17 = ''UDP'', anything else the number as text); byte 10-11 the checksum; byte 12-15 the source address; byte 16-19 the destination address (each written as four numbers separated by dots). The input is the packet as hexadecimal text (blanks allowed). Return {''version'', ''header_bytes'' (the header length in bytes), ''total_length'', ''ttl'', ''protocol'', ''src'', ''dst'', ''checksum_ok''} where checksum_ok is True if the internet_checksum of the header bytes (all header_bytes, including the checksum field) is 0. Errors (ValueError): ''too short'' if there are fewer than 20 bytes or fewer bytes than the header length says, ''not IPv4'' if the version is not 4, ''bad header length'' if the length is below 5 words. Check in this order: too short (20), version, header length, too short (header).'
