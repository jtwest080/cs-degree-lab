        pass
  tests:
  - name: a good packet
    code: |
      pkt = "45000054000040004006fac80a0000015db8d822"
      assert parse_ipv4(pkt) == {"version": 4, "header_bytes": 20, "total_length": 84, "ttl": 64, "protocol": "TCP", "src": "10.0.0.1", "dst": "93.184.216.34", "checksum_ok": True}
      bad = "45000054000040003f06fac80a0000015db8d822"
      r = parse_ipv4(bad)
      assert r["ttl"] == 63 and r["checksum_ok"] is False
      udp = "4500001c000040004011" + "0000" + "c0a80001c0a800c7"
      udp = udp[:20] + "%04x" % internet_checksum(udp) + udp[24:]
      assert parse_ipv4(udp)["protocol"] == "UDP" and parse_ipv4(udp)["checksum_ok"] is True and parse_ipv4(udp)["src"] == "192.168.0.1"
      assert parse_ipv4(pkt.replace("4006", "4001"))["protocol"] == "ICMP" and parse_ipv4(pkt.replace("4006", "402f"))["protocol"] == "47"
  - name: errors
    code: |
      cases = (("45", "too short"), ("60" + "00" * 19, "not IPv4"), ("41" + "00" * 19, "bad header length"), ("46" + "00" * 19, "too short"), ("", "too short"))
      for text, msg in cases:
          try:
              parse_ipv4(text)
              raise AssertionError("accepted " + text)
          except ValueError as e:
              assert str(e) == msg, (text, str(e))
      long = "46000018" + "00" * 8 + "0a000001" + "5db8d822" + "00000000"
      r = parse_ipv4(long)
      assert r["header_bytes"] == 24 and r["dst"] == "93.184.216.34"
  hints:
  - bytes.fromhex(text) gives numbers 0-255 to index.
  - The checksum of a correct header, including its checksum field, is 0.
