        header = data[:words * 4]
        return {"version": 4, "header_bytes": words * 4, "total_length": (data[2] << 8) | data[3], "ttl": data[8],
                "protocol": protocols.get(data[9], str(data[9])), "src": ".".join(str(b) for b in data[12:16]),
                "dst": ".".join(str(b) for b in data[16:20]), "checksum_ok": internet_checksum(header.hex()) == 0}
  explanation: The TTL starts at about 64 and each router subtracts one. A packet with TTL 0 is thrown away, so a routing loop cannot go on forever. This is how traceroute works.
- id: tcpheader
  title: Reading a TCP header
  difficulty: 4
  prompt: 'Inside the IP packet sits the TCP segment, with its own header that makes the connection reliable. Write `parse_tcp(hexstr)`. A TCP segment starts with its header (hexadecimal text, blanks allowed): bytes 0-1 source port, 2-3 destination port, 4-7 sequence number, 8-11 acknowledgment number (all big-endian, the high byte first), byte 12 the header length in 32-bit words in its high 4 bits (at least 5), byte 13 the flags, bytes 14-15 the window size. The flag bits, from the lowest: FIN (1), SYN (2), RST (4), PSH (8), ACK (16), URG (32). Return {''src_port'', ''dst_port'', ''seq'', ''ack'', ''header_bytes'', ''flags'' (the list of the names of the set flags in the order FIN, SYN, RST, PSH, ACK, URG), ''window''}. ValueError(''too short'') for fewer than 20 bytes, ValueError(''bad header length'') for a header length below 5 words (check the length of the data first).'
  starter: |-
    def parse_tcp(hexstr):
        """A TCP segment starts with its header (hexadecimal text, blanks allowed): bytes 0-1 source port, 2-3 destination port, 4-7 sequence number, 8-11 acknowledgment number (all big-endian, the high byte first), byte 12 the header length in 32-bit words in its high 4 bits (at least 5), byte 13 the flags, bytes 14-15 the window size. The flag bits, from the lowest: FIN (1), SYN (2), RST (4), PSH (8), ACK (16), URG (32). Return {'src_port', 'dst_port', 'seq', 'ack', 'header_bytes', 'flags' (the list of the names of the set flags in the order FIN, SYN, RST, PSH, ACK, URG), 'window'}. ValueError('too short') for fewer than 20 bytes, ValueError('bad header length') for a header length below 5 words (check the length of the data first)."""
