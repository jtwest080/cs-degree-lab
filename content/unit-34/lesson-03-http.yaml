    def parse_http(text):
        """Every web page is fetched with a text conversation. A REQUEST looks like 'GET /search?q=cats HTTP/1.1' then header lines 'Host: example.com', a blank line and an optional body. A RESPONSE starts with 'HTTP/1.1 404 Not Found' (the reason may be missing) then headers, a blank line and the body. Lines end with '\\n' or '\\r\\n' (treat both the same). Parse the text. The first line decides: if it starts with 'HTTP/' it is a response, else a request. Header lines are 'Name: value' (split at the FIRST colon, strip both sides); names are turned into lower case; a name that occurs twice gets its values joined with ', '. The headers end at the first blank line; everything after it (unchanged) is the 'body' ('' if there is none). Return for a request {'kind': 'request', 'method', 'path' (without the query), 'query' (parse_query of the text after the first '?', {} if none), 'version', 'headers', 'body'}; for a response {'kind': 'response', 'version', 'status' (int), 'reason' (the rest of the line, '' if none), 'headers', 'body'}. ValueError('bad request line') if a request line does not have exactly three parts separated by blanks or its version does not start with 'HTTP/'; ValueError('bad status line') if the status is not a whole number; ValueError('bad header line N') for a header line without a colon (N counts the lines of the whole text from 1)."""
        pass
  tests:
  - name: request and response
    code: |
      req = "GET /search?q=cats&page=2 HTTP/1.1\r\nHost: example.com\r\nAccept: a\r\naccept: b\r\n\r\nbody here\n"
      assert parse_http(req) == {"kind": "request", "method": "GET", "path": "/search", "query": {"q": ["cats"], "page": ["2"]}, "version": "HTTP/1.1", "headers": {"host": "example.com", "accept": "a, b"}, "body": "body here\n"}
      r = parse_http("HTTP/1.1 404 Not Found\nContent-Type: text/html\n\n<h1>x</h1>")
      assert r == {"kind": "response", "version": "HTTP/1.1", "status": 404, "reason": "Not Found", "headers": {"content-type": "text/html"}, "body": "<h1>x</h1>"}
      assert parse_http("HTTP/2 204\n\n") == {"kind": "response", "version": "HTTP/2", "status": 204, "reason": "", "headers": {}, "body": ""}
  - name: errors and shapes
    code: |
      for text, msg in (("GET /", "bad request line"), ("GET / FTP/1", "bad request line"), ("", "bad request line"), ("HTTP/1.1 abc", "bad status line"), ("HTTP/1.1", "bad status line"), ("GET / HTTP/1.1\nbadheader\n\n", "bad header line 2"), ("GET / HTTP/1.1\nA: b\n: c\n", "bad header line 3")):
          try:
              parse_http(text)
              raise AssertionError("accepted " + repr(text))
          except ValueError as e:
              assert str(e) == msg, (text, str(e))
      r = parse_http("POST /api HTTP/1.1\nContent-Type: a: b\n\nx=1&y=2\n\nmore")
      assert r["method"] == "POST" and r["query"] == {} and r["headers"] == {"content-type": "a: b"} and r["body"] == "x=1&y=2\n\nmore"
      assert parse_http("GET /a?b HTTP/1.0")["query"] == {"b": [""]} and parse_http("GET / HTTP/1.1")["body"] == ""
  hints:
  - Replace '\r\n' by '\n' first, then partition at the first blank line '\n\n'.
  - Collect the headers in a dict and join repeated names.
