    def parse_query(qs):
        """The part of a web address after the '?' is the **query string**, such as 'q=hello+world&tag=a&tag=b%26c'. Return a dict {name: [values]} in which every name has the list of all its values in order. Pairs are separated by '&' (empty pairs are ignored) and name and value by the FIRST '=' (a pair without '=' has the value ''). Decode names and values: a plus sign means a blank, and '%' followed by two hexadecimal digits is one byte (so %26 is '&', and several %XX in a row form UTF-8 text, for example %C3%A9 is the letter 'é'). A '%' that is not followed by two hexadecimal digits stays as it is. Bytes that are not valid UTF-8 are replaced by the character '\\ufffd' (use errors='replace')."""
        def decode(text):
            raw = bytearray()
            i, text = 0, text.replace("+", " ")
            while i < len(text):
                ch = text[i]
                if ch == "%" and len(text[i + 1:i + 3]) == 2 and all(c in "0123456789abcdefABCDEF" for c in text[i + 1:i + 3]):
                    raw.append(int(text[i + 1:i + 3], 16))
                    i += 3
                else:
                    raw.extend(ch.encode("utf-8"))
                    i += 1
            return raw.decode("utf-8", errors="replace")
        result = {}
        for pair in qs.split("&"):
            if not pair:
                continue
            name, _, value = pair.partition("=")
            result.setdefault(decode(name), []).append(decode(value))
        return result




    def parse_http(text):
        """Every web page is fetched with a text conversation. A REQUEST looks like 'GET /search?q=cats HTTP/1.1' then header lines 'Host: example.com', a blank line and an optional body. A RESPONSE starts with 'HTTP/1.1 404 Not Found' (the reason may be missing) then headers, a blank line and the body. Lines end with '\\n' or '\\r\\n' (treat both the same). Parse the text. The first line decides: if it starts with 'HTTP/' it is a response, else a request. Header lines are 'Name: value' (split at the FIRST colon, strip both sides); names are turned into lower case; a name that occurs twice gets its values joined with ', '. The headers end at the first blank line; everything after it (unchanged) is the 'body' ('' if there is none). Return for a request {'kind': 'request', 'method', 'path' (without the query), 'query' (parse_query of the text after the first '?', {} if none), 'version', 'headers', 'body'}; for a response {'kind': 'response', 'version', 'status' (int), 'reason' (the rest of the line, '' if none), 'headers', 'body'}. ValueError('bad request line') if a request line does not have exactly three parts separated by blanks or its version does not start with 'HTTP/'; ValueError('bad status line') if the status is not a whole number; ValueError('bad header line N') for a header line without a colon (N counts the lines of the whole text from 1)."""
        text = text.replace("\r\n", "\n")
        head, sep, body = text.partition("\n\n")
        lines = head.split("\n")
        first = lines[0].split()
        headers = {}
        for n, line in enumerate(lines[1:], 2):
            name, colon, value = line.partition(":")
            if not colon or not name.strip():
                raise ValueError("bad header line " + str(n))
            key = name.strip().lower()
            headers[key] = headers[key] + ", " + value.strip() if key in headers else value.strip()
        if lines[0].startswith("HTTP/"):
            parts = lines[0].split(None, 2)
            if len(parts) < 2 or not parts[1].isdigit():
                raise ValueError("bad status line")
            return {"kind": "response", "version": parts[0], "status": int(parts[1]), "reason": parts[2].strip() if len(parts) > 2 else "", "headers": headers, "body": body}
        if len(first) != 3 or not first[2].startswith("HTTP/"):
            raise ValueError("bad request line")
        path, _, qs = first[1].partition("?")
        return {"kind": "request", "method": first[0], "path": path, "query": parse_query(qs), "version": first[2], "headers": headers, "body": body}
  explanation: 'The headers carry the agreements: who you ask (Host), what you can read (Accept), what you send (Content-Type, Content-Length), who you are (Cookie, Authorization) and how long to keep the answer (Cache-Control).'
- id: cookie
  title: Is this cookie safe?
  difficulty: 4
  prompt: 'HTTP forgets you after every request, so the server hands you a **cookie** that you show again next time. A careless cookie is a security hole, so reviewers check its attributes. Write `audit_cookie(header)`. A server sets a cookie with a header value such as ''session=abc123; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax'': first name=value (split at the first ''=''), then attributes separated by '';'' which are either flags (Secure) or Name=value pairs; attribute names are not case sensitive. Return {''name'', ''value'', ''problems''} where problems is the list of texts, in this order: ''missing Secure'' (the cookie would also travel over unencrypted http), ''missing HttpOnly'' (scripts on the page could read it), ''missing SameSite'' (no protection against forged requests from other sites) and ''SameSite=None needs Secure'' (SameSite is None but Secure is missing). ValueError(''bad cookie'') if the first part has no ''='' or an empty name.'
  starter: |-
    def audit_cookie(header):
        """A server sets a cookie with a header value such as 'session=abc123; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax': first name=value (split at the first '='), then attributes separated by ';' which are either flags (Secure) or Name=value pairs; attribute names are not case sensitive. Return {'name', 'value', 'problems'} where problems is the list of texts, in this order: 'missing Secure' (the cookie would also travel over unencrypted http), 'missing HttpOnly' (scripts on the page could read it), 'missing SameSite' (no protection against forged requests from other sites) and 'SameSite=None needs Secure' (SameSite is None but Secure is missing). ValueError('bad cookie') if the first part has no '=' or an empty name."""
        pass
  tests:
  - name: audit
    code: |
      assert audit_cookie("session=abc123; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax") == {"name": "session", "value": "abc123", "problems": []}
      assert audit_cookie("a=b; samesite=None") == {"name": "a", "value": "b", "problems": ["missing Secure", "missing HttpOnly", "SameSite=None needs Secure"]}
      assert audit_cookie("x=; SECURE; httponly") == {"name": "x", "value": "", "problems": ["missing SameSite"]}
  - name: odd shapes
    code: |
      assert audit_cookie("id=a=b=c; Secure; HttpOnly; SameSite=None")["value"] == "a=b=c" and audit_cookie("id=a=b=c; Secure; HttpOnly; SameSite=None")["problems"] == []
      assert audit_cookie("t=1;;Secure;HttpOnly;SameSite=Strict") == {"name": "t", "value": "1", "problems": []}
      assert audit_cookie("  n = v ; Secure")["name"] == "n" and audit_cookie("n=v")["problems"] == ["missing Secure", "missing HttpOnly", "missing SameSite"]
      for text in ("novalue", "=x", "", "; Secure"):
          try:
              audit_cookie(text)
              raise AssertionError("accepted")
          except ValueError as e:
              assert str(e) == "bad cookie"
  hints:
  - Split at ';', then split the first part at the first '='.
  - Store the attribute names in lower case in a dict.
  solution: |
    def audit_cookie(header):
        """A server sets a cookie with a header value such as 'session=abc123; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax': first name=value (split at the first '='), then attributes separated by ';' which are either flags (Secure) or Name=value pairs; attribute names are not case sensitive. Return {'name', 'value', 'problems'} where problems is the list of texts, in this order: 'missing Secure' (the cookie would also travel over unencrypted http), 'missing HttpOnly' (scripts on the page could read it), 'missing SameSite' (no protection against forged requests from other sites) and 'SameSite=None needs Secure' (SameSite is None but Secure is missing). ValueError('bad cookie') if the first part has no '=' or an empty name."""
        parts = [p.strip() for p in header.split(";")]
        name, eq, value = parts[0].partition("=")
        if not eq or not name.strip():
            raise ValueError("bad cookie")
        attrs = {}
        for p in parts[1:]:
            if not p:
                continue
            k, _, v = p.partition("=")
            attrs[k.strip().lower()] = v.strip()
        problems = []
        if "secure" not in attrs:
            problems.append("missing Secure")
        if "httponly" not in attrs:
            problems.append("missing HttpOnly")
        if "samesite" not in attrs:
            problems.append("missing SameSite")
        elif attrs["samesite"].lower() == "none" and "secure" not in attrs:
            problems.append("SameSite=None needs Secure")
        return {"name": name.strip(), "value": value.strip(), "problems": problems}
  explanation: Secure keeps the cookie off plain http, HttpOnly hides it from scripts (so a cross-site scripting bug cannot steal it) and SameSite stops other sites from making your browser send it along.
- id: cache
  title: Can I reuse my copy?
  difficulty: 3
  prompt: 'The fastest request is the one that is never made. Write `cache_check(headers, age)`. Browsers and servers in between keep copies of answers (a **cache**) so that they do not have to ask again. The header Cache-Control says how. `headers` is a dict with lower case names. Take the value of ''cache-control'' (it may be missing), split it at commas, strip the blanks and ignore the case. Decide, for a copy that is `age` seconds old: ''uncacheable'' if the directive no-store is present; else ''revalidate'' if no-cache is present (the copy may only be used after asking the server whether it is still current); else, if max-age=N is present, ''fresh'' when age < N and ''stale'' otherwise; else (no information about freshness) ''stale''.'
  starter: |-
    def cache_check(headers, age):
        """Browsers and servers in between keep copies of answers (a **cache**) so that they do not have to ask again. The header Cache-Control says how. `headers` is a dict with lower case names. Take the value of 'cache-control' (it may be missing), split it at commas, strip the blanks and ignore the case. Decide, for a copy that is `age` seconds old: 'uncacheable' if the directive no-store is present; else 'revalidate' if no-cache is present (the copy may only be used after asking the server whether it is still current); else, if max-age=N is present, 'fresh' when age < N and 'stale' otherwise; else (no information about freshness) 'stale'."""
        pass
  tests:
  - name: directives
    code: |
      assert [cache_check({"cache-control": v}, 50) for v in ("max-age=60", "max-age=50", "No-Cache, max-age=60", "no-store", "public, max-age=abc", "private")] == ["fresh", "stale", "revalidate", "uncacheable", "stale", "stale"]
      assert cache_check({}, 0) == "stale" and cache_check({"content-type": "x"}, 5) == "stale"
  - name: details
    code: |
      assert cache_check({"cache-control": "public, max-age=3600"}, 0) == "fresh" and cache_check({"cache-control": "max-age=0"}, 0) == "stale"
      assert cache_check({"cache-control": " max-age=10 ,  no-store "}, 1) == "uncacheable" and cache_check({"cache-control": "NO-STORE"}, 1) == "uncacheable"
      assert cache_check({"cache-control": "no-cache"}, 10 ** 9) == "revalidate" and cache_check({"cache-control": "max-age=60,"}, 59) == "fresh"
  hints:
  - Turn the header into a list of lower case directives.
  - Check no-store first, then no-cache, then max-age.
  solution: |
    def cache_check(headers, age):
        """Browsers and servers in between keep copies of answers (a **cache**) so that they do not have to ask again. The header Cache-Control says how. `headers` is a dict with lower case names. Take the value of 'cache-control' (it may be missing), split it at commas, strip the blanks and ignore the case. Decide, for a copy that is `age` seconds old: 'uncacheable' if the directive no-store is present; else 'revalidate' if no-cache is present (the copy may only be used after asking the server whether it is still current); else, if max-age=N is present, 'fresh' when age < N and 'stale' otherwise; else (no information about freshness) 'stale'."""
        value = headers.get("cache-control", "")
        parts = [p.strip().lower() for p in value.split(",") if p.strip()]
        if "no-store" in parts:
            return "uncacheable"
        if "no-cache" in parts:
            return "revalidate"
        for p in parts:
            if p.startswith("max-age="):
                try:
                    return "fresh" if age < int(p[8:]) else "stale"
                except ValueError:
                    return "stale"
        return "stale"
  explanation: Static files (images, scripts) get a long max-age and a new file name when they change; pages with personal data get private or no-store, so that a shared cache never keeps them.
- id: redirects
  title: Following the signposts
  difficulty: 4
  prompt: 'Addresses move, sites switch from http to https and links get shortened. Write `follow_redirects(pages, start, max_hops)`. A web address often answers ''go there instead''. `pages` is a dict {address: (status, location)} (location is None when there is none). Follow the chain from `start`. The redirect statuses are 301, 302, 303, 307 and 308; a redirect needs a location, which may be relative (use urllib.parse.urljoin(current, location)). Return {''chain'' (the list of addresses visited, start first), ''final'' (the last address), ''result''}. The result is: ''missing'' if the current address is not in pages (it is still the last in the chain); ''loop'' if the next address is already in the chain (add it to the chain, then stop); ''ok'' if the status is 200 to 299; ''error N'' (N is the status) for any other status without redirect, including a redirect without location; ''too many redirects'' if the chain would need more than max_hops redirects (stop after following max_hops redirects and finding yet another).'
  starter: |-
    def follow_redirects(pages, start, max_hops):
        """A web address often answers 'go there instead'. `pages` is a dict {address: (status, location)} (location is None when there is none). Follow the chain from `start`. The redirect statuses are 301, 302, 303, 307 and 308; a redirect needs a location, which may be relative (use urllib.parse.urljoin(current, location)). Return {'chain' (the list of addresses visited, start first), 'final' (the last address), 'result'}. The result is: 'missing' if the current address is not in pages (it is still the last in the chain); 'loop' if the next address is already in the chain (add it to the chain, then stop); 'ok' if the status is 200 to 299; 'error N' (N is the status) for any other status without redirect, including a redirect without location; 'too many redirects' if the chain would need more than max_hops redirects (stop after following max_hops redirects and finding yet another)."""
        pass
  tests:
  - name: chains
    code: |
      P = {"http://a.com/old": (301, "/new"), "http://a.com/new": (302, "https://b.com/x"), "https://b.com/x": (200, None), "http://a.com/loop1": (302, "/loop2"), "http://a.com/loop2": (302, "/loop1"), "http://a.com/nf": (404, None), "http://a.com/nol": (302, None)}
      assert follow_redirects(P, "http://a.com/old", 5) == {"chain": ["http://a.com/old", "http://a.com/new", "https://b.com/x"], "final": "https://b.com/x", "result": "ok"}
      assert follow_redirects(P, "http://a.com/loop1", 5) == {"chain": ["http://a.com/loop1", "http://a.com/loop2", "http://a.com/loop1"], "final": "http://a.com/loop1", "result": "loop"}
      assert follow_redirects(P, "http://a.com/nf", 5) == {"chain": ["http://a.com/nf"], "final": "http://a.com/nf", "result": "error 404"}
      assert follow_redirects(P, "http://a.com/nol", 5)["result"] == "error 302" and follow_redirects(P, "http://zzz/", 5) == {"chain": ["http://zzz/"], "final": "http://zzz/", "result": "missing"}
  - name: limits
    code: |
      P = {"http://a.com/old": (301, "/new"), "http://a.com/new": (302, "https://b.com/x"), "https://b.com/x": (200, None)}
      assert follow_redirects(P, "http://a.com/old", 1) == {"chain": ["http://a.com/old", "http://a.com/new"], "final": "http://a.com/new", "result": "too many redirects"}
      assert follow_redirects(P, "http://a.com/old", 2)["result"] == "ok" and follow_redirects(P, "http://a.com/old", 0)["chain"] == ["http://a.com/old"]
      Q = {"http://x/a": (307, "b"), "http://x/b": (308, "http://x/c?q=1"), "http://x/c?q=1": (204, None), "http://x/self": (301, "self")}
      assert follow_redirects(Q, "http://x/a", 3) == {"chain": ["http://x/a", "http://x/b", "http://x/c?q=1"], "final": "http://x/c?q=1", "result": "ok"}
      assert follow_redirects(Q, "http://x/self", 3) == {"chain": ["http://x/self", "http://x/self"], "final": "http://x/self", "result": "loop"}
  hints:
  - urllib.parse.urljoin(current, location) resolves relative addresses.
  - Count the redirects you have followed and compare with max_hops before following another.
  solution: |
    def follow_redirects(pages, start, max_hops):
        """A web address often answers 'go there instead'. `pages` is a dict {address: (status, location)} (location is None when there is none). Follow the chain from `start`. The redirect statuses are 301, 302, 303, 307 and 308; a redirect needs a location, which may be relative (use urllib.parse.urljoin(current, location)). Return {'chain' (the list of addresses visited, start first), 'final' (the last address), 'result'}. The result is: 'missing' if the current address is not in pages (it is still the last in the chain); 'loop' if the next address is already in the chain (add it to the chain, then stop); 'ok' if the status is 200 to 299; 'error N' (N is the status) for any other status without redirect, including a redirect without location; 'too many redirects' if the chain would need more than max_hops redirects (stop after following max_hops redirects and finding yet another)."""
        from urllib.parse import urljoin
        chain, cur, hops = [start], start, 0
        while True:
            if cur not in pages:
                return {"chain": chain, "final": cur, "result": "missing"}
            status, loc = pages[cur]
            if status in (301, 302, 303, 307, 308) and loc:
                if hops >= max_hops:
                    return {"chain": chain, "final": cur, "result": "too many redirects"}
                nxt = urljoin(cur, loc)
                hops += 1
                if nxt in chain:
                    chain.append(nxt)
                    return {"chain": chain, "final": nxt, "result": "loop"}
                chain.append(nxt)
                cur = nxt
                continue
            return {"chain": chain, "final": cur, "result": "ok" if 200 <= status < 300 else "error " + str(status)}
  explanation: Browsers stop after about 20 redirects. A redirect from http to https is how most sites force an encrypted connection; 301 and 308 are permanent (cached), 302 and 307 temporary.
commonMistakes:
- title: Building a query string by gluing text
  explanation: An & or = inside a value changes the meaning.
- title: Changing data with GET
  explanation: Caches, crawlers and prefetching repeat GET requests.
- title: Cookies without Secure and HttpOnly
  explanation: They can be stolen from the network or by a script.
- title: Caching private pages in shared caches
  explanation: Another person could see them.
- title: Endless redirect loops
  explanation: Two rules that send the visitor to each other.
summary:
- HTTP is a text conversation of requests and responses.
- The first digit of a status code tells who made the mistake.
- Percent escapes carry special characters in addresses.
- Cookies need Secure, HttpOnly and SameSite.
- Cache-Control decides if a copy may be reused, and redirects can loop.
