- type: code
  question: Write `status_group(code)` returning 'success' for 200-299, 'redirect' for 300-399, 'client error' for 400-499, 'server error' for 500-599 and 'other' for anything else.
  starter: |
    def status_group(code):
        pass
  tests:
  - name: groups
    code: |
      assert status_group(200) == "success" and status_group(299) == "success" and status_group(301) == "redirect" and status_group(404) == "client error" and status_group(503) == "server error" and status_group(100) == "other" and status_group(600) == "other"
  solution: |
    def status_group(code):
        if 200 <= code < 300:
            return "success"
        if 300 <= code < 400:
            return "redirect"
        if 400 <= code < 500:
            return "client error"
        if 500 <= code < 600:
            return "server error"
        return "other"
