- id: query
  title: The text after the question mark
  difficulty: 4
  prompt: 'When you search for ''cats & dogs'' your browser asks for `/search?q=cats+%26+dogs`: special characters are written as a percent sign and two hexadecimal digits. Write `parse_query(qs)`. The part of a web address after the ''?'' is the **query string**, such as ''q=hello+world&tag=a&tag=b%26c''. Return a dict {name: [values]} in which every name has the list of all its values in order. Pairs are separated by ''&'' (empty pairs are ignored) and name and value by the FIRST ''='' (a pair without ''='' has the value ''''). Decode names and values: a plus sign means a blank, and ''%'' followed by two hexadecimal digits is one byte (so %26 is ''&'', and several %XX in a row form UTF-8 text, for example %C3%A9 is the letter ''é''). A ''%'' that is not followed by two hexadecimal digits stays as it is. Bytes that are not valid UTF-8 are replaced by the character ''\ufffd'' (use errors=''replace'').'
  starter: |-
    def parse_query(qs):
        """The part of a web address after the '?' is the **query string**, such as 'q=hello+world&tag=a&tag=b%26c'. Return a dict {name: [values]} in which every name has the list of all its values in order. Pairs are separated by '&' (empty pairs are ignored) and name and value by the FIRST '=' (a pair without '=' has the value ''). Decode names and values: a plus sign means a blank, and '%' followed by two hexadecimal digits is one byte (so %26 is '&', and several %XX in a row form UTF-8 text, for example %C3%A9 is the letter 'é'). A '%' that is not followed by two hexadecimal digits stays as it is. Bytes that are not valid UTF-8 are replaced by the character '\\ufffd' (use errors='replace')."""
        pass
  tests:
  - name: decoding
    code: |
      r = parse_query("q=hello+world&tag=a&tag=b%26c&&x&y=%C3%A9&z=%zz&w=100%&e=%FF")
      assert r == {"q": ["hello world"], "tag": ["a", "b&c"], "x": [""], "y": ["\u00e9"], "z": ["%zz"], "w": ["100%"], "e": ["\ufffd"]}
      assert parse_query("") == {} and parse_query("&&") == {} and parse_query("a=1=2") == {"a": ["1=2"]}
  - name: names and repeats
    code: |
      assert parse_query("a=1&a=2&b=3&a=") == {"a": ["1", "2", ""], "b": ["3"]}
      assert parse_query("n%61me=v%41lue") == {"name": ["vAlue"]} and parse_query("%41") == {"A": [""]} and parse_query("a=%4") == {"a": ["%4"]}
      assert parse_query("a+b=c+d") == {"a b": ["c d"]} and parse_query("k=%E2%82%AC") == {"k": ["\u20ac"]}
  hints:
  - Collect the bytes of the decoded text in a bytearray, then decode them as UTF-8.
  - str.partition('=') splits at the first equals sign only.
  solution: |
    def parse_query(qs):
        """The part of a web address after the '?' is the **query string**, such as 'q=hello+world&tag=a&tag=b%26c'. Return a dict {name: [values]} in which every name has the list of all its values in order. Pairs are separated by '&' (empty pairs are ignored) and name and value by the FIRST '=' (a pair without '=' has the value ''). Decode names and values: a plus sign means a blank, and '%' followed by two hexadecimal digits is one byte (so %26 is '&', and several %XX in a row form UTF-8 text, for example %C3%A9 is the letter 'é'). A '%' that is not followed by two hexadecimal digits stays as it is. Bytes that are not valid UTF-8 are replaced by the character '\\ufffd' (use errors='replace')."""
        def decode(text):
            raw = bytearray()
            i, text = 0, text.replace("+", " ")
            while i < len(text):
                ch = text[i]
                if ch == "%" and len(text[i + 1:i + 3]) == 2 and all(c in "0123456789abcdefABCDEF" for c in text[i + 1:i + 3]):
                    raw.append(int(text[i + 1:i + 3], 16))
                    i += 3
                else:
                    raw.extend(ch.encode("utf-8"))
                    i += 1
            return raw.decode("utf-8", errors="replace")
        result = {}
        for pair in qs.split("&"):
            if not pair:
                continue
            name, _, value = pair.partition("=")
            result.setdefault(decode(name), []).append(decode(value))
        return result
  explanation: 'Never build a query string by gluing text together: a value with an & in it would change the meaning. Use a library function that encodes (urllib.parse.urlencode in Python).'
- id: http
  title: A web conversation as text
  difficulty: 5
  prompt: 'Under all the pictures and buttons, the web is plain text sent back and forth. Write `parse_http(text)`. Every web page is fetched with a text conversation. A REQUEST looks like ''GET /search?q=cats HTTP/1.1'' then header lines ''Host: example.com'', a blank line and an optional body. A RESPONSE starts with ''HTTP/1.1 404 Not Found'' (the reason may be missing) then headers, a blank line and the body. Lines end with ''\n'' or ''\r\n'' (treat both the same). Parse the text. The first line decides: if it starts with ''HTTP/'' it is a response, else a request. Header lines are ''Name: value'' (split at the FIRST colon, strip both sides); names are turned into lower case; a name that occurs twice gets its values joined with '', ''. The headers end at the first blank line; everything after it (unchanged) is the ''body'' ('''' if there is none). Return for a request {''kind'': ''request'', ''method'', ''path'' (without the query), ''query'' (parse_query of the text after the first ''?'', {} if none), ''version'', ''headers'', ''body''}; for a response {''kind'': ''response'', ''version'', ''status'' (int), ''reason'' (the rest of the line, '''' if none), ''headers'', ''body''}. ValueError(''bad request line'') if a request line does not have exactly three parts separated by blanks or its version does not start with ''HTTP/''; ValueError(''bad status line'') if the status is not a whole number; ValueError(''bad header line N'') for a header line without a colon (N counts the lines of the whole text from 1).'
  starter: |-
    def parse_query(qs):
        """The part of a web address after the '?' is the **query string**, such as 'q=hello+world&tag=a&tag=b%26c'. Return a dict {name: [values]} in which every name has the list of all its values in order. Pairs are separated by '&' (empty pairs are ignored) and name and value by the FIRST '=' (a pair without '=' has the value ''). Decode names and values: a plus sign means a blank, and '%' followed by two hexadecimal digits is one byte (so %26 is '&', and several %XX in a row form UTF-8 text, for example %C3%A9 is the letter 'é'). A '%' that is not followed by two hexadecimal digits stays as it is. Bytes that are not valid UTF-8 are replaced by the character '\\ufffd' (use errors='replace')."""
