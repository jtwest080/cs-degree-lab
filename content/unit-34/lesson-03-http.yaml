id: u34-http
title: HTTP, Cookies and Caching
minutes: 110
objective: Read the plain-text conversation behind every web page. You will decode query strings, parse requests and responses, audit a cookie, decide whether a cached copy can be reused and follow a chain of redirects.
outcomes:
- Read an HTTP request and response
- Decode a query string with percent escapes
- Explain status codes and common headers
- Judge the safety of a cookie
- Use Cache-Control to decide if a copy is fresh
- Follow redirects and spot loops
sections:
- heading: A conversation of text
  body: |-
    **HTTP** (HyperText Transfer Protocol) is the language of the web, and at heart it is text. The client (your **browser**, or a program) sends a **request**:

    `GET /search?q=cats HTTP/1.1` ← the **method** (GET, POST, PUT, DELETE), the **path** and **query**, and the version
    `Host: example.com` ← **headers**, one `Name: value` per line
    (a blank line, and then an optional **body**, for example the data of a form)

    and the server sends a **response**: a **status line** (`HTTP/1.1 200 OK`), headers (`Content-Type: text/html`, `Content-Length: 5120`) and the body, the page itself. **Status codes** are grouped by their first digit: **2xx** success (200 OK, 201 Created, 204 No Content), **3xx** go elsewhere (301 Moved Permanently, 302 and 307 temporary, 304 Not Modified), **4xx** *your* mistake (400 Bad Request, 401 not logged in, 403 not allowed, 404 Not Found, 429 Too Many Requests) and **5xx** *the server's* mistake (500 Internal Server Error, 502 Bad Gateway, 503 Unavailable).

    GET asks for something and must not change anything (so it can be repeated and cached); POST sends data that changes things. Special characters in addresses are written as **percent escapes** (`%20` is a blank, `%26` is `&`, a letter like é becomes the UTF-8 bytes `%C3%A9`) and in a query string a `+` means a blank.

    Plain **HTTP** can be read by anybody on the path. **HTTPS** wraps the same text in encryption (**TLS**), which also proves the identity of the server with a **certificate**. HTTP/2 and HTTP/3 carry the same ideas in a more efficient binary form.
- heading: Cookies, caches and redirects
  body: |-
    HTTP has no memory: every request stands alone. A **cookie** adds one. The server sends `Set-Cookie: session=abc123; Secure; HttpOnly; SameSite=Lax`, and the browser sends `Cookie: session=abc123` with every later request to that site. The attributes matter: **Secure** (only over HTTPS), **HttpOnly** (scripts cannot read it, which limits the harm of a cross-site scripting bug), **SameSite** (not sent along with requests that come from other sites, a defence against forged requests), **Max-Age** or **Expires** (how long it lives), **Domain** and **Path** (where it is sent). A session cookie is as good as a password while it lives, so protect it like one.

    **Caching** saves time and money. `Cache-Control: max-age=3600` says "reuse this for an hour without asking". `no-cache` means "ask me before you reuse it" (the server may answer *304 Not Modified*, with no body, if the **ETag**, a fingerprint of the content, still matches), `no-store` means "never keep it" and `private` means "only the browser may keep it, not shared caches". Caches exist in the browser, in **proxies** and in a **CDN** (content delivery network, servers all over the world that keep copies close to the visitors). The famous joke says there are only two hard things in computing: cache invalidation and naming things; the usual cure is to give a file a new name (`app.3f9a.js`) whenever its content changes.

    **Redirects** (3xx with a `Location` header) tell the browser to go to another address: from `http` to `https`, from `www` to the bare name, or from an old page to a new one. Chains are slow and loops (A to B to A) never end, so browsers give up after a limit and show an error such as `ERR_TOO_MANY_REDIRECTS`.
examples:
- title: Reading a request and a response
  intro: Parse both directions of a conversation and audit the cookie that the server sets.
  code: |
    def parse_query(qs):
        """The part of a web address after the '?' is the **query string**, such as 'q=hello+world&tag=a&tag=b%26c'. Return a dict {name: [values]} in which every name has the list of all its values in order. Pairs are separated by '&' (empty pairs are ignored) and name and value by the FIRST '=' (a pair without '=' has the value ''). Decode names and values: a plus sign means a blank, and '%' followed by two hexadecimal digits is one byte (so %26 is '&', and several %XX in a row form UTF-8 text, for example %C3%A9 is the letter 'é'). A '%' that is not followed by two hexadecimal digits stays as it is. Bytes that are not valid UTF-8 are replaced by the character '\\ufffd' (use errors='replace')."""
        def decode(text):
            raw = bytearray()
            i, text = 0, text.replace("+", " ")
            while i < len(text):
                ch = text[i]
                if ch == "%" and len(text[i + 1:i + 3]) == 2 and all(c in "0123456789abcdefABCDEF" for c in text[i + 1:i + 3]):
                    raw.append(int(text[i + 1:i + 3], 16))
                    i += 3
                else:
                    raw.extend(ch.encode("utf-8"))
                    i += 1
            return raw.decode("utf-8", errors="replace")
        result = {}
        for pair in qs.split("&"):
            if not pair:
                continue
            name, _, value = pair.partition("=")
            result.setdefault(decode(name), []).append(decode(value))
        return result


    def parse_http(text):
        """Every web page is fetched with a text conversation. A REQUEST looks like 'GET /search?q=cats HTTP/1.1' then header lines 'Host: example.com', a blank line and an optional body. A RESPONSE starts with 'HTTP/1.1 404 Not Found' (the reason may be missing) then headers, a blank line and the body. Lines end with '\\n' or '\\r\\n' (treat both the same). Parse the text. The first line decides: if it starts with 'HTTP/' it is a response, else a request. Header lines are 'Name: value' (split at the FIRST colon, strip both sides); names are turned into lower case; a name that occurs twice gets its values joined with ', '. The headers end at the first blank line; everything after it (unchanged) is the 'body' ('' if there is none). Return for a request {'kind': 'request', 'method', 'path' (without the query), 'query' (parse_query of the text after the first '?', {} if none), 'version', 'headers', 'body'}; for a response {'kind': 'response', 'version', 'status' (int), 'reason' (the rest of the line, '' if none), 'headers', 'body'}. ValueError('bad request line') if a request line does not have exactly three parts separated by blanks or its version does not start with 'HTTP/'; ValueError('bad status line') if the status is not a whole number; ValueError('bad header line N') for a header line without a colon (N counts the lines of the whole text from 1)."""
        text = text.replace("\r\n", "\n")
        head, sep, body = text.partition("\n\n")
        lines = head.split("\n")
        first = lines[0].split()
        headers = {}
        for n, line in enumerate(lines[1:], 2):
            name, colon, value = line.partition(":")
            if not colon or not name.strip():
                raise ValueError("bad header line " + str(n))
            key = name.strip().lower()
            headers[key] = headers[key] + ", " + value.strip() if key in headers else value.strip()
        if lines[0].startswith("HTTP/"):
            parts = lines[0].split(None, 2)
            if len(parts) < 2 or not parts[1].isdigit():
                raise ValueError("bad status line")
            return {"kind": "response", "version": parts[0], "status": int(parts[1]), "reason": parts[2].strip() if len(parts) > 2 else "", "headers": headers, "body": body}
        if len(first) != 3 or not first[2].startswith("HTTP/"):
            raise ValueError("bad request line")
        path, _, qs = first[1].partition("?")
        return {"kind": "request", "method": first[0], "path": path, "query": parse_query(qs), "version": first[2], "headers": headers, "body": body}


    def audit_cookie(header):
        """A server sets a cookie with a header value such as 'session=abc123; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax': first name=value (split at the first '='), then attributes separated by ';' which are either flags (Secure) or Name=value pairs; attribute names are not case sensitive. Return {'name', 'value', 'problems'} where problems is the list of texts, in this order: 'missing Secure' (the cookie would also travel over unencrypted http), 'missing HttpOnly' (scripts on the page could read it), 'missing SameSite' (no protection against forged requests from other sites) and 'SameSite=None needs Secure' (SameSite is None but Secure is missing). ValueError('bad cookie') if the first part has no '=' or an empty name."""
        parts = [p.strip() for p in header.split(";")]
        name, eq, value = parts[0].partition("=")
        if not eq or not name.strip():
            raise ValueError("bad cookie")
        attrs = {}
        for p in parts[1:]:
            if not p:
                continue
            k, _, v = p.partition("=")
            attrs[k.strip().lower()] = v.strip()
        problems = []
        if "secure" not in attrs:
            problems.append("missing Secure")
        if "httponly" not in attrs:
            problems.append("missing HttpOnly")
        if "samesite" not in attrs:
            problems.append("missing SameSite")
        elif attrs["samesite"].lower() == "none" and "secure" not in attrs:
            problems.append("SameSite=None needs Secure")
        return {"name": name.strip(), "value": value.strip(), "problems": problems}

    raw = "GET /search?q=cats+%26+dogs&page=2 HTTP/1.1\r\nHost: example.com\r\nCookie: id=7\r\n\r\n"
    req = parse_http(raw)
    print(req["method"], req["path"], req["query"])
    print(req["headers"]["host"])
    resp = parse_http("HTTP/1.1 200 OK\nSet-Cookie: id=7; Path=/\nContent-Length: 5\n\nhello")
    print(resp["status"], resp["reason"], resp["body"])
    print(audit_cookie(resp["headers"]["set-cookie"]))
  output: |
    GET /search {'q': ['cats & dogs'], 'page': ['2']}
    example.com
    200 OK hello
    {'name': 'id', 'value': '7', 'problems': ['missing Secure', 'missing HttpOnly', 'missing SameSite']}
