- type: code
  question: Write `round_robin(servers, n)` returning a list of n names, giving the servers in order and starting again after the last one. An empty server list gives [].
  starter: |
    def round_robin(servers, n):
        pass
  tests:
  - name: rr
    code: |
      assert round_robin(["a", "b", "c"], 7) == ["a", "b", "c", "a", "b", "c", "a"] and round_robin([], 3) == [] and round_robin(["a"], 2) == ["a", "a"] and round_robin(["a", "b"], 0) == []
  solution: |
    def round_robin(servers, n):
        if not servers:
            return []
        return [servers[i % len(servers)] for i in range(n)]
