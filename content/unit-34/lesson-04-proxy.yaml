  tests:
  - name: a normal file
    code: |
      CONF = "upstream app {\n    server 10.0.0.1:8080 weight=3;\n    server 10.0.0.2:8080 backup;\n}\nserver {\n    location /api/ { proxy_pass http://app; }\n    location /files/ {\n        root /var/www;\n    }\n    location /old/ { return 410; }\n    location / { return 404; }\n}\n"

      r = parse_proxy(CONF)
      assert r == {"upstreams": {"app": [{"addr": "10.0.0.1:8080", "weight": 3, "backup": False}, {"addr": "10.0.0.2:8080", "weight": 1, "backup": True}]}, "routes": [("/api/", ("proxy", "app")), ("/files/", ("static", "/var/www")), ("/old/", ("return", 410)), ("/", ("return", 404))]}
      assert parse_proxy("") == {"upstreams": {}, "routes": []} and parse_proxy("# nothing\n\n") == {"upstreams": {}, "routes": []}
      r = parse_proxy("upstream a { server x:1; }  # one line\nupstream b {\n}\n")
      assert r == {"upstreams": {"a": [{"addr": "x:1", "weight": 1, "backup": False}], "b": []}, "routes": []}
  - name: errors
    code: |
      cases = (("upstream a {\n server x weight=0;\n}", "line 2: bad weight"), ("upstream a {\n server x weight=two;\n}", "line 2: bad weight"), ("}", "line 1: unexpected }"), ("upstream a {", "unclosed block"), ("server {\nlocation / {\n}\n}", "line 3: empty location"), ("server {\nlocation / { proxy_pass http://nope; }\n}", "unknown upstream nope"), ("foo bar;", "line 1: bad directive"), ("server {\n location / { root /a; root /b; }\n}", "line 2: bad directive"), ("upstream a {\n server x;\n}\nupstream b {\n location / { return 1; }\n}", "line 5: bad directive"), ("server {\n location / { return abc; }\n}", "line 2: bad directive"), ("upstream a {\n server x backup fast;\n}", "line 2: bad directive"))
      for text, msg in cases:
          try:
              parse_proxy(text)
              raise AssertionError("accepted " + repr(text))
          except ValueError as e:
              assert str(e) == msg, (text, str(e))
  hints:
