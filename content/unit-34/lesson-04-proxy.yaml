exercises:
- id: config
  title: Reading a proxy configuration
  difficulty: 5
  prompt: |-
    One public address can hide many servers. A **reverse proxy** receives every request and decides where it goes, and the rules are written in a configuration file. Write `parse_proxy(text)`. A **reverse proxy** such as nginx stands in front of the real servers, receives all requests and passes them on. Its configuration is a text with blocks in braces, for example:

    ```
    upstream app {
        server 10.0.0.1:8080 weight=3;
        server 10.0.0.2:8080 backup;
    }
    server {
        location /api/ { proxy_pass http://app; }
        location /files/ { root /var/www; }
        location /old/ { return 410; }
    }
    ```

    Parse it. Everything after a '#' on a line is a comment; blank lines are ignored; a line ends with ';' (a directive), or with '{' (it opens a block: 'upstream NAME {' at the top level, 'server {' at the top level, 'location PREFIX {' inside a server block), or is '}' (it closes the innermost block). Directives: inside an upstream 'server ADDRESS [weight=N] [backup];' (the weight is a whole number, default 1; backup is a flag); inside a location exactly one of 'proxy_pass http://NAME;', 'root DIRECTORY;' or 'return CODE;'. A block may also be written on ONE line, as in the example ('location /api/ { proxy_pass http://app; }'): treat the text between '{' and '}' as directives of that block. Return {'upstreams': {name: [{'addr', 'weight', 'backup'}, ...]}, 'routes': [(prefix, target)]} where the target is ('proxy', NAME), ('static', DIRECTORY) or ('return', CODE as an int) and the routes are in the order of the text. ValueError messages: 'line N: bad directive' for anything else (N counts all lines from 1), 'line N: bad weight' for a weight that is not a positive whole number, 'line N: unexpected }' for a closing brace without a block, 'line N: empty location' for a location without a directive (N is the line of its closing brace), 'unclosed block' if blocks are open at the end, and 'unknown upstream NAME' if a proxy_pass names an upstream that was not defined (checked at the end, first such route).
