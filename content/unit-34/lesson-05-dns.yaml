  - Store the time until which each name is valid in a dict.
  - A request at exactly the expiry time is already a miss.
  solution: |
    def simulate_cache(requests, ttls):
        """Every resolver keeps answers for the time that the record's TTL allows. `requests` is a list of (time, name) pairs in time order (times in seconds) and `ttls` a dict {name: ttl in seconds}. The cache starts empty. A request is a HIT if the name was stored and the time is BEFORE its expiry (the time of the request that stored it plus the ttl); otherwise it is a MISS, the resolver asks the real server and stores the name with the new expiry (a name that is missing from ttls has the ttl 0, so it is never a hit). Return {'hits': number, 'misses': number, 'asked': the list of the (time, name) pairs that were misses}."""
        expiry, hits, asked = {}, 0, []
        for t, name in requests:
            if name in expiry and t < expiry[name]:
                hits += 1
            else:
                asked.append((t, name))
                expiry[name] = t + ttls.get(name, 0)
        return {"hits": hits, "misses": len(asked), "asked": asked}
  explanation: Before moving a website to a new server, lower the TTL a day ahead (for example to 300 seconds), so that the old address disappears from caches quickly when you switch. Raise it again afterwards.
