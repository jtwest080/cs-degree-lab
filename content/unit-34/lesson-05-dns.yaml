  - name: hits and misses
    code: |
      r = simulate_cache([(0, "a"), (10, "a"), (60, "a"), (61, "b"), (100, "b")], {"a": 60, "b": 30})
      assert r == {"hits": 1, "misses": 4, "asked": [(0, "a"), (60, "a"), (61, "b"), (100, "b")]}
      assert simulate_cache([], {"a": 1}) == {"hits": 0, "misses": 0, "asked": []}
  - name: edges
    code: |
      assert simulate_cache([(0, "a"), (1, "a"), (2, "a")], {"a": 0}) == {"hits": 0, "misses": 3, "asked": [(0, "a"), (1, "a"), (2, "a")]}
      assert simulate_cache([(0, "x"), (5, "x")], {}) == {"hits": 0, "misses": 2, "asked": [(0, "x"), (5, "x")]}
      r = simulate_cache([(t, "n") for t in range(0, 100, 10)], {"n": 25})
      assert r["hits"] == 6 and r["misses"] == 4 and [t for t, _ in r["asked"]] == [0, 30, 60, 90]
      r = simulate_cache([(0, "a"), (0, "b"), (1, "a"), (1, "b")], {"a": 5, "b": 1})
      assert r["hits"] == 1 and r["asked"] == [(0, "a"), (0, "b"), (1, "b")]
