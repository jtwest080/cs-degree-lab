- id: ttl
  title: Time to live in action
  difficulty: 4
  prompt: 'The TTL is a trade-off between speed and flexibility. Write `simulate_cache(requests, ttls)`. Every resolver keeps answers for the time that the record''s TTL allows. `requests` is a list of (time, name) pairs in time order (times in seconds) and `ttls` a dict {name: ttl in seconds}. The cache starts empty. A request is a HIT if the name was stored and the time is BEFORE its expiry (the time of the request that stored it plus the ttl); otherwise it is a MISS, the resolver asks the real server and stores the name with the new expiry (a name that is missing from ttls has the ttl 0, so it is never a hit). Return {''hits'': number, ''misses'': number, ''asked'': the list of the (time, name) pairs that were misses}.'
