exercises:
- id: zone
  title: Reading a zone file
  difficulty: 5
  prompt: |-
    The internet's phone book is made of **zone files**, plain text that the owner of a domain edits. Write `parse_zone(text)`. The records of a domain are kept in a **zone file**, for example:

    ```
    $ORIGIN example.com.
    $TTL 3600
    @        IN MX 10 mail
    www  300 IN CNAME @
    mail     IN A 192.0.2.25
             IN TXT "v=spf1 -all"
    ```

    Parse it. A ';' starts a comment that runs to the end of the line; blank lines are ignored. '$ORIGIN name' sets the origin (its trailing dot is removed, it is turned to lower case; before any $ORIGIN the origin is empty) and '$TTL seconds' the default TTL (3600 until set). Any other line is a record: [name] [ttl] [IN] TYPE value..., where the name is missing if the line starts with a blank (it then repeats the previous record's name; the first record needs one), the ttl is a whole number and IN may stand before or after it, and TYPE is one of A, AAAA, CNAME, MX, NS or TXT (any case). Names are completed: '@' means the origin; a name that ends with a dot is complete (the dot is removed); any other name gets '.' + origin added (if the origin is empty it stays as it is); all names are turned to lower case. The value of CNAME and NS is a name completed in the same way; the value of MX is a priority (a whole number) and a name that is completed, joined by one blank, e.g. '10 mail.example.com'; the value of TXT has surrounding double quotes removed; for A and AAAA the value is the word as it is. Return the list of dicts {'name', 'ttl', 'type', 'value'}. ValueError('line N: bad record') (N counts all lines from 1) for a record with an unknown type, a missing or invalid value, a missing name, or a bad $ORIGIN or $TTL line.
  starter: |-
    def parse_zone(text):
        """The records of a domain are kept in a **zone file**, for example:

    $ORIGIN example.com.
    $TTL 3600
    @        IN MX 10 mail
    www  300 IN CNAME @
    mail     IN A 192.0.2.25
             IN TXT "v=spf1 -all"

    Parse it. A ';' starts a comment that runs to the end of the line; blank lines are ignored. '$ORIGIN name' sets the origin (its trailing dot is removed, it is turned to lower case; before any $ORIGIN the origin is empty) and '$TTL seconds' the default TTL (3600 until set). Any other line is a record: [name] [ttl] [IN] TYPE value..., where the name is missing if the line starts with a blank (it then repeats the previous record's name; the first record needs one), the ttl is a whole number and IN may stand before or after it, and TYPE is one of A, AAAA, CNAME, MX, NS or TXT (any case). Names are completed: '@' means the origin; a name that ends with a dot is complete (the dot is removed); any other name gets '.' + origin added (if the origin is empty it stays as it is); all names are turned to lower case. The value of CNAME and NS is a name completed in the same way; the value of MX is a priority (a whole number) and a name that is completed, joined by one blank, e.g. '10 mail.example.com'; the value of TXT has surrounding double quotes removed; for A and AAAA the value is the word as it is. Return the list of dicts {'name', 'ttl', 'type', 'value'}. ValueError('line N: bad record') (N counts all lines from 1) for a record with an unknown type, a missing or invalid value, a missing name, or a bad $ORIGIN or $TTL line."""
        pass
  tests:
  - name: records
    code: |
      ZONE = "$ORIGIN example.com.\n$TTL 3600\n@        IN MX 10 mail\n@        IN MX 20 backup.example.net.\nwww  300 IN CNAME @   ; the same site\nmail     IN A 192.0.2.25\n         IN TXT \"v=spf1 -all\"\n@   86400 A 192.0.2.1\nShop IN CNAME www\nblog IN CNAME nowhere\n"

      r = parse_zone(ZONE)
      assert r == [{"name": "example.com", "ttl": 3600, "type": "MX", "value": "10 mail.example.com"}, {"name": "example.com", "ttl": 3600, "type": "MX", "value": "20 backup.example.net"}, {"name": "www.example.com", "ttl": 300, "type": "CNAME", "value": "example.com"}, {"name": "mail.example.com", "ttl": 3600, "type": "A", "value": "192.0.2.25"}, {"name": "mail.example.com", "ttl": 3600, "type": "TXT", "value": "v=spf1 -all"}, {"name": "example.com", "ttl": 86400, "type": "A", "value": "192.0.2.1"}, {"name": "shop.example.com", "ttl": 3600, "type": "CNAME", "value": "www.example.com"}, {"name": "blog.example.com", "ttl": 3600, "type": "CNAME", "value": "nowhere.example.com"}]
      assert parse_zone("") == [] and parse_zone("; only a comment\n\n") == []
  - name: shapes and errors
    code: |
      z = parse_zone("a IN A 1.2.3.4\n 60 IN AAAA ::1\n")
      assert z == [{"name": "a", "ttl": 3600, "type": "A", "value": "1.2.3.4"}, {"name": "a", "ttl": 60, "type": "AAAA", "value": "::1"}]
      r = parse_zone("$TTL 60\n$ORIGIN Ex.org\nA.B. IN NS ns1\nx IN 120 a 9.9.9.9\n")
      assert r == [{"name": "a.b", "ttl": 60, "type": "NS", "value": "ns1.ex.org"}, {"name": "x.ex.org", "ttl": 120, "type": "A", "value": "9.9.9.9"}]
      for text in ("$TTL x", "@ IN FOO 1", "  IN A 1.2.3.4", "a IN A", "a IN MX x y", "$ORIGIN", "a IN CNAME b c", "a IN MX 10", "a IN A 1.1.1.1 2.2.2.2"):
          try:
              parse_zone(text)
              raise AssertionError("accepted " + text)
          except ValueError as e:
              assert str(e) == "line 1: bad record", (text, str(e))
      try:
          parse_zone("a A 1.1.1.1\n\n$TTL\n")
          raise AssertionError("accepted")
      except ValueError as e:
          assert str(e) == "line 3: bad record"
  hints:
  - Split each line into words and look at what the first word is.
  - 'Write a small helper that completes a name: ''@'', a name with a dot at the end, or a relative name.'
  solution: |
    def parse_zone(text):
        """The records of a domain are kept in a **zone file**, for example:

    $ORIGIN example.com.
    $TTL 3600
    @        IN MX 10 mail
    www  300 IN CNAME @
