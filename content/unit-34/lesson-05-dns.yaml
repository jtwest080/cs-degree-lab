    def validate_zone(records):
        """Typical mistakes in a zone can break a website or lose mail. Check a list of records (from parse_zone) and return the list of problem texts in this order: first, for every name (sorted) that has a CNAME record AND any record of another type, 'CNAME and other data at NAME' (an alias must stand alone); then, for every MX record in the order of the list, if its host is the name of a CNAME record, 'MX target HOST is a CNAME'; otherwise, if the host has no A and no AAAA record in the list, 'MX target HOST has no address' (the MX value is 'PRIORITY HOST')."""
        problems = []
        names = sorted({r["name"] for r in records})
        for n in names:
            types = {r["type"] for r in records if r["name"] == n}
            if "CNAME" in types and len(types - {"CNAME"}) > 0:
                problems.append("CNAME and other data at " + n)
        cnames = {r["name"] for r in records if r["type"] == "CNAME"}
        for r in records:
            if r["type"] != "MX":
                continue
            host = r["value"].split(" ", 1)[1]
            if host in cnames:
                problems.append("MX target " + host + " is a CNAME")
            elif not any(x["name"] == host and x["type"] in ("A", "AAAA") for x in records):
                problems.append("MX target " + host + " has no address")
        return problems
  explanation: A CNAME at the very top of a domain (the apex) is not allowed because the apex needs NS and SOA records. Many providers offer a special 'ALIAS' or 'ANAME' record as a workaround.
commonMistakes:
- title: Giving a CNAME other records
  explanation: The alias hides them.
- title: Pointing MX at a CNAME
  explanation: Mail servers need a direct address.
- title: Changing DNS and expecting an instant effect
  explanation: Caches keep old answers until the TTL ends.
- title: Forgetting the trailing dot in a zone file
  explanation: The origin is added a second time.
- title: Publishing no SPF, DKIM or DMARC
  explanation: Your mail goes to spam and can be forged.
summary:
- DNS is a distributed tree; resolvers walk it and cache every answer.
- 'Record types: A, AAAA, CNAME, MX, NS, TXT, PTR.'
- A CNAME is an alias and must stand alone.
- 'MX priorities: the lowest number is tried first.'
- The TTL trades speed against flexibility.
