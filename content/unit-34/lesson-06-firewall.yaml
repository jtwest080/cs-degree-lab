    def in_network(ip, cidr):
        """An IPv4 address is four numbers from 0 to 255 separated by dots; it is really one 32-bit number (the first number is the highest 8 bits). A network is written in **CIDR** notation 'address/length', for example '10.0.0.0/8' or '192.168.1.0/24': the first `length` bits are the network part, and every address that has the same network part belongs to the network ('/32' is one single address, '/0' is every address). A cidr without '/length' means '/32'. Return True if `ip` belongs to the network, else False; the host bits of the cidr address are ignored ('192.168.1.77/24' is the same network as '192.168.1.0/24'). ValueError('bad address') if the address of either argument is not four whole numbers 0-255 (check ip first), ValueError('bad length') if the length is not a whole number from 0 to 32."""
        def to_int(text):
            parts = text.split(".")
            if len(parts) != 4 or not all(p.isdigit() and int(p) <= 255 for p in parts):
                raise ValueError("bad address")
            n = 0
            for p in parts:
                n = n * 256 + int(p)
            return n
        value = to_int(ip)
        addr, slash, length = cidr.partition("/")
        base = to_int(addr)
        if slash:
            if not length.isdigit() or int(length) > 32:
                raise ValueError("bad length")
            bits = int(length)
        else:
            bits = 32
        shift = 32 - bits
        return (value >> shift) == (base >> shift)


    def parse_rules(text):
        """A **firewall** is an ordered list of rules. Here each rule is one line 'ACTION PROTO from SOURCE to DESTINATION [port PORTS]', for example 'ALLOW tcp from 10.0.0.0/8 to any port 22' or 'DENY any from any to any'. ACTION is ALLOW or DENY, PROTO is tcp, udp, icmp or any (all in any case, turned to lower case for proto and upper case for action), SOURCE and DESTINATION are 'any' or an address or CIDR as in in_network (keep the text), and PORTS is a whole number or a range 'first-last' (first <= last, numbers 0 to 65535); without 'port' the rule applies to every port. Blank lines and everything after a '#' are ignored. Return a list of dicts {'action', 'proto', 'src', 'dst', 'ports'} where ports is None or a tuple (first, last). ValueError('line N: bad rule') for anything else (N counts all lines from 1)."""
        rules = []
        for n, raw in enumerate(text.split("\n"), 1):
            line = raw.split("#", 1)[0].strip()
            if not line:
                continue
            w = line.split()
            bad = ValueError("line %d: bad rule" % n)
            if len(w) not in (6, 8) or w[2].lower() != "from" or w[4].lower() != "to":
                raise bad
            action, proto = w[0].upper(), w[1].lower()
            if action not in ("ALLOW", "DENY") or proto not in ("tcp", "udp", "icmp", "any"):
                raise bad
            ports = None
            if len(w) == 8:
                if w[6].lower() != "port":
                    raise bad
                a, dash, b = w[7].partition("-")
                if not a.isdigit() or (dash and not b.isdigit()):
                    raise bad
                first, last = int(a), int(b) if dash else int(a)
                if not (0 <= first <= last <= 65535):
                    raise bad
                ports = (first, last)
            rules.append({"action": action, "proto": proto, "src": w[3], "dst": w[5], "ports": ports})
        return rules




    def check_packet(rules, packet):
        """Decide what the firewall does with a packet, a dict {'proto', 'src', 'dst', 'port'} (the port is None for packets without ports such as icmp). The rules are tried IN ORDER and the FIRST rule that matches decides. A rule matches if its proto is 'any' or equals the packet's proto, its src is 'any' or contains the packet's source address (in_network), its dst is 'any' or contains the destination, and its ports are None or contain the packet's port (a packet without a port does not match a rule that has ports). Return a tuple (action, number) where the number is the position of the winning rule in the list counted from 1. If no rule matches, the firewall DENIES everything that is not explicitly allowed: return ('DENY', 0)."""
        for i, r in enumerate(rules, 1):
            if r["proto"] != "any" and r["proto"] != packet["proto"]:
                continue
            if r["src"] != "any" and not in_network(packet["src"], r["src"]):
                continue
            if r["dst"] != "any" and not in_network(packet["dst"], r["dst"]):
                continue
            if r["ports"] is not None:
                p = packet.get("port")
                if p is None or not r["ports"][0] <= p <= r["ports"][1]:
                    continue
            return (r["action"], i)
        return ("DENY", 0)
  explanation: 'Notice the third test of the first example: a broad ALLOW above a specific DENY makes the DENY useless. Rule order is the most common firewall mistake, so put the specific rules first.'
- id: nat
  title: One address for the whole house
  difficulty: 5
  prompt: 'IPv4 ran out of addresses, and **NAT** is the trick that kept the internet working: hundreds of devices behind one public address. Write `simulate_nat(public_ip, events, first_port)`. Your home has many devices but your provider gives ONE public address. **NAT** (network address translation) in the router lets them share it: for an outgoing connection it picks a public port and remembers which device and port it belongs to. Simulate the router. `events` is a list; every event is a tuple. (''out'', src_ip, src_port, remote) is a packet that leaves for the remote ''host:port''. If the pair (src_ip, src_port) already has a public port, use it; otherwise give it the next free public port (the first one is `first_port`, then one more each time). The result of the event is the text ''PUBLIC_IP:PORT''. (''in'', public_port, remote) is a packet that arrives from a remote at the public address. If the public port is in the table AND the remote is the same remote that the device contacted (the one of its LATEST ''out'' event), the result is ''SRC_IP:SRC_PORT'' of the device; otherwise ''dropped'' (unsolicited traffic is not let in). Return the list of results, one per event.'
  starter: |-
    def simulate_nat(public_ip, events, first_port):
        """Your home has many devices but your provider gives ONE public address. **NAT** (network address translation) in the router lets them share it: for an outgoing connection it picks a public port and remembers which device and port it belongs to. Simulate the router. `events` is a list; every event is a tuple. ('out', src_ip, src_port, remote) is a packet that leaves for the remote 'host:port'. If the pair (src_ip, src_port) already has a public port, use it; otherwise give it the next free public port (the first one is `first_port`, then one more each time). The result of the event is the text 'PUBLIC_IP:PORT'. ('in', public_port, remote) is a packet that arrives from a remote at the public address. If the public port is in the table AND the remote is the same remote that the device contacted (the one of its LATEST 'out' event), the result is 'SRC_IP:SRC_PORT' of the device; otherwise 'dropped' (unsolicited traffic is not let in). Return the list of results, one per event."""
        pass
  tests:
  - name: a router at work
    code: |
      ev = [("out", "192.168.0.5", 5000, "93.184.216.34:443"), ("out", "192.168.0.6", 5000, "93.184.216.34:443"), ("in", 40000, "93.184.216.34:443"), ("in", 40001, "93.184.216.34:443"), ("in", 40000, "6.6.6.6:443"), ("in", 50000, "9.9.9.9:1")]
      assert simulate_nat("203.0.113.9", ev, 40000) == ["203.0.113.9:40000", "203.0.113.9:40001", "192.168.0.5:5000", "192.168.0.6:5000", "dropped", "dropped"]
      assert simulate_nat("1.1.1.1", [], 1000) == []
  - name: reuse and the latest remote
    code: |
      ev = [("out", "10.0.0.5", 5000, "a:1"), ("out", "10.0.0.5", 5001, "a:1"), ("out", "10.0.0.5", 5000, "b:2"), ("in", 40000, "a:1"), ("in", 40000, "b:2"), ("out", "10.0.0.9", 5000, "a:1"), ("in", 40002, "a:1"), ("in", 40001, "a:1")]
      assert simulate_nat("2.2.2.2", ev, 40000) == ["2.2.2.2:40000", "2.2.2.2:40001", "2.2.2.2:40000", "dropped", "10.0.0.5:5000", "2.2.2.2:40002", "10.0.0.9:5000", "10.0.0.5:5001"]
      assert simulate_nat("3.3.3.3", [("in", 1, "x")], 1) == ["dropped"]
  hints:
  - 'Keep two dicts: (ip, port) to public port, and public port to (ip, port).'
  - Remember the latest remote of each public port in a third dict.
  solution: |
    def simulate_nat(public_ip, events, first_port):
        """Your home has many devices but your provider gives ONE public address. **NAT** (network address translation) in the router lets them share it: for an outgoing connection it picks a public port and remembers which device and port it belongs to. Simulate the router. `events` is a list; every event is a tuple. ('out', src_ip, src_port, remote) is a packet that leaves for the remote 'host:port'. If the pair (src_ip, src_port) already has a public port, use it; otherwise give it the next free public port (the first one is `first_port`, then one more each time). The result of the event is the text 'PUBLIC_IP:PORT'. ('in', public_port, remote) is a packet that arrives from a remote at the public address. If the public port is in the table AND the remote is the same remote that the device contacted (the one of its LATEST 'out' event), the result is 'SRC_IP:SRC_PORT' of the device; otherwise 'dropped' (unsolicited traffic is not let in). Return the list of results, one per event."""
        ports, owner, remote_of, nxt, results = {}, {}, {}, first_port, []
        for ev in events:
            if ev[0] == "out":
                _, ip, port, remote = ev
                if (ip, port) not in ports:
                    ports[(ip, port)] = nxt
                    owner[nxt] = (ip, port)
                    nxt += 1
                pub = ports[(ip, port)]
                remote_of[pub] = remote
                results.append("%s:%d" % (public_ip, pub))
            else:
                _, pub, remote = ev
                if pub in owner and remote_of.get(pub) == remote:
                    results.append("%s:%d" % owner[pub])
                else:
                    results.append("dropped")
        return results
  explanation: 'This is why you cannot simply run a server at home: nobody can start a connection inward unless you set up port forwarding. It is also a (weak) protection, because unsolicited packets find no entry in the table.'
- id: diagnose
  title: The detective's order of checks
  difficulty: 3
  prompt: 'Put the method of this unit into one function: test from the bottom up and report the first thing that broke. Write `diagnose_connection(facts)`. Put the detective method of the unit into one function. `facts` is a dict with some of these keys (a missing key means ''not tested yet''): ''link_up'' (bool: the cable or Wi-Fi works), ''has_ip'' (bool), ''gateway_ping'' (bool: the router answers), ''internet_ping'' (bool: an address on the internet answers), ''dns_ok'' (bool: names can be looked up), ''port'' (''open'', ''refused'' or ''timeout'': what happened when connecting to the service) and ''http_status'' (int). Go through the tests in this order and return the text for the FIRST one that has failed (a test that is missing is skipped): link_up False: ''no link''; has_ip False: ''no IP address''; gateway_ping False: ''cannot reach the router''; internet_ping False: ''no internet access''; dns_ok False: ''DNS failure''; port ''refused'': ''nothing listens on the port''; port ''timeout'': ''blocked by a firewall or lost on the way''; http_status of 500 or more: ''server error''; http_status of 400 to 499: ''request refused or not found''. If nothing failed return ''all tests passed''.'
  starter: |-
    def diagnose_connection(facts):
        """Put the detective method of the unit into one function. `facts` is a dict with some of these keys (a missing key means 'not tested yet'): 'link_up' (bool: the cable or Wi-Fi works), 'has_ip' (bool), 'gateway_ping' (bool: the router answers), 'internet_ping' (bool: an address on the internet answers), 'dns_ok' (bool: names can be looked up), 'port' ('open', 'refused' or 'timeout': what happened when connecting to the service) and 'http_status' (int). Go through the tests in this order and return the text for the FIRST one that has failed (a test that is missing is skipped): link_up False: 'no link'; has_ip False: 'no IP address'; gateway_ping False: 'cannot reach the router'; internet_ping False: 'no internet access'; dns_ok False: 'DNS failure'; port 'refused': 'nothing listens on the port'; port 'timeout': 'blocked by a firewall or lost on the way'; http_status of 500 or more: 'server error'; http_status of 400 to 499: 'request refused or not found'. If nothing failed return 'all tests passed'."""
        pass
  tests:
  - name: first failure
    code: |
      assert diagnose_connection({}) == "all tests passed"
      ok = {"link_up": True, "has_ip": True, "gateway_ping": True, "internet_ping": True, "dns_ok": True, "port": "open", "http_status": 200}
      assert diagnose_connection(ok) == "all tests passed"
      assert diagnose_connection({"has_ip": False, "dns_ok": False}) == "no IP address"
      assert diagnose_connection({"link_up": False, "has_ip": False}) == "no link"
      assert diagnose_connection({"dns_ok": False, "port": "refused"}) == "DNS failure"
      assert diagnose_connection(dict(ok, gateway_ping=False)) == "cannot reach the router" and diagnose_connection(dict(ok, internet_ping=False)) == "no internet access"
  - name: service and web layer
    code: |
      assert diagnose_connection({"port": "refused", "http_status": 500}) == "nothing listens on the port"
      assert diagnose_connection({"port": "timeout", "http_status": 503}) == "blocked by a firewall or lost on the way"
      assert diagnose_connection({"port": "open", "http_status": 503}) == "server error" and diagnose_connection({"http_status": 404}) == "request refused or not found"
      assert diagnose_connection({"http_status": 399}) == "all tests passed" and diagnose_connection({"http_status": 500}) == "server error"
      assert diagnose_connection({"link_up": True, "internet_ping": False, "dns_ok": None}) == "no internet access" and diagnose_connection({"dns_ok": None, "port": None}) == "all tests passed"
  hints:
  - List the tests in order as (key, 'what counts as failed', text) and walk through them.
  - Skip a key that is missing or None.
  solution: |
    def diagnose_connection(facts):
        """Put the detective method of the unit into one function. `facts` is a dict with some of these keys (a missing key means 'not tested yet'): 'link_up' (bool: the cable or Wi-Fi works), 'has_ip' (bool), 'gateway_ping' (bool: the router answers), 'internet_ping' (bool: an address on the internet answers), 'dns_ok' (bool: names can be looked up), 'port' ('open', 'refused' or 'timeout': what happened when connecting to the service) and 'http_status' (int). Go through the tests in this order and return the text for the FIRST one that has failed (a test that is missing is skipped): link_up False: 'no link'; has_ip False: 'no IP address'; gateway_ping False: 'cannot reach the router'; internet_ping False: 'no internet access'; dns_ok False: 'DNS failure'; port 'refused': 'nothing listens on the port'; port 'timeout': 'blocked by a firewall or lost on the way'; http_status of 500 or more: 'server error'; http_status of 400 to 499: 'request refused or not found'. If nothing failed return 'all tests passed'."""
        checks = [("link_up", lambda v: v is False, "no link"), ("has_ip", lambda v: v is False, "no IP address"),
                  ("gateway_ping", lambda v: v is False, "cannot reach the router"), ("internet_ping", lambda v: v is False, "no internet access"),
                  ("dns_ok", lambda v: v is False, "DNS failure"), ("port", lambda v: v == "refused", "nothing listens on the port"),
                  ("port", lambda v: v == "timeout", "blocked by a firewall or lost on the way"),
                  ("http_status", lambda v: v >= 500, "server error"), ("http_status", lambda v: 400 <= v < 500, "request refused or not found")]
        for key, failed, text in checks:
            if key in facts and facts[key] is not None and failed(facts[key]):
                return text
        return "all tests passed"
  explanation: 'The order is the whole idea: a DNS failure is only interesting if the internet itself works, and a 404 is only interesting if the connection works. Every real runbook follows this shape.'
commonMistakes:
- title: A broad ALLOW above a specific DENY
  explanation: The first matching rule wins.
- title: Opening a port 'just to test' and forgetting it
  explanation: Open ports are attacked within minutes.
- title: Forgetting that the host bits of a CIDR are ignored
  explanation: 192.168.1.77/24 is the network 192.168.1.0/24.
- title: Expecting to reach a device behind NAT
  explanation: The table has no entry for unsolicited packets.
- title: Fixing several things at once
  explanation: You cannot tell which change helped.
summary:
- CIDR /n fixes the first n bits; a /24 holds 256 addresses.
- 'Firewalls: default deny, first match wins.'
- NAT shares one public address and drops unsolicited packets.
- A scan is one source touching many ports quickly.
- Troubleshoot from the bottom up and fix the first failure.
