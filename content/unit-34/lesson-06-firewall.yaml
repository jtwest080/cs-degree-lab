- id: packet
  title: Allowed or denied?
  difficulty: 4
  prompt: 'The rules of the last exercise are only useful if something applies them to every packet. Write `check_packet(rules, packet)`. Decide what the firewall does with a packet, a dict {''proto'', ''src'', ''dst'', ''port''} (the port is None for packets without ports such as icmp). The rules are tried IN ORDER and the FIRST rule that matches decides. A rule matches if its proto is ''any'' or equals the packet''s proto, its src is ''any'' or contains the packet''s source address (in_network), its dst is ''any'' or contains the destination, and its ports are None or contain the packet''s port (a packet without a port does not match a rule that has ports). Return a tuple (action, number) where the number is the position of the winning rule in the list counted from 1. If no rule matches, the firewall DENIES everything that is not explicitly allowed: return (''DENY'', 0).'
  starter: |-
    def in_network(ip, cidr):
        """An IPv4 address is four numbers from 0 to 255 separated by dots; it is really one 32-bit number (the first number is the highest 8 bits). A network is written in **CIDR** notation 'address/length', for example '10.0.0.0/8' or '192.168.1.0/24': the first `length` bits are the network part, and every address that has the same network part belongs to the network ('/32' is one single address, '/0' is every address). A cidr without '/length' means '/32'. Return True if `ip` belongs to the network, else False; the host bits of the cidr address are ignored ('192.168.1.77/24' is the same network as '192.168.1.0/24'). ValueError('bad address') if the address of either argument is not four whole numbers 0-255 (check ip first), ValueError('bad length') if the length is not a whole number from 0 to 32."""
        def to_int(text):
            parts = text.split(".")
            if len(parts) != 4 or not all(p.isdigit() and int(p) <= 255 for p in parts):
                raise ValueError("bad address")
            n = 0
            for p in parts:
                n = n * 256 + int(p)
            return n
        value = to_int(ip)
        addr, slash, length = cidr.partition("/")
        base = to_int(addr)
        if slash:
            if not length.isdigit() or int(length) > 32:
                raise ValueError("bad length")
            bits = int(length)
        else:
            bits = 32
        shift = 32 - bits
        return (value >> shift) == (base >> shift)


    def parse_rules(text):
        """A **firewall** is an ordered list of rules. Here each rule is one line 'ACTION PROTO from SOURCE to DESTINATION [port PORTS]', for example 'ALLOW tcp from 10.0.0.0/8 to any port 22' or 'DENY any from any to any'. ACTION is ALLOW or DENY, PROTO is tcp, udp, icmp or any (all in any case, turned to lower case for proto and upper case for action), SOURCE and DESTINATION are 'any' or an address or CIDR as in in_network (keep the text), and PORTS is a whole number or a range 'first-last' (first <= last, numbers 0 to 65535); without 'port' the rule applies to every port. Blank lines and everything after a '#' are ignored. Return a list of dicts {'action', 'proto', 'src', 'dst', 'ports'} where ports is None or a tuple (first, last). ValueError('line N: bad rule') for anything else (N counts all lines from 1)."""
        rules = []
        for n, raw in enumerate(text.split("\n"), 1):
            line = raw.split("#", 1)[0].strip()
            if not line:
                continue
            w = line.split()
            bad = ValueError("line %d: bad rule" % n)
            if len(w) not in (6, 8) or w[2].lower() != "from" or w[4].lower() != "to":
                raise bad
            action, proto = w[0].upper(), w[1].lower()
            if action not in ("ALLOW", "DENY") or proto not in ("tcp", "udp", "icmp", "any"):
                raise bad
            ports = None
            if len(w) == 8:
                if w[6].lower() != "port":
                    raise bad
                a, dash, b = w[7].partition("-")
