      r = parse_rules(RULES)
      pk = lambda p, s, d, po=None: {"proto": p, "src": s, "dst": d, "port": po}
      assert check_packet(r, pk("tcp", "10.1.1.1", "192.0.2.10", 22)) == ("ALLOW", 1)
      assert check_packet(r, pk("tcp", "8.8.8.8", "192.0.2.10", 443)) == ("ALLOW", 2)
      assert check_packet(r, pk("tcp", "203.0.113.5", "192.0.2.10", 80)) == ("ALLOW", 2)
      assert check_packet(r, pk("udp", "203.0.113.5", "192.0.2.10", 53)) == ("DENY", 3)
      assert check_packet(r, pk("icmp", "8.8.8.8", "192.0.2.10")) == ("ALLOW", 4)
      assert check_packet(r, pk("tcp", "8.8.8.8", "192.0.2.10", 22)) == ("DENY", 5)
  - name: default deny
    code: |
      pk = lambda p, s, d, po=None: {"proto": p, "src": s, "dst": d, "port": po}
      assert check_packet([], pk("tcp", "1.1.1.1", "2.2.2.2", 1)) == ("DENY", 0)
      r = parse_rules("ALLOW tcp from 10.0.0.0/8 to any port 20-30\nALLOW udp from any to 9.9.9.9")
      assert check_packet(r, pk("tcp", "10.0.0.1", "1.1.1.1")) == ("DENY", 0) and check_packet(r, pk("tcp", "10.0.0.1", "1.1.1.1", 31)) == ("DENY", 0)
      assert check_packet(r, pk("tcp", "10.0.0.1", "1.1.1.1", 20)) == ("ALLOW", 1) and check_packet(r, pk("tcp", "10.0.0.1", "1.1.1.1", 30)) == ("ALLOW", 1)
      assert check_packet(r, pk("udp", "5.5.5.5", "9.9.9.9", 53)) == ("ALLOW", 2) and check_packet(r, pk("udp", "5.5.5.5", "9.9.9.8", 53)) == ("DENY", 0)
