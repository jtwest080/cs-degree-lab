exercises:
- id: cidr
  title: Does this address belong to the network?
  difficulty: 4
  prompt: 'Firewalls, routers and cloud settings all talk about networks as `10.0.0.0/8` or `192.168.1.0/24`. Write `in_network(ip, cidr)`. An IPv4 address is four numbers from 0 to 255 separated by dots; it is really one 32-bit number (the first number is the highest 8 bits). A network is written in **CIDR** notation ''address/length'', for example ''10.0.0.0/8'' or ''192.168.1.0/24'': the first `length` bits are the network part, and every address that has the same network part belongs to the network (''/32'' is one single address, ''/0'' is every address). A cidr without ''/length'' means ''/32''. Return True if `ip` belongs to the network, else False; the host bits of the cidr address are ignored (''192.168.1.77/24'' is the same network as ''192.168.1.0/24''). ValueError(''bad address'') if the address of either argument is not four whole numbers 0-255 (check ip first), ValueError(''bad length'') if the length is not a whole number from 0 to 32.'
  starter: |-
    def in_network(ip, cidr):
        """An IPv4 address is four numbers from 0 to 255 separated by dots; it is really one 32-bit number (the first number is the highest 8 bits). A network is written in **CIDR** notation 'address/length', for example '10.0.0.0/8' or '192.168.1.0/24': the first `length` bits are the network part, and every address that has the same network part belongs to the network ('/32' is one single address, '/0' is every address). A cidr without '/length' means '/32'. Return True if `ip` belongs to the network, else False; the host bits of the cidr address are ignored ('192.168.1.77/24' is the same network as '192.168.1.0/24'). ValueError('bad address') if the address of either argument is not four whole numbers 0-255 (check ip first), ValueError('bad length') if the length is not a whole number from 0 to 32."""
        pass
  tests:
  - name: membership
    code: |
      assert in_network("10.1.2.3", "10.0.0.0/8") and not in_network("11.1.2.3", "10.0.0.0/8")
      assert in_network("192.168.1.77", "192.168.1.0/24") and not in_network("192.168.2.1", "192.168.1.0/24")
      assert in_network("1.2.3.4", "0.0.0.0/0") and in_network("1.2.3.4", "1.2.3.4") and not in_network("1.2.3.5", "1.2.3.4/32")
      assert in_network("192.168.1.77", "192.168.1.64/26") and not in_network("192.168.1.130", "192.168.1.64/26") and in_network("192.168.1.100", "192.168.1.77/24")
  - name: errors
    code: |
      for args, msg in ((("1.2.3", "1.2.3.4/8"), "bad address"), (("1.2.3.4", "1.2.3/8"), "bad address"), (("1.2.3.4", "1.2.3.4/33"), "bad length"), (("1.2.3.4", "1.2.3.4/x"), "bad length"), (("256.1.1.1", "1.1.1.1"), "bad address"), (("1.1.1.1", "1.1.1.1/"), "bad length"), (("1.2.3.-4", "1.1.1.1"), "bad address"), (("a.b.c.d", "bad/99"), "bad address")):
          try:
              in_network(*args)
              raise AssertionError("accepted " + str(args))
          except ValueError as e:
              assert str(e) == msg, (args, str(e))
  hints:
  - 'Turn each address into one number: n = n * 256 + part.'
  - Shift both numbers right by 32 - length bits and compare them.
  solution: |
    def in_network(ip, cidr):
        """An IPv4 address is four numbers from 0 to 255 separated by dots; it is really one 32-bit number (the first number is the highest 8 bits). A network is written in **CIDR** notation 'address/length', for example '10.0.0.0/8' or '192.168.1.0/24': the first `length` bits are the network part, and every address that has the same network part belongs to the network ('/32' is one single address, '/0' is every address). A cidr without '/length' means '/32'. Return True if `ip` belongs to the network, else False; the host bits of the cidr address are ignored ('192.168.1.77/24' is the same network as '192.168.1.0/24'). ValueError('bad address') if the address of either argument is not four whole numbers 0-255 (check ip first), ValueError('bad length') if the length is not a whole number from 0 to 32."""
        def to_int(text):
            parts = text.split(".")
            if len(parts) != 4 or not all(p.isdigit() and int(p) <= 255 for p in parts):
                raise ValueError("bad address")
            n = 0
            for p in parts:
                n = n * 256 + int(p)
            return n
        value = to_int(ip)
        addr, slash, length = cidr.partition("/")
        base = to_int(addr)
        if slash:
            if not length.isdigit() or int(length) > 32:
                raise ValueError("bad length")
            bits = int(length)
        else:
            bits = 32
        shift = 32 - bits
        return (value >> shift) == (base >> shift)
  explanation: A /24 holds 256 addresses (254 usable for devices), a /16 holds 65,536 and a /8 holds more than 16 million. Splitting a network into smaller ones is called subnetting.
- id: rules
  title: Reading firewall rules
  difficulty: 4
  prompt: 'A firewall is a short list of rules that someone wrote in a hurry, so reading it correctly is a daily skill. Write `parse_rules(text)`. A **firewall** is an ordered list of rules. Here each rule is one line ''ACTION PROTO from SOURCE to DESTINATION [port PORTS]'', for example ''ALLOW tcp from 10.0.0.0/8 to any port 22'' or ''DENY any from any to any''. ACTION is ALLOW or DENY, PROTO is tcp, udp, icmp or any (all in any case, turned to lower case for proto and upper case for action), SOURCE and DESTINATION are ''any'' or an address or CIDR as in in_network (keep the text), and PORTS is a whole number or a range ''first-last'' (first <= last, numbers 0 to 65535); without ''port'' the rule applies to every port. Blank lines and everything after a ''#'' are ignored. Return a list of dicts {''action'', ''proto'', ''src'', ''dst'', ''ports''} where ports is None or a tuple (first, last). ValueError(''line N: bad rule'') for anything else (N counts all lines from 1).'
  starter: |-
    def parse_rules(text):
        """A **firewall** is an ordered list of rules. Here each rule is one line 'ACTION PROTO from SOURCE to DESTINATION [port PORTS]', for example 'ALLOW tcp from 10.0.0.0/8 to any port 22' or 'DENY any from any to any'. ACTION is ALLOW or DENY, PROTO is tcp, udp, icmp or any (all in any case, turned to lower case for proto and upper case for action), SOURCE and DESTINATION are 'any' or an address or CIDR as in in_network (keep the text), and PORTS is a whole number or a range 'first-last' (first <= last, numbers 0 to 65535); without 'port' the rule applies to every port. Blank lines and everything after a '#' are ignored. Return a list of dicts {'action', 'proto', 'src', 'dst', 'ports'} where ports is None or a tuple (first, last). ValueError('line N: bad rule') for anything else (N counts all lines from 1)."""
        pass
  tests:
  - name: rules
    code: |
      RULES = "# office firewall\nALLOW tcp from 10.0.0.0/8 to any port 22\nallow tcp from any to 192.0.2.10 port 80-443   # web\nDENY any from 203.0.113.0/24 to any\nALLOW icmp from any to any\nDENY any from any to any\n"

      r = parse_rules(RULES)
      assert r == [{"action": "ALLOW", "proto": "tcp", "src": "10.0.0.0/8", "dst": "any", "ports": (22, 22)}, {"action": "ALLOW", "proto": "tcp", "src": "any", "dst": "192.0.2.10", "ports": (80, 443)}, {"action": "DENY", "proto": "any", "src": "203.0.113.0/24", "dst": "any", "ports": None}, {"action": "ALLOW", "proto": "icmp", "src": "any", "dst": "any", "ports": None}, {"action": "DENY", "proto": "any", "src": "any", "dst": "any", "ports": None}]
      assert parse_rules("") == [] and parse_rules("# nothing\n\n   \n") == []
  - name: errors
    code: |
      for text in ("ALLOW tcp from a to b port", "FOO tcp from a to b", "ALLOW tcp from any to any port 70000", "ALLOW tcp from any to any port 9-3", "ALLOW tcp from any to any prt 22", "ALLOW sctp from any to any", "ALLOW tcp to any from any", "ALLOW tcp from any to any port x", "ALLOW tcp from any to any port 1-", "ALLOW tcp from any"):
          try:
              parse_rules(text)
              raise AssertionError("accepted " + text)
          except ValueError as e:
              assert str(e) == "line 1: bad rule", (text, str(e))
      try:
          parse_rules("DENY any from any to any\n\nDENY\n")
          raise AssertionError("accepted")
      except ValueError as e:
          assert str(e) == "line 3: bad rule"
      assert parse_rules("Deny UDP From any To 1.2.3.4 Port 0-65535")[0] == {"action": "DENY", "proto": "udp", "src": "any", "dst": "1.2.3.4", "ports": (0, 65535)}
  hints:
  - Cut off the comment with split('#', 1)[0], then split() into words.
  - A rule has 6 words, or 8 with a port part.
  solution: |
    def parse_rules(text):
        """A **firewall** is an ordered list of rules. Here each rule is one line 'ACTION PROTO from SOURCE to DESTINATION [port PORTS]', for example 'ALLOW tcp from 10.0.0.0/8 to any port 22' or 'DENY any from any to any'. ACTION is ALLOW or DENY, PROTO is tcp, udp, icmp or any (all in any case, turned to lower case for proto and upper case for action), SOURCE and DESTINATION are 'any' or an address or CIDR as in in_network (keep the text), and PORTS is a whole number or a range 'first-last' (first <= last, numbers 0 to 65535); without 'port' the rule applies to every port. Blank lines and everything after a '#' are ignored. Return a list of dicts {'action', 'proto', 'src', 'dst', 'ports'} where ports is None or a tuple (first, last). ValueError('line N: bad rule') for anything else (N counts all lines from 1)."""
        rules = []
        for n, raw in enumerate(text.split("\n"), 1):
            line = raw.split("#", 1)[0].strip()
            if not line:
                continue
            w = line.split()
            bad = ValueError("line %d: bad rule" % n)
            if len(w) not in (6, 8) or w[2].lower() != "from" or w[4].lower() != "to":
                raise bad
            action, proto = w[0].upper(), w[1].lower()
            if action not in ("ALLOW", "DENY") or proto not in ("tcp", "udp", "icmp", "any"):
                raise bad
            ports = None
            if len(w) == 8:
                if w[6].lower() != "port":
                    raise bad
                a, dash, b = w[7].partition("-")
                if not a.isdigit() or (dash and not b.isdigit()):
                    raise bad
                first, last = int(a), int(b) if dash else int(a)
                if not (0 <= first <= last <= 65535):
                    raise bad
                ports = (first, last)
            rules.append({"action": action, "proto": proto, "src": w[3], "dst": w[5], "ports": ports})
        return rules
