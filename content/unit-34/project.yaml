    assert check_link(PING, TR, 5, 80) == ["packet loss 25.0%", "path: latency jumps at hop 3 (+110.8 ms)", "path: no reply from hop 4 onward"]
    assert check_link(PING, TR, 30, 500) == ["path: no reply from hop 4 onward"]
    assert check_link(GOOD_PING, GOOD_TR, 5, 80) == [] and check_link(DEAD_PING, GOOD_TR, 5, 80) == ["no reply to ping"]
    assert check_link(GOOD_PING, "", 5, 80) == ["path: no hops"]
