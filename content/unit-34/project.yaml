        return {"proto": p, "src": s, "dst": d, "port": po}
    EXP = [(pk("tcp", "203.0.113.5", "1.1.1.1", 80), "DENY"), (pk("tcp", "1.1.1.1", "2.2.2.2", 22), "ALLOW"), (pk("tcp", "1.1.1.1", "2.2.2.2", 80), "ALLOW")]
